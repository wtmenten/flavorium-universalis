l_english:

 # ============================================================
 # Late Renaissance Ideas (Age of Discovery)
 # ============================================================
 late_renaissance_ideas: "Late Renaissance Ideas"
 late_renaissance_ideas_desc: "The flowering of humanist thought and classical revival that defined the Renaissance has not ended with a new age — our scholars and administrators continue to deepen its fruits in literacy, reason, and civic order."

 renaissance_natural_philosophy: "Natural Philosophy"
 renaissance_natural_philosophy_desc: "Renaissance thinkers turned their gaze from scripture toward nature itself, cataloguing plants, studying the human body, and laying the ground for the empirical sciences. Such learning improves the health and longevity of our people."

 renaissance_church_patronage: "Church Patronage of Learning"
 renaissance_church_patronage_desc: "The Church has long been a patron of art and scholarship. By directing ecclesiastical wealth toward universities and scriptoria, we accelerate the spread of ideas through our population."

 scholastic_reform_advance: "Scholastic Reform"
 scholastic_reform_advance_desc: "Catholic theologians have fused Aristotelian logic with Christian doctrine, creating a rigorous intellectual culture in our monasteries and cathedral schools. This tradition of ordered disputation raises the literacy of our realm."

 islamic_observatory_tradition: "Islamic Observatory Tradition"
 islamic_observatory_tradition_desc: "The great observatories of Samarkand, Cairo, and Istanbul represent a centuries-long Islamic tradition of precise astronomical and medical knowledge. Our scholars maintain this tradition, advancing understanding of the world's workings."

 ottoman_polymath_networks: "Polymath Networks"
 ottoman_polymath_networks_desc: "The great cities of the Islamic world are home to polymaths who move freely between mathematics, medicine, philosophy, and engineering. These networks of learned men carry knowledge across our realm and beyond our borders."

 renaissance_civic_humanism: "Civic Humanism"
 renaissance_civic_humanism_desc: "Humanist thinkers argue that civic virtue — active participation in governance, rhetoric, and public duty — is the highest expression of human excellence. Our administrators embrace this ideal, serving the state with renewed purpose."

 renaissance_court_culture: "Renaissance Court Culture"
 renaissance_court_culture_desc: "The princely courts of Italy have become models of refined learning and artistic patronage. Our own court adopts these ideals: rulers who support poets, architects, and philosophers project authority through cultural magnificence."

 civic_republic_ideals: "Civic Republican Ideals"
 civic_republic_ideals_desc: "Renaissance republicanism drew on ancient Rome to argue that free citizens deliberating together produce wiser law than any monarch alone. Our republic's institutions are sharpened by this heritage of civic discourse."

 east_asian_classical_revival: "Classical Revival"
 east_asian_classical_revival_desc: "Neo-Confucian scholars have renewed attention to the classical texts of antiquity, re-examining the Four Books and Five Classics with fresh commentary. This revival deepens the quality of our examination-trained administrators."

 chinese_examination_refinement: "Examination System Refinement"
 chinese_examination_refinement_desc: "Generations of scholarly refinement have made the examination system an extraordinarily precise instrument for selecting capable administrators. Our meritocratic bureaucracy operates with unmatched efficiency."

 italian_masters_advance: "Italian Masters"
 italian_masters_advance_desc: "The workshops of Florence, Venice, and Milan have produced an unbroken line of masters in painting, sculpture, and architecture. Our cultural institutions inherit this tradition of excellence, attracting the finest artistic talents."

 # ============================================================
 # Late Discovery Ideas (Age of Reformation)
 # ============================================================
 late_discovery_ideas: "Late Discovery Ideas"
 late_discovery_ideas_desc: "A generation of explorers has mapped the contours of a world far larger than our ancestors imagined. Their knowledge — of coastlines, currents, and commodities — now becomes the foundation of lasting trade and colonial ambition."

 systematic_cartography: "Systematic Cartography"
 systematic_cartography_desc: "Where early explorers navigated by rumor and estimation, a new generation of cartographers brings mathematical precision to the art of the map. Accurate charts extend the effective range of our merchants and ambassadors."

 discovery_colonial_consolidation: "Colonial Consolidation"
 discovery_colonial_consolidation_desc: "The era of reckless discovery is giving way to careful consolidation. Settlement, administration, and regular communication transform distant footholds into reliable possessions, improving the loyalty of our subject realms."

 maritime_republic_trade: "Maritime Republic Trade Networks"
 maritime_republic_trade_desc: "The mercantile republics have long understood that profit lies not in territory but in the control of exchange. Their legacy of trade law, merchant guilds, and factor networks gives our republic decisive advantages in global commerce."

 east_asian_maritime_tribute: "Maritime Tribute Networks"
 east_asian_maritime_tribute_desc: "Our great fleets have long projected power through tribute relationships with maritime peoples across the seas. Systematizing these connections extends our naval reach and reinforces the loyalty of distant dependents."

 missionary_expansion_advance: "Missionary Expansion"
 missionary_expansion_advance_desc: "Faith follows the flag. Our missionaries travel alongside merchants and soldiers, converting populations and establishing churches in distant lands. Their work extends the spiritual — and administrative — reach of our realm."

 colonial_ecclesiastical_order: "Colonial Ecclesiastical Orders"
 colonial_ecclesiastical_order_desc: "The great religious orders — Dominicans, Franciscans, Jesuits — have established missions across our colonial territories, building schools and churches that anchor European civilization in the new world."

 iberian_colonial_doctrine: "Iberian Colonial Doctrine"
 iberian_colonial_doctrine_desc: "Spain and Portugal have developed a sophisticated theory of colonial administration: encomienda grants, viceroyalties, and a transatlantic commercial system that channels the wealth of new worlds to Iberian coffers."

 iberian_heavy_fleet: "Atlantic Fleet Doctrine"
 iberian_heavy_fleet_desc: "The carrack and galleon — heavily armed, deep-hulled ships capable of crossing oceans — represent an Iberian mastery of oceanic warfare. Our fleet doctrine emphasizes the man-of-war's capacity to project power across any sea."

 overland_trade_routes: "Overland Trade Routes"
 overland_trade_routes_desc: "While European powers struggle to find sea routes around our lands, we command the ancient arteries of overland trade: the Silk Road, the incense routes, the great caravans that have connected East and West for millennia."

 silk_road_revival: "Silk Road Revival"
 silk_road_revival_desc: "By securing the caravan routes, investing in caravanserais, and negotiating safe passage agreements, we restore the Silk Road to something of its former glory — channeling the wealth of Asia through our markets."

 # ============================================================
 # Late Reformation Ideas (Age of Absolutism)
 # ============================================================
 late_reformation_ideas: "Late Reformation Ideas"
 late_reformation_ideas_desc: "A century of religious upheaval has exhausted many, but its legacy is real: confessions are clearer, institutions more self-aware, and hard-won settlements give the realm a cautious stability that prior generations could not imagine."

 confessional_state_building: "Confessional State Building"
 confessional_state_building_desc: "The lesson drawn from the Wars of Religion is that a stable realm requires a unified confession — or at least a carefully managed one. Confessional state institutions formalize the relationship between church and government."

 protestant_church_state: "Protestant Church-State"
 protestant_church_state_desc: "Protestant reformers insisted that the Word of God, accessible to all who can read, must be the foundation of a Christian realm. Their emphasis on literacy and vernacular Scripture has made Protestant lands consistently better educated."

 lutheran_education_advance: "Lutheran Educational Legacy"
 lutheran_education_advance_desc: "Luther's insistence on every Christian reading Scripture for themselves drove the establishment of parish schools across Protestant Europe. This grassroots investment in literacy has become a permanent structural advantage."

 catholic_confession_legacy: "Catholic Confessional Legacy"
 catholic_confession_legacy_desc: "The Council of Trent revitalized Catholic institutions, clarifying doctrine, reforming the clergy, and establishing new religious orders dedicated to education and pastoral care. This renewed Church is a powerful engine of social cohesion."

 jesuitical_reform_advance: "Jesuit Reform Networks"
 jesuitical_reform_advance_desc: "The Society of Jesus operates schools, universities, and missions across three continents, transmitting the methods of rigorous Tridentine Catholicism wherever European colonialism has reached. Their network extends our institutional reach."

 sunni_confessional_state: "Confessional Consolidation"
 sunni_confessional_state_desc: "In an age when European powers fight over doctrine, Islamic rulers face their own choices between Sunni orthodoxy, Shia devotion, and syncretic practice. Investing in a clear confessional identity strengthens our religious legitimacy and demographic coherence."

 ottoman_millet_advance: "Millet Administrative System"
 ottoman_millet_advance_desc: "The Ottoman millet system, which grants recognized religious communities legal autonomy under their own institutions, has proven a remarkably effective tool for governing a diverse empire. We refine and extend this model."

 post_war_religious_settlement: "Post-War Religious Settlement"
 post_war_religious_settlement_desc: "Decades of religious war have produced exhausted pragmatism: most rulers now accept that forcing universal religious conformity is too costly. Negotiated settlements — grudging tolerance in exchange for political loyalty — bring a fragile but real stability."

 westphalian_advance: "Westphalian Sovereignty Doctrine"
 westphalian_advance_desc: "The Peace of Westphalia established a new framework for European politics: states are sovereign within their own borders, and the principle of cuius regio, eius religio gives rulers authority over their realms' confessional identity."

 indian_syncretic_tradition: "Syncretic Tolerance"
 indian_syncretic_tradition_desc: "India's extraordinary religious diversity has long required its rulers to practice a degree of tolerance unknown in Europe. By institutionalizing respect for multiple traditions, we make our realm less resistant to change and more stable."

 mughal_sulh_e_kul: "Sulh-e-Kul"
 mughal_sulh_e_kul_desc: "Akbar's doctrine of sulh-e-kul — universal peace — argued that a wise ruler stands above sectarian division, drawing legitimacy from all his subjects regardless of faith. This philosophy of inclusive sovereignty strengthens our bonds with diverse subject peoples."

 indian_court_tolerance: "Court of Universal Tolerance"
 indian_court_tolerance_desc: "Our court has become a meeting place for scholars of every tradition: Hindu pandits, Muslim ulama, Jain monks, Sikh teachers, and European missionaries all find a welcome audience. This culture of inquiry enriches our administration."

 east_asian_state_orthodoxy: "State Orthodoxy"
 east_asian_state_orthodoxy_desc: "By aligning state ritual and institutional practice with an orthodox tradition — Confucian, Buddhist, or Shinto — our government projects continuity, legitimacy, and cultural coherence across our realm."

 confucian_bureaucratic_faith: "Confucian Bureaucratic Faith"
 confucian_bureaucratic_faith_desc: "Neo-Confucian state philosophy has fused ritual, ethics, and administrative technique into a seamless whole. Our examination-trained officials embody this synthesis: their governance is inseparable from their moral cultivation."

 # ============================================================
 # Late Absolutism Ideas (Age of Revolutions)
 # ============================================================
 late_absolutism_ideas: "Late Absolutism Ideas"
 late_absolutism_ideas_desc: "The age of absolute monarchy has passed its zenith, but its achievements endure: centralized bureaucracies, permanent armies, and rationalized state finances are now the baseline from which even reformers must begin."

 enlightened_administration: "Enlightened Administration"
 enlightened_administration_desc: "Enlightenment thought has reached the corridors of power. Rulers and ministers who have read Montesquieu, Voltaire, and the Encyclopédistes are applying rationalist principles to governance — streamlining law, reforming taxation, and expanding education."

 enlightened_despotism_advance: "Enlightened Despotism"
 enlightened_despotism_advance_desc: "Frederick of Prussia, Catherine of Russia, Joseph of Austria — the great enlightened despots demonstrate that absolute power need not mean arbitrary power. A monarch who rules by reason, law, and public interest can achieve reforms no parliament would dare attempt."

 reform_from_above: "Reform from Above"
 reform_from_above_desc: "Faced with the threat of revolution from below, wise rulers choose reform from above. Abolishing serfdom, codifying law, and opening schools buys loyalty from new constituencies while preserving the essentials of monarchical authority."

 mercantilist_legacy_advance: "Mercantilist Legacy"
 mercantilist_legacy_advance_desc: "Two centuries of mercantilist policy have created sophisticated trading institutions: regulated companies, customs regimes, navigation acts, and state banks. Our republic inherits this apparatus and turns it to full commercial advantage."

 colonial_mercantile_system: "Colonial Mercantile System"
 colonial_mercantile_system_desc: "Our colonial empire is now a mature economic system: plantation agriculture, monopoly trade companies, navigation acts, and silver flows all converge to channel colonial wealth into the metropole. This system, perfected over generations, operates with formidable efficiency."

 professional_standing_army: "Professional Standing Army"
 professional_standing_army_desc: "The military revolution has reached its culmination: every major power now maintains a permanent, paid, uniformed army rather than relying on feudal levies or mercenaries. Our standing army is disciplined, supplied, and ready for campaign at any time."

 prussian_discipline_advance: "Prussian Discipline"
 prussian_discipline_advance_desc: "Prussia's army has become the envy and model of Europe: relentless drill, cadenced marching, and a culture of obedience that makes the Prussian musketeer the most precisely controllable soldier on any battlefield."

 prussian_general_staff: "General Staff System"
 prussian_general_staff_desc: "The Prussian innovation of a permanent general staff — officers who plan campaigns, map terrain, and war-game scenarios before battles begin — transforms warfare from an art into a science. Our officers fight with information their enemies lack."

 ottoman_military_reform: "New Order Military Reform"
 ottoman_military_reform_desc: "Reformist viziers and sultans have recognized that European military methods represent a genuine challenge. New model infantry units trained in European drill, equipped with standardized weapons, represent a decisive modernizing investment."

 qing_administrative_consolidation: "Qing Administrative Consolidation"
 qing_administrative_consolidation_desc: "The Qing conquest has not replaced Chinese administrative culture — it has absorbed and perfected it. A dual Manchu-Han bureaucracy, an expanded examination system, and rigorous provincial oversight give our empire a formidable administrative apparatus."

 east_asian_bureaucratic_peak: "Bureaucratic Peak"
 east_asian_bureaucratic_peak_desc: "Our administrative tradition has reached a summit of refinement. The examination system, the central ministries, the provincial hierarchy, and the system of mutual surveillance have been tuned to extraordinary precision over many generations."

 indian_administrative_sophistication: "Administrative Sophistication"
 indian_administrative_sophistication_desc: "Indian states have developed elaborate traditions of revenue administration, provincial governance, and fiscal management. Our revenue surveys, market regulations, and credit networks represent centuries of practical statecraft."

 maratha_fiscal_administration: "Fiscal Administration"
 maratha_fiscal_administration_desc: "The Maratha confederacy has demonstrated that decentralized revenue farming, when combined with effective military power and political skill, can build a formidable state from a fragmented beginning. Our fiscal institutions reflect this pragmatic tradition."
