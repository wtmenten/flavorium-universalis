l_english:
 # Flavorium Universalis - Factions: game rule

 rule_cc_factions: "C&C: Political Parties"
 rule_cc_factions_desc: "When enabled, the player, great powers and realms with 100 or more development have four political parties drawn from their estates, government and age. Every minister belongs to one. Each party watches its own concerns and the cabinet, sets agendas, and affects the realm and its ministers. Some must be handled or they escalate to a coup, a rising or an uprising. Your parties are on the Factions tab of the Court Ledger."
 setting_cc_factions_on: "Enabled"
 setting_cc_factions_on_desc: "Parties are simulated for your realm and for larger AI realms, and the Court Ledger has a Factions tab."
 setting_cc_factions_off: "Disabled"
 setting_cc_factions_off_desc: "No parties, and no Factions tab in the Court Ledger."

