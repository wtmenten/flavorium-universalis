l_english:
 rule_cc_france_containment: "C&C: France, Lowlands Containment"
 rule_cc_france_containment_desc: "Gives France's Lowlands-culture neighbors elevated antagonism toward France at game start, decaying over 200 years."
 setting_cc_france_containment_on: "Enabled"
 setting_cc_france_containment_on_desc: "France begins under pressure from its Lowlands neighbors, reflecting historical anxieties about French hegemony."
 setting_cc_france_containment_off: "Disabled"
 setting_cc_france_containment_off_desc: "France starts with no extra antagonism from its neighbors."

 rule_cc_mamluk_start: "C&C: Mamluks, Foreign Rule Strain"
 rule_cc_mamluk_start_desc: "Gives the Mamluks starting penalties reflecting their status as a foreign military caste ruling over native Egyptians."
 setting_cc_mamluk_start_on: "Enabled"
 setting_cc_mamluk_start_on_desc: "The Mamluks begin with a permanent peasant levy penalty and decaying military strain, easing over 200 years."
 setting_cc_mamluk_start_off: "Disabled"
 setting_cc_mamluk_start_off_desc: "The Mamluks start with no historical penalties."

 rule_cc_tur_start: "C&C: Ottomans, Colonization"
 rule_cc_tur_start_desc: "Prevent the Ottomans from colonizing."
 setting_cc_tur_start_on: "Prevent Colonization"
 setting_cc_tur_start_on_desc: "The Ottomans are permanently prevented from colonizing."
 setting_cc_tur_start_off: "Allow Colonization"
 setting_cc_tur_start_off_desc: "The Ottomans may still colonize as normal."

 rule_cc_hyw_flavor: "C&C: France, Hundred Years War Flavor"
 rule_cc_hyw_flavor_desc: "Enables historical flavor for the Hundred Years War: starting levy and estate modifiers for France and England, war outcome stacking, vassal defection pressure events, observer power reactions, and the Replace Appanage Ruler decision."
 setting_cc_hyw_flavor_on: "Enabled"
 setting_cc_hyw_flavor_on_desc: "France and England start with historical modifiers; war outcomes stack levy and estate effects over time; Burgundy, Brittany, and other vassals may waver when their suzerain suffers defeat."
 setting_cc_hyw_flavor_off: "Disabled"
 setting_cc_hyw_flavor_off_desc: "No HYW-specific starting modifiers, stacking events, or vassal defection pressure will fire."


 rule_cc_one_small_loan: "C&C: Hussites - One Small Loan Events"
 rule_cc_one_small_loan_desc: "Enables a slightly silly event where the pope interacts with the strongest catholic player power offering them money in return for assistance."
 setting_cc_one_small_loan_on: "Enabled"
 setting_cc_one_small_loan_on_desc: "Papal one small loan events will fire depending on your stance during hussite crusades."
 setting_cc_one_small_loan_off: "Disabled"
 setting_cc_one_small_loan_off_desc: "No Papal one small loan events will fire."

 rule_cc_ai_personalities: "C&C: Dynamic AI Personalities"
 rule_cc_ai_personalities_desc: "Controls whether AI countries evolve their grand strategies across ages and shift in response to game events."
 setting_cc_ai_personalities_off: "Vanilla"
 setting_cc_ai_personalities_off_desc: "No changes. AI personalities use vanilla historical assignments and random rules only."
 setting_cc_ai_personalities_historical: "Dynamic Historical"
 setting_cc_ai_personalities_historical_desc: "Major powers follow historically-informed personality arcs across ages. Key turning points fire choice events with a historical option and one or two alternatives."
 setting_cc_ai_personalities_dynamic: "Dynamic Drift Only"
 setting_cc_ai_personalities_dynamic_desc: "Adds context-driven personality changes for all AI countries, shifting in response to war, power, wealth, and circumstance."
 setting_cc_ai_personalities_full: "Dynamic Historical + Drift"
 setting_cc_ai_personalities_full_desc: "Adds context-driven drift events for all AI countries, shifting personalities in response to war, power, wealth, and circumstance. Major powers follow historically-informed personality arcs across ages. Key turning points fire choice events with a historical option and one or two alternatives. Historical events still guard against random drift for ~20 years after they fire."

 rule_cc_wealth_events: "C&C: Wealth Hoarding Events"
 rule_cc_wealth_events_desc: "When enabled, countries that hoard gold above 100x their monthly income will periodically face events representing court demands and economic pressure."
 setting_cc_wealth_events_on: "Enabled"
 setting_cc_wealth_events_on_desc: "Wealth hoarding events fire from the biyearly pulse when the gold threshold is met."
 setting_cc_wealth_events_off: "Disabled"
 setting_cc_wealth_events_off_desc: "No wealth hoarding events will fire."

 rule_cc_subject_types: "C&C: Custom Subject Types"
 rule_cc_subject_types_desc: "Controls whether the mod's custom subject types (personal-union partners, shadow and client states, elite enclaves, chartered companies, cultural communes, provincial governorates, tax farms, marches, federal members, and the rest) are available. The toggle gates every advance that unlocks these subjects."
 setting_cc_subject_types_on: "Enabled"
 setting_cc_subject_types_on_desc: "The advances that unlock the mod's custom subject types appear in the tech tree for every country, alongside their estate privileges and government reforms."
 setting_cc_subject_types_player_only: "Player Only"
 setting_cc_subject_types_player_only_desc: "Only human-controlled countries can research these advances and create the custom subjects. AI countries are limited to vanilla subject types."
 setting_cc_subject_types_off: "Disabled"
 setting_cc_subject_types_off_desc: "Those advances never appear, so the custom subjects cannot be created. Only vanilla subject types remain, and the related event chains stay dormant."

 rule_cc_subject_bonds: "C&C: Overlord-Subject Bonds"
 rule_cc_subject_bonds_desc: "When enabled, tracks 5 relationship dimensions (economic, military, political, cultural, personal) across large long-term subjects. Player choices across Ages 1-4 determine how subjects behave in the Age of Revolutions. Most tracking is hidden; consequences appear decades later."
 setting_cc_subject_bonds_on: "Enabled"
 setting_cc_subject_bonds_on_desc: "Detailed multi-dimensional run-spanning subject event-chains, sentiments, and profiles."
 setting_cc_subject_bonds_off: "Disabled"
 setting_cc_subject_bonds_off_desc: "Normal subject relationships, bond tracking and event chains disabled."

 setting_cc_invasion_mexico_on: "Enabled"
 setting_cc_invasion_mexico_on_desc: "The Mexican Invasion situation will fire for eligible countries."
 setting_cc_invasion_mexico_off: "Disabled"
 setting_cc_invasion_mexico_off_desc: "The Mexican Invasion situation will not fire."

 rule_cc_colonial_consolidation: "C&C: Colonial Consolidation"
 rule_cc_colonial_consolidation_desc: "When enabled, mid/late-colonial (Age of Absolutism onward) event chains fire for colonial empires: border friction between adjacent colonies of incompatible cultures, consolidation of kindred colonies into viceroyalties, and the hardening of colonial labor and demographic regimes."
 setting_cc_colonial_consolidation_on: "Enabled"
 setting_cc_colonial_consolidation_on_desc: "Colonial border friction, viceroyalty consolidation, and labor/demographic event chains will fire from the Age of Absolutism onward."
 setting_cc_colonial_consolidation_off: "Disabled"
 setting_cc_colonial_consolidation_off_desc: "Colonial consolidation and border friction event chains are disabled."

 rule_cc_balance_of_power: "C&C: Balance of Power"
 rule_cc_balance_of_power_desc: "When enabled, a two-pole great-power situation can arise across Europe and the Near-East: an aspiring Preponderant Bloc checked by a Balancing Coalition. It begins once a great power adopts the balance-of-power doctrine (Age of Absolutism) or once the revolutionary era opens, and ends through hegemony, an eastern deluge, revolution, or a lasting Concert of Europe."
 setting_cc_balance_of_power_on: "Enabled"
 setting_cc_balance_of_power_on_desc: "The European Balance of Power situation will fire for eligible great powers."
 setting_cc_balance_of_power_off: "Disabled"
 setting_cc_balance_of_power_off_desc: "The European Balance of Power situation is disabled."
