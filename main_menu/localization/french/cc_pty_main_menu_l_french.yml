 # Flavorium Universalis - Factions: game rule and situation hint

 rule_cc_factions: "C&C : Partis politiques"
 rule_cc_factions_desc: "Lorsqu'elle est activée, le joueur, les grandes puissances et les royaumes ayant un développement de 100 ou plus disposent de quatre partis politiques issus de leurs domaines, de leur gouvernement et de leur âge. Chaque ministre appartient à l'un d'eux. Chaque parti surveille ses propres intérêts ainsi que le cabinet, fixe des agendas et influence le royaume et ses ministres. Certains doivent être gérés, sous peine de dégénérer en coup d'État, en soulèvement ou en insurrection. Vos partis se trouvent dans l'onglet Factions du Registre de la Cour."
 setting_cc_factions_on: "Activé"
 setting_cc_factions_on_desc: "Les partis sont simulés pour votre royaume ainsi que pour les royaumes d'IA plus importants, et le Registre de la Cour possède un onglet Factions."
 setting_cc_factions_off: "Désactivé"
 setting_cc_factions_off_desc: "Pas de partis, et pas d'onglet Factions dans le Registre de la Cour."

