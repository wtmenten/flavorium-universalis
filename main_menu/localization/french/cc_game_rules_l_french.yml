l_french:
 rule_cc_france_containment: "C&C : France, endiguement des Pays-Bas"
 rule_cc_france_containment_desc: "Donne aux voisins de culture Lowlands de la France un antagonisme accru envers la France au début de la partie, s'estompant sur 200 ans."
 setting_cc_france_containment_on: "Activé"
 setting_cc_france_containment_on_desc: "La France commence sous la pression de ses voisins des Pays-Bas, reflétant les angoisses historiques concernant l'hégémonie française."
 setting_cc_france_containment_off: "Désactivé"
 setting_cc_france_containment_off_desc: "La France ne commence avec aucun antagonisme supplémentaire de la part de ses voisins."

 rule_cc_mamluk_start: "C&C : Mamelouks, tensions liées à la domination étrangère"
 rule_cc_mamluk_start_desc: "Donne aux Mamelouks des malus initiaux reflétant leur statut de caste militaire étrangère régnant sur les Égyptiens autochtones."
 setting_cc_mamluk_start_on: "Activé"
 setting_cc_mamluk_start_on_desc: "Les Mamelouks commencent avec un malus permanent de levée paysanne et une tension militaire décroissante, s'estompant sur 200 ans."
 setting_cc_mamluk_start_off: "Désactivé"
 setting_cc_mamluk_start_off_desc: "Les Mamelouks ne commencent avec aucun malus historique."

 rule_cc_tur_start: "C&C : Ottomans, colonisation"
 rule_cc_tur_start_desc: "Empêcher les Ottomans de coloniser."
 setting_cc_tur_start_on: "Empêcher la colonisation"
 setting_cc_tur_start_on_desc: "Les Ottomans ne peuvent plus coloniser."
 setting_cc_tur_start_off: "Autoriser la colonisation"
 setting_cc_tur_start_off_desc: "Les Ottomans peuvent toujours coloniser normalement."

 rule_cc_hyw_flavor: "C&C : France, saveurs de la guerre de Cent Ans"
 rule_cc_hyw_flavor_desc: "Active les éléments historiques pour la guerre de Cent Ans : levées initiales et modificateurs d'États pour la France et l'Angleterre, cumul des résultats de guerre, événements de pression pour la défection des vassaux, réactions des puissances observatrices et la décision Remplacer le dirigeant de l'apanage."
 setting_cc_hyw_flavor_on: "Activé"
 setting_cc_hyw_flavor_on_desc: "La France et l'Angleterre commencent avec des modificateurs historiques ; les résultats des guerres cumulent les effets sur les levées et les domaines au fil du temps ; la Bourgogne, la Bretagne et d'autres vassaux peuvent vaciller lorsque leur suzerain subit une défaite."
 setting_cc_hyw_flavor_off: "Désactivé"
 setting_cc_hyw_flavor_off_desc: "Aucun modificateur de départ spécifique à la HYW, événement cumulatif ou pression de défection des vassaux ne se déclenchera."


 rule_cc_one_small_loan: "C&C : Hussites - Événements sur le petit prêt"
 rule_cc_one_small_loan_desc: "Active un événement légèrement absurde où le pape interagit avec la puissance catholique joueuse la plus forte, lui offrant de l'argent en échange d'une assistance."
 setting_cc_one_small_loan_on: "Activé"
 setting_cc_one_small_loan_on_desc: "Les événements de petit prêt papal se déclencheront selon votre position lors des croisades hussites."
 setting_cc_one_small_loan_off: "Désactivé"
 setting_cc_one_small_loan_off_desc: "Aucun événement de « petit prêt » papal ne se déclenchera."

 rule_cc_ai_personalities: "C&C : Personnalités d'IA dynamiques"
 rule_cc_ai_personalities_desc: "Contrôle si les pays gérés par l'IA font évoluer leurs grandes stratégies à travers les âges et s'adaptent en réponse aux événements du jeu."
 setting_cc_ai_personalities_off: "Vanille"
 setting_cc_ai_personalities_off_desc: "Aucun changement. Les personnalités de l'IA utilisent uniquement les affectations historiques vanilla et des règles aléatoires."
 setting_cc_ai_personalities_historical: "Historique dynamique"
 setting_cc_ai_personalities_historical_desc: "Les grandes puissances suivent des arcs de personnalité historiquement documentés à travers les âges. Les points tournants déclenchent des événements de choix avec une option historique et une ou deux alternatives."
 setting_cc_ai_personalities_dynamic: "Dérive dynamique uniquement"
 setting_cc_ai_personalities_dynamic_desc: "Ajoute des changements de personnalité contextuels pour tous les pays gérés par l'IA, évoluant en réponse à la guerre, au pouvoir, à la richesse et aux circonstances."
 setting_cc_ai_personalities_full: "Historique dynamique + Dérive"
 setting_cc_ai_personalities_full_desc: "Ajoute des événements de dérive contextuels pour tous les pays gérés par l'IA, modifiant les personnalités en réponse à la guerre, au pouvoir, à la richesse et aux circonstances. Les grandes puissances suivent des arcs de personnalité historiquement documentés à travers les âges. Les points tournants clés déclenchent des événements de choix avec une option historique et une ou deux alternatives. Les événements historiques protègent toujours contre la dérive aléatoire pendant environ 20 ans après leur déclenchement."

 rule_cc_wealth_events: "C&C : Événements sur l'accumulation de richesses"
 rule_cc_wealth_events_desc: "Lorsqu'elle est activée, les pays qui accumulent de l'or au-delà de 100 fois leurs revenus mensuels seront périodiquement confrontés à des événements représentant les exigences de la cour et la pression économique."
 setting_cc_wealth_events_on: "Activé"
 setting_cc_wealth_events_on_desc: "Les événements d'accumulation de richesse se déclenchent lors de l'impulsion bisannuelle lorsque le seuil d'or est atteint."
 setting_cc_wealth_events_off: "Désactivé"
 setting_cc_wealth_events_off_desc: "Aucun événement d'accumulation de richesse ne se déclenchera."

 rule_cc_subject_types: "C&C : Types de sujets personnalisés"
 rule_cc_subject_types_desc: "Contrôle si les types de sujets personnalisés du mod (partenaires d'union personnelle, États ombres et clients, enclaves d'élite, compagnies à charte, communes culturelles, gouvernorats provinciaux, fermes fiscales, marches, membres fédéraux, etc.) sont disponibles. Le commutateur conditionne chaque avancée qui débloque ces sujets."
 setting_cc_subject_types_on: "Activé"
 setting_cc_subject_types_on_desc: "Les avancées qui débloquent les types de sujets personnalisés du mod apparaissent dans l'arbre technologique de chaque pays, aux côtés de leurs privilèges d'estates et de leurs réformes gouvernementales."
 setting_cc_subject_types_player_only: "Joueur uniquement"
 setting_cc_subject_types_player_only_desc: "Seuls les pays contrôlés par des humains peuvent rechercher ces avancées et créer des sujets personnalisés. Les pays gérés par l'IA sont limités aux types de sujets classiques."
 setting_cc_subject_types_off: "Désactivé"
 setting_cc_subject_types_off_desc: "Ces avancées n'apparaissent jamais, donc les sujets personnalisés ne peuvent être créés. Seuls les types de sujets vanilla subsistent, et les chaînes d'événements associées restent dormantes."

 rule_cc_subject_bonds: "C&C : Liens suzerain-vassal"
 rule_cc_subject_bonds_desc: "Lorsqu'elle est activée, elle suit 5 dimensions relationnelles (économique, militaire, politique, culturelle, personnelle) à travers les grands sujets à long terme. Les choix du joueur tout au long des Âges 1 à 4 déterminent le comportement des sujets à l'Âge des Révolutions. La majeure partie du suivi est cachée ; les conséquences apparaissent des décennies plus tard."
 setting_cc_subject_bonds_on: "Activé"
 setting_cc_subject_bonds_on_desc: "Chaînes d'événements, sentiments et profils de sujets multidimensionnels détaillés s'étendant sur toute la partie."
 setting_cc_subject_bonds_off: "Désactivé"
 setting_cc_subject_bonds_off_desc: "Relations entre sujets, suivi des liens et chaînes d'événements normaux désactivés."

 setting_cc_invasion_mexico_on: "Activé"
 setting_cc_invasion_mexico_on_desc: "L'événement de l'invasion mexicaine se déclenchera pour les pays éligibles."
 setting_cc_invasion_mexico_off: "Désactivé"
 setting_cc_invasion_mexico_off_desc: "L'événement de l'invasion mexicaine ne se déclenchera pas."

 rule_cc_colonial_consolidation: "C&C : Consolidation coloniale"
 rule_cc_colonial_consolidation_desc: "Lorsqu'elle est activée, des chaînes d'événements coloniaux de milieu/fin de période (à partir de l'Âge de l'Absolutisme) se déclenchent pour les empires coloniaux : frictions frontalières entre colonies adjacentes de cultures incompatibles, consolidation de colonies apparentées en vice-royautés et durcissement des régimes démographiques et de travail coloniaux."
 setting_cc_colonial_consolidation_on: "Activé"
 setting_cc_colonial_consolidation_on_desc: "Les chaînes d'événements liées aux frictions frontalières coloniales, à la consolidation des vice-royautés et à la main-d'œuvre/démographie se déclencheront à partir de l'Âge de l'absolutisme."
 setting_cc_colonial_consolidation_off: "Désactivé"
 setting_cc_colonial_consolidation_off_desc: "Les chaînes d'événements de consolidation coloniale et de frictions frontalières sont désactivées."

 rule_cc_balance_of_power: "C&C : Équilibre des puissances"
 rule_cc_balance_of_power_desc: "Lorsqu'elle est activée, une situation de grandes puissances bipolaire peut émerger en Europe et au Proche-Orient : un Bloc prépondérant aspirant, freiné par une Coalition d'équilibre. Cela commence dès qu'une grande puissance adopte la doctrine de l'équilibre des puissances (Âge de l'Absolutisme) ou dès que l'ère révolutionnaire s'ouvre, et se termine par l'hégémonie, un déluge oriental, une révolution ou un Concert européen durable."
 setting_cc_balance_of_power_on: "Activé"
 setting_cc_balance_of_power_on_desc: "La situation relative à l'équilibre des puissances en Europe s'activera pour les grandes puissances éligibles."
 setting_cc_balance_of_power_off: "Désactivé"
 setting_cc_balance_of_power_off_desc: "La situation relative à l'équilibre des puissances en Europe est désactivée."
 rule_cc_cabinet_xp: "C&C : Expérience du Cabinet"
 rule_cc_cabinet_xp_desc: "Lorsqu'elle est activée, les ministres du cabinet accumulent de l'expérience grâce aux fonctions qu'ils occupent, aux années où ils servent et aux guerres, lois et mariages que leur cour mène à bien. L'expérience donne à chaque ministre un niveau (ancienneté) et un rang dans chacune des trois capacités (spécialisation), qui régissent ensemble la progression de leurs traits."
 setting_cc_cabinet_xp_on: "Activé"
 setting_cc_cabinet_xp_on_desc: "Les ministres gagnent de l'expérience et progressent. Ce suivi est effectué pour votre cour et pour les grandes puissances ; les petites cours d'IA sont ignorées."
 setting_cc_cabinet_xp_off: "Désactivé"
 setting_cc_cabinet_xp_off_desc: "Les ministres n'accumulent plus d'expérience. Les traits fonctionnent comme auparavant, et le passage mensuel pour chaque cabinet de cour est entièrement ignoré."
