l_french:

 # ============================================================
 # Late Renaissance Ideas (Age of Discovery)
 # ============================================================
 late_renaissance_ideas: "Idées de Renaissance tardive"
 late_renaissance_ideas_desc: "La pensée humaniste et la renaissance classique qui ont défini la Renaissance ne se sont pas achevées avec l'avènement d'un nouvel âge. Nos savants et administrateurs continuent d'en approfondir les fruits en matière d'alphabétisation, de raison et d'ordre civique."

 renaissance_natural_philosophy: "Philosophie naturelle"
 renaissance_natural_philosophy_desc: "Les penseurs de la Renaissance ont détourné leur regard des écritures pour se tourner vers la nature elle-même, cataloguant les plantes, étudiant le corps humain et jetant les bases des sciences empiriques. Un tel savoir améliore la santé et la longévité de notre peuple."

 renaissance_church_patronage: "Mécénat de l'Église pour le savoir"
 renaissance_church_patronage_desc: "L'Église a longtemps été un mécène des arts et du savoir. En orientant la richesse ecclésiastique vers les universités et les scriptoria, nous accélérons la diffusion des idées au sein de notre population."

 scholastic_reform_advance: "Réforme scolastique"
 scholastic_reform_advance_desc: "Les théologiens catholiques ont fusionné la logique aristotélicienne avec la doctrine chrétienne, créant une culture intellectuelle rigoureuse dans nos monastères et nos écoles cathédrales. Cette tradition de dispute ordonnée augmente le taux d'alphabétisation de notre royaume."

 islamic_observatory_tradition: "Tradition d'observation islamique"
 islamic_observatory_tradition_desc: "Les grands observatoires de Samarcande, du Caire et d'Istanbul représentent une tradition islamique séculaire de connaissances astronomiques et médicales précises. Nos savants maintiennent cette tradition, faisant progresser la compréhension du fonctionnement du monde."

 ottoman_polymath_networks: "Réseaux de polymathes"
 ottoman_polymath_networks_desc: "Les grandes villes du monde islamique abritent des polymathes qui naviguent librement entre les mathématiques, la médecine, la philosophie et l'ingénierie. Ces réseaux d'hommes savants transportent le savoir à travers notre royaume et au-delà de nos frontières."

 renaissance_civic_humanism: "Humanisme civil"
 renaissance_civic_humanism_desc: "Les penseurs humanistes soutiennent que la vertu civique, c'est-à-dire la participation active au gouvernement, à la rhétorique et au devoir public, est la plus haute expression de l'excellence humaine. Nos administrateurs adoptent cet idéal, servant l'État avec une détermination renouvelée."

 renaissance_court_culture: "Culture de cour de la Renaissance"
 renaissance_court_culture_desc: "Les cours princières d'Italie sont devenues des modèles d'érudition raffinée et de mécénat artistique. Notre propre cour adopte ces idéaux : les souverains qui soutiennent les poètes, les architectes et les philosophes projettent leur autorité à travers la magnificence culturelle."

 civic_republic_ideals: "Idéaux républicains civils"
 civic_republic_ideals_desc: "Le républicanisme de la Renaissance s'est inspiré de la Rome antique pour soutenir que des citoyens libres délibérant ensemble produisent des lois plus sages que n'importe quel monarque seul. Les institutions de notre république sont affûtées par cet héritage du discours civique."

 east_asian_classical_revival: "Renouveau classique"
 east_asian_classical_revival_desc: "Les érudits néoconfucéens ont renouvelé leur attention envers les textes classiques de l'Antiquité, réexaminant les Quatre Livres et les Cinq Classiques avec des commentaires actualisés. Ce renouveau améliore la qualité de nos administrateurs formés aux examens."

 chinese_examination_refinement: "Raffinement du système d'examens"
 chinese_examination_refinement_desc: "Des générations de raffinement érudit ont fait du système d'examens un instrument extraordinairement précis pour sélectionner des administrateurs capables. Notre bureaucratie méritocratique fonctionne avec une efficacité inégalée."

 italian_masters_advance: "Maîtres italiens"
 italian_masters_advance_desc: "Les ateliers de Florence, Venise et Milan ont produit une lignée ininterrompue de maîtres en peinture, sculpture et architecture. Nos institutions culturelles héritent de cette tradition d'excellence, attirant les plus grands talents artistiques."

 # ============================================================
 # Late Discovery Ideas (Age of Reformation)
 # ============================================================
 late_discovery_ideas: "Idées de découvertes tardives"
 late_discovery_ideas_desc: "Une génération d'explorateurs a cartographié les contours d'un monde bien plus vaste que nos ancêtres ne l'imaginaient. Leur connaissance des côtes, des courants et des marchandises devient désormais le fondement d'un commerce durable et d'une ambition coloniale."

 systematic_cartography: "Cartographie systématique"
 systematic_cartography_desc: "Là où les premiers explorateurs naviguaient à vue et selon des rumeurs, une nouvelle génération de cartographes apporte une précision mathématique à l'art de la carte. Des cartes précises étendent la portée effective de nos marchands et ambassadeurs."

 discovery_colonial_consolidation: "Consolidation coloniale"
 discovery_colonial_consolidation_desc: "L'ère des découvertes téméraires cède la place à une consolidation prudente. La colonisation, l'administration et des communications régulières transforment des points d'appui lointains en possessions fiables, améliorant ainsi la loyauté de nos États vassaux."

 maritime_republic_trade: "Réseaux commerciaux des républiques maritimes"
 maritime_republic_trade_desc: "Les républiques marchandes ont compris depuis longtemps que le profit ne réside pas dans le territoire, mais dans le contrôle des échanges. Leur héritage en droit commercial, guildes de marchands et réseaux de comptoirs donne à notre république des avantages décisifs dans le commerce mondial."

 east_asian_maritime_tribute: "Réseaux de tributs maritimes"
 east_asian_maritime_tribute_desc: "Nos grandes flottes projettent depuis longtemps leur puissance grâce à des relations de tribut avec les peuples maritimes d'outre-mer. Systématiser ces connexions étend notre portée navale et renforce la loyauté de nos dépendants lointains."

 missionary_expansion_advance: "Expansion missionnaire"
 missionary_expansion_advance_desc: "La foi suit le drapeau. Nos missionnaires voyagent aux côtés des marchands et des soldats, convertissant les populations et établissant des églises dans des terres lointaines. Leur travail étend la portée spirituelle et administrative de notre royaume."

 colonial_ecclesiastical_order: "Ordres ecclésiastiques coloniaux"
 colonial_ecclesiastical_order_desc: "Les grands ordres religieux (Dominicains, Franciscains, Jésuites) ont établi des missions à travers nos territoires coloniaux, construisant des écoles et des églises qui ancrent la civilisation européenne dans le nouveau monde."

 iberian_colonial_doctrine: "Doctrine coloniale ibérique"
 iberian_colonial_doctrine_desc: "L'Espagne et le Portugal ont développé une théorie sophistiquée de l'administration coloniale : concessions d'encomiendas, vice-royautés et un système commercial transatlantique qui canalise la richesse des nouveaux mondes vers les coffres ibériques."

 iberian_heavy_fleet: "Doctrine de la flotte atlantique"
 iberian_heavy_fleet_desc: "La caraque et le galion, navires lourdement armés et à coque profonde capables de traverser les océans, représentent la maîtrise ibérique de la guerre océanique. Notre doctrine navale met l'accent sur la capacité du navire de ligne à projeter sa puissance sur n'importe quelle mer."

 overland_trade_routes: "Routes commerciales terrestres"
 overland_trade_routes_desc: "Tandis que les puissances européennes s'efforcent de trouver des routes maritimes contournant nos terres, nous commandons les anciennes artères du commerce terrestre : la Route de la Soie, les routes de l'encens, les grandes caravanes qui relient l'Orient et l'Occident depuis des millénaires."

 silk_road_revival: "Renaissance de la route de la soie"
 silk_road_revival_desc: "En sécurisant les routes des caravanes, en investissant dans les caravansérails et en négociant des accords de passage sécurisé, nous redonnons à la Route de la Soie une partie de sa gloire passée, canalisant la richesse de l'Asie vers nos marchés."

 # ============================================================
 # Late Reformation Ideas (Age of Absolutism)
 # ============================================================
 late_reformation_ideas: "Idées de Réforme tardive"
 late_reformation_ideas_desc: "Un siècle de bouleversements religieux a épuisé beaucoup de gens, mais son héritage est réel : les confessions sont plus claires, les institutions plus conscientes d'elles-mêmes, et des accords durement acquis confèrent au royaume une stabilité prudente que les générations précédentes ne pouvaient imaginer."

 confessional_state_building: "Construction d'un État confessionnel"
 confessional_state_building_desc: "La leçon tirée des Guerres de Religion est qu'un royaume stable nécessite une confession unifiée, ou du moins une confession gérée avec soin. Les institutions étatiques confessionnelles formalisent la relation entre l'Église et le gouvernement."

 protestant_church_state: "État-Église protestant"
 protestant_church_state_desc: "Les réformateurs protestants ont insisté sur le fait que la Parole de Dieu, accessible à tous ceux qui savent lire, doit être le fondement d'un royaume chrétien. L'accent mis sur l'alphabétisation et les Écritures en langue vernaculaire a rendu les terres protestantes systématiquement mieux éduquées."

 lutheran_education_advance: "Héritage éducatif luthérien"
 lutheran_education_advance_desc: "L'insistance de Luther pour que chaque chrétien lise les Écritures par lui-même a favorisé l'établissement d'écoles paroissiales à travers l'Europe protestante. Cet investissement populaire dans l'alphabétisation est devenu un avantage structurel permanent."

 catholic_confession_legacy: "Héritage confessionnel catholique"
 catholic_confession_legacy_desc: "Le Concile de Trente a revitalisé les institutions catholiques, clarifiant la doctrine, réformant le clergé et établissant de nouveaux ordres religieux dédiés à l'éducation et aux soins pastoraux. Cette Église renouvelée est un puissant moteur de cohésion sociale."

 jesuitical_reform_advance: "Réseaux de réforme jésuites"
 jesuitical_reform_advance_desc: "La Compagnie de Jésus gère des écoles, des universités et des missions sur trois continents, transmettant les méthodes du catholicisme tridentin rigoureux partout où le colonialisme européen a pénétré. Leur réseau étend notre portée institutionnelle."

 sunni_confessional_state: "Consolidation confessionnelle"
 sunni_confessional_state_desc: "À une époque où les puissances européennes se battent pour des doctrines, les dirigeants islamiques font face à leurs propres choix entre l'orthodoxie sunnite, la dévotion chiite et la pratique syncrétique. Investir dans une identité confessionnelle claire renforce notre légitimité religieuse et notre cohérence démographique."

 ottoman_millet_advance: "Système administratif des Millets"
 ottoman_millet_advance_desc: "Le système des millets ottomans, qui accorde aux communautés religieuses reconnues une autonomie juridique sous leurs propres institutions, s'est révélé être un outil remarquablement efficace pour gouverner un empire diversifié. Nous affinons et étendons ce modèle."

 post_war_religious_settlement: "Règlement religieux d'après-guerre"
 post_war_religious_settlement_desc: "Des décennies de guerres de religion ont produit un pragmatisme épuisé : la plupart des dirigeants acceptent désormais que forcer une conformité religieuse universelle soit trop coûteux. Des accords négociés, troquant une tolérance réticente contre une loyauté politique, apportent une stabilité fragile mais réelle."

 westphalian_advance: "Doctrine de la souveraineté westphalienne"
 westphalian_advance_desc: "La paix de Westphalie a établi un nouveau cadre pour la politique européenne : les États sont souverains à l'intérieur de leurs propres frontières, et le principe du cuius regio, eius religio donne aux dirigeants l'autorité sur l'identité confessionnelle de leurs domaines."

 indian_syncretic_tradition: "Tolérance syncrétique"
 indian_syncretic_tradition_desc: "L'extraordinaire diversité religieuse de l'Inde a longtemps exigé de ses dirigeants qu'ils pratiquent un degré de tolérance inconnu en Europe. En institutionnalisant le respect de multiples traditions, nous rendons notre royaume moins résistant au changement et plus stable."

 mughal_sulh_e_kul: "Sulh-e-Kul"
 mughal_sulh_e_kul_desc: "La doctrine du sulh-e-kul d'Akbar, ou paix universelle, soutenait qu'un souverain sage s'élève au-dessus des divisions sectaires, tirant sa légitimité de tous ses sujets, quelle que soit leur foi. Cette philosophie de souveraineté inclusive renforce nos liens avec les divers peuples assujettis."

 indian_court_tolerance: "Cour de Tolérance Universelle"
 indian_court_tolerance_desc: "Notre cour est devenue un lieu de rencontre pour les savants de toutes traditions : pandits hindous, oulémas musulmans, moines jaïns, enseignants sikhs et missionnaires européens y trouvent tous un accueil favorable. Cette culture de l'enquête enrichit notre administration."

 east_asian_state_orthodoxy: "Orthodoxie d'État"
 east_asian_state_orthodoxy_desc: "En alignant le rituel d'État et la pratique institutionnelle sur une tradition orthodoxe, qu'elle soit confucéenne, bouddhiste ou shintoïste, notre gouvernement projette la continuité, la légitimité et la cohérence culturelle à travers notre royaume."

 confucian_bureaucratic_faith: "Foi bureaucratique confucéenne"
 confucian_bureaucratic_faith_desc: "La philosophie d'État néoconfucéenne a fusionné le rituel, l'éthique et la technique administrative en un tout cohérent. Nos fonctionnaires formés aux examens incarnent cette synthèse : leur gouvernance est inséparable de leur culture morale."

 # ============================================================
 # Late Absolutism Ideas (Age of Revolutions)
 # ============================================================
 late_absolutism_ideas: "Idées d'absolutisme tardif"
 late_absolutism_ideas_desc: "L'ère de la monarchie absolue a passé son zénith, mais ses accomplissements perdurent : les bureaucraties centralisées, les armées permanentes et les finances d'État rationalisées sont désormais la base à partir de laquelle même les réformateurs doivent commencer."

 enlightened_administration: "Administration éclairée"
 enlightened_administration_desc: "La pensée des Lumières a atteint les couloirs du pouvoir. Les dirigeants et ministres ayant lu Montesquieu, Voltaire et les Encyclopédistes appliquent des principes rationalistes à la gouvernance, simplifiant le droit, réformant l'imposition et développant l'éducation."

 enlightened_despotism_advance: "Despotisme éclairé"
 enlightened_despotism_advance_desc: "Frédéric de Prusse, Catherine de Russie et Joseph d'Autriche, les grands despotes éclairés, montrent que le pouvoir absolu ne signifie pas nécessairement un pouvoir arbitraire. Un monarque qui gouverne par la raison, la loi et l'intérêt public peut réaliser des réformes qu'aucun parlement n'oserait tenter."

 reform_from_above: "Réforme d'en haut"
 reform_from_above_desc: "Face à la menace d'une révolution venue d'en bas, les dirigeants avisés choisissent la réforme venue d'en haut. Abolir le servage, codifier la loi et ouvrir des écoles permet de s'assurer la loyauté de nouveaux électorats tout en préservant l'essentiel de l'autorité monarchique."

 mercantilist_legacy_advance: "Héritage mercantiliste"
 mercantilist_legacy_advance_desc: "Deux siècles de politique mercantiliste ont créé des institutions commerciales sophistiquées : compagnies réglementées, régimes douaniers, actes de navigation et banques d'État. Notre république hérite de cet appareil et l'exploite pleinement à son avantage commercial."

 colonial_mercantile_system: "Système mercantile colonial"
 colonial_mercantile_system_desc: "Notre empire colonial est désormais un système économique mature : l'agriculture de plantation, les compagnies de commerce monopolistiques, les actes de navigation et les flux d'argent convergent tous pour canaliser la richesse coloniale vers la métropole. Ce système, perfectionné sur plusieurs générations, fonctionne avec une efficacité redoutable."

 professional_standing_army: "Armée de métier"
 professional_standing_army_desc: "La révolution militaire a atteint son apogée : chaque puissance majeure maintient désormais une armée permanente, payée et uniformisée, plutôt que de compter sur les levées féodales ou les mercenaires. Notre armée de métier est disciplinée, ravitaillée et prête pour une campagne à tout moment."

 prussian_discipline_advance: "Discipline prussienne"
 prussian_discipline_advance_desc: "L'armée de Prusse est devenue l'envie et le modèle de l'Europe : un entraînement acharné, une marche cadencée et une culture de l'obéissance qui font du mousquetaire prussien le soldat le plus précisément contrôlable sur tout champ de bataille."

 prussian_general_staff: "Système d'état-major"
 prussian_general_staff_desc: "L'innovation prussienne d'un état-major permanent, composé d'officiers qui planifient les campagnes, cartographient le terrain et simulent des scénarios avant le début des batailles, transforme la guerre d'un art en une science. Nos officiers combattent avec des informations dont leurs ennemis manquent."

 ottoman_military_reform: "Réforme militaire du Nouvel Ordre"
 ottoman_military_reform_desc: "Les vizirs et sultans réformistes ont reconnu que les méthodes militaires européennes représentent un véritable défi. De nouvelles unités d'infanterie formées au drill européen, équipées d'armes standardisées, représentent un investissement de modernisation décisif."

 qing_administrative_consolidation: "Consolidation administrative des Qing"
 qing_administrative_consolidation_desc: "La conquête Qing n'a pas remplacé la culture administrative chinoise ; elle l'a absorbée et perfectionnée. Une bureaucratie duale mandchoue-han, un système d'examens élargi et une surveillance provinciale rigoureuse confèrent à notre empire un appareil administratif formidable."

 east_asian_bureaucratic_peak: "Apogée bureaucratique"
 east_asian_bureaucratic_peak_desc: "Notre tradition administrative a atteint un sommet de raffinement. Le système des examens, les ministères centraux, la hiérarchie provinciale et le système de surveillance mutuelle ont été ajustés avec une précision extraordinaire sur plusieurs générations."

 indian_administrative_sophistication: "Sophistication administrative"
 indian_administrative_sophistication_desc: "Les États indiens ont développé des traditions élaborées d'administration des revenus, de gouvernance provinciale et de gestion fiscale. Nos recensements fiscaux, nos réglementations du marché et nos réseaux de crédit représentent des siècles d'art politique pratique."

 maratha_fiscal_administration: "Administration fiscale"
 maratha_fiscal_administration_desc: "La confédération Marathe a démontré que la collecte décentralisée des revenus, combinée à une puissance militaire efficace et à une habileté politique, peut bâtir un État formidable à partir d'un début fragmenté. Nos institutions fiscales reflètent cette tradition pragmatique."

 # ============================================================
 # Regional Literacy Catch-Up Advances
 # ============================================================
 cc_western_literacy_age2: "Alphabétisation populaire"
 cc_western_literacy_age2_desc: "La diffusion progressive de la culture écrite, à travers les écritures vernaculaires, les registres des guildes, les registres paroissiaux et les pamphlets civiques, a commencé à s'étendre au-delà des écoles cathédrales et des salles d'université pour atteindre les foyers des soldats ordinaires et des gens des campagnes. Notre royaume investit dans l'infrastructure de l'apprentissage commun."

 cc_western_literacy_age4: "L'imprimerie se démocratise"
 cc_western_literacy_age4_desc: "Une génération après que l'imprimerie a transformé le discours des élites, des almanachs bon marché, des ballades et des Bibles en langue vernaculaire ont commencé à atteindre les villages et les casernes. Le soldat lettré et le paysan lecteur ne sont plus des curiosités rares ; ils sont les fondations d'un royaume moderne."

 cc_colonial_literacy_age4: "Réseaux de paroisses coloniales"
 cc_colonial_literacy_age4_desc: "Les écoles de mission et les églises paroissiales, implantées aux côtés des comptoirs commerciaux et des plantations, ont créé une classe bourgeoise coloniale lettrée capable de gérer des comptes lointains, d'enregistrer des levés topographiques et de correspondre avec la métropole. Cette alphabétisation administrative est le fondement d'un empire colonial durable."

 cc_east_asian_literacy_age4: "Imprimerie commerciale et savante"
 cc_east_asian_literacy_age4_desc: "Les industries d'impression matures de nos grandes villes produisent désormais non seulement des textes classiques pour les étudiants, mais aussi des encyclopédies populaires, des manuels commerciaux et des fictions grand public pour un large lectorat marchand. Cette explosion de la culture imprimée renforce les classes instruites qui alimentent tant notre bureaucratie que nos maisons de commerce."
