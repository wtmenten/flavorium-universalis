l_spanish:
 rule_cc_france_containment: "C&C: Francia, Contención de los Países Bajos"
 rule_cc_france_containment_desc: "Otorga a los vecinos de cultura de las Tierras Bajas de Francia un antagonismo elevado hacia Francia al inicio de la partida, que decayendo durante 200 años."
 setting_cc_france_containment_on: "Habilitado"
 setting_cc_france_containment_on_desc: "Francia comienza bajo presión de sus vecinos de los Países Bajos, reflejando las ansiedades históricas sobre la hegemonía francesa."
 setting_cc_france_containment_off: "Desactivado"
 setting_cc_france_containment_off_desc: "Francia comienza sin antagonismo adicional por parte de sus vecinos."

 rule_cc_mamluk_start: "C&C: Mamelucos, Tensión del dominio extranjero"
 rule_cc_mamluk_start_desc: "Otorga a los mamelucos penalizaciones iniciales que reflejan su estatus como una casta militar extranjera que gobierna sobre los egipcios nativos."
 setting_cc_mamluk_start_on: "Habilitado"
 setting_cc_mamluk_start_on_desc: "Los mamelucos comienzan con una penalización permanente de leva campesina y una tensión militar decreciente que se aliviará a lo largo de 200 años."
 setting_cc_mamluk_start_off: "Desactivado"
 setting_cc_mamluk_start_off_desc: "Los mamelucos comienzan sin penalizaciones históricas."

 rule_cc_tur_start: "C&C: Otomanos, Colonización"
 rule_cc_tur_start_desc: "Impedir que los otomanos colonicen."
 setting_cc_tur_start_on: "Impedir la colonización"
 setting_cc_tur_start_on_desc: "Se impide permanentemente que los otomanos colonicen."
 setting_cc_tur_start_off: "Permitir la colonización"
 setting_cc_tur_start_off_desc: "Los otomanos pueden seguir colonizando con normalidad."

 rule_cc_hyw_flavor: "C&C: Francia, ambientación de la Guerra de los Cien Años"
 rule_cc_hyw_flavor_desc: "Habilita el sabor histórico para la Guerra de los Cien Años: levas iniciales y modificadores de estamentos para Francia e Inglaterra, acumulación de resultados de guerra, eventos de presión por defección de vasallos, reacciones de potencias observadoras y la decisión de Reemplazar Gobernante de Apanage."
 setting_cc_hyw_flavor_on: "Habilitado"
 setting_cc_hyw_flavor_on_desc: "Francia e Inglaterra comienzan con modificadores históricos; los resultados de la guerra acumulan efectos en las levas y los estamentos con el tiempo; Borgoña, Bretaña y otros vasallos pueden vacilar cuando su soberano sufra una derrota."
 setting_cc_hyw_flavor_off: "Desactivado"
 setting_cc_hyw_flavor_off_desc: "No se activarán modificadores iniciales específicos de HYW, eventos acumulativos ni presiones de defección de vasallos."


 rule_cc_one_small_loan: "C&C: Husitas - Eventos de un pequeño préstamo"
 rule_cc_one_small_loan_desc: "Habilita un evento ligeramente absurdo en el que el papa interactúa con la potencia católica más fuerte del juego, ofreciéndole dinero a cambio de asistencia."
 setting_cc_one_small_loan_on: "Habilitado"
 setting_cc_one_small_loan_on_desc: "Los eventos de un pequeño préstamo papal se activarán dependiendo de tu postura durante las cruzadas husitas."
 setting_cc_one_small_loan_off: "Desactivado"
 setting_cc_one_small_loan_off_desc: "No se activarán eventos de pequeños préstamos papales."

 rule_cc_ai_personalities: "C&C: Personalidades de IA dinámicas"
 rule_cc_ai_personalities_desc: "Controla si los países de la IA evolucionan sus grandes estrategias a través de las eras y cambian en respuesta a los eventos del juego."
 setting_cc_ai_personalities_off: "Vainilla"
 setting_cc_ai_personalities_off_desc: "Sin cambios. Las personalidades de la IA utilizan únicamente las asignaciones históricas originales y reglas aleatorias."
 setting_cc_ai_personalities_historical: "Histórico dinámico"
 setting_cc_ai_personalities_historical_desc: "Las grandes potencias siguen arcos de personalidad basados históricamente a través de las eras. Los puntos de inflexión clave activan eventos de elección con una opción histórica y una o dos alternativas."
 setting_cc_ai_personalities_dynamic: "Solo deriva dinámica"
 setting_cc_ai_personalities_dynamic_desc: "Añade cambios de personalidad basados en el contexto para todos los países de la IA, que varían en respuesta a la guerra, el poder, la riqueza y las circunstancias."
 setting_cc_ai_personalities_full: "Histórico dinámico + Deriva"
 setting_cc_ai_personalities_full_desc: "Añade eventos de deriva basados en el contexto para todos los países de la IA, cambiando las personalidades en respuesta a la guerra, el poder, la riqueza y las circunstancias. Las grandes potencias siguen arcos de personalidad informados históricamente a través de las eras. Los puntos de inflexión clave activan eventos de elección con una opción histórica y una o dos alternativas. Los eventos históricos siguen protegiendo contra la deriva aleatoria durante ~20 años después de activarse."

 rule_cc_wealth_events: "C&C: Eventos de Acumulación de Riqueza"
 rule_cc_wealth_events_desc: "Cuando está activado, los países que acumulen oro por encima de 100 veces sus ingresos mensuales se enfrentarán periódicamente a eventos que representan demandas de la corte y presión económica."
 setting_cc_wealth_events_on: "Habilitado"
 setting_cc_wealth_events_on_desc: "Los eventos de acaparamiento de riqueza se activan en el pulso bianual cuando se alcanza el umbral de oro."
 setting_cc_wealth_events_off: "Desactivado"
 setting_cc_wealth_events_off_desc: "No se activarán eventos de acumulación de riqueza."

 rule_cc_subject_types: "C&C: Tipos de súbditos personalizados"
 rule_cc_subject_types_desc: "Controla si están disponibles los tipos de vasallos personalizados del mod (socios de unión personal, estados sombra y clientes, enclaves de élite, compañías privilegiadas, comunas culturales, gobernaciones provinciales, granjas de impuestos, marcas, miembros federales y los demás). El interruptor condiciona cada avance que desbloquea estos vasallos."
 setting_cc_subject_types_on: "Habilitado"
 setting_cc_subject_types_on_desc: "Los avances que desbloquean los tipos de súbditos personalizados del mod aparecen en el árbol tecnológico de cada país, junto con sus privilegios de estamento y reformas gubernamentales."
 setting_cc_subject_types_player_only: "Solo jugador"
 setting_cc_subject_types_player_only_desc: "Solo los países controlados por humanos pueden investigar estos avances y crear súbditos personalizados. Los países de la IA están limitados a los tipos de súbditos básicos."
 setting_cc_subject_types_off: "Desactivado"
 setting_cc_subject_types_off_desc: "Esos avances nunca aparecen, por lo que no se pueden crear súbditos personalizados. Solo permanecen los tipos de súbditos básicos y las cadenas de eventos relacionadas permanecen inactivas."

 rule_cc_subject_bonds: "C&C: Vínculos Señor-Vasallo"
 rule_cc_subject_bonds_desc: "Cuando está activado, rastrea 5 dimensiones de relación (económica, militar, política, cultural, personal) a través de sujetos extensos a largo plazo. Las elecciones del jugador entre las Eras 1-4 determinan cómo se comportan los sujetos en la Era de las Revoluciones. La mayor parte del seguimiento está oculto; las consecuencias aparecen décadas después."
 setting_cc_subject_bonds_on: "Habilitado"
 setting_cc_subject_bonds_on_desc: "Cadenas de eventos, sentimientos y perfiles de súbditos multidimensionales y detallados que abarcan toda la partida."
 setting_cc_subject_bonds_off: "Desactivado"
 setting_cc_subject_bonds_off_desc: "Relaciones normales entre súbditos, seguimiento de vínculos y cadenas de eventos desactivados."

 setting_cc_invasion_mexico_on: "Habilitado"
 setting_cc_invasion_mexico_on_desc: "La situación de la Invasión Mexicana se activará para los países elegibles."
 setting_cc_invasion_mexico_off: "Desactivado"
 setting_cc_invasion_mexico_off_desc: "La situación de la Invasión Mexicana no se activará."

 rule_cc_colonial_consolidation: "C&C: Consolidación colonial"
 rule_cc_colonial_consolidation_desc: "Cuando está activado, se disparan cadenas de eventos coloniales medios/tardíos (desde la Era del Absolutismo en adelante) para los imperios coloniales: fricciones fronterizas entre colonias adyacentes de culturas incompatibles, consolidación de colonias afines en virreinatos y el endurecimiento de los regímenes demográficos y laborales coloniales."
 setting_cc_colonial_consolidation_on: "Habilitado"
 setting_cc_colonial_consolidation_on_desc: "Las cadenas de eventos de fricción fronteriza colonial, consolidación del virreinato y eventos laborales/demográficos se activarán a partir de la Era del Absolutismo."
 setting_cc_colonial_consolidation_off: "Desactivado"
 setting_cc_colonial_consolidation_off_desc: "Las cadenas de eventos de consolidación colonial y fricción fronteriza están desactivadas."

 rule_cc_balance_of_power: "C&C: Equilibrio de poder"
 rule_cc_balance_of_power_desc: "Cuando está activado, puede surgir una situación de potencias europeas y del Cercano Oriente de dos polos: un Bloque Preponderante aspirante frenado por una Coalición de Equilibrio. Comienza una vez que una gran potencia adopta la doctrina del equilibrio de poder (Era del Absolutismo) o cuando se abre la era revolucionaria, y termina mediante la hegemonía, un diluvio oriental, una revolución o un Concierto de Europa duradero."
 setting_cc_balance_of_power_on: "Habilitado"
 setting_cc_balance_of_power_on_desc: "La situación del Equilibrio de Poder Europeo se activará para las grandes potencias elegibles."
 setting_cc_balance_of_power_off: "Desactivado"
 setting_cc_balance_of_power_off_desc: "La situación del Equilibrio de Poder Europeo ha sido desactivada."
