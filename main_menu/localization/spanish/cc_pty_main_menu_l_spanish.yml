l_spanish:
 # Flavorium Universalis - Factions: game rule and situation hint

 rule_cc_factions: "C&C: Partidos Políticos"
 rule_cc_factions_desc: "Cuando está activado, el jugador, las grandes potencias y los reinos con 100 o más de desarrollo tienen cuatro partidos políticos derivados de sus estamentos, gobierno y era. Cada ministro pertenece a uno. Cada partido vigila sus propios intereses y al gabinete, establece agendas y afecta al reino y a sus ministros. Algunos deben gestionarse o escalarán hasta convertirse en un golpe de estado, una insurrección o un levantamiento. Tus partidos se encuentran en la pestaña de Facciones del Libro de la Corte."
 setting_cc_factions_on: "Activado"
 setting_cc_factions_on_desc: "Los partidos se simulan para tu reino y para los reinos de la IA más grandes, y el Libro de la Corte tiene una pestaña de Facciones."
 setting_cc_factions_off: "Desactivado"
 setting_cc_factions_off_desc: "Sin partidos y sin pestaña de Facciones en el Libro de la Corte."

