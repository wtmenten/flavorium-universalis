l_spanish:

 # ============================================================
 # Late Renaissance Ideas (Age of Discovery)
 # ============================================================
 late_renaissance_ideas: "Ideas del Renacimiento tardío"
 late_renaissance_ideas_desc: "El pensamiento humanista y el renacimiento clásico que definieron el Renacimiento no han terminado con una nueva era. Nuestros eruditos y administradores continúan profundizando en sus frutos en cuanto a alfabetización, razón y orden cívico."

 renaissance_natural_philosophy: "Filosofía natural"
 renaissance_natural_philosophy_desc: "Los pensadores renacentistas desviaron su mirada de las escrituras hacia la naturaleza misma, catalogando plantas, estudiando el cuerpo humano y sentando las bases de las ciencias empíricas. Tales conocimientos mejoran la salud y la longevidad de nuestro pueblo."

 renaissance_church_patronage: "Patrocinio eclesiástico del aprendizaje"
 renaissance_church_patronage_desc: "La Iglesia ha sido durante mucho tiempo una mecenas del arte y el saber. Al dirigir la riqueza eclesiástica hacia las universidades y los scriptoria, aceleramos la difusión de ideas entre nuestra población."

 scholastic_reform_advance: "Reforma escolástica"
 scholastic_reform_advance_desc: "Los teólogos católicos han fusionado la lógica aristotélica con la doctrina cristiana, creando una cultura intelectual rigurosa en nuestros monasterios y escuelas catedralicias. Esta tradición de disputa ordenada eleva la alfabetización de nuestro reino."

 islamic_observatory_tradition: "Tradición de observatorio islámico"
 islamic_observatory_tradition_desc: "Los grandes observatorios de Samarcanda, El Cairo y Estambul representan una tradición islámica de siglos de conocimientos astronómicos y médicos precisos. Nuestros eruditos mantienen esta tradición, avanzando en la comprensión del funcionamiento del mundo."

 ottoman_polymath_networks: "Redes de polímatas"
 ottoman_polymath_networks_desc: "Las grandes ciudades del mundo islámico albergan a polímatas que se mueven libremente entre las matemáticas, la medicina, la filosofía y la ingeniería. Estas redes de hombres eruditos transportan el conocimiento a través de nuestro reino y más allá de nuestras fronteras."

 renaissance_civic_humanism: "Humanismo civil"
 renaissance_civic_humanism_desc: "Los pensadores humanistas sostienen que la virtud cívica —entendida como la participación activa en la gobernanza, la retórica y el deber público— es la máxima expresión de la excelencia humana. Nuestros administradores adoptan este ideal, sirviendo al estado con un propósito renovado."

 renaissance_court_culture: "Cultura cortesana del Renacimiento"
 renaissance_court_culture_desc: "Las cortes principescas de Italia se han convertido en modelos de aprendizaje refinado y mecenazgo artístico. Nuestra propia corte adopta estos ideales: los gobernantes que apoyan a poetas, arquitectos y filósofos proyectan autoridad a través de la magnificencia cultural."

 civic_republic_ideals: "Ideales republicanos civiles"
 civic_republic_ideals_desc: "El republicanismo renacentista se basó en la antigua Roma para argumentar que los ciudadanos libres que deliberan juntos producen leyes más sabias que cualquier monarca por sí solo. Las instituciones de nuestra república se ven fortalecidas por este legado de discurso cívico."

 east_asian_classical_revival: "Renacimiento clásico"
 east_asian_classical_revival_desc: "Los eruditos neoconfucianos han renovado su atención a los textos clásicos de la antigüedad, reexaminando los Cuatro Libros y los Cinco Clásicos con comentarios frescos. Este renacimiento profundiza la calidad de nuestros administradores formados mediante exámenes."

 chinese_examination_refinement: "Refinamiento del Sistema de Exámenes"
 chinese_examination_refinement_desc: "Generaciones de refinamiento académico han convertido el sistema de exámenes en un instrumento extraordinariamente preciso para seleccionar administradores capaces. Nuestra burocracia meritocrática opera con una eficiencia inigualable."

 italian_masters_advance: "Maestros italianos"
 italian_masters_advance_desc: "Los talleres de Florencia, Venecia y Milán han producido una línea ininterrumpida de maestros en pintura, escultura y arquitectura. Nuestras instituciones culturales heredan esta tradición de excelencia, atrayendo a los mejores talentos artísticos."

 # ============================================================
 # Late Discovery Ideas (Age of Reformation)
 # ============================================================
 late_discovery_ideas: "Ideas de descubrimientos tardíos"
 late_discovery_ideas_desc: "Una generación de exploradores ha trazado los contornos de un mundo mucho más grande de lo que imaginaron nuestros antepasados. Sus conocimientos sobre costas, corrientes y mercancías se convierten ahora en la base de un comercio duradero y de la ambición colonial."

 systematic_cartography: "Cartografía Sistemática"
 systematic_cartography_desc: "Donde los primeros exploradores navegaban basándose en rumores y estimaciones, una nueva generación de cartógrafos aporta precisión matemática al arte del mapa. Las cartas precisas amplían el alcance efectivo de nuestros mercaderes y embajadores."

 discovery_colonial_consolidation: "Consolidación colonial"
 discovery_colonial_consolidation_desc: "La era de los descubrimientos temerarios está dando paso a una consolidación cuidadosa. Los asentamientos, la administración y la comunicación regular transforman los puntos de apoyo distantes en posesiones fiables, mejorando la lealtad de nuestros reinos vasallos."

 maritime_republic_trade: "Redes comerciales de repúblicas marítimas"
 maritime_republic_trade_desc: "Las repúblicas mercantiles han comprendido hace tiempo que el beneficio no reside en el territorio, sino en el control del intercambio. Su legado de derecho mercantil, gremios de comerciantes y redes de factorías otorga a nuestra república ventajas decisivas en el comercio global."

 east_asian_maritime_tribute: "Redes de tributo marítimo"
 east_asian_maritime_tribute_desc: "Nuestras grandes flotas han proyectado su poder durante mucho tiempo a través de relaciones de tributo con los pueblos marítimos de ultramar. Sistematizar estas conexiones amplía nuestro alcance naval y refuerza la lealtad de los dependientes distantes."

 missionary_expansion_advance: "Expansión Misionera"
 missionary_expansion_advance_desc: "La fe sigue a la bandera. Nuestros misioneros viajan junto a mercaderes y soldados, convirtiendo poblaciones y estableciendo iglesias en tierras lejanas. Su labor amplía tanto el alcance espiritual como el administrativo de nuestro reino."

 colonial_ecclesiastical_order: "Órdenes eclesiásticas coloniales"
 colonial_ecclesiastical_order_desc: "Las grandes órdenes religiosas (dominicos, franciscanos, jesuitas) han establecido misiones en todos nuestros territorios coloniales, construyendo escuelas e iglesias que anclan la civilización europea en el nuevo mundo."

 iberian_colonial_doctrine: "Doctrina Colonial Ibérica"
 iberian_colonial_doctrine_desc: "España y Portugal han desarrollado una sofisticada teoría de administración colonial: concesiones de encomiendas, virreinatos y un sistema comercial transatlántico que canaliza la riqueza de los nuevos mundos hacia las arcas ibéricas."

 iberian_heavy_fleet: "Doctrina de la Flota del Atlántico"
 iberian_heavy_fleet_desc: "La carraca y el galeón, barcos fuertemente armados y de casco profundo capaces de cruzar océanos, representan la maestría ibérica de la guerra oceánica. Nuestra doctrina naval enfatiza la capacidad del navío de línea para proyectar poder a través de cualquier mar."

 overland_trade_routes: "Rutas comerciales terrestres"
 overland_trade_routes_desc: "Mientras las potencias europeas luchan por encontrar rutas marítimas alrededor de nuestras tierras, nosotros comandamos las antiguas arterias del comercio terrestre: la Ruta de la Seda, las rutas del incienso, las grandes caravanas que han conectado Oriente y Occidente durante milenios."

 silk_road_revival: "Renacimiento de la Ruta de la Seda"
 silk_road_revival_desc: "Al asegurar las rutas de las caravanas, invertir en caravasares y negociar acuerdos de paso seguro, restauramos la Ruta de la Seda a algo de su antigua gloria, canalizando la riqueza de Asia a través de nuestros mercados."

 # ============================================================
 # Late Reformation Ideas (Age of Absolutism)
 # ============================================================
 late_reformation_ideas: "Ideas de reforma tardía"
 late_reformation_ideas_desc: "Un siglo de agitación religiosa ha agotado a muchos, pero su legado es real: las confesiones son más claras, las instituciones más conscientes de sí mismas y los acuerdos logrados con esfuerzo otorgan al reino una estabilidad cautelosa que las generaciones anteriores no podrían haber imaginado."

 confessional_state_building: "Construcción del Estado confesional"
 confessional_state_building_desc: "La lección extraída de las Guerras de Religión es que un reino estable requiere una confesión unificada, o al menos una gestionada cuidadosamente. Las instituciones estatales confesionales formalizan la relación entre la iglesia y el gobierno."

 protestant_church_state: "Estado-Iglesia protestante"
 protestant_church_state_desc: "Los reformadores protestantes insistieron en que la Palabra de Dios, accesible para todo aquel que sepa leer, debe ser el fundamento de un reino cristiano. Su énfasis en la alfabetización y las Escrituras en lengua vernácula ha hecho que las tierras protestantes estén consistentemente mejor educadas."

 lutheran_education_advance: "Legado Educativo Luterano"
 lutheran_education_advance_desc: "La insistencia de Lutero en que cada cristiano leyera las Escrituras por sí mismo impulsó la creación de escuelas parroquiales en toda la Europa protestante. Esta inversión popular en la alfabetización se ha convertido en una ventaja estructural permanente."

 catholic_confession_legacy: "Legado confesional católico"
 catholic_confession_legacy_desc: "El Concilio de Trento revitalizó las instituciones católicas, aclarando la doctrina, reformando el clero y estableciendo nuevas órdenes religiosas dedicadas a la educación y al cuidado pastoral. Esta Iglesia renovada es un poderoso motor de cohesión social."

 jesuitical_reform_advance: "Redes de reforma jesuita"
 jesuitical_reform_advance_desc: "La Compañía de Jesús gestiona escuelas, universidades y misiones en tres continentes, transmitiendo los métodos del riguroso catolicismo tridentino allí donde ha llegado el colonialismo europeo. Su red amplía nuestro alcance institucional."

 sunni_confessional_state: "Consolidación confesional"
 sunni_confessional_state_desc: "En una época en la que las potencias europeas luchan por la doctrina, los gobernantes islámicos se enfrentan a sus propias opciones entre la ortodoxia sunní, la devoción chiíta y la práctica sincrética. Invertir en una identidad confesional clara fortalece nuestra legitimidad religiosa y coherencia demográfica."

 ottoman_millet_advance: "Sistema Administrativo de Millet"
 ottoman_millet_advance_desc: "El sistema de millet otomano, que otorga autonomía legal a las comunidades religiosas reconocidas bajo sus propias instituciones, ha demostrado ser una herramienta notablemente eficaz para gobernar un imperio diverso. Refinamos y extendemos este modelo."

 post_war_religious_settlement: "Acuerdo religioso posguerra"
 post_war_religious_settlement_desc: "Décadas de guerra religiosa han producido un pragmatismo agotado: la mayoría de los gobernantes aceptan ahora que forzar una conformidad religiosa universal es demasiado costoso. Los acuerdos negociados, cambiando una tolerancia a regañadientes por lealtad política, aportan una estabilidad frágil pero real."

 westphalian_advance: "Doctrina de la Soberanía Westfaliana"
 westphalian_advance_desc: "La Paz de Westfalia estableció un nuevo marco para la política europea: los estados son soberanos dentro de sus propias fronteras, y el principio de cuius regio, eius religio otorga a los gobernantes autoridad sobre la identidad confesional de sus reinos."

 indian_syncretic_tradition: "Tolerancia Sincrética"
 indian_syncretic_tradition_desc: "La extraordinaria diversidad religiosa de la India ha exigido durante mucho tiempo que sus gobernantes practiquen un grado de tolerancia desconocido en Europa. Al institucionalizar el respeto por múltiples tradiciones, hacemos que nuestro reino sea menos resistente al cambio y más estable."

 mughal_sulh_e_kul: "Sulh-e-Kul"
 mughal_sulh_e_kul_desc: "La doctrina de sulh-e-kul de Akbar, o paz universal, sostenía que un gobernante sabio se sitúa por encima de las divisiones sectarias, obteniendo legitimidad de todos sus súbditos independientemente de su fe. Esta filosofía de soberanía inclusiva fortalece nuestros vínculos con diversos pueblos súbditos."

 indian_court_tolerance: "Corte de la Tolerancia Universal"
 indian_court_tolerance_desc: "Nuestra corte se ha convertido en un lugar de encuentro para eruditos de todas las tradiciones: pandits hindúes, ulama musulmanes, monjes jainistas, maestros sij y misioneros europeos encuentran todos una audiencia acogedora. Esta cultura de indagación enriquece nuestra administración."

 east_asian_state_orthodoxy: "Ortodoxia estatal"
 east_asian_state_orthodoxy_desc: "Al alinear el ritual estatal y la práctica institucional con una tradición ortodoxa, ya sea confuciana, budista o sintoísta, nuestro gobierno proyecta continuidad, legitimidad y coherencia cultural en todo nuestro reino."

 confucian_bureaucratic_faith: "Fe burocrática confuciana"
 confucian_bureaucratic_faith_desc: "La filosofía estatal neoconfuciana ha fusionado el ritual, la ética y la técnica administrativa en un todo armonioso. Nuestros funcionarios formados mediante exámenes encarnan esta síntesis: su gobernanza es inseparable de su cultivo moral."

 # ============================================================
 # Late Absolutism Ideas (Age of Revolutions)
 # ============================================================
 late_absolutism_ideas: "Ideas de absolutismo tardío"
 late_absolutism_ideas_desc: "La era de la monarquía absoluta ha pasado su cenit, pero sus logros perduran: las burocracias centralizadas, los ejércitos permanentes y las finanzas estatales racionalizadas son ahora la base desde la cual deben partir incluso los reformadores."

 enlightened_administration: "Administración ilustrada"
 enlightened_administration_desc: "El pensamiento de la Ilustración ha llegado a los pasillos del poder. Gobernantes y ministros que han leído a Montesquieu, Voltaire y a los enciclopedistas están aplicando principios racionalistas al gobierno, simplificando las leyes, reformando la fiscalidad y ampliando la educación."

 enlightened_despotism_advance: "Despotismo ilustrado"
 enlightened_despotism_advance_desc: "Federico de Prusia, Catalina de Rusia y José de Austria, los grandes déspotas ilustrados, demuestran que el poder absoluto no tiene por qué significar un poder arbitrario. Un monarca que gobierna mediante la razón, la ley y el interés público puede lograr reformas que ningún parlamento se atrevería a intentar."

 reform_from_above: "Reforma desde arriba"
 reform_from_above_desc: "Ante la amenaza de una revolución desde abajo, los gobernantes sabios optan por la reforma desde arriba. Abolir la servidumbre, codificar las leyes y abrir escuelas compra la lealtad de nuevos sectores sociales mientras se preservan los elementos esenciales de la autoridad monárquica."

 mercantilist_legacy_advance: "Legado mercantilista"
 mercantilist_legacy_advance_desc: "Dos siglos de política mercantilista han creado instituciones comerciales sofisticadas: compañías reguladas, regímenes aduaneros, leyes de navegación y bancos estatales. Nuestra república hereda este aparato y lo aprovecha plenamente para su ventaja comercial."

 colonial_mercantile_system: "Sistema mercantil colonial"
 colonial_mercantile_system_desc: "Nuestro imperio colonial es ahora un sistema económico maduro: la agricultura de plantación, las compañías comerciales monopolistas, las leyes de navegación y los flujos de plata convergen para canalizar la riqueza colonial hacia la metrópoli. Este sistema, perfeccionado a lo largo de generaciones, opera con una eficiencia formidable."

 professional_standing_army: "Ejército profesional permanente"
 professional_standing_army_desc: "La revolución militar ha alcanzado su culminación: cada potencia importante mantiene ahora un ejército permanente, pagado y uniformado, en lugar de depender de levas feudales o mercenarios. Nuestro ejército profesional es disciplinado, está abastecido y listo para la campaña en cualquier momento."

 prussian_discipline_advance: "Disciplina prusiana"
 prussian_discipline_advance_desc: "El ejército de Prusia se ha convertido en la envidia y el modelo de Europa: un entrenamiento implacable, marchas cadenciadas y una cultura de obediencia que hace del mosquetero prusiano el soldado más preciso y controlable en cualquier campo de batalla."

 prussian_general_staff: "Sistema de Estado Mayor"
 prussian_general_staff_desc: "La innovación prusiana de un estado mayor permanente —oficiales que planifican campañas, cartografían el terreno y simulan escenarios antes de que comiencen las batallas— transforma la guerra de un arte en una ciencia. Nuestros oficiales luchan con información de la que carecen sus enemigos."

 ottoman_military_reform: "Reforma Militar del Nuevo Orden"
 ottoman_military_reform_desc: "Los visires y sultanes reformistas han reconocido que los métodos militares europeos representan un desafío genuino. Las unidades de infantería del nuevo modelo, entrenadas en el ejercicio europeo y equipadas con armas estandarizadas, representan una inversión modernizadora decisiva."

 qing_administrative_consolidation: "Consolidación administrativa Qing"
 qing_administrative_consolidation_desc: "La conquista Qing no ha reemplazado la cultura administrativa china; la ha absorbido y perfeccionado. Una burocracia dual manchú-han, un sistema de exámenes ampliado y una rigurosa supervisión provincial otorgan a nuestro imperio un aparato administrativo formidable."

 east_asian_bureaucratic_peak: "Cúspide burocrática"
 east_asian_bureaucratic_peak_desc: "Nuestra tradición administrativa ha alcanzado la cumbre del refinamiento. El sistema de exámenes, los ministerios centrales, la jerarquía provincial y el sistema de vigilancia mutua han sido ajustados con una precisión extraordinaria a lo largo de muchas generaciones."

 indian_administrative_sophistication: "Sofisticación Administrativa"
 indian_administrative_sophistication_desc: "Los estados indios han desarrollado elaboradas tradiciones de administración de ingresos, gobierno provincial y gestión fiscal. Nuestros censos de ingresos, regulaciones de mercado y redes de crédito representan siglos de arte de gobernar práctico."

 maratha_fiscal_administration: "Administración fiscal"
 maratha_fiscal_administration_desc: "La confederación maratha ha demostrado que la recaudación de ingresos descentralizada, combinada con un poder militar eficaz y habilidad política, puede construir un estado formidable a partir de un inicio fragmentado. Nuestras instituciones fiscales reflejan esta tradición pragmática."

 # ============================================================
 # Regional Literacy Catch-Up Advances
 # ============================================================
 cc_western_literacy_age2: "Alfabetización popular"
 cc_western_literacy_age2_desc: "La gradual difusión de la cultura escrita, a través de las escrituras vernáculas, los registros de los gremios, los registros parroquiales y los panfletos cívicos, ha comenzado a llegar más allá de las escuelas catedralicias y las salas universitarias hasta los hogares de los soldados comunes y la gente del campo. Nuestro reino invierte en la infraestructura del aprendizaje común."

 cc_western_literacy_age4: "La impresión masiva llega al pueblo"
 cc_western_literacy_age4_desc: "Una generación después de que la imprenta transformara el discurso de las élites, los almanaques baratos, las baladas y las Biblias en lengua vernácula han empezado a llegar a las aldeas y los cuarteles. El soldado alfabetizado y el campesino lector ya no son curiosidades raras; son los cimientos de un reino moderno."

 cc_colonial_literacy_age4: "Redes parroquiales coloniales"
 cc_colonial_literacy_age4_desc: "Las escuelas misionales y las iglesias parroquiales, implantadas junto a los puestos comerciales y las plantaciones, han creado una clase burguesa colonial alfabetizada capaz de gestionar cuentas distantes, registrar catastros de tierras y corresponderse con la metrópoli. Esta alfabetización administrativa es la base de un imperio colonial duradero."

 cc_east_asian_literacy_age4: "Imprenta Comercial y Erudita"
 cc_east_asian_literacy_age4_desc: "Las maduras industrias editoriales de nuestras grandes ciudades producen ahora no solo textos clásicos para los estudiantes, sino enciclopedias populares, manuales comerciales y ficción popular para un amplio público lector mercantil. Esta explosión de la cultura impresa profundiza las clases educadas que integran tanto nuestra burocracia como nuestras casas comerciales."
