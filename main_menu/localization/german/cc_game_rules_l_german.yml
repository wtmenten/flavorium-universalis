l_german:
 rule_cc_france_containment: "C&C: Frankreich, Eindämmung der Niederlande"
 rule_cc_france_containment_desc: "Verleiht Frankreichs Nachbarn mit niederländischer Kultur zu Spielbeginn einen erhöhten Antagonismus gegenüber Frankreich, der über 200 Jahre hinweg abnimmt."
 setting_cc_france_containment_on: "Aktiviert"
 setting_cc_france_containment_on_desc: "Frankreich beginnt unter Druck seiner Nachbarn in den Niederlanden, was die historischen Ängste vor einer französischen Hegemonie widerspiegelt."
 setting_cc_france_containment_off: "Deaktiviert"
 setting_cc_france_containment_off_desc: "Frankreich startet ohne zusätzlichen Antagonismus seitens seiner Nachbarn."

 rule_cc_mamluk_start: "C&C: Mamluken, Belastung durch Fremdherrschaft"
 rule_cc_mamluk_start_desc: "Verleiht den Mamluken Startstrafen, die ihren Status als ausländische Militärkaste widerspiegeln, welche über die einheimischen Ägypter herrscht."
 setting_cc_mamluk_start_on: "Aktiviert"
 setting_cc_mamluk_start_on_desc: "Die Mamluken beginnen mit einer permanenten Strafe auf das Bauernaufgebot und einer abnehmenden militärischen Belastung, die über 200 Jahre hinweg nachlässt."
 setting_cc_mamluk_start_off: "Deaktiviert"
 setting_cc_mamluk_start_off_desc: "Die Mamluken starten ohne historische Strafen."

 rule_cc_tur_start: "C&C: Osmanen, Kolonisation"
 rule_cc_tur_start_desc: "Verhindere, dass die Osmanen Kolonien gründen."
 setting_cc_tur_start_on: "Kolonisation verhindern"
 setting_cc_tur_start_on_desc: "Die Osmanen können dauerhaft nicht mehr kolonisieren."
 setting_cc_tur_start_off: "Kolonisation erlauben"
 setting_cc_tur_start_off_desc: "Die Osmanen können weiterhin wie gewohnt kolonisieren."

 rule_cc_hyw_flavor: "C&C: Frankreich, Hundertjährige Kriege Flavor"
 rule_cc_hyw_flavor_desc: "Aktiviert historischen Flavor für den Hundertjährigen Krieg: Start-Aufgebote und Ständemodifikatoren für Frankreich und England, Stapelung von Kriegsausgängen, Ereignisse zum Druck auf abtrünnige Vasallen, Reaktionen von Beobachterstaaten und die Entscheidung „Herrscher der Appanage ersetzen“."
 setting_cc_hyw_flavor_on: "Aktiviert"
 setting_cc_hyw_flavor_on_desc: "Frankreich und England starten mit historischen Modifikatoren; Kriegsausgänge stapeln über Zeit Aufgebot- und Ständeeffekte; Burgund, Bretagne und andere Vasallen können wanken, wenn ihr Suzerän eine Niederlage erleidet."
 setting_cc_hyw_flavor_off: "Deaktiviert"
 setting_cc_hyw_flavor_off_desc: "Es werden keine HYW-spezifischen Startmodifikatoren, stapelbaren Ereignisse oder Druck zur Vasallendefektion ausgelöst."


 rule_cc_one_small_loan: "C&C: Hussiten - Ereignisse zum Kleinkredit"
 rule_cc_one_small_loan_desc: "Aktiviert ein leicht skurriles Ereignis, bei dem der Papst mit der stärksten katholischen Spielermacht interagiert und ihr Geld im Austausch für Unterstützung anbietet."
 setting_cc_one_small_loan_on: "Aktiviert"
 setting_cc_one_small_loan_on_desc: "Die Ereignisse zu den kleinen papstlichen Krediten werden je nach deiner Haltung während der Hussitenkreuzzüge ausgelöst."
 setting_cc_one_small_loan_off: "Deaktiviert"
 setting_cc_one_small_loan_off_desc: "Es werden keine Ereignisse für kleine päpstliche Kredite ausgelöst."

 rule_cc_ai_personalities: "C&C: Dynamische KI-Persönlichkeiten"
 rule_cc_ai_personalities_desc: "Steuert, ob KI-Staaten ihre Großstrategien über die Zeitalter hinweg weiterentwickeln und als Reaktion auf Spielereignisse anpassen."
 setting_cc_ai_personalities_off: "Vanilla"
 setting_cc_ai_personalities_off_desc: "Keine Änderungen. KI-Persönlichkeiten verwenden nur die historischen Standardzuweisungen und Zufallsregeln."
 setting_cc_ai_personalities_historical: "Dynamisch Historisch"
 setting_cc_ai_personalities_historical_desc: "Großmächte folgen über die Zeitalter hinweg historisch informierten Persönlichkeitsbögen. Entscheidende Wendepunkte lösen Auswahlereignisse mit einer historischen Option und ein oder zwei Alternativen aus."
 setting_cc_ai_personalities_dynamic: "Nur dynamische Drift"
 setting_cc_ai_personalities_dynamic_desc: "Fügt kontextgesteuerte Persönlichkeitsänderungen für alle KI-Länder hinzu, die sich als Reaktion auf Krieg, Macht, Reichtum und Umstände verschieben."
 setting_cc_ai_personalities_full: "Dynamisch Historisch + Drift"
 setting_cc_ai_personalities_full_desc: "Fügt kontextgesteuerte Drift-Events für alle KI-Länder hinzu, wodurch sich Persönlichkeiten als Reaktion auf Krieg, Macht, Reichtum und Umstände verschieben. Großmächte folgen über die Zeitalter hinweg historisch informierten Persönlichkeitsbögen. Entscheidende Wendepunkte lösen Wahl-Events mit einer historischen Option und ein oder zwei Alternativen aus. Historische Ereignisse schützen weiterhin für ca. 20 Jahre nach ihrem Auslösen vor zufälligem Drift."

 rule_cc_wealth_events: "C&C: Ereignisse zur Vermögensanhäufung"
 rule_cc_wealth_events_desc: "Wenn aktiviert, werden Länder, die Gold über dem 100-fachen ihres monatlichen Einkommens horten, periodisch Ereignissen gegenüberstehen, die Hofforderungen und wirtschaftlichen Druck darstellen."
 setting_cc_wealth_events_on: "Aktiviert"
 setting_cc_wealth_events_on_desc: "Ereignisse zur Anhäufung von Reichtum werden im zweiyearly Puls ausgelöst, wenn der Goldschwellenwert erreicht ist."
 setting_cc_wealth_events_off: "Deaktiviert"
 setting_cc_wealth_events_off_desc: "Es werden keine Ereignisse zur Vermögensanhäufung ausgelöst."

 rule_cc_subject_types: "C&C: Benutzerdefinierte Vasallentypen"
 rule_cc_subject_types_desc: "Steuert, ob die benutzerdefinierten Vasallentypen der Mod (Personalunionspartner, Schatten- und Klientenstaaten, Elite-Enklaven, Chartergesellschaften, kulturelle Kommunen, Provinzgouvernements, Steuerpachten, Marken, Bundesmitglieder und weitere) verfügbar sind. Der Schalter steuert jeden Fortschritt, der diese Vasallen freischaltet."
 setting_cc_subject_types_on: "Aktiviert"
 setting_cc_subject_types_on_desc: "Die Fortschritte, die die benutzerdefinierten Vasallentypen des Mods freischalten, erscheinen im Technologiebaum für jedes Land, zusammen mit ihren Ständeprivilegien und Regierungsreformen."
 setting_cc_subject_types_player_only: "Nur Spieler"
 setting_cc_subject_types_player_only_desc: "Nur von Menschen gesteuerte Länder können diese Fortschritte erforschen und die benutzerdefinierten Vasallen erstellen. KI-Länder sind auf die Standard-Vasallentypen beschränkt."
 setting_cc_subject_types_off: "Deaktiviert"
 setting_cc_subject_types_off_desc: "Diese Fortschritte treten nie ein, sodass die benutzerdefinierten Vasallen nicht erstellt werden können. Es bleiben nur Standard-Vasallentypen übrig, und die damit verbundenen Ereignisketten bleiben inaktiv."

 rule_cc_subject_bonds: "C&C: Oberherr-Vasall-Bindungen"
 rule_cc_subject_bonds_desc: "Wenn aktiviert, werden 5 Beziehungsdimensionen (wirtschaftlich, militärisch, politisch, kulturell, persönlich) über große langfristige Vasallen hinweg verfolgt. Die Entscheidungen des Spielers in den Zeitaltern 1-4 bestimmen, wie sich die Vasallen im Zeitalter der Revolutionen verhalten. Die meiste Verfolgung ist verborgen; die Folgen zeigen sich erst Jahrzehnte später."
 setting_cc_subject_bonds_on: "Aktiviert"
 setting_cc_subject_bonds_on_desc: "Detaillierte, mehrdimensionale und über den gesamten Spielverlauf reichende Ereignisketten, Einstellungen und Profile für Vasallen."
 setting_cc_subject_bonds_off: "Deaktiviert"
 setting_cc_subject_bonds_off_desc: "Normale Vasallenbeziehungen, Bindungsverfolgung und Ereignisketten sind deaktiviert."

 setting_cc_invasion_mexico_on: "Aktiviert"
 setting_cc_invasion_mexico_on_desc: "Die Situation der mexikanischen Invasion wird für berechtigte Länder ausgelöst."
 setting_cc_invasion_mexico_off: "Deaktiviert"
 setting_cc_invasion_mexico_off_desc: "Die Situation der mexikanischen Invasion wird nicht ausgelöst."

 rule_cc_colonial_consolidation: "C&C: Koloniale Konsolidierung"
 rule_cc_colonial_consolidation_desc: "Wenn aktiviert, lösen sich für Kolonialreiche Ereignisketten der mittleren/späten Kolonialzeit (ab dem Zeitalter des Absolutismus) aus: Grenzreibung zwischen benachbarten Kolonien inkompatibler Kulturen, Konsolidierung verwandter Kolonien zu Vizekönigreichen und die Verfestigung kolonialer Arbeits- und Demografieregime."
 setting_cc_colonial_consolidation_on: "Aktiviert"
 setting_cc_colonial_consolidation_on_desc: "Ereignisketten zu kolonialen Grenzreibungen, der Konsolidierung von Vizekönigreichen sowie Arbeit und Demografie werden ab dem Zeitalter des Absolutismus ausgelöst."
 setting_cc_colonial_consolidation_off: "Deaktiviert"
 setting_cc_colonial_consolidation_off_desc: "Ereignisketten zur kolonialen Konsolidierung und zu Grenzreibung sind deaktiviert."

 rule_cc_balance_of_power: "C&C: Machtgleichgewicht"
 rule_cc_balance_of_power_desc: "Wenn aktiviert, kann in Europa und dem Nahen Osten eine bipolare Großmachtsituation entstehen: ein aufstrebender Preponderanz-Block, der durch eine Ausgleichskoalition gebremst wird. Dies beginnt, sobald eine Großmacht die Gleichgewichtsdoktrin annimmt (Zeitalter des Absolutismus) oder sobald die revolutionäre Ära beginnt, und endet durch Hegemonie, eine östliche Flut, Revolution oder ein dauerhaftes Konzert Europas."
 setting_cc_balance_of_power_on: "Aktiviert"
 setting_cc_balance_of_power_on_desc: "Die Situation des europäischen Mächtegleichgewichts wird für berechtigte Großmächte ausgelöst."
 setting_cc_balance_of_power_off: "Deaktiviert"
 setting_cc_balance_of_power_off_desc: "Die Situation des europäischen Mächtegleichgewichts ist deaktiviert."
