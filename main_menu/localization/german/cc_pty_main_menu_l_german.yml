l_german:
 # Flavorium Universalis - Factions: game rule and situation hint

 rule_cc_factions: "C&C: Politische Parteien"
 rule_cc_factions_desc: "Wenn aktiviert, verfügen der Spieler, die Großmächte und Reiche mit 100 oder mehr Entwicklung über vier politische Parteien, die aus ihren Ständen, der Regierung und dem Zeitalter hervorgehen. Jeder Minister gehört einer davon an. Jede Partei achtet auf ihre eigenen Anliegen sowie das Kabinett, setzt Agenden fest und beeinflusst das Reich und seine Minister. Einige müssen beachtet werden, sonst eskalieren sie zu einem Putsch, einem Aufstand oder einer Rebellion. Ihre Parteien befinden sich im Tab Fraktionen des Hofregisters."
 setting_cc_factions_on: "Aktiviert"
 setting_cc_factions_on_desc: "Parteien werden für Ihr Reich sowie für größere KI-Reiche simuliert, und das Hofregister verfügt über einen Tab Fraktionen."
 setting_cc_factions_off: "Deaktiviert"
 setting_cc_factions_off_desc: "Keine Parteien und kein Tab Fraktionen im Hofregister."

