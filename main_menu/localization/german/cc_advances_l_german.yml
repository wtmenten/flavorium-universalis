l_german:

 # ============================================================
 # Late Renaissance Ideas (Age of Discovery)
 # ============================================================
 late_renaissance_ideas: "Ideen der späten Renaissance"
 late_renaissance_ideas_desc: "Das humanistische Denken und die klassische Wiedergeburt, die die Renaissance prägten, haben mit einem neuen Zeitalter nicht geendet. Unsere Gelehrten und Verwalter vertiefen weiterhin deren Früchte in Bildung, Vernunft und bürgerlicher Ordnung."

 renaissance_natural_philosophy: "Naturphilosophie"
 renaissance_natural_philosophy_desc: "Die Denker der Renaissance richteten ihren Blick von den heiligen Schriften weg auf die Natur selbst, katalogisierten Pflanzen, studierten den menschlichen Körper und legten den Grundstein für die empirischen Wissenschaften. Solches Wissen verbessert die Gesundheit und Langlebigkeit unseres Volkes."

 renaissance_church_patronage: "Kirchliche Förderung des Lernens"
 renaissance_church_patronage_desc: "Die Kirche ist seit langem eine Förderin von Kunst und Wissenschaft. Indem wir den kirchlichen Reichtum an Universitäten und Skriptorien lenken, beschleunigen wir die Verbreitung von Ideen in unserer Bevölkerung."

 scholastic_reform_advance: "Scholastische Reform"
 scholastic_reform_advance_desc: "Katholische Theologen haben die aristotelische Logik mit der christlichen Lehre verschmolzen und so eine strenge intellektuelle Kultur in unseren Klöstern und Domschulen geschaffen. Diese Tradition geordneter Disputationen erhöht die Alphabetisierungsrate unseres Reiches."

 islamic_observatory_tradition: "Islamische Observatoriumstradition"
 islamic_observatory_tradition_desc: "Die großen Observatorien von Samarkand, Kairo und Istanbul repräsentieren eine jahrhundertealte islamische Tradition präzisen astronomischen und medizinischen Wissens. Unsere Gelehrten führen diese Tradition fort und erweitern das Verständnis über die Funktionsweise der Welt."

 ottoman_polymath_networks: "Polymath-Netzwerke"
 ottoman_polymath_networks_desc: "Die großen Städte der islamischen Welt sind die Heimat von Polyhistoren, die sich frei zwischen Mathematik, Medizin, Philosophie und Ingenieurwesen bewegen. Diese Netzwerke Gelehrter tragen Wissen durch unser Reich und über unsere Grenzen hinaus."

 renaissance_civic_humanism: "Ziviler Humanismus"
 renaissance_civic_humanism_desc: "Humanistische Denker argumentieren, dass bürgerliche Tugend – also die aktive Teilnahme an der Regierungsführung, Rhetorik und öffentliche Pflicht – der höchste Ausdruck menschlicher Exzellenz ist. Unsere Verwalter bekennen sich zu diesem Ideal und dienen dem Staat mit neuer Entschlossenheit."

 renaissance_court_culture: "Renaissance-Hofkultur"
 renaissance_court_culture_desc: "Die fürstlichen Höfe Italiens sind zu Vorbildern verfeinerter Gelehrsamkeit und künstlerischer Förderung geworden. Unser eigener Hof übernimmt diese Ideale: Herrscher, die Dichter, Architekten und Philosophen unterstützen, strahlen Autorität durch kulturelle Pracht aus."

 civic_republic_ideals: "Zivile republikanische Ideale"
 civic_republic_ideals_desc: "Der Republikanismus der Renaissance griff auf das antike Rom zurück, um zu argumentieren, dass freie Bürger, die gemeinsam beraten, weisere Gesetze schaffen als jeder Monarch allein. Die Institutionen unserer Republik werden durch dieses Erbe des bürgerlichen Diskurses geschärft."

 east_asian_classical_revival: "Klassische Wiedergeburt"
 east_asian_classical_revival_desc: "Neokonfuzianische Gelehrte haben die klassischen Texte der Antike wieder in den Fokus gerückt und untersuchen die Vier Bücher und Fünf Klassiker mit neuen Kommentaren. Diese Wiederbelebung steigert die Qualität unserer durch Prüfungen ausgebildeten Verwalter."

 chinese_examination_refinement: "Verfeinerung des Prüfungssystems"
 chinese_examination_refinement_desc: "Generationen wissenschaftlicher Verfeinerung haben das Prüfungssystem zu einem außerordentlich präzisen Instrument für die Auswahl fähiger Administratoren gemacht. Unsere meritokratische Bürokratie arbeitet mit beispielloser Effizienz."

 italian_masters_advance: "Italienische Meister"
 italian_masters_advance_desc: "Die Werkstätten von Florenz, Venedig und Mailand haben eine ungebrochene Linie von Meistern in der Malerei, Bildhauerei und Architektur hervorgebracht. Unsere kulturellen Institutionen erben diese Tradition der Exzellenz und ziehen die feinsten künstlerischen Talente an."

 # ============================================================
 # Late Discovery Ideas (Age of Reformation)
 # ============================================================
 late_discovery_ideas: "Ideen der späten Entdeckungen"
 late_discovery_ideas_desc: "Eine Generation von Entdeckern hat die Umrisse einer Welt kartiert, die weitaus größer ist, als unsere Vorfahren es sich vorstellten. Ihr Wissen über Küstenlinien, Strömungen und Handelsgüter wird nun zum Fundament für dauerhaften Handel und koloniale Ambitionen."

 systematic_cartography: "Systematische Kartografie"
 systematic_cartography_desc: "Wo frühe Entdecker nach Gerüchten und Schätzungen navigierten, bringt eine neue Generation von Kartografen mathematische Präzision in die Kunst der Karte. Genaue Seekarten erweitern die effektive Reichweite unserer Kaufleute und Botschafter."

 discovery_colonial_consolidation: "Koloniale Konsolidierung"
 discovery_colonial_consolidation_desc: "Die Ära der tollkühnen Entdeckungen weicht einer sorgfältigen Konsolidierung. Besiedlung, Verwaltung und regelmäßige Kommunikation verwandeln ferne Stützpunkte in zuverlässige Besitzungen und verbessern die Loyalität unserer Vasallenreiche."

 maritime_republic_trade: "Handelsnetze maritimer Republiken"
 maritime_republic_trade_desc: "Die Handelsrepubliken haben schon lange erkannt, dass der Profit nicht im Territorium, sondern in der Kontrolle des Austauschs liegt. Ihr Erbe an Handelsrecht, Kaufmannsgilden und Faktorennetzwerken verschafft unserer Republik entscheidende Vorteile im globalen Handel."

 east_asian_maritime_tribute: "Maritime Tributnetzwerke"
 east_asian_maritime_tribute_desc: "Unsere großen Flotten haben schon lange Macht durch Tributbeziehungen zu Seefahrervölkern über die Meere hinweg projiziert. Die Systematisierung dieser Verbindungen erweitert unsere maritime Reichweite und stärkt die Loyalität ferner Abhängigen."

 missionary_expansion_advance: "Missionarische Expansion"
 missionary_expansion_advance_desc: "Der Glaube folgt der Flagge. Unsere Missionare reisen gemeinsam mit Kaufleuten und Soldaten, bekehren die Bevölkerung und errichten Kirchen in fernen Ländern. Ihr Wirken erweitert sowohl die spirituelle als auch die administrative Reichweite unseres Reiches."

 colonial_ecclesiastical_order: "Koloniale Klerikalordenen"
 colonial_ecclesiastical_order_desc: "Die großen religiösen Orden (Dominikaner, Franziskaner, Jesuiten) haben Missionen in unseren Kolonialgebieten errichtet und Schulen sowie Kirchen gebaut, die die europäische Zivilisation in der Neuen Welt verankern."

 iberian_colonial_doctrine: "Iberische Kolonialdoktrin"
 iberian_colonial_doctrine_desc: "Spanien und Portugal haben eine ausgeklügelte Theorie der Kolonialverwaltung entwickelt: Encomienda-Zuweisungen, Vizekönigreiche und ein transatlantisches Handelssystem, das den Reichtum neuer Welten in iberische Kassen leitet."

 iberian_heavy_fleet: "Doktrin der Atlantikflotte"
 iberian_heavy_fleet_desc: "Die Karacke und die Galeone, schwer bewaffnete Schiffe mit tiefem Rumpf, die in der Lage sind, Ozeane zu überqueren, repräsentieren eine iberische Meisterschaft der Seekriegsführung. Unsere Flotten doktrin betont die Fähigkeit des Kriegsschiffs, Macht über jedes Meer zu projizieren."

 overland_trade_routes: "Überland-Handelsrouten"
 overland_trade_routes_desc: "Während die europäischen Mächte darum ringen, Seewege um unsere Länder zu finden, beherrschen wir die alten Arterien des Landhandels: die Seidenstraße, die Weihrauchstraßen, die großen Karawanen, die Ost und West seit Jahrtausenden verbinden."

 silk_road_revival: "Wiederbelebung der Seidenstraße"
 silk_road_revival_desc: "Durch die Sicherung der Karawanenrouten, Investitionen in Karawansereien und das Aushandeln von Passierscheinen führen wir die Seidenstraße zu einem Teil ihres ehemaligen Ruhms zurück und leiten den Reichtum Asiens durch unsere Märkte."

 # ============================================================
 # Late Reformation Ideas (Age of Absolutism)
 # ============================================================
 late_reformation_ideas: "Ideen der späten Reformation"
 late_reformation_ideas_desc: "Ein Jahrhundert religiöser Umbrüche hat viele erschöpft, doch ihr Erbe ist real: Die Konfessionen sind klarer, die Institutionen selbstbewusster, und mühsam errungene Übereinkünfte verleihen dem Reich eine vorsichtige Stabilität, die sich frühere Generationen nicht hätten vorstellen können."

 confessional_state_building: "Konfessioneller Staatsaufbau"
 confessional_state_building_desc: "Die Lehre aus den Religionskriegen ist, dass ein stabiles Reich ein einheitliches Bekenntnis erfordert, oder zumindest eines, das sorgfältig verwaltet wird. Konfessionelle staatliche Institutionen formalisieren die Beziehung zwischen Kirche und Regierung."

 protestant_church_state: "Protestantischer Kirchenstaat"
 protestant_church_state_desc: "Protestantische Reformer bestanden darauf, dass das Wort Gottes, zugänglich für alle, die lesen können, das Fundament eines christlichen Reiches sein müsse. Ihr Fokus auf Alphabetisierung und die Heilige Schrift in der Volkssprache hat dazu geführt, dass protestantische Länder konsequent besser ausgebildet sind."

 lutheran_education_advance: "Luthers bildungspolitisches Erbe"
 lutheran_education_advance_desc: "Luthers Beharren darauf, dass jeder Christ die Schrift selbst lesen sollte, trieb die Gründung von Pfarrschulen in ganz protestantischem Europa voran. Diese Basisinvestition in die Alphabetisierung ist zu einem dauerhaften strukturellen Vorteil geworden."

 catholic_confession_legacy: "Katholisches konfessionelles Erbe"
 catholic_confession_legacy_desc: "Das Konzil von Trient revitalisierte die katholischen Institutionen, indem es die Lehre klärte, den Klerus reformierte und neue religiöse Orden gründete, die sich der Bildung und Seelsorge widmeten. Diese erneuerte Kirche ist ein kraftvoller Motor des sozialen Zusammenhalts."

 jesuitical_reform_advance: "Jesuitische Reformnetzwerke"
 jesuitical_reform_advance_desc: "Der Jesuitenorden betreibt Schulen, Universitäten und Missionen auf drei Kontinenten und verbreitet die Methoden des strengen Tridentinischen Katholizismus dort, wo der europäische Kolonialismus hingelangt ist. Ihr Netzwerk erweitert unsere institutionelle Reichweite."

 sunni_confessional_state: "Konfessionelle Konsolidierung"
 sunni_confessional_state_desc: "In einer Zeit, in der europäische Mächte um Doktrinen streiten, stehen islamische Herrscher vor ihren eigenen Entscheidungen zwischen sunnitischer Orthodoxie, schiitischer Hingabe und synkretistischer Praxis. Die Investition in eine klare konfessionelle Identität stärkt unsere religiöse Legitimität und demografische Kohärenz."

 ottoman_millet_advance: "Millet-Verwaltungssystem"
 ottoman_millet_advance_desc: "Das osmanische Millet-System, das anerkannten Religionsgemeinschaften rechtliche Autonomie unter ihren eigenen Institutionen gewährt, hat sich als bemerkenswert effektives Instrument zur Verwaltung eines vielfältigen Reiches erwiesen. Wir verfeinern und erweitern dieses Modell."

 post_war_religious_settlement: "Religiöse Nachkriegsregelung"
 post_war_religious_settlement_desc: "Jahrzehnte religiöser Kriege haben zu einem erschöpften Pragmatismus geführt: Die meisten Herrscher akzeptieren nun, dass die Erzwingung einer universellen religiösen Konformität zu kostspielig ist. Ausgehandelte Vergleiche, bei denen widerwillige Toleranz gegen politische Loyalität getauscht wird, bringen eine zerbrechliche, aber reale Stabilität."

 westphalian_advance: "Westfälische Souveränitätsdoktrin"
 westphalian_advance_desc: "Der Westfälische Friede schuf einen neuen Rahmen für die europäische Politik: Staaten sind innerhalb ihrer eigenen Grenzen souverän, und das Prinzip cuius regio, eius religio gibt den Herrschern die Autorität über die konfessionelle Identität ihrer Reiche."

 indian_syncretic_tradition: "Synkretistische Toleranz"
 indian_syncretic_tradition_desc: "Indiens außergewöhnliche religiöse Vielfalt hat von ihren Herrschern lange Zeit ein Maß an Toleranz verlangt, das in Europa unbekannt war. Indem wir den Respekt vor mehreren Traditionen institutionalisieren, machen wir unser Reich weniger resistent gegen Veränderungen und stabiler."

 mughal_sulh_e_kul: "Sulh-e-Kul"
 mughal_sulh_e_kul_desc: "Akbars Doktrin des Sulh-e-Kul, oder des universellen Friedens, besagt, dass ein weiser Herrscher über sektiererischen Spaltungen steht und seine Legitimität aus allen seinen Untertanen schöpft, ungeachtet ihres Glaubens. Diese Philosophie der inklusiven Souveränität stärkt unsere Bande zu den vielfältigen unterworfenen Völkern."

 indian_court_tolerance: "Hof der universellen Toleranz"
 indian_court_tolerance_desc: "Unser Hof ist zu einem Treffpunkt für Gelehrte jeder Tradition geworden: Hinduistische Pandits, muslimische Ulama, Jain-Mönche, Sikh-Lehrer und europäische Missionare finden alle ein willkommenes Publikum. Diese Kultur der Forschung bereichert unsere Verwaltung."

 east_asian_state_orthodoxy: "Staatliche Orthodoxie"
 east_asian_state_orthodoxy_desc: "Indem wir staatliche Rituale und institutionelle Praktiken an einer orthodoxen Tradition ausrichten – sei es konfuzianisch, buddhistisch oder shintoistisch –, vermittelt unsere Regierung Kontinuität, Legitimität und kulturelle Kohärenz in unserem gesamten Reich."

 confucian_bureaucratic_faith: "Konfuzianischer bürokratischer Glaube"
 confucian_bureaucratic_faith_desc: "Die neokonfuzianische Staatsphilosophie hat Ritual, Ethik und Verwaltungstechnik zu einem nahtlosen Ganzen verschmolzen. Unsere prüfungsbasierten Beamten verkörpern diese Synthese: Ihre Regierungsführung ist untrennbar mit ihrer moralischen Kultivierung verbunden."

 # ============================================================
 # Late Absolutism Ideas (Age of Revolutions)
 # ============================================================
 late_absolutism_ideas: "Ideen des späten Absolutismus"
 late_absolutism_ideas_desc: "Das Zeitalter der absoluten Monarchie hat seinen Zenit überschritten, doch seine Errungenschaften bleiben bestehen: zentralisierte Bürokratien, stehende Heere und rationalisierte Staatsfinanzen sind nun die Basis, von der selbst Reformer ausgehen müssen."

 enlightened_administration: "Aufgeklärte Verwaltung"
 enlightened_administration_desc: "Das Denken der Aufklärung hat die Korridore der Macht erreicht. Herrscher und Minister, die Montesquieu, Voltaire und die Encyclopédistes gelesen haben, wenden rationalistische Prinzipien auf die Regierungsführung an, straffen das Recht, reformieren die Besteuerung und erweitern die Bildung."

 enlightened_despotism_advance: "Aufgeklärter Absolutismus"
 enlightened_despotism_advance_desc: "Friedrich von Preußen, Katharina von Russland und Joseph von Österreich, die großen aufgeklärten Despoten, zeigen, dass absolute Macht nicht zwangsläufig willkürliche Macht bedeuten muss. Ein Monarch, der nach Vernunft, Gesetz und öffentlichem Interesse regiert, kann Reformen durchführen, die kein Parlament zu wagen würde."

 reform_from_above: "Reform von oben"
 reform_from_above_desc: "Angesichts der Bedrohung durch eine Revolution von unten entscheiden sich weise Herrscher für Reformen von oben. Die Abschaffung der Leibeigenschaft, die Kodifizierung des Rechts und die Eröffnung von Schulen kaufen die Loyalität neuer Wählerschaften, während das Wesentliche der monarchischen Autorität bewahrt bleibt."

 mercantilist_legacy_advance: "Merkantilistisches Erbe"
 mercantilist_legacy_advance_desc: "Zwei Jahrhunderte merkantilistischer Politik haben hochentwickelte Handelseinrichtungen hervorgebracht: regulierte Kompanien, Zollregime, Navigationsakten und Staatsbanken. Unsere Republik erbt diesen Apparat und nutzt ihn zum vollen kommerziellen Vorteil."

 colonial_mercantile_system: "Koloniales Handelssystem"
 colonial_mercantile_system_desc: "Unser Kolonialreich ist nun ein ausgereiftes Wirtschaftssystem: Plantagenlandwirtschaft, Handelsmonopolgesellschaften, Navigationsakten und Silberströme laufen alle zusammen, um den kolonialen Reichtum in die Metropole zu leiten. Dieses über Generationen perfektionierte System arbeitet mit beeindruckender Effizienz."

 professional_standing_army: "Professionelles stehendes Heer"
 professional_standing_army_desc: "Die militärische Revolution hat ihren Höhepunkt erreicht: Jede Großmacht unterhält nun ein ständiges, bezahltes und uniformiertes Heer, anstatt sich auf Feudalaufgebote oder Söldner zu verlassen. Unser stehendes Heer ist diszipliniert, versorgt und jederzeit bereit für einen Feldzug."

 prussian_discipline_advance: "Preußische Disziplin"
 prussian_discipline_advance_desc: "Preußens Armee ist zum Neid und Vorbild Europas geworden: unerbittliches Drill, taktierter Marsch und eine Kultur des Gehorsams machen den preußischen Musketier zum präzisesten steuerbaren Soldaten auf jedem Schlachtfeld."

 prussian_general_staff: "Generalstabssystem"
 prussian_general_staff_desc: "Die preußische Innovation eines permanenten Generalstabs – Offiziere, die Kampagnen planen, das Gelände kartieren und Szenarien durchspielen, bevor Schlachten beginnen – verwandelt die Kriegführung von einer Kunst in eine Wissenschaft. Unsere Offiziere kämpfen mit Informationen, die ihren Feinden fehlen."

 ottoman_military_reform: "Militärreform der Neuen Ordnung"
 ottoman_military_reform_desc: "Reformorientierte Wesire und Sultane haben erkannt, dass europäische Militärmethoden eine echte Herausforderung darstellen. Neue Infanterieeinheiten, die im europäischen Exerzieren ausgebildet und mit standardisierten Waffen ausgestattet sind, stellen eine entscheidende Modernisierungsinvestition dar."

 qing_administrative_consolidation: "Administrative Konsolidierung der Qing"
 qing_administrative_consolidation_desc: "Die Eroberung durch die Qing hat die chinesische Verwaltungskultur nicht ersetzt; sie hat sie absorbiert und perfektioniert. Eine duale Manchu-Han-Bürokratie, ein erweitertes Prüfungssystem und eine strenge Provinzaufsicht verleihen unserem Reich einen gewaltigen Verwaltungsapparat."

 east_asian_bureaucratic_peak: "Bürokratischer Höhepunkt"
 east_asian_bureaucratic_peak_desc: "Unsere Verwaltungstradition hat einen Gipfel der Verfeinerung erreicht. Das Prüfungssystem, die zentralen Ministerien, die Provinzhierarchie und das System der gegenseitigen Überwachung wurden über viele Generationen hinweg mit außerordentlicher Präzision abgestimmt."

 indian_administrative_sophistication: "Administrative Raffinesse"
 indian_administrative_sophistication_desc: "Indische Staaten haben aufwendige Traditionen der Einnahmeverwaltung, der Provinzregierung und des Finanzmanagements entwickelt. Unsere Einnahmeerhebungen, Marktregulierungen und Kreditnetzwerke repräsentieren Jahrhunderte praktischer Staatskunst."

 maratha_fiscal_administration: "Finanzverwaltung"
 maratha_fiscal_administration_desc: "Die Maratha-Konföderation hat bewiesen, dass dezentrale Steuerpacht in Kombination mit effektiver Militärmacht und politischem Geschick einen formidablen Staat aus einem fragmentierten Beginn aufbauen kann. Unsere Finanzinstitutionen spiegeln diese pragmatische Tradition wider."

 # ============================================================
 # Regional Literacy Catch-Up Advances
 # ============================================================
 cc_western_literacy_age2: "Volksbildung"
 cc_western_literacy_age2_desc: "Die allmähliche Verbreitung einer schriftlichen Kultur – durch volkssprachige Schriften, Zunftregister, Kirchenbücher und städtische Pamphlete – hat begonnen, über Kathedralschulen und Universitätssäle hinaus in die Häuser einfacher Soldaten und Landvolks vorzudringen. Unser Reich investiert in die Infrastruktur der allgemeinen Bildung."

 cc_western_literacy_age4: "Der Massendruck erreicht das gemeine Volk"
 cc_western_literacy_age4_desc: "Eine Generation nach dem Buchdruck, der den Diskurs der Eliten transformierte, haben billige Almanache, Balladen und Bibeln in Volkssprache begonnen, Dörfer und Kasernen zu erreichen. Der alphabetisierte Soldat und der lesende Bauer sind keine seltenen Kuriositäten mehr; sie sind das Fundament eines modernen Reiches."

 cc_colonial_literacy_age4: "Koloniale Pfarrnetzwerke"
 cc_colonial_literacy_age4_desc: "Missionsschulen und Pfarrkirchen, die neben Handelsposten und Plantagen errichtet wurden, haben eine alphabetisierte koloniale Bürgerschicht hervorgebracht, die in der Lage ist, ferne Konten zu verwalten, Landvermessungen aufzuzeichnen und mit der Metropole zu korrespondieren. Diese administrative Alphabetisierung ist das Fundament eines dauerhaften Kolonialreichs."

 cc_east_asian_literacy_age4: "Kommerzieller und wissenschaftlicher Buchdruck"
 cc_east_asian_literacy_age4_desc: "Die ausgereiften Druckindustrien unserer großen Städte produzieren nun nicht mehr nur klassische Texte für Gelehrte, sondern populäre Enzyklopädien, kommerzielle Handbücher und Unterhaltungsliteratur für eine breite Leserschaft aus dem Kaufmannsstand. Diese Explosion der Druckkultur vertieft die gebildeten Schichten, die sowohl unsere Bürokratie als auch unsere Handelshäuser bemannen."
