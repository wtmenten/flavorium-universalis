<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>EU5 Advance Branch Explorer</title>
<style>
:root {
  --bg:        #16181f; --panel-bg:  #1e2029; --card-bg:   #252830;
  --card-border:#32363f;--hover-bg:  #2d3040;
  --adm:#5baee8;--dip:#5abf7a;--mil:#e07b54;--mod-gold:#d4a843;
  --text:#cdd2de;--text-dim:#6a7085;--text-mid:#9099b0;
  --unlock:#5abf7a;--modifier:#5baee8;--radius:7px;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;overflow:hidden}
body{font-family:'Segoe UI',system-ui,sans-serif;background:var(--bg);color:var(--text);font-size:13px;line-height:1.45}
button{font-family:inherit;cursor:pointer}
::-webkit-scrollbar{width:6px;height:6px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:var(--card-border);border-radius:3px}
::-webkit-scrollbar-thumb:hover{background:#4a4f5e}
.app{display:grid;grid-template-rows:48px 1fr;height:100vh}
.header{display:flex;align-items:center;gap:14px;padding:0 18px;background:var(--panel-bg);border-bottom:1px solid var(--card-border);z-index:10}
.header h1{font-size:15px;font-weight:600;white-space:nowrap}
.sub{font-size:11px;color:var(--text-dim);white-space:nowrap}
.spacer{flex:1}
.controls{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.ctl-label{font-size:11px;color:var(--text-dim)}
.ctl-sep{width:1px;background:var(--card-border);align-self:stretch;margin:8px 0}
.pill-group{display:flex;border:1px solid var(--card-border);border-radius:5px;overflow:hidden}
.pill{padding:5px 11px;background:transparent;border:none;color:var(--text-dim);font-size:11px;font-weight:500;transition:background .12s,color .12s}
.pill:hover{background:var(--hover-bg);color:var(--text)}
.pill.on{background:var(--card-border);color:var(--text)}
.body{display:grid;grid-template-columns:1fr 520px;overflow:hidden}
.left{overflow-y:auto;padding:14px;display:flex;flex-direction:column;gap:10px}
.right{border-left:1px solid var(--card-border);background:var(--panel-bg);overflow-y:auto;padding:14px}
.age-card{background:var(--card-bg);border:1px solid var(--card-border);border-radius:var(--radius);overflow:hidden;flex-shrink:0}
.age-title{display:flex;align-items:center;gap:8px;padding:7px 12px;background:var(--hover-bg);font-weight:600;font-size:12px;border-bottom:1px solid var(--card-border)}
.univ-tag{font-size:10px;font-weight:400;color:var(--text-dim)}
.branch-tabs{display:flex;border-bottom:1px solid var(--card-border)}
.branch-tab{flex:1;padding:7px 6px 6px;background:transparent;border:none;border-bottom:2px solid transparent;font-size:11px;font-weight:600;color:var(--text-dim);transition:color .12s,border-color .12s,background .12s;text-align:center;line-height:1.3}
.branch-tab:hover:not([disabled]){background:var(--hover-bg);color:var(--text)}
.branch-tab.sel-adm{color:var(--adm);border-bottom-color:var(--adm);background:rgba(91,174,232,.07)}
.branch-tab.sel-dip{color:var(--dip);border-bottom-color:var(--dip);background:rgba(90,191,122,.07)}
.branch-tab.sel-mil{color:var(--mil);border-bottom-color:var(--mil);background:rgba(224,123,84,.07)}
.branch-tab[disabled]{opacity:.28;cursor:default}
.cnt{font-size:9px;font-weight:400;opacity:.8}
.cnt-u{color:var(--unlock)}
.cnt-m{color:var(--modifier)}
.branch-detail{display:grid;grid-template-columns:1fr 1fr 1fr}
.branch-col{padding:8px 10px;border-right:1px solid var(--card-border);min-height:60px;transition:background .12s}
.branch-col:last-child{border-right:none}
.branch-col.selected-adm{background:rgba(91,174,232,.05)}
.branch-col.selected-dip{background:rgba(90,191,122,.05)}
.branch-col.selected-mil{background:rgba(224,123,84,.05)}
.branch-col.unselected{opacity:.82}
.col-summary{background:rgba(255,255,255,.03);border:1px solid var(--card-border);border-radius:4px;padding:5px 7px;margin-bottom:8px;font-size:10px}
.col-sum-row{color:var(--text-dim);line-height:1.6;word-break:break-word;display:flex;align-items:baseline;gap:4px;flex-wrap:wrap}
.col-sum-key{color:var(--text-mid)}
.sum-divider{border-top:1px solid var(--card-border);margin:4px 0}
.cat-label{display:inline-block;font-size:9px;padding:1px 5px;border-radius:3px;font-weight:700;flex-shrink:0;letter-spacing:.02em}
.adv-block{margin-bottom:6px}
.adv-name{font-size:11px;font-weight:500;color:var(--text);display:flex;align-items:center;gap:4px;flex-wrap:wrap}
.mod-badge{display:inline-block;font-size:9px;padding:1px 4px;border-radius:3px;background:var(--mod-gold);color:#0d1017;font-weight:700;flex-shrink:0}
.fx{font-size:10px;padding-left:8px;padding-top:1px}
.fx.fxu{color:var(--unlock)}
.fx.fxm{color:var(--modifier)}
.no-adv{font-size:10px;color:var(--text-dim);font-style:italic;padding:2px 0}
.univ-strip{padding:6px 10px;background:rgba(255,255,255,.02);border-bottom:1px solid var(--card-border);font-size:10px;color:var(--text-dim)}
.univ-strip.univ-hidden{display:none}
.univ-strip summary{cursor:pointer;user-select:none;list-style:none;display:flex;align-items:center;gap:5px}
.univ-strip summary::before{content:'+';font-size:11px;font-weight:700}
details[open] .univ-strip summary::before{content:'-'}
.univ-adv{margin-top:4px}
.univ-adv .adv-name{color:var(--text-mid)}
.tip-host{position:relative;display:inline-flex;align-items:baseline;gap:3px;cursor:help}
.tip-host:hover .tip-box{display:block}
.tip-box{display:none;position:absolute;z-index:200;bottom:calc(100% + 5px);left:0;background:#1c1f28;border:1px solid var(--card-border);border-radius:5px;padding:7px 9px;white-space:nowrap;font-size:10px;color:var(--text);box-shadow:0 6px 18px rgba(0,0,0,.55);min-width:200px;pointer-events:none}
.tip-box::after{content:'';position:absolute;top:100%;left:12px;border:5px solid transparent;border-top-color:#1c1f28}
.tip-row{padding:2px 0;display:flex;gap:5px;align-items:baseline}
.tip-val{color:var(--text);font-weight:600;flex-shrink:0}
.tip-src{color:var(--text-mid)}
.sum-header{display:flex;align-items:center;margin-bottom:10px;padding-bottom:8px;border-bottom:1px solid var(--card-border)}
.sum-header h2{font-size:13px;font-weight:600}
.combo-label{font-size:10px;color:var(--text-dim);margin-bottom:12px;line-height:1.8}
.sum-section{margin-bottom:14px}
.sum-sh{font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.07em;padding-bottom:4px;margin-bottom:6px;border-bottom:1px solid var(--card-border)}
.sum-section.su .sum-sh{color:var(--unlock)}
.sum-section.sm .sum-sh{color:var(--modifier)}
.sum-group{margin-bottom:8px}
.sum-gl{font-size:10px;font-weight:600;color:var(--text-dim);text-transform:uppercase;letter-spacing:.05em;margin-bottom:3px}
.sum-item{font-size:11px;padding:1px 0 1px 8px;display:flex;align-items:baseline;gap:4px;flex-wrap:wrap}
.sum-key{color:var(--text-dim)}
.sum-val{font-weight:500}
.sum-src{font-size:10px;color:var(--text-dim)}
.sum-hint{font-size:9px;color:var(--text-dim);text-decoration:underline dotted}
.empty{font-size:11px;color:var(--text-dim);font-style:italic;padding:4px 0}
</style>
</head>
<body>
<div id="root"></div>

// ── constants ────────────────────────────────────────────────────────────────
const BRANCHES = ['adm','dip','mil'];
const UNLOCK_CATS = {
  unlock_subject_type:      {label:'Subject',   color:'#c98fff'},
  unlock_estate_privilege:  {label:'Privilege', color:'#ffb84d'},
  unlock_government_reform: {label:'Reform',    color:'#ff8c69'},
  unlock_casus_belli:       {label:'CB',        color:'#ff6b6b'},
  unlock_building:          {label:'Building',  color:'#9ec8ff'},
  unlock_unit:              {label:'Unit',      color:'#7dd6a8'},
  unlock_levy:              {label:'Levy',      color:'#6bbf9e'},
  unlock_interaction:       {label:'Interact',  color:'#ffd166'},
  unlock_law:               {label:'Law',       color:'#a8dadc'},
  unlock_cabinet_action:    {label:'Cabinet',   color:'#d4a843'},
  unlock_production_method: {label:'Method',    color:'#b5b5ff'},
  unlock_ability:           {label:'Ability',   color:'#ff9ece'},
};

// ── helpers ──────────────────────────────────────────────────────────────────
const isUnlock = k => k.startsWith('unlock_');
const unlockCat = k => UNLOCK_CATS[k] || {label: k.replace('unlock_',''), color:'#9099b0'};
const fmtNum = n => {
  if (n === 0) return '0';
  const s = parseFloat(n.toFixed(4)).toString();
  return n > 0 ? '+' + s : s;
};
const groupBy = (arr, fn) => {
  const m = new Map();
  for (const x of arr) { const k = fn(x); m.has(k) ? m.get(k).push(x) : m.set(k, [x]); }
  return m;
};

// ── components ───────────────────────────────────────────────────────────────

function Pill({ label, active, onClick }) {
  return html`<button class=${`pill${active?' on':''}`} onClick=${onClick}>${label}</button>`;
}

function Header({ grp, show, showUniv, onGrp, onShow, onToggleUniv }) {
  return html`
    <div class="header">
      <h1>Advance Branch Explorer</h1>
      <span class="sub">Cabinets & Choices — EU5</span>
      <div class="spacer"></div>
      <div class="controls">
        <span class="ctl-label">Summary:</span>
        <div class="pill-group">
          <${Pill} label="By Age" active=${grp==='age'} onClick=${()=>onGrp('age')} />
          <${Pill} label="By Key" active=${grp==='key'} onClick=${()=>onGrp('key')} />
        </div>
        <div class="ctl-sep"></div>
        <span class="ctl-label">Show:</span>
        <div class="pill-group">
          <${Pill} label="All"       active=${show==='all'}       onClick=${()=>onShow('all')} />
          <${Pill} label="Unlocks"   active=${show==='unlocks'}   onClick=${()=>onShow('unlocks')} />
          <${Pill} label="Modifiers" active=${show==='modifiers'} onClick=${()=>onShow('modifiers')} />
        </div>
        <div class="ctl-sep"></div>
        <div class="pill-group">
          <${Pill} label="Universal" active=${showUniv} onClick=${onToggleUniv} />
        </div>
      </div>
    </div>`;
}

function AdvBlock({ adv }) {
  return html`
    <div class="adv-block">
      <div class="adv-name">
        ${adv.name}
        ${adv.isMod && html`<span class="mod-badge">MOD</span>`}
      </div>
      ${adv.effects.map(([k,v]) => html`
        <div class=${`fx ${isUnlock(k)?'fxu':'fxm'}`}>${k} = ${v}</div>`)}
    </div>`;
}

function ColSummary({ advs }) {
  const unlockFx = [], modFx = [];
  for (const a of advs)
    for (const [k,v] of a.effects)
      (isUnlock(k) ? unlockFx : modFx).push({k, v, isMod: a.isMod});
  if (!unlockFx.length && !modFx.length) return null;

  const modByKey = [...groupBy(modFx, e=>e.k).entries()];

  return html`
    <div class="col-summary">
      ${unlockFx.map((e,i) => {
        const cat = unlockCat(e.k);
        const chipStyle = {background:`${cat.color}22`, color:cat.color, border:`1px solid ${cat.color}55`};
        return html`
          <div key=${i} class="col-sum-row">
            <span class="cat-label" style=${chipStyle}>${cat.label}</span>
            ${e.v}
            ${e.isMod && html`<span class="mod-badge">MOD</span>`}
          </div>`;
      })}
      ${unlockFx.length && modFx.length ? html`<div class="sum-divider"></div>` : null}
      ${modByKey.map(([k, items]) => {
        const nums = items.map(e=>parseFloat(e.v)).filter(n=>!isNaN(n));
        const val  = nums.length === items.length ? fmtNum(nums.reduce((a,b)=>a+b,0)) : items.map(e=>e.v).join(', ');
        return html`
          <div key=${k} class="col-sum-row">
            <span class="col-sum-key">${k}</span>: ${val}
            ${items.some(e=>e.isMod) && html`<span class="mod-badge">MOD</span>`}
          </div>`;
      })}
    </div>`;
}

function BranchCol({ age, branch, selected }) {
  const advs = D.branches[age][branch] || [];
  const cls  = `branch-col col-${branch}` + (selected ? ` selected-${branch}` : ' unselected');
  if (!advs.length) return html`<div class=${cls}><div class="no-adv">no branch advances</div></div>`;
  return html`
    <div class=${cls}>
      <${ColSummary} advs=${advs} />
      ${advs.map(a => html`<${AdvBlock} key=${a.name} adv=${a} />`)}
    </div>`;
}

function AgeCard({ age, selected, showUniv, onPick }) {
  const B       = D.branches[age];
  const univFx  = (B.universal||[]).filter(a => a.effects.length > 0);
  return html`
    <div class="age-card">
      <div class="age-title">
        ${D.ageLabels[age]}
        ${univFx.length > 0 && html`<span class="univ-tag">(+${univFx.length} universal)</span>`}
      </div>
      ${univFx.length > 0 && html`
        <div class=${`univ-strip${showUniv?'':' univ-hidden'}`}>
          <details>
            <summary>${univFx.length} universal advances (always active)</summary>
            <div class="univ-adv">${univFx.map(a => html`<${AdvBlock} key=${a.name} adv=${a} />`)}</div>
          </details>
        </div>`}
      <div class="branch-tabs">
        ${BRANCHES.map(b => {
          const advs = B[b] || [];
          const uCnt = advs.reduce((s,a) => s + a.effects.filter(([k])=>isUnlock(k)).length, 0);
          const mCnt = advs.reduce((s,a) => s + a.effects.filter(([k])=>!isUnlock(k)).length, 0);
          return html`
            <button key=${b} class=${`branch-tab${selected===b?` sel-${b}`:''}`}
              disabled=${advs.length===0} onClick=${()=>onPick(b)}>
              ${b.toUpperCase()}<br/>
              <span class="cnt">
                ${advs.length} adv.${' '}
                ${uCnt>0 && html`<span class="cnt-u">${uCnt}u</span>`}
                ${uCnt>0 && mCnt>0 && html`<span style="color:var(--text-dim)"> · </span>`}
                ${mCnt>0 && html`<span class="cnt-m">${mCnt}m</span>`}
              </span>
            </button>`;
        })}
      </div>
      <div class="branch-detail">
        ${BRANCHES.map(b => html`
          <${BranchCol} key=${b} age=${age} branch=${b} selected=${selected===b} />`)}
      </div>
    </div>`;
}

function SumGroupAge({ lbl, items }) {
  return html`
    <div class="sum-group">
      <div class="sum-gl">${lbl}</div>
      ${items.map((e,i) => html`
        <div key=${i} class="sum-item">
          <span class="sum-key">${e.k}</span>
          <span style="color:var(--text-dim)">=</span>
          <span class="sum-val">${e.v}</span>
          <span class="sum-src">— ${e.src}${e.isMod && html`<span class="mod-badge">MOD</span>`}</span>
        </div>`)}
    </div>`;
}

function SumGroupKey({ keyName, items }) {
  const nums       = items.map(e=>parseFloat(e.v)).filter(n=>!isNaN(n));
  const allNumeric = nums.length===items.length && items.length>0 && !isUnlock(keyName);
  return html`
    <div class="sum-group">
      <div class="sum-gl">${keyName}</div>
      ${allNumeric ? html`
        <div class="sum-item">
          <span class="tip-host">
            <span class="sum-val">${fmtNum(nums.reduce((a,b)=>a+b,0))}</span>
            <span class="sum-hint">${items.length} source${items.length>1?'s':''}</span>
            <div class="tip-box">
              ${items.map((e,i) => html`
                <div key=${i} class="tip-row">
                  <span class="tip-val">${e.v}</span>
                  <span class="tip-src">
                    ${e.src}${e.isMod && html`<span class="mod-badge">MOD</span>`}
                    ${' '}(${e.ageLabel.replace('Age of ','')})
                  </span>
                </div>`)}
            </div>
          </span>
        </div>` : items.map((e,i) => html`
        <div key=${i} class="sum-item">
          <span class="sum-val">${e.v}</span>
          <span class="sum-src">— ${e.src}${e.isMod && html`<span class="mod-badge">MOD</span>`} (${e.ageLabel.replace('Age of ','')})</span>
        </div>`)}
    </div>`;
}

function SummarySection({ title, effects, secCls, grp }) {
  const groups = useMemo(() => grp === 'age'
    ? [...groupBy(effects, e=>e.ageLabel).entries()]
    : [...groupBy(effects, e=>e.k).entries()].sort((a,b)=>a[0].localeCompare(b[0])),
    [effects, grp]);
  return html`
    <div class=${`sum-section ${secCls}`}>
      <div class="sum-sh">${title} (${effects.length})</div>
      ${grp==='age'
        ? groups.map(([lbl,items]) => html`<${SumGroupAge} key=${lbl} lbl=${lbl} items=${items} />`)
        : groups.map(([k,items])   => html`<${SumGroupKey} key=${k} keyName=${k} items=${items} />`)}
    </div>`;
}

function SummaryPanel({ sel, grp, show, showUniv }) {
  const effects = useMemo(() => {
    const out = [];
    for (const age of D.ages) {
      const B     = D.branches[age];
      const univs = showUniv ? (B.universal||[]) : [];
      for (const a of [...univs, ...(B[sel[age]]||[])])
        for (const [k,v] of a.effects)
          out.push({k, v, src:a.name, isMod:a.isMod, age, ageLabel:D.ageLabels[age]});
    }
    return out;
  }, [sel, showUniv]);

  const filtered  = show==='unlocks'   ? effects.filter(e=> isUnlock(e.k))
                  : show==='modifiers' ? effects.filter(e=>!isUnlock(e.k))
                  : effects;
  const unlocks   = filtered.filter(e=> isUnlock(e.k));
  const modifiers = filtered.filter(e=>!isUnlock(e.k));

  return html`
    <div class="right">
      <div class="sum-header"><h2>Summary</h2></div>
      <div class="combo-label">
        ${D.ages.map((age, i) => html`
          <span key=${age} style=${{color:`var(--${sel[age]||'text-dim'})`}}>
            ${D.ageLabels[age].replace('Age of ','')}: ${(sel[age]||'?').toUpperCase()}
          </span>${i<D.ages.length-1 ? ' › ' : ''}`)}
      </div>
      ${!filtered.length
        ? html`<div class="empty">Select a branch for each age.</div>`
        : html`
            ${show!=='modifiers' && unlocks.length>0 && html`
              <${SummarySection} title="Unlocks" effects=${unlocks} secCls="su" grp=${grp} />`}
            ${show!=='unlocks' && modifiers.length>0 && html`
              <${SummarySection} title="Modifiers" effects=${modifiers} secCls="sm" grp=${grp} />`}`}
    </div>`;
}

function App() {
  const [sel,      setSel]      = useState({});
  const [grp,      setGrp]      = useState('age');
  const [show,     setShow]     = useState('all');
  const [showUniv, setShowUniv] = useState(true);

  useEffect(() => {
    const init = {};
    for (const age of D.ages) {
      const first = BRANCHES.find(b => (D.branches[age][b]||[]).length > 0);
      if (first) init[age] = first;
    }
    setSel(init);
  }, []);

  const pick = useCallback((age, b) => setSel(s => ({...s, [age]: b})), []);

  return html`
    <div class="app">
      <${Header} grp=${grp} show=${show} showUniv=${showUniv}
        onGrp=${setGrp} onShow=${setShow} onToggleUniv=${()=>setShowUniv(v=>!v)} />
      <div class="body">
        <div class="left">
          ${D.ages.map(age => html`
            <${AgeCard} key=${age} age=${age} selected=${sel[age]}
              showUniv=${showUniv} onPick=${b=>pick(age,b)} />`)}
        </div>
        <${SummaryPanel} sel=${sel} grp=${grp} show=${show} showUniv=${showUniv} />
      </div>
    </div>`;
}

render(html`<${App} />`, document.getElementById('root'));
</script>
</body>
</html>
