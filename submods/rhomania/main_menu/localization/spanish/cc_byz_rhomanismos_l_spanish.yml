l_spanish:
 # Tagmata units
 a_cc_byz_tagmata_1: "Tagmata"
 a_cc_byz_tagmata_1_desc: "Los regimientos permanentes de la capital, pagados por el tesoro en lugar de ser reclutados de la tierra. A diferencia de las levas temáticas, pueden ser movilizados y desplegados a palabra del emperador, y a diferencia de los varangos, no están confinados al palacio. Cambian el peso de una línea legionaria por la velocidad para llegar a una batalla mientras aún sea relevante."
 a_cc_byz_tagmata_2: "$a_cc_byz_tagmata_1$"
 a_cc_byz_tagmata_2_desc: "$a_cc_byz_tagmata_1_desc$"
 a_cc_byz_tagmata_3: "$a_cc_byz_tagmata_1$"
 a_cc_byz_tagmata_3_desc: "$a_cc_byz_tagmata_1_desc$"
 a_cc_byz_tagmata_4: "$a_cc_byz_tagmata_1$"
 a_cc_byz_tagmata_4_desc: "$a_cc_byz_tagmata_1_desc$"
 a_cc_byz_tagmata_5: "$a_cc_byz_tagmata_1$"
 a_cc_byz_tagmata_5_desc: "$a_cc_byz_tagmata_1_desc$"
 a_cc_byz_tagmata_6: "$a_cc_byz_tagmata_1$"
 a_cc_byz_tagmata_6_desc: "$a_cc_byz_tagmata_1_desc$"

 # Tagmata cap modifier
 MODIFIER_TYPE_NAME_cc_num_of_tagmata_modifier: "Regimientos Tagmata"
 MODIFIER_TYPE_DESC_cc_num_of_tagmata_modifier: "Esto cambia cuántos regimientos de [ShowUnitTypeName('a_cc_byz_tagmata_1')] pueden mantenerse a la vez."

 # Rhomanismos advances
 cc_byz_unlock_tagmata_advance: "$a_cc_byz_tagmata_1$"
 cc_byz_unlock_tagmata_advance_desc: "$a_cc_byz_tagmata_1_desc$"

 cc_byz_taxis_of_offices: "Orden de precedencia"
 cc_byz_taxis_of_offices_desc: "Roma respondió al problema de los hombres poderosos con un Senado. Nosotros respondemos con una lista. Cada dignidad tiene su lugar en el orden de precedencia, su salario, su asiento a la mesa y sus deberes ceremoniales. El rango no se hereda ni se compra: se concede, y puede ser retirado."

 cc_byz_oikonomia: "Oikonomía"
 cc_byz_oikonomia_desc: "Los cánones son estrictos, y la Iglesia siempre ha sabido cuándo no aplicarlos. La Oikonomía es el principio de la dispensa: donde el rigor costaría al rebaño más que la falta, el obispo puede flexibilizar la regla. Aplicada al gobierno, significa un estado que puede tolerar lo que aún no puede corregir."

 cc_byz_tagmata_restored: "Los Tagmata Restaurados"
 cc_byz_tagmata_restored_desc: "Las levas temáticas responden a los hombres que poseen sus tierras. Los tagmata responden al tesoro que los paga. Restaurar los regimientos permanentes es costoso y es la única manera en que un emperador mantiene un ejército que sea suyo y no de sus magnates."

 cc_byz_palaiologan_revival: "El renacimiento paleólogo"
 cc_byz_palaiologan_revival_desc: "Los mosaicos de Chora, las historias, los manuscritos recuperados de los antiguos: un verdadero florecimiento de las letras y el arte griegos, emprendido por un estado que ya no podía permitírselo. Las épocas posteriores lo llamarán la última luz de Constantinopla. Quienes lo vivieron simplemente lo llamaron trabajo."

 cc_byz_basilika: "La Basilika"
 cc_byz_basilika_desc: "El código de Justiniano fue compilado en latín para una corte que ya no lo habla. Los Basilika son la misma ley en griego, organizados para las cortes que realmente la utilizan. No se decreta nada nuevo; mucho se vuelve ejecutable."

 cc_byz_annona: "La Annona"
 cc_byz_annona_desc: "La flota del grano llega a la capital o la capital se amotina. Esto ha sido así desde que se fundó la ciudad y ningún emperador ha encontrado una solución. Asegurar la repartición de pan no es generosidad, es el precio de gobernar desde Constantinopla."

 cc_byz_ecumenical_office: "La oficina ecuménica"
 cc_byz_ecumenical_office_desc: "Roma creaba ciudadanos por ley y podía contarlos. Nosotros creamos Rhomaioi por fe y lealtad, lo cual es más lento, más vago y más difícil de revocar. Un eslavo, un armenio o un valaco que sea ortodoxo y obedezca al emperador es tan romano como cualquier persona en la ciudad."

 cc_byz_dromos: "El Correo Público"
 cc_byz_dromos_desc: "Roma construyó las calzadas. Lo que nosotros hemos mantenido funcionando sobre ellas es el dromos: las estaciones de relevo, los caballos de recambio, los mensajeros y los funcionarios cuya única tarea es saber cuánto tarda un mensaje. Las carreteras se deterioran. Un horario puede mantenerse."

 cc_byz_thematic_administration: "Administración Temática"
 cc_byz_thematic_administration_desc: "Un tema es una provincia que recluta y paga a sus propios soldados con sus propias tierras. Es la forma en que el imperio sobrevivió a los siglos en los que no podía permitirse nada más, y sigue siendo la disposición que llega más lejos de la capital con el menor gasto."

 cc_byz_autokrator: "Autokrátor"
 cc_byz_autokrator_desc: "El título no reclama un dominio ilimitado. Reclama que dentro de lo que el emperador ya posee no hay otra autoridad, ningún socio y ninguna apelación. Un imperio que no puede expandirse aún puede hacerse íntegro."

 cc_byz_great_church: "La Gran Iglesia"
 cc_byz_great_church_desc: "Santa Sofía ha permanecido en pie durante ochocientos años porque cada generación ha pagado para mantenerla así. La cúpula cayó una vez y fue reconstruida. La lección que se extrae de esto no es cómo construir, sino cómo mantener."
