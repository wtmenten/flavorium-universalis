l_spanish:
 # Subject type
 cc_byz_exarchate: "Exarcado"
 cc_byz_exarchate_desc: "Una provincia occidental gobernada por un exarca nombrado que ostenta tanto el mando civil como el militar, respondiendo ante el emperador y ante nadie local. Esta disposición es la forma en que Rávena se mantuvo durante dos siglos. Funciona precisamente mientras los intereses del exarca y los del palacio sigan siendo los mismos."

 # Capability modifier
 MODIFIER_TYPE_NAME_cc_byz_can_appoint_exarch: "Puede nombrar un exarca"
 MODIFIER_TYPE_DESC_cc_byz_can_appoint_exarch: "Esto permite que una provincia occidental sea puesta bajo el mando de un exarca designado mientras la capital permanece en [ShowLocationName('constantinople')]."

 # Renovatio advances
 cc_byz_renovatio_imperii: "Renovatio Imperii"
 cc_byz_renovatio_imperii_desc: "Occidente no se recupera trasladando el trono a Roma. Se recupera gobernando Roma desde la ciudad que nunca cayó. Se envía un exarca, al que se le otorga el mando civil y militar conjuntamente, y se le deja mantener la península en nombre del emperador."
 cc_byz_exarchal_chancery: "La cancillería exarcal"
 cc_byz_exarchal_chancery_desc: "Una oficina permanente en el palacio cuya única función es el mando occidental: su correspondencia, sus cuentas, sus nombramientos y las seis semanas que tarda un mensaje en cada sentido. La distancia no puede eliminarse. Puede administrarse."

 cc_byz_capital_is_constantinople_tt: "Nuestra capital es [ShowLocationName('constantinople')]"

 # Exarch government reforms
 cc_byz_exarch_caretaker_reform: "Exarca interino"
 cc_byz_exarch_caretaker_reform_desc: "Un funcionario del palacio sin conexiones occidentales y sin ambiciones por las que el emperador deba preocuparse. Seguirá sus instrucciones exactamente, incluidas aquellas que ya no se ajustan a la situación, y no formará un grupo de seguidores."
 cc_byz_exarch_effective_reform: "Exarca efectivo"
 cc_byz_exarch_effective_reform_desc: "Un administrador capaz al que se le ha dado la discreción para gobernar en lugar de simplemente informar. La provincia se pagará a sí misma en una década. También lo hará la red de hombres locales que le deben sus puestos."
 cc_byz_exarch_strategos_reform: "Exarca y Estratego"
 cc_byz_exarch_strategos_reform_desc: "Un general enviado al oeste con las tropas y la autoridad para usarlas, que es lo que los exarcas de Rávena eran en realidad. Puede mantener Italia. Si la mantiene para el emperador es una cuestión aparte, que se responderá más tarde."

 # Character interaction.
 # Key set mirrors vanilla assign_governor (character_interactions_l_english.yml:261-270),
 # which needs _concept, _act, _desc_specific, _past and _act_past alongside the base keys.
 cc_byz_appoint_exarch: "Nombrar a un exarca"
 cc_byz_appoint_exarch_concept: "[character|e]"
 cc_byz_appoint_exarch_act: "$cc_byz_appoint_exarch$"
 cc_byz_appoint_exarch_desc: "Colocar una [area|e] occidental bajo un exarca designado que mantenga el mando civil y militar conjuntamente. Nuestra capital permanece en [ShowLocationName('constantinople')]."
 cc_byz_appoint_exarch_desc_specific: "Colocar una [area|e] occidental bajo el mando de [SCOPE.sCharacter('recipient').GetName], manteniendo el mando civil y militar conjuntamente en nuestro nombre."
 cc_byz_appoint_exarch_past: "[SCOPE.sCharacter('recipient').GetName] es nombrado exarca de [target_area.GetName]"
 cc_byz_appoint_exarch_act_past: "Por decreto del [SCOPE.sCountry('actor').GetGovernment.GetRulerTitle], [SCOPE.sCharacter('recipient').GetName] ha sido nombrado exarca de [target_area.GetName], como un [target_reform.GetName]"
 cc_byz_choose_exarch: "Elija al [character|e] que enviará al oeste:"
 cc_byz_select_exarch_type: "Selecciona los términos del nombramiento"
 cc_byz_select_exarch_type_none: "@trigger_no! No hay términos de nombramiento disponibles."
 cc_byz_select_exarchate_area: "Selecciona el [area|e] para poner bajo un exarca"
 cc_byz_select_exarchate_area_none: "@trigger_no! No poseemos ninguna [area|e] occidental lo suficientemente grande como para ponerla bajo un exarca."
 cc_byz_appoint_exarch_effect_tt: "La [area|e] se convierte en un Exarcado bajo [SCOPE.sCharacter('recipient').GetName] como un [target_reform.GetName], con sede en su [location|e] más desarrollada. Nuestra capital permanece inalterada. El establecimiento del mando occidental revive nuestra reclamación sobre las antiguas fronteras."
