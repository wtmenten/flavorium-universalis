l_spanish:
 # Mission task
 cc_byz_ven_task_free_tt: "Venecia existe, no es vasalla de nadie, no está en guerra con nosotros y nosotros poseemos Constantinopla"
 cc_byz_ven_opens_chain_tt: "Abre #Y La Cuestión de la Serenísima#!, una serie de eventos a lo largo de unos cincuenta años que pueden terminar con Venecia como nuestra aliada perpetua, como un Ducado cliente, excluida del Sacro Imperio Romano Germánico, o como enemiga"

 # Score tooltips
 cc_byz_ven_concord_plus1_tt: "#Y Concordia con Venecia#! #G +1#!"
 cc_byz_ven_concord_plus2_tt: "#Y Concordia con Venecia#! #G +2#!"
 cc_byz_ven_concord_minus1_tt: "#Y Concordia con Venecia#! #R -1#!"
 cc_byz_ven_concord_minus2_tt: "#Y Concordia con Venecia#! #R -2#!"
 cc_byz_ven_leverage_plus1_tt: "#Y Influencia sobre Venecia#! #G +1#!"
 cc_byz_ven_leverage_plus2_tt: "#Y Influencia sobre Venecia#! #G +2#!"
 cc_byz_ven_leverage_minus1_tt: "#Y Influencia sobre Venecia#! #R -1#!"
 cc_byz_ven_creditor_grip_plus1_tt: "#Y Control del acreedor#! #R +1#!"
 cc_byz_ven_exarch_restrained_tt: "Nuestro exarca en Italia quiere menos tierras de Venecia, y resiente que se le diga: #Y apetito del exarca#! #G -1#!, #Y lealtad del exarca#! #R -1#!"
 cc_byz_ven_exarch_unleashed_tt: "Nuestro exarca en Italia quiere más: #Y apetito del exarca#! #R +1#!"
 cc_byz_ven_dux_offered_tt: "Si la cuestión termina en una alianza o el Ducado, Venecia quedará fuera del Sacro Imperio Romano Germánico"

 # Offers
 cc_byz_ven_port_buy_tt: "Ofrecemos comprar [cc_ven_port.GetName]. Venecia pide 25 de oro por punto de desarrollo, entre 150 y 600"
 cc_byz_ven_port_swap_tt: "Ofrecemos a [cc_ven.GetName] derechos comerciales en nuestros mercados durante 30 años a cambio de [cc_ven_port.GetName]. #Y Influencia#! #R -1#! si se acepta"
 cc_byz_ven_venice_decides_tt: "El gobierno de [cc_ven.GetName] decide"
 cc_byz_ven_port_ai_rule_tt: "[cc_ven.GetName] acepta si la #Y Concordia#! es de 5 o más"
 cc_byz_ven_ducate_ai_rule_tt: "[cc_ven.GetName] puede aceptar o rechazar. Las probabilidades mejoran con una #Y Concordia#! de 9 o más e #Y Influencia#! de 4 o más. Un rechazo aun así nos otorga la alianza perpetua"
 cc_byz_ven_port_accept_tt: "El puerto pasa a [cc_ven_emperor.GetName]"
 cc_byz_ven_port_refuse_tt: "Conservamos el puerto. Las relaciones se enfrían un poco"
 cc_byz_ven_proposal_accept_tt: "Aceptamos la propuesta de [cc_ven_emperor.GetName]"
 cc_byz_ven_proposal_refuse_tt: "Rechazamos la oferta. Las relaciones con [cc_ven_emperor.GetName] continúan en sus términos actuales"
 cc_byz_ven_ducate_tt: "Venecia se convierte en el #Y Ducado de Venecia#!: un vasallo que conserva su república, flota, guerras y diplomacia, paga un pequeño tributo y permite que nuestros mercaderes comercien libres de sus aranceles. Nunca podrá ser anexionada. Venecia queda fuera del Sacro Imperio Romano Germánico"
 cc_byz_ven_alliance_tt: "Una alianza perpetua con Venecia, con bonificaciones navales y comerciales duraderas para ambas partes"
 cc_byz_ven_rupture_tt: "Las relaciones con Venecia se rompen. Obtenemos un reclamo de guerra de 25 años sobre sus puertos en Morea y el Egeo"

 # Subject type
 cc_byz_venetian_ducate: "Ducado de Venecia"
 cc_byz_venetian_ducate_desc: "Venecia reconoce al emperador una vez más, como hicieron sus primeros dogos. La república se gobierna a sí misma, conserva su flota y sus colonias, y lucha sus propias guerras. Envía un tributo y permite que los mercaderes imperiales comercien libres de sus aranceles."

 # Casus belli
 cc_byz_cb_stato_da_mar: "El Stato da Mar"
 cc_byz_cb_stato_da_mar_desc: "Venecia traicionó la fe con el imperio. Sus puertos en el Morea y el Egeo eran romanos antes de ser venecianos."
 cc_byz_cb_stato_da_mar_PROV: "El Stato da Mar"

 # Opinion modifiers
 cc_byz_ven_courted: "Cortejado por el Emperador"
 cc_byz_ven_slighted: "Menospreciado por el Emperador"
 cc_byz_ven_wronged: "Agraviado por el Emperador"
 cc_byz_ven_sworn_friends: "Amigos jurados del Emperador"
 cc_byz_ven_broken_faith: "Fe rota"

 # Country modifiers
 STATIC_MODIFIER_NAME_cc_byz_ven_old_privileges: "La exención veneciana"
 STATIC_MODIFIER_DESC_cc_byz_ven_old_privileges: "Se mantienen los términos de 1082: los mercaderes venecianos comercian en Romania libres de aduanas."
 STATIC_MODIFIER_NAME_cc_byz_ven_reduced_privileges: "El dos por ciento"
 STATIC_MODIFIER_DESC_cc_byz_ven_reduced_privileges: "Los mercaderes venecianos pagan una tasa aduanera reducida del dos por ciento."
 STATIC_MODIFIER_NAME_cc_byz_ven_full_kommerkion: "El Kommerkion completo"
 STATIC_MODIFIER_DESC_cc_byz_ven_full_kommerkion: "Los cargamentos venecianos pagan el diez por ciento completo. El tesoro gana y el comercio se reduce."
 STATIC_MODIFIER_NAME_cc_byz_ven_anti_genoese_league: "Liga contra Génova"
 STATIC_MODIFIER_DESC_cc_byz_ven_anti_genoese_league: "Nuestras galeras navegan con la flota veneciana contra los genoveses."
 STATIC_MODIFIER_NAME_cc_byz_ven_sea_league: "La Liga Marítima"
 STATIC_MODIFIER_DESC_cc_byz_ven_sea_league: "Una flota conjunta con Venecia patrulla el Egeo contra los turcos."
 STATIC_MODIFIER_NAME_cc_byz_ven_perpetual_alliance: "Alianza perpetua con Venecia"
 STATIC_MODIFIER_DESC_cc_byz_ven_perpetual_alliance: "El imperio y la Serenísima se han jurado lealtad mutua sin plazo determinado."
 STATIC_MODIFIER_NAME_cc_byz_ven_romania_rights: "Derechos en Romania"
 STATIC_MODIFIER_DESC_cc_byz_ven_romania_rights: "Nuestros mercaderes poseen derechos en los mercados del imperio romano."
 STATIC_MODIFIER_NAME_cc_byz_ven_good_relations: "Amistad con Venecia"
 STATIC_MODIFIER_DESC_cc_byz_ven_good_relations: "Las relaciones con Venecia son buenas y estables, sin un tratado que las vincule."

 # .1 The chrysobull renewed
 cc_byz_venice.1.title: "La Crisobula renovada"
 cc_byz_venice.1.desc: "El bailo veneciano ha venido al palacio con la crisobula de 1082 y pide que sea confirmada. Alejo I dio a Venecia un cuarto en el Cuerno de Oro y la exención de las aduanas a cambio de una flota contra los normandos. Los normandos desaparecieron hace tiempo. La exención sigue costando dinero al tesoro.\n\nLos genoveses de Gálata están observando para ver qué obtiene Venecia."
 cc_byz_venice.1.a: "Confirmar los términos de 1082 en su totalidad."
 cc_byz_venice.1.b: "Reducir la exención al dos por ciento."
 cc_byz_venice.1.c: "Revocarlo. Venecia paga el kommerkion completo."
 cc_byz_venice.1.d: "Nuestro ministro mercantil redacta los términos."

 # .2 The jewels and the loans
 cc_byz_venice.2.title: "Las joyas y los préstamos"
 cc_byz_venice.2.desc: "Los banqueros venecianos han ofrecido al tesoro un préstamo en condiciones favorables. Las condiciones favorables de Venecia suelen volverse difíciles, pero el dinero es real y el imperio lo necesita."
 cc_byz_venice.2.desc_jewels: "Las joyas de la corona siguen en una caja fuerte veneciana, retenidas como garantía de un préstamo que el imperio no ha devuelto. Cada enviado veneciano lo sabe y ninguno lo menciona. Los banqueros ofrecen ahora un segundo préstamo sobre la misma garantía."
 cc_byz_venice.2.a: "Liquidar la deuda y pedir las joyas de buena fe."
 cc_byz_venice.2.b: "Aceptar el préstamo."
 cc_byz_venice.2.c: "No le deberemos nada a Venecia."

 # .3 The Genoese war
 cc_byz_venice.3.title: "La guerra genovesa"
 cc_byz_venice.3.desc: "Venecia y Génova están en guerra nuevamente por el comercio del Mar Negro, y ambas han enviado enviados. Venecia pide nuestras galeras, como Juan VI se las dio en 1351. Génova nos recuerda que Gálata está al otro lado del Cuerno frente al palacio, y que fue Génova quien ayudó a reinstaurar a un Paléologo en el trono."
 cc_byz_venice.3.desc_no_genoa: "Génova ha dejado de ser una potencia, y su antigua disputa con Venecia ha terminado con ella. Venecia recuerda quién estuvo en cada bando mientras duró."
 cc_byz_venice.3.a: "Unirse a Venecia contra los genoveses."
 cc_byz_venice.3.b: "No intervenir."
 cc_byz_venice.3.c: "Aliarse con Génova."
 cc_byz_venice.3.d: "La disputa ha terminado."

 # .4 The sea league
 cc_byz_venice.4.title: "La Liga Marítima"
 cc_byz_venice.4.desc: "Venecia propone una flota conjunta para limpiar los corsarios turcos del Egeo, tal como hizo la liga de 1344 cuando tomó Esmirna. Cada parte pagará sus propias galeras. Venecia quiere saber si las nuestras se unirán."
 cc_byz_venice.4.a: "Pagar por galeras en la flota de la liga."
 cc_byz_venice.4.b: "Nuestro almirante comanda la escuadra de la liga."
 cc_byz_venice.4.c: "Nuestros barcos custodian nuestras propias costas."

 # .5 Dalmatia
 cc_byz_venice.5.title: "Dalmacia"
 cc_byz_venice.5.desc: "Los húngaros están presionando las ciudades dálmatas que posee Venecia, y Venecia nos pide apoyo. Dalmacia fue una provincia romana, y la reclamación veneciana sobre ella comenzó como una comisión de Constantinopla."
 cc_byz_venice.5.a: "Apoyar la reclamación de Venecia sobre la costa."
 cc_byz_venice.5.b: "Mediar entre Venecia y los húngaros."
 cc_byz_venice.5.c: "Dalmacia no es motivo de disputa para nosotros."

 # .6 The mainland question
 cc_byz_venice.6.title: "La cuestión de la tierra firme"
 cc_byz_venice.6.desc: "Venecia se está expandiendo hacia el continente, hacia ciudades que el emperador occidental considera suyas. Venecia agradecería nuestro apoyo contra los señores del Imperio, y recordaría la falta del mismo."
 cc_byz_venice.6.desc_exarch: "Nuestro exarca [cc_ven_exarch.GetName] gobierna la tierra junto a la laguna y ha empezado a ver la terraferma veneciana como un asunto pendiente. Venecia ha preguntado si él habla en nombre del emperador."
 cc_byz_venice.6.a: "Refrenar al exarca."
 cc_byz_venice.6.b: "Que los presione."
 cc_byz_venice.6.c: "Apoyar a Venecia en el continente."
 cc_byz_venice.6.d: "El territorio continental de Venecia es asunto de Venecia."

 # .7 The Stato da Mar
 cc_byz_venice.7.title: "El Stato da Mar"
 cc_byz_venice.7.desc: "Venecia posee [cc_ven_port.GetName], uno de los puertos que tomó del imperio después de 1204. Nuestros gobernadores en el Morea y las islas quieren recuperarlo. Venecia no lo cederá por la fuerza, pero es una república mercantil y podría venderlo, o cambiarlo por el precio adecuado en nuestros mercados."
 cc_byz_venice.7.desc_none: "Venecia ya no posee puertos en el Morea ni en el Egeo que valgan la pena negociar. Sus enviados lo han notado."
 cc_byz_venice.7.a: "Ofrecer comprarlo."
 cc_byz_venice.7.b: "Ofrecer derechos comerciales a cambio."
 cc_byz_venice.7.c: "Dejar el Stato da Mar a Venecia."
 cc_byz_venice.7.d: "No queda nada por lo que negociar."

 # .20 (Venice) The port offer
 cc_byz_venice.20.title: "Una oferta para [cc_ven_port.GetName]"
 cc_byz_venice.20.desc_buy: "[cc_ven_emperor.GetName] ofrece comprar [cc_ven_port.GetName] a la república por 25 de oro por punto de su desarrollo, entre 150 y 600."
 cc_byz_venice.20.desc_swap: "[cc_ven_emperor.GetName] ofrece a nuestros mercaderes derechos comerciales en sus mercados durante treinta años, a cambio de [cc_ven_port.GetName]."
 cc_byz_venice.20.a: "Aceptar."
 cc_byz_venice.20.b: "Rechazar."

 # .22 The port answer
 cc_byz_venice.22.title: "Venecia responde"
 cc_byz_venice.22.desc_yes: "Venecia ha aceptado. [cc_ven_port.GetName] regresa al imperio."
 cc_byz_venice.22.desc_no: "Venecia se ha negado. [cc_ven_port.GetName] sigue siendo veneciana."
 cc_byz_venice.22.a: "La bandera ondea sobre el puerto."
 cc_byz_venice.22.b: "En otro momento."

 # .8 The Emperor's vicariate
 cc_byz_venice.8.title: "El Vicariato del Emperador"
 cc_byz_venice.8.desc: "El emperador occidental ha ofrecido al dogo un vicariato imperial sobre las ciudades del continente. Esto convertiría a Venecia en un príncipe del Imperio. Los primeros dogos de Venecia ostentaron su título gracias a Constantinopla, y algunos en la laguna no lo han olvidado."
 cc_byz_venice.8.desc_member: "Venecia ahora forma parte de la dieta del Imperio, y el emperador occidental ha ofrecido al duca un lugar más prominente en ella. Los primeros ducas de Venecia ostentaron su título gracias a Constantinopla, y algunos en la laguna no lo han olvidado."
 cc_byz_venice.8.a: "Ofrecer al duca el antiguo título: dux y protosebastos."
 cc_byz_venice.8.b: "Superar la oferta del emperador occidental con oro."
 cc_byz_venice.8.c: "Permitir que Venecia elija a su emperador."

 # .9 St Mark's and the purple
 cc_byz_venice.9.title: "San Marcos y la Púrpura"
 cc_byz_venice.9.desc: "San Marcos fue construida siguiendo el plano de los Santos Apóstoles en Constantinopla, y su tesoro está lleno de objetos tomados de nuestras iglesias en 1204. Los procuradores de San Marcos han solicitado un regalo imperial para la basílica."
 cc_byz_venice.9.desc_union: "San Marcos fue construida siguiendo el plano de los Santos Apóstoles en Constantinopla. Con las iglesias reunificadas, los procuradores de San Marcos han solicitado un regalo imperial para la basílica, y Venecia habla de la unión como un logro propio."
 cc_byz_venice.9.desc_repudiated: "San Marcos fue construida siguiendo el plano de los Santos Apóstoles en Constantinopla. Dado que la unión fue repudiada, Venecia ha tenido que explicar su amistad con nosotros al Papa. Los procuradores de San Marcos han solicitado aun así un regalo imperial para la basílica."
 cc_byz_venice.9.a: "Enviar manuscritos a la biblioteca de San Marcos."
 cc_byz_venice.9.b: "Oro y esmalte para la Pala d'Oro."
 cc_byz_venice.9.c: "Pedir que el juramento del dogo mencione al emperador de nuevo."

 # .10 The climax
 cc_byz_venice.10.title: "La cuestión de la Serenísima"
 cc_byz_venice.10.desc: "Medio siglo de tratos con Venecia ha llegado a un punto de estabilidad. Las relaciones son correctas, pero no íntimas. Ninguna de las partes tiene motivos para cambiar eso."
 cc_byz_venice.10.desc_alliance: "Medio siglo de tratos con Venecia ha convertido a los dos estados en socios de hecho. El consejo del duca está listo para hacerlo permanente."
 cc_byz_venice.10.desc_ducate: "Medio siglo de tratos con Venecia ha ido más allá de lo que cualquiera en la laguna pretendía. Venecia confía en el imperio y lo necesita. Algunos en el consejo del duca ahora dicen abiertamente que la república fue una vez una provincia romana, y que podría reconocer al emperador de nuevo sin perder nada de lo que valora."
 cc_byz_venice.10.desc_rupture: "Medio siglo de tratos con Venecia ha terminado en desconfianza mutua. El bailo ha sido retirado. Venecia ya no finge ser nuestra amiga."
 cc_byz_venice.10.a: "Proponer el Ducado de Venecia."
 cc_byz_venice.10.b: "Proponer una alianza perpetua."
 cc_byz_venice.10.c: "Mantener la amistad tal como está."
 cc_byz_venice.10.d: "Entonces los puertos serán nuestros."
 cc_byz_venice.10.e: "Dirígete a Génova."

 # .25 (Venice) The proposal
 cc_byz_venice.25.title: "Una propuesta de Constantinopla"
 cc_byz_venice.25.desc_ducate: "[cc_ven_emperor.GetName] propone que Venecia reconozca al emperador como hicieron sus primeros ducas, como el Ducado de Venecia. La república conservaría su gobierno, flota, colonias y guerras, pagaría un pequeño tributo y permitiría que los mercaderes imperiales comerciaran libres de nuestros aranceles. Nunca podría ser anexionada y permanecería fuera del Imperio occidental."
 cc_byz_venice.25.desc_alliance: "[cc_ven_emperor.GetName] propone una alianza perpetua entre el imperio y la república, sin plazo determinado."
 cc_byz_venice.25.a: "Aceptar."
 cc_byz_venice.25.b: "Rechazar."

 # .26 The proposal answer
 cc_byz_venice.26.title: "Venecia decide"
 cc_byz_venice.26.desc_ducate: "El duca ha jurado lealtad al emperador. Venecia es nuevamente el Ducado de Venecia."
 cc_byz_venice.26.desc_alliance: "El duca ha jurado una alianza perpetua con el imperio."
 cc_byz_venice.26.desc_ducate_refused: "El consejo del duca no reconocerá al emperador. En su lugar, ha ofrecido una alianza perpetua."
 cc_byz_venice.26.desc_alliance_refused: "El consejo del duca ha rechazado una alianza perpetua. Las relaciones siguen siendo amistosas y sin vínculos."
 cc_byz_venice.26.a: "El Ducado de Venecia."
 cc_byz_venice.26.b: "Una alianza sin plazo determinado."
 cc_byz_venice.26.c: "Amigos, entonces."

 # .90 The question lapses
 cc_byz_venice.90.title: "La cuestión de la Serenísima caduca"
 cc_byz_venice.90.desc: "La cuestión de Venecia ha caducado."
 cc_byz_venice.90.desc_gone: "Venecia ya no existe como estado. No queda nadie en la laguna con quien tratar."
 cc_byz_venice.90.desc_city: "Constantinopla se ha perdido. Venecia no tiene motivos para tratar con un emperador que no la posee."
 cc_byz_venice.90.desc_subject: "Venecia se ha convertido en vasalla de otra potencia y ya no puede imponer sus propios términos."
 cc_byz_venice.90.desc_war: "Diez años de guerra con Venecia han acabado con cualquier perspectiva de resolver la cuestión."
 cc_byz_venice.90.a: "Que así sea."
 LEAD_cc_byz_venetian_ducate: "Emperador"
 AM_cc_byz_venetian_ducate: "Ducado de Venecia"
 CANCEL_cc_byz_venetian_ducateTITLE: "Liberar el Ducado"
 CANCEL_cc_byz_venetian_ducate_DESC: "Liberar a Venecia de su reconocimiento al emperador. La república vuelve a ser plenamente independiente."
 CANCEL_cc_byz_venetian_ducate_CATEGORY: "CATEGORY_SUBJECT_ACTIONS"
