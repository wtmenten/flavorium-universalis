l_spanish:
 # Country modifiers
 STATIC_MODIFIER_NAME_cc_byz_protector_of_the_see: "Protector de la Sede"
 STATIC_MODIFIER_DESC_cc_byz_protector_of_the_see: "El papado existe porque el emperador lo permitió. Todas las cortes católicas de Europa comprenden el acuerdo y muchas de ellas están discretamente agradecidas por ello."

 # Opinion modifiers
 cc_byz_papal_forbearance: "Nos dejaron nuestra dignidad"
 cc_byz_papal_captivity: "Nos tiene cautivos"

 # Casus belli
 cc_byz_cb_recover_the_islands: "Recuperar las islas"
 cc_byz_cb_recover_the_islands_desc: "El Egeo fue un lago imperial en la memoria viva. Ahora está dividido en pedazos entre un ducado que responde a Venecia, una familia genovesa en Quíos, una orden cruzada en Rodas y quienquiera que posea actualmente Negroponte. Ninguno de ellos puede defender lo que posee contra una flota. Todos ellos pueden apelar a alguien que sí pueda."
 cc_byz_cb_consolidate_italy: "Consolidar el Exarcado"
 cc_byz_cb_consolidate_italy_desc: "Un exarca en Roma tiene derecho a argumentar en cualquier lugar de Italia, y el derecho solo vale la pena argumentarlo mientras haya un exarca para hacerlo. Pierde el exarcado y esto se irá con él."

 # cc_byz_exarch.1 - the first independent decision
 cc_byz_exarch.1.title: "Una decisión tomada sin preguntar"
 cc_byz_exarch.1.desc: "El exarca ha resuelto una disputa entre dos señores italianos, en nombre del emperador, bajo su propia autoridad, y lo ha informado posteriormente en una carta que es respetuosa en cada línea y no pide permiso para nada.\n\nLa resolución es buena. Un hombre en Constantinopla no habría podido alcanzarla, al no tener ni el conocimiento local ni los seis meses que habría llevado la correspondencia. Por eso exactamente fue nombrado y por eso exactamente la carta se está leyendo tres veces en el palacio."
 cc_byz_exarch.1.desc_strategos: "El exarca ha resuelto una disputa entre dos señores italianos bajo su propia autoridad y lo ha informado posteriormente, que es para lo que fue nombrado, ya que fue nombrado en términos que le otorgaban la mayor libertad posible.\n\nLa resolución es sólida. También es la tercera carta de este tipo este año, y el palacio ha empezado a notar que los informes llegan con un intervalo cómodo después de las decisiones, y que nada en ninguno de ellos ha sido jamás formulado como una pregunta."
 cc_byz_exarch.1.a: "Confírmelo. Fue nombrado para decidir las cosas."
 cc_byz_exarch.1.b: "Anularlo. El siguiente vendrá aquí primero."
 cc_byz_exarch.1.c: "Confírmelo públicamente. Corríjalo en privado."

 # cc_byz_exarch.2 - going native
 cc_byz_exarch.2.title: "La corte del Exarca"
 cc_byz_exarch.2.desc: "Los informes de Roma se han vuelto detallados sobre un tema que nadie preguntó.\n\nLa casa del exarca ahora mantiene el uso del latín. Sus secretarios escriben en él porque los hombres a quienes escriben lo leen. Su capilla sigue el rito local porque el clero local la compone. Sus hijos están siendo educados por italianos porque esos son los tutores disponibles, y ha tomado una esposa italiana, lo cual fue sensato, y la familia de ella está ahora en su mesa, lo cual era inevitable.\n\nNada de esto fue desobediencia. Fue enviado a gobernar Roma y está gobernando Roma. La ironía no ha pasado desapercibida para el emperador que se negó a mudarse allí."
 cc_byz_exarch.2.a: "Dejarlo. Un gobernador asentado en su provincia la gobierna mejor."
 cc_byz_exarch.2.b: "Envía clérigos y escribientes griegos, a nuestra costa."
 cc_byz_exarch.2.c: "Convocar a sus hijos para que sean criados en el palacio."

 # cc_byz_exarch.3 - correspondence
 cc_byz_exarch.3.title: "La correspondencia del Exarca"
 cc_byz_exarch.3.desc: "El exarca mantiene correspondencia con Venecia, con Génova, con dos de las comunas del norte y con un cardenal, y el palacio lo sabe porque él nunca ha intentado ocultarlo.\n\nÉl diría, y ha dicho, que un gobernador en Italia que no habla con los italianos es un gobernador que se entera de todo seis meses tarde. Esto es cierto. También es cierto que ahora él es el hombre en Italia que sabe lo que todos están haciendo, y que Constantinopla se entera a través de él."
 cc_byz_exarch.3.desc_latinised: "El exarca mantiene correspondencia con la mitad de Italia, en latín, a través de secretarios que nacieron allí, y las cartas que llegan a Constantinopla son resúmenes que él mismo ha preparado.\n\nÉl diría que un gobernador que no habla con sus vecinos es inútil, y tiene razón. Lo que ha cambiado es que la corte en Roma parece ahora, para cualquiera en Italia con asuntos que transaccionar, el lugar donde realmente se decide la política imperial. Varios de ellos han dejado de escribir a Constantinopla por completo."
 cc_byz_exarch.3.a: "Un gobernador en Italia debe hablar con italianos."
 cc_byz_exarch.3.b: "Cada carta debe copiarse y enviarse a la capital."
 cc_byz_exarch.3.c: "Úsalo. Es un instrumento por el que no estamos pagando."

 # cc_byz_exarch.4 - the recall
 cc_byz_exarch.4.title: "La Convocatoria"
 cc_byz_exarch.4.desc: "El exarca es convocado a Constantinopla para informar en persona. La redacción es afectuosa, la ocasión plausible, y nadie implicado está confundido sobre lo que se está poniendo a prueba.\n\nSi viene, el acuerdo se mantiene: un gobernador que puede ser llamado a casa es un gobernador. Si no lo hace, entonces sea lo que sea en lo que se haya convertido el exarcado, dejó de serlo hace algunos años y el palacio acaba de ponerse al día para preguntarlo."
 cc_byz_exarch.4.a: "Insiste. Envía a alguien para escoltarlo."
 cc_byz_exarch.4.b: "Retíralo antes de que sea rechazado públicamente."
 cc_byz_exarch.4.c: "Ofrécele algo aquí que valga más que Roma."

 # cc_byz_exarch.5 - the ending
 cc_byz_exarch.5.title: "El Exarcado"
 cc_byz_exarch.5.desc_dynasty: "La oficina es ahora hereditaria. No se hizo ninguna concesión ni existe ningún fuero; un hijo sucedió a un padre, se informó al palacio, y el palacio descubrió que sus respuestas disponibles eran una guerra en Italia que no podía financiar o una carta de felicitación. Envió la carta.\n\nLos exarcas remiten una suma cada año, que es menor de lo que era y llega a tiempo, y luchan en las guerras del imperio cuando las guerras del imperio son también las suyas. En todos los demás aspectos, Roma es gobernada por una familia que la posee por derecho propio y cuya autoridad data de un nombramiento que ningún vivo recuerda.\n\nAsí es como el imperio perdió el oeste la primera vez. En aquella ocasión tomó bastante más tiempo."
 cc_byz_exarch.5.desc_absorbed: "El exarcado ha dejado de serlo discretamente. El exarca actual es el cuarto, fue elegido en Constantinopla de una lista preparada en Constantinopla, sirvió en otros dos puestos antes que este y espera servir en otro después, y la diferencia entre su posición y la de cualquier otro gobernador es ahora puramente una cuestión del título en su correspondencia.\n\nRoma es una provincia. Es administrada, evaluada y guarnecida desde la capital, y los hombres que la administran son funcionarios más que una familia. El acuerdo que se inventó para evitar trasladar la capital ha terminado haciendo que el traslado sea innecesario."
 cc_byz_exarch.5.desc_standing: "El acuerdo persiste, lo cual no es lo mismo que estar resuelto.\n\nEl exarca obedece las instrucciones que llegan con autoridad suficiente detrás de ellas e interpreta el resto. Remite lo que juzga que la capital necesita y retiene lo que juzga que Roma necesita, y su juicio ha sido ampliamente defendible. Su sucesor será elegido en parte en Constantinopla y en parte en Roma, mediante un proceso que nadie ha puesto por escrito, y ambas partes describirán el resultado como habiendo sido su decisión.\n\nFunciona. A ninguno de los involucrados le interesaría explicar precisamente por qué."
 cc_byz_exarch.5.desc_recalled: "El acuerdo se mantiene, y todos los involucrados saben precisamente lo cerca que estuvo de no hacerlo.\n\nFue convocado y vino. Estuvo en Constantinopla once semanas, fue bien recibido, regresó a su puesto y todo el asunto se describe ahora como una consulta. Lo que estableció es que la convocatoria funciona, algo que el palacio necesitaba saber y no tenía otra forma de averiguar.\n\nTambién estableció el precio. Vino porque venir era, en balance, mejor que la alternativa, y ambas partes hicieron ese cálculo. El próximo exarca también lo hará, y los términos no siempre favorecerán a la capital tan estrechamente como esta vez."
 cc_byz_exarch.5.a: "Que así permanezca."

 # cc_byz_papal.1 - the rite
 cc_byz_papal.1.title: "El Rito en las Iglesias de la Ciudad"
 cc_byz_papal.1.desc: "El exarca requiere instrucciones sobre un punto que no puede resolver él mismo, y tiene razón en que no puede.\n\nRoma es una ciudad católica administrada por un designado ortodoxo en nombre de un emperador ortodoxo. Sus iglesias celebran el rito latino porque siempre lo han hecho. La cuestión es si continúan haciéndolo, si algo cambia en las iglesias principales y si el nombre del emperador se pronuncia en la liturgia de una ciudad cuyo obispo lo considera un cismático.\n\nNo hay respuesta que no sea una declaración, incluida la respuesta de dejarlo como está."
 cc_byz_papal.1.a: "No interferir con las iglesias. El rito no es asunto nuestro."
 cc_byz_papal.1.b: "Liturgia griega en las iglesias principales."
 cc_byz_papal.1.c: "Una iglesia griega, ricamente dotada. No se toca nada más."

 # cc_byz_papal.2 - guest, subject or hostage
 cc_byz_papal.2.title: "El obispo de Roma"
 cc_byz_papal.2.desc: "El estatus del Papa no ha sido definido porque definirlo ha sido conveniente para evitarlo y porque ninguna definición complacería a nadie.\n\nVive en una ciudad que administra el gobernador del emperador. Tiene una casa, una correspondencia, unos ingresos y muchísimos visitantes, y actualmente los cuatro continúan porque nadie ha decidido que no deban hacerlo. El exarca pide una norma, habiendo quedado en la posición de improvisar una cada vez que surge una pregunta, y tiene derecho a pedirla."
 cc_byz_papal.2.desc_hostile: "El estatus del Papa no ha sido definido, y la ausencia de una definición ha dejado de ser conveniente.\n\nLas relaciones son malas. Él ha protestado los nombramientos, el rito y la tributación, en ese orden y por escrito, y las cartas han circulado por occidente. Tiene una casa, una correspondencia y muchísimos visitantes, y el exarca ha empezado a preguntar, con cierta urgencia, cuál de esas tres cosas se espera que permita."
 cc_byz_papal.2.a: "Un invitado. Su casa, su guardia, sus cartas."
 cc_byz_papal.2.b: "Un vasallo. Pagamos por la casa y leemos las cartas."
 cc_byz_papal.2.c: "Dejarlo sin definir. La práctica lo resolverá."

 # cc_byz_papal.3 - appointments
 cc_byz_papal.3.title: "Nombramientos sin asentimiento"
 cc_byz_papal.3.desc: "El Papa ha nombrado obispos en sedes dentro del exarcado sin consultar al exarca ni a Constantinopla.\n\nÉl diría que nombrar obispos es para lo que sirve, y que nunca se le ha preguntado a ningún emperador. El emperador diría que ningún emperador ha gobernado la ciudad antes, y que los hombres nombrados poseen tierras, recaudan ingresos y cuentan con la lealtad de poblaciones de las que el exarca es responsable.\n\nAmbas posiciones tienen cuatrocientos años de precedentes. Los precedentes no coinciden, razón por la cual existen cuatrocientos años de ellos."
 cc_byz_papal.3.desc_subject: "El Papa ha nombrado obispos dentro del exarcado sin consultar a nadie, lo cual es una afirmación considerable por parte de un hombre cuya casa es pagada con las cuentas del exarca.\n\nEl exarca señala también en su informe que en Italia se está interpretando exactamente así: como una demostración de que el papado aún funciona, realizada por un papado que tiene muy poco más con qué demostrarlo. Rechazar los nombramientos confirmaría lo que los críticos del emperador dicen sobre el acuerdo. Aceptarlos confirmaría lo que dicen sobre el emperador."
 cc_byz_papal.3.a: "Rechazadlos. Nombremos a nuestros propios hombres."
 cc_byz_papal.3.b: "Acéptalos. Un obispo es un obispo."
 cc_byz_papal.3.c: "Que el exarca lo resuelva localmente."

 # cc_byz_papal.4 - excommunication
 cc_byz_papal.4.title: "La Sentencia"
 cc_byz_papal.4.desc: "La sentencia de excomunión ha sido pronunciada y publicada, contra el exarca por nombre y contra el emperador en términos que no dejan lugar a dudas.\n\nContra el emperador es casi irrelevante: él no pertenece a esa comunión y no ha pertenecido a ella desde antes de que naciera su abuelo. Contra el exarca no es en absoluto irrelevante. Él gobierna católicos, sus soldados son católicos, la familia de su esposa son católicos, y a cada uno de ellos se le ha dicho ahora su propia iglesia que la obediencia hacia él es un pecado.\n\nEl Papa ha seleccionado el único instrumento que no le cuesta nada al emperador y le cuesta todo a su gobernador."
 cc_byz_papal.4.a: "Ignóralo. Nunca estuvimos en su comunión."
 cc_byz_papal.4.b: "Destituir al exarca. Nombrar a alguien aceptable."
 cc_byz_papal.4.c: "Haz que se levante a través de la legación, no por sumisión."

 # cc_byz_papal.10 - THE GUARD
 cc_byz_papal.10.title: "Lo último del patrimonio"
 cc_byz_papal.10.desc: "Los Estados Pontificios han terminado como poder temporal. Lo que queda es una ciudad, una casa y un anciano con un título, y los ejércitos en campaña podrían acabar con los tres en una sola estación.\n\nEl argumento a favor de terminar con ello es que un papado con territorio es un papado que puede reunir ejércitos, financiar enemigos y tomar partido, y ha hecho las tres cosas. El argumento en contra es más sutil y el exarca lo ha expresado bien: el cargo sobrevive a la destrucción del estado, y un papa que ha sido despojado de todo es un papa cuyos sucesores son elegidos por quienquiera que los cobije. Es mejor un papado que debe su existencia al emperador que un papado bajo la tutela de otro, elegido en la ciudad de otro, permanentemente a disposición de cualquier potencia occidental que lo haya acogido.\n\nLos cardenales están atentos a lo que se decida. Al igual que cada corte católica en Europa."
 cc_byz_papal.10.a: "Dejarle la ciudad. Tomar el resto."
 cc_byz_papal.10.b: "Tomar la ciudad. Dejarle el cargo."
 cc_byz_papal.10.c: "Terminar con ello. No habrá más papas."

 # cc_byz_papal.11 - no papacy
 cc_byz_papal.11.title: "Una iglesia sin cabeza"
 cc_byz_papal.11.desc: "No hay papa, y no hay procedimiento para producir uno, porque cada procedimiento que existía pasaba por una institución que ya no existe.\n\nLos cardenales están dispersos por cuatro países y cada grupo sostiene que solo él constituye el colegio. Tres reyes se han ofrecido a albergar una elección y cada oferta ha sido entendida por los otros dos como un intento de comprar el papado directamente. Los obispos se escriben furiosamente y no se ponen de acuerdo en nada.\n\nLa cristiandad occidental está descubriendo lo que significa no tener un árbitro, y lo está descubriendo debido a una decisión tomada en Constantinopla."
 cc_byz_papal.11.a: "Que lo discutan entre ellos."
 cc_byz_papal.11.b: "Convoquemos nosotros mismos a los obispos occidentales."
 cc_byz_papal.11.c: "La sede está vacante. Sus derechos revierten a los patriarcas."

 # cc_byz_italy.1 - Guelph and Ghibelline
 cc_byz_italy.1.title: "Güelfos y gibelinos"
 cc_byz_italy.1.desc: "Italia ha estado dividida durante un siglo entre el partido del Papa y el partido del Emperador, y la división dejó hace tiempo de tratar sobre cualquiera de los dos. Es la forma en que una comuna sabe a cuál de sus vecinos odiar.\n\nEn esto llega un exarcado: un nuevo poder en Italia, que posee Roma y gobierna en nombre de un emperador que es incuestionablemente un emperador y que no es aquel al que se refieren los gibelinos. Ambos partidos han enviado representantes. Ambos han explicado que la posición del exarcado es obviamente la suya. Ninguno ha considerado que pudiera ser una tercera vía."
 cc_byz_italy.1.a: "Los gibelinos. Ya hay un emperador en esta disputa."
 cc_byz_italy.1.b: "Los güelfos. Poseemos la ciudad del Papa; poseamos también a su partido."
 cc_byz_italy.1.c: "Ninguno. Nosotros somos el partido imperial."

 # cc_byz_italy.2 - the quarters
 cc_byz_italy.2.title: "Los Barrios en los Puertos"
 cc_byz_italy.2.desc: "Las repúblicas quieren en los puertos del exarcado lo que tienen en Constantinopla: un barrio, un almacén, sus propios tribunales para su propia gente y la exención de los aranceles que pagan todos los demás.\n\nSeñalan que tienen esas cosas en todas las demás partes de esta costa y que el comercio simplemente irá a los puertos donde sí las tengan. Esto es cierto. No señalan que un barrio con sus propios tribunales es una pieza de otro estado, porque todo el mundo en la sala ya lo sabe y decirlo sería indelicado."
 cc_byz_italy.2.desc_indebted: "Las repúblicas quieren barrios en los puertos del exarcado, y la petición ha sido formulada con una delicadeza que es, en sí misma, el mensaje.\n\nHan mencionado los saldos pendientes solo una vez, al principio, de pasada, como un asunto que confían que no necesite afectar la discusión actual. Nadie en la sala creyó eso y nadie debía creerlo. Se le pide un favor al emperador por parte de hombres que podrían cobrar lo que él debe, y el hecho de que hayan optado por pedir en lugar de exigir es la cortesía que se está extendiendo."
 cc_byz_italy.2.a: "Concede los barrios. Necesitamos el comercio."
 cc_byz_italy.2.b: "Rechazar. Guarnecer los puertos adecuadamente."
 cc_byz_italy.2.c: "Solo una república, a condición de que excluya a las demás."

 # cc_byz_italy.3 - the communes
 cc_byz_italy.3.title: "Las comunas"
 cc_byz_italy.3.desc: "Las comunas del exarcado preferirían no ser gobernadas por un funcionario imperial, y están siendo cuidadosas al explicar que esto no es nada personal.\n\nHan gestionado sus propios asuntos durante seis generaciones a través de consejos, cónsules y un cuerpo de costumbres que precede a cualquier reclamación actual sobre ellas. Lo que quieren es lo que siempre han querido: ser confirmadas en sus libertades por una autoridad distante que luego se marche. Varias han sugerido un signore de su propia elección que dependiera del exarca, lo cual resuelve el problema elegantemente y crea uno diferente."
 cc_byz_italy.3.a: "Guarnecerlas."
 cc_byz_italy.3.b: "Que cada uno conserve a su signore, confirmado por el exarca."
 cc_byz_italy.3.c: "Cómpralos con fueros en lugar de guarniciones."

 # cc_byz_italy.4 - a second emperor
 cc_byz_italy.4.title: "Dos emperadores romanos"
 cc_byz_italy.4.desc: "La cuestión se ha planteado en el norte, formalmente, en un documento destinado a ser leído en voz alta: ¿con qué derecho el gobernante de Constantinopla se hace llamar emperador romano mientras un emperador romano es coronado en el oeste, y con qué otro derecho mantiene una guarnición en Roma?\n\nLa respuesta son once hundred años de sucesión continua desde Augusto, y es una respuesta muy buena, y nunca ha logrado resolver este argumento. El oeste tiene su propia respuesta, de calidad comparable, y las dos han coexistido mediante el simple recurso de que ninguna de las partes poseyera Roma. Ese recurso ha desaparecido ahora."
 cc_byz_italy.4.desc_ghibelline: "La cuestión se ha planteado en el norte, y la incomodidad es considerable, porque el exarcado está inscrito en el partido imperial de una disputa sobre a qué emperador se refiere.\n\nLos gibelinos aceptaron en su partido al gobernador de un emperador oriental bajo el entendimiento de que un emperador es un emperador y que los enemigos de Italia son los amigos del Papa. Su patrón en Alemania ha preguntado ahora, por escrito y públicamente, a qué emperador exactamente se considera que el partido imperial está apoyando. Nadie en el partido desea responder y el documento requiere que alguien lo haga."
 cc_byz_italy.4.desc_dynasty: "La cuestión se ha planteado en el norte: ¿con qué derecho el gobernante de Constantinopla se hace llamar emperador romano, y con qué otro derecho mantiene una guarnición en Roma?\n\nLa segunda mitad de la pregunta es la dificultad, porque la respuesta honesta es que no lo hace. Roma está en manos de una familia que la ha gobernado durante cuatro generaciones, remite un pago de cortesía y trataría una instrucción de Constantinopla sobre su conducta hacia el emperador occidental como un asunto sujeto a su propio juicio.\n\nEl documento del norte ha sido dirigido a Constantinopla. La respuesta, diga lo que diga, tendrá que ser ejecutada por personas que no la escribieron y a quienes no se les pidió."
 cc_byz_italy.4.desc_absorbed: "La cuestión se ha planteado en el norte: ¿con qué derecho el gobernante de Constantinopla se hace llamar emperador romano, y con qué otro derecho mantiene una guarnición en Roma?\n\nEn esta ocasión la respuesta es sencilla, lo cual es lo suficientemente inusual como para merecer la pena destacarlo. Roma es una provincia. Es tasada, guarnecida y administrada por funcionarios nombrados en Constantinopla y revocados a voluntad, exactamente como lo es Tracia. El emperador posee la ciudad en el mismo sentido en que posee cualquier otra ciudad, y la reclamación occidental es una reclamación contra un estado que demuestra estar gobernando el lugar.\n\nEsa es una posición mucho mejor para argumentar de la que el imperio ha ocupado en Italia durante ochocientos años."
 cc_byz_italy.4.a: "Responde en la misma moneda. Solo hay un emperador romano."
 cc_byz_italy.4.b: "No digas nada. Los títulos son baratos y Roma no lo es."
 cc_byz_italy.4.c: "Proponer que los dos imperios se reconozcan mutuamente."
