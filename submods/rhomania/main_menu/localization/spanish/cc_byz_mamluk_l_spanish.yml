l_spanish:
 # Situation
 cc_byz_mamluk_confrontation: "La confrontación levantina"
 cc_byz_mamluk_confrontation_desc: "Con Anatolia asentada, el imperio y el Sultanato de El Cairo se enfrentan a través de una frontera que ninguno de los dos eligió, sobre lugares sagrados que ambos reclaman, mientras las repúblicas italianas venden y prestan a ambos.\n\nPuede resolverse mediante la negociación. Un condominio escrito sobre los lugares sagrados es un final real y varios emperadores han pensado que es el mejor disponible. También puede convertirse en la Guerra de la Pentarquía, que es el otro tipo de final."

 # Country modifiers
 STATIC_MODIFIER_NAME_cc_byz_pentarchy_restored: "La Pentarquía Restaurada"
 STATIC_MODIFIER_DESC_cc_byz_pentarchy_restored: "Constantinopla, Roma, Jerusalén, Antioquía y Alejandría. Las cinco sedes antiguas responden a un solo emperador por primera vez desde el siglo VII, y cada disputa sobre la autoridad en el mundo cristiano tiene ahora una única dirección."

 # Opinion modifiers
 cc_byz_levant_accommodation: "Un acuerdo en el Levante"
 cc_byz_abandoned_the_east: "Abandonó las Sedes Orientales"

 # cc_byz_mamluk.1 - the holy places
 cc_byz_mamluk.1.title: "La custodia de los Lugares Santos"
 cc_byz_mamluk.1.desc: "El acuerdo en el Santo Sepulcro es antiguo, complicado y ha estado funcionando a su manera durante dos siglos.\n\nEl sultán posee la ciudad. El clero ortodoxo posee las llaves de la mayor parte de lo importante, sujeto a tributos pagados anualmente a El Cairo. Los peregrinos vienen, pagan impuestos y son protegidos, que es un servicio que el sultán proporciona competentemente porque los peregrinos son rentables.\n\nLo que ha cambiado es que ahora hay un emperador al norte que no está luchando por su supervivencia, y que considera que estos derechos le pertenecen por herencia en lugar de ser una licencia del sultán. El clero en Jerusalén, que tiene que vivir allí, ha pedido con cierta vehemencia que considere el asunto cuidadosamente."
 cc_byz_mamluk.1.desc_unionist: "El acuerdo en el Santo Sepulcro es antiguo y complicado, y acaba de volverse aún más.\n\nLa unión ha sido firmada, y los latinos la han interpretado como la resolución de una cuestión que había estado abierta desde las cruzadas: si las iglesias son una sola iglesia bajo Roma, entonces las reclamaciones latinas de custodia en Jerusalén ya no compiten con las del emperador, sino que son la misma reclamación, y los franciscanos han comenzado a actuar según esa interpretación sin esperar a que se les solicite.\n\nEl clero ortodoxo en Jerusalén ha escrito a Constantinopla. Su carta es respetuosa y su fondo es que el emperador ha adquirido un socio en este asunto que ellos no querían y no pueden eliminar."
 cc_byz_mamluk.1.a: "Pagar las cuotas, como ha hecho cada emperador desde la conquista."
 cc_byz_mamluk.1.b: "La custodia es nuestra por herencia. Deja de pagar."
 cc_byz_mamluk.1.c: "Negociar un acuerdo permanente. Cuotas fijas, derechos fijos."

 # cc_byz_mamluk.2 - Cairo
 cc_byz_mamluk.2.title: "El Emperador del Norte"
 cc_byz_mamluk.2.desc: "Los informes de la frontera norte han cambiado de carácter. Durante dos siglos el imperio de los griegos ha sido una potencia agotada con la que comerciar, ocasionalmente saquear y, por lo demás, en la que no se pensaba.\n\nYa no está agotada. Ha asentado Anatolia, tiene una flota y ha empezado a hacer preguntas sobre Jerusalén en un tono que el diván encuentra desconocido. Los asesores del sultán están divididos entre quienes consideran esto una oportunidad comercial y quienes lo consideran un problema fronterizo, y ambos grupos tienen precedentes a su favor."
 cc_byz_mamluk.2.a: "Un problema fronterizo. Reforzar el norte."
 cc_byz_mamluk.2.b: "Una oportunidad comercial. Discusiones abiertas."

 # cc_byz_mamluk.3 - spice and grain
 cc_byz_mamluk.3.title: "Especias, Grano y las Repúblicas"
 cc_byz_mamluk.3.desc: "El tránsito del Mar Rojo y las fábricas de Alejandría son el comercio más rico del mundo, y pasan por las manos de El Cairo hacia los barcos venecianos y genoveses.\n\nLas repúblicas son totalmente sinceras al respecto cuando se les pregunta. Comercian con El Cairo porque El Cairo tiene las especias; comerciarían con Constantinopla en su lugar si Constantinopla las tuviera; y, mientras tanto, no ven contradicción en hacer negocios con una potencia con la que el emperador está enfrentado, porque ellas son mercaderes y él no es su soberano.\n\nLos estrechos, sin embargo, son suyos."
 cc_byz_mamluk.3.desc_indebted: "El tránsito del Mar Rojo pasa por las manos de El Cairo hacia los barcos venecianos y genoveses, y la posición del emperador en el asunto se complica por el hecho de que esas mismas casas poseen una gran cantidad de sus pagarés.\n\nEllos mismos han sacado el tema, que es la forma cortés de hacerlo. Sus agentes observan que un cierre de los estrechos sería un asunto grave para sus negocios en Alejandría, que sus negocios en Alejandría son los que sirven los préstamos, y que confían en que estas consideraciones no tengan que contraponerse.\n\nTodo en esa formulación es cierto. También es una descripción de quién está en posición de incomodar a quién."
 cc_byz_mamluk.3.a: "Que comercien. Las aduanas valen más que el principio."
 cc_byz_mamluk.3.b: "Cierre los estrechos al comercio de Alejandría."
 cc_byz_mamluk.3.c: "Llevarse una parte. Convertirse en parte del comercio."

 # cc_byz_mamluk.4 - the frontier
 cc_byz_mamluk.4.title: "La frontera"
 cc_byz_mamluk.4.desc: "La frontera entre el imperio y el sultanato no es una línea y nunca ha sido trazada como tal.\n\nEs una franja de territorio de doscientas millas de profundidad, ocupada por turcomanos y beduinos que pastorean en ella estacionalmente, guarnecida por emires que dependen de El Cairo en un sentido que varía según la frecuencia con la que fueron pagados, y administrada por nadie. Las incursiones son constantes, de bajo nivel, y entendidas por todos los involucrados como una forma de tributación más que como una guerra.\n\nDos de los emires fronterizos han hecho acercamientos a Constantinopla. Ambos tuvieron cuidado de dejarse la opción de negarlo."
 cc_byz_mamluk.4.desc_war: "La frontera ha dejado de ser una franja de territorio para convertirse en un frente, y los hombres que viven en ella han tenido que decidir cosas que pasaron dos siglos sin decidir.\n\nLos turcomanos han movido sus rebaños hacia el sur, lejos de las campañas, lo que ha vaciado cien millas de pastoreo y eliminado la mejor fuente de inteligencia del imperio sobre lo que se avecina. Los emires fronterizos que negociaban discretamente con Constantinopla han guardado silencio; un emir que vacila en tiempos de paz es prudente, un emir que vacila en tiempos de guerra es un traidor, y ellos saben bajo cuál de los dos serían juzgados.\n\nLas incursiones han cesado. Nadie en el mando fronterizo considera que esto sea una buena noticia."
 cc_byz_mamluk.4.a: "Compra a los emires. Están en venta."
 cc_byz_mamluk.4.b: "Guarnecer las ciudades fronterizas. Que las incursiones lleguen hasta las murallas."
 cc_byz_mamluk.4.c: "Dejar la frontera en manos de los hombres que viven en ella."

 # cc_byz_mamluk.5 - Cairo's troubles
 cc_byz_mamluk.5.title: "Problemas en El Cairo"
 cc_byz_mamluk.5.desc: "El sultán ha muerto y la sucesión se está resolviendo de la manera en que se resuelven las sucesiones mamelucas, es decir, por los emires veteranos, por etapas, con tropas en las calles.\n\nEsto no es ni una crisis ni una sorpresa; el sultanato ha cambiado de manos de esta manera durante dos siglos y el estado ha sobrevivido cada vez. Lo que esto significa es que durante dieciocho meses o más nadie en El Cairo puede tomar una decisión vinculante sobre nada, las guarniciones fronterizas están siendo atraídas hacia el sur por facciones que las necesitan, y la frontera norte está tan abierta como nunca.\n\nLos informes llegaron a Constantinopla tres semanas después de los hechos. Llegarán a Venecia aproximadamente ahora."
 cc_byz_mamluk.5.a: "Aprovechar la ventaja mientras se pelean."
 cc_byz_mamluk.5.b: "Subvencionar a la facción perdedora. Mantenerla activa."
 cc_byz_mamluk.5.c: "Ofrecer condiciones. Necesita una frontera norte tranquila."

 # cc_byz_mamluk.10 - the eastern patriarchs
 cc_byz_mamluk.10.title: "Los patriarcas orientales"
 cc_byz_mamluk.10.desc: "Los patriarcas de Antioquía, Jerusalén y Alejandría son ortodoxos, son coreligionarios del emperador y son súbditos del sultán. Los tres hechos son permanentes y el tercero es el que gobierna.\n\nHan apelado a Constantinopla, como hacen periódicamente, por las restricciones a la construcción, a las procesiones y al nombramiento de obispos. La apelación es genuina y los agravios son reales.\n\nTambién ocurre que cada intervención imperial previa en su nombre ha sido seguida de represalias contra ellos, y que lo saben y han apelado de todos modos, lo que dice al palacio algo sobre lo mal que se han puesto las cosas."
 cc_byz_mamluk.10.desc_unionist: "Los patriarcas de Antioquía, Jerusalén y Alejandría han apelado a Constantinopla, y esta vez su carta dedica más espacio a la unión que al sultán.\n\nNo fueron consultados. No estuvieron representados en el concilio. Se les ha informado, mediante un documento llegado de una ciudad que ninguno de ellos ha visitado, que ahora están en comunión con Roma, y su propio clero les pregunta qué significa esto para sedes que han sido ortodoxas bajo el dominio musulmán durante ochocientos años y han sobrevivido siendo inequívocas al respecto.\n\nLos agravios contra el sultán también están en la carta, más abajo."
 cc_byz_mamluk.10.a: "Protegerlos abiertamente."
 cc_byz_mamluk.10.b: "Déjalos a sus propios arreglos."
 cc_byz_mamluk.10.c: "Extraer garantías escritas en lugar de protección."

 # cc_byz_mamluk.11 - escalation
 cc_byz_mamluk.11.title: "Acuerdo o Guerra"
 cc_byz_mamluk.11.desc: "La confrontación ha llegado al punto en que o se convierte en un acuerdo o se convierte en una guerra, y no permanecerá donde está mucho tiempo más.\n\nEl argumento a favor de un acuerdo es que el imperio tiene más fronteras que ejércitos, que El Cairo es un estado competente que cumple los acuerdos que firma y que un condominio escrito sobre los lugares santos daría al emperador en la práctica la mayor parte de lo que una guerra le daría en teoría.\n\nEl argumento a favor de la guerra es que las sedes de Jerusalén, Antioquía y Alejandría son tres de las cinco, que ningún emperador desde Heraclio las ha poseído y que el argumento sobre quién habla por toda la iglesia no puede ganarse sin ellas."
 cc_byz_mamluk.11.desc_condominium: "La confrontación ha llegado a su punto decisivo y los cimientos para una respuesta pacífica ya están establecidos.\n\nLas negociaciones sobre los lugares santos han avanzado más de lo que nadie esperaba. Existe un borrador. Es detallado, ha sobrevivido a varias rondas de objeciones de ambas partes y los funcionarios que lo redactaron se sienten discretamente orgullosos de él. Firmado, resolvería la cuestión de la custodia por escrito por primera vez desde las cruzadas.\n\nLa alternativa también está sobre la mesa, porque las sedes de Jerusalén, Antioquía y Alejandría son tres de las cinco, y un borrador de acuerdo no es lo mismo que una pentarquía."
 cc_byz_mamluk.11.a: "Firmar el condominio. Es una paz mejor que una guerra."
 cc_byz_mamluk.11.b: "Mantener la presión. No comprometerse a nada."
 cc_byz_mamluk.11.c: "La Guerra de la Pentarquía. Tres sedes, y la disputa resuelta."

 # cc_byz_mamluk.12 - the seats
 cc_byz_mamluk.12.title: "Las sedes antiguas"
 cc_byz_mamluk.12.desc: "Una sede que ha estado bajo dominio musulmán desde el siglo VII ha sido recuperada, y la ceremonia de instalación de un patriarca en ella ha tenido que ser reconstruida a partir de los archivos, porque ninguna persona viva ha visto una.\n\nLa congregación que se reunió para ello es la misma congregación que estuvo allí el año anterior, adorando en el mismo edificio bajo el mismo clero. Nada en su fe ha cambiado. Lo que ha cambiado es la autoridad sobre sus cabezas, y varios de ellos han observado en privado que ya han visto cambiar a las autoridades anteriormente."
 cc_byz_mamluk.12.a: "Que la instalación se realice correctamente."
 cc_byz_mamluk.12.b: "Hay cinco asientos. Continúe."

 # cc_byz_mamluk.13 - the pentarchy
 cc_byz_mamluk.13.title: "La Pentarquía restaurada"
 cc_byz_mamluk.13.desc: "Constantinopla, Roma, Jerusalén, Antioquía y Alejandría. Las cinco, en manos de un solo emperador, por primera vez desde antes de las conquistas árabes.\n\nLos cinco patriarcados eran la estructura a través de la cual la iglesia indivisa se gobernaba a sí misma, y la disputa sobre quién heredaba esa autoridad ha durado ocho siglos precisamente porque nadie podía poseer las cinco y resolverlo. Esa objeción ya no aplica.\n\nLo que siga es ahora un asunto del emperador. El instrumento existe."
 cc_byz_mamluk.13.a: "El cisma puede abordarse ahora en nuestros términos."

 # cc_byz_mamluk.20 - endings
 cc_byz_mamluk.20.title: "El Levante"
 cc_byz_mamluk.20.desc_pentarchy: "La confrontación ha terminado y acabó con el resultado máximo: las sedes orientales recuperadas, la pentarquía completa y un emperador en Constantinopla que posee cada antiguo patriarcado del mundo cristiano.\n\nCostó lo que tales cosas cuestan. Los ejércitos que lo lograron están en Siria y Egipto y tendrán que quedarse allí. La frontera se ha desplazado hacia el sur y se ha vuelto más larga. El Cairo, derrotado, sigue siendo El Cairo, y volverá a ser un problema en una generación.\n\nPero la disputa que ha persistido desde el siglo VII está resuelta, y se ha resuelto a favor de Constantinopla, y eso sobrevivirá a cada una de esas dificultades."
 cc_byz_mamluk.20.desc_condominium: "La confrontación ha terminado y acabó en un documento en lugar de una batalla.\n\nEl condominio sobre los lugares santos es preciso, mutuamente irritante y ha sido respetado por ambas partes. El clero ortodoxo mantiene los derechos que el acuerdo les otorga, las tasas están fijadas y se pagan, y los peregrinos cuentan con una protección que ambas potencias garantizan y ninguna puede retirar unilateralmente.\n\nNo es un triunfo y nadie en la capital ha pretendido lo contrario. Es la primera frontera oriental estable que el imperio ha tenido en cuatrocientos años, y los emperadores que sigan descubrirán que eso vale considerablemente más que una campaña."
 cc_byz_mamluk.20.desc_defeat: "La confrontación ha terminado y El Cairo ha ganado.\n\nLas tasas en el Santo Sepulcro han aumentado, el clero ortodoxo allí mantiene sus derechos en condiciones peores que antes de que el emperador se interesara, y los patriarcas orientales han hecho sus propios acuerdos con el sultanato basándose en la razón razonable de que Constantinopla no podía protegerlos y El Cairo es donde viven.\n\nEl imperio presionó pero no pudo concretar, que es la manera específica de salir de una confrontación peor que si no se hubiera empezado. Todos los implicados lo comprenden, incluidos los patriarcas."
 cc_byz_mamluk.20.desc_stalemate: "La confrontación no ha terminado tanto como ha dejado de estar vigente.\n\nNo se resolvió nada. Los tributos se siguen pagando, la custodia se sigue disputando en los mismos términos, la frontera sigue siendo una franja de territorio en lugar de una línea y la correspondencia entre las dos cancillerías ha vuelto a los asuntos rutinarios de peregrinos y grano. Ambas potencias encontraron otras fronteras más urgentes.\n\nLas cuestiones siguen abiertas. Han estado abiertas desde el siglo VII y no hay razón particular para esperar que esta generación haya sido la que las cerrara."
 cc_byz_mamluk.20.a: "Que así quede."
 cc_byz_restored_the_east: "Sedes orientales restauradas"
 cc_byz_mamluk.10.desc_partial: "Los tres ya no escriben desde la misma posición.\n\nLas sedes que el emperador ha recuperado se gobiernan ahora desde Constantinopla, y sus dificultades son las dificultades ordinarias de una diócesis bajo una nueva autoridad. El resto siguen siendo súbditos del sultán, y su carta señala, cortésmente, que lo ocurrido con sus colegas ha empeorado su propia situación en lugar de mejorarla. Un patriarca bajo dominio musulmán cuya sede vecina acaba de ser anexionada por un emperador cristiano es un patriarca bajo sospecha, y al gobernador local no hace falta decírselo dos veces.\n\nPiden ayuda y advierten contra ella en el mismo párrafo. Ambas partes son sinceras."
 cc_byz_mamluk.11.desc_holding: "La confrontación ha llegado al punto en que se convierte en un acuerdo o en una guerra, y el emperador argumenta desde una posición que ninguno de sus predecesores tuvo.\n\nAlgunas de las antiguas sedes orientales ya son suyas. Eso cambia el valor de un acuerdo y el propósito de una guerra. El Cairo está negociando sobre lo que aún posee en lugar de sobre la cuestión global, y los funcionarios del sultán han sido precisos y pausados al respecto, de una manera que sugiere que han llegado a la misma conclusión.\n\nEl argumento para detenerse aquí es que el imperio tiene más fronteras que ejércitos y acaba de adquirir una nueva. El argumento para continuar es que una pentarquía parcial no resuelve ningún conflicto, que es la objeción planteada a cada recuperación parcial desde el siglo VII."
 cc_byz_mamluk.14.title: "Los patriarcas como súbditos"
 cc_byz_mamluk.14.desc: "Los patriarcas de Antioquía, Jerusalén y Alejandría son ortodoxos, son coreligionarios del emperador y ahora son súbditos del emperador. El tercer hecho es el que ha cambiado y sigue siendo el que gobierna.\n\nLas sedes se han gestionado a sí mismas durante ocho siglos. Tienen sus propias costumbres de elección, sus propios entendimientos con los notables locales, su propia práctica litúrgica que Constantinopla considera provincial y ellos consideran más antigua. Nada de esto fue jamás imperial, porque durante ochocientos años no hubo allí un imperio que lo hiciera.\n\nLa cuestión ante el palacio es quién nombra al próximo patriarca de Antioquía. Cada respuesta a ello es una decisión sobre qué tipo de iglesia cree el emperador haber recuperado."
 cc_byz_mamluk.14.desc_unionist: "Los patriarcas de Antioquía, Jerusalén y Alejandría son ahora súbditos del emperador. Fueron informados de la unión por carta algunos años antes de ser informados de cualquier otra cosa.\n\nHan sido ortodoxos bajo el dominio musulmán durante ocho siglos y sobrevivieron siendo inequívocos sobre quiénes eran. Ahora se les pide que estén en comunión con Roma por parte de una corte que acaba de anexionarlos, lo cual es una secuencia difícil de presentar como algo distinto de lo que parece. Su clero ya ha empezado a presentarlo de esa manera.\n\nPor lo tanto, la cuestión de quién nombra al próximo patriarca de Antioquía es también la cuestión de si la unión sobrevive al contacto con las sedes que debía integrar."
 cc_byz_mamluk.14.a: "Nombrar desde Constantinopla. Las sedes son imperiales."
 cc_byz_mamluk.14.b: "Confirmar a los patriarcas actuales. Dejar que las sedes conserven sus costumbres."
 cc_byz_mamluk.14.c: "Convocar un sínodo. Sus ritos, nuestros nombramientos."
 cc_byz_mamluk.20.desc_eastern_sees: "La confrontación ha terminado y el Levante es imperial.\n\nJerusalén y Antioquía están ocupadas y guarnecidas. La cuestión de la custodia está cerrada porque ya no queda nadie con quien disputarla, los patriarcas de ambas sedes responden a Constantinopla como hacían antes de las conquistas árabes, y las tasas del Santo Sepulcro son recaudadas por los propios funcionarios del emperador. Esto último es algo menor de lo que parece y fue motivo de disputa durante tres siglos.\n\nLo que no ha producido es una pentarquía. Roma está en otras manos y, tal vez, también Alejandría. La cuestión de quién habla por la iglesia indivisa no se resuelve poseyendo la mayoría de las sedes. Se ha reducido, lo cual es un logro real y no es lo mismo."
