l_spanish:
 # The three new prefectures, each failing in its own way.
 #
 # Italy is not here: it already has the papal and Italian threads plus the shared friction and
 # demand arcs. These exist to answer the question the shared threads cannot, which is why
 # Africa is a different problem from Italy rather than the same problem further away.
 #
 # The Gallic thread is openly counterfactual. No eastern emperor ever held any of Gaul. It is
 # written as a thread about a Provencal aristocracy that never stopped being Roman being
 # informed that it has been recovered.

 # ---- AFRICA: the Moorish frontier ----
 cc_byz_prov.1.title: "El limes"
 cc_byz_prov.1.desc: "La frontera es una línea en un mapa en la capital y un conjunto de fuertes en un territorio que nadie gobierna.\n\nLas confederaciones moriscas al sur de ella no son un estado y no pueden ser derrotadas de la manera en que se derrota a un estado. Se les puede pagar, combatir o ignorar, y los predecesores del imperio aquí intentaron las tres cosas en ese orden. Los fuertes siguen en pie. Varios están en manos de hombres que no han visto a un pagador imperial en tres años y tienen acuerdos con la gente a la que se supone que deben vigilar.\n\nEl informe del exarca es inusualmente directo. Quiere dinero o permiso para dejar de fingir."
 cc_byz_prov.1.a: "Pagar a la frontera. Para eso sirve."
 cc_byz_prov.1.b: "Compra una confederación y deja que mantenga la línea."
 cc_byz_prov.1.c: "Mantened la costa. El interior nunca fue nuestro."

 cc_byz_prov.2.title: "El obispo en el interior"
 cc_byz_prov.2.desc: "Hay una congregación a cuatro días tierra adentro con un obispo que el patriarca no consagró, siguiendo una disciplina que la capital condenó por última vez hace ochocientos años y que, aparentemente, ha estado esperando.\n\nNo son herejes de ninguna manera que un concilio reconocería. Sostienen que un sacerdote que huyó de la persecución no puede administrar los sacramentos, que la iglesia de los mártires no es la iglesia de los transigentes, y que Cartago no necesita que Constantinopla le diga qué significaron sus propios mártires.\n\nEs donatismo en todo menos en el nombre, y el nombre es la única parte que alguna vez le importó a alguien en la capital."
 cc_byz_prov.2.desc_coast: "La congregación está a cuatro días tierra adentro, es decir, muy fuera de cualquier cosa que el imperio afirme gobernar ahora.\n\nTienen un obispo que el patriarca no consagró y una disciplina que la capital condenó hace ochocientos años. También tienen la única estructura eclesiástica funcional entre la costa y el desierto, y las ciudades costeras comercian con ellos.\n\nEl exarca señala, sin recomendar nada, que el imperio ha decidido recientemente que el interior no es asunto suyo."
 cc_byz_prov.2.a: "Condénalo, como ha hecho cada emperador."
 cc_byz_prov.2.b: "África siempre ha discutido sobre esto. Que lo haga."

 cc_byz_prov.3.title: "Los atrasos"
 cc_byz_prov.3.desc: "La paga tiene once meses de retraso en los fuertes del desierto y siete en la costa, y la diferencia entre esos dos números es todo el problema: los hombres en el puesto más difícil son a quienes más se les debe.\n\nSon profesionales. Esperarán. La pregunta que cada guarnición africana ha respondido eventualmente es cuánto tiempo, y el imperio nunca ha sabido la respuesta antes de que fuera dada."
 cc_byz_prov.3.desc_paid: "La paga tiene cuatro meses de retraso, lo cual en esta provincia se considera puntual.\n\nLa frontera fue financiada cuando se solicitó y la diferencia es visible: los fuertes están guarnecidos por hombres que esperan cobrar, y los hombres que esperan cobrar tienden a seguir esperándolo en lugar de hacer otros arreglos.\n\nEl secretario del exarca ha adjuntado las cifras sin comentarios, lo cual, viniendo de él, es una especie de comentario."
 cc_byz_prov.3.a: "Recúmpralos. Cueste lo que cueste."
 cc_byz_prov.3.b: "Resistieron. Dilo públicamente."

 # ---- SPANIA: the narrow province ----
 cc_byz_prov.10.title: "La ley en las ciudades"
 cc_byz_prov.10.desc: "La provincia tiene tribunales. No son los tribunales del imperio.\n\nLas ciudades de aquí han estado funcionando bajo un código visigodo durante seiscientos años: escrito, coherente, enseñado y administrado por hombres cuyos padres lo administraron. Maneja las herencias de forma diferente al derecho romano, maneja las deudas de forma diferente, y es a lo que todos en Cartagena se refieren cuando hablan de la ley.\n\nLa propia ley del imperio es más antigua, mejor y extranjera. Esa última palabra es la que hace todo el trabajo."
 cc_byz_prov.10.a: "El derecho romano es el del imperio. Impónlo."
 cc_byz_prov.10.b: "Una ley que nadie sigue es peor que una que no es nuestra."

 cc_byz_prov.11.title: "La oferta del vecino"
 cc_byz_prov.11.desc: "La taifa del interior ha enviado a un mercader en lugar de a un enviado, lo cual es en sí mismo el mensaje.\n\nPrefieren comerciar que luchar. Tienen plata, la costa tiene puertos, y ninguna de las partes tiene la fuerza para quitarle a la otra algo que valga lo que costaría quitarlo. La propuesta es detallada, comercialmente sensata, y haría que la provincia fuera solvente por primera vez desde que fue recuperada.\n\nTambién significaría que los funcionarios de un emperador ortodoxo se sentaran con ellos para acordar aranceles, por escrito y con firmas."
 cc_byz_prov.11.a: "La solvencia no es cosa menor."
 cc_byz_prov.11.b: "No negociamos con ellos."

 cc_byz_prov.12.title: "La provincia indefendible"
 cc_byz_prov.12.desc: "La evaluación ha sido presentada, y es la misma evaluación que ha presentado cada gobernador aquí.\n\nLa provincia es una franja de costa con montañas detrás y sin un interior. No puede alimentar a su propia guarnición. No puede ser reforzada excepto por mar, y la ruta marítima recorre la longitud del Mediterráneo pasando por dos costas hostiles. Sostenida contra un intento serio, cae; sostenida contra nada en particular, cuesta.\n\nLo que sí tiene son puertos, y los puertos en ese extremo del mar valen algo para una flota."
 cc_byz_prov.12.desc_latin: "La evaluación ha sido presentada, y hay un párrafo en ella que no estaba en las anteriores.\n\nLa provincia no puede sostenerse, no puede alimentarse y no puede ser reforzada excepto por mar. Eso no ha cambiado. Lo nuevo es la observación de que las ciudades ahora se rigen por su propia ley, en su propio idioma, bajo notables que el imperio confirma en lugar de nombrar, y que si la guarnición imperial zarpara mañana, la diferencia práctica tardaría una década en hacerse visible.\n\nEl gobernador no llega a una conclusión. No necesitaba hacerlo."
 cc_byz_prov.12.a: "Canjéalo por algo que importe."
 cc_byz_prov.12.b: "Una estación naval, y nada más."
 cc_byz_prov.12.c: "Reforzarlo adecuadamente."

 # ---- GAUL: the Rhone command ----
 cc_byz_prov.20.title: "Ya romano"
 cc_byz_prov.20.desc: "La delegación de las ciudades provenzales es educada, viste bien y habla un latín de una calidad que ha avergonzado a dos de los secretarios del emperador.\n\nDesean felicitar al emperador por la recuperación de la provincia. Desean que se anote que la provincia ha sido romana continuamente, que sus instituciones municipales han funcionado sin interrupción desde antes de que se fundara la capital, y que sus familias poseen títulos conferidos por emperadores cuyos nombres la cancillería imperial ha tenido que buscar.\n\nNo están siendo difíciles. Están siendo extremadamente claros sobre lo que creen que acaba de suceder, que es que Constantinopla finalmente ha regresado."
 cc_byz_prov.20.a: "Confirmar su posición. Fueron romanos primero."
 cc_byz_prov.20.b: "Son una provincia recuperada como cualquier otra."

 cc_byz_prov.21.title: "La reclamación del norte"
 cc_byz_prov.21.desc: "La posición franca, resumida brevemente, es que el valle del Ródano ha sido suyo durante ochocientos años y la aparición de una administración griega en él no cambia nada.\n\nLa postura no es irrazonable. La línea que el imperio puede sostener realmente son los Alpes y el río, y todo lo que hay al norte de eso ha sido gobernado desde otro lugar desde antes de que existiera un imperio oriental para gobernarlo.\n\nEl exarca ha pedido ingenieros, dinero y una decisión. Señala que puede conseguir dos de las tres cosas localmente."
 cc_byz_prov.21.a: "Mantened los pasos. Eso es la provincia."
 cc_byz_prov.21.b: "Cómpralos. Lo hemos hecho en fronteras más largas."
 cc_byz_prov.21.c: "Es su mando. Dejad que lo mande."

 cc_byz_prov.22.title: "El mando del Ródano"
 cc_byz_prov.22.desc: "Sea lo que sea esta provincia, no es una prefectura en el sentido que la cancillería usa la palabra.\n\nEs un río, un conjunto de pasos, una docena de ciudades que se gobiernan a sí mismas competentemente y siempre lo han hecho, y una guarnición que ha sido reclutada localmente durante una generación porque enviar hombres del este al Ródano es una forma absurda de defender el Ródano.\n\nLa cuestión no es cómo gobernarla. Es cómo llamar a la cosa que ya la está gobernando."
 cc_byz_prov.22.desc_march: "La provincia se gobierna a sí misma y lo hace desde la primera confirmación de los notables locales, que el palacio nunca se ha puesto a revisar.\n\nControla los pasos. Paga algo. Envía contingentes cuando se le pide, generalmente. Sus familias principales utilizan títulos imperiales con total corrección y no han necesitado una instrucción imperial en once años.\n\nLa cancillería desearía tener una palabra para definir esto."
 cc_byz_prov.22.a: "Una marca. Sostiene la frontera y decide cómo."
 cc_byz_prov.22.b: "Que los francos se queden con la sustancia. Nosotros conservamos el título."
 cc_byz_prov.22.c: "Gobiernalo directamente, y paga por ello."
