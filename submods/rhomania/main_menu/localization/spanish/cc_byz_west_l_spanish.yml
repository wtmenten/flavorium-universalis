l_spanish:
 # The West: the situation, the Praetorian Prefectures, the consistory and its four laws.
 #
 # The four prefectures are named for late-Roman administrative units rather than for
 # exarchates. Only Ravenna and Carthage were ever exarchates; Spania was governed by a
 # magister militum and Gaul was never recovered at all. The PREFECTURES of Italy, Africa and
 # Gaul, and the Spanish diocese under Gaul, are real, which is what an eastern emperor
 # restoring the west would claim to be restoring.

 # ---- The situation ----
 cc_byz_the_west: "El Occidente"
 cc_byz_the_west_desc: "Cuatro provincias recuperadas, y la cuestión pendiente de qué son. Una prefectura gobernada desde Constantinopla no puede defenderse; una que puede defenderse no necesita a Constantinopla."
 cc_byz_the_west_map_tt: "Parte de las prefecturas occidentales"

 # ---- The organisation ----
 cc_byz_prefectures: "Las prefecturas pretorianas de Occidente"
 cc_byz_prefectures_desc: "El cuerpo administrativo del occidente recuperado y su consistorio. El emperador preside; cada prefecto tiene asiento. Si el cuerpo delibera o simplemente recibe instrucciones es una cuestión de aritmética, y la aritmética cambia con cada provincia recuperada."

 # ---- Voting statuses ----
 # The whole design in three numbers: 3 votes, 2 votes, 1 vote.
 cc_byz_augustus: "Augusto"
 cc_byz_augustus_desc: "El emperador. Tres voces en el consistorio, lo cual es suficiente contra un prefecto, exactamente suficiente contra dos, y no suficiente contra tres."
 cc_byz_senior_exarch: "Exarca Senior"
 cc_byz_senior_exarch_desc: "Primero entre los prefectos, y el único que el emperador elige. Dos voces."
 cc_byz_exarch_seat: "Exarca"
 cc_byz_exarch_seat_desc: "Un asiento en el consistorio. Una voz, y no hay límite superior a cuántas de ellas crea la propia reconquista del emperador."

 # ---- The consistory ----
 cc_byz_consistorium_dormant: "Consistorio no convocado"
 cc_byz_consistorium_dormant_desc: "Las prefecturas existen y son gobernadas. No se reúnen. Un emperador que nunca las convoca a sesión nunca pierde un voto, y nunca llega a saber qué habrían dicho."
 cc_byz_consistorium_assembly: "El Consistorio Sagrado"
 cc_byz_consistorium_assembly_desc: "El consejo del oeste en sesión. El emperador habla con tres voces, el prefecto sénior con dos, cada uno de los otros prefectos con una. Un empate anula la moción."

 # ---- The four countries ----
 cc_byz_exarchate_ravenna_name: "Exarcado de Rávena"
 cc_byz_exarchate_ravenna_adj: "Ravenato"
 cc_byz_exarchate_carthage_name: "Exarcado de Cartago"
 cc_byz_exarchate_carthage_adj: "Cartaginés"
 cc_byz_exarchate_spania_name: "Provincia de Spania"
 cc_byz_exarchate_spania_adj: "Español"
 cc_byz_exarchate_gaul_name: "Prefectura de las Galias"
 cc_byz_exarchate_gaul_adj: "Gálica"

 # ---- Law: command ----
 cc_byz_west_command_law: "Mando de los ejércitos occidentales"
 cc_byz_west_command_law_desc: "A quién obedecen los soldados en el oeste. La más antigua de las cuatro preguntas y la que se resolvió en el siglo VI."
 cc_byz_command_imperial: "Oficiales Imperiales"
 cc_byz_command_imperial_desc: "Comandantes nombrados desde la capital y rotados antes de que echen raíces. Los ejércitos son del emperador y son peores en su trabajo por ello."
 cc_byz_command_exarchal: "El exarca manda"
 cc_byz_command_exarchal_desc: "El prefecto comanda sus propias tropas. Los exarcas de Rávena eran generales porque Italia no podía ser defendida por un comité en otro continente, y esto fue lo que los hizo peligrosos."
 cc_byz_command_joint: "Mando Conjunto"
 cc_byz_command_joint_desc: "Órdenes refrendadas en dos lugares. Funciona, lentamente, y nadie está satisfecho."

 # ---- Law: the fisc ----
 cc_byz_west_fisc_law: "Los ingresos occidentales"
 cc_byz_west_fisc_law_desc: "A dónde va el dinero recaudado en el oeste. Una prefectura que remite todo no puede pagar sus propias guarniciones; una que lo retiene todo es un estado."
 cc_byz_fisc_remitted: "Remitido en su totalidad"
 cc_byz_fisc_remitted_desc: "Todo para Constantinopla, y el oeste solicita que se lo devuelvan. La capital decide cuánto vale la frontera."
 cc_byz_fisc_split: "Dividido en la Prefectura"
 cc_byz_fisc_split_desc: "La provincia se queda con lo que necesita y envía el resto. El acuerdo histórico, y el viable."
 cc_byz_fisc_retained: "Retenido en el Oeste"
 cc_byz_fisc_retained_desc: "El oeste se costea a sí mismo y le debe una cortesía a la capital. Próspero, bien guarnecido y que ya no pide nada."

 # ---- Law: the rite ----
 cc_byz_west_rite_law: "El rito en las iglesias occidentales"
 cc_byz_west_rite_law_desc: "Lo que se celebra en las provincias recuperadas. La cuestión fundamental: un oeste que se vota a sí mismo el uso local es un oeste que deriva hacia lo latino, y fue la propia reconquista del emperador la que le dio los votos."
 cc_byz_rite_greek: "El rito griego"
 cc_byz_rite_greek_desc: "Como se celebra en la capital, en la propia capilla del exarca, y en casi ningún otro lugar del oeste al que alguien realmente asista."
 cc_byz_rite_local: "Uso Local Tolerado"
 cc_byz_rite_local_desc: "Las iglesias mantienen las formas que han mantenido durante siglos. Pragmáticas, populares y el primer paso hacia una pendiente que el palacio puede ver perfectamente."
 cc_byz_rite_latin: "El rito latino"
 cc_byz_rite_latin_desc: "Abiertamente, y por voto del propio consejo del emperador. El oeste ha decidido a qué iglesia pertenece, y no es a la cuyo emperador lo gobierna."

 # ---- Law: succession ----
 cc_byz_west_succession_law: "Sucesión en las prefecturas"
 cc_byz_west_succession_law_desc: "Cómo se reemplaza a un prefecto muerto. La pregunta que convierte un cargo en una familia."
 cc_byz_succession_appointed: "Nombrado desde la capital"
 cc_byz_succession_appointed_desc: "Un exarca muerto es reemplazado por quien el palacio envíe. Es lo que hace que el puesto sea un cargo."
 cc_byz_succession_acclaimed: "Aclamado localmente"
 cc_byz_succession_acclaimed_desc: "El ejército y los notables de la provincia eligen, y el emperador confirma lo que ya ha sucedido."
 cc_byz_succession_hereditary: "Hereditario"
 cc_byz_succession_hereditary_desc: "El cargo pasa al hijo. El imperio tiene ahora una dinastía en el oeste que no provino del palacio y no la necesita."

 # ---- The seven governing actions ----
 cc_byz_west_order_census: "Ordenar un Censo del Oeste"
 cc_byz_west_order_census_desc: "Contar la tierra, la gente y lo que deben. Lo que una administración romana hacía y que nada más en Europa podía hacer, y lo que todos los censados preferirían que no hiciera."
 cc_byz_west_donative: "Pagar la donativa occidental"
 cc_byz_west_donative_desc: "Las guarniciones reciben sus atrasos y la paga de este año juntos. La única cosa que mantuvo leal a una frontera romana de la manera más fiable, y la única cosa que los emperadores dejaron de hacer con más fiabilidad cuando el dinero escaseaba."
 cc_byz_west_demand_tribute: "Exigir el Tributo Prefectural"
 cc_byz_west_demand_tribute_desc: "Una leva superior a lo que el acuerdo ya rinde. El dinero llega. También el recuerdo de haber sido solicitada."
 cc_byz_west_send_strategos: "Enviar al Estratego al Oeste"
 cc_byz_west_send_strategos_desc: "Refuerzos, y un general para comandarlos. El oeste se vuelve defendible, y ahora hay allí un ejército que sabe en nombre de quién recibe su paga."
 cc_byz_west_confirm_son: "Confirmar al hijo del Exarca"
 cc_byz_west_confirm_son_desc: "Reconocer la sucesión por adelantado. Compra una lealtad que nada más puede comprar y concede, permanentemente, que el cargo pertenece a una familia."
 cc_byz_west_recall_exarch: "Convocar al exarca a la capital"
 cc_byz_west_recall_exarch_desc: "Llamarlo para que dé explicaciones. Que venga o no no es decisión del emperador, sino que depende enteramente de cómo haya sido tratado."
 cc_byz_west_grant_charter: "Otorgar su Carta a una Comuna"
 cc_byz_west_grant_charter_desc: "Derechos y autogobierno por escrito, a cambio de ingresos y tranquilidad. La primera carta es el precedente que citará cualquier otra comuna."

 # ---- The three consistory actions ----
 cc_byz_io_convene_consistory: "Convocar el Consistorio"
 cc_byz_io_convene_consistory_desc: "Convoca a los prefectos a sesión. Hasta que esto se haga no hay votos que perder, y después de ello los habrá."
 cc_byz_io_elevate_senior_exarch: "Elevar a un Exarca Senior"
 cc_byz_io_elevate_senior_exarch_desc: "Nombra a un prefecto como primero entre los demás. Él habla con dos voces en el consistorio, por lo que esta es una decisión sobre a quién entregar la segunda."
 cc_byz_io_dissolve_prefecture: "Disolver una Prefectura"
 cc_byz_io_dissolve_prefecture_desc: "Recuperar la provincia bajo mando directo. Es la única forma de reducir la oposición del consistorio, y todos los demás prefectos serán testigos de ello."

 # ---- Modifier types ----
 MODIFIER_TYPE_NAME_cc_byz_augustus_can_participate_in_parliament: "Augusto puede sentarse en el consistorio"
 MODIFIER_TYPE_NAME_cc_byz_senior_exarch_can_participate_in_parliament: "El Exarca Senior puede formar parte del Consistorio"
 MODIFIER_TYPE_NAME_cc_byz_exarch_seat_can_participate_in_parliament: "El Exarca puede formar parte del Consistorio"
 MODIFIER_TYPE_NAME_cc_byz_augustus_agenda_impact: "Impacto de la agenda de Augusto"
 MODIFIER_TYPE_NAME_cc_byz_senior_exarch_agenda_impact: "Impacto de la agenda del Exarca Senior"
 MODIFIER_TYPE_NAME_cc_byz_exarch_seat_agenda_impact: "Impacto de la Agenda del Exarca"

 # ---- Action outcomes ----
 STATIC_MODIFIER_NAME_cc_byz_west_census_taken: "El registro occidental"
 STATIC_MODIFIER_DESC_cc_byz_west_census_taken: "La tierra ha sido contabilizada y las cifras están actualizadas. No seguirán estando actualizadas."
 STATIC_MODIFIER_NAME_cc_byz_west_donative_paid: "El donativo pagado"
 STATIC_MODIFIER_DESC_cc_byz_west_donative_paid: "Las guarniciones occidentales han cobrado a tiempo, algo que recordarán aproximadamente mientras dure la situación."
 STATIC_MODIFIER_NAME_cc_byz_west_tribute_taken: "Tributo recaudado"
 STATIC_MODIFIER_DESC_cc_byz_west_tribute_taken: "La leva fue recaudada. El resentimiento queda registrado en otro lugar."
 STATIC_MODIFIER_NAME_cc_byz_west_strategos_sent: "Un strategos en el oeste"
 STATIC_MODIFIER_DESC_cc_byz_west_strategos_sent: "Hay un general allá afuera con tropas que lo conocen, que es lo que el oeste necesitaba y lo que la capital acabará lamentando."
 STATIC_MODIFIER_NAME_cc_byz_west_recall_issued: "Convocatoria emitida"
 STATIC_MODIFIER_DESC_cc_byz_west_recall_issued: "La orden ha partido hacia el oeste. Lo que regrese es un asunto aparte."
 STATIC_MODIFIER_NAME_cc_byz_west_charter_granted: "Una comuna fletada"
 STATIC_MODIFIER_DESC_cc_byz_west_charter_granted: "Derechos por escrito, ingresos a cambio, y un precedente que ahora cita cualquier otra comuna en el oeste."
 STATIC_MODIFIER_NAME_cc_byz_west_recall_obeyed: "Convocatoria obedecida"
 STATIC_MODIFIER_DESC_cc_byz_west_recall_obeyed: "Vino cuando fue llamado. Todos los gobernadores del imperio se dieron cuenta."
 STATIC_MODIFIER_NAME_cc_byz_west_recall_refused: "Convocatoria rechazada"
 STATIC_MODIFIER_DESC_cc_byz_west_recall_refused: "No vino, y no le pasó nada. Todos los gobernadores del imperio también se dieron cuenta de eso."
 STATIC_MODIFIER_NAME_cc_byz_west_prefecture_dissolved: "Una prefectura disuelta"
 STATIC_MODIFIER_DESC_cc_byz_west_prefecture_dissolved: "La provincia vuelve a ser gobernada directamente desde la capital, al coste de gobernarla directamente desde la capital."

 # ---- The four endings ----
 STATIC_MODIFIER_NAME_cc_byz_west_end_reabsorbed: "Occidente reabsorbido"
 STATIC_MODIFIER_DESC_cc_byz_west_end_reabsorbed: "Las prefecturas se disuelven en el imperio y se administran desde Constantinopla. Requirió mantenerlas débiles, que es por lo que funcionó."
 STATIC_MODIFIER_NAME_cc_byz_west_end_diarchy: "La diarquía"
 STATIC_MODIFIER_DESC_cc_byz_west_end_diarchy: "Un colega en el oeste, formalmente investido, gobernando provincias lo suficientemente fuertes como para importar. Dos emperadores, un imperio, y esta vez fue acordado en lugar de sufrido."
 STATIC_MODIFIER_NAME_cc_byz_west_end_acclamation: "La aclamación occidental"
 STATIC_MODIFIER_DESC_cc_byz_west_end_acclamation: "Los ejércitos del oeste proclamaron a su propio emperador. Así fue como el imperio adquirió una mitad occidental la primera vez."
 STATIC_MODIFIER_NAME_cc_byz_west_end_neglect: "Occidente descuidado"
 STATIC_MODIFIER_DESC_cc_byz_west_end_neglect: "Nadie gobierna las provincias recuperadas, incluidos los hombres nombrados para ello."

 # ---- Situation events ----
 cc_byz_west.1.title: "Las prefecturas de Occidente"
 cc_byz_west.1.desc: "El documento es corto, porque existe un formulario para esto y el formulario tiene novecientos años.\n\nSe constituye una prefectura pretoriana. Su prefecto posee la provincia, comanda las tropas que hay en ella, escucha las apelaciones de sus tribunales y remite sus ingresos; y hace todo esto en nombre del emperador a una distancia de varias semanas de navegación.\n\nLa cancillería ha redactado el nombramiento tres veces. Cada borrador ha sido más corto que el anterior, porque cuanto más largo es, más parece una lista de las cosas que el hombre ahora podrá hacer sin preguntar."
 cc_byz_west.1.desc_several: "Ahora son varios, lo cual es una disposición diferente a tener solo uno.\n\nUn prefecto es un gobernador. Dos son un precedente. Lo que representan tres o cuatro es una pregunta que la cancillería se ha cuidado de no poner por escrito, y los escribas más veteranos han empezado a usar la frase 'el oeste' como si fuera un lugar con opiniones en lugar de una dirección."
 cc_byz_west.1.a: "Es como siempre se ha gobernado el imperio."

 cc_byz_west.10.title: "El consistorio convocado"
 cc_byz_west.10.desc: "Son convocados, y vienen.\n\nEl consistorio sagrado no es nuevo. Los emperadores han pedido consejo de esta forma desde Diocleciano, y el protocolo es exacto: quién permanece de pie, quién se sienta, quién habla en qué orden y cómo se registra una decisión como propia del emperador, independientemente de cómo se haya llegado a ella.\n\nLo que es nuevo es quién está presente en él. Los prefectos del oeste han viajado un largo camino para estar aquí, y los hombres que han viajado un largo camino para ser consultados tienden a esperar que realmente lo sean."
 cc_byz_west.10.desc_outnumbered: "Son convocados, y vienen, y son más ellos que nosotros.\n\nEl protocolo es exacto y la aritmética también lo es. El emperador habla con tres voces, como siempre lo ha hecho. Los prefectos del oeste, entre todos, hablan ahora con más voces, y cada una de esas voces existe porque el imperio tuvo éxito en el oeste.\n\nNadie dice esto. El Magister Officiorum ha organizado los asientos con sumo cuidado."
 cc_byz_west.10.a: "Que sean escuchados."

 cc_byz_west.20.title: "La convocatoria"
 cc_byz_west.20.desc: "La orden es inequívoca y está redactada cortésmente. Debe presentarse en la capital y rendir cuentas de su administración.\n\nLo que suceda después no está en manos del emperador. No ha estado en manos del emperador desde hace algunos años, y fue decidido por cada donativo pagado o retenido, cada leva exigida, y si alguien llegó a decirle que su hijo sería confirmado."
 cc_byz_west.20.desc_again: "La orden es inequívoca, cortésmente redactada, y es la segunda.\n\nLa última vez fue ignorada y no pasó nada. Todos al oeste del Adriático lo saben, incluido el hombre que ahora la lee."
 cc_byz_west.20.a: "Estará en camino antes de que termine el mes."
 cc_byz_west.20.b: "Lamenta que la provincia no pueda prescindir de él."
 cc_byz_west.20.c: "Entonces será traído."

 cc_byz_west.30.title: "Disolviendo la Prefectura"
 cc_byz_west.30.desc: "Puede hacerse. El cargo fue creado por un documento y puede terminarse con uno, y el territorio vuelve a la administración directa desde la capital.\n\nLo que el documento no puede hacer es producir los funcionarios para administrarlo. Esos hombres son actualmente del prefecto, viven allí y han pasado una carrera aprendiendo sobre una provincia que la capital nunca ha visto. Algunos se quedarán. Los que importan, no.\n\nLos otros prefectos se enterarán de ello antes de que los mensajeros lleguen a ellos."
 cc_byz_west.30.a: "La oficina fue nuestra para crearla y nuestra para terminarla."
 cc_byz_west.30.b: "Déjalo. Hay batallas mejores."

 cc_byz_west.90.title: "Occidente reabsorbido"
 cc_byz_west.90.desc: "La última prefectura se disuelve y el oeste se gobierna como se gobierna el este: por funcionarios que sirven donde son enviados, ocupan el cargo a voluntad del emperador y regresan a casa cuando son relevados.\n\nRequirió mantener las provincias débiles. Una prefectura lo suficientemente fuerte para defenderse habría sido lo suficientemente fuerte para negarse, así que ninguna lo fue jamás, y la frontera ha sido mantenida por ejércitos enviados desde la capital a un coste que nadie ha totalizado jamás.\n\nEl imperio es una sola cosa de nuevo, administrada desde un solo lugar, en un solo idioma, por un solo servicio. No había sido así desde Teodosio."
 cc_byz_west.90.a: "Un imperio, y un emperador en él."

 cc_byz_west.91.title: "La diarquía"
 cc_byz_west.91.desc: "El acuerdo se formaliza en el consistorio, siguiendo las viejas formas, y resulta que las viejas formas fueron escritas exactamente para esto.\n\nHay un colega en el oeste. Es investido, aclamado y nombrado en las oraciones; sus prefecturas levantan sus propios ejércitos, conservan sus propios ingresos y responden por su propia frontera, y responden ante él. Él responde ante el Augusto sénior, lo cual es una relación real y no una cortesía, porque se llegó a ella mediante un acuerdo entre dos cortes que tenían algo que perder.\n\nEsto es lo que el siglo IV intentaba hacer. Falló entonces porque las dos mitades eran rivales desde el principio. Esta fue construida por un emperador que recuperó el oeste él mismo y luego se negó a fingir que podía administrarlo desde el Bósforo."
 cc_byz_west.91.a: "Dos Augustos, y un imperio entre ellos."

 cc_byz_west.92.title: "La aclamación"
 cc_byz_west.92.desc: "Sucede de la manera en que siempre sucede. Ni una rebelión, ni un manifiesto: un campo de desfile, un ejército al que no se le ha pagado, un general al que sí, y el grito surgiendo antes de que nadie haya decidido gritarlo.\n\nPara cuando la noticia llega a Constantinopla, él lleva cuatro meses vestido de púrpura, las prefecturas lo han reconocido, y los reconocimientos están redactados con tal cuidado que ninguno de ellos es traición.\n\nEl consistorio sigue reuniéndose. Después de todo, fue constituido por autoridad imperial, y sostiene la opinión de que sigue siéndolo."
 cc_byz_west.92.a: "Entonces somos dos, y uno es un usurpador."

 cc_byz_west.93.title: "Occidente liberado"
 cc_byz_west.93.desc: "No hay un momento preciso. Eso es lo que hace que sea difícil de informar.\n\nLos prefectos siguen siendo nombrados y confirmados. Los ingresos se siguen tasando basándose en las cifras de un censo de hace cuarenta años. Las guarniciones siguen figurando en los registros. En algún punto entre la tasación y la recaudación, y entre el registro y la muralla, el imperio dejó de ser lo que gobierna esas provincias, y nadie puede decir en qué año ocurrió.\n\nLos hombres que realmente las gobiernan ahora son locales, competentes y nunca fueron nombrados por nadie."
 cc_byz_west.93.a: "Fue un camino largo de mantener."
 cc_byz_west.80.title: "La cuestión no puede quedar abierta"
 cc_byz_west.80.desc: "El Magíster Officiorum ha presentado un memorándum que nadie le pidió.\n\nSu argumento es procesal y, por lo tanto, difícil de rebatir. Las prefecturas occidentales han existido ya el tiempo suficiente como para que sus acuerdos sean más antiguos que la mayoría de los hombres que las administran, y cada año que el acuerdo permanece tácito, resulta más difícil de expresar. Los prefectos están siendo nombrados siguiendo precedentes en lugar de instrucciones. Los ingresos se remiten a tasas de las cuales nadie puede presentar un documento.\n\nNo recomienda una política. Recomienda que haya una, y pronto, porque la alternativa es que la respuesta llegue por sí sola y el palacio descubra cuál era posteriormente."
 cc_byz_west.80.desc_westward: "El Magíster Officiorum ha presentado un memorándum que nadie le pidió, y es más corto de lo habitual.\n\nEl oeste no se está gobernando desde aquí. Él no lo expresa con tanta crudeza, pero las cifras sí: nombramientos confirmados en lugar de realizados, ingresos evaluados en las provincias en lugar de en la capital, y un consistorio cuyos votos el emperador ahora tiene que contar antes de convocarlos.\n\nNada de esto fue decidido. Todo ello es ahora la práctica, y la práctica se convierte en ley en este imperio al no ser cuestionada durante el tiempo suficiente. Sugiere que el desafío se plantee en este reinado o no se plantee en absoluto."
 cc_byz_west.80.a: "Entonces se resolverá en mi tiempo."
 cc_byz_west.40.title: "Los Prefectos se Alzan"
 cc_byz_west.40.desc: "Comienza como una objeción procesal, que es como empiezan estas cosas cuando los hombres que las crean son abogados además de soldados.\n\nEl consistorio ha resuelto que los nombramientos para las prefecturas occidentales requieren el asentimiento del cuerpo. Ha comunicado esta resolución a la capital en la forma correcta, con los sellos correctos, citando cuatro precedentes de los cuales tres son genuinos. No ha resuelto nada sobre la obediencia, porque no tiene que hacerlo: un nombramiento que el consistorio no ha asentido es ahora, por su propia resolución, no un nombramiento.\n\nLos ejércitos occidentales están en sus cuarteles y han sido pagados. No por nosotros."
 cc_byz_west.40.desc_defied: "Comienza donde terminó la última convocatoria.\n\nUn prefecto ignoró un llamado a regresar y conservó su provincia, y no le pasó nada. El consistorio ha resuelto ahora que los nombramientos en el oeste requieren el asentimiento del cuerpo, y la resolución se lee menos como una reclamación que como una descripción: la cosa ya ha sido cierta durante algunos años y alguien finalmente la ha puesto por escrito.\n\nLos ejércitos occidentales están en sus cuarteles y han sido pagados. No por nosotros."
 cc_byz_west.40.desc_all: "Cada prefectura lo ha firmado.\n\nEsa es la parte a la que el Maestro de Oficios vuelve una y otra vez. No el contenido de la resolución, que es un documento legal y podría cuestionarse, sino el hecho de que cuatro provincias separadas por semanas de navegación produjeron un único texto con cuatro sellos. No habrían podido hacer eso hace ochenta años. Pueden hacerlo ahora porque el imperio les construyó una cámara para hacerlo, los convocó para sentarse en ella y les dijo que su asentimiento valía la pena.\n\nLos ejércitos occidentales están en sus cuarteles y han sido pagados. No por nosotros."
 cc_byz_west.40.a: "Entonces es una guerra, y siguen siendo mis gobernadores."
 cc_byz_west.40.b: "Dales la sustancia. Yo me quedaré con las formas."
 cc_byz_west.40.c: "Compra a los que puedan ser comprados."
 cc_byz_west.41.title: "El Ajuste de Cuentas en el Oeste"
 cc_byz_west.41.desc_won: "La prefectura se liquida, sus funcionarios son destituidos o reasignados, y su territorio se administra desde la capital.\n\nLo que sorprende, leyendo la correspondencia posteriormente, es lo ordinaria que resultó ser la posición legal. No hubo ninguna conquista involucrada ni ninguna fue reclamada. Un cargo fue revocado por la autoridad que lo creó, y el hecho de que la revocación requiriera un ejército no aparece en los papeles en ninguna parte.\n\nLos prefectos supervivientes han enviado sus felicitaciones. Fueron rápidos en ello."
 cc_byz_west.41.desc_none_left: "No quedan prefecturas.\n\nLas provincias occidentales se administran directamente, lo que quiere decir que son administradas por hombres enviados desde la capital que no conocen el país, no hablan la lengua de sus cortes y serán rotados antes de aprender cualquiera de las dos cosas. Esto es lo que se quería. Vale la pena escribir, una vez, que costó una guerra contra los propios gobernadores del imperio para conseguirlo."
 cc_byz_west.41.desc_unresolved: "La guerra no lo resolvió, o no hubo guerra.\n\nLas prefecturas siguen ahí y también los prefectos, y la resolución que requiere el asentimiento del consistorio para los nombramientos no ha sido retirada. Simplemente ha dejado de ser cuestionada, que en este imperio es como una reclamación se convierte en un derecho.\n\nEl próximo emperador heredará el acuerdo como un hecho más que como una pregunta, y no recordará que alguna vez fue de otra manera."
 cc_byz_west.41.a: "El cargo era mío para revocarlo."
 cc_byz_west.41.b: "Entonces se ha decidido en mi contra."
 cc_byz_reduce_prefecture: "Reducir la Prefectura"
 cc_byz_reduce_prefecture_desc: "Revoca el nombramiento y recupera la provincia bajo administración directa. No es una conquista: el cargo fue creado por autoridad imperial y termina por ella, razón por la cual cuesta tan poco y por la cual nadie más en Europa lo considera asunto suyo."
 cc_byz_reduce_prefecture_tt: "La prefectura queda disuelta y su territorio vuelve a la administración imperial directa"
 cc_byz_cb_reduce_the_prefectures: "Reducir las Prefecturas"
 cc_byz_cb_reduce_the_prefectures_desc: "Los prefectos occidentales han convertido su asentimiento en una condición para su propio nombramiento. Siguen siendo, legalmente, funcionarios imperiales en provincias imperiales, y el emperador se propone recordarles la primera mitad de esa frase."
 cc_byz_cb_reduce_the_prefectures_PROV: "Reducir las Prefecturas"
 cc_byz_west.35.title: "Cartas no dirigidas a nosotros"
 cc_byz_west.35.desc: "La bolsa de despachos del oeste ha estado llegando más ligera, y la cancillería ha tardado un tiempo en descubrir por qué.\n\nNo es que se esté escribiendo menos. Es que gran parte de lo que se escribe ahora va directamente entre las prefecturas, sobre asuntos que anteriormente habría arbitrado la capital: una cuestión de límites resuelta entre dos gobernadores sin consultar a nadie, un acuerdo sobre los precios del grano, una queja conjunta sobre la tasación que fue redactada y luego no enviada.\n\nNada de esto es impropio. El Maestro de Oficios recalca ese punto dos veces, que es como el emperador sabe que está preocupado."
 cc_byz_west.35.desc_defied: "La bolsa de despachos del oeste ha estado llegando más ligera, y esta vez nadie tiene que descubrir por qué.\n\nSe ignoró un citatorio y no sucedió nada más. Lo que las prefecturas han estado haciendo desde entonces es corresponderse entre sí en lugar de con nosotros: cuestiones de límites resueltas entre gobernadores, precios del grano acordados, una queja conjunta sobre la tasación redactada y circulada para su firma.\n\nEse último documento no ha sido enviado. La opinión de la cancillería es que se está guardando para cuando tenga más valor."
 cc_byz_west.35.desc_many: "Tres prefecturas o más, y han descubierto que pueden escribirse entre sí.\n\nLa correspondencia es totalmente adecuada y eso es lo que hace que sea difícil objetar. Cuestiones de límites resueltas entre gobernadores. Precios del grano acordados. Una declaración conjunta sobre la tasación, redactada, circulada para su firma y retenida.\n\nLo que ha cambiado no es ninguna carta en particular, sino la existencia de un hábito. Hace ochenta años el oeste no habría podido coordinar nada, porque no había un oeste, solo un conjunto de provincias que trataban cada una con la capital. Ahora hay un oeste. Le construimos una cámara y lo convocamos a sesionar."
 cc_byz_west.35.a: "Pagar los atrasos. Todos ellos, este año."
 cc_byz_west.35.b: "Tratar con quien redacta las cartas."
 cc_byz_west.35.c: "Tómalo nota. Hay problemas más urgentes."
 STATIC_MODIFIER_NAME_cc_byz_west_restive: "El Oeste está inquieto"
 STATIC_MODIFIER_DESC_cc_byz_west_restive: "Las prefecturas se están correspondiendo entre sí en lugar de con la capital, y al menos un prefecto ha dejado de fingir que está satisfecho. Esta es la condición que precede a un levantamiento."
 STATIC_MODIFIER_NAME_cc_byz_exarch_disaffected: "Un prefecto descontento"
 STATIC_MODIFIER_DESC_cc_byz_exarch_disaffected: "Este prefecto está reclutando hombres, y no espera utilizarlos para la capital."
 STATIC_MODIFIER_NAME_cc_byz_exarch_contented: "Un prefecto satisfecho"
 STATIC_MODIFIER_DESC_cc_byz_exarch_contented: "Pagado, confirmado y gobernando una provincia que se está beneficiando del acuerdo."
