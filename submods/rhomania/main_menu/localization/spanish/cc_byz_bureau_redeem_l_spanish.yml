l_spanish:
 # cc_byz_bureaucracy.62, the buy-back for a farmed-out office, and the timed societal drift
 # modifiers the bureau thread now grants.
 #
 # WHY .62 EXISTS. Playtesting: "the office farmed out being until the end of the game is too
 # harsh a punishment". It was also stacking, at three grant sites, with no removal path. The
 # modifier is now sixty years rather than permanent, and this event is the way out of it before
 # then, at a price scaled to the realm's tax base and to how dug in the office had become when
 # it was sold.

 cc_byz_bureaucracy.62.title: "El cargo redimido"
 cc_byz_bureaucracy.62.desc: "La familia que ocupa el cargo ha escrito al palacio. No para quejarse: sino para observar, extensamente y con cifras, cuánto les ha costado mantener el cargo, y señalar que, por supuesto, lo devolverían a la corona si esta tuviera la intención de compensar el desembolso.\n\nEsto no es una oferta. Es un precio, fijado por personas que han tenido mucho tiempo para pensar en lo que vale el cargo y ninguna razón para infravalorarlo."
 cc_byz_bureaucracy.62.desc_dug_in: "Tres generaciones han nacido para este cargo. El abuelo del actual titular lo compró, su padre lo administró, y él nunca en su vida ha tenido que considerar qué haría de otra manera.\n\nLa familia ha presentado cuentas. Son meticulosas, son casi con seguridad honestas, y describen una inversión que la corona tendría que igualar para deshacerla. Nadie en el palacio finge que la suma sea irrazonable. Es simplemente enorme."
 cc_byz_bureaucracy.62.desc_several: "Más de un puesto ha seguido este camino ahora, y los hombres que los ocupan se han dado cuenta unos de otros. Lo que llega al palacio no es una carta de una familia, sino una posición acordada entre varios, citando los mismos precedentes y pidiendo el mismo precio.\n\nLa corona creó el precedente al vender el primero. Ahora se lo están devolviendo."
 cc_byz_bureaucracy.62.a: "Págalo. El cargo es de la corona."
 cc_byz_bureaucracy.62.b: "Recuperarlo y dejar que demanden."
 cc_byz_bureaucracy.62.c: "Déjalo. El dinero se necesita en otra parte."

 # ---- Timed societal drift ----
 # Granted alongside the instant societal jumps rather than instead of them. The jump is the
 # decision landing; the drift is the decision working.
 STATIC_MODIFIER_NAME_cc_byz_taxis_reforming: "Gobierno por Oficio"
 STATIC_MODIFIER_DESC_cc_byz_taxis_reforming: "Los puestos se están llenando por nombramiento, se mantienen a voluntad y se pagan a tiempo. Nada de eso es un decreto y todo ello es una política."
 STATIC_MODIFIER_NAME_cc_byz_taxis_habit: "El Hábito Administrativo"
 STATIC_MODIFIER_DESC_cc_byz_taxis_habit: "No se ha anunciado nada. Las cosas simplemente se están haciendo de la manera en que el fisco las hace, por personas que han dejado de preguntar de quién es hijo cada cual."
 STATIC_MODIFIER_NAME_cc_byz_dynatoi_ascendant: "Los magnates consolidándose"
 STATIC_MODIFIER_DESC_cc_byz_dynatoi_ascendant: "Se ha concedido algo estructural, y las personas que se beneficiaron de ello están organizando sus asuntos asumiendo que no se les retirará."
 STATIC_MODIFIER_NAME_cc_byz_dynatoi_creeping: "La transferencia silenciosa"
 STATIC_MODIFIER_DESC_cc_byz_dynatoi_creeping: "No se concedió ninguna subvención ni se cambió ninguna ley. Tierras, soldados y cargos están pasando a manos privadas a la velocidad de la vida cotidiana."
