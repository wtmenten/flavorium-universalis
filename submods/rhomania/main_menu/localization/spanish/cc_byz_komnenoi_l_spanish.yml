 # Country modifiers
 STATIC_MODIFIER_NAME_cc_byz_kom_imperial_aid: "Tropas Imperiales en la Frontera"
 STATIC_MODIFIER_DESC_cc_byz_kom_imperial_aid: "Un tagma bizantino mantiene la frontera póntica contra los turcomanos."
 STATIC_MODIFIER_NAME_cc_byz_kom_troops_abroad: "Tagma en el Ponto"
 STATIC_MODIFIER_DESC_cc_byz_kom_troops_abroad: "Los soldados enviados a defender Trebisonda no están disponibles en casa."
 STATIC_MODIFIER_NAME_cc_byz_kom_acclaimed: "Aclamado en Trebisonda"
 STATIC_MODIFIER_DESC_cc_byz_kom_acclaimed: "Trebisonda aceptó al emperador sin una guerra. Hay un solo emperador romano de nuevo."
 STATIC_MODIFIER_NAME_cc_byz_kom_crowns_joined: "Dos Coronas, Un Emperador"
 STATIC_MODIFIER_DESC_cc_byz_kom_crowns_joined: "El emperador de Constantinopla también porta la corona de Trebisonda."
 STATIC_MODIFIER_NAME_cc_byz_kom_turned_away: "Rechazó a Constantinopla"
 STATIC_MODIFIER_DESC_cc_byz_kom_turned_away: "Trebisonda rechazó la unión con Bizancio y está cortejando a otros amigos."
 STATIC_MODIFIER_NAME_cc_byz_kom_just_war: "Un reclamo justo"
 STATIC_MODIFIER_DESC_cc_byz_kom_just_war: "La reclamación a la corona de Trebisonda se preparó durante años, y el ejército se lo cree."

 # .1
 cc_byz_komnenoi.1.title: "La Cuestión Comneniana"
 cc_byz_komnenoi.1.desc: "Desde 1204, dos cortes han llamado a su gobernante Emperador de los Romanos: la nuestra y los Grandes Comneno en [cc_kom_tre.GetName]. El imperio nunca ha concedido formalmente el punto y Trebisonda nunca ha abandonado el estilo.\n\nEl consejo quiere resolverlo. Una unión de las dos coronas pondría fin a la disputa. También lo haría una guerra. De cualquier manera, el primer paso es una embajada."
 cc_byz_komnenoi.1.desc_family: "El gobernante de [cc_kom_tre.GetName] es de nuestra propia casa. Por primera vez desde 1204, los dos títulos imperiales están en manos de miembros de una misma familia, y el consejo ve una oportunidad que podría no repetirse.\n\nUna unión de las coronas podría organizarse como un acuerdo familiar. Aún requerirá una embajada, y la requerirá pronto."
 cc_byz_komnenoi.1.desc_hostility: "Las relaciones con [cc_kom_tre.GetName] se han deteriorado hasta el punto de que el consejo ya no discute a los Comnenos como aliados. Siguen llamando a su gobernante Emperador de los Romanos, y varios de nuestros ministros sostienen ahora que el título debe serles arrebatado por la fuerza.\n\nOtros quieren una embajada más primero. Ambos grupos coinciden en que el asunto debe resolverse."
 cc_byz_komnenoi.1.desc_alliance: "[cc_kom_tre.GetName] ha sido nuestro aliado durante años y su corte tiene una buena opinión de nosotros. El consejo propone utilizar esa buena voluntad para plantear la antigua cuestión: si debería haber dos emperadores romanos.\n\nUna unión de las coronas pondría fin a la disputa sin una guerra. Requerirá años de embajadas y algunos gastos."
 cc_byz_komnenoi.1.desc_peril: "[cc_kom_tre.GetName] atraviesa dificultades, con una corte inestable o una guerra en su frontera. El consejo señala que una Trebisonda débil puede aceptar términos que una fuerte rechazaría, y que el imperio puede ofrecer protección o simplemente esperar.\n\nEn cualquier caso, es momento de plantear la cuestión de las dos coronas."
 cc_byz_komnenoi.1.a: "Enviar enviados que escuchen primero."
 cc_byz_komnenoi.1.b: "Hay un solo imperio, y su capital es Constantinopla."
 cc_byz_komnenoi.1.c: "Escríbeles como familia."

 # .2
 cc_byz_komnenoi.2.title: "La Corte Póntica"
 cc_byz_komnenoi.2.desc: "Nuestros enviados informan que el gobierno de [cc_kom_tre.GetName] recae en un pequeño consejo de archontes, las grandes familias terratenientes del Ponto. Ellos deciden qué puede aceptar el Gran Comneno y están abiertos a la persuasión.\n\nLos enviados sugieren regalos, un matrimonio entre las dos casas o una petición a través de la Iglesia. Un enviado sugiere un enfoque diferente: crear un partido en la corte que prefiera a un emperador lejano que a uno cercano."
 cc_byz_komnenoi.2.a: "Regalos para los archontes."
 cc_byz_komnenoi.2.b: "Proponer un matrimonio entre [cc_kom_byz_spouse.GetName] y [cc_kom_tre_spouse.GetName]."
 cc_byz_komnenoi.2.c: "Pedir al Patriarca que escriba al metropolitano."
 cc_byz_komnenoi.2.d: "Formar un partido en la corte."

 # .3
 cc_byz_komnenoi.3.title: "La Frontera Turcomana"
 cc_byz_komnenoi.3.desc: "Las tribus turcomanas en las colinas detrás de [cc_kom_tre.GetName] asaltan los valles pónticos cada verano. La capacidad de Trebisonda para mantener esa frontera es la razón principal por la que sigue siendo independiente, y su corte lo sabe.\n\nLa ayuda en la frontera sería recordada. Retenerla también sería recordado, y una Trebisonda que haya perdido hombres y aldeas será más fácil de manejar."
 cc_byz_komnenoi.3.desc_war: "[cc_kom_tre.GetName] está en guerra y sus enviados han venido a preguntar qué hará Constantinopla al respecto.\n\nLa ayuda inmediata sería recordada. El hecho de retenerla también sería recordado, y una Trebisonda que haya perdido hombres y aldeas será más fácil de manejar."
 cc_byz_komnenoi.3.a: "Enviar una tagma al este."
 cc_byz_komnenoi.3.b: "Pagar por las murallas y la guarnición."
 cc_byz_komnenoi.3.c: "Trebisonda puede mantener su propia frontera."

 # .4
 cc_byz_komnenoi.4.title: "Orgullo Comneno"
 cc_byz_komnenoi.4.desc: "Las negociaciones han llegado a la cuestión de los títulos. El Gran Comneno no se convertirá en un mero gobernador, y nuestro consejo no aceptará a un segundo emperador.\n\nExiste una posición intermedia reconocida. El título de Despota ocupa el segundo lugar después del emperador y ha sido concedido a parientes imperiales durante dos siglos. Ofrecerlo nos cuesta algo de prestigio. Negarse a ofrecer nada deja claro hacia dónde se dirigen las negociaciones."
 cc_byz_komnenoi.4.a: "Ofrecer el título de Despotas."
 cc_byz_komnenoi.4.b: "Deben renunciar al estilo imperial."
 cc_byz_komnenoi.4.c: "Resolverlo como un asunto familiar."

 # .5
 cc_byz_komnenoi.5.title: "Pretendientes Rivales"
 cc_byz_komnenoi.5.desc: "Otras cortes han notado nuestras embajadas a [cc_kom_tre.GetName]. Enviados del extranjero han llegado allí con sus propias ofertas: privilegios comerciales, alianzas y matrimonios. Los archontes los están escuchando a todos.\n\nPodemos superarlos en la oferta o denunciar públicamente los tratos de Trebisonda con extranjeros."
 cc_byz_komnenoi.5.desc_suitor: "Los enviados de [cc_kom_suitor.GetName] han llegado a [cc_kom_tre.GetName] con ofertas de privilegios comerciales, una alianza y un matrimonio. Los archontes están escuchando.\n\nPodemos superarlos en la oferta, denunciar públicamente los tratos de Trebisonda con extranjeros o acercarnos directamente a [cc_kom_suitor.GetName] para llegar a un acuerdo sobre el Ponto."
 cc_byz_komnenoi.5.a: "Superarlos en la oferta."
 cc_byz_komnenoi.5.b: "Denunciar los tratos de Trebisonda."
 cc_byz_komnenoi.5.c: "Llegar a un entendimiento con [cc_kom_suitor.GetName]."

 # .6
 cc_byz_komnenoi.6.title: "El Acuerdo de Trebisonda"
 cc_byz_komnenoi.6.desc: "Tras años de embajadas, el consejo debe decidir cómo resolver la cuestión de las dos coronas.\n\nPodemos proponer formalmente una unión. Si los archontes aceptan, un emperador llevará ambas coronas y, si nuestro prestigio en Trebisonda es lo suficientemente alto, podrían simplemente aclamarlo y poner fin al estado independiente. Si se niegan, la alianza termina.\n\nO podemos declarar que la corona de Trebisonda es una usurpación y reclamarla por derecho.\n\n#Y Acuerdo#! actual: #Y [ROOT.GetCountry.MakeScope.GetVariable('cc_byz_kom_accord').GetValue|0]#!\n#Y Pretexto#! actual: #Y [ROOT.GetCountry.MakeScope.GetVariable('cc_byz_kom_pretext').GetValue|0]#!"
 cc_byz_komnenoi.6.a: "Proponer la unión."
 cc_byz_komnenoi.6.b: "Declarar su corona una usurpación."
 cc_byz_komnenoi.6.c: "Dejemos que la cuestión descanse."

 # .20
 cc_byz_komnenoi.20.title: "La Propuesta del Emperador"
 cc_byz_komnenoi.20.desc: "Los enviados de [cc_kom_emperor.GetName] han presentado una propuesta formal: que las coronas de Constantinopla y Trebisonda se unan bajo un solo emperador.\n\nSi aceptamos, los archontes decidirán los términos. Pueden conformarse con una unión personal con Constantinopla como socio principal, o pueden aclamar al emperador directamente y poner fin a Trebisonda como estado independiente. Si rechazamos la oferta, la alianza con Constantinopla terminará y el emperador tendrá un derecho sobre nuestra corona."
 cc_byz_komnenoi.20.a: "Aceptamos."
 cc_byz_komnenoi.20.b: "Trebisonda tiene su propio emperador."

 # .21
 cc_byz_komnenoi.21.title: "Trebisonda acepta"
 cc_byz_komnenoi.21.desc: "La corte de [cc_kom_tre.GetName] ha aceptado la unión en principio. Los arcontes se están reuniendo para acordar los términos. O aceptarán una unión personal bajo nuestro emperador o lo aclamarán directamente como su propio gobernante."
 cc_byz_komnenoi.21.a: "Esperamos su respuesta."

 # .30
 cc_byz_komnenoi.30.title: "Aclamación en Trebisonda"
 cc_byz_komnenoi.30.desc: "Los archontes de [cc_kom_tre.GetName] han aclamado a nuestro emperador como su propio gobernante. La corte de los Grandes Comneno se disuelve, sus tierras se convierten en provincias del imperio y, por primera vez desde 1204, hay un solo emperador romano."
 cc_byz_komnenoi.30.a: "Un solo imperio."

 # .31
 cc_byz_komnenoi.31.title: "Dos Coronas, Un Emperador"
 cc_byz_komnenoi.31.desc: "Los archontes de [cc_kom_tre.GetName] han aceptado una unión personal. Trebisonda mantiene su propia corte y leyes, y nuestro emperador es ahora también su gobernante.\n\nLa integración total llevará décadas. Las leyes de la unión deciden qué tan rápido puede suceder."
 cc_byz_komnenoi.31.a: "Es un comienzo."

 # .32
 cc_byz_komnenoi.32.title: "Trebisonda rechaza"
 cc_byz_komnenoi.32.desc: "La corte de [cc_kom_tre.GetName] ha rechazado la unión. Sus enviados han abandonado Constantinopla y la alianza entre las dos cortes ha llegado a su fin. Los informes indican que Trebisonda ya está buscando otros amigos.\n\nEl consejo señala que el rechazo otorga al imperio un derecho sobre la corona de Trebisonda, para cualquiera que quiera reclamarlo."
 cc_byz_komnenoi.32.a: "Se arrepentirán."

 # .40
 cc_byz_komnenoi.40.title: "Una corona usurpada"
 cc_byz_komnenoi.40.desc: "El emperador ha declarado que la corona de [cc_kom_tre.GetName] fue tomada en 1204 por una familia sin derecho a ella y que hoy se posee ilegalmente. El imperio la reclama.\n\nLa alianza con Trebisonda ha terminado. El ejército está listo para hacer valer el reclamo."
 cc_byz_komnenoi.40.a: "La corona será recuperada."

 # .50
 cc_byz_komnenoi.50.title: "Bajo Una Corona"
 cc_byz_komnenoi.50.desc: "Los archontes se han decidido por una unión personal. El emperador en Constantinopla ahora gobierna también Trebisonda, como su socio principal. Nuestra corte y leyes siguen siendo las nuestras."
 cc_byz_komnenoi.50.a: "Que así sea."

 # .51
 cc_byz_komnenoi.51.title: "La Reclamación del Emperador"
 cc_byz_komnenoi.51.desc: "[cc_kom_emperor.GetName] ha declarado que nuestra corona es una usurpación y la ha reclamado por derecho. La alianza ha terminado y es probable que un ejército de Constantinopla le siga."
 cc_byz_komnenoi.51.a: "A guarnecer las murallas."

 # .90
 cc_byz_komnenoi.90.title: "La Cuestión Caduca"
 cc_byz_komnenoi.90.desc: "Las circunstancias han superado las negociaciones con Trebisonda. La otra parte ya no puede resolver nada por cuenta propia, o las dos cortes están en guerra. Las embajadas son retiradas y el asunto se cierra."
 cc_byz_komnenoi.90.a: "Que así sea."
