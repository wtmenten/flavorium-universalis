l_spanish:
 # Decision
 cc_byz_kom_raise_the_question_decision.title: "La Cuestión Comneniana"
 cc_byz_kom_raise_the_question_decision.title.entry: "La Cuestión Comneniana"
 cc_byz_kom_raise_the_question_decision.desc: "Los Grandes Comneno de [cc_kom_tre.GetName] se han autodenominado Emperadores de los Romanos desde 1204. Dos cortes reclaman un título, y [target_character.GetName] puede abrir el asunto: mediante una negociación que termine en una unión de coronas, o construyendo el caso para tomar la segunda corona por la fuerza.\n\nLa cuestión dura aproximadamente una década. Las elecciones a lo largo del camino generan #Y Acuerdo#! (las probabilidades de una unión o una aclamación directa) y #Y Pretexto#! (la duración de una reclamación de guerra y el descuento al anexionar Trebisonda en la mesa de paz). Solo puede abrirse una vez."
 cc_byz_kom_raise_the_question_decision.desc.entry: "Los Grandes Comneno de Trebisonda se han autodenominado Emperadores de los Romanos desde 1204. Abre el asunto de la segunda corona, mediante negociación o mediante un pretexto. Dura aproximadamente una década y solo puede abrirse una vez."
 cc_byz_kom_raise_the_question_decision.a: "Enviar a Trebisonda."
 cc_byz_kom_raise_the_question_decision.a.entry: "Enviar a Trebisonda."

