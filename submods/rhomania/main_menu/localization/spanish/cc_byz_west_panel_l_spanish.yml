l_spanish:
 # The West: situation panel and map legend.
 #
 # Same split and same voice rule as cc_byz_mamluk_panel_l_english.yml. Card bodies are the
 # court speaking; every counter, threshold and vote count lives in a _INFO key behind the
 # card's info icon.

 # ---- Panel header ----
 CC_BYZ_WEST_HDR_GRIP: "Agarre"
 CC_BYZ_WEST_HDR_AUTONOMY: "Autonomía"
 CC_BYZ_WEST_HDR_RESTIVE: "El Oeste está inquieto"
 CC_BYZ_WEST_HDR_RESTIVE_TT: "Las cartas de las prefecturas se han vuelto cautelosas. Las peticiones que solían ser peticiones ahora son notificaciones, y los mensajeros tardan más de lo que explican los caminos.\n\nNo ha pasado nada. Todos en la corte pueden decirte exactamente qué se siente, y ninguno de ellos lo escribirá."

 # ---- Card: the two counters ----
 CC_BYZ_WEST_CARD_BALANCE: "El Equilibrio del Oeste"
 CC_BYZ_WEST_CARD_BALANCE_DESC: "El imperio posee el oeste, y el oeste tiene su propia opinión sobre ser poseído. Estas no son la misma cuestión, y un emperador que las trate como una sola se llevará dos sorpresas.\n\nUna provincia puede ser gobernada estrictamente y no resentir nada de ello. Otra puede estar apenas gobernada y pasar cuarenta años redactando un caso contra la capital. El arreglo peligroso es aquel en el que el emperador aprieta con fuerza y el oeste ha dejado de ver por qué."
 CC_BYZ_WEST_CARD_BALANCE_INFO: "Dos contadores independientes, cada uno de 0 a 100. No son los dos extremos de una sola barra y ambos pueden estar altos a la vez.\n\n#T El Control Imperial#! aumenta con los censos, los strategoi enviados, las revocaciones obedecidas y el tributo cobrado. Cae cuando las prefecturas se dejan funcionar solas.\n\n#T La Autonomía Occidental#! aumenta con las cartas concedidas, los hijos confirmados en los asientos de sus padres, las revocaciones rechazadas y los años sin supervisión. Cae cuando el emperador está presente en occidente y paga por ello.\n\nEl estado en el que surge la revuelta es aquel donde tanto el control como la autonomía están en 60 o más. La situación se resuelve en todos los casos antes de la Era de las Revoluciones."
 CC_BYZ_WEST_BAR_GRIP: "Agarre Imperial"
 CC_BYZ_WEST_BAR_GRIP_TT: "Aumenta con los censos, los strategoi, el cumplimiento de las llamadas y el cobro del tributo. Disminuye cuando se deja que las prefecturas se gestionen solas.\n\nUn control alto no es automáticamente bueno. Es lo que hace que la opinión del oeste sobre el acuerdo sea relevante."
 CC_BYZ_WEST_BAR_AUTONOMY: "Autonomía Occidental"
 CC_BYZ_WEST_BAR_AUTONOMY_TT: "Aumenta con las cartas concedidas, los hijos confirmados, las llamadas rechazadas y el tiempo pasado sin supervisión. Disminuye cuando el emperador está presente en el oeste y paga por ello.\n\nUna autonomía alta tampoco es automáticamente mala. Un oeste que se gobierna a sí mismo contentamente es uno de los cuatro finales."
 CC_BYZ_WEST_TENSION_BOTH_HIGH: "Sostenido con fuerza, y resentido por ello"
 CC_BYZ_WEST_TENSION_BOTH_HIGH_TT: "El imperio está gobernando provincias que han decidido que preferirían no ser gobernadas. Ambas cosas son ciertas a la vez y cada una empeora a la otra.\n\nAflojar la mano funciona. También lo hace dar al oeste una razón para querer el arreglo. No hacer ninguna de las dos también es una decisión, y ya se ha tomado anteriormente."
 CC_BYZ_WEST_TENSION_DRIFTING: "Alejándose silenciosamente"
 CC_BYZ_WEST_TENSION_DRIFTING_TT: "Nada va mal. Tampoco se posee nada.\n\nLas prefecturas se están convirtiendo en algo separado a su propio ritmo, sin una disputa y sin una fecha que alguien pueda señalar. En un reinado, pronto las cartas del emperador serán leídas como las de una corte extranjera, y nadie recordará haber decidido eso."

 # ---- Card: the prefectures ----
 CC_BYZ_WEST_CARD_PREFECTURES: "Las prefecturas"
 CC_BYZ_WEST_CARD_PREFECTURES_DESC: "Gobernadores de provincias que el imperio pasó tres siglos sin tener.\n\nCada uno fue la recompensa de alguien, y cada uno ha tenido tiempo de comprender cuánto vale el puesto para quien lo ostenta en lugar de para quien lo concedió. Lo que piensan del emperador no es un secreto. Simplemente nunca se ha pedido por escrito."
 CC_BYZ_WEST_CARD_PREFECTURES_INFO: "La lealtad oscila entre -5 y 5 por exarca.\n\nEs el número que leen la convocatoria de retirada, el hilo de fricción, los pesos de voto del consistorio y el levantamiento. Un exarca en -3 o menos rechazará una retirada; el levantamiento se nutre de exarcas en -2 o menos.\n\nAumentada por donativos, fueros y la confirmación del hijo de un exarca. Disminuida por censos, tributos, retiradas y strategoi enviados por encima de él."
 CC_BYZ_WEST_COL_LOYALTY: "Lealtad"

 # ---- Card: the consistory ----
 CC_BYZ_WEST_CARD_CONSISTORY: "El consistorio sagrado"
 CC_BYZ_WEST_CARD_CONSISTORY_DESC: "El emperador construyó una sala donde el oeste pudiera ser escuchado, porque un oeste que es escuchado es un oeste que se queda.\n\nTenía razón en eso. Lo que no hizo fue contar las sillas. Cada provincia recuperada añade una voz, y las voces nunca iban a seguir estando de acuerdo con él por gratitud hacia la sala."
 CC_BYZ_WEST_CARD_CONSISTORY_INFO: "Se realizan votaciones en el consistorio, una vez convocado.\n\n#T Augusto#! 3 votos. #T Exarca Senior#! 2 votos. #T Cada otro exarca#! 1 voto.\n\nCon una prefectura representada el emperador no puede perder, 3 contra 1. Con las cuatro representadas es 3 contra 5 y occidente gana la votación. No hay una puntuación de riesgo oculta detrás de esto: el peligro es la reconquista misma, provincia por provincia.\n\nLos estatus especiales se acumulan, por lo que elevar a un exarca senior otorga 2 en lugar de su 1, no además de él."
 CC_BYZ_WEST_VOTES_LEGEND: "Prefecturas establecidas"

 # ---- Map colouring ----
 CC_BYZ_WEST_LEGEND_PREFECTURE: "Prefectura"
 CC_BYZ_WEST_LEGEND_IMPERIAL: "Imperial"
