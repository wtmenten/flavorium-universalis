l_spanish:
 # Mission task
 cc_byz_acad_5_universities_tt: "Poseemos al menos 5 ubicaciones con una universidad"
 cc_byz_acad_opens_chain_tt: "Abre #Y La Academia#!, una serie de eventos a lo largo de 6 a 10 años que decide quién enseña, qué se enseña y termina con una carta de recompensas"

 # Tooltips
 cc_byz_acad_lean_latin2_tt: "La Academia se inclina #Y 2#! hacia la escolástica latina"
 cc_byz_acad_lean_hellenic2_tt: "La Academia se inclina #Y 2#! hacia los platonistas de Plethón"
 cc_byz_acad_lean_toward_middle_tt: "La inclinación de la Academia retrocede #Y 1#! hacia el centro"
 cc_byz_acad_unlock_policy_tt: "Desbloquea la recompensa de la carta #Y Política de la Academia Imperial#!"
 cc_byz_acad_unlock_literacy_tt: "Desbloquea la recompensa de la carta #Y Universidades Alfabetizadas#!"
 cc_byz_acad_unlock_institution_tt: "Desbloquea la recompensa de la carta #Y Conocimientos Occidentales#!"
 cc_byz_acad_unlock_tactics_tt: "Desbloquea la recompensa de la carta #Y La Enseñanza de la Tactica#!"
 cc_byz_acad_unlock_law_tt: "Desbloquea la recompensa de la carta #Y Facultad de Derecho#!"
 cc_byz_acad_unlock_theology_tt: "Desbloquea la recompensa de la carta #Y Facultad de Teología#!"
 cc_byz_acad_reconciled_tt: "La Iglesia está reconciliada con la Academia: #G +1#! elección de fuero"
 cc_byz_acad_dispute_won_tt: "#G Ganado:#! la escuela gana renombre y calidad, obtenemos #G +1#! elección de estatutos y se desbloquea #Y Universidades Alfabetizadas#!"
 cc_byz_acad_dispute_lost_tt: "#R Perdido:#! la escuela pierde renombre"
 cc_byz_acad_reward_policy_tt: "Educación de Élite obtiene la política #Y Academia Imperial#!. Mientras esté promulgada, también orientará nuestra sociedad hacia el bando que haya ganado la Academia"
 cc_byz_acad_reward_literacy_tt: "Cada ubicación que poseamos con una universidad obtiene #G +4%#! de alfabetización máxima para nobles y burgueses, permanentemente. Las universidades construidas posteriormente también lo obtendrán"
 cc_byz_acad_reward_institution_tt: "Cada ubicación que poseamos con una universidad obtiene un crecimiento de instituciones más rápido, permanentemente. Las universidades construidas posteriormente también lo obtendrán"
 cc_byz_acad_reward_tactics_tt: "#G +0.01#! de tácticas militares por cada universidad que poseamos, hasta #G +0.2#! con 20 universidades, permanentemente"

 # Law policy
 cc_byz_imperial_academy: "Academia Imperial"
 cc_byz_imperial_academy_desc: "Los funcionarios del estado se forman en una Academia fundada y financiada por el emperador. Aprenden derecho, letras y los manuales de guerra de la mano de maestros nombrados por la corte."

 # Modifiers
 STATIC_MODIFIER_NAME_cc_byz_acad_literacy: "Maestros de la Academia"
 STATIC_MODIFIER_DESC_cc_byz_acad_literacy: "Los maestros formados en la Academia imperial enseñan en esta universidad."
 STATIC_MODIFIER_NAME_cc_byz_acad_institutions: "Conocimientos Occidentales"
 STATIC_MODIFIER_DESC_cc_byz_acad_institutions: "Esta universidad lee a los escolásticos latinos en traducción griega, y nuevas ideas llegan con ellos."
 STATIC_MODIFIER_NAME_cc_byz_acad_law_faculty: "Facultad de Derecho"
 STATIC_MODIFIER_DESC_cc_byz_acad_law_faculty: "El código de Justiniano se enseña en la Academia, y sus graduados ocupan los cargos del estado."
 STATIC_MODIFIER_NAME_cc_byz_acad_theology_latin: "Facultad de Teología: Escolástica"
 STATIC_MODIFIER_DESC_cc_byz_acad_theology_latin: "Los teólogos de la Academia leen a Aquino y discuten con los latinos en sus propios términos."
 STATIC_MODIFIER_NAME_cc_byz_acad_theology_palamite: "Facultad de Teología: Hesicaste"
 STATIC_MODIFIER_DESC_cc_byz_acad_theology_palamite: "Los teólogos de la Academia enseñan la doctrina de Gregorio Palamás, y los monasterios confían en ellos."
 STATIC_MODIFIER_NAME_cc_byz_acad_theology_platonist: "Facultad de Teología: Platonista"
 STATIC_MODIFIER_DESC_cc_byz_acad_theology_platonist: "Los teólogos de la Academia leen a Platón junto a los Padres. El clero los vigila de cerca."
 STATIC_MODIFIER_NAME_cc_byz_acad_drift_latin: "La Academia lee latín"
 STATIC_MODIFIER_DESC_cc_byz_acad_drift_latin: "Los escolásticos latinos ganaron la Academia, y sus graduados llevan sus hábitos a las oficinas del estado."
 STATIC_MODIFIER_NAME_cc_byz_acad_drift_hellenic: "La Academia lee a Platón"
 STATIC_MODIFIER_DESC_cc_byz_acad_drift_hellenic: "El círculo de Plethón ganó la Academia, y sus graduados llevan el conocimiento antiguo a las oficinas del estado."
 AUTO_MODIFIER_NAME_cc_byz_acad_tactics: "La Tactica Enseñada"
 AUTO_MODIFIER_DESC_cc_byz_acad_tactics: "Los oficiales estudian la Tactica de León VI y los manuales más antiguos en la Academia. Cuantas más universidades los formen, mejor lucharán."
 AUTO_MODIFIER_NAME_cc_byz_acad_policy_latin: "Academia Imperial: Maestros Latinos"
 AUTO_MODIFIER_DESC_cc_byz_acad_policy_latin: "La política de la Academia Imperial, bajo maestros que leen la escolástica latina."
 AUTO_MODIFIER_NAME_cc_byz_acad_policy_hellenic: "Academia Imperial: Maestros Platonistas"
 AUTO_MODIFIER_DESC_cc_byz_acad_policy_hellenic: "La política de la Academia Imperial, bajo maestros del círculo de Plethon."

 # .1 Who leads the Academy
 cc_byz_academy.1.title: "La Academia ha reabierto"
 cc_byz_academy.1.desc: "El emperador ha fundado mediante fuero una Academia en [cc_acad_seat.GetName], la primera escuela de su tipo desde el Pandidakterion. Sus salones están listos. Sus maestros aún no han sido elegidos, y tres facciones desean el nombramiento.\n\nLos latinófonos leen a Aquino en la traducción de Demetrios Kydones y creen que los latinos tienen algo que enseñar. Los monjes hesicas de Gregorio Palamás sostienen que la Iglesia ya sabe para qué sirve el conocimiento. En Mistra, Gemistos Plethon enseña a Platón a cualquiera que haga el viaje, y sus estudiantes ya están en la capital solicitando el puesto."
 cc_byz_academy.1.a: "Los latinófonos. El conocimiento no tiene fronteras."
 cc_byz_academy.1.b: "Los monjes palamitas. El propio conocimiento de la Iglesia."
 cc_byz_academy.1.c: "El círculo de Plethón de Mistra."
 cc_byz_academy.1.d: "Un erudito de nuestro propio gabinete, que nos responde a nosotros."

 # .2 The faculties
 cc_byz_academy.2.title: "Las Facultades"
 cc_byz_academy.2.desc: "La Academia puede permitirse abrir una facultad adecuadamente esta década. Los juristas quieren una cátedra de derecho y un nomófilax que la ocupe, como fundó Constantino IX en 1046. Los oficiales quieren que la Tactica de León VI y los manuales más antiguos se enseñen como una disciplina. Los retóricos señalan que cada funcionario que el imperio ha tenido fue formado primero en letras, y que el resto viene después.\n\nUn ministro con la formación adecuada podría sostener una segunda facultad."
 cc_byz_academy.2.a: "Derecho. El código de Justiniano, y un nomófilax para enseñarlo."
 cc_byz_academy.2.b: "Ciencia militar. La Tactica y los antiguos manuales."
 cc_byz_academy.2.c: "Letras y retórica."
 cc_byz_academy.2.d: "Nuestro jurista enseña derecho junto a las letras."
 cc_byz_academy.2.e: "Nuestro estratega escribe una nueva Tactica junto a la facultad de letras."

 # .3 The translation question
 cc_byz_academy.3.title: "La Cuestión de la Traducción"
 cc_byz_academy.3.desc: "La biblioteca de la Academia ha preguntado qué debería traducir. El Aquino de Kydones ya circula en griego y los latinófonos quieren que el resto de los escolásticos lo acompañe. Los monjes no quieren nada en latín en los estantes. Los estudiantes de Plethon quieren que sus Leyes se enseñen abiertamente, lo que significaría enseñar a los antiguos dioses como filosofía en una capital cristiana.\n\nCualquier cosa que se lea aquí será leída por cada funcionario que la Academia forme."
 cc_byz_academy.3.a: "Traducir a Aquino y a los escolásticos latinos."
 cc_byz_academy.3.b: "Solo textos griegos. Tenemos nuestros propios libros."
 cc_byz_academy.3.c: "Enseñar las leyes de Plethón abiertamente."
 cc_byz_academy.3.d: "Nuestro humanista traduce en ambas direcciones."

 # .4 The Patriarch objects
 cc_byz_academy.4.title: "El Patriarca se opone"
 cc_byz_academy.4.desc: "El Patriarca ha escrito para decir que una Academia que enseña filosofía sin teología enseña la mitad de lo que un cristiano necesita saber. Solicita una cátedra de teología, nombrada por la Iglesia, dentro de los muros de la Academia."
 cc_byz_academy.4.desc_latin: "El Patriarca ha escrito para decir que la Academia se ha convertido en una escuela para latinizadores, y que sus graduados discuten el Filioque en los pasillos del palacio. Solicita una cátedra de teología, nombrada por la Iglesia, para responderles desde dentro de la Academia."
 cc_byz_academy.4.desc_platonist: "El Patriarca ha escrito para decir que la Academia está enseñando paganismo bajo el nombre de filosofía, y que la Iglesia no se quedará callada mientras el emperador lo paga. Solicita una cátedra de teología, nombrada por la Iglesia, dentro de los muros de la Academia."
 cc_byz_academy.4.a: "Dar a la Iglesia su cátedra."
 cc_byz_academy.4.b: "La Academia responde ante el emperador."
 cc_byz_academy.4.c: "Nuestro teólogo negocia los términos."

 # .5 The court schools dispute
 cc_byz_academy.5.title: "La Disputa de las Escuelas"
 cc_byz_academy.5.desc: "Los maestros de la Academia han convocado una disputa pública para decidir su plan de estudios, y han invitado a las otras escuelas del reino a enviar a sus mejores representantes. No tenemos ninguna escuela cortesana de renombre para enviar. Se podrían contratar maestros del extranjero para que argumenten en nuestro nombre, por un precio."
 cc_byz_academy.5.desc_school: "Los maestros de la Academia han convocado una disputa pública para decidir su plan de estudios, y han invitado a las otras escuelas del reino a enviar a sus mejores representantes. Nuestra escuela cortesana en [cc_acad_school_seat.GetName] podría presentarse. Una victoria daría prestigio a su nombre; una derrota sería recordada por igual de tiempo."
 cc_byz_academy.5.a: "Hacer entrar a la escuela."
 cc_byz_academy.5.b: "Nuestro ministro lidera a los disputantes de la escuela."
 cc_byz_academy.5.c: "Mantener a las escuelas fuera de esto."
 cc_byz_academy.5.d: "Contratar maestros del extranjero."
 cc_byz_academy.5.e: "La Academia puede defenderse a sí misma."

 # .6 The charter
 cc_byz_academy.6.title: "El Fuero de la Academia"
 cc_byz_academy.6.desc: "El fuero de la Academia está listo para el sello del emperador. Puede albergar una dotación, y una más por cada uno de estos puntos: la Iglesia reconciliada con la Academia, y una escuela cortesana victoriosa en la disputa.\n\nCada dotación fue habilitada por una elección previa y algunas requieren más:\n#Y Política de la Academia Imperial:#! una facultad de leyes o de letras.\n#Y Universidades Alfabetizadas:#! una facultad de letras o una disputa ganada, y nobles con al menos un 35% de alfabetización.\n#Y Conocimiento Occidental:#! los escolásticos latinos traducidos.\n#Y La Tactica Enseñada:#! una facultad militar, y un ministro con habilidad militar de 65 o más o una escuela cortesana militar.\n#Y Facultad de Derecho:#! una facultad de leyes, y un erudito legal en el gabinete o una escuela cortesana administrativa.\n#Y Facultad de Teología:#! la Iglesia reconciliada."
 cc_byz_academy.6.policy: "Incorporar la Academia en la ley sobre educación."
 cc_byz_academy.6.literacy: "Enviar a sus maestros a cada universidad."
 cc_byz_academy.6.institution: "Difundir el conocimiento traducido a cada universidad."
 cc_byz_academy.6.tactics: "Convertir la Tactica en el curso de los oficiales."
 cc_byz_academy.6.law: "Dotar la facultad de derecho."
 cc_byz_academy.6.theology: "Dotar la facultad de teología."
 cc_byz_academy.6.none: "Sellar la carta tal como está."

 # .90 The Academy closes
 cc_byz_academy.90.title: "La Academia cierra"
 cc_byz_academy.90.desc: "Habiendo perdido tanto Constantinopla como Atenas, la Academia no tiene hogar. Sus maestros se han dispersado por Italia y los monasterios, y su carta nunca fue sellada."
 cc_byz_academy.90.a: "Otra escuela perdida para el imperio."
