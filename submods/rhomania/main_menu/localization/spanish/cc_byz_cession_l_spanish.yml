l_spanish:
 # cc_byz_cession.1 - the five-year cession review
 cc_byz_cession.1.title: "El registro de la prefectura"
 cc_byz_cession.1.desc: "Los términos bajo los cuales se estableció el exarcado ponían cada distrito imperial de su prefectura bajo la autoridad del exarca. Los distritos que el imperio ha adquirido allí desde entonces siguen siendo administrados desde Constantinopla, y el registro de [SCOPE.sCountry('cc_byz_exarch').GetName] ahora los enumera como pendientes.\n\nLos escribanos revisan el registro cada cinco años. Necesitan un fallo: transferir los distritos como requieren los términos originales, o mantenerlos bajo los propios funcionarios del palacio hasta la próxima revisión."
 cc_byz_cession.1.a: "Transfiérelos. Esos eran los términos."
 cc_byz_cession.1.b: "Conservarlos. Se quedan con el palacio."
