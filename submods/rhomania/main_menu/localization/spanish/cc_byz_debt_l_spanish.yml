l_spanish:
 # Country modifiers
 STATIC_MODIFIER_NAME_cc_byz_customs_conceded: "Aduanas Concedidas"
 STATIC_MODIFIER_DESC_cc_byz_customs_conceded: "Una república extranjera posee una exención escrita de las aduanas de la capital. El comercio no ha caído. Simplemente ya no pasa por el tesoro en su camino."
 STATIC_MODIFIER_NAME_cc_byz_creditors_wary: "Acreedores Recelosos"
 STATIC_MODIFIER_DESC_cc_byz_creditors_wary: "Las casas bancarias de Italia han comparado notas sobre las cuentas del imperio y han tasado el resultado. Aún se puede conseguir dinero. Cuesta más y hay menos."
 STATIC_MODIFIER_NAME_cc_byz_sound_credit: "Crédito Sólido"
 STATIC_MODIFIER_DESC_cc_byz_sound_credit: "Los intereses se pagaron el día de su vencimiento, en su totalidad, sin solicitar plazos. Esto es costoso y vale lo que cuesta."
 STATIC_MODIFIER_NAME_cc_byz_revenue_farmed: "Rentas Arrendadas"
 STATIC_MODIFIER_DESC_cc_byz_revenue_farmed: "Los impuestos del próximo año se vendieron este año. El dinero llegó una vez. Los hombres que compraron el derecho cobran mientras dure el contrato, se quedan con la diferencia y no rinden cuentas a nadie en el palacio."
 STATIC_MODIFIER_NAME_cc_byz_hereditary_farm: "Granja Hereditaria"
 STATIC_MODIFIER_DESC_cc_byz_hereditary_farm: "El derecho de recaudación ha pasado a un hijo. Nadie lo concedió y nadie lo impugnó. Las familias que poseen los contratos ahora los tratan como tierras, y no se equivocan."
 STATIC_MODIFIER_NAME_cc_byz_debt_repudiated: "Deuda Repudiada"
 STATIC_MODIFIER_DESC_cc_byz_debt_repudiated: "Una deuda fue declarada nula por autoridad imperial. La autoridad fue suficiente. La consecuencia es que ninguna casa en Italia volverá a prestar bajo los términos antiguos mientras viva quien lo recuerde."
 STATIC_MODIFIER_NAME_cc_byz_fiscal_retrenchment: "Recorte Fiscal"
 STATIC_MODIFIER_DESC_cc_byz_fiscal_retrenchment: "Recortes de gastos, atrasos pagados, la evaluación reconstruida desde el censo hacia arriba. Lento, impopular en todos los sectores que importan, y el único método que alguna vez ha funcionado."
 STATIC_MODIFIER_NAME_cc_byz_crowned_without_regalia: "Coronado Sin las Regalías"
 STATIC_MODIFIER_DESC_cc_byz_crowned_without_regalia: "La corona utilizada en la coronación era de pan de oro y vidrio. Las originales están en una bóveda veneciana. Todos en la iglesia lo sabían, y la ceremonia procedió como si no fuera así."

 # Opinion modifiers
 cc_byz_creditor_privilege: "Posee Privilegios Imperiales"
 cc_byz_rival_privilege_granted: "Privilegios concedidos a nuestro rival"
 cc_byz_bought_out_creditors: "Hemos recomprado nuestra deuda"
 cc_byz_holds_pledged_territory: "Posee nuestro Territorio Empeñado"
 cc_byz_pledge_redeemed: "Han cumplido su promesa"
 cc_byz_repudiated_debt: "Han repudiado su deuda con nosotros"
 cc_byz_creditor_syndicate: "Actuaron contra nosotros como un sindicato"
 cc_byz_holds_tax_farm: "Granjas de nuestros ingresos"

 # cc_byz_debt.1 - the first Italian loan
 cc_byz_debt.1.title: "Los Términos del Préstamo"
 cc_byz_debt.1.desc: "El dinero está disponible. Ha estado disponible durante algún tiempo, y los agentes que traen la oferta se han asegurado de dejar claro que se ofrece por consideración al imperio más que por expectativa de beneficio.\n\nLa tasa es razonable. Se vuelve aún más razonable si el acuerdo incluye ciertas pequeñas concesiones respecto a las aduanas, que los agentes mencionan al final de la conversación, como una ocurrencia tardía, habiéndolo ensayado."
 cc_byz_debt.1.desc_venal: "El dinero está disponible, y los hombres que traen la oferta han hecho negocios en esta ciudad anteriormente. Saben qué funcionarios agilizarán un documento y cuánto cuesta que se agilice.\n\nLa tasa es razonable, y mejora si se incluyen ciertas concesiones respecto a las aduanas. No insisten en el punto. Han aprendido que en Constantinopla rara vez es necesario insistir dos veces en lo mismo."
 cc_byz_debt.1.a: "Pagar la tasa. No conceder nada."
 cc_byz_debt.1.b: "Aceptar los mejores términos. Un asunto de aduanas no cuesta nada hoy."
 cc_byz_debt.1.c: "Rechazar. El dinero puede recaudarse aquí."

 # cc_byz_debt.2 - the customs exemption
 cc_byz_debt.2.title: "La exención por escrito"
 cc_byz_debt.2.desc: "Lo que era un acuerdo es ahora la solicitud de un documento. La república desea que la exención quede establecida bajo sello, a perpetuidad, para que el asunto no tenga que ser revisado por futuros funcionarios que puedan estar menos informados.\n\nLa suma involucrada no es grande. El precedente lo es todo, y ambas partes también lo saben."
 cc_byz_debt.2.desc_cordial: "La relación ha sido buena y la república así lo afirma extensamente antes de venir al grano. El grano es un documento: la exención establecida bajo sello, a perpetuidad, para que los futuros funcionarios no confundan una cortesía con una concesión o una concesión con una cortesía.\n\nYa han traído el texto redactado. Es un texto corto."
 cc_byz_debt.2.a: "Sellarlo. A perpetuidad."
 cc_byz_debt.2.b: "Rechazar. Las aduanas no son suyas para ser concedidas."
 cc_byz_debt.2.c: "Veinticinco años, y ni uno más."

 # cc_byz_debt.3 - the island pledge
 cc_byz_debt.3.title: "Garantía contra la deuda"
 cc_byz_debt.3.desc: "Los acreedores han propuesto una garantía. No un pago: una prenda, mantenida contra la deuda, devolvible en su totalidad tras la redención. Sugieren una isla, y tienen una en particular en mente, y la han tenido en mente durante más tiempo que esta conversación.\n\nEl territorio pignorado se devuelve cuando la deuda se liquida. El historial de la devolución de tales prendas no es alentador."
 cc_byz_debt.3.a: "Prometerlo. La deuda queda cancelada."
 cc_byz_debt.3.b: "Pagar en moneda. La isla no es moneda de cambio."
 cc_byz_debt.3.c: "Que vengan a recogerlo ellos mismos."

 # cc_byz_debt.4 - the creditors compare notes
 cc_byz_debt.4.title: "Los acreedores comparan notas"
 cc_byz_debt.4.desc: "Hasta ahora, cada república ha tratado con el palacio por separado, lo cual ha sido la principal ventaja del imperio en estos asuntos: lo que una no prestaría, otra sí, y ninguna conocía la tasa de la otra.\n\nSe han reunido. Han intercambiado cifras. Ahora conocen la totalidad de lo adeudado, que es más de lo que cualquiera de ellos había supuesto individualmente, y han venido al palacio juntos."
 cc_byz_debt.4.desc_conceded: "Hasta ahora, cada república ha tratado con el palacio por separado, y la exención aduanera concedida a una era resentida por las demás de una manera que podía aprovecharse.\n\nSe han reunido. Compararon la exención con sus propios términos, luego compararon los términos con el total adeudado, y llegaron a una cifra que ninguno de ellos había supuesto individualmente. Han venido al palacio juntos, y traen la cifra con ellos."
 cc_byz_debt.4.a: "Compra a los cabecillas, cueste lo que cueste."
 cc_byz_debt.4.b: "Consolidar. Deje que examinen los libros."
 cc_byz_debt.4.c: "Dale a uno de ellos lo que los demás desean."

 # cc_byz_debt.5 - what the quarter became
 cc_byz_debt.5.title: "El Barrio al Otro Lado del Agua"
 cc_byz_debt.5.desc_captured: "La contabilidad ha terminado y dice lo que siempre iba a decir. Las aduanas de la capital son recaudadas por hombres que remiten a un consejo en otra ciudad. El barrio al otro lado del agua tiene sus propias murallas, sus propios tribunales y una guarnición que no es la del emperador.\n\nNo se cedió nada. Cada paso fue una respuesta razonable a una dificultad real, y la suma de las respuestas razonables es una ciudad extranjera situada en la orilla lejana del puerto, vigilando el tráfico marítimo."
 cc_byz_debt.5.desc_free: "La contabilidad ha terminado. Las deudas fueron pagadas a la tasa acordada el día acordado, las exenciones fueron rechazadas y los agentes que transportan el dinero han concluido que Constantinopla es un lugar caro para prestar y uno fiable.\n\nLa fiabilidad se compró a cierto coste. Las aduanas siguen siendo recaudadas por los hombres del emperador, y resulta que eso ha valido cada pago realizado a tiempo."
 cc_byz_debt.5.desc_mixed: "La contabilidad ha terminado y la imagen es mixta, que es la condición habitual de tales cosas. Algunas exenciones se mantienen y otras han caducado. Los agentes siguen prestando y siguen discutiendo sobre la tasa.\n\nEl barrio al otro lado del agua ha crecido. Aún no se ha convertido en algo separado, y no está decidido si lo hará."
 cc_byz_debt.5.a: "Anótalo en el registro."

 # cc_byz_debt.10 - the coronation
 cc_byz_debt.10.title: "Una coronación sin la corona"
 cc_byz_debt.10.desc: "Las regalías están en Venecia, retenidas contra una deuda que no ha sido saldada, y debe haber una coronación.\n\nEl maestro de ceremonias ha planteado la dificultad en los términos más cuidadosos de los que dispone. Se pueden hacer copias. Pueden hacerse bien, en pan de oro y vidrio coloreado, y a una distancia de veinte pasos a la luz de las velas no se distinguirán de lo que reemplazan. No dice qué serán a corta distancia, o para los hombres que estén más cerca, que son los hombres cuya opinión sobre la ceremonia importa más."
 cc_byz_debt.10.a: "Pan de oro y cristal. La ceremonia continúa."
 cc_byz_debt.10.b: "Ninguna corona en absoluto. Que hable la ausencia."
 cc_byz_debt.10.c: "Haz de la pérdida el tema del discurso."

 # cc_byz_debt.11 - the clergy on Latin creditors
 cc_byz_debt.11.title: "El clero sobre el tema de los acreedores"
 cc_byz_debt.11.desc: "Se ha informado al palacio de un sermón predicado en la capital, y el informe fue detallado porque el predicador así lo pretendía.\n\nSu tema fueron las regalías: que las insignias de los emperadores romanos se encuentran en una bóveda latina como garantía de un libro de cuentas mercantil, y que un trono que no puede redimir su propia corona debería examinar qué más ha estado dispuesto a empeñar. No mencionó la unión, ni las exenciones, ni nada más. No tuvo que hacerlo. La congregación se encargó de suministrar esos detalles por sí misma."
 cc_byz_debt.11.desc_customs: "Se ha informado al palacio de un sermón predicado en la capital, y esta vez el predicador sí nombró las cosas.\n\nNombró las regalías en la bóveda veneciana. Nombró la exención aduanera, y el barrio al otro lado del agua, y el hecho de que un hombre puede ahora estar en esta ciudad bajo una jurisdicción extranjera y no pagar nada al emperador en cuyo puerto se encuentra. Preguntó qué quedaba por empeñar, y él mismo respondió a la pregunta, y la congregación estuvo de acuerdo con la respuesta."
 cc_byz_debt.11.a: "Está de acuerdo con él. Públicamente."
 cc_byz_debt.11.b: "Recuérdale que él no ofreció el dinero."
 cc_byz_debt.11.c: "Pedir a la iglesia que financie la redención."

 # cc_byz_debt.13 - a generation later
 cc_byz_debt.13.title: "Todavía en Venecia"
 cc_byz_debt.13.desc: "El escribano que prepara la declaración anual ha incluido las regalías en el programa de propiedades pignoradas, como hizo su predecesor, y el predecesor de este. La entrada ha sido copiada sin comentarios durante tiempo suficiente para que la caligrafía con la que se escribió primero ya no se use en la cancillería.\n\nNadie decidió dejar de intentar redimirlas. No hubo debate ni instrucción. El artículo simplemente pasó, a lo largo de tres reinados, de la lista de cosas por recuperar a la lista de cosas que son un hecho, y los hombres que sirven al palacio han sacado la conclusión obvia sobre qué otras cosas en esa lista podrían ser movibles."
 cc_byz_debt.13.a: "Cópielo hacia adelante una vez más."

 # cc_byz_debt.20 - selling revenue forward
 cc_byz_debt.20.title: "Ingresos del próximo año"
 cc_byz_debt.20.desc: "El tesoro necesita dinero ahora y tendrá dinero más tarde, y hay hombres que cambiarán la segunda condición por la primera a un descuento que consideran justo.\n\nEl mecanismo es antiguo y bien conocido. Hoy se paga una suma al tesoro. A cambio, el comprador recauda los impuestos de un distrito durante un periodo de años y se queda con todo lo que pueda extraer por encima de lo que pagó. La suma llega inmediatamente. La extracción es problema de otro, en un distrito que la corte no visitará, de personas que no tienen forma de informar sobre lo que se les hace."
 cc_byz_debt.20.desc_war: "El ejército está en campaña y el ejército debe cobrar, y el tesoro tiene lo que tiene.\n\nHay hombres que adelantarán la suma hoy a cambio del derecho a recaudar los impuestos de un distrito durante un periodo de años. Se quedarán con todo lo que extraigan por encima de lo que pagaron. Todos en la sala entienden que los términos serían mejores en tiempos de paz y que el imperio no está en posición de esperar a la paz, y los hombres que hacen la oferta son quienes mejor lo entienden."
 cc_byz_debt.20.a: "Véndelo a los burgueses."
 cc_byz_debt.20.b: "Véndelo a los italianos. Pagan más."
 cc_byz_debt.20.c: "No vendas nada. En su lugar, recorta el gasto."

 # cc_byz_debt.21 - how the farmers collect
 cc_byz_debt.21.title: "Cómo recaudan los agricultores"
 cc_byz_debt.21.desc: "Los contratos se están cumpliendo. Las sumas llegan el día de su vencimiento y las cuentas cuadran, que es la única prueba que el palacio ha estado aplicando.\n\nHan empezado a llegar informes por otras vías. Los recaudadores están cobrando antes de la evaluación, cobrando en especie donde falta moneda, y cobrando dos veces a las mismas aldeas bajo el argumento de que la primera recaudación fue contra un año diferente. No hay procedimiento para que un campesino impugne esto, porque el hombre ante quien lo impugnaría compró el derecho a estar allí."
 cc_byz_debt.21.a: "Controladlos. El contrato vale menos que el campo."
 cc_byz_debt.21.b: "El dinero llega a tiempo. Esa era la prueba."
 cc_byz_debt.21.c: "Cuelga a uno de ellos donde los demás puedan verlo."

 # cc_byz_debt.22 - the farm becomes heritable
 cc_byz_debt.22.title: "El contrato pasa a un hijo"
 cc_byz_debt.22.desc: "Un recaudador de ingresos ha muerto y su hijo ha continuado cobrando. No se concedió ninguna subvención. No se consultó a ningún funcionario. El hijo simplemente se presentó en las mismas aldeas con la misma escolta, y las aldeas pagaron, porque desde su perspectiva el acuerdo no ha cambiado en ningún aspecto en el que puedan actuar.\n\nEl palacio ha sido informado por cortesía. La redacción del aviso deja claro que no se espera una respuesta."
 cc_byz_debt.22.desc_venal: "Un recaudador de ingresos ha muerto y su hijo ha continuado cobrando, lo cual no sorprende a nadie en una cancillería donde los puestos han pasado de la misma manera durante una generación.\n\nEl palacio ha sido informado por cortesía. El escribano que recibió el aviso lo archivó sin remitirlo a sus superiores, bajo la razonable opinión de que así es como se hacen las cosas ahora, y no fue corregido."
 cc_byz_debt.22.a: "Reconozcámoslo. Cobremos por la carta."
 cc_byz_debt.22.b: "Recompra los contratos, a cualquier precio."
 cc_byz_debt.22.c: "Convierte a los recaudadores en oficiales asalariados."

 # cc_byz_debt.30 - the payment cannot be made
 cc_byz_debt.30.title: "El pago vence"
 cc_byz_debt.30.desc: "El plazo del pago vence este mismo mes y la tesorería no puede cubrirlo. No se trata de una disputa sobre la suma o la fecha. El dinero no está, y a los oficiales que normalmente lo encontrarían se les ha pedido ayuda y no tienen nada que sugerir que no se haya intentado ya.\n\nEl agente del acreedor está en la ciudad y ha solicitado una audiencia para el día siguiente al vencimiento del pago, lo cual es una cortesía, y una deliberada."
 cc_byz_debt.30.desc_grip: "El plazo del pago vence este mes y la tesorería no puede cubrirlo, y el agente del acreedor no ha solicitado una audiencia porque ya no necesita solicitarlas.\n\nHa estado en el palacio tres veces esta temporada por asuntos de recaudación. Conoce el estado de las cuentas mejor que varios hombres que cobran un salario por conocerlo. Cuando falte el pago no se sorprenderá, y los términos que ofrecerá después habrán sido redactados antes del impago, en lugar de como respuesta a este."
 cc_byz_debt.30.desc_again: "El plazo del pago vence este mes y la tesorería no puede cubrirlo, y esto ya ha sucedido antes, lo que cambia el sentido de la discusión.\n\nLa primera vez, los acreedores trataron un pago fallido como una dificultad y reescribieron la deuda bajo ese entendimiento. No partirán de la misma premisa dos veces. Un único impago es un mal año. Un segundo es una descripción del estado, y los términos ofrecidos esta vez se tasarán según esa descripción en lugar de según el año."
 cc_byz_debt.30.a: "Asfixiar las oficinas. La deuda está pagada."
 cc_byz_debt.30.b: "Pedirles que lo reescriban."
 cc_byz_debt.30.c: "La deuda es nula. Que presenten una petición."
 cc_byz_debt.30.d: "Persuadirlos para que lo prorroguen sin cambios."

 # cc_byz_debt.31 - the new terms
 cc_byz_debt.31.title: "Los nuevos términos"
 cc_byz_debt.31.desc: "Están dispuestos. Siempre iban a estar dispuestos, porque una deuda renegociada a su tasa vale más para ellos que una deuda repudiada por nadie.\n\nLa tasa que proponen es alta. También proponen, al mismo tiempo y con el mismo tono, una alternativa: una tasa más baja, si la recaudación es supervisada por un factor de su elección, residente en la capital, con acceso a los registros. La segunda oferta es la que quieren que se acepte."
 cc_byz_debt.31.a: "Aceptar la tasa más alta. Nuestros registros siguen siendo nuestros."
 cc_byz_debt.31.b: "Aceptar la tasa más baja. Permitir que su hombre vea los libros."

 # cc_byz_debt.32 - the creditors act as one
 cc_byz_debt.32.title: "Un sindicato de acreedores"
 cc_byz_debt.32.desc: "Las repúblicas discuten por todo y han discutido por las deudas del imperio desde que existen. Han dejado de discutir por esta.\n\nUna deuda declarada nula por autoridad imperial no es una disputa comercial entre una casa y una corte. Es una proposición sobre si la palabra del emperador le obliga, y cada prestamista en Italia tiene interés en que la respuesta sea no. Se han puesto de acuerdo en la respuesta. El crédito está cerrado, en las tres ciudades, bajo los mismos términos, algo que nunca antes habían logrado."
 cc_byz_debt.32.a: "Soportémoslo. No compraremos nada de ellos."
 cc_byz_debt.32.b: "Resuelve una parte. Vuelve a abrir la puerta."
 cc_byz_debt.32.c: "Hay dinero al este de aquí."

 # cc_byz_debt.33 - after the bankruptcy
 cc_byz_debt.33.title: "Después del Ajuste de Cuentas"
 cc_byz_debt.33.desc: "El tesoro se ha agotado. No se ha ralentizado: se ha detenido, en el sentido específico de que los oficiales responsables del pago han recibido instrucciones de no realizar ninguno, y han empezado a explicar esto a hombres a quienes se les debía dinero y habían hecho planes asumiendo que lo recibirían.\n\nLo que ocurra a continuación se decide en las provincias más que en la capital, por quien todavía tenga moneda allí fuera para pagar a los soldados. El papel del palacio es descubrir, a su debido tiempo, qué fue lo que se decidió."
 cc_byz_debt.33.desc_jewels: "El tesoro se ha agotado, y la noticia llegó a Venecia más rápido de lo que llegó a Tesalónica, porque Venecia estaba pendiente de ello.\n\nLas regalías fueron pignoradas contra una deuda que el imperio ahora ha dejado de pagar formalmente. La posición legal no es complicada y los venecianos no se han molestado en complicarla. Lo que ocurra en las provincias lo decidirá quien todavía tenga moneda allí fuera para pagar a los soldados, y el palacio sabrá lo que se decidió algunos meses después de los hechos."
 cc_byz_debt.33.desc_strained: "El tesoro se ha agotado, y se ha agotado en el peor momento posible, lo cual no es coincidencia.\n\nLas guarniciones en las provincias recién adquiridas llevan ya meses de retraso. Las carreteras que debían vincular esas provincias con la capital no se construyeron, porque el dinero para ellas se destinó a las guarniciones, y el dinero para las guarniciones se destinó a los intereses. Cada una de esas decisiones fue correcta en el momento en que se tomó. El resultado es una frontera defendida por hombres a los que no se les ha pagado, en un territorio que no tiene razón para alimentarlos, en el momento exacto en que la capital anuncia que no puede pagar a nadie."
 cc_byz_debt.33.a: "Rehacer la evaluación desde el estudio inicial."
 cc_byz_debt.33.b: "Que los magnates recauden y remitan lo que consideren justo."
 cc_byz_debt.33.c: "Regresa a Italia con los libros abiertos."
