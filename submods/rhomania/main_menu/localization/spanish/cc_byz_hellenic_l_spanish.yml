 # replace bare Orthodox-share tests so that conversion does not make an objective impossible.
 cc_byz_faith_location_share_tt: "La fe imperial mantiene este lugar"
 cc_byz_faith_country_share_tt: "La fe imperial mantiene el reino"

 # ---- Modifiers ----
 STATIC_MODIFIER_NAME_cc_byz_old_learning: "El saber antiguo"
 STATIC_MODIFIER_DESC_cc_byz_old_learning: "Una casa, un estipendio y el nombre del emperador sobre la puerta. Los hombres que lean allí entrarán en las cancillerías, y habrán leído a Platón primero."
 STATIC_MODIFIER_NAME_cc_byz_antiquarian_licence: "Los Anticuarios Desatados"
 STATIC_MODIFIER_DESC_cc_byz_antiquarian_licence: "Se les ha dicho que sigan el argumento dondequiera que vaya. Varios de ellos se lo han tomado literalmente y el clero ha empezado a tomar notas."
 STATIC_MODIFIER_NAME_cc_byz_the_apostasy: "La Apostasía"
 STATIC_MODIFIER_DESC_cc_byz_the_apostasy: "Hay una palabra para esto en cada cancillería de la cristiandad y todos la están usando. Nadie olvida, y nadie tiene que ser recordado."
 STATIC_MODIFIER_NAME_cc_byz_edict_of_toleration: "El edicto de tolerancia"
 STATIC_MODIFIER_DESC_cc_byz_edict_of_toleration: "Ambos altares permanecen y ninguno es asunto del estado. Los magistrados saben qué hacer de nuevo, que era el punto principal."
 STATIC_MODIFIER_NAME_cc_byz_temples_restored: "Los santuarios restaurados"
 STATIC_MODIFIER_DESC_cc_byz_temples_restored: "Dinero imperial, canteros imperiales y la piedra recuperada de los muros en los que había pasado seiscientos años. Costó lo que cuesta una guerra y no puede gravarse con impuestos."
 STATIC_MODIFIER_NAME_cc_byz_two_altars: "Dos Altares"
 STATIC_MODIFIER_DESC_cc_byz_two_altars: "Dos calendarios, dos procesiones y un prefecto de la ciudad que cierra una calle dos veces al año y no le da importancia."
 STATIC_MODIFIER_NAME_cc_byz_emperors_own_rite: "El rito propio del emperador"
 STATIC_MODIFIER_DESC_cc_byz_emperors_own_rite: "Él hace sacrificios en el santuario del Palacio y el imperio no. Algo que todos entienden, que nadie declara, y que no sobrevivirá a él."
 STATIC_MODIFIER_NAME_cc_byz_perm_pontifex: "Pontifex Maximus"
 STATIC_MODIFIER_DESC_cc_byz_perm_pontifex: "Jefe de los constructores de puentes, y nadie ha explicado jamás el nombre. Los ritos del imperio son el emperador quien los ordena."

 # ---- Opinion ----
 cc_byz_opinion_apostate: "Fe abandonada"
