l_spanish:
 # The old rites: the Hellenic thread.
 #
 # See in_game/events/cc_byz_hellenic.txt for the arc's shape and why it exists. Briefly: Fate
 # of the Phoenix ships a complete, supported route out of Orthodoxy and the submod had assumed
 # Orthodoxy in 341 places, so converting broke six mission tasks and left the union arc
 # negotiating with Rome on behalf of a church the emperor had left.
 #
 # VOICE. This is a court that has watched something it has no vocabulary for. Nobody in these
 # texts calls it paganism and nobody calls it a reformation; they call it what happened, and
 # they are careful. The mechanics live in the option tooltips and the modifier descriptions,
 # not in the event bodies.
 #
 # HISTORICAL FOOTING. Gemistos Plethon really did teach at Mistra in this period, really did
 # write a code of law invoking the Olympian gods, and his book really was burned by Patriarch
 # Gennadios after his death. Julian is the other precedent and every Byzantine reader knew his
 # name. Neither is quoted directly, because attributing an invented line to a real man is the
 # one thing this file will not do.

 # ---- .1  The Academy reopened ----
 cc_byz_hellenic.1.title: "El saber antiguo"
 cc_byz_hellenic.1.desc: "Hay un hombre en Mistra que enseña Platón a cualquiera que haga el viaje, y un número sorprendente lo hace. Es cuidadoso. Habla de los antiguos como antiguos y de la Iglesia como la Iglesia, y en treinta años nadie ha sido capaz de escribir una frase suya que pudiera ser llevada ante un sínodo.\n\nSus alumnos son menos cuidadosos, y algunos de ellos están ahora en el palacio.\n\nLo que se pide es poco: una casa, un estipendio y el nombre del emperador sobre la puerta. Lo que se pregunta implícitamente es si el imperio considera mil años de su propia herencia como una herencia o como una tentación a la que sobrevivió."
 cc_byz_hellenic.1.a: "La filosofía es nuestra. La teología es de la Iglesia."
 cc_byz_hellenic.1.b: "Dejen que sigan el argumento hacia donde lo lleve."
 cc_byz_hellenic.1.c: "Tenemos bibliotecas suficientes. Ciérrala."

 # ---- .10  The rupture ----
 cc_byz_hellenic.10.title: "La religión del emperador"
 cc_byz_hellenic.10.desc: "No se hizo en un día y se habla de ello como si así fuera.\n\nLa casa real lo supo primero, luego la guardia, luego los hombres que cuidan las capillas, y para cuando se le informó al Patriarca no quedaba nada que decirle. No gritó. Preguntó, dos veces, si había entendido correctamente, y luego fue a escribir a algunas personas.\n\nAfuera, la ciudad aún no ha decidido qué piensa. Esa es la única misericordia en todo esto y no durará la temporada."
 cc_byz_hellenic.10.desc_after_union: "Dos veces en un solo reinado.\n\nLa primera vez, el emperador se plantó en la Gran Iglesia y mandó leer en voz alta la unión con Roma, y la ciudad lo llamó latino y cosas peores. Independientemente de cómo lo llamaran entonces, al menos discutían sobre a qué iglesia pertenecía.\n\nAhora nadie está confundido. Los hombres que lucharon contra la unión y los que la firmaron han descubierto que están de acuerdo en algo, lo cual nada más en doscientos años logró. Están de acuerdo sobre él."
 cc_byz_hellenic.10.desc_returned: "Las capillas están abiertas. Las lámparas están encendidas. El Patriarca, quien según todos los relatos esperaba morir en el exilio y había tomado las medidas pertinentes, recibió la noticia de pie y no dijo nada durante un largo tiempo.\n\nLo hecho está hecho. Hay hombres en las provincias que creyeron en la palabra del emperador y construyeron sus vidas sobre ella, y ahora se les ha dicho que la palabra ha cambiado. El imperio tardará algunos años en descubrir cuántos son."
 cc_byz_hellenic.10.a: "Está hecho. Que digan lo que quieran."

 # ---- .20  The edict ----
 cc_byz_hellenic.20.title: "Lo que dicta la ley actual"
 cc_byz_hellenic.20.desc: "La cuestión no es qué cree el emperador. Todo el mundo tiene eso resuelto a su propia satisfacción y ninguna proclama lo mejorará.\n\nLa cuestión es qué dice la ley sobre todos los demás, y la ley guarda actualmente un silencio que está resultando costoso. Los magistrados escriben para preguntar qué juramentos son vinculantes. Dos gobernadores han suspendido los juicios en lugar de adivinar. Un recaudador de impuestos en Bitinia se ha negado a pagar alegando que ya no sabe a quién.\n\nAlgo tiene que quedar escrito, y cualquier cosa que se escriba será leída durante un siglo como lo que el emperador quiso decir."
 cc_byz_hellenic.20.a: "Ambos altares permanecen. Ninguno es asunto del estado."
 cc_byz_hellenic.20.b: "Las dotaciones siguen el rito del emperador."
 cc_byz_hellenic.20.c: "El patriarcado se ha convertido en una corte rival. Ponle fin."

 # ---- .21  The temples ----
 cc_byz_hellenic.21.title: "Los santuarios"
 cc_byz_hellenic.21.desc: "Los agrimensores han regresado de Delfos, Olimpia y Eleusis, y sus informes coinciden en lo esencial.\n\nLa piedra está mayormente allí. Está en los muros de las aldeas, en las iglesias, en un puente a las afueras de Megara que ha soportado carros durante seiscientos años. El oráculo de Delfos es el patio de una granja y el granjero ha sido cortés con los agrimensores, pero tiene preguntas sobre la compensación. En Olimpia, el río se desplazó y enterró la mayor parte, que es la única razón por la cual la mayoría sobrevive.\n\nNada de esto está fuera del alcance del imperio. Todo cuesta lo que cuesta una guerra y no produce nada que pueda gravarse."
 cc_byz_hellenic.21.desc_suppressed: "Los agrimensores han regresado de Delfos, Olimpia y Eleusis, y los informes son los esperados: la piedra está en los muros de las aldeas y las iglesias, y extraerla significa desmantelarlas.\n\nEso es ahora una dificultad menor de lo que era. Desde que se resolvió lo del Patriarcado, los hombres que se habrían opuesto han estado buscando razones para no hacerlo, y varios obispos han escrito ofreciendo materiales antes de que nadie se los pidiera.\n\nLos agrimensores anotan esto en el margen sin hacer comentarios. Han tenido cuidado de no escribir nada que pudiera interpretarse de dos maneras."
 cc_byz_hellenic.21.a: "Reconstrúyelos adecuadamente. El tesoro lo costeará."
 cc_byz_hellenic.21.b: "Las ciudades pueden honrar a sus propios dioses a su propio coste."
 cc_byz_hellenic.21.c: "Los ritos no requieren los edificios."

 # ---- .22  The reaction ----
 cc_byz_hellenic.22.title: "La ciudad responde"
 cc_byz_hellenic.22.desc: "No empezó como un motín. Empezó como una procesión, algo que a esta ciudad siempre se le ha permitido, y la ruta fue la habitual hasta que dejó de serlo.\n\nNo están pidiendo la abdicación del emperador. Algunos sí, y esos son los que la guardia puede manejar. El resto hace una pregunta más difícil y la plantea de una forma que nadie puede arrestar: simplemente van a la iglesia en cantidades que nadie ha visto en memoria viva, en días que no son festivos, en barrios que habían dejado de preocuparse.\n\nA una ciudad no se la puede obligar a dejar de asistir a la iglesia. El emperador ha leído suficiente historia para saber cómo se recuerda al último hombre que lo intentó."
 cc_byz_hellenic.22.desc_funded: "El dinero lo hizo.\n\nMientras los santuarios eran una proclama que la ciudad podía decirse a sí misma que el emperador estaba siguiendo un gusto, como hacen los emperadores. Luego los carros empezaron a ir hacia el oeste cargados de plata imperial, y las cuentas fueron leídas en voz alta en el Hipódromo por alguien que las había obtenido, y la discusión dejó de ser sobre el alma del emperador y empezó a ser sobre la distribución de grano.\n\nHan calculado cuánto cuestan los templos. Han calculado qué más se podría haber comprado con eso. Alguien se ha asegurado cuidadosamente de que calcularan ambas cosas."
 cc_byz_hellenic.22.desc_furious: "Hay barrios de esta ciudad en los que la guardia ahora entra acompañada o no entra en absoluto.\n\nUn diácono fue asesinado en la puerta de Chalke; por quién, se disputa y seguirá disputándose, y ha sido enterrado tres veces en tres relatos diferentes de lo sucedido. La versión que se está extendiendo dice que bendijo a la multitud mientras caía. Nadie que estuviera allí dice esto. Ha dejado de importar lo que diga cualquiera que estuviera allí.\n\nEl Patriarca, o el hombre al que las multitudes llaman Patriarca, no ha sido visto en once días y se dice que está en Trebisonda, en una cisterna, o a la derecha del emperador habiendo traicionado a todos."
 cc_byz_hellenic.22.a: "Que conserven sus iglesias. Mantendrán la paz."
 cc_byz_hellenic.22.b: "Rómpelo. Ahora y completamente."
 cc_byz_hellenic.22.c: "Basta. Los ritos son propiedad del emperador, y de nadie más."

 # ---- .23  What was settled ----
 cc_byz_hellenic.23.title: "El asentamiento"
 cc_byz_hellenic.23.desc_tolerated: "Una generación después, y lo que nadie predijo es cuán ordinario se volvió.\n\nHay dos calendarios en la capital y cada quien mantiene aquel con el que fue criado. Los templos tienen congregaciones, más pequeñas que las iglesias y mejor financiadas. Dos veces al año las procesiones se cruzan y el prefecto de la ciudad cierra una calle, y esto es ahora simplemente algo que el prefecto de la ciudad hace.\n\nEl imperio pasó mil cien años creyendo que este arreglo era imposible. Ha resultado ser meramente inconveniente."
 cc_byz_hellenic.23.desc_suppressed: "Hay silencio, y el silencio es lo que se deseaba.\n\nEl Patriarcado es un cargo otorgado por el emperador, ostentado por un hombre que comprende las condiciones. Los grandes monasterios han sido dotados hacia la obediencia o vaciados hacia la obediencia. En las aldeas, los sacerdotes dicen lo que siempre han dicho, y los hombres del emperador han llegado a la conclusión de que perseguir a las aldeas cuesta más de lo que valen las aldeas.\n\nLo ganado es real y el coste no figura registrado en un solo lugar. Está en los rollos de impuestos, en los informes de reclutamiento y en una generación de hombres capaces que entraron en la Iglesia porque la alternativa era el servicio al emperador."
 cc_byz_hellenic.23.desc_private: "El emperador hace sacrificios en el santuario del Palacio, pero el imperio no.\n\nAquí es donde generalmente han terminado estas cosas. La corte es cautelosa, la Iglesia está agradecida de una manera que tiene cierto filo, y el acuerdo es comprendido por todos y declarado por nadie. Los embajadores son informados sobre a qué capilla asistir.\n\nSu sucesor no lo continuará. Todos saben eso también, incluido él, y eso no ha hecho que cambie de opinión sobre nada."
 cc_byz_hellenic.23.a: "Que permanezca así."

 # ---- .30  The ferment ----
 cc_byz_hellenic.30.title: "Predicación en los Barrios"
 cc_byz_hellenic.30.desc: "Un monje del que nadie había oído hablar hace un mes está atrayendo multitudes al Foro del Buey, y lo que dice no es sedicioso, exactamente. Predica sobre el reinado de Juliano. Da las fechas, las campañas, las cartas y la muerte en Persia a los treinta y un años sin heredero, y ni una sola vez menciona al emperperador actual.\n\nNo tiene que hacerlo. La multitud lo hace por él, de camino a casa, en las tabernas de vino, hasta llegar al puerto."
 cc_byz_hellenic.30.a: "Enviar la guardia al Foro."
 cc_byz_hellenic.30.b: "Averigua qué quiere el barrio y págalo."
 cc_byz_hellenic.30.c: "Que el Patriarca le responda. Él es mejor en esto que nosotros."

 # ---- Mission tasks ----
 cc_byz_task_academy: "La Academia Reabierta"
 cc_byz_task_academy_desc: "Justiniano cerró las escuelas de Atenas en el 529 y los filósofos se fueron a Persia, donde el rey los recibió amablemente y ellos quedaron decepcionados de él.\n\nLos libros no se fueron con ellos. Han estado en esta ciudad todo el tiempo, copiados por monjes que discrepaban de cada línea y aun así los copiaron con precisión, lo cual es la bondad más extraña en la historia del imperio."
 cc_byz_task_old_rites: "Los ritos antiguos"
 cc_byz_task_old_rites_desc: "Hubo sacrificios en la península de Mani en el siglo IX, cuatrocientos años después de que el imperio dejara de ser pagano, y los hombres que lo informaron no sabían si escandalizarse o dejarlo pasar.\n\nLo dejaron pasar. Es notable cuánto de esto el imperio siempre ha dejado simplemente pasar."
 cc_byz_task_temples: "Los santuarios restaurados"
 cc_byz_task_temples_desc: "Delfos, Eleusis, Olimpia.\n\nPausanias caminó hacia los tres y escribió lo que vio, y ya estaba escribiendo sobre un mundo que se cerraba: templos sin sacerdotes, festivales mantenidos por tres ancianos, un oráculo que respondía preguntas que ya nadie hacía. Él es la razón por la que es posible reconstruirlos. Lo escribió todo porque veía que desaparecía."
 cc_byz_task_pontifex: "Pontifex Maximus"
 cc_byz_task_pontifex_desc: "El título fue del emperador durante cuatrocientos años y ningún emperador cristiano lo cedió apresuradamente. Graciano fue el primero en rechazarlo, en el 382, y el Senado se lo tomó tan mal que siguió quejándose una década después.\n\nSignifica jefe de los constructores de puentes. Nadie ha sido capaz de explicarlo satisfactoriamente, incluidos los romanos."

 # ---- Trigger tooltips ----
 cc_byz_academy_tt: "Poseer Atenas o Constantinopla"
 cc_byz_old_rites_tt: "Los antiguos ritos están establecidos por ley"
 cc_byz_temples_tt: "Poseer Delfos, Eleusis y Olimpia"
 cc_byz_pontifex_tt: "El acuerdo religioso ha concluido"
