l_spanish:
 # The Greek Fire chain, fired by the cc_byz_task_greek_fire mission task.
 #
 # The historical position, which the text holds to: the composition was a state secret
 # restricted to the Kallinikos family and the imperial arsenal, it was already unreliable by
 # the twelfth century, and it was lost through ordinary bureaucratic attrition rather than any
 # catastrophe. Nobody burned the recipe. It simply stopped being written down by people who
 # knew what they were writing.

 cc_byz_fire.1.title: "El fuego líquido"
 cc_byz_fire.1.desc: "Los libros ceremoniales lo describen. Las crónicas lo describen. Anna Comnena describe las cabezas de bestias de bronce en las proas y el fuego que salía de ellas, y escribió hace doscientos años sobre algo que la flota de su padre aún portaba.\n\nNadie en el arsenal sabe fabricarlo.\n\nEl secreto estaba en manos de una sola familia y de los talleres imperiales, y a propósito nunca se escribió en un solo lugar. Lo que sobrevive está disperso: una nota sobre cantidades aquí, un comentario sobre las bombas allá, el inventario de un monasterio que enumera un ingrediente que hoy nadie reconoce. El Droungarios cree que podría reconstruirse. No está seguro, y no es el tipo de hombre que lo diga a la ligera."
 cc_byz_fire.1.desc_lettered: "Los libros ceremoniales lo describen, las crónicas lo describen y, por una vez, hay hombres en esta ciudad que pueden leerlos todos.\n\nEl secreto estaba en manos de una sola familia y de los talleres imperiales, y nunca se plasmó en un único documento a propósito. Lo que sobrevive está disperso a través de cuatro siglos de notas, inventarios y observaciones marginales. Recomponerlo no es una cuestión de descubrimiento sino de erudición, que es la única mercancía de la que la capital nunca ha carecido.\n\nEl Droungarios ha traído los volúmenes pertinentes. Son muchísimos."
 cc_byz_fire.1.desc_already: "El arsenal ya lo posee.\n\nLos sifones están fundidos, las tripulaciones conocen el procedimiento y la composición figura en el libro de registro del taller bajo un nombre que no significa nada para quien no haya sido instruido. Lo que la flota no tiene es el dinero para construir suficientes, y ese es un problema que el tesoro puede resolver."
 cc_byz_fire.1.a_already: "Entonces financia el arsenal adecuadamente."
 cc_byz_fire.1.a: "Asigna a los eruditos a la tarea."
 cc_byz_fire.1.b: "Enviar a los monasterios."
 cc_byz_fire.1.c: "Hay un hombre en el campo de prisioneros que construía sifones."
 cc_byz_fire.1.d: "El imperio ha logrado sobrevivir cuatrocientos años sin ello."

 cc_byz_fire.2.title: "Las pruebas de los sifones"
 cc_byz_fire.2.desc: "Tienen algo. Si es lo correcto es otra cuestión, y la forma de averiguarlo implica una barcaza, un tramo del Cuerno Dorado bien alejado de cualquier cosa valiosa, y una tripulación a la que se le ha dicho cuál es el pago antes de decirle cuál es el trabajo.\n\nLas tres primeras pruebas producen mucho humo. La cuarta produce la cosa misma, adhiriéndose al agua y ardiendo sobre ella, y la tripulación de la barcaza se queda en silencio.\n\nEl Droungarios quiere que se construya un segundo arsenal antes de que esto avance más. Señala, acertadamente, que la última vez que un emperador economizó en la flota, el imperio pasó los siguientes cincuenta años alquilando barcos genoveses."
 cc_byz_fire.2.desc_archive: "Los monjes no estaban contentos de que se les preguntara y menos contentos de tener razón. El pasaje pertinente estaba en un inventario del siglo XII de suministros navales en Abidos, copiado por alguien que claramente no entendía lo que estaba copiando y que, por lo tanto, lo transcribió exactamente.\n\nLas tres primeras pruebas producen mucho humo. La cuarta produce la cosa misma, adhiriéndose al agua y ardiendo sobre ella, y la tripulación de la barcaza se queda en silencio.\n\nEl Droungarios quiere que se construya un segundo arsenal antes de que esto avance más."
 cc_byz_fire.2.desc_captive: "El ingeniero habla. De hecho, habla muchísimo, y sobre más de lo que se le preguntó, que es ahí donde reside la dificultad: un hombre que vende un secreto ha establecido a qué se dedica profesionalmente.\n\nLas tres primeras pruebas producen mucho humo. La cuarta produce la cosa misma, adhiriéndose al agua y ardiendo sobre ella, y la tripulación de la barcaza se queda en silencio.\n\nEl Droungarios quiere que se construya un segundo arsenal antes de que esto avance más, y quiere que el ingeniero sea alojado en algún lugar con un muro alrededor."
 cc_byz_fire.2.a: "Un solo arsenal será suficiente."
 cc_byz_fire.2.b: "Construir la segunda, y poner una guardia en ambas."

 cc_byz_fire.3.title: "El fuego restaurado"
 cc_byz_fire.3.desc: "La composición está escrita. No en un solo lugar: sino en tres, guardada por separado, por hombres que no conocen sus nombres, que es aproximadamente la disposición que tenía el imperio anteriormente y que está bastante mejor documentada.\n\nLos sifones se funden en bronce en el arsenal. Las tripulaciones entrenan durante el invierno, mal al principio y luego no tan mal, y para la primavera hay galeras en el Cuerno con las cabezas de bestias en sus proas que Anna Comnena describió.\n\nEs un arma y también es un argumento. La flota que lo portaba fue la flota que rompió dos asedios árabes a esta ciudad, y todo aquel en el Mediterráneo que haya leído una crónica lo sabe."
 cc_byz_fire.3.desc_leaked: "La composición está escrita, en tres lugares, guardada por separado, por hombres que no conocen sus nombres.\n\nTambién, informa el Droungarios sin mirar a los ojos al emperador, está escrita en Génova. O Venecia. Posiblemente en ambas. Algo se fue con los carpinteros de ribera o los libros de cuentas o un escriba a quien se le debía dinero, y ahora no tiene sentido averiguar cuál.\n\nIndependientemente de ello, los sifones se funden y las tripulaciones entrenan durante el invierno, y para la primavera hay galeras en el Cuerno con las cabezas de bestias en sus proas. El imperio ha recuperado su fuego. Simplemente ya no es el único que lo posee, lo cual es un arma diferente a la que tenía Constantino IV, y conviene recordarlo antes de confiar en ella."
 cc_byz_fire.3.a: "Fundir los sifones."

 cc_byz_fire_unlocked_tt: "Los sifones pueden instalarse en las galeras y ser transportados por hombres a pie"

 # ---- The generic-action twin ----
 # Mission packs default to OFF, so this is how most players reach the chain.
 cc_byz_recover_greek_fire: "Recuperar el Fuego Líquido"
 cc_byz_recover_greek_fire_desc: "Asigna el arsenal y a los eruditos para volver a ensamblar la composición. Nunca se escribió en un solo lugar, que es por lo que se perdió y por lo que puede ser encontrada."
