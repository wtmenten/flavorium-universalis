l_spanish:
 # Tasks added by the second structural pass: the four gateways, the new stones and spurs, and
 # the trigger tooltips that replace unlocalised engine fallbacks.
 #
 # Descriptions state the condition plainly in the first sentence, because a mission task the
 # player cannot work out how to complete is not content. Flavour goes second, never first.

 # ---- The four gateways ----
 # The State Restored used to open twelve tasks at once. These four sit between it and that
 # cluster, so each branch of the empire's problem has a door of its own.
 cc_byz_task_roman_title: "El título romano"
 cc_byz_task_roman_title_desc: "Tres cortes en Europa se hacen llamar romanas. Una de ellas está en Roma y tiene un obispo en lugar de un emperador, otra es germana y fue coronada por ese obispo, y otra ha ostentado el cargo en sucesión ininterrumpida desde Augusto.\n\nSolo la tercera se siente avergonzada al respecto."
 cc_byz_task_balkan_frontier: "La frontera balcánica"
 cc_byz_task_balkan_frontier_desc: "Todo lo que está al norte de Tesalónica es un camino hacia Constantinopla. Los ávaros lo sabían, los búlgaros lo sabían, los serbios lo saben ahora, y el imperio lo ha aprendido más veces de las que desea dejar registrado."
 cc_byz_task_latin_powers: "Las potencias latinas"
 cc_byz_task_latin_powers_desc: "El Oeste no es una sola cosa. Es un papa, dos repúblicas que se odian entre sí, un rey francés, un emperador alemán y muchísima gente con reclamaciones sobre nuestras provincias. No están de acuerdo en nada, excepto en que somos cismáticos.\n\nUno de ellos aceptará nuestras cartas. Ahí es donde empieza todo."
 cc_byz_task_anatolian_return: "El retorno anatolio"
 cc_byz_task_anatolian_return_desc: "El terreno de reclutamiento. El granero. El lugar de donde provenía cada soldado del antiguo ejército, y la razón de que existiera un antiguo ejército.\n\nHa desaparecido hace doscientos cincuenta años y los hombres que viven allí ahora también nacieron allí."

 # ---- New stones: the Fisc ----
 cc_byz_task_mint: "La ceca de Tesalónica"
 cc_byz_task_mint_desc: "La segunda ciudad acuñó su propia moneda durante siglos. Un imperio que acuña en un solo lugar es un imperio que un solo asedio puede dejar sin dinero."
 cc_byz_task_bank: "La deuda liquidada"
 cc_byz_task_bank_desc: "En 1343, las joyas de la corona fueron a Venecia por treinta mil ducados. Nunca fueron rescatadas, y las copias de vidrio son las que la emperatriz usó en su propia coronación.\n\nNos gustaría no deberle nada a nadie."

 # ---- New stones: the Faith ----
 cc_byz_task_orthodox_concord: "La concordia ortodoxa"
 cc_byz_task_orthodox_concord_desc: "Compartimos un rito con los hombres que más nos han quitado. Si eso es el comienzo de una discusión o el final de una, nunca se ha resuelto, y ningún emperador se ha esforzado mucho por resolverlo."

 # ---- New stones: the Sword ----
 cc_byz_task_fleet_restored: "La flota restaurada"
 cc_byz_task_fleet_restored_desc: "La flota imperial fue liquidada en 1284 como medida de ahorro. El ahorro se ha gastado desde entonces varias veces en cascos genoveses y venecianos, y el imperio ha aprendido lo que cuesta estar en el mar en barcos ajenos."

 # ---- New spurs, by region ----
 cc_byz_task_purple_born: "Nacido en la Púrpura"
 cc_byz_task_purple_born_desc: "Un niño nacido en la cámara de pórfido mientras su padre reinaba tiene más rango que cualquier general que haya usurpado el trono, y todos en el imperio aceptan esto sin saber decir por qué.\n\nEs el único argumento que ha logrado que una sucesión bizantina sea pacífica."
 cc_byz_task_bulgarian_question: "La cuestión búlgara"
 cc_byz_task_bulgarian_question_desc: "Basilio II dedicó veintiocho años a esto y ganó un sobrenombre por ello. En menos de doscientos años hubo de nuevo un zar búlgaro, en una nueva capital, con su propio patriarca.\n\nLa lección está disponible para quien quiera aprenderla."
 cc_byz_task_danube: "El Danubio alcanzado"
 cc_byz_task_danube_desc: "El río fue la frontera durante ochocientos años. No lo ha sido durante ciento cincuenta, y todo entre él y la capital es campo abierto que nadie está defendiendo."
 cc_byz_task_union_received: "La unión recibida"
 cc_byz_task_union_received_desc: "La firma es la parte fácil y siempre lo ha sido. Los emperadores han firmado en Lyon y volverán a firmar en Florencia, y la ciudad ha rechazado a cada uno de ellos desde el púlpito antes de que termine el mes.\n\nEsto solo pide que exista la tinta."
 cc_byz_task_cataphracts: "El ala de catafractos"
 cc_byz_task_cataphracts_desc: "Hombre y caballo ambos con cota de malla, lanza, maza y arco en el mismo jinete, formados en cuña y obligados a romper una línea frontalmente. Ruinosamente caro, y la razón por la que los enemigos del imperio pasaron seis siglos escribiendo sobre su caballería."
 cc_byz_task_akritai: "Los Akritai asentados"
 cc_byz_task_akritai_desc: "Las canciones fronterizas aún se cantan: Digenes Akritas, nacido de dos pueblos, manteniendo la línea en el Éufrates contra todos. Los hombres de las canciones mantenían sus tierras porque mantenían la frontera, y el arreglo sobrevivió a la memoria del imperio sobre por qué funcionaba."
 cc_byz_task_pilgrim_road: "El camino del peregrino"
 cc_byz_task_pilgrim_road_desc: "La custodia de los lugares santos vale la pena discutirla debido al tráfico, y el tráfico desembarca en Jaffa. Poseer el santuario sin el puerto es poseer el argumento sin los ingresos."

 # ---- Trigger tooltips ----
 #
 # These wrap triggers the engine cannot localise on its own. religion_percentage in LOCATION
 # scope has only NONE/GLOBAL/THIRD trigger_localization forms, so a direct comparison in a
 # mission's enabled block falls back to religion_percentage_greater_or_equal, which vanilla
 # does not define. Wrapping in custom_tooltip is the fix; adding the missing engine key would
 # also need $TARGET_RELIGION$ to resolve in a scope where it does not.
 cc_byz_athens_orthodox_tt: "Atenas es al menos tres quintas partes ortodoxa"
 cc_byz_jerusalem_orthodox_tt: "Jerusalén es propiedad tuya y al menos la mitad de su población es ortodoxa"
 cc_byz_second_patriarchal_seat_tt: "Posee la sede de un segundo patriarcado autocéfalo: Tarnovo, Nicosia, Tiflis o Sis"
 cc_byz_union_signed_tt: "Se ha firmado la unión con Roma"

 # ---- Casus belli ----
 cc_byz_cb_reclaim_the_balkans: "Reclamar la frontera balcánica"
 cc_byz_cb_reclaim_the_balkans_desc: "El imperio nunca renunció a la línea del Danubio. Esta reclamación no se basa en nada que pueda perderse: ni en Roma, ni en un exarca, ni en la opinión de un papa. Es simplemente el territorio, y el argumento no ha cambiado desde 1185."

 # ---- Reward modifiers ----
 STATIC_MODIFIER_NAME_cc_byz_reward_levies: "El tema convocado"
 STATIC_MODIFIER_DESC_cc_byz_reward_levies: "Levas reclutadas, y reclutadas de nuevo antes de que el primer ejército haya terminado de regresar a casa."
 STATIC_MODIFIER_NAME_cc_byz_reward_credit: "Crédito en Mejores Condiciones"
 STATIC_MODIFIER_DESC_cc_byz_reward_credit: "Los prestamistas han visto la evaluación y han revisado su opinión sobre el riesgo."

 # ---- Permanent capstone modifiers ----
 STATIC_MODIFIER_NAME_cc_byz_perm_logothete: "El curso restaurado"
 STATIC_MODIFIER_DESC_cc_byz_perm_logothete: "El correo funciona, se informan sobre los caminos y el tesoro sabe lo que se le debe antes de que se le deba."
 STATIC_MODIFIER_NAME_cc_byz_perm_ecumenical: "El trono ecuménico"
 STATIC_MODIFIER_DESC_cc_byz_perm_ecumenical: "El patriarca es del emperador, y las iglesias hijas lo saben."
 STATIC_MODIFIER_NAME_cc_byz_perm_field_army: "El ejército de campaña"
 STATIC_MODIFIER_DESC_cc_byz_perm_field_army: "Un ejército que puede marchar dos veces en un reinado, algo que ningún emperador bizantino desde Manuel haya tenido."
 STATIC_MODIFIER_NAME_cc_byz_perm_state_restored: "El Estado restaurado"
 STATIC_MODIFIER_DESC_cc_byz_perm_state_restored: "El imperio ha dejado de gestionar su declive y ha empezado a elegir qué hacer a continuación."
 STATIC_MODIFIER_NAME_cc_byz_perm_anatolia: "Anatolia Asegurada"
 STATIC_MODIFIER_DESC_cc_byz_perm_anatolia: "El terreno de reclutamiento es imperialmente nuevo, independientemente de cómo se haya resuelto la cuestión turca."
 STATIC_MODIFIER_NAME_cc_byz_perm_eastern_sees: "Las sedes orientales"
 STATIC_MODIFIER_DESC_cc_byz_perm_eastern_sees: "Los patriarcados del este bajo la protección del emperador, y las rutas de caravanas que los siguen."
 STATIC_MODIFIER_NAME_cc_byz_perm_western_sea: "El mar occidental"
 STATIC_MODIFIER_DESC_cc_byz_perm_western_sea: "Puertos en ambas costas, y cascos suficientes para navegar entre ellos sin tener que preguntarle primero a una república."
 STATIC_MODIFIER_NAME_cc_byz_perm_city_adorned: "La ciudad adornada"
 STATIC_MODIFIER_DESC_cc_byz_perm_city_adorned: "La gente todavía viene aquí para ver cómo es un imperio."
 STATIC_MODIFIER_NAME_cc_byz_perm_greek_fire: "Fuego Griego Restaurado"
 STATIC_MODIFIER_DESC_cc_byz_perm_greek_fire: "Los sifones se reconstruyen, las tripulaciones se entrenan y, esta vez, la composición queda escrita en más de un lugar."
 cc_byz_bureau_funding_avg_tt: "Burocracias financiadas al 50% o más, en promedio durante los últimos cinco años"
 cc_byz_bureau_funding_avg_high_tt: "Burocracias financiadas al 75% o más, en promedio durante los últimos cinco años"
 cc_byz_anatolia_orthodox_tt: "Al menos siete de cada diez personas del imperio son ortodoxas"
