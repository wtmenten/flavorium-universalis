l_spanish:
 # Tooltips
 cc_byz_lat_bride_tt: "Nuestro gobernante o heredero está casado con el gobernante o heredero de una potencia católica que tiene un matrimonio real con nosotros y no está en guerra con nosotros"
 cc_byz_lat_opens_chain_tt: "Activa #Y La Emperatriz Latina#!, una serie de eventos a lo largo de aproximadamente una década con la potencia católica más fuerte casada con nuestra dinastía"
 cc_byz_lat_bond_plus1_tt: "#Y Vínculo con [cc_lat_partner.GetName]#! #G +1#!"
 cc_byz_lat_bond_plus2_tt: "#Y Vínculo con [cc_lat_partner.GetName]#! #G +2#!"
 cc_byz_lat_bond_minus1_tt: "#Y Vínculo con [cc_lat_partner.GetName]#! #R -1#!"
 cc_byz_lat_bond_minus2_tt: "#Y Vínculo con [cc_lat_partner.GetName]#! #R -2#!"
 cc_byz_lat_company_pay_tt: "En 5 a 8 años vencerá el pago de la compañía"
 cc_byz_lat_opens_union_tt: "Abre contactos con Roma sobre la unión eclesiástica, sin coste alguno"
 cc_byz_lat_papal_standing_plus1_tt: "#Y Posición papal#! #G +1#!"
 cc_byz_lat_crusade_tt: "Nosotros y [cc_lat_partner.GetName] ganamos cada uno un reclamo de guerra de 15 años sobre [cc_lat_target.GetName]. Si [cc_lat_partner.GetName] no está controlada por un jugador y no es ya nuestra aliada, se convierte en nuestra aliada durante 20 años. Nuestros ejércitos obtienen una bonificación de 10 años"
 cc_byz_lat_letters_unnoticed_tt: "#G 70%:#! nadie en su corte se da cuenta"
 cc_byz_lat_letters_discovered_tt: "#R 30%:#! su corte descubre para qué se utilizan sus cartas"

 # Casus belli
 cc_byz_cb_latin_crusade: "Cruzada latina"
 cc_byz_cb_latin_crusade_desc: "Jurado conjuntamente con los parientes católicos para recuperar las provincias perdidas ante una potencia musulmana."
 cc_byz_cb_latin_crusade_PROV: "Cruzada latina"

 # Opinion modifiers
 cc_byz_lat_honoured: "Honrado por el Emperador"
 cc_byz_lat_rebuffed: "Rechazado por el Emperador"
 cc_byz_lat_affronted: "Ofendido por el Emperador"
 cc_byz_lat_kin: "Una familia con el Emperador"

 # Country modifiers
 STATIC_MODIFIER_NAME_cc_byz_lat_latin_chapel: "Una capilla latina en el palacio"
 STATIC_MODIFIER_DESC_cc_byz_lat_latin_chapel: "La emperatriz escucha misa en Blanquerna. Los enviados occidentales lo toman como una señal de buena voluntad; el clero no."
 STATIC_MODIFIER_NAME_cc_byz_lat_orthodox_empress: "Una emperatriz ortodoxa"
 STATIC_MODIFIER_DESC_cc_byz_lat_orthodox_empress: "La emperatriz adoptó un nombre y una confesión ortodoxos. La Iglesia bendice el matrimonio."
 STATIC_MODIFIER_NAME_cc_byz_lat_orthodox_queen_abroad: "Una reina ortodoxa en el extranjero"
 STATIC_MODIFIER_DESC_cc_byz_lat_orthodox_queen_abroad: "Una princesa de la casa imperial mantiene su fe en una corte latina. La Iglesia la presenta como un ejemplo."
 STATIC_MODIFIER_NAME_cc_byz_lat_catholic_princess: "Una princesa recibida por Roma"
 STATIC_MODIFIER_DESC_cc_byz_lat_catholic_princess: "Una princesa de la casa imperial se ha unido a la Iglesia Romana. Las cortes occidentales lo aprueban; nuestro clero no."
 STATIC_MODIFIER_NAME_cc_byz_lat_scholars_abroad: "Eruditos griegos en el extranjero"
 STATIC_MODIFIER_DESC_cc_byz_lat_scholars_abroad: "Los eruditos y los manuscritos partieron hacia el oeste con la princesa. Enseñan griego en una corte extranjera y se les echa de menos en casa."
 STATIC_MODIFIER_NAME_cc_byz_lat_greek_learning: "Aprendizaje griego"
 STATIC_MODIFIER_DESC_cc_byz_lat_greek_learning: "Eruditos bizantinos han llegado con una princesa griega y enseñan en nuestra corte."
 STATIC_MODIFIER_NAME_cc_byz_lat_sacred_ceremonial: "El ceremonial trasladado al oeste"
 STATIC_MODIFIER_DESC_cc_byz_lat_sacred_ceremonial: "Una princesa de la casa imperial mantiene el ceremonial del Sagrado Palacio en una corte occidental, y sus gobernantes han empezado a copiarlo."
 STATIC_MODIFIER_NAME_cc_byz_lat_princess_letters: "Cartas de Occidente"
 STATIC_MODIFIER_DESC_cc_byz_lat_princess_letters: "Una princesa en una corte occidental escribe a casa a menudo, y sus cartas son leídas por más personas que por su propia familia."
 STATIC_MODIFIER_NAME_cc_byz_lat_latin_knights: "Caballeros latinos al servicio"
 STATIC_MODIFIER_DESC_cc_byz_lat_latin_knights: "Una compañía de caballeros occidentales sirve en el ejército imperial. Los arcontes resienten su paga y su precedencia."
 STATIC_MODIFIER_NAME_cc_byz_lat_company_at_large: "La compañía al aire"
 STATIC_MODIFIER_DESC_cc_byz_lat_company_at_large: "La compañía impagada está cobrando sus salarios en las provincias."
 STATIC_MODIFIER_NAME_cc_byz_lat_latin_quarter: "Barrio latino y exenciones"
 STATIC_MODIFIER_DESC_cc_byz_lat_latin_quarter: "Los mercaderes de los parientes políticos poseen un barrio en el Cuerno de Oro y no pagan aduanas. El comercio crece; el tesoro y nuestros propios mercaderes lo pagan."
 STATIC_MODIFIER_NAME_cc_byz_lat_latin_quarter_taxed: "Barrio latino"
 STATIC_MODIFIER_DESC_cc_byz_lat_latin_quarter_taxed: "Los mercaderes de los parientes políticos poseen un barrio en el Cuerno de Oro y pagan la totalidad de las aduanas."
 STATIC_MODIFIER_NAME_cc_byz_lat_privileges_in_romania: "Privilegios en Rumanía"
 STATIC_MODIFIER_DESC_cc_byz_lat_privileges_in_romania: "Nuestros mercaderes poseen una cuarta parte en Constantinopla y comercian allí libres de aduanas."
 STATIC_MODIFIER_NAME_cc_byz_lat_union_sponsors: "Patrocinadores de la Unión"
 STATIC_MODIFIER_DESC_cc_byz_lat_union_sponsors: "Nuestros parientes políticos católicos defienden el caso de la unión eclesiástica en la corte papal."
 STATIC_MODIFIER_NAME_cc_byz_lat_crusade_preparations: "La cruzada jurada"
 STATIC_MODIFIER_DESC_cc_byz_lat_crusade_preparations: "Nosotros y nuestros parientes políticos católicos hemos jurado una expedición conjunta. Se están reuniendo caballeros y levas."
 STATIC_MODIFIER_NAME_cc_byz_lat_western_kinship: "Parentesco con Occidente"
 STATIC_MODIFIER_DESC_cc_byz_lat_western_kinship: "Dos casas gobernantes, una griega y otra latina, se tratan ahora como familia."
 STATIC_MODIFIER_NAME_cc_byz_lat_western_friendship: "Amigos en Occidente"
 STATIC_MODIFIER_DESC_cc_byz_lat_western_friendship: "El matrimonio dejó una amistad duradera con una corte occidental."
 STATIC_MODIFIER_NAME_cc_byz_lat_dowager_court: "La corte de la viuda"
 STATIC_MODIFIER_DESC_cc_byz_lat_dowager_court: "La emperatriz latina permaneció en Constantinopla después de que la fortuna de su familia cambiara, y los enviados occidentales todavía la visitan."

 # .1 The empress arrives
 cc_byz_latin.1.title: "La emperatriz latina"
 cc_byz_latin.1.desc: "La novia de [cc_lat_partner.GetName] ha llegado a Constantinopla con sus damas, sus capellanes y un confesor. El Patriarca pregunta si será recibida en la Iglesia Ortodoxa y si se le dará un nombre griego, como Bertha de Sulzbach se convirtió en Irene. Su propia casa espera que conserve su rito.\n\nCualquier decisión que se tome será leída en la corte de su padre como una declaración de cómo lo consideramos."
 cc_byz_latin.1.a: "Adopta un nombre y confesión ortodoxos."
 cc_byz_latin.1.b: "Mantiene su rito. Abrir una capilla latina en Blanquernas."
 cc_byz_latin.1.c: "El patriarca los casa; su confesor se queda, en privado."

 # .11 Western branch: our princess at their court
 cc_byz_latin.11.title: "Una princesa en Occidente"
 cc_byz_latin.11.desc: "[cc_lat_princess.GetName] ha llegado a la corte de [cc_lat_partner.GetName] con su séquito, sus iconos y un capellán ortodoxo. Su nueva familia espera que sea recibida en la Iglesia Romana antes de la coronación. El Patriarca le ha escrito para recordarle que es una hija de la púrpura.\n\nLo que ella decida será interpretado en ambas capitales como nuestra decisión."
 cc_byz_latin.11.a: "Es recibida en la Iglesia Romana."
 cc_byz_latin.11.b: "Mantiene su fe y su capellán."
 cc_byz_latin.11.c: "Su rito en público, el de ella en privado, y una dote más grande."

 # .12 Western branch: what she carries west
 cc_byz_latin.12.title: "Lo que la Princesa llevó al Oeste"
 cc_byz_latin.12.desc: "[cc_lat_princess.GetName] se ha establecido en la corte de [cc_lat_partner.GetName] y pregunta qué más puede traer de su hogar. Sofía Paleóloga llevó el águila bicéfala y el ceremonial del Sagrado Palacio a Moscú, y la corte de su marido nunca volvió a ser la misma. Eruditos griegos siguieron a cada embajada bizantina a Italia y muchos no regresaron.\n\nPodría llevar maestros y libros, las formas del palacio, o simplemente escribir a casa a menudo."
 cc_byz_latin.12.a: "Enviar eruditos y manuscritos con su séquito."
 cc_byz_latin.12.b: "Permitir que conserve el ceremonial del Sagrado Palacio."
 cc_byz_latin.12.c: "Leer sus cartas como despachos."

 # .2 Latin knights
 cc_byz_latin.2.title: "Caballeros latinos en la corte"
 cc_byz_latin.2.desc: "[cc_lat_partner.GetName] ha enviado una compañía de caballeros para servir al emperador, como señal de la alianza. Están fuertemente armados, son muy caros y desprecian todo lo griego. Manuel Comneno favoreció a tales hombres y sus archontes nunca se lo perdonaron. Andrónico II contrató a los catalanes y pasó la siguiente década luchando contra ellos.\n\nEl capitán de la compañía pide un contrato. Sus hombres aceptarían un torneo en su honor como una alternativa menor."
 cc_byz_latin.2.a: "Incorporarlos al servicio."
 cc_byz_latin.2.b: "Celebrar un torneo en el Hipódromo en su lugar."
 cc_byz_latin.2.c: "Agradecerles y enviarlos a casa."

 # .21 The company's pay
 cc_byz_latin.21.title: "La paga de la compañía"
 cc_byz_latin.21.desc: "El contrato de la compañía latina ha llegado a su fin y su capitán ha presentado la cuenta. Es mayor de lo que nadie recuerda haber acordado. Si no se paga, sus hombres la cobrarán ellos mismos, como hicieron los catalanes en Tracia."
 cc_byz_latin.21.a: "Pagar la totalidad y renovar el contrato."
 cc_byz_latin.21.b: "Pagarlos y escoltarlos hasta los barcos."
 cc_byz_latin.21.c: "La cuenta es fraudulenta. No pagues nada."

 # .3 Merchant privileges
 cc_byz_latin.3.title: "Los privilegios de los mercaderes"
 cc_byz_latin.3.desc: "Comerciantes de [cc_lat_partner.GetName] han seguido el matrimonio hasta Constantinopla. Su enviado pide un barrio en el Cuerno de Oro y la exención de las aduanas, los términos que Alejo I concedió a Venecia en 1082.\n\nLos privilegios venecianos compraron una flota cuando el imperio la necesitaba. También costaron al tesoro sus aduanas durante dos siglos y pusieron el comercio de la ciudad en manos extranjeras."
 cc_byz_latin.3.a: "Conceder el barrio y la exención."
 cc_byz_latin.3.b: "Conceder el barrio. Las aduanas se mantienen."
 cc_byz_latin.3.c: "Las costumbres de Constantinopla no son un regalo de bodas."

 # .4 The Pope's letter
 cc_byz_latin.4.title: "Una carta de Roma"
 cc_byz_latin.4.desc: "El Papa ha escrito para felicitarnos por el matrimonio y observar que la unión de casas es un buen comienzo para una unión de iglesias. [cc_lat_partner.GetName] ha dado a conocer que comparte esa esperanza.\n\nLa carta nos pide que recibamos a los legados papales."
 cc_byz_latin.4.desc_progress: "El Papa ha escrito para decir que nuestro matrimonio con [cc_lat_partner.GetName] le da esperanzas para la unión que ahora se está discutiendo. Nuestros parientes se ofrecen a abogar por ella en la corte papal, lo que ayudaría en Roma y sería notado en Constantinopla."
 cc_byz_latin.4.desc_received: "El Papa ha escrito para agradecernos. Un emperador romano casado con una casa real católica, y en comunión con Roma, es lo que el papado ha deseado durante doscientos años. [cc_lat_partner.GetName] ha añadido sus propias felicitaciones."
 cc_byz_latin.4.desc_repudiated: "El Papa ha escrito para decir que nuestro repudio de la unión deshonra el matrimonio. [cc_lat_partner.GetName] está avergonzado ante Roma y desea algún gesto de nuestra parte."
 cc_byz_latin.4.desc_hellenic: "El Papa ha escrito a [cc_lat_partner.GetName], no a nosotros, preguntando cómo una casa católica puede seguir casada con una corte que ha regresado a los antiguos dioses. Nuestros parientes nos han reenviado la carta y esperan una respuesta."
 cc_byz_latin.4.a: "Recibir a los legados."
 cc_byz_latin.4.b: "Un matrimonio no es un consejo."
 cc_byz_latin.4.c: "Dejar que nuestros parientes políticos hablen por la unión."
 cc_byz_latin.4.d: "Pedirles que no interfieran en asuntos eclesiásticos."
 cc_byz_latin.4.e: "Agradecer a Su Santidad."
 cc_byz_latin.4.f: "Enviar regalos para suavizarlo."
 cc_byz_latin.4.g: "El repudio se mantiene."
 cc_byz_latin.4.h: "Enviar oro y no decir nada sobre los dioses."
 cc_byz_latin.4.i: "Nuestros dioses son asunto nuestro."

 # .5 The crusade proposal
 cc_byz_latin.5.title: "La propuesta de cruzada"
 cc_byz_latin.5.desc: "[cc_lat_partner.GetName] propone una expedición conjunta contra [cc_lat_target.GetName]: sus caballeros por mar, nuestros ejércitos por tierra, para recuperar las provincias que tomaron los turcos y los árabes. Cada matrimonio occidental en la dinastía ha traído una propuesta como esta.\n\nLa última cruzada que vino al este, en 1204, tomó Constantinopla en su lugar."
 cc_byz_latin.5.a: "Que tomen la cruz con ellos."
 cc_byz_latin.5.b: "Pedir oro para las murallas en su lugar."
 cc_byz_latin.5.c: "Recordamos 1204. Rechazar."

 # .6 The settlement
 cc_byz_latin.6.title: "El matrimonio, diez años después"
 cc_byz_latin.6.desc_kin: "Una década después del matrimonio, [cc_lat_partner.GetName] y Constantinopla se comportan como una sola familia. Los enviados viajan sin ceremonias, los príncipes de ambas casas son padrinos de los hijos del otro, y las cortes occidentales tratan un insulto a uno como un insulto a ambos."
 cc_byz_latin.6.desc_friends: "Una década después del matrimonio, las relaciones con [cc_lat_partner.GetName] son buenas. Ninguna de las cortes ha concedido a la otra todo lo que ha pedido, y ninguna tiene un agravio serio."
 cc_byz_latin.6.desc_cool: "Una década después del matrimonio, las relaciones con [cc_lat_partner.GetName] son correctas pero no más cálidas. Se rechazaron demasiadas peticiones en ambos bandos. La emperatriz es respetada en el palacio y tiene poca influencia fuera de él."
 cc_byz_latin.6.desc_kin_west: "Una década después del matrimonio, [cc_lat_partner.GetName] y Constantinopla se comportan como una sola familia. [cc_lat_princess.GetName] es la figura más influyente en la corte de su marido después del rey, y sus hijos heredarán el derecho a dos coronas."
 cc_byz_latin.6.desc_friends_west: "Una década después del matrimonio, las relaciones con [cc_lat_partner.GetName] son buenas. [cc_lat_princess.GetName] es respetada en su corte, y sus cartas siguen llegando cada estación."
 cc_byz_latin.6.desc_cool_west: "Una década después del matrimonio, las relaciones con [cc_lat_partner.GetName] son correctas pero no más cálidas. [cc_lat_princess.GetName] es bien tratada en su corte y tiene poca voz en ella."
 cc_byz_latin.6.a: "Dos casas, una familia."
 cc_byz_latin.6.b: "Una amistad que vale la pena conservar."
 cc_byz_latin.6.c: "Al menos el matrimonio se mantiene."
 cc_byz_latin.6.d: "Enviar el séquito latino de vuelta a casa."

 # .90 The partnership ends
 cc_byz_latin.90.title: "La alianza latina termina"
 cc_byz_latin.90.desc: "[cc_lat_partner.GetName] ya no es el socio que era cuando se celebró el matrimonio: ha perdido su posición entre las grandes potencias, ha dejado la Iglesia Romana o el vínculo matrimonial entre nuestras casas ha caducado. Los acuerdos que dependían de ello se dan por terminados."
 cc_byz_latin.90.desc_dowager: "[cc_lat_partner.GetName] ya no es el socio que era cuando se celebró el matrimonio. La emperatriz ha decidido quedarse en Constantinopla, y las amistades que hizo en la corte permanecen con ella."
 cc_byz_latin.90.desc_dowager_west: "[cc_lat_partner.GetName] ya no es el socio que era cuando se celebró el matrimonio. La princesa que enviamos allí sigue siendo honrada en esa corte, y las amistades que hizo allí permanecen."
 cc_byz_latin.90.desc_war: "Estamos en guerra con [cc_lat_partner.GetName]. La casa de la emperatriz está vigilada en el palacio, y los acuerdos establecidos en el matrimonio quedan anulados."
 cc_byz_latin.90.a: "Se queda, y mantiene a sus amigos."
 cc_byz_latin.90.b: "Que así sea."
 cc_byz_latin.90.c: "Enviar el séquito latino de vuelta a casa."
 cc_byz_latin.90.desc_bride_died: "La emperatriz [cc_lat_their_spouse.GetName] ha muerto. Su séquito regresa a casa de [cc_lat_partner.GetName], y los acuerdos establecidos en su matrimonio terminan con ella."
 cc_byz_latin.90.desc_bride_died_west: "[cc_lat_princess.GetName] ha muerto en la corte de [cc_lat_partner.GetName]. Su séquito regresa a casa, y los acuerdos establecidos en su matrimonio terminan con ella."
 cc_byz_latin.90.desc_widowed: "Con la muerte de [cc_lat_our_spouse.GetName], el matrimonio que unió nuestra casa a la de [cc_lat_partner.GetName] ha terminado. La emperatriz [cc_lat_their_spouse.GetName] es ahora una viuda en Constantinopla, y el nuevo reinado no le debe nada a su familia."
 cc_byz_latin.90.desc_widowed_west: "Con la muerte de [cc_lat_their_spouse.GetName], [cc_lat_princess.GetName] es una viuda en la corte de [cc_lat_partner.GetName]. El matrimonio que unió a las dos casas ha terminado, y los sucesores de su marido no nos deben nada."
 cc_byz_latin.90.desc_succession: "El matrimonio sigue en pie, pero [cc_lat_our_spouse.GetName] y [cc_lat_their_spouse.GetName] ya no están ambos en línea para sus respectivos tronos. Sus hijos no heredarán dos coronas, y los acuerdos basados en esa perspectiva quedan anulados."
