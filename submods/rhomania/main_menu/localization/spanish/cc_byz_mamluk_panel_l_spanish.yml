l_spanish:
 # The Levantine Confrontation: situation panel, map legend, actions and payload modifiers.
 #
 # A SEPARATE FILE FROM cc_byz_mamluk_l_english.yml, deliberately. That file is the event
 # thread's text and is stable; everything here arrived with the panel and the action set, which
 # are the parts most likely to be revised again after the next playtest.
 #
 #
 # VOICE. The card bodies are the court speaking, not the manual. Every number, threshold and
 # mechanical consequence lives in a _INFO key behind the card's info icon instead. The first
 # version of this file put the arithmetic in the body and read like a briefing paper, which is
 # the recurring failure the whole submod was audited for: describing the system to the player
 # rather than describing the world to the emperor.
 #
 # The _TT keys on individual bars and flags stay factual, because those ARE the tooltip layer.

 # ---- Panel header ----
 CC_BYZ_MAM_HDR_EMPIRE: "Imperio"
 CC_BYZ_MAM_HDR_CAIRO: "El Cairo"
 CC_BYZ_MAM_PHASE_COLD: "La frontera fría"
 CC_BYZ_MAM_PHASE_COLD_TT: "Nadie ha declarado nada. Los enviados van y vuelven, los peregrinos son contados e impuestos, los emires fronterizos aceptan dinero de ambos lados y no ven contradicción en ello, y los lugares santos se discuten en cartas que tardan una estación en llegar.\n\nSe han evitado guerras de esta manera durante cien años seguidos."
 CC_BYZ_MAM_PHASE_WAR: "La guerra de la pentarquía"
 CC_BYZ_MAM_PHASE_WAR_TT: "Las cartas han cesado. Lo que se decida ahora será decidido por quienquiera que esté en los lugares sagrados cuando todo termine."

 # ---- Card: the two positions ----
 CC_BYZ_MAM_CARD_STANDING: "Posición en el Levante"
 CC_BYZ_MAM_CARD_STANDING_DESC: "Dos cortes, una frontera y ningún acuerdo en ninguna parte de ella sobre quién es dueño de qué.\n\nNinguna de las partes pierde lo que la otra gana. La frontera tiene ochocientos millas de largo y lo que sucede en Alepo nunca le ha dicho a nadie nada sobre lo que sucede en Siwa."
 CC_BYZ_MAM_CARD_STANDING_INFO: "Dos contadores independientes, cada uno funcionando de 0 a 100.\n\n#T La Posición del Imperio#! aumenta con la custodia ganada, los emires fronterizos retenidos, los patriarcas orientales protegidos y los términos aceptados mientras El Cairo está distraído.\n\n#T La Posición de El Cairo#! aumenta cuando la frontera es abandonada, las jerarquías orientales se dejan hacer sus propios arreglos, o se le da tiempo al sultán para asentar a sus emires.\n\nEl que llegue a 100 termina la confrontación a favor de esa corte. También termina si cualquiera de los dos países deja de existir, o al llegar al año 1650."
 CC_BYZ_MAM_BAR_EMPIRE: "La posición del imperio"
 CC_BYZ_MAM_BAR_EMPIRE_TT: "Aumenta al ganar la custodia, retener a los emires, proteger a los patriarcas y aceptar términos mientras El Cairo está distraído. Al llegar a 100, la confrontación termina a favor del imperio."
 CC_BYZ_MAM_BAR_CAIRO: "La posición de El Cairo"
 CC_BYZ_MAM_BAR_CAIRO_TT: "Aumenta cuando se abandona la frontera, se dejan las jerarquías orientales a sus propios arreglos o se le da tiempo al sultán para asentar a sus emires. Al llegar a 100, la confrontación termina a favor de El Cairo."
 CC_BYZ_MAM_BAR_FOOTER: "Quien llegue a 100 pondrá fin a la confrontación. También terminará si alguna de las cortes deja de existir, o para el año 1650."

 # ---- Card: pressure and standing arrangements ----
 CC_BYZ_MAM_CARD_PRESSURE: "Presión levantina"
 CC_BYZ_MAM_CARD_PRESSURE_DESC: "Cuán fuerte está presionando el imperio; en El Cairo pueden sentirlo desde Damasco.\n\nUn emperador que ha pasado treinta años fortificando la frontera ha presentado un argumento, y descubrirá que el sultán ha dejado de responder a las cartas sobre la custodia. Hay una clase de paciencia que compra más que cualquier guarnición, y desde dentro parece exactamente debilidad."
 CC_BYZ_MAM_CARD_PRESSURE_INFO: "Oscila entre -5 y 5.\n\nUna presión alta abre las ramas militares del hilo y cierra las diplomáticas. #T Negociar la custodia de los lugares santos requiere una presión de 0 o inferior.#!\n\nSe incrementa fortificando la frontera, reclamando el derecho patriarcal y afirmando la custodia por derecho. Se reduce mediante embajadas, pagando las cuotas habituales y aceptando términos.\n\nLas banderas a continuación registran los acuerdos ya alcanzados. Son leídas por eventos posteriores en el hilo y por el árbol de misiones."
 CC_BYZ_MAM_FLAG_CONDOMINIUM: "La custodia es compartida mediante acuerdo escrito"
 CC_BYZ_MAM_FLAG_CONDOMINIUM_TT: "Ambas cortes han firmado. Los lugares sagrados se administran conjuntamente, los peregrinos viajan bajo una tarifa establecida y ninguna de las partes ha cedido la reclamación subyacente.\n\nVarios emperadores pensaron que este era el mejor resultado disponible. Es un final real y no un consuelo."
 CC_BYZ_MAM_FLAG_PATRIARCHS_BACKED: "Los jerarcas orientales están bajo protección imperial"
 CC_BYZ_MAM_FLAG_PATRIARCHS_BACKED_TT: "Responden a Constantinopla y en El Cairo se sabe que así es. Vale mucho en la disputa sobre la custodia, y hace que cualquier represalia contra ellos sea asunto del imperio."
 CC_BYZ_MAM_FLAG_PATRIARCHS_SOLD: "Los jerarcas orientales fueron dejados a su suerte"
 CC_BYZ_MAM_FLAG_PATRIARCHS_SOLD_TT: "Hicieron su propio acuerdo con el sultán, ya que tenían todos los motivos para ello. La pretensión del imperio de hablar en nombre del oriente es más difícil de sostener ahora que el oriente ha dejado de esperarlo."
 CC_BYZ_MAM_FLAG_WAR_DECLARED: "La guerra de la pentarquía ha comenzado"
 CC_BYZ_MAM_FLAG_WAR_DECLARED_TT: "La reclamación se está imponiendo por la fuerza. Las rutas diplomáticas permanecerán cerradas mientras esto dure."

 # ---- Card: the eastern seats ----
 # DUAL READING. These three cities carry the eastern patriarchates AND three of vanilla's
 # Hellenic holy sites, and at the same locations: the Serapeum is at Alexandria, the sanctuary
 # at Daphne is at Antioch. An emperor who has taken up the old rites wants the same three
 # cities for a different reason, so the copy names what is in them rather than naming a church.
 CC_BYZ_MAM_CARD_SEATS: "Los escaños orientales"
 CC_BYZ_MAM_CARD_SEATS_DESC: "Jerusalén, Antioquía, Alejandría.\n\nCualquiera que sea la creencia del imperio este siglo, estas son las tres ciudades que nunca ha dejado de creer que son suyas. Ha habido una disputa sobre ellas desde antes de que hubiera una disputa sobre cualquier otra cosa, y los hombres que las poseen ahora lo heredaron de hombres que lo heredaron."
 CC_BYZ_MAM_CARD_SEATS_INFO: "Junto con Constantinopla y Roma, estas cinco forman la pentarquía, y poseer las cinco es lo que requiere la reparación del cisma en el juego base. Roma se obtiene a través del exarcado; estas tres se obtienen mediante esta confrontación.\n\nEl estado de posesión se lee a partir de la propiedad, por lo que es válido independientemente de la religión del imperio. Bajo los antiguos ritos, las mismas tres ciudades albergan el Serapeo de Alejandría y el santuario de Daphne a las afueras de Antioquía."
 CC_BYZ_MAM_SEAT_JERUSALEM: "Jerusalén"
 CC_BYZ_MAM_SEAT_ANTIOCH: "Antioquía"
 CC_BYZ_MAM_SEAT_ALEXANDRIA: "Alejandría"
 CC_BYZ_MAM_SEAT_HELD: "Sostenido"
 CC_BYZ_MAM_SEAT_NOT_HELD: "Ninguno"

 # ---- Map colouring ----
 CC_BYZ_MAM_LEGEND_EMPIRE: "Imperial"
 CC_BYZ_MAM_LEGEND_CAIRO: "Mameluco"
 cc_byz_mam_map_tt_empire: "Suelo imperial, y la frontera está en algún lugar al sur de aquí."
 cc_byz_mam_map_tt_cairo: "La del sultán, y guarnecida como tal."
 cc_byz_mam_map_tt_other: "Ninguna de las dos cortes posee esto. Ninguna de las dos cortes ha dejado que eso les impida discutir al respecto."

 # ---- Actions ----
 cc_byz_mam_send_embassy: "Enviar una embajada a El Cairo"
 cc_byz_mam_send_embassy_desc: "Regalos, una carta sobre los peajes de los peregrinos y un mes en El Cairo aprendiendo qué es lo que preocupa al sultán en esta década. Rara vez es lo que informó la última embajada.\n\nNada se resuelve con esto. Las cosas se resuelven más tarde, por las personas que fueron."
 cc_byz_mam_subsidise_faction: "Subvencionar una facción en El Cairo"
 cc_byz_mam_subsidise_faction_desc: "Los emires se disputan la sucesión como cuestión de rutina, y el dinero que llega discretamente al bando perdedor evita que una disputa rutinaria se resuelva.\n\nUn sultán que gestiona a sus propios emires no está gestionando la frontera. Nadie sabrá jamás de dónde vino el dinero, que es precisamente el punto, y también la razón por la cual no compra al imperio nada que pueda verse."
 cc_byz_mam_negotiate_custody: "Negociar la custodia de los Lugares Santos"
 cc_byz_mam_negotiate_custody_desc: "Administración conjunta, un arancel establecido para los peregrinos y ambas cortes firmando un documento en el que ninguna cede nada.\n\nSe ha hecho antes y se mantuvo durante dos generaciones, lo cual en esta parte del mundo es una paz prolongada."
 cc_byz_mam_press_claim: "Reclamar el derecho patriarcal"
 cc_byz_mam_press_claim_desc: "El emperador dice, públicamente y extensamente, que las sedes orientales son suyas para protegerlas y que siempre lo fueron.\n\nCada palabra es cierta y cada palabra es escuchada en El Cairo como el comienzo de algo. Los emires del sultán le han estado preguntando por qué pagan un ejército; el emperador ahora ha respondido por él."

 # ---- Payload modifiers ----
 STATIC_MODIFIER_NAME_cc_byz_emirs_retained: "Los Emires Fronterizos Retenidos"
 STATIC_MODIFIER_DESC_cc_byz_emirs_retained: "Mantienen la línea exactamente mientras dure el dinero. Eso es lo que se obtiene al comprar una frontera, y por qué se vuelve a comprar."
 STATIC_MODIFIER_NAME_cc_byz_syrian_garrisons: "Las ciudades fronterizas guarnecidas"
 STATIC_MODIFIER_DESC_cc_byz_syrian_garrisons: "Pagado, amurallado y abastecido. Nadie tendrá que ser sobornado el año que viene, que es el argumento principal para el gasto."
 STATIC_MODIFIER_NAME_cc_byz_frontier_left_alone: "La frontera abandonada a su suerte"
 STATIC_MODIFIER_DESC_cc_byz_frontier_left_alone: "Los hombres que viven en él lo defienden mejor de lo que el imperio jamás lo hizo. También responden a su propia gente mientras lo hacen, y el fisco ha dejado de tener noticias de ellos por completo."
 STATIC_MODIFIER_NAME_cc_byz_cairo_pressed: "La Ventaja Aprovechada"
 STATIC_MODIFIER_DESC_cc_byz_cairo_pressed: "El imperio se movió mientras El Cairo discutía consigo mismo, y se vio que se movió primero. Ser visto fue la mitad del asunto."
 STATIC_MODIFIER_NAME_cc_byz_cairo_divided: "El Cairo dividido"
 STATIC_MODIFIER_DESC_cc_byz_cairo_divided: "La disputa continúa, financiada. Nadie en El Cairo sabe quién la financia, que es precisamente el punto, y también la razón por la cual no compra ninguna gloria."
 STATIC_MODIFIER_NAME_cc_byz_levantine_terms: "Términos con El Cairo"
 STATIC_MODIFIER_DESC_cc_byz_levantine_terms: "Un arreglo que benefició a ambas cortes en un año particular. Las caravanas circulan. Ambos bandos saben exactamente cuánto vale y ninguno lo dice."

 # ---- Action cooldowns ----
 STATIC_MODIFIER_NAME_cc_byz_mam_embassy_sent: "Embajada en El Cairo"
 STATIC_MODIFIER_DESC_cc_byz_mam_embassy_sent: "Una embajada está en El Cairo, o lo estuvo hace poco. Una segunda ahora sería interpretada como ansiedad."
 STATIC_MODIFIER_NAME_cc_byz_mam_faction_bought: "Una facción comprada"
 STATIC_MODIFIER_DESC_cc_byz_mam_faction_bought: "El dinero ya se está moviendo. Un segundo pago a través de los mismos canales sería rastreado, y el rastreo es el desastre, no el pago."
 STATIC_MODIFIER_NAME_cc_byz_mam_claim_pressed: "La reclamación ejercida"
 STATIC_MODIFIER_DESC_cc_byz_mam_claim_pressed: "Se ha dicho recientemente y extensamente. Decirlo de nuevo pronto solo demostraría que decirlo no cambia nada."

 # ---- Opinion ----
 cc_byz_opinion_levantine_terms: "Términos sobre los Lugares Santos"
 CC_BYZ_MAM_SEAT_CAIRO: "Del sultán"
