l_spanish:
 # Mission pack
 cc_byz_renovatio_campaign: "Renovatio Imperii"
 cc_byz_renovatio_campaign_DESCRIPTION: "Justiniano recuperó África, Italia y una franja de España, y la recuperación costó más de lo que el territorio valió jamás. La peste llegó con la flota, el tesoro nunca se recuperó e Italia quedó arruinada por la guerra librada para salvarla.\n\nEsta es esa campaña, repetida por un imperio que parte de mucho menos. Cada teatro es ganable. Ninguno de ellos es gratuito."
 cc_byz_renovatio_campaign_BUTTON_TOOLTIP: "Recuperar las provincias occidentales"
 cc_byz_renovatio_campaign_BUTTON_DETAILS: "Ilírico, Italia, África y Hispania, en ese orden, terminando con el mar mismo."
 cc_byz_renovatio_campaign_CRITERIA_DESCRIPTION: "Las provincias occidentales han sido recuperadas y el Mediterráneo es nuevamente un mar romano."
 cc_byz_task_illyricum: "Ilírico y Dalmacia"
 cc_byz_task_illyricum_desc: "La costa dálmata era romana antes de que Roma fuera cristiana y ha sido gobernada desde Constantinopla, Venecia, Hungría y por ella misma desde entonces. Las ciudades desean protección imperial. Son menos entusiastas con los impuestos imperiales."
 cc_byz_task_italy: "Italia y el Exarcado"
 cc_byz_task_italy_desc: "\"Tanto por los godos.\"\n\nProcopio registra el sentimiento y luego, detalladamente, lo que la guerra costó en realidad: veinte años, los acueductos cortados, Roma sitiada tres veces y tomada dos, y un país recuperado en un estado que hacía cuestionable dicha recuperación."
 cc_byz_task_africa: "África"
 cc_byz_task_africa_desc: "La provincia que se pagaba a sí misma, hasta que la frontera no pudo mantenerse sin pagar la frontera, y la frontera no pudo pagarse.\n\nCartago cayó ante los árabes sesenta años después de que Constantinopla dejara de ser capaz de reforzarla."
 cc_byz_task_spania: "Spania"
 cc_byz_task_spania_desc: "Una franja de costa con montañas a sus espaldas y sin interior, mantenida durante setenta años contra los visigodos y perdida en una guerra que nadie en Constantinopla notó en su momento.\n\nJustiniano la quería porque había sido romana. Ese fue todo el argumento."
 cc_byz_task_mare_nostrum: "Mare Nostrum"
 cc_byz_task_mare_nostrum_desc: "\"Nuestro mar\", lo llamaban los romanos, cuando poseían cada una de sus costas y podían decirlo sin que nadie se riera.\n\nNo ha sido cierto durante ochocientos años."

 # Theatre triggers
 cc_byz_theatre_illyricum_tt: "Nosotros o un súbdito poseemos Salona, Split y Durrës"
 cc_byz_theatre_italy_tt: "Nosotros o un súbdito poseemos Roma, Rávena y Nápoles, y un exarcado las gobierna"
 cc_byz_theatre_africa_tt: "Nosotros o un súbdito poseemos Palermo, Siracusa, Túnez y Trípoli"
 cc_byz_theatre_spania_tt: "Nosotros o un súbdito poseemos Cartagena y Málaga"
 cc_byz_theatre_mare_nostrum_tt: "Hemos completado los cuatro teatros occidentales"

 # Theatre actions
 cc_byz_claim_theatre_illyricum: "Proclamar la recuperación de Iliria"
 cc_byz_claim_theatre_illyricum_desc: "Declarar la costa dálmata restaurada al imperio y decidir qué hacer con la gente que vive en ella."
 cc_byz_claim_theatre_italy: "Proclamar la recuperación de Italia"
 cc_byz_claim_theatre_italy_desc: "Declarar Italia restaurada y gobernada. Requiere un exarca en el puesto: las ciudades tomadas por un ejército se mantienen, no se recuperan."
 cc_byz_claim_theatre_africa: "Proclamar la recuperación de África"
 cc_byz_claim_theatre_africa_desc: "Declarar las provincias africanas restauradas, y descubrir cuánto cuesta guarnecerlas cada año durante el resto de la existencia del imperio."
 cc_byz_claim_theatre_spania: "Proclamar la recuperación de Hispania"
 cc_byz_claim_theatre_spania_desc: "Declarar la costa española restaurada. Es una posesión estrecha en el extremo lejano del mar sin nada detrás, y todos en el palacio lo saben."
 cc_byz_claim_mare_nostrum: "Proclamar Mare Nostrum"
 cc_byz_claim_mare_nostrum_desc: "Declarar el Mediterráneo un mar romano una vez más, por primera vez en novecientos años."

 # Country modifiers
 STATIC_MODIFIER_NAME_cc_byz_theatre_illyricum_held: "Iliria Recuperada"
 STATIC_MODIFIER_DESC_cc_byz_theatre_illyricum_held: "La costa dálmata y sus puertos son imperiales de nuevo, y los hombres del interior están disponibles para ser reclutados."
 STATIC_MODIFIER_NAME_cc_byz_theatre_italy_held: "Italia Recuperada"
 STATIC_MODIFIER_DESC_cc_byz_theatre_italy_held: "Roma se gobierna desde Constantinopla a través de un exarca. Cada cancillería en Europa ha tenido que decidir cómo referirse a este arreglo."
 STATIC_MODIFIER_NAME_cc_byz_theatre_africa_held: "África Recuperada"
 STATIC_MODIFIER_DESC_cc_byz_theatre_africa_held: "El grano y las aduanas de África llegan de nuevo a la capital. También los informes de los fuertes fronterizos."
 STATIC_MODIFIER_NAME_cc_byz_theatre_spania_held: "Spania Recuperada"
 STATIC_MODIFIER_DESC_cc_byz_theatre_spania_held: "Una franja de la costa española, sus puertos y una discusión permanente sobre si algo de ello merece la pena la guarnición."
 STATIC_MODIFIER_NAME_cc_byz_mare_nostrum: "Mare Nostrum"
 STATIC_MODIFIER_DESC_cc_byz_mare_nostrum: "El Mediterráneo es un mar romano. No es una reclamación, ni un título: los puertos de cada costa responden a Constantinopla, y un barco puede cruzarlo sin salir del imperio."
 STATIC_MODIFIER_NAME_cc_byz_federate_settlement: "Asentamiento Federado"
 STATIC_MODIFIER_DESC_cc_byz_federate_settlement: "Las poblaciones eslavas y valacas del interior poseen sus tierras bajo términos imperiales a cambio de servicio. Ahora son la guarnición de la frontera, y sus nietos se describirán a sí mismos como romanos."
 STATIC_MODIFIER_NAME_cc_byz_italy_restored: "Italia Restaurada"
 STATIC_MODIFIER_DESC_cc_byz_italy_restored: "Los acueductos funcionan, las carreteras están reparadas y las ciudades se están repoblando, todo a expensas de un tesoro que tenía otros compromisos."
 STATIC_MODIFIER_NAME_cc_byz_african_limes: "El Limes Africano"
 STATIC_MODIFIER_DESC_cc_byz_african_limes: "Los fuertes fronterizos están tripulados y las guarniciones cobran a tiempo, lo cual es la diferencia total entre una frontera y un terreno de incursiones."
 STATIC_MODIFIER_NAME_cc_byz_spania_reinforced: "Spania Reforzada"
 STATIC_MODIFIER_DESC_cc_byz_spania_reinforced: "Las posesiones españolas son abastecidas y defendidas desde el mar, lo cual funciona exactamente mientras la flota no tenga nada más urgente que hacer."
 STATIC_MODIFIER_NAME_cc_byz_army_of_the_west: "El Ejército del Oeste"
 STATIC_MODIFIER_DESC_cc_byz_army_of_the_west: "Un ejército de campaña veterano, estacionado permanentemente a mil millas de la capital, leal a los oficiales que lo alimentan y cada vez más un grupo de interés por derecho propio."

 # cc_byz_reconquest.1 - Illyricum
 cc_byz_reconquest.1.title: "La gente del interior"
 cc_byz_reconquest.1.desc: "La costa fue la parte fácil. Las ciudades son romanas, siempre han sido romanas y estaban esperando ser liberadas por alguien.\n\nEl interior es una cuestión diferente. Eslavos y valacos han cultivado y pastoreado allí durante setecientos años, no fueron consultados sobre la reconquista y seguirán allí cuando el acuerdo actual haya sido reemplazado por lo que venga después. No pagan ningún impuesto que llegue a la capital y no tienen ninguna objeción particular a pagar uno, siempre que alguien explique a quién y por qué.\n\nCada respuesta imperial previa a esta pregunta consta en los registros. Ninguna de ellas funcionó por más de un siglo."
 cc_byz_reconquest.1.a: "Tierra por servicio. Establecerlos como federados."
 cc_byz_reconquest.1.b: "Muévelos. Ya se ha hecho antes."
 cc_byz_reconquest.1.c: "Las ciudades costeras mantienen sus libertades. Deja el interior en paz."

 # cc_byz_reconquest.10 - Italy
 cc_byz_reconquest.10.title: "La condición de Italia"
 cc_byz_reconquest.10.desc: "Italia ha sido recuperada y los informes que llegan son peores que los informes de la campaña.\n\nLos acueductos que abastecían a tres ciudades fueron cortados durante los combates y no han sido reparados. El campo al norte de Roma fue disputado dos veces en seis años y no se está cultivando. La población de la ciudad misma es una fracción de lo que esperaba la evaluación, y la evaluación ya era pesimista.\n\nEl imperio ha recuperado Italia. Lo que no ha recuperado es nada en Italia que merezca ser recuperado, y solucionar eso es un proyecto que se mide en reinados."
 cc_byz_reconquest.10.desc_strained: "Italia ha sido recuperada y no fue mediante términos negociados.\n\nEl imperio ya estaba luchando en dos frentes y pagando ambos, y no había ni dinero ni tiempo para una campaña de asedios y rendiciones negociadas. Así que las ciudades fueron asaltadas allí donde resistieron, el campo fue saqueado por un ejército que tenía que comer, y los informes que llegan ahora describen una provincia que ha sido exhaustivamente destrozada por el proceso de ser liberada.\n\nEsto es precisamente lo que ocurrió la primera vez. La diferencia es que Justiniano podía permitirse sorprenderse por ello."
 cc_byz_reconquest.10.a: "Reconstruyámoslo a nuestra costa."
 cc_byz_reconquest.10.b: "Impón un impuesto. Pagará el próximo teatro."
 cc_byz_reconquest.10.c: "Eximir sus impuestos durante una generación."

 # cc_byz_reconquest.20 - Africa
 cc_byz_reconquest.20.title: "La frontera africana"
 cc_byz_reconquest.20.desc: "África es rica, por eso valió la pena tomarla, y no se asienta, por eso se perdió.\n\nLas ciudades costeras y la zona cerealista son seguras y producen un excedente real. Todo lo que hay tierra adentro es una frontera, y la frontera no se queda quieta: los jefes moros atacan cuando las guarniciones son débiles, aceptan la paga imperial cuando son fuertes, y cambian su evaluación de cuál es el caso aproximadamente dos veces al año.\n\nLos fuertes funcionan. Los fuertes requieren guarniciones, las guarniciones requieren paga, y la paga tiene que cruzar el mar. Los despachos de los comandantes de la frontera son unánimes en los tres puntos y cada vez más directos sobre el tercero."
 cc_byz_reconquest.20.a: "Pagar a las guarniciones. Dotar los fuertes."
 cc_byz_reconquest.20.b: "Que vivan del país."
 cc_byz_reconquest.20.c: "Compra a los jefes. Es más barato que los fuertes."

 # cc_byz_reconquest.30 - Spania
 cc_byz_reconquest.30.title: "La Costa Española"
 cc_byz_reconquest.30.desc: "Spania está en nuestro poder: una franja de costa, dos buenos puertos y un hinterland perteneciente a alguien más que comienza inmediatamente detrás de las murallas.\n\nSe tomó a bajo precio porque nadie la defendió seriamente, y es defendible solo desde el mar, mediante una flota que no tenga nada mejor que hacer, frente a oponentes que pueden concentrarse contra ella con una semana de aviso mientras que los refuerzos tardan tres meses. El comandante de la guarnición ha presentado una evaluación. Está redactada profesionalmente y su conclusión es que la posición es insostenible en cualquier circunstancia relevante.\n\nEs también el punto más occidental del imperio y una flota romana está anclada allí por primera vez en nueve siglos."
 cc_byz_reconquest.30.a: "Refuércenlo. Se puede mantener."
 cc_byz_reconquest.30.b: "Intercambialo por algo al otro lado del mar."
 cc_byz_reconquest.30.c: "Mantenla con la flota, no con una guarnición."

 # cc_byz_reconquest.40 - the capstone
 cc_byz_reconquest.40.title: "Mare Nostrum"
 cc_byz_reconquest.40.desc: "Un barco que sale de Constantinopla puede atracar en Tesalónica, Durrës, Siracusa, Cartago, Cartagena y regresar vía Nápoles y Rávena, y en ningún momento de ese viaje entrará en un puerto extranjero.\n\nEsto era cierto hace novecientos años y no lo ha sido desde entonces. Los escribas que prepararon el anuncio tuvieron que consultar los registros más antiguos para encontrar la fórmula correcta, y la fórmula que encontraron fue escrita para un emperador que gobernaba desde Rávena y no habría reconocido el imperio que ahora ha repetido su logro.\n\nEstá hecho. El mar es romano."
 cc_byz_reconquest.40.desc_traded: "Un barco que sale de Constantinopla puede cruzar todo el mar y atracar solo en puertos imperiales, con una sola brecha que no se menciona en ninguna de las proclamaciones.\n\nSpania fue cedida, por buenas razones y a un buen precio, a una potencia que ha cumplido su parte del trato. La fórmula que se lee en la Gran Iglesia describe la recuperación de las provincias occidentales y no las enumera, y el escriba que la redactó de esa manera fue agradecido en privado por su tacto.\n\nEl mar es romano. Es romano por un margen que no sobreviviría a un examen riguroso, y el examen no se va a llevar a cabo."
 cc_byz_reconquest.40.desc_exhausted: "El mar es romano, y el imperio que lo hizo así no está en condiciones de disfrutar del hecho.\n\nEl tesoro está comprometido por una generación. Los ejércitos de campaña son veteranos, están distantes y se les deben atrasos que nadie puede pagar actualmente. Provincias enteras recuperadas a un costo enorme son administradas por hombres que la capital nunca ha conocido, porque la capital no tiene a nadie para enviar. El anuncio fue leído en la Gran Iglesia ante una congregación que ha sido tasada para esto durante cuarenta años.\n\nLa reconquista de Justiniano terminó exactamente aquí, en el momento del éxito completo, con el estado que lo logró vaciado por el logro mismo. Eso no es una coincidencia y no era imprevisible."
 cc_byz_reconquest.40.a: "Haz que se lea en la Gran Iglesia."

 # cc_byz_reconquest.50 - strain: the provinces stop paying
 cc_byz_reconquest.50.title: "Las Provincias Dejan de Pagar"
 cc_byz_reconquest.50.desc: "Las remesas de las provincias occidentales se han detenido, y las explicaciones son todas individualmente razonables.\n\nÁfrica ha gastado sus ingresos en sus guarniciones. Italia ha gastado sus ingresos en las reparaciones que ordenó la capital. Las ciudades dálmatas han gastado los suyas en murallas, y han producido la correspondencia en la que la capital se lo indicó. En cada caso el dinero se gastó en algo que el imperio necesitaba y en cada caso el imperio no va a verlo.\n\nLa dificultad es que la capital presupuestó todo ello, y los ejércitos que tomaron estas provincias siguen en ellas, y se siguen pagando desde un tesoro que asumió que las provincias ya se habrían pagado a sí mismas."
 cc_byz_reconquest.50.desc_ruined: "Las remesas del oeste se han detenido, y la cuenta occidental puede resumirse en una línea: Italia.\n\nÁfrica paga. Dalmacia paga un poco. Italia, que era la partida individual más grande en cada proyección que hizo el tesoro cuando esto empezó, no produce casi nada, porque la provincia que debía financiar el resto de la campaña quedó destrozada en el proceso de ser conquistada.\n\nLos escribas han preparado una comparación con la tasación anterior a la guerra. No fue solicitada y se está distribuyendo de todos modos, lo que dice al palacio algo sobre el estado de ánimo en el tesoro. Italia actualmente cuesta más en guarniciones y reparaciones de lo que devuelve en impuestos y, según las tendencias actuales, seguirá siendo así durante más tiempo del que cualquier persona que sirva ahora vivirá."
 cc_byz_reconquest.50.a: "Pedir prestado a cuenta del próximo año. Manténlo todo."
 cc_byz_reconquest.50.b: "Entrega las provincias lejanas a quien pueda mantenerlas."
 cc_byz_reconquest.50.c: "Abandonar lo menos defendible, antes de que lo perdamos por nosotros."

 # cc_byz_reconquest.51 - strain: the army of the west
 cc_byz_reconquest.51.title: "El ejército del Oeste"
 cc_byz_reconquest.51.desc: "Ahora hay un ejército occidental, y nadie decidió crearlo.\n\nSe ensambló pieza a pieza durante treinta años a partir de fuerzas expedicionarias que nunca fueron retiradas, y se ha convertido en una institución permanente con sus propios arreglos de suministro, su propio reclutamiento en las provincias donde tiene guarniciones y sus propios oficiales que no han servido en ningún otro lugar. Un soldado en él puede ser el hijo de un soldado en él. Sus comandantes superiores se escriben entre sí más de lo que cualquiera de ellos se escribe con la capital.\n\nEs el ejército más efectivo que tiene el imperio. Está estacionado a mil millas del palacio, se le debe dinero y los hombres que lo integran se consideran el ejército de occidente más que el ejército del emperador. Estos tres hechos ya han sido ciertos anteriormente."
 cc_byz_reconquest.51.a: "Anótalo, y págales lo que podamos."

 # cc_byz_reconquest.52 - the general
 cc_byz_reconquest.52.title: "El General Victorioso"
 cc_byz_reconquest.52.desc: "El comandante en occidente ha hecho todo lo que se le pidió y algo más, y ese es el problema.\n\nTomó la provincia, la mantiene, sus hombres le son devotos y sus despachos son modelos de forma correcta. No ha dado al palacio motivo de preocupación de ningún tipo, lo cual es en sí mismo un motivo: un hombre tan competente, tan lejos, al mando de ese ejército, es un conjunto de circunstancias más que una acusación.\n\nEl imperio ha estado en esta situación muchas veces. En la mayoría de esas ocasiones, el general en cuestión no tenía intención alguna de convertirse en emperador, hasta el momento en que sus tropas tomaron la decisión por él."
 cc_byz_reconquest.52.desc_unpaid: "El comandante en occidente no ha cobrado, sus hombres no han cobrado y él mismo ha resuelto el problema.\n\nEstá abasteciendo a su ejército directamente desde la provincia, bajo su propia autoridad, mediante acuerdos con terratenientes locales de los que la capital fue informada posteriormente. Funciona. La provincia está tranquila, las tropas están alimentadas y la frontera se mantiene, y nada de esto depende ahora de que llegue algo de Constantinopla.\n\nEsa última cláusula es la que se lee con atención en el palacio. Un ejército que no necesita el dinero de la capital es un ejército que ha dejado de necesitar a la capital."
 cc_byz_reconquest.52.a: "Retiradlo. Honradlo públicamente."
 cc_byz_reconquest.52.b: "Dejarlo allí. Pagar a sus hombres desde aquí, directamente."
 cc_byz_reconquest.52.c: "Dividir el mando entre tres oficiales."
