l_spanish:
 # Auto-modifier labels.
 #
 # EVERY auto_modifier needs an AUTO_MODIFIER_NAME_<key> or it shows as a missing key in the
 # societal values breakdown. AUTO_MODIFIER_DESC_<key> is optional: vanilla ships 165 NAME
 # keys and only 16 DESC, so a name alone is the normal case and is what these use.
 #
 # CONVENTION. The name reads as the CONDITION, not as a title, because these appear in a list
 # explaining why a value is drifting. Compare vanilla's byz entries, e.g.
 # AUTO_MODIFIER_NAME_byz_capital_constantinople: "[capital|e] is [ShowLocationName('constantinople')]".
 # Each line below states the trigger it is attached to, so the player can read the list and
 # know what to change.
 #
 # Deliberately plain text rather than concept markup. These strings get machine-translated,
 # and an invented [scope.Function] token is the failure mode that errors in game, so the
 # tokens are omitted rather than guessed at.

 # Toward Dynatoi: the provincial powerful
 AUTO_MODIFIER_NAME_cc_byz_pronoia_grants: "Concesiones de Pronoia pendientes"
 AUTO_MODIFIER_NAME_cc_byz_weak_crown: "Poder del patrimonio real inferior al 35%"
 AUTO_MODIFIER_NAME_cc_byz_ascendant_nobles: "Nobles poderosos y satisfechos"

 # Toward Taxis: the imperial bureaus
 AUTO_MODIFIER_NAME_cc_byz_staffed_bureaus: "Oficinas dotadas de personal y fondos"
 AUTO_MODIFIER_NAME_cc_byz_strong_crown: "Poder del patrimonio real al 50% o superior"
 AUTO_MODIFIER_NAME_cc_byz_literate_administration: "Alfabetización promedio superior al 20%"

 # The Rhomanismos advance line. Each of these carries the conditional bulk of an advance
 # whose permanent core sits on the advance itself, so the label names the advance and the
 # requirement that keeps it live.
 AUTO_MODIFIER_NAME_cc_byz_taxis_of_offices_active: "Taxis de Oficinas, del lado de los Rhomaios"
 AUTO_MODIFIER_NAME_cc_byz_oikonomia_active: "Oikonomia Imperial, del lado de los Rhomaios"
 AUTO_MODIFIER_NAME_cc_byz_tagmata_restored_active: "Los Tagmata Restaurados, del lado de los Rhomaios"
 AUTO_MODIFIER_NAME_cc_byz_palaiologan_revival_active: "El Renacimiento Paleólogo, del lado de los Rhomaios"
 AUTO_MODIFIER_NAME_cc_byz_basilika_active: "Los Basilika, del lado de los Rhomaios"
 AUTO_MODIFIER_NAME_cc_byz_annona_active: "La Annona, del lado de los Rhomaios"
 AUTO_MODIFIER_NAME_cc_byz_ecumenical_office_active: "La Oficina Ecuménica, del lado de los Rhomaios"
 AUTO_MODIFIER_NAME_cc_byz_dromos_active: "El Dromos, del lado de los Rhomaios"
 AUTO_MODIFIER_NAME_cc_byz_thematic_administration_active: "Administración Temática, del lado de los Rhomaios"
 AUTO_MODIFIER_NAME_cc_byz_autokrator_active: "Autócrata, del lado de los Rhomaios"
 AUTO_MODIFIER_NAME_cc_byz_great_church_active: "La Gran Iglesia, del lado de los Rhomaios"

 # These two additionally require the capital to still be Constantinople, which is the whole
 # trade the Renovatio track asks the player to make, so the label says so.
 AUTO_MODIFIER_NAME_cc_byz_renovatio_imperii_active: "Renovatio Imperii, del lado de los Rhomaios, con capital en Constantinopla"
 AUTO_MODIFIER_NAME_cc_byz_exarchal_chancery_active: "La Cancillería Exarcal, del lado de los Rhomaios, con capital en Constantinopla"
 AUTO_MODIFIER_NAME_cc_byz_taxis_offices: "Oficinas del fisco dotadas de personal y fondos"
 AUTO_MODIFIER_NAME_cc_byz_dynatoi_offices: "Oficinas de los magnates dotadas de personal y fondos"
 AUTO_MODIFIER_NAME_cc_byz_starved_offices: "Oficinas financiadas a menos de la mitad"
 AUTO_MODIFIER_NAME_cc_byz_west_autonomous: "Autonomía occidental en 50 o más"
 AUTO_MODIFIER_NAME_cc_byz_west_latin_drift: "Autonomía occidental en 50 o más"
 AUTO_MODIFIER_NAME_cc_byz_west_gripped: "Control imperial sobre el oeste en 60 o más"
 AUTO_MODIFIER_NAME_cc_byz_west_greek_hold: "Control imperial sobre el oeste en 60 o más"
 AUTO_MODIFIER_NAME_cc_byz_west_law_rite_local: "Las prefecturas mantienen el rito local"
 AUTO_MODIFIER_NAME_cc_byz_west_law_rite_latin: "Las prefecturas celebran el rito latino"
 AUTO_MODIFIER_NAME_cc_byz_west_law_command_exarchal: "El mando del oeste dejado en manos de los exarcas"
 AUTO_MODIFIER_NAME_cc_byz_west_law_hereditary: "Las prefecturas se transmiten por herencia"
 AUTO_MODIFIER_NAME_cc_byz_west_law_fisc_remitted: "Los ingresos occidentales remitidos a la capital en su totalidad"
