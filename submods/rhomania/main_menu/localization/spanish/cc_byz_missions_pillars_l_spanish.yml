l_spanish:
 # Tasks added by the forking rework: the three pillars, the reconvergences, the five
 # exclusive forks and the optional spurs.
 #
 # FORK DESCRIPTIONS END WITH WHAT THEY CLOSE. Taking one side of an exclusive fork hides the
 # other (visible = NOT completed), so the player would otherwise never learn there was a
 # choice. Naming the road not taken in the description of the road taken is the only place
 # that information can live.

 # ---- Reconvergence tooltips ----
 # Each wraps an OR of AND pairs so the player reads one line instead of nine.
 cc_byz_two_of_three_pillars_tt: "Completar dos de los tres pilares: el Fisco, la Fe, la Espada"
 cc_byz_two_of_three_seats_tt: "Asegurar dos de las tres sedes orientales: Antioquía, Jerusalén, Alejandría"
 cc_byz_two_of_three_theatres_tt: "Recuperar dos de los tres teatros occidentales: Italia, África, Spania"
 cc_byz_turkish_question_settled_tt: "La cuestión turca está resuelta, ya sea por conquista o por tributo"

 # ---- The Fisc ----
 cc_byz_task_nomisma: "El nomisma restaurado"
 cc_byz_task_nomisma_desc: "Elevar la base impositiva a sesenta. La moneda que fue el estándar del Mediterráneo durante setecientos años ha sido devaluada cuatro veces en el último siglo, y todos los que comercian con ella lo han notado."
 cc_byz_task_silk_looms: "Los telares de seda"
 cc_byz_task_silk_looms_desc: "Alcanzar diez ducados de ingresos comerciales mensuales. Dos monjes sacaron los gusanos de China en un bastón, y el imperio mantuvo el monopolio occidental durante seis siglos gracias a ello."
 cc_byz_task_literate_admin: "Una administración alfabetizada"
 cc_byz_task_literate_admin_desc: "Elevar la alfabetización media por encima del veinticinco por ciento. El imperio funcionó con papeles mucho antes que cualquier otro en Europa, y solo podrá seguir haciéndolo mientras haya hombres que puedan leerlos."
 cc_byz_task_logothete: "Logoteta del Curso"
 cc_byz_task_logothete_desc: "Cien en la base imponible y cinco oficinas financiadas. La oficina que gestionaba el correo, las carreteras, la inteligencia fronteriza y, eventualmente, la política exterior, porque era la única que sabía lo que estaba pasando."

 # ---- The Faith ----
 cc_byz_task_athonite: "Los monasterios atonitas"
 cc_byz_task_athonite_desc: "Alcanzar cuarenta de influencia religiosa. La Montaña Sagrada responde al patriarca en teoría y a sí misma en la práctica, y su opinión llega más lejos que la de cualquier obispo."
 cc_byz_task_icons: "Los iconos restaurados"
 cc_byz_task_icons_desc: "Poseer tres obras de arte. El siglo iconoclasta le costó al imperio más imágenes que cualquier conquista, y reemplazarlas es la lenta tarea de demostrar que la disputa ha quedado resuelta."
 cc_byz_task_autocephalous: "Las hijas autocéfalas"
 cc_byz_task_autocephalous_desc: "Liderar un patriarcado autocéfalo. Serbia, Bulgaria y Rus tienen ahora sus propias iglesias. Liderar el cuerpo al que pertenecen es la diferencia entre una iglesia madre y una antigua."
 cc_byz_task_ecumenical_throne: "El trono ecuménico"
 cc_byz_task_ecumenical_throne_desc: "Setenta y cinco de influencia religiosa y un clero satisfecho. El patriarca de Constantinopla es el primero entre los ortodoxos por costumbre más que por ley, y la costumbre necesita mantenimiento."

 # ---- The Sword ----
 cc_byz_task_veterans: "Ejércitos veteranos"
 cc_byz_task_veterans_desc: "Alcanzar cuarenta de tradición militar. El imperio no ha desplegado un ejército debidamente entrenado en tres generaciones, y los hombres que recuerdan cómo hacerlo están muriendo."
 cc_byz_task_dromon: "La flota de dromones"
 cc_byz_task_dromon_desc: "Lanzar veinte barcos al mar. Los estrechos son la única razón por la que esta ciudad ha sobrevivido, y no valen nada sin cascos que los cierren."
 cc_byz_task_varangians: "La guardia varangia"
 cc_byz_task_varangians_desc: "Reclutar una compañía de varangos. Extranjeros sin intereses en ninguna facción bizantina, que es precisamente por lo que los emperadores han confiado el palacio a ellos durante cuatrocientos años."
 cc_byz_task_field_army: "El ejército de campaña restaurado"
 cc_byz_task_field_army_desc: "Cuarenta regimientos con sesenta de tradición militar. Ni una fuerza de guarnición ni mercenarios: un ejército que pueda ser enviado a algún lugar con la expectativa de que regrese."

 # ---- Reconvergence ----
 cc_byz_task_state_restored: "El estado restaurado"
 cc_byz_task_state_restored_desc: "Completar dos de los tres pilares. El imperio no necesita ser fuerte en todos los aspectos a la vez, y ningún emperador lo ha logrado jamás. Necesita ser lo suficientemente fuerte en dos para que el tercero pueda descuidarse sin que haya un colapso."

 # ---- The Greek World ----
 cc_byz_task_serbian_question: "La cuestión serbia"
 cc_byz_task_serbian_question_desc: "Acabar con Serbia o convertirla en vasallo. Dusan se coronó a sí mismo Emperador de los serbios y griegos y estuvo a punto de consolidarlo. La reclamación no caduca porque él haya muerto."
 cc_byz_task_latin_bride: "Una novia latina"
 cc_byz_task_latin_bride_desc: "Contraer un matrimonio real con una potencia católica. Cada emperador de los últimos dos siglos se ha casado con alguien del oeste al menos una vez, y cada uno de ellos fue criticado por ello en su patria."
 cc_byz_task_embassies: "Embajadas en Occidente"
 cc_byz_task_embassies_desc: "Mantener cuatro diplomáticos. El imperio sobrevivió a su peor siglo sabiendo más sobre sus enemigos de lo que ellos sabían entre sí, y eso debe pagarse continuamente."
 cc_byz_task_venetian_alliance: "La alianza veneciana"
 cc_byz_task_venetian_alliance_desc: "Lograr que Venecia tenga una consideración cálida hacia el imperio. Controlan las rutas marítimas y el crédito, saquearon esta ciudad una vez y siguen siendo la mejor de las dos opciones disponibles.\n\nTomar esto cierra el camino genovés."
 cc_byz_task_genoese_compact: "El pacto genovés"
 cc_byz_task_genoese_compact_desc: "Lograr que Génova tenga una consideración cálida hacia el imperio. Ya poseen Galata al otro lado del agua y la mitad del comercio del Mar Negro, y un acuerdo con ellos es un acuerdo con las personas que ya están allí.\n\nTomar esto cierra el camino veneciano."

 # ---- Anatolia ----
 cc_byz_task_sultan_tributary: "El tributario del sultán"
 cc_byz_task_sultan_tributary_desc: "Convertir a los otomanos en un vasallo en lugar de en un cadáver. El imperio les pagó tributo durante décadas y envió tropas a sus campañas; revertir el acuerdo cuesta mucho menos que destruirlos, y es mucho más satisfactorio.\n\nTomar esto cierra el camino para eliminarlos por completo."
 cc_byz_task_anatolia_secured: "Anatolia asegurada"
 cc_byz_task_anatolia_secured_desc: "Poseer los temas anatolios con la cuestión turca resuelta, ya sea por conquista o por tributo. Asia Menor es de donde provienen los soldados y el grano del imperio. Todo lo demás es una cuestión de cuánto tiempo."
 cc_byz_task_convert_anatolia: "La fe recuperada"
 cc_byz_task_convert_anatolia_desc: "Lograr que el imperio sea un setenta por ciento ortodoxo. Dos siglos de dominio turco convirtieron más de Anatolia que cualquier ejército conquistó, y revertirlo es más lento que lo que fue la conquista."
 cc_byz_task_tagmata: "Los tagmata restaurados"
 cc_byz_task_tagmata_desc: "Cincuenta regimientos y ninguna concesión de pronoia pendiente. Un ejército profesional asalariado que responda al palacio, pagado con moneda en lugar de tierras.\n\nTomar esto cierra el camino de la hueste feudal."

 # ---- The Levant ----
 cc_byz_task_eastern_sees: "Las sedes orientales"
 cc_byz_task_eastern_sees_desc: "Asegurar dos de los tres antiguos patriarcados orientales. Los tres serían mejores. Dos es lo que el imperio ha logrado en cualquier momento desde el siglo séptimo."
 cc_byz_task_sultans_friend: "El amigo del sultán"
 cc_byz_task_sultans_friend_desc: "Resolver la cuestión de los lugares santos mediante un acuerdo escrito con El Cairo. Un condominio no es un triunfo y ningún cronista lo llamará así. Es también la primera frontera oriental resuelta en cuatrocientos años.\n\nTomar esto cierra el camino hacia la Guerra de la Pentarquía."
 cc_byz_task_pentarchy_war: "La guerra de la pentarquía"
 cc_byz_task_pentarchy_war_desc: "Poseer los cinco antiguos patriarcados. Constantinopla, Roma, Jerusalén, Antioquía y Alejandría bajo un solo emperador por primera vez desde antes de las conquistas árabes.\n\nTomar esto cierra el camino hacia un acuerdo negociado."

 # ---- The West ----
 cc_byz_task_sicily: "Sicilia Recuperada"
 cc_byz_task_sicily_desc: "Poseer Palermo y Siracusa. La isla es la bisagra entre las dos mitades del mar, y ninguna flota cruza sin el permiso de quien posea estos dos puertos."
 cc_byz_task_ravenna: "Rávena Restaurada"
 cc_byz_task_ravenna_desc: "Poseer Rávena. La sede del antiguo exarcado y la única ciudad de Italia donde la administración imperial se recuerda como un gobierno más que como una ocupación."
 cc_byz_task_western_sea: "El Mar Occidental"
 cc_byz_task_western_sea_desc: "Recuperar dos de los tres teatros occidentales. Justiniano tomó primero África y después Italia; el orden fue cuestión de oportunidad más que de plan, y puede volver a serlo."

 # ---- The East ----
 cc_byz_task_crown_monopoly: "El monopolio de la corona"
 cc_byz_task_crown_monopoly_desc: "Cincuenta ducados de ingresos comerciales mensuales, gestionados a través de la corona. Las especias son compradas y vendidas por funcionarios imperiales y el beneficio llega a la tesorería sin mermar.\n\nTomar esto cierra el camino de las compañías privilegiadas."
 cc_byz_task_chartered_company: "La compañía fletada"
 cc_byz_task_chartered_company_desc: "Permitir que una compañía privilegiada gestione el comercio. Llega menos al tesoro, pero crece una clase mercantil capaz de financiar al estado sin pedir condiciones a Italia.\n\nTomar esto cierra el camino del monopolio."

 # ---- Optional spurs ----
 cc_byz_task_reconquest_claim: "Los Anticuarios"
 cc_byz_task_reconquest_claim_desc: "Investigar treinta avances. Los eruditos que trabajan en los antiguos registros provinciales establecen qué poseía el imperio, cuándo y sobre qué base legal. Los abogados pueden hacer mucho con eso."
 cc_byz_task_greek_fire: "El Fuego Griego redescubierto"
 cc_byz_task_greek_fire_desc: "Cincuenta de tradición naval y una población alfabetizada. La fórmula era un secreto de estado guardado por una sola familia, y se perdió de la manera habitual: porque nadie la escribió."
 cc_byz_task_hagia_sophia: "Santa Sofía mantenida"
 cc_byz_task_hagia_sophia_desc: "Mantener la catedral de Constantinopla. La cúpula ha caído dos veces y ha sido reconstruida dos veces, y el edificio ha sido el argumento de la importancia del imperio durante ochocientos años."
 cc_byz_task_great_palace: "El Gran Palacio"
 cc_byz_task_great_palace_desc: "Poseer seis obras de arte. El complejo del palacio ha estado decayendo desde que la corte se trasladó a Blanquerna, y los visitantes han empezado a comentarlo por escrito."
 cc_byz_task_thessaloniki: "La segunda ciudad"
 cc_byz_task_thessaloniki_desc: "Poseer Tesalónica. La segunda ciudad del imperio, su segundo puerto y el único lugar además de la capital con murallas dignas de ese nombre."
 cc_byz_task_city_adorned: "La ciudad adornada"
 cc_byz_task_city_adorned_desc: "La catedral mantenida, el palacio amueblado, la segunda ciudad conservada. Nada de esto gana una guerra. Todo ello es la razón por la que la gente sigue viniendo aquí para ver cómo es un imperio."
 cc_byz_task_triumph: "Un triunfo en el hipódromo"
 cc_byz_task_triumph_desc: "Setenta de tradición militar. Las formas están registradas en los libros ceremoniales y no se han ejecutado en doscientos años, por lo que la mayor parte de la ciudad nunca ha visto una."
