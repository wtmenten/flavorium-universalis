l_spanish:
 # Tasks added by the forking rework: the three pillars, the reconvergences, the five
 # exclusive forks and the optional spurs.
 #
 # FORK DESCRIPTIONS END WITH WHAT THEY CLOSE. Taking one side of an exclusive fork hides the
 # other (visible = NOT completed), so the player would otherwise never learn there was a
 # choice. Naming the road not taken in the description of the road taken is the only place
 # that information can live.

 # ---- Reconvergence tooltips ----
 # Each wraps an OR of AND pairs so the player reads one line instead of nine.
 cc_byz_two_of_three_pillars_tt: "Completar dos de los tres pilares fundamentales: Logoteta del Curso (el Fisco), El Trono Ecuménico (la Fe), El Ejército de Campaña Restaurado (la Espada)"
 cc_byz_two_of_three_seats_tt: "Completar dos de las tres tareas de las sedes orientales: Antioquía Restaurada, El Patriarca Regresa, Egipto y el Delta"
 cc_byz_two_of_three_theatres_tt: "Completar dos de las tres tareas del teatro occidental: Italia y el Exarcado, África, Spania"
 cc_byz_turkish_question_settled_tt: "La cuestión turca está resuelta, ya sea por conquista o por tributo"

 # ---- The Fisc ----
 cc_byz_task_nomisma: "El nomisma restaurado"
 cc_byz_task_nomisma_desc: "Durante siete siglos el sólido fue la moneda que todo mercado, desde Ceilán hasta Frisia, aceptaba sin pesarla. Ha sido devaluada cuatro veces en los últimos cien años, y los mercaderes han empezado a pesarla."
 cc_byz_task_silk_looms: "Los telares de seda"
 cc_byz_task_silk_looms_desc: "Dos monjes trajeron los gusanos de China en un bastón hueco en el siglo VI, y el imperio mantuvo el monopolio occidental durante seiscientos años gracias a ese robo. Los telares siguen siendo nuestros. Poco más del comercio lo es."
 cc_byz_task_literate_admin: "Una administración alfabetizada"
 cc_byz_task_literate_admin_desc: "El imperio funcionaba sobre el papel cuando el oeste funcionaba sobre la memoria. Puede seguir haciéndolo exactamente mientras haya hombres que puedan leer lo que está escrito, y no más."
 cc_byz_task_logothete: "Logoteta del Curso"
 cc_byz_task_logothete_desc: "El logoteta del curso comenzó siendo el hombre que dirigía el correo. Debido a que el correo llevaba los despachos, llegó a saber qué había en ellos; debido a que sabía qué había en ellos, llegó a dirigir la inteligencia fronteriza; y debido a que dirigía eso, terminó dirigiendo la política exterior. Nadie decidió esto nunca.\n\nLas oficinas que necesita deben ser financiadas, y financiadas durante años, no por una temporada."

 # ---- The Faith ----
 cc_byz_task_athonite: "Los monasterios atonitas"
 cc_byz_task_athonite_desc: "La Montaña Sagrada responde al patriarca en teoría y a sí misma en la práctica. Su opinión llega más lejos que cualquier carta de un obispo y llega antes que las nuestras."
 cc_byz_task_icons: "Los iconos restaurados"
 cc_byz_task_icons_desc: "Durante ciento veinte años el imperio destruyó sus propias imágenes, y luego decidió que se había equivocado y pasó tres siglos reemplazándolas. La Fiesta de la Ortodoxia todavía celebra la reversión cada Cuaresma.\n\nLo que fue quemado no volverá. Lo que puede encargarse, lo será."
 cc_byz_task_autocephalous: "Las hijas autocéfalas"
 cc_byz_task_autocephalous_desc: "Serbia tiene un patriarca. Bulgaria tiene un patriarca. Rus tiene un metropolitano que se comporta como tal. Cada uno de ellos fue concedido por Constantinopla, y cada uno de ellos ahora se describe a sí mismo como habiendo sido siempre independiente.\n\nUna iglesia madre es aquella a la que las hijas todavía responden."
 cc_byz_task_ecumenical_throne: "El trono ecuménico"
 cc_byz_task_ecumenical_throne_desc: "\"Reflexionemos juntos por la paz de las iglesias.\"\n\nEl patriarca es elegido entre tres nombres que presenta el sínodo, y el emperador elige. Ese es el acuerdo, y ha producido patriarcas que desafiaron a los emperadores a la cara. Sigue siendo mejor que la alternativa: un patriarca que nadie eligió."

 # ---- The Sword ----
 cc_byz_task_veterans: "Ejércitos veteranos"
 cc_byz_task_veterans_desc: "Un ejército que ha luchado unido y ha regresado unido vale por tres que no lo hayan hecho. Tenemos hombres de sobra. Nos faltan hombres que hayan estado uno al lado del otro anteriormente."
 cc_byz_task_dromon: "La flota de dromones"
 cc_byz_task_dromon_desc: "Dos filas de remos, un espolón en la proa en lugar de un ariete, y un sifón delantero si el arsenal aún puede suministrar uno. El dromón sostuvo el poder de este imperio durante seiscientos años y no se ha construido en número desde hace ochenta."
 cc_byz_task_varangians: "La guardia varangia"
 cc_byz_task_field_army: "El ejército de campaña restaurado"
 cc_byz_task_field_army_desc: "Ni una guarnición, ni una leva convocada por una temporada, ni mercenarios que volverán a casa en otoño. Un ejército que pueda marchar, perder y marchar de nuevo en el mismo reinado. El imperio no ha tenido uno desde Manzikert."

 # ---- Reconvergence ----
 cc_byz_task_state_restored: "El estado restaurado"
 cc_byz_task_state_restored_desc: "Hay un momento en que un estado deja de gestionar su propio declive y comienza a elegir qué hacer a continuación. Rara vez se marca en el momento y resulta obvio para todos después.\n\nDos de los tres pilares bastarán. Ningún emperador fue jamás fuerte en los tres a la vez."

 # ---- The Greek World ----
 cc_byz_task_serbian_question: "La cuestión serbia"
 cc_byz_task_serbian_question_desc: "Stefan Dusan fue coronado Emperador de los Serbios y Romanos en Skopje, según nuestro rito, por un patriarca que él mismo creó para tal fin. Tomó la mitad de Macedonia y la mayor parte de Epirro, y no se equivocaba al pensar que también podía tomar esta ciudad."
 cc_byz_task_latin_bride: "Una novia latina"
 cc_byz_task_latin_bride_desc: "Una princesa latina en el palacio significa una capilla latina en el palacio, un confesor latino y una facción latina en la corte en menos de una década. También significa un rey occidental que no puede permitirse vernos caer.\n\nLos emperadores han hecho este trato antes y ninguno lo disfrutó."
 cc_byz_task_embassies: "Embajadas en Occidente"
 cc_byz_task_embassies_desc: "El imperio recibió alguna vez embajadores en un trono que se elevaba hasta el techo mientras leones dorados rugían a su lado, y Liutprando de Cremona anotó cada detalle con furia.\n\nYa no podemos costear la maquinaria. Aún podemos costear a los hombres."
 cc_byz_task_venetian_alliance: "La alianza veneciana"
 cc_byz_task_venetian_alliance_desc: "Venecia tomó los caballos de nuestro hipódromo y las reliquias de nuestras iglesias y el Imperio mismo durante cincuenta y siete años, y Venecia también posee la única flota en el Mediterráneo capaz de mantenernos alimentados.\n\nElegirlos a ellos cierra la ruta genovesa."
 cc_byz_task_genoese_compact: "El pacto genovés"
 cc_byz_task_genoese_compact_desc: "Génova se asienta en Gálata, al otro lado del Cuerno, nos paga casi nada en aduanas y recauda siete veces más que nuestro propio puerto. También son quienes pusieron a un Paleólogo de vuelta en este trono.\n\nElegirlos cierra el camino veneciano."

 # ---- Anatolia ----
 cc_byz_task_sultan_tributary: "El tributario del sultán"
 cc_byz_task_sultan_tributary_desc: "El imperio ha pagado tributo a esta casa y ha enviado tropas a sus campañas, y el emperador ha cabalgado en el séquito de un sultán. Hay una cierta simetría en que el arreglo funcione a la inversa, y es más barato que destruirlos."
 cc_byz_task_anatolia_secured: "Anatolia asegurada"
 cc_byz_task_anatolia_secured_desc: "Ya sea por conquista o por tributo, la cuestión turca queda respondida y las provincias orientales pueden ser gobernadas en lugar de defendidas.\n\nNingún emperador en dos siglos ha sido capaz de escribir esa frase."
 cc_byz_task_convert_anatolia: "La fe recuperada"
 cc_byz_task_convert_anatolia_desc: "La conversión en Anatolia no ha sido mayormente forzada. Ha sido un impuesto, un matrimonio, una carrera, y cuatro generaciones de un pueblo descubriendo que el nuevo arreglo era más fácil que el antiguo.\n\nRevertirlo funcionará de la misma manera, y llevará el mismo tiempo."
 cc_byz_task_tagmata: "Los tagmata restaurados"
 cc_byz_task_tagmata_desc: "Asalariados, acuartelados y pagados haya guerra o no. Un ejército profesional responde a quien firma la caja de pagos, lo cual es el argumento a favor y también el argumento en contra.\n\nTomar esto cierra el camino de la pronoia."

 # ---- The Levant ----
 cc_byz_task_eastern_sees: "Las sedes orientales"
 cc_byz_task_eastern_sees_desc: "Antioquía, Jerusalén, Alejandría. Tres de las cinco, perdidas con menos de una década de diferencia en el siglo VII, y lloradas continuamente desde entonces por un imperio que nunca admitió formalmente que se habían ido.\n\nDos de las tres servirán."
 cc_byz_task_sultans_friend: "El amigo del sultán"
 cc_byz_task_sultans_friend_desc: "Un tratado sobre los lugares santos, por escrito, con un sultán. Será leído en occidente como una traición y en El Cairo como una debilidad, y mantendrá los santuarios abiertos y a los peregrinos moviéndose mientras ambas partes lo consideren conveniente.\n\nFirmar esto pone fin a la guerra."
 cc_byz_task_pentarchy_war: "La guerra de la pentarquía"
 cc_byz_task_pentarchy_war_desc: "Roma, Constantinopla, Alejandría, Antioquía, Jerusalén. Cinco patriarcas, una iglesia y un acuerdo que no ha existido intacto desde el siglo VII.\n\nTomar esto cierra el tratado."

 # ---- The West ----
 cc_byz_task_sicily: "Sicilia Recuperada"
 cc_byz_task_sicily_desc: "Aquí se hablaba griego antes que latín y todavía se habla en las colinas. La isla ha sido bizantina, árabe, normanda y angevina en cuatrocientos años, y las Vísperas se encargaron de los angevinos."
 cc_byz_task_ravenna: "Rávena Restaurada"
 cc_byz_task_ravenna_desc: "Los mosaicos de San Vital muestran a Justiniano en una pared y a Teodora en la otra, ambos coronados, ambos mirando al altar, y ninguno de los dos estuvo jamás aquí.\n\nLa ciudad se ha estado colmatando durante ochocientos años. El puerto que la convirtió en sede exarca es ahora un campo."
 cc_byz_task_western_sea: "El Mar Occidental"
 cc_byz_task_western_sea_desc: "\"Nuestro mar.\"\n\nFue una broma romana antes de ser un hecho romano, y para cuando fue un hecho, ya a nadie le parecía gracioso. Dos costas de tres bastarán; la tercera siempre ha sido motivo de disputa."

 # ---- The East ----
 cc_byz_task_crown_monopoly: "El monopolio de la corona"
 cc_byz_task_chartered_company: "La compañía fletada"
 cc_byz_task_chartered_company_desc: "Que los burgueses asuman el riesgo y la corona se lleve una parte de lo que regrese. Recauda menos y lo hace sin una discusión anual en el consistorio.\n\nTomar esto cierra el monopolio de la corona."

 # ---- Optional spurs ----
 cc_byz_task_notitia: "Los anticuarios"
 cc_byz_task_notitia_desc: "La Notitia Dignitatum enumera cada cargo y mando del imperio tardío, occidente y oriente, con la insignia pintada junto a cada uno. La mayoría de los puestos en ella habían dejado de existir antes de que la tinta se secara.\n\nLos abogados pueden hacer mucho con un documento como ese."
 cc_byz_task_greek_fire: "El Fuego Griego redescubierto"
 cc_byz_task_hagia_sophia: "Santa Sofía mantenida"
 cc_byz_task_hagia_sophia_desc: "\"Salomón, te he supersado.\"\n\nLa tradición pone estas palabras en boca de Justiniano durante la dedicación; el relato es de siglos después y el sentimiento es totalmente coherente con su personaje. La cúpula se derrumbó veinte años más tarde y fue reconstruida a una altura mayor."
 cc_byz_task_great_palace: "El Gran Palacio"
 cc_byz_task_great_palace_desc: "La corte se trasladó a Blanquerna hace generaciones y el antiguo palacio ha estado decayendo desde entonces. Los visitantes han empezado a comentarlo por escrito, que es como estas cosas pasan a ser asunto de todos."
 cc_byz_task_thessaloniki: "La segunda ciudad"
 cc_byz_task_thessaloniki_desc: "La segunda ciudad, el segundo puerto y el único otro lugar con murallas dignas de ese nombre. También ha pasado dos décadas tomando sus propias decisiones, y los Zelotes que la gobernaban no pidieron permiso para ninguna de ellas."
 cc_byz_task_city_adorned: "La ciudad adornada"
 cc_byz_task_city_adorned_desc: "Nada de esto gana una guerra. Todo ello es la razón por la que la gente sigue viniendo aquí para ver cómo es un imperio, y por la que lo escriben al volver a casa."
 cc_byz_task_triumph: "Un triunfo en el hipódromo"
 cc_byz_task_triumph_desc: "Las formas están registradas en el Libro de las Ceremonias hasta qué puerta, qué aclamación y quién camina por dónde. No se han ejecutado en doscientos años y la mayor parte de esta ciudad nunca ha visto una."
 cc_byz_task_varangians_desc: "Nórdicos e ingleses con hachas, que no hablan un griego digno de ese nombre y no deben nada a ninguna familia de esta ciudad. Ese es precisamente el sentido de tenerlos. Un emperador rodeado de bizantinos está rodeado de hombres con primos.\n\nTambién recuerdan de quién solía ser el Danubio."
 cc_byz_task_crown_monopoly_desc: "Las especias compradas y vendidas por funcionarios imperiales, el beneficio llegando a la tesorería sin pasar primero por las manos privadas de nadie.\n\nTomar esto cierra la ruta concesionada."
 cc_byz_task_greek_fire_desc: "\"...un fuego que se adhería a todo lo que tocaba y ardía sobre el agua misma.\"\n\nAnna Comnena vio los sifones en uso y describió las cabezas de bestias de bronce en las proas. La composición era un secreto de Estado guardado por una familia y los talleres imperiales, y se perdió de la manera habitual: porque nadie lo puso por escrito."
