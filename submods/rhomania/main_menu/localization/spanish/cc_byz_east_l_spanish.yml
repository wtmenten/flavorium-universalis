l_spanish:
 # Mission tasks
 cc_byz_task_red_sea: "El estrecho del mar Rojo"
 cc_byz_task_red_sea_desc: "Adén y la costa yemení. Egipto sin el estrecho es un término; Egipto con él es un corredor, y todo lo que se mueva entre el océano Índico y Alejandría paga por usarlo."
 cc_byz_task_horn: "La Costa Africana"
 cc_byz_task_horn_desc: "Zeila, Berbera y Mogadiscio. Cisternas, almacenes y una guarnición en cada una. El largo viaje a la India no puede realizarse sin ellas, y cada potencia que lo ha intentado ha aprendido de la misma manera."
 cc_byz_task_india: "Las factorías de Malabar"
 cc_byz_task_india_desc: "Una presencia comercial en la costa india, no una conquista de la misma. Una factoría, un privilegio detrás y tributos pagados a quien gobierne el puerto."
 cc_byz_task_spice_islands: "La fuente"
 cc_byz_task_spice_islands_desc: "Sumatra y Java, donde realmente crecen las especias. Todo lo que está al oeste de aquí es un intermediario, y durante dos siglos eso ha significado Venecia."

 # Theatre triggers
 cc_byz_eastern_gate_tt: "Nosotros o un súbdito poseemos Alejandría, El Cairo y el Sinaí"
 cc_byz_theatre_red_sea_tt: "Nosotros o un súbdito tenemos presencia en la costa yemení"
 cc_byz_theatre_horn_tt: "Nosotros o un súbdito poseemos una estación en el Cuerno"
 cc_byz_theatre_india_tt: "Nosotros o un súbdito tenemos presencia en la costa india"
 cc_byz_theatre_spice_islands_tt: "Nosotros o un súbdito tenemos presencia en las islas de las especias"

 # Theatre actions
 cc_byz_claim_theatre_red_sea: "Proclamar el Paso del Mar Rojo"
 cc_byz_claim_theatre_red_sea_desc: "Declarar el estrecho abierto bajo autoridad imperial, y establecer quién puede usarlo y en qué condiciones."
 cc_byz_claim_theatre_horn: "Proclamar las Estaciones Africanas"
 cc_byz_claim_theatre_horn_desc: "Establecer las estaciones de avituallamiento que hacen posible la ruta a la India, y decidir si son guarniciones o casas de huéspedes."
 cc_byz_claim_theatre_india: "Proclamar el Comercio Indio"
 cc_byz_claim_theatre_india_desc: "Establecer factorías en la costa india y una compañía privilegiada para gestionarlas."
 cc_byz_claim_theatre_spice_islands: "Proclamar el Comercio de Especias"
 cc_byz_claim_theatre_spice_islands_desc: "Llegad a las islas donde crecen las especias y convertíos en la potencia que las vende en lugar de la potencia que las compra."

 # Country modifiers
 STATIC_MODIFIER_NAME_cc_byz_red_sea_transit: "El Tránsito del Mar Rojo"
 STATIC_MODIFIER_DESC_cc_byz_red_sea_transit: "El estrecho está controlado y los aranceles se recaudan. Cada cargamento que se mueve entre el océano Índico y el Mediterráneo pasa por una aduana imperial."
 STATIC_MODIFIER_NAME_cc_byz_horn_stations: "Las Estaciones Africanas"
 STATIC_MODIFIER_DESC_cc_byz_horn_stations: "Cisternas, almacenes y prácticos en la costa somalí. Poco glamurosos, y la diferencia entre una ruta y una ambición."
 STATIC_MODIFIER_NAME_cc_byz_indian_factories: "Las Factorías Indias"
 STATIC_MODIFIER_DESC_cc_byz_indian_factories: "Mercaderes imperiales residentes en la costa de Malabar, que comercian bajo carta, con sus propios almacenes y un cónsul para defender sus intereses."
 STATIC_MODIFIER_NAME_cc_byz_spice_monopoly: "El Comercio de Especias"
 STATIC_MODIFIER_DESC_cc_byz_spice_monopoly: "El imperio compra donde crece la especia y vende donde se desea, y las casas italianas que pasaron dos siglos en medio ahora la compran a Constantinopla."
 STATIC_MODIFIER_NAME_cc_byz_eastern_company: "La Compañía Oriental"
 STATIC_MODIFIER_DESC_cc_byz_eastern_company: "Una compañía privilegiada asume los barcos, las pérdidas y el riesgo. La corona posee el sello y se lleva una parte de lo que regresa."
 STATIC_MODIFIER_NAME_cc_byz_eastern_learning: "Aprendizaje del Este"
 STATIC_MODIFIER_DESC_cc_byz_eastern_learning: "Los eruditos partieron con los mercaderes y regresaron con matemáticas, astronomía y medicina. Lo más barato que el imperio compró allí fuera y lo que sobrevivió a las fábricas."

 # Casus belli
 cc_byz_cb_indian_ocean: "El océano Índico"
 cc_byz_cb_indian_ocean_desc: "El imperio posee el estrecho, y las potencias del océano más allá son ahora vecinos cercanos, independientemente de que alguna de las partes lo deseara."

 # cc_byz_east.1 - the strait
 cc_byz_east.1.title: "El estrecho"
 cc_byz_east.1.desc: "Alejandría, El Cairo y el Sinaí están unidos, lo que significa que por primera vez desde Justiniano el imperio controla todo el paso entre el océano Índico y el Mediterráneo.\n\nLa implicación ha sido planteada al palacio por un mercader griego que ha realizado la ruta de Adén dos veces y es una de las poquísimimas personas en Constantinopla que comprende lo que ahora es posible. Las especias no provienen de El Cairo. Pasan a través de El Cairo, desde puertos que el imperio nunca ha visto, transportadas por barcos que el imperio no posee, y los funcionarios del sultán se han enriquecido durante dos siglos sin hacer más que interponerse entre los dos extremos.\n\nEsa posición es ahora la del emperador. Lo que haga con ella es la cuestión."
 cc_byz_east.1.desc_indebted: "El imperio controla todo el paso entre el océano Índico y el Mediterráneo, y tiene acreedores que comprendieron las implicaciones de ello antes que el palacio.\n\nLos agentes venecianos y genoveses ya han preguntado, por separado y con gran cuidado, qué pretende el emperador respecto al tránsito. Ambos han observado que los acuerdos existentes han servido bien a todos. Ninguno mencionó los saldos pendientes, que es como el palacio sabe que los saldos eran el verdadero tema de la conversación.\n\nLa ruta de las especias es lo más valioso que el imperio ha adquirido en trescientos años, y los hombres mejor situados para explotarla son los hombres a quienes el imperio les debe dinero."
 cc_byz_east.1.a: "Gravar el paso. Dejar que todos lo utilicen."
 cc_byz_east.1.b: "Cerrarlo al transporte latino."
 cc_byz_east.1.c: "Conceder el privilegio a una compañía. Que los mercaderes asuman el riesgo."

 # cc_byz_east.10 - the long run
 cc_byz_east.10.title: "A largo plazo"
 cc_byz_east.10.desc: "La distancia es el problema, y no es un problema que pueda resolverse simplemente deseándolo.\n\nUn barco que sale del mar Rojo hacia la costa de Malabar pasa semanas en el mar sin ningún puerto amigo, siguiendo un calendario de monzones que permite el cruce dos veces al año y castiga a quien lo juzgue mal. El agua se agota. Los cascos se ensucian. Las tripulaciones enferman.\n\nLa respuesta se conoce desde los Ptolomeos y no tiene nada de glamurosa: estaciones en la costa africana. Zeila, Berbera, Mogadiscio. Cisternas, un almacén, alguien que conozca los vientos. Quien posea eso convierte el cruce en algo rutinario, y quien no, lo convierte en una aventura."
 cc_byz_east.10.a: "Construirlos adecuadamente. Cisternas, almacenes, guarniciones."
 cc_byz_east.10.b: "Llegar a un acuerdo con los capitanes de puerto."
 cc_byz_east.10.c: "Enviar la flota por delante y tomar lo que necesitemos."

 # cc_byz_east.20 - the factories
 cc_byz_east.20.title: "La costa de Malabar"
 cc_byz_east.20.desc: "El océano Índico ha mantenido un comercio internacional ordenado durante mil años, y el imperio ha llegado tarde a él.\n\nEl acuerdo es bien comprendido por todos excepto por los recién llegados. Los mercaderes extranjeros viven en un barrio designado, comercian bajo la protección del gobernante local, pagan sus tasas y resuelven sus disputas en sus tribunales. Árabes, persas, chinos y judíos han hecho negocios bajo estos términos durante siglos y se han enriquecido gracias a ello.\n\nA los agentes imperiales se les ha ofrecido exactamente eso. Varios de ellos consideran que está por debajo de la dignidad del Imperio Romano. Los que llevan más tiempo allí son quienes más insisten en no aceptarlo."
 cc_byz_east.20.desc_force: "El imperio ha llegado a la costa de Malabar con una flota, lo que ha cambiado la oferta.\n\nLos gobernantes locales ya han lidiado con extranjeros armados y su evaluación es pragmática: los barcos son formidables, están muy lejos de casa y el monzón significa que no pueden ser reforzados durante seis meses al año. Se han ofrecido términos notablemente peores que los que disfrutan los árabes y los persas, basándose en la razón razonable de que una potencia que llega armada está planteando una pregunta diferente.\n\nEl comandante imperial ha solicitado instrucciones. También ha señalado, en un despacho aparte, cuántos de sus barcos seguirían a flote si el acuerdo saliera mal en julio."
 cc_byz_east.20.a: "Comerciar como invitados, bajo la ley local."
 cc_byz_east.20.b: "Fortificar las factorías."
 cc_byz_east.20.c: "Enviar eruditos junto con los mercaderes."

 # cc_byz_east.30 - the source
 cc_byz_east.30.title: "La fuente"
 cc_byz_east.30.desc: "Se llega a las islas donde crecen las especias, y lo más sorprendente de ellas es lo pequeñas que son.\n\nUna mercancía que ha sido la carga más valiosa del mundo occidental desde antes de la caída de Roma, que financió la república veneciana y la mitad de las fortunas de Génova, proviene de un conjunto de islas que los navegantes imperiales tuvieron que ver marcadas en un mapa. Los cultivadores la venden por una fracción de lo que alcanza en Alejandría y son perfectamente conscientes de la disparidad; simplemente no tenían forma de llegar al otro extremo de la cadena.\n\nEl imperio ahora posee ambos extremos."
 cc_byz_east.30.desc_treaty: "Se llega a las islas donde crecen las especias, y se llega mediante acuerdos en lugar de por la fuerza, lo cual los agentes imperiales consideran un logro más duradero.\n\nCada acuerdo, desde Yemen hasta Java, fue negociado: tasas pagadas, ley local aceptada, disputas resueltas en tribunales ajenos. Tomó más tiempo que el que habría tomado una flota y ha producido algo que una flota no podría: una ruta que no necesita ser guarnecida para permanecer abierta.\n\nLos cultivadores venden por una fracción de lo que las especias alcanzan en Alejandría. El imperio se encuentra ahora donde estaba Venecia, y llegó allí siendo un mejor cliente en lugar de un peor vecino."
 cc_byz_east.30.desc_monopoly: "Se llega a las islas donde crecen las especias, y el estrecho detrás de ellas ha sido cerrado a la navegación latina durante una generación.\n\nLa consecuencia no es sutil y no pretendía serlo. Venecia y Génova se construyeron situándose entre las especias y sus compradores, y ya no están allí; ahora está el imperio. El Rialto está descubriendo lo que es ser un cliente, y los informes del senado veneciano se leen en Constantinopla con una atención que no es del todo digna.\n\nEs la acción más rentable que el imperio ha realizado desde Justiniano. También ha convertido en enemigos permanentes a las únicas potencias del oeste con flotas."
 cc_byz_east.30.a: "Un monopolio real."
 cc_byz_east.30.b: "Arrendarlo a los burgueses. Llevarse una parte."
 cc_byz_east.30.c: "Véndeles a los italianos su acceso de vuelta, a nuestro precio."
