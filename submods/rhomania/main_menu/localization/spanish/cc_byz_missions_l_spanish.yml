l_spanish:
 # Stepping-stone mission tasks.
 #
 # These 25 tasks are mission-mode only: mission packs default to OFF, and the stepping
 # stones deliberately have no generic-action twin. Only the nine cornerstones do.
 #
 # Descriptions state the condition plainly, because a mission task the player cannot work
 # out how to complete is not content. Flavour goes in the second sentence, never the first.

 # A. The House in Order
 cc_byz_task_walls: "Las murallas resisten"
 cc_byz_task_walls_desc: "Cincuenta y seis torres en la muralla exterior, noventa y seis en la interior, y un foso que ha estado seco desde que haya memoria. Han fallado una vez en mil años, y esa vez fue ante los latinos que llegaron por mar.\n\nLa cantería es teodosiana. Las reparaciones son de todo el mundo."
 cc_byz_task_hippodrome: "Pan y circo"
 cc_byz_task_hippodrome_desc: "Azules a un lado, Verdes al otro, y un emperador en el kathisma que ha aprendido a escuchar. No es un hipódromo. Es el único edificio del imperio donde el pueblo puede decirle algo a la cara y no ser arrestado por ello, y cada emperador que lo olvidó se enteró en la misma semana."
 cc_byz_task_council: "Un consejo completo"
 cc_byz_task_council_desc: "Un solo hombre no puede leer cada despacho, y un emperador que lo intente no leerá ninguno adecuadamente. Necesitamos hombres en la mesa que conozcan una provincia cada uno, y necesitamos que discrepen con nosotros en voz alta."
 cc_byz_task_bureaus: "Las oficinas financiadas"
 cc_byz_task_bureaus_desc: "Todo imperio que ha perdurado fue, al final, una habitación llena de escribanos. Los nuestros no cobran, algo que hemos decidido dejar de notar.\n\nDeben ser financiados, y financiados de manera constante. Un mes generoso antes de una inspección no constituye una administración."
 cc_byz_task_arsenal: "El Arsenal"
 cc_byz_task_arsenal_desc: "Los estrechos son la razón por la que esta ciudad ha sobrevivido, y los estrechos no valen nada sin cascos en el agua. Hemos estado alquilando barcos italianos durante cincuenta años y pagando más de lo que habría costado una flota."

 # B. The Greek Claimants
 cc_byz_task_no_second_emperor: "Sin segundo emperador"
 cc_byz_task_no_second_emperor_desc: "Trebizonda titula a su gobernante Emperador y Autócrata de los Romanos, que es nuestro título, y lo hace desde que la ciudad cayó ante los latinos y todo aquel con un derecho se marchó a otra parte con él. Los Grandes Comneno son primos. Eso nunca ha hecho que la aritmética sea mejor."
 cc_byz_task_duchy_dissolved: "El ducado disuelto"
 cc_byz_task_duchy_dissolved_desc: "Una familia borgoñona posee la Acrópolis y se hace llamar el Ducado de Atenas. El Partenón ha sido una catedral bajo su mando durante un siglo, lo cual es al menos un uso, y el acuerdo data del saqueo de esta ciudad en 1204."
 cc_byz_task_despotate: "El Despotado"
 cc_byz_task_despotate_desc: "Mistra, en las colinas sobre Esparta, es la única provincia de este imperio que está creciendo. Los eruditos van allí ahora en lugar de venir aquí. Eso debería ser un consuelo, pero no lo es."
 cc_byz_task_greek_again: "Griego de nuevo"
 cc_byz_task_greek_again_desc: "Atenas ha sido gobernada por latinos durante tiempo suficiente para que una generación haya crecido bajo su rito y no recuerde otro. Recuperar la ciudad es el trabajo de una temporada. El resto no lo es."

 # C. Anatolia
 cc_byz_task_beylik_ended: "El fin del Beylicato"
 cc_byz_task_beylik_ended_desc: "Un emirato fronterizo en Sogut, a dos días de camino del mar, gobernado por una familia que nadie en esta ciudad habría sabido nombrar hace cuarenta años. Han tomado Bursa. Han tomado Nicea. Han cruzado hacia Galípoli.\n\nTodavía pueden ser aniquilados."
 cc_byz_task_themes: "Los Temas reformados"
 cc_byz_task_themes_desc: "Soldados asentados en tierras que poseen a cambio de mantener la línea, reuniéndose bajo un strategos que es también su gobernador. Funcionó durante trescientos años, y luego los magnates compraron la tierra y la línea desapareció con ella."
 cc_byz_task_pronoia_host: "La hueste de Pronoia"
 cc_byz_task_pronoia_host_desc: "Concede a un hombre los ingresos de un distrito y traerá soldados cuando se le llame. No le cuesta nada al tesoro, por eso es irresistible, y le cuesta al tesoro el distrito, por eso debería resistirse.\n\nTomar esto cierra el camino de las tagmata."

 # D. The Levant
 cc_byz_task_antioch: "Antioquía restaurada"
 cc_byz_task_antioch_desc: "Una de las cinco sedes patriarcales, la ciudad donde los seguidores de Cristo fueron llamados cristianos por primera vez, y territorio imperial dentro de la memoria viva de la Primera Cruzada. El patriarca de Antioquía ha vivido en Constantinopla durante doscientos años porque no ha habido ningún otro lugar donde vivir."
 cc_byz_task_holy_city: "La Ciudad Santa"
 cc_byz_task_holy_city_desc: "El Santo Sepulcro, la roca, y cada camino de la cristiandad que conduce hacia ellos. El imperio ha pagado las lámparas de esa iglesia a través de tres cambios de amo y nunca una sola vez se le ha pedido que deje de hacerlo."
 cc_byz_task_patriarch: "El Patriarca regresa"
 cc_byz_task_patriarch_desc: "El patriarcado sobrevivió ocho siglos de dominio musulmán siendo extremadamente cuidadoso. Hará falta más que un cambio de guarnición para hacer que se detenga."
 cc_byz_task_egypt: "Egipto y el Delta"
 cc_byz_task_egypt_desc: "Egipto alimentó a esta ciudad durante trescientos años y ha alimentado a otros durante setecientos. Los atraques de la flota de grano en el puerto todavía conservan sus nombres antiguos y se utilizan para otras cosas."
 cc_byz_task_lighthouse: "El Faro"
 cc_byz_task_lighthouse_desc: "Permaneció en pie durante mil seiscientos años y los terremotos se han quedado con la mayor parte. Lo que sobrevive es un tocón sobre un espigón en un puerto activo, lo cual es algo más útil que una maravilla y menos impresionante."
 cc_byz_task_sinai_road: "El camino del Sinaí"
 cc_byz_task_sinai_road_desc: "El istmo entre dos mares, y la única tierra que toca cualquier especia entre las Indias y Alejandría. Quien lo posea grava todo lo que pasa y no necesita flota para hacerlo."

 # E. The Western Crossing
 cc_byz_task_adriatic: "El cruce del Adriático"
 cc_byz_task_adriatic_desc: "Dirraquio es donde comienza el camino hacia Italia y donde ha desembarcado cada invasión de los Balcanes desde el oeste. La Via Egnatia corre desde su puerta hasta la nuestra."
 cc_byz_task_exarch_seated: "El Exarca asentado"
 cc_byz_task_exarch_seated_desc: "Un gobernador en Rávena con las tropas, las cortes y los ingresos de Italia en sus manos, nombrado por un emperador a seis semanas de navegación.\n\nEl cargo funcionó durante doscientos años. Vale la pena saber cómo terminó."
 cc_byz_task_carthage: "Cartago recuperada"
 cc_byz_task_carthage_desc: "Belisario arrebató África a los vándalos en una sola temporada con quince mil hombres, lo que sigue siendo lo más exitoso que este imperio haya hecho jamás y estableció una expectativa que nadie ha vuelto a cumplir."
 cc_byz_task_pillars: "Los Pilares"
 cc_byz_task_pillars_desc: "Las Columnas de Hércules, y el fin del mundo según los antiguos. El imperio mantuvo el lado lejano de ellas durante setenta años y nunca pudo explicarse a sí mismo por qué."

 # F. The Merchant Empire
 cc_byz_task_galata: "Las aduanas de Gálata"
 cc_byz_task_galata_desc: "El barrio genovés al otro lado del Cuerno nos paga una fracción de lo que recauda y recauda siete veces más que nuestra propia aduana. Las cifras fueron presentadas ante el emperador en 1348 y la guerra que siguió se perdió en el mar."
 cc_byz_task_merchant_fleet: "Una flota mercante"
 cc_byz_task_spice_dues: "Los tributos de las especias"
 cc_byz_task_spice_dues_desc: "A este nivel, la aduana vale más que varias provincias y no cuesta nada guarnecerla. Todos en Italia han hecho el mismo cálculo."

 # Stepping-stone reward modifiers
 STATIC_MODIFIER_NAME_cc_byz_reward_fortifications: "Murallas en buen estado"
 STATIC_MODIFIER_DESC_cc_byz_reward_fortifications: "La mampostería es sólida, las cisternas están llenas y la guarnición ha cobrado. Nada de esto es permanente."
 STATIC_MODIFIER_NAME_cc_byz_reward_naval: "Una temporada de construcción naval"
 STATIC_MODIFIER_DESC_cc_byz_reward_naval: "Madera, cuerda y hombres que saben qué hacer con ambas cosas."
 STATIC_MODIFIER_NAME_cc_byz_reward_trade: "Las aduanas funcionan"
 STATIC_MODIFIER_DESC_cc_byz_reward_trade: "Tributos recaudados donde deben serlo, por hombres que los remitan."
 STATIC_MODIFIER_NAME_cc_byz_reward_administration: "Las oficinas están dotadas de personal"
 STATIC_MODIFIER_DESC_cc_byz_reward_administration: "La evaluación está actualizada, los escribanos han cobrado y alguien sabe dónde están los registros."
 STATIC_MODIFIER_NAME_cc_byz_reward_manpower: "Reclutas de los Temas"
 STATIC_MODIFIER_DESC_cc_byz_reward_manpower: "Hombres de una provincia que ha decidido que es nuestra, lo cual no es lo mismo que una provincia que poseemos."
 STATIC_MODIFIER_NAME_cc_byz_reward_confidence: "La ciudad cree"
 STATIC_MODIFIER_DESC_cc_byz_reward_confidence: "Un éxito público, y una capital dispuesta a darle al trono el beneficio de la duda durante un tiempo."
 cc_byz_task_merchant_fleet_desc: "No una flota que el imperio posea. Una flota que navegue bajo su bandera, pague sus tasas aquí y prefiera estar protegida por nosotros que por cualquier otro.\n\nLos registros nombran cada posesión latina en el Egeo que no hace ninguna de las dos cosas."
