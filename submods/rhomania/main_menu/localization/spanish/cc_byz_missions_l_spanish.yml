l_spanish:
 # Stepping-stone mission tasks.
 #
 # These 25 tasks are mission-mode only: mission packs default to OFF, and the stepping
 # stones deliberately have no generic-action twin. Only the nine cornerstones do.
 #
 # Descriptions state the condition plainly, because a mission task the player cannot work
 # out how to complete is not content. Flavour goes in the second sentence, never the first.

 # A. The House in Order
 cc_byz_task_walls: "Las murallas resisten"
 cc_byz_task_walls_desc: "Mantener las Murallas Teodosianas en Constantinopla. Han fallado exactamente una vez en novecientos años, y la ciudad nunca ha dejado de pagar por su reparación."
 cc_byz_task_hippodrome: "Pan y circo"
 cc_byz_task_hippodrome_desc: "Mantener el Hipódromo. Es donde la gente de esta ciudad le dice a su emperador lo que piensa de él, lo cual conviene saber antes de que sea gritado."
 cc_byz_task_council: "Un consejo completo"
 cc_byz_task_council_desc: "Asentar a cinco miembros en el gabinete. Un emperador que gobierna solo es un emperador cuyo sucesor no hereda más que una silla."
 cc_byz_task_bureaus: "Las oficinas financiadas"
 cc_byz_task_bureaus_desc: "Mantener cuatro burocracias con mantenimiento completo. Poco glamuroso, costoso y la diferencia entre un imperio y una corte."
 cc_byz_task_arsenal: "El Arsenal"
 cc_byz_task_arsenal_desc: "Mantener un astillero en Constantinopla. Los estrechos son la única razón por la que esta ciudad ha sobrevivido, y no valen nada sin cascos en el agua."

 # B. The Greek Claimants
 cc_byz_task_no_second_emperor: "Sin segundo emperador"
 cc_byz_task_no_second_emperor_desc: "Poner fin al Imperio de Trebisonda. Su reclamación es genuina, su linaje es imperial, y no puede haber dos."
 cc_byz_task_duchy_dissolved: "El ducado disuelto"
 cc_byz_task_duchy_dissolved_desc: "Poner fin al Ducado de Atenas. La posesión de un aventurero latino en suelo griego, gobernada en francés, a tres días de navegación de la capital."
 cc_byz_task_despotate: "El Despotado"
 cc_byz_task_despotate_desc: "Mantener Acaia y Arcadia enteras. El Morea es la última parte del imperio que aún se alimenta a sí misma y aún envía soldados."
 cc_byz_task_greek_again: "Griego de nuevo"
 cc_byz_task_greek_again_desc: "Mantener Ática entera y lograr que Atenas tenga una mayoría ortodoxa. La ciudad ha sido gobernada por latinos durante tiempo suficiente para que una generación haya crecido bajo su rito."

 # C. Anatolia
 cc_byz_task_beylik_ended: "El fin del Beylicato"
 cc_byz_task_beylik_ended_desc: "Poner fin al estado otomano. Cualquier otra cuestión a la que se enfrente el imperio es una cuestión de tiempo, y esta es la que decide cuánto queda de él."
 cc_byz_task_themes: "Los Temas reformados"
 cc_byz_task_themes_desc: "Control veinticinco ubicaciones en Anatolia. El sistema temático era la forma en que este imperio alimentaba y reclutaba a sus ejércitos, y necesita Asia Menor para existir siquiera."
 cc_byz_task_pronoia_host: "La hueste de Pronoia"
 cc_byz_task_pronoia_host_desc: "Mantener tres concesiones de pronoia. Tierras poseídas a cambio de soldados: más barato que pagarles, y la factura llega en un reinado posterior."

 # D. The Levant
 cc_byz_task_antioch: "Antioquía restaurada"
 cc_byz_task_antioch_desc: "Mantener Antioquía, o asegurar su sede patriarcal. Una de las cinco sedes antiguas, perdida frente a los árabes antes incluso de que el cisma fuera una disputa."
 cc_byz_task_holy_city: "La Ciudad Santa"
 cc_byz_task_holy_city_desc: "Mantener Jerusalén, o asegurar su sede patriarcal. Ningún emperador romano la ha gobernado desde Heraclio, y él no la gobernó por mucho tiempo."
 cc_byz_task_patriarch: "El Patriarca regresa"
 cc_byz_task_patriarch_desc: "Lograr que Jerusalén tenga una mayoría ortodoxa. El patriarcado sobrevivió ocho siglos de dominio musulmán siendo cauteloso; necesitará tiempo para dejar de serlo."
 cc_byz_task_egypt: "Egipto y el Delta"
 cc_byz_task_egypt_desc: "Mantener Alejandría y El Cairo, o asegurar la sede alejandrina. El granero del antiguo imperio, y la aduana más rica entre aquí y la India."
 cc_byz_task_lighthouse: "El Faro"
 cc_byz_task_lighthouse_desc: "Mantener el Faro de Alejandría. Guio a los barcos hacia ese puerto durante mil años y el puerto nunca ha vuelto a ser el mismo sin él."
 cc_byz_task_sinai_road: "El camino del Sinaí"
 cc_byz_task_sinai_road_desc: "Mantener el Sinaí. Egipto sin él es un término. Egipto con él es un corredor, y el extremo lejano de ese corredor es la India."

 # E. The Western Crossing
 cc_byz_task_adriatic: "El cruce del Adriático"
 cc_byz_task_adriatic_desc: "Mantener Durrës y Split. La antigua carretera hacia el oeste comenzaba en Durrës, y ningún ejército ha llegado a Italia desde aquí sin ella."
 cc_byz_task_exarch_seated: "El Exarca asentado"
 cc_byz_task_exarch_seated_desc: "Nombrar un exarca para gobernar en Italia. Las ciudades tomadas por un ejército se mantienen. Las ciudades gobernadas por un funcionario nombrado se recuperan."
 cc_byz_task_carthage: "Cartago recuperada"
 cc_byz_task_carthage_desc: "Mantener Túnez entera. África alimentó a Roma durante cuatro siglos y pagó la reconquista que la perdió."
 cc_byz_task_pillars: "Los Pilares"
 cc_byz_task_pillars_desc: "Mantener Murcia o Almería enteras. El extremo lejano del mar, donde estuvo la Spania de Justiniano y donde no permaneció."

 # F. The Merchant Empire
 cc_byz_task_galata: "Las aduanas de Gálata"
 cc_byz_task_galata_desc: "Mantener Gálata. El barrio al otro lado del agua ha recaudado más aduanas de esta ciudad que la propia ciudad, y es hora de que eso termine."
 cc_byz_task_merchant_fleet: "Una flota mercante"
 cc_byz_task_merchant_fleet_desc: "Alcanzar quince ducados de ingresos comerciales mensuales. No una flota que el imperio posea, sino una que navegue bajo su bandera y pague sus tasas aquí."
 cc_byz_task_spice_dues: "Los tributos de las especias"
 cc_byz_task_spice_dues_desc: "Alcanzar treinta ducados de ingresos comerciales mensuales. A estas alturas, las aduanas valen más que varias provincias, y todo el mundo en Italia lo ha notado."

 # Stepping-stone reward modifiers
 STATIC_MODIFIER_NAME_cc_byz_reward_fortifications: "Murallas en buen estado"
 STATIC_MODIFIER_DESC_cc_byz_reward_fortifications: "La mampostería es sólida, las cisternas están llenas y la guarnición ha cobrado. Nada de esto es permanente."
 STATIC_MODIFIER_NAME_cc_byz_reward_naval: "Una temporada de construcción naval"
 STATIC_MODIFIER_DESC_cc_byz_reward_naval: "Madera, cuerda y hombres que saben qué hacer con ambas cosas."
 STATIC_MODIFIER_NAME_cc_byz_reward_trade: "Las aduanas funcionan"
 STATIC_MODIFIER_DESC_cc_byz_reward_trade: "Tributos recaudados donde deben serlo, por hombres que los remitan."
 STATIC_MODIFIER_NAME_cc_byz_reward_administration: "Las oficinas están dotadas de personal"
 STATIC_MODIFIER_DESC_cc_byz_reward_administration: "La evaluación está actualizada, los escribanos han cobrado y alguien sabe dónde están los registros."
 STATIC_MODIFIER_NAME_cc_byz_reward_manpower: "Reclutas de los Temas"
 STATIC_MODIFIER_DESC_cc_byz_reward_manpower: "Hombres de una provincia que ha decidido que es nuestra, lo cual no es lo mismo que una provincia que poseemos."
 STATIC_MODIFIER_NAME_cc_byz_reward_confidence: "La ciudad cree"
 STATIC_MODIFIER_DESC_cc_byz_reward_confidence: "Un éxito público, y una capital dispuesta a darle al trono el beneficio de la duda durante un tiempo."
