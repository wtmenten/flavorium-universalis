l_spanish:
 # Actions
 cc_byz_open_union_contacts: "Abrir contactos con Roma"
 cc_byz_open_union_contacts_desc: "Envía legados al oeste para establecer qué términos de reunión consideraría el papado. Las cartas y las embajadas no comprometen a nadie y pueden ser desautorizadas en cualquier momento, que es precisamente por lo que son el primer paso y no el último."
 cc_byz_summon_union_council: "Convocar un Consejo de Unión"
 cc_byz_summon_union_council_desc: "Convoque un concilio general con los latinos para resolver los puntos de doctrina que dividen a las iglesias. El concilio producirá un texto. Si el texto puede predicarse en Constantinopla es una cuestión aparte y no se resuelve aquí."
 cc_byz_promulgate_union: "Promulgar la Unión"
 cc_byz_promulgate_union_desc: "Leer el acta de unión en voz alta en Santa Sofía y exigir que el clero de la capital la acepte. La firma se obtuvo en el extranjero. Este es el paso que decide si esto significa algo."
 cc_byz_repudiate_union: "Repudiar la Unión"
 cc_byz_repudiate_union_desc: "Renunciar al acto de unión. Se restaura la alianza con el mundo ortodoxo y la iglesia vuelve a estar completa. No vendrá ninguna flota del oeste, y cada corte en Italia recordará qué emperador firmó y luego anuló.\n\nEste es un final, no una reversión. El arco no comienza de nuevo."
 cc_byz_clergy_will_attend_tt: "El [clergy_estate|E] está bastante dispuesto a enviar una delegación"

 # Country modifiers
 STATIC_MODIFIER_NAME_cc_byz_union_contacts: "Contactos con Roma"
 STATIC_MODIFIER_DESC_cc_byz_union_contacts: "Los legados van y vienen. No se ha acordado nada y ambas partes consideran que la ambigüedad es útil."
 STATIC_MODIFIER_NAME_cc_byz_union_signed: "Unión Firmada"
 STATIC_MODIFIER_DESC_cc_byz_union_signed: "El acto de unión ha sido firmado en el extranjero y no ha sido promulgado en casa. El oeste cree que el cisma ha terminado. A la ciudad no se le ha informado."
 STATIC_MODIFIER_NAME_cc_byz_union_received: "Unión Recibida"
 STATIC_MODIFIER_DESC_cc_byz_union_received: "El acto de unión fue leído en Santa Sofía y la ciudad lo aceptó. Se recibe al clero latino, el crédito latino es más barato y el imperio puede pedir cosas al oeste y, ocasionalmente, recibirlas."
 STATIC_MODIFIER_NAME_cc_byz_union_rejected: "Unión Rechazada"
 STATIC_MODIFIER_DESC_cc_byz_union_rejected: "El acto fue firmado en el extranjero y rechazado en casa. El imperio ahora soporta los costes de la posición latina y los costes de la ortodoxa, sin obtener los beneficios de ninguna."
 STATIC_MODIFIER_NAME_cc_byz_anti_unionist_ferment: "Fermento Antiunionista"
 STATIC_MODIFIER_DESC_cc_byz_anti_unionist_ferment: "Sacerdotes que no conmemoran al Papa, congregaciones que se marchan cuando lo oyen conmemorado, y un número creciente de hombres que han llegado a la conclusión de que el palacio es el problema."
 STATIC_MODIFIER_NAME_cc_byz_union_repudiated: "Unión Repudiada"
 STATIC_MODIFIER_DESC_cc_byz_union_repudiated: "La unión fue renunciada. La iglesia está completa, el mundo ortodoxo está satisfecho y las potencias occidentales han descartado al imperio como un socio en el que no pueden confiar."
 STATIC_MODIFIER_NAME_cc_byz_latin_aid: "Ayuda Latina"
 STATIC_MODIFIER_DESC_cc_byz_latin_aid: "Hombres, dinero y barcos del oeste, que llegan porque la unión se mantuvo el tiempo suficiente para que alguien actuara al respecto."

 # Opinion modifiers
 cc_byz_union_negotiating: "Negociando la Reunión"
 cc_byz_union_upheld: "Mantenida la Unión"
 cc_byz_union_undelivered: "No se pudo lograr la Unión"
 cc_byz_union_renounced: "Renunció a la Unión"
 cc_byz_submitted_to_rome: "Sometido a Roma"
 cc_byz_held_the_faith: "Fiel a la Fe"

 # cc_byz_union.1 - the legates
 cc_byz_union.1.title: "Legados hacia el oeste"
 cc_byz_union.1.desc: "La propuesta se ha hecho antes y se hará de nuevo, y es siempre la misma propuesta: las iglesias son una sola iglesia, simplemente han sido administradas por separado durante cuatrocientos años, y un pequeño número de dificultades formales se interponen entre el acuerdo actual y una reunión que obligaría al oeste a tomarse en serio la supervivencia del imperio.\n\nEl pequeño número de dificultades formales es cuatro, y hay hombres que han dedicado sus vidas a cada una de ellas. Lo que se decide ahora es solo quién va, y qué se les permite decir cuando lleguen."
 cc_byz_union.1.desc_hellenic: "La propuesta se ha hecho antes. Se plantea ahora en una ciudad que ha pasado una generación decidiendo que es griega y ortodoxa y que ambas son la misma afirmación, y la propuesta suena diferente en esa ciudad de lo que sonaba en la anterior.\n\nLas dificultades son las mismas cuatro que siempre han sido. Lo que ha cambiado es que mucha gente que antes las habría llamado técnicas ahora las llaman el todo del asunto, y estarán esperando a los legados cuando regresen."
 cc_byz_union.1.a: "Hombres que informarán con precisión y no prometerán nada."
 cc_byz_union.1.b: "Hombres que prometerán cualquier cosa que mantenga la puerta abierta."
 cc_byz_union.1.c: "Los propios hombres del patriarca. La iglesia no puede decir que no se le haya pedido."

 # cc_byz_union.2 - Rome's terms
 cc_byz_union.2.title: "Los Términos de Roma"
 cc_byz_union.2.desc: "La respuesta es cortés, expansiva en el tema de la hermandad cristiana, y perfectamente clara una vez que se dejan de lado las cortesías.\n\nRoma aceptará la reunión sobre la base de que Roma siempre tuvo razón. El rito griego puede continuar. La posición griega no puede. Hay mucho lenguaje sobre respetar las venerables costumbres de las iglesias orientales, y nada en absoluto que sugiera que cualquier punto de doctrina esté abierto a discusión.\n\nEsta no es una posición irrazonable para que Roma la adopte. Simplemente no es una que pueda leerse en voz alta en esta ciudad."
 cc_byz_union.2.a: "Leerlo ante el sínodo tal cual está."
 cc_byz_union.2.b: "Haz que primero se traduzca generosamente."
 cc_byz_union.2.c: "Responde con nuestros propios términos."

 # cc_byz_union.10 - the council
 cc_byz_union.10.title: "El consejo se convoca"
 cc_byz_union.10.desc: "La delegación ha cruzado a Italia: obispos, el patriarca, teólogos y varios hombres cuya función es que se vea su presencia. Los latinos han proporcionado alojamiento, una asignación y un salón.\n\nEl primer asunto es la procesión del Espíritu Santo, que es donde cada intento previo se ha detenido. El credo latino dice que el Espíritu procede del Padre y del Hijo. El credo griego dice que procede del Padre. Cuatrocientos años de discusiones han establecido que ambas partes comprenden perfectamente la posición de la otra y ninguna puede concederla sin conceder quién tiene la autoridad para resolverlo."
 cc_byz_union.10.desc_reluctant: "La delegación ha cruzado a Italia y una buena parte de ella no quería venir. La asignación de los latinos está siendo percibida por hombres que pretenden votar en contra de todo lo que se pretendía fomentar, y todos los implicados lo saben.\n\nEl primer asunto es la procesión del Espíritu Santo. Es también, en la opinión privada de la mayor parte de la delegación griega, el último asunto, ya que no vinieron para ser persuadidos y se lo han dicho detalladamente unos a otros durante el viaje."
 cc_byz_union.10.a: "Conceda el filioque como redacción, no como doctrina."
 cc_byz_union.10.b: "Conceda también las hostias ácimas. El rito latino es válido."
 cc_byz_union.10.c: "Mantén ambas. Deja que Roma discuta por ellas."

 # cc_byz_union.11 - papal primacy
 cc_byz_union.11.title: "La Primacía"
 cc_byz_union.11.desc: "Todo lo demás era preliminar. La cuestión es si el obispo de Roma ostenta la autoridad sobre toda la iglesia, o el primer lugar de honor dentro de ella, y no hay redacción que satisfaga ambas interpretaciones significando algo.\n\nRoma ha sido paciente con el credo y con el pan porque a Roma no le importa particularmente el credo ni el pan. Este es el artículo por el que vinieron los latinos, y la delegación griega lo ha comprendido desde el primer día."
 cc_byz_union.11.desc_conceded: "Todo lo demás ha sido concedido, y la delegación está descubriendo ahora cuánto valía eso como posición negociadora, que es nada.\n\nLa cuestión es la primacía: la autoridad sobre toda la iglesia, o el primer lugar de honor dentro de ella. Habiendo cedido terreno en el credo y en el rito, los griegos llegan a este artículo sin ningún artículo restante para intercambiar, y los latinos han organizado el orden del día precisamente con eso en mente."
 cc_byz_union.11.a: "Reconócelo, salvaguardando los derechos de los patriarcas orientales."
 cc_byz_union.11.b: "Ofrecer una primacía de honor. Que acepten o rechacen."
 cc_byz_union.11.c: "Interrumpe la sesión. Esto no puede predicarse en Santa Sofía."

 # cc_byz_union.12 - signed
 cc_byz_union.12.title: "El Acta de Unión"
 cc_byz_union.12.desc: "Está firmado. Las campanas repican en las iglesias latinas, el decreto se lee en dos idiomas y se declara que el cisma ha terminado después de cuatrocientos once años.\n\nLa delegación griega firma y luego, casi al unísono, regresa a sus aposentos y no celebra. Varios de ellos ya están componiendo el relato que darán cuando lleguen a casa. Uno se ha negado rotundamente a firmar y los latinos han decidido, acertadamente, que es mejor no hacer un problema de ello."
 cc_byz_union.12.desc_bought: "Está firmado, por hombres a los que se les pagó por estar allí, y los latinos han notado cuáles de las firmas se pusieron con rapidez.\n\nEl decreto se lee en dos idiomas y se declara que el cisma ha llegado a su fin. La delegación griega se retira a sus aposentos sin ceremonias. Varios de ellos ya están redactando la explicación que darán en su tierra, y la explicación, en la mayoría de los casos, es que firmaron bajo coacción, en una ciudad extranjera, con una asignación latina, y que nada firmado en esas condiciones obliga a la iglesia."
 cc_byz_union.12.a: "Está hecho. Ahora hay que llevarlo a casa."

 # cc_byz_union.13 - collapse
 cc_byz_union.13.title: "El consejo se disuelve"
 cc_byz_union.13.desc: "No hay decreto. La delegación regresa a casa con sus gastos pagados y nada más resuelto, y los latinos están dando a conocer que los griegos recorrieron un camino muy largo para rechazar lo que ya se les había dicho que sería necesario.\n\nEn Constantinopla esto se informará como una defensa de la fe, y lo es. También es el fin, al menos para este reinado, de cualquier perspectiva de que una flota occidental llegue al Bósforo por razones que no sean el comercio."
 cc_byz_union.13.a: "La iglesia está intacta. Dilo en voz alta."
 cc_byz_union.13.b: "Mantener la legación en Italia. Esto se intentará de nuevo."

 # cc_byz_union.20 - promulgation
 cc_byz_union.20.title: "Promulgación en Santa Sofía"
 cc_byz_union.20.desc: "El decreto ha de leerse en la Gran Iglesia, en griego, ante el clero y el pueblo de la capital, y el Papa ha de ser conmemorado en la liturgia por su nombre.\n\nLa segunda parte es la que importa. Un documento firmado en Italia es un documento. Un nombre pronunciado en la liturgia en Santa Sofía es la iglesia diciéndolo, y cada persona en el edificio comprenderá la diferencia."
 cc_byz_union.20.desc_softened: "El decreto ha de leerse en la Gran Iglesia, en griego, y el Papa conmemorado en la liturgia por su nombre.\n\nHay una dificultad que aún no se ha hecho pública. El texto circulado internamente fue traducido con cierta generosidad, y el texto que ahora debe leerse es el que realmente fue firmado. Varios hombres en ese edificio han obtenido el latín. Han estado comparando los dos durante algunas semanas y han estado esperando exactamente esta ocasión."
 cc_byz_union.20.desc_hostile: "El decreto ha de leerse en la Gran Iglesia, y el estado de ánimo de la ciudad ha sido informado al palacio en términos que no dejan lugar a interpretaciones.\n\nLos monasterios se han pronunciado en contra. Sacerdotes en la capital han dicho públicamente que no conmemorarán al Papa y que no servirán con quienes lo hagan. Se le ha sugerido al emperador, por personas cuyo oficio es saber, que la lectura sea pospuesta. No hay fecha en la que fuera mejor recibida. Esa es la dificultad."
 cc_byz_union.20.a: "Leerlo. Que las objeciones se escuchen después."
 cc_byz_union.20.b: "Leerlo. Arrestar a quien interrumpa."
 cc_byz_union.20.c: "Leerlo tú mismo y responderles desde el ambón."

 # cc_byz_union.21 - reception
 cc_byz_union.21.title: "Lo que hizo la Ciudad"
 cc_byz_union.21.desc_rejected: "No ha cuajado. Se completó la lectura, que es lo máximo que se puede decir al respecto.\n\nLos monasterios han rechazado la unión rotundamente. La mayoría del clero parroquial de la capital no conmemorará al Papa, y las congregaciones han dejado claro a qué liturgia asistirán y de cuál se retirarán. Las iglesias donde se observa la unión se están vaciando. Las iglesias donde no se hace están llenas.\n\nEl acto es ley, pero no es la práctica de la iglesia en esta ciudad, y todo el mundo, incluido el emperador, sabe ahora que la diferencia es permanente."
 cc_byz_union.21.desc_accepted: "Ha cuajado, lo que sorprendió a varias personas que habían predicho extensamente lo contrario.\n\nLa lectura se completó, se conmemoró al Papa y las objeciones fueron planteadas por hombres que luego regresaron a sus iglesias y oficiaron la liturgia. Los monasterios están descontentos y lo han manifestado por escrito, extensamente, pero no han ido más allá. La ciudad ha decidido, en general, que una fórmula acordada por un concilio es asunto de los concilios.\n\nLa unión es la práctica de la iglesia aquí. Eso no ocurría desde antes de que la ciudad fuera saqueada."
 cc_byz_union.21.desc_divided: "Ha cuajado a medias, que es el destino habitual de tales cosas y lo más difícil de gobernar.\n\nAlgunas iglesias conmemoran al Papa y otras no. Algunos clérigos servirán con los unionistas y otros no, y los que no lo harán son, en general, los que tienen las congregaciones más numerosas. Los monasterios se han negado y no se les ha obligado a cumplir.\n\nNada se ha roto. Tampoco nada se ha asentado, y cada nombramiento en cada sede es ahora una decisión sobre la unión, independientemente de si el palacio lo pretende así o no."
 cc_byz_union.21.a: "Que así permanezca."

 # cc_byz_union.22 - the ferment
 cc_byz_union.22.title: "El fermento"
 cc_byz_union.22.desc: "La resistencia no ha disminuido y ha dejado de tratar sobre el filioque.\n\nLo que empezó como una objeción doctrinal entre teólogos es ahora la opinión común de la capital, y ha adquirido todos los demás agravios en su camino: los impuestos, los italianos en el puerto, los cargos que se compran y venden, la sensación general de que el palacio ha estado concediendo cosas durante un siglo y llamando a cada concesión necesaria. La unión es simplemente la que la gente puede nombrar."
 cc_byz_union.22.desc_forced: "Los arrestos no lo solucionaron. Rara vez lo hacen, y esta vez han proporcionado a la resistencia lo único que le faltaba: hombres a quienes señalar.\n\nSe habla del clero detenido en la promulgación en los monasterios en términos usualmente reservados para los confesores. Sus nombres son conocidos en parroquias que no tenían opinión sobre el filioque hace un año. Independientemente de los méritos de la unión, ahora es la bandera de cada agravio en la ciudad, y el palacio la puso allí."
 cc_byz_union.22.a: "Imponerlo. Privar a los objetores, nombrar unionistas."
 cc_byz_union.22.b: "Que se predique de ambas maneras."
 cc_byz_union.22.c: "Encontrar una sede distante para el más ruidoso de ellos."

 # cc_byz_union.30 - repudiation
 cc_byz_union.30.title: "Renunciando a la Unión"
 cc_byz_union.30.desc: "El acta debe ser renunciada. No existe un procedimiento para ello, ya que la unión fue acordada por un concilio general, por lo que la renuncia tomará la forma que el palacio le dé y el palacio afirmará que dicha forma es suficiente.\n\nRoma no estará de acuerdo. El acuerdo de Roma nunca estuvo disponible en este punto y perseguirlo solo retrasaría los asuntos."
 cc_byz_union.30.desc_failed: "El acta debe ser renunciada, y la única pregunta real es por qué ha tomado tanto tiempo.\n\nNo ha sido la práctica de la iglesia en esta ciudad desde el día en que se leyó. El clero no la observa, las congregaciones no asisten a donde se observa, y el palacio ha pasado años manteniendo una ficción legal que le cuesta su prestigio interno y no le ha reportado nada en el extranjero, ya que occidente puede ver perfectamente que la unión no está en vigor aquí.\n\nRenunciar a ella no cambia nada de lo que sucede en las iglesias. Cambia lo que el emperador finge."
 cc_byz_union.30.desc_held: "El acta debe ser renunciada, y esto es algo más difícil de lo que habría sido hace diez años, porque la unión cuajó.\n\nLas iglesias la observan. El clero ha hecho las paces con ella y una generación de ellos ha sido ordenada sin conocer otra cosa. Hay hombres que fueron persuadidos, a un costo personal, de que esto era lo correcto, y ahora se les dirá que el palacio ha cambiado de opinión.\n\nOccidente, mientras tanto, ha estado tratando al imperio como a un socio. Eso termina con el anuncio."
 cc_byz_union.30.a: "Renunciar a ello claramente. Que conste en el acta."
 cc_byz_union.30.b: "Renunciar a ello y culpar a los legados que firmaron."
 cc_byz_union.30.c: "Renunciar al texto. Mantener la embajada en Roma."

 # cc_byz_union.31 - the west reacts
 cc_byz_union.31.title: "Occidente Saca sus Conclusiones"
 cc_byz_union.31.desc: "La reacción no es de ira, con la cual se podría trabajar. Es la conclusión firme de que el imperio no puede cumplir lo que sus emperadores firman, y que cualquier cosa acordada en Italia será deshecha en Constantinopla por personas que el emperador no controla.\n\nLa consecuencia práctica es que las propuestas dejan de llegar. Nadie declara nada. La correspondencia simplemente se vuelve más corta, y luego formal, y luego ocasional, y los hombres que solían argumentar en Roma que valía la pena ayudar a los griegos han dejado de hacerlo porque perdieron."
 cc_byz_union.31.a: "Acéptalo. Mantenemos lo que mantenemos con lo que tenemos."
 cc_byz_union.31.b: "Mira hacia el este y el sur. A otros no les importa lo que prediquemos."

 # cc_byz_union.40 - the payoff
 cc_byz_union.40.title: "Para qué servía la Unión"
 cc_byz_union.40.desc: "La unión ha perdurado lo suficiente como para ser creíble, y la creencia ha producido resultados, algo que no podría haberse prometido al principio.\n\nHay dinero, recaudado en occidente para la defensa de la iglesia oriental, y realmente ha sido enviado en lugar de simplemente anunciado. Hay hombres: no un ejército, sino compañías de ellos, y capitanes a los que se les ha pagado para traerlos. Hay un legado papal en la capital que defiende la causa del imperio en sus cartas a casa en lugar de informar sobre sus deficiencias.\n\nNada de esto habría llegado para un cismático. Ese fue siempre el argumento, y aquí está, cumpliéndose."
 cc_byz_union.40.a: "Toma a los hombres y el dinero."
 cc_byz_union.40.b: "Pedirles que presionen nuestra reclamación sobre los asientos orientales."
 cc_byz_union.40.c: "Pedir al Papa que plantee el asunto de nuestras insignias."
