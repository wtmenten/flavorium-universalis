 MODIFIER_TYPE_DESC_cc_byz_oikeioi_impact_modifier: "Cuánto afecta la [bureaucracy|e] al [country|e]."

 # Country modifiers
 STATIC_MODIFIER_NAME_cc_byz_staffed_by_career_clerks: "Funcionarios de Carrera"
 STATIC_MODIFIER_DESC_cc_byz_staffed_by_career_clerks: "Los puestos son asalariados y los hombres que los ocupan deben su posición al cargo más que a una familia."
 STATIC_MODIFIER_NAME_cc_byz_offices_are_property: "Los Cargos son Propiedad"
 STATIC_MODIFIER_DESC_cc_byz_offices_are_property: "Los puestos se heredan y se venden como algo habitual. Nadie decretó esto. La corona sigue recaudando, pero ya no decide quién sirve."
 STATIC_MODIFIER_NAME_cc_byz_retrenched_bureaus: "Oficinas Reducidas"
 STATIC_MODIFIER_DESC_cc_byz_retrenched_bureaus: "Menos puestos, aún asalariados, aún de la corona."

 # cc_byz_bureaucracy.1 - staffing a new bureau
 cc_byz_bureaucracy.1.title: "Dotación de la Nueva Oficina"
 cc_byz_bureaucracy.1.desc: "La oficina existe en el pergamino. Ahora necesita hombres.\n\nLos [ROOT.GetCountry.GetGovernment.GetEstateName('burghers_estate')] pueden suministrar escribanos que han pasado su vida aprendiendo las formas y pasarán el resto de ella aplicándolas. Las grandes familias tienen hijos que necesitan puestos y han dejado saber que esperan ser solicitados. Ambas rutas llenan los escritorios. Los llenan con hombres que responden a personas diferentes."
 cc_byz_bureaucracy.1.desc_venal: "La oficina existe en el pergamino. Ahora necesita hombres, y la cuestión de cómo se llenan los puestos ya no es un tema abierto.\n\nTodo aquel que tenga asuntos ante el palacio ya sabe cuánto cuesta un puesto y, aproximadamente, a quién acudir. Los escribanos también lo saben. Lo único que queda por decidir es si la tesorería toma su parte abiertamente o se lo deja a los hombres que la tomarán de todos modos."
 cc_byz_bureaucracy.1.desc_purged: "La oficina existe en el pergamino y los escritorios están vacíos, lo cual no es un accidente. Los hombres que se sentaban en ellos fueron removidos, y la manera de su remoción aún se discute en los barrios donde viven los escribanos.\n\nLas grandes familias tienen hijos disponibles y se muestran notablemente condescendientes al respecto. Los hombres asalariados también están disponibles y preguntan, a través de intermediarios, qué garantías existen de que una carrera en el servicio sea realmente una carrera. No hay una buena respuesta para esa pregunta. El palacio se aseguró de ello."
 cc_byz_bureaucracy.1.a: "Oficinistas asalariados. La oficina debe sobrevivir al hombre."
 cc_byz_bureaucracy.1.b: "Las grandes familias tienen hijos a quienes colocar."
 cc_byz_bureaucracy.1.c: "Vende los cargos. El tesoro bien puede llevarse su parte."

 # cc_byz_bureaucracy.10 - dissolving a bureau
 cc_byz_bureaucracy.10.title: "Se disuelve una oficina"
 cc_byz_bureaucracy.10.desc: "La oficina está cerrada. Sus registros van al archivo, sus habitaciones a quien pregunte primero y su personal a ninguna parte en particular.\n\nNo son un gran número de hombres. Son, sin embargo, un número de hombres que saben precisamente cómo funciona el palacio, que tienen familias que alimentar y que ahora están disponibles."
 cc_byz_bureaucracy.10.desc_sold: "La oficina está cerrada, lo que plantea una pregunta que nadie quiere poner por escrito: estos hombres pagaron por sus puestos.\n\nNo compraron un salario. Compraron un derecho, y tienen muy claro que el derecho era sobre el imperio y no sobre un conjunto particular de habitaciones. Querrán que se respete en otro lugar."
 cc_byz_bureaucracy.10.a: "Encontrarles puestos en otros lugares del servicio."
 cc_byz_bureaucracy.10.b: "Agradéceles y despídelos."
 cc_byz_bureaucracy.10.c: "Haz un ejemplo con el peor de ellos."

 # cc_byz_bureaucracy.20 - underfunded bureaus
 cc_byz_bureaucracy.20.title: "No se está pagando a las oficinas"
 cc_byz_bureaucracy.20.desc: "Los salarios llevan meses de retraso y el trabajo no se ha detenido, lo cual debería ser tranquilizador y no lo es.\n\nUn funcionario no remunerado no se va a casa. Se queda en su escritorio y encuentra otra manera de ser compensado por estar sentado en él, y los hombres que acuden a ese escritorio aprenden rápidamente cuál es el nuevo acuerdo. Para cuando el tesoro se ponga al día, el acuerdo será la costumbre, y la costumbre en este imperio es muy difícil de derogar."
 cc_byz_bureaucracy.20.a: "Pagarlos. Cueste lo que cueste."
 cc_byz_bureaucracy.20.b: "Se las arreglarán. Siempre lo hacen."
 cc_byz_bureaucracy.20.c: "Menos puestos, financiados adecuadamente."

 # cc_byz_bureaucracy.30 - palace service against the army
 cc_byz_bureaucracy.30.title: "El palacio y los comandantes"
 cc_byz_bureaucracy.30.desc: "La disputa es sobre un contrato de suministros y no se trata de un contrato de suministros.\n\nLos eunucos del servicio del palacio señalan, con acierto, que las cuentas no cuadran y que los hombres que las firmaron son los mismos que se benefician. Los comandantes señalan, también con acierto, que ellos serán quienes estén en la fila cuando termine la rendición de cuentas, y que nunca han sido reforzados por un libro de contabilidad.\n\nAmbos esperan ver con cuál de ellos está dispuesto el emperador a mostrarse de acuerdo."
 cc_byz_bureaucracy.30.a: "Las cuentas cuadrarán. Asegúrate de ello."
 cc_byz_bureaucracy.30.b: "A los hombres que luchan se les debe el beneficio de la duda."
 cc_byz_bureaucracy.30.c: "No digas nada. Deja que se pregunten."

 # cc_byz_bureaucracy.40 - entrenched and unfunded
 cc_byz_bureaucracy.40.title: "Una oficina que se autofinancia"
 cc_byz_bureaucracy.40.desc: "La oficina no ha sido financiada adecuadamente en años y no ha disminuido ni en un solo escribano, lo que debería haber planteado una pregunta en la tesorería mucho antes de ahora.\n\nSe responde con bastante facilidad. Los hombres que están en ella cobran, simplemente no nos pagan a nosotros. Se cobran tasas por servicios que antes eran gratuitos, y las tasas son recaudadas por una familia cuyo nombre no aparece en nada y cuyo consentimiento es requerido para todo. La oficina sigue haciendo su trabajo. Ya no lo hace para el emperador."
 cc_byz_bureaucracy.40.desc_venal: "La oficina no ha sido financiada adecuadamente en años y no ha disminuido ni en un solo escribano, y a estas alturas nadie en el palacio finge sorprenderse.\n\nLo único nuevo es la confianza. La familia que la dirige ha dejado de ocultar el acuerdo y ha empezado a defenderlo, basándose en el razonable argumento de que han mantenido el trabajo en marcha a sus propias expensas mientras la tesorería no lo hacía. No se equivocan. Esa es la dificultad."
 cc_byz_bureaucracy.40.a: "Financiarlo adecuadamente. Es nuestro o no es de nadie."
 cc_byz_bureaucracy.40.b: "Desmóntalo y dispersa a los escribas."
 cc_byz_bureaucracy.40.c: "Véndeles el cargo directamente."

 # cc_byz_bureaucracy.50 - entrenched and funded
 cc_byz_bureaucracy.50.title: "Una oficina que funciona"
 cc_byz_bureaucracy.50.desc: "Los salarios llegan a tiempo, los registros están donde dice el índice y los hombres que entraron como escribientes novatos siguen allí treinta años después sin ambición de estar en ningún otro lugar.\n\nNo es un logro dramático y ninguna crónica lo registrará. Pero una solicitud que entra en esta oficina recibe respuesta, y se responde de la misma manera independientemente de quién pregunte, lo cual es más de lo que puede decirse de la mayoría de los tratos del imperio con sus propios súbditos."
 cc_byz_bureaucracy.50.a: "Reorganizar las demás oficinas para que coincidan."
 cc_byz_bureaucracy.50.b: "Que su reputación haga el trabajo."
 cc_byz_bureaucracy.50.c: "Una oficina tan segura solo responde ante sí misma. Flexibilízala."

 # cc_byz_bureaucracy.60 - a funding cut lands
 cc_byz_bureaucracy.60.title: "Se anuncia el recorte"
 cc_byz_bureaucracy.60.desc: "La reducción se decidió en una tarde y se comprenderá en una semana.\n\nNadie dimite. El trabajo continúa, al principio exactamente como antes, y luego de la manera en que el trabajo no remunerado continúa en todas partes: los asuntos urgentes siguen moviéndose, y los asuntos que se mueven son aquellos que alguien tiene una razón para impulsar. Nadie informará de esto y todo el mundo se adaptará a ello."
 cc_byz_bureaucracy.60.a: "No hay nada que hacer."
 cc_byz_bureaucracy.60.b: "Anúncialo como una reforma."

 # Label for the entrenchment factor in bureaucracy modifier tooltips. Referenced as
 # desc = "CC_BYZ_ENTRENCHMENT_SCALE" inside the scale multiply blocks in
 # in_game/common/bureaucracies/. Without it the tooltip renders "missing key".
 CC_BYZ_ENTRENCHMENT_SCALE: "Atrincheramiento"
 cc_byz_bureaucracy.21.title: "Las tasas son ahora la costumbre"
 cc_byz_bureaucracy.21.desc: "Fue una medida temporal y han pasado doce años.\n\nLa oficina cobra por lo que antes hacía de forma natural. Los cargos no son secretos, ni irregulares, ni están escritos en ninguna parte: simplemente se conocen, de la misma manera que se conoce el precio del pan, y un escriba que no los cobrara sería visto por sus colegas como un hombre que quiere llamar la atención.\n\nUna delegación de ellos ha venido al palacio para pedir, con gran respeto, que el acuerdo se regularice. No están pidiendo permiso. Están pidiendo un baremo de tarifas, porque la incertidumbre actual es mala para todos."
 cc_byz_bureaucracy.21.desc_deep: "Fue una medida temporal y han pasado doce años, y ya no es la única.\n\nLa oficina cobra por lo que antes hacía de forma natural, al igual que otras tres, a tarifas que han convergido sin que nadie las coordinara. Un hombre con asuntos en el palacio sabe ahora cuánto le costará antes de partir, lo cual los escribas consideran una mejora considerable en la transparencia.\n\nLa delegación que pide un baremo de tarifas es más grande que la última vez e incluye a dos hombres cuyos padres ocuparon los mismos escritorios."
 cc_byz_bureaucracy.21.a: "Derogarlo. Todo."
 cc_byz_bureaucracy.21.b: "Entonces el tesoro tomará su parte."
 cc_byz_bureaucracy.21.c: "No decir nada y dejar que se asiente."
 cc_byz_bureaucracy.60.c: "Restaurar la financiación. El recorte fue un error."
 cc_byz_bureaucracy.61.title: "El coste del corte"
 cc_byz_bureaucracy.61.desc: "La oficina sigue existiendo. Sigue respondiendo cartas, y las cartas se siguen respondiendo con precisión, lo cual nunca fue la preocupación.\n\nLo que ha cambiado es que las responde en un orden. Una petición de una familia con un pariente en el servicio avanza; una petición de un extraño espera, y no hay ninguna regla al respecto ni nadie que pueda demostrar haber tomado una decisión. Los hombres a los que se podría haber preguntado al respecto se fueron hace años, cuando cesaron los salarios, y los hombres que los reemplazaron llegaron a una oficina que ya funcionaba de esta manera.\n\nEl recorte se anunció en una tarde. Deshacerlo es un proyecto de años, y el emperador que lo ordenó ha muerto."
 cc_byz_bureaucracy.61.a: "Reconstruirlo. Adecuadamente y desde el principio."
 cc_byz_bureaucracy.61.b: "Funciona. Déjalo como está."
 STATIC_MODIFIER_NAME_cc_byz_bureaus_paid_in_full: "Atrasos liquidados"
 STATIC_MODIFIER_DESC_cc_byz_bureaus_paid_in_full: "Salarios al día, puestos ocupados por hombres que se los deben al cargo. Lo único en el imperio que revierte la venalidad de forma fiable, y es caro porque tiene que serlo."
 STATIC_MODIFIER_NAME_cc_byz_fees_became_custom: "Tasas cobradas por servicios gratuitos"
 STATIC_MODIFIER_DESC_cc_byz_fees_became_custom: "La oficina encontró sus propios ingresos. Nadie lo decretó y nadie podrá derogarlo en una tarde."
 STATIC_MODIFIER_NAME_cc_byz_office_farmed_out: "El cargo arrendado"
 STATIC_MODIFIER_DESC_cc_byz_office_farmed_out: "El puesto pertenece ahora a otra persona y la corona cobra el alquiler de su propia administración. Paga. Y además es permanente."
