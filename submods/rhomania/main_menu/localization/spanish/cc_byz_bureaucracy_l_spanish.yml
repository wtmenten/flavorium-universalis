l_spanish:
 # Bureaucracies
 cc_byz_genikon: "Logothesion tou Genikou"
 cc_byz_genikon_desc: "La tesorería general: evaluación, recaudación, auditoría. Emplea a más hombres que cualquier otra oficina del palacio y ninguno de ellos es famoso. Cada uno de los demás instrumentos de la autoridad imperial se paga con lo que esta oficina logra recaudar."
 cc_byz_epi_ton_deeseon: "Epi tōn Deēseōn"
 cc_byz_epi_ton_deeseon_desc: "El Maestro de Peticiones. Una oficina permanente a través de la cual un agricultor en Tracia puede apelar más allá del hombre que posee su valle, directamente al palacio. Es inexpensive de establecer y se resiente exactamente en proporción a lo bien que funciona."
 cc_byz_oikeioi: "Los Oikeioi"
 cc_byz_oikeioi_desc: "Los hombres del propio emperador: íntimos de la corte a quienes se les han entregado mandos provinciales basándose en el favor personal más que en el cargo. Las decisiones llegan rápido y las personas adecuadas siempre están localizables. También enseña a todo hombre ambicioso del imperio que la proximidad al emperador prima sobre cualquier título que pueda ganar."

