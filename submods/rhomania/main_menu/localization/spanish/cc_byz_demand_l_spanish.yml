l_spanish:
 # cc_byz_exarch.10 - the prompt
 cc_byz_exarch.10.title: "¿Quién gobierna Italia?"
 cc_byz_exarch.10.desc: "El territorio italiano está en manos imperiales y se está administrando, a decir verdad, mediante despachos. Los despachos tardan seis semanas en cada sentido.\n\nLa objeción práctica ha sido planteada por los funcionarios responsables, quienes señalan que se les pide resolver disputas entre señores italianos cuyos nombres no saben pronunciar, basándose en pruebas de hace tres meses, en una tradición legal que ninguno de ellos ha estudiado. Lo están haciendo mal y así lo dicen.\n\nLa antigua respuesta a este problema era un exarca: un hombre, sobre el terreno, que ostentara la autoridad civil y militar conjuntamente, decidiendo en nombre del emperador sin preguntar primero. Funcionó durante ciento cincuenta años y luego dejó de funcionar, de una manera que los archivos registran con cierto detalle."
 cc_byz_exarch.10.desc_rome: "Roma ha sido recuperada, y el imperio está descubriendo que poseer Roma y gobernar Roma son problemas distintos.\n\nLa ciudad tiene un obispo con sus propios tribunales, una nobleza con sus propias disputas, una población acostumbrada a no ser administrada por ninguno de los dos, y un conjunto de costumbres legales que preceden a la reconquista por varios siglos. Los funcionarios imperiales enviados para dirigirla son hombres competentes que se están ahogando, y han escrito para decirlo en términos notablemente menos deferentes de lo habitual.\n\nLa respuesta antigua era un exarca, asentado en Rávena o en la propia ciudad, ostentando la autoridad civil y militar conjuntamente. Todos en el palacio conocen el precedente. Todos saben también cómo terminó ese precedente."
 cc_byz_exarch.10.a: "Un administrador. Plazos cortos y nada propio."
 cc_byz_exarch.10.b: "Un gobernador eficaz. Dejad que realmente lo gestione."
 cc_byz_exarch.10.c: "Un strategos. El mando civil y militar unidos."
 cc_byz_exarch.10.d: "Gobernarlo desde aquí. Tenemos funcionarios para esto."

 # cc_byz_demand.1 - the request
 cc_byz_demand.1.title: "La petición del Exarca"
 cc_byz_demand.1.desc: "El exarca ha escrito solicitando que ciertos distritos italianos, aún administrados directamente desde Constantinopla, pasen a estar bajo su autoridad.\n\nLa carta es cuidadosa y el argumento es bueno. Los distritos limitan con los suyos, son administrados a seis semanas de distancia por hombres que nunca los han visto, y sus ingresos apenas cubren el coste de recaudarlos. No está pidiendo nada con lo que el imperio esté ganando dinero.\n\nTambién ha establecido, sin decirlo, que ahora escribe al palacio sobre las fronteras de su propio cargo en lugar de sobre la gestión del mismo."
 cc_byz_demand.1.desc_persistent: "El exarca ha vuelto a escribir sobre los distritos italianos, y esta no es la segunda vez.\n\nLos argumentos son los mismos y siguen siendo buenos, lo que en parte hace que la correspondencia sea tediosa. Lo que ha cambiado es el tono: las cartas anteriores preguntaban, y esta describe un acuerdo que sería sensato y espera saber si el palacio está de acuerdo.\n\nEl escribano que archiva estas cartas ha empezado a guardarlas juntas en un solo fajo. Nadie se lo ordenó."
 cc_byz_demand.1.desc_hostile: "El exarca ha escrito sobre los distritos italianos, y la carta ha sido leída tres veces en el palacio debido a lo que no contiene.\n\nNo hay ninguna petición en ella. Hay un relato de cómo se administran actualmente los distritos, una evaluación de cómo podrían administrarse mejor y un párrafo final expresando confianza en que el emperador verá el asunto como él lo ve. Es la carta de un hombre que ha dejado de considerar que la respuesta esté en duda.\n\nSu propia lealtad ha estado en duda durante algún tiempo. Esto no resuelve la cuestión a su favor."
 cc_byz_demand.1.desc_after_seizure: "El exarca ha escrito para solicitar ciertos distritos italianos, y el palacio ha tenido que revisar los registros para establecer cuáles no posee ya.\n\nLa carta cumple con todas las formalidades. Pregunta, expone razones, se remite al juicio del emperador y se refiere a territorios adyacentes a distritos que sus oficiales empezaron a recaudar hace algunos años sin preguntar a nadie. La cortesía es deliberada y no va dirigida al emperador: es para el registro, para que lo que ocurra a continuación pueda describirse como una concesión.\n\nSe ofrece a dejar que el palacio mantenga la apariencia de decidir. Esa es la propuesta real."
 cc_byz_demand.1.a: "Recházalo. Los distritos se administran desde aquí."
 cc_byz_demand.1.b: "Concederlos. Él los gobierna mejor que nosotros."
 cc_byz_demand.1.c: "Recházalo, y haz que parezca una cuestión de tierras en lugar de un desaire."
 cc_byz_demand.1.d: "Darle los ingresos. Mantener la autoridad."

 # cc_byz_demand.2 - the argument
 cc_byz_demand.2.title: "El Exarca expone sus razones"
 cc_byz_demand.2.desc: "El exarca ha dejado de escribir cartas y ha redactado un documento.\n\nEs un memorando sobre la administración de Italia: histórico, bien documentado y silenciosamente devastador. Expone qué era el exarcado bajo Justiniano y sus sucesores, qué autoridad ejercían sus titulares y cómo se compara con la disposición actual. La comparación no es favorecedora para la disposición actual, y no pretende serlo.\n\nSe han enviado copias al palacio. El palacio nota que también se han enviado copias a varias otras personas."
 cc_byz_demand.2.desc_precedent: "El exarca ha redactado un memorando sobre la administración de Italia, y el pasaje más efectivo es aquel que cita la propia concesión del emperador.\n\nYa se le habían otorgado distritos anteriormente. El documento trata esa concesión como si hubiera establecido un principio en lugar de resolver un caso, y razona a partir de ello con cierto cuidado: si esos distritos se administraban mejor desde Roma, y así fue, entonces el argumento se aplica al resto exactamente con la misma lógica.\n\nEs un buen argumento. Es un buen argumento porque se basa en algo que el palacio hizo, que es la dificultad de los precedentes."
 cc_byz_demand.2.a: "Concederlo. Italia se administra desde Roma."
 cc_byz_demand.2.b: "Recházalo, usando la misma forma pública que él utilizó."
 cc_byz_demand.2.c: "Recuérdalo por ello."

 # cc_byz_demand.3 - he stopped asking
 cc_byz_demand.3.title: "Dejó de preguntar"
 cc_byz_demand.3.desc: "Los oficiales del exarca están recaudando en los distritos en disputa. Lo han estado haciendo durante dos temporadas. El palacio se enteró por una declaración de impuestos que no llegó.\n\nNo hubo proclama ni incautación. Sus hombres ya eran la autoridad más cercana, las guarniciones habían sido suyas durante años y, en algún momento, los funcionarios locales simplemente empezaron a informar al hombre que estaba allí realmente. Cuando se planteó la discrepancia, respondió con prontitud y cortesía, expresando sorpresa de que el acuerdo no se hubiera formalizado antes.\n\nLas opciones del imperio son una guerra en Italia que actualmente no puede financiar, o un documento. Él ha estado razonablemente seguro de ello durante algún tiempo."
 cc_byz_demand.3.a: "Ratifícalo. Llámalo una concesión y salva las apariencias."
 cc_byz_demand.3.b: "Negarse a reconocerlo. Que los registros permanezcan."
