 cc_byz_west_pf_cooldown_tt: "Esta provincia fue gestionada de esta manera recientemente"
 cc_byz_west_pf_needs_loyal_tt: "La lealtad del exarca es al menos 1"
 cc_byz_west_succ_resist_tt: "Es posible que la provincia prefiera al hijo. Si es así, el nuevo exarca pierde #R 2#! de lealtad y la autonomía occidental aumenta en #R 5#!. Partiendo de un 30%, esto es #G menos probable#! con un candidato capaz (160+ puntos de capacidad, aún más a partir de 200+) o un control imperial de 60+, o si el exarca fallecido era leal (2+). Es #R más probable#! con un candidato débil (menos de 120), una autonomía occidental de 60+, un cargo hereditario o un exarca desleal (-2 o inferior). Un candidato de 180+ que sea aceptado comienza con #G 1#! de lealtad."

