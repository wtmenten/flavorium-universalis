 # ---- Per-prefecture actions ----
 cc_byz_west_pf_donative_italy: "Pagar las guarniciones de Rávena"
 cc_byz_west_pf_donative_italy_desc: "Pagar los atrasos de las guarniciones de esta provincia. Un tercio del coste de la donativa completa, por una provincia.\n\nEl exarca gana #G 2#! de lealtad y el control imperial aumenta en #G 1#!."
 cc_byz_west_pf_honours_italy: "Conceder un título cortesano al exarca de Rávena"
 cc_byz_west_pf_honours_italy_desc: "Convertir al exarca en patrikios, o en magistros si ya lo es. Al emperador le costará prestigio y el oeste no ganará más influencia.\n\nEl exarca gana #G 2#! de lealtad y pierde #G 1#! de ambición."
 cc_byz_west_pf_confirm_son_italy: "Confirmar al hijo del exarca de Rávena"
 cc_byz_west_pf_confirm_son_italy_desc: "Confirmar al hijo del exarca como su sucesor. El cargo pasa a ser de su familia.\n\nEl exarca gana #G 3#! de lealtad. La autonomía occidental aumenta en #R 8#! y el imperio se inclina hacia los Dynatoi. La primera confirmación sentará un precedente que citarán todos los demás exarcas."
 cc_byz_west_pf_strategos_italy: "Enviar un Strategos a Rávena"
 cc_byz_west_pf_strategos_italy_desc: "Enviar un general y sus hombres a esta provincia. El exarca gana tradición militar y mano de obra.\n\nLa autonomía occidental aumenta en #R 5#!: un general en el oeste tiene tropas que lo conocen."
 cc_byz_west_pf_recall_italy: "Convocar al Exarca de Rávena"
 cc_byz_west_pf_recall_italy_desc: "Ordenar a este exarca que se dirija a la capital. Que acuda dependerá de su lealtad y de si su cargo se ha vuelto hereditario para su familia."
 cc_byz_west_pf_charter_italy: "Otorgar una carta de comuna en Rávena"
 cc_byz_west_pf_charter_italy_desc: "Conceder una carta municipal a una ciudad. El comercio y los burgueses se benefician, y el exarca gana #G 1#! de lealtad.\n\nLa autonomía occidental aumenta en #R 6#!. La primera carta será el precedente que citen todas las demás comunas."
