l_spanish:
 # Hint entries for the submod's two situations.
 #
 # Both keys are required per hint tag: <tag> is the title shown in the hints list, and
 # <tag>_hint_text is the body.
 #
 # TITLES ARE WRITTEN OUT RATHER THAN RESOLVED THROUGH GetSituationByKey, which is what vanilla
 # does here (hints_l_english.yml:652). Two reasons to depart from it. CWTools reports the
 # command as undefined, and while that is probably just an incomplete schema, the submod has
 # already been bitten once by assuming a vanilla precedent guarantees a token resolves from our
 # call site: religion_percentage_in_country_greater_or_equal is a real vanilla key whose
 # TARGET_RELIGION token does not populate when called our way, and it errored in game while
 # looking correct. A situation title is two words and never changes. Not worth the class of
 # risk to save typing them.

 hint_cc_byz_the_west: "El oeste"
 hint_cc_byz_the_west_hint_text: "Las prefecturas son provincias gobernadas con gobernadores propios, y el problema del emperador es que ambos hechos son ciertos a la vez.\n\nDos medidas lo rastrean, y son independientes en lugar de opuestas. El #T Agarre imperial#! es cuánto está sosteniendo realmente el imperio. La #T Autonomía occidental#! es cuánto preferiría el oeste ser dejado en libertad. Ambas pueden ser altas simultáneamente, y esa combinación es de donde surge la revuelta.\n\nEl consistorio es donde se decide. El emperador vota tres como Augusto, un exarca senior vota dos, cada uno de los demás exarcas vota uno. Con una prefectura no puede perder. Con cuatro, es superado en votos por el cuerpo que él mismo construyó.\n\nLa situación se resuelve antes de la Era de las Revoluciones en todos los casos, de una forma u otra."

 hint_cc_byz_mamluk_confrontation: "La confrontación levantina"
 hint_cc_byz_mamluk_confrontation_hint_text: "El imperio y el Sultanato de El Cairo se enfrentan por lugares sagrados que ambos reclaman, mientras las repúblicas italianas venden a ambos y prestan a ambos.\n\n#T Puede resolverse sin una guerra.#! Un condominio escrito sobre los lugares sagrados es un final real, y requiere que el imperio no haya pasado las décadas intermedias presionando la frontera. La presión levantina es la cifra que decide qué rutas permanecen abiertas.\n\nEl otro camino es la Guerra de la Pentarquía, por Jerusalén, Antioquía y Alejandría. Esos tres, junto con Constantinopla y Roma, son los cinco patriarcados, y poseer los cinco es lo que requiere reparar el cisma."
