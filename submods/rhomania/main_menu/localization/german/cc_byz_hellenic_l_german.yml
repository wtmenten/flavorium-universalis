 # ---- Modifiers ----
 STATIC_MODIFIER_NAME_cc_byz_old_learning: "Das alte Wissen"
 STATIC_MODIFIER_DESC_cc_byz_old_learning: "Ein Haus, ein Stipendium und der Name des Kaisers über der Tür. Die Männer, die dort lesen, werden in die Kanzleien gehen, und sie werden zuvor Platon gelesen haben."
 STATIC_MODIFIER_NAME_cc_byz_antiquarian_licence: "Die Antiquare entfesselt"
 STATIC_MODIFIER_DESC_cc_byz_antiquarian_licence: "Ihnen wurde gesagt, dem Argument zu folgen, wohin auch immer es führe. Einige von ihnen haben dies wörtlich genommen, und der Klerus hat begonnen, Notizen zu machen."
 STATIC_MODIFIER_NAME_cc_byz_the_apostasy: "Die Apostasie"
 STATIC_MODIFIER_DESC_cc_byz_the_apostasy: "Es gibt dafür in jeder Kanzlei der Christenheit ein Wort, und sie alle verwenden es. Niemand vergisst, und niemand muss daran erinnert werden."
 STATIC_MODIFIER_NAME_cc_byz_edict_of_toleration: "Das Toleranzedikt"
 STATIC_MODIFIER_DESC_cc_byz_edict_of_toleration: "Beide Altäre bleiben bestehen, und keiner ist Angelegenheit des Staates. Die Magistrate wissen wieder, was zu tun ist, was im Grunde der wichtigste Punkt war."
 STATIC_MODIFIER_NAME_cc_byz_temples_restored: "Die Heiligtümer wiederhergestellt"
 STATIC_MODIFIER_DESC_cc_byz_temples_restored: "Imperiales Geld, imperiale Maurer und Steine, die aus Mauern zurückgeholt wurden, in denen sie sechshundert Jahre verbracht hatten. Es kostete so viel wie ein Krieg und es kann nicht besteuert werden."
 STATIC_MODIFIER_NAME_cc_byz_two_altars: "Zwei Altäre"
 STATIC_MODIFIER_DESC_cc_byz_two_altars: "Zwei Kalender, zwei Prozessionen und ein Stadtpräfekt, der zweimal im Jahr eine Straße sperrt und nichts Besonderes dabei sieht."
 STATIC_MODIFIER_NAME_cc_byz_emperors_own_rite: "Das eigene Ritual des Kaisers"
 STATIC_MODIFIER_DESC_cc_byz_emperors_own_rite: "Er opfert am Palastschrein und das Reich nicht. Von allen verstanden, von niemandem ausgesprochen, und es wird nicht über ihn hinausbestehen."
 STATIC_MODIFIER_NAME_cc_byz_perm_pontifex: "Pontifex Maximus"
 STATIC_MODIFIER_DESC_cc_byz_perm_pontifex: "Oberhaupt der Brückenbauer, und niemand hat jemals den Namen erklärt. Die Riten des Reiches stehen im Ermessen des Kaisers."

