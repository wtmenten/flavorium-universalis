l_german:
 # The old rites: the Hellenic thread.
 #
 # See in_game/events/cc_byz_hellenic.txt for the arc's shape and why it exists. Briefly: Fate
 # of the Phoenix ships a complete, supported route out of Orthodoxy and the submod had assumed
 # Orthodoxy in 341 places, so converting broke six mission tasks and left the union arc
 # negotiating with Rome on behalf of a church the emperor had left.
 #
 # VOICE. This is a court that has watched something it has no vocabulary for. Nobody in these
 # texts calls it paganism and nobody calls it a reformation; they call it what happened, and
 # they are careful. The mechanics live in the option tooltips and the modifier descriptions,
 # not in the event bodies.
 #
 # HISTORICAL FOOTING. Gemistos Plethon really did teach at Mistra in this period, really did
 # write a code of law invoking the Olympian gods, and his book really was burned by Patriarch
 # Gennadios after his death. Julian is the other precedent and every Byzantine reader knew his
 # name. Neither is quoted directly, because attributing an invented line to a real man is the
 # one thing this file will not do.

 # ---- .1  The Academy reopened ----
 cc_byz_hellenic.1.title: "Das alte Wissen"
 cc_byz_hellenic.1.desc: "In Mistra gibt es einen Mann, der jedem Platon lehrt, der die Reise auf sich nimmt, und eine überraschend hohe Zahl tut dies. Er ist vorsichtig. Er spricht von den Alten als Alten und von der Kirche als Kirche, und in dreißig Jahren konnte niemand einen Satz von ihm aufschreiben, der vor einer Synode hätte gebracht werden können.\n\nSeine Schüler sind weniger vorsichtig, und einige von ihnen befinden sich nun im Palast.\n\nWas verlangt wird, ist wenig: ein Haus, ein Stipendium und der Name des Kaisers über der Tür. Was darunter gefragt wird, ist, ob das Reich tausend Jahre seines eigenen Erbes als ein Erbe oder als eine Versuchung betrachtet, die es überlebt hat."
 cc_byz_hellenic.1.a: "Die Philosophie ist unser Gebiet. Die Theologie die der Kirche."
 cc_byz_hellenic.1.b: "Lassen wir sie dem Argument folgen, wohin es auch führt."
 cc_byz_hellenic.1.c: "Wir haben genug Bibliotheken. Schließ sie."

 # ---- .10  The rupture ----
 cc_byz_hellenic.10.title: "Die Religion des Kaisers"
 cc_byz_hellenic.10.desc: "Es geschah nicht an einem Tag, und es wird so besprochen, als wäre es der Fall.\n\nZuerst wusste es das Hauspersonal, dann die Garde, dann die Männer, die die Kapellen hüten, und als der Patriarch informiert wurde, gab es nichts mehr, was man ihm hätte sagen können. Er schrie nicht. Er fragte zweimal, ob er richtig verstanden habe, und dann ging er dazu über, Briefe zu schreiben.\n\nDraußen hat die Stadt noch nicht entschieden, was sie denkt. Das ist die einzige Gnade an dieser Sache, und sie wird die Saison nicht überdauern."
 cc_byz_hellenic.10.desc_after_union: "Zweimal in einer Regierungszeit.\n\nBeim ersten Mal stand der Kaiser in der Großen Kirche und ließ die Union mit Rom laut vorgelesen, und die Stadt nannte ihn einen Lateiner und Schlimmeres. Was auch immer sie ihn damals nannten, zumindest stritten sie darüber, welcher Kirche er angehörte.\n\nJetzt ist niemand mehr verwirrt. Die Männer, die gegen die Union kämpften, und die Männer, die sie unterzeichneten, haben entdeckt, dass sie sich in einer Sache einig sind, was in zweihundert Jahren sonst nichts geschafft hat. Sie sind sich über ihn einig."
 cc_byz_hellenic.10.desc_returned: "Die Kapellen sind geöffnet. Die Lampen sind entzündet. Der Patriarch, der nach allem zu urteilen damit gerechnet hatte, im Exil zu sterben, und dementsprechend Vorkehrungen getroffen hatte, empfing die Nachricht im Stehen und sagte eine ganze Weile lang gar nichts.\n\nWas getan wurde, ist nicht ungeschehen. In den Provinzen gibt es Männer, die dem Kaiser sein Wort glaubten und ihr Leben darauf aufbauten, und denen nun gesagt wurde, dass das Wort sich geändert hat. Das Reich wird einige Jahre brauchen, um herauszufinden, wie viele von ihnen es sind."
 cc_byz_hellenic.10.a: "Es ist vollbracht. Lassen Sie sie sagen, was sie wollen."

 # ---- .20  The edict ----
 cc_byz_hellenic.20.title: "Was das Gesetz nun besagt"
 cc_byz_hellenic.20.desc: "Die Frage ist nicht, was der Kaiser glaubt. Das hat jeder nach seiner eigenen Zufriedenheit geklärt, und keine Proklamation wird daran etwas ändern.\n\nDie Frage ist, was das Gesetz über alle anderen sagt, und das Gesetz schweigt derzeit auf eine Weise, die kostspielig wird. Magistrate schreiben und fragen, welche Eide bindend sind. Zwei Gouverneure haben Prozesse ausgesetzt, anstatt zu raten. Ein Steuerpächter in Bithynien hat sich geweigert zu zahlen, mit der Begründung, dass er nicht mehr wisse, an wen.\n\nEtwas muss schriftlich festgehalten werden, und was auch immer aufgeschrieben wird, wird ein Jahrhundert lang als das gelesen werden, was der Kaiser gemeint hat."
 cc_byz_hellenic.20.a: "Beide Altäre bleiben bestehen. Keiner ist Angelegenheit des Staates."
 cc_byz_hellenic.20.b: "Die Stiftungen folgen dem Ritus des Kaisers."
 cc_byz_hellenic.20.c: "Das Patriarchat ist zu einem rivalisierenden Hof geworden. Beende es."

 # ---- .21  The temples ----
 cc_byz_hellenic.21.title: "Die Heiligtümer"
 cc_byz_hellenic.21.desc: "Landvermesser sind aus Delphi, Olympia und Eleusis zurückgekehrt, und ihre Berichte stimmen im Wesentlichen überein.\n\nDer Stein ist größtenteils vorhanden. Er befindet sich in den Mauern der Dörfer, in den Kirchen, in einer Brücke außerhalb von Megara, über die seit sechshundert Jahren Karren fahren. Das Orakel von Delphi ist ein Bauernhof, und der Bauer war höflich gegenüber den Landvermessern, hat aber Fragen zur Entschädigung. In Olympia hat sich der Fluss verlagert und das meiste davon begraben, was der einzige Grund ist, warum das meiste davon überdauert hat.\n\nNichts davon liegt außerhalb der Reichweite des Reiches. Alles kostet so viel wie ein Krieg und bringt nichts hervor, was besteuert werden kann."
 cc_byz_hellenic.21.desc_suppressed: "Landvermesser sind aus Delphi, Olympia und Eleusis zurückgekehrt, und die Berichte entsprechen den Erwartungen: Der Stein befindet sich in den Mauern der Dörfer und Kirchen, und ihn herauszuholen bedeutet, diese auseinanderzunehmen.\n\nDas ist nun eine geringere Schwierigkeit als zuvor. Seit die Patriarchatsfrage geklärt wurde, haben die Männer, die Einspruch erhoben hätten, Gründe gefunden, dies nicht zu tun, und mehrere Bischöfe haben Materialien angeboten, noch bevor jemand danach gefragt hatte.\n\nDie Landvermesser vermerken dies am Rand ohne Kommentar. Sie waren sorgfältig darauf bedacht, nichts zu schreiben, was in zwei Richtungen gelesen werden könnte."
 cc_byz_hellenic.21.a: "Baue sie ordnungsgemäß wieder auf. Die Schatzkammer wird schon eine Lösung finden."
 cc_byz_hellenic.21.b: "Die Städte dürfen ihre eigenen Götter auf eigene Kosten ehren."
 cc_byz_hellenic.21.c: "Die Riten erfordern keine Gebäude."

 # ---- .22  The reaction ----
 cc_byz_hellenic.22.title: "Die Stadt antwortet"
 cc_byz_hellenic.22.desc: "Es begann nicht als Aufstand. Es begann als Prozession, was dieser Stadt schon immer erlaubt war, und die Route war die gewohnte, bis sie es nicht mehr war.\n\nSie fordern nicht die Abdankung des Kaisers. Einige von ihnen tun es, und das sind diejenigen, mit denen die Garde fertig wird. Der Rest stellt eine schwierigere Frage und stellt sie in einer Form, in der niemand verhaftet werden kann: Sie gehen einfach in Zahlen zur Kirche, wie man sie seit Generationen nicht mehr gesehen hat, an Tagen, die keine Feiertage sind, in Vierteln, die es längst aufgegeben hatten.\n\nEine Stadt kann nicht gezwungen werden, nicht mehr zur Kirche zu gehen. Der Kaiser hat genug Geschichte gelesen, um zu wissen, wie man sich an den letzten Mann erinnert, der es versuchte."
 cc_byz_hellenic.22.desc_funded: "Das Geld hat es getan.\n\nSolange die Heiligtümer eine Proklamation waren, konnte die Stadt sich einreden, der Kaiser würde einer Vorliebe nachgehen, wie Kaiser es tun. Dann begannen die Wagen mit kaiserlichem Silber in den Westen zu ziehen, und die Abrechnungen wurden im Hippodrom von jemandem laut vorgelesen, der sie beschafft hatte, und das Argument drehte sich nicht mehr um die Seele des Kaisers, sondern um die Getreideverteilung.\n\nSie haben ausgerechnet, was die Tempel kosten. Sie haben ausgerechnet, was man sonst hätte kaufen können. Jemand war sehr sorgfältig darin, sicherzustellen, dass sie beides ausrechneten."
 cc_byz_hellenic.22.desc_furious: "Es gibt Viertel dieser Stadt, die die Garde nur noch in Gruppen oder gar nicht mehr betritt.\n\nEin Diakon wurde am Chalke-Tor getötet; von wem, ist umstritten und wird es bleiben, und er wurde dreimal in drei verschiedenen Berichten über das Geschehene begraben. Die Version, die sich verbreitet, lässt ihn die Menge segnen, während er fiel. Niemand, der dabei war, sagt dies. Es spielt keine Rolle mehr, was jemand sagt, der dabei war.\n\nDer Patriarch, oder der Mann, den die Menge Patriarch nennt, wurde seit elf Tagen nicht gesehen und ist wahlweise in Trebizond, in einer Zisterne oder zur Rechten des Kaisers und hat alle verraten."
 cc_byz_hellenic.22.a: "Lassen wir sie ihre Kirchen behalten. So werden sie den Frieden wahren."
 cc_byz_hellenic.22.b: "Brecht es. Jetzt und vollständig."
 cc_byz_hellenic.22.c: "Genug. Die Riten gehören dem Kaiser allein und niemand anderem."

 # ---- .23  What was settled ----
 cc_byz_hellenic.23.title: "Die Einigung"
 cc_byz_hellenic.23.desc_tolerated: "Eine Generation später ist das, was niemand vorhergesehen hat, wie gewöhnlich es geworden ist.\n\nEs gibt zwei Kalender in der Hauptstadt, und jeder behält den bei, mit dem er aufgewachsen ist. Die Tempel haben Gemeinden, kleiner als die Kirchen und besser finanziert. Zweimal im Jahr kreuzen sich die Prozessionen, und der Präfekt der Stadt sperrt eine Straße; das ist nun einfach etwas, das der Präfekt der Stadt tut.\n\nDas Reich verbrachte elfhundert Jahre in dem Glauben, diese Anordnung sei unmöglich. Es hat sich herausgestellt, dass sie lediglich unbequem ist."
 cc_byz_hellenic.23.desc_suppressed: "Es ist still, und Stille war es, was gewünscht wurde.\n\nDas Patriarchat ist ein Amt aus der Gabe des Kaisers, besetzt durch einen Mann, der die Bedingungen versteht. Die großen Klöster wurden entweder durch Stiftungen zum Gehorsam geführt oder durch Leere zum Gehorsam gezwungen. In den Dörfern sagen die Priester, was sie schon immer gesagt haben, und die Männer des Kaisers sind zu dem Schluss gekommen, dass die Verfolgung der Dörfer mehr kostet, als die Dörfer wert sind.\n\nWas gewonnen wurde, ist real, und die Kosten sind an keiner einzigen Stelle verzeichnet. Sie finden sich in den Steuerlisten, in den Rekrutierungsberichten und in einer Generation fähiger Männer, die in die Kirche eintraten, weil die Alternative der Dienst beim Kaiser war."
 cc_byz_hellenic.23.desc_private: "Der Kaiser opfert am Palastschrein, das Reich jedoch nicht.\n\nHier ist es im Allgemeinen dabei geblieben. Der Hof ist vorsichtig, die Kirche ist auf eine Weise dankbar, die eine gewisse Schärfe besitzt, und die Vereinbarung wird von allen verstanden, aber von niemandem ausgesprochen. Botschafter werden darüber instruiert, welche Kapelle sie zu besuchen haben.\n\nSein Nachfolger wird dies nicht fortsetzen. Das weiß jeder, auch er selbst, und es hat seine Meinung an nichts geändert."
 cc_byz_hellenic.23.a: "Lassen Sie es so stehen."

 # ---- .30  The ferment ----
 cc_byz_hellenic.30.title: "Predigten in den Vierteln"
 cc_byz_hellenic.30.desc: "Ein Mönch, von dem vor einem Monat noch niemand gehört hatte, zieht Menschenmengen am Forum des Ochsen an, und was er sagt, ist nicht gerade aufreizend. Er predigt über die Regierungszeit Julians. Er nennt die Daten, die Feldzüge, die Briefe und den Tod in Persien mit einunddreißig Jahren ohne Erben, und er erwähnt nicht ein einziges Mal den derzeitigen Kaiser.\n\nEr muss es nicht. Die Menge tut dies für ihn, auf dem Heimweg, in den Weinläden, bis hinunter zum Hafen."
 cc_byz_hellenic.30.a: "Sende die Garde zum Forum."
 cc_byz_hellenic.30.b: "Finden Sie heraus, was das Viertel will, und bezahlen Sie es."
 cc_byz_hellenic.30.c: "Lassen wir den Patriarchen antworten. Er versteht es besser als wir."

 # ---- Mission tasks ----
 cc_byz_task_academy: "Die Akademie wurde wiedereröffnet"
 cc_byz_task_academy_desc: "Justinian schloss 529 die Schulen in Athen und die Philosophen gingen nach Persien, wo der König sie freundlich empfing und sie von ihm enttäuscht waren.\n\nDie Bücher gingen nicht mit ihnen. Sie waren die ganze Zeit über in dieser Stadt, kopiert von Mönchen, die jeder Zeile widersprachen und sie trotzdem genau kopierten, was die seltsamste Güte in der Geschichte des Reiches ist."
 cc_byz_task_old_rites: "Die alten Riten"
 cc_byz_task_old_rites_desc: "Im neunten Jahrhundert gab es Opfergaben auf der Halbinsel Mani, vierhundert Jahre nachdem das Reich aufgehört hatte, heidnisch zu sein, und die Männer, die darüber berichteten, waren sich nicht sicher, ob sie empört sein oder es einfach gut sein lassen sollten.\n\nSie ließen es gut sein. Es ist bemerkenswert, wie vieles das Reich immer einfach gut sein ließ."
 cc_byz_task_temples: "Die Heiligtümer wiederhergestellt"
 cc_byz_task_temples_desc: "Delphi, Eleusis, Olympia.\n\nPausanias wanderte zu allen drei Orten und schrieb auf, was er sah, und er schrieb bereits über eine Welt, die sich schloss: Tempel ohne Priester, Feste, die von drei alten Männern gefeiert wurden, ein Orakel, das Fragen beantwortete, die niemand mehr stellte. Er ist der Grund, warum es möglich ist, sie wieder aufzubauen. Er schrieb alles auf, weil er sah, dass es schwindet."
 cc_byz_task_pontifex: "Pontifex Maximus"
 cc_byz_task_pontifex_desc: "Der Titel gehörte vierhundert Jahre lang dem Kaiser, und kein christlicher Kaiser gab ihn voreilig auf. Gratian war der Erste, der ihn im Jahr 382 ablehnte, und der Senat nahm dies so schlecht auf, dass er noch ein Jahrzehnt später darüber klagte.\n\nEs bedeutet „Oberster der Brückenbauer“. Niemand konnte dies jemals zufriedenstellend erklären, nicht einmal die Römer."

