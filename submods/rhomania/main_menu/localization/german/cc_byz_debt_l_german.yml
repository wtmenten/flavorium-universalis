l_german:
 # Country modifiers
 STATIC_MODIFIER_NAME_cc_byz_customs_conceded: "Zölle eingeräumt"
 STATIC_MODIFIER_DESC_cc_byz_customs_conceded: "Eine ausländische Republik besitzt eine schriftliche Befreiung von den Zöllen der Hauptstadt. Der Handel ist nicht eingebrochen. Er fließt lediglich nicht mehr über die Schatzkammer, wenn er an ihr vorbeizieht."
 STATIC_MODIFIER_NAME_cc_byz_creditors_wary: "Gläubiger sind vorsichtig"
 STATIC_MODIFIER_DESC_cc_byz_creditors_wary: "Die Bankhäuser Italiens haben die Konten des Reiches abgeglichen und das Ergebnis bewertet. Geld ist immer noch zu bekommen. Es kostet mehr und es gibt weniger davon."
 STATIC_MODIFIER_NAME_cc_byz_sound_credit: "Solide Kreditwürdigkeit"
 STATIC_MODIFIER_DESC_cc_byz_sound_credit: "Die Zinsen wurden am Fälligkeitstag vollständig bezahlt, ohne Bitte um neue Konditionen. Das ist teuer, aber es ist seinen Preis wert."
 STATIC_MODIFIER_NAME_cc_byz_revenue_farmed: "Verpachtete Einnahmen"
 STATIC_MODIFIER_DESC_cc_byz_revenue_farmed: "Die Steuern des nächsten Jahres wurden bereits in diesem Jahr verkauft. Das Geld kam einmalig an. Die Männer, die das Recht erwarben, steuern ein, solange der Vertrag läuft, behalten die Differenz und sind niemandem im Palast rechenschaftspflichtig."
 STATIC_MODIFIER_NAME_cc_byz_hereditary_farm: "Erbhof"
 STATIC_MODIFIER_DESC_cc_byz_hereditary_farm: "Das Recht auf Einzug ist an einen Sohn übergegangen. Niemand hat es gewährt und niemand hat es angefochten. Die Familien, die die Verträge halten, behandeln sie nun wie Landbesitz, und sie irren sich nicht."
 STATIC_MODIFIER_NAME_cc_byz_debt_repudiated: "Schulden verworfen"
 STATIC_MODIFIER_DESC_cc_byz_debt_repudiated: "Eine Schuld wurde durch kaiserliche Autorität für nichtig erklärt. Die Autorität war ausreichend. Die Folge ist, dass kein Haus in Italien innerhalb des lebenden Gedächtnisses erneut zu den alten Bedingungen leihen wird."
 STATIC_MODIFIER_NAME_cc_byz_fiscal_retrenchment: "Fiskalische Sparmaßnahmen"
 STATIC_MODIFIER_DESC_cc_byz_fiscal_retrenchment: "Ausgabenkürzungen, bezahlte Rückstände, die Steuerbewertung von Grund auf neu erstellt. Langsam, in jedem relevanten Kreis unbeliebt und die einzige Methode, die jemals funktioniert hat."
 STATIC_MODIFIER_NAME_cc_byz_crowned_without_regalia: "Gekrönt ohne die Insignien"
 STATIC_MODIFIER_DESC_cc_byz_crowned_without_regalia: "Die bei der Krönung verwendete Krone war vergoldetes Glas. Die Originale befinden sich in einem venezianischen Gewölbe. Jeder in der Kirche wusste es, und die Zeremonie verlief so, als hätten sie es nicht gewusst."

 # Opinion modifiers
 cc_byz_creditor_privilege: "Besitzt imperiale Privilegien"
 cc_byz_rival_privilege_granted: "Unserem Rivalen gewährte Privilegien"
 cc_byz_bought_out_creditors: "Unsere Schulden wurden abgelöst"
 cc_byz_holds_pledged_territory: "Besetzt unser verpfändetes Territorium"
 cc_byz_pledge_redeemed: "Haben ihr Gelübde eingelöst"
 cc_byz_repudiated_debt: "Haben ihre Schulden bei uns zurückgewiesen"
 cc_byz_creditor_syndicate: "Hat als Syndikat gegen uns gehandelt"
 cc_byz_holds_tax_farm: "Farms our Revenue"

 # cc_byz_debt.1 - the first Italian loan
 cc_byz_debt.1.title: "Die Kreditbedingungen"
 cc_byz_debt.1.desc: "Das Geld ist verfügbar. Es ist bereits seit einiger Zeit verfügbar, und die Faktoren, die das Angebot überbringen, waren sorgfältig darauf bedacht, klarzustellen, dass es aus Rücksicht auf das Reich und nicht in Erwartung eines Gewinns angeboten wird.\n\nDer Zinssatz ist angemessen. Er wird noch angemessener, wenn die Vereinbarung bestimmte kleine Zugeständnisse bezüglich der Zölle beinhaltet, welche die Faktoren erst spät im Gespräch erwähnen, wie ein nachträglicher Gedanke, nachdem sie ihn geprobt haben."
 cc_byz_debt.1.desc_venal: "Das Geld ist verfügbar, und die Männer, die das Angebot überbringen, haben bereits zuvor in dieser Stadt Geschäfte gemacht. Sie wissen, welche Beamten ein Dokument vorantreiben werden und was es kostet, es voranzutreiben.\n\nDer Zinssatz ist angemessen, und er verbessert sich, wenn bestimmte Zugeständnisse bezüglich der Zölle enthalten sind. Sie drängen nicht auf diesen Punkt. Sie haben gelernt, dass es in Konstantinopel selten notwendig ist, einen Punkt zweimal zu betonen."
 cc_byz_debt.1.a: "Zahle den Zinssatz. Gib nichts nach."
 cc_byz_debt.1.b: "Nehmen Sie die besseren Bedingungen. Eine Zollangelegenheit kostet heute nichts."
 cc_byz_debt.1.c: "Ablehnen. Das Geld kann hier aufgebracht werden."

 # cc_byz_debt.2 - the customs exemption
 cc_byz_debt.2.title: "Die schriftliche Befreiung"
 cc_byz_debt.2.desc: "Was eine bloße Gefälligkeit war, ist nun die Bitte um ein Dokument. Die Republik wünscht die Befreiung unter Siegel und auf Dauer festgeschrieben, damit die Angelegenheit nicht von zukünftigen Beamten erneut geprüft werden muss, die möglicherweise weniger gut informiert sind.\n\nDie beteiligte Summe ist nicht groß. Der Präzedenzfall ist das eigentliche Problem, und beide Parteien wissen das ebenfalls."
 cc_byz_debt.2.desc_cordial: "Das Verhältnis war gut, und die Republik führt dies ausführlich aus, bevor sie zum Punkt kommt. Der Punkt ist ein Dokument: Die Befreiung, besiegelt und auf Dauer festgelegt, damit künftige Beamte eine Höflichkeit nicht mit einem Zugeständnis oder ein Zugeständnis mit einer Höflichkeit verwechseln können.\n\nSie haben den bereits entworfenen Text mitgebracht. Es ist ein kurzer Text."
 cc_byz_debt.2.a: "Besiegle es. Für die Ewigkeit."
 cc_byz_debt.2.b: "Ablehnen. Die Zölle stehen ihnen nicht zu, um sie zu gewähren."
 cc_byz_debt.2.c: "Fünfundzwanzig Jahre, und kein Jahr mehr."

 # cc_byz_debt.3 - the island pledge
 cc_byz_debt.3.title: "Sicherheit gegen die Schulden"
 cc_byz_debt.3.desc: "Die Gläubiger haben eine Sicherheit vorgeschlagen. Keine Zahlung: ein Pfand, das gegen die Schulden gehalten wird und bei Rückzahlung vollständig zurückgegeben wird. Sie schlagen eine Insel vor, und sie haben eine ganz bestimmte im Sinn, und sie haben sie schon länger im Sinn, als dieses Gespräch dauert.\n\nVerpfändetes Territorium wird zurückgegeben, wenn die Schulden getilgt sind. Die Bilanz solcher zurückgegebenen Pfänder ist nicht ermutigend."
 cc_byz_debt.3.a: "Verpfände es. Die Schuld ist getilgt."
 cc_byz_debt.3.b: "Zahle in Münzen. Die Insel ist kein Zahlungsmittel."
 cc_byz_debt.3.c: "Lassen wir sie kommen und es selbst einsammeln."

 # cc_byz_debt.4 - the creditors compare notes
 cc_byz_debt.4.title: "Die Gläubiger gleichen ihre Notizen ab"
 cc_byz_debt.4.desc: "Bisher hat jede Republik einzeln mit dem Palast verhandelt, was der Hauptvorteil des Reiches in diesen Angelegenheiten war: Was die eine nicht leihen wollte, tat die andere, und keine von ihnen kannte den Zinssatz der anderen.\n\nSie haben sich getroffen. Sie haben Zahlen ausgetauscht. Nun kennen sie die Gesamtsumme der Schulden, die höher ist, als jeder von ihnen einzeln vermutet hätte, und sie sind gemeinsam zum Palast gekommen."
 cc_byz_debt.4.desc_conceded: "Bisher hat jede Republik einzeln mit dem Palast verhandelt, und die einer gewährte Zollbefreiung wurde von den anderen in einer Weise missmutig betrachtet, die man ausnutzen konnte.\n\nSie haben sich getroffen. Sie haben die Befreiung mit ihren eigenen Bedingungen verglichen, dann die Bedingungen mit der Gesamtsumme der Schulden, und sind zu einer Zahl gelangt, die keiner von ihnen einzeln für möglich gehalten hätte. Sie sind gemeinsam zum Palast gekommen und haben diese Zahl mitgebracht."
 cc_byz_debt.4.a: "Kaufen Sie die Rädelsführer aus, egal zu welchen Kosten."
 cc_byz_debt.4.b: "Konsolidieren Sie. Lassen Sie sie die Bücher prüfen."
 cc_byz_debt.4.c: "Gib einem von ihnen das, was die anderen wollen."

 # cc_byz_debt.5 - what the quarter became
 cc_byz_debt.5.title: "Das Viertel gegenüber am Wasser"
 cc_byz_debt.5.desc_captured: "Die Abrechnung ist abgeschlossen und sie besagt das, was sie schon immer sagen würde. Die Zölle der Hauptstadt werden von Männern eingezogen, die diese an einen Rat in einer anderen Stadt übermitteln. Das Viertel gegenüber am Wasser hat seine eigenen Mauern, seine eigenen Gerichte und eine Garnison, die nicht die des Kaisers ist.\n\nNichts wurde kampflos aufgegeben. Jeder Schritt war eine vernünftige Antwort auf eine reale Schwierigkeit, und die Summe der vernünftigen Antworten ist eine fremde Stadt, die am gegenüberliegenden Ufer des Hafens steht und den Schiffsverkehr beobachtet."
 cc_byz_debt.5.desc_free: "Die Abrechnung ist abgeschlossen. Die Schulden wurden zum vereinbarten Satz am vereinbarten Tag zurückgezahlt, die Ausnahmen wurden abgelehnt, und die Faktoren, die das Geld befördern, sind zu dem Schluss gekommen, dass Konstantinopel ein teurer, aber zuverlässiger Ort für Kredite ist.\n\nDie Zuverlässigkeit wurde mit gewissen Kosten erkauft. Die Zölle werden immer noch von den Männern des Kaisers eingezogen, und das hat sich als jede Zahlung wert gewesen zu haben erwiesen, die pünktlich geleistet wurde."
 cc_byz_debt.5.desc_mixed: "Die Abrechnung ist abgeschlossen und das Bild ist gemischt, was der übliche Zustand solcher Dinge ist. Einige Ausnahmen bleiben bestehen und einige sind hinfällig. Die Faktoren leihen immer noch Geld und streiten immer noch über den Zinssatz.\n\nDas Viertel gegenüber am Wasser ist gewachsen. Es ist noch nicht zu einer eigenständigen Einheit geworden, und ob dies geschieht, ist noch nicht geklärt."
 cc_byz_debt.5.a: "Vermerke es im Register."

 # cc_byz_debt.10 - the coronation
 cc_byz_debt.10.title: "Eine Krönung ohne Krone"
 cc_byz_debt.10.desc: "Die Regalien befinden sich in Venedig, zurückgehalten als Pfand für eine Schuld, die nicht getilgt wurde, und es soll eine Krönung stattfinden.\n\nDer Zeremonienmeister hat die Schwierigkeit mit den vorsichtigsten Formulierungen angesprochen, die ihm zur Verfügung standen. Kopien können angefertigt werden. Sie können gut angefertigt werden, in Blattgold und farbigem Glas, und aus einer Entfernung von zwanzig Schritten bei Kerzenschein werden sie nicht von dem unterscheidbar sein, was sie ersetzen. Er sagt nicht, was sie aus nächster Nähe sein werden oder für die Männer, die am nächsten stehen – jene Männer, deren Meinung über die Zeremonie am wichtigsten ist."
 cc_byz_debt.10.a: "Gold und Glas. Die Zeremonie geht weiter."
 cc_byz_debt.10.b: "Überhaupt keine Krone. Lass die Abwesenheit für sich sprechen."
 cc_byz_debt.10.c: "Machen wir den Verlust zum Thema der Ansprache."

 # cc_byz_debt.11 - the clergy on Latin creditors
 cc_byz_debt.11.title: "Der Klerus zum Thema der Gläubiger"
 cc_byz_debt.11.desc: "Eine in der Hauptstadt gehaltene Predigt wurde dem Palast gemeldet, und der Bericht war gründlich, da der Prediger es genau darauf anlegte.\n\nSein Thema waren die Insignien: dass die Symbole der römischen Kaiser in einem lateinischen Gewölbe gegen das Hauptbuch eines Kaufmanns verpfändet sind, und dass ein Thron, der seine eigene Krone nicht auslösen kann, prüfen sollte, was er sonst noch bereitwillig verpfändet hat. Er nannte weder die Union noch die Ausnahmen oder irgendetwas anderes. Er musste es nicht. Die Gemeinde ergänzte dies von selbst."
 cc_byz_debt.11.desc_customs: "Eine in der Hauptstadt gehaltene Predigt wurde dem Palast gemeldet, und dieses Mal nannte der Prediger die Dinge beim Namen.\n\nEr nannte die Insignien im venezianischen Gewölbe. Er nannte die Zollbefreiung, das Viertel auf der anderen Seite des Wassers und die Tatsache, dass ein Mann nun in dieser Stadt unter einer fremden Gerichtsbarkeit stehen und dem Kaiser, in dessen Hafen er steht, nichts zahlen kann. Er fragte, was noch zu verpfänden bliebe, beantwortete die Frage selbst, und die Gemeinde stimmte der Antwort zu."
 cc_byz_debt.11.a: "Stimme ihm zu. Öffentlich."
 cc_byz_debt.11.b: "Erinnere ihn daran, dass er das Geld nicht angeboten hat."
 cc_byz_debt.11.c: "Bitten Sie die Kirche, die Rückzahlung zu finanzieren."

 # cc_byz_debt.13 - a generation later
 cc_byz_debt.13.title: "Immer noch in Venedig"
 cc_byz_debt.13.desc: "Der Schreiber, der den Jahresbericht erstellt, hat die Regalien in das Verzeichnis des verpfändeten Eigentums eingetragen, wie es sein Vorgänger tat und der davor. Der Eintrag wurde lange genug ohne Kommentar übernommen, dass die Handschrift, in der er zuerst geschrieben wurde, in der Kanzlei nicht mehr verwendet wird.\n\nNiemand hat beschlossen, nicht mehr zu versuchen, sie auszulösen. Es gab keine Debatte und keine Anweisung. Der Posten wanderte über drei Regierungszeiten einfach von der Liste der Dinge, die zurückgefordert werden müssen, auf die Liste der Dinge, die nun einmal so sind, und die Männer, die dem Palast dienen, haben den offensichtlichen Schluss daraus gezogen, was sonst noch auf dieser Liste verschiebbar sein könnte."
 cc_byz_debt.13.a: "Kopieren Sie es erneut weiter."

 # cc_byz_debt.20 - selling revenue forward
 cc_byz_debt.20.title: "Einnahmen des nächsten Jahres"
 cc_byz_debt.20.desc: "Die Schatzkammer benötigt jetzt Geld und wird später Geld haben, und es gibt Männer, die die zweite Bedingung gegen die erste zu einem Abschlag eintauschen werden, den sie für fair halten.\n\nDer Mechanismus ist alt und gut bekannt. Eine Summe wird heute in die Schatzkammer gezahlt. Im Gegenzug zieht der Käufer für eine bestimmte Anzahl von Jahren die Steuern eines Distrikts ein und behält alles, was er über das hinaus extrahieren kann, was er bezahlt hat. Die Summe trifft sofort ein. Die Extraktion ist das Problem eines anderen, in einem Distrikt, den der Hof nicht besuchen wird, von Menschen, die keine Möglichkeit haben zu berichten, was man mit ihnen macht."
 cc_byz_debt.20.desc_war: "Das Heer ist im Feld und das Heer muss bezahlt werden, doch die Schatzkammer besitzt nur das, was sie besitzt.\n\nEs gibt Männer, die die Summe heute vorstrecken werden, gegen das Recht, die Steuern eines Distrikts für eine bestimmte Anzahl von Jahren einzuziehen. Alles, was sie über den gezahlten Betrag hinaus eintreiben, behalten sie selbst. Jeder im Raum versteht, dass die Bedingungen in Friedenszeiten besser wären und dass das Reich nicht in der Lage ist, auf Friedenszeiten zu warten – und die Männer, die das Angebot machen, verstehen es am besten."
 cc_byz_debt.20.a: "Verkaufe es an die Bürger."
 cc_byz_debt.20.b: "Verkaufe es an die Italiener. Sie zahlen mehr."
 cc_byz_debt.20.c: "Verkaufe nichts. Kürze stattdessen die Ausgaben."

 # cc_byz_debt.21 - how the farmers collect
 cc_byz_debt.21.title: "Wie die Bauern einsammeln"
 cc_byz_debt.21.desc: "Die Verträge werden eingehalten. Die Summen treffen am fälligen Tag ein und die Konten stimmen überein, was der einzige Test ist, den der Palast angewandt hat.\n\nBerichte beginnen über andere Wege einzutreffen. Die Steuereintreiber nehmen bereits vor der Festsetzung Geld ein, nehmen Naturalien, wo Münzen knapp sind, und nehmen von denselben Dörfern zweimal, mit dem Argument, dass die erste Erhebung für ein anderes Jahr war. Es gibt kein Verfahren für einen Bauern, dies anzufechten, da der Mann, bei dem er es anfechten würde, das Recht erworben hat, dort zu sein."
 cc_byz_debt.21.a: "Zügle sie. Der Vertrag ist weniger wert als das Umland."
 cc_byz_debt.21.b: "Das Geld kommt pünktlich an. Das war die Prüfung."
 cc_byz_debt.21.c: "Hänge einen von ihnen dort auf, wo die anderen ihn sehen können."

 # cc_byz_debt.22 - the farm becomes heritable
 cc_byz_debt.22.title: "Der Vertrag geht auf einen Sohn über"
 cc_byz_debt.22.desc: "Ein Steuerpächter ist gestorben und sein Sohn hat die Einziehung fortgesetzt. Es wurde keine Konzession erteilt. Kein Beamter wurde gefragt. Der Sohn erschien einfach in denselben Dörfern mit derselben Eskorte, und die Dörfer zahlten, da aus ihrer Sicht die Vereinbarung in keiner Weise geändert wurde, auf die sie reagieren könnten.\n\nDer Palast wurde aus Höflichkeit informiert. Die Formulierung der Mitteilung macht deutlich, dass keine Antwort erwartet wird."
 cc_byz_debt.22.desc_venal: "Ein Steuerpächter ist gestorben und sein Sohn hat die Einziehung fortgesetzt, was niemanden in einer Kanzlei überrascht, in der Posten seit einer Generation auf dieselbe Weise weitergegeben werden.\n\nDer Palast wurde aus Höflichkeit informiert. Der Schreiber, der die Mitteilung erhielt, legte sie ab, ohne sie weiterzuleiten, in der vernünftigen Ansicht, dass die Dinge nun einfach so ablaufen, und er wurde nicht korrigiert."
 cc_byz_debt.22.a: "Erkenne es an. Verlange eine Gebühr für die Charta."
 cc_byz_debt.22.b: "Kaufen Sie die Verträge zurück, zu jedem Preis."
 cc_byz_debt.22.c: "Machen wir die Steuereintreiber zu besoldeten Beamten."

 # cc_byz_debt.30 - the payment cannot be made
 cc_byz_debt.30.title: "Die Zahlung wird fällig"
 cc_byz_debt.30.desc: "Die Rate ist diesen Monat fällig und die Schatzkammer kann sie nicht aufbringen. Dies ist kein Streit über die Summe oder das Datum. Das Geld ist nicht da, und die Beamten, die es normalerweise finden würden, wurden befragt und haben nichts vorzuschlagen, was nicht bereits versucht wurde.\n\nDer Faktor des Gläubigers ist in der Stadt und hat um eine Audienz für den Tag nach dem Fälligkeitsdatum gebeten, was eine Höflichkeit ist – und eine bewusste."
 cc_byz_debt.30.desc_grip: "Die Rate ist diesen Monat fällig und die Schatzkammer kann sie nicht aufbringen; zudem hat der Faktor des Gläubigers nicht um eine Audienz gebeten, weil er sie nicht mehr erbitten muss.\n\nEr war in dieser Saison bereits dreimal im Palast wegen Angelegenheiten des Einzugs. Er kennt den Zustand der Konten besser als mehrere Männer, die dafür bezahlt werden, ihn zu kennen. Wenn die Zahlung ausbleibt, wird er nicht überrascht sein, und die Bedingungen, die er danach anbieten wird, wurden eher vor dem Zahlungsausfall als als Reaktion darauf entworfen."
 cc_byz_debt.30.desc_again: "Die Rate ist diesen Monat fällig und die Schatzkammer kann sie nicht aufbringen, und dies ist bereits geschehen, was die Art der Diskussion verändert.\n\nBeim ersten Mal behandelten die Gläubiger eine versäumte Zahlung als eine Schwierigkeit und schrieben die Schulden unter dieser Annahme um. Dieselbe Annahme werden sie nicht zweimal treffen. Ein einzelner Zahlungsausfall ist ein schlechtes Jahr. Ein zweiter ist eine Beschreibung des Zustands, und die diesmal angebotenen Bedingungen werden an der Beschreibung und nicht am Jahr gemessen."
 cc_byz_debt.30.a: "Hungern Sie die Ämter aus. Die Schulden sind beglichen."
 cc_byz_debt.30.b: "Bitten Sie sie, es neu zu schreiben."
 cc_byz_debt.30.c: "Die Schulden sind hinfällig. Lasst sie Petitionen einreichen."
 cc_byz_debt.30.d: "Überzeuge sie, die Forderung unverändert zu verlängern."

 # cc_byz_debt.31 - the new terms
 cc_byz_debt.31.title: "Die neuen Bedingungen"
 cc_byz_debt.31.desc: "Sie sind bereit. Sie wären ohnehin bereit gewesen, denn eine Schuld, die zu ihrem Zinssatz neu geschrieben wird, ist für sie wertvoller als eine Schuld, die gar nicht bedient wird.\n\nDer von ihnen vorgeschlagene Zinssatz ist hoch. Sie schlagen jedoch im selben Atemzug und im gleichen Ton eine Alternative vor: einen niedrigeren Satz, sofern die Eintreibung von einem Faktor ihrer Wahl beaufsichtigt wird, der in der Hauptstadt ansässig ist und Zugang zu den Registern hat. Das zweite Angebot ist das, das sie angenommen wissen wollen."
 cc_byz_debt.31.a: "Nehmen Sie den höheren Satz. Unsere Register bleiben unser Eigentum."
 cc_byz_debt.31.b: "Nehmen Sie den niedrigeren Satz. Lassen Sie ihren Mann die Bücher einsehen."

 # cc_byz_debt.32 - the creditors act as one
 cc_byz_debt.32.title: "Ein Syndikat von Gläubigern"
 cc_byz_debt.32.desc: "Die Republiken streiten über alles und haben über die Schulden des Reiches gestritten, solange es welche gab. Über diese eine haben sie aufgehört zu streiten.\n\nEine Schuld, die durch imperiale Autorität für nichtig erklärt wurde, ist kein kommerzieller Streit zwischen einem Hause und einem Hof. Es ist eine Frage darüber, ob das Wort des Kaisers ihn bindet, und jeder Geldgeber in Italien hat ein Interesse daran, dass die Antwort 'Nein' lautet. Sie haben sich auf die Antwort geeinigt. Der Kredit ist in allen drei Städten zu den gleichen Bedingungen geschlossen, was etwas ist, das ihnen zuvor nie gelungen ist."
 cc_byz_debt.32.a: "Halte es aus. Wir werden nichts von ihnen kaufen."
 cc_byz_debt.32.b: "Regle einen Teil davon. Öffne die Tür wieder."
 cc_byz_debt.32.c: "Östlich von hier gibt es Geld."

 # cc_byz_debt.33 - after the bankruptcy
 cc_byz_debt.33.title: "Nach der Abrechnung"
 cc_byz_debt.33.desc: "Die Schatzkammer ist versiegt. Nicht verlangsamt: versiegt, in dem spezifischen Sinne, dass die für die Zahlungen verantwortlichen Beamten angewiesen wurden, keine mehr zu leisten, und damit begonnen haben, dies Männern zu erklären, denen Geld geschuldet wurde und die unter der Annahme, es zu erhalten, Vorkehrungen getroffen hatten.\n\nWas als Nächstes passiert, wird in den Provinzen und nicht in der Hauptstadt entschieden, von jedem, der dort noch Münzen hat, um Soldaten zu bezahlen. Die Rolle des Palastes besteht darin, zu gegebener Zeit herauszufinden, was entschieden wurde."
 cc_byz_debt.33.desc_jewels: "Die Schatzkammer ist versiegt, und die Nachricht erreichte Venedig schneller als Thessalonika, weil Venedig darauf gewartet hat.\n\nDie Regalien wurden als Pfand für eine Schuld hinterlegt, die das Reich nun formal nicht mehr bedienen kann. Die rechtliche Lage ist nicht kompliziert, und die Venezianer haben sich nicht die Mühe gemacht, sie zu komplizieren. Was in den Provinzen geschieht, wird von demjenigen entschieden, der dort noch Münzen hat, um Soldaten zu bezahlen, und der Palast wird einige Monate später erfahren, was entschieden wurde."
 cc_byz_debt.33.desc_strained: "Die Schatzkammer ist versiegt, und sie ist im denkbar ungünstigsten Moment versiegt, was kein Zufall ist.\n\nDie Garnisonen in den neu erworbenen Provinzen sind bereits Monate im Rückstand. Die Straßen, die diese Provinzen mit der Hauptstadt verbinden sollten, wurden nicht gebaut, weil das Geld dafür an die Garnisonen ging, und das Geld für die Garnisonen floss in die Zinsen. Jede dieser Entscheidungen war zum Zeitpunkt ihrer Entscheidung richtig. Das Ergebnis ist eine Grenze, die von Männern gehalten wird, die nicht bezahlt wurden, in einem Land, das keinen Grund hat, sie zu ernähren, genau in dem Moment, in dem die Hauptstadt verkündet, dass sie niemanden bezahlen kann."
 cc_byz_debt.33.a: "Überarbeite die Einschätzung basierend auf der Vermessung komplett."
 cc_byz_debt.33.b: "Die Magnaten mögen erheben und überweisen, was sie für fair halten."
 cc_byz_debt.33.c: "Kehre mit offenen Büchern nach Italien zurück."
 cc_byz_debt.20.d: "Verkaufe die Einnahmen eines Zeitraums. Die Armee muss jetzt bezahlt werden."
