l_german:
 # Mission pack
 cc_byz_renovatio_campaign: "Renovatio Imperii"
 cc_byz_renovatio_campaign_DESCRIPTION: "Justinian gewann Afrika, Italien und einen Streifen Spaniens zurück, und die Rückgewinnung kostete mehr, als das Territorium jemals wert war. Die Pest kam mit der Flotte, die Schatzkammer erholte sich nie, und Italien wurde durch den Krieg ruiniert, der geführt wurde, um es zu retten.\n\nDies ist jener Feldzug, erneut geführt von einem Reich, das mit weitaus weniger beginnt. Jedes Theater ist gewinnbar. Keines von ihnen ist kostenlos."
 cc_byz_renovatio_campaign_BUTTON_TOOLTIP: "Die westlichen Provinzen zurückerobern"
 cc_byz_renovatio_campaign_BUTTON_DETAILS: "Illyricum, Italien, Afrika und Spania, in dieser Reihenfolge, endend mit dem Meer selbst."
 cc_byz_renovatio_campaign_CRITERIA_DESCRIPTION: "Die westlichen Provinzen wurden zurückgewonnen und das Mittelmeer ist wieder ein römisches Meer."
 cc_byz_task_illyricum: "Illyricum und Dalmatien"
 cc_byz_task_illyricum_desc: "Die dalmatinische Küste war bereits römisch, bevor Rom christlich wurde, und wurde seither von Konstantinopel, Venedig, Ungarn und sich selbst aus regiert. Die Städte wünschen sich kaiserlichen Schutz. Bei kaiserlichen Steuern sind sie weniger enthusiastisch."
 cc_byz_task_italy: "Italien und das Exarchat"
 cc_byz_task_italy_desc: "\"So viel zu den Goten.\"\n\nProkop beschreibt diese Stimmung und dann ausführlich, was der Krieg tatsächlich kostete: zwanzig Jahre, die durchtrennten Aquädukte, Rom dreimal belagert und zweimal eingenommen und ein Land, das in einem Zustand zurückgewonnen wurde, der den Nutzen der Rückgewinnung fragwürdig machte."
 cc_byz_task_africa: "Afrika"
 cc_byz_task_africa_desc: "Die Provinz, die sich selbst finanzierte, bis die Grenze nicht mehr gehalten werden konnte, ohne die Grenzsoldaten zu bezahlen, und die Grenze nicht mehr bezahlt werden konnte.\n\nKarthago fiel den Arabern sechzig Jahre nachdem Konstantinopel nicht mehr in der Lage war, es zu verstärken, an die Araber."
 cc_byz_task_spania: "Spania"
 cc_byz_task_spania_desc: "Ein Küstenstreifen mit Bergen im Rücken und ohne Hinterland, siebzig Jahre lang gegen die Westgoten gehalten und in einem Krieg verloren, den in Konstantinopel zu dieser Zeit niemand bemerkte.\n\nJustinian wollte ihn, weil er römisch gewesen war. Das war das ganze Argument."
 cc_byz_task_mare_nostrum: "Mare Nostrum"
 cc_byz_task_mare_nostrum_desc: "\"Unser Meer,\" nannten es die Römer, als sie jedes seiner Ufer hielten und dies sagen konnten, ohne dass jemand lachte.\n\nSeit achthundert Jahren ist das nicht mehr wahr."

 # Theatre triggers
 cc_byz_theatre_illyricum_tt: "Wir oder ein Vasall halten Salona, Split und Durrës"
 cc_byz_theatre_italy_tt: "Wir oder ein Vasall halten Rom, Ravenna und Neapel, und ein Exarchat regiert sie"
 cc_byz_theatre_africa_tt: "Wir oder ein Vasall halten Palermo, Syrakus, Tunis und Tripolis"
 cc_byz_theatre_spania_tt: "Wir oder ein Vasall halten Cartagena und Malaga"
 cc_byz_theatre_mare_nostrum_tt: "Wir haben alle vier westlichen Kriegsschauplätze abgeschlossen"

 # Theatre actions
 cc_byz_claim_theatre_illyricum: "Die Rückgewinnung Illyriens ausrufen"
 cc_byz_claim_theatre_illyricum_desc: "Erklären Sie die dalmatinische Küste für das Reich wiederhergestellt und regeln Sie, was mit den dort lebenden Menschen zu tun ist."
 cc_byz_claim_theatre_italy: "Die Rückgewinnung Italiens ausrufen"
 cc_byz_claim_theatre_italy_desc: "Erklären Sie Italien für wiederhergestellt und regiert. Erfordert einen installierten Exarchen: Städte, die von einer Armee eingenommen werden, werden besetzt, nicht zurückgewonnen."
 cc_byz_claim_theatre_africa: "Die Rückgewinnung Afrikas ausrufen"
 cc_byz_claim_theatre_africa_desc: "Erklären Sie die afrikanischen Provinzen für wiederhergestellt und finden Sie heraus, was deren Garnisonierung jedes Jahr für den Rest der Existenz des Reiches kostet."
 cc_byz_claim_theatre_spania: "Die Rückgewinnung Spaniens ausrufen"
 cc_byz_claim_theatre_spania_desc: "Erklären Sie die spanische Küste für wiederhergestellt. Es ist ein schmaler Besitz am fernen Ende des Meeres mit nichts dahinter, und jeder im Palast weiß es."
 cc_byz_claim_mare_nostrum: "Mare Nostrum ausrufen"
 cc_byz_claim_mare_nostrum_desc: "Erklären Sie das Mittelmeer zum ersten Mal seit neunhundert Jahren wieder zu einem römischen Meer."

 # Country modifiers
 STATIC_MODIFIER_NAME_cc_byz_theatre_illyricum_held: "Illyricum zurückgewonnen"
 STATIC_MODIFIER_DESC_cc_byz_theatre_illyricum_held: "Die dalmatinische Küste und ihre Häfen sind wieder imperial, und die Männer im Hinterland stehen für die Rekrutierung zur Verfügung."
 STATIC_MODIFIER_NAME_cc_byz_theatre_italy_held: "Italien zurückgewonnen"
 STATIC_MODIFIER_DESC_cc_byz_theatre_italy_held: "Rom wird von Konstantinopel aus durch einen Exarch regiert. Jede Kanzlei in Europa musste entscheiden, wie sie mit dieser Regelung umgehen soll."
 STATIC_MODIFIER_NAME_cc_byz_theatre_africa_held: "Afrika zurückgewonnen"
 STATIC_MODIFIER_DESC_cc_byz_theatre_africa_held: "Das Getreide und die Zölle Afrikas erreichen wieder die Hauptstadt. Ebenso die Berichte aus den Grenzfestungen."
 STATIC_MODIFIER_NAME_cc_byz_theatre_spania_held: "Spania zurückgewonnen"
 STATIC_MODIFIER_DESC_cc_byz_theatre_spania_held: "Ein Streifen der spanischen Küste, seine Häfen und ein dauerhafter Streit darüber, ob irgendetwas davon eine Garnison wert ist."
 STATIC_MODIFIER_NAME_cc_byz_mare_nostrum: "Mare Nostrum"
 STATIC_MODIFIER_DESC_cc_byz_mare_nostrum: "Das Mittelmeer ist ein römisches Meer. Kein Anspruch, kein Titel: Die Häfen an jeder Küste unterstehen Konstantinopel, und ein Schiff kann es überqueren, ohne das Reich zu verlassen."
 STATIC_MODIFIER_NAME_cc_byz_federate_settlement: "Föderierte Siedlung"
 STATIC_MODIFIER_DESC_cc_byz_federate_settlement: "Die slawischen und walachischen Bevölkerungen im Hinterland halten ihr Land zu imperialen Bedingungen im Austausch für Dienste. Sie sind nun die Grenzgarnison, und ihre Enkel werden sich als Römer bezeichnen."
 STATIC_MODIFIER_NAME_cc_byz_italy_restored: "Italien wiederhergestellt"
 STATIC_MODIFIER_DESC_cc_byz_italy_restored: "Die Aquädukte fließen, die Straßen sind repariert und die Städte werden wieder besiedelt – alles auf Kosten einer Schatzkammer, die andere Verpflichtungen hatte."
 STATIC_MODIFIER_NAME_cc_byz_african_limes: "Der afrikanische Limes"
 STATIC_MODIFIER_DESC_cc_byz_african_limes: "Die Grenzfestungen sind besetzt und die Garnisonen werden pünktlich bezahlt, was den gesamten Unterschied zwischen einer Grenze und einem Raubzuggebiet ausmacht."
 STATIC_MODIFIER_NAME_cc_byz_spania_reinforced: "Spania verstärkt"
 STATIC_MODIFIER_DESC_cc_byz_spania_reinforced: "Die spanischen Besitzungen werden über das Meer versorgt und verteidigt, was genau so lange funktioniert, wie die Flotte nichts Dringenderes zu tun hat."
 STATIC_MODIFIER_NAME_cc_byz_army_of_the_west: "Das Heer des Westens"
 STATIC_MODIFIER_DESC_cc_byz_army_of_the_west: "Eine veteranisierte Feldarmee, dauerhaft tausend Meilen von der Hauptstadt entfernt stationiert, loyal gegenüber den Offizieren, die sie ernähren, und zunehmend ein eigener politischer Faktor."

 # cc_byz_reconquest.1 - Illyricum
 cc_byz_reconquest.1.title: "Die Menschen des Binnenlandes"
 cc_byz_reconquest.1.desc: "Die Küste war der einfache Teil. Die Städte sind römisch, waren schon immer römisch und warteten darauf, von jemandem befreit zu werden.\n\nDas Binnenland ist eine andere Frage. Slawen und Walachen haben es siebenhundert Jahre lang bewirtschaftet und beweidet; sie wurden über die Rückeroberung nicht befragt, und sie werden immer noch da sein, wenn die derzeitige Regelung durch das ersetzt wurde, was als Nächstes kommt. Sie zahlen keine Steuern, die die Hauptstadt erreichen, und sie haben keinen besonderen Einwand dagegen, eine zu zahlen, sofern jemand erklärt, an wen und warum.\n\nJede bisherige imperiale Antwort auf diese Frage ist aktenkundig. Keine von ihnen funktionierte länger als ein Jahrhundert."
 cc_byz_reconquest.1.a: "Land für Dienst. Siedle sie als Foederati an."
 cc_byz_reconquest.1.b: "Versetze sie. Das wurde schon früher so gemacht."
 cc_byz_reconquest.1.c: "Die Küstenstädte behalten ihre Freiheiten. Lassen Sie das Binnenland in Ruhe."

 # cc_byz_reconquest.10 - Italy
 cc_byz_reconquest.10.title: "Der Zustand Italiens"
 cc_byz_reconquest.10.desc: "Italien wurde zurückgewonnen, und die Berichte daraus sind schlimmer als die Berichte vom Feldzug.\n\nDie Aquädukte, die drei Städte versorgten, wurden während der Kämpfe zerstört und nicht repariert. Das Umland nördlich von Rom wurde innerhalb von sechs Jahren zweimal umkämpft und wird nicht mehr bewirtschaftet. Die Bevölkerung der Stadt selbst ist nur ein Bruchteil dessen, was die Schätzung erwartet hatte, und die Schätzung war bereits pessimistisch.\n\nDas Reich hat Italien zurückgewonnen. Was es nicht zurückgewonnen hat, ist irgendetwas in Italien, das es wert wäre, zurückgewonnen zu werden, und dies zu korrigieren, ist ein Projekt, das sich über mehrere Regierungszeiten erstreckt."
 cc_byz_reconquest.10.desc_strained: "Italien wurde zurückgewonnen, und es geschah nicht durch Verhandlungen.\n\nDas Reich kämpfte bereits an zwei Fronten und bezahlte für beide, und es fehlte sowohl das Geld als auch die Zeit für einen Feldzug aus Belagerungen und ausgehandelten Kapitulationen. So wurden die Städte gestürmt, wo sie Widerstand leisteten, das Umland wurde von einer Armee, die essen musste, kahlgefressen, und die nun eintreffenden Berichte beschreiben eine Provinz, die durch den Prozess ihrer Befreiung umfassend verwüstet wurde.\n\nGenau das passierte beim ersten Mal. Der Unterschied ist, dass Justinian es sich leisten konnte, davon überrascht zu werden."
 cc_byz_reconquest.10.a: "Wir bauen es auf unsere Kosten wieder auf."
 cc_byz_reconquest.10.b: "Besteuere es. Es wird das nächste Theater finanzieren."
 cc_byz_reconquest.10.c: "Befreie es für eine Generation von seinen Steuern."

 # cc_byz_reconquest.20 - Africa
 cc_byz_reconquest.20.title: "Die afrikanische Grenze"
 cc_byz_reconquest.20.desc: "Afrika ist reich, weshalb es sich zu erobern lohnte, und es lässt sich nicht sesshaft machen, weshalb es verloren ging.\n\nDie Küstenstädte und das Getreideland sind sicher und produzieren einen echten Überschuss. Alles im Landesinneren ist eine Grenzregion, und die Grenze bleibt nicht stabil: Die maurischen Häuptlinge fallen ein, wenn die Garnisonen schwach sind, nehmen kaiserlichen Sold, wenn sie stark sind, und ändern ihre Einschätzung darüber, welcher Fall vorliegt, etwa zweimal im Jahr.\n\nDie Festungen funktionieren. Die Festungen benötigen Garnisonen, die Garnisonen benötigen Sold, und der Sold muss das Meer überqueren. Die Depeschen der Grenzkommandanten sind in allen drei Punkten einstimmig und in Bezug auf den dritten zunehmend direkt."
 cc_byz_reconquest.20.a: "Bezahle die Garnisonen. Besetze die Festungen."
 cc_byz_reconquest.20.b: "Lassen wir sie vom Land leben."
 cc_byz_reconquest.20.c: "Kaufen Sie die Anführer. Das ist billiger als Festungen."

 # cc_byz_reconquest.30 - Spania
 cc_byz_reconquest.30.title: "Die spanische Küste"
 cc_byz_reconquest.30.desc: "Spania wird gehalten: ein Küstenstreifen, zwei gute Häfen und ein Hinterland, das jemand anderem gehört und unmittelbar hinter den Mauern beginnt.\n\nEs wurde billig erworben, da es niemand ernsthaft verteidigte, und es ist nur vom Meer aus verteidigbar, durch eine Flotte, die nichts Besseres zu tun hat, gegen Gegner, die sich mit einer Woche Vorlaufzeit dagegen konzentrieren können, während Verstärkungen drei Monate benötigen. Der Garnisonskommandant hat eine Einschätzung vorgelegt. Sie ist professionell formuliert und ihr Fazit ist, dass die Position in jedem relevanten Fall unhaltbar ist.\n\nEs ist zudem der westlichste Punkt des Reiches, und eine römische Flotte liegt dort zum ersten Mal seit neun Jahrhunderten vor Anker."
 cc_byz_reconquest.30.a: "Verstärke es. Es kann gehalten werden."
 cc_byz_reconquest.30.b: "Tausche es gegen etwas auf dieser Seite des Meeres ein."
 cc_byz_reconquest.30.c: "Halte es mit der Flotte, nicht mit einer Garnison."

 # cc_byz_reconquest.40 - the capstone
 cc_byz_reconquest.40.title: "Mare Nostrum"
 cc_byz_reconquest.40.desc: "Ein Schiff, das Konstantinopel verlässt, kann in Thessaloniki, Durazzo, Syrakus, Karthago, Cartagena anlegen und über Neapel und Ravenna zurückkehren, und zu keinem Zeitpunkt dieser Reise wird es einen fremden Hafen betreten.\n\nDas war vor neunhundert Jahren wahr und ist es seitdem nicht mehr gewesen. Die Schreiber, die die Bekanntmachung vorbereiteten, mussten die älteren Register konsultieren, um die richtige Formel zu finden, und die Formel, die sie fanden, war für einen Kaiser geschrieben worden, der von Ravenna aus regierte und das Reich, das seine Leistung nun wiederholt hat, nicht anerkannt hätte.\n\nEs ist vollbracht. Das Meer ist römisch."
 cc_byz_reconquest.40.desc_traded: "Ein Schiff, das Konstantinopel verlässt, kann das gesamte Meer überqueren und nur in kaiserlichen Häfen anlegen, mit einer einzigen Lücke, die in keiner der Proklamationen erwähnt wird.\n\nSpania wurde aus guten Gründen zu einem guten Preis an eine Macht verkauft, die ihren Teil der Vereinbarung eingehalten hat. Die Formel, die in der Großen Kirche vorgelesen wird, beschreibt die Rückgewinnung der westlichen Provinzen, ohne sie aufzuzählen, und der Schreiber, der sie so entworfen hat, wurde privat für sein Taktgefühl gedankt.\n\nDas Meer ist römisch. Es ist römisch in einem Maße, das einer genaueren Prüfung nicht standhalten würde, und diese Prüfung wird nicht durchgeführt werden."
 cc_byz_reconquest.40.desc_exhausted: "Das Meer ist römisch, und das Reich, das es so gemacht hat, ist in keinem Zustand, diese Tatsache genießen zu können.\n\nDas Schatzamt ist für eine Generation gebunden. Die Feldarmeen sind Veteranen, fernab und haben Rückstände, die derzeit niemand bezahlen kann. Ganze Provinzen, die unter enormen Kosten zurückgewonnen wurden, werden von Männern verwaltet, die die Hauptstadt nie getroffen hat, weil die Hauptstadt niemanden zum Senden hat. Die Bekanntgabe wurde in der Großen Kirche vor einer Gemeinde verlesen, die dafür seit vierzig Jahren besteuert wurde.\n\nJustinians Rückeroberung endete genau hier, im Moment des vollständigen Erfolgs, wobei der Staat, der ihn errang, durch das Erreichen ausgehöhlt wurde. Das ist kein Zufall und es war nicht unvorhersehbar."
 cc_byz_reconquest.40.a: "Lass es in der Großen Kirche verlesen."

 # cc_byz_reconquest.50 - strain: the provinces stop paying
 cc_byz_reconquest.50.title: "Die Provinzen stellen die Zahlungen ein"
 cc_byz_reconquest.50.desc: "Die Überweisungen aus den westlichen Provinzen sind ausgeblieben, und die Erklärungen sind alle einzeln betrachtet vernünftig.\n\nAfrika hat seine Einnahmen für seine Garnisonen ausgegeben. Italien hat seine Einnahmen für Reparaturen ausgegeben, die die Hauptstadt angeordnet hat. Die dalmatinischen Städte haben ihre für Mauern ausgegeben und die Korrespondenz vorgelegt, in der die Hauptstadt ihnen dazu angewiesen hatte. In jedem Fall wurde das Geld für etwas ausgegeben, das das Reich benötigte, und in jedem Fall wird das Reich es nicht sehen.\n\nDie Schwierigkeit besteht darin, dass die Hauptstadt dies alles eingeplant hat und die Armeen, die diese Provinzen eroberten, immer noch dort sind und immer noch aus einem Schatzamt bezahlt werden, das davon ausging, dass die Provinzen sich inzwischen selbst finanzieren würden."
 cc_byz_reconquest.50.desc_ruined: "Die Überweisungen aus dem Westen sind ausgeblieben, und das westliche Konto lässt sich in einer Zeile zusammenfassen: Italien.\n\nAfrika zahlt. Dalmatien zahlt ein wenig. Italien, das in jeder Prognose des Schatzamtes zu Beginn der größten Einzelposten war, bringt fast nichts hervor, weil die Provinz, die den Rest des Feldzugs finanzieren sollte, im Zuge ihrer Eroberung ruiniert wurde.\n\nDie Schreiber haben einen Vergleich mit der Vorkriegsbewertung erstellt. Er wurde nicht angefordert und wird trotzdem verteilt, was dem Palast etwas über die Stimmung im Schatzamt verrät. Italien kostet derzeit mehr an Garnisonen und Reparaturen, als es an Steuern einbringt, und nach aktuellem Trend wird dies länger andauern, als jeder der derzeit Diensttuenden noch leben wird."
 cc_byz_reconquest.50.a: "Leihen Sie sich Geld gegen das nächste Jahr. Behalten Sie alles."
 cc_byz_reconquest.50.b: "Überlasse die fernen Provinzen demjenigen, der sie halten kann."
 cc_byz_reconquest.50.c: "Gib das am wenigsten verteidigungsfähige auf, bevor es uns verloren geht."

 # cc_byz_reconquest.51 - strain: the army of the west
 cc_byz_reconquest.51.title: "Das Heer des Westens"
 cc_byz_reconquest.51.desc: "Es gibt nun eine westliche Armee, und niemand hat beschlossen, eine solche zu schaffen.\n\nSie wurde über dreißig Jahre hinweg stückweise aus Expeditionsstreitkräften zusammengestellt, die nie abgezogen wurden, und ist zu einer permanenten Institution mit eigenen Versorgungsarrangements, eigener Rekrutierung aus den Provinzen, in denen sie stationiert ist, und eigenen Offizieren geworden, die nirgendwo anders gedient haben. Ein Soldat in ihr kann der Sohn eines Soldaten in ihr sein. Ihre ranghöchsten Kommandeure korrespondieren mehr untereinander als einer von ihnen mit der Hauptstadt.\n\nEs ist die effektivste Armee, die das Reich besitzt. Sie ist tausend Meilen vom Palast entfernt stationiert, man schuldet ihr Geld, und die Männer in ihr betrachten sich eher als die Armee des Westens denn als die Armee des Kaisers. Alle drei Tatsachen waren schon einmal wahr."
 cc_byz_reconquest.51.a: "Vermerke es und zahle ihnen, was wir können."

 # cc_byz_reconquest.52 - the general
 cc_byz_reconquest.52.title: "Der siegreiche General"
 cc_byz_reconquest.52.desc: "Der Kommandant im Westen hat alles getan, was von ihm verlangt wurde, und sogar mehr, und genau das ist das Problem.\n\nEr hat die Provinz eingenommen, er hält sie, seine Männer sind ihm ergeben und seine Depeschen sind Musterbeispiele korrekter Form. Er hat dem Palast keinerlei Grund zur Sorge gegeben, was an sich schon ein Grund ist: Ein Mann von solcher Kompetenz, in dieser Entfernung, an der Spitze dieses Heeres, ist eine Konstellation von Umständen und keine bloße Anschuldigung.\n\nDas Reich war schon oft in dieser Lage. In den meisten dieser Fälle hatte der betreffende General keinerlei Absicht, Kaiser zu werden – bis zu dem Punkt, an dem seine Truppen die Entscheidung für ihn trafen."
 cc_byz_reconquest.52.desc_unpaid: "Der Kommandant im Westen wurde nicht bezahlt, seine Männer wurden nicht bezahlt, und er hat das Problem selbst gelöst.\n\nEr versorgt sein Heer direkt aus der Provinz, in eigener Autorität, durch Vereinbarungen mit lokalen Landbesitzern, über die die Hauptstadt erst nachträglich informiert wurde. Es funktioniert. Die Provinz ist ruhig, die Truppen sind satt und die Grenze wird gehalten, und nichts davon hängt nun mehr von Lieferungen aus Konstantinopel ab.\n\nLetzterer Punkt wird im Palast genauestens analysiert. Ein Heer, das das Geld der Hauptstadt nicht benötigt, ist ein Heer, das aufgehört hat, die Hauptstadt zu benötigen."
 cc_byz_reconquest.52.a: "Rufe ihn zurück. Ehre ihn öffentlich."
 cc_byz_reconquest.52.b: "Lass ihn dort. Bezahle seine Männer von hier aus, direkt."
 cc_byz_reconquest.52.c: "Teilen Sie das Kommando auf drei Offiziere auf."
