l_german:
 # Tasks added by the forking rework: the three pillars, the reconvergences, the five
 # exclusive forks and the optional spurs.
 #
 # FORK DESCRIPTIONS END WITH WHAT THEY CLOSE. Taking one side of an exclusive fork hides the
 # other (visible = NOT completed), so the player would otherwise never learn there was a
 # choice. Naming the road not taken in the description of the road taken is the only place
 # that information can live.

 # ---- Reconvergence tooltips ----
 # Each wraps an OR of AND pairs so the player reads one line instead of nine.
 cc_byz_two_of_three_pillars_tt: "Erfülle zwei der drei Grundpfeiler: Logothete des Kurses (die Finanzen), Der ökumenische Thron (der Glaube), Das Feldheer wiederhergestellt (das Schwert)"
 cc_byz_two_of_three_seats_tt: "Erfülle zwei der drei Aufgaben der östlichen Bistümer: Antiochia wiederhergestellt, Die Rückkehr des Patriarchen, Ägypten und das Delta"
 cc_byz_two_of_three_theatres_tt: "Erfülle zwei der drei Aufgaben des westlichen Kriegsschauplatzes: Italien und das Exarchat, Afrika, Spania"
 cc_byz_turkish_question_settled_tt: "Die türkische Frage ist geklärt, durch Eroberung oder durch Tribut"

 # ---- The Fisc ----
 cc_byz_task_nomisma: "Das wiederhergestellte Nomisma"
 cc_byz_task_nomisma_desc: "Sieben Jahrhunderte lang war der Solidus die Münze, die jeder Markt von Ceylon bis Friesland ohne Wiegen annahm. In den letzten hundert Jahren wurde sie viermal abgewertet, und die Kaufleute haben begonnen, sie zu wiegen."
 cc_byz_task_silk_looms: "Die Seidenwebstühle"
 cc_byz_task_silk_looms_desc: "Zwei Mönche brachten im sechsten Jahrhundert die Würmer aus China in einem hohlen Stab mit, und das Reich hielt sechshundert Jahre lang das westliche Monopol auf der Grundlage dieses Diebstahls. Die Webstühle gehören immer noch uns. Fast nichts anderes an diesem Handel gehört uns noch."
 cc_byz_task_literate_admin: "Eine alphabetisierte Verwaltung"
 cc_byz_task_literate_admin_desc: "Das Reich funktionierte auf Papier, während der Westen auf Erinnerung basierte. Es kann dies genau so lange fortsetzen, wie es Männer gibt, die lesen können, was aufgeschrieben steht, und keinen Tag länger."
 cc_byz_task_logothete: "Logothet des Kurses"
 cc_byz_task_logothete_desc: "Der Logothete des Kurses begann als der Mann, der die Post leitete. Da die Post die Depeschen beförderte, erfuhr er, was in ihnen stand; da er wusste, was in ihnen stand, kam er dazu, den Grenzgeheimdienst zu leiten; und da er diesen leitete, endete er damit, die Außenpolitik zu führen. Niemand hat dies jemals offiziell beschlossen.\n\nDie Büros, die er benötigt, müssen finanziert werden, und das über Jahre hinweg, nicht nur für eine Saison."

 # ---- The Faith ----
 cc_byz_task_athonite: "Die Klöster des Athos"
 cc_byz_task_athonite_desc: "Der Heilige Berg untersteht theoretisch dem Patriarchen und praktisch sich selbst. Seine Meinung verbreitet sich weiter als jeder Brief eines Bischofs und kommt früher an als unsere eigenen."
 cc_byz_task_icons: "Die wiederhergestellten Ikonen"
 cc_byz_task_icons_desc: "Einhundertzwanzig Jahre lang zerschlug das Reich seine eigenen Bilder, entschied dann, dass es einen Fehler gemacht hatte, und verbrachte drei Jahrhunderte damit, sie zu ersetzen. Das Fest der Orthodoxie feiert immer noch in jeder Fastenzeit diese Umkehr.\n\nWas verbrannt ist, kommt nicht zurück. Was in Auftrag gegeben werden kann, wird es."
 cc_byz_task_autocephalous: "Die autokephalen Töchter"
 cc_byz_task_autocephalous_desc: "Serbien hat einen Patriarchen. Bulgarien hat einen Patriarchen. Die Rus haben einen Metropoliten, der sich wie einer verhält. Jeder von ihnen wurde von Konstantinopel eingesetzt, und jeder von ihnen beschreibt sich nun so, als sei er schon immer unabhängig gewesen.\n\nEine Mutterkirche ist eine, der die Töchter immer noch Rechenschaft schuldig sind."
 cc_byz_task_ecumenical_throne: "Der ökumenische Thron"
 cc_byz_task_ecumenical_throne_desc: "\"Lasst uns gemeinsam über den Frieden der Kirchen nachdenken.\"\n\nDer Patriarch wird aus drei Namen gewählt, die die Synode einreicht, und der Kaiser entscheidet. Das ist die Regelung, und sie hat Patriarchen hervorgebracht, die Kaisern ins Gesicht trotzten. Es ist immer noch besser als die Alternative: ein Patriarch, den niemand gewählt hat."

 # ---- The Sword ----
 cc_byz_task_veterans: "Veteranenarmeen"
 cc_byz_task_veterans_desc: "Ein Heer, das gemeinsam gekämpft und gemeinsam heimgekehrt ist, ist drei Heere wert, die dies nicht getan haben. Wir haben genug Männer. Uns fehlen Männer, die schon einmal Seite an Seite gestanden haben."
 cc_byz_task_dromon: "Die Dromonen-Flotte"
 cc_byz_task_dromon_desc: "Zwei Ruderbänke, ein Sporn am Bug statt eines Rammbugs und ein Siphon im Vordergrund, sofern das Arsenal noch einen liefern kann. Die Dromone trug die Macht dieses Reiches sechshundert Jahre lang und wurde seit achtzig Jahren nicht mehr in großen Zahlen gebaut."
 cc_byz_task_varangians: "Die Warägergarde"
 cc_byz_task_field_army: "Das wiederhergestellte Feldheer"
 cc_byz_task_field_army_desc: "Keine Garnison, keine für eine Saison einberufene Miliz und keine Söldner, die im Herbst nach Hause gehen. Ein Heer, das marschieren, verlieren und in derselben Regierungszeit erneut marschieren kann. Das Reich hat seit Manzikert keines mehr besessen."

 # ---- Reconvergence ----
 cc_byz_task_state_restored: "Der wiederhergestellte Staat"
 cc_byz_task_state_restored_desc: "Es gibt einen Moment, in dem ein Staat aufhört, seinen eigenen Niedergang zu verwalten, und beginnt zu entscheiden, was als Nächstes zu tun ist. Er wird zum damaligen Zeitpunkt selten markiert, ist aber im Nachhinein für jeden offensichtlich.\n\nZwei der drei Säulen werden genügen. Kein Kaiser war jemals in allen drei gleichzeitig stark."

 # ---- The Greek World ----
 cc_byz_task_serbian_question: "Die serbische Frage"
 cc_byz_task_serbian_question_desc: "Stefan Dušan ließ sich in Skopje nach unserem Ritus von einem Patriarchen, den er eigens für diesen Zweck eingesetzt hatte, zum Kaiser der Serben und Römer krönen. Er nahm die Hälfte von Mazedonien und einen Großteil von Epirus ein, und er irrte sich nicht in der Annahme, dass er auch diese Stadt erobern könne."
 cc_byz_task_latin_bride: "Eine lateinische Braut"
 cc_byz_task_latin_bride_desc: "Eine lateinische Prinzessin im Palast bedeutet innerhalb eines Jahrzehnts eine lateinische Kapelle im Palast, einen lateinischen Beichtvater und eine lateinische Fraktion am Hof. Es bedeutet auch einen westlichen König, der es sich nicht leisten kann, unseren Fall mitanzusehen.\n\nKaiser haben diesen Handel schon früher gemacht, und keiner von ihnen hat ihn genossen."
 cc_byz_task_embassies: "Botschaften im Westen"
 cc_byz_task_embassies_desc: "Das Reich empfing einst Botschafter auf einem Thron, der bis zur Decke emporstieg, während vergoldete Löwen daneben brüllten, und Liutprand von Cremona notierte in seinem Zorn jedes Detail.\n\nWir können uns die Mechanik nicht mehr leisten. Die Männer hingegen schon."
 cc_byz_task_venetian_alliance: "Das venezianische Bündnis"
 cc_byz_task_venetian_alliance_desc: "Venedig nahm die Pferde aus unserem Hippodrom, die Reliquien aus unseren Kirchen und das Reich selbst für siebenundfünfzig Jahre, und Venedig besitzt zudem die einzige Flotte im Mittelmeer, die uns ernähren kann.\n\nDie Wahl von ihnen schließt den genuesischen Weg ab."
 cc_byz_task_genoese_compact: "Der genuesische Pakt"
 cc_byz_task_genoese_compact_desc: "Genua sitzt in Galata am anderen Ende des Horns, zahlt uns fast nichts an Zöllen und nimmt das Siebenfache dessen ein, was unser eigener Hafen schafft. Sie sind es auch, die einen Palaiologos zurück auf diesen Thron gebracht haben.\n\nDie Wahl von ihnen schließt den venezianischen Weg aus."

 # ---- Anatolia ----
 cc_byz_task_sultan_tributary: "Der Tributzahler des Sultans"
 cc_byz_task_sultan_tributary_desc: "Das Reich hat Tribut an dieses Haus gezahlt und Truppen für seine Feldzüge entsandt, und der Kaiser ist im Gefolge eines Sultans geritten. Es liegt eine gewisse Symmetrie in einer Anordnung, die in die andere Richtung läuft, und es ist billiger, als sie zu vernichten."
 cc_byz_task_anatolia_secured: "Anatolien gesichert"
 cc_byz_task_anatolia_secured_desc: "Ob durch Eroberung oder Tribut, die türkische Frage ist beantwortet und die östlichen Provinzen können regiert statt nur verteidigt werden.\n\nKein Kaiser in zwei Jahrhunderten war in der Lage, diesen Satz zu schreiben."
 cc_byz_task_convert_anatolia: "Der wiedergefundene Glaube"
 cc_byz_task_convert_anatolia_desc: "Die Konversion in Anatolien wurde meist nicht erzwungen. Sie war eine Steuer, eine Ehe, eine Karriere und vier Generationen eines Dorfes, die die neue Ordnung einfacher fanden als die alte.\n\nSie rückgängig zu machen, wird auf dieselbe Weise funktionieren und genauso lange dauern."
 cc_byz_task_tagmata: "Die wiederhergestellten Tagmata"
 cc_byz_task_tagmata_desc: "Bezahlt, in Kasernen untergebracht und entlohnt, ob Krieg herrscht oder nicht. Ein Berufsheer gehorcht dem, der die Soldkiste unterschreibt, was sowohl das Argument dafür als auch dagegen ist.\n\nDie Wahl dieser Option schließt den Weg der Pronoia aus."

 # ---- The Levant ----
 cc_byz_task_eastern_sees: "Die östlichen Bistümer"
 cc_byz_task_eastern_sees_desc: "Antiochia, Jerusalem, Alexandria. Drei der fünf, verloren innerhalb eines Jahrzehnts im siebten Jahrhundert und seitdem kontinuierlich betrauert von einem Reich, das nie formell zugab, dass sie fort waren.\n\nZwei von drei werden genügen."
 cc_byz_task_sultans_friend: "Der Freund des Sultans"
 cc_byz_task_sultans_friend_desc: "Ein schriftlicher Vertrag über die heiligen Stätten mit einem Sultan. Im Westen wird er als Verrat und in Kairo als Schwäche gelesen, aber er wird die Schreine offen halten und die Pilger in Bewegung halten, solange beide Seiten dies für sinnvoll finden.\n\nDieser Schritt beendet den Krieg."
 cc_byz_task_pentarchy_war: "Der Pentarchie-Krieg"
 cc_byz_task_pentarchy_war_desc: "Rom, Konstantinopel, Alexandria, Antiochia, Jerusalem. Fünf Patriarchen, eine Kirche und eine Anordnung, die seit dem siebten Jahrhundert nicht mehr intakt existiert.\n\nDie Wahl dieser Option schließt den Vertrag aus."

 # ---- The West ----
 cc_byz_task_sicily: "Sizilien zurückgewonnen"
 cc_byz_task_sicily_desc: "Griechisch wurde hier vor Latein gesprochen und wird in den Hügeln immer noch gesprochen. Die Insel war innerhalb von vierhundert Jahren byzantinisch, arabisch, normannisch und angevinisch, und die Sizilianische Vesper hat sich um die Angevins gekümmert."
 cc_byz_task_ravenna: "Ravenna wiederhergestellt"
 cc_byz_task_ravenna_desc: "Die Mosaike in San Vitale zeigen Justinian an der einen Wand und Theodora an der anderen, beide gekrönt, beide dem Altar zugewandt, obwohl keiner von beiden jemals hier war.\n\nDie Stadt versandet seit achthundert Jahren. Der Hafen, der sie zu einem exarchischen Sitz machte, ist heute ein Feld."
 cc_byz_task_western_sea: "Das Westmeer"
 cc_byz_task_western_sea_desc: "\"Unser Meer.\"\n\nEs war ein römischer Witz, bevor es eine römische Tatsache wurde, und als es eine Tatsache war, fand es niemand mehr lustig. Zwei von drei Ufern genügen; das dritte war schon immer ein Streitpunkt."

 # ---- The East ----
 cc_byz_task_crown_monopoly: "Das Kronmonopol"
 cc_byz_task_chartered_company: "Die privilegierte Handelsgesellschaft"
 cc_byz_task_chartered_company_desc: "Lassen wir die Bürger das Risiko tragen und die Krone einen Anteil an dem nehmen, was zurückkommt. Es bringt weniger ein, aber es tut es ohne eine jährliche Debatte im Konsistorium.\n\nDie Wahl dieser Option schließt das Kronmonopol aus."

 # ---- Optional spurs ----
 cc_byz_task_notitia: "Die Antiquare"
 cc_byz_task_notitia_desc: "Die Notitia Dignitatum listet jedes Amt und jeden Befehl des späten Reiches auf, sowohl im Westen als auch im Osten, wobei neben jedem Eintrag die entsprechenden Insignien abgebildet sind. Die meisten dieser Posten hatten bereits aufgehört zu existieren, bevor die Tinte getrocknet war.\n\nJuristen können mit einem solchen Dokument sehr viel bewirken."
 cc_byz_task_greek_fire: "Das Griechische Feuer wiederentdeckt"
 cc_byz_task_hagia_sophia: "Hagia Sophia instand gehalten"
 cc_byz_task_hagia_sophia_desc: "\"Salomon, ich habe dich übertroffen.\"\n\nDie Tradition legt diese Worte Justinian bei der Einweihung in den Mund; der Bericht stammt Jahrhunderte später und die Empfindung ist absolut charakteristisch. Die Kuppel stürzte zwanzig Jahre später ein und wurde noch höher wieder aufgebaut."
 cc_byz_task_great_palace: "Der Große Palast"
 cc_byz_task_great_palace_desc: "Der Hof zog vor Generationen nach Blachernae, und der alte Palast verfällt seither. Besucher haben begonnen, dies schriftlich zu vermerken, womit diese Angelegenheit zur öffentlichen Diskussion wurde."
 cc_byz_task_thessaloniki: "Die zweite Stadt"
 cc_byz_task_thessaloniki_desc: "Die zweite Stadt, der zweite Hafen und der einzige andere Ort mit Mauern, die den Namen verdienen. Sie hat zudem zwei Jahrzehnte damit verbracht, ihre eigenen Entscheidungen zu treffen, und die Zealoten, die sie regierten, baten um keine einzige Erlaubnis."
 cc_byz_task_city_adorned: "Die geschmückte Stadt"
 cc_byz_task_city_adorned_desc: "Nichts davon gewinnt einen Krieg. All das ist der Grund, warum die Leute immer noch hierherkommen, um zu sehen, wie ein Weltreich aussieht, und warum sie es aufschreiben, wenn sie nach Hause kommen."
 cc_byz_task_triumph: "Ein Triumph im Hippodrom"
 cc_byz_task_triumph_desc: "Die Formen sind im Buch der Zeremonien bis ins Detail festgehalten: welches Tor, welcher Beifall und wer wohin schreitet. Seit zweihundert Jahren wurden sie nicht mehr ausgeführt, und der Großteil dieser Stadt hat nie eine davon gesehen."
 cc_byz_task_varangians_desc: "Nordmänner und Engländer mit Äxten, die kein Griechisch sprechen, das den Namen verdient, und keiner Familie in dieser Stadt etwas schuldig sind. Genau das ist der Punkt an ihnen. Ein Kaiser, umgeben von Byzantinern, ist umgeben von Männern mit Cousins.\n\nSie erinnern sich zudem daran, wem die Donau einmal gehörte."
 cc_byz_task_crown_monopoly_desc: "Die Gewürze, die von kaiserlichen Beamten gekauft und verkauft werden, wobei der Gewinn in die Schatzkammer fließt, ohne zuvor durch private Hände zu gehen.\n\nDie Wahl dieser Option schließt den Weg der Privilegien ab."
 cc_byz_task_greek_fire_desc: "\"...ein Feuer, das an allem haftete, was es berührte, und selbst auf dem Wasser brannte.\"\n\nAnna Komnene sah die verwendeten Siphons und beschrieb die bronzenen Tierköpfe an den Stevens. Die Zusammensetzung war ein Staatsgeheimnis, das nur einer Familie und den kaiserlichen Werkstätten vorbehalten war, und sie ging auf die übliche Weise verloren: weil niemand sie aufschrieb."
