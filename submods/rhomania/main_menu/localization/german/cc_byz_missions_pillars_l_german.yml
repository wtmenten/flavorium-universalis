l_german:
 # Tasks added by the forking rework: the three pillars, the reconvergences, the five
 # exclusive forks and the optional spurs.
 #
 # FORK DESCRIPTIONS END WITH WHAT THEY CLOSE. Taking one side of an exclusive fork hides the
 # other (visible = NOT completed), so the player would otherwise never learn there was a
 # choice. Naming the road not taken in the description of the road taken is the only place
 # that information can live.

 # ---- Reconvergence tooltips ----
 # Each wraps an OR of AND pairs so the player reads one line instead of nine.
 cc_byz_two_of_three_pillars_tt: "Vollenden Sie zwei der drei Säulen: den Fiskus, den Glauben, das Schwert"
 cc_byz_two_of_three_seats_tt: "Sichere zwei der drei östlichen Bistümer: Antiochia, Jerusalem, Alexandria"
 cc_byz_two_of_three_theatres_tt: "Gewinne zwei der drei westlichen Kriegsschauplätze zurück: Italien, Afrika, Spania"
 cc_byz_turkish_question_settled_tt: "Die türkische Frage ist geklärt, durch Eroberung oder durch Tribut"

 # ---- The Fisc ----
 cc_byz_task_nomisma: "Das wiederhergestellte Nomisma"
 cc_byz_task_nomisma_desc: "Erhöhe die Steuerbasis auf sechzig. Die Münze, die siebenhundert Jahre lang der Standard des Mittelmeers war, wurde im letzten Jahrhundert viermal abgewertet, und jeder, der mit ihr handelt, hat es bemerkt."
 cc_byz_task_silk_looms: "Die Seidenwebstühle"
 cc_byz_task_silk_looms_desc: "Erreiche zehn Dukaten monatlichen Handelseinkommens. Zwei Mönche schmuggelten die Würmer in einem Gehstock aus China heraus, und das Reich hielt dank dessen sechs Jahrhunderte lang das westliche Monopol."
 cc_byz_task_literate_admin: "Eine alphabetisierte Verwaltung"
 cc_byz_task_literate_admin_desc: "Steigere die durchschnittliche Alphabetisierungsrate auf über fünfundzwanzig Prozent. Das Reich funktionierte lange vor allen anderen in Europa auf Papierbasis, und das kann es nur weiterhin tun, solange es Männer gibt, die es lesen können."
 cc_byz_task_logothete: "Logothet des Kurses"
 cc_byz_task_logothete_desc: "Hundert in der Steuerbasis und fünf finanzierte Büros. Das Amt, das die Post, die Straßen, den Grenzgeheimdienst und schließlich die Außenpolitik leitete, weil es das einzige war, das wusste, was vor sich ging."

 # ---- The Faith ----
 cc_byz_task_athonite: "Die Klöster des Athos"
 cc_byz_task_athonite_desc: "Erreiche vierzig religiösen Einfluss. Der Heilige Berg ist theoretisch dem Patriarchen unterstellt und in der Praxis sich selbst, und seine Meinung wiegt schwerer als die eines jeden Bischofs."
 cc_byz_task_icons: "Die wiederhergestellten Ikonen"
 cc_byz_task_icons_desc: "Besitze drei Kunstwerke. Das Jahrhundert des Ikonoklasmus hat das Reich mehr Bilder gekostet als jede Eroberung, und sie zu ersetzen ist die langsame Arbeit, zu beweisen, dass der Streit beigelegt wurde."
 cc_byz_task_autocephalous: "Die autokephalen Töchter"
 cc_byz_task_autocephalous_desc: "Führe ein autokephales Patriarchat. Serbien, Bulgarien und die Rus haben nun alle ihre eigenen Kirchen. Die Leitung des Gremiums, dem sie angehören, ist der Unterschied zwischen einer Mutterkirche und einer ehemaligen."
 cc_byz_task_ecumenical_throne: "Der ökumenische Thron"
 cc_byz_task_ecumenical_throne_desc: "Fünfundsiebzig religiöser Einfluss und ein zufriedener Klerus. Der Patriarch von Konstantinopel ist durch Gewohnheit und nicht durch Gesetz der Erste unter den Orthodoxen, und Gewohnheiten müssen gepflegt werden."

 # ---- The Sword ----
 cc_byz_task_veterans: "Veteranenarmeen"
 cc_byz_task_veterans_desc: "Erreiche vierzig Armee-Tradition. Das Reich hat seit drei Generationen kein ordnungsgemäß ausgebildetes Heer aufgestellt, und die Männer, die sich erinnern, wie es geht, sterben weg."
 cc_byz_task_dromon: "Die Dromonen-Flotte"
 cc_byz_task_dromon_desc: "Schicke zwanzig Schiffe auf See. Die Meerengen sind der einzige Grund, warum diese Stadt überlebt hat, und sie sind nichts wert ohne Rümpfe, die sie schließen können."
 cc_byz_task_varangians: "Die Warägergarde"
 cc_byz_task_varangians_desc: "Hebe eine Kompanie von Warägern ins Feld. Ausländer ohne Interesse an einer byzantinischen Fraktion, was genau der Grund ist, warum Kaiser ihnen vierhundert Jahre lang den Palast anvertraut haben."
 cc_byz_task_field_army: "Das wiederhergestellte Feldheer"
 cc_byz_task_field_army_desc: "Vierzig Regimenter bei sechzig Armee-Tradition. Keine Garnisonskraft und keine Söldner: eine Armee, die man irgendwohin schicken kann in der Erwartung, dass sie zurückkehrt."

 # ---- Reconvergence ----
 cc_byz_task_state_restored: "Der wiederhergestellte Staat"
 cc_byz_task_state_restored_desc: "Vollenden Sie zwei der drei Säulen. Das Reich muss nicht in jeder Hinsicht gleichzeitig stark sein, und kein Kaiser hat dies jemals geschafft. Es muss in zwei Bereichen stark genug sein, dass der dritte vernachlässigt werden kann, ohne dass das System kollabiert."

 # ---- The Greek World ----
 cc_byz_task_serbian_question: "Die serbische Frage"
 cc_byz_task_serbian_question_desc: "Beenden Sie Serbien oder machen Sie es zu einem Vasallen. Dusan krönte sich selbst zum Kaiser der Serben und Griechen und brachte dies beinahe zum Erfolg. Der Anspruch erlischt nicht, nur weil er starb."
 cc_byz_task_latin_bride: "Eine lateinische Braut"
 cc_byz_task_latin_bride_desc: "Schließen Sie eine königliche Ehe mit einer katholischen Macht. Jeder Kaiser der letzten zwei Jahrhunderte hat mindestens einmal nach Westen geheiratet, und jeder einzelne von ihnen wurde im eigenen Land dafür kritisiert."
 cc_byz_task_embassies: "Botschaften im Westen"
 cc_byz_task_embassies_desc: "Unterhalte vier Diplomaten. Das Reich hat sein schlimmstes Jahrhundert überstanden, indem es mehr über seine Feinde wusste, als diese voneinander wussten, und das muss kontinuierlich bezahlt werden."
 cc_byz_task_venetian_alliance: "Das venezianische Bündnis"
 cc_byz_task_venetian_alliance_desc: "Sorgen Sie für ein warmes Verhältnis Venedigs zum Kaiserreich. Sie beherrschen die Seewege und das Kreditwesen, sie haben diese Stadt einmal geplündert, und sie sind dennoch die bessere der zwei verfügbaren Optionen.\n\nDie Wahl dieses Weges schließt den genuesischen Weg aus."
 cc_byz_task_genoese_compact: "Der genuesische Pakt"
 cc_byz_task_genoese_compact_desc: "Sorgen Sie für ein warmes Verhältnis Genuesen zum Kaiserreich. Sie halten bereits Galata auf der anderen Seite des Wassers und die Hälfte des Schwarzmeerhandels, und eine Vereinbarung mit ihnen ist eine Vereinbarung mit den Leuten, die ohnehin vor Ort sind.\n\nDie Wahl dieses Weges schließt den venezianischen Weg aus."

 # ---- Anatolia ----
 cc_byz_task_sultan_tributary: "Der Tributzahler des Sultans"
 cc_byz_task_sultan_tributary_desc: "Mache die Osmanen zu einem Vasallen statt zu einem Leichnam. Das Reich hat ihnen jahrzehntelang Tribut gezahlt und Truppen in ihre Feldzüge geschickt; diese Vereinbarung umzukehren, kostet weitaus weniger als sie zu vernichten, und ist weitaus süßer.\n\nDie Wahl dieser Option schließt den Weg, sie vollständig zu vernichten."
 cc_byz_task_anatolia_secured: "Anatolien gesichert"
 cc_byz_task_anatolia_secured_desc: "Besitzen Sie die anatolischen Themen, wobei die türkische Frage durch Eroberung oder Tribut gelöst ist. Kleinasien ist der Ort, aus dem die Soldaten und das Getreide des Reiches kommen. Alles andere ist eine Frage des Wie lange."
 cc_byz_task_convert_anatolia: "Der wiedergefundene Glaube"
 cc_byz_task_convert_anatolia_desc: "Bringen Sie das Reich auf siebzig Prozent orthodoxe Bevölkerung. Zwei Jahrhunderte türkischer Herrschaft konvertierten mehr von Anatolien als jede Armee erobern konnte, und dies rückgängig zu machen, geht langsamer voran als die Eroberung selbst."
 cc_byz_task_tagmata: "Die wiederhergestellten Tagmata"
 cc_byz_task_tagmata_desc: "Fünfzig Regimenter und keine ausstehenden Pronoia-Zuweisungen. Eine besoldete Berufsarmee, die dem Palast untersteht und in Münzen statt in Land bezahlt wird.\n\nDie Wahl dieses Weges schließt den Weg des Feudalheeres aus."

 # ---- The Levant ----
 cc_byz_task_eastern_sees: "Die östlichen Bistümer"
 cc_byz_task_eastern_sees_desc: "Sichere zwei der drei antiken östlichen Patriarchate. Alle drei wären besser. Zwei sind das Maximum, was das Reich seit dem siebten Jahrhundert zu irgendeinem Zeitpunkt geschafft hat."
 cc_byz_task_sultans_friend: "Der Freund des Sultans"
 cc_byz_task_sultans_friend_desc: "Regle die heiligen Stätten durch eine schriftliche Vereinbarung mit Kairo. Ein Kondominium ist kein Triumph, und kein Chronist wird es als solchen bezeichnen. Es ist jedoch die erste geregelte Ostgrenze seit vierhundert Jahren.\n\nDie Wahl dieser Option schließt den Weg zum Pentarchie-Krieg."
 cc_byz_task_pentarchy_war: "Der Pentarchie-Krieg"
 cc_byz_task_pentarchy_war_desc: "Besitzen Sie alle fünf alten Patriarchate. Konstantinopel, Rom, Jerusalem, Antiochia und Alexandria unter einem Kaiser zum ersten Mal seit vor den arabischen Eroberungen.\n\nDie Wahl dieses Weges schließt den Weg einer ausgehandelten Einigung aus."

 # ---- The West ----
 cc_byz_task_sicily: "Sizilien zurückgewonnen"
 cc_byz_task_sicily_desc: "Besitzen Sie Palermo und Syrakus. Die Insel ist das Scharnier zwischen den zwei Hälften des Meeres, und keine Flotte überquert es ohne die Erlaubnis dessen, der diese zwei Häfen hält."
 cc_byz_task_ravenna: "Ravenna wiederhergestellt"
 cc_byz_task_ravenna_desc: "Besitzen Sie Ravenna. Der Sitz des alten Exarchats und die einzige Stadt in Italien, in der man sich an die kaiserliche Verwaltung als Regierung und nicht als Besatzung erinnert."
 cc_byz_task_western_sea: "Das Westmeer"
 cc_byz_task_western_sea_desc: "Gewinne zwei der drei westlichen Kriegsschauplätze zurück. Justinian nahm zuerst Afrika und danach Italien ein; die Reihenfolge war eine Frage der Gelegenheit statt eines Plans, und das kann wieder so sein."

 # ---- The East ----
 cc_byz_task_crown_monopoly: "Das Kronmonopol"
 cc_byz_task_crown_monopoly_desc: "Fünfzig Dukaten monatliches Handelseinkommen, die über die Krone laufen. Die Gewürze werden von kaiserlichen Beamten gekauft und verkauft, und der Gewinn erreicht die Schatzkammer ungeschmälert.\n\nDie Wahl dieses Weges schließt den Weg der Privilegien aus."
 cc_byz_task_chartered_company: "Die privilegierte Handelsgesellschaft"
 cc_byz_task_chartered_company_desc: "Lasse eine Handelsgesellschaft den Handel führen. Weniger gelangt in die Schatzkammer, aber es wächst eine Kaufmannsklasse heran, die den Staat finanzieren kann, ohne Italien nach Konditionen zu fragen.\n\nDie Wahl dieser Option schließt den Weg des Monopols."

 # ---- Optional spurs ----
 cc_byz_task_reconquest_claim: "Die Antiquare"
 cc_byz_task_reconquest_claim_desc: "Erforsche dreißig Fortschritte. Gelehrte, die die alten Provinzregister durcharbeiten, stellen fest, was das Reich wann und auf welcher rechtlichen Grundlage besaß. Juristen können damit viel anfangen."
 cc_byz_task_greek_fire: "Das Griechische Feuer wiederentdeckt"
 cc_byz_task_greek_fire_desc: "Fünfzig Flotten-Tradition und eine alphabetisierte Bevölkerung. Die Formel war ein Staatsgeheimnis, das in einer einzigen Familie gehütet wurde, und sie ging auf die übliche Weise verloren: indem sie niemand aufschrieb."
 cc_byz_task_hagia_sophia: "Hagia Sophia instand gehalten"
 cc_byz_task_hagia_sophia_desc: "Unterhalte die Kathedrale von Konstantinopel. Die Kuppel ist zweimal eingestürzt und zweimal wieder aufgebaut worden, und das Gebäude war achthundert Jahre lang das Argument für die Bedeutung des Reiches."
 cc_byz_task_great_palace: "Der Große Palast"
 cc_byz_task_great_palace_desc: "Besitzen Sie sechs Kunstwerke. Der Palastkomplex verfällt, seit der Hof nach Blachernae zog, und Besucher haben begonnen, dies schriftlich anzumerken."
 cc_byz_task_thessaloniki: "Die zweite Stadt"
 cc_byz_task_thessaloniki_desc: "Besitzen Sie Thessaloniki. Die zweite Stadt des Reiches, sein zweiter Hafen und der einzige Ort neben der Hauptstadt mit Mauern, die den Namen verdienen."
 cc_byz_task_city_adorned: "Die geschmückte Stadt"
 cc_byz_task_city_adorned_desc: "Die Kathedrale instand gehalten, der Palast möbliert, die zweite Stadt im Besitz. Nichts davon gewinnt einen Krieg. All das ist der Grund, warum die Menschen immer noch hierher kommen, um zu sehen, wie ein Imperium aussieht."
 cc_byz_task_triumph: "Ein Triumph im Hippodrom"
 cc_byz_task_triumph_desc: "Siebzig Armee-Tradition. Die Formen sind in den Zeremonienbüchern festgehalten und wurden seit zweihundert Jahren nicht mehr ausgeführt, sodass der Großteil der Stadt sie noch nie gesehen hat."
