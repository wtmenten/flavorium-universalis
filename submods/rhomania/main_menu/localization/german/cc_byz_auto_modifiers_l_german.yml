l_german:
 # Auto-modifier labels.
 #
 # EVERY auto_modifier needs an AUTO_MODIFIER_NAME_<key> or it shows as a missing key in the
 # societal values breakdown. AUTO_MODIFIER_DESC_<key> is optional: vanilla ships 165 NAME
 # keys and only 16 DESC, so a name alone is the normal case and is what these use.
 #
 # CONVENTION. The name reads as the CONDITION, not as a title, because these appear in a list
 # explaining why a value is drifting. Compare vanilla's byz entries, e.g.
 # AUTO_MODIFIER_NAME_byz_capital_constantinople: "[capital|e] is [ShowLocationName('constantinople')]".
 # Each line below states the trigger it is attached to, so the player can read the list and
 # know what to change.
 #
 # Deliberately plain text rather than concept markup. These strings get machine-translated,
 # and an invented [scope.Function] token is the failure mode that errors in game, so the
 # tokens are omitted rather than guessed at.

 # Toward Dynatoi: the provincial powerful
 AUTO_MODIFIER_NAME_cc_byz_pronoia_grants: "Ausstehende Pronoia-Zuweisungen"
 AUTO_MODIFIER_NAME_cc_byz_weak_crown: "Macht des Kronbesitzes unter 35 %"
 AUTO_MODIFIER_NAME_cc_byz_ascendant_nobles: "Mächtiger und zufriedener Adel"

 # Toward Taxis: the imperial bureaus
 AUTO_MODIFIER_NAME_cc_byz_staffed_bureaus: "Büros besetzt und finanziert"
 AUTO_MODIFIER_NAME_cc_byz_strong_crown: "Macht des Kronbesitzes bei oder über 50 %"
 AUTO_MODIFIER_NAME_cc_byz_literate_administration: "Durchschnittliche Alphabetisierungsrate über 20 %"

 # The Rhomanismos advance line. Each of these carries the conditional bulk of an advance
 # whose permanent core sits on the advance itself, so the label names the advance and the
 # requirement that keeps it live.
 AUTO_MODIFIER_NAME_cc_byz_taxis_of_offices_active: "Taxis der Ämter, auf rhomaischer Seite"
 AUTO_MODIFIER_NAME_cc_byz_oikonomia_active: "Imperiale Oikonomia, auf der Seite der Rhomaios"
 AUTO_MODIFIER_NAME_cc_byz_tagmata_restored_active: "Die Tagmata wiederhergestellt, auf rhomaischer Seite"
 AUTO_MODIFIER_NAME_cc_byz_palaiologan_revival_active: "Die Palaiologische Renaissance, auf rhomaischer Seite"
 AUTO_MODIFIER_NAME_cc_byz_basilika_active: "Die Basilika, auf rhomaischer Seite"
 AUTO_MODIFIER_NAME_cc_byz_annona_active: "Die Annona, auf rhomaischer Seite"
 AUTO_MODIFIER_NAME_cc_byz_ecumenical_office_active: "Das Ökumenische Amt, auf rhomaischer Seite"
 AUTO_MODIFIER_NAME_cc_byz_dromos_active: "Der Dromos, auf rhomaischer Seite"
 AUTO_MODIFIER_NAME_cc_byz_thematic_administration_active: "Thematische Verwaltung, auf der Seite der Rhomaios"
 AUTO_MODIFIER_NAME_cc_byz_autokrator_active: "Autokrator, auf der Seite der Rhomaios"
 AUTO_MODIFIER_NAME_cc_byz_great_church_active: "Die Große Kirche, auf rhomaischer Seite"

 # These two additionally require the capital to still be Constantinople, which is the whole
 # trade the Renovatio track asks the player to make, so the label says so.
 AUTO_MODIFIER_NAME_cc_byz_renovatio_imperii_active: "Renovatio Imperii, auf der Seite der Rhomaios, Hauptstadt in Konstantinopel"
 AUTO_MODIFIER_NAME_cc_byz_exarchal_chancery_active: "Die Exarchale Kanzlei, auf rhomaischer Seite, Hauptstadt Konstantinopel"
