l_german:
 # The three new prefectures, each failing in its own way.
 #
 # Italy is not here: it already has the papal and Italian threads plus the shared friction and
 # demand arcs. These exist to answer the question the shared threads cannot, which is why
 # Africa is a different problem from Italy rather than the same problem further away.
 #
 # The Gallic thread is openly counterfactual. No eastern emperor ever held any of Gaul. It is
 # written as a thread about a Provencal aristocracy that never stopped being Roman being
 # informed that it has been recovered.

 # ---- AFRICA: the Moorish frontier ----
 cc_byz_prov.1.title: "Der Limes"
 cc_byz_prov.1.desc: "Die Grenze ist eine Linie auf einer Karte in der Hauptstadt und eine Reihe von Forts in einem Land, das niemand regiert.\n\nDie maurischen Konföderationen südlich davon sind kein Staat und können nicht so besiegt werden, wie ein Staat besiegt wird. Man kann sie bezahlen, bekämpfen oder ignorieren, und die Vorgänger des Reiches haben hier alle drei Methoden in dieser Reihenfolge versucht. Die Forts stehen noch immer. Einige werden von Männern gehalten, die seit drei Jahren keinen kaiserlichen Zahlmeister gesehen haben und Absprachen mit den Leuten getroffen haben, welche sie eigentlich bewachen sollten.\n\nDer Bericht des Exarchen ist ungewöhnlich direkt. Er will entweder Geld oder die Erlaubnis, nicht mehr so zu tun, als ob."
 cc_byz_prov.1.a: "Bezahle die Grenzregionen. Dafür sind sie da."
 cc_byz_prov.1.b: "Kaufen Sie eine Konföderation und lassen Sie sie die Linie halten."
 cc_byz_prov.1.c: "Haltet die Küste. Das Landesinnere war nie unseres."

 cc_byz_prov.2.title: "Der Bischof im Landesinneren"
 cc_byz_prov.2.desc: "Es gibt eine Gemeinde vier Tage landeinwärts mit einem Bischof, den der Patriarch nicht geweiht hat, die einer Disziplin folgt, welche die Hauptstadt zuletzt vor achthundert Jahren verurteilt hat und die anscheinend darauf gewartet hat.\n\nSie sind in keiner Weise Ketzer, wie ein Konzil es anerkennen würde. Sie vertreten die Ansicht, dass ein Priester, der vor der Verfolgung geflohen ist, die Sakramente nicht spenden kann, dass die Kirche der Märtyrer nicht die Kirche der Kompromissbereiten ist und dass Karthago nicht auf Konstantinopel angewiesen ist, um zu erfahren, was seine eigenen Märtyrer meinten.\n\nEs ist Donatismus in allem außer dem Namen, und der Name ist der einzige Teil, der jemals für jemanden in der Hauptstadt von Bedeutung war."
 cc_byz_prov.2.desc_coast: "Die Gemeinde befindet sich vier Tage landeinwärts, was bedeutet, dass sie weit außerhalb von allem liegt, was das Reich derzeit zu regieren beansprucht.\n\nSie haben einen Bischof, den der Patriarch nicht geweiht hat, und eine Disziplin, die die Hauptstadt vor achthundert Jahren verurteilt hat. Sie verfügen jedoch auch über die einzige funktionierende kirchliche Struktur zwischen der Küste und der Wüste, und die Küstenstädte handeln mit ihnen.\n\nDer Exarch merkt an, ohne etwas zu empfehlen, dass das Reich kürzlich entschieden hat, dass das Landesinnere nicht seine Angelegenheit sei."
 cc_byz_prov.2.a: "Verurteile es, wie jeder Kaiser es tat."
 cc_byz_prov.2.b: "Afrika hat darüber schon immer gestritten. Lassen wir sie gewähren."

 cc_byz_prov.3.title: "Die Rückstände"
 cc_byz_prov.3.desc: "Der Sold ist in den Wüstenforts elf Monate und an der Küste sieben Monate im Rückstand, und die Differenz zwischen diesen beiden Zahlen ist das eigentliche Problem: Die Männer am schlechtesten gelegenen Posten haben die höchsten Forderungen.\n\nSie sind Profis. Sie werden warten. Die Frage, die jede afrikanische Garnison irgendwann beantwortet hat, ist: Wie lange? Und das Reich kannte die Antwort nie, bevor sie gegeben wurde."
 cc_byz_prov.3.desc_paid: "Der Sold ist vier Monate im Rückstand, was in dieser Provinz als pünktlich gilt.\n\nDie Grenze wurde finanziert, als darum gebeten wurde, und der Unterschied ist sichtbar: Die Forts werden von Männern besetzt, die erwarten, bezahlt zu werden, und Männer, die erwarten, bezahlt zu werden, neigen dazu, dies weiterhin zu erwarten, anstatt andere Arrangements zu treffen.\n\nDer Schreiber des Exarchen hat die Zahlen ohne Kommentar beigefügt, was von ihm eine Art von Kommentar ist."
 cc_byz_prov.3.a: "Kaufen Sie sie zurück. Was auch immer nötig ist."
 cc_byz_prov.3.b: "Sie hielten stand. Sag es öffentlich."

 # ---- SPANIA: the narrow province ----
 cc_byz_prov.10.title: "Das Gesetz in den Städten"
 cc_byz_prov.10.desc: "Die Provinz hat Gerichte. Es sind nicht die Gerichte des Reiches.\n\nDie Städte hier folgen seit sechshundert Jahren einem westgotischen Kodex: schriftlich fixiert, kohärent, gelehrt und verwaltet von Männern, deren Väter ihn bereits verwalteten. Er handhabt das Erbrecht anders als das römische Recht, er handhabt Schulden anders, und es ist das, was jeder in Cartagena meint, wenn er vom Gesetz spricht.\n\nDas eigene Recht des Reiches ist älter, besser und fremd. Dieses letzte Wort erledigt die ganze Arbeit."
 cc_byz_prov.10.a: "Das römische Recht gehört dem Reich. Setze es durch."
 cc_byz_prov.10.b: "Ein Gesetz, dem niemand folgt, ist schlimmer als eines, das nicht das unsere ist."

 cc_byz_prov.11.title: "Das Angebot des Nachbarn"
 cc_byz_prov.11.desc: "Die Taifa im Binnenland hat einen Kaufmann statt eines Gesandten geschickt, was an sich schon die Botschaft ist.\n\nSie würden lieber handeln als kämpfen. Sie haben Silber, die Küste hat Häfen, und keine Seite hat die Kraft, der anderen etwas abzunehmen, das den Wert der Kosten für die Einnahme rechtfertigen würde. Der Vorschlag ist detailliert, kommerziell sinnvoll und würde die Provinz zum ersten Mal seit ihrer Rückgewinnung zahlungsfähig machen.\n\nEs würde jedoch auch bedeuten, dass Beamte eines orthodoxen Kaisers mit ihnen zusammensitzen, um Zölle schriftlich und mit Unterschriften zu vereinbaren."
 cc_byz_prov.11.a: "Solvenz ist keine Kleinigkeit."
 cc_byz_prov.11.b: "Wir handeln nicht mit ihnen."

 cc_byz_prov.12.title: "Die unverteidigbare Provinz"
 cc_byz_prov.12.desc: "Die Einschätzung wurde eingereicht, und es ist dieselbe Einschätzung, die jeder Gouverneur hier eingereicht hat.\n\nDie Provinz ist ein Küstenstreifen mit Bergen dahinter und ohne Hinterland. Sie kann ihre eigene Garnison nicht ernähren. Sie kann nur über den Seeweg verstärkt werden, und die Seeroute führt über die gesamte Länge des Mittelmeers an zwei feindlichen Küsten vorbei. Hält man sie gegen einen ernsthaften Versuch, fällt sie; hält man sie gegen nichts Besonderes, kostet sie Geld.\n\nWas sie jedoch hat, sind Häfen, und Häfen an diesem Ende des Meeres sind für eine Flotte etwas wert."
 cc_byz_prov.12.desc_latin: "Die Einschätzung wurde eingereicht, und es gibt darin einen Absatz, der in den vorherigen nicht enthalten war.\n\nDie Provinz kann nicht gehalten, nicht ernährt und nur über den Seeweg verstärkt werden. So viel bleibt unverändert. Neu ist die Beobachtung, dass die Städte nun nach ihrem eigenen Recht, in ihrer eigenen Sprache und unter Honoratioren geführt werden, welche das Reich eher bestätigt als ernennt, und dass der praktische Unterschied ein Jahrzehnt brauchen würde, um sichtbar zu werden, wenn die kaiserliche Garnison morgen abreisen würde.\n\nDer Gouverneur zieht keine Schlussfolgerung. Er musste es nicht."
 cc_byz_prov.12.a: "Tausche es gegen etwas ein, das von Bedeutung ist."
 cc_byz_prov.12.b: "Eine Navalstation, und sonst nichts."
 cc_byz_prov.12.c: "Verstärke es ordnungsgemäß."

 # ---- GAUL: the Rhone command ----
 cc_byz_prov.20.title: "Bereits römisch"
 cc_byz_prov.20.desc: "Die Delegation aus den provenzalischen Städten ist höflich, gut gekleidet und spricht ein Latein von einer Qualität, die zwei der Sekretäre des Kaisers in Verlegenheit gebracht hat.\n\nSie möchten dem Kaiser zur Rückgewinnung der Provinz gratulieren. Sie möchten vermerkt wissen, dass die Provinz kontinuierlich römisch geblieben ist, dass ihre kommunalen Institutionen ohne Unterbrechung funktionierten, noch bevor die Hauptstadt gegründet wurde, und dass ihre Familien Titel tragen, die von Kaisern verliehen wurden, deren Namen die kaiserliche Kanzlei erst nachschlagen musste.\n\nSie sind nicht schwierig. Sie drücken extrem klar aus, was sie glauben, dass gerade passiert ist: nämlich, dass Konstantinopel endlich zurückgekehrt ist."
 cc_byz_prov.20.a: "Bestätige ihren Status. Sie waren zuerst Römer."
 cc_byz_prov.20.b: "Sie sind eine zurückgewonnene Provinz wie jede andere."

 cc_byz_prov.21.title: "Der Anspruch aus dem Norden"
 cc_byz_prov.21.desc: "Die fränkische Position ist kurz gefasst, dass das Rhonetal seit achthundert Jahren in ihrem Besitz ist und das Erscheinen einer griechischen Verwaltung darin nichts ändert.\n\nDiese Position ist nicht unvernünftig. Die Linie, die das Reich tatsächlich halten kann, sind die Alpen und der Fluss, und alles nördlich davon wird bereits seit vor der Existenz eines östlichen Reiches von anderswo aus regiert.\n\nDer Exarch hat um Ingenieure, Geld und eine Entscheidung gebeten. Er merkt an, dass er zwei dieser drei Dinge vor Ort beschaffen kann."
 cc_byz_prov.21.a: "Haltet die Pässe. Das ist die Provinz."
 cc_byz_prov.21.b: "Kaufen Sie sie ab. Wir haben dies an längeren Grenzen getan."
 cc_byz_prov.21.c: "Es ist sein Befehl. Lasst ihn ihn befehlen."

 cc_byz_prov.22.title: "Das Rhone-Kommando"
 cc_byz_prov.22.desc: "Was auch immer diese Provinz ist, sie ist keine Präfektur im Sinne, wie die Kanzlei das Wort verwendet.\n\nSie ist ein Fluss, eine Reihe von Pässen, ein Dutzend Städte, die sich kompetent selbst verwalten und dies schon immer taten, und eine Garnison, die seit einer Generation lokal rekrutiert wird, weil es absurd ist, Männer aus dem Osten an die Rhone zu schicken, um die Rhone zu verteidigen.\n\nDie Frage ist nicht, wie man sie regieren soll. Sondern wie man das Ding nennt, das sie bereits regiert."
 cc_byz_prov.22.desc_march: "Die Provinz regiert sich selbst, und das tut sie seit der ersten Bestätigung der lokalen Honoratioren, die der Palast nie ganz dazu gekommen ist, zu überprüfen.\n\nSie hält die Pässe. Sie zahlt etwas. Sie sendet Kontingente, wenn man sie darum bittet, meistens. Ihre führenden Familien verwenden kaiserliche Titel mit vollkommener Korrektheit und haben seit elf Jahren keine kaiserliche Anweisung benötigt.\n\nDie Kanzlei würde gerne ein Wort für diesen Zustand finden."
 cc_byz_prov.22.a: "Eine Mark. Sie hält die Grenze und entscheidet, wie."
 cc_byz_prov.22.b: "Lasst den Franken die Substanz. Wir behalten den Titel."
 cc_byz_prov.22.c: "Regiere es direkt und bezahle dafür."
