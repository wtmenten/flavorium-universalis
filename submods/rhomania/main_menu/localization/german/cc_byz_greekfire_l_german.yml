l_german:
 # The Greek Fire chain, fired by the cc_byz_task_greek_fire mission task.
 #
 # The historical position, which the text holds to: the composition was a state secret
 # restricted to the Kallinikos family and the imperial arsenal, it was already unreliable by
 # the twelfth century, and it was lost through ordinary bureaucratic attrition rather than any
 # catastrophe. Nobody burned the recipe. It simply stopped being written down by people who
 # knew what they were writing.

 cc_byz_fire.1.title: "Das griechische Feuer"
 cc_byz_fire.1.desc: "Die Zeremonienbücher beschreiben es. Die Chroniken beschreiben es. Anna Komnene beschreibt die Köpfe aus Bronze in Form von Bestien an den Bugspitzen und das Feuer, das daraus hervorging; sie schrieb bereits vor zweihundert Jahren über etwas, das die Flotte ihres Vaters noch führte.\n\nNiemand im Arsenal kann es herstellen.\n\nDas Geheimnis wurde von einer einzigen Familie und den kaiserlichen Werkstätten gehütet, und es wurde absichtlich nie an einem einzigen Ort niedergeschrieben. Was überblieben ist, ist verstreut: hier eine Notiz über Mengen, dort eine Bemerkung über die Pumpen, ein Klosterinventar, das eine Zutat auflistet, die heute niemand mehr erkennt. Der Droungarios glaubt, dass es wieder zusammengesetzt werden könnte. Er ist sich nicht sicher, und er ist nicht der Typ Mann, der so etwas leichtfertig behauptet."
 cc_byz_fire.1.desc_lettered: "Die Zeremonialbücher beschreiben es, die Chroniken beschreiben es, und zum ersten Mal gibt es in dieser Stadt Männer, die sie alle lesen können.\n\nDas Geheimnis wurde von einer Familie und den kaiserlichen Werkstätten bewahrt und war nie absichtlich in einem einzigen Dokument festgehalten. Was überlebt hat, ist über vier Jahrhunderte von Notizen, Inventaren und Randbemerkungen verstreut. Es zusammenzusetzen ist keine Frage der Entdeckung, sondern der Gelehrsamkeit, und an dieser einen Ware hat es der Hauptstadt nie gemangelt.\n\nDer Droungarios hat die relevanten Bände mitgebracht. Es sind sehr viele."
 cc_byz_fire.1.desc_already: "Das Arsenal besitzt es bereits.\n\nDie Siphons sind gegossen, die Besatzungen kennen das Verfahren und die Zusammensetzung steht im Werkstattbuch unter einem Namen, der für jeden bedeutungslos ist, dem er nicht gezeigt wurde. Was der Flotte fehlt, ist das Geld, um genügend davon zu bauen, und das ist ein Problem, das die Schatzkammer lösen kann."
 cc_byz_fire.1.a_already: "Dann finanziere das Arsenal ordnungsgemäß."
 cc_byz_fire.1.a: "Überlasse es den Gelehrten."
 cc_byz_fire.1.b: "Schicke sie in die Klöster."
 cc_byz_fire.1.c: "Es gibt einen Mann im Gefangenenlager, der Siphons gebaut hat."
 cc_byz_fire.1.d: "Das Reich hat vierhundert Jahre ohne es überstanden."

 cc_byz_fire.2.title: "Die Siphon-Versuche"
 cc_byz_fire.2.desc: "Sie haben etwas. Ob es das richtige Etwas ist, ist eine andere Frage, und der Weg, dies herauszufinden, erfordert einen Lastkahn, einen Abschnitt des Goldenen Horns weit weg von allem Wertvollen und eine Besatzung, der gesagt wurde, wie hoch die Bezahlung ist, bevor ihr gesagt wurde, was die Arbeit ist.\n\nDie ersten drei Versuche erzeugen eine Menge Rauch. Der vierte erzeugt das Ding selbst, das am Wasser haftet und darauf brennt, und die Besatzung auf dem Lastkahn wird sehr still.\n\nDer Droungarios möchte ein zweites Arsenal bauen, bevor dies weitergeht. Er weist korrekterweise darauf hin, dass das Reich in den folgenden fünfzig Jahren genuesische Schiffe mieten musste, als das letzte Mal ein Kaiser bei der Flotte sparte."
 cc_byz_fire.2.desc_archive: "Die Mönche waren nicht erfreut, gefragt zu werden, und noch weniger erfreut, im Recht zu sein. Die entsprechende Passage befand sich in einem Inventar für Marinevorräte in Abydos aus dem zwölften Jahrhundert, kopiert von jemandem, der offensichtlich nicht verstand, was er kopierte, und es daher exakt transkribierte.\n\nDie ersten drei Versuche erzeugen eine Menge Rauch. Der vierte erzeugt das Ding selbst, das am Wasser haftet und darauf brennt, und die Besatzung auf dem Lastkahn wird sehr still.\n\nDer Droungarios möchte ein zweites Arsenal bauen, bevor dies weitergeht."
 cc_byz_fire.2.desc_captive: "Der Ingenieur spricht. Er spricht tatsächlich sehr viel und über mehr, als er gefragt wurde, was die Schwierigkeit ist: ein Mann, der ein Geheimnis verkauft, hat bereits offengelegt, womit er seinen Lebensunterhalt verdient.\n\nDie ersten drei Versuche erzeugen eine Menge Rauch. Der vierte erzeugt das Ding selbst, das am Wasser haftet und darauf brennt, und die Besatzung auf dem Lastkahn wird sehr still.\n\nDer Droungarios möchte ein zweites Arsenal bauen, bevor dies weitergeht, und er möchte, dass der Ingenieur an einem Ort untergebracht wird, der von einer Mauer umgeben ist."
 cc_byz_fire.2.a: "Ein einziges Arsenal wird genügen."
 cc_byz_fire.2.b: "Baue die zweite und setze an beide eine Wache."

 cc_byz_fire.3.title: "Das wiederhergestellte Feuer"
 cc_byz_fire.3.desc: "Die Zusammensetzung ist niedergeschrieben. Nicht an einem Ort: an drei, getrennt aufbewahrt von Männern, die die Namen der anderen nicht kennen, was in etwa der Anordnung entspricht, die das Reich zuvor hatte und die weitaus besser dokumentiert ist.\n\nDie Siphons werden im Arsenal aus Bronze gegossen. Die Besatzungen trainieren über den Winter, anfangs schlecht und dann nicht mehr so schlecht, und bis zum Frühjahr liegen Galeeren im Horn mit den Bestienköpfen an ihren Bugspitzen, wie Anna Komnene sie beschrieb.\n\nEs ist eine Waffe und es ist auch ein Argument. Die Flotte, die sie führte, war die Flotte, welche zwei arabische Belagerungen dieser Stadt brach, und jeder im Mittelmeerraum, der eine Chronik gelesen hat, weiß das."
 cc_byz_fire.3.desc_leaked: "Die Zusammensetzung ist niedergeschrieben, an drei verschiedenen Orten, getrennt aufbewahrt von Männern, die die Namen der anderen nicht kennen.\n\nSie ist jedoch auch, wie der Droungarios berichtet, ohne dem Kaiser in die Augen zu sehen, in Genua niedergeschrieben. Oder in Venedig. Möglicherweise an beiden Orten. Etwas ist zusammen mit den Schiffbauern, den Geschäftsbüchern oder einem Schreiber entwichen, dem Geld geschuldet wurde, und es hat jetzt keinen Sinn mehr, herauszufinden, wer genau.\n\nDie Siphons werden dennoch gegossen, die Besatzungen trainieren über den Winter, und bis zum Frühjahr liegen Galeeren im Horn mit den Bestienköpfen an ihren Bugspitzen. Das Reich hat sein Feuer zurück. Es besitzt es nur nicht mehr allein, was eine andere Waffe ist als die, die Konstantin IV. hatte, und es ist lohnenswert, dies zu bedenken, bevor man sich darauf verlässt."
 cc_byz_fire.3.a: "Gieße die Siphons."

 cc_byz_fire_unlocked_tt: "Die Siphons können an Galeeren angebracht und von Fußsoldaten getragen werden"

 # ---- The generic-action twin ----
 # Mission packs default to OFF, so this is how most players reach the chain.
 cc_byz_recover_greek_fire: "Gewinne das Griechische Feuer zurück"
 cc_byz_recover_greek_fire_desc: "Beauftrage das Arsenal und die Gelehrten damit, die Zusammensetzung zu rekonstruieren. Sie wurde nie an einem Ort aufgeschrieben, weshalb sie verloren ging und weshalb sie wiedergefunden werden kann."
