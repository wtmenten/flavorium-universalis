l_german:
 # Stepping-stone mission tasks.
 #
 # These 25 tasks are mission-mode only: mission packs default to OFF, and the stepping
 # stones deliberately have no generic-action twin. Only the nine cornerstones do.
 #
 # Descriptions state the condition plainly, because a mission task the player cannot work
 # out how to complete is not content. Flavour goes in the second sentence, never the first.

 # A. The House in Order
 cc_byz_task_walls: "Die Mauern stehen"
 cc_byz_task_walls_desc: "Sechsundfünfzig Türme an der äußeren Mauer, sechsundneunzig an der inneren und ein Graben, der so lange schon trocken liegt, wie man sich erinnern kann. In tausend Jahren sind sie nur einmal gescheitert, und dieses eine Mal war es gegen die Lateiner, die über das Meer kamen.\n\nDas Mauerwerk ist theodosianisch. Die Reparaturen stammen von allen möglichen Leuten."
 cc_byz_task_hippodrome: "Brot und Spiele"
 cc_byz_task_hippodrome_desc: "Die Blauen auf der einen Seite, die Grünen auf der anderen und ein Kaiser im Kathisma, der gelernt hat zuzuhören. Es ist keine Rennbahn. Es ist das einzige Gebäude im Reich, in dem das Volk ihm Dinge ins Gesicht sagen kann, ohne dafür verhaftet zu werden, und jeder Kaiser, der das vergaß, fand es in derselben Woche heraus."
 cc_byz_task_council: "Ein vollständiger Rat"
 cc_byz_task_council_desc: "Ein einzelner Mann kann nicht jede Depesche lesen, und ein Kaiser, der es versucht, wird keine einzige von ihnen richtig lesen. Wir brauchen Männer am Tisch, von denen jeder eine Provinz kennt, und wir brauchen sie, damit sie uns laut widersprechen."
 cc_byz_task_bureaus: "Die finanzierten Bureaus"
 cc_byz_task_bureaus_desc: "Jedes Reich, das Bestand hatte, war am Ende ein Raum voller Schreiber. Unsere sind unbezahlt, was eine Sache ist, von der wir beschlossen haben, sie nicht mehr zu bemerken.\n\nSie müssen finanziert werden, und zwar stetig. Ein großzügiger Monat vor einer Inspektion ist noch keine Verwaltung."
 cc_byz_task_arsenal: "Das Arsenal"
 cc_byz_task_arsenal_desc: "Die Meerengen sind der Grund, warum diese Stadt überlebt hat, und die Meerengen sind nichts wert ohne Rümpfe im Wasser. Wir haben fünfzig Jahre lang italienische Schiffe gemietet und mehr bezahlt, als eine eigene Flotte gekostet hätte."

 # B. The Greek Claimants
 cc_byz_task_no_second_emperor: "Kein zweiter Kaiser"
 cc_byz_task_no_second_emperor_desc: "Trapezunt bezeichnet seinen Herrscher als Kaiser und Autokrat der Römer, was unser Titel ist, und tut dies seitdem die Stadt an die Latiner fiel und jeder mit einem Anspruch damit woandershin ging. Die Großen Komnenen sind Cousins. Das hat die Rechnung nie verbessert."
 cc_byz_task_duchy_dissolved: "Das aufgelöste Herzogtum"
 cc_byz_task_duchy_dissolved_desc: "Eine burgundische Familie hält die Akropolis und nennt sich das Herzogtum Athen. Der Parthenon ist unter ihnen seit einem Jahrhundert eine Kathedrale, was zumindest eine Nutzung darstellt, und die Vereinbarung datiert von der Plünderung dieser Stadt im Jahr 1204."
 cc_byz_task_despotate: "Das Despotat"
 cc_byz_task_despotate_desc: "Mistra, in den Hügeln über Sparta, ist die einzige Provinz dieses Reiches, die wächst. Gelehrte gehen jetzt dorthin, anstatt hierher zu kommen. Das sollte ein Trost sein, ist es aber nicht."
 cc_byz_task_greek_again: "Wieder griechisch"
 cc_byz_task_greek_again_desc: "Athen wird schon so lange von Lateinern regiert, dass eine Generation unter ihrem Ritus aufgewachsen ist und sich an keinen anderen erinnert. Die Stadt zurückzuerobern, ist das Werk einer Saison. Der Rest ist das nicht."

 # C. Anatolia
 cc_byz_task_beylik_ended: "Das Ende des Beyliks"
 cc_byz_task_beylik_ended_desc: "Ein Grenzfürstentum in Sogut, zwei Tagesritte vom Meer entfernt, regiert von einer Familie, die vor vierzig Jahren niemand in dieser Stadt hätte benennen können. Sie haben Bursa eingenommen. Sie haben Nikaia eingenommen. Sie sind nach Gallipoli übergesetzt.\n\nMan kann ihnen immer noch ein Ende setzen."
 cc_byz_task_themes: "Die Themen reformiert"
 cc_byz_task_themes_desc: "Soldaten, die im Austausch für die Verteidigung der Linie Land erhielten und unter einem Strategos standen, der zugleich ihr Gouverneur war. Dreihundert Jahre lang funktionierte dies, bis die Magnaten das Land kauften und die Verteidigungslinie damit verschwand."
 cc_byz_task_pronoia_host: "Das Pronoia-Heer"
 cc_byz_task_pronoia_host_desc: "Gewährt man einem Mann die Einnahmen eines Distrikts, so bringt er Soldaten, wenn er gerufen wird. Es kostet die Schatzkammer nichts, weshalb es unwiderstehlich ist, und es kostet die Schatzkammer den Distrikt, weshalb man ihm widerstehen sollte.\n\nDie Wahl dieser Option schließt den Weg der Tagmata aus."

 # D. The Levant
 cc_byz_task_antioch: "Antiochia wiederhergestellt"
 cc_byz_task_antioch_desc: "Einer der fünf patriarchalen Sitze, die Stadt, in der die Anhänger Christi zuerst Christen genannt wurden, und kaiserliches Territorium innerhalb der lebenden Erinnerung an den Ersten Kreuzzug. Der Patriarch von Antiochia lebt seit zweihundert Jahren in Konstantinopel, weil es für ihn sonst nirgendwo mehr einen Ort zum Leben gab."
 cc_byz_task_holy_city: "Die heilige Stadt"
 cc_byz_task_holy_city_desc: "Das Grabmal, der Fels und jede Straße der Christenheit, die dorthin führt. Das Reich hat über drei Herrschaftswechsel hinweg die Lampen in dieser Kirche bezahlt, ohne dass man uns jemals bat, damit aufzuhören."
 cc_byz_task_patriarch: "Der Patriarch kehrt zurück"
 cc_byz_task_patriarch_desc: "Das Patriarchat überlebte acht Jahrhunderte muslimischer Herrschaft, indem es extrem vorsichtig war. Es wird mehr als ein Wechsel der Garnison brauchen, um es zum Schweigen zu bringen."
 cc_byz_task_egypt: "Ägypten und das Delta"
 cc_byz_task_egypt_desc: "Ägypten hat diese Stadt dreihundert Jahre lang gespeist und seit siebenhundert Jahren jemand anderen. Die Liegeplätze der Getreideflotte im Hafen tragen immer noch ihre alten Namen, werden aber für etwas anderes genutzt."
 cc_byz_task_lighthouse: "Der Leuchtturm"
 cc_byz_task_lighthouse_desc: "Es stand sechzehnhundert Jahre lang, und die Erdbeben haben den Großteil davon verschlungen. Was übrig bleibt, ist ein Stumpf auf einer Mole in einem Arbeitshafen, was nützlicher als ein Weltwunder und weniger beeindruckend ist."
 cc_byz_task_sinai_road: "Die Sinai-Straße"
 cc_byz_task_sinai_road_desc: "Die Landenge zwischen zwei Meeren und das einzige Land, das die Gewürze zwischen Indien und Alexandria berühren. Wer sie hält, besteuert alles, was vorbeizieht, und benötigt keine Flotte, um dies zu tun."

 # E. The Western Crossing
 cc_byz_task_adriatic: "Die Adria-Überquerung"
 cc_byz_task_adriatic_desc: "Dyrrhachium ist dort, wo die Straße nach Italien beginnt und wo jede Invasion auf dem Balkan aus dem Westen landete. Die Via Egnatia führt von ihrem Tor zum unseren."
 cc_byz_task_exarch_seated: "Der eingesetzte Exarch"
 cc_byz_task_exarch_seated_desc: "Ein Gouverneur in Ravenna mit den Truppen, den Gerichten und den Einnahmen Italiens in seinen Händen, ernannt von einem Kaiser, der sechs Wochen Segelfahrt entfernt ist.\n\nDas Amt funktionierte zweihundert Jahre lang. Es lohnt sich zu wissen, wie es endete."
 cc_byz_task_carthage: "Karthago zurückgewonnen"
 cc_byz_task_carthage_desc: "Belisar nahm Afrika in einer einzigen Saison mit fünfzehntausend Männern von den Vandalen weg, was das erfolgreichste Unterfangen bleibt, das dieses Reich je vollbracht hat, und eine Erwartung weckte, die seitdem niemand mehr erfüllt hat."
 cc_byz_task_pillars: "Die Säulen"
 cc_byz_task_pillars_desc: "Die Säulen des Herakles und das Ende der Welt, wie es die Alten sahen. Das Reich hielt die gegenüberliegende Seite siebzig Jahre lang und konnte sich selbst nie ganz erklären, warum."

 # F. The Merchant Empire
 cc_byz_task_galata: "Die Galata-Zölle"
 cc_byz_task_galata_desc: "Das genuesische Viertel gegenüber dem Horn zahlt uns einen Bruchteil dessen, was es einnimmt, und nimmt siebenmal mehr ein als unser eigenes Zollhaus. Die Zahlen wurden dem Kaiser im Jahr 1348 vorgelegt, und der darauf folgende Krieg wurde zur See verloren."
 cc_byz_task_merchant_fleet: "Eine Handelsflotte"
 cc_byz_task_spice_dues: "Die Gewürzabgaben"
 cc_byz_task_spice_dues_desc: "Auf dieser Stufe ist das Zollhaus mehr wert als mehrere Provinzen und kostet nichts an Garnison. Jeder in Italien hat dieselbe Rechnung aufgemacht."

 # Stepping-stone reward modifiers
 STATIC_MODIFIER_NAME_cc_byz_reward_fortifications: "In gutem Zustand befindliche Mauern"
 STATIC_MODIFIER_DESC_cc_byz_reward_fortifications: "Das Mauerwerk ist solide, die Zisternen sind voll und die Garnison wurde bezahlt. Nichts davon ist von Dauer."
 STATIC_MODIFIER_NAME_cc_byz_reward_naval: "Eine Saison des Schiffbaus"
 STATIC_MODIFIER_DESC_cc_byz_reward_naval: "Holz, Seile und Männer, die wissen, was sie mit beidem anzufangen haben."
 STATIC_MODIFIER_NAME_cc_byz_reward_trade: "Die Zölle funktionieren"
 STATIC_MODIFIER_DESC_cc_byz_reward_trade: "Abgaben werden dort eingezogen, wo sie anfallen sollten, von Männern, die sie weiterleiten."
 STATIC_MODIFIER_NAME_cc_byz_reward_administration: "Die Ämter sind besetzt"
 STATIC_MODIFIER_DESC_cc_byz_reward_administration: "Die Einschätzung ist aktuell, die Schreiber sind bezahlt und jemand weiß, wo die Register sind."
 STATIC_MODIFIER_NAME_cc_byz_reward_manpower: "Rekruten aus den Themen"
 STATIC_MODIFIER_DESC_cc_byz_reward_manpower: "Männer aus einer Provinz, die beschlossen hat, dass sie zu uns gehört, was nicht dasselbe ist wie eine Provinz, die wir beherrschen."
 STATIC_MODIFIER_NAME_cc_byz_reward_confidence: "Die Stadt glaubt"
 STATIC_MODIFIER_DESC_cc_byz_reward_confidence: "Ein öffentlicher Erfolg, und eine Hauptstadt, die bereit ist, dem Thron für eine Weile den Nutzen des Zweifels zuzugestehen."
 cc_byz_task_merchant_fleet_desc: "Keine Flotte, die das Reich besitzt. Eine Flotte, die unter seiner Flagge segelt, ihre Abgaben hier zahlt und lieber von uns als von jemand anderem geschützt werden möchte.\n\nDie Register führen jeden lateinischen Besitz in der Ägäa auf, auf den dies nicht zutrifft."
