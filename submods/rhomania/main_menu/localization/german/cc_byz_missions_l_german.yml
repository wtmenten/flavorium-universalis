l_german:
 # Stepping-stone mission tasks.
 #
 # These 25 tasks are mission-mode only: mission packs default to OFF, and the stepping
 # stones deliberately have no generic-action twin. Only the nine cornerstones do.
 #
 # Descriptions state the condition plainly, because a mission task the player cannot work
 # out how to complete is not content. Flavour goes in the second sentence, never the first.

 # A. The House in Order
 cc_byz_task_walls: "Die Mauern stehen"
 cc_byz_task_walls_desc: "Unterhalte die Theodosianischen Mauern in Konstantinopel. Sie haben in neunhundert Jahren genau einmal versagt, und die Stadt hat nie aufgehört, für die Reparatur zu bezahlen."
 cc_byz_task_hippodrome: "Brot und Spiele"
 cc_byz_task_hippodrome_desc: "Unterhalte das Hippodrom. Hier sagen die Menschen dieser Stadt ihrem Kaiser, was sie von ihm halten, was es wert ist zu wissen, bevor es herausgeschrien wird."
 cc_byz_task_council: "Ein vollständiger Rat"
 cc_byz_task_council_desc: "Setze fünf Mitglieder in das Kabinett ein. Ein Kaiser, der alleine regiert, ist ein Kaiser, dessen Nachfolger nichts als einen Stuhl erbt."
 cc_byz_task_bureaus: "Die finanzierten Bureaus"
 cc_byz_task_bureaus_desc: "Betreibe vier Bürokratien mit vollem Unterhalt. Unspektakulär, teuer und der Unterschied zwischen einem Reich und einem Hofstaat."
 cc_byz_task_arsenal: "Das Arsenal"
 cc_byz_task_arsenal_desc: "Unterhalte eine Werft in Konstantinopel. Die Meerengen sind der einzige Grund, warum diese Stadt überlebt hat, und sie sind nichts wert ohne Rümpfe im Wasser."

 # B. The Greek Claimants
 cc_byz_task_no_second_emperor: "Kein zweiter Kaiser"
 cc_byz_task_no_second_emperor_desc: "Beende das Kaiserreich Trapezunt. Ihr Anspruch ist echt, ihre Abstammung kaiserlich, und es kann nicht zwei geben."
 cc_byz_task_duchy_dissolved: "Das aufgelöste Herzogtum"
 cc_byz_task_duchy_dissolved_desc: "Beende das Herzogtum Athen. Der Besitz eines lateinischen Abenteurers auf griechischem Boden, verwaltet auf Französisch, drei Segeltage von der Hauptstadt entfernt."
 cc_byz_task_despotate: "Das Despotat"
 cc_byz_task_despotate_desc: "Halte Achaia und Arkadien vollständig. Die Morea ist der letzte Teil des Reiches, der sich noch selbst versorgt und noch Soldaten schickt."
 cc_byz_task_greek_again: "Wieder griechisch"
 cc_byz_task_greek_again_desc: "Halte Attika vollständig und führe Athen zu einer orthodoxen Mehrheit. Die Stadt wurde so lange von Lateinern regiert, dass eine Generation unter ihrem Ritus aufgewachsen ist."

 # C. Anatolia
 cc_byz_task_beylik_ended: "Das Ende des Beyliks"
 cc_byz_task_beylik_ended_desc: "Beende den osmanischen Staat. Jede andere Frage, vor der das Reich steht, ist eine Frage der Zeit, und dies ist diejenige, die entscheidet, wie viel davon übrig bleibt."
 cc_byz_task_themes: "Die Themen reformiert"
 cc_byz_task_themes_desc: "Besitze fünfundzwanzig Orte in Anatolien. Das Themensystem war die Art und Weise, wie dieses Reich seine Armeen versorgte und aushob, und es benötigt Kleinasien überhaupt erst, um zu existieren."
 cc_byz_task_pronoia_host: "Das Pronoia-Heer"
 cc_byz_task_pronoia_host_desc: "Unterhalte drei Pronoia-Lehen. Land, das im Austausch für Soldaten gehalten wird: billiger als sie zu bezahlen, und die Rechnung kommt erst in einer späteren Regierungszeit."

 # D. The Levant
 cc_byz_task_antioch: "Antiochia wiederhergestellt"
 cc_byz_task_antioch_desc: "Halte Antiochia oder sichere seinen patriarchalen Sitz. Einer der fünf antiken Bistümer, verloren an die Araber, bevor das Schisma überhaupt ein Streitpunkt war."
 cc_byz_task_holy_city: "Die heilige Stadt"
 cc_byz_task_holy_city_desc: "Halte Jerusalem oder sichere seinen patriarchalen Sitz. Kein römischer Kaiser hat es seit Herakleios regiert, und er regierte es nicht lange."
 cc_byz_task_patriarch: "Der Patriarch kehrt zurück"
 cc_byz_task_patriarch_desc: "Führe Jerusalem zu einer orthodoxen Mehrheit. Das Patriarchat überlebte acht Jahrhunderte muslimischer Herrschaft, indem es vorsichtig war; es wird Zeit brauchen, um nicht mehr vorsichtig sein zu müssen."
 cc_byz_task_egypt: "Ägypten und das Delta"
 cc_byz_task_egypt_desc: "Halte Alexandria und Kairo oder sichere den alexandrinischen Sitz. Die Kornkammer des alten Reiches und das reichste Zollhaus zwischen hier und Indien."
 cc_byz_task_lighthouse: "Der Leuchtturm"
 cc_byz_task_lighthouse_desc: "Unterhalte den Leuchtturm von Alexandria. Er leitete tausend Jahre lang Schiffe in diesen Hafen, und ohne ihn war der Hafen nie mehr derselbe."
 cc_byz_task_sinai_road: "Die Sinai-Straße"
 cc_byz_task_sinai_road_desc: "Halte den Sinai. Ägypten ohne ihn ist ein Endpunkt. Ägypten mit ihm ist ein Korridor, und das ferne Ende dieses Korridors ist Indien."

 # E. The Western Crossing
 cc_byz_task_adriatic: "Die Adria-Überquerung"
 cc_byz_task_adriatic_desc: "Halte Durazzo und Split. Die alte Straße nach Westen begann in Durazzo, und keine Armee hat Italien von hier aus erreicht, ohne sie zu nutzen."
 cc_byz_task_exarch_seated: "Der eingesetzte Exarch"
 cc_byz_task_exarch_seated_desc: "Ernenne einen Exarch zur Verwaltung Italiens. Städte, die von einer Armee eingenommen wurden, bleiben in Besitz. Städte, die von einem ernannten Beamten verwaltet werden, werden zurückgewonnen."
 cc_byz_task_carthage: "Karthago zurückgewonnen"
 cc_byz_task_carthage_desc: "Halte Tunis vollständig. Afrika ernährte Rom vier Jahrhunderte lang und bezahlte für die Rückeroberung, durch die es verloren ging."
 cc_byz_task_pillars: "Die Säulen"
 cc_byz_task_pillars_desc: "Halte Murcia oder Almeria vollständig. Das ferne Ende des Meeres, wo Justinians Spania war und wo es nicht blieb."

 # F. The Merchant Empire
 cc_byz_task_galata: "Die Galata-Zölle"
 cc_byz_task_galata_desc: "Halte Galata. Das Viertel gegenüber dem Wasser hat mehr der Zölle dieser Stadt eingezogen als die Stadt selbst, und es ist Zeit, dass dies aufhört."
 cc_byz_task_merchant_fleet: "Eine Handelsflotte"
 cc_byz_task_merchant_fleet_desc: "Erreiche fünfzehn Dukaten monatlichen Handelseinkommens. Nicht eine Flotte, die das Reich besitzt, sondern eine, die unter seiner Flagge segelt und hier ihre Abgaben zahlt."
 cc_byz_task_spice_dues: "Die Gewürzabgaben"
 cc_byz_task_spice_dues_desc: "Erreiche dreißig Dukaten monatlichen Handelseinkommens. An diesem Punkt sind die Zölle mehr wert als mehrere Provinzen, und jeder in Italien hat es bemerkt."

 # Stepping-stone reward modifiers
 STATIC_MODIFIER_NAME_cc_byz_reward_fortifications: "In gutem Zustand befindliche Mauern"
 STATIC_MODIFIER_DESC_cc_byz_reward_fortifications: "Das Mauerwerk ist solide, die Zisternen sind voll und die Garnison wurde bezahlt. Nichts davon ist von Dauer."
 STATIC_MODIFIER_NAME_cc_byz_reward_naval: "Eine Saison des Schiffbaus"
 STATIC_MODIFIER_DESC_cc_byz_reward_naval: "Holz, Seile und Männer, die wissen, was sie mit beidem anzufangen haben."
 STATIC_MODIFIER_NAME_cc_byz_reward_trade: "Die Zölle funktionieren"
 STATIC_MODIFIER_DESC_cc_byz_reward_trade: "Abgaben werden dort eingezogen, wo sie anfallen sollten, von Männern, die sie weiterleiten."
 STATIC_MODIFIER_NAME_cc_byz_reward_administration: "Die Ämter sind besetzt"
 STATIC_MODIFIER_DESC_cc_byz_reward_administration: "Die Einschätzung ist aktuell, die Schreiber sind bezahlt und jemand weiß, wo die Register sind."
 STATIC_MODIFIER_NAME_cc_byz_reward_manpower: "Rekruten aus den Themen"
 STATIC_MODIFIER_DESC_cc_byz_reward_manpower: "Männer aus einer Provinz, die beschlossen hat, dass sie zu uns gehört, was nicht dasselbe ist wie eine Provinz, die wir beherrschen."
 STATIC_MODIFIER_NAME_cc_byz_reward_confidence: "Die Stadt glaubt"
 STATIC_MODIFIER_DESC_cc_byz_reward_confidence: "Ein öffentlicher Erfolg, und eine Hauptstadt, die bereit ist, dem Thron für eine Weile den Nutzen des Zweifels zuzugestehen."
