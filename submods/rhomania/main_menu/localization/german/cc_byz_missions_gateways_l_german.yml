l_german:
 # Tasks added by the second structural pass: the four gateways, the new stones and spurs, and
 # the trigger tooltips that replace unlocalised engine fallbacks.
 #
 # Descriptions state the condition plainly in the first sentence, because a mission task the
 # player cannot work out how to complete is not content. Flavour goes second, never first.

 # ---- The four gateways ----
 # The State Restored used to open twelve tasks at once. These four sit between it and that
 # cluster, so each branch of the empire's problem has a door of its own.
 cc_byz_task_roman_title: "Der römische Titel"
 cc_byz_task_roman_title_desc: "Drei Höfe in Europa nennen sich römisch. Einer von ihnen ist in Rom und hat einen Bischof statt eines Kaisers, einer ist deutsch und wurde von diesem Bischof gekrönt, und einer bekleidet das Amt in ununterbrochener Folge seit Augustus.\n\nNur der dritte empfindet dies als peinlich."
 cc_byz_task_balkan_frontier: "Die Balkanfront"
 cc_byz_task_balkan_frontier_desc: "Alles nördlich von Thessaloniki ist eine Straße nach Konstantinopel. Die Awaren wussten es, die Bulgaren wussten es, die Serben wissen es jetzt, und das Reich hat es öfter gelernt, als es gerne in den Annalen festgehalten hätte."
 cc_byz_task_latin_powers: "Die lateinischen Mächte"
 cc_byz_task_latin_powers_desc: "Der Westen ist nicht eine einzige Einheit. Er besteht aus einem Papst, zwei Republiken, die sich hassen, einem französischen König, einem deutschen Kaiser und einer Vielzahl von Menschen mit Ansprüchen auf unsere Provinzen. Sie sind sich in nichts einig, außer darin, dass wir Scheismatiker sind.\n\nEiner von ihnen wird unsere Briefe entgegennehmen. Damit beginnt es."
 cc_byz_task_anatolian_return: "Die Rückkehr nach Anatolien"
 cc_byz_task_anatolian_return_desc: "Das Rekrutierungsgebiet. Die Kornkammer. Der Ort, aus dem jeder Soldat der alten Armee stammte und der Grund, warum es eine alte Armee gab.\n\nSie ist seit zweihundertfünfzig Jahren verschwunden, und die Männer, die jetzt dort leben, wurden ebenfalls dort geboren."

 # ---- New stones: the Fisc ----
 cc_byz_task_mint: "Die Münze von Thessaloniki"
 cc_byz_task_mint_desc: "Die zweite Stadt prägte jahrhundertelang ihre eigene Münze. Ein Reich, das nur an einem Ort prägt, ist ein Reich, das durch eine einzige Belagerung mittellos werden kann."
 cc_byz_task_bank: "Die beglichene Schuld"
 cc_byz_task_bank_desc: "Im Jahr 1343 gingen die Kronjuwelen für dreißigtausend Dukaten nach Venedig. Sie wurden nie zurückgekauft, und die gläsernen Kopien sind das, was die Kaiserin zu ihrer eigenen Krönung trug.\n\nWir möchten niemandem mehr etwas schuldig sein."

 # ---- New stones: the Faith ----
 cc_byz_task_orthodox_concord: "Die orthodoxe Eintracht"
 cc_byz_task_orthodox_concord_desc: "Wir teilen ein Ritus mit den Männern, die uns das meiste genommen haben. Ob dies der Beginn eines Streits oder dessen Ende ist, wurde nie geklärt, und kein Kaiser hat sich sehr bemüht, dies zu klären."

 # ---- New stones: the Sword ----
 cc_byz_task_fleet_restored: "Die wiederhergestellte Flotte"
 cc_byz_task_fleet_restored_desc: "Die kaiserliche Flotte wurde 1284 aus Sparsamkeit entlassen. Die Ersparnis wurde seither mehrfach für genuesische und venezianische Schiffe ausgegeben, und das Reich hat gelernt, was es kostet, in fremden Schiffen auf See zu sein."

 # ---- New spurs, by region ----
 cc_byz_task_purple_born: "Im Purpur geboren"
 cc_byz_task_purple_born_desc: "Ein Kind, das in der Porphyrkammer geboren wurde, während sein Vater regierte, steht über jedem General, der jemals einen Thron an sich riss, und jeder im Reich akzeptiert dies, ohne sagen zu können, warum.\n\nEs ist das einzige Argument, das eine byzantinische Thronfolge jemals friedlich gestaltet hat."
 cc_byz_task_bulgarian_question: "Die bulgarische Frage"
 cc_byz_task_bulgarian_question_desc: "Basileios II. verbrachte achtundzwanzig Jahre damit und verdiente sich einen Beinamen dafür. Innerhalb von zweihundert Jahren gab es wieder einen bulgarischen Zaren, in einer neuen Hauptstadt, mit einem eigenen Patriarchen.\n\nDie Lehre daraus ist für jeden zugänglich, der sie will."
 cc_byz_task_danube: "Die Donau erreicht"
 cc_byz_task_danube_desc: "Der Fluss war achthundert Jahre lang die Grenze. Seit einhundertfünfzig Jahren ist er es nicht mehr, und alles zwischen ihm und der Hauptstadt ist offenes Land, das niemand verteidigt."
 cc_byz_task_union_received: "Die empfangene Union"
 cc_byz_task_union_received_desc: "Die Unterschrift ist der einfache Teil und war es schon immer. Kaiser haben in Lyon unterschrieben und werden wieder in Florenz unterschreiben, und die Stadt hat jeden einzelnen von ihnen innerhalb eines Monats von der Kanzel herab zurückgewiesen.\n\nDies setzt lediglich voraus, dass Tinte vorhanden ist."
 cc_byz_task_cataphracts: "Der Kataphrakten-Flügel"
 cc_byz_task_cataphracts_desc: "Mann und Pferd beide in Kettenrüstung, Lanze, Streitkolben und Bogen beim selben Reiter, aufgestellt in einem Keil und aufgefordert, eine Linie frontal zu durchbrechen. Ruinös teuer, und der Grund, warum die Feinde des Reiches sechs Jahrhunderte lang über seine Kavallerie schrieben."
 cc_byz_task_akritai: "Die Akritai sind angesiedelt"
 cc_byz_task_akritai_desc: "Die Grenzlieder werden noch immer gesungen: Digenes Akritas, geboren aus zwei Völkern, der die Linie am Euphrat gegen alle verteidigt. Die Männer in den Liedern behielten ihr Land, weil sie die Grenze hielten, und diese Regelung überdauerte die Erinnerung des Reiches daran, warum sie funktionierte."
 cc_byz_task_pilgrim_road: "Der Pilgerweg"
 cc_byz_task_pilgrim_road_desc: "Die Obhut über die heiligen Stätten ist aufgrund des Personenverkehrs einen Streit wert, und dieser Verkehr landet in Jaffa. Wer den Schrein ohne den Hafen hält, hält das Argument ohne die Einnahmen."

 # ---- Trigger tooltips ----
 #
 # These wrap triggers the engine cannot localise on its own. religion_percentage in LOCATION
 # scope has only NONE/GLOBAL/THIRD trigger_localization forms, so a direct comparison in a
 # mission's enabled block falls back to religion_percentage_greater_or_equal, which vanilla
 # does not define. Wrapping in custom_tooltip is the fix; adding the missing engine key would
 # also need $TARGET_RELIGION$ to resolve in a scope where it does not.
 cc_byz_athens_orthodox_tt: "Athen ist mindestens zu drei Fünfteln orthodox"
 cc_byz_jerusalem_orthodox_tt: "Jerusalem ist in Besitz und mindestens zur Hälfte orthodox"
 cc_byz_second_patriarchal_seat_tt: "Besitze den Sitz eines zweiten autokephalen Patriarchats: Tarnowo, Nikosia, Tiflis oder Sis"
 cc_byz_union_signed_tt: "Die Union mit Rom wurde unterzeichnet"

 # ---- Casus belli ----
 cc_byz_cb_reclaim_the_balkans: "Fordere die Balkanfront zurück"
 cc_byz_cb_reclaim_the_balkans_desc: "Das Reich hat die Donau-Linie nie aufgegeben. Dieser Anspruch stützt sich auf nichts, was verloren gehen könnte: nicht auf Rom, nicht auf einen Exarch, nicht auf die Meinung eines Papstes. Es ist schlichtweg das Territorium, und das Argument hat sich seit 1185 nicht geändert."

 # ---- Reward modifiers ----
 STATIC_MODIFIER_NAME_cc_byz_reward_levies: "Das ausgerufen Theme"
 STATIC_MODIFIER_DESC_cc_byz_reward_levies: "Aufgebote wurden einberufen, und erneut einberufen, bevor das erste Heer überhaupt mit der Heimkehr fertig war."
 STATIC_MODIFIER_NAME_cc_byz_reward_credit: "Kredite zu besseren Konditionen"
 STATIC_MODIFIER_DESC_cc_byz_reward_credit: "Die Geldgeber haben die Einschätzung gesehen und ihre Meinung zum Risiko revidiert."

 # ---- Permanent capstone modifiers ----
 STATIC_MODIFIER_NAME_cc_byz_perm_logothete: "Der wiederhergestellte Kurs"
 STATIC_MODIFIER_DESC_cc_byz_perm_logothete: "Die Post läuft, über die Straßen wird berichtet, und die Schatzkammer weiß, was ihr geschuldet wird, noch bevor es geschuldet wird."
 STATIC_MODIFIER_NAME_cc_byz_perm_ecumenical: "Der ökumenische Thron"
 STATIC_MODIFIER_DESC_cc_byz_perm_ecumenical: "Der Patriarch gehört dem Kaiser, und die Tochterkirchen wissen es."
 STATIC_MODIFIER_NAME_cc_byz_perm_field_army: "Das Feldheer"
 STATIC_MODIFIER_DESC_cc_byz_perm_field_army: "Ein Heer, das in einer Regierungszeit zweimal marschieren kann – ein Privileg, das kein byzantinischer Kaiser seit Manuel mehr besaß."
 STATIC_MODIFIER_NAME_cc_byz_perm_state_restored: "Der wiederhergestellte Staat"
 STATIC_MODIFIER_DESC_cc_byz_perm_state_restored: "Das Reich hat aufgehört, seinen Niedergang zu verwalten, und hat begonnen, zu entscheiden, was als Nächstes zu tun ist."
 STATIC_MODIFIER_NAME_cc_byz_perm_anatolia: "Anatolien gesichert"
 STATIC_MODIFIER_DESC_cc_byz_perm_anatolia: "Das Rekrutierungsgebiet ist wieder kaiserlich, ganz gleich, wie die türkische Frage geklärt wurde."
 STATIC_MODIFIER_NAME_cc_byz_perm_eastern_sees: "Die östlichen Bistümer"
 STATIC_MODIFIER_DESC_cc_byz_perm_eastern_sees: "Die Patriarchate des Ostens unter dem Schutz des Kaisers und die Karawanenrouten, die ihnen folgen."
 STATIC_MODIFIER_NAME_cc_byz_perm_western_sea: "Das westliche Meer"
 STATIC_MODIFIER_DESC_cc_byz_perm_western_sea: "Häfen an beiden Küsten und genügend Rümpfe, um zwischen ihnen zu segeln, ohne zuerst eine Republik fragen zu müssen."
 STATIC_MODIFIER_NAME_cc_byz_perm_city_adorned: "Die geschmückte Stadt"
 STATIC_MODIFIER_DESC_cc_byz_perm_city_adorned: "Die Menschen kommen immer noch hierher, um zu sehen, wie ein Imperium aussieht."
 STATIC_MODIFIER_NAME_cc_byz_perm_greek_fire: "Griechisches Feuer wiederhergestellt"
 STATIC_MODIFIER_DESC_cc_byz_perm_greek_fire: "Die Siphons werden neu gebaut, die Besatzungen werden ausgebildet und die Zusammensetzung ist diesmal an mehr als einem Ort niedergeschrieben."
 cc_byz_bureau_funding_avg_tt: "Bürokratien mit einer Finanzierung von 50 % oder mehr, im Durchschnitt der letzten fünf Jahre"
 cc_byz_bureau_funding_avg_high_tt: "Bürokratien mit einer Finanzierung von 75 % oder mehr, im Durchschnitt der letzten fünf Jahre"
 cc_byz_anatolia_orthodox_tt: "Mindestens sieben von zehn Menschen im Reich sind orthodox"
