 cc_byz_west_succ_consistory_tt: "Das Konsistorium wählt entweder einen Mann, mit dem die Hauptstadt leben kann (#G +1#! Loyalität, Autonomie #R +2#!), oder jemanden aus dem Westen selbst (#R -1#! Loyalität, Autonomie #R +5#!). Die Chancen stehen gleich, neigen sich jedoch bei einem imperialen Griff von 60+ oder einem loyalen Vorgänger (2+) zum Mann der Hauptstadt und bei einer westlichen Autonomie von 60+ zum Westen."
