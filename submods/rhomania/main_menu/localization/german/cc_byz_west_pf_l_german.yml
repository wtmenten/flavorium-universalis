 cc_byz_west_pf_cooldown_tt: "Diese Provinz wurde kürzlich auf diese Weise behandelt"
 cc_byz_west_pf_needs_loyal_tt: "Die Loyalität des Exarchen liegt bei mindestens 1"
 cc_byz_west_succ_resist_tt: "Die Provinz bevorzugt möglicherweise den Sohn. Wenn dies der Fall ist, verliert der neue Exarch #R 2#! Loyalität und die westliche Autonomie steigt um #R 5#!. Ausgehend von 30 % ist dies #G weniger wahrscheinlich#! bei einem fähigen Kandidaten (160+ Fähigkeitspunkte, noch geringer bei 200+), einem imperialen Griff von 60+ oder wenn der verstorbene Exarch loyal war (2+). Es ist #R wahrscheinlicher#! bei einem schwachen Kandidaten (unter 120), einer westlichen Autonomie von 60+, einem Erbamt oder einem illoyalen Exarchen (-2 oder niedriger). Ein akzeptierter Kandidat mit 180+ beginnt mit #G 1#! Loyalität."

