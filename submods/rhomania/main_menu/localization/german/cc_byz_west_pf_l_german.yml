 CC_BYZ_WEST_COL_APPETITE_TT: "Wie viel mehr von seiner Provinz er glaubt, dass ihm zustehen sollte, 0 bis 5. Steigt, wenn seine Anfragen abgelehnt werden und wenn die Abtretungsprüfung zurückgehalten wird; sinkt, wenn sie gewährt werden oder er geehrt wird."
