 CC_BYZ_WEST_PANEL_HEADER: "Die Präfekturen des Westens"
 CC_BYZ_WEST_PANEL_HEADER_TT: "Kontrolle und Autonomie sind zwei separate Zähler. Jede Präfektur-Karte zeigt ihren Exarchen und die Aktionen, die nur auf diese Provinz wirken. Die reichsweiten Aktionen befinden sich auf der Regierungs-Karte, und das Konsistorium hat einen eigenen Tab."
 CC_BYZ_WEST_THIS_YEAR: "dieses Jahr"
 CC_BYZ_WEST_ENDINGS: "Wo dies endet"
 CC_BYZ_WEST_ENDINGS_TT: "Die Situation endet, sobald die Zähler eine Ecke erreichen. Wenn bis zum Zeitalter der Revolutionen keiner dies getan hat, wird die nächste Ecke gewählt. Die hervorgehobene Zelle ist die Hälfte, in der sich jeder Zähler derzeit befindet."
