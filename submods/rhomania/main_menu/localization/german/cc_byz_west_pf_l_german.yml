 # GENERATED FILE. Do not edit by hand: python tools/generate_west_panel.py

 # ---- Per-prefecture actions ----
 cc_byz_west_pf_donative_italy: "Die Garnisonen von Ravenna bezahlen"
 cc_byz_west_pf_donative_italy_desc: "Zahlen Sie den Rückständen der Garnisonen dieser Provinz. Ein Drittel der Kosten einer vollen Donativum für eine Provinz.\n\nDer Exarch gewinnt #G 2#! Loyalität und der imperiale Griff steigt um #G 1#!."
 cc_byz_west_pf_honours_italy: "Dem Exarchen von Ravenna einen Hof-Titel verleihen"
 cc_byz_west_pf_honours_italy_desc: "Erheben Sie den Exarchen zum Patrikios, oder zum Magistros, falls er bereits einer ist. Dies kostet den Kaiser Prestige und gibt dem Westen keinen weiteren Einfluss.\n\nDer Exarch gewinnt #G 2#! Loyalität und verliert #G 1#! Ehrgeiz."
 cc_byz_west_pf_confirm_son_italy: "Den Sohn des Exarchen von Ravenna bestätigen"
 cc_byz_west_pf_confirm_son_italy_desc: "Bestätigen Sie den Sohn des Exarchen als seinen Nachfolger. Das Amt wird somit zum Familienerbe.\n\nDer Exarch gewinnt #G 3#! Loyalität. Die westliche Autonomie steigt um #R 8#!, und das Reich neigt sich den Dynatoi zu. Die erste Bestätigung schafft einen Präzedenzfall, auf den jeder weitere Exarch verweisen wird."
 cc_byz_west_pf_strategos_italy: "Einen Strategos nach Ravenna senden"
 cc_byz_west_pf_strategos_italy_desc: "Senden Sie einen General und seine Männer in diese Provinz. Der Exarch gewinnt Armee-Tradition und Mannkraft.\n\nDie westliche Autonomie steigt um #R 5#!: Ein General im Westen verfügt über Truppen, die ihn kennen."
 cc_byz_west_pf_recall_italy: "Beschwöre den Exarch von Ravenna"
 cc_byz_west_pf_recall_italy_desc: "Befehlen Sie diesem Exarchen, in die Hauptstadt zu kommen. Ob er kommt, hängt von seiner Loyalität ab und davon, ob sein Amt zum Familienerbe geworden ist."
 cc_byz_west_pf_charter_italy: "Eine Kommune in Ravenna charsetten"
 cc_byz_west_pf_charter_italy_desc: "Gewähren Sie einer Stadt ihre Stadtrechte. Handel und Bürgertum profitieren, und der Exarch gewinnt #G 1#! Loyalität.\n\nDie westliche Autonomie steigt um #R 6#!. Die erste Charta ist der Präzedenzfall, auf den jede weitere Kommune verweisen wird."
