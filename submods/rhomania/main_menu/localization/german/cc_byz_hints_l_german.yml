l_german:
 # Hint entries for the submod's two situations.
 #
 # Both keys are required per hint tag: <tag> is the title shown in the hints list, and
 # <tag>_hint_text is the body.
 #
 # TITLES ARE WRITTEN OUT RATHER THAN RESOLVED THROUGH GetSituationByKey, which is what vanilla
 # does here (hints_l_english.yml:652). Two reasons to depart from it. CWTools reports the
 # command as undefined, and while that is probably just an incomplete schema, the submod has
 # already been bitten once by assuming a vanilla precedent guarantees a token resolves from our
 # call site: religion_percentage_in_country_greater_or_equal is a real vanilla key whose
 # TARGET_RELIGION token does not populate when called our way, and it errored in game while
 # looking correct. A situation title is two words and never changes. Not worth the class of
 # risk to save typing them.

 hint_cc_byz_the_west: "Der Westen"
 hint_cc_byz_the_west_hint_text: "Die Präfekturen sind regierte Provinzen mit eigenen Gouverneuren, und das Problem des Kaisers ist, dass beide Tatsachen gleichzeitig wahr sind.\n\nZwei Maße erfassen dies, und sie sind unabhängig voneinander statt gegensätzlich. #T Kaiserlicher Griff#! beschreibt, wie sehr das Reich tatsächlich die Kontrolle hat. #T Westliche Autonomie#! beschreibt, wie sehr der Westen lieber ziehen gelassen würde. Beides kann gleichzeitig hoch sein, und aus dieser Kombination entsteht der Aufstand.\n\nIm Konsistorium wird entschieden. Der Kaiser stimmt als Augustus mit drei Stimmen, ein Senior-Exarch mit zwei, jeder andere Exarch mit einer. Eine Präfektur, und er kann nicht verlieren. Vier, und er wird von dem Gremium, das er selbst aufgebaut hat, überstimmt.\n\nDie Situation löst sich in jedem Fall vor dem Zeitalter der Revolutionen auf, auf die eine oder andere Weise."

 hint_cc_byz_mamluk_confrontation: "Die levantinische Konfrontation"
 hint_cc_byz_mamluk_confrontation_hint_text: "Das Reich und das Sultanat von Kairo stehen sich an heiligen Stätten gegenüber, auf die beide Anspruch erheben, während die italienischen Republiken an beide verkaufen und beiden leihen.\n\n#T Es kann ohne einen Krieg gelöst werden.#! Ein schriftliches Kondominium über die heiligen Stätten ist ein echtes Ende, und es setzt voraus, dass das Reich in den vergangenen Jahrzehnten nicht versucht hat, die Grenze voranzutreiben. Der Druck auf die Levante ist die Zahl, die entscheidet, welche Wege offen bleiben.\n\nDer andere Weg ist der Pentarchie-Krieg um Jerusalem, Antiochia und Alexandria. Diese drei zusammen mit Konstantinopel und Rom sind die fünf Patriarchate, und der Besitz aller fünf ist das, was die Heilung des Schismas erfordert."
