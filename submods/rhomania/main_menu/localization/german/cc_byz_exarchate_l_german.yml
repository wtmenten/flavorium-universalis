l_german:
 # Subject type
 cc_byz_exarchate: "Exarchat"
 cc_byz_exarchate_desc: "Eine westliche Provinz, regiert von einem ernannten Exarch, der sowohl das zivile als auch das militärische Kommando innehat, dem Kaiser untersteht und niemandem vor Ort. Diese Regelung war es, durch die Ravenna zwei Jahrhunderte lang gehalten wurde. Sie funktioniert genau so lange, wie die Interessen des Exarchen und die des Palastes identisch bleiben."

 # Capability modifier
 MODIFIER_TYPE_NAME_cc_byz_can_appoint_exarch: "Darf einen Exarch ernennen"
 MODIFIER_TYPE_DESC_cc_byz_can_appoint_exarch: "Dies ermöglicht es, eine westliche Provinz einem ernannten Exarch zu unterstellen, während die Hauptstadt in [ShowLocationName('constantinople')] bleibt."

 # Renovatio advances
 cc_byz_renovatio_imperii: "Renovatio Imperii"
 cc_byz_renovatio_imperii_desc: "Der Westen wird nicht dadurch zurückgewonnen, dass man den Thron nach Rom verlegt. Er wird zurückgewonnen, indem man Rom von der Stadt aus regiert, die niemals fiel. Ein Exarch wird entsandt, dem sowohl das zivile als auch das militärische Kommando übertragen wird, um die Halbinsel im Namen des Kaisers zu halten."
 cc_byz_exarchal_chancery: "Die exarchische Kanzlei"
 cc_byz_exarchal_chancery_desc: "Ein ständiges Amt im Palast, dessen einzige Aufgabe das westliche Kommando ist: seine Korrespondenz, seine Rechnungen, seine Ernennungen und die sechs Wochen, die eine Nachricht in jede Richtung benötigt. Distanz kann man nicht beseitigen. Man kann sie verwalten."

 cc_byz_capital_is_constantinople_tt: "Unsere Hauptstadt ist [ShowLocationName('constantinople')]"

 # Exarch government reforms
 cc_byz_exarch_caretaker_reform: "Interims-Exarch"
 cc_byz_exarch_caretaker_reform_desc: "Ein Palastbeamter ohne westliche Verbindungen und ohne Ambitionen, um die sich der Kaiser sorgen müsste. Er wird seinen Anweisungen exakt folgen, einschließlich jener, die nicht mehr zur Situation passen, und er wird keine Anhängerschaft aufbauen."
 cc_byz_exarch_effective_reform: "Effektiver Exarch"
 cc_byz_exarch_effective_reform_desc: "Ein fähiger Verwalter, dem der Ermessensspielraum gegeben wurde zu regieren, anstatt nur Bericht zu erstatten. Die Provinz wird sich innerhalb eines Jahrzehnts selbst finanzieren. Ebenso das Netzwerk lokaler Männer, die ihm ihre Positionen verdanken."
 cc_byz_exarch_strategos_reform: "Exarch und Strategos"
 cc_byz_exarch_strategos_reform_desc: "Ein General, der in den Westen geschickt wurde, mit den Truppen und der Autorität, diese einzusetzen, was genau das war, was die Exarchen von Ravenna waren. Er kann Italien halten. Ob er es für den Kaiser hält, ist eine separate Frage, die später beantwortet wird."

 # Character interaction.
 # Key set mirrors vanilla assign_governor (character_interactions_l_english.yml:261-270),
 # which needs _concept, _act, _desc_specific, _past and _act_past alongside the base keys.
 cc_byz_appoint_exarch: "Einen Exarch ernennen"
 cc_byz_appoint_exarch_concept: "[character|e]"
 cc_byz_appoint_exarch_act: "$cc_byz_appoint_exarch$"
 cc_byz_appoint_exarch_desc: "Stelle ein westliches [area|e] unter einen ernannten Exarchen, der die zivile und militärische Führung vereint. Unsere Hauptstadt bleibt in [ShowLocationName('constantinople')]."
 cc_byz_appoint_exarch_desc_specific: "Stelle ein westliches [area|e] unter [SCOPE.sCharacter('recipient').GetName], wobei die zivile und militärische Führung in unserem Namen vereint bleibt."
 cc_byz_appoint_exarch_past: "[SCOPE.sCharacter('recipient').GetName] wird zum Exarchen von [target_area.GetName] ernannt"
 cc_byz_appoint_exarch_act_past: "Durch Dekret des [SCOPE.sCountry('actor').GetGovernment.GetRulerTitle] wurde [SCOPE.sCharacter('recipient').GetName] als [target_reform.GetName] zum Exarch über [target_area.GetName] ernannt"
 cc_byz_choose_exarch: "Wählen Sie den [character|e], der in den Westen geschickt werden soll:"
 cc_byz_select_exarch_type: "Wähle die Ernennungsbedingungen"
 cc_byz_select_exarch_type_none: "@trigger_no! Es sind keine Ernennungsbedingungen verfügbar."
 cc_byz_select_exarchate_area: "Wähle das [area|e], das einem Exarch unterstellt werden soll"
 cc_byz_select_exarchate_area_none: "@trigger_no! Wir besitzen kein westliches [area|e], das groß genug wäre, um es einem Exarch zu unterstellen."
 cc_byz_appoint_exarch_effect_tt: "Die [area|e] wird zu einem Exarchat unter [SCOPE.sCharacter('recipient').GetName] als ein [target_reform.GetName], ansässig in seinem am weitesten entwickelten [location|e]. Unsere Hauptstadt bleibt unverändert. Die Einrichtung des westlichen Kommandos belebt unseren Anspruch auf die alten Grenzen wieder."
