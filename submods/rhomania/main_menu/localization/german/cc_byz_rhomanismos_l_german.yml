l_german:
 # Tagmata units
 a_cc_byz_tagmata_1: "Tagmata"
 a_cc_byz_tagmata_1_desc: "Die stehenden Regimenter der Hauptstadt, die aus der Schatzkammer bezahlt werden, anstatt aus dem Land aufgestellt zu werden. Im Gegensatz zu den thematischen Aufgeboten können sie auf Wort des Kaisers bewegt und eingesetzt werden, und im Gegensatz zu den Warägern sind sie nicht auf den Palast beschränkt. Sie tauschen das Gewicht einer Legionärslinie gegen die Geschwindigkeit ein, eine Schlacht noch dann zu erreichen, wenn es darauf ankommt."
 a_cc_byz_tagmata_2: "$a_cc_byz_tagmata_1$"
 a_cc_byz_tagmata_2_desc: "$a_cc_byz_tagmata_1_desc$"
 a_cc_byz_tagmata_3: "$a_cc_byz_tagmata_1$"
 a_cc_byz_tagmata_3_desc: "$a_cc_byz_tagmata_1_desc$"
 a_cc_byz_tagmata_4: "$a_cc_byz_tagmata_1$"
 a_cc_byz_tagmata_4_desc: "$a_cc_byz_tagmata_1_desc$"
 a_cc_byz_tagmata_5: "$a_cc_byz_tagmata_1$"
 a_cc_byz_tagmata_5_desc: "$a_cc_byz_tagmata_1_desc$"
 a_cc_byz_tagmata_6: "$a_cc_byz_tagmata_1$"
 a_cc_byz_tagmata_6_desc: "$a_cc_byz_tagmata_1_desc$"

 # Tagmata cap modifier
 MODIFIER_TYPE_NAME_cc_num_of_tagmata_modifier: "Tagmata-Regimenter"
 MODIFIER_TYPE_DESC_cc_num_of_tagmata_modifier: "Dies ändert, wie viele [ShowUnitTypeName('a_cc_byz_tagmata_1')] Regimenter gleichzeitig unterhalten werden können."

 # Rhomanismos advances
 cc_byz_unlock_tagmata_advance: "$a_cc_byz_tagmata_1$"
 cc_byz_unlock_tagmata_advance_desc: "$a_cc_byz_tagmata_1_desc$"

 cc_byz_taxis_of_offices: "Rangordnung"
 cc_byz_taxis_of_offices_desc: "Rom beantwortete das Problem mächtiger Männer mit einem Senat. Wir beantworten es mit einer Liste. Jede Würde hat ihren Platz in der Rangfolge, ihr Gehalt, ihren Sitz am Tisch und ihre zeremoniellen Pflichten. Der Rang wird nicht vererbt und nicht gekauft: Er wird verliehen, und er kann entzogen werden."

 cc_byz_oikonomia: "Oikonomía"
 cc_byz_oikonomia_desc: "Die Kanones sind streng, und die Kirche wusste schon immer, wann sie diese nicht anwenden sollte. Oikonomía ist das Prinzip der Dispensation: Wo Strenge die Herde mehr kosten würde als die Schuld, darf der Bischof die Regel lockern. Auf die Regierung angewandt bedeutet dies einen Staat, der tolerieren kann, was er noch nicht korrigieren kann."

 cc_byz_tagmata_restored: "Die wiederhergestellten Tagmata"
 cc_byz_tagmata_restored_desc: "Die thematischen Aufgebote sind den Männern unterstellt, die ihr Land halten. Die Tagmata sind der Schatzkammer unterstellt, die sie bezahlt. Die Wiederherstellung der stehenden Regimenter ist teuer, aber es ist der einzige Weg für einen Kaiser, eine Armee zu behalten, die die seine ist und nicht die seiner Magnaten."

 cc_byz_palaiologan_revival: "Das palaiologische Wiedererwachen"
 cc_byz_palaiologan_revival_desc: "Die Mosaike der Chora, die Historien, die wiederentdeckten Manuskripte der Alten: eine echte Blüte griechischer Lettern und Kunst, initiiert von einem Staat, der es sich nicht mehr leisten konnte. Spätere Zeitalter werden es das letzte Licht Konstantinopels nennen. Diejenigen, die darin lebten, nannten es schlicht Arbeit."

 cc_byz_basilika: "Die Basilika"
 cc_byz_basilika_desc: "Justinians Kodex wurde in Latein für einen Hof zusammengestellt, der es nicht mehr spricht. Die Basilika sind dasselbe Gesetz auf Griechisch, arrangiert für die Gerichte, die es tatsächlich verwenden. Nichts Neues wird verordnet; vieles wird durchsetzbar."

 cc_byz_annona: "Die Annona"
 cc_byz_annona_desc: "Die Getreideflotte erreicht die Hauptstadt, oder die Hauptstadt meutert. Das gilt seit der Gründung der Stadt, und kein Kaiser hat einen Ausweg gefunden. Die Sicherung der Brotverteilung ist keine Großzügigkeit, sondern der Preis für die Herrschaft von Konstantinopel aus."

 cc_byz_ecumenical_office: "Das ökumenische Amt"
 cc_byz_ecumenical_office_desc: "Rom machte Bürger durch das Gesetz und konnte sie zählen. Wir machen Rhomaioi durch Glauben und Treue, was langsamer, vager und schwerer zu widerrufen ist. Ein Slaw, ein Armenier oder ein Walache, der orthodox ist und dem Kaiser gehorcht, ist so römisch wie jeder andere in der Stadt."

 cc_byz_dromos: "Die öffentliche Post"
 cc_byz_dromos_desc: "Rom baute die Straßen. Was wir darauf am Laufen gehalten haben, ist der Dromos: die Relaisstationen, die Wechselpferde, die Kuriere und die Beamten, deren ganze Aufgabe es ist, zu wissen, wie lange eine Nachricht dauert. Straßen verfallen. Ein Zeitplan kann aufrechterhalten werden."

 cc_byz_thematic_administration: "Thematische Verwaltung"
 cc_byz_thematic_administration_desc: "Ein Thema ist eine Provinz, die ihre eigenen Soldaten aus eigenem Land aushebt und bezahlt. So überlebte das Reich die Jahrhunderte, in denen es sich nichts anderes leisten konnte, und es bleibt die Regelung, die mit dem geringsten Geld am weitesten von der Hauptstadt entfernt reicht."

 cc_byz_autokrator: "Autokrátor"
 cc_byz_autokrator_desc: "Der Titel beansprucht keine grenzenlose Herrschaft. Er beansprucht, dass innerhalb dessen, was der Kaiser bereits hält, es keine andere Autorität, keinen Partner und keinen Beruf gibt. Ein Reich, das sich nicht ausdehnen kann, kann dennoch vervollständigt werden."

 cc_byz_great_church: "Die Große Kirche"
 cc_byz_great_church_desc: "Die Hagia Sophia steht seit achthundert Jahren, weil jede Generation bezahlt hat, um sie zu erhalten. Die Kuppel ist einmal eingestürzt und wurde wieder aufgebaut. Die Lehre daraus ist nicht, wie man baut, sondern wie man instand hält."
