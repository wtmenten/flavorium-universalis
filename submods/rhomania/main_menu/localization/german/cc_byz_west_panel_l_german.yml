l_german:
 # The West: situation panel and map legend.
 #
 # Same split and same voice rule as cc_byz_mamluk_panel_l_english.yml. Card bodies are the
 # court speaking; every counter, threshold and vote count lives in a _INFO key behind the
 # card's info icon.

 # ---- Panel header ----
 CC_BYZ_WEST_HDR_GRIP: "Griff"
 CC_BYZ_WEST_HDR_AUTONOMY: "Autonomie"
 CC_BYZ_WEST_HDR_RESTIVE: "Der Westen ist unruhig"
 CC_BYZ_WEST_HDR_RESTIVE_TT: "Die Briefe aus den Präfekturen sind vorsichtiger geworden. Anfragen, die früher Bitten waren, sind nun Benachrichtigungen, und die Kuriere brauchen länger, als es die Straßen erklären würden.\n\nEs ist nichts passiert. Jeder am Hof kann Ihnen genau sagen, wie es sich anfühlt, und keiner von ihnen wird es aufschreiben."

 # ---- Card: the two counters ----
 CC_BYZ_WEST_CARD_BALANCE: "Das Gleichgewicht des Westens"
 CC_BYZ_WEST_CARD_BALANCE_DESC: "Das Reich hält den Westen, und der Westen hat seine eigene Meinung darüber, gehalten zu werden. Dies sind nicht dieselben Fragen, und ein Kaiser, der sie als eine einzige behandelt, wird zweimal überrascht werden.\n\nEine Provinz kann eng regiert werden und nichts davon missbilligen. Eine andere kann kaum regiert werden und verbringt vierzig Jahre damit, eine Klage gegen die Hauptstadt auszuarbeiten. Die gefährliche Anordnung ist die, bei der der Kaiser fest zupackt und der Westen aufgehört hat zu sehen, warum."
 CC_BYZ_WEST_CARD_BALANCE_INFO: "Zwei unabhängige Zähler, jeweils von 0 bis 100. Sie sind nicht zwei Enden eines einzigen Balkens, und beide können gleichzeitig hoch sein.\n\n#T Imperialer Griff#! steigt mit Volkszählungen, entsandten Strategoi, befolgten Rückrufen und eingezogenen Tributen. Er sinkt, wenn die Präfekturen sich selbst überlassen bleiben.\n\n#T Westliche Autonomie#! steigt mit gewährten Privilegien, Söhnen, die in den Sitzen ihrer Väter bestätigt wurden, abgelehnten Rückrufen und Jahren ohne Aufsicht. Sie sinkt, wenn der Kaiser im Westen anwesend ist und dafür bezahlt.\n\nEin Griff und eine Autonomie von jeweils 60 oder mehr ist der Zustand, aus dem der Aufstand entsteht. Die Situation löst sich in jedem Fall vor dem Zeitalter der Revolutionen."
 CC_BYZ_WEST_BAR_GRIP: "Imperialer Griff"
 CC_BYZ_WEST_BAR_GRIP_TT: "Steigt durch Volkszählungen, Strategoi, befolgte Rückrufe und eingetriebene Tribute. Sinkt, wenn die Präfekturen sich selbst überlassen bleiben.\n\nEin starker Griff ist nicht automatisch gut. Er ist das, was die Meinung des Westens über die Vereinbarung bedeutsam macht."
 CC_BYZ_WEST_BAR_AUTONOMY: "Westliche Autonomie"
 CC_BYZ_WEST_BAR_AUTONOMY_TT: "Steigt durch gewährte Privilegien, bestätigte Söhne, verweigerte Rückrufe und Zeit ohne Aufsicht. Sinkt, wenn der Kaiser im Westen anwesend ist und dafür bezahlt.\n\nHohe Autonomie ist ebenfalls nicht automatisch schlecht. Ein Westen, der sich zufrieden selbst regiert, ist eines der vier Enden."
 CC_BYZ_WEST_TENSION_BOTH_HIGH: "Fest im Griff, und mit Groll darüber"
 CC_BYZ_WEST_TENSION_BOTH_HIGH_TT: "Das Reich regiert Provinzen, die beschlossen haben, dass sie lieber nicht regiert würden. Beides ist gleichzeitig wahr, und jedes macht das andere schlimmer.\n\nDen Griff zu lockern funktioniert. Ebenso wie dem Westen einen Grund zu geben, die Anordnung zu wollen. Beides nicht zu tun, ist ebenfalls eine Entscheidung, und sie wurde schon früher getroffen."
 CC_BYZ_WEST_TENSION_DRIFTING: "Leise davonschweben"
 CC_BYZ_WEST_TENSION_DRIFTING_TT: "Nichts läuft schief. Aber es wird auch nichts festgehalten.\n\nDie Präfekturen entwickeln sich in ihrem eigenen Tempo zu einer eigenständigen Sache, ohne Streit und ohne ein Datum, auf das man zeigen könnte. In einer Regierungszeit werden die Briefe des Kaisers wie die eines fremden Hofes gelesen werden, und niemand wird sich erinnern, dies so entschieden zu haben."

 # ---- Card: the prefectures ----
 CC_BYZ_WEST_CARD_PREFECTURES: "Die Präfekturen"
 CC_BYZ_WEST_CARD_PREFECTURES_DESC: "Gouverneure in Provinzen, die das Reich drei Jahrhunderte lang nicht besaß.\n\nJeder war die Belohnung für jemanden, und jeder hatte Zeit herauszufinden, was der Posten für den Inhaber wert ist, statt für denjenigen, der ihn verliehen hat. Was sie vom Kaiser halten, ist kein Geheimnis. Es wurde nur nie schriftlich abgefragt."
 CC_BYZ_WEST_CARD_PREFECTURES_INFO: "Die Loyalität reicht pro Exarch von -5 bis 5.\n\nDies ist der Wert, den die Rückrufsummonen, der Reibungsfaden, die Stimmgewichte des Konsistoriums und der Aufstand berücksichtigen. Ein Exarch bei -3 oder niedriger wird einen Rückruf ablehnen; der Aufstand bezieht sich auf Exarchen bei -2 oder niedriger.\n\nErhöht durch Donative, Charten und die Bestätigung eines Sohnes des Exarchen. Verringert durch Zensus, Tribut, Rückrufe und Strategoi, die über seinen Kopf hinweg entsandt werden."
 CC_BYZ_WEST_COL_LOYALTY: "Loyalität"

 # ---- Card: the consistory ----
 CC_BYZ_WEST_CARD_CONSISTORY: "Das heilige Konsistorium"
 CC_BYZ_WEST_CARD_CONSISTORY_DESC: "Der Kaiser baute einen Raum, in dem man den Westen hören konnte, denn ein Westen, der gehört wird, ist ein Westen, der bleibt.\n\nDamit hatte er recht. Was er nicht tat, war die Stühle zu zählen. Jede zurückgewonnene Provinz fügt eine Stimme hinzu, und die Stimmen würden niemals aus Dankbarkeit für den Raum weiterhin mit ihm einer Meinung sein."
 CC_BYZ_WEST_CARD_CONSISTORY_INFO: "Abstimmungen finden im Konsistorium statt, sobald dieses einberufen wurde.\n\n#T Augustus#! 3 Stimmen. #T Senior-Exarch#! 2 Stimmen. #T Jeder andere Exarch#! 1 Stimme.\n\nWenn eine Präfektur vertreten ist, kann der Kaiser nicht verlieren, 3 zu 1. Wenn alle vier vertreten sind, steht es 3 gegen 5 und der Westen gewinnt die Abstimmung. Hinter diesem System verbirgt sich kein Risiko-Wert: Die Gefahr ist die Rückeroberung selbst, Provinz für Provinz.\n\nBesondere Statuswerte stapeln sich nicht, so dass die Erhebung eines Senior-Exarchen 2 Stimmen anstelle seiner 1 gewährt, nicht zusätzlich dazu."
 CC_BYZ_WEST_VOTES_LEGEND: "Präfekturen etabliert"

 # ---- Map colouring ----
 CC_BYZ_WEST_LEGEND_PREFECTURE: "Präfektur"
 CC_BYZ_WEST_LEGEND_IMPERIAL: "Imperial"
