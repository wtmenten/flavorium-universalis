l_german:
 # cc_byz_bureaucracy.62, the buy-back for a farmed-out office, and the timed societal drift
 # modifiers the bureau thread now grants.
 #
 # WHY .62 EXISTS. Playtesting: "the office farmed out being until the end of the game is too
 # harsh a punishment". It was also stacking, at three grant sites, with no removal path. The
 # modifier is now sixty years rather than permanent, and this event is the way out of it before
 # then, at a price scaled to the realm's tax base and to how dug in the office had become when
 # it was sold.

 cc_byz_bureaucracy.62.title: "Das Amt wiedergewonnen"
 cc_byz_bureaucracy.62.desc: "Die Familie, die das Amt innehat, hat an den Palast geschrieben. Nicht um sich zu beschweren: sondern um ausführlich und mit Zahlen festzustellen, was es sie gekostet hat, das Amt aufrechtzuerhalten, und anzumerken, dass sie es natürlich an die Krone zurückgeben würden, sollte die Krone gewillt sein, die Ausgaben zu ersetzen.\n\nDies ist kein Angebot. Es ist ein Preis, ermittelt von Menschen, die lange Zeit darüber nachdenken konnten, was das Amt wert ist, und keinerlei Grund hatten, es unter Wert zu verkaufen."
 cc_byz_bureaucracy.62.desc_dug_in: "Drei Generationen wurden in dieses Amt hineingeboren. Der Großvater des derzeitigen Inhabers kaufte es, sein Vater verwaltete es, und er selbst musste in seinem Leben nie darüber nachdenken, was er sonst tun würde.\n\nDie Familie hat Abrechnungen vorgelegt. Sie sind akribisch, sie sind fast sicher ehrlich, und sie beschreiben eine Investition, die die Krone übertreffen müsste, um sie rückgängig zu machen. Niemand im Palast tut so, als sei die Summe unangemessen. Sie ist schlichtweg enorm."
 cc_byz_bureaucracy.62.desc_several: "Mehr als eine Stelle wurde nun auf diese Weise besetzt, und die Männer, die sie innehaben, haben einander bemerkt. Was im Palast ankommt, ist kein Brief einer Familie, sondern eine Position, die zwischen mehreren vereinbart wurde, dieselben Präzedenzfälle zitiert und denselben Preis fordert.\n\nDie Krone hat den Präzedenzfall geschaffen, indem sie die erste Stelle verkaufte. Nun wird er ihr wieder vorgehalten."
 cc_byz_bureaucracy.62.a: "Bezahlen Sie es. Das Amt gehört der Krone."
 cc_byz_bureaucracy.62.b: "Nimm es zurück und lass sie klagen."
 cc_byz_bureaucracy.62.c: "Lassen Sie es. Das Geld wird anderswo benötigt."

 # ---- Timed societal drift ----
 # Granted alongside the instant societal jumps rather than instead of them. The jump is the
 # decision landing; the drift is the decision working.
 STATIC_MODIFIER_NAME_cc_byz_taxis_reforming: "Regierung durch Ämter"
 STATIC_MODIFIER_DESC_cc_byz_taxis_reforming: "Stellen werden durch Ernennung besetzt, auf Widerruf gehalten und pünktlich bezahlt. Nichts davon ist ein Dekret, aber alles davon ist Politik."
 STATIC_MODIFIER_NAME_cc_byz_taxis_habit: "Die administrative Gewohnheit"
 STATIC_MODIFIER_DESC_cc_byz_taxis_habit: "Es wurde nichts bekannt gegeben. Die Dinge werden einfach so erledigt, wie das Fiskat sie erledigt, von Menschen, die aufgehört haben zu fragen, wessen Sohn jemand ist."
 STATIC_MODIFIER_NAME_cc_byz_dynatoi_ascendant: "Die Magnaten konsolidieren"
 STATIC_MODIFIER_DESC_cc_byz_dynatoi_ascendant: "Etwas Strukturelles wurde zugestanden, und die Personen, die davon profitierten, ordnen ihre Angelegenheiten in der Annahme, dass es nicht zurückgenommen wird."
 STATIC_MODIFIER_NAME_cc_byz_dynatoi_creeping: "Die stille Übertragung"
 STATIC_MODIFIER_DESC_cc_byz_dynatoi_creeping: "Es wurde keine Zusage gemacht und kein Gesetz geändert. Land, Soldaten und Ämter gehen in private Hände über, in der Geschwindigkeit des gewöhnlichen Lebens."
