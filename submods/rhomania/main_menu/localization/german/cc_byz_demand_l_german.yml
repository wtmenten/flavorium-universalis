l_german:
 # cc_byz_exarch.10 - the prompt
 cc_byz_exarch.10.title: "Wer regiert Italien?"
 cc_byz_exarch.10.desc: "Italienisches Territorium befindet sich in imperialen Händen und wird, so weit es geht, per Depesche verwaltet. Die Depeschen benötigen sechs Wochen für den Hin- und Rückweg.\n\nDer praktische Einwand wurde von den zuständigen Beamten erhoben, die darauf hinweisen, dass man von ihnen verlangt, Streitigkeiten zwischen italienischen Herren beizulegen, deren Namen sie nicht aussprechen können, auf Grundlage von Beweisen, die drei Monate alt sind, und in einer Rechtstradition, die keiner von ihnen studiert hat. Sie tun es schlecht, und das sagen sie auch.\n\nDie alte Antwort auf dieses Problem war ein Exarch: ein Mann vor Ort, der zivile und militärische Gewalt vereinte und im Namen des Kaisers entschied, ohne vorher zu fragen. Es funktionierte einhundertfünfzig Jahre lang und dann hörte es auf zu funktionieren, in einer Weise, die die Archive recht ausführlich dokumentieren."
 cc_byz_exarch.10.desc_rome: "Rom ist besetzt, und das Reich erkennt, dass es zwei verschiedene Probleme sind, Rom zu halten und Rom zu regieren.\n\nDie Stadt hat einen Bischof mit eigenen Gerichten, einen Adel mit eigenen Streitigkeiten, eine Bevölkerung, die es gewohnt ist, von keinem von beiden verwaltet zu werden, und eine Reihe von Rechtsgewohnheiten, die mehrere Jahrhunderte vor der Rückeroberung liegen. Die kaiserlichen Beamten, die zur Verwaltung entsandt wurden, sind kompetente Männer, die untergehen, und sie haben geschrieben, um dies in Worten mitzuteilen, die deutlich weniger ehrerbietig sind als gewöhnlich.\n\nDie alte Antwort war ein Exarch mit Sitz in Ravenna oder in der Stadt selbst, der die zivile und militärische Gewalt in einer Person vereinte. Jeder im Palast kennt den Präzedenzfall. Jeder weiß auch, wie dieser Präzedenzfall endete."
 cc_byz_exarch.10.a: "Ein Verwalter. Kurze Amtszeiten und nichts Eigenes."
 cc_byz_exarch.10.b: "Ein effektiver Gouverneur. Lassen wir ihn es tatsächlich regieren."
 cc_byz_exarch.10.c: "Ein Strategos. Zivile und militärische Befehlsgewalt in einer Person."
 cc_byz_exarch.10.d: "Regieren Sie es von hier aus. Wir haben Beamte dafür."

 # cc_byz_demand.1 - the request
 cc_byz_demand.1.title: "Das Ersuchen des Exarchen"
 cc_byz_demand.1.desc: "Der Exarch hat geschrieben und darum gebeten, dass bestimmte italienische Distrikte, die noch direkt von Konstantinopel aus verwaltet werden, stattdessen seiner Autorität unterstellt werden.\n\nDer Brief ist vorsichtig und das Argument ist gut. Die Distrikte grenzen an seine eigenen an, sie werden in einer Entfernung von sechs Wochen von Männern verwaltet, die sie nie gesehen haben, und ihre Einnahmen decken kaum die Kosten ihrer Erhebung. Er bittet nicht um etwas, mit dem das Reich Geld verdient.\n\nEr hat zudem, ohne es auszusprechen, klargestellt, dass er nun eher über die Grenzen seines eigenen Amtes an den Palast schreibt als über die Geschäfte seiner Verwaltung."
 cc_byz_demand.1.desc_persistent: "Der Exarch hat erneut über die italienischen Distrikte geschrieben, und dies ist nicht das zweite Mal.\n\nDie Argumente sind dieselben und bleiben stichhaltig, was mit dazu beiträgt, dass die Korrespondenz mühsam wird. Was sich geändert hat, ist der Ton: Die früheren Briefe fragten an, und dieser beschreibt eine Regelung, die sinnvoll wäre, und wartet darauf zu hören, ob der Palast zustimmt.\n\nDer Schreiber, der diese ablegt, hat damit begonnen, sie in einem einzigen Bündel zusammenzuhalten. Niemand hat ihn dazu angewiesen."
 cc_byz_demand.1.desc_hostile: "Der Exarch hat über die italienischen Distrikte geschrieben, und der Brief wurde im Palast dreimal gelesen, wegen dessen, was er nicht enthält.\n\nEs gibt darin keine Bitte. Es gibt einen Bericht darüber, wie die Distrikte derzeit verwaltet werden, eine Einschätzung, wie sie besser verwaltet werden könnten, und einen abschließenden Absatz, in dem das Vertrauen ausgedrückt wird, dass der Kaiser die Angelegenheit so sehen wird wie er selbst. Es ist der Brief eines Mannes, der nicht mehr davon ausgeht, dass die Antwort ungewiss ist.\n\nSeine eigene Loyalität wurde schon seit einiger Zeit in Frage gestellt. Dies klärt die Frage nicht zu seinen Gunsten."
 cc_byz_demand.1.desc_after_seizure: "Der Exarch hat geschrieben, um bestimmte italienische Distrikte zu erbitten, und der Palast musste in den Registern nachsehen, welche er nicht bereits hält.\n\nDer Brief wahrt jede Form. Er bittet, er führt Gründe an, er unterwirft sich dem Urteil des Kaisers, und es geht um Territorien, die an Distrikte angrenzen, deren Steuern seine Beamten vor einigen Jahren begannen einzuziehen, ohne jemanden zu fragen. Die Höflichkeit ist beabsichtigt und richtet sich nicht an den Kaiser: Sie dient der Akte, damit das, was als Nächstes passiert, als eine kaiserliche Gnade beschrieben werden kann.\n\nEr bietet dem Palast an, den Schein der Entscheidungsgewalt zu wahren. Das ist der eigentliche Vorschlag."
 cc_byz_demand.1.a: "Weigern Sie sich. Die Distrikte werden von hier aus verwaltet."
 cc_byz_demand.1.b: "Gewähren Sie sie ihnen. Er regiert sie besser als wir."
 cc_byz_demand.1.c: "Weigern Sie sich, und lassen Sie es als politische Entscheidung erscheinen statt als Affront."
 cc_byz_demand.1.d: "Geben Sie ihm die Einnahmen. Behalten Sie die Autorität."

 # cc_byz_demand.2 - the argument
 cc_byz_demand.2.title: "Der Exarch bringt seine Argumente vor"
 cc_byz_demand.2.desc: "Der Exarch hat aufgehört, Briefe zu schreiben, und ein Dokument vorgelegt.\n\nEs ist ein Memorandum über die Verwaltung Italiens: historisch, gut belegt und stillschweigend vernichtend. Es legt dar, was das Exarchat unter Justinian und seinen Nachfolgern war, welche Autorität seine Inhaber ausübten und wie sich die gegenwärtige Regelung im Vergleich dazu schlägt. Der Vergleich ist nicht schmeichelhaft für die gegenwärtige Regelung und soll es auch nicht sein.\n\nKopien sind an den Palast gegangen. Kopien sind, wie der Palast feststellt, auch an mehrere andere Personen gegangen."
 cc_byz_demand.2.desc_precedent: "Der Exarch hat ein Memorandum über die Verwaltung Italiens vorgelegt, und die wirkungsvollste Passage ist jene, die das eigene Privileg des Kaisers zitiert.\n\nIhm wurden bereits Distrikte zugewiesen. Das Dokument behandelt dieses Privileg eher als die Begründung eines Prinzips denn als die Entscheidung eines Einzelfalls und leitet daraus mit einiger Sorgfalt ab: Wenn diese Distrikte von Rom aus besser verwaltet würden – und das taten sie –, dann gilt das Argument mit genau derselben Logik auch für den Rest.\n\nEs ist ein gutes Argument. Es ist ein gutes Argument, weil es auf etwas aufbaut, das der Palast getan hat, was genau die Schwierigkeit bei Präzedenzfällen ist."
 cc_byz_demand.2.a: "Treten Sie es ab. Italien wird von Rom aus verwaltet."
 cc_byz_demand.2.b: "Weigern Sie sich in derselben öffentlichen Form, die er verwendet hat."
 cc_byz_demand.2.c: "Rufen Sie ihn deswegen zurück."

 # cc_byz_demand.3 - he stopped asking
 cc_byz_demand.3.title: "Er hörte auf zu fragen"
 cc_byz_demand.3.desc: "Die Beamten des Exarchen ziehen in den umstrittenen Distrikten Steuern ein. Dies tun sie bereits seit zwei Saisons. Der Palast erfuhr es durch eine Steuererklärung, die nicht ankam.\n\nEs gab keine Proklamation und keine Beschlagnahmung. Seine Männer waren bereits die nächste zuständige Behörde, die Garnisonen gehörten seit Jahren ihm, und irgendwann begannen die lokalen Beamten einfach, dem Mann Bericht zu erstatten, der tatsächlich vor Ort war. Als die Unstimmigkeit angesprochen wurde, antwortete er prompt und höflich und drückte seine Überraschung darüber aus, dass die Regelung nicht schon früher formalisiert worden war.\n\nDie Optionen des Reiches sind ein Krieg in Italien, den es derzeit nicht finanzieren kann, oder ein Dokument. Er ist sich dessen schon seit einiger Zeit recht sicher."
 cc_byz_demand.3.a: "Ratifizieren Sie es. Nennen Sie es eine Zuwendung und wahren Sie den Schein."
 cc_byz_demand.3.b: "Weigern Sie sich, es anzuerkennen. Lassen Sie die Register so stehen."
