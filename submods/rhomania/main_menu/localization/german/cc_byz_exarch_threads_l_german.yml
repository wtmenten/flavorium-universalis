l_german:
 # Country modifiers
 STATIC_MODIFIER_NAME_cc_byz_protector_of_the_see: "Beschützer des Stuhls"
 STATIC_MODIFIER_DESC_cc_byz_protector_of_the_see: "Das Papsttum existiert, weil der Kaiser es zuließ. Jeder katholische Hof in Europa versteht diese Vereinbarung, und viele von ihnen sind stillschweigend dankbar dafür."

 # Opinion modifiers
 cc_byz_papal_forbearance: "Ließen uns unsere Würde"
 cc_byz_papal_captivity: "Hält uns gefangen"

 # Casus belli
 cc_byz_cb_recover_the_islands: "Die Inseln zurückerobern"
 cc_byz_cb_recover_the_islands_desc: "Die Ägäis war innerhalb des lebenden Gedächtnisses ein kaiserlicher See. Jetzt wird sie in Stücken gehalten von einem Herzogtum, das Venedig untersteht, einer genuesischen Familie auf Chios, einem Ritterorden auf Rhodos und wem auch immer derzeit Negroponte gehört. Keiner von ihnen kann verteidigen, was er besitzt, gegen eine Flotte. Alle können sich an jemanden wenden, der es kann."
 cc_byz_cb_consolidate_italy: "Konsolidieren Sie das Exarchat"
 cc_byz_cb_consolidate_italy_desc: "Ein Exarch in Rom hat einen Anspruch, überall in Italien zu argumentieren, und dieser Anspruch ist nur so lange wertvoll, wie es einen Exarchen gibt, der ihn geltend macht. Verliere das Exarchat, und dies geht mit verloren."

 # cc_byz_exarch.1 - the first independent decision
 cc_byz_exarch.1.title: "Eine Entscheidung ohne Rücksprache"
 cc_byz_exarch.1.desc: "Der Exarch hat einen Streit zwischen zwei italienischen Herren im Namen des Kaisers aus eigener Autorität geschlichtet und dies nachträglich in einem Brief gemeldet, der in jeder Zeile respektvoll ist und um nichts bittet.\n\nDie Einigung ist eine gute. Ein Mann in Konstantinopel hätte sie nicht erreichen können, da ihm sowohl die Ortskenntnis als auch die sechs Monate fehlten, die die Korrespondenz gedauert hätte. Genau deshalb wurde er ernannt und genau deshalb wird der Brief im Palast dreimal gelesen."
 cc_byz_exarch.1.desc_strategos: "Der Exarch hat einen Streit zwischen zwei italienischen Herren aus eigener Autorität geschlichtet und dies nachträglich gemeldet, was genau das ist, wofür er ernannt wurde, da seine Ernennung unter Bedingungen erfolgte, die ihm den größtmöglichen Spielraum ließen.\n\nDie Einigung ist fundiert. Es ist zudem der dritte solche Brief in diesem Jahr, und der Palast hat begonnen zu bemerken, dass die Berichte in einem bequemen Abstand nach den Entscheidungen eintreffen und dass in keinem von ihnen jemals etwas als Frage formuliert wurde."
 cc_byz_exarch.1.a: "Bestätigen Sie es. Er wurde ernannt, um über die Dinge zu entscheiden."
 cc_byz_exarch.1.b: "Überstimme es. Der Nächste kommt zuerst hierher."
 cc_byz_exarch.1.c: "Bestätigen Sie es öffentlich. Korrigieren Sie ihn privat."

 # cc_byz_exarch.2 - going native
 cc_byz_exarch.2.title: "Der Hof des Exarchen"
 cc_byz_exarch.2.desc: "Die Berichte aus Rom sind detailliert geworden in Bezug auf ein Thema, nach dem niemand gefragt hat.\n\nDer Haushalt des Exarchen pflegt nun den lateinischen Gebrauch. Seine Sekretäre schreiben darin, weil die Männer, an die sie schreiben, es lesen. Seine Kapelle folgt dem lokalen Ritus, weil der lokale Klerus sie besetzt. Seine Söhne werden von Italienern unterrichtet, weil dies die verfügbaren Tutoren sind, und er hat eine italienische Frau genommen, was vernünftig war, und ihre Familie sitzt nun an seinem Tisch, was unvermeidlich war.\n\nNichts davon war Ungehorsam. Er wurde geschickt, um Rom zu regieren, und er regiert Rom. Die Ironie ist dem Kaiser nicht entgangen, der es ablehnte, dorthin zu ziehen."
 cc_byz_exarch.2.a: "Lass es. Ein Gouverneur, der in seiner Provinz zu Hause ist, regiert sie besser."
 cc_byz_exarch.2.b: "Sende griechische Geistliche und griechische Schreiber auf unsere Kosten."
 cc_byz_exarch.2.c: "Rufen Sie seine Söhne herbei, um sie am Palast aufzuziehen."

 # cc_byz_exarch.3 - correspondence
 cc_byz_exarch.3.title: "Die Korrespondenz des Exarchen"
 cc_byz_exarch.3.desc: "Der Exarch korrespondiert mit Venedig, mit Genua, mit zwei der nördlichen Kommunen und mit einem Kardinal, und der Palast weiß dies, weil er nie versucht hat, es zu verheimlichen.\n\nEr würde sagen, und hat gesagt, dass ein Gouverneur in Italien, der nicht mit Italienern spricht, ein Gouverneur ist, der alles sechs Monate zu spät erfährt. Das ist wahr. Es ist auch wahr, dass er nun der Mann in Italien ist, der weiß, was jeder tut, und dass Konstantinopel es von ihm erfährt."
 cc_byz_exarch.3.desc_latinised: "Der Exarch korrespondiert mit der Hälfte Italiens auf Latein über Sekretäre, die dort geboren wurden, und die Briefe, die Konstantinopel erreichen, sind Zusammenfassungen, die er selbst erstellt hat.\n\nEr würde sagen, dass ein Gouverneur, der nicht mit seinen Nachbarn spricht, nutzlos ist, und er hat recht. Was sich geändert hat, ist, dass der Hof in Rom nun für jeden in Italien, der Geschäfte zu erledigen hat, wie der Ort wirkt, an dem die imperiale Politik tatsächlich entschieden wird. Einige von ihnen haben ganz aufgehört, nach Konstantinopel zu schreiben."
 cc_byz_exarch.3.a: "Ein Gouverneur in Italien muss mit Italienern sprechen."
 cc_byz_exarch.3.b: "Jeder Brief ist in Kopie an die Hauptstadt zu senden."
 cc_byz_exarch.3.c: "Nutze ihn. Er ist ein Instrument, für das wir nicht bezahlen."

 # cc_byz_exarch.4 - the recall
 cc_byz_exarch.4.title: "Die Vorladung"
 cc_byz_exarch.4.desc: "Der Exarch wird nach Konstantinopel gerufen, um persönlich Bericht zu erstatten. Die Formulierung ist herzlich, der Anlass plausibel, und niemand Beteiligter ist darüber im Unklaren, was hier getestet wird.\n\nWenn er kommt, bleibt die Regelung bestehen: ein Gouverneur, der nach Hause gerufen werden kann, ist ein Gouverneur. Wenn nicht, dann hat das Exarchat, was auch immer daraus geworden ist, vor einigen Jahren aufgehört, dies zu sein, und der Palast ist erst jetzt dazu gekommen, danach zu fragen."
 cc_byz_exarch.4.a: "Bestehe darauf. Schicke jemanden, um ihn zu begleiten."
 cc_byz_exarch.4.b: "Zieh es zurück, bevor es öffentlich abgelehnt wird."
 cc_byz_exarch.4.c: "Biete ihm hier etwas an, das mehr wert ist als Rom."

 # cc_byz_exarch.5 - the ending
 cc_byz_exarch.5.title: "Das Exarchat"
 cc_byz_exarch.5.desc_dynasty: "Das Amt ist nun erblich. Es wurde keine Zuweisung getroffen und es existiert keine Urkunde; ein Sohn folgte einem Vater, der Palast wurde informiert, und der Palast stellte fest, dass seine verfügbaren Antworten entweder ein Krieg in Italien waren, den er nicht finanzieren konnte, oder ein Glückwunschschreiben. Er schickte das Schreiben.\n\nDie Exarchen überweisen jedes Jahr eine Summe, die geringer ist als zuvor und pünktlich ankommt, und sie führen die Kriege des Reiches, wenn die Kriege des Reiches auch ihre eigenen sind. In jeder anderen Hinsicht wird Rom von einer Familie regiert, die es aus eigenem Recht besitzt und ihre Autorität auf eine Ernennung zurückführt, an die sich heute kein Lebender mehr erinnert.\n\nSo verlor das Reich das erste Mal den Westen. Damals dauerte es etwas länger."
 cc_byz_exarch.5.desc_absorbed: "Das Exarchat hat stillschweigend aufgehört, eines zu sein. Der derzeitige Exarch ist der vierte, er wurde in Konstantinopel aus einer in Konstantinopel erstellten Liste ausgewählt, er diente zuvor in zwei anderen Ämtern und erwartet, danach in einem weiteren zu dienen, und der Unterschied zwischen seiner Position und der eines jeden anderen Gouverneurs ist nun rein eine Frage des Titels in seiner Korrespondenz.\n\nRom ist eine Provinz. Sie wird von der Hauptstadt aus verwaltet, besteuert und garnisoniert, und die Männer, die sie verwalten, sind Beamte statt einer Familie. Die Regelung, die erfunden wurde, um die Verlegung der Hauptstadt zu vermeiden, endete damit, dass die Verlegung unnötig wurde."
 cc_byz_exarch.5.desc_standing: "Die Regelung besteht fort, was jedoch nicht dasselbe ist wie eine endgültige Klärung.\n\nDer Exarch befolgt Anweisungen, die mit ausreichender Autorität eintreffen, und interpretiert den Rest. Er überweist, was er für die Bedürfnisse der Hauptstadt für notwendig hält, und behält, was er für die Bedürfnisse Roms für nötig hält, und sein Urteilsvermögen war weitgehend vertretbar. Sein Nachfolger wird teilweise in Konstantinopel und teilweise in Rom durch ein Verfahren ausgewählt, das niemand schriftlich fixiert hat, und beide Parteien werden das Ergebnis als ihre eigene Entscheidung bezeichnen.\n\nEs funktioniert. Niemand der Beteiligten würde sich die Mühe machen, genau zu erklären, warum."
 cc_byz_exarch.5.desc_recalled: "Die Regelung bleibt bestehen, und jeder Beteiligte weiß genau, wie knapp sie daran scheiterte, zu scheitern.\n\nEr wurde vorgeladen und er kam. Er war elf Wochen in Konstantinopel, wurde gut empfangen, kehrte an seinen Posten zurück, und die gesamte Angelegenheit wird nun als Konsultation bezeichnet. Was dadurch festgestellt wurde, ist, dass die Vorladung funktioniert, was der Palast wissen musste und auf keine andere Weise herausfinden konnte.\n\nEs wurde auch der Preis festgelegt. Er kam, weil das Kommen in der Bilanz besser war als die Alternative, und beide Parteien haben diese Rechnung gemacht. Der nächste Exarch wird es ebenso tun, und die Bedingungen werden nicht immer so knapp zu Gunsten der Hauptstadt ausfallen wie dieses Mal."
 cc_byz_exarch.5.a: "So steht es fest."

 # cc_byz_papal.1 - the rite
 cc_byz_papal.1.title: "Das Ritus in den Kirchen der Stadt"
 cc_byz_papal.1.desc: "Der Exarch benötigt Anweisungen zu einem Punkt, den er nicht selbst entscheiden kann, und er hat recht damit, dass er es nicht kann.\n\nRom ist eine katholische Stadt, die von einem orthodoxen Ernannten im Namen eines orthodoxen Kaisers verwaltet wird. Ihre Kirchen feiern das lateinische Ritus, weil sie es schon immer getan haben. Die Frage ist, ob sie damit fortfahren, ob sich in den Hauptkirchen etwas ändert und ob der Name des Kaisers in der Liturgie einer Stadt ausgesprochen wird, deren Bischof ihn als Schematiker betrachtet.\n\nEs gibt keine Antwort, die nicht eine Festlegung ist, einschließlich der Antwort, es so zu lassen."
 cc_byz_papal.1.a: "Lass die Kirchen in Ruhe. Das Ritus ist nicht unsere Angelegenheit."
 cc_byz_papal.1.b: "Griechische Liturgie in den Hauptkirchen."
 cc_byz_papal.1.c: "Eine griechische Kirche, reich ausgestattet. Nichts anderes wird angetastet."

 # cc_byz_papal.2 - guest, subject or hostage
 cc_byz_papal.2.title: "Der Bischof von Rom"
 cc_byz_papal.2.desc: "Der Status des Papstes wurde nicht definiert, weil es bequem war, eine Definition zu vermeiden, und weil keine Definition jemanden zufriedenstellen würde.\n\nEr lebt in einer Stadt, die vom Gouverneur des Kaisers verwaltet wird. Er hat einen Haushalt, eine Korrespondenz, ein Einkommen und sehr viele Besucher, und derzeit bestehen alle vier weiter, weil niemand entschieden hat, dass sie es nicht sollten. Der Exarch bittet um eine Regelung, da er in die Lage versetzt wurde, jedes Mal zu improvisieren, wenn eine Frage auftaucht, und er ist berechtigt, dies zu tun."
 cc_byz_papal.2.desc_hostile: "Der Status des Papstes wurde nicht definiert, und das Fehlen einer Definition ist nicht länger bequem.\n\nDie Beziehungen sind schlecht. Er hat Einspruch gegen die Ernennungen, das Ritus und die Besteuerung erhoben, in dieser Reihenfolge und schriftlich, und die Briefe haben im Westen kursiert. Er hat einen Haushalt, eine Korrespondenz und sehr viele Besucher, und der Exarch hat begonnen, mit einer gewissen Dringlichkeit zu fragen, welchen dieser drei Punkte er gestattet lassen soll."
 cc_byz_papal.2.a: "Ein Gast. Sein Haushalt, seine Garde, seine Briefe."
 cc_byz_papal.2.b: "Ein Vasall. Wir bezahlen für den Haushalt und lesen die Briefe."
 cc_byz_papal.2.c: "Lass es undefiniert. Die Praxis wird es regeln."

 # cc_byz_papal.3 - appointments
 cc_byz_papal.3.title: "Ernennungen ohne Zustimmung"
 cc_byz_papal.3.desc: "Der Papst hat ohne Rücksprache mit dem Exarchen oder Konstantinopel Bischöfe in Bistümer innerhalb des Exarchats berufen.\n\nEr würde sagen, dass die Ernennung von Bischöfen seine Aufgabe sei und dass kein Kaiser jemals gefragt worden sei. Der Kaiser würde entgegnen, dass noch nie ein Kaiser die Stadt regiert habe und dass die ernannten Männer Land besitzen, Einnahmen einziehen und die Loyalität der Bevölkerung befehligen, für die der Exarch verantwortlich ist.\n\nBeide Positionen stützen sich auf vierhundert Jahre Präzedenzfälle. Die Präzedenzfälle stimmen nicht überein, weshalb es vierhundert Jahre davon gibt."
 cc_byz_papal.3.desc_subject: "Der Papst hat ohne Rücksprache mit irgendjemandem Bischöfe innerhalb des Exarchats ernannt, was eine beachtliche Behauptung von einem Mann ist, dessen Haushalt aus den Konten des Exarchen bezahlt wird.\n\nWie der Exarch in seinem Bericht anmerkt, wird dies in Italien genau so gelesen: als ein Beweis dafür, dass das Papsttum noch funktioniert, erbracht von einem Papsttum, dem kaum noch etwas anderes bleibt, um dies zu beweisen. Die Ablehnung der Ernennungen würde bestätigen, was die Kritiker des Kaisers über diese Vereinbarung sagen. Ihre Annahme würde bestätigen, was sie über den Kaiser sagen."
 cc_byz_papal.3.a: "Lehne sie ab. Benenne unsere eigenen Männer."
 cc_byz_papal.3.b: "Akzeptiere sie. Ein Bischof ist ein Bischof."
 cc_byz_papal.3.c: "Der Exarch möge es lokal regeln."

 # cc_byz_papal.4 - excommunication
 cc_byz_papal.4.title: "Das Urteil"
 cc_byz_papal.4.desc: "Das Urteil der Exkommunikation wurde ausgesprochen und veröffentlicht, namentlich gegen den Exarch und in Worten, die keinen Zweifel lassen, gegen den Kaiser.\n\nGegen den Kaiser ist dies nahezu bedeutungslos: Er gehört nicht zu dieser Gemeinschaft und gehörte sie schon nicht mehr, bevor sein Großvater geboren wurde. Gegen den Exarch hingegen ist es keineswegs bedeutungslos. Er regiert Katholiken, seine Soldaten sind Katholiken, die Familie seiner Frau sind Katholiken, und jedem Einzelnen von ihnen wurde nun von seiner eigenen Kirche mitgeteilt, dass der Gehorsam gegenüber ihm eine Sünde sei.\n\nDer Papst hat das eine Instrument gewählt, das den Kaiser nichts kostet und seinen Statthalter alles."
 cc_byz_papal.4.a: "Ignoriere es. Wir waren nie in seiner Gemeinschaft."
 cc_byz_papal.4.b: "Entferne den Exarch. Ernenne jemanden Akzeptablen."
 cc_byz_papal.4.c: "Lass es über die Gesandtschaft heben, nicht durch Unterwerfung."

 # cc_byz_papal.10 - THE GUARD
 cc_byz_papal.10.title: "Das Letzte des Erbes"
 cc_byz_papal.10.desc: "Der Kirchenstaat als weltliche Macht ist am Ende. Was bleibt, ist eine Stadt, ein Haushalt und ein alter Mann mit einem Titel, und die Armeen im Feld könnten alle drei innerhalb einer Saison beenden.\n\nDas Argument für ein Ende ist, dass ein Papsttum mit Territorium ein Papsttum ist, das Armeen aufstellen, Feinde finanzieren und Partei ergreifen kann, und es hat all drei getan. Das Gegenargument ist subtiler und der Exarch hat es gut formuliert: Das Amt überlebt die Zerstörung des Staates, und ein Papst, dem alles genommen wurde, ist ein Papst, dessen Nachfolger von demjenigen gewählt werden, der ihn beherbergt. Besser ein Papsttum, das seine Existenz dem Kaiser verdankt, als ein Papsttum in der Obhut eines anderen, gewählt in der Stadt eines anderen, dauerhaft zur Verfügung jener westlichen Macht stehend, die es aufgenommen hat.\n\nDie Kardinäle beobachten, was entschieden wird. Ebenso jeder katholische Hof in Europa."
 cc_byz_papal.10.a: "Lass ihm die Stadt. Nimm den Rest."
 cc_byz_papal.10.b: "Nehmen Sie die Stadt. Lassen Sie ihm das Amt."
 cc_byz_papal.10.c: "Beenden Sie es. Es wird keine weiteren Päpste mehr geben."

 # cc_byz_papal.11 - no papacy
 cc_byz_papal.11.title: "Eine Kirche ohne Haupt"
 cc_byz_papal.11.desc: "Es gibt keinen Papst, und es gibt kein Verfahren, um einen zu ernennen, da jedes existierende Verfahren über eine Institution lief, die es nicht mehr gibt.\n\nDie Kardinäle sind über vier Länder verteilt, und jede Gruppe behauptet, dass sie allein das Kollegium bildet. Drei Könige haben angeboten, eine Wahl auszurichten, und jedes Angebot wurde von den anderen beiden als Versuch verstanden, das Papsttum kurzerhand zu kaufen. Die Bischöfe korrespondieren heftig und einigen sich auf nichts.\n\nDas westliche Christentum entdeckt gerade, was es bedeutet, keinen Schiedsrichter zu haben, und es entdeckt dies aufgrund einer Entscheidung, die in Konstantinopel getroffen wurde."
 cc_byz_papal.11.a: "Lassen wir sie es unter sich ausstreiten."
 cc_byz_papal.11.b: "Berufen wir die westlichen Bischöfe selbst ein."
 cc_byz_papal.11.c: "Der Stuhl ist vakant. Seine Rechte fallen an die Patriarchen zurück."

 # cc_byz_italy.1 - Guelph and Ghibelline
 cc_byz_italy.1.title: "Guelfen und Ghibellinen"
 cc_byz_italy.1.desc: "Italien ist seit einem Jahrhundert zwischen der Partei des Papstes und der Partei des Kaisers geteilt, und die Teilung hat schon lange aufgehört, um entweder von ihnen zu gehen. Es ist die Art und Weise, wie eine Kommune weiß, welchen ihrer Nachbarn sie hassen muss.\n\nIn diese Situation tritt ein Exarchat: eine neue Macht in Italien, die Rom hält und im Namen eines Kaisers regiert, der zweifellos ein Kaiser ist und nicht derjenige, den die Ghibellinen meinen. Beide Parteien haben Vertreter entsandt. Beide haben erklärt, dass die Position des Exarchats offensichtlich die ihre sei. Keine von beiden hat in Erwägung gezogen, dass es eine dritte Sache sein könnte."
 cc_byz_italy.1.a: "Die Ghibellinen. In diesem Streit gibt es bereits einen Kaiser."
 cc_byz_italy.1.b: "Die Guelfen. Wir halten die Stadt des Papstes; lasst uns auch seine Partei halten."
 cc_byz_italy.1.c: "Weder noch. Wir sind die kaiserliche Partei."

 # cc_byz_italy.2 - the quarters
 cc_byz_italy.2.title: "Die Viertel in den Häfen"
 cc_byz_italy.2.desc: "Die Republiken wollen in den Häfen des Exarchats das, was sie in Konstantinopel haben: ein Viertel, ein Lagerhaus, eigene Gerichte für ihr eigenes Volk und eine Befreiung von den Zöllen, die alle anderen zahlen.\n\nSie weisen darauf hin, dass sie diese Dinge an allen anderen Stellen dieser Küste haben und dass der Handel einfach in die Häfen abwandern wird, in denen sie dies haben. Das ist wahr. Sie weisen nicht darauf hin, dass ein Viertel mit eigenen Gerichten ein Stück eines anderen Staates ist, weil jeder im Raum es bereits weiß und es auszusprechen unhöflich wäre."
 cc_byz_italy.2.desc_indebted: "Die Republiken wollen Viertel in den Häfen des Exarchats, und die Anfrage wurde mit einer Diskretion formuliert, die selbst die Botschaft ist.\n\nSie haben die ausstehenden Beträge nur einmal erwähnt, frühzeitig, im Vorbeigehen, als eine Angelegenheit, von der sie überzeugt sind, dass sie die gegenwärtige Diskussion nicht beeinflussen muss. Niemand im Raum glaubte das, und niemand sollte es glauben. Der Kaiser wird von Männern um einen Gefallen gebeten, die das einfordern könnten, was er ihnen schuldet, und die Tatsache, dass sie sich entschieden haben zu fragen statt zu fordern, ist die entgegengebrachte Höflichkeit."
 cc_byz_italy.2.a: "Gewähre die Viertel. Wir brauchen den Handel."
 cc_byz_italy.2.b: "Ablehnen. Besetze die Häfen ordnungsgemäß mit einer Garnison."
 cc_byz_italy.2.c: "Nur eine Republik, unter der Bedingung, dass sie die anderen ausschließt."

 # cc_byz_italy.3 - the communes
 cc_byz_italy.3.title: "Die Kommunen"
 cc_byz_italy.3.desc: "Die Kommunen des Exarchats würden es vorziehen, nicht von einem kaiserlichen Beamten regiert zu werden, und sie sind sorgfältig darauf bedacht, zu erklären, dass dies nichts Persönliches sei.\n\nSie haben ihre eigenen Angelegenheiten seit sechs Generationen durch Räte, Konsuln und ein System von Gewohnheitsrechten geregelt, das jedem derzeit erhobenen Anspruch auf sie vorausgeht. Was sie wollen, ist das, was sie schon immer wollten: dass ihre Freiheiten von einer fernen Autorität bestätigt werden, die sich dann wieder zurückzieht. Einige haben einen Signore ihres eigenengewählten Vorschlags vorgeschlagen, der vom Exarchen abhängig wäre, was das Problem elegant löst und ein anderes schafft."
 cc_byz_italy.3.a: "Garnisonieren Sie diese."
 cc_byz_italy.3.b: "Jeder behalte seinen Signore, bestätigt durch den Exarch."
 cc_byz_italy.3.c: "Kaufen Sie sie mit Privilegien statt mit Garnisonen."

 # cc_byz_italy.4 - a second emperor
 cc_byz_italy.4.title: "Zwei römische Kaiser"
 cc_byz_italy.4.desc: "Die Frage wurde im Norden formell in einem Dokument aufgeworfen, das laut vorgelesen werden soll: Mit welchem Recht bezeichnet sich der Herrscher in Konstantinopel als römischer Kaiser, während im Westen ein römischer Kaiser gekrönt wird, und mit welchem weiteren Recht garnisoniert er Rom?\n\nDie Antwort sind elfhundert Jahre kontinuierlicher Nachfolge von Augustus an, und es ist eine sehr gute Antwort, doch sie hat diesen Streit noch kein einziges Mal beigelegt. Der Westen hat seine eigene Antwort von vergleichbarer Qualität, und die beiden haben durch das einfache Mittel koexistiert, dass keine der Parteien Rom hielt. Dieses Mittel ist nun hinfällig."
 cc_byz_italy.4.desc_ghibelline: "Die Frage wurde im Norden aufgeworfen, und die Unbehaglichkeit ist beträchtlich, da das Exarchat in der imperialen Partei eines Streits darüber eingetragen ist, welcher Kaiser eigentlich gemeint ist.\n\nDie Ghibellinen nahmen einen Gouverneur des östlichen Kaisers in ihre Partei auf unter der Voraussetzung, dass ein Kaiser ein Kaiser ist und Italiens Feinde die Freunde des Papstes sind. Ihr Gönner in Deutschland hat nun schriftlich und öffentlich gefragt, welchen Kaiser genau die imperiale Partei eigentlich unterstützt.\n\nNiemand in der Partei möchte antworten, und das Dokument verlangt, dass jemand es tut."
 cc_byz_italy.4.desc_dynasty: "Die Frage wurde im Norden aufgeworfen: Mit welchem Recht bezeichnet sich der Herrscher in Konstantinopel als römischer Kaiser, und mit welchem weiteren Recht garnisoniert er Rom?\n\nDie zweite Hälfte der Frage ist die Schwierigkeit, denn die ehrliche Antwort ist, dass er es nicht tut. Rom wird von einer Familie gehalten, die es seit vier Generationen regiert, eine Höflichkeitszahlung leistet und eine Anweisung aus Konstantinopel über ihr Verhalten gegenüber dem westlichen Kaiser als eine Angelegenheit ihres eigenen Ermessens behandeln würde.\n\nDas Dokument aus dem Norden wurde an Konstantinopel gerichtet. Die Antwort, was auch immer sie besagt, wird von Menschen ausgeführt werden müssen, die sie nicht geschrieben haben und die nicht gefragt wurden."
 cc_byz_italy.4.desc_absorbed: "Die Frage wurde im Norden aufgeworfen: Mit welchem Recht bezeichnet sich der Herrscher in Konstantinopel als römischer Kaiser, und mit welchem weiteren Recht garnisoniert er Rom?\n\nIn diesem Fall ist die Antwort eindeutig, was ungewöhnlich genug ist, um es zu erwähnen. Rom ist eine Provinz. Sie wird von Beamten besteuert, garnisoniert und verwaltet, die in Konstantinopel ernannt und nach Belieben abberufen werden, genau wie Thrakien. Der Kaiser hält die Stadt in demselben Sinne, in dem er jede andere Stadt hält, und der westliche Anspruch ist ein Anspruch gegen einen Staat, der den Ort nachweislich regiert.\n\nDas ist eine viel bessere Ausgangslage für Argumente, als das Reich in Italien seit achthundert Jahren eingenommen hat."
 cc_byz_italy.4.a: "Antworten Sie in gleicher Weise. Es gibt nur einen römischen Kaiser."
 cc_byz_italy.4.b: "Sag nichts. Titel sind billig, Rom hingegen nicht."
 cc_byz_italy.4.c: "Schlage vor, dass die beiden Reiche einander anerkennen."
