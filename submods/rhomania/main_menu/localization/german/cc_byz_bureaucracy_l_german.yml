l_german:
 # Bureaucracies
 cc_byz_genikon: "Logothesion tou Genikou"
 cc_byz_genikon_desc: "Die allgemeine Schatzkammer: Bewertung, Einzug, Prüfung. Sie beschäftigt mehr Menschen als jedes andere Amt im Palast, und keiner von ihnen ist berühmt. Jedes andere Instrument kaiserlicher Autorität wird aus dem bezahlt, was dieses Amt einzubringen vermag."
 cc_byz_epi_ton_deeseon: "Epi tōn Deēseōn"
 cc_byz_epi_ton_deeseon_desc: "Der Meister der Petitionen. Ein ständiges Amt, durch das ein Bauer in Thrakien über den Mann, dem sein Tal gehört, hinweg direkt an den Palast appellieren kann. Es ist kostengünstig zu etablieren und wird in genau dem Maße missbilligt, in dem es gut funktioniert."
 cc_byz_oikeioi: "Die Oikeioi"
 cc_byz_oikeioi_desc: "Die eigenen Leute des Kaisers: Vertraute des Hofstaates, denen Provinzkommandos aufgrund persönlicher Gunst statt eines Amtes übertragen wurden. Entscheidungen treffen schnell und die richtigen Leute sind immer erreichbar. Es lehrt zudem jeden ehrgeizigen Mann im Reich, dass die Nähe zum Kaiser über jedem Titel steht, den er verdienen könnte."

