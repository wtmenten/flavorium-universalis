 MODIFIER_TYPE_NAME_cc_byz_oikeioi_impact_modifier: "$cc_byz_oikeioi$ Einfluss"
 MODIFIER_TYPE_DESC_cc_byz_oikeioi_impact_modifier: "Wie sehr die [bureaucracy|e] das [country|e] beeinflusst."

 # Country modifiers
 STATIC_MODIFIER_NAME_cc_byz_staffed_by_career_clerks: "Karrierebeamte"
 STATIC_MODIFIER_DESC_cc_byz_staffed_by_career_clerks: "Die Posten sind besoldet und die Männer, die sie bekleiden, verdanken ihre Position dem Amt und nicht einer Familie."
 STATIC_MODIFIER_NAME_cc_byz_offices_are_property: "Ämter als Eigentum"
 STATIC_MODIFIER_DESC_cc_byz_offices_are_property: "Posten werden selbstverständlich vererbt und verkauft. Niemand hat dies per Dekret angeordnet. Die Krone zieht zwar immer noch Steuern ein, entscheidet aber nicht mehr darüber, wer dient."
 STATIC_MODIFIER_NAME_cc_byz_retrenched_bureaus: "Gestraffte Büros"
 STATIC_MODIFIER_DESC_cc_byz_retrenched_bureaus: "Weniger Stellen, immer noch besoldet, immer noch im Besitz der Krone."

 # cc_byz_bureaucracy.1 - staffing a new bureau
 cc_byz_bureaucracy.1.title: "Besetzung des neuen Büros"
 cc_byz_bureaucracy.1.desc: "Das Amt existiert auf dem Pergament. Nun braucht es Männer.\n\nDie [ROOT.GetCountry.GetGovernment.GetEstateName('burghers_estate')] können Schreiber stellen, die ihr Leben damit verbracht haben, die Formulare zu lernen, und den Rest ihres Lebens damit verbringen werden, sie anzuwenden. Die großen Familien haben Söhne, die Positionen benötigen, und haben bekannt gegeben, dass sie erwarten, gefragt zu werden. Beide Wege füllen die Schreibtische. Sie füllen sie mit Männern, die verschiedenen Personen unterstehen."
 cc_byz_bureaucracy.1.desc_venal: "Das Amt existiert auf dem Pergament. Nun braucht es Männer, und die Frage, wie Stellen besetzt werden, ist nicht länger offen.\n\nJeder, der Geschäfte mit dem Palast hat, weiß bereits, was eine Position kostet und an wen man sich ungefähr wenden muss. Die Schreiber wissen es ebenfalls. Es bleibt nur zu entscheiden, ob die Schatzkammer ihren Anteil offen einfordert oder ihn den Männern überlässt, die ihn ohnehin nehmen werden."
 cc_byz_bureaucracy.1.desc_purged: "Das Amt existiert auf dem Pergament und die Schreibtische sind leer, was kein Zufall ist. Die Männer, die dort saßen, wurden entfernt, und die Art ihrer Entfernung wird in den Vierteln, in denen die Schreiber wohnen, immer noch diskutiert.\n\nDie großen Familien haben verfügbare Söhne und zeigen sich dabei bemerkenswert gnädig. Auch die besoldeten Männer stehen zur Verfügung und fragen über Vermittler, welche Zusicherungen es gibt, dass eine Karriere im Dienst tatsächlich eine Karriere ist. Es gibt keine gute Antwort auf diese Frage. Der Palast hat dafür gesorgt."
 cc_byz_bureaucracy.1.a: "Bezahlte Schreiber. Das Amt muss den Menschen überdauern."
 cc_byz_bureaucracy.1.b: "Die großen Familien haben Söhne, die platziert werden wollen."
 cc_byz_bureaucracy.1.c: "Verkaufe die Posten. Die Schatzkammer kann ebenso gut ihren Anteil bekommen."

 # cc_byz_bureaucracy.10 - dissolving a bureau
 cc_byz_bureaucracy.10.title: "Ein Büro wird aufgelöst"
 cc_byz_bureaucracy.10.desc: "Das Amt ist geschlossen. Seine Unterlagen gehen ins Archiv, seine Räume an denjenigen, der zuerst fragt, und sein Personal nirgendwohin im Besonderen.\n\nEs handelt sich nicht um eine große Anzahl von Männern. Es ist jedoch eine Anzahl von Männern, die genau wissen, wie der Palast funktioniert, die Familien zu ernähren haben und die nun verfügbar sind."
 cc_byz_bureaucracy.10.desc_sold: "Das Amt ist geschlossen, was eine Frage aufwirft, die niemand schriftlich festhalten will: Diese Männer haben für ihre Positionen bezahlt.\n\nSie haben kein Gehalt gekauft. Sie haben einen Anspruch gekauft, und ihnen ist völlig klar, dass der Anspruch dem Reich galt und nicht an einem bestimmten Satz von Räumen. Sie werden wollen, dass dieser Anspruch anderswo anerkannt wird."
 cc_byz_bureaucracy.10.a: "Finden Sie für sie andere Stellen im Dienst."
 cc_byz_bureaucracy.10.b: "Danke ihnen und entlasse sie."
 cc_byz_bureaucracy.10.c: "Machen wir aus dem Schlimmsten von ihnen ein Exempel."

 # cc_byz_bureaucracy.20 - underfunded bureaus
 cc_byz_bureaucracy.20.title: "Die Bureaus werden nicht bezahlt"
 cc_byz_bureaucracy.20.desc: "Die Gehälter sind Monate im Rückstand, und die Arbeit hat nicht aufgehört, was beruhigend sein sollte, es aber nicht ist.\n\nEin unbezahlter Beamter geht nicht nach Hause. Er bleibt an seinem Schreibtisch und findet einen anderen Weg, für das Sitzen daran entschädigt zu werden, und die Männer, die an diesen Schreibtisch kommen, lernen schnell, wie die neue Regelung aussieht. Bis das Schatzamt aufholt, wird die Regelung zur Gewohnheit geworden sein, und Gewohnheiten sind in diesem Reich sehr schwer abzuschaffen."
 cc_byz_bureaucracy.20.a: "Bezahle sie. Ganz gleich, was es kostet."
 cc_byz_bureaucracy.20.b: "Sie werden zurechtkommen. Das tun sie immer."
 cc_byz_bureaucracy.20.c: "Weniger Posten, aber ordnungsgemäß finanziert."

 # cc_byz_bureaucracy.30 - palace service against the army
 cc_byz_bureaucracy.30.title: "Der Palast und die Kommandeure"
 cc_byz_bureaucracy.30.desc: "Der Streit dreht sich um einen Liefervertrag, und doch geht es nicht um einen Liefervertrag.\n\nDie Eunuchen des Palastdienstes weisen zu Recht darauf hin, dass die Abrechnungen nicht aufgehen und dass die Männer, die sie unterzeichnet haben, dieselben Männer sind, die davon profitieren. Die Kommandanten weisen ebenfalls zu Recht darauf hin, dass sie diejenigen sein werden, die in der Reihe stehen, wenn die Abrechnung abgeschlossen ist, und dass sie bisher noch nie durch ein Hauptbuch verstärkt wurden.\n\nBeide warten darauf zu sehen, wem der Kaiser bereit ist, seine Zustimmung zu schenken."
 cc_byz_bureaucracy.30.a: "Die Konten werden ausgeglichen. Sorgen Sie dafür."
 cc_byz_bureaucracy.30.b: "Den Männern, die kämpfen, steht der Vertrauensvorschuss zu."
 cc_byz_bureaucracy.30.c: "Sag nichts. Lass sie rätseln."

 # cc_byz_bureaucracy.40 - entrenched and unfunded
 cc_byz_bureaucracy.40.title: "Ein Büro, das sich selbst ernährt"
 cc_byz_bureaucracy.40.desc: "Das Amt wurde seit Jahren nicht ordnungsgemäß finanziert und ist doch nicht um einen einzigen Schreiber geschrumpft, was in der Schatzkammer schon lange vor jetzt eine Frage aufgeworfen haben sollte.\n\nDie Antwort ist einfach genug. Die Männer darin werden bezahlt, nur eben nicht von uns. Für Dienste, die einst kostenlos waren, werden Gebühren erhoben, und diese Gebühren werden von einer Familie eingezogen, deren Name nirgends auftaucht und deren Zustimmung für alles erforderlich ist. Das Amt erledigt seine Arbeit immer noch. Es tut es nur nicht mehr für den Kaiser."
 cc_byz_bureaucracy.40.desc_venal: "Das Amt wurde seit Jahren nicht ordnungsgemäß finanziert und ist doch nicht um einen einzigen Schreiber geschrumpft, und an diesem Punkt gibt im Palast niemand mehr vor, überrascht zu sein.\n\nNeu ist nur das Selbstvertrauen. Die Familie, die es leitet, hat aufgehört, die Vereinbarung zu verschleiern, und hat begonnen, sie mit dem vernünftigen Argument zu verteidigen, dass sie die Arbeit auf eigene Kosten aufrechterhalten haben, während die Schatzkammer dies nicht tat. Sie irren sich nicht. Das ist die Schwierigkeit."
 cc_byz_bureaucracy.40.a: "Finanzieren Sie es ordnungsgemäß. Es gehört uns oder niemandem."
 cc_byz_bureaucracy.40.b: "Zerschlagen Sie es und zerstreuen Sie die Kleriker."
 cc_byz_bureaucracy.40.c: "Verkaufe ihnen das Amt direkt."

 # cc_byz_bureaucracy.50 - entrenched and funded
 cc_byz_bureaucracy.50.title: "Ein funktionierendes Amt"
 cc_byz_bureaucracy.50.desc: "Die Gehälter kommen pünktlich an, die Unterlagen befinden sich dort, wo das Verzeichnis sie angibt, und Männer, die als Juniorschreiber begannen, sind dreißig Jahre später immer noch da, ohne den Ehrgeiz, irgendwo anders zu sein.\n\nEs ist keine dramatische Leistung, und keine Chronik wird sie festhalten. Aber ein Antrag, der in diesem Büro eingeht, wird beantwortet, und zwar auf die gleiche Weise, unabhängig davon, wer fragt, was mehr ist, als man über die meisten Angelegenheiten des Reiches mit seinen eigenen Untertanen sagen kann."
 cc_byz_bureaucracy.50.a: "Reorganisiere die anderen Büros entsprechend."
 cc_byz_bureaucracy.50.b: "Lassen wir seinen Ruf die Arbeit erledigen."
 cc_byz_bureaucracy.50.c: "Ein Büro, das so sicher ist, rechnet nur noch mit sich selbst. Lockern Sie es auf."

 # cc_byz_bureaucracy.60 - a funding cut lands
 cc_byz_bureaucracy.60.title: "Die Kürzung wird bekannt gegeben"
 cc_byz_bureaucracy.60.desc: "Die Kürzung wurde an einem Nachmittag beschlossen und wird innerhalb einer Woche verstanden sein.\n\nNiemand tritt zurück. Die Arbeit geht weiter, zuerst genau wie zuvor und dann so, wie unbezahlte Arbeit überall weitergeht: Das dringende Geschäft läuft noch, und das Geschäft, das läuft, ist das, welches jemand aus einem bestimmten Grund vorantreibt. Niemand wird dies melden, und jeder wird sich daran anpassen."
 cc_byz_bureaucracy.60.a: "Es lässt sich nicht ändern."
 cc_byz_bureaucracy.60.b: "Kündigen Sie es als Reform an."

 # Label for the entrenchment factor in bureaucracy modifier tooltips. Referenced as
 # desc = "CC_BYZ_ENTRENCHMENT_SCALE" inside the scale multiply blocks in
 # in_game/common/bureaucracies/. Without it the tooltip renders "missing key".
 CC_BYZ_ENTRENCHMENT_SCALE: "Verschanzung"
 cc_byz_bureaucracy.21.title: "Die Gebühren sind nun Brauch"
 cc_byz_bureaucracy.21.desc: "Es war eine vorübergehende Maßnahme und es sind zwölf Jahre vergangen.\n\nDas Amt erhebt Gebühren für das, was es einst als selbstverständlich tat. Die Gebühren sind nicht geheim, nicht unregelmäßig und nirgendwo schriftlich festgehalten: Sie sind einfach bekannt, so wie der Preis für Brot bekannt ist, und ein Schreiber, der sie nicht berechnen würde, würde von seinen Kollegen als jemand angesehen werden, der ein politisches Statement setzt.\n\nEine Delegation von ihnen ist zum Palast gekommen, um mit großem Respekt zu bitten, dass die Regelung formalisiert wird. Sie bitten nicht um Erlaubnis. Sie bitten um eine Gebührenordnung, da die derzeitige Ungewissheit für alle schlecht ist."
 cc_byz_bureaucracy.21.desc_deep: "Es war eine vorübergehende Maßnahme und es sind zwölf Jahre vergangen, und sie ist nicht mehr die einzige.\n\nDas Amt erhebt Gebühren für das, was es einst als selbstverständlich tat, ebenso wie drei andere, zu Sätzen, die ohne Abstimmung aufeinander zugelaufen sind. Ein Mann mit Angelegenheiten am Palast weiß nun, was es kosten wird, bevor er aufbricht, was die Schreiber als eine erhebliche Verbesserung der Transparenz betrachten.\n\nDie Delegation, die eine Gebührenordnung verlangt, ist größer als beim letzten Mal und umfasst zwei Männer, deren Väter an denselben Schreibtischen saßen."
 cc_byz_bureaucracy.21.a: "Hebe es auf. Alles davon."
 cc_byz_bureaucracy.21.b: "Dann wird die Schatzkammer ihren Anteil nehmen."
 cc_byz_bureaucracy.21.c: "Sage nichts und lass es sich legen."
 cc_byz_bureaucracy.60.c: "Stelle die Finanzierung wieder her. Die Kürzung war ein Fehler."
 cc_byz_bureaucracy.61.title: "Was der Schnitt kostete"
 cc_byz_bureaucracy.61.desc: "Das Amt existiert noch immer. Es beantwortet weiterhin Briefe, und die Briefe werden immer noch korrekt beantwortet, was nie das eigentliche Problem war.\n\nWas sich geändert hat, ist, dass es sie in einer bestimmten Reihenfolge beantwortet. Eine Anfrage einer Familie mit einem Verwandten im Dienst wird bearbeitet; eine Anfrage eines Fremden wartet, und es gibt keine Regelung darüber und niemanden, dem man nachweisen könnte, diese Entscheidung getroffen zu haben. Die Männer, die man dazu hätte befragen können, gingen vor Jahren, als die Gehälter ausblieben, und die Männer, die sie ersetzten, traten in ein Amt ein, das bereits so funktionierte.\n\nDie Kürzung wurde an einem Nachmittag verkündet. Sie rückgängig zu machen, ist ein Projekt von Jahren, und der Kaiser, der sie ordnete, ist tot."
 cc_byz_bureaucracy.61.a: "Baue es wieder auf. Richtig und von Anfang an."
 cc_byz_bureaucracy.61.b: "Es funktioniert. Lasst es in Ruhe."
 STATIC_MODIFIER_NAME_cc_byz_bureaus_paid_in_full: "Die Rückstände beglichen"
 STATIC_MODIFIER_DESC_cc_byz_bureaus_paid_in_full: "Gehälter sind aktuell, Posten besetzt durch Männer, die sie dem Amt verdanken. Das Einzige im Reich, das die Venalität zuverlässig rückgängig macht, und es ist teuer, weil es das sein muss."
 STATIC_MODIFIER_NAME_cc_byz_fees_became_custom: "Gebühren für kostenlose Dienste"
 STATIC_MODIFIER_DESC_cc_byz_fees_became_custom: "Das Amt fand seine eigenen Einnahmequellen. Niemand hat es verordnet und niemand wird in der Lage sein, es an einem Nachmittag wieder aufzuheben."
 STATIC_MODIFIER_NAME_cc_byz_office_farmed_out: "Das Amt verpachtet"
 STATIC_MODIFIER_DESC_cc_byz_office_farmed_out: "Die Stelle gehört nun jemand anderem und die Krone erhebt Pacht für ihre eigene Verwaltung. Sie zahlt. Sie ist zudem dauerhaft."
