l_german:
 # Decision
 cc_byz_kom_raise_the_question_decision.title: "Die Komnenen-Frage"
 cc_byz_kom_raise_the_question_decision.title.entry: "Die Komnenen-Frage"
 cc_byz_kom_raise_the_question_decision.desc: "Die Großen Komnenen von [cc_kom_tre.GetName] bezeichnen sich seit 1204 als Kaiser der Römer. Zwei Höfe beanspruchen einen Titel, und [target_character.GetName] kann die Angelegenheit klären: entweder durch Verhandlungen, die in einer Kronunion enden, oder indem die Grundlage für die gewaltsame Übernahme der zweiten Krone geschaffen wird.\n\nDie Frage erstreckt sich über etwa ein Jahrzehnt. Die getroffenen Entscheidungen erhöhen entweder das #Y Einvernehmen#! (die Chance auf eine Union oder eine direkte Proklamation) oder den #Y Vorwand#! (die Dauer eines Kriegsanspruchs und den Rabatt bei der Annexion von Trapezunt am Verhandlungstisch). Dies kann nur einmal eingeleitet werden."
 cc_byz_kom_raise_the_question_decision.desc.entry: "Die Großen Komnenen von Trapezunt bezeichnen sich seit 1204 als Kaiser der Römer. Bringen Sie die Angelegenheit der zweiten Krone zur Sprache, entweder durch Verhandlungen oder durch einen Vorwand. Dies erstreckt sich über etwa ein Jahrzehnt und kann nur einmal eingeleitet werden."
 cc_byz_kom_raise_the_question_decision.a: "Sende sie nach Trapezunt."
 cc_byz_kom_raise_the_question_decision.a.entry: "Sende sie nach Trapezunt."

 # Score tooltips
 cc_byz_kom_accord_plus1_tt: "#Y Einvernehmen#! #G +1#!"
 cc_byz_kom_accord_plus2_tt: "#Y Einvernehmen#! #G +2#!"
 cc_byz_kom_accord_plus3_tt: "#Y Einvernehmen#! #G +3#!"
