 # Country modifiers
 STATIC_MODIFIER_NAME_cc_byz_kom_imperial_aid: "Kaiserliche Truppen an der Grenze"
 STATIC_MODIFIER_DESC_cc_byz_kom_imperial_aid: "Ein byzantinisches Tagma hält die pontische Grenze gegen die Turkmenen."
 STATIC_MODIFIER_NAME_cc_byz_kom_troops_abroad: "Tagma im Pontos"
 STATIC_MODIFIER_DESC_cc_byz_kom_troops_abroad: "Soldaten, die zur Verteidigung von Trapezunt entsandt wurden, stehen im eigenen Land nicht zur Verfügung."
 STATIC_MODIFIER_NAME_cc_byz_kom_acclaimed: "In Trapezunt akklamiert"
 STATIC_MODIFIER_DESC_cc_byz_kom_acclaimed: "Trapezunt hat den Kaiser ohne einen Krieg akzeptiert. Es gibt wieder nur einen römischen Kaiser."
 STATIC_MODIFIER_NAME_cc_byz_kom_crowns_joined: "Zwei Kronen, ein Kaiser"
 STATIC_MODIFIER_DESC_cc_byz_kom_crowns_joined: "Der Kaiser in Konstantinopel trägt auch die Krone von Trapezunt."
 STATIC_MODIFIER_NAME_cc_byz_kom_turned_away: "Konstantinopel abgelehnt"
 STATIC_MODIFIER_DESC_cc_byz_kom_turned_away: "Trapezunt hat die Union mit Byzanz abgelehnt und sucht nun nach anderen Freunden."
 STATIC_MODIFIER_NAME_cc_byz_kom_just_war: "Ein rechtmäßiger Anspruch"
 STATIC_MODIFIER_DESC_cc_byz_kom_just_war: "Der Anspruch auf die Krone von Trapezunt wurde über Jahre hinweg vorbereitet, und die Armee glaubt daran."

 # .1
 cc_byz_komnenoi.1.title: "Die Komnenen-Frage"
 cc_byz_komnenoi.1.desc: "Seit 1204 haben zwei Höfe ihren Herrscher Kaiser der Römer genannt: den unseren und die Großen Komnenen in [cc_kom_tre.GetName]. Das Reich hat diesen Punkt nie formell eingeräumt, und Trapezunt hat den Titel nie aufgegeben.\n\nDer Rat möchte dies klären. Eine Vereinigung der beiden Kronen würde den Streit beenden. Ebenso ein Krieg. In jedem Fall ist der erste Schritt eine Gesandtschaft."
 cc_byz_komnenoi.1.desc_family: "Der Herrscher von [cc_kom_tre.GetName] gehört unserem eigenen Haus an. Zum ersten Mal seit 1204 werden die beiden imperialen Titel von Mitgliedern einer Familie gehalten, und der Rat sieht eine Gelegenheit, die sich vielleicht nicht wieder ergibt.\n\nEine Union der Kronen könnte als Familienregelung arrangiert werden. Es wird dennoch einer Gesandtschaft bedürfen, und zwar bald."
 cc_byz_komnenoi.1.desc_hostility: "Die Beziehungen zu [cc_kom_tre.GetName] haben sich so sehr verschlechtert, dass der Rat die Komnenen nicht mehr als Verbündete betrachtet. Sie nennen ihren Herrscher immer noch Kaiser der Römer, und mehrere unserer Minister argumentieren nun, dass man ihnen den Titel mit Gewalt nehmen sollte.\n\nAndere wollen zuerst eine weitere Gesandtschaft senden. Beide Gruppen sind sich einig, dass die Angelegenheit geklärt werden muss."
 cc_byz_komnenoi.1.desc_alliance: "[cc_kom_tre.GetName] ist seit Jahren unser Verbündeter, und sein Hof denkt gut von uns. Der Rat schlägt vor, dieses Wohlwollen zu nutzen, um die alte Frage aufzuwerfen: ob es überhaupt zwei römische Kaiser geben sollte.\n\nEine Vereinigung der Kronen würde den Streit ohne einen Krieg beenden. Es wird Jahre voller Gesandtschaften und einige Kosten in Anspruch nehmen."
 cc_byz_komnenoi.1.desc_peril: "[cc_kom_tre.GetName] befindet sich in Schwierigkeiten, mit einem instabilen Hof oder einem Krieg an seiner Grenze. Der Rat weist darauf hin, dass ein schwaches Trapezunt Bedingungen akzeptieren könnte, die ein starkes ablehnen würde, und dass das Reich Schutz anbieten oder einfach warten kann.\n\nIn jedem Fall ist es an der Zeit, die Frage der zwei Kronen aufzuwerfen."
 cc_byz_komnenoi.1.a: "Sende Gesandte, die zuerst zuhören werden."
 cc_byz_komnenoi.1.b: "Es gibt ein Reich, und seine Hauptstadt ist Konstantinopel."
 cc_byz_komnenoi.1.c: "Schreibe ihnen als Familienmitglied."

 # .2
 cc_byz_komnenoi.2.title: "Der pontische Hof"
 cc_byz_komnenoi.2.desc: "Unsere Gesandten berichten, dass die Regierung von [cc_kom_tre.GetName] auf einem kleinen Rat von Archonten beruht, den großen landbesitzenden Familien des Pontos. Sie entscheiden, was der Große Komnenos akzeptieren kann, und sie sind offen für Überzeugungsarbeit.\n\nDie Gesandten schlagen Geschenke, eine Heirat zwischen den beiden Häusern oder einen Appell über die Kirche vor. Ein Gesandter schlägt einen anderen Ansatz vor: den Aufbau einer Partei am Hof, die einen fernen Kaiser einem nahen vorziehen würde."
 cc_byz_komnenoi.2.a: "Geschenke für die Archonten."
 cc_byz_komnenoi.2.b: "Schlage eine Heirat zwischen [cc_kom_byz_spouse.GetName] und [cc_kom_tre_spouse.GetName] vor."
 cc_byz_komnenoi.2.c: "Den Patriarchen bitten, an den Metropoliten zu schreiben."
 cc_byz_komnenoi.2.d: "Eine Partei am Hofe aufbauen."

 # .3
 cc_byz_komnenoi.3.title: "Die Turkmenen-Grenze"
 cc_byz_komnenoi.3.desc: "Die Turkmenenstämme in den Hügeln hinter [cc_kom_tre.GetName] überfallen jeden Sommer die pontischen Täler. Die Fähigkeit Trapezunts, diese Grenze zu halten, ist der Hauptgrund dafür, dass es noch unabhängig ist, und sein Hof weiß das.\n\nHilfe an der Grenze würde in Erinnerung bleiben. Das Vorenthalten dieser Hilfe würde ebenfalls bemerkt werden, und ein Trapezunt, das Männer und Dörfer verloren hat, wird leichter zu handhaben sein."
 cc_byz_komnenoi.3.desc_war: "[cc_kom_tre.GetName] führt Krieg, und seine Gesandten sind gekommen, um zu fragen, was Konstantinopel dagegen unternehmen wird.\n\nHilfe zum jetzigen Zeitpunkt würde in Erinnerung bleiben. Das Vorenthalten dieser Hilfe würde ebenfalls in Erinnerung bleiben, und ein Trapezunt, das Männer und Dörfer verloren hat, wird leichter zu handhaben sein."
 cc_byz_komnenoi.3.a: "Sende ein Tagma gen Osten."
 cc_byz_komnenoi.3.b: "Bezahle für die Mauern und die Garnison."
 cc_byz_komnenoi.3.c: "Trapezunt kann seine eigene Grenze halten."

 # .4
 cc_byz_komnenoi.4.title: "Komnenischer Stolz"
 cc_byz_komnenoi.4.desc: "Die Verhandlungen haben die Frage der Titel erreicht. Der Großkomnenos wird nicht zu einem bloßen Gouverneur werden, und unser Rat wird keinen zweiten Kaiser akzeptieren.\n\nEs gibt eine anerkannte Mittelposition. Der Titel des Despoten steht direkt unter dem des Kaisers und wurde zwei Jahrhunderte lang imperialen Verwandten verliehen. Ihn anzubieten kostet uns etwas Prestige. Sich zu weigern, etwas anzubieten, macht deutlich, wohin die Verhandlungen führen."
 cc_byz_komnenoi.4.a: "Biete den Titel des Despoten an."
 cc_byz_komnenoi.4.b: "Sie müssen auf den imperialen Stil verzichten."
 cc_byz_komnenoi.4.c: "Regle es als Familienangelegenheit."

 # .5
 cc_byz_komnenoi.5.title: "Rivalisierende Bewerber"
 cc_byz_komnenoi.5.desc: "Andere Höfe haben unsere Gesandtschaften nach [cc_kom_tre.GetName] bemerkt. Gesandte aus dem Ausland sind dort mit eigenen Angeboten eingetroffen: Handelsprivilegien, Bündnisse und Heiraten. Die Archonten hören ihnen allen zu.\n\nWir können sie überbieten oder Trebizonds Geschäfte mit Ausländern öffentlich verurteilen."
 cc_byz_komnenoi.5.desc_suitor: "Gesandte von [cc_kom_suitor.GetName] sind in [cc_kom_tre.GetName] eingetroffen und bringen Angebote für Handelsprivilegien, ein Bündnis und eine Heirat mit. Die Archonten hören zu.\n\nWir können sie überbieten, Trebizonds Geschäfte mit Ausländern öffentlich verurteilen oder uns direkt an [cc_kom_suitor.GetName] wenden und eine Einigung über den Pontos erzielen."
 cc_byz_komnenoi.5.a: "Überbiete sie."
 cc_byz_komnenoi.5.b: "Verurteile Trebizonds Geschäfte."
 cc_byz_komnenoi.5.c: "Mit [cc_kom_suitor.GetName] zu einer Einigung kommen."

 # .6
 cc_byz_komnenoi.6.title: "Die Beilegung von Trapezunt"
 cc_byz_komnenoi.6.desc: "Nach Jahren von Gesandtschaften muss der Rat entscheiden, wie die Frage der zwei Kronen zu lösen ist.\n\nWir können formell eine Union vorschlagen. Wenn die Archonten zustimmen, wird ein Kaiser beide Kronen tragen; ist unser Ansehen in Trapezunt hoch genug, könnten sie ihn einfach akklamieren und den separaten Staat beenden. Wenn sie ablehnen, ist das Bündnis beendet.\n\nOder wir können die Krone von Trapezunt als Usurpation erklären und sie mit Recht beanspruchen.\n\nAktuelles #Y Einvernehmen#!: #Y [ROOT.GetCountry.MakeScope.GetVariable('cc_byz_kom_accord').GetValue|0]#!\nAktueller #Y Vorwand#!: #Y [ROOT.GetCountry.MakeScope.GetVariable('cc_byz_kom_pretext').GetValue|0]#!"
 cc_byz_komnenoi.6.a: "Schlage die Union vor."
 cc_byz_komnenoi.6.b: "Ihre Krone als Usurpation erklären."
 cc_byz_komnenoi.6.c: "Lass die Frage ruhen."

 # .20
 cc_byz_komnenoi.20.title: "Der Vorschlag des Kaisers"
 cc_byz_komnenoi.20.desc: "Gesandte von [cc_kom_emperor.GetName] haben einen formellen Vorschlag unterbreitet: die Kronen von Konstantinopel und Trebizond sollen unter einem Kaiser vereint werden.\n\nWenn wir zustimmen, werden die Archonten über die Bedingungen entscheiden. Sie könnten sich mit einer Personalunion entscheiden, in der Konstantinopel der Seniorpartner ist, oder sie könnten den Kaiser direkt aklamieren und Trebizond als eigenständigen Staat beenden. Wenn wir ablehnen, ist das Bündnis mit Konstantinopel beendet und der Kaiser wird einen Anspruch auf unsere Krone haben."
 cc_byz_komnenoi.20.a: "Wir akzeptieren."
 cc_byz_komnenoi.20.b: "Trapezunt hat seinen eigenen Kaiser."

 # .21
 cc_byz_komnenoi.21.title: "Trapezunt akzeptiert"
 cc_byz_komnenoi.21.desc: "Der Hof von [cc_kom_tre.GetName] hat die Union grundsätzlich akzeptiert. Die Archonten treffen sich, um die Bedingungen festzulegen. Sie werden entweder eine Personalunion unter unserem Kaiser akzeptieren oder ihn direkt als ihren eigenen Herrscher aklamieren."
 cc_byz_komnenoi.21.a: "Wir erwarten ihre Antwort."

 # .30
 cc_byz_komnenoi.30.title: "Akklamation in Trapezunt"
 cc_byz_komnenoi.30.desc: "Die Archonten von [cc_kom_tre.GetName] haben unseren Kaiser zu ihrem eigenen Herrscher ausgerufen. Der Hof der Großen Komnenen wird aufgelöst, seine Ländereien werden Provinzen des Reiches, und zum ersten Mal seit 1204 gibt es nur einen römischen Kaiser."
 cc_byz_komnenoi.30.a: "Ein Reich."

 # .31
 cc_byz_komnenoi.31.title: "Zwei Kronen, ein Kaiser"
 cc_byz_komnenoi.31.desc: "Die Archonten von [cc_kom_tre.GetName] haben einer Personalunion zugestimmt. Trapezunt behält seinen eigenen Hof und seine eigenen Gesetze, und unser Kaiser ist nun ebenfalls dessen Herrscher.\n\nDie vollständige Integration wird Jahrzehnte dauern. Die Gesetze der Union entscheiden darüber, wie schnell dies geschehen kann."
 cc_byz_komnenoi.31.a: "Es ist ein Anfang."

 # .32
 cc_byz_komnenoi.32.title: "Trapezunt lehnt ab"
 cc_byz_komnenoi.32.desc: "Der Hof von [cc_kom_tre.GetName] hat die Union abgelehnt. Seine Gesandten haben Konstantinopel verlassen, und das Bündnis zwischen den beiden Höfen ist beendet. Berichten zufolge sucht Trapezunt bereits nach anderen Freunden.\n\nDer Rat stellt fest, dass die Ablehnung dem Reich einen Anspruch auf die Krone von Trapezunt gibt, für jeden, der diesen geltend machen möchte."
 cc_byz_komnenoi.32.a: "Sie werden es bereuen."

 # .40
 cc_byz_komnenoi.40.title: "Eine usurpirte Krone"
 cc_byz_komnenoi.40.desc: "Der Kaiser hat erklärt, dass die Krone von [cc_kom_tre.GetName] im Jahr 1204 von einer Familie ohne Recht darauf genommen wurde und heute unrechtmäßig gehalten wird. Das Reich beansprucht sie.\n\nDas Bündnis mit Trapezunt ist beendet. Das Heer ist bereit, den Anspruch durchzusetzen."
 cc_byz_komnenoi.40.a: "Die Krone wird zurückgewonnen werden."

 # .50
 cc_byz_komnenoi.50.title: "Unter einer Krone"
 cc_byz_komnenoi.50.desc: "Die Archonten haben sich auf eine Personalunion geeinigt. Der Kaiser in Konstantinopel regiert nun auch Trapezunt als dessen Seniorpartner. Unser Hof und unsere Gesetze bleiben die unseren."
 cc_byz_komnenoi.50.a: "So sei es."

 # .51
 cc_byz_komnenoi.51.title: "Der Anspruch des Kaisers"
 cc_byz_komnenoi.51.desc: "[cc_kom_emperor.GetName] hat unsere Krone als Usurpation erklärt und sie durch Recht beansprucht. Die Allianz ist beendet, und es ist wahrscheinlich, dass eine Armee aus Konstantinopel folgen wird."
 cc_byz_komnenoi.51.a: "Besetzt die Mauern."

 # .90
 cc_byz_komnenoi.90.title: "Die Frage verfällt"
 cc_byz_komnenoi.90.desc: "Die Umstände haben die Verhandlungen mit Trapezunt überholt. Die Gegenseite kann nichts mehr in eigenem Namen entscheiden, oder die beiden Höfe befinden sich im Krieg. Die Gesandtschaften werden zurückgerufen und die Angelegenheit ist erledigt."
 cc_byz_komnenoi.90.a: "So sei es."
