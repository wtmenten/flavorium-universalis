 cc_byz_kom_pretext_plus1_tt: "#Y Vorwand#! #G +1#!"
 cc_byz_kom_pretext_plus2_tt: "#Y Vorwand#! #G +2#!"
 cc_byz_kom_shortcut_tt: "Die Frage geht direkt zur Einigung über und überspringt die nächste Stufe"
 cc_byz_kom_roll_acclamation_tt: "#G Akklamation:#! [cc_kom_tre.GetName] wird annektiert"
 cc_byz_kom_roll_union_tt: "#G Union:#! [cc_kom_tre.GetName] schließt sich uns in einer Personalunion an, wobei wir der Seniorpartner sind"
 cc_byz_kom_roll_refused_tt: "#R Ablehnung:#! Das Bündnis endet, beide Höfe erhalten einen Meinungsabzug und wir erhalten einen 15-jährigen Anspruch auf die Krone von [cc_kom_tre.GetName]"
 cc_byz_kom_human_tre_decides_tt: "Der Herrscher von [cc_kom_tre.GetName] entscheidet, ob er akzeptiert"
 cc_byz_kom_pretext_outcome_tt: "Wir erhalten für 10 Jahre einen Kriegsanspruch auf die Krone von [cc_kom_tre.GetName], plus die Hälfte unseres #Y Vorwands#!. Die Allianz endet. Bei einem #Y Vorwand#! von 6 oder mehr erhalten unsere Armeen zudem einen 10-jährigen Bonus"
 cc_byz_kom_tre_accept_tt: "Unsere Krone ist mit der von Konstantinopel vereint. Die Archonten entscheiden zwischen einer Personalunion und einer vollständigen Annexion; je mehr #Y Accord#! Byzanz aufgebaut hat, desto wahrscheinlicher ist die Annexion"
 cc_byz_kom_tre_refuse_tt: "Das Bündnis mit Byzanz endet und Byzanz erhält einen 15-jährigen Anspruch auf unsere Krone"
 cc_byz_kom_no_second_emperor_tt: "Trapezunt existiert nicht, ist unser Vasall (kein Tributstaat) oder ist unser juniorer Partner in einer Union"

