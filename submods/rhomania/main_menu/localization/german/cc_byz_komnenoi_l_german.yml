 cc_byz_cb_reunify_pontus_PROV: "Vereinige den Pontos"
 cc_byz_kom_reunify: "Vereinige den Pontos"
 cc_byz_kom_reunify_desc: "Trapezunt annektieren. Günstiger, je mehr #Y Vorwand#! vor dem Krieg aufgebaut wurde."
 cc_byz_kom_reunify_tt: "Trapezunt wird annektiert"
 cc_byz_kom_despotate: "Das Despotat des Pontos gründen"
 cc_byz_kom_despotate_desc: "Mache Trebizond zu einem Vasallen unter seinem eigenen Herrscher, mit dem Titel eines Despoten anstelle eines Kaisers. Günstiger, je mehr #Y Pretext#! vor dem Krieg aufgebaut wurde."
 cc_byz_kom_pretext_discount_desc: "Komnenischer Vorwand"

