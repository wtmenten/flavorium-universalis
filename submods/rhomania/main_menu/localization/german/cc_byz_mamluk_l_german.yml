l_german:
 # Situation
 cc_byz_mamluk_confrontation: "Die levantinische Konfrontation"
 cc_byz_mamluk_confrontation_desc: "Nachdem Anatolien geregelt ist, stehen das Reich und das Sultanat von Kairo sich an einer Grenze gegenüber, die keiner von ihnen gewählt hat, über heiligen Stätten, die beide beanspruchen, während die italienischen Republiken an beide verkaufen und beiden leihen.\n\nEs kann durch Verhandlungen gelöst werden. Ein schriftliches Kondominium über die heiligen Stätten ist ein echtes Ende, und mehrere Kaiser hielten dies für die beste verfügbare Lösung. Es kann aber auch zum Pentarchie-Krieg werden, was die andere Art von Ende darstellt."

 # Country modifiers
 STATIC_MODIFIER_NAME_cc_byz_pentarchy_restored: "Die Pentarchie wiederhergestellt"
 STATIC_MODIFIER_DESC_cc_byz_pentarchy_restored: "Konstantinopel, Rom, Jerusalem, Antiochia und Alexandria. Alle fünf antiken Bistumsstädte unterstehen zum ersten Mal seit dem siebten Jahrhundert einem einzigen Kaiser, und jedes Argument über die Autorität in der christlichen Welt hat nun eine einzige Adresse."

 # Opinion modifiers
 cc_byz_levant_accommodation: "Ein Kompromiss in der Levante"
 cc_byz_abandoned_the_east: "Die östlichen Bistümer aufgegeben"

 # cc_byz_mamluk.1 - the holy places
 cc_byz_mamluk.1.title: "Die Verwahrung der heiligen Stätten"
 cc_byz_mamluk.1.desc: "Die Regelung am Heiligen Grab ist alt, kompliziert und hat seit zwei Jahrhunderten auf eine gewisse Weise funktioniert.\n\nDer Sultan hält die Stadt. Der orthodoxe Klerus besitzt die Schlüssel zu den meisten wichtigen Stellen, vorbehaltlich jährlicher Zahlungen an Kairo. Pilger kommen, werden besteuert und geschützt – ein Dienst, den der Sultan kompetent erbringt, da Pilger profitabel sind.\n\nWas sich geändert hat, ist, dass es nun einen Kaiser im Norden gibt, der nicht um sein Überleben kämpft und der der Ansicht ist, dass diese Rechte ihm durch Erbfolge zustehen und nicht vom Sultan zu bewilligen sind. Der Klerus in Jerusalem, der dort leben muss, hat mit einigem Gefühl gebeten, dass er die Angelegenheit sorgfältig abwäge."
 cc_byz_mamluk.1.desc_unionist: "Die Regelung am Heiligen Grab ist alt und kompliziert, und sie ist gerade noch komplizierter geworden.\n\nDie Union wurde unterzeichnet, und die Lateiner haben dies so interpretiert, dass eine Frage geklärt wurde, die seit den Kreuzzügen offen war: Wenn die Kirchen eine einzige Kirche unter Rom sind, dann konkurrieren die lateinischen Ansprüche auf die Verwahrung in Jerusalem nicht mehr mit denen des Kaisers; es ist derselbe Anspruch. Und die Franziskaner haben begonnen, nach dieser Interpretation zu handeln, ohne darauf zu warten, gefragt zu werden.\n\nDer orthodoxe Klerus in Jerusalem hat nach Konstantinopel geschrieben. Ihr Brief ist respektvoll und sein Kern ist, dass der Kaiser in dieser Angelegenheit einen Partner gewonnen hat, den sie nicht wollten und nicht entfernen können."
 cc_byz_mamluk.1.a: "Zahle die Abgaben, wie es jeder Kaiser seit der Eroberung getan hat."
 cc_byz_mamluk.1.b: "Die Obhut gehört uns durch Erbe. Hört auf zu zahlen."
 cc_byz_mamluk.1.c: "Handele eine dauerhafte Vereinbarung aus. Festgelegte Abgaben, festgelegte Rechte."

 # cc_byz_mamluk.2 - Cairo
 cc_byz_mamluk.2.title: "Der Kaiser im Norden"
 cc_byz_mamluk.2.desc: "Die Berichte von der Nordgrenze haben ihren Charakter geändert. Zwei Jahrhunderte lang war das Reich der Griechen eine erschöpfte Macht, mit der man Handel trieb, die gelegentlich überfallen wurde und ansonsten nicht beachtet wurde.\n\nSie ist nicht mehr erschöpft. Sie hat Anatolien besiedelt, sie verfügt über eine Flotte und hat begonnen, Fragen zu Jerusalem in einem Ton zu stellen, den der Diwan als ungewohnt empfindet. Die Berater des Sultans sind gespalten zwischen denen, die dies für eine kommerzielle Gelegenheit halten, und denen, die es für ein Grenzproblem halten, und beide Gruppen haben Präzedenzfälle auf ihrer Seite."
 cc_byz_mamluk.2.a: "Ein Grenzproblem. Verstärkt den Norden."
 cc_byz_mamluk.2.b: "Eine kommerzielle Gelegenheit. Offene Diskussionen."

 # cc_byz_mamluk.3 - spice and grain
 cc_byz_mamluk.3.title: "Gewürze, Getreide und die Republiken"
 cc_byz_mamluk.3.desc: "Der Transit durch das Rote Meer und die Fabriken von Alexandria stellen den reichsten Handel der Welt dar, und er läuft über Kairos Hände zu venezianischen und genuesischen Schiffen.\n\nDie Republiken sind diesbezüglich völlig offen, wenn man sie fragt. Sie handeln mit Kairo, weil Kairo die Gewürze hat; sie würden stattdessen mit Konstantinopel handeln, wenn Konstantinopel sie hätte; und in der Zwischenzeit sehen sie keinen Widerspruch darin, Geschäfte mit einer Macht zu machen, mit der der Kaiser im Konflikt steht, da sie Kaufleute sind und er nicht ihr Souverän ist.\n\nDie Meerengen jedoch gehören ihm."
 cc_byz_mamluk.3.desc_indebted: "Der Transit durch das Rote Meer läuft über Kairos Hände zu venezianischen und genuesischen Schiffen, und die Position des Kaisers in dieser Angelegenheit wird dadurch erschwert, dass dieselben Handelshäuser einen Großteil seiner Schuldscheine halten.\n\nSie haben das Thema selbst angesprochen, was die höfliche Art und Weise ist, dies zu tun. Ihre Faktoren merken an, dass eine Schließung der Meerengen eine ernste Angelegenheit für ihr Alexandria-Geschäft wäre, dass ihr Alexandria-Geschäft diejenigen Kredite bedient, die sie gewährt haben, und dass sie zuversichtlich sind, dass diese Erwägungen nicht gegeneinander ausgespielt werden müssen.\n\nAlles an dieser Formulierung ist wahr. Es ist zudem eine Beschreibung dessen, wer in der Lage ist, wem Unannehmlichkeiten zu bereiten."
 cc_byz_mamluk.3.a: "Lassen wir sie handeln. Die Zölle sind mehr wert als das Prinzip."
 cc_byz_mamluk.3.b: "Schließen Sie die Meerengen für den Handel mit Alexandria."
 cc_byz_mamluk.3.c: "Sichern Sie sich einen Anteil. Werden Sie Teil des Handels."

 # cc_byz_mamluk.4 - the frontier
 cc_byz_mamluk.4.title: "Die Grenzregion"
 cc_byz_mamluk.4.desc: "Die Grenze zwischen dem Reich und dem Sultanat ist keine Linie und wurde auch nie als solche gezogen.\n\nEs ist ein Gürtel von Land, zweihundert Meilen tief, besetzt von Turkmenen und Beduinen, die dort saisonal weiden, garnisoniert von Emiren, die in einem Sinne von Kairo abhängen, der variiert, je nachdem, wie kürzlich sie bezahlt wurden, und von niemandem verwaltet werden. Raubzüge sind ständig, auf niedrigem Niveau und werden von allen Beteiligten eher als eine Form der Besteuerung denn als Krieg verstanden.\n\nZwei der Grenz-Emire haben Kontakt zu Konstantinopel aufgenommen. Beide waren vorsichtig genug, sich die Option offenzulassen, dies zu leugnen."
 cc_byz_mamluk.4.desc_war: "Die Grenze hat aufgehört, ein Gürtel von Land zu sein, und ist zu einer Front geworden, und die Männer, die dort leben, mussten Dinge entscheiden, die sie zwei Jahrhunderte lang nicht entschieden hatten.\n\nDie Turkmenen haben ihre Herden nach Süden verlegt, weg von den Feldzügen, was hundert Meilen Weideland geleert und die beste Informationsquelle des Reiches darüber, was kommt, entfernt hat. Die Grenz-Emire, die stillschweigend mit Konstantinopel verhandelten, sind verstummt; ein Emir, der in Friedenszeiten zögert, ist umsichtig, ein Emir, der in Kriegszeiten zögert, ist ein Verräter, und sie wissen, als was sie vor Gericht gestellt würden.\n\nDie Raubzüge haben aufgehört. Niemand im Grenzkommando betrachtet dies als gute Nachricht."
 cc_byz_mamluk.4.a: "Kaufen Sie die Emire. Sie sind käuflich."
 cc_byz_mamluk.4.b: "Garnisonieren Sie die Grenzstädte. Lassen Sie die Plünderer an die Mauern kommen."
 cc_byz_mamluk.4.c: "Überlass die Grenze den Männern, die dort leben."

 # cc_byz_mamluk.5 - Cairo's troubles
 cc_byz_mamluk.5.title: "Unruhen in Kairo"
 cc_byz_mamluk.5.desc: "Der Sultan ist tot, und die Nachfolge wird so geregelt, wie Mamluken-Nachfolgen geregelt werden: durch die ranghöchsten Emire, in Etappen und mit Truppen auf den Straßen.\n\nDies ist weder eine Krise noch eine Überraschung; das Sultanat hat seit zwei Jahrhunderten auf diese Weise den Besitzer gewechselt, und der Staat hat jedes Mal überlebt. Was es jedoch bedeutet, ist, dass für etwa achtzehn Monate niemand in Kairo eine verbindliche Entscheidung über irgendetwas treffen kann, die Grenzgarnisonen werden von Fraktionen, die sie benötigen, nach Süden gezogen, und die Nordgrenze ist so offen wie eh und je.\n\nDie Berichte erreichten Konstantinopel drei Wochen nach den Ereignissen. In Venedig werden sie etwa jetzt eintreffen."
 cc_byz_mamluk.5.a: "Nutze den Vorteil, solange sie untereinander streiten."
 cc_byz_mamluk.5.b: "Subventionieren Sie die unterlegene Fraktion. Halten Sie sie am Leben."
 cc_byz_mamluk.5.c: "Biete Bedingungen an. Er braucht eine ruhige Nordgrenze."

 # cc_byz_mamluk.10 - the eastern patriarchs
 cc_byz_mamluk.10.title: "Die östlichen Patriarchen"
 cc_byz_mamluk.10.desc: "Die Patriarchen von Antiochia, Jerusalem und Alexandria sind orthodox, sie sind Glaubensgenossen des Kaisers und sie sind Untertanen des Sultans. Alle drei Tatsachen sind dauerhaft, und die dritte ist diejenige, die bestimmt.\n\nSie haben sich an Konstantinopel gewandt, wie sie es periodisch tun, wegen Beschränkungen beim Bau, bei Prozessionen und bei der Ernennung von Bischöfen. Der Appell ist echt und die Beschwerden sind real.\n\nEs ist jedoch auch so, dass jeder bisherige kaiserliche Eingriff zu ihren Gunsten von Vergeltungsmaßnahmen gegen sie gefolgt wurde, und dass sie dies wissen und dennoch appelliert haben, was dem Palast zeigt, wie schlimm es geworden ist."
 cc_byz_mamluk.10.desc_unionist: "Die Patriarchen von Antiochia, Jerusalem und Alexandria haben an Konstantinopel appelliert, und dieses Mal nimmt ihr Brief mehr Platz für die Union ein als für den Sultan.\n\nMan hat sie nicht konsultiert. Sie waren nicht im Konzil vertreten. Sie wurden durch ein Dokument, das aus einer Stadt eintrifft, die keiner von ihnen besucht hat, darüber informiert, dass sie nun in Gemeinschaft mit Rom stehen, und sie werden von ihrem eigenen Klerus gefragt, was dies für Bistümer bedeutet, die unter muslimischer Herrschaft seit achthundert Jahren orthodox sind und überlebt haben, indem sie darin eindeutig blieben.\n\nDie Beschwerden gegen den Sultan stehen ebenfalls im Brief, weiter unten."
 cc_byz_mamluk.10.a: "Schütze sie offen."
 cc_byz_mamluk.10.b: "Überlassen wir sie ihren eigenen Vereinbarungen."
 cc_byz_mamluk.10.c: "Fordern Sie schriftliche Garantien statt Schutz ein."

 # cc_byz_mamluk.11 - escalation
 cc_byz_mamluk.11.title: "Einigung oder Krieg"
 cc_byz_mamluk.11.desc: "Die Konfrontation hat den Punkt erreicht, an dem sie entweder zu einer Vereinbarung oder zu einem Krieg wird, und sie wird nicht mehr lange dort bleiben, wo sie ist.\n\nDas Argument für eine Einigung ist, dass das Reich mehr Grenzen hat als Armeen, dass Kairo ein kompetenter Staat ist, der die von ihm unterzeichneten Abkommen einhält, und dass ein schriftliches Kondominium über die heiligen Stätten dem Kaiser in der Praxis einen Großteil dessen geben würde, was ein Krieg ihm in der Theorie bringen würde.\n\nDas Argument für den Krieg ist, dass die Sitze von Jerusalem, Antiochia und Alexandria drei der fünf sind, dass kein Kaiser seit Herakleios sie besessen hat und dass das Argument darüber, wer für die gesamte Kirche spricht, ohne sie nicht gewonnen werden kann."
 cc_byz_mamluk.11.desc_condominium: "Die Konfrontation hat ihren Entscheidungspunkt erreicht, und die Grundlage für eine friedliche Lösung ist bereits gelegt.\n\nDie Verhandlungen über die heiligen Stätten sind weiter fortgeschritten, als es jemand erwartet hätte. Es gibt einen Entwurf. Er ist detailliert, er hat mehrere Runden von Einwänden beider Seiten überstanden, und die Beamten, die ihn erstellt haben, sind stillschweigend stolz darauf. Unterzeichnet würde er die Frage der Obhut zum ersten Mal seit den Kreuzzügen schriftlich regeln.\n\nDie Alternative liegt ebenfalls auf dem Tisch, denn die Sitze von Jerusalem, Antiochia und Alexandria sind drei der fünf, und ein Entwurf für ein Abkommen ist nicht dasselbe wie eine Pentarchie."
 cc_byz_mamluk.11.a: "Unterzeichnen Sie das Kondominium. Es ist ein besserer Friede als ein Krieg."
 cc_byz_mamluk.11.b: "Halte den Druck aufrecht. Verbinde dich zu nichts."
 cc_byz_mamluk.11.c: "Der Pentarchie-Krieg. Drei Sitze, und die Streitfrage ist geklärt."

 # cc_byz_mamluk.12 - the seats
 cc_byz_mamluk.12.title: "Die antiken Bistümer"
 cc_byz_mamluk.12.desc: "Ein Bistum, das seit dem siebten Jahrhundert unter muslimischer Herrschaft stand, wurde zurückgewonnen, und die Zeremonie zur Installation eines Patriarchen musste aus den Archiven rekonstruiert werden, da keine lebende Person eine solche gesehen hat.\n\nDie Gemeinde, die sich dafür versammelte, ist dieselbe Gemeinde, die bereits im Vorjahr dort war und im selben Gebäude unter demselben Klerus Gottesdienst feierte. An ihrem Glauben hat sich nichts geändert. Was sich geändert hat, ist die Autorität über ihren Köpfen, und einige von ihnen haben privat bemerkt, dass sie schon früher erlebt haben, wie sich Autoritäten änderten."
 cc_byz_mamluk.12.a: "Die Installation möge ordnungsgemäß erfolgen."
 cc_byz_mamluk.12.b: "Es gibt fünf Sitze. Weiter."

 # cc_byz_mamluk.13 - the pentarchy
 cc_byz_mamluk.13.title: "Die wiederhergestellte Pentarchie"
 cc_byz_mamluk.13.desc: "Konstantinopel, Rom, Jerusalem, Antiochia und Alexandria. Alle fünf, in der Hand eines Kaisers, zum ersten Mal seit vor den arabischen Eroberungen.\n\nDie fünf Patriarchate waren die Struktur, durch die sich die ungeteilte Kirche selbst regierte, und der Streit darüber, wer diese Autorität geerbt hat, dauerte acht Jahrhunderte an, genau weil niemand alle fünf halten und die Sache klären konnte. Dieser Einwand gilt nicht mehr.\n\nWas folgt, ist nun eine Angelegenheit des Kaisers. Das Instrument existiert."
 cc_byz_mamluk.13.a: "Dem Schisma kann nun zu unseren Bedingungen begegnet werden."

 # cc_byz_mamluk.20 - endings
 cc_byz_mamluk.20.title: "Die Levante"
 cc_byz_mamluk.20.desc_pentarchy: "Die Konfrontation ist vorbei und sie endete mit dem maximalen Ergebnis: die östlichen Bistümer sind zurückgewonnen, die Pentarchie ist wieder vollständig und in Konstantinopel sitzt ein Kaiser, der jedes alte Patriarchat der christlichen Welt innehat.\n\nEs hat gekostet, was solche Dinge kosten. Die Armeen, die dies vollbracht haben, befinden sich in Syrien und Ägypten und werden dort bleiben müssen. Die Grenze hat sich nach Süden verschoben und ist länger geworden. Kairo ist, obwohl besiegt, immer noch Kairo und wird innerhalb einer Generation wieder ein Problem sein.\n\nAber das Argument, das seit dem siebten Jahrhundert geführt wird, ist geklärt, und es ist zugunsten von Konstantinopel entschieden, was all diese Schwierigkeiten überdauern wird."
 cc_byz_mamluk.20.desc_condominium: "Die Konfrontation ist vorbei und sie endete in einem Dokument statt in einer Schlacht.\n\nDas Kondominium über die heiligen Stätten ist präzise, für beide Seiten gleichermaßen irritierend und wurde von beiden Parteien eingehalten. Der orthodoxe Klerus besitzt die Rechte, die das Abkommen ihm einräumt, die Gebühren sind festgelegt und werden gezahlt, und Pilger stehen unter einem Schutz, den beide Mächte garantieren und den keine von ihnen einseitig zurücknehmen kann.\n\nEs ist kein Triumph, und niemand in der Hauptstadt hat etwas anderes vorgetäuscht. Es ist die erste befriedete Ostgrenze, die das Reich seit vierhundert Jahren hatte, und die nachfolgenden Kaiser werden feststellen, dass dies weitaus mehr wert ist als ein Feldzug."
 cc_byz_mamluk.20.desc_defeat: "Die Konfrontation ist vorbei und Kairo hat sie gewonnen.\n\nDie Gebühren am Heiligen Grab wurden erhöht, der orthodoxe Klerus dort hält seine Rechte zu schlechteren Bedingungen als vor dem Interesse des Kaisers, und die östlichen Patriarchen haben ihre eigenen Vereinbarungen mit dem Sultanat getroffen, aufgrund der vernünftigen Begründung, dass Konstantinopel sie nicht schützen konnte und Kairo der Ort ist, an dem sie leben.\n\nDas Reich hat Druck ausgeübt, konnte dies aber nicht zu Ende führen, was die spezifische Art ist, aus einer Konfrontation schlechter hervorzugehen, als wenn man sie gar nicht erst begonnen hätte. Alle Beteiligten verstehen dies, einschließlich der Patriarchen."
 cc_byz_mamluk.20.desc_stalemate: "Die Konfrontation ist nicht so sehr beendet, als ob sie nicht mehr aktuell wäre.\n\nNichts wurde geklärt. Die Abgaben werden immer noch gezahlt, die Verwahrung wird immer noch in denselben Begriffen bestritten, die Grenze ist immer noch ein Landgürtel statt einer Linie, und die Korrespondenz zwischen den beiden Kanzleien ist zum Routinegeschäft über Pilger und Getreide zurückgekehrt. Beide Mächte fanden andere Grenzen dringlicher.\n\nDie Fragen bleiben offen. Sie sind seit dem siebten Jahrhundert offen, und es gibt keinen besonderen Grund zu erwarten, dass diese Generation diejenige war, die sie geschlossen hat."
 cc_byz_mamluk.20.a: "So bleibt es dabei."
