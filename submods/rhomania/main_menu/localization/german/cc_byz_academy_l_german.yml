l_german:
 # Mission task
 cc_byz_acad_5_universities_tt: "Wir besitzen mindestens 5 Orte mit einer Universität"
 cc_byz_acad_opens_chain_tt: "Öffnet #Y Die Akademie#!, eine Reihe von Ereignissen über 6 bis 10 Jahre, die entscheiden, wer lehrt, was gelehrt wird, und in einer Belohnungsurkunde endet"

 # Tooltips
 cc_byz_acad_lean_latin2_tt: "Die Akademie neigt sich #Y 2#! stärker den lateinischen Scholastikern zu"
 cc_byz_acad_lean_hellenic2_tt: "Die Akademie neigt #Y 2#! zu Plethons Platonikern"
 cc_byz_acad_lean_toward_middle_tt: "Die Ausrichtung der Akademie rückt #Y 1#! zurück zur Mitte"
 cc_byz_acad_unlock_policy_tt: "Schaltet die Stiftungsbelohnung #Y Politik der Kaiserlichen Akademie#! frei"
 cc_byz_acad_unlock_literacy_tt: "Schaltet die Stiftungsbelohnung #Y Gebildete Universitäten#! frei"
 cc_byz_acad_unlock_institution_tt: "Schaltet die Stiftungsbelohnung #Y Westliches Wissen#! frei"
 cc_byz_acad_unlock_tactics_tt: "Schaltet die Stiftungsbelohnung #Y Die Lehre der Tactica#! frei"
 cc_byz_acad_unlock_law_tt: "Schaltet die Stiftungsbelohnung #Y Rechtsfakultät#! frei"
 cc_byz_acad_unlock_theology_tt: "Schaltet die Stiftungsbelohnung #Y Theologische Fakultät#! frei"
 cc_byz_acad_reconciled_tt: "Die Kirche ist mit der Akademie versöhnt: #G +1#! Charta-Auswahl"
 cc_byz_acad_dispute_won_tt: "#G Gewonnen:#! Die Schule gewinnt an Ruhm und Qualität, wir erhalten #G +1#! Statutenwahl und #Y Gebildete Universitäten#! wird freigeschaltet"
 cc_byz_acad_dispute_lost_tt: "#R Verloren:#! Die Schule verliert an Ruhm"
 cc_byz_acad_reward_policy_tt: "Elitebildung erhält die Politik #Y Imperiale Akademie#!. Während sie aktiv ist, zieht sie unsere Gesellschaft zudem in die Richtung der Seite, die die Akademie gewonnen hat"
 cc_byz_acad_reward_literacy_tt: "Jeder Ort in unserem Besitz mit einer Universität erhält permanent #G +4 %#! maximale Alphabetisierung für Adlige und Bürger. Später errichtete Universitäten erhalten dies ebenfalls"
 cc_byz_acad_reward_institution_tt: "Jeder Ort in unserem Besitz mit einer Universität erhält permanent ein schnelleres Institutionswachstum. Später errichtete Universitäten erhalten dies ebenfalls"
 cc_byz_acad_reward_tactics_tt: "#G +0,01#! Militärtaktik für jede Universität in unserem Besitz, bis zu #G +0,2#! bei 20 Universitäten, permanent"

 # Law policy
 cc_byz_imperial_academy: "Imperiale Akademie"
 cc_byz_imperial_academy_desc: "Die Beamten des Staates werden an einer Akademie ausgebildet, die der Kaiser gestiftet hat und finanziert. Sie lernen Recht, Literatur und die Handbücher des Krieges von Meistern, die der Hof ernennt."

 # Modifiers
 STATIC_MODIFIER_NAME_cc_byz_acad_literacy: "Akademiemeister"
 STATIC_MODIFIER_DESC_cc_byz_acad_literacy: "An der kaiserlichen Akademie ausgebildete Meister lehren an dieser Universität."
 STATIC_MODIFIER_NAME_cc_byz_acad_institutions: "Westliches Wissen"
 STATIC_MODIFIER_DESC_cc_byz_acad_institutions: "Diese Universität studiert die lateinischen Scholastiker in griechischer Übersetzung, und mit ihnen gelangen neue Ideen aufkommen."
 STATIC_MODIFIER_NAME_cc_byz_acad_law_faculty: "Rechtsfakultät"
 STATIC_MODIFIER_DESC_cc_byz_acad_law_faculty: "Justinians Kodex wird an der Akademie gelehrt, und ihre Absolventen besetzen die Staatsämter."
 STATIC_MODIFIER_NAME_cc_byz_acad_theology_latin: "Theologiefakultät: Scholastiker"
 STATIC_MODIFIER_DESC_cc_byz_acad_theology_latin: "Die Theologen der Akademie lesen Aquinas und argumentieren mit den Lateinern in deren eigenen Begriffen."
 STATIC_MODIFIER_NAME_cc_byz_acad_theology_palamite: "Theologiefakultät: Hesychast"
 STATIC_MODIFIER_DESC_cc_byz_acad_theology_palamite: "Die Theologen der Akademie lehren die Doktrin des Gregor Palamas, und die Klöster vertrauen ihnen."
 STATIC_MODIFIER_NAME_cc_byz_acad_theology_platonist: "Theologiefakultät: Platoniker"
 STATIC_MODIFIER_DESC_cc_byz_acad_theology_platonist: "Die Theologen der Akademie lesen Platon neben den Kirchenvätern. Der Klerus beobachtet sie genau."
 STATIC_MODIFIER_NAME_cc_byz_acad_drift_latin: "Die Akademie liest Latein"
 STATIC_MODIFIER_DESC_cc_byz_acad_drift_latin: "Die lateinischen Scholastiker haben die Akademie für sich gewonnen, und ihre Absolventen tragen deren Gewohnheiten in die Staatsämter."
 STATIC_MODIFIER_NAME_cc_byz_acad_drift_hellenic: "Die Akademie liest Platon"
 STATIC_MODIFIER_DESC_cc_byz_acad_drift_hellenic: "Plethons Kreis hat die Akademie gewonnen, und ihre Absolventen tragen das antike Wissen in die Staatsämter."
 AUTO_MODIFIER_NAME_cc_byz_acad_tactics: "Die Lehre der Tactica"
 AUTO_MODIFIER_DESC_cc_byz_acad_tactics: "Offiziere studieren Leo VI.s Tactica und die älteren Handbücher an der Akademie. Je mehr Universitäten sie ausbilden, desto besser kämpfen sie."
 AUTO_MODIFIER_NAME_cc_byz_acad_policy_latin: "Imperiale Akademie: Lateinische Meister"
 AUTO_MODIFIER_DESC_cc_byz_acad_policy_latin: "Die Politik der Kaiserlichen Akademie unter Meistern, die die lateinische Scholastik lesen."
 AUTO_MODIFIER_NAME_cc_byz_acad_policy_hellenic: "Imperiale Akademie: Platonische Meister"
 AUTO_MODIFIER_DESC_cc_byz_acad_policy_hellenic: "Die Politik der Kaiserlichen Akademie unter Meistern aus Plethons Kreis."

 # .1 Who leads the Academy
 cc_byz_academy.1.title: "Die Akademie wurde wiedereröffnet"
 cc_byz_academy.1.desc: "Der Kaiser hat eine Akademie in [cc_acad_seat.GetName] gestiftet, die erste Schule ihrer Art seit dem Pandidakterion. Ihre Hallen sind bereit. Ihre Meister sind noch nicht gewählt, und drei Parteien bewerben sich um die Ernennung.\n\nDie Latinophrones lesen Aquinas in der Übersetzung von Demetrios Kydones und glauben, dass die Lateiner etwas zu lehren haben. Die hesychastischen Mönche des Gregor Palamas vertreten die Ansicht, dass die Kirche bereits weiß, wozu Wissen dient. In Mistra lehrt Gemistos Plethon Platon jeden, der die Reise auf sich nimmt, und seine Schüler sind bereits in der Hauptstadt und bewerben sich um die Stelle."
 cc_byz_academy.1.a: "Die Latinophrones. Wissen kennt keine Grenzen."
 cc_byz_academy.1.b: "Die palamitischen Mönche. Das eigene Wissen der Kirche."
 cc_byz_academy.1.c: "Plethons Kreis aus Mistra."
 cc_byz_academy.1.d: "Ein Gelehrter aus unserem eigenen Kabinett, der uns untersteht."

 # .2 The faculties
 cc_byz_academy.2.title: "Die Fakultäten"
 cc_byz_academy.2.desc: "Die Akademie kann es sich leisten, in diesem Jahrzehnt eine Fakultät ordnungsgemäß zu eröffnen. Die Juristen wünschen einen Lehrstuhl für Recht und einen Nomophylax, der ihn innehat, wie Konstantin IX. im Jahr 1046 gründete. Die Offiziere wollen, dass Leo VI.s Tactica und die älteren Handbücher als Disziplin gelehrt werden. Die Rhetoren weisen darauf hin, dass jeder Beamte, den das Reich je hatte, zuerst in Lettern ausgebildet wurde und dass der Rest folgt.\n\nEin Minister mit der richtigen Ausbildung könnte eine zweite Fakultät tragen."
 cc_byz_academy.2.a: "Recht. Justinians Kodex und ein Nomophylax, um ihn zu lehren."
 cc_byz_academy.2.b: "Militärwissenschaft. Die Tactica und die alten Handbücher."
 cc_byz_academy.2.c: "Literatur und Rhetorik."
 cc_byz_academy.2.d: "Unser Jurist lehrt Recht neben den Lettern."
 cc_byz_academy.2.e: "Unser Stratege schreibt eine neue Tactica neben der Fakultät für Lettern."

 # .3 The translation question
 cc_byz_academy.3.title: "Die Übersetzungsfrage"
 cc_byz_academy.3.desc: "Die Bibliothek der Akademie hat gefragt, was übersetzt werden soll. Kydones' Aquinas ist bereits in griechischer Sprache im Umlauf, und die Latinophrones wünschen den Rest der Scholastiker dazu. Die Mönche wollen nichts Lateinisches in den Regalen. Plethons Schüler wollen, dass seine Gesetze offen gelehrt werden, was bedeuten würde, die alten Götter als Philosophie in einer christlichen Hauptstadt zu lehren.\n\nWas auch immer hier gelesen wird, wird von jedem Beamten gelesen werden, den die Akademie ausbildet."
 cc_byz_academy.3.a: "Übersetze Aquinas und die lateinischen Scholastiker."
 cc_byz_academy.3.b: "Nur griechische Texte. Wir haben unsere eigenen Bücher."
 cc_byz_academy.3.c: "Lehren Sie Plethons Gesetze offen."
 cc_byz_academy.3.d: "Unser Humanist übersetzt in beide Richtungen."

 # .4 The Patriarch objects
 cc_byz_academy.4.title: "Der Patriarch widerspricht"
 cc_byz_academy.4.desc: "Der Patriarch hat geschrieben, dass eine Akademie, die Philosophie ohne Theologie lehrt, nur die Hälfte dessen lehrt, was ein Christ wissen muss. Er bittet um einen Lehrstuhl für Theologie innerhalb der Mauern der Akademie, der von der Kirche besetzt wird."
 cc_byz_academy.4.desc_latin: "Der Patriarch hat geschrieben, dass die Akademie zu einer Schule für Latinisierer geworden ist und dass ihre Absolventen in den Palastkorridoren über das Filioque streiten. Er bittet um einen Lehrstuhl für Theologie, besetzt durch die Kirche, um ihnen aus dem Inneren der Akademie heraus zu antworten."
 cc_byz_academy.4.desc_platonist: "Der Patriarch hat geschrieben, dass die Akademie unter dem Namen der Philosophie Heidentum lehrt und dass die Kirche nicht schweigen wird, während der Kaiser dafür bezahlt. Er bittet um einen Lehrstuhl für Theologie innerhalb der Mauern der Akademie, der von der Kirche besetzt wird."
 cc_byz_academy.4.a: "Geben Sie der Kirche ihren Lehrstuhl."
 cc_byz_academy.4.b: "Die Akademie ist dem Kaiser unterstellt."
 cc_byz_academy.4.c: "Unser Theologe vermittelt Bedingungen."

 # .5 The court schools dispute
 cc_byz_academy.5.title: "Der Streit der Schulen"
 cc_byz_academy.5.desc: "Die Meister der Akademie haben eine öffentliche Disputation einberufen, um das Curriculum festzulegen, und haben die anderen Schulen des Reiches eingeladen, ihre Besten zu senden. Wir haben keine Hofschule von ausreichendem Rang, die wir entsenden könnten. Meister könnten aus dem Ausland angeheuert werden, um in unserem Namen zu argumentieren – gegen eine entsprechende Bezahlung."
 cc_byz_academy.5.desc_school: "Die Meister der Akademie haben eine öffentliche Disputation einberufen, um das Curriculum festzulegen, und haben die anderen Schulen des Reiches eingeladen, ihre Besten zu senden. Unsere Hofschule in [cc_acad_school_seat.GetName] könnte antreten. Ein Sieg würde ihr einen Namen verschaffen; eine Niederlage würde ebenso lange in Erinnerung bleiben."
 cc_byz_academy.5.a: "Schicken Sie die Schule hinein."
 cc_byz_academy.5.b: "Unser Minister leitet die Disputanten der Schule."
 cc_byz_academy.5.c: "Halten Sie die Schulen daraus heraus."
 cc_byz_academy.5.d: "Stellen Sie Meister aus dem Ausland ein."
 cc_byz_academy.5.e: "Die Akademie kann für sich selbst argumentieren."

 # .6 The charter
 cc_byz_academy.6.title: "Die Charta der Akademie"
 cc_byz_academy.6.desc: "Die Charta der Akademie ist bereit für das Siegel des Kaisers. Sie kann eine Stiftung enthalten, sowie eine weitere für jeden dieser Punkte: die Versöhnung der Kirche mit der Akademie und eine Hofschule, die in der Disputation siegreich war.\n\nJede Stiftung wurde durch eine frühere Entscheidung freigeschaltet, und einige benötigen weitere Voraussetzungen:\n#Y Politik der Kaiserlichen Akademie:#! eine Rechts- oder Geisteswissenschaftliche Fakultät.\n#Y Gebildete Universitäten:#! eine Geisteswissenschaftliche Fakultät oder eine gewonnene Disputation, sowie ein Alphabetisierungsgrad des Adels von mindestens 35 %.\n#Y Westliches Wissen:#! die übersetzten lateinischen Scholastiker.\n#Y Die Lehre der Tactica:#! eine militärische Fakultät und ein Minister mit militärischem Geschick von 65 oder mehr oder eine militärische Hofschule.\n#Y Rechtsfakultät:#! eine Rechtsfakultät sowie ein Rechtsgelehrter im Kabinett oder eine administrative Hofschule.\n#Y Theologische Fakultät:#! die Versöhnung der Kirche."
 cc_byz_academy.6.policy: "Verankere die Akademie im Bildungsgesetz."
 cc_byz_academy.6.literacy: "Senden Sie ihre Meister an jede Universität."
 cc_byz_academy.6.institution: "Verbreiten Sie das übersetzte Wissen an jede Universität."
 cc_byz_academy.6.tactics: "Machen Sie die Tactica zum Offizierskurs."
 cc_byz_academy.6.law: "Stiften Sie die Rechtsfakultät."
 cc_byz_academy.6.theology: "Stiften Sie die Theologiefakultät."
 cc_byz_academy.6.none: "Besiegeln Sie die Urkunde so, wie sie ist."

 # .90 The Academy closes
 cc_byz_academy.90.title: "Die Akademie schließt"
 cc_byz_academy.90.desc: "Da sowohl Konstantinopel als auch Athen verloren gingen, hat die Akademie keine Heimat mehr. Ihre Meister sind nach Italien und in die Klöster zerstreut, und ihre Urkunde wurde nie besiegelt."
 cc_byz_academy.90.a: "Eine weitere Schule ging an das Reich verloren."
