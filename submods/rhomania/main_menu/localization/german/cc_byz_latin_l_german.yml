l_german:
 # Tooltips
 cc_byz_lat_bride_tt: "Unser Herrscher oder Erbe ist mit dem Herrscher oder Erben einer katholischen Großmacht verheiratet, die eine königliche Hochzeit mit uns hat und nicht im Krieg mit uns liegt"
 cc_byz_lat_opens_chain_tt: "Öffnet #Y Die lateinische Kaiserin#!, eine Reihe von Ereignissen über etwa ein Jahrzehnt mit der stärksten katholischen Großmacht, die in unsere Dynastie eingeheiratet hat"
 cc_byz_lat_bond_plus1_tt: "#Y Bindung zu [cc_lat_partner.GetName]#! #G +1#!"
 cc_byz_lat_bond_plus2_tt: "#Y Bindung zu [cc_lat_partner.GetName]#! #G +2#!"
 cc_byz_lat_bond_minus1_tt: "#Y Bindung zu [cc_lat_partner.GetName]#! #R -1#!"
 cc_byz_lat_bond_minus2_tt: "#Y Bindung zu [cc_lat_partner.GetName]#! #R -2#!"
 cc_byz_lat_company_pay_tt: "In 5 bis 8 Jahren wird die Bezahlung der Kompanie fällig"
 cc_byz_lat_opens_union_tt: "Knüpft kostenlos Kontakte mit Rom bezüglich einer Kirchenunion"
 cc_byz_lat_papal_standing_plus1_tt: "#Y Papstliches Ansehen#! #G +1#!"
 cc_byz_lat_crusade_tt: "Wir und [cc_lat_partner.GetName] erhalten jeweils einen 15-jährigen Kriegsgrund auf [cc_lat_target.GetName]. Wenn [cc_lat_partner.GetName] nicht von einem Spieler kontrolliert wird und noch nicht unser Verbündeter ist, wird es für 20 Jahre unser Verbündeter. Unsere Armeen erhalten einen 10-jährigen Bonus"
 cc_byz_lat_letters_unnoticed_tt: "#G 70%:#! niemand an ihrem Hof bemerkt es"
 cc_byz_lat_letters_discovered_tt: "#R 30%:#! ihr Hof entdeckt, wofür ihre Briefe verwendet werden"

 # Casus belli
 cc_byz_cb_latin_crusade: "Lateinischer Kreuzzug"
 cc_byz_cb_latin_crusade_desc: "Gemeinsam mit katholischen Schwiegerfamilien geschworen, um Provinzen zurückzugewinnen, die an eine muslimische Macht verloren gingen."
 cc_byz_cb_latin_crusade_PROV: "Lateinischer Kreuzzug"

 # Opinion modifiers
 cc_byz_lat_honoured: "Vom Kaiser geehrt"
 cc_byz_lat_rebuffed: "Vom Kaiser zurückgewiesen"
 cc_byz_lat_affronted: "Vom Kaiser gekränkt"
 cc_byz_lat_kin: "Eine Familie mit dem Kaiser"

 # Country modifiers
 STATIC_MODIFIER_NAME_cc_byz_lat_latin_chapel: "Eine lateinische Kapelle im Palast"
 STATIC_MODIFIER_DESC_cc_byz_lat_latin_chapel: "Die Kaiserin hört in Blachernae die Messe. Westliche Gesandte sehen dies als Zeichen des guten Willens; der Klerus nicht."
 STATIC_MODIFIER_NAME_cc_byz_lat_orthodox_empress: "Eine orthodoxe Kaiserin"
 STATIC_MODIFIER_DESC_cc_byz_lat_orthodox_empress: "Die Kaiserin nahm einen orthodoxen Namen und ein orthodoxes Bekenntnis an. Die Kirche segnet die Ehe."
 STATIC_MODIFIER_NAME_cc_byz_lat_orthodox_queen_abroad: "Eine orthodoxe Königin im Ausland"
 STATIC_MODIFIER_DESC_cc_byz_lat_orthodox_queen_abroad: "Eine Prinzessin des Kaiserhauses bewahrt ihren Glauben an einem lateinischen Hof. Die Kirche hält sie als Vorbild vor."
 STATIC_MODIFIER_NAME_cc_byz_lat_catholic_princess: "Eine von Rom empfangene Prinzessin"
 STATIC_MODIFIER_DESC_cc_byz_lat_catholic_princess: "Eine Prinzessin des Kaiserhauses ist der römischen Kirche beigetreten. Westliche Höfe billigen dies; unser Klerus nicht."
 STATIC_MODIFIER_NAME_cc_byz_lat_scholars_abroad: "Griechische Gelehrte im Ausland"
 STATIC_MODIFIER_DESC_cc_byz_lat_scholars_abroad: "Gelehrte und Manuskripte zogen mit der Prinzessin nach Westen. Sie lehren Griechisch an einem fremden Hof und werden in der Heimat vermisst."
 STATIC_MODIFIER_NAME_cc_byz_lat_greek_learning: "Griechische Gelehrsamkeit"
 STATIC_MODIFIER_DESC_cc_byz_lat_greek_learning: "Byzantinische Gelehrte sind mit einer griechischen Prinzessin eingetroffen und lehren an unserem Hof."
 STATIC_MODIFIER_NAME_cc_byz_lat_sacred_ceremonial: "Die Zeremonie nach Westen getragen"
 STATIC_MODIFIER_DESC_cc_byz_lat_sacred_ceremonial: "Eine Prinzessin des Kaiserhauses pflegt das Zeremoniell des Heiligen Palastes an einem westlichen Hof, und dessen Herrscher haben begonnen, es zu kopieren."
 STATIC_MODIFIER_NAME_cc_byz_lat_princess_letters: "Briefe aus dem Westen"
 STATIC_MODIFIER_DESC_cc_byz_lat_princess_letters: "Eine Prinzessin an einem westlichen Hof schreibt oft nach Hause, und ihre Briefe werden von mehr Menschen gelesen als von ihrer Familie."
 STATIC_MODIFIER_NAME_cc_byz_lat_latin_knights: "Lateinische Ritter im Dienst"
 STATIC_MODIFIER_DESC_cc_byz_lat_latin_knights: "Eine Kompanie westlicher Ritter dient in der kaiserlichen Armee. Die Archonten ärgern sich über deren Besoldung und Rangfolge."
 STATIC_MODIFIER_NAME_cc_byz_lat_company_at_large: "Die Kompanie im Feld"
 STATIC_MODIFIER_DESC_cc_byz_lat_company_at_large: "Die unbezahlte Kompanie treibt ihren Sold in den Provinzen ein."
 STATIC_MODIFIER_NAME_cc_byz_lat_latin_quarter: "Lateinisches Viertel und Befreiungen"
 STATIC_MODIFIER_DESC_cc_byz_lat_latin_quarter: "Die Kaufleute der Schwiegereltern halten ein Viertel am Goldenen Horn und zahlen keine Zölle. Der Handel wächst; die Schatzkammer und unsere eigenen Kaufleute bezahlen dafür."
 STATIC_MODIFIER_NAME_cc_byz_lat_latin_quarter_taxed: "Lateinisches Viertel"
 STATIC_MODIFIER_DESC_cc_byz_lat_latin_quarter_taxed: "Die Kaufleute der Schwiegereltern halten ein Viertel am Goldenen Horn und zahlen die vollen Zölle."
 STATIC_MODIFIER_NAME_cc_byz_lat_privileges_in_romania: "Privilegien in Rumänien"
 STATIC_MODIFIER_DESC_cc_byz_lat_privileges_in_romania: "Unsere Kaufleute besitzen ein Viertel in Konstantinopel und handeln dort zollfrei."
 STATIC_MODIFIER_NAME_cc_byz_lat_union_sponsors: "Sponsoren der Union"
 STATIC_MODIFIER_DESC_cc_byz_lat_union_sponsors: "Unsere katholischen Schwiegerfamilien plädieren am päpstlichen Hof für eine Kirchenunion."
 STATIC_MODIFIER_NAME_cc_byz_lat_crusade_preparations: "Der geschworene Kreuzzug"
 STATIC_MODIFIER_DESC_cc_byz_lat_crusade_preparations: "Wir und unsere katholischen Schwiegereltern haben eine gemeinsame Expedition geschworen. Ritter und Aufgebote werden zusammengezogen."
 STATIC_MODIFIER_NAME_cc_byz_lat_western_kinship: "Verwandtschaft mit dem Westen"
 STATIC_MODIFIER_DESC_cc_byz_lat_western_kinship: "Zwei Regierungshäuser, eines griechisch und eines lateinisch, betrachten einander nun als Familie."
 STATIC_MODIFIER_NAME_cc_byz_lat_western_friendship: "Freunde im Westen"
 STATIC_MODIFIER_DESC_cc_byz_lat_western_friendship: "Die Ehe hinterließ eine dauerhafte Freundschaft mit einem westlichen Hof."
 STATIC_MODIFIER_NAME_cc_byz_lat_dowager_court: "Der Hof der Witwe"
 STATIC_MODIFIER_DESC_cc_byz_lat_dowager_court: "Die lateinische Kaiserin blieb in Konstantinopel, nachdem sich das Glück ihrer Familie gewandelt hatte, und westliche Gesandte besuchen sie noch immer."

 # .1 The empress arrives
 cc_byz_latin.1.title: "Die lateinische Kaiserin"
 cc_byz_latin.1.desc: "Die Braut aus [cc_lat_partner.GetName] ist mit ihren Damen, ihren Kaplänen und einem Beichtvater in Konstantinopel eingetroffen. Der Patriarch fragt, ob sie in die orthodoxe Kirche aufgenommen und ein griechischer Name gegeben werden soll, so wie Bertha von Sulzbach zu Irene wurde. Ihr eigenes Gefolge erwartet, dass sie ihren Ritus beibehält.\n\nWas auch immer entschieden wird, wird am Hofe ihres Vaters als Erklärung darüber verlesen, wie wir die Sache betrachten."
 cc_byz_latin.1.a: "Sie nimmt einen orthodoxen Namen und ein orthodoxes Bekenntnis an."
 cc_byz_latin.1.b: "Sie behält ihren Ritus. Eröffne eine lateinische Kapelle in Blachernae."
 cc_byz_latin.1.c: "Der Patriarch verheiratet sie; ihr Beichtvater bleibt privat vor Ort."

 # .11 Western branch: our princess at their court
 cc_byz_latin.11.title: "Eine Prinzessin im Westen"
 cc_byz_latin.11.desc: "[cc_lat_princess.GetName] has reached the court of [cc_lat_partner.GetName] with her household, her icons and an Orthodox chaplain. Her new family expects her to be received into the Roman Church before the coronation. The Patriarch has written to remind her that she is a daughter of the purple.

What she decides will be read in both capitals as our decision."
 cc_byz_latin.11.a: "Sie wird in die römische Kirche aufgenommen."
 cc_byz_latin.11.b: "Sie behält ihren Glauben und ihren Kaplan."
 cc_byz_latin.11.c: "Ihr Ritus in der Öffentlichkeit, ihrer im Privaten, und eine größere Mitgift."

 # .12 Western branch: what she carries west
 cc_byz_latin.12.title: "Was die Prinzessin in den Westen brachte"
 cc_byz_latin.12.desc: "[cc_lat_princess.GetName] has settled at the court of [cc_lat_partner.GetName] and asks what more she may bring from home. Sophia Palaiologina took the double-headed eagle and the ceremonial of the Sacred Palace to Moscow, and her husband's court was never the same. Greek scholars followed every Byzantine embassy into Italy and many did not come back.

She could take teachers and books, the forms of the palace, or simply write home often."
 cc_byz_latin.12.a: "Sende Gelehrte und Manuskripte mit ihrem Gefolge."
 cc_byz_latin.12.b: "Lasst sie das Zeremoniell des Heiligen Palastes beibehalten."
 cc_byz_latin.12.c: "Lies ihre Briefe als Depeschen."

 # .2 Latin knights
 cc_byz_latin.2.title: "Lateinische Ritter am Hof"
 cc_byz_latin.2.desc: "[cc_lat_partner.GetName] hat eine Ritterkompanie geschickt, um dem Kaiser als Zeichen des Bündnisses zu dienen. Sie sind schwer bewaffnet, sehr teuer und verachten alles Griechische. Manuel Komnenos bevorzugte solche Männer, und seine Archonten vergaben ihm dies nie. Andronikos II. engagierte die Katalanen und verbrachte das nächste Jahrzehnt damit, gegen sie zu kämpfen.\n\nDer Kapitän der Kompanie bittet um einen Vertrag. Seine Männer würden ein Turnier zu ihren Ehren als geringere Alternative akzeptieren."
 cc_byz_latin.2.a: "Sie in den Dienst nehmen."
 cc_byz_latin.2.b: "Haltet stattdessen ein Turnier im Hippodrom ab."
 cc_byz_latin.2.c: "Ihnen danken und sie nach Hause schicken."

 # .21 The company's pay
 cc_byz_latin.21.title: "Der Sold der Kompanie"
 cc_byz_latin.21.desc: "Der Vertrag der lateinischen Kompanie ist abgelaufen und ihr Kapitän hat die Abrechnung vorgelegt. Sie ist höher, als es irgendjemand für zugestimmt hält. Wenn sie nicht bezahlt wird, werden seine Männer sie selbst eintreiben, so wie es die Katalanen in Thrakien taten."
 cc_byz_latin.21.a: "Vollständig bezahlen und den Vertrag erneuern."
 cc_byz_latin.21.b: "Bezahle sie aus und begleite sie zu den Schiffen."
 cc_byz_latin.21.c: "Das Konto ist betrügerisch. Zahlen Sie nichts."

 # .3 Merchant privileges
 cc_byz_latin.3.title: "Die Privilegien der Kaufleute"
 cc_byz_latin.3.desc: "Kaufleute aus [cc_lat_partner.GetName] sind der Ehe nach Konstantinopel gefolgt. Ihr Gesandter bittet um ein Viertel am Goldenen Horn und die Befreiung von den Zöllen – jene Bedingungen, die Alexios I. Venedig im Jahr 1082 gewährte.\n\nDie venezianischen Privilegien kauften eine Flotte, als das Reich eine benötigte. Sie kosteten die Schatzkammer jedoch zwei Jahrhunderte lang ihre Zölle und gaben den Handel der Stadt in ausländische Hände."
 cc_byz_latin.3.a: "Gewährt das Viertel und die Befreiung."
 cc_byz_latin.3.b: "Gewährt das Viertel. Die Zölle bleiben bestehen."
 cc_byz_latin.3.c: "Die Bräuche von Konstantinopel sind kein Hochzeitsgeschenk."

 # .4 The Pope's letter
 cc_byz_latin.4.title: "Ein Brief aus Rom"
 cc_byz_latin.4.desc: "Der Papst hat geschrieben, um uns zur Hochzeit zu gratulieren und anzumerken, dass eine Vereinigung von Häusern ein guter Anfang für eine Vereinigung der Kirchen sei. [cc_lat_partner.GetName] hat wissen lassen, dass es diese Hoffnung teilt.\n\nDer Brief bittet uns, päpstliche Legaten zu empfangen."
 cc_byz_latin.4.desc_progress: "Der Papst hat geschrieben, dass unsere Heirat in [cc_lat_partner.GetName] ihm Hoffnung auf die derzeit diskutierte Union gibt. Unsere Schwiegerfamilien bieten an, sich am päpstlichen Hof dafür einzusetzen, was in Rom helfen und in Konstantinopel bemerkt würde."
 cc_byz_latin.4.desc_received: "Der Papst hat geschrieben, um uns zu danken. Ein römischer Kaiser, der in ein katholisches Königshaus eingeheiratet hat und in Gemeinschaft mit Rom steht, ist das, was das Papsttum seit zweihundert Jahren anstrebt. [cc_lat_partner.GetName] hat eigene Glückwünsche hinzugefügt."
 cc_byz_latin.4.desc_repudiated: "Der Papst hat geschrieben, dass unsere Ablehnung der Union die Ehe entehrt. [cc_lat_partner.GetName] ist vor Rom beschämt und wünscht sich eine Geste von uns."
 cc_byz_latin.4.desc_hellenic: "Der Papst hat an [cc_lat_partner.GetName] geschrieben, nicht an uns, und fragt, wie ein katholisches Haus mit einem Hof verheiratet bleiben kann, der zu den alten Göttern zurückgekehrt ist. Unsere Schwiegerfamilien haben den Brief weitergeleitet und erwarten eine Antwort."
 cc_byz_latin.4.a: "Empfange die Legaten."
 cc_byz_latin.4.b: "Eine Ehe ist kein Rat."
 cc_byz_latin.4.c: "Lasst unsere Schwiegereltern für die Vereinigung sprechen."
 cc_byz_latin.4.d: "Bittet sie, sich aus Kirchenangelegenheiten herauszuhalten."
 cc_byz_latin.4.e: "Seiner Heiligkeit danken."
 cc_byz_latin.4.f: "Sende Geschenke, um es zu mildern."
 cc_byz_latin.4.g: "Die Verstoßung bleibt bestehen."
 cc_byz_latin.4.h: "Sende Gold und sage nichts über die Götter."
 cc_byz_latin.4.i: "Unsere Götter sind unsere eigene Angelegenheit."

 # .5 The crusade proposal
 cc_byz_latin.5.title: "Der Kreuzzugsvorschlag"
 cc_byz_latin.5.desc: "[cc_lat_partner.GetName] schlägt eine gemeinsame Expedition gegen [cc_lat_target.GetName] vor: seine Ritter über das Meer, unsere Armeen über den Landweg, um die Provinzen zurückzugewinnen, die die Türken und Araber einnahmen. Jede westliche Heirat in die Dynastie brachte einen solchen Vorschlag mit sich.\n\nDer letzte Kreuzzug, der nach Osten kam, im Jahr 1204, nahm stattdessen Konstantinopel ein."
 cc_byz_latin.5.a: "Das Kreuz mit ihnen nehmen."
 cc_byz_latin.5.b: "Verlangt stattdessen Gold für die Mauern."
 cc_byz_latin.5.c: "Wir erinnern uns an 1204. Ablehnen."

 # .6 The settlement
 cc_byz_latin.6.title: "Die Hochzeit, zehn Jahre später"
 cc_byz_latin.6.desc_kin: "Ein Jahrzehnt nach der Hochzeit verhalten sich [cc_lat_partner.GetName] und Konstantinopel wie eine einzige Familie. Gesandte reisen ohne Zeremonien, Prinzen beider Häuser sind Paten für die Kinder des jeweils anderen, und westliche Höfe betrachten eine Beleidigung des einen als Beleidigung beider."
 cc_byz_latin.6.desc_friends: "Ein Jahrzehnt nach der Hochzeit sind die Beziehungen zu [cc_lat_partner.GetName] gut. Keiner der Höfe hat dem anderen alles gewährt, was er verlangte, und keiner hegt einen ernsthaften Groll."
 cc_byz_latin.6.desc_cool: "Ein Jahrzehnt nach der Hochzeit sind die Beziehungen zu [cc_lat_partner.GetName] korrekt, aber nicht herzlich. Zu viele Anfragen wurden auf beiden Seiten abgelehnt. Die Kaiserin wird im Palast respektiert, hat aber außerhalb dessen wenig Einfluss."
 cc_byz_latin.6.desc_kin_west: "Ein Jahrzehnt nach der Hochzeit verhalten sich [cc_lat_partner.GetName] und Konstantinopel wie eine einzige Familie. [cc_lat_princess.GetName] ist nach dem König die einflussreichste Person am Hof ihres Mannes, und ihre Kinder werden einen Anspruch auf zwei Kronen erben."
 cc_byz_latin.6.desc_friends_west: "Ein Jahrzehnt nach der Hochzeit sind die Beziehungen zu [cc_lat_partner.GetName] gut. [cc_lat_princess.GetName] wird an ihrem Hof respektiert, und ihre Briefe treffen noch immer jede Saison ein."
 cc_byz_latin.6.desc_cool_west: "Ein Jahrzehnt nach der Hochzeit sind die Beziehungen zu [cc_lat_partner.GetName] korrekt, aber nicht herzlich. [cc_lat_princess.GetName] wird an ihrem Hof gut behandelt, hat dort jedoch wenig zu sagen."
 cc_byz_latin.6.a: "Zwei Häuser, eine Familie."
 cc_byz_latin.6.b: "Eine Freundschaft, die es wert ist, bewahrt zu werden."
 cc_byz_latin.6.c: "Immerhin hält die Ehe."
 cc_byz_latin.6.d: "Schicke das lateinische Gefolge nach Hause."

 # .90 The partnership ends
 cc_byz_latin.90.title: "Das Ende des lateinischen Bündnisses"
 cc_byz_latin.90.desc: "[cc_lat_partner.GetName] ist nicht mehr der Partner, der es bei Abschluss der Ehe war: Es hat seinen Status unter den Großmächten verloren, die römische Kirche verlassen oder das eheliche Band zwischen unseren Häusern ist erloschen. Die darauf beruhenden Vereinbarungen werden aufgelöst."
 cc_byz_latin.90.desc_dowager: "[cc_lat_partner.GetName] ist nicht mehr der Partner, der es bei Abschluss der Ehe war. Die Kaiserin hat sich entschieden, in Konstantinopel zu bleiben, und die Freundschaften, die sie am Hofe schloss, bleiben bei ihr."
 cc_byz_latin.90.desc_dowager_west: "[cc_lat_partner.GetName] ist nicht mehr der Partner, der es bei Abschluss der Ehe war. Die Prinzessin, die wir dorthin schickten, wird an jenem Hof immer noch geehrt, und die Freundschaften, die sie dort schloss, bleiben bestehen."
 cc_byz_latin.90.desc_war: "Wir befinden uns im Krieg mit [cc_lat_partner.GetName]. Das Gefolge der Kaiserin wird im Palast bewacht, und die bei der Hochzeit getroffenen Vereinbarungen sind hinfällig."
 cc_byz_latin.90.a: "Sie bleibt und behält ihre Freunde."
 cc_byz_latin.90.b: "So sei es."
 cc_byz_latin.90.c: "Schicke das lateinische Gefolge nach Hause."
 cc_byz_latin.90.desc_bride_died: "Kaiserin [cc_lat_their_spouse.GetName] ist verstorben. Ihr Haushalt kehrt nach [cc_lat_partner.GetName] zurück, und die mit ihrer Heirat getroffenen Vereinbarungen enden mit ihr."
 cc_byz_latin.90.desc_bride_died_west: "[cc_lat_princess.GetName] ist am Hofe von [cc_lat_partner.GetName] verstorben. Ihr Haushalt kehrt heim, und die mit ihrer Heirat getroffenen Vereinbarungen enden mit ihr."
 cc_byz_latin.90.desc_widowed: "Mit dem Tod von [cc_lat_our_spouse.GetName] ist die Ehe, die unser Haus mit [cc_lat_partner.GetName] verband, beendet. Kaiserin [cc_lat_their_spouse.GetName] ist eine Witwe in Konstantinopel, und die neue Regierungszeit steht ihrer Familie nichts mehr zu."
 cc_byz_latin.90.desc_widowed_west: "Mit dem Tod von [cc_lat_their_spouse.GetName] ist [cc_lat_princess.GetName] eine Witwe am Hofe von [cc_lat_partner.GetName]. Die Ehe, die die beiden Häuser verband, ist beendet, und die Nachfolger ihres Mannes stehen uns nichts mehr zu."
 cc_byz_latin.90.desc_succession: "Die Ehe besteht fort, aber [cc_lat_our_spouse.GetName] und [cc_lat_their_spouse.GetName] stehen nicht mehr beide in der Thronfolge. Ihre Kinder werden nicht zwei Kronen erben, und die auf dieser Aussicht basierenden Vereinbarungen werden aufgelöst."
