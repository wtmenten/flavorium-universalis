l_german:
 # The Levantine Confrontation: situation panel, map legend, actions and payload modifiers.
 #
 # A SEPARATE FILE FROM cc_byz_mamluk_l_english.yml, deliberately. That file is the event
 # thread's text and is stable; everything here arrived with the panel and the action set, which
 # are the parts most likely to be revised again after the next playtest.
 #
 #
 # VOICE. The card bodies are the court speaking, not the manual. Every number, threshold and
 # mechanical consequence lives in a _INFO key behind the card's info icon instead. The first
 # version of this file put the arithmetic in the body and read like a briefing paper, which is
 # the recurring failure the whole submod was audited for: describing the system to the player
 # rather than describing the world to the emperor.
 #
 # The _TT keys on individual bars and flags stay factual, because those ARE the tooltip layer.

 # ---- Panel header ----
 CC_BYZ_MAM_HDR_EMPIRE: "Reich"
 CC_BYZ_MAM_HDR_CAIRO: "Kairo"
 CC_BYZ_MAM_PHASE_COLD: "Die kalte Grenze"
 CC_BYZ_MAM_PHASE_COLD_TT: "Niemand hat etwas erklärt. Gesandte kommen und gehen, Pilger werden gezählt und besteuert, die Grenz-Emire nehmen Geld von beiden Seiten an und sehen darin keinen Widerspruch, und über die heiligen Stätten wird in Briefen gestritten, die eine ganze Jahreszeit brauchen, um anzukommen.\n\nAuf diese Weise wurden kriegerische Auseinandersetzungen über Jahrhunderte hinweg vermieden."
 CC_BYZ_MAM_PHASE_WAR: "Der Pentarchie-Krieg"
 CC_BYZ_MAM_PHASE_WAR_TT: "Die Briefe sind ausgeblieben. Was nun entschieden wird, wird von demjenigen entschieden, der in den heiligen Stätten steht, wenn es vorbei ist."

 # ---- Card: the two positions ----
 CC_BYZ_MAM_CARD_STANDING: "Ansehen in der Levante"
 CC_BYZ_MAM_CARD_STANDING_DESC: "Zwei Höfe, eine Grenze und nirgendwo entlang dieser Grenze eine Einigkeit darüber, wem was gehört.\n\nKeine Seite verliert das, was die andere gewinnt. Die Grenze ist achthundert Meilen lang, und was in Aleppo passiert, hat noch nie jemandem etwas darüber verraten, was in Siwa passiert."
 CC_BYZ_MAM_CARD_STANDING_INFO: "Zwei unabhängige Zähler, jeweils von 0 bis 100.\n\n#T Die Position des Reiches#! steigt durch gewonnene Vormundschaften, gehaltene Grenz-Emire, geschützte östliche Patriarchen und Bedingungen, die akzeptiert werden, während Kairo abgelenkt ist.\n\n#T Kairos Position#! steigt, wenn die Grenze aufgegeben wird, die östlichen Hierarchien ihren eigenen Vereinbarungen überlassen bleiben oder dem Sultan Zeit gegeben wird, seine Emire zu etablieren.\n\nWer zuerst 100 erreicht, beendet die Konfrontation zu Gunsten dieses Hofes. Sie endet auch, wenn eines der Länder aufhört zu existieren oder im Jahr 1650."
 CC_BYZ_MAM_BAR_EMPIRE: "Die Position des Reiches"
 CC_BYZ_MAM_BAR_EMPIRE_TT: "Steigt durch gewonnene Vormundschaft, behaltene Emire, geschützte Patriarchen und Bedingungen, die während Kairos Ablenkung diktiert wurden. Bei 100 endet die Konfrontation zu Gunsten des Reiches."
 CC_BYZ_MAM_BAR_CAIRO: "Kairos Position"
 CC_BYZ_MAM_BAR_CAIRO_TT: "Steigt, wenn die Grenze aufgegeben wird, die östlichen Hierarchien ihren eigenen Regelungen überlassen werden oder dem Sultan Zeit gegeben wird, seine Emire zu beruhigen. Bei 100 endet die Konfrontation zu Gunsten von Kairo."
 CC_BYZ_MAM_BAR_FOOTER: "Wer zuerst 100 erreicht, beendet die Konfrontation. Sie endet ebenfalls, wenn einer der Höfe aufhört zu existieren, oder im Jahr 1650."

 # ---- Card: pressure and standing arrangements ----
 CC_BYZ_MAM_CARD_PRESSURE: "Levantinischer Druck"
 CC_BYZ_MAM_CARD_PRESSURE_DESC: "Wie stark das Reich drückt, kann Kairo bereits von Damaskus aus spüren.\n\nEin Kaiser, der dreißig Jahre damit verbracht hat, die Grenze zu befestigen, hat ein Argument vorgebracht, und er wird feststellen, dass der Sultan aufgehört hat, auf Briefe über die Vormundschaft zu antworten. Es gibt eine Art von Geduld, die mehr bewirkt als jede Garnison, und von innen betrachtet sieht sie genau wie Schwäche aus."
 CC_BYZ_MAM_CARD_PRESSURE_INFO: "Reicht von -5 bis 5.\n\nHoher Druck öffnet die militärischen Zweige des Fadens und schließt die diplomatischen. #T Die Verhandlung über die Vormundschaft der heiligen Stätten erfordert einen Druck von 0 oder darunter.#!\n\nErhöht durch die Befestigung der Grenze, das Geltendmachen des patriarchalen Anspruchs und die Behauptung der Vormundschaft durch Recht. Verringert durch Gesandtschaften, die Zahlung der üblichen Abgaben und die Annahme von Bedingungen.\n\nDie untenstehenden Flaggen verzeichnen bereits getroffene Vereinbarungen. Sie werden von späteren Ereignissen im Faden und vom Missionsbaum gelesen."
 CC_BYZ_MAM_FLAG_CONDOMINIUM: "Die Obhut wird durch schriftliche Vereinbarung geteilt"
 CC_BYZ_MAM_FLAG_CONDOMINIUM_TT: "Beide Höfe haben unterzeichnet. Die heiligen Stätten werden gemeinsam verwaltet, Pilger reisen zu einem festgelegten Tarif, und keine Seite hat den zugrunde liegenden Anspruch aufgegeben.\n\nMehrere Kaiser hielten dies für das bestmögliche Ergebnis. Es ist ein echtes Ende und kein Trostpreis."
 CC_BYZ_MAM_FLAG_PATRIARCHS_BACKED: "Die östlichen Hierarchen stehen unter kaiserlichem Schutz"
 CC_BYZ_MAM_FLAG_PATRIARCHS_BACKED_TT: "Sie sind Konstantinopel rechenschaftspflichtig, und in Kairo weiß man das. Das ist in dem Streit um die Vormundschaft viel wert und macht jede Vergeltungsmaßnahme gegen sie zu einer Angelegenheit des Reiches."
 CC_BYZ_MAM_FLAG_PATRIARCHS_SOLD: "Die östlichen Hierarchen wurden sich selbst überlassen"
 CC_BYZ_MAM_FLAG_PATRIARCHS_SOLD_TT: "Sie haben ihre eigenen Vereinbarungen mit dem Sultan getroffen, wozu sie allen Grund hatten. Der Anspruch des Reiches, für den Osten zu sprechen, ist schwerer zu formulieren, jetzt, da der Osten aufgehört hat, auf es zu warten."
 CC_BYZ_MAM_FLAG_WAR_DECLARED: "Der Pentarchie-Krieg hat begonnen"
 CC_BYZ_MAM_FLAG_WAR_DECLARED_TT: "Der Anspruch wird mit Gewalt durchgesetzt. Die diplomatischen Wege sind geschlossen, solange dies andauert."

 # ---- Card: the eastern seats ----
 # DUAL READING. These three cities carry the eastern patriarchates AND three of vanilla's
 # Hellenic holy sites, and at the same locations: the Serapeum is at Alexandria, the sanctuary
 # at Daphne is at Antioch. An emperor who has taken up the old rites wants the same three
 # cities for a different reason, so the copy names what is in them rather than naming a church.
 CC_BYZ_MAM_CARD_SEATS: "Die östlichen Sitze"
 CC_BYZ_MAM_CARD_SEATS_DESC: "Jerusalem, Antiochia, Alexandria.\n\nWas auch immer das Reich in diesem Jahrhundert glaubt, dies sind die drei Städte, von denen es nie aufgehört hat zu glauben, dass sie die seinen sind. Es gibt einen Streit über sie, seit es überhaupt Streit über irgendetwas gab, und die Männer, die sie jetzt halten, haben ihn von Männern geerbt, die ihn ihrerseits geerbt hatten."
 CC_BYZ_MAM_CARD_SEATS_INFO: "Zusammen mit Konstantinopel und Rom bilden diese fünf die Pentarchie; der Besitz aller fünf ist das, was die Heilung des Schismas in der Vanilla-Version erfordert. Rom wird durch das Exarchat erlangt; diese drei werden durch diese Konfrontation erlangt.\n\nDer Status des Besitzes wird aus dem Eigentum abgelesen und ist somit unabhängig von der Religion des Reiches gültig. Unter den alten Riten tragen dieselben drei Städte das Serapeum in Alexandria und das Heiligtum in Daphne vor den Toren von Antiochia."
 CC_BYZ_MAM_SEAT_JERUSALEM: "Jerusalem"
 CC_BYZ_MAM_SEAT_ANTIOCH: "Antiochia"
 CC_BYZ_MAM_SEAT_ALEXANDRIA: "Alexandria"
 CC_BYZ_MAM_SEAT_HELD: "Gehalten"
 CC_BYZ_MAM_SEAT_NOT_HELD: "Weder noch"

 # ---- Map colouring ----
 CC_BYZ_MAM_LEGEND_EMPIRE: "Imperial"
 CC_BYZ_MAM_LEGEND_CAIRO: "Mamluk"
 cc_byz_mam_map_tt_empire: "Imperiales Gebiet, und die Grenze liegt irgendwo südlich hiervon."
 cc_byz_mam_map_tt_cairo: "Die des Sultans, und ebenso garnisoniert."
 cc_byz_mam_map_tt_other: "Keiner der Höfe besitzt dies. Keiner der Höfe hat jemals zugelassen, dass ihn das vom Streiten darüber abhält."

 # ---- Actions ----
 cc_byz_mam_send_embassy: "Eine Gesandtschaft nach Kairo senden"
 cc_byz_mam_send_embassy_desc: "Geschenke, ein Brief über die Pilgerzölle und ein Monat in Kairo, um zu erfahren, worüber der Sultan in diesem Jahrzehnt besorgt ist. Es ist selten das, was die letzte Gesandtschaft berichtete.\n\nDadurch wird nichts entschieden. Dinge werden später entschieden, von Menschen, die vor Ort waren."
 cc_byz_mam_subsidise_faction: "Eine Fraktion in Kairo subventionieren"
 cc_byz_mam_subsidise_faction_desc: "Die Emire streiten routinemäßig über die Nachfolge, und Geld, das diskret auf der verlorenen Seite ankommt, verhindert, dass ein routinemäßiger Streit gelöst wird.\n\nEin Sultan, der seine eigenen Emire verwaltet, verwaltet nicht die Grenze. Niemand wird jemals wissen, woher das Geld kam, was genau der Punkt ist und auch der Grund, warum es dem Reich nichts einbringt, das sichtbar wäre."
 cc_byz_mam_negotiate_custody: "Verhandlung über die Obhut der Heiligen Stätten"
 cc_byz_mam_negotiate_custody_desc: "Gemeinsame Verwaltung, ein festgelegter Tarif für Pilger und beide Höfe unterzeichnen ein Dokument, in dem keiner von beiden etwas zugesteht.\n\nDas wurde schon einmal so gemacht und hielt zwei Generationen lang, was in diesem Teil der Welt ein langer Friede ist."
 cc_byz_mam_press_claim: "Den patriarchalen Anspruch geltend machen"
 cc_byz_mam_press_claim_desc: "Der Kaiser erklärt öffentlich und ausführlich, dass die östlichen Bistümer unter seinem Schutz stehen und es schon immer taten.\n\nJedes Wort davon ist wahr, und jedes Wort davon wird in Kairo als der Beginn von etwas gehört. Die Emire des Sultans haben ihn gefragt, warum sie für ein Heer bezahlen; der Kaiser hat nun für ihn geantwortet."

 # ---- Payload modifiers ----
 STATIC_MODIFIER_NAME_cc_byz_emirs_retained: "Die Grenz-Emire wurden behalten"
 STATIC_MODIFIER_DESC_cc_byz_emirs_retained: "Sie halten die Linie genau so lange, wie das Geld reicht. Das ist es, was man bekommt, wenn man eine Grenze kauft, und deshalb wird sie immer wieder gekauft."
 STATIC_MODIFIER_NAME_cc_byz_syrian_garrisons: "Die Grenzstädte garnisoniert"
 STATIC_MODIFIER_DESC_cc_byz_syrian_garrisons: "Bezahlt, befestigt und versorgt. Im nächsten Jahr muss niemand bestochen werden, was das Hauptargument für diese Ausgaben ist."
 STATIC_MODIFIER_NAME_cc_byz_frontier_left_alone: "Die Grenze sich selbst überlassen"
 STATIC_MODIFIER_DESC_cc_byz_frontier_left_alone: "Die Männer, die dort leben, verteidigen es besser, als das Reich es je tat. Sie sind dabei auch ihrem eigenen Volk gegenüber verantwortlich, und der Fisk hat gänzlich nichts mehr von ihnen gehört."
 STATIC_MODIFIER_NAME_cc_byz_cairo_pressed: "Der Vorteil wurde genutzt"
 STATIC_MODIFIER_DESC_cc_byz_cairo_pressed: "Das Reich bewegte sich, während Kairo mit sich selbst stritt, und es wurde gesehen, dass es sich zuerst bewegte. Gesehen zu werden, machte die Hälfte aus."
 STATIC_MODIFIER_NAME_cc_byz_cairo_divided: "Kairo geteilt"
 STATIC_MODIFIER_DESC_cc_byz_cairo_divided: "Der Streit geht weiter, finanziell unterstützt. Niemand in Kairo weiß, wer ihn finanziert, was genau der Punkt ist und auch der Grund, warum er keinen Ruhm einbringt."
 STATIC_MODIFIER_NAME_cc_byz_levantine_terms: "Bedingungen mit Kairo"
 STATIC_MODIFIER_DESC_cc_byz_levantine_terms: "Eine Vereinbarung, die beiden Höfen in einem bestimmten Jahr passte. Die Karawanen rollen. Beide Seiten wissen genau, was es wert ist, und keine von ihnen spricht es aus."

 # ---- Action cooldowns ----
 STATIC_MODIFIER_NAME_cc_byz_mam_embassy_sent: "Gesandtschaft in Kairo"
 STATIC_MODIFIER_DESC_cc_byz_mam_embassy_sent: "Eine Gesandtschaft befindet sich in Kairo oder war vor kurzem dort. Eine zweite würde nun als Besorgnis gedeutet werden."
 STATIC_MODIFIER_NAME_cc_byz_mam_faction_bought: "Eine gekaufte Fraktion"
 STATIC_MODIFIER_DESC_cc_byz_mam_faction_bought: "Geld fließt bereits. Eine zweite Zahlung über dieselben Kanäle würde zurückverfolgt werden, und die Rückverfolgung ist das Desaster, nicht die Zahlung selbst."
 STATIC_MODIFIER_NAME_cc_byz_mam_claim_pressed: "Der Anspruch geltend gemacht"
 STATIC_MODIFIER_DESC_cc_byz_mam_claim_pressed: "Es wurde kürzlich und ausführlich gesagt. Es bald wieder zu sagen, würde nur beweisen, dass das Sagen nichts ändert."

 # ---- Opinion ----
 cc_byz_opinion_levantine_terms: "Bedingungen über die heiligen Stätten"
 CC_BYZ_MAM_SEAT_CAIRO: "Des Sultans"
