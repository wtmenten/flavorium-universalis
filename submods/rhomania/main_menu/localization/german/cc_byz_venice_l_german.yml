l_german:
 # Mission task
 cc_byz_ven_task_free_tt: "Venedig existiert, ist niemandes Vasall, führt keinen Krieg gegen uns und wir halten Konstantinopel"
 cc_byz_ven_opens_chain_tt: "Öffnet #Y Die Serenissima-Frage#!, eine Reihe von Ereignissen über etwa fünfzig Jahre, die damit enden können, dass Venedig unser ewiger Verbündeter, ein klienteläres Herzogtum, aus dem Heiligen Römischen Reich ausgeschlossen oder ein Feind wird"

 # Score tooltips
 cc_byz_ven_concord_plus1_tt: "#Y Eintracht mit Venedig#! #G +1#!"
 cc_byz_ven_concord_plus2_tt: "#Y Eintracht mit Venedig#! #G +2#!"
 cc_byz_ven_concord_minus1_tt: "#Y Eintracht mit Venedig#! #R -1#!"
 cc_byz_ven_concord_minus2_tt: "#Y Eintracht mit Venedig#! #R -2#!"
 cc_byz_ven_leverage_plus1_tt: "#Y Einfluss auf Venedig#! #G +1#!"
 cc_byz_ven_leverage_plus2_tt: "#Y Einfluss auf Venedig#! #G +2#!"
 cc_byz_ven_leverage_minus1_tt: "#Y Einfluss auf Venedig#! #R -1#!"
 cc_byz_ven_creditor_grip_plus1_tt: "#Y Griff des Gläubigers#! #R +1#!"
 cc_byz_ven_exarch_restrained_tt: "Unser Exarch in Italien will weniger von Venedigs Land und ärgert sich darüber, dass man es ihm sagt: #Y exarch appetite#! #G -1#!, #Y exarch loyalty#! #R -1#!"
 cc_byz_ven_exarch_unleashed_tt: "Unser Exarch in Italien will mehr: #Y exarch appetite#! #R +1#!"
 cc_byz_ven_dux_offered_tt: "Wenn die Frage in einem Bündnis oder dem Herzogtum endet, wird Venedig aus dem Heiligen Römischen Reich ausgeschlossen"

 # Offers
 cc_byz_ven_port_buy_tt: "Wir bieten an, [cc_ven_port.GetName] zu kaufen. Venedig verlangt 25 Gold pro Entwicklungspunkt, zwischen 150 und 600"
 cc_byz_ven_port_swap_tt: "Wir bieten [cc_ven.GetName] Handelsrechte in unseren Märkten für 30 Jahre im Austausch für [cc_ven_port.GetName]. #Y Druckmittel#! #R -1#! falls akzeptiert"
 cc_byz_ven_venice_decides_tt: "Die Regierung von [cc_ven.GetName] entscheidet"
 cc_byz_ven_port_ai_rule_tt: "[cc_ven.GetName] stimmt zu, wenn #Y Eintracht#! 5 oder höher ist"
 cc_byz_ven_ducate_ai_rule_tt: "[cc_ven.GetName] kann akzeptieren oder ablehnen. Die Chancen verbessern sich bei #Y Eintracht#! 9 oder höher und #Y Druckmittel#! 4 oder höher. Eine Ablehnung gewährt uns dennoch das dauerhafte Bündnis"
 cc_byz_ven_port_accept_tt: "Der Hafen geht an [cc_ven_emperor.GetName] über"
 cc_byz_ven_port_refuse_tt: "Wir behalten den Hafen. Die Beziehungen kühlen ein wenig ab"
 cc_byz_ven_proposal_accept_tt: "Wir akzeptieren den Vorschlag von [cc_ven_emperor.GetName]"
 cc_byz_ven_proposal_refuse_tt: "Wir lehnen ab. Die Beziehungen zu [cc_ven_emperor.GetName] bleiben auf ihrem aktuellen Stand"
 cc_byz_ven_ducate_tt: "Venedig wird zum #Y Herzogtum Venetien#!: ein Vasall, der seine Republik, Flotte, Kriege und Diplomatie behält, einen kleinen Tribut zahlt und unsere Kaufleute zollfrei handeln lässt. Es kann niemals annektiert werden. Venedig bleibt dem Heiligen Römischen Reich fern"
 cc_byz_ven_alliance_tt: "Ein dauerhaftes Bündnis mit Venedig, mit bleibenden Marine- und Handelsboni auf beiden Seiten"
 cc_byz_ven_rupture_tt: "Die Beziehungen zu Venedig brechen ab. Wir erhalten einen 25-jährigen Kriegsgrund auf seine Häfen in Morea und der Ägäis"

 # Subject type
 cc_byz_venetian_ducate: "Herzogtum Venedig"
 cc_byz_venetian_ducate_desc: "Venedig erkennt den Kaiser erneut an, wie es seine ersten Dogen taten. Die Republik regiert sich selbst, behält ihre Flotte und ihre Kolonien und führt ihre eigenen Kriege. Sie sendet einen Tribut und lässt kaiserliche Kaufleute zollfrei handeln."

 # Casus belli
 cc_byz_cb_stato_da_mar: "Das Stato da Mar"
 cc_byz_cb_stato_da_mar_desc: "Venedig hat den Treueid gegenüber dem Reich gebrochen. Seine Häfen in der Morea und in der Ägäis waren römisch, bevor sie venezianisch wurden."
 cc_byz_cb_stato_da_mar_PROV: "Das Stato da Mar"

 # Opinion modifiers
 cc_byz_ven_courted: "Vom Kaiser geworben"
 cc_byz_ven_slighted: "Vom Kaiser brüskiert"
 cc_byz_ven_wronged: "Vom Kaiser gekränkt"
 cc_byz_ven_sworn_friends: "Geschworene Freunde des Kaisers"
 cc_byz_ven_broken_faith: "Gebrochenes Vertrauen"

 # Country modifiers
 STATIC_MODIFIER_NAME_cc_byz_ven_old_privileges: "Die venezianische Befreiung"
 STATIC_MODIFIER_DESC_cc_byz_ven_old_privileges: "Die Bedingungen von 1082 bleiben bestehen: Venezianische Kaufleute handeln in Rumänien zollfrei."
 STATIC_MODIFIER_NAME_cc_byz_ven_reduced_privileges: "Die zwei Prozent"
 STATIC_MODIFIER_DESC_cc_byz_ven_reduced_privileges: "Venezianische Kaufleute zahlen einen reduzierten Zollsatz von zwei Prozent."
 STATIC_MODIFIER_NAME_cc_byz_ven_full_kommerkion: "Das volle Kommerkion"
 STATIC_MODIFIER_DESC_cc_byz_ven_full_kommerkion: "Venezianische Ladungen zahlen die vollen zehn Prozent. Der Schatz gewinnt und der Handel schrumpft."
 STATIC_MODIFIER_NAME_cc_byz_ven_anti_genoese_league: "Bund gegen Genua"
 STATIC_MODIFIER_DESC_cc_byz_ven_anti_genoese_league: "Unsere Galeeren segeln mit der venezianischen Flotte gegen die Genuesen."
 STATIC_MODIFIER_NAME_cc_byz_ven_sea_league: "Der Seebund"
 STATIC_MODIFIER_DESC_cc_byz_ven_sea_league: "Eine gemeinsame Flotte mit Venedig patrouilliert in der Ägäis gegen die Türken."
 STATIC_MODIFIER_NAME_cc_byz_ven_perpetual_alliance: "Ewiges Bündnis mit Venedig"
 STATIC_MODIFIER_DESC_cc_byz_ven_perpetual_alliance: "Das Reich und die Serenissima sind einander auf unbestimmte Zeit verschrieben."
 STATIC_MODIFIER_NAME_cc_byz_ven_romania_rights: "Rechte in Romania"
 STATIC_MODIFIER_DESC_cc_byz_ven_romania_rights: "Unsere Kaufleute besitzen Rechte auf den Märkten des Römischen Reiches."
 STATIC_MODIFIER_NAME_cc_byz_ven_good_relations: "Freundschaft mit Venedig"
 STATIC_MODIFIER_DESC_cc_byz_ven_good_relations: "Die Beziehungen zu Venedig sind gut und gefestigt, ohne dass ein Vertrag sie bindet."

 # .1 The chrysobull renewed
 cc_byz_venice.1.title: "Die erneuerte Chrysobulle"
 cc_byz_venice.1.desc: "Der venezianische Bailo ist mit der Chrysobulle von 1082 zum Palast gekommen und bittet um deren Bestätigung. Alexios I. gab Venedig ein Viertel am Goldenen Horn und die Befreiung von den Zöllen im Austausch für eine Flotte gegen die Normannen. Die Normannen sind längst verschwunden. Die Befreiung kostet die Schatzkammer immer noch.\n\nDie Genuesen in Galata beobachten genau, was Venedig erhält."
 cc_byz_venice.1.a: "Bestätigen Sie die Bedingungen von 1082 in vollem Umfang."
 cc_byz_venice.1.b: "Kürzen Sie die Befreiung auf zwei Prozent."
 cc_byz_venice.1.c: "Widerruft es. Venedig zahlt das volle Kommerkion."
 cc_byz_venice.1.d: "Unser Handelsminister diktiert die Bedingungen."

 # .2 The jewels and the loans
 cc_byz_venice.2.title: "Die Juwelen und die Darlehen"
 cc_byz_venice.2.desc: "Venezianische Bankiers haben dem Schatzamt ein Darlehen zu günstigen Konditionen angeboten. Günstige Konditionen aus Venedig neigen dazu, hart zu werden, aber das Geld ist echt und das Reich braucht es."
 cc_byz_venice.2.desc_jewels: "Die Kronjuwelen befinden sich immer noch in einem venezianischen Tresor als Sicherheit für ein Darlehen, das das Reich nicht zurückgezahlt hat. Jeder venezianische Gesandte weiß es, und keiner erwähnt es. Die Bankiers bieten nun ein zweites Darlehen mit derselben Sicherheit an."
 cc_byz_venice.2.a: "Zahlt die Schulden ab und bittet in gutem Glauben um die Juwelen."
 cc_byz_venice.2.b: "Nehmen Sie das Darlehen an."
 cc_byz_venice.2.c: "Wir werden Venedig nichts schuldig sein."

 # .3 The Genoese war
 cc_byz_venice.3.title: "Der Genueserkrieg"
 cc_byz_venice.3.desc: "Venedig und Genua führen erneut Krieg um den Schwarzmeerhandel, und beide haben Gesandte entsandt. Venedig bittet um unsere Galeeren, wie Johannes VI. sie 1351 gab. Genua erinnert uns daran, dass Galata gegenüber dem Palast am Horn liegt und dass es Genua war, das half, einen Palaiologos zurück auf den Thron zu bringen."
 cc_byz_venice.3.desc_no_genoa: "Genua ist als Macht verschwunden, und sein alter Streit mit Venedig ist damit beendet. Venedig erinnert sich jedoch daran, wer währenddessen wo stand."
 cc_byz_venice.3.a: "Schließe dich Venedig gegen die Genuesen an."
 cc_byz_venice.3.b: "Haltet euch heraus."
 cc_byz_venice.3.c: "Schließt euch Genua an."
 cc_byz_venice.3.d: "Der Streit ist beendet."

 # .4 The sea league
 cc_byz_venice.4.title: "Der Seebund"
 cc_byz_venice.4.desc: "Venedig schlägt eine gemeinsame Flotte vor, um die türkischen Korsaren aus der Ägäis zu vertreiben, so wie es der Bund von 1344 tat, als er Smyrna einnahm. Jede Partei bezahlt ihre eigenen Galeeren. Venedig möchte wissen, ob unsere kommen werden."
 cc_byz_venice.4.a: "Bezahlt für Galeeren in der Flotte des Bundes."
 cc_byz_venice.4.b: "Unser Admiral befehligt das Geschwader des Bundes."
 cc_byz_venice.4.c: "Unsere Schiffe bewachen unsere eigenen Küsten."

 # .5 Dalmatia
 cc_byz_venice.5.title: "Dalmatien"
 cc_byz_venice.5.desc: "Die Ungarn setzen die dalmatinischen Städte unter Druck, die Venedig hält, und Venedig bittet um unsere Unterstützung. Dalmatien war eine römische Provinz, und der venezianische Anspruch darauf begann als ein Auftrag aus Konstantinopel."
 cc_byz_venice.5.a: "Unterstützen Sie Venedigs Anspruch auf die Küste."
 cc_byz_venice.5.b: "Vermittle zwischen Venedig und den Ungarn."
 cc_byz_venice.5.c: "Dalmatien ist nicht unser Streitpunkt."

 # .6 The mainland question
 cc_byz_venice.6.title: "Die Festlandfrage"
 cc_byz_venice.6.desc: "Venedig expandiert auf das Festland, in Städte, die der westliche Kaiser als seine zählt. Venedig würde unsere Unterstützung gegen die Herren des Reiches begrüßen und würde sich an deren Fehlen erinnern."
 cc_byz_venice.6.desc_exarch: "Unser Exarch [cc_ven_exarch.GetName] regiert das Land neben der Lagune und hat begonnen, die venezianische Terraferma als unerledigte Angelegenheit zu betrachten. Venedig hat gefragt, ob er für den Kaiser spricht."
 cc_byz_venice.6.a: "Zügelt den Exarchen."
 cc_byz_venice.6.b: "Lass ihn sie drängen."
 cc_byz_venice.6.c: "Unterstützt Venedig auf dem Festland."
 cc_byz_venice.6.d: "Venedigs Festland ist Venedigs Angelegenheit."

 # .7 The Stato da Mar
 cc_byz_venice.7.title: "Das Stato da Mar"
 cc_byz_venice.7.desc: "Venedig hält [cc_ven_port.GetName], einen der Häfen, die es dem Reich nach 1204 abnahm. Unsere Gouverneure in der Morea und auf den Inseln wollen ihn zurück. Venedig wird ihn nicht mit Gewalt aufgeben, aber es ist eine Handelsrepublik und mag ihn verkaufen oder zum richtigen Preis gegen Rechte in unseren Märkten eintauschen."
 cc_byz_venice.7.desc_none: "Venedig hält keine Häfen mehr in der Morea oder der Ägäis, die es wert wären, darüber zu verhandeln. Seine Gesandten haben dies bemerkt."
 cc_byz_venice.7.a: "Biete an, es zu kaufen."
 cc_byz_venice.7.b: "Biete Handelsrechte im Austausch an."
 cc_byz_venice.7.c: "Überlasse den Stato da Mar Venedig."
 cc_byz_venice.7.d: "Es gibt nichts mehr, worüber man verhandeln könnte."

 # .20 (Venice) The port offer
 cc_byz_venice.20.title: "Ein Angebot für [cc_ven_port.GetName]"
 cc_byz_venice.20.desc_buy: "[cc_ven_emperor.GetName] bietet an, [cc_ven_port.GetName] von der Republik für 25 Gold pro Entwicklungspunkt zu kaufen, zwischen 150 und 600."
 cc_byz_venice.20.desc_swap: "[cc_ven_emperor.GetName] bietet unseren Kaufleuten Handelsrechte in seinen Märkten für dreißig Jahre im Austausch für [cc_ven_port.GetName] an."
 cc_byz_venice.20.a: "Annehmen."
 cc_byz_venice.20.b: "Ablehnen."

 # .22 The port answer
 cc_byz_venice.22.title: "Venedig antwortet"
 cc_byz_venice.22.desc_yes: "Venedig hat zugestimmt. [cc_ven_port.GetName] kehrt in das Reich zurück."
 cc_byz_venice.22.desc_no: "Venedig hat abgelehnt. [cc_ven_port.GetName] bleibt venezianisch."
 cc_byz_venice.22.a: "Die Flagge weht über dem Hafen."
 cc_byz_venice.22.b: "Ein andermal."

 # .8 The Emperor's vicariate
 cc_byz_venice.8.title: "Das Vikariat des Kaisers"
 cc_byz_venice.8.desc: "Der westliche Kaiser hat dem Dogen eine kaiserliche Vikariat über die Städte des Festlands angeboten. Dies würde Venedig zu einem Fürsten des Reiches machen. Die ersten Dogen Venedigs hielten ihren Titel von Konstantinopel, und einige in der Lagune haben dies nicht vergessen."
 cc_byz_venice.8.desc_member: "Venedig sitzt nun im Reichstag, und der westliche Kaiser hat dem Dogen einen größeren Platz dort angeboten. Venedigs erste Dogen hielten ihren Titel von Konstantinopel, und einige in der Lagune haben dies nicht vergessen."
 cc_byz_venice.8.a: "Biete dem Dogen den alten Titel an: dux und protosebastos."
 cc_byz_venice.8.b: "Überbietet den westlichen Kaiser mit Gold."
 cc_byz_venice.8.c: "Lass Venedig seinen Kaiser wählen."

 # .9 St Mark's and the purple
 cc_byz_venice.9.title: "Der Markusdom und Purpur"
 cc_byz_venice.9.desc: "Der Markusdom wurde nach dem Vorbild der Heiligen Apostel in Konstantinopel erbaut, und seine Schatzkammer ist voll von Dingen, die 1204 aus unseren Kirchen geraubt wurden. Die Prokuratoren des Markusdoms haben um ein kaiserliches Geschenk für die Basilika gebeten."
 cc_byz_venice.9.desc_union: "Der Markusdom wurde nach dem Vorbild der Heiligen Apostel in Konstantinopel erbaut. Da die Kirchen wieder vereint sind, haben die Prokuratoren des Markusdoms um ein kaiserliches Geschenk für die Basilika gebeten, und Venedig spricht von der Union als seinem eigenen Verdienst."
 cc_byz_venice.9.desc_repudiated: "Der Markusdom wurde nach dem Vorbild der Heiligen Apostel in Konstantinopel erbaut. Da die Union zurückgewiesen wurde, musste Venedig seine Freundschaft zu uns gegenüber dem Papst erklären. Die Prokuratoren des Markusdoms haben dennoch um ein kaiserliches Geschenk für die Basilika gebeten."
 cc_byz_venice.9.a: "Sendet Manuskripte an die Bibliothek des Markusdoms."
 cc_byz_venice.9.b: "Gold und Emaille für die Pala d'Oro."
 cc_byz_venice.9.c: "Verlangen, dass der Eid des Dogen erneut den Kaiser nennt."

 # .10 The climax
 cc_byz_venice.10.title: "Die Frage der Serenissima"
 cc_byz_venice.10.desc: "Ein halbes Jahrhundert des Umgangs mit Venedig hat zu einer gefestigten Basis geführt. Die Beziehungen sind korrekt, aber nicht eng. Keine Seite hat einen Grund, dies zu ändern."
 cc_byz_venice.10.desc_alliance: "Ein halbes Jahrhundert des Umgangs mit Venedig hat die beiden Staaten de facto zu Partnern gemacht. Der Rat des Dogen ist bereit, dies dauerhaft zu machen."
 cc_byz_venice.10.desc_ducate: "Ein halbes Jahrhundert des Umgangs mit Venedig ist weiter gegangen, als es irgendjemand in der Lagune beabsichtigt hatte. Venedig vertraut dem Reich und braucht es. Einige im Rat des Dogen sagen nun offen, dass die Republik einst eine römische Provinz war und den Kaiser erneut anerkennen könnte, ohne etwas zu verlieren, das sie schätzt."
 cc_byz_venice.10.desc_rupture: "Ein halbes Jahrhundert des Umgangs mit Venedig ist in gegenseitigem Misstrauen geendet. Der Bailo wurde zurückgerufen. Venedig gibt nicht länger vor, unser Freund zu sein."
 cc_byz_venice.10.a: "Schlagt das Herzogtum Venetien vor."
 cc_byz_venice.10.b: "Schlagt ein ewiges Bündnis vor."
 cc_byz_venice.10.c: "Belasse die Freundschaft so, wie sie ist."
 cc_byz_venice.10.d: "Dann werden die Häfen unser sein."
 cc_byz_venice.10.e: "Wende dich an Genua."

 # .25 (Venice) The proposal
 cc_byz_venice.25.title: "Ein Vorschlag aus Konstantinopel"
 cc_byz_venice.25.desc_ducate: "[cc_ven_emperor.GetName] schlägt vor, dass Venedig den Kaiser so anerkennt, wie es seine ersten Dogen taten, als Herzogtum Venetien. Die Republik würde ihre Regierung, Flotte, Kolonien und Kriege behalten, einen geringen Tribut zahlen und kaiserlichen Kaufleuten erlauben, frei von unseren Zöllen zu handeln. Sie könnte niemals annektiert werden und würde dem westlichen Reich fernbleiben."
 cc_byz_venice.25.desc_alliance: "[cc_ven_emperor.GetName] schlägt ein dauerhaftes Bündnis zwischen dem Reich und der Republik vor, ohne Befristung."
 cc_byz_venice.25.a: "Annehmen."
 cc_byz_venice.25.b: "Ablehnen."

 # .26 The proposal answer
 cc_byz_venice.26.title: "Venedig entscheidet"
 cc_byz_venice.26.desc_ducate: "Der Doge hat dem Kaiser die Treue geschworen. Venedig ist wieder das Herzogtum Venetien."
 cc_byz_venice.26.desc_alliance: "Der Doge hat ein ewiges Bündnis mit dem Reich geschworen."
 cc_byz_venice.26.desc_ducate_refused: "Der Rat des Dogen wird den Kaiser nicht anerkennen. Er hat stattdessen ein ewiges Bündnis angeboten."
 cc_byz_venice.26.desc_alliance_refused: "Der Rat des Dogen hat ein ewiges Bündnis abgelehnt. Die Beziehungen bleiben freundlich und unverbindlich."
 cc_byz_venice.26.a: "Das Herzogtum Venetien."
 cc_byz_venice.26.b: "Ein Bündnis ohne Befristung."
 cc_byz_venice.26.c: "Dann sind wir Freunde."

 # .90 The question lapses
 cc_byz_venice.90.title: "Die Frage der Serenissima verfällt"
 cc_byz_venice.90.desc: "Die Venezianische Frage ist hinfällig."
 cc_byz_venice.90.desc_gone: "Venedig existiert nicht mehr als Staat. Es gibt niemanden mehr in der Lagune, mit dem man verhandeln könnte."
 cc_byz_venice.90.desc_city: "Konstantinopel ist verloren. Venedig hat keinen Grund, mit einem Kaiser zu verhandeln, der es nicht besitzt."
 cc_byz_venice.90.desc_subject: "Venedig ist zum Vasallen einer anderen Macht geworden und kann keine eigenen Bedingungen mehr aushandeln."
 cc_byz_venice.90.desc_war: "Zehn Jahre Krieg mit Venedig haben jede Aussicht auf eine Beilegung der Frage beendet."
 cc_byz_venice.90.a: "So sei es."
