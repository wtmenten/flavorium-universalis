l_german:
 # cc_byz_cession.1 - the five-year cession review
 cc_byz_cession.1.title: "Das Register der Präfektur"
 cc_byz_cession.1.desc: "Die Bedingungen, unter denen das Exarchat eingerichtet wurde, stellen jeden imperialen Distrikt in seiner Präfektur unter die Autorität des Exarchen. Distrikte, die das Reich seither dort erworben hat, werden immer noch von Konstantinopel aus verwaltet, und das Register für [SCOPE.sCountry('cc_byz_exarch').GetName] führt sie nun als ausstehend auf.\n\nDie Schreiber prüfen das Register alle fünf Jahre. Sie benötigen eine Entscheidung: Übertragen Sie die Distrikte, wie es die ursprünglichen Bedingungen verlangen, oder behalten Sie sie unter den eigenen Beamten des Palastes bis zur nächsten Prüfung."
 cc_byz_cession.1.a: "Übertragen Sie sie. Das waren die Bedingungen."
 cc_byz_cession.1.b: "Behaltet sie. Sie bleiben beim Palast."
