l_german:
 # Mission tasks
 cc_byz_task_red_sea: "Die Straße des Roten Meeres"
 cc_byz_task_red_sea_desc: "Aden und die jemenitische Küste. Ägypten ohne die Meerenge ist ein Endpunkt; Ägypten mit ihr ist ein Korridor, und alles, was zwischen dem Indischen Ozean und Alexandria transportiert wird, zahlt für dessen Nutzung."
 cc_byz_task_horn: "Die afrikanische Küste"
 cc_byz_task_horn_desc: "Zeila, Berbera und Mogadischu. Zisternen, Lagerhäuser und eine Garnison an jedem Ort. Der lange Weg nach Indien kann ohne sie nicht bewältigt werden, und jede Macht, die es versucht hat, musste dies auf dieselbe Weise lernen."
 cc_byz_task_india: "Die Malabar-Faktoreien"
 cc_byz_task_india_desc: "Eine Handelspräsenz an der indischen Küste, keine Eroberung derselben. Eine Faktorei, ein Privileg dahinter und Abgaben an denjenigen, der den Hafen regiert."
 cc_byz_task_spice_islands: "Die Quelle"
 cc_byz_task_spice_islands_desc: "Sumatra und Java, wo die Gewürze tatsächlich wachsen. Alles westlich davon ist ein Zwischenhändler, und für zwei Jahrhunderte bedeutete das Venedig."

 # Theatre triggers
 cc_byz_eastern_gate_tt: "Wir oder ein Vasall halten Alexandria, Kairo und den Sinai"
 cc_byz_theatre_red_sea_tt: "Wir oder ein Vasall haben eine Präsenz an der jemenitischen Küste"
 cc_byz_theatre_horn_tt: "Wir oder ein Vasall halten einen Stützpunkt am Horn von Afrika"
 cc_byz_theatre_india_tt: "Wir oder ein Vasall haben eine Präsenz an der indischen Küste"
 cc_byz_theatre_spice_islands_tt: "Wir oder ein Vasall haben eine Präsenz auf den Gewürzinseln"

 # Theatre actions
 cc_byz_claim_theatre_red_sea: "Die Rotmeerpassage ausrufen"
 cc_byz_claim_theatre_red_sea_desc: "Erklären Sie die Meerenge unter imperialer Autorität für offen und legen Sie fest, wer sie zu welchen Bedingungen nutzen darf."
 cc_byz_claim_theatre_horn: "Die afrikanischen Stationen ausrufen"
 cc_byz_claim_theatre_horn_desc: "Errichten Sie die Versorgungsstationen, die die Fahrt nach Indien ermöglichen, und entscheiden Sie, ob es Garnisonen oder Gästehäuser sein sollen."
 cc_byz_claim_theatre_india: "Den Indienhandel ausrufen"
 cc_byz_claim_theatre_india_desc: "Errichten Sie Faktoreien an der indischen Küste und eine Privilegierte Kompanie zu deren Betrieb."
 cc_byz_claim_theatre_spice_islands: "Den Gewürzhandel ausrufen"
 cc_byz_claim_theatre_spice_islands_desc: "Erreichen Sie die Inseln, auf denen die Gewürze wachsen, und werden Sie zu der Macht, die sie verkauft, statt zu der Macht, die sie kauft."

 # Country modifiers
 STATIC_MODIFIER_NAME_cc_byz_red_sea_transit: "Der Transit durch das Rote Meer"
 STATIC_MODIFIER_DESC_cc_byz_red_sea_transit: "Die Meerenge wird gehalten und die Gebühren werden eingezogen. Jede Fracht, die sich zwischen dem Indischen Ozean und dem Mittelmeer bewegt, passiert ein kaiserliches Zollhaus."
 STATIC_MODIFIER_NAME_cc_byz_horn_stations: "Die afrikanischen Stationen"
 STATIC_MODIFIER_DESC_cc_byz_horn_stations: "Zisternen, Lagerhäuser und Lotsen an der somalischen Küste. Unspektakulär, aber der Unterschied zwischen einer Route und einem bloßen Ehrgeiz."
 STATIC_MODIFIER_NAME_cc_byz_indian_factories: "Die indischen Fabriken"
 STATIC_MODIFIER_DESC_cc_byz_indian_factories: "Imperiale Kaufleute, ansässig an der Malabarküste, die unter einer Charter handeln, über eigene Lagerhäuser verfügen und einen Konsul haben, um ihre Interessen zu vertreten."
 STATIC_MODIFIER_NAME_cc_byz_spice_monopoly: "Der Gewürzhandel"
 STATIC_MODIFIER_DESC_cc_byz_spice_monopoly: "Das Reich kauft dort, wo die Gewürze wachsen, und verkauft dort, wo sie begehrt werden; und die italienischen Häuser, die zwei Jahrhunderte lang dazwischenstanden, kaufen sie nun von Konstantinopel."
 STATIC_MODIFIER_NAME_cc_byz_eastern_company: "Die Östliche Kompanie"
 STATIC_MODIFIER_DESC_cc_byz_eastern_company: "Eine privilegierte Handelsgesellschaft trägt die Schiffe, die Verluste und das Risiko. Die Krone führt das Siegel und erhält einen Anteil an dem, was zurückkehrt."
 STATIC_MODIFIER_NAME_cc_byz_eastern_learning: "Lehren aus dem Osten"
 STATIC_MODIFIER_DESC_cc_byz_eastern_learning: "Gelehrte zogen mit den Kaufleuten aus und kehrten mit Mathematik, Astronomie und Medizin zurück. Das Günstigste, was das Reich dort erwarb, und das Einzige, was die Fabriken überdauerte."

 # Casus belli
 cc_byz_cb_indian_ocean: "Der Indische Ozean"
 cc_byz_cb_indian_ocean_desc: "Das Reich hält die Straße, und die Mächte des Ozeans dahinter sind nun nahe Nachbarn, ob es eine der Parteien gewünscht hat oder nicht."

 # cc_byz_east.1 - the strait
 cc_byz_east.1.title: "Die Straße"
 cc_byz_east.1.desc: "Alexandria, Kairo und der Sinai werden zusammengehalten, was bedeutet, dass das Reich zum ersten Mal seit Justinian die gesamte Passage zwischen dem Indischen Ozean und dem Mittelmeer kontrolliert.\n\nDie Implikation wurde dem Palast von einem griechischen Kaufmann dargelegt, der die Route nach Aden zweimal befahren hat und einer der wenigen Menschen in Konstantinopel ist, die verstehen, was nun möglich ist. Die Gewürze kommen nicht aus Kairo. Sie kommen durch Kairo, aus Häfen, die das Reich noch nie gesehen hat, transportiert von Schiffen, die dem Reich nicht gehören, und die Beamten des Sultans sind seit zwei Jahrhunderten reich geworden, indem sie nichts anderes taten, als zwischen den beiden Enden dieser Route zu stehen.\n\nDiese Position gehört nun dem Kaiser. Was er damit macht, ist die Frage."
 cc_byz_east.1.desc_indebted: "Das Reich kontrolliert den gesamten Durchgang zwischen dem Indischen Ozean und dem Mittelmeer, und es hat Gläubiger, welche die Auswirkungen dessen vor dem Palast begriffen haben.\n\nDie venezianischen und genuesischen Faktoren haben bereits, getrennt voneinander und mit großer Vorsicht, gefragt, was der Kaiser bezüglich des Transits beabsichtigt. Beide haben angemerkt, dass die bestehenden Vereinbarungen allen gut gedient haben. Keiner erwähnte die ausstehenden Beträge, wodurch der Palast weiß, dass es bei dem Gespräch eigentlich um diese Beträge ging.\n\nDie Gewürzroute ist das wertvollste Gut, das das Reich in dreihundert Jahren erworben hat, und die Männer, die am besten positioniert sind, um sie auszunutzen, sind genau jene, denen das Reich Geld schuldet."
 cc_byz_east.1.a: "Besteuern Sie die Passage. Lassen Sie jeden sie nutzen."
 cc_byz_east.1.b: "Schließen Sie sie für die lateinische Schifffahrt."
 cc_byz_east.1.c: "Gründen Sie eine Privilegierte Kompanie. Lassen Sie die Kaufleute das Risiko tragen."

 # cc_byz_east.10 - the long run
 cc_byz_east.10.title: "Die lange Strecke"
 cc_byz_east.10.desc: "Die Entfernung ist das Problem, und es ist kein Problem, das man allein durch Wollen lösen kann.\n\nEin Schiff, das das Rote Meer in Richtung Malabarküste verlässt, ist wochenlang auf See ohne befreundeten Hafen, gebunden an einen Monsun-Zeitplan, der die Überquerung zweimal im Jahr ermöglicht und jeden bestraft, der ihn falsch einschätzt. Das Wasser geht aus. Die Rümpfe verschmutzen. Die Besatzungen erkranken.\n\nDie Antwort ist seit den Ptolemäern bekannt und sie ist wenig glanzvoll: Stationen an der afrikanischen Küste. Zeila, Berbera, Mogadischu. Zisternen, ein Lagerhaus, jemand, der die Winde kennt. Wer diese hält, macht die Überquerung zur Routine, und wer es nicht tut, macht sie zu einem Abenteuer."
 cc_byz_east.10.a: "Bauen Sie sie ordnungsgemäß. Zisternen, Lagerhäuser, Garnisonen."
 cc_byz_east.10.b: "Einigen Sie sich mit den Hafenmeistern."
 cc_byz_east.10.c: "Schicken Sie die Flotte voraus und nehmen Sie, was wir brauchen."

 # cc_byz_east.20 - the factories
 cc_byz_east.20.title: "Die Malabarküste"
 cc_byz_east.20.desc: "Im Indischen Ozean wird seit tausend Jahren ein geordneter internationaler Handel betrieben, und das Reich ist spät dazu gestoßen.\n\nDie Vereinbarungen sind für alle außer den Neuankömmlingen gut verständlich. Ausländische Kaufleute leben in einem ausgewiesenen Viertel, handeln unter dem Schutz des lokalen Herrschers, zahlen dessen Abgaben und lassen Streitigkeiten vor seinen Gerichten schlichten. Araber, Perser, Chinesen und Juden haben über Jahrhunderte zu diesen Bedingungen Geschäfte gemacht und sind dadurch reich geworden.\n\nDen kaiserlichen Faktoren wurde genau dies angeboten. Einige von ihnen halten es für unter der Würde des Römischen Reiches. Diejenigen, die schon am längsten dort sind, argumentieren am heftigsten dagegen, dies zu akzeptieren."
 cc_byz_east.20.desc_force: "Das Reich ist mit einer Flotte an der Malabarküste eingetroffen, was das Angebot verändert hat.\n\nDie lokalen Herrscher hatten schon früher mit bewaffneten Ausländern zu tun und ihre Einschätzung ist unsentimental: Die Schiffe sind gewaltig, sie sind sehr weit von zu Hause entfernt, und der Monsun bedeutet, dass sie sechs Monate im Jahr nicht verstärkt werden können. Es wurden Bedingungen angeboten, die spürbar schlechter sind als jene, die Araber und Perser genießen, mit der vernünftigen Begründung, dass eine Macht, die bewaffnet eintrifft, eine andere Frage stellt.\n\nDer kaiserliche Kommandant hat um Anweisungen gebeten. In einer separaten Depesche hat er zudem angemerkt, wie wenige seiner Schiffe noch schwimmen würden, sollte die Vereinbarung im Juli scheitern."
 cc_byz_east.20.a: "Handel als Gäste, unter lokalem Recht."
 cc_byz_east.20.b: "Befestigen Sie die Faktoreien."
 cc_byz_east.20.c: "Entsenden Sie Gelehrte mit den Kaufleuten."

 # cc_byz_east.30 - the source
 cc_byz_east.30.title: "Die Quelle"
 cc_byz_east.30.desc: "Die Inseln, auf denen die Gewürze wachsen, sind erreicht worden, und das Auffälligste an ihnen ist, wie klein sie sind.\n\nEine Ware, die seit vor dem Fall Roms die wertvollste Fracht der westlichen Welt war, die die Republik Venedig und die Hälfte der Vermögen in Genua finanzierte, stammt von einer Handvoll Inseln, die den kaiserlichen Navigatoren auf einer Karte gezeigt werden mussten. Die Erzeuger verkaufen sie für einen Bruchteil dessen, was sie in Alexandria bringen, und sind sich der Diskrepanz vollkommen bewusst; sie hatten schlichtweg keine Möglichkeit, das andere Ende der Kette zu erreichen.\n\nDas Reich hält nun beide Enden."
 cc_byz_east.30.desc_treaty: "Die Inseln, auf denen die Gewürze wachsen, sind erreicht worden, und zwar eher durch Vereinbarungen als durch Gewalt, was die kaiserlichen Faktoren als den dauerhafteren Erfolg betrachten.\n\nJedes Abkommen von Jemen bis Java wurde ausgehandelt: Abgaben wurden gezahlt, lokales Recht akzeptiert, Streitigkeiten vor fremden Gerichten geschlichtet. Es dauerte länger, als eine Flotte gebraucht hätte, und es hat etwas hervorgebracht, das eine Flotte nicht schaffen konnte: eine Route, die nicht durch Garnisonen gesichert werden muss, um offen zu bleiben.\n\nDie Erzeuger verkaufen für einen Bruchteil dessen, was die Gewürze in Alexandria bringen. Das Reich steht nun dort, wo Venedig stand, und es hat dies erreicht, indem es ein besserer Kunde als ein schlechter Nachbar war."
 cc_byz_east.30.desc_monopoly: "Die Inseln, auf denen die Gewürze wachsen, sind erreicht worden, und die Straße dahinter wurde einer Generation lang für die lateinische Schifffahrt gesperrt.\n\nDie Folge ist nicht subtil und sollte es auch nicht sein. Venedig und Genua bauten ihren Aufstieg darauf auf, zwischen den Gewürzen und ihren Käufern zu stehen, und sie stehen dort nicht mehr; das Reich steht dort. Der Rialto erfährt nun, wie es ist, ein Kunde zu sein, und die Berichte des venezianischen Senats werden in Konstantinopel mit einer Aufmerksamkeit gelesen, die nicht ganz würdevoll ist.\n\nEs ist die profitabelste Einzelmaßnahme, die das Reich seit Justinian unternommen hat. Es hat sich damit jedoch auch dauerhafte Feinde unter den einzigen Mächten im Westen mit Flotten gemacht."
 cc_byz_east.30.a: "Ein Kronmonopol."
 cc_byz_east.30.b: "Verpachten Sie es an die Bürger. Nehmen Sie einen Anteil."
 cc_byz_east.30.c: "Verkaufen Sie den Italienern ihren Zugang zurück, zu unserem Preis."
