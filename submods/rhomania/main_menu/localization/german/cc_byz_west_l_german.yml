l_german:
 # The West: the situation, the Praetorian Prefectures, the consistory and its four laws.
 #
 # The four prefectures are named for late-Roman administrative units rather than for
 # exarchates. Only Ravenna and Carthage were ever exarchates; Spania was governed by a
 # magister militum and Gaul was never recovered at all. The PREFECTURES of Italy, Africa and
 # Gaul, and the Spanish diocese under Gaul, are real, which is what an eastern emperor
 # restoring the west would claim to be restoring.

 # ---- The situation ----
 cc_byz_the_west: "Der Westen"
 cc_byz_the_west_desc: "Vier zurückgewonnene Provinzen und die beständige Frage, was sie eigentlich sind. Eine von Konstantinopel aus regierte Präfektur kann sich nicht selbst verteidigen; eine, die sich selbst verteidigen kann, braucht Konstantinopel nicht."
 cc_byz_the_west_map_tt: "Teil der westlichen Präfekturen"

 # ---- The organisation ----
 cc_byz_prefectures: "Die Prätorianpräfekturen des Westens"
 cc_byz_prefectures_desc: "Das Verwaltungsorgan des zurückgewonnenen Westens und sein Konsistorium. Der Kaiser leitet den Vorsitz; jeder Präfekt hat einen Sitz. Ob das Gremium berät oder lediglich Anweisungen entgegennimmt, ist eine Frage der Arithmetik, und die Arithmetik ändert sich mit jeder zurückgewonnenen Provinz."

 # ---- Voting statuses ----
 # The whole design in three numbers: 3 votes, 2 votes, 1 vote.
 cc_byz_augustus: "Augustus"
 cc_byz_augustus_desc: "Der Kaiser. Drei Stimmen im Konsistorium; das reicht gegen einen Präfekten aus, es reicht exakt gegen zwei, aber es reicht nicht gegen drei."
 cc_byz_senior_exarch: "Senior-Exarch"
 cc_byz_senior_exarch_desc: "Der Erste unter den Präfekten und der Einzige, den der Kaiser selbst wählt. Zwei Stimmen."
 cc_byz_exarch_seat: "Exarch"
 cc_byz_exarch_seat_desc: "Ein Sitz im Konsistorium. Eine Stimme, und es gibt keine Obergrenze dafür, wie viele davon die eigene Rückeroberung des Kaisers schafft."

 # ---- The consistory ----
 cc_byz_consistorium_dormant: "Konsistorium nicht einberufen"
 cc_byz_consistorium_dormant_desc: "Die Präfekturen existieren und werden regiert. Sie treten nicht zusammen. Ein Kaiser, der sie nie zu einer Sitzung einberuft, verliert nie eine Abstimmung und erfährt nie, was sie gesagt hätten."
 cc_byz_consistorium_assembly: "Das Heilige Konsistorium"
 cc_byz_consistorium_assembly_desc: "Der Rat des Westens in seiner Sitzung. Der Kaiser spricht mit drei Stimmen, der Senior-Präfekt mit zwei, jeder andere Präfekt mit einer. Ein Gleichstand lässt den Antrag scheitern."

 # ---- The four countries ----
 cc_byz_exarchate_ravenna_name: "Exarchat von Ravenna"
 cc_byz_exarchate_ravenna_adj: "Ravenner"
 cc_byz_exarchate_carthage_name: "Exarchat von Karthago"
 cc_byz_exarchate_carthage_adj: "Karthager"
 cc_byz_exarchate_spania_name: "Provinz Spania"
 cc_byz_exarchate_spania_adj: "Spanien"
 cc_byz_exarchate_gaul_name: "Präfektur der Gallier"
 cc_byz_exarchate_gaul_adj: "Gallisch"

 # ---- Law: command ----
 cc_byz_west_command_law: "Kommando über die westlichen Armeen"
 cc_byz_west_command_law_desc: "Wem die Soldaten im Westen gehorchen. Die älteste der vier Fragen und diejenige, die im sechsten Jahrhundert geklärt wurde."
 cc_byz_command_imperial: "Kaiserliche Beamte"
 cc_byz_command_imperial_desc: "Kommandanten, die von der Hauptstadt ernannt und rotiert werden, bevor sie Wurzeln schlagen. Die Armeen gehören dem Kaiser und sind dadurch in ihrer Arbeit schlechter."
 cc_byz_command_exarchal: "Der Exarch befiehlt"
 cc_byz_command_exarchal_desc: "Der Präfekt befehligt seine eigenen Truppen. Die Exarchen von Ravenna waren Generäle, weil Italien nicht von einem Komitee auf einem anderen Kontinent verteidigt werden konnte, und genau das machte sie gefährlich."
 cc_byz_command_joint: "Gemeinsames Kommando"
 cc_byz_command_joint_desc: "Befehle werden an zwei Stellen gegengezeichnet. Es funktioniert, langsam, und niemand ist zufrieden."

 # ---- Law: the fisc ----
 cc_byz_west_fisc_law: "Die westlichen Einnahmen"
 cc_byz_west_fisc_law_desc: "Wohin das im Westen erwirtschaftete Geld fließt. Eine Präfektur, die alles abführt, kann ihre eigenen Garnisonen nicht bezahlen; eine, die alles behält, ist ein Staat."
 cc_byz_fisc_remitted: "Vollständig erlassen"
 cc_byz_fisc_remitted_desc: "Alles nach Konstantinopel, und der Westen beantragt es zurück. Die Hauptstadt entscheidet, was die Grenze wert ist."
 cc_byz_fisc_split: "Getrennt auf Ebene der Präfektur"
 cc_byz_fisc_split_desc: "Die Provinz behält, was sie benötigt, und sendet den Rest. Die historische Vereinbarung, und die praktikable."
 cc_byz_fisc_retained: "Im Westen verblieben"
 cc_byz_fisc_retained_desc: "Der Westen finanziert sich selbst und erweist der Hauptstadt eine Höflichkeit. Wohlhabend, gut garnisoniert und nicht länger bittstellend."

 # ---- Law: the rite ----
 cc_byz_west_rite_law: "Das Ritus in den westlichen Kirchen"
 cc_byz_west_rite_law_desc: "Was in den zurückgewonnenen Provinzen gefeiert wird. Die entscheidende Frage: Ein Westen, der sich selbst lokale Gepflogenheiten zuweist, ist ein Westen, der vom Lateinischen wegdriftet, und es war die eigene Rückeroberung des Kaisers, die ihm die Stimmen dafür gab."
 cc_byz_rite_greek: "Der griechische Ritus"
 cc_byz_rite_greek_desc: "Gefeiert in der Hauptstadt, in der eigenen Kapelle des Exarchen und fast nirgendwo sonst im Westen, wo tatsächlich jemand teilnimmt."
 cc_byz_rite_local: "Lokale Gepflogenheiten toleriert"
 cc_byz_rite_local_desc: "Die Kirchen bewahren die Formen, die sie seit Jahrhunderten bewahren. Pragmatisch, populär und der erste Schritt auf einem Abhang, den der Palast sehr wohl sehen kann."
 cc_byz_rite_latin: "Der lateinische Ritus"
 cc_byz_rite_latin_desc: "Offen und durch Abstimmung des eigenen Rates des Kaisers. Der Westen hat entschieden, welcher Kirche er angehört, und es ist nicht diejenige, deren Kaiser ihn regiert."

 # ---- Law: succession ----
 cc_byz_west_succession_law: "Nachfolge in den Präfekturen"
 cc_byz_west_succession_law_desc: "Wie ein verstorbener Präfekt ersetzt wird. Die Frage, die ein Amt in eine Familiensache verwandelt."
 cc_byz_succession_appointed: "Von der Hauptstadt ernannt"
 cc_byz_succession_appointed_desc: "Ein verstorbener Exarch wird durch jeden ersetzt, den der Palast entsendet. Das ist es, was das Amt zu einer Position macht."
 cc_byz_succession_acclaimed: "Lokal gefeiert"
 cc_byz_succession_acclaimed_desc: "Die Armee und die Honoratioren der Provinz wählen, und der Kaiser bestätigt, was bereits geschehen ist."
 cc_byz_succession_hereditary: "Erblich"
 cc_byz_succession_hereditary_desc: "Das Amt geht auf den Sohn über. Das Reich hat nun im Westen eine Dynastie, die nicht aus dem Palast stammt und ihn nicht benötigt."

 # ---- The seven governing actions ----
 cc_byz_west_order_census: "Eine Volkszählung des Westens anordnen"
 cc_byz_west_order_census_desc: "Zähle das Land, die Menschen und was sie schulden. Das Einzige, was eine römische Verwaltung in Europa konnte, und das Einzige, was jeder, der gezählt wurde, lieber vermieden hätte."
 cc_byz_west_donative: "Zahle die westliche Donativum"
 cc_byz_west_donative_desc: "Die Garnisonen erhalten ihre Rückstände und den diesjährigen Sold zusammen. Das eine Ding, das eine römische Grenze am zuverlässigsten loyal hielt, und das eine Ding, das Kaiser am zuverlässigsten einstellten, wenn das Geld knapp wurde."
 cc_byz_west_demand_tribute: "Fordere den Präfektur-Tribut"
 cc_byz_west_demand_tribute_desc: "Eine Erhebung über das, was die Vereinbarung bereits abwirft. Das Geld kommt an. Ebenso wie die Erinnerung daran, dass man darum gebeten wurde."
 cc_byz_west_send_strategos: "Sende den Strategos in den Westen"
 cc_byz_west_send_strategos_desc: "Verstärkungen und ein General, um sie zu befehligen. Der Westen wird verteidigungsfähig, und es gibt nun dort ein Heer, das weiß, in wessen Namen es bezahlt wird."
 cc_byz_west_confirm_son: "Bestätige den Sohn des Exarchen"
 cc_byz_west_confirm_son_desc: "Erkenne die Nachfolge im Voraus an. Das erkauft eine Loyalität, die sonst nichts kaufen kann, und räumt dauerhaft ein, dass das Amt einer Familie gehört."
 cc_byz_west_recall_exarch: "Rufen Sie den Exarchen in die Hauptstadt"
 cc_byz_west_recall_exarch_desc: "Rufe ihn zurück, um sich zu erklären. Ob er kommt, liegt nicht in der Entscheidung des Kaisers, sondern hängt ganz davon ab, wie er behandelt wurde."
 cc_byz_west_grant_charter: "Gewähre einer Kommune ihre Charta"
 cc_byz_west_grant_charter_desc: "Rechte und Selbstverwaltung schriftlich, im Austausch für Einnahmen und Ruhe. Die erste Charta ist der Präzedenzfall, den jede andere Kommune anführen wird."

 # ---- The three consistory actions ----
 cc_byz_io_convene_consistory: "Berufe das Konsistorium ein"
 cc_byz_io_convene_consistory_desc: "Berufen Sie die Präfekten zur Sitzung ein. Bis dies erledigt ist, gibt es keine Stimmen zu verlieren, und danach gibt es welche."
 cc_byz_io_elevate_senior_exarch: "Erhebe einen Senior-Exarchen"
 cc_byz_io_elevate_senior_exarch_desc: "Ernennt einen Präfekten zum Ersten unter den anderen. Er spricht mit zwei Stimmen im Konsistorium, so dass dies eine Entscheidung darüber ist, wem man die zweite Stimme übergeben soll."
 cc_byz_io_dissolve_prefecture: "Löse eine Präfektur auf"
 cc_byz_io_dissolve_prefecture_desc: "Nehmen Sie die Provinz wieder unter direkte Verwaltung. Dies ist der einzige Weg, den Widerstand des Konsistoriums zu verringern, und jeder andere Präfekt wird dies mitansehen."

 # ---- Modifier types ----
 MODIFIER_TYPE_NAME_cc_byz_augustus_can_participate_in_parliament: "Augustus darf im Konsistorium sitzen"
 MODIFIER_TYPE_NAME_cc_byz_senior_exarch_can_participate_in_parliament: "Der Senior-Exarch darf im Konsistorium sitzen"
 MODIFIER_TYPE_NAME_cc_byz_exarch_seat_can_participate_in_parliament: "Exarch darf im Konsistorium sitzen"
 MODIFIER_TYPE_NAME_cc_byz_augustus_agenda_impact: "Auswirkung der Augustus-Agenda"
 MODIFIER_TYPE_NAME_cc_byz_senior_exarch_agenda_impact: "Auswirkung der Agenda des Senior-Exarchen"
 MODIFIER_TYPE_NAME_cc_byz_exarch_seat_agenda_impact: "Auswirkung der Exarchen-Agenda"

 # ---- Action outcomes ----
 STATIC_MODIFIER_NAME_cc_byz_west_census_taken: "Das westliche Register"
 STATIC_MODIFIER_DESC_cc_byz_west_census_taken: "Das Land ist vermessen und die Zahlen sind aktuell. Sie werden nicht aktuell bleiben."
 STATIC_MODIFIER_NAME_cc_byz_west_donative_paid: "Das Donativ gezahlt"
 STATIC_MODIFIER_DESC_cc_byz_west_donative_paid: "Die westlichen Garnisonen wurden pünktlich bezahlt, was sie etwa so lange in Erinnerung behalten werden, wie es anhält."
 STATIC_MODIFIER_NAME_cc_byz_west_tribute_taken: "Der Tribut wurde eingezogen"
 STATIC_MODIFIER_DESC_cc_byz_west_tribute_taken: "Die Erhebung wurde eingezogen. Der Unmut ist an anderer Stelle verzeichnet."
 STATIC_MODIFIER_NAME_cc_byz_west_strategos_sent: "Ein Strategos im Westen"
 STATIC_MODIFIER_DESC_cc_byz_west_strategos_sent: "Es gibt dort draußen einen General mit Truppen, die ihn kennen; das ist es, was der Westen brauchte und was die Hauptstadt bereuen wird."
 STATIC_MODIFIER_NAME_cc_byz_west_recall_issued: "Die Vorladung wurde ausgesprochen"
 STATIC_MODIFIER_DESC_cc_byz_west_recall_issued: "Der Befehl ist in den Westen gegangen. Was zurückkommt, ist eine separate Angelegenheit."
 STATIC_MODIFIER_NAME_cc_byz_west_charter_granted: "Eine privilegierte Kommune"
 STATIC_MODIFIER_DESC_cc_byz_west_charter_granted: "Rechte schriftlich, Einnahmen als Gegenleistung und ein Präzedenzfall, den nun jede andere Kommune im Westen anführt."
 STATIC_MODIFIER_NAME_cc_byz_west_recall_obeyed: "Der Vorladung wurde Folge geleistet"
 STATIC_MODIFIER_DESC_cc_byz_west_recall_obeyed: "Er kam, als er gerufen wurde. Jeder Gouverneur im Reich bemerkte es."
 STATIC_MODIFIER_NAME_cc_byz_west_recall_refused: "Die Vorladung wurde abgelehnt"
 STATIC_MODIFIER_DESC_cc_byz_west_recall_refused: "Er kam nicht, und ihm geschah nichts. Das bemerkte ebenfalls jeder Gouverneur im Reich."
 STATIC_MODIFIER_NAME_cc_byz_west_prefecture_dissolved: "Eine aufgelöste Präfektur"
 STATIC_MODIFIER_DESC_cc_byz_west_prefecture_dissolved: "Die Provinz wird wieder direkt von der Hauptstadt aus regiert – zu den Kosten, die eine direkte Regierung von der Hauptstadt aus mit sich bringt."

 # ---- The four endings ----
 STATIC_MODIFIER_NAME_cc_byz_west_end_reabsorbed: "Der Westen wurde reabsorbiert"
 STATIC_MODIFIER_DESC_cc_byz_west_end_reabsorbed: "Die Präfekturen werden in das Reich eingegliedert und von Konstantinopel aus verwaltet. Es erforderte, sie schwach zu halten, weshalb es funktionierte."
 STATIC_MODIFIER_NAME_cc_byz_west_end_diarchy: "Die Diarchie"
 STATIC_MODIFIER_DESC_cc_byz_west_end_diarchy: "Ein Kollege im Westen, formell investiert, der Provinzen regiert, die stark genug sind, um von Bedeutung zu sein. Zwei Kaiser, ein Reich, und diesmal wurde es arrangiert, statt erlitten."
 STATIC_MODIFIER_NAME_cc_byz_west_end_acclamation: "Die westliche Akklamation"
 STATIC_MODIFIER_DESC_cc_byz_west_end_acclamation: "Die Armeen des Westens proklamierten ihren eigenen Kaiser. So erwarb das Reich das erste Mal eine westliche Hälfte."
 STATIC_MODIFIER_NAME_cc_byz_west_end_neglect: "Der Westen wurde vernachlässigt"
 STATIC_MODIFIER_DESC_cc_byz_west_end_neglect: "Niemand regiert die zurückgewonnenen Provinzen, einschließlich der Männer, die dazu ernannt wurden."

 # ---- Situation events ----
 cc_byz_west.1.title: "Die Präfekturen des Westens"
 cc_byz_west.1.desc: "Das Dokument ist kurz, da es hierfür ein Formular gibt und dieses Formular neunhundert Jahre alt ist.\n\nEine prätorianische Präfektur wird eingerichtet. Ihr Präfekt verwaltet die Provinz, befehligt die dort stationierten Truppen, hört Berufungen der Gerichte an und leitet die Einnahmen weiter – und all dies tut er im Namen des Kaisers aus einer Entfernung von mehreren Wochen Seefahrt.\n\nDie Kanzlei hat den Ernennungsbeschluss dreimal entworfen. Jeder Entwurf war kürzer als der vorherige, denn je länger er ist, desto mehr liest er sich wie eine Liste der Dinge, die der Mann nun tun kann, ohne nachzufragen."
 cc_byz_west.1.desc_several: "Es sind nun mehrere von ihnen, was eine andere Anordnung ist, als nur einen zu haben.\n\nEin Präfekt ist ein Gouverneur. Zwei sind ein Präzedenzfall. Was drei oder vier bedeuten, ist eine Frage, die die Kanzlei sorgfältig nicht schriftlich fixiert hat, und die älteren Schreiber haben begonnen, den Begriff 'der Westen' so zu verwenden, als wäre es ein Ort mit eigenen Meinungen und nicht bloß eine Himmelsrichtung."
 cc_byz_west.1.a: "So wurde das Reich schon immer regiert."

 cc_byz_west.10.title: "Das Konsistorium ist einberufen"
 cc_byz_west.10.desc: "Sie werden einberufen, und sie kommen.\n\nDas heilige Konsistorium ist nicht neu. Kaiser haben sich seit Diokletian in dieser Form beraten, und das Protokoll ist exakt: wer steht, wer sitzt, wer in welcher Reihenfolge spricht und wie eine Entscheidung als die des Kaisers selbst protokolliert wird, ganz gleich, wie sie zustande kam.\n\nWas neu ist, sind die Personen, die darin stehen. Die Präfekten des Westens sind einen weiten Weg gereist, um hier zu sein, und Männer, die einen weiten Weg gereist sind, um befragt zu werden, neigen dazu, zu erwarten, dass dies auch geschieht."
 cc_byz_west.10.desc_outnumbered: "Sie werden einberufen, und sie kommen, und es gibt mehr von ihnen als von uns.\n\nDas Protokoll ist exakt und die Arithmetik ist ebenfalls exakt. Der Kaiser spricht mit drei Stimmen, wie er es immer getan hat. Die Präfekten des Westens sprechen nun gemeinsam mit mehr Stimmen, und jede dieser Stimmen existiert, weil das Imperium im Westen erfolgreich war.\n\nNiemand sagt dies. Der Magister Officiorum hat die Sitzordnung mit großer Sorgfalt festgelegt."
 cc_byz_west.10.a: "Lasst sie gehört werden."

 cc_byz_west.20.title: "Die Vorladung"
 cc_byz_west.20.desc: "Der Befehl ist eindeutig und höflich formuliert. Er soll sich in der Hauptstadt melden und über seine Verwaltung Rechenschaft ablegen.\n\nWas als Nächstes passiert, liegt nicht in den Händen des Kaisers. Es liegt seit einigen Jahren nicht mehr in seinen Händen und wurde durch jede gezahlte oder vorenthaltene Donativ, jede geforderte Erhebung und die Frage, ob ihm jemals jemand sagte, dass sein Sohn bestätigt würde, entschieden."
 cc_byz_west.20.desc_again: "Der Befehl ist eindeutig, höflich formuliert und der zweite seiner Art.\n\nDas letzte Mal wurde er ignoriert und nichts geschah. Jeder westlich der Adria weiß das, einschließlich des Mannes, der ihn gerade liest."
 cc_byz_west.20.a: "Er wird innerhalb des Monats auf dem Weg sein."
 cc_byz_west.20.b: "Er bedauert, dass die Provinz ihn nicht entbehren kann."
 cc_byz_west.20.c: "Dann wird er geholt werden."

 cc_byz_west.30.title: "Auflösung der Präfektur"
 cc_byz_west.30.desc: "Es kann getan werden. Das Amt wurde durch ein Dokument geschaffen und kann durch eines beendet werden, und das Territorium fällt an die direkte Verwaltung aus der Hauptstadt zurück.\n\nWas das Dokument nicht tun kann, ist die Beamten hervorzubringen, die es verwalten. Diese Männer gehören derzeit dem Präfekten, sie leben dort und haben eine Karriere damit verbracht, eine Provinz kennenzulernen, die die Hauptstadt nie gesehen hat. Einige werden bleiben. Diejenigen, auf die es ankommt, werden es nicht.\n\nDie anderen Präfekten werden davon hören, bevor die Kuriere sie erreichen."
 cc_byz_west.30.a: "Das Amt war es, dass wir es schufen, und es war unser Recht, es zu beenden."
 cc_byz_west.30.b: "Lasst es. Es gibt bessere Kämpfe."

 cc_byz_west.90.title: "Der Westen wurde reabsorbiert"
 cc_byz_west.90.desc: "Die letzte Präfektur wird aufgelöst und der Westen wird so regiert wie der Osten: von Beamten, die dort dienen, wohin sie geschickt werden, im Gnadenwesen des Kaisers im Amt sind und nach Hause gehen, wenn sie zurückgerufen werden.\n\nEs erforderte, die Provinzen schwach zu halten. Eine Präfektur, die stark genug wäre, sich selbst zu verteidigen, wäre stark genug gewesen, abzulehnen; daher war keine von ihnen jemals stark genug, und die Grenze wurde von Armeen gehalten, die aus der Hauptstadt entsandt wurden – zu Kosten, die niemand jemals zusammengerechnet hat.\n\nDas Reich ist wieder eine Einheit, verwaltet von einem Ort, in einer Sprache, durch einen Dienst. Seit Theodosius war es das nicht mehr."
 cc_byz_west.90.a: "Ein Reich und ein Kaiser darin."

 cc_byz_west.91.title: "Die Diarchie"
 cc_byz_west.91.desc: "Die Regelung wird im Konsistorium formalisiert, in den alten Formen, und die alten Formen erweisen sich als genau für diesen Zweck geschrieben.\n\nEs gibt einen Kollegen im Westen. Er wird investiert, akklamiert und in den Gebeten genannt; seine Präfekturen stellen ihre eigenen Armeen auf, behalten ihre eigenen Einnahmen und sind für ihre eigene Grenze verantwortlich, und sie berichten an ihn. Er berichtet an den seniority Augustus, was eine reale Beziehung und keine Höflichkeit ist, da sie durch eine Vereinbarung zwischen zwei Höfen zustande kam, von denen beide etwas zu verlieren hatten.\n\nDas ist es, was das vierte Jahrhundert zu erreichen versuchte. Damals scheiterte es, weil die beiden Hälften von Anfang an Rivalen waren. Diese hier wurde von einem Kaiser aufgebaut, der den Westen selbst zurückgewann und dann weigerte sich vorzugeben, er könne ihn vom Bosporus aus verwalten."
 cc_byz_west.91.a: "Zwei Augusti und ein Imperium zwischen ihnen."

 cc_byz_west.92.title: "Die Akklamation"
 cc_byz_west.92.desc: "Es geschieht so, wie es immer geschieht. Keine Rebellion, kein Manifest: ein Exerzierplatz, eine Armee, die nicht bezahlt wurde, ein General, der es wurde, und der Aufschrei, der ertönt, bevor jemand beschlossen hat, zu schreien.\n\nBis die Nachricht Konstantinopel erreicht, trägt er seit vier Monaten Purpur, die Präfekturen haben ihn anerkannt, und die Anerkennungen sind so vorsichtig formuliert, dass keine einzelne von ihnen Verrat ist.\n\nDer Konsistorium tritt weiterhin zusammen. Es wurde schließlich durch kaiserliche Autorität konstituiert und vertritt die Ansicht, dass dies immer noch der Fall ist."
 cc_byz_west.92.a: "Dann sind wir zu zweit, und einer ist ein Usurpator."

 cc_byz_west.93.title: "Der Westen wurde freigelassen"
 cc_byz_west.93.desc: "Es gibt keinen einzelnen Moment. Das macht es so schwer zu berichten.\n\nDie Präfekten werden immer noch ernannt und immer noch bestätigt. Die Einnahmen werden immer noch geschätzt, basierend auf Zahlen einer Volkszählung, die vierzig Jahre alt ist. Die Garnisonen stehen immer noch in den Listen. Irgendwo zwischen der Schätzung und der Erhebung, und zwischen der Liste und der Mauer, hörte das Imperium auf, das zu sein, was diese Provinzen regiert, und niemand kann sagen, in welchem Jahr das geschah.\n\nDie Männer, die sie nun tatsächlich regieren, sind Einheimische, kompetent und wurden nie von jemandem ernannt."
 cc_byz_west.93.a: "Es war ein weiter Weg, den man halten musste."
 cc_byz_west.80.title: "Die Frage darf nicht offen bleiben"
 cc_byz_west.80.desc: "Der Magister Officiorum hat ein Memorandum eingereicht, nach dem niemand gefragt hat.\n\nSein Punkt ist verfahrenstechnischer Natur und daher schwer zu widerlegen. Die westlichen Präfekturen existieren nun schon so lange, dass ihre Regelungen älter sind als die meisten Männer, die sie verwalten, und mit jedem Jahr, in dem die Regelung nicht ausgesprochen wird, wird es schwieriger, sie auszusprechen. Präfekten werden nach Präzedenzfällen statt nach Anweisungen ernannt. Einnahmen werden zu Sätzen abgeführt, für die niemand ein Dokument vorlegen kann.\n\nEr empfiehlt keine bestimmte Politik. Er empfiehlt, dass es eine gibt, und zwar bald, denn die Alternative ist, dass die Antwort von selbst kommt und der Palast erst im Nachhinein erfährt, was sie war."
 cc_byz_west.80.desc_westward: "Der Magister Officiorum hat ein Memorandum eingereicht, nach dem niemand gefragt hat, und es ist kürzer als gewöhnlich.\n\nDer Westen wird nicht von hier aus regiert. Er drückt es nicht so unverblümt aus, aber die Zahlen tun es: Ernennungen werden eher bestätigt als vorgenommen, Einnahmen werden in den Provinzen statt in der Hauptstadt festgesetzt, und ein Konsistorium, dessen Stimmen der Kaiser nun zählen muss, bevor er sie abfragt.\n\nNichts davon wurde beschlossen. All dies ist nun gängige Praxis, und Praxis wird in diesem Reich zum Gesetz, wenn sie lange genug nicht angefochten wird. Er schlägt vor, dass die Anfechtung in dieser Regierungszeit erfolgt oder gar nicht."
 cc_byz_west.80.a: "Dann wird sie zu meiner Zeit geklärt."
 cc_byz_west.40.title: "Die Präfekten lehnen sich auf"
 cc_byz_west.40.desc: "Es beginnt als ein verfahrenstechnischer Einwand, wie diese Dinge meist beginnen, wenn die Männer, die sie formulieren, ebenso Juristen wie Soldaten sind.\n\nDas Konsistorium hat beschlossen, dass Ernennungen in den westlichen Präfekturen der Zustimmung des Gremiums bedürfen. Es hat diesen Beschluss in der korrekten Form, mit den korrekten Siegeln, an die Hauptstadt übermittelt und dabei vier Präzedenzfälle angeführt, von denen drei echt sind. Es hat nichts über Gehorsam beschlossen, denn das muss es auch nicht: Eine Ernennung, der das Konsistorium nicht zugestimmt hat, ist nun, durch seinen eigenen Beschluss, keine Ernennung mehr.\n\nDie westlichen Armeen befinden sich in ihren Quartieren und wurden bezahlt. Nicht von uns."
 cc_byz_west.40.desc_defied: "Es beginnt dort, wo die letzte Vorladung endete.\n\nEin Präfekt ignorierte eine Rückrufaufforderung und behielt seine Provinz, und ihm geschah nichts. Das Konsistorium hat nun beschlossen, dass Ernennungen im Westen der Zustimmung des Gremiums bedürfen, und der Beschluss liest sich weniger wie ein Anspruch als vielmehr wie eine Beschreibung: Die Sache sei bereits seit einigen Jahren wahr und jemand habe sie endlich aufgeschrieben.\n\nDie westlichen Armeen befinden sich in ihren Quartieren und wurden bezahlt. Nicht von uns."
 cc_byz_west.40.desc_all: "Jede Präfektur hat es unterzeichnet.\n\nDas ist der Teil, zu dem der Amtsschimmel immer wieder zurückkehrt. Nicht der Inhalt des Beschlusses, der ein juristisches Dokument ist und über den man streiten könnte, sondern die Tatsache, dass vier Provinzen, die wochenlang mit dem Schiff voneinander entfernt liegen, einen einzigen Text mit vier Siegeln hervorgebracht haben. Vor achtzig Jahren hätten sie das nicht tun können. Jetzt können sie es, weil das Reich ihnen eine Kammer gebaut hat, in der sie dies tun können, sie dazu herbeigerufen hat und ihnen gesagt hat, dass ihre Zustimmung wertvoll sei.\n\nDie westlichen Armeen befinden sich in ihren Quartieren und wurden bezahlt. Nicht von uns."
 cc_byz_west.40.a: "Dann ist es ein Krieg, und sie sind immer noch meine Gouverneure."
 cc_byz_west.40.b: "Geben Sie ihnen die Substanz. Ich werde die Form wahren."
 cc_byz_west.40.c: "Kaufen Sie diejenigen, die käuflich sind."
 cc_byz_west.41.title: "Die Abrechnung im Westen"
 cc_byz_west.41.desc_won: "Die Präfektur wird abgewickelt, ihre Beamten entlassen oder versetzt, und ihr Territorium wird von der Hauptstadt aus verwaltet.\n\nWas beim späteren Lesen der Korrespondenz auffällt, ist, wie gewöhnlich sich die rechtliche Lage herausstellte. Es war keine Eroberung involviert und keine wurde beansprucht. Ein Amt wurde durch die Autorität widerrufen, die es geschaffen hatte, und die Tatsache, dass der Widerruf eine Armee erforderte, taucht in den Papieren nirgends auf.\n\nDie überlebenden Präfekten haben ihre Glückwünsche geschickt. Sie waren prompt damit."
 cc_byz_west.41.desc_none_left: "Es sind keine Präfekturen mehr übrig.\n\nDie westlichen Provinzen werden direkt verwaltet, was bedeutet, dass sie von Männern aus der Hauptstadt verwaltet werden, die das Land nicht kennen, die Sprache seiner Gerichte nicht sprechen und versetzt werden, bevor sie beides gelernt haben. Das ist es, was gewünscht war. Es ist einen Vermerk wert, dass es einen Krieg gegen die eigenen Gouverneure des Reiches kostete, dies zu erreichen."
 cc_byz_west.41.desc_unresolved: "Der Krieg hat es nicht geklärt, oder es gab keinen Krieg.\n\nDie Präfekturen existieren noch immer, ebenso wie die Präfekten, und der Beschluss, der für Ernennungen die Zustimmung des Konsistoriums erfordert, wurde nicht zurückgenommen. Man hat einfach aufgehört, ihn anzufechten, was in diesem Reich die Art und Weise ist, wie aus einem Anspruch ein Recht wird.\n\nDer nächste Kaiser wird diese Regelung als Tatsache und nicht als Frage erben und sich nicht erinnern, dass es jemals anders war."
 cc_byz_west.41.a: "Das Amt lag in meiner Macht, es zu widerrufen."
 cc_byz_west.41.b: "Dann ist die Sache zu meinem Nachteil entschieden."
 cc_byz_reduce_prefecture: "Präfektur verkleinern"
 cc_byz_reduce_prefecture_desc: "Widerrufen Sie die Ernennung und nehmen Sie die Provinz zurück unter direkte Verwaltung. Keine Eroberung: Das Amt wurde durch imperiale Autorität geschaffen und wird durch diese beendet, weshalb es so wenig kostet und weshalb niemand sonst in Europa es für seine Angelegenheit hält."
 cc_byz_reduce_prefecture_tt: "Die Präfektur wird aufgelöst und ihr Territorium kehrt in die direkte imperiale Verwaltung zurück"
 cc_byz_cb_reduce_the_prefectures: "Präfekturen verkleinern"
 cc_byz_cb_reduce_the_prefectures_desc: "Die westlichen Präfekten haben ihre Zustimmung zur Bedingung ihrer eigenen Ernennung gemacht. Rechtlich bleiben sie imperiale Beamte in imperialen Provinzen, und der Kaiser beabsichtigt, sie an die erste Hälfte dieses Satzes zu erinnern."
 cc_byz_cb_reduce_the_prefectures_PROV: "Präfekturen verkleinern"
 cc_byz_west.35.title: "Briefe, die nicht an uns gerichtet sind"
 cc_byz_west.35.desc: "Die Depeschenkuriertasche aus dem Westen ist immer leichter geworden, und die Kanzlei hat einige Zeit gebraucht, um herauszufinden, warum.\n\nEs liegt nicht daran, dass weniger geschrieben wird. Es liegt daran, dass ein Großteil dessen, was nun geschrieben wird, direkt zwischen den Präfekturen ausgetauscht wird – in Angelegenheiten, bei denen die Hauptstadt zuvor geschlichtet hätte: eine Grenzfrage, die zwischen zwei Gouverneuren ohne Rücksprache mit anderen geklärt wurde, eine Vereinbarung über Getreidepreise, eine gemeinsame Beschwerde über die Steuerfestsetzung, die entworfen, aber dann nicht abgeschickt wurde.\n\nNichts davon ist unzulässig. Der Meister der Ämter betont diesen Punkt zweimal, woran der Kaiser erkennt, dass er beunruhigt ist."
 cc_byz_west.35.desc_defied: "Die Depeschenkuriertasche aus dem Westen ist immer leichter geworden, und diesmal muss niemand herausfinden, warum.\n\nEine Vorladung wurde ignoriert und nichts folgte darauf. Was die Präfekturen seitdem getan haben, ist, miteinander zu korrespondieren statt mit uns: Grenzfragen wurden zwischen Gouverneuren geklärt, Getreidepreise vereinbart, eine gemeinsame Beschwerde über die Steuerfestsetzung entworfen und zur Unterzeichnung herumgereicht.\n\nDieses letzte Dokument wurde nicht abgeschickt. Die Ansicht der Kanzlei ist, dass es für einen Zeitpunkt aufgehoben wird, an dem es wertvoller sein wird."
 cc_byz_west.35.desc_many: "Drei Präfekturen und mehr, und sie haben entdeckt, dass sie sich gegenseitig schreiben können.\n\nDie Korrespondenz ist vollkommen ordnungsgemäß, und genau das macht es schwierig, Einwände zu erheben. Grenzfragen, die zwischen Gouverneuren geklärt wurden. Vereinbarte Getreidepreise. Eine gemeinsame Erklärung zur Steuerfestsetzung, entworfen, zur Unterzeichnung herumgereicht und zurückgehalten.\n\nWas sich geändert hat, ist nicht ein einzelner Brief, sondern die Existenz einer Gewohnheit. Vor achtzig Jahren hätte der Westen nichts koordinieren können, weil es keinen Westen gab, sondern nur eine Reihe von Provinzen, von denen jede einzeln mit der Hauptstadt dealings hatte. Jetzt gibt es einen Westen. Wir haben ihm eine Kammer gebaut und ihn zur Sitzung einberufen."
 cc_byz_west.35.a: "Zahlen Sie die Rückstände. Alle, noch in diesem Jahr."
 cc_byz_west.35.b: "Kümmern Sie sich um denjenigen, der die Briefe entwirft."
 cc_byz_west.35.c: "Nehmen Sie es zur Kenntnis. Es gibt dringlichere Probleme."
 STATIC_MODIFIER_NAME_cc_byz_west_restive: "Der Westen ist unruhig"
 STATIC_MODIFIER_DESC_cc_byz_west_restive: "Die Präfekturen korrespondieren untereinander statt mit der Hauptstadt, und mindestens ein Präfekt hat aufgehört, so zu tun, als sei er zufrieden. Dies ist der Zustand, der einem Aufstand vorausgeht."
 STATIC_MODIFIER_NAME_cc_byz_exarch_disaffected: "Ein unzufriedener Präfekt"
 STATIC_MODIFIER_DESC_cc_byz_exarch_disaffected: "Dieser Präfekt wirbt Männer, und er erwartet nicht, sie für die Hauptstadt einzusetzen."
 STATIC_MODIFIER_NAME_cc_byz_exarch_contented: "Ein zufriedener Präfekt"
 STATIC_MODIFIER_DESC_cc_byz_exarch_contented: "Bezahlt, bestätigt und regiert eine Provinz, die aus dieser Vereinbarung hervorgeht."
 io_opinion_cc_byz_prefectures: "Werte Präfektur des Westens"
 MODIFIER_TYPE_DESC_cc_byz_augustus_can_participate_in_parliament: "Ob der Kaiser einen Sitz und eine Stimme im Konsistorium der westlichen Präfekturen innehat."
 MODIFIER_TYPE_DESC_cc_byz_senior_exarch_can_participate_in_parliament: "Ob der Seniorpräfekt einen Sitz und eine Stimme im Konsistorium innehat."
 MODIFIER_TYPE_DESC_cc_byz_exarch_seat_can_participate_in_parliament: "Ob ein gewöhnlicher Präfekt einen Sitz und eine Stimme im Konsistorium innehat."
 MODIFIER_TYPE_DESC_cc_byz_augustus_agenda_impact: "Wie weit der Kaiser die Agenda des Konsistoriums vorantreiben kann."
 MODIFIER_TYPE_DESC_cc_byz_senior_exarch_agenda_impact: "Wie weit der Seniorpräfekt die Agenda des Konsistoriums vorantreiben kann."
 MODIFIER_TYPE_DESC_cc_byz_exarch_seat_agenda_impact: "Wie weit ein gewöhnlicher Präfekt die Agenda des Konsistoriums vorantreiben kann."
