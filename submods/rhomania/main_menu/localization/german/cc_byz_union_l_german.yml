l_german:
 # Actions
 cc_byz_open_union_contacts: "Kontakte zu Rom aufnehmen"
 cc_byz_open_union_contacts_desc: "Sende Legaten in den Westen, um festzustellen, zu welchen Bedingungen das Papsttum eine Vereinigung in Erwägung ziehen würde. Briefe und Gesandtschaften verpflichten niemanden und können jederzeit bestritten werden, was genau der Grund ist, warum sie der erste und nicht der letzte Schritt sind."
 cc_byz_summon_union_council: "Berufen Sie einen Unionsrat ein"
 cc_byz_summon_union_council_desc: "Berufen Sie ein allgemeines Konzil mit den Lateinern ein, um die Punkte der Doktrin zu klären, die die Kirchen trennen. Das Konzil wird einen Text hervorbringen. Ob dieser Text in Konstantinopel gepredigt werden kann, ist eine separate Frage und wird hier nicht geklärt."
 cc_byz_promulgate_union: "Die Union verkünden"
 cc_byz_promulgate_union_desc: "Lies den Unionsakt in der Hagia Sophia laut vor und verlange vom Klerus der Hauptstadt, ihn zu akzeptieren. Die Unterschrift wurde im Ausland eingeholt. Dies ist der Schritt, der darüber entscheidet, ob er überhaupt eine Bedeutung hat."
 cc_byz_repudiate_union: "Die Union zurückweisen"
 cc_byz_repudiate_union_desc: "Verleugne den Unionsakt. Die Verbundenheit mit der orthodoxen Welt ist wiederhergestellt und die Kirche ist wieder eins. Keine Flotte wird aus dem Westen kommen, und jeder Hof in Italien wird sich daran erinnern, welcher Kaiser unterzeichnet und dann wieder widerrufen hat.\n\nDies ist ein Ende, keine Umkehr. Der Bogen beginnt nicht von vorn."
 cc_byz_clergy_will_attend_tt: "Der [clergy_estate|E] ist durchaus bereit, eine Delegation zu entsenden"

 # Country modifiers
 STATIC_MODIFIER_NAME_cc_byz_union_contacts: "Kontakte zu Rom"
 STATIC_MODIFIER_DESC_cc_byz_union_contacts: "Legaten pendeln hin und her. Es wurde nichts vereinbart, und beide Seiten finden die Mehrdeutigkeit nützlich."
 STATIC_MODIFIER_NAME_cc_byz_union_signed: "Union unterzeichnet"
 STATIC_MODIFIER_DESC_cc_byz_union_signed: "Die Unionsurkunde wurde im Ausland unterzeichnet, aber im Inland nicht verkündet. Der Westen glaubt, das Schisma sei beendet. Die Stadt wurde nicht informiert."
 STATIC_MODIFIER_NAME_cc_byz_union_received: "Union angenommen"
 STATIC_MODIFIER_DESC_cc_byz_union_received: "Die Unionsurkunde wurde in der Hagia Sophia verlesen und die Stadt hat sie akzeptiert. Lateinische Geistliche werden empfangen, lateinisches Kapital ist günstiger, und das Reich kann den Westen um Dinge bitten und diese gelegentlich erhalten."
 STATIC_MODIFIER_NAME_cc_byz_union_rejected: "Union abgelehnt"
 STATIC_MODIFIER_DESC_cc_byz_union_rejected: "Die Urkunde wurde im Ausland unterzeichnet und im Inland abgelehnt. Das Reich trägt nun die Kosten der lateinischen Position sowie die Kosten der orthodoxen, ohne die Vorteile einer von beiden zu genießen."
 STATIC_MODIFIER_NAME_cc_byz_anti_unionist_ferment: "Anti-Unionistisches Gären"
 STATIC_MODIFIER_DESC_cc_byz_anti_unionist_ferment: "Priester, die den Papst nicht mehr erwähnen, Gemeinden, die gehen, wenn sie ihn erwähnt hören, und eine wachsende Zahl von Männern, die zu dem Schluss gekommen sind, dass der Palast das Problem ist."
 STATIC_MODIFIER_NAME_cc_byz_union_repudiated: "Union widerrufen"
 STATIC_MODIFIER_DESC_cc_byz_union_repudiated: "Die Union wurde widerrufen. Die Kirche ist wieder eins, die orthodoxe Welt ist zufrieden und die westlichen Mächte haben das Reich als einen Partner abgeschrieben, auf den man sich nicht verlassen kann."
 STATIC_MODIFIER_NAME_cc_byz_latin_aid: "Lateinische Hilfe"
 STATIC_MODIFIER_DESC_cc_byz_latin_aid: "Männer, Geld und Schiffe aus dem Westen, die eintreffen, weil die Union lange genug hielt, als dass jemand darauf reagieren konnte."

 # Opinion modifiers
 cc_byz_union_negotiating: "Verhandlungen über die Wiedervereinigung"
 cc_byz_union_upheld: "Die Union aufrechterhalten"
 cc_byz_union_undelivered: "Die Union konnte nicht vollzogen werden"
 cc_byz_union_renounced: "Die Union verleugnet"
 cc_byz_submitted_to_rome: "Rom unterstellt"
 cc_byz_held_the_faith: "Am Glauben festgehalten"

 # cc_byz_union.1 - the legates
 cc_byz_union.1.title: "Legaten in den Westen"
 cc_byz_union.1.desc: "Der Vorschlag wurde schon früher gemacht und wird wiederholt werden, und es ist immer derselbe Vorschlag: Die Kirchen sind eine Kirche, sie wurden lediglich vierhundert Jahre lang getrennt verwaltet, und nur eine geringe Anzahl formaler Schwierigkeiten steht zwischen der gegenwärtigen Regelung und einer Wiedervereinigung, die den Westen dazu verpflichten würde, das Überleben des Reiches ernst zu nehmen.\n\nDie geringe Anzahl formaler Schwierigkeiten beträgt vier, und Männer haben ihr Leben lang an jeder einzelnen gearbeitet. Was jetzt entschieden wird, ist nur, wer geht und was sie sagen dürfen, wenn sie ankommen."
 cc_byz_union.1.desc_hellenic: "Der Vorschlag wurde schon früher gemacht. Er wird nun in einer Stadt vorgebracht, die eine Generation damit verbracht hat, zu entscheiden, dass sie griechisch und orthodox ist und dass dies dieselbe Aussage ist; und der Vorschlag klingt in dieser Stadt anders als in der letzten.\n\nDie Schwierigkeiten sind dieselben vier, die es schon immer gab. Was sich geändert hat, ist, dass viele Menschen, die sie einst als technisch bezeichnet hätten, sie nun als das Ganze bezeichnen, und sie werden auf die Legaten warten, wenn diese zurückkehren."
 cc_byz_union.1.a: "Männer, die genau berichten und nichts versprechen werden."
 cc_byz_union.1.b: "Männer, die alles versprechen werden, was die Tür offen hält."
 cc_byz_union.1.c: "Die eigenen Männer des Patriarchen. Die Kirche kann nicht behaupten, man habe sie nicht gefragt."

 # cc_byz_union.2 - Rome's terms
 cc_byz_union.2.title: "Die Bedingungen aus Rom"
 cc_byz_union.2.desc: "Die Antwort ist höflich, weitschweifig in Bezug auf die christliche Brüderlichkeit und vollkommen klar, sobald man die Höflichkeiten beiseite lässt.\n\nRom wird die Wiedervereinigung unter der Bedingung akzeptieren, dass Rom immer im Recht war. Das griechische Ritus darf fortbestehen. Die griechische Position hingegen nicht. Es gibt viele Worte über den Respekt vor den ehrwürdigen Bräuchen der östlichen Kirchen, aber überhaupt keine Andeutung, dass irgendein Punkt der Lehre diskussionswürdig sei.\n\nDies ist keine unvernünftige Position für Rom. Sie ist nur eine, die in dieser Stadt nicht laut vorgelesen werden kann."
 cc_byz_union.2.a: "Lies es der Synode so vor, wie es dort steht."
 cc_byz_union.2.b: "Lass es zuerst großzügig übersetzen."
 cc_byz_union.2.c: "Antworten Sie mit unseren eigenen Bedingungen."

 # cc_byz_union.10 - the council
 cc_byz_union.10.title: "Der Rat tritt zusammen"
 cc_byz_union.10.desc: "Die Delegation ist nach Italien übergesetzt: Bischöfe, der Patriarch, Theologen und eine Reihe von Männern, deren Funktion es ist, präsent zu sein. Die Latiner haben Unterkunft, ein Tagegeld und einen Saal bereitgestellt.\n\nDas erste Thema ist die Prozession des Heiligen Geistes, an der jeder bisherige Versuch gescheitert ist. Das lateinische Glaubensbekenntnis besagt, dass der Geist vom Vater und dem Sohn ausgeht. Das griechische Glaubensbekenntnis besagt, vom Vater. Vierhundert Jahre Streit haben ergeben, dass beide Seiten die Position der anderen perfekt verstehen und keine von ihnen diese einräumen kann, ohne einzuräumen, wer die Autorität hat, dies zu entscheiden."
 cc_byz_union.10.desc_reluctant: "Die Delegation ist nach Italien übergesetzt, und ein großer Teil von ihr wollte eigentlich nicht kommen. Die Zuwendungen der Latiner werden von Männern bezogen, die beabsichtigen, gegen alles zu stimmen, was dadurch gefördert werden sollte, und jeder Beteiligte weiß das.\n\nDas erste Thema ist die Prozession des Heiligen Geistes. Es ist aus privater Sicht der meisten Mitglieder der griechischen Delegation auch das letzte Thema, da sie nicht kamen, um überzeugt zu werden, und dies auf der Reise ausführlich untereinander besprochen haben."
 cc_byz_union.10.a: "Treten Sie beim Filioque bezüglich der Formulierung, nicht der Doktrin, zurück."
 cc_byz_union.10.b: "Treten Sie auch bei den Azymen zurück. Das lateinische Ritus ist gültig."
 cc_byz_union.10.c: "Behalte beides. Lass Rom darum streiten."

 # cc_byz_union.11 - papal primacy
 cc_byz_union.11.title: "Der Primat"
 cc_byz_union.11.desc: "Alles andere war vorläufig. Die Frage ist, ob der Bischof von Rom die Autorität über die gesamte Kirche besitzt oder den ersten Ehrenplatz innerhalb derselben, und es gibt keine Formulierung, die beiden Lesarten zufriedenstellt, ohne bedeutungslos zu sein.\n\nRom war geduldig in Bezug auf das Glaubensbekenntnis und das Brot, weil Rom weder am Glaubensbekenntnis noch am Brot besonders gelegen ist. Dies ist der Punkt, wegen dem die Lateiner gekommen sind, und die griechische Delegation hat dies vom ersten Tag an begriffen."
 cc_byz_union.11.desc_conceded: "Alles andere wurde bereits zugestanden, und die Delegation erkennt nun, was das als Verhandlungsposition wert war, nämlich nichts.\n\nDie Frage ist der Primat: die Autorität über die gesamte Kirche oder der erste Ehrenplatz innerhalb derselben. Nachdem sie beim Glaubensbekenntnis und beim Ritus nachgegeben haben, kommen die Griechen zu diesem Punkt ohne weitere Verhandlungsmasse an, und die Lateiner haben die Tagesordnung genau daraufhin ausgerichtet."
 cc_byz_union.11.a: "Erkenne es an, unter Vorbehalt der Rechte der östlichen Patriarchen."
 cc_byz_union.11.b: "Biete einen Ehrenprimat an. Lass sie entscheiden, ob sie ihn annehmen oder ablehnen."
 cc_byz_union.11.c: "Brechen Sie ab. Dies kann nicht in der Hagia Sophia gepredigt werden."

 # cc_byz_union.12 - signed
 cc_byz_union.12.title: "Der Akt der Union"
 cc_byz_union.12.desc: "Es ist unterzeichnet. In den lateinischen Kirchen läuten die Glocken, das Dekret wird in zwei Sprachen verlesen und das Schisma wird nach vierhundertundelf Jahren für beendet erklärt.\n\nDie griechische Delegation unterzeichnet und kehrt dann fast wie ein einziger Mann in ihre Unterkünfte zurück, ohne zu feiern. Einige von ihnen verfassen bereits den Bericht, den sie bei ihrer Rückkehr abgeben werden. Einer hat die Unterschrift ganz verweigert, und die Latiner haben richtigerweise entschieden, dass es besser ist, daraus kein Thema zu machen."
 cc_byz_union.12.desc_bought: "Es ist unterzeichnet, von Männern, die dafür bezahlt wurden, anwesend zu sein, und die Latiner haben bemerkt, welche der Unterschriften schnell gesetzt wurden.\n\nDas Dekret wird in zwei Sprachen verlesen und das Schisma wird für beendet erklärt. Die griechische Delegation zieht sich ohne Zeremonie in ihre Unterkünfte zurück. Einige von ihnen entwerfen bereits die Erklärung, die sie in ihrer Heimat abgeben werden, und die Erklärung ist in den meisten Fällen, dass sie unter Zwang, in einer fremden Stadt und mit einer lateinischen Zuwendung unterschrieben haben und dass nichts, was unter diesen Bedingungen unterzeichnet wurde, die Kirche bindet."
 cc_byz_union.12.a: "Es ist vollbracht. Nun muss es in die Heimat getragen werden."

 # cc_byz_union.13 - collapse
 cc_byz_union.13.title: "Der Rat löst sich auf"
 cc_byz_union.13.desc: "Es gibt kein Dekret. Die Delegation kehrt mit bezahlten Reisekosten und ohne weitere Einigung heim, und die Lateiner lassen wissen, dass die Griechen einen sehr weiten Weg zurückgelegt haben, um das abzulehnen, wovon ihnen bereits gesagt wurde, dass es erforderlich sein würde.\n\nIn Konstantinopel wird dies als Verteidigung des Glaubens berichtet werden, und das ist es auch. Es ist jedoch auch das Ende, zumindest für diese Regierungszeit, jeder Aussicht, dass eine westliche Flotte aus anderen Gründen als dem Handel im Bosporus erscheint."
 cc_byz_union.13.a: "Die Kirche ist intakt. Sagen Sie das laut."
 cc_byz_union.13.b: "Behalte die Gesandtschaft in Italien. Dies wird erneut versucht werden."

 # cc_byz_union.20 - promulgation
 cc_byz_union.20.title: "Verkündung in der Hagia Sophia"
 cc_byz_union.20.desc: "Das Dekreten soll in der Großen Kirche auf Griechisch vor dem Klerus und dem Volk der Hauptstadt verlesen werden, und des Papstes soll in der Liturgie namentlich gedacht werden.\n\nDer zweite Teil ist der Teil, auf den es ankommt. Ein in Italien unterzeichnetes Dokument ist ein Dokument. Ein Name, der in der Liturgie in der Hagia Sophia ausgesprochen wird, bedeutet, dass die Kirche es sagt, und jede Person im Gebäude wird den Unterschied verstehen."
 cc_byz_union.20.desc_softened: "Das Dekret soll in der Großen Kirche auf Griechisch verlesen werden, und des Papstes soll in der Liturgie namentlich gedacht werden.\n\nEs gibt eine Schwierigkeit, die noch nicht öffentlich bekannt geworden ist. Der im Inland verbreitete Text wurde mit einer gewissen Großzügigkeit übersetzt, und der Text, der nun verlesen werden muss, ist derjenige, der tatsächlich unterzeichnet wurde. Eine Reihe von Männern in diesem Gebäude haben das Lateinische erhalten. Sie haben die beiden Texte seit einigen Wochen verglichen und haben genau auf diesen Anlass gewartet."
 cc_byz_union.20.desc_hostile: "Das Dekret soll in der Großen Kirche verlesen werden, und die Stimmung in der Stadt wurde dem Palast in Worten gemeldet, die keinen Raum für Interpretationen lassen.\n\nDie Klöster haben sich dagegen ausgesprochen. Priester in der Hauptstadt haben öffentlich erklärt, dass sie den Papst nicht mehr gedenken und nicht mit denen dienen werden, die es tun. Dem Kaiser wurde von Leuten, deren Aufgabe es ist, Bescheid zu wissen, vorgeschlagen, dass die Verlesung verschoben werden sollte. Es gibt kein Datum, an dem sie besser aufgenommen würde. Das ist die Schwierigkeit."
 cc_byz_union.20.a: "Lies es vor. Lass die Einwände im Anschluss zu Gehör kommen."
 cc_byz_union.20.b: "Lies es vor. Verhafte jeden, der unterbricht."
 cc_byz_union.20.c: "Lies es selbst vor und antworte ihnen von der Ambo aus."

 # cc_byz_union.21 - reception
 cc_byz_union.21.title: "Was die Stadt tat"
 cc_byz_union.21.desc_rejected: "Es hat nicht gegriffen. Die Verlesung wurde abgeschlossen, was das Meiste ist, was man darüber sagen kann.\n\nDie Klöster haben die Union kategorisch abgelehnt. Ein Großteil des Gemeindeklerus der Hauptstadt wird den Papst nicht mehr gedenken, und die Gemeinden haben deutlich gemacht, welcher Liturgie sie beiwohnen werden und aus welcher sie hinausgehen. Kirchen, in denen die Union eingehalten wird, leeren sich. Kirchen, in denen dies nicht geschieht, sind voll.\n\nDer Akt ist Gesetz, aber er entspricht nicht der Praxis der Kirche in dieser Stadt, und jeder, einschließlich des Kaisers, weiß nun, dass dieser Unterschied dauerhaft ist."
 cc_byz_union.21.desc_accepted: "Es hat gegriffen, was eine Reihe von Leuten überraschte, die das Gegenteil ausführlich vorhergesagt hatten.\n\nDie Verlesung wurde abgeschlossen, des Papstes wurde gedacht und die Einwände wurden von Männern erhoben, die dann in ihre Kirchen zurückkehrten und die Liturgie vollzogen. Die Klöster sind unzufrieden und haben dies schriftlich und ausführlich mitgeteilt, sind aber nicht weitergegangen. Die Stadt hat im Großen und Ganzen entschieden, dass eine von einem Konzil vereinbarte Formel eine Angelegenheit für Konzilien ist.\n\nDie Union ist die Praxis der Kirche hier. Das war seit vor der Plünderung der Stadt nicht mehr der Fall."
 cc_byz_union.21.desc_divided: "Es hat halb gegriffen, was das übliche Schicksal solcher Dinge ist und am schwersten zu regieren ist.\n\nEinige Kirchen gedenken des Papstes, einige nicht. Einige Geistliche werden mit den Unionisten dienen und einige nicht, und diejenigen, die es nicht tun, sind im Allgemeinen diejenigen mit den größeren Gemeinden. Die Klöster haben abgelehnt und wurden nicht zur Compliance gezwungen.\n\nNichts ist zerbrochen. Aber es hat sich auch nichts gefestigt, und jede Besetzung jedes Bistums ist nun eine Entscheidung über die Union, unabhängig davon, ob der Palast es so beabsichtigt oder nicht."
 cc_byz_union.21.a: "So steht es fest."

 # cc_byz_union.22 - the ferment
 cc_byz_union.22.title: "Das Gären"
 cc_byz_union.22.desc: "Der Widerstand ist nicht abgeklungen und es geht nicht mehr nur um den Filioque.\n\nWas als dogmatischer Einwand unter Theologen begann, ist nun die gewöhnliche Meinung der Hauptstadt, und es hat auf seinem Weg alle anderen Beschwerden gesammelt: die Steuern, die Italiener im Hafen, die Ämter, die gekauft und verkauft werden, das allgemeine Gefühl, dass der Palast seit einem Jahrhundert Zugeständnisse macht und jedes Zugeständnis als notwendig bezeichnet. Die Union ist einfach die einzige Sache, die die Menschen beim Namen nennen können."
 cc_byz_union.22.desc_forced: "Die Verhaftungen haben die Sache nicht geklärt. Das tun sie selten, und diesmal haben sie dem Widerstand das eine geliefert, das ihm fehlte: Personen, auf die man zeigen kann.\n\nÜber die Geistlichen, die bei der Verkündung gefangen genommen wurden, wird in den Klöstern in Begriffen gesprochen, die normalerweise Bekennern vorbehalten sind. Ihre Namen sind in Gemeinden bekannt, die vor einem Jahr noch keine Meinung zum Filioque hatten. Unabhängig von den Vorzügen der Union ist sie nun das Banner für jede Beschwerde in der Stadt, und der Palast hat sie dorthin gesetzt."
 cc_byz_union.22.a: "Setzen Sie es durch. Entziehen Sie den Einwendenden die Rechte, ernennen Sie Unionisten."
 cc_byz_union.22.b: "Es möge auf beide Arten gepredigt werden."
 cc_byz_union.22.c: "Weisen Sie den lautesten von ihnen ein fernes Bistum zu."

 # cc_byz_union.30 - repudiation
 cc_byz_union.30.title: "Die Union verleugnen"
 cc_byz_union.30.desc: "Der Akt ist zu widerrufen. Da die Union durch einen allgemeinen Konzil beschlossen wurde, gibt es dafür kein festgeschriebenes Verfahren; daher wird der Widerruf die Form annehmen, die der Palast ihm gibt, und der Palast wird betonen, dass diese Form ausreichend sei.\n\nRom wird nicht zustimmen. Roms Zustimmung war in diesem Punkt nie zu erwarten, und sie einzufordern würde die Angelegenheit nur verzögern."
 cc_byz_union.30.desc_failed: "Der Akt ist zu widerrufen, und die einzige wirkliche Frage ist, warum es so lange gedauert hat.\n\nSeit dem Tag seiner Verlesung ist er in der Kirche dieser Stadt nicht mehr praktiziert worden. Der Klerus hält ihn nicht ein, die Gemeinden besuchen keine Gottesdienste, in denen er befolgt wird, und der Palast hat Jahre damit verbracht, eine rechtliche Fiktion aufrechtzuerhalten, die ihn Ansehen im eigenen Land kostet und ihm im Ausland nichts gebracht hat, da der Westen sehr wohl sehen kann, dass die Union hier nicht in Kraft ist.\n\nEin Widerruf ändert nichts an dem, was in den Kirchen geschieht. Er ändert nur das, was der Kaiser vorzutäuschen versucht."
 cc_byz_union.30.desc_held: "Der Akt ist zu widerrufen, und dies ist ein schwierigeres Unterfangen, als es vor zehn Jahren gewesen wäre, da die Union gefestigt wurde.\n\nDie Kirchen befolgen sie. Der Klerus hat seinen Frieden damit geschlossen, und eine ganze Generation von ihnen wurde geweiht, ohne etwas anderes gekannt zu haben. Es gibt Männer, die sich – unter persönlichen Opfern – davon überzeugen ließen, dass dies richtig sei, und denen wird nun mitgeteilt, dass der Palast seine Meinung geändert hat.\n\nDer Westen hingegen hat das Reich als Partner behandelt. Das endet mit dieser Bekanntgabe."
 cc_byz_union.30.a: "Verleugne es schlichtweg. Lass die Aufzeichnungen so stehen."
 cc_byz_union.30.b: "Verleugne es und gib den Legaten die Schuld, die unterschrieben haben."
 cc_byz_union.30.c: "Verleugne den Text. Behalte die Gesandtschaft in Rom bei."

 # cc_byz_union.31 - the west reacts
 cc_byz_union.31.title: "Der Westen zieht seine Schlüsse"
 cc_byz_union.31.desc: "Die Reaktion ist nicht Zorn, mit dem man arbeiten könnte. Es ist die gefestigte Schlussfolgerung, dass das Reich nicht liefern kann, was seine Kaiser unterschreiben, und dass alles, was in Italien vereinbart wird, in Konstantinopel von Menschen zunichtegemacht wird, die der Kaiser nicht kontrolliert.\n\nDie praktische Folge ist, dass keine Vorschläge mehr eintreffen. Niemand erklärt mehr etwas. Die Korrespondenz wird einfach kürzer, dann formeller und schließlich sporadisch, und die Männer, die in Rom früher argumentierten, dass es sich lohne, den Griechen zu helfen, haben damit aufgehört, weil sie verloren haben."
 cc_byz_union.31.a: "Akzeptiere es. Wir halten, was wir halten, mit dem, was wir haben."
 cc_byz_union.31.b: "Blicken wir nach Osten und Süden. Andere kümmern sich nicht darum, was wir predigen."

 # cc_byz_union.40 - the payoff
 cc_byz_union.40.title: "Wozu die Union diente"
 cc_byz_union.40.desc: "Die Union hielt lange genug, um geglaubt zu werden, und der Glaube hat Ergebnisse hervorgebracht, was zu Beginn nicht versprochen werden konnte.\n\nEs gibt Geld, das im Westen für die Verteidigung der östlichen Kirche gesammelt wurde, und es wurde tatsächlich geschickt, anstatt nur angekündigt zu werden. Es gibt Männer: keine Armee, sondern Kompanien von ihnen, und Kapitäne, die bezahlt wurden, um sie zu führen. Es gibt einen päpstlichen Legaten in der Hauptstadt, der in seinen Briefen nach Hause die Sache des Reiches vertritt, anstatt über dessen Mängel zu berichten.\n\nNichts davon wäre zu einem Schismatiker gelangt. Das war immer das Argument, und hier wird es bewiesen."
 cc_byz_union.40.a: "Nimm die Männer und das Geld."
 cc_byz_union.40.b: "Bitten Sie sie, unseren Anspruch auf die östlichen Sitze geltend zu machen."
 cc_byz_union.40.c: "Bitten Sie den Papst, die Angelegenheit unserer Regalien zur Sprache zu bringen."
