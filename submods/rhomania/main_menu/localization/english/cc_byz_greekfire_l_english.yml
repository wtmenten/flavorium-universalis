l_english:
 # The Greek Fire chain, fired by the cc_byz_task_greek_fire mission task.
 #
 # The historical position, which the text holds to: the composition was a state secret
 # restricted to the Kallinikos family and the imperial arsenal, it was already unreliable by
 # the twelfth century, and it was lost through ordinary bureaucratic attrition rather than any
 # catastrophe. Nobody burned the recipe. It simply stopped being written down by people who
 # knew what they were writing.

 cc_byz_fire.1.title: "The Liquid Fire"
 cc_byz_fire.1.desc: "The ceremonial books describe it. The chronicles describe it. Anna Komnene describes the bronze beasts' heads on the prows and the fire that came out of them, and she was writing two hundred years ago about something her father's fleet still carried.\n\nNobody in the arsenal can make it.\n\nThe secret was held by one family and by the imperial workshops, and it was never written down in one place on purpose. What survives is scattered: a note on quantities here, a remark about the pumps there, a monastery inventory that lists an ingredient nobody now recognises. The Droungarios thinks it could be reassembled. He is not certain, and he is not the sort of man who says so lightly."
 cc_byz_fire.1.desc_lettered: "The ceremonial books describe it, the chronicles describe it, and for once there are men in this city who can read all of them.\n\nThe secret was held by one family and by the imperial workshops, and it was never committed to a single document on purpose. What survives is scattered across four centuries of notes, inventories and marginal remarks. Assembling it is not a question of discovery but of scholarship, which is the one commodity the capital has never run short of.\n\nThe Droungarios has brought the relevant volumes. There are a great many of them."
 cc_byz_fire.1.desc_already: "The arsenal already has it.\n\nThe siphons are cast, the crews know the drill, and the composition sits in the workshop ledger under a name that means nothing to anyone who has not been shown. What the fleet does not have is the money to build enough of them, and that is a problem the treasury can solve."
 cc_byz_fire.1.a_already: "Then fund the arsenal properly."
 cc_byz_fire.1.a: "Set the scholars to it."
 cc_byz_fire.1.b: "Send to the monasteries."
 cc_byz_fire.1.c: "There is a man in the prison camp who built siphons."
 cc_byz_fire.1.d: "The empire has managed four hundred years without it."

 cc_byz_fire.2.title: "The Siphon Trials"
 cc_byz_fire.2.desc: "They have something. Whether it is the right something is another question, and the way to find out involves a barge, a stretch of the Golden Horn well away from anything valuable, and a crew who have been told what the pay is before they were told what the work is.\n\nThe first three trials produce a great deal of smoke. The fourth produces the thing itself, clinging to the water and burning on it, and the crew on the barge go very quiet.\n\nThe Droungarios wants a second arsenal built before this goes any further. He points out, correctly, that the last time an emperor economised on the fleet the empire spent the next fifty years renting Genoese ships."
 cc_byz_fire.2.desc_archive: "The monks were not pleased to be asked and less pleased to be right. The relevant passage was in a twelfth-century inventory of naval stores at Abydos, copied by someone who plainly did not understand what he was copying and who therefore transcribed it exactly.\n\nThe first three trials produce a great deal of smoke. The fourth produces the thing itself, clinging to the water and burning on it, and the crew on the barge go very quiet.\n\nThe Droungarios wants a second arsenal built before this goes any further."
 cc_byz_fire.2.desc_captive: "The engineer talks. He talks a great deal, in fact, and about more than he was asked, which is the difficulty: a man who sells one secret has established what he does for a living.\n\nThe first three trials produce a great deal of smoke. The fourth produces the thing itself, clinging to the water and burning on it, and the crew on the barge go very quiet.\n\nThe Droungarios wants a second arsenal built before this goes any further, and he wants the engineer housed somewhere with a wall around it."
 cc_byz_fire.2.a: "The one arsenal will serve."
 cc_byz_fire.2.b: "Build the second, and put a guard on both."

 cc_byz_fire.3.title: "The Fire Restored"
 cc_byz_fire.3.desc: "The composition is written down. Not in one place: in three, held separately, by men who do not know each other's names, which is roughly the arrangement the empire had before and rather better documented.\n\nThe siphons are cast in bronze at the arsenal. The crews train through the winter, badly at first and then not badly, and by spring there are galleys in the Horn with the beasts' heads on their prows that Anna Komnene described.\n\nIt is a weapon and it is also an argument. The fleet that carried it was the fleet that broke two Arab sieges of this city, and everyone on the Mediterranean who has read a chronicle knows that."
 cc_byz_fire.3.desc_leaked: "The composition is written down, in three places, held separately, by men who do not know each other's names.\n\nIt is also, the Droungarios reports without meeting the emperor's eye, written down in Genoa. Or Venice. Possibly both. Something went out with the shipwrights or the ledgers or a clerk who was owed money, and there is no point now in finding out which.\n\nThe siphons are cast regardless, and the crews train through the winter, and by spring there are galleys in the Horn with the beasts' heads on their prows. The empire has its fire back. It simply no longer has it alone, which is a different weapon from the one Constantine IV had, and worth remembering before it is relied upon."
 cc_byz_fire.3.a: "Cast the siphons."

 cc_byz_fire_unlocked_tt: "Unlocks Greek Fire galleys and Greek Fire infantry"

 # ---- The generic-action twin ----
 # Mission packs default to OFF, so this is how most players reach the chain.
 cc_byz_recover_greek_fire: "Recover the Liquid Fire"
 cc_byz_recover_greek_fire_desc: "Set the arsenal and the scholars to reassembling the composition. It was never written down in one place, which is why it was lost and why it can be found."
