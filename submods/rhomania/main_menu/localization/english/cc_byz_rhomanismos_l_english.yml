l_english:
 # Tagmata units
 a_cc_byz_tagmata_1: "Tagmata"
 a_cc_byz_tagmata_1_desc: "The standing regiments of the capital, paid from the treasury rather than raised from the land. Unlike the thematic levies they can be moved and committed at the emperor's word, and unlike the Varangians they are not confined to the palace. They trade the weight of a legionary line for the speed to reach a battle while it still matters."
 a_cc_byz_tagmata_2: "$a_cc_byz_tagmata_1$"
 a_cc_byz_tagmata_2_desc: "$a_cc_byz_tagmata_1_desc$"
 a_cc_byz_tagmata_3: "$a_cc_byz_tagmata_1$"
 a_cc_byz_tagmata_3_desc: "$a_cc_byz_tagmata_1_desc$"
 a_cc_byz_tagmata_4: "$a_cc_byz_tagmata_1$"
 a_cc_byz_tagmata_4_desc: "$a_cc_byz_tagmata_1_desc$"
 a_cc_byz_tagmata_5: "$a_cc_byz_tagmata_1$"
 a_cc_byz_tagmata_5_desc: "$a_cc_byz_tagmata_1_desc$"
 a_cc_byz_tagmata_6: "$a_cc_byz_tagmata_1$"
 a_cc_byz_tagmata_6_desc: "$a_cc_byz_tagmata_1_desc$"

 # Tagmata cap modifier
 MODIFIER_TYPE_NAME_cc_num_of_tagmata_modifier: "Tagmata Regiments"
 MODIFIER_TYPE_DESC_cc_num_of_tagmata_modifier: "This changes how many [ShowUnitTypeName('a_cc_byz_tagmata_1')] regiments may be maintained at once."

 # Rhomanismos advances
 cc_byz_unlock_tagmata_advance: "$a_cc_byz_tagmata_1$"
 cc_byz_unlock_tagmata_advance_desc: "$a_cc_byz_tagmata_1_desc$"

 cc_byz_taxis_of_offices: "Order of Precedence"
 cc_byz_taxis_of_offices_desc: "Rome answered the problem of powerful men with a Senate. We answer it with a list. Every dignity has its place in the order of precedence, its salary, its seat at table, and its ceremonial duties. Rank is not inherited and not bought: it is granted, and it can be withdrawn."

 cc_byz_oikonomia: "Oikonomía"
 cc_byz_oikonomia_desc: "The canons are strict, and the Church has always known when not to apply them. Oikonomía is the principle of dispensation: where rigour would cost the flock more than the fault, the bishop may relax the rule. Applied to government, it means a state that can tolerate what it cannot yet correct."

 cc_byz_tagmata_restored: "The Tagmata Restored"
 cc_byz_tagmata_restored_desc: "The thematic levies answer to the men who hold their land. The tagmata answer to the treasury that pays them. Restoring the standing regiments is expensive and it is the only way an emperor keeps an army that is his rather than his magnates'."

 cc_byz_palaiologan_revival: "The Palaiologan Revival"
 cc_byz_palaiologan_revival_desc: "The mosaics at the Chora, the histories, the recovered manuscripts of the ancients: a genuine flowering of Greek letters and art, undertaken by a state that could no longer afford it. Later ages will call it the last light of Constantinople. Those living through it simply called it work."

 cc_byz_basilika: "The Basilika"
 cc_byz_basilika_desc: "Justinian's code was compiled in Latin for a court that no longer speaks it. The Basilika are the same law in Greek, arranged for the courts that actually use it. Nothing new is decreed; a great deal becomes enforceable."

 cc_byz_annona: "The Annona"
 cc_byz_annona_desc: "The grain fleet reaches the capital or the capital riots. This has been true since the city was founded and no emperor has found a way around it. Securing the dole is not generosity, it is the price of governing from Constantinople."

 cc_byz_ecumenical_office: "The Ecumenical Office"
 cc_byz_ecumenical_office_desc: "Rome made citizens by law and could count them. We make Rhomaioi by faith and allegiance, which is slower, vaguer, and harder to revoke. A Slav, an Armenian or a Vlach who is Orthodox and obeys the emperor is as Roman as anyone in the city."

 cc_byz_dromos: "The Public Post"
 cc_byz_dromos_desc: "Rome built the roads. What we have kept running on them is the dromos: the relay stations, the remount horses, the couriers, and the officials whose whole business is knowing how long a message takes. Roads decay. A schedule can be maintained."

 cc_byz_thematic_administration: "Thematic Administration"
 cc_byz_thematic_administration_desc: "A theme is a province that raises and pays for its own soldiers from its own land. It is how the empire survived the centuries when it could not afford anything else, and it remains the arrangement that reaches furthest from the capital for the least money."

 cc_byz_autokrator: "Autokrátor"
 cc_byz_autokrator_desc: "The title does not claim boundless dominion. It claims that within what the emperor already holds there is no other authority, no partner, and no appeal. An empire that cannot expand can still be made whole."

 cc_byz_great_church: "The Great Church"
 cc_byz_great_church_desc: "Hagia Sophia has stood for eight hundred years because every generation has paid to keep it standing. The dome has fallen once and been rebuilt. The lesson taken from this is not how to build, but how to maintain."
