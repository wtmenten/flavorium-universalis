l_english:
 # Societal value: Taxis vs Dynatoi
 cc_taxis_focus: "Táxis"
 cc_dynatoi_focus: "Dynatoí"
 cc_taxis_vs_cc_dynatoi: "$cc_taxis_focus$ vs $cc_dynatoi_focus$"
 cc_taxis_vs_cc_dynatoi_desc: "A [country|e] ordered by $cc_taxis_focus$ governs through the fisc and the imperial bureaus: salaried officials, assessed taxes, and a court that appoints and dismisses at will. One shaped by $cc_dynatoi_focus$ governs through its provincial families, who hold the land, raise the soldiers, and expect the [ShowPopTypeName('nobles')] to be consulted rather than instructed."

 # Drift modifier types
 MODIFIER_TYPE_NAME_monthly_towards_cc_taxis: "Monthly Progress to Táxis"
 MODIFIER_TYPE_DESC_monthly_towards_cc_taxis: "This impacts the change towards the [ShowSocietyDirectionName('cc_taxis')] [societal_value|e]."
 MODIFIER_TYPE_NAME_monthly_towards_cc_dynatoi: "Monthly Progress to Dynatoí"
 MODIFIER_TYPE_DESC_monthly_towards_cc_dynatoi: "This impacts the change towards the [ShowSocietyDirectionName('cc_dynatoi')] [societal_value|e]."

 # Static modifiers
 STATIC_MODIFIER_NAME_cc_taxis_progress_cabinet_efficiency: "Cabinet Focus"
