 # Country modifiers
 STATIC_MODIFIER_NAME_cc_byz_staffed_by_career_clerks: "Career Clerks"
 STATIC_MODIFIER_DESC_cc_byz_staffed_by_career_clerks: "The posts are salaried and the men in them owe their position to the office rather than to a family."
 STATIC_MODIFIER_NAME_cc_byz_offices_are_property: "Offices Are Property"
 STATIC_MODIFIER_DESC_cc_byz_offices_are_property: "Posts are inherited and sold as a matter of course. Nobody decreed this. The crown still collects, but it no longer decides who serves."
 STATIC_MODIFIER_NAME_cc_byz_retrenched_bureaus: "Retrenched Bureaus"
 STATIC_MODIFIER_DESC_cc_byz_retrenched_bureaus: "Fewer posts, still salaried, still the crown's."

 # cc_byz_bureaucracy.1 - staffing a new bureau
 cc_byz_bureaucracy.1.title: "Staffing the New Bureau"
 cc_byz_bureaucracy.1.desc: "The office exists on parchment. Now it needs men.\n\nThe [ROOT.GetCountry.GetGovernment.GetEstateName('burghers_estate')] can supply clerks who have spent their lives learning the forms and will spend the rest of them applying it. The great families have sons who need positions and have made it known that they expect to be asked. Both routes fill the desks. They fill them with men who answer to different people."
 cc_byz_bureaucracy.1.desc_venal: "The office exists on parchment. Now it needs men, and the question of how posts are filled is no longer an open one.\n\nEveryone with business before the palace already knows what a position costs and roughly who to approach. The clerks know it too. What remains to be decided is only whether the treasury takes its share openly or leaves it to the men who will take it anyway."
 cc_byz_bureaucracy.1.desc_purged: "The office exists on parchment and the desks are empty, which is not an accident. The men who sat at them were removed, and the manner of their removal is still discussed in the quarters where clerks live.\n\nThe great families have sons available and are being noticeably gracious about it. The salaried men are also available and are asking, through intermediaries, what assurances exist that a career in the service is a career. There is no good answer to that question. The palace made sure of it."
 cc_byz_bureaucracy.1.a: "Salaried clerks. The office must outlive the man."
 cc_byz_bureaucracy.1.b: "The great families have sons to place."
 cc_byz_bureaucracy.1.c: "Sell the posts. The treasury may as well take its share."

 # cc_byz_bureaucracy.10 - dissolving a bureau
 cc_byz_bureaucracy.10.title: "A Bureau Is Dissolved"
 cc_byz_bureaucracy.10.desc: "The office is closed. Its records go to the archive, its rooms to whoever asks first, and its staff nowhere in particular.\n\nThey are not a large number of men. They are, however, a number of men who know precisely how the palace works, who have families to feed, and who are now available."
 cc_byz_bureaucracy.10.desc_sold: "The office is closed, which raises a question nobody wants to put in writing: these men paid for their positions.\n\nThey did not buy a salary. They bought a claim, and they are entirely clear that the claim was on the empire rather than on a particular set of rooms. They will want it honoured somewhere else."
 cc_byz_bureaucracy.10.a: "Find them places elsewhere in the service."
 cc_byz_bureaucracy.10.b: "Thank them and dismiss them."
 cc_byz_bureaucracy.10.c: "Make an example of the worst of them."

 # cc_byz_bureaucracy.20 - underfunded bureaus
 cc_byz_bureaucracy.20.title: "The Bureaus Are Not Being Paid"
 cc_byz_bureaucracy.20.desc: "The salaries are months behind and the work has not stopped, which ought to be reassuring and is not.\n\nAn unpaid official does not go home. He stays at his desk and finds another way to be compensated for sitting at it, and the men who come to that desk learn quickly what the new arrangement is. By the time the treasury catches up, the arrangement will be the custom, and custom in this empire is very difficult to repeal."
 cc_byz_bureaucracy.20.a: "Pay them. Whatever it costs."
 cc_byz_bureaucracy.20.b: "They will manage. They always do."
 cc_byz_bureaucracy.20.c: "Fewer posts, properly funded."

 # cc_byz_bureaucracy.30 - palace service against the army
 cc_byz_bureaucracy.30.title: "The Palace and the Commanders"
 cc_byz_bureaucracy.30.desc: "The quarrel is over a supply contract and it is not about a supply contract.\n\nThe eunuchs of the palace service point out, accurately, that the accounts do not balance and that the men who signed them are the same men who profit. The commanders point out, also accurately, that they are the ones who will be standing in the line when the accounting is finished, and that they have never yet been reinforced by a ledger.\n\nBoth are waiting to see which of them the emperor is prepared to be seen agreeing with."
 cc_byz_bureaucracy.30.a: "The accounts will balance. See to it."
 cc_byz_bureaucracy.30.b: "The men who fight are owed the benefit of the doubt."
 cc_byz_bureaucracy.30.c: "Say nothing. Let them wonder."

 # cc_byz_bureaucracy.40 - entrenched and unfunded
 cc_byz_bureaucracy.40.title: "A Bureau That Feeds Itself"
 cc_byz_bureaucracy.40.desc: "The office has not been properly funded in years and has not shrunk by a single clerk, which ought to have raised a question at the treasury long before now.\n\nIt is answered easily enough. The men in it are paid, simply not by us. Fees are charged for services that were once free, and the fees are collected by a family whose name appears on nothing and whose consent is required for everything. The office still does its work. It no longer does it for the emperor."
 cc_byz_bureaucracy.40.desc_venal: "The office has not been properly funded in years and has not shrunk by a single clerk, and at this point nobody in the palace pretends to be surprised.\n\nWhat is new is only the confidence. The family that runs it has stopped concealing the arrangement and begun defending it, on the reasonable grounds that they have kept the work going at their own expense while the treasury did not. They are not wrong. That is the difficulty."
 cc_byz_bureaucracy.40.a: "Fund it properly. It is ours or it is nobody's."
 cc_byz_bureaucracy.40.b: "Break it up and scatter the clerks."
 cc_byz_bureaucracy.40.c: "Sell them the office outright."

 # cc_byz_bureaucracy.50 - entrenched and funded
 cc_byz_bureaucracy.50.title: "An Office That Works"
 cc_byz_bureaucracy.50.desc: "Salaries arrive on time, the records are where the index says they are, and men who joined as junior clerks are still there thirty years on with no ambition to be anywhere else.\n\nIt is not a dramatic achievement and no chronicle will record it. But a request entering this office is answered, and answered the same way regardless of who is asking, which is more than can be said for most of the empire's dealings with its own subjects."
 cc_byz_bureaucracy.50.a: "Reorganise the other bureaus to match."
 cc_byz_bureaucracy.50.b: "Let its reputation do the work."
 cc_byz_bureaucracy.50.c: "An office this secure answers to itself. Loosen it."

 # cc_byz_bureaucracy.60 - a funding cut lands
 cc_byz_bureaucracy.60.title: "The Cut Is Announced"
 cc_byz_bureaucracy.60.desc: "The reduction was decided in an afternoon and will be understood within a week.\n\nNo one resigns. The work continues, at first exactly as before, and then in the way that unpaid work continues everywhere: the urgent business still moves, and the business that moves is whatever someone has a reason to push. Nobody will report this and everybody will adapt to it."
 cc_byz_bureaucracy.60.a: "It cannot be helped."
 cc_byz_bureaucracy.60.b: "Announce it as a reform."

