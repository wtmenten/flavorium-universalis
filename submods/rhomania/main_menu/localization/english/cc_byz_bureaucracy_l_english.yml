l_english:
 # Bureaucracies
 cc_byz_genikon: "Logothesion tou Genikou"
 cc_byz_genikon_desc: "The general treasury: assessment, collection, audit. It employs more men than any other office in the palace and none of them are famous. Every other instrument of imperial authority is paid for out of what this one manages to bring in."
 cc_byz_epi_ton_deeseon: "Epi tōn Deēseōn"
 cc_byz_epi_ton_deeseon_desc: "The Master of Petitions. A standing office through which a farmer in Thrace may appeal past the man who owns his valley, directly to the palace. It is inexpensive to establish and it is resented exactly in proportion to how well it works."
 cc_byz_oikeioi: "The Oikeioi"
 cc_byz_oikeioi_desc: "The emperor's own men: household intimates handed provincial commands on the strength of personal favour rather than office. Decisions arrive quickly and the right people are always reachable. It also teaches every ambitious man in the empire that proximity to the emperor outranks any title he could earn."

