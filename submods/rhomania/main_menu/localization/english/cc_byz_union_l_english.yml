l_english:
 # Actions
 cc_byz_open_union_contacts: "Open Contacts with Rome"
 cc_byz_open_union_contacts_desc: "Send legates west to establish what terms of reunion the papacy would entertain. Letters and embassies commit nobody and can be disavowed at any point, which is precisely why they are the first step and not the last."
 cc_byz_summon_union_council: "Summon a Council of Union"
 cc_byz_summon_union_council_desc: "Convene a general council with the Latins to settle the points of doctrine that divide the churches. The council will produce a text. Whether the text can be preached in Constantinople is a separate question and it is not settled here."
 cc_byz_promulgate_union: "Promulgate the Union"
 cc_byz_promulgate_union_desc: "Read the act of union aloud in Hagia Sophia and require the clergy of the capital to accept it. The signature was obtained abroad. This is the step that decides whether it means anything."
 cc_byz_repudiate_union: "Repudiate the Union"
 cc_byz_repudiate_union_desc: "Renounce the act of union. Standing with the Orthodox world is restored and the church is whole again. No fleet is coming from the west, and every court in Italy will remember which emperor signed and then unsigned.\n\nThis is an ending, not a reversal. The arc does not begin again."
 cc_byz_clergy_will_attend_tt: "The [clergy_estate|E] are willing enough to send a delegation"

 # Country modifiers
 STATIC_MODIFIER_NAME_cc_byz_union_contacts: "Contacts with Rome"
 STATIC_MODIFIER_DESC_cc_byz_union_contacts: "Legates go back and forth. Nothing has been agreed and both sides find the ambiguity useful."
 STATIC_MODIFIER_NAME_cc_byz_union_signed: "Union Signed"
 STATIC_MODIFIER_DESC_cc_byz_union_signed: "The act of union has been signed abroad and has not been promulgated at home. The west believes the schism is over. The city has not been told."
 STATIC_MODIFIER_NAME_cc_byz_union_received: "Union Received"
 STATIC_MODIFIER_DESC_cc_byz_union_received: "The act of union was read in Hagia Sophia and the city accepted it. Latin clergy are received, Latin credit is cheaper, and the empire can ask the west for things and occasionally be given them."
 STATIC_MODIFIER_NAME_cc_byz_union_rejected: "Union Rejected"
 STATIC_MODIFIER_DESC_cc_byz_union_rejected: "The act was signed abroad and refused at home. The empire now carries the costs of the Latin position and the costs of the Orthodox one, and holds the benefits of neither."
 STATIC_MODIFIER_NAME_cc_byz_anti_unionist_ferment: "Anti-Unionist Ferment"
 STATIC_MODIFIER_DESC_cc_byz_anti_unionist_ferment: "Priests who will not commemorate the Pope, congregations that leave when they hear him commemorated, and a growing number of men who have concluded that the palace is the problem."
 STATIC_MODIFIER_NAME_cc_byz_union_repudiated: "Union Repudiated"
 STATIC_MODIFIER_DESC_cc_byz_union_repudiated: "The union was renounced. The church is whole, the Orthodox world is satisfied, and the western powers have written the empire off as a partner they cannot rely on."
 STATIC_MODIFIER_NAME_cc_byz_latin_aid: "Latin Aid"
 STATIC_MODIFIER_DESC_cc_byz_latin_aid: "Men, money and ships from the west, arriving because the union held long enough for someone to act on it."

 # Opinion modifiers
 cc_byz_union_negotiating: "Negotiating Reunion"
 cc_byz_union_upheld: "Upheld the Union"
 cc_byz_union_undelivered: "Could Not Deliver the Union"
 cc_byz_union_renounced: "Renounced the Union"
 cc_byz_submitted_to_rome: "Submitted to Rome"
 cc_byz_held_the_faith: "Held to the Faith"

 # cc_byz_union.1 - the legates
 cc_byz_union.1.title: "Legates to the West"
 cc_byz_union.1.desc: "The proposition has been made before and will be made again, and it is always the same proposition: the churches are one church, they have merely been administered separately for four hundred years, and a small number of formal difficulties stand between the present arrangement and a reunion that would oblige the west to take the empire's survival seriously.\n\nThe small number of formal difficulties is four, and men have spent their lives on each of them. What is being decided now is only who goes, and what they are permitted to say when they arrive."
 cc_byz_union.1.desc_hellenic: "The proposition has been made before. It is being raised now in a city that has spent a generation deciding it is Greek and Orthodox and that these are the same statement, and the proposition sounds different in that city than it did in the last one.\n\nThe difficulties are the same four they have always been. What has changed is that a good many people who would once have called them technical now call them the whole of it, and they will be waiting for the legates when they come back."
 cc_byz_union.1.a: "Men who will report accurately and promise nothing."
 cc_byz_union.1.b: "Men who will promise whatever keeps the door open."
 cc_byz_union.1.c: "The patriarch's own men. The church cannot say it was not asked."

 # cc_byz_union.2 - Rome's terms
 cc_byz_union.2.title: "The Terms from Rome"
 cc_byz_union.2.desc: "The reply is courteous, expansive on the subject of Christian brotherhood, and perfectly clear once the courtesies are set aside.\n\nRome will accept reunion on the basis that Rome was always right. The Greek rite may continue. The Greek position may not. There is a great deal of language about respecting the venerable customs of the eastern churches, and none at all suggesting that any point of doctrine is open to discussion.\n\nThis is not an unreasonable position for Rome to take. It is simply not one that can be read aloud in this city."
 cc_byz_union.2.a: "Read it to the synod as it stands."
 cc_byz_union.2.b: "Have it translated generously first."
 cc_byz_union.2.c: "Answer with terms of our own."

 # cc_byz_union.10 - the council
 cc_byz_union.10.title: "The Council Convenes"
 cc_byz_union.10.desc: "The delegation has crossed to Italy: bishops, the patriarch, theologians, and a number of men whose function is to be seen to be present. The Latins have provided lodging, an allowance, and a hall.\n\nThe first business is the procession of the Holy Spirit, which is where every previous attempt has stopped. The Latin creed says the Spirit proceeds from the Father and the Son. The Greek creed says from the Father. Four hundred years of argument have established that both sides understand the other's position perfectly well and neither can concede it without conceding who has the authority to settle it."
 cc_byz_union.10.desc_reluctant: "The delegation has crossed to Italy and a good part of it did not want to come. The allowance from the Latins is being drawn by men who intend to vote against everything it was meant to encourage, and everybody involved knows this.\n\nThe first business is the procession of the Holy Spirit. It is also, in the private view of most of the Greek delegation, the last business, since they did not come to be persuaded and have said so to each other at some length on the voyage."
 cc_byz_union.10.a: "Concede the filioque as wording, not doctrine."
 cc_byz_union.10.b: "Concede the azymes as well. The Latin rite is valid."
 cc_byz_union.10.c: "Hold both. Let Rome argue for them."

 # cc_byz_union.11 - papal primacy
 cc_byz_union.11.title: "The Primacy"
 cc_byz_union.11.desc: "Everything else was preliminary. The question is whether the bishop of Rome holds authority over the whole church, or the first place of honour within it, and there is no wording that satisfies both readings while meaning anything.\n\nRome has been patient about the creed and about the bread because Rome does not particularly care about the creed or the bread. This is the article the Latins came for, and the Greek delegation has understood that from the first day."
 cc_byz_union.11.desc_conceded: "Everything else has been conceded, and the delegation is now discovering what that was worth as a negotiating position, which is nothing.\n\nThe question is the primacy: authority over the whole church, or first place of honour within it. Having given ground on the creed and on the rite, the Greeks arrive at this article with no remaining article to trade, and the Latins have arranged the order of business with precisely that in view."
 cc_byz_union.11.a: "Acknowledge it, saving the rights of the eastern patriarchs."
 cc_byz_union.11.b: "Offer a primacy of honour. Let them accept or refuse."
 cc_byz_union.11.c: "Break off. This cannot be preached in Hagia Sophia."

 # cc_byz_union.12 - signed
 cc_byz_union.12.title: "The Act of Union"
 cc_byz_union.12.desc: "It is signed. The bells are rung in the Latin churches, the decree is read in two languages, and the schism is declared to be at an end after four hundred and eleven years.\n\nThe Greek delegation signs and then, almost to a man, goes back to its lodgings and does not celebrate. Several of them are already composing the account they will give when they get home. One has refused to sign at all and the Latins have decided, correctly, that it is better not to make an issue of him."
 cc_byz_union.12.desc_bought: "It is signed, by men who were paid to be there, and the Latins have noticed which of the signatures went on quickly.\n\nThe decree is read in two languages and the schism is declared to be at an end. The Greek delegation disperses to its lodgings without ceremony. Several of them are already drafting the explanation they will give at home, and the explanation in most cases is that they signed under duress, in a foreign city, on a Latin allowance, and that nothing signed under those conditions binds the church."
 cc_byz_union.12.a: "It is done. Now it has to be brought home."

 # cc_byz_union.13 - collapse
 cc_byz_union.13.title: "The Council Breaks Up"
 cc_byz_union.13.desc: "There is no decree. The delegation is going home with its expenses paid and nothing else settled, and the Latins are letting it be known that the Greeks came a very long way to refuse what they had already been told would be required.\n\nIn Constantinople this will be reported as a defence of the faith, and it is one. It is also the end, for this reign at least, of any prospect that a western fleet arrives in the Bosphorus for reasons other than trade."
 cc_byz_union.13.a: "The church is intact. Say so loudly."
 cc_byz_union.13.b: "Keep the legation in Italy. This will be tried again."

 # cc_byz_union.20 - promulgation
 cc_byz_union.20.title: "Promulgation in Hagia Sophia"
 cc_byz_union.20.desc: "The decree is to be read in the Great Church, in Greek, before the clergy and the people of the capital, and the Pope is to be commemorated in the liturgy by name.\n\nThe second part is the part that matters. A document signed in Italy is a document. A name spoken in the liturgy in Hagia Sophia is the church saying it, and every person in the building will understand the difference."
 cc_byz_union.20.desc_softened: "The decree is to be read in the Great Church, in Greek, and the Pope commemorated in the liturgy by name.\n\nThere is a difficulty that has not yet become public. The text circulated at home was translated with some generosity, and the text that must now be read is the one that was actually signed. A number of men in that building have obtained the Latin. They have been comparing the two for some weeks and they have been waiting for exactly this occasion."
 cc_byz_union.20.desc_hostile: "The decree is to be read in the Great Church, and the mood of the city has been reported to the palace in terms that leave nothing to interpretation.\n\nThe monasteries have declared against it. Priests in the capital have said publicly that they will not commemorate the Pope and will not serve with those who do. It has been suggested to the emperor, by people whose business is to know, that the reading should be postponed. There is no date on which it would be better received. That is the difficulty."
 cc_byz_union.20.a: "Read it. Let the objections be heard afterwards."
 cc_byz_union.20.b: "Read it. Arrest whoever interrupts."
 cc_byz_union.20.c: "Read it yourself, and answer them from the ambo."

 # cc_byz_union.21 - reception
 cc_byz_union.21.title: "What the City Did"
 cc_byz_union.21.desc_rejected: "It did not take. The reading was completed, which is the most that can be said for it.\n\nThe monasteries have refused the union outright. A majority of the parish clergy of the capital will not commemorate the Pope, and the congregations have made it clear which liturgy they will attend and which they will walk out of. Churches where the union is observed are emptying. Churches where it is not are full.\n\nThe act is law and it is not the practice of the church in this city, and everyone including the emperor now knows the difference is permanent."
 cc_byz_union.21.desc_accepted: "It took, which surprised a number of people who had predicted otherwise at length.\n\nThe reading was completed, the Pope was commemorated, and the objections were made by men who then went back to their churches and served the liturgy. The monasteries are unhappy and have said so in writing, at length, and have not gone further. The city has decided, on the whole, that a formula agreed by a council is a matter for councils.\n\nThe union is the practice of the church here. That has not been true since before the city was sacked."
 cc_byz_union.21.desc_divided: "It half took, which is the usual fate of such things and the hardest to govern.\n\nSome churches commemorate the Pope and some do not. Some clergy will serve with the unionists and some will not, and the ones who will not are on the whole the ones with the larger congregations. The monasteries have refused and have not been made to comply.\n\nNothing has broken. Nothing has settled either, and every appointment to every see is now a decision about the union whether the palace intends it that way or not."
 cc_byz_union.21.a: "So it stands."

 # cc_byz_union.22 - the ferment
 cc_byz_union.22.title: "The Ferment"
 cc_byz_union.22.desc: "The resistance has not died down and it has stopped being about the filioque.\n\nWhat began as a doctrinal objection among theologians is now the ordinary opinion of the capital, and it has acquired all the other grievances on its way: the taxes, the Italians in the harbour, the offices that are bought and sold, the general sense that the palace has been conceding things for a century and calling each concession necessary. The union is simply the one people can name."
 cc_byz_union.22.desc_forced: "The arrests did not settle it. They rarely do, and this time they have supplied the resistance with the one thing it lacked, which is men to point at.\n\nThe clergy taken at the promulgation are being spoken of in the monasteries in terms usually reserved for confessors. Their names are known in parishes that had no opinion about the filioque a year ago. Whatever the union's merits, it is now the flag of every grievance in the city, and the palace put it there."
 cc_byz_union.22.a: "Enforce it. Deprive the objectors, appoint unionists."
 cc_byz_union.22.b: "Let it be preached both ways."
 cc_byz_union.22.c: "Find the loudest of them a distant see."

 # cc_byz_union.30 - repudiation
 cc_byz_union.30.title: "Renouncing the Union"
 cc_byz_union.30.desc: "The act is to be renounced. There is no procedure for this, the union having been agreed by a general council, so the renunciation will take whatever form the palace gives it and the palace will assert that the form is sufficient.\n\nRome will not agree. Rome's agreement was never available on this point and pursuing it would only delay matters."
 cc_byz_union.30.desc_failed: "The act is to be renounced, and the only real question is why it took this long.\n\nIt has not been the practice of the church in this city since the day it was read. The clergy do not observe it, the congregations do not attend where it is observed, and the palace has spent years maintaining a legal fiction that costs it standing at home and has bought it nothing abroad, since the west can see perfectly well that the union is not in force here.\n\nRenouncing it changes nothing about what happens in the churches. It changes what the emperor is pretending."
 cc_byz_union.30.desc_held: "The act is to be renounced, and this is a harder thing than it would have been ten years ago, because the union took.\n\nThe churches observe it. The clergy have made their peace with it and a generation of them has been ordained knowing nothing else. There are men who were persuaded, at some cost to themselves, that this was right, and they will now be told that the palace has changed its mind.\n\nThe west, meanwhile, has been treating the empire as a partner. That ends with the announcement."
 cc_byz_union.30.a: "Renounce it plainly. Let the record stand."
 cc_byz_union.30.b: "Renounce it, and blame the legates who signed."
 cc_byz_union.30.c: "Renounce the text. Keep the embassy in Rome."

 # cc_byz_union.31 - the west reacts
 cc_byz_union.31.title: "The West Draws Its Conclusions"
 cc_byz_union.31.desc: "The reaction is not anger, which could be worked with. It is the settled conclusion that the empire cannot deliver what its emperors sign, and that whatever is agreed in Italy will be undone in Constantinople by people the emperor does not control.\n\nThe practical consequence is that proposals stop arriving. Nobody declares anything. The correspondence simply becomes shorter, and then formal, and then occasional, and the men who used to argue in Rome that the Greeks were worth helping have stopped arguing it because they lost."
 cc_byz_union.31.a: "Accept it. We hold what we hold with what we have."
 cc_byz_union.31.b: "Look east and south. Others do not care what we preach."

 # cc_byz_union.40 - the payoff
 cc_byz_union.40.title: "What the Union Was For"
 cc_byz_union.40.desc: "The union has held long enough to be believed, and belief has produced results, which is not something that could have been promised at the outset.\n\nThere is money, collected in the west for the defence of the eastern church, and it has actually been sent rather than announced. There are men: not an army, but companies of them, and captains who have been paid to bring them. There is a papal legate in the capital who is arguing the empire's case in his letters home rather than reporting on its shortcomings.\n\nNone of this would have arrived for a schismatic. That was always the argument, and here it is, being made good."
 cc_byz_union.40.a: "Take the men and the money."
 cc_byz_union.40.b: "Ask them to press our claim to the eastern seats."
 cc_byz_union.40.c: "Ask the Pope to raise the matter of our regalia."

