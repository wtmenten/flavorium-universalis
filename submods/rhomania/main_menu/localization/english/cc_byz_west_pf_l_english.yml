 # ---- Per-prefecture actions ----
 cc_byz_west_pf_donative_italy: "Pay the Garrisons of Ravenna"
 cc_byz_west_pf_donative_italy_desc: "Pay this province's garrisons their arrears. A third of the full donative's cost, for one province.\n\nThe exarch gains #G 2#! loyalty and imperial grip rises by #G 1#!."
 cc_byz_west_pf_honours_italy: "Confer a Court Title on the Exarch of Ravenna"
 cc_byz_west_pf_honours_italy_desc: "Make the exarch a patrikios, or a magistros if he is one already. It costs the emperor prestige and gives the west no more say.\n\nThe exarch gains #G 2#! loyalty and loses #G 1#! appetite."
 cc_byz_west_pf_confirm_son_italy: "Confirm the Son of the Exarch of Ravenna"
 cc_byz_west_pf_confirm_son_italy_desc: "Confirm the exarch's son as his successor. The office becomes his family's.\n\nThe exarch gains #G 3#! loyalty. Western autonomy rises by #R 8#!, and the empire leans toward the Dynatoi. The first confirmation is a precedent every other exarch will cite."
 cc_byz_west_pf_strategos_italy: "Send a Strategos to Ravenna"
 cc_byz_west_pf_strategos_italy_desc: "Send a general and his men to this province. The exarch gains army tradition and manpower.\n\nWestern autonomy rises by #R 5#!: a general in the west has troops who know him."
 cc_byz_west_pf_recall_italy: "Summon the Exarch of Ravenna"
 cc_byz_west_pf_recall_italy_desc: "Order this exarch to the capital. Whether he comes depends on his loyalty, and on whether his office has become his family's."
 cc_byz_west_pf_charter_italy: "Charter a Commune in Ravenna"
 cc_byz_west_pf_charter_italy_desc: "Grant a city its charter. Trade and the burghers gain, and the exarch gains #G 1#! loyalty.\n\nWestern autonomy rises by #R 6#!. The first charter is the precedent every other commune cites."
