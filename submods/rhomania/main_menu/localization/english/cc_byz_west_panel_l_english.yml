l_english:
 # The West: situation panel and map legend.
 #
 # Same split and same voice rule as cc_byz_mamluk_panel_l_english.yml. Card bodies are the
 # court speaking; every counter, threshold and vote count lives in a _INFO key behind the
 # card's info icon.

 # ---- Panel header ----
 CC_BYZ_WEST_HDR_GRIP: "Grip"
 CC_BYZ_WEST_HDR_AUTONOMY: "Autonomy"
 CC_BYZ_WEST_HDR_RESTIVE: "The West is restive"
 CC_BYZ_WEST_HDR_RESTIVE_TT: "Letters from the prefectures have grown careful. Requests that used to be requests are now notifications, and the couriers are taking longer than the roads explain.\n\nNothing has happened. Everyone at court can tell you exactly what it feels like, and none of them will write it down."

 # ---- Card: the two counters ----
 CC_BYZ_WEST_CARD_BALANCE: "The Balance of the West"
 CC_BYZ_WEST_CARD_BALANCE_DESC: "The empire holds the west, and the west has its own opinion of being held. These are not the same question and an emperor who treats them as one will be surprised twice.\n\nA province can be governed closely and resent none of it. Another can be barely governed at all and spend forty years drafting a case against the capital. The dangerous arrangement is the one where the emperor is holding hard and the west has stopped seeing why."
 CC_BYZ_WEST_CARD_BALANCE_INFO: "Two independent counters, each 0 to 100. They are not two ends of one bar and both can be high at once.\n\n#T Imperial Grip#! rises with censuses, strategoi sent, recalls obeyed and tribute taken. It falls when the prefectures are left to run themselves.\n\n#T Western Autonomy#! rises with charters granted, sons confirmed in their fathers' seats, recalls refused, and years without supervision. It falls when the emperor is present in the west and paying for it.\n\nGrip and autonomy both at 60 or above is the state the rising comes from. The situation resolves in every case before the Age of Revolutions."
 CC_BYZ_WEST_BAR_GRIP: "Imperial Grip"
 CC_BYZ_WEST_BAR_GRIP_TT: "Rises with censuses, strategoi, recalls obeyed and tribute taken. Falls when the prefectures are left to run themselves.\n\nHigh grip is not automatically good. It is what makes the west's opinion of the arrangement matter."
 CC_BYZ_WEST_BAR_AUTONOMY: "Western Autonomy"
 CC_BYZ_WEST_BAR_AUTONOMY_TT: "Rises with charters granted, sons confirmed, recalls refused and time spent unsupervised. Falls when the emperor is present in the west and paying for it.\n\nHigh autonomy is not automatically bad either. A west that governs itself contentedly is one of the four endings."
 CC_BYZ_WEST_TENSION_BOTH_HIGH: "Held hard, and resenting it"
 CC_BYZ_WEST_TENSION_BOTH_HIGH_TT: "The empire is governing provinces that have decided they would rather not be governed. Both things are true at once and each is making the other worse.\n\nLoosening the hand works. So does giving the west a reason to want the arrangement. Doing neither is also a decision, and it has been made before."
 CC_BYZ_WEST_TENSION_DRIFTING: "Drifting away quietly"
 CC_BYZ_WEST_TENSION_DRIFTING_TT: "Nothing is going wrong. Nothing is being held either.\n\nThe prefectures are becoming a separate thing at their own pace, without a quarrel and without a date anyone will be able to point to. One reign soon the emperor's letters will be read the way a foreign court's are, and nobody will remember deciding that."

 # ---- Card: the prefectures ----
 CC_BYZ_WEST_CARD_PREFECTURES: "The Prefectures"
 CC_BYZ_WEST_CARD_PREFECTURES_DESC: "Governors of provinces the empire spent three centuries not having.\n\nEach was somebody's reward, and each has had time to work out what the post is worth to the man holding it rather than to the man who granted it. What they think of the emperor is not a secret. It has simply never been asked for in writing."
 CC_BYZ_WEST_CARD_PREFECTURES_INFO: "Loyalty runs from -5 to 5 per exarch.\n\nIt is the number read by the recall summons, the friction thread, the consistory's voting weights and the rising. An exarch at -3 or below will refuse a recall; the rising draws on exarchs at -2 or below.\n\nRaised by donatives, charters and confirming an exarch's son. Lowered by censuses, tribute, recalls and strategoi sent over his head."
 CC_BYZ_WEST_COL_LOYALTY: "Loyalty"

 # ---- Card: the consistory ----
 CC_BYZ_WEST_CARD_CONSISTORY: "The Sacred Consistory"
 CC_BYZ_WEST_CARD_CONSISTORY_DESC: "The emperor built a room where the west could be heard, because a west that is heard is a west that stays.\n\nHe was right about that. What he did not do was count the chairs. Every province recovered adds a voice to it, and the voices were never going to keep agreeing with him out of gratitude for the room."
 CC_BYZ_WEST_CARD_CONSISTORY_INFO: "Votes are held in the consistory, once convened.\n\n#T Augustus#! 3 votes. #T Senior Exarch#! 2 votes. #T Each other exarch#! 1 vote.\n\nWith one prefecture seated the emperor cannot lose, 3 to 1. With all four seated it is 3 against 5 and the west carries the vote. There is no hidden risk score behind this: the danger is the reconquest itself, one province at a time.\n\nSpecial statuses stack, so elevating a senior exarch grants 2 in place of his 1, not in addition to it."
 CC_BYZ_WEST_VOTES_LEGEND: "Prefectures seated"

 # ---- Map colouring ----
 CC_BYZ_WEST_LEGEND_PREFECTURE: "Prefecture"
 CC_BYZ_WEST_LEGEND_IMPERIAL: "Imperial"
