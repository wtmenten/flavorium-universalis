l_english:
 # Country modifiers
 STATIC_MODIFIER_NAME_cc_byz_customs_conceded: "Customs Conceded"
 STATIC_MODIFIER_DESC_cc_byz_customs_conceded: "A foreign republic holds a written exemption on the customs of the capital. The trade has not fallen. It simply no longer passes through the treasury on its way past."
 STATIC_MODIFIER_NAME_cc_byz_creditors_wary: "Creditors Wary"
 STATIC_MODIFIER_DESC_cc_byz_creditors_wary: "The banking houses of Italy have compared notes on the empire's accounts and priced the result. Money can still be had. It costs more and there is less of it."
 STATIC_MODIFIER_NAME_cc_byz_sound_credit: "Sound Credit"
 STATIC_MODIFIER_DESC_cc_byz_sound_credit: "The interest was paid on the day it fell due, in full, without a request for terms. This is expensive and it is worth what it costs."
 STATIC_MODIFIER_NAME_cc_byz_revenue_farmed: "Revenue Farmed"
 STATIC_MODIFIER_DESC_cc_byz_revenue_farmed: "Next year's taxes were sold this year. The money arrived once. The men who bought the right collect for as long as the contract runs, keep the difference, and answer to nobody in the palace."
 STATIC_MODIFIER_NAME_cc_byz_hereditary_farm: "Hereditary Farm"
 STATIC_MODIFIER_DESC_cc_byz_hereditary_farm: "The right to collect has passed to a son. Nobody granted it and nobody contested it. The families holding the contracts now treat them as land, and they are not wrong."
 STATIC_MODIFIER_NAME_cc_byz_debt_repudiated: "Debt Repudiated"
 STATIC_MODIFIER_DESC_cc_byz_debt_repudiated: "A debt was declared void by imperial authority. The authority was sufficient. The consequence is that no house in Italy will lend on the old terms again within living memory."
 STATIC_MODIFIER_NAME_cc_byz_fiscal_retrenchment: "Fiscal Retrenchment"
 STATIC_MODIFIER_DESC_cc_byz_fiscal_retrenchment: "Spending cut, arrears paid, the assessment rebuilt from the survey upward. Slow, unpopular in every quarter that matters, and the only method that has ever worked."
 STATIC_MODIFIER_NAME_cc_byz_crowned_without_regalia: "Crowned Without the Regalia"
 STATIC_MODIFIER_DESC_cc_byz_crowned_without_regalia: "The crown used at the coronation was gilt and glass. The originals are in a Venetian vault. Everyone in the church knew, and the ceremony proceeded as though they did not."

 # Opinion modifiers
 cc_byz_creditor_privilege: "Holds Imperial Privileges"
 cc_byz_rival_privilege_granted: "Privileges Given to our Rival"
 cc_byz_bought_out_creditors: "Bought Out our Debt"
 cc_byz_holds_pledged_territory: "Holds our Pledged Territory"
 cc_byz_pledge_redeemed: "Redeemed their Pledge"
 cc_byz_repudiated_debt: "Repudiated their Debt to Us"
 cc_byz_creditor_syndicate: "Acted Against Us as a Syndicate"
 cc_byz_holds_tax_farm: "Farms our Revenue"

 # cc_byz_debt.1 - the first Italian loan
 cc_byz_debt.1.title: "The Terms of the Loan"
 cc_byz_debt.1.desc: "The money is available. It has been available for some time, and the factors who carry the offer have been careful to make clear that it is offered out of regard for the empire rather than out of expectation of profit.\n\nThe rate is reasonable. It becomes more reasonable still if the arrangement includes certain small accommodations regarding the customs, which the factors mention late in the conversation, as an afterthought, having rehearsed it."
 cc_byz_debt.1.desc_venal: "The money is available, and the men who carry the offer have done business in this city before. They know which officials will move a document and what it costs to have it moved.\n\nThe rate is reasonable, and it improves if certain accommodations are included regarding the customs. They do not press the point. They have learned that in Constantinople it is rarely necessary to press a point twice."
 cc_byz_debt.1.a: "Pay the rate. Concede nothing."
 cc_byz_debt.1.b: "Take the better terms. A customs matter costs nothing today."
 cc_byz_debt.1.c: "Decline. The money can be raised here."

 # cc_byz_debt.2 - the customs exemption
 cc_byz_debt.2.title: "The Exemption in Writing"
 cc_byz_debt.2.desc: "What was an accommodation is now a request for a document. The republic wishes the exemption set down under seal, in perpetuity, so that the matter need not be revisited by future officials who may be less well informed.\n\nThe sum involved is not large. The precedent is the whole of it, and both parties know that too."
 cc_byz_debt.2.desc_cordial: "The relationship has been good and the republic says so at length before coming to the point. The point is a document: the exemption set down under seal, in perpetuity, so that future officials cannot mistake a courtesy for a concession or a concession for a courtesy.\n\nThey have brought the text already drafted. It is a short text."
 cc_byz_debt.2.a: "Seal it. In perpetuity."
 cc_byz_debt.2.b: "Refuse. The customs are not theirs to be granted."
 cc_byz_debt.2.c: "Twenty-five years, and not one more."

 # cc_byz_debt.3 - the island pledge
 cc_byz_debt.3.title: "Security Against the Debt"
 cc_byz_debt.3.desc: "The creditors have proposed a security. Not a payment: a pledge, held against the debt, returnable in full upon redemption. They suggest an island, and they have a particular one in mind, and they have had it in mind for longer than this conversation.\n\nPledged territory is returned when the debt is cleared. The record of such pledges being returned is not encouraging."
 cc_byz_debt.3.a: "Pledge it. The debt is cancelled."
 cc_byz_debt.3.b: "Pay in coin. The island is not currency."
 cc_byz_debt.3.c: "Let them come and collect it themselves."

 # cc_byz_debt.4 - the creditors compare notes
 cc_byz_debt.4.title: "The Creditors Compare Notes"
 cc_byz_debt.4.desc: "Until now each republic has dealt with the palace separately, which has been the empire's chief advantage in these matters: what one would not lend, another would, and neither knew the other's rate.\n\nThey have met. They have exchanged figures. They now know the whole of what is owed, which is more than any of them individually supposed, and they have come to the palace together."
 cc_byz_debt.4.desc_conceded: "Until now each republic has dealt with the palace separately, and the customs exemption granted to one was resented by the others in a way that could be worked with.\n\nThey have met. They compared the exemption against their own terms, then compared the terms against the total owed, and arrived at a figure none of them had individually supposed. They have come to the palace together, and they have brought the figure with them."
 cc_byz_debt.4.a: "Buy out the ringleaders, whatever it costs."
 cc_byz_debt.4.b: "Consolidate. Let them examine the books."
 cc_byz_debt.4.c: "Give one of them what the others want."

 # cc_byz_debt.5 - what the quarter became
 cc_byz_debt.5.title: "The Quarter Across the Water"
 cc_byz_debt.5.desc_captured: "The accounting is finished and it says what it was always going to say. The customs of the capital are collected by men who remit to a council in another city. The quarter across the water has its own walls, its own courts, and a garrison that is not the emperor's.\n\nNothing was surrendered. Every step was a reasonable answer to a real difficulty, and the sum of the reasonable answers is a foreign city standing on the far shore of the harbour, watching the shipping."
 cc_byz_debt.5.desc_free: "The accounting is finished. The debts were paid at the agreed rate on the agreed day, the exemptions were refused, and the factors who carry the money have concluded that Constantinople is an expensive place to lend and a reliable one.\n\nThe reliability was purchased at some cost. The customs are still collected by the emperor's men, and that turns out to have been worth every payment that was made on time."
 cc_byz_debt.5.desc_mixed: "The accounting is finished and the picture is mixed, which is the usual condition of such things. Some exemptions stand and some lapsed. The factors still lend and still argue about the rate.\n\nThe quarter across the water has grown. It has not yet become a separate thing, and whether it does is not settled."
 cc_byz_debt.5.a: "Note it in the register."

 # cc_byz_debt.10 - the coronation
 cc_byz_debt.10.title: "A Coronation Without the Crown"
 cc_byz_debt.10.desc: "The regalia are in Venice, held against a debt that has not been redeemed, and there is to be a coronation.\n\nThe master of ceremonies has raised the difficulty in the most careful terms available to him. Copies can be made. They can be made well, in gilt and coloured glass, and at a distance of twenty paces in candlelight they will not be distinguishable from what they replace. He does not say what they will be at closer range, or to the men standing closest, who are the men whose opinion of the ceremony matters most."
 cc_byz_debt.10.a: "Gilt and glass. The ceremony proceeds."
 cc_byz_debt.10.b: "No crown at all. Let the absence speak."
 cc_byz_debt.10.c: "Make the loss the subject of the address."

 # cc_byz_debt.11 - the clergy on Latin creditors
 cc_byz_debt.11.title: "The Clergy on the Subject of Creditors"
 cc_byz_debt.11.desc: "A sermon preached in the capital has been reported to the palace, and the reporting was thorough because the preacher intended it to be.\n\nHis subject was the regalia: that the insignia of the Roman emperors are held in a Latin vault against a merchant's ledger, and that a throne which cannot redeem its own crown might examine what else it has been willing to pledge. He did not name the union, or the exemptions, or anything else. He did not have to. The congregation supplied those themselves."
 cc_byz_debt.11.desc_customs: "A sermon preached in the capital has been reported to the palace, and this time the preacher did name things.\n\nHe named the regalia in the Venetian vault. He named the customs exemption, and the quarter across the water, and the fact that a man may now stand in this city under a foreign jurisdiction and pay nothing to the emperor whose harbour he is standing in. He asked what remained to be pledged, and answered the question himself, and the congregation agreed with the answer."
 cc_byz_debt.11.a: "Agree with him. Publicly."
 cc_byz_debt.11.b: "Remind him that he did not offer the money."
 cc_byz_debt.11.c: "Ask the church to fund the redemption."

 # cc_byz_debt.13 - a generation later
 cc_byz_debt.13.title: "Still in Venice"
 cc_byz_debt.13.desc: "The clerk preparing the annual return has entered the regalia in the schedule of pledged property, as his predecessor did, and his predecessor before that. The entry has been copied forward without comment for long enough that the hand it was first written in is no longer used in the chancery.\n\nNobody decided to stop trying to redeem them. There was no debate and no instruction. The item simply moved, over three reigns, from the list of things to be recovered to the list of things that are the case, and the men who serve the palace have drawn the obvious conclusion about what else on that list might be movable."
 cc_byz_debt.13.a: "Copy it forward again."

 # cc_byz_debt.20 - selling revenue forward
 cc_byz_debt.20.title: "Next Year's Revenue"
 cc_byz_debt.20.desc: "The treasury requires money now and will have money later, and there are men who will exchange the second condition for the first at a discount they consider fair.\n\nThe mechanism is old and well understood. A sum is paid into the treasury today. In exchange the buyer collects a district's taxes for a term of years and keeps whatever he can extract above what he paid. The sum arrives immediately. The extraction is somebody else's problem, in a district the court will not visit, from people who have no way to report what is done to them."
 cc_byz_debt.20.desc_war: "The army is in the field and the army must be paid, and the treasury holds what it holds.\n\nThere are men who will advance the sum today against the right to collect a district's taxes for a term of years. They will keep whatever they extract above what they paid. Everyone in the room understands that the terms would be better in peacetime and that the empire is not in a position to wait for peacetime, and the men making the offer understand it best of all."
 cc_byz_debt.20.a: "Sell it to the burghers."
 cc_byz_debt.20.b: "Sell it to the Italians. They pay more."
 cc_byz_debt.20.c: "Sell nothing. Cut the spending instead."
 cc_byz_debt.20.d: "Sell one season's revenue. The army is owed now."

 # cc_byz_debt.21 - how the farmers collect
 cc_byz_debt.21.title: "How the Farmers Collect"
 cc_byz_debt.21.desc: "The contracts are being honoured. The sums arrive on the day they are due and the accounts balance, which is the only test the palace has been applying.\n\nReports have begun arriving by other routes. The collectors are taking in advance of the assessment, taking in kind where coin is short, and taking from the same villages twice on the argument that the first collection was against a different year. There is no procedure for a peasant to contest this, because the man he would contest it to bought the right to be there."
 cc_byz_debt.21.a: "Rein them in. The contract is worth less than the countryside."
 cc_byz_debt.21.b: "The money arrives on time. That was the test."
 cc_byz_debt.21.c: "Hang one of them where the others can see."

 # cc_byz_debt.22 - the farm becomes heritable
 cc_byz_debt.22.title: "The Contract Passes to a Son"
 cc_byz_debt.22.desc: "A farmer of the revenue has died and his son has continued to collect. No grant was made. No official was asked. The son simply presented himself at the same villages with the same escort, and the villages paid, because from where they stand the arrangement has not changed in any respect they can act on.\n\nThe palace has been informed as a courtesy. The wording of the notice makes clear that a reply is not expected."
 cc_byz_debt.22.desc_venal: "A farmer of the revenue has died and his son has continued to collect, which surprises nobody in a chancery where posts have been passing the same way for a generation.\n\nThe palace has been informed as a courtesy. The clerk who received the notice filed it without referring it upward, on the reasonable view that this is simply how things are done now, and he was not corrected."
 cc_byz_debt.22.a: "Recognise it. Charge for the charter."
 cc_byz_debt.22.b: "Buy the contracts back, at whatever price."
 cc_byz_debt.22.c: "Make the collectors salaried officers."

 # cc_byz_debt.30 - the payment cannot be made
 cc_byz_debt.30.title: "The Payment Falls Due"
 cc_byz_debt.30.desc: "The instalment is due this month and the treasury cannot meet it. This is not a dispute about the sum or the date. The money is not there, and the officers who would normally find it have been asked and have nothing to suggest that has not already been tried.\n\nThe creditor's factor is in the city and has requested an audience for the day after the payment falls due, which is a courtesy, and a deliberate one."
 cc_byz_debt.30.desc_grip: "The instalment is due this month and the treasury cannot meet it, and the creditor's factor has not requested an audience, because he no longer needs to request them.\n\nHe has been in the palace three times this season on matters of collection. He knows the state of the accounts better than several men who draw salaries to know it. When the payment is missed he will not be surprised, and the terms he offers afterwards will have been drafted before the default rather than in response to it."
 cc_byz_debt.30.desc_again: "The instalment is due this month and the treasury cannot meet it, and this has happened before, which changes what is being discussed.\n\nThe first time, the creditors treated a missed payment as a difficulty and rewrote the debt on that understanding. They will not make the same assumption twice. A single default is a bad year. A second is a description of the state, and the terms offered this time will be priced against the description rather than against the year."
 cc_byz_debt.30.a: "Starve the offices. The debt is paid."
 cc_byz_debt.30.b: "Ask them to rewrite it."
 cc_byz_debt.30.c: "The debt is void. Let them petition."
 cc_byz_debt.30.d: "Persuade them to roll it over unchanged."

 # cc_byz_debt.31 - the new terms
 cc_byz_debt.31.title: "The New Terms"
 cc_byz_debt.31.desc: "They are willing. They were always going to be willing, because a debt rewritten at their rate is worth more to them than a debt repudiated at nobody's.\n\nThe rate they propose is high. They also propose, in the same breath and the same tone, an alternative: a lower rate, if the collection is supervised by a factor of their own choosing, resident in the capital, with access to the registers. The second offer is the one they want accepted."
 cc_byz_debt.31.a: "Take the higher rate. Our registers stay ours."
 cc_byz_debt.31.b: "Take the lower rate. Let their man see the books."

 # cc_byz_debt.32 - the creditors act as one
 cc_byz_debt.32.title: "A Syndicate of Creditors"
 cc_byz_debt.32.desc: "The republics quarrel about everything and have quarrelled about the empire's debts for as long as there have been any. They have stopped quarrelling about this one.\n\nA debt declared void by imperial authority is not a commercial dispute between one house and one court. It is a proposition about whether the emperor's word binds him, and every lender in Italy has an interest in the answer being no. They have agreed on the answer. Credit is closed, in all three cities, on the same terms, which is a thing they have never previously managed."
 cc_byz_debt.32.a: "Weather it. We will buy nothing from them."
 cc_byz_debt.32.b: "Settle a part of it. Reopen the door."
 cc_byz_debt.32.c: "There is money east of here."

 # cc_byz_debt.33 - after the bankruptcy
 cc_byz_debt.33.title: "After the Reckoning"
 cc_byz_debt.33.desc: "The treasury has stopped. Not slowed: stopped, in the specific sense that the officers responsible for payment have been instructed to make none, and have begun explaining this to men who were owed money and had made arrangements on the assumption of receiving it.\n\nWhat happens next is decided in the provinces rather than in the capital, by whoever out there still has coin to pay soldiers. The palace's role is to discover in due course what was decided."
 cc_byz_debt.33.desc_jewels: "The treasury has stopped, and the news travelled to Venice faster than it travelled to Thessalonica, because Venice was watching for it.\n\nThe regalia were pledged against a debt the empire has now formally failed to service. The legal position is not complicated and the Venetians have not troubled to complicate it. What happens in the provinces will be decided by whoever out there still has coin to pay soldiers, and the palace will learn what was decided some months after the fact."
 cc_byz_debt.33.desc_strained: "The treasury has stopped, and it has stopped at the worst possible moment, which is not a coincidence.\n\nThe garrisons in the newly held provinces are already months behind. The roads that were supposed to bind those provinces to the capital were not built, because the money for them went to the garrisons, and the money for the garrisons went to the interest. Every one of those decisions was correct at the time it was taken. The result is a frontier held by men who have not been paid, in country that has no reason to feed them, at the exact moment the capital announces it cannot pay anyone."
 cc_byz_debt.33.a: "Rebuild the assessment from the survey up."
 cc_byz_debt.33.b: "Let the magnates collect and remit what they think fair."
 cc_byz_debt.33.c: "Go back to Italy with the books open."
