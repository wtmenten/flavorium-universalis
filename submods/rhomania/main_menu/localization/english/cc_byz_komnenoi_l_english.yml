l_english:
 # Decision
 cc_byz_kom_raise_the_question_decision.title: "The Komnenian Question"
 cc_byz_kom_raise_the_question_decision.title.entry: "The Komnenian Question"
 cc_byz_kom_raise_the_question_decision.desc: "The Grand Komnenoi of [cc_kom_tre.GetName] have styled themselves Emperors of the Romans since 1204. Two courts claim one title, and [target_character.GetName] can open the matter: by negotiation that ends in a union of crowns, or by building the case for taking the second crown by force.\n\nThe question runs over roughly a decade. Choices along the way build #Y Accord#! (the odds of a union or an outright acclamation) and #Y Pretext#! (the length of a war claim and the discount on annexing Trebizond at the peace table). It can be opened only once."
 cc_byz_kom_raise_the_question_decision.desc.entry: "The Grand Komnenoi of Trebizond have styled themselves Emperors of the Romans since 1204. Open the matter of the second crown, by negotiation or by pretext. Runs over roughly a decade and can be opened only once."
 cc_byz_kom_raise_the_question_decision.a: "Send to Trebizond."
 cc_byz_kom_raise_the_question_decision.a.entry: "Send to Trebizond."

 # Score tooltips
 cc_byz_kom_accord_plus1_tt: "#Y Accord#! #G +1#!"
 cc_byz_kom_accord_plus2_tt: "#Y Accord#! #G +2#!"
 cc_byz_kom_accord_plus3_tt: "#Y Accord#! #G +3#!"
 cc_byz_kom_accord_minus1_tt: "#Y Accord#! #R -1#!"
 cc_byz_kom_pretext_plus1_tt: "#Y Pretext#! #G +1#!"
 cc_byz_kom_pretext_plus2_tt: "#Y Pretext#! #G +2#!"
 cc_byz_kom_shortcut_tt: "The question goes straight to the settlement, skipping the next stage"
 cc_byz_kom_roll_acclamation_tt: "#G Acclamation:#! [cc_kom_tre.GetName] is annexed"
 cc_byz_kom_roll_union_tt: "#G Union:#! [cc_kom_tre.GetName] joins us in a personal union, with us as the senior partner"
 cc_byz_kom_roll_refused_tt: "#R Refusal:#! the alliance ends, both courts take an opinion penalty, and we gain a 15-year claim to [cc_kom_tre.GetName]'s crown"
 cc_byz_kom_human_tre_decides_tt: "The ruler of [cc_kom_tre.GetName] decides whether to accept"
 cc_byz_kom_pretext_outcome_tt: "We gain a war claim to [cc_kom_tre.GetName]'s crown for 10 years plus half our #Y Pretext#!. The alliance ends. At #Y Pretext#! 6 or more our armies also gain a 10-year bonus"
 cc_byz_kom_tre_accept_tt: "Our crown is joined to Constantinople's. The archontes decide between a personal union and full annexation; the more #Y Accord#! Byzantium built, the likelier annexation is"
 cc_byz_kom_tre_refuse_tt: "The alliance with Byzantium ends and Byzantium gains a 15-year claim to our crown"
 cc_byz_kom_no_second_emperor_tt: "Trebizond does not exist, is our subject (not a tributary), or is our junior partner in a union"

 # Peace treaties and CB
 cc_byz_cb_reunify_pontus: "Reunify the Pontus"
 cc_byz_cb_reunify_pontus_desc: "The crown of Trebizond is a provincial command that kept its title after 1204. The emperor claims it."
 cc_byz_cb_reunify_pontus_PROV: "Reunify the Pontus"
 cc_byz_kom_reunify: "Reunify the Pontus"
 cc_byz_kom_reunify_desc: "Annex Trebizond. Cheaper the more #Y Pretext#! was built before the war."
 cc_byz_kom_reunify_tt: "Trebizond is annexed"
 cc_byz_kom_despotate: "Create the Despotate of the Pontus"
 cc_byz_kom_despotate_desc: "Make Trebizond a vassal under its own ruler, with the title of Despot instead of Emperor. Cheaper the more #Y Pretext#! was built before the war."
 cc_byz_kom_pretext_discount_desc: "Komnenian Pretext"

 # Opinion modifiers
 cc_byz_kom_courted: "Courted by the Emperor"
 cc_byz_kom_honoured: "Granted the Title of Despot"
 cc_byz_kom_slighted: "Imperial Dignity Slighted"
 cc_byz_kom_suitor_courted: "Approached over Trebizond"
 cc_byz_kom_spurned: "The Union Refused"
 cc_byz_kom_pretext_proclaimed: "Crown Declared a Usurpation"

 # Country modifiers
 STATIC_MODIFIER_NAME_cc_byz_kom_imperial_aid: "Imperial Troops on the Frontier"
 STATIC_MODIFIER_DESC_cc_byz_kom_imperial_aid: "A Byzantine tagma holds the Pontic frontier against the Turkmen."
 STATIC_MODIFIER_NAME_cc_byz_kom_troops_abroad: "Tagma in the Pontus"
 STATIC_MODIFIER_DESC_cc_byz_kom_troops_abroad: "Soldiers sent to defend Trebizond are not available at home."
 STATIC_MODIFIER_NAME_cc_byz_kom_acclaimed: "Acclaimed in Trebizond"
 STATIC_MODIFIER_DESC_cc_byz_kom_acclaimed: "Trebizond accepted the emperor without a war. There is one Roman emperor again."
 STATIC_MODIFIER_NAME_cc_byz_kom_crowns_joined: "Two Crowns, One Emperor"
 STATIC_MODIFIER_DESC_cc_byz_kom_crowns_joined: "The emperor in Constantinople also wears the crown of Trebizond."
 STATIC_MODIFIER_NAME_cc_byz_kom_turned_away: "Refused Constantinople"
 STATIC_MODIFIER_DESC_cc_byz_kom_turned_away: "Trebizond turned down union with Byzantium and is courting other friends."
 STATIC_MODIFIER_NAME_cc_byz_kom_just_war: "A Just Claim"
 STATIC_MODIFIER_DESC_cc_byz_kom_just_war: "The claim to Trebizond's crown was prepared for years, and the army believes it."

 # .1
 cc_byz_komnenoi.1.title: "The Komnenian Question"
 cc_byz_komnenoi.1.desc: "Since 1204 two courts have called their ruler Emperor of the Romans: ours, and the Grand Komnenoi in [cc_kom_tre.GetName]. The empire has never formally conceded the point and Trebizond has never dropped the style.\n\nThe council wants to settle it. A union of the two crowns would end the dispute. So would a war. Either way, the first step is an embassy."
 cc_byz_komnenoi.1.desc_family: "The ruler of [cc_kom_tre.GetName] is of our own house. For the first time since 1204 the two imperial titles are held by members of one family, and the council sees an opening that may not come again.\n\nA union of the crowns could be arranged as a family settlement. It will still need an embassy, and it will need one soon."
 cc_byz_komnenoi.1.desc_hostility: "Relations with [cc_kom_tre.GetName] have soured to the point that the council no longer discusses the Komnenoi as allies. They still call their ruler Emperor of the Romans, and several of our ministers now argue that the title should be taken from them by force.\n\nOthers want one more embassy first. Both groups agree the matter has to be settled."
 cc_byz_komnenoi.1.desc_alliance: "[cc_kom_tre.GetName] has been our ally for years and its court thinks well of us. The council proposes using that goodwill to raise the old question: whether there should be two Roman emperors at all.\n\nA union of the crowns would end the dispute without a war. It will take years of embassies and some expense."
 cc_byz_komnenoi.1.desc_peril: "[cc_kom_tre.GetName] is in difficulty, with an unsteady court or a war on its frontier. The council points out that a weak Trebizond may accept terms a strong one would refuse, and that the empire can offer protection or simply wait.\n\nEither way, it is time to raise the question of the two crowns."
 cc_byz_komnenoi.1.a: "Send envoys who will listen first."
 cc_byz_komnenoi.1.b: "There is one empire, and its capital is Constantinople."
 cc_byz_komnenoi.1.c: "Write to them as family."

 # .2
 cc_byz_komnenoi.2.title: "The Pontic Court"
 cc_byz_komnenoi.2.desc: "Our envoys report that the government of [cc_kom_tre.GetName] rests on a small council of archontes, the great landholding families of the Pontus. They decide what the Grand Komnenos can accept, and they are open to persuasion.\n\nThe envoys suggest gifts, a marriage between the two houses, or an appeal through the Church. One envoy suggests a different approach: building a party at court that would prefer a distant emperor to a near one."
 cc_byz_komnenoi.2.a: "Gifts for the archontes."
 cc_byz_komnenoi.2.b: "Propose a marriage between [cc_kom_byz_spouse.GetName] and [cc_kom_tre_spouse.GetName]."
 cc_byz_komnenoi.2.c: "Ask the Patriarch to write to the metropolitan."
 cc_byz_komnenoi.2.d: "Build a party at court."

 # .3
 cc_byz_komnenoi.3.title: "The Turkmen Frontier"
 cc_byz_komnenoi.3.desc: "The Turkmen tribes in the hills behind [cc_kom_tre.GetName] raid the Pontic valleys every summer. Trebizond's ability to hold that frontier is the main reason it is still independent, and its court knows it.\n\nHelp on the frontier would be remembered. Withholding it would also be remembered, and a Trebizond that has lost men and villages will be easier to deal with."
 cc_byz_komnenoi.3.desc_war: "[cc_kom_tre.GetName] is at war, and its envoys have come to ask what Constantinople will do about it.\n\nHelp now would be remembered. Withholding it would also be remembered, and a Trebizond that has lost men and villages will be easier to deal with."
 cc_byz_komnenoi.3.a: "Send a tagma east."
 cc_byz_komnenoi.3.b: "Pay for the walls and garrison."
 cc_byz_komnenoi.3.c: "Trebizond can hold its own frontier."

 # .4
 cc_byz_komnenoi.4.title: "Komnenian Pride"
 cc_byz_komnenoi.4.desc: "The negotiations have reached the question of titles. The Grand Komnenos will not become a mere governor, and our council will not accept a second emperor.\n\nThere is a recognised middle position. The title of Despot ranks second only to the emperor and has been granted to imperial relatives for two centuries. Offering it costs us some prestige. Refusing to offer anything makes clear where the negotiations are going."
 cc_byz_komnenoi.4.a: "Offer the title of Despot."
 cc_byz_komnenoi.4.b: "They must drop the imperial style."
 cc_byz_komnenoi.4.c: "Settle it as a family matter."

 # .5
 cc_byz_komnenoi.5.title: "Rival Suitors"
 cc_byz_komnenoi.5.desc: "Other courts have noticed our embassies to [cc_kom_tre.GetName]. Envoys from abroad have arrived there with offers of their own: trade privileges, alliances and marriages. The archontes are listening to all of them.\n\nWe can outbid them, or denounce Trebizond's dealings with foreigners in public."
 cc_byz_komnenoi.5.desc_suitor: "Envoys from [cc_kom_suitor.GetName] have arrived in [cc_kom_tre.GetName] with offers of trade privileges, an alliance and a marriage. The archontes are listening.\n\nWe can outbid them, denounce Trebizond's dealings with foreigners in public, or approach [cc_kom_suitor.GetName] directly and come to an understanding about the Pontus."
 cc_byz_komnenoi.5.a: "Outbid them."
 cc_byz_komnenoi.5.b: "Denounce Trebizond's dealings."
 cc_byz_komnenoi.5.c: "Come to an understanding with [cc_kom_suitor.GetName]."

 # .6
 cc_byz_komnenoi.6.title: "The Settlement of Trebizond"
 cc_byz_komnenoi.6.desc: "After years of embassies the council must decide how to settle the question of the two crowns.\n\nWe can formally propose a union. If the archontes accept, one emperor will wear both crowns, and if our standing in Trebizond is high enough they may simply acclaim him and end the separate state. If they refuse, the alliance is over.\n\nOr we can declare Trebizond's crown a usurpation and claim it by right.\n\nCurrent #Y Accord#!: #Y [ROOT.GetCountry.MakeScope.GetVariable('cc_byz_kom_accord').GetValue|0]#!\nCurrent #Y Pretext#!: #Y [ROOT.GetCountry.MakeScope.GetVariable('cc_byz_kom_pretext').GetValue|0]#!"
 cc_byz_komnenoi.6.a: "Propose the union."
 cc_byz_komnenoi.6.b: "Declare their crown a usurpation."
 cc_byz_komnenoi.6.c: "Let the question rest."

 # .20
 cc_byz_komnenoi.20.title: "The Emperor's Proposal"
 cc_byz_komnenoi.20.desc: "Envoys from [cc_kom_emperor.GetName] have presented a formal proposal: the crowns of Constantinople and Trebizond joined under one emperor.\n\nIf we accept, the archontes will decide the terms. They may settle for a personal union with Constantinople as the senior partner, or they may acclaim the emperor outright and end Trebizond as a separate state. If we refuse, the alliance with Constantinople is over and the emperor will have a claim to our crown."
 cc_byz_komnenoi.20.a: "We accept."
 cc_byz_komnenoi.20.b: "Trebizond has its own emperor."

 # .21
 cc_byz_komnenoi.21.title: "Trebizond Accepts"
 cc_byz_komnenoi.21.desc: "The court of [cc_kom_tre.GetName] has accepted the union in principle. The archontes are meeting to settle the terms. They will either accept a personal union under our emperor or acclaim him as their own ruler outright."
 cc_byz_komnenoi.21.a: "We await their answer."

 # .30
 cc_byz_komnenoi.30.title: "Acclamation in Trebizond"
 cc_byz_komnenoi.30.desc: "The archontes of [cc_kom_tre.GetName] have acclaimed our emperor as their own ruler. The Grand Komnenian court is dissolved, its lands become provinces of the empire, and for the first time since 1204 there is one Roman emperor."
 cc_byz_komnenoi.30.a: "One empire."

 # .31
 cc_byz_komnenoi.31.title: "Two Crowns, One Emperor"
 cc_byz_komnenoi.31.desc: "The archontes of [cc_kom_tre.GetName] have agreed to a personal union. Trebizond keeps its own court and laws, and our emperor is now its ruler as well.\n\nFull integration will take decades. The union's laws decide how quickly it can happen."
 cc_byz_komnenoi.31.a: "It is a beginning."

 # .32
 cc_byz_komnenoi.32.title: "Trebizond Refuses"
 cc_byz_komnenoi.32.desc: "The court of [cc_kom_tre.GetName] has rejected the union. Its envoys have left Constantinople and the alliance between the two courts is at an end. Reports say Trebizond is already looking for other friends.\n\nThe council notes that the refusal gives the empire a claim to Trebizond's crown, for anyone who wants to press it."
 cc_byz_komnenoi.32.a: "They will regret it."

 # .40
 cc_byz_komnenoi.40.title: "A Usurped Crown"
 cc_byz_komnenoi.40.desc: "The emperor has declared that the crown of [cc_kom_tre.GetName] was taken in 1204 by a family with no right to it and is held unlawfully today. The empire claims it.\n\nThe alliance with Trebizond is over. The army is ready to enforce the claim."
 cc_byz_komnenoi.40.a: "The crown will be recovered."

 # .50
 cc_byz_komnenoi.50.title: "Under One Crown"
 cc_byz_komnenoi.50.desc: "The archontes have settled on a personal union. The emperor in Constantinople now rules Trebizond as well, as its senior partner. Our court and laws remain our own."
 cc_byz_komnenoi.50.a: "So be it."

 # .51
 cc_byz_komnenoi.51.title: "The Emperor's Claim"
 cc_byz_komnenoi.51.desc: "[cc_kom_emperor.GetName] has declared our crown a usurpation and claimed it by right. The alliance is over, and an army from Constantinople is likely to follow."
 cc_byz_komnenoi.51.a: "Man the walls."

 # .90
 cc_byz_komnenoi.90.title: "The Question Lapses"
 cc_byz_komnenoi.90.desc: "Circumstances have overtaken the negotiations with Trebizond. The other party can no longer settle anything on its own account, or the two courts are at war. The embassies are recalled and the matter is closed."
 cc_byz_komnenoi.90.a: "So be it."
