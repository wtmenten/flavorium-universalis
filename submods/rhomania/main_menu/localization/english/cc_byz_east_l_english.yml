l_english:
 # Mission tasks
 cc_byz_task_red_sea: "The Red Sea Strait"
 cc_byz_task_red_sea_desc: "Aden and the Yemeni coast. Egypt without the strait is a terminus; Egypt with it is a corridor, and everything moving between the Indian Ocean and Alexandria pays to use it."
 cc_byz_task_horn: "The African Shore"
 cc_byz_task_horn_desc: "Zeila, Berbera and Mogadishu. Cisterns, warehouses and a garrison at each. The long run to India cannot be made without them and every power that has tried has learned so the same way."
 cc_byz_task_india: "The Malabar Factories"
 cc_byz_task_india_desc: "A trading presence on the Indian coast, not a conquest of it. A factory, a charter behind it, and dues paid to whoever governs the harbour."
 cc_byz_task_spice_islands: "The Source"
 cc_byz_task_spice_islands_desc: "Sumatra and Java, where the spice actually grows. Everything west of here is a middleman, and for two centuries that has meant Venice."

 # Theatre triggers
 cc_byz_eastern_gate_tt: "We or a subject hold Alexandria, Cairo and the Sinai"
 cc_byz_theatre_red_sea_tt: "We or a subject have a presence on the Yemeni coast"
 cc_byz_theatre_horn_tt: "We or a subject hold a station on the Horn"
 cc_byz_theatre_india_tt: "We or a subject have a presence on the Indian coast"
 cc_byz_theatre_spice_islands_tt: "We or a subject have a presence in the spice islands"

 # Theatre actions
 cc_byz_claim_theatre_red_sea: "Proclaim the Red Sea Passage"
 cc_byz_claim_theatre_red_sea_desc: "Declare the strait open under imperial authority, and settle who may use it and on what terms."
 cc_byz_claim_theatre_horn: "Proclaim the African Stations"
 cc_byz_claim_theatre_horn_desc: "Establish the victualling stations that make the run to India possible, and decide whether they are garrisons or guest houses."
 cc_byz_claim_theatre_india: "Proclaim the Indian Trade"
 cc_byz_claim_theatre_india_desc: "Establish factories on the Indian coast and a chartered company to run them."
 cc_byz_claim_theatre_spice_islands: "Proclaim the Spice Trade"
 cc_byz_claim_theatre_spice_islands_desc: "Reach the islands where the spice grows, and become the power that sells it rather than the power that buys it."

 # Country modifiers
 STATIC_MODIFIER_NAME_cc_byz_red_sea_transit: "The Red Sea Transit"
 STATIC_MODIFIER_DESC_cc_byz_red_sea_transit: "The strait is held and the dues are collected. Every cargo moving between the Indian Ocean and the Mediterranean passes an imperial customs house."
 STATIC_MODIFIER_NAME_cc_byz_horn_stations: "The African Stations"
 STATIC_MODIFIER_DESC_cc_byz_horn_stations: "Cisterns, warehouses and pilots on the Somali coast. Unglamorous, and the difference between a route and an ambition."
 STATIC_MODIFIER_NAME_cc_byz_indian_factories: "The Indian Factories"
 STATIC_MODIFIER_DESC_cc_byz_indian_factories: "Imperial merchants resident on the Malabar coast, trading under charter, with warehouses of their own and a consul to argue their case."
 STATIC_MODIFIER_NAME_cc_byz_spice_monopoly: "The Spice Trade"
 STATIC_MODIFIER_DESC_cc_byz_spice_monopoly: "The empire buys where the spice grows and sells where it is wanted, and the Italian houses that spent two centuries in between now buy it from Constantinople."
 STATIC_MODIFIER_NAME_cc_byz_eastern_company: "The Eastern Company"
 STATIC_MODIFIER_DESC_cc_byz_eastern_company: "A chartered company carries the ships, the losses and the risk. The crown carries the seal and takes a share of what comes back."
 STATIC_MODIFIER_NAME_cc_byz_eastern_learning: "Learning from the East"
 STATIC_MODIFIER_DESC_cc_byz_eastern_learning: "Scholars went out with the merchants and came back with mathematics, astronomy and medicine. The cheapest thing the empire bought out there and the one that outlasted the factories."

 # Casus belli
 cc_byz_cb_indian_ocean: "The Indian Ocean"
 cc_byz_cb_indian_ocean_desc: "The empire holds the strait, and the powers of the ocean beyond it are now near neighbours whether either party wished it."

 # cc_byz_east.1 - the strait
 cc_byz_east.1.title: "The Strait"
 cc_byz_east.1.desc: "Alexandria, Cairo and the Sinai are held together, which means for the first time since Justinian the empire controls the whole passage between the Indian Ocean and the Mediterranean.\n\nThe implication has been put to the palace by a Greek merchant who has made the Aden run twice and is one of very few people in Constantinople who understands what is now possible. The spice does not come from Cairo. It comes through Cairo, from ports the empire has never seen, carried by ships the empire does not own, and the sultan's officials have been growing rich for two centuries doing nothing more than standing between the two ends of it.\n\nThat position is now the emperor's. What he does with it is the question."
 cc_byz_east.1.desc_indebted: "The empire controls the whole passage between the Indian Ocean and the Mediterranean, and it has creditors who understood the implications of that before the palace did.\n\nThe Venetian and Genoese factors have already asked, separately and with great care, what the emperor intends regarding the transit. Both have observed that the existing arrangements have served everyone well. Neither mentioned the outstanding balances, which is how the palace knows the balances are what the conversation was about.\n\nThe spice route is the most valuable thing the empire has acquired in three hundred years, and the men best placed to exploit it are the men it owes money to."
 cc_byz_east.1.a: "Tax the passage. Let everyone use it."
 cc_byz_east.1.b: "Close it to Latin shipping."
 cc_byz_east.1.c: "Charter a company. Let merchants carry the risk."

 # cc_byz_east.10 - the long run
 cc_byz_east.10.title: "The Long Run"
 cc_byz_east.10.desc: "The distance is the problem and it is not a problem that can be solved by wanting to.\n\nA ship leaving the Red Sea for the Malabar coast is at sea for weeks with no friendly harbour, on a monsoon schedule that permits the crossing twice a year and punishes anyone who misjudges it. Water runs out. Hulls foul. Crews sicken.\n\nThe answer has been known since the Ptolemies and it is unglamorous: stations on the African shore. Zeila, Berbera, Mogadishu. Cisterns, a warehouse, someone who knows the winds. Whoever holds those makes the crossing routine, and whoever does not makes it an adventure."
 cc_byz_east.10.a: "Build them properly. Cisterns, warehouses, garrisons."
 cc_byz_east.10.b: "Come to terms with the harbour masters."
 cc_byz_east.10.c: "Send the fleet ahead and take what we need."

 # cc_byz_east.20 - the factories
 cc_byz_east.20.title: "The Malabar Coast"
 cc_byz_east.20.desc: "The Indian Ocean has been running an orderly international trade for a thousand years and the empire has arrived late to it.\n\nThe arrangement is well understood by everyone except the newcomers. Foreign merchants live in a designated quarter, trade under the local ruler's protection, pay his dues, and settle disputes in his courts. Arabs, Persians, Chinese and Jews have all done business on these terms for centuries and grown wealthy at it.\n\nThe imperial factors have been offered exactly that. Several of them find it beneath the dignity of the Roman Empire. The ones who have been out there longest are the ones arguing hardest to accept it."
 cc_byz_east.20.desc_force: "The empire has arrived on the Malabar coast with a fleet, which has changed what is on offer.\n\nThe local rulers have dealt with armed foreigners before and their assessment is unsentimental: the ships are formidable, they are very far from home, and the monsoon means they cannot be reinforced for six months of the year. Terms have been offered that are noticeably worse than those the Arabs and Persians enjoy, on the reasonable grounds that a power which arrives armed is asking a different question.\n\nThe imperial commander has requested instructions. He has also, in a separate dispatch, noted how few of his ships would still be afloat if the arrangement went wrong in July."
 cc_byz_east.20.a: "Trade as guests, under local law."
 cc_byz_east.20.b: "Fortify the factories."
 cc_byz_east.20.c: "Send scholars out with the merchants."

 # cc_byz_east.30 - the source
 cc_byz_east.30.title: "The Source"
 cc_byz_east.30.desc: "The islands where the spice grows are reached, and the most striking thing about them is how small they are.\n\nA commodity that has been the most valuable cargo in the western world since before Rome fell, that funded the Venetian republic and half the fortunes in Genoa, comes from a scatter of islands the imperial navigators had to be shown on a chart. The growers sell it for a fraction of what it fetches in Alexandria and are perfectly aware of the disparity; they simply had no way to reach the other end of the chain.\n\nThe empire now holds both ends of it."
 cc_byz_east.30.desc_treaty: "The islands where the spice grows are reached, and reached on terms rather than by force, which the imperial factors regard as the more durable achievement.\n\nEvery agreement from the Yemen to Java was negotiated: dues paid, local law accepted, quarrels settled in somebody else's court. It took longer than a fleet would have and it has produced something a fleet could not, which is a route that does not need to be garrisoned to stay open.\n\nThe growers sell for a fraction of what the spice fetches in Alexandria. The empire now stands where Venice stood, and it got there by being a better customer rather than a worse neighbour."
 cc_byz_east.30.desc_monopoly: "The islands where the spice grows are reached, and the strait behind them has been shut to Latin shipping for a generation.\n\nThe consequence is not subtle and was not meant to be. Venice and Genoa built themselves on standing between the spice and its buyers, and they are not standing there any more; the empire is. The Rialto is discovering what it is like to be a customer, and the reports from the Venetian senate are being read in Constantinople with an attention that is not entirely dignified.\n\nIt is the single most profitable thing the empire has done since Justinian. It has also made permanent enemies of the only powers in the west with fleets."
 cc_byz_east.30.a: "A crown monopoly."
 cc_byz_east.30.b: "Farm it to the burghers. Take a share."
 cc_byz_east.30.c: "Sell the Italians their access back, at our price."
