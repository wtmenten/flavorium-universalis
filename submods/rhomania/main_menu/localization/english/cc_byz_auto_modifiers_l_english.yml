l_english:
 # Auto-modifier labels.
 #
 # EVERY auto_modifier needs an AUTO_MODIFIER_NAME_<key> or it shows as a missing key in the
 # societal values breakdown. AUTO_MODIFIER_DESC_<key> is optional: vanilla ships 165 NAME
 # keys and only 16 DESC, so a name alone is the normal case and is what these use.
 #
 # CONVENTION. The name reads as the CONDITION, not as a title, because these appear in a list
 # explaining why a value is drifting. Compare vanilla's byz entries, e.g.
 # AUTO_MODIFIER_NAME_byz_capital_constantinople: "[capital|e] is [ShowLocationName('constantinople')]".
 # Each line below states the trigger it is attached to, so the player can read the list and
 # know what to change.
 #
 # Deliberately plain text rather than concept markup. These strings get machine-translated,
 # and an invented [scope.Function] token is the failure mode that errors in game, so the
 # tokens are omitted rather than guessed at.

 # Toward Dynatoi: the provincial powerful
 AUTO_MODIFIER_NAME_cc_byz_pronoia_grants: "Pronoia grants outstanding"
 AUTO_MODIFIER_NAME_cc_byz_weak_crown: "Crown estate power below 35%"
 AUTO_MODIFIER_NAME_cc_byz_ascendant_nobles: "Nobles powerful and contented"

 # Toward Taxis: the imperial bureaus
 AUTO_MODIFIER_NAME_cc_byz_staffed_bureaus: "Bureaus staffed and funded"
 AUTO_MODIFIER_NAME_cc_byz_strong_crown: "Crown estate power at or above 50%"
 AUTO_MODIFIER_NAME_cc_byz_literate_administration: "Average literacy above 20%"

 # The Rhomanismos advance line. Each of these carries the conditional bulk of an advance
 # whose permanent core sits on the advance itself, so the label names the advance and the
 # requirement that keeps it live.
 AUTO_MODIFIER_NAME_cc_byz_taxis_of_offices_active: "Taxis of Offices, on the Rhomaios side"
 AUTO_MODIFIER_NAME_cc_byz_oikonomia_active: "Imperial Oikonomia, on the Rhomaios side"
 AUTO_MODIFIER_NAME_cc_byz_tagmata_restored_active: "The Tagmata Restored, on the Rhomaios side"
 AUTO_MODIFIER_NAME_cc_byz_palaiologan_revival_active: "The Palaiologan Revival, on the Rhomaios side"
 AUTO_MODIFIER_NAME_cc_byz_basilika_active: "The Basilika, on the Rhomaios side"
 AUTO_MODIFIER_NAME_cc_byz_annona_active: "The Annona, on the Rhomaios side"
 AUTO_MODIFIER_NAME_cc_byz_ecumenical_office_active: "The Ecumenical Office, on the Rhomaios side"
 AUTO_MODIFIER_NAME_cc_byz_dromos_active: "The Dromos, on the Rhomaios side"
 AUTO_MODIFIER_NAME_cc_byz_thematic_administration_active: "Thematic Administration, on the Rhomaios side"
 AUTO_MODIFIER_NAME_cc_byz_autokrator_active: "Autokrator, on the Rhomaios side"
 AUTO_MODIFIER_NAME_cc_byz_great_church_active: "The Great Church, on the Rhomaios side"

 # These two additionally require the capital to still be Constantinople, which is the whole
 # trade the Renovatio track asks the player to make, so the label says so.
 AUTO_MODIFIER_NAME_cc_byz_renovatio_imperii_active: "Renovatio Imperii, on the Rhomaios side, capital at Constantinople"
 AUTO_MODIFIER_NAME_cc_byz_exarchal_chancery_active: "The Exarchal Chancery, on the Rhomaios side, capital at Constantinople"

 # The two office feeders share a potential_trigger and differ in what they scale on
 # (cc_byz_taxis_funded against cc_byz_dynatoi_funded), so the labels have to say whose
 # offices are meant or the breakdown shows the same sentence pushing both ways.
 AUTO_MODIFIER_NAME_cc_byz_taxis_offices: "Offices of the fisc staffed and funded"
 AUTO_MODIFIER_NAME_cc_byz_dynatoi_offices: "Offices of the magnates staffed and funded"
 AUTO_MODIFIER_NAME_cc_byz_starved_offices: "Bureaus funded below half"

 # The West. The first four read the situation's own autonomy and grip variables; the
 # last five each name a standing law of the prefectures.
 AUTO_MODIFIER_NAME_cc_byz_west_autonomous: "Western autonomy at or above 50"
 AUTO_MODIFIER_NAME_cc_byz_west_latin_drift: "Western autonomy at or above 50"
 AUTO_MODIFIER_NAME_cc_byz_west_gripped: "Imperial grip on the west at or above 60"
 AUTO_MODIFIER_NAME_cc_byz_west_greek_hold: "Imperial grip on the west at or above 60"
 AUTO_MODIFIER_NAME_cc_byz_west_law_rite_local: "Prefectures hold to the local rite"
 AUTO_MODIFIER_NAME_cc_byz_west_law_rite_latin: "Prefectures celebrate the Latin rite"
 AUTO_MODIFIER_NAME_cc_byz_west_law_command_exarchal: "Command of the west left to the exarchs"
 AUTO_MODIFIER_NAME_cc_byz_west_law_hereditary: "Prefectures pass by inheritance"
 AUTO_MODIFIER_NAME_cc_byz_west_law_fisc_remitted: "Western revenue remitted to the capital in full"
