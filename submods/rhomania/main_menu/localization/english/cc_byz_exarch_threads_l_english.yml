l_english:
 # Country modifiers
 STATIC_MODIFIER_NAME_cc_byz_protector_of_the_see: "Protector of the See"
 STATIC_MODIFIER_DESC_cc_byz_protector_of_the_see: "The papacy exists because the emperor allowed it to. Every Catholic court in Europe understands the arrangement and a good many of them are quietly grateful for it."

 # Opinion modifiers
 cc_byz_papal_forbearance: "Left Us Our Dignity"
 cc_byz_papal_captivity: "Holds Us Captive"

 # Casus belli
 cc_byz_cb_recover_the_islands: "Recover the Islands"
 cc_byz_cb_recover_the_islands_desc: "The Aegean was an imperial lake within living memory. It is now held in pieces by a duchy answering to Venice, a Genoese family at Chios, a crusading order at Rhodes and whoever currently holds Negroponte. None of them can defend what they hold against a fleet. All of them can appeal to somebody who can."
 cc_byz_cb_consolidate_italy: "Consolidate the Exarchate"
 cc_byz_cb_consolidate_italy_desc: "An exarch at Rome has a claim to argue anywhere in Italy, and the claim is only worth arguing while there is an exarch to argue it. Lose the exarchate and this goes with it."

 # cc_byz_exarch.1 - the first independent decision
 cc_byz_exarch.1.title: "A Decision Taken Without Asking"
 cc_byz_exarch.1.desc: "The exarch has settled a dispute between two Italian lords, in the emperor's name, on his own authority, and reported it afterwards in a letter that is respectful in every line and asks permission for nothing.\n\nThe settlement is a good one. A man in Constantinople could not have reached it, having neither the local knowledge nor the six months the correspondence would have taken. That is exactly why he was appointed and exactly why the letter is being read three times in the palace."
 cc_byz_exarch.1.desc_strategos: "The exarch has settled a dispute between two Italian lords on his own authority and reported it afterwards, which is what he was appointed to do, since he was appointed on terms that gave him the widest latitude available.\n\nThe settlement is sound. It is also the third such letter this year, and the palace has begun to notice that the reports arrive at a comfortable interval after the decisions, and that nothing in any of them has ever been phrased as a question."
 cc_byz_exarch.1.a: "Confirm it. He was appointed to decide things."
 cc_byz_exarch.1.b: "Overrule it. The next one comes here first."
 cc_byz_exarch.1.c: "Confirm it publicly. Correct him privately."

 # cc_byz_exarch.2 - going native
 cc_byz_exarch.2.title: "The Exarch's Court"
 cc_byz_exarch.2.desc: "The reports from Rome have become detailed on a subject nobody asked about.\n\nThe exarch's household now keeps Latin usage. His secretaries write in it because the men they write to read it. His chapel follows the local rite because the local clergy staff it. His sons are being educated by Italians because those are the tutors available, and he has taken an Italian wife, which was sensible, and her family are now at his table, which was inevitable.\n\nNone of this was disobedience. He was sent to govern Rome and he is governing Rome. The irony has not been lost on the emperor who declined to move there."
 cc_byz_exarch.2.a: "Leave it. A governor at home in his province governs it better."
 cc_byz_exarch.2.b: "Send Greek clergy and Greek clerks, at our expense."
 cc_byz_exarch.2.c: "Summon his sons to be raised at the palace."

 # cc_byz_exarch.3 - correspondence
 cc_byz_exarch.3.title: "The Exarch's Correspondence"
 cc_byz_exarch.3.desc: "The exarch is corresponding with Venice, with Genoa, with two of the northern communes and with a cardinal, and the palace knows this because he has never made any attempt to conceal it.\n\nHe would say, and has said, that a governor in Italy who does not talk to Italians is a governor who learns everything six months late. This is true. It is also true that he is now the man in Italy who knows what everyone is doing, and that Constantinople learns it from him."
 cc_byz_exarch.3.desc_latinised: "The exarch is corresponding with half of Italy, in Latin, through secretaries who were born there, and the letters that reach Constantinople are summaries he has prepared himself.\n\nHe would say that a governor who does not talk to his neighbours is useless, and he is right. What has changed is that the court at Rome now looks, to anyone in Italy with business to transact, like the place where imperial policy is actually decided. Several of them have stopped writing to Constantinople at all."
 cc_byz_exarch.3.a: "A governor in Italy must talk to Italians."
 cc_byz_exarch.3.b: "Every letter to be copied to the capital."
 cc_byz_exarch.3.c: "Use him. He is an instrument we are not paying for."

 # cc_byz_exarch.4 - the recall
 cc_byz_exarch.4.title: "The Summons"
 cc_byz_exarch.4.desc: "The exarch is summoned to Constantinople to report in person. The wording is warm, the occasion plausible, and nobody involved is confused about what is being tested.\n\nIf he comes, the arrangement holds: a governor who can be called home is a governor. If he does not, then whatever the exarchate has become, it stopped being that some years ago and the palace has only now got round to asking."
 cc_byz_exarch.4.a: "Insist. Send someone to escort him."
 cc_byz_exarch.4.b: "Withdraw it before it is refused in public."
 cc_byz_exarch.4.c: "Offer him something here worth more than Rome."

 # cc_byz_exarch.5 - the ending
 cc_byz_exarch.5.title: "The Exarchate"
 cc_byz_exarch.5.desc_dynasty: "The office is hereditary now. No grant was made and no charter exists; a son succeeded a father, the palace was informed, and the palace found that its available responses were a war in Italy it could not fund or a letter of congratulation. It sent the letter.\n\nThe exarchs remit a sum each year, which is smaller than it was and arrives on time, and they fight the empire's wars when the empire's wars are also theirs. In every other respect Rome is governed by a family that holds it in its own right and dates its authority from an appointment nobody now living remembers.\n\nThis is how the empire lost the west the first time. It took rather longer on that occasion."
 cc_byz_exarch.5.desc_absorbed: "The exarchate has quietly stopped being one. The current exarch is the fourth, he was chosen in Constantinople from a list prepared in Constantinople, he served in two other posts before this one and expects to serve in another afterwards, and the difference between his position and that of any other governor is now purely a matter of the title on his correspondence.\n\nRome is a province. It is administered, assessed and garrisoned from the capital, and the men who administer it are officials rather than a family. The arrangement that was invented to avoid moving the capital has ended by making the move unnecessary."
 cc_byz_exarch.5.desc_standing: "The arrangement persists, which is not the same as being settled.\n\nThe exarch obeys instructions that arrive with sufficient authority behind them and interprets the rest. He remits what he judges the capital needs and retains what he judges Rome needs, and his judgement has been broadly defensible. His successor will be chosen partly in Constantinople and partly in Rome, by a process nobody has written down, and both parties will describe the outcome as having been their decision.\n\nIt works. Nobody involved would care to explain precisely why."
 cc_byz_exarch.5.desc_recalled: "The arrangement holds, and everyone involved knows precisely how close it came not to.\n\nHe was summoned and he came. He was in Constantinople eleven weeks, was received well, was returned to his post, and the whole business is now referred to as a consultation. What it established is that the summons works, which the palace needed to know and had no other way of finding out.\n\nIt also established the price. He came because coming was, on balance, better than the alternative, and both parties did that arithmetic. The next exarch will do it too, and the terms will not always favour the capital as narrowly as they did this time."
 cc_byz_exarch.5.a: "So it stands."

 # cc_byz_papal.1 - the rite
 cc_byz_papal.1.title: "The Rite in the City's Churches"
 cc_byz_papal.1.desc: "The exarch requires instruction on a point he cannot settle himself, and he is right that he cannot.\n\nRome is a Catholic city administered by an Orthodox appointee on behalf of an Orthodox emperor. Its churches celebrate the Latin rite because they always have. The question is whether they continue to, whether anything changes in the principal churches, and whether the emperor's name is spoken in the liturgy of a city whose bishop regards him as a schismatic.\n\nThere is no answer that is not a statement, including the answer of leaving it alone."
 cc_byz_papal.1.a: "Leave the churches alone. The rite is not our business."
 cc_byz_papal.1.b: "Greek liturgy in the principal churches."
 cc_byz_papal.1.c: "One Greek church, richly endowed. Nothing else touched."

 # cc_byz_papal.2 - guest, subject or hostage
 cc_byz_papal.2.title: "The Bishop of Rome"
 cc_byz_papal.2.desc: "The status of the Pope has not been defined, because defining it has been convenient to avoid and because no definition would please anybody.\n\nHe lives in a city the emperor's governor administers. He has a household, a correspondence, an income and a great many visitors, and at present all four continue because nobody has decided they should not. The exarch is asking for a rule, having been placed in the position of improvising one every time a question arises, and he is entitled to ask."
 cc_byz_papal.2.desc_hostile: "The status of the Pope has not been defined, and the absence of a definition has stopped being convenient.\n\nRelations are bad. He has protested the appointments, the rite and the taxation, in that order and in writing, and the letters have circulated in the west. He has a household, a correspondence and a great many visitors, and the exarch has begun asking, with some urgency, which of those three he is expected to permit."
 cc_byz_papal.2.a: "A guest. His household, his guard, his letters."
 cc_byz_papal.2.b: "A subject. We pay for the household and read the letters."
 cc_byz_papal.2.c: "Leave it undefined. Practice will settle it."

 # cc_byz_papal.3 - appointments
 cc_byz_papal.3.title: "Appointments Without Assent"
 cc_byz_papal.3.desc: "The Pope has appointed bishops to sees inside the exarchate without reference to the exarch or to Constantinople.\n\nHe would say that appointing bishops is what he is for, and that no emperor has ever been asked. The emperor would say that no emperor has ever governed the city before, and that the men being appointed hold land, collect revenue and command the loyalty of populations the exarch is responsible for.\n\nBoth positions have four hundred years of precedent. The precedents do not agree, which is why there are four hundred years of them."
 cc_byz_papal.3.desc_subject: "The Pope has appointed bishops inside the exarchate without reference to anyone, which is a considerable assertion from a man whose household is paid for out of the exarch's accounts.\n\nIt is also, the exarch notes in his report, being read in Italy as exactly that: a demonstration that the papacy still functions, made by a papacy that has very little else left to demonstrate it with. Refusing the appointments would confirm what the emperor's critics say about the arrangement. Accepting them would confirm what they say about the emperor."
 cc_byz_papal.3.a: "Refuse them. Name our own men."
 cc_byz_papal.3.b: "Accept them. A bishop is a bishop."
 cc_byz_papal.3.c: "Let the exarch settle it locally."

 # cc_byz_papal.4 - excommunication
 cc_byz_papal.4.title: "The Sentence"
 cc_byz_papal.4.desc: "The sentence of excommunication has been pronounced and published, against the exarch by name and against the emperor in terms that leave no doubt.\n\nAgainst the emperor it is close to meaningless: he is not in that communion and has not been since before his grandfather was born. Against the exarch it is not meaningless at all. He governs Catholics, his soldiers are Catholics, his wife's family are Catholics, and every one of them has now been told by their own church that obedience to him is a sin.\n\nThe Pope has selected the one instrument that costs the emperor nothing and costs his governor everything."
 cc_byz_papal.4.a: "Ignore it. We were never in his communion."
 cc_byz_papal.4.b: "Remove the exarch. Appoint someone acceptable."
 cc_byz_papal.4.c: "Have it lifted through the legation, not by submission."

 # cc_byz_papal.10 - THE GUARD
 cc_byz_papal.10.title: "The Last of the Patrimony"
 cc_byz_papal.10.desc: "The Papal States are finished as a temporal power. What remains is a city, a household and an old man with a title, and the armies in the field could end all three inside a season.\n\nThe argument for ending it is that a papacy with territory is a papacy that can raise armies, fund enemies and take sides, and it has done all three. The argument against is subtler and the exarch has put it well: the office survives the destruction of the state, and a pope who has been stripped of everything is a pope whose successors are chosen by whoever shelters them. Better a papacy that owes the emperor its existence than a papacy in someone else's keeping, elected in someone else's city, permanently at the disposal of whichever western power took it in.\n\nThe cardinals are watching what is decided. So is every Catholic court in Europe."
 cc_byz_papal.10.a: "Leave him the city. Take the rest."
 cc_byz_papal.10.b: "Take the city. Leave him the office."
 cc_byz_papal.10.c: "Finish it. There will be no more popes."

 # cc_byz_papal.11 - no papacy
 cc_byz_papal.11.title: "A Church Without a Head"
 cc_byz_papal.11.desc: "There is no pope, and there is no procedure for producing one, because every procedure that existed ran through an institution that no longer does.\n\nThe cardinals are scattered across four countries and each group maintains that it alone constitutes the college. Three kings have offered to host an election and each offer has been understood by the other two as an attempt to purchase the papacy outright. The bishops are corresponding furiously and agreeing on nothing.\n\nWestern Christendom is discovering what it means to have no arbiter, and it is discovering it because of a decision taken in Constantinople."
 cc_byz_papal.11.a: "Let them argue it out among themselves."
 cc_byz_papal.11.b: "Convene the western bishops ourselves."
 cc_byz_papal.11.c: "The see is vacant. Its rights return to the patriarchs."

 # cc_byz_italy.1 - Guelph and Ghibelline
 cc_byz_italy.1.title: "Guelph and Ghibelline"
 cc_byz_italy.1.desc: "Italy has been divided for a century between the party of the Pope and the party of the Emperor, and the division has long since stopped being about either of them. It is how a commune knows which of its neighbours to hate.\n\nInto this arrives an exarchate: a new power in Italy, holding Rome, governing on behalf of an emperor who is unquestionably an emperor and is not the one the Ghibellines mean. Both parties have sent representatives. Both have explained that the exarchate's position is obviously theirs. Neither has considered that it might be a third thing."
 cc_byz_italy.1.a: "The Ghibellines. There is an emperor in this quarrel already."
 cc_byz_italy.1.b: "The Guelphs. We hold the Pope's city; let us hold his party."
 cc_byz_italy.1.c: "Neither. We are the imperial party."

 # cc_byz_italy.2 - the quarters
 cc_byz_italy.2.title: "The Quarters in the Ports"
 cc_byz_italy.2.desc: "The republics want in the exarchate's ports what they have in Constantinople: a quarter, a warehouse, their own courts for their own people, and exemption from the duties everyone else pays.\n\nThey point out that they have those things everywhere else on this coast and that the trade will simply go to the ports where they do. This is true. They do not point out that a quarter with its own courts is a piece of another state, because everybody in the room already knows it and saying so would be indelicate."
 cc_byz_italy.2.desc_indebted: "The republics want quarters in the exarchate's ports, and the request has been framed with a delicacy that is itself the message.\n\nThey have mentioned the outstanding balances only once, early, in passing, as a matter they are confident need not affect the present discussion. Nobody in the room believed that and nobody was meant to. The emperor is being asked for a favour by men who could call in what he owes, and the fact that they have chosen to ask rather than to demand is the courtesy being extended."
 cc_byz_italy.2.a: "Grant the quarters. We need the trade."
 cc_byz_italy.2.b: "Refuse. Garrison the ports properly."
 cc_byz_italy.2.c: "One republic only, on condition it excludes the others."

 # cc_byz_italy.3 - the communes
 cc_byz_italy.3.title: "The Communes"
 cc_byz_italy.3.desc: "The communes of the exarchate would prefer not to be governed by an imperial official, and are being careful to explain that this is nothing personal.\n\nThey have run their own affairs for six generations through councils, consuls and a body of custom that predates every claim currently being made over them. What they want is what they have always wanted: to be confirmed in their liberties by a distant authority that then goes away. Several have suggested a signore of their own choosing who would hold from the exarch, which solves the problem elegantly and creates a different one."
 cc_byz_italy.3.a: "Garrison them."
 cc_byz_italy.3.b: "Let each keep its signore, confirmed by the exarch."
 cc_byz_italy.3.c: "Buy them with charters instead of garrisons."

 # cc_byz_italy.4 - a second emperor
 cc_byz_italy.4.title: "Two Roman Emperors"
 cc_byz_italy.4.desc: "The question has been raised in the north, formally, in a document intended to be read aloud: by what right does the ruler in Constantinople style himself Roman emperor while a Roman emperor is crowned in the west, and by what further right does he garrison Rome?\n\nThe answer is eleven hundred years of continuous succession from Augustus, and it is a very good answer, and it has never once settled this argument. The west has its own answer, of comparable quality, and the two have coexisted by the simple expedient of neither party holding Rome. That expedient has now lapsed."
 cc_byz_italy.4.desc_ghibelline: "The question has been raised in the north, and the awkwardness is considerable, because the exarchate is enrolled in the imperial party of a quarrel about which emperor is meant.\n\nThe Ghibellines accepted an eastern emperor's governor into their party on the understanding that an emperor is an emperor and Italy's enemies are the Pope's friends. Their patron in Germany has now asked, in writing and in public, which emperor exactly the imperial party takes itself to be supporting. Nobody in the party wishes to answer and the document requires that somebody does."
 cc_byz_italy.4.desc_dynasty: "The question has been raised in the north: by what right does the ruler in Constantinople style himself Roman emperor, and by what further right does he garrison Rome?\n\nThe second half of the question is the difficulty, because the honest answer is that he does not. Rome is held by a family that has governed it for four generations, remits a courtesy payment, and would treat an instruction from Constantinople about its conduct toward the western emperor as a matter for its own judgement.\n\nThe document from the north has been addressed to Constantinople. The reply, whatever it says, will have to be carried out by people who did not write it and were not asked."
 cc_byz_italy.4.desc_absorbed: "The question has been raised in the north: by what right does the ruler in Constantinople style himself Roman emperor, and by what further right does he garrison Rome?\n\nOn this occasion the answer is straightforward, which is unusual enough to be worth noting. Rome is a province. It is assessed, garrisoned and administered by officials appointed in Constantinople and recalled at will, exactly as Thrace is. The emperor holds the city in the same sense that he holds any other city, and the western claim is a claim against a state that is demonstrably governing the place.\n\nThat is a much better position to argue from than the empire has occupied in Italy for eight hundred years."
 cc_byz_italy.4.a: "Answer in kind. There is one Roman emperor."
 cc_byz_italy.4.b: "Say nothing. Titles are cheap and Rome is not."
 cc_byz_italy.4.c: "Propose that the two empires recognise each other."
