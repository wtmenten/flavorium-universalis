l_english:
 # Mission task
 cc_byz_ven_task_free_tt: "Venice exists, is no one's subject, and is not at war with us, and we hold Constantinople"
 cc_byz_ven_opens_chain_tt: "Opens #Y The Serenissima Question#!, a series of events over about fifty years that can end with Venice as our perpetual ally, as a client Ducate, kept out of the Holy Roman Empire, or as an enemy"

 # Score tooltips
 cc_byz_ven_concord_plus1_tt: "#Y Concord with Venice#! #G +1#!"
 cc_byz_ven_concord_plus2_tt: "#Y Concord with Venice#! #G +2#!"
 cc_byz_ven_concord_minus1_tt: "#Y Concord with Venice#! #R -1#!"
 cc_byz_ven_concord_minus2_tt: "#Y Concord with Venice#! #R -2#!"
 cc_byz_ven_leverage_plus1_tt: "#Y Leverage over Venice#! #G +1#!"
 cc_byz_ven_leverage_plus2_tt: "#Y Leverage over Venice#! #G +2#!"
 cc_byz_ven_leverage_minus1_tt: "#Y Leverage over Venice#! #R -1#!"
 cc_byz_ven_creditor_grip_plus1_tt: "#Y Creditor grip#! #R +1#!"
 cc_byz_ven_exarch_restrained_tt: "Our exarch in Italy wants less of Venice's land, and resents being told so: #Y exarch appetite#! #G -1#!, #Y exarch loyalty#! #R -1#!"
 cc_byz_ven_exarch_unleashed_tt: "Our exarch in Italy wants more: #Y exarch appetite#! #R +1#!"
 cc_byz_ven_dux_offered_tt: "If the question ends in an alliance or the Ducate, Venice will be kept out of the Holy Roman Empire"

 # Offers
 cc_byz_ven_port_buy_tt: "We offer to buy [cc_ven_port.GetName]. Venice asks 25 gold per point of development, between 150 and 600"
 cc_byz_ven_port_swap_tt: "We offer [cc_ven.GetName] trading rights in our markets for 30 years in exchange for [cc_ven_port.GetName]. #Y Leverage#! #R -1#! if accepted"
 cc_byz_ven_venice_decides_tt: "The government of [cc_ven.GetName] decides"
 cc_byz_ven_port_ai_rule_tt: "[cc_ven.GetName] agrees if #Y Concord#! is 5 or more"
 cc_byz_ven_ducate_ai_rule_tt: "[cc_ven.GetName] may accept or refuse. The odds improve at #Y Concord#! 9 or more and #Y Leverage#! 4 or more. A refusal still gives us the perpetual alliance"
 cc_byz_ven_port_accept_tt: "The port passes to [cc_ven_emperor.GetName]"
 cc_byz_ven_port_refuse_tt: "We keep the port. Relations cool a little"
 cc_byz_ven_proposal_accept_tt: "We accept the proposal of [cc_ven_emperor.GetName]"
 cc_byz_ven_proposal_refuse_tt: "We refuse. Relations with [cc_ven_emperor.GetName] continue on their current footing"
 cc_byz_ven_ducate_tt: "Venice becomes the #Y Ducate of Venetia#!: a subject that keeps its republic, fleet, wars and diplomacy, pays a small tribute, and lets our merchants trade free of its tariffs. It can never be annexed. Venice is kept out of the Holy Roman Empire"
 cc_byz_ven_alliance_tt: "A perpetual alliance with Venice, with lasting naval and trade bonuses on both sides"
 cc_byz_ven_rupture_tt: "Relations with Venice break. We gain a 25-year war claim on its ports in the Morea and the Aegean"

 # Subject type
 cc_byz_venetian_ducate: "Ducate of Venetia"
 cc_byz_venetian_ducate_desc: "Venice acknowledges the emperor again, as its first doges did. The republic governs itself, keeps its fleet and its colonies, and fights its own wars. It sends a tribute and lets imperial merchants trade free of its tariffs."
 LEAD_cc_byz_venetian_ducate: "Emperor"
 AM_cc_byz_venetian_ducate: "Ducate of Venetia"
 CANCEL_cc_byz_venetian_ducateTITLE: "Release the Ducate"
 CANCEL_cc_byz_venetian_ducate_DESC: "Release Venice from its acknowledgement of the emperor. The republic becomes fully independent again."
 CANCEL_cc_byz_venetian_ducate_CATEGORY: "CATEGORY_SUBJECT_ACTIONS"

 # Casus belli
 cc_byz_cb_stato_da_mar: "The Stato da Mar"
 cc_byz_cb_stato_da_mar_desc: "Venice broke faith with the empire. Its ports in the Morea and the Aegean were Roman before they were Venetian."
 cc_byz_cb_stato_da_mar_PROV: "The Stato da Mar"

 # Opinion modifiers
 cc_byz_ven_courted: "Courted by the Emperor"
 cc_byz_ven_slighted: "Slighted by the Emperor"
 cc_byz_ven_wronged: "Wronged by the Emperor"
 cc_byz_ven_sworn_friends: "Sworn Friends of the Emperor"
 cc_byz_ven_broken_faith: "Broken Faith"

 # Country modifiers
 STATIC_MODIFIER_NAME_cc_byz_ven_old_privileges: "The Venetian Exemption"
 STATIC_MODIFIER_DESC_cc_byz_ven_old_privileges: "The terms of 1082 stand: Venetian merchants trade in Romania free of customs."
 STATIC_MODIFIER_NAME_cc_byz_ven_reduced_privileges: "The Two Percent"
 STATIC_MODIFIER_DESC_cc_byz_ven_reduced_privileges: "Venetian merchants pay a reduced customs rate of two percent."
 STATIC_MODIFIER_NAME_cc_byz_ven_full_kommerkion: "The Full Kommerkion"
 STATIC_MODIFIER_DESC_cc_byz_ven_full_kommerkion: "Venetian cargoes pay the full ten percent. The treasury gains and the trade shrinks."
 STATIC_MODIFIER_NAME_cc_byz_ven_anti_genoese_league: "League against Genoa"
 STATIC_MODIFIER_DESC_cc_byz_ven_anti_genoese_league: "Our galleys sail with the Venetian fleet against the Genoese."
 STATIC_MODIFIER_NAME_cc_byz_ven_sea_league: "The Sea League"
 STATIC_MODIFIER_DESC_cc_byz_ven_sea_league: "A joint fleet with Venice patrols the Aegean against the Turks."
 STATIC_MODIFIER_NAME_cc_byz_ven_perpetual_alliance: "Perpetual Alliance with Venice"
 STATIC_MODIFIER_DESC_cc_byz_ven_perpetual_alliance: "The empire and the Serenissima are sworn to each other without term."
 STATIC_MODIFIER_NAME_cc_byz_ven_romania_rights: "Rights in Romania"
 STATIC_MODIFIER_DESC_cc_byz_ven_romania_rights: "Our merchants hold rights in the markets of the Roman empire."
 STATIC_MODIFIER_NAME_cc_byz_ven_good_relations: "Friendship with Venice"
 STATIC_MODIFIER_DESC_cc_byz_ven_good_relations: "Relations with Venice are good and settled, without a treaty to bind them."

 # .1 The chrysobull renewed
 cc_byz_venice.1.title: "The Chrysobull Renewed"
 cc_byz_venice.1.desc: "The Venetian bailo has come to the palace with the chrysobull of 1082 and asks for it to be confirmed. Alexios I gave Venice a quarter on the Golden Horn and freedom from the customs in return for a fleet against the Normans. The Normans are long gone. The exemption is still costing the treasury.\n\nThe Genoese at Galata are watching to see what Venice gets."
 cc_byz_venice.1.a: "Confirm the terms of 1082 in full."
 cc_byz_venice.1.b: "Cut the exemption to two percent."
 cc_byz_venice.1.c: "Revoke it. Venice pays the full kommerkion."
 cc_byz_venice.1.d: "Our merchant minister writes the terms."

 # .2 The jewels and the loans
 cc_byz_venice.2.title: "The Jewels and the Loans"
 cc_byz_venice.2.desc: "Venetian bankers have offered the treasury a loan on easy terms. Easy terms from Venice have a way of becoming hard ones, but the money is real and the empire needs it."
 cc_byz_venice.2.desc_jewels: "The crown jewels are still in a Venetian strongroom, held against a loan the empire has not repaid. Every Venetian envoy knows it and none mentions it. The bankers now offer a second loan on the same security."
 cc_byz_venice.2.a: "Pay down the debt and ask for the jewels in good faith."
 cc_byz_venice.2.b: "Take the loan."
 cc_byz_venice.2.c: "We will owe Venice nothing."

 # .3 The Genoese war
 cc_byz_venice.3.title: "The Genoese War"
 cc_byz_venice.3.desc: "Venice and Genoa are at war again over the Black Sea trade, and both have sent envoys. Venice asks for our galleys, as John VI gave them in 1351. Genoa reminds us that Galata is across the Horn from the palace, and that it was Genoa that helped put a Palaiologos back on the throne."
 cc_byz_venice.3.desc_no_genoa: "Genoa is gone as a power, and its old quarrel with Venice has ended with it. Venice remembers who stood where while it lasted."
 cc_byz_venice.3.a: "Join Venice against the Genoese."
 cc_byz_venice.3.b: "Stay out of it."
 cc_byz_venice.3.c: "Side with Genoa."
 cc_byz_venice.3.d: "The quarrel is over."

 # .4 The sea league
 cc_byz_venice.4.title: "The Sea League"
 cc_byz_venice.4.desc: "Venice proposes a joint fleet to clear the Turkish corsairs from the Aegean, as the league of 1344 did when it took Smyrna. Each party pays for its own galleys. Venice wants to know whether ours will come."
 cc_byz_venice.4.a: "Pay for galleys in the league's fleet."
 cc_byz_venice.4.b: "Our admiral commands the league's squadron."
 cc_byz_venice.4.c: "Our ships guard our own coasts."

 # .5 Dalmatia
 cc_byz_venice.5.title: "Dalmatia"
 cc_byz_venice.5.desc: "The Hungarians are pressing on the Dalmatian towns that Venice holds, and Venice asks for our support. Dalmatia was a Roman province, and the Venetian claim to it began as a commission from Constantinople."
 cc_byz_venice.5.a: "Back Venice's claim to the coast."
 cc_byz_venice.5.b: "Mediate between Venice and the Hungarians."
 cc_byz_venice.5.c: "Dalmatia is not our quarrel."

 # .6 The mainland question
 cc_byz_venice.6.title: "The Mainland Question"
 cc_byz_venice.6.desc: "Venice is expanding onto the mainland, into towns that the western emperor counts as his. Venice would welcome our support against the Empire's lords, and would remember the lack of it."
 cc_byz_venice.6.desc_exarch: "Our exarch [cc_ven_exarch.GetName] governs the land next to the lagoon and has begun to look at the Venetian terraferma as unfinished business. Venice has asked whether he speaks for the emperor."
 cc_byz_venice.6.a: "Restrain the exarch."
 cc_byz_venice.6.b: "Let him press them."
 cc_byz_venice.6.c: "Support Venice on the mainland."
 cc_byz_venice.6.d: "Venice's mainland is Venice's business."

 # .7 The Stato da Mar
 cc_byz_venice.7.title: "The Stato da Mar"
 cc_byz_venice.7.desc: "Venice holds [cc_ven_port.GetName], one of the ports it took from the empire after 1204. Our governors in the Morea and the islands want it back. Venice will not give it up by force, but it is a merchant republic and may sell it, or trade it for the right price in our markets."
 cc_byz_venice.7.desc_none: "Venice no longer holds any ports in the Morea or the Aegean worth bargaining over. Its envoys have noticed."
 cc_byz_venice.7.a: "Offer to buy it."
 cc_byz_venice.7.b: "Offer trading rights in exchange."
 cc_byz_venice.7.c: "Leave the Stato da Mar to Venice."
 cc_byz_venice.7.d: "There is nothing left to bargain over."

 # .20 (Venice) The port offer
 cc_byz_venice.20.title: "An Offer for [cc_ven_port.GetName]"
 cc_byz_venice.20.desc_buy: "[cc_ven_emperor.GetName] offers to buy [cc_ven_port.GetName] from the republic for 25 gold per point of its development, between 150 and 600."
 cc_byz_venice.20.desc_swap: "[cc_ven_emperor.GetName] offers our merchants trading rights in its markets for thirty years, in exchange for [cc_ven_port.GetName]."
 cc_byz_venice.20.a: "Accept."
 cc_byz_venice.20.b: "Refuse."

 # .22 The port answer
 cc_byz_venice.22.title: "Venice Answers"
 cc_byz_venice.22.desc_yes: "Venice has accepted. [cc_ven_port.GetName] returns to the empire."
 cc_byz_venice.22.desc_no: "Venice has refused. [cc_ven_port.GetName] stays Venetian."
 cc_byz_venice.22.a: "The flag goes up over the harbour."
 cc_byz_venice.22.b: "Another time."

 # .8 The Emperor's vicariate
 cc_byz_venice.8.title: "The Emperor's Vicariate"
 cc_byz_venice.8.desc: "The western emperor has offered the doge an imperial vicariate over the mainland towns. It would make Venice a prince of the Empire. Venice's first doges held their title from Constantinople, and some in the lagoon have not forgotten it."
 cc_byz_venice.8.desc_member: "Venice now sits in the Empire's diet, and the western emperor has offered the doge a larger place there. Venice's first doges held their title from Constantinople, and some in the lagoon have not forgotten it."
 cc_byz_venice.8.a: "Offer the doge the old title: dux and protosebastos."
 cc_byz_venice.8.b: "Outbid the western emperor with gold."
 cc_byz_venice.8.c: "Let Venice choose its emperor."

 # .9 St Mark's and the purple
 cc_byz_venice.9.title: "St Mark's and the Purple"
 cc_byz_venice.9.desc: "St Mark's was built on the plan of the Holy Apostles in Constantinople, and its treasury is full of things taken from our churches in 1204. The procurators of St Mark's have asked for an imperial gift for the basilica."
 cc_byz_venice.9.desc_union: "St Mark's was built on the plan of the Holy Apostles in Constantinople. With the churches reunited, the procurators of St Mark's have asked for an imperial gift for the basilica, and Venice speaks of the union as its own achievement."
 cc_byz_venice.9.desc_repudiated: "St Mark's was built on the plan of the Holy Apostles in Constantinople. Since the union was repudiated, Venice has had to explain its friendship with us to the Pope. The procurators of St Mark's have still asked for an imperial gift for the basilica."
 cc_byz_venice.9.a: "Send manuscripts to the library of St Mark's."
 cc_byz_venice.9.b: "Gold and enamel for the Pala d'Oro."
 cc_byz_venice.9.c: "Ask that the doge's oath name the emperor again."

 # .10 The climax
 cc_byz_venice.10.title: "The Serenissima Question"
 cc_byz_venice.10.desc: "Half a century of dealings with Venice has come to a settled footing. Relations are correct and no closer. Neither side has a reason to change that."
 cc_byz_venice.10.desc_alliance: "Half a century of dealings with Venice has made the two states partners in fact. The doge's council is ready to make it permanent."
 cc_byz_venice.10.desc_ducate: "Half a century of dealings with Venice has gone further than anyone in the lagoon intended. Venice trusts the empire and needs it. Some in the doge's council now say openly that the republic was a Roman province once, and could acknowledge the emperor again without losing anything it values."
 cc_byz_venice.10.desc_rupture: "Half a century of dealings with Venice has ended in mistrust on both sides. The bailo has been recalled. Venice no longer pretends to be our friend."
 cc_byz_venice.10.a: "Propose the Ducate of Venetia."
 cc_byz_venice.10.b: "Propose a perpetual alliance."
 cc_byz_venice.10.c: "Leave the friendship as it stands."
 cc_byz_venice.10.d: "Then the ports will be ours."
 cc_byz_venice.10.e: "Turn to Genoa."

 # .25 (Venice) The proposal
 cc_byz_venice.25.title: "A Proposal from Constantinople"
 cc_byz_venice.25.desc_ducate: "[cc_ven_emperor.GetName] proposes that Venice acknowledge the emperor as its first doges did, as the Ducate of Venetia. The republic would keep its government, fleet, colonies and wars, pay a small tribute, and let imperial merchants trade free of our tariffs. It could never be annexed, and it would stay out of the western Empire."
 cc_byz_venice.25.desc_alliance: "[cc_ven_emperor.GetName] proposes a perpetual alliance between the empire and the republic, without term."
 cc_byz_venice.25.a: "Accept."
 cc_byz_venice.25.b: "Refuse."

 # .26 The proposal answer
 cc_byz_venice.26.title: "Venice Decides"
 cc_byz_venice.26.desc_ducate: "The doge has sworn to the emperor. Venice is the Ducate of Venetia again."
 cc_byz_venice.26.desc_alliance: "The doge has sworn a perpetual alliance with the empire."
 cc_byz_venice.26.desc_ducate_refused: "The doge's council will not acknowledge the emperor. It has offered a perpetual alliance instead."
 cc_byz_venice.26.desc_alliance_refused: "The doge's council has declined a perpetual alliance. Relations stay friendly and unbound."
 cc_byz_venice.26.a: "The Ducate of Venetia."
 cc_byz_venice.26.b: "An alliance without term."
 cc_byz_venice.26.c: "Friends, then."

 # .90 The question lapses
 cc_byz_venice.90.title: "The Serenissima Question Lapses"
 cc_byz_venice.90.desc: "The question of Venice has lapsed."
 cc_byz_venice.90.desc_gone: "Venice no longer exists as a state. There is no one left in the lagoon to deal with."
 cc_byz_venice.90.desc_city: "Constantinople is lost. Venice has no reason to deal with an emperor who does not hold it."
 cc_byz_venice.90.desc_subject: "Venice has become another power's subject and can no longer make its own terms."
 cc_byz_venice.90.desc_war: "Ten years of war with Venice have ended any prospect of settling the question."
 cc_byz_venice.90.a: "So be it."
