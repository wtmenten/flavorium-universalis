l_english:
 # The three new prefectures, each failing in its own way.
 #
 # Italy is not here: it already has the papal and Italian threads plus the shared friction and
 # demand arcs. These exist to answer the question the shared threads cannot, which is why
 # Africa is a different problem from Italy rather than the same problem further away.
 #
 # The Gallic thread is openly counterfactual. No eastern emperor ever held any of Gaul. It is
 # written as a thread about a Provencal aristocracy that never stopped being Roman being
 # informed that it has been recovered.

 # ---- AFRICA: the Moorish frontier ----
 cc_byz_prov.1.title: "The Limes"
 cc_byz_prov.1.desc: "The frontier is a line on a map in the capital and a set of forts in country that nobody governs.\n\nThe Moorish confederations south of it are not a state and cannot be defeated in the way a state is defeated. They can be paid, fought, or ignored, and the empire's predecessors here tried all three in that order. The forts are still standing. Several are held by men who have not seen an imperial paymaster in three years and have arrangements with the people they are supposed to be watching.\n\nThe exarch's report is unusually direct. He wants either money or permission to stop pretending."
 cc_byz_prov.1.a: "Pay the frontier. It is what it is for."
 cc_byz_prov.1.b: "Buy a confederation and let it hold the line."
 cc_byz_prov.1.c: "Hold the coast. The interior was never ours."

 cc_byz_prov.2.title: "The Bishop in the Interior"
 cc_byz_prov.2.desc: "There is a congregation four days inland with a bishop the patriarch did not consecrate, following a discipline the capital last condemned eight hundred years ago and which has apparently been waiting.\n\nThey are not heretics in any way a council would recognise. They hold that a priest who fled persecution cannot administer the sacraments, that the church of the martyrs is not the church of the compromisers, and that Carthage does not need Constantinople to tell it what its own martyrs meant.\n\nIt is Donatism in everything but the name, and the name is the only part that ever mattered to anyone in the capital."
 cc_byz_prov.2.desc_coast: "The congregation is four days inland, which is to say well outside anything the empire now claims to govern.\n\nThey have a bishop the patriarch did not consecrate and a discipline the capital condemned eight hundred years ago. They also have the only functioning ecclesiastical structure between the coast and the desert, and the coastal towns trade with them.\n\nThe exarch notes, without recommending anything, that the empire has recently decided the interior is not its business."
 cc_byz_prov.2.a: "Condemn it, as every emperor has."
 cc_byz_prov.2.b: "Africa has always argued about this. Let it."

 cc_byz_prov.3.title: "The Arrears"
 cc_byz_prov.3.desc: "The pay is eleven months behind at the desert forts and seven on the coast, and the difference between those two numbers is the whole problem: the men in the worst posting are owed the most.\n\nThey are professionals. They will wait. The question every African garrison has answered eventually is how long, and the empire has never once known the answer before it was given."
 cc_byz_prov.3.desc_paid: "The pay is four months behind, which in this province counts as prompt.\n\nThe frontier was funded when it was asked for and the difference is visible: the forts are garrisoned by men who expect to be paid, and men who expect to be paid tend to keep expecting it rather than making other arrangements.\n\nThe exarch's clerk has enclosed the figures without comment, which from him is a kind of comment."
 cc_byz_prov.3.a: "Buy them back. Whatever it takes."
 cc_byz_prov.3.b: "They held. Say so publicly."

 # ---- SPANIA: the narrow province ----
 cc_byz_prov.10.title: "The Law in the Towns"
 cc_byz_prov.10.desc: "The province has courts. They are not the empire's courts.\n\nThe towns here have been running on a Visigothic code for six hundred years: written down, coherent, taught, and administered by men whose fathers administered it. It handles inheritance differently from Roman law, it handles debt differently, and it is what everyone in Cartagena means when they say the law.\n\nThe empire's own law is older, better, and foreign. That last word is doing all the work."
 cc_byz_prov.10.a: "The Roman law is the empire's. Impose it."
 cc_byz_prov.10.b: "A law nobody follows is worse than one that is not ours."

 cc_byz_prov.11.title: "The Neighbour's Offer"
 cc_byz_prov.11.desc: "The taifa inland has sent a merchant rather than an envoy, which is itself the message.\n\nThey would rather trade than fight. They have silver, the coast has harbours, and neither side has the strength to take anything from the other that would be worth what taking it cost. The proposal is detailed, commercially sensible, and would make the province solvent for the first time since it was recovered.\n\nIt would also mean an Orthodox emperor's officials sitting down with them to agree tariffs, in writing, with signatures."
 cc_byz_prov.11.a: "Solvency is not a small thing."
 cc_byz_prov.11.b: "We do not treat with them."

 cc_byz_prov.12.title: "The Indefensible Province"
 cc_byz_prov.12.desc: "The assessment has been submitted, and it is the same assessment every governor here has submitted.\n\nThe province is a strip of coast with mountains behind it and no hinterland. It cannot feed its own garrison. It cannot be reinforced except by sea, and the sea route runs the length of the Mediterranean past two hostile coasts. Held against a serious attempt, it falls; held against nothing in particular, it costs.\n\nWhat it does have is harbours, and harbours at that end of the sea are worth something to a fleet."
 cc_byz_prov.12.desc_latin: "The assessment has been submitted, and there is a paragraph in it that was not in the previous ones.\n\nThe province cannot be held, cannot be fed and cannot be reinforced except by sea. That much is unchanged. What is new is the observation that the towns now run on their own law, in their own language, under notables the empire confirms rather than appoints, and that if the imperial garrison sailed away tomorrow the practical difference would take a decade to become visible.\n\nThe governor does not draw a conclusion. He did not need to."
 cc_byz_prov.12.a: "Trade it for something that matters."
 cc_byz_prov.12.b: "A naval station, and nothing more."
 cc_byz_prov.12.c: "Reinforce it properly."

 # ---- GAUL: the Rhone command ----
 cc_byz_prov.20.title: "Already Roman"
 cc_byz_prov.20.desc: "The delegation from the Provencal cities is polite, well dressed, and speaking Latin of a quality that has embarrassed two of the emperor's secretaries.\n\nThey wish to congratulate the emperor on the recovery of the province. They wish it noted that the province has been Roman continuously, that its municipal institutions have functioned without interruption since before the capital was founded, and that its families hold titles conferred by emperors whose names the imperial chancery has had to look up.\n\nThey are not being difficult. They are being extremely clear about what they think has just happened, which is that Constantinople has finally returned."
 cc_byz_prov.20.a: "Confirm their standing. They were Roman first."
 cc_byz_prov.20.b: "They are a recovered province like any other."

 cc_byz_prov.21.title: "The Claim from the North"
 cc_byz_prov.21.desc: "The Frankish position, put briefly, is that the Rhone valley has been theirs for eight hundred years and the appearance of a Greek administration in it changes nothing.\n\nThe position is not unreasonable. The line the empire can actually hold is the Alps and the river, and everything north of that has been governed from somewhere else since before there was an eastern empire to govern it from.\n\nThe exarch has asked for engineers, money, and a decision. He notes that he can get two of the three locally."
 cc_byz_prov.21.a: "Hold the passes. That is the province."
 cc_byz_prov.21.b: "Buy them off. We have done it on longer frontiers."
 cc_byz_prov.21.c: "It is his command. Let him command it."

 cc_byz_prov.22.title: "The Rhone Command"
 cc_byz_prov.22.desc: "Whatever this province is, it is not a prefecture in the sense the chancery uses the word.\n\nIt is a river, a set of passes, a dozen cities that govern themselves competently and always have, and a garrison that has been recruited locally for a generation because sending men from the east to the Rhone is an absurd way to defend the Rhone.\n\nThe question is not how to govern it. It is what to call the thing that is already governing it."
 cc_byz_prov.22.desc_march: "The province governs itself and has done since the first confirmation of the local notables, which the palace has never quite got round to reviewing.\n\nIt holds the passes. It pays something. It sends contingents when asked, usually. Its leading families use imperial titles with complete correctness and have not needed an imperial instruction in eleven years.\n\nThe chancery would like a word for this."
 cc_byz_prov.22.a: "A march. It holds the frontier and decides how."
 cc_byz_prov.22.b: "Let the Franks have the substance. We keep the title."
 cc_byz_prov.22.c: "Govern it directly, and pay for it."
