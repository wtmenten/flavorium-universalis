l_english:
 # cc_byz_bureaucracy.62, the buy-back for a farmed-out office, and the timed societal drift
 # modifiers the bureau thread now grants.
 #
 # WHY .62 EXISTS. Playtesting: "the office farmed out being until the end of the game is too
 # harsh a punishment". It was also stacking, at three grant sites, with no removal path. The
 # modifier is now sixty years rather than permanent, and this event is the way out of it before
 # then, at a price scaled to the realm's tax base and to how dug in the office had become when
 # it was sold.

 cc_byz_bureaucracy.62.title: "The Office Redeemed"
 cc_byz_bureaucracy.62.desc: "The family that holds the post has written to the palace. Not to complain: to observe, at length and with figures, what the office has cost them to maintain, and to note that they would of course return it to the crown were the crown minded to make good the outlay.\n\nThis is not an offer. It is a price, arrived at by people who have had a long time to think about what the post is worth and no reason at all to understate it."
 cc_byz_bureaucracy.62.desc_dug_in: "Three generations have been born to this office. The current holder's grandfather bought it, his father administered it, and he has never in his life had to consider what he would do otherwise.\n\nThe family has produced accounts. They are meticulous, they are almost certainly honest, and they describe an investment the crown would have to match to undo. Nobody in the palace pretends the sum is unreasonable. It is simply enormous."
 cc_byz_bureaucracy.62.desc_several: "More than one post has gone this way now, and the men who hold them have noticed each other. What arrives at the palace is not a letter from a family but a position agreed among several, quoting the same precedents and asking the same price.\n\nThe crown created the precedent by selling the first one. It is being read back now."
 cc_byz_bureaucracy.62.a: "Pay it. The office is the crown's."
 cc_byz_bureaucracy.62.b: "Take it back and let them sue."
 cc_byz_bureaucracy.62.c: "Leave it. The money is needed elsewhere."

 # ---- Timed societal drift ----
 # Granted alongside the instant societal jumps rather than instead of them. The jump is the
 # decision landing; the drift is the decision working.
 STATIC_MODIFIER_NAME_cc_byz_taxis_reforming: "Government by Office"
 STATIC_MODIFIER_DESC_cc_byz_taxis_reforming: "Posts are being filled by appointment, held at pleasure and paid on time. None of that is a decree and all of it is a policy."
 STATIC_MODIFIER_NAME_cc_byz_taxis_habit: "The Administrative Habit"
 STATIC_MODIFIER_DESC_cc_byz_taxis_habit: "Nothing has been announced. Things are simply being done the way the fisc does them, by people who have stopped asking whose son anyone is."
 STATIC_MODIFIER_NAME_cc_byz_dynatoi_ascendant: "The Magnates Consolidating"
 STATIC_MODIFIER_DESC_cc_byz_dynatoi_ascendant: "Something structural was conceded, and the people who gained by it are arranging their affairs on the assumption that it will not be taken back."
 STATIC_MODIFIER_NAME_cc_byz_dynatoi_creeping: "The Quiet Transfer"
 STATIC_MODIFIER_DESC_cc_byz_dynatoi_creeping: "No grant was made and no law was changed. Land, soldiers and offices are passing into private hands at the speed of ordinary life."
