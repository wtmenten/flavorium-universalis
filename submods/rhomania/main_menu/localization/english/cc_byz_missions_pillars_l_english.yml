l_english:
 # Tasks added by the forking rework: the three pillars, the reconvergences, the five
 # exclusive forks and the optional spurs.
 #
 # FORK DESCRIPTIONS END WITH WHAT THEY CLOSE. Taking one side of an exclusive fork hides the
 # other (visible = NOT completed), so the player would otherwise never learn there was a
 # choice. Naming the road not taken in the description of the road taken is the only place
 # that information can live.

 # ---- Reconvergence tooltips ----
 # Each wraps an OR of AND pairs so the player reads one line instead of nine.
 cc_byz_two_of_three_pillars_tt: "Complete two of the three pillar capstones: Logothete of the Course (the Fisc), The Ecumenical Throne (the Faith), The Field Army Restored (the Sword)"
 cc_byz_two_of_three_seats_tt: "Complete two of the three eastern see tasks: Antioch Restored, The Patriarch Returns, Egypt and the Delta"
 cc_byz_two_of_three_theatres_tt: "Complete two of the three western theatre tasks: Italy and the Exarchate, Africa, Spania"
 cc_byz_turkish_question_settled_tt: "The Turkish question is settled, by conquest or by tribute"

 # ---- The Fisc ----
 cc_byz_task_nomisma: "The Nomisma Restored"
 cc_byz_task_nomisma_desc: "For seven centuries the solidus was the coin every market from Ceylon to Frisia would take without weighing. It has been debased four times in the last hundred years, and the merchants have begun to weigh it."
 cc_byz_task_silk_looms: "The Silk Looms"
 cc_byz_task_silk_looms_desc: "Two monks brought the worms out of China in a hollow staff in the sixth century, and the empire held the western monopoly for six hundred years on the strength of that theft. The looms are still ours. Little else about the trade is."
 cc_byz_task_literate_admin: "A Literate Administration"
 cc_byz_task_literate_admin_desc: "The empire ran on paper when the west ran on memory. It can keep doing so exactly as long as there are men who can read what is written down, and no longer."
 cc_byz_task_logothete: "Logothete of the Course"
 cc_byz_task_logothete_desc: "The logothete of the course began as the man who ran the post. Because the post carried the dispatches, he came to know what was in them; because he knew what was in them, he came to run the frontier intelligence; and because he ran that, he ended up running the foreign policy. Nobody ever decided this.\n\nThe bureaus he needs must be funded, and funded for years, not for a season."

 # ---- The Faith ----
 cc_byz_task_athonite: "The Athonite Monasteries"
 cc_byz_task_athonite_desc: "The Holy Mountain answers to the patriarch in theory and to itself in practice. Its opinion travels further than any bishop's letter and arrives before ours does."
 cc_byz_task_icons: "The Icons Restored"
 cc_byz_task_icons_desc: "For a hundred and twenty years the empire smashed its own images, and then decided it had been wrong and spent three centuries replacing them. The Feast of Orthodoxy still celebrates the reversal every Lent.\n\nWhat was burned is not coming back. What can be commissioned, will be."
 cc_byz_task_autocephalous: "The Autocephalous Daughters"
 cc_byz_task_autocephalous_desc: "Serbia has a patriarch. Bulgaria has a patriarch. Rus has a metropolitan who behaves like one. Each of them was granted by Constantinople, and each of them now describes itself as having always been independent.\n\nA mother church is one the daughters still answer to."
 cc_byz_task_ecumenical_throne: "The Ecumenical Throne"
 cc_byz_task_ecumenical_throne_desc: "\"Let us take thought together for the peace of the churches.\"\n\nThe patriarch is chosen from three names the synod submits, and the emperor chooses. That is the arrangement, and it has produced patriarchs who defied emperors to their faces. It is still better than the alternative, which is a patriarch nobody chose."

 # ---- The Sword ----
 cc_byz_task_veterans: "Veteran Armies"
 cc_byz_task_veterans_desc: "An army that has fought together and come home together is worth three that have not. We have plenty of men. We are short of men who have stood next to each other before."
 cc_byz_task_dromon: "The Dromon Fleet"
 cc_byz_task_dromon_desc: "Two banks of oars, a spur at the bow rather than a ram, and a siphon forward if the arsenal can still supply one. The dromon carried this empire's power for six hundred years and has not been built in numbers for eighty."
 cc_byz_task_varangians: "The Varangian Guard"
 cc_byz_task_varangians_desc: "Northmen and Englishmen with axes, who speak no Greek worth the name and owe nothing to any family in this city. That is the entire point of them. An emperor surrounded by Byzantines is surrounded by men with cousins.\n\nThey also remember whose the Danube used to be."
 cc_byz_task_field_army: "The Field Army Restored"
 cc_byz_task_field_army_desc: "Not a garrison, not a levy called out for a season, and not mercenaries who will go home in the autumn. A host that can march, lose, and march again in the same reign. The empire has not had one since Manzikert."

 # ---- Reconvergence ----
 cc_byz_task_state_restored: "The State Restored"
 cc_byz_task_state_restored_desc: "There is a moment when a state stops managing its own decline and starts choosing what to do next. It is rarely marked at the time and it is obvious afterwards to everyone.\n\nTwo of the three pillars will do. No emperor was ever strong in all three at once."

 # ---- The Greek World ----
 cc_byz_task_serbian_question: "The Serbian Question"
 cc_byz_task_serbian_question_desc: "Stefan Dusan had himself crowned Emperor of the Serbs and Romans at Skopje, in our rite, by a patriarch he created for the purpose. He took half of Macedonia and most of Epirus and he was not wrong to think he could take this city too."
 cc_byz_task_latin_bride: "A Latin Bride"
 cc_byz_task_latin_bride_desc: "A Latin princess in the palace means a Latin chapel in the palace, a Latin confessor, and a Latin faction at court within a decade. It also means one western king who cannot afford to see us fall.\n\nEmperors have made this trade before and none of them enjoyed it."
 cc_byz_task_embassies: "Embassies to the West"
 cc_byz_task_embassies_desc: "The empire once received ambassadors on a throne that rose to the ceiling while gilded lions roared beside it, and Liudprand of Cremona wrote down every detail in a fury.\n\nWe can no longer afford the machinery. We can still afford the men."
 cc_byz_task_venetian_alliance: "The Venetian Alliance"
 cc_byz_task_venetian_alliance_desc: "Venice took the horses from our hippodrome and the relics from our churches and the Empire itself for fifty-seven years, and Venice also has the only fleet in the Mediterranean that can keep us fed.\n\nChoosing them closes the Genoese road."
 cc_byz_task_genoese_compact: "The Genoese Compact"
 cc_byz_task_genoese_compact_desc: "Genoa sits at Galata across the Horn, pays us almost nothing in customs, and takes seven times what our own harbour does. They are also the ones who put a Palaiologos back on this throne.\n\nChoosing them closes the Venetian road."

 # ---- Anatolia ----
 cc_byz_task_sultan_tributary: "The Sultan's Tributary"
 cc_byz_task_sultan_tributary_desc: "The empire has paid tribute to this house and sent troops on its campaigns, and the emperor has ridden in a sultan's train. There is a certain symmetry in the arrangement running the other way, and it is cheaper than destroying them."
 cc_byz_task_anatolia_secured: "Anatolia Secured"
 cc_byz_task_anatolia_secured_desc: "Whether by conquest or by tribute, the Turkish question is answered and the eastern provinces can be governed rather than defended.\n\nNo emperor for two centuries has been able to write that sentence."
 cc_byz_task_convert_anatolia: "The Faith Recovered"
 cc_byz_task_convert_anatolia_desc: "Conversion in Anatolia has not mostly been forced. It has been a tax, a marriage, a career, and four generations of a village finding the new arrangement easier than the old one.\n\nReversing it will work the same way, and take as long."
 cc_byz_task_tagmata: "The Tagmata Restored"
 cc_byz_task_tagmata_desc: "Salaried, barracked, and paid whether there is a war or not. A professional army answers to whoever signs the pay chest, which is the argument for it and also the argument against.\n\nTaking this closes the road of the pronoia."

 # ---- The Levant ----
 cc_byz_task_eastern_sees: "The Eastern Sees"
 cc_byz_task_eastern_sees_desc: "Antioch, Jerusalem, Alexandria. Three of the five, lost within a decade of each other in the seventh century, and mourned continuously since by an empire that never formally admitted they were gone.\n\nTwo of the three will serve."
 cc_byz_task_sultans_friend: "The Sultan's Friend"
 cc_byz_task_sultans_friend_desc: "A treaty over the holy places, in writing, with a sultan. It will be read in the west as a betrayal and in Cairo as a weakness, and it will keep the shrines open and the pilgrims moving for as long as both sides find that convenient.\n\nTaking this closes the war."
 cc_byz_task_pentarchy_war: "The Pentarchy War"
 cc_byz_task_pentarchy_war_desc: "Rome, Constantinople, Alexandria, Antioch, Jerusalem. Five patriarchs, one church, and an arrangement that has not existed intact since the seventh century.\n\nTaking this closes the treaty."

 # ---- The West ----
 cc_byz_task_sicily: "Sicily Recovered"
 cc_byz_task_sicily_desc: "Greek was spoken here before Latin and is still spoken in the hills. The island has been Byzantine, Arab, Norman and Angevin within four hundred years, and the Vespers took care of the Angevins."
 cc_byz_task_ravenna: "Ravenna Restored"
 cc_byz_task_ravenna_desc: "The mosaics in San Vitale show Justinian on one wall and Theodora on the other, both crowned, both facing the altar, neither of whom ever came here.\n\nThe city has been silting up for eight hundred years. The harbour that made it an exarchal seat is a field."
 cc_byz_task_western_sea: "The Western Sea"
 cc_byz_task_western_sea_desc: "\"Our sea.\"\n\nIt was a Roman joke before it was a Roman fact, and by the time it was a fact nobody thought it funny. Two shores of the three will do; the third has always been an argument."

 # ---- The East ----
 cc_byz_task_crown_monopoly: "The Crown Monopoly"
 cc_byz_task_crown_monopoly_desc: "The spice bought and sold by imperial officials, the profit reaching the treasury without passing through anybody's private hands first.\n\nTaking this closes the chartered road."
 cc_byz_task_chartered_company: "The Chartered Company"
 cc_byz_task_chartered_company_desc: "Let the burghers carry the risk and the crown take a share of what comes back. It raises less and it raises it without an argument every year in the consistory.\n\nTaking this closes the crown monopoly."

 # ---- Optional spurs ----
 cc_byz_task_notitia: "The Antiquarians"
 cc_byz_task_notitia_desc: "The Notitia Dignitatum lists every office and command of the late empire, west and east, with the insignia painted beside each one. Most of the posts in it had ceased to exist before the ink dried.\n\nLawyers can do a great deal with a document like that."
 cc_byz_task_greek_fire: "Greek Fire Rediscovered"
 cc_byz_task_greek_fire_desc: "\"...a fire which clung to whatever it touched and burned upon the water itself.\"\n\nAnna Komnene saw the siphons used and described the bronze beasts' heads on the prows. The composition was a state secret held by one family and the imperial workshops, and it was lost the ordinary way: by nobody writing it down."
 cc_byz_task_hagia_sophia: "Hagia Sophia Maintained"
 cc_byz_task_hagia_sophia_desc: "\"Solomon, I have surpassed thee.\"\n\nTradition puts the words in Justinian's mouth at the dedication; the account is centuries later and the sentiment is entirely in character. The dome fell twenty years afterward and was rebuilt higher."
 cc_byz_task_great_palace: "The Great Palace"
 cc_byz_task_great_palace_desc: "The court moved to Blachernae generations ago and the old palace has been decaying ever since. Visitors have begun remarking on it in writing, which is how these things become everyone's business."
 cc_byz_task_thessaloniki: "The Second City"
 cc_byz_task_thessaloniki_desc: "The second city, the second port, and the only other place with walls worth the name. It has also spent two decades taking its own decisions, and the Zealots who ran it did not ask permission for any of them."
 cc_byz_task_city_adorned: "The City Adorned"
 cc_byz_task_city_adorned_desc: "None of it wins a war. All of it is why people still come here to see what an empire looks like, and why they write it down when they get home."
 cc_byz_task_triumph: "A Triumph in the Hippodrome"
 cc_byz_task_triumph_desc: "The forms are recorded in the Book of Ceremonies down to which gate, which acclamation and who walks where. They have not been performed in two hundred years and most of this city has never seen one."
