l_english:
 # Tasks added by the forking rework: the three pillars, the reconvergences, the five
 # exclusive forks and the optional spurs.
 #
 # FORK DESCRIPTIONS END WITH WHAT THEY CLOSE. Taking one side of an exclusive fork hides the
 # other (visible = NOT completed), so the player would otherwise never learn there was a
 # choice. Naming the road not taken in the description of the road taken is the only place
 # that information can live.

 # ---- Reconvergence tooltips ----
 # Each wraps an OR of AND pairs so the player reads one line instead of nine.
 cc_byz_two_of_three_pillars_tt: "Complete two of the three pillars: the Fisc, the Faith, the Sword"
 cc_byz_two_of_three_seats_tt: "Secure two of the three eastern sees: Antioch, Jerusalem, Alexandria"
 cc_byz_two_of_three_theatres_tt: "Recover two of the three western theatres: Italy, Africa, Spania"
 cc_byz_turkish_question_settled_tt: "The Turkish question is settled, by conquest or by tribute"

 # ---- The Fisc ----
 cc_byz_task_nomisma: "The Nomisma Restored"
 cc_byz_task_nomisma_desc: "Raise the tax base to sixty. The coin that was the standard of the Mediterranean for seven hundred years has been debased four times in the last century, and everyone who trades in it has noticed."
 cc_byz_task_silk_looms: "The Silk Looms"
 cc_byz_task_silk_looms_desc: "Reach ten ducats of monthly trade income. Two monks smuggled the worms out of China in a walking stick, and the empire held the western monopoly for six centuries on the strength of it."
 cc_byz_task_literate_admin: "A Literate Administration"
 cc_byz_task_literate_admin_desc: "Raise average literacy above twenty-five percent. The empire ran on paper long before anyone else in Europe, and it can only keep doing so while there are men who can read it."
 cc_byz_task_logothete: "Logothete of the Course"
 cc_byz_task_logothete_desc: "A hundred in tax base and five bureaus funded. The office that ran the post, the roads, the frontier intelligence and eventually the foreign policy, because it was the only one that knew what was happening."

 # ---- The Faith ----
 cc_byz_task_athonite: "The Athonite Monasteries"
 cc_byz_task_athonite_desc: "Reach forty religious influence. The Holy Mountain answers to the patriarch in theory and to itself in practice, and its opinion carries further than any bishop's."
 cc_byz_task_icons: "The Icons Restored"
 cc_byz_task_icons_desc: "Hold three works of art. The iconoclast century cost the empire more images than any conquest did, and replacing them is the slow work of proving the argument was settled."
 cc_byz_task_autocephalous: "The Autocephalous Daughters"
 cc_byz_task_autocephalous_desc: "Lead an autocephalous patriarchate. Serbia, Bulgaria and Rus all have churches of their own now. Leading the body they belong to is the difference between a mother church and a former one."
 cc_byz_task_ecumenical_throne: "The Ecumenical Throne"
 cc_byz_task_ecumenical_throne_desc: "Seventy-five religious influence and a contented clergy. The patriarch of Constantinople is first among the Orthodox by custom rather than by law, and custom needs maintaining."

 # ---- The Sword ----
 cc_byz_task_veterans: "Veteran Armies"
 cc_byz_task_veterans_desc: "Reach forty army tradition. The empire has not fielded a properly trained army in three generations, and the men who remember how are dying."
 cc_byz_task_dromon: "The Dromon Fleet"
 cc_byz_task_dromon_desc: "Put twenty ships to sea. The straits are the only reason this city has survived, and they are worth nothing without hulls to close them."
 cc_byz_task_varangians: "The Varangian Guard"
 cc_byz_task_varangians_desc: "Raise a company of Varangians. Foreigners with no stake in any Byzantine faction, which is precisely why emperors have trusted them with the palace for four hundred years."
 cc_byz_task_field_army: "The Field Army Restored"
 cc_byz_task_field_army_desc: "Forty regiments at sixty army tradition. Not a garrison force and not mercenaries: an army that can be sent somewhere and expected to come back."

 # ---- Reconvergence ----
 cc_byz_task_state_restored: "The State Restored"
 cc_byz_task_state_restored_desc: "Complete two of the three pillars. The empire does not need to be strong in every respect at once, and no emperor has ever managed it. It needs to be strong enough in two that the third can be neglected without collapse."

 # ---- The Greek World ----
 cc_byz_task_serbian_question: "The Serbian Question"
 cc_byz_task_serbian_question_desc: "End Serbia, or make it a subject. Dusan crowned himself Emperor of the Serbs and Greeks and very nearly made it stick. The claim does not lapse because he died."
 cc_byz_task_latin_bride: "A Latin Bride"
 cc_byz_task_latin_bride_desc: "Contract a royal marriage with a Catholic power. Every emperor of the last two centuries has married west at least once, and every one of them was criticised for it at home."
 cc_byz_task_embassies: "Embassies to the West"
 cc_byz_task_embassies_desc: "Maintain four diplomats. The empire survived its worst century by knowing more about its enemies than they knew about each other, and that has to be paid for continuously."
 cc_byz_task_venetian_alliance: "The Venetian Alliance"
 cc_byz_task_venetian_alliance_desc: "Bring Venice to a warm regard for the empire. They hold the sea lanes and the credit, they sacked this city once, and they are still the better of the two available options.\n\nTaking this closes the Genoese road."
 cc_byz_task_genoese_compact: "The Genoese Compact"
 cc_byz_task_genoese_compact_desc: "Bring Genoa to a warm regard for the empire. They already hold Galata across the water and half the Black Sea trade, and an arrangement with them is an arrangement with the people who are there anyway.\n\nTaking this closes the Venetian road."

 # ---- Anatolia ----
 cc_byz_task_sultan_tributary: "The Sultan's Tributary"
 cc_byz_task_sultan_tributary_desc: "Make the Ottomans a subject rather than a corpse. The empire paid them tribute for decades and sent troops on their campaigns; reversing the arrangement costs a great deal less than destroying them, and is very much sweeter.\n\nTaking this closes the road to ending them outright."
 cc_byz_task_anatolia_secured: "Anatolia Secured"
 cc_byz_task_anatolia_secured_desc: "Hold the Anatolian themes with the Turkish question settled, by conquest or by tribute. Asia Minor is where the empire's soldiers and grain come from. Everything else is a question about how long."
 cc_byz_task_convert_anatolia: "The Faith Recovered"
 cc_byz_task_convert_anatolia_desc: "Bring the empire to seventy percent Orthodox. Two centuries of Turkish rule converted more of Anatolia than any army took, and undoing it is slower than the conquest was."
 cc_byz_task_tagmata: "The Tagmata Restored"
 cc_byz_task_tagmata_desc: "Fifty regiments, and no pronoia grants outstanding. A salaried professional army answerable to the palace, paid in coin rather than in land.\n\nTaking this closes the road of the feudal host."

 # ---- The Levant ----
 cc_byz_task_eastern_sees: "The Eastern Sees"
 cc_byz_task_eastern_sees_desc: "Secure two of the three ancient eastern patriarchates. All three would be better. Two is what the empire has managed at any point since the seventh century."
 cc_byz_task_sultans_friend: "The Sultan's Friend"
 cc_byz_task_sultans_friend_desc: "Settle the holy places by written agreement with Cairo. A condominium is not a triumph and no chronicler will call it one. It is also the first settled eastern frontier in four hundred years.\n\nTaking this closes the road to the Pentarchy War."
 cc_byz_task_pentarchy_war: "The Pentarchy War"
 cc_byz_task_pentarchy_war_desc: "Hold all five ancient patriarchates. Constantinople, Rome, Jerusalem, Antioch and Alexandria under one emperor for the first time since before the Arab conquests.\n\nTaking this closes the road to a negotiated settlement."

 # ---- The West ----
 cc_byz_task_sicily: "Sicily Recovered"
 cc_byz_task_sicily_desc: "Hold Palermo and Syracuse. The island is the hinge between the two halves of the sea, and no fleet crosses without the permission of whoever holds these two harbours."
 cc_byz_task_ravenna: "Ravenna Restored"
 cc_byz_task_ravenna_desc: "Hold Ravenna. The seat of the old exarchate, and the one city in Italy where the imperial administration is remembered as a government rather than as an occupation."
 cc_byz_task_western_sea: "The Western Sea"
 cc_byz_task_western_sea_desc: "Recover two of the three western theatres. Justinian took Africa first and Italy afterwards; the order was opportunity rather than plan, and it can be again."

 # ---- The East ----
 cc_byz_task_crown_monopoly: "The Crown Monopoly"
 cc_byz_task_crown_monopoly_desc: "Fifty ducats of monthly trade income, run through the crown. The spice is bought and sold by imperial officials and the profit reaches the treasury undiminished.\n\nTaking this closes the chartered road."
 cc_byz_task_chartered_company: "The Chartered Company"
 cc_byz_task_chartered_company_desc: "Let a chartered company carry the trade. Less reaches the treasury, and a merchant class grows that can finance the state without asking Italy for terms.\n\nTaking this closes the monopoly road."

 # ---- Optional spurs ----
 cc_byz_task_reconquest_claim: "The Antiquarians"
 cc_byz_task_reconquest_claim_desc: "Research thirty advances. Scholars working through the old provincial registers establish what the empire held, when, and on what legal basis. Lawyers can do a great deal with that."
 cc_byz_task_greek_fire: "Greek Fire Rediscovered"
 cc_byz_task_greek_fire_desc: "Fifty navy tradition and a literate population. The formula was a state secret held by one family, and it was lost the ordinary way, by nobody writing it down."
 cc_byz_task_hagia_sophia: "Hagia Sophia Maintained"
 cc_byz_task_hagia_sophia_desc: "Maintain the cathedral at Constantinople. The dome has fallen twice and been rebuilt twice, and the building has been the argument for the empire's importance for eight hundred years."
 cc_byz_task_great_palace: "The Great Palace"
 cc_byz_task_great_palace_desc: "Hold six works of art. The palace complex has been decaying since the court moved to Blachernae, and visitors have begun remarking on it in writing."
 cc_byz_task_thessaloniki: "The Second City"
 cc_byz_task_thessaloniki_desc: "Hold Thessaloniki. The empire's second city, its second port, and the one place besides the capital with walls worth the name."
 cc_byz_task_city_adorned: "The City Adorned"
 cc_byz_task_city_adorned_desc: "The cathedral maintained, the palace furnished, the second city held. None of it wins a war. All of it is why people still come here to see what an empire looks like."
 cc_byz_task_triumph: "A Triumph in the Hippodrome"
 cc_byz_task_triumph_desc: "Seventy army tradition. The forms are recorded in the ceremonial books and have not been performed in two hundred years, so most of the city has never seen one."
