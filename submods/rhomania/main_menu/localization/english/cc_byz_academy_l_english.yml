l_english:
 # Mission task
 cc_byz_acad_5_universities_tt: "We own at least 5 locations with a university"
 cc_byz_acad_opens_chain_tt: "Opens #Y The Academy#!, a series of events over 6 to 10 years that decides who teaches, what is taught, and ends in a charter of rewards"

 # Tooltips
 cc_byz_acad_lean_latin2_tt: "The Academy leans #Y 2#! toward the Latin scholastics"
 cc_byz_acad_lean_hellenic2_tt: "The Academy leans #Y 2#! toward Plethon's Platonists"
 cc_byz_acad_lean_toward_middle_tt: "The Academy's lean moves #Y 1#! back toward the middle"
 cc_byz_acad_unlock_policy_tt: "Unlocks the charter reward #Y Imperial Academy policy#!"
 cc_byz_acad_unlock_literacy_tt: "Unlocks the charter reward #Y Literate Universities#!"
 cc_byz_acad_unlock_institution_tt: "Unlocks the charter reward #Y Western Learning#!"
 cc_byz_acad_unlock_tactics_tt: "Unlocks the charter reward #Y The Tactica Taught#!"
 cc_byz_acad_unlock_law_tt: "Unlocks the charter reward #Y Faculty of Law#!"
 cc_byz_acad_unlock_theology_tt: "Unlocks the charter reward #Y Faculty of Theology#!"
 cc_byz_acad_reconciled_tt: "The Church is reconciled to the Academy: #G +1#! charter pick"
 cc_byz_acad_dispute_won_tt: "#G Won:#! the school gains renown and quality, we gain #G +1#! charter pick, and #Y Literate Universities#! is unlocked"
 cc_byz_acad_dispute_lost_tt: "#R Lost:#! the school loses renown"
 cc_byz_acad_reward_policy_tt: "Elite Education gains the #Y Imperial Academy#! policy. While enacted it also pulls our society toward whichever side won the Academy"
 cc_byz_acad_reward_literacy_tt: "Every location we own with a university gets #G +4%#! maximum literacy for nobles and burghers, permanently. Universities built later get it too"
 cc_byz_acad_reward_institution_tt: "Every location we own with a university gets faster institution growth, permanently. Universities built later get it too"
 cc_byz_acad_reward_tactics_tt: "#G +0.01#! military tactics for every university we own, up to #G +0.2#! at 20 universities, permanently"

 # Law policy
 cc_byz_imperial_academy: "Imperial Academy"
 cc_byz_imperial_academy_desc: "The state's officials are trained at an Academy the emperor chartered and pays for. They learn law, letters and the manuals of war from masters the court appoints."

 # Modifiers
 STATIC_MODIFIER_NAME_cc_byz_acad_literacy: "Academy Masters"
 STATIC_MODIFIER_DESC_cc_byz_acad_literacy: "Masters trained at the imperial Academy teach at this university."
 STATIC_MODIFIER_NAME_cc_byz_acad_institutions: "Western Learning"
 STATIC_MODIFIER_DESC_cc_byz_acad_institutions: "This university reads the Latin schoolmen in Greek translation, and new ideas arrive with them."
 STATIC_MODIFIER_NAME_cc_byz_acad_law_faculty: "Faculty of Law"
 STATIC_MODIFIER_DESC_cc_byz_acad_law_faculty: "Justinian's code is taught at the Academy, and its graduates staff the offices of state."
 STATIC_MODIFIER_NAME_cc_byz_acad_theology_latin: "Faculty of Theology: Scholastic"
 STATIC_MODIFIER_DESC_cc_byz_acad_theology_latin: "The Academy's theologians read Aquinas and argue with the Latins in their own terms."
 STATIC_MODIFIER_NAME_cc_byz_acad_theology_palamite: "Faculty of Theology: Hesychast"
 STATIC_MODIFIER_DESC_cc_byz_acad_theology_palamite: "The Academy's theologians teach the doctrine of Gregory Palamas, and the monasteries trust them."
 STATIC_MODIFIER_NAME_cc_byz_acad_theology_platonist: "Faculty of Theology: Platonist"
 STATIC_MODIFIER_DESC_cc_byz_acad_theology_platonist: "The Academy's theologians read Plato beside the Fathers. The clergy watch them closely."
 STATIC_MODIFIER_NAME_cc_byz_acad_drift_latin: "The Academy Reads Latin"
 STATIC_MODIFIER_DESC_cc_byz_acad_drift_latin: "The Latin scholastics won the Academy, and its graduates carry their habits into the offices of state."
 STATIC_MODIFIER_NAME_cc_byz_acad_drift_hellenic: "The Academy Reads Plato"
 STATIC_MODIFIER_DESC_cc_byz_acad_drift_hellenic: "Plethon's circle won the Academy, and its graduates carry the ancient learning into the offices of state."
 AUTO_MODIFIER_NAME_cc_byz_acad_tactics: "The Tactica Taught"
 AUTO_MODIFIER_DESC_cc_byz_acad_tactics: "Officers study Leo VI's Tactica and the older manuals at the Academy. The more universities train them, the better they fight."
 AUTO_MODIFIER_NAME_cc_byz_acad_policy_latin: "Imperial Academy: Latin Masters"
 AUTO_MODIFIER_DESC_cc_byz_acad_policy_latin: "The Imperial Academy policy, under masters who read the Latin scholastics."
 AUTO_MODIFIER_NAME_cc_byz_acad_policy_hellenic: "Imperial Academy: Platonist Masters"
 AUTO_MODIFIER_DESC_cc_byz_acad_policy_hellenic: "The Imperial Academy policy, under masters from Plethon's circle."

 # .1 Who leads the Academy
 cc_byz_academy.1.title: "The Academy Reopened"
 cc_byz_academy.1.desc: "The emperor has chartered an Academy in [cc_acad_seat.GetName], the first school of its kind since the Pandidakterion. Its halls are ready. Its masters are not yet chosen, and three parties want the appointment.\n\nThe Latinophrones read Aquinas in Demetrios Kydones' translation and think the Latins have something to teach. The hesychast monks of Gregory Palamas hold that the Church already knows what learning is for. At Mistra, Gemistos Plethon teaches Plato to anyone who makes the journey, and his students are already in the capital asking for the post."
 cc_byz_academy.1.a: "The Latinophrones. Learning has no frontier."
 cc_byz_academy.1.b: "The Palamite monks. The Church's own learning."
 cc_byz_academy.1.c: "Plethon's circle from Mistra."
 cc_byz_academy.1.d: "A scholar from our own cabinet, answerable to us."

 # .2 The faculties
 cc_byz_academy.2.title: "The Faculties"
 cc_byz_academy.2.desc: "The Academy can afford to open one faculty properly this decade. The jurists want a chair of law and a nomophylax to hold it, as Constantine IX founded in 1046. The officers want Leo VI's Tactica and the older manuals taught as a discipline. The rhetors point out that every official the empire has ever had was trained in letters first, and that the rest follows.\n\nA minister with the right training could carry a second faculty."
 cc_byz_academy.2.a: "Law. Justinian's code, and a nomophylax to teach it."
 cc_byz_academy.2.b: "Military science. The Tactica and the old manuals."
 cc_byz_academy.2.c: "Letters and rhetoric."
 cc_byz_academy.2.d: "Our jurist teaches law beside letters."
 cc_byz_academy.2.e: "Our strategist writes a new Tactica beside the letters faculty."

 # .3 The translation question
 cc_byz_academy.3.title: "The Translation Question"
 cc_byz_academy.3.desc: "The Academy's library has asked what it should translate. Kydones' Aquinas is already circulating in Greek and the Latinophrones want the rest of the schoolmen with it. The monks want nothing in Latin on the shelves. Plethon's students want his Laws taught openly, which would mean teaching the old gods as philosophy in a Christian capital.\n\nWhatever is read here will be read by every official the Academy trains."
 cc_byz_academy.3.a: "Translate Aquinas and the Latin schoolmen."
 cc_byz_academy.3.b: "Greek texts only. We have our own books."
 cc_byz_academy.3.c: "Teach Plethon's Laws openly."
 cc_byz_academy.3.d: "Our humanist translates in both directions."

 # .4 The Patriarch objects
 cc_byz_academy.4.title: "The Patriarch Objects"
 cc_byz_academy.4.desc: "The Patriarch has written to say that an Academy which teaches philosophy without theology teaches half of what a Christian needs to know. He asks for a chair of theology, appointed by the Church, inside the Academy's walls."
 cc_byz_academy.4.desc_latin: "The Patriarch has written to say that the Academy has become a school for Latinizers, and that its graduates argue the Filioque in the palace corridors. He asks for a chair of theology, appointed by the Church, to answer them from inside the Academy."
 cc_byz_academy.4.desc_platonist: "The Patriarch has written to say that the Academy is teaching paganism under the name of philosophy, and that the Church will not stay silent while the emperor pays for it. He asks for a chair of theology, appointed by the Church, inside the Academy's walls."
 cc_byz_academy.4.a: "Give the Church its chair."
 cc_byz_academy.4.b: "The Academy answers to the emperor."
 cc_byz_academy.4.c: "Our theologian brokers terms."

 # .5 The court schools dispute
 cc_byz_academy.5.title: "The Schools Dispute"
 cc_byz_academy.5.desc: "The Academy's masters have called a public disputation to settle its curriculum, and invited the realm's other schools to send their best. We have no court school of standing to send. Masters could be hired from abroad to argue on our behalf, at a price."
 cc_byz_academy.5.desc_school: "The Academy's masters have called a public disputation to settle its curriculum, and invited the realm's other schools to send their best. Our court school at [cc_acad_school_seat.GetName] could take the field. A win would make its name; a loss would be remembered just as long."
 cc_byz_academy.5.a: "Send the school in."
 cc_byz_academy.5.b: "Our minister leads the school's disputants."
 cc_byz_academy.5.c: "Keep the schools out of it."
 cc_byz_academy.5.d: "Hire masters from abroad."
 cc_byz_academy.5.e: "The Academy can argue for itself."

 # .6 The charter
 cc_byz_academy.6.title: "The Academy's Charter"
 cc_byz_academy.6.desc: "The Academy's charter is ready for the emperor's seal. It can carry one endowment, and one more for each of these: the Church reconciled to the Academy, and a court school victorious in the disputation.\n\nEach endowment was opened by an earlier choice and some need more:\n#Y Imperial Academy policy:#! a law or letters faculty.\n#Y Literate Universities:#! a letters faculty or a won disputation, and nobles at least 35% literate.\n#Y Western Learning:#! the Latin schoolmen translated.\n#Y The Tactica Taught:#! a military faculty, and a minister with military skill 65 or more or a military court school.\n#Y Faculty of Law:#! a law faculty, and a legal scholar in the cabinet or an administrative court school.\n#Y Faculty of Theology:#! the Church reconciled."
 cc_byz_academy.6.policy: "Write the Academy into the law on education."
 cc_byz_academy.6.literacy: "Send its masters to every university."
 cc_byz_academy.6.institution: "Spread the translated learning to every university."
 cc_byz_academy.6.tactics: "Make the Tactica the officers' course."
 cc_byz_academy.6.law: "Endow the faculty of law."
 cc_byz_academy.6.theology: "Endow the faculty of theology."
 cc_byz_academy.6.none: "Seal the charter as it stands."

 # .90 The Academy closes
 cc_byz_academy.90.title: "The Academy Closes"
 cc_byz_academy.90.desc: "With both Constantinople and Athens lost, the Academy has no home. Its masters have scattered to Italy and the monasteries, and its charter was never sealed."
 cc_byz_academy.90.a: "Another school lost to the empire."
