l_english:
 # cc_byz_exarch.10 - the prompt
 cc_byz_exarch.10.title: "Who Governs Italy?"
 cc_byz_exarch.10.desc: "Italian territory is held in imperial hands and is being administered, after a fashion, by dispatch. The dispatches take six weeks each way.\n\nThe practical objection has been raised by the officials responsible, who point out that they are being asked to settle disputes between Italian lords whose names they cannot pronounce, on evidence three months old, in a legal tradition none of them has studied. They are doing it badly and they say so.\n\nThe old answer to this problem was an exarch: one man, on the ground, holding civil and military authority together, deciding in the emperor's name without asking first. It worked for a hundred and fifty years and then it stopped working, in a manner the archives record at some length."
 cc_byz_exarch.10.desc_rome: "Rome is held, and the empire is discovering that holding Rome and governing Rome are separate problems.\n\nThe city has a bishop with his own courts, a nobility with its own quarrels, a population accustomed to being administered by neither, and a set of legal customs that predate the reconquest by several centuries. The imperial officials sent to run it are competent men who are drowning, and they have written to say so in terms notably less deferential than usual.\n\nThe old answer was an exarch, seated at Ravenna or in the city itself, holding civil and military authority together. Everyone in the palace knows the precedent. Everyone also knows how the precedent ended."
 cc_byz_exarch.10.a: "A caretaker. Short terms, and nothing of his own."
 cc_byz_exarch.10.b: "An effective governor. Let him actually run it."
 cc_byz_exarch.10.c: "A strategos. Civil and military command together."
 cc_byz_exarch.10.d: "Govern it from here. We have officials for this."

 # cc_byz_demand.1 - the request
 cc_byz_demand.1.title: "The Exarch's Request"
 cc_byz_demand.1.desc: "The exarch has written requesting that certain Italian districts still administered directly from Constantinople be placed under his authority instead.\n\nThe letter is careful and the argument is good. The districts border his own, they are administered at six weeks' remove by men who have never seen them, and their revenue barely covers the cost of collecting it. He is not asking for anything the empire is making money on.\n\nHe has also, without saying so, established that he now writes to the palace about the borders of his own office rather than about the business of governing it."
 cc_byz_demand.1.desc_persistent: "The exarch has written again about the Italian districts, and this is not the second time.\n\nThe arguments are the same and remain good ones, which is part of what makes the correspondence tiresome. What has changed is the tone: the earlier letters asked, and this one describes an arrangement that would be sensible and waits to hear whether the palace agrees.\n\nThe clerk who files these has begun keeping them together in a single bundle. Nobody instructed him to."
 cc_byz_demand.1.desc_hostile: "The exarch has written about the Italian districts, and the letter has been read three times in the palace because of what it does not contain.\n\nThere is no request in it. There is an account of how the districts are currently administered, an assessment of how they might be administered better, and a closing paragraph expressing confidence that the emperor will see the matter as he does. It is the letter of a man who has stopped regarding the answer as being in doubt.\n\nHis own loyalty has been in question for some time. This does not settle the question in his favour."
 cc_byz_demand.1.desc_after_seizure: "The exarch has written to request certain Italian districts, and the palace has had to check the registers to establish which ones he does not already hold.\n\nThe letter observes every form. It asks, it sets out reasons, it defers to the emperor's judgement, and it concerns territory adjacent to districts his officers began collecting in some years ago without asking anybody. The courtesy is deliberate and is not addressed to the emperor: it is for the record, so that what happens next can be described as a grant.\n\nHe is offering to let the palace keep the appearance of deciding. That is the actual proposal."
 cc_byz_demand.1.a: "Refuse. The districts are administered from here."
 cc_byz_demand.1.b: "Grant them. He governs them better than we do."
 cc_byz_demand.1.c: "Refuse, and make it land as policy rather than a snub."
 cc_byz_demand.1.d: "Give him the revenue. Keep the authority."

 # cc_byz_demand.2 - the argument
 cc_byz_demand.2.title: "The Exarch Makes His Case"
 cc_byz_demand.2.desc: "The exarch has stopped writing letters and produced a document.\n\nIt is a memorandum on the administration of Italy: historical, well sourced, and quietly devastating. It sets out what the exarchate was under Justinian and his successors, what authority its holders exercised, and how the present arrangement compares. The comparison is not flattering to the present arrangement and is not meant to be.\n\nCopies have gone to the palace. Copies have also, the palace notes, gone to several other people."
 cc_byz_demand.2.desc_precedent: "The exarch has produced a memorandum on the administration of Italy, and its most effective passage is the one quoting the emperor's own grant.\n\nHe was given districts before. The document treats that grant as having established a principle rather than settled a case, and reasons forward from it with some care: if those districts were better administered from Rome, and they were, then the argument applies to the rest by exactly the same logic.\n\nIt is a good argument. It is a good argument because it is built on something the palace did, which is the difficulty with precedents."
 cc_byz_demand.2.a: "Concede it. Italy is administered from Rome."
 cc_byz_demand.2.b: "Refuse, in the same public form he used."
 cc_byz_demand.2.c: "Recall him over it."

 # cc_byz_demand.3 - he stopped asking
 cc_byz_demand.3.title: "He Stopped Asking"
 cc_byz_demand.3.desc: "The exarch's officers are collecting in the disputed districts. They have been for two seasons. The palace found out from a tax return that did not arrive.\n\nThere was no proclamation and no seizure. His men were already the nearest authority, the garrisons had been his for years, and at some point the local officials simply began reporting to the man who was actually there. When the discrepancy was raised he replied promptly and courteously, expressing surprise that the arrangement had not been formalised earlier.\n\nThe empire's options are a war in Italy it cannot presently fund, or a document. He has been reasonably confident of that for some time."
 cc_byz_demand.3.a: "Ratify it. Call it a grant and save the appearance."
 cc_byz_demand.3.b: "Refuse to recognise it. Let the registers stand."
