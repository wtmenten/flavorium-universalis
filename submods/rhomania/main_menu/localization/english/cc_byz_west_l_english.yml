l_english:
 # The West: the situation, the Praetorian Prefectures, the consistory and its four laws.
 #
 # The four prefectures are named for late-Roman administrative units rather than for
 # exarchates. Only Ravenna and Carthage were ever exarchates; Spania was governed by a
 # magister militum and Gaul was never recovered at all. The PREFECTURES of Italy, Africa and
 # Gaul, and the Spanish diocese under Gaul, are real, which is what an eastern emperor
 # restoring the west would claim to be restoring.

 # ---- The situation ----
 cc_byz_the_west: "The West"
 cc_byz_the_west_desc: "Four provinces recovered, and the standing question of what they are. A prefecture governed from Constantinople cannot defend itself; one that can defend itself does not need Constantinople."
 cc_byz_the_west_map_tt: "Part of the western prefectures"

 # ---- The organisation ----
 cc_byz_prefectures: "The Praetorian Prefectures of the West"
 cc_byz_prefectures_desc: "The administrative body of the recovered west, and its consistory. The emperor presides; each prefect sits. Whether the body deliberates or merely receives instructions is a question of arithmetic, and the arithmetic changes with every province recovered."

 # ---- Voting statuses ----
 # The whole design in three numbers: 3 votes, 2 votes, 1 vote.
 cc_byz_augustus: "Augustus"
 cc_byz_augustus_desc: "The emperor. Three voices in the consistory, which is enough against one prefect, exactly enough against two, and not enough against three."
 cc_byz_senior_exarch: "Senior Exarch"
 cc_byz_senior_exarch_desc: "First among the prefects, and the only one the emperor chooses. Two voices."
 cc_byz_exarch_seat: "Exarch"
 cc_byz_exarch_seat_desc: "A seat in the consistory. One voice, and there is no upper limit on how many of them the emperor's own reconquest creates."

 # ---- The consistory ----
 cc_byz_consistorium_dormant: "Consistory Unconvened"
 cc_byz_consistorium_dormant_desc: "The prefectures exist and are governed. They do not meet. An emperor who never calls them into session never loses a vote, and never learns what they would have said."
 cc_byz_consistorium_assembly: "The Sacred Consistory"
 cc_byz_consistorium_assembly_desc: "The council of the west in session. The emperor speaks with three voices, the senior prefect with two, each other prefect with one. A tie fails the motion."

 # ---- The four countries ----
 cc_byz_exarchate_ravenna_name: "Exarchate of Ravenna"
 cc_byz_exarchate_ravenna_adj: "Ravennate"
 cc_byz_exarchate_carthage_name: "Exarchate of Carthage"
 cc_byz_exarchate_carthage_adj: "Carthaginian"
 cc_byz_exarchate_spania_name: "Province of Spania"
 cc_byz_exarchate_spania_adj: "Spanian"
 cc_byz_exarchate_gaul_name: "Prefecture of the Gauls"
 cc_byz_exarchate_gaul_adj: "Gallic"

 # ---- Law: command ----
 cc_byz_west_command_law: "Command of the Western Armies"
 cc_byz_west_command_law_desc: "Who the soldiers in the west obey. The oldest of the four questions and the one that settled it in the sixth century."
 cc_byz_command_imperial: "Imperial Officers"
 cc_byz_command_imperial_desc: "Commanders appointed from the capital and rotated before they take root. The armies are the emperor's and are worse at their work for it."
 cc_byz_command_exarchal: "The Exarch Commands"
 cc_byz_command_exarchal_desc: "The prefect commands his own troops. The exarchs of Ravenna were generals because Italy could not be defended by a committee on another continent, and this is what made them dangerous."
 cc_byz_command_joint: "Joint Command"
 cc_byz_command_joint_desc: "Orders countersigned in two places. It works, slowly, and nobody is satisfied."

 # ---- Law: the fisc ----
 cc_byz_west_fisc_law: "The Western Revenue"
 cc_byz_west_fisc_law_desc: "Where the money raised in the west goes. A prefecture that remits everything cannot pay its own garrisons; one that retains everything is a state."
 cc_byz_fisc_remitted: "Remitted in Full"
 cc_byz_fisc_remitted_desc: "Everything to Constantinople, and the west applies for it back. The capital decides what the frontier is worth."
 cc_byz_fisc_split: "Divided at the Prefecture"
 cc_byz_fisc_split_desc: "The province keeps what it needs and sends the rest. The historical arrangement, and the workable one."
 cc_byz_fisc_retained: "Retained in the West"
 cc_byz_fisc_retained_desc: "The west pays for itself and owes the capital a courtesy. Prosperous, well garrisoned, and no longer asking."

 # ---- Law: the rite ----
 cc_byz_west_rite_law: "The Rite in the Western Churches"
 cc_byz_west_rite_law_desc: "What is celebrated in the recovered provinces. The load-bearing question: a west that votes itself local usage is a west drifting Latin, and it was the emperor's own reconquest that gave it the votes."
 cc_byz_rite_greek: "The Greek Rite"
 cc_byz_rite_greek_desc: "As celebrated in the capital, in the exarch's own chapel, and almost nowhere else in the west that anyone actually attends."
 cc_byz_rite_local: "Local Usage Tolerated"
 cc_byz_rite_local_desc: "The churches keep the forms they have kept for centuries. Pragmatic, popular, and the first step down a slope the palace can see perfectly well."
 cc_byz_rite_latin: "The Latin Rite"
 cc_byz_rite_latin_desc: "Openly, and by vote of the emperor's own council. The west has decided which church it belongs to, and it is not the one whose emperor governs it."

 # ---- Law: succession ----
 cc_byz_west_succession_law: "Succession in the Prefectures"
 cc_byz_west_succession_law_desc: "How a dead prefect is replaced. The question that turns an office into a family."
 cc_byz_succession_appointed: "Appointed from the Capital"
 cc_byz_succession_appointed_desc: "A dead exarch is replaced by whoever the palace sends. It is what makes the post an office."
 cc_byz_succession_acclaimed: "Acclaimed Locally"
 cc_byz_succession_acclaimed_desc: "The army and the notables of the province choose, and the emperor confirms what has already happened."
 cc_byz_succession_hereditary: "Hereditary"
 cc_byz_succession_hereditary_desc: "The office passes to the son. The empire now has a dynasty in the west that did not come from the palace and does not need it."

 # ---- The seven governing actions ----
 cc_byz_west_order_census: "Order a Census of the West"
 cc_byz_west_order_census_desc: "Count the land, the people and what they owe. The thing a Roman administration did that nothing else in Europe could, and the thing everyone being counted would rather it did not."
 cc_byz_west_donative: "Pay the Western Donative"
 cc_byz_west_donative_desc: "The garrisons receive their arrears and this year's pay together. The single thing that most reliably kept a Roman frontier loyal, and the single thing emperors most reliably stopped doing when money was short."
 cc_byz_west_demand_tribute: "Demand the Prefectural Tribute"
 cc_byz_west_demand_tribute_desc: "A levy above what the arrangement already yields. The money arrives. So does the memory of having been asked."
 cc_byz_west_send_strategos: "Send the Strategos West"
 cc_byz_west_send_strategos_desc: "Reinforcements, and a general to command them. The west becomes defensible, and there is now an army out there that knows whose name is on its pay."
 cc_byz_west_confirm_son: "Confirm the Exarch's Son"
 cc_byz_west_confirm_son_desc: "Recognise the succession in advance. It buys a loyalty nothing else can and it concedes, permanently, that the office belongs to a family."
 cc_byz_west_recall_exarch: "Summon the Exarch to the Capital"
 cc_byz_west_recall_exarch_desc: "Recall him to explain himself. Whether he comes is not the emperor's decision, and depends entirely on how he has been treated."
 cc_byz_west_grant_charter: "Grant a Commune its Charter"
 cc_byz_west_grant_charter_desc: "Rights and self-government in writing, in exchange for revenue and quiet. The first charter is the precedent every other commune will cite."

 # ---- The three consistory actions ----
 cc_byz_io_convene_consistory: "Convene the Consistory"
 cc_byz_io_convene_consistory_desc: "Call the prefects into session. Until this is done there are no votes to lose, and after it there are."
 cc_byz_io_elevate_senior_exarch: "Elevate a Senior Exarch"
 cc_byz_io_elevate_senior_exarch_desc: "Name one prefect first among the others. He speaks with two voices in the consistory, so this is a decision about who to hand the second one to."
 cc_byz_io_dissolve_prefecture: "Dissolve a Prefecture"
 cc_byz_io_dissolve_prefecture_desc: "Take the province back under direct rule. The only way to reduce the consistory's opposition, and every other prefect will watch it happen."

 # ---- Modifier types ----
 MODIFIER_TYPE_NAME_cc_byz_augustus_can_participate_in_parliament: "Augustus May Sit in the Consistory"
 MODIFIER_TYPE_NAME_cc_byz_senior_exarch_can_participate_in_parliament: "Senior Exarch May Sit in the Consistory"
 MODIFIER_TYPE_NAME_cc_byz_exarch_seat_can_participate_in_parliament: "Exarch May Sit in the Consistory"
 MODIFIER_TYPE_NAME_cc_byz_augustus_agenda_impact: "Augustus Agenda Impact"
 MODIFIER_TYPE_NAME_cc_byz_senior_exarch_agenda_impact: "Senior Exarch Agenda Impact"
 MODIFIER_TYPE_NAME_cc_byz_exarch_seat_agenda_impact: "Exarch Agenda Impact"

 # A registered modifier type needs a DESC as well as a NAME. Without one the game logs
 # "TODO : Write a desc" at load and puts that literal string in the tooltip.
 MODIFIER_TYPE_DESC_cc_byz_augustus_can_participate_in_parliament: "Whether the emperor holds a seat and a vote in the consistory of the western prefectures."
 MODIFIER_TYPE_DESC_cc_byz_senior_exarch_can_participate_in_parliament: "Whether the senior prefect holds a seat and a vote in the consistory."
 MODIFIER_TYPE_DESC_cc_byz_exarch_seat_can_participate_in_parliament: "Whether an ordinary prefect holds a seat and a vote in the consistory."
 MODIFIER_TYPE_DESC_cc_byz_augustus_agenda_impact: "How far the emperor can push the consistory's agenda."
 MODIFIER_TYPE_DESC_cc_byz_senior_exarch_agenda_impact: "How far the senior prefect can push the consistory's agenda."
 MODIFIER_TYPE_DESC_cc_byz_exarch_seat_agenda_impact: "How far an ordinary prefect can push the consistory's agenda."

 # ---- Action outcomes ----
 STATIC_MODIFIER_NAME_cc_byz_west_census_taken: "The Western Register"
 STATIC_MODIFIER_DESC_cc_byz_west_census_taken: "The land is counted and the figures are current. They will not stay current."
 STATIC_MODIFIER_NAME_cc_byz_west_donative_paid: "The Donative Paid"
 STATIC_MODIFIER_DESC_cc_byz_west_donative_paid: "The western garrisons have been paid on time, which they will remember for about as long as it lasts."
 STATIC_MODIFIER_NAME_cc_byz_west_tribute_taken: "The Tribute Taken"
 STATIC_MODIFIER_DESC_cc_byz_west_tribute_taken: "The levy was collected. The resentment is recorded elsewhere."
 STATIC_MODIFIER_NAME_cc_byz_west_strategos_sent: "A Strategos in the West"
 STATIC_MODIFIER_DESC_cc_byz_west_strategos_sent: "There is a general out there with troops who know him, which is what the west needed and what the capital will come to regret."
 STATIC_MODIFIER_NAME_cc_byz_west_recall_issued: "The Summons Issued"
 STATIC_MODIFIER_DESC_cc_byz_west_recall_issued: "The order has gone west. What comes back is a separate matter."
 STATIC_MODIFIER_NAME_cc_byz_west_charter_granted: "A Commune Chartered"
 STATIC_MODIFIER_DESC_cc_byz_west_charter_granted: "Rights in writing, revenue in return, and a precedent every other commune in the west now cites."
 STATIC_MODIFIER_NAME_cc_byz_west_recall_obeyed: "The Summons Obeyed"
 STATIC_MODIFIER_DESC_cc_byz_west_recall_obeyed: "He came when he was called. Every governor in the empire noticed."
 STATIC_MODIFIER_NAME_cc_byz_west_recall_refused: "The Summons Refused"
 STATIC_MODIFIER_DESC_cc_byz_west_recall_refused: "He did not come, and nothing happened to him. Every governor in the empire noticed that too."
 STATIC_MODIFIER_NAME_cc_byz_west_prefecture_dissolved: "A Prefecture Dissolved"
 STATIC_MODIFIER_DESC_cc_byz_west_prefecture_dissolved: "The province is governed directly from the capital again, at the cost of governing it directly from the capital."

 # ---- The four endings ----
 STATIC_MODIFIER_NAME_cc_byz_west_end_reabsorbed: "The West Reabsorbed"
 STATIC_MODIFIER_DESC_cc_byz_west_end_reabsorbed: "The prefectures are dissolved into the empire and administered from Constantinople. It required keeping them weak, which is why it worked."
 STATIC_MODIFIER_NAME_cc_byz_west_end_diarchy: "The Diarchy"
 STATIC_MODIFIER_DESC_cc_byz_west_end_diarchy: "A colleague in the west, formally invested, governing provinces strong enough to matter. Two emperors, one empire, and this time it was arranged rather than suffered."
 STATIC_MODIFIER_NAME_cc_byz_west_end_acclamation: "The Western Acclamation"
 STATIC_MODIFIER_DESC_cc_byz_west_end_acclamation: "The armies of the west proclaimed their own emperor. It is how the empire acquired a western half the first time."
 STATIC_MODIFIER_NAME_cc_byz_west_end_neglect: "The West Neglected"
 STATIC_MODIFIER_DESC_cc_byz_west_end_neglect: "Nobody governs the recovered provinces, including the men appointed to."

 # ---- Situation events ----
 cc_byz_west.1.title: "The Prefectures of the West"
 cc_byz_west.1.desc: "The document is short, because there is a form for this and the form is nine hundred years old.\n\nA praetorian prefecture is constituted. Its prefect holds the province, commands what troops are in it, hears appeals from its courts and remits its revenue, and he does all of this in the emperor's name at a distance of some weeks' sailing.\n\nThe chancery has drafted the appointment three times. Each draft has been shorter than the last, because the longer it is the more it reads like a list of the things the man will now be able to do without asking."
 cc_byz_west.1.desc_several: "There are now several of them, which is a different arrangement from having one.\n\nOne prefect is a governor. Two are a precedent. What three or four amount to is a question the chancery has been careful not to put in writing, and the older clerks have started using the phrase 'the west' as though it were a place with opinions rather than a direction."
 cc_byz_west.1.a: "It is how the empire was always governed."

 cc_byz_west.10.title: "The Consistory Convened"
 cc_byz_west.10.desc: "They are summoned, and they come.\n\nThe sacred consistory is not new. Emperors have taken counsel in this form since Diocletian, and the protocol is exact: who stands, who sits, who speaks in what order, and how a decision is recorded as the emperor's own however it was arrived at.\n\nWhat is new is who is standing in it. The prefects of the west have travelled a long way to be here, and men who have travelled a long way to be consulted tend to expect to have been."
 cc_byz_west.10.desc_outnumbered: "They are summoned, and they come, and there are more of them than there are of us.\n\nThe protocol is exact and the arithmetic is exact too. The emperor speaks with three voices, as he always has. The prefects of the west, between them, now speak with more, and every one of those voices exists because the empire succeeded in the west.\n\nNo one says this. The Master of Offices has arranged the seating with great care."
 cc_byz_west.10.a: "Let them be heard."

 cc_byz_west.20.title: "The Summons"
 cc_byz_west.20.desc: "The order is unambiguous and courteously phrased. He is to present himself at the capital and account for his administration.\n\nWhat happens next is not in the emperor's hands. It has not been in the emperor's hands for some years, and was decided by every donative paid or withheld, every levy demanded, and whether anyone ever told him his son would be confirmed."
 cc_byz_west.20.desc_again: "The order is unambiguous, courteously phrased, and the second one.\n\nThe last time it was ignored and nothing followed. Everyone west of the Adriatic knows this, including the man now reading it."
 cc_byz_west.20.a: "He is on the road within the month."
 cc_byz_west.20.b: "He regrets that the province cannot spare him."
 cc_byz_west.20.c: "Then he will be fetched."

 cc_byz_west.30.title: "Dissolving the Prefecture"
 cc_byz_west.30.desc: "It can be done. The office was created by a document and can be ended by one, and the territory reverts to direct administration from the capital.\n\nWhat the document cannot do is produce the officials to administer it. Those men are currently the prefect's, they live there, and they have spent a career learning a province the capital has never seen. Some will stay on. The ones who matter will not.\n\nThe other prefects will hear about it before the couriers reach them."
 cc_byz_west.30.a: "The office was ours to create and ours to end."
 cc_byz_west.30.b: "Leave it. There are better fights."

 cc_byz_west.90.title: "The West Reabsorbed"
 cc_byz_west.90.desc: "The last prefecture is wound up and the west is governed as the east is governed: by officials who serve where they are sent, hold office at the emperor's pleasure, and go home when they are recalled.\n\nIt took keeping the provinces weak. A prefecture strong enough to defend itself would have been strong enough to refuse, so none of them ever were, and the frontier has been held by armies sent out from the capital at a cost nobody has ever totalled.\n\nThe empire is one thing again, administered from one place, in one language, by one service. It has not been that since Theodosius."
 cc_byz_west.90.a: "One empire, and one emperor in it."

 cc_byz_west.91.title: "The Diarchy"
 cc_byz_west.91.desc: "The arrangement is formalised in the consistory, in the old forms, and the old forms turn out to have been written for exactly this.\n\nThere is a colleague in the west. He is invested, acclaimed, and named in the prayers; his prefectures raise their own armies, keep their own revenue and answer for their own frontier, and they answer to him. He answers to the senior Augustus, which is a real relationship and not a courtesy, because it was arrived at by agreement between two courts that both had something to lose.\n\nThis is what the fourth century was trying to do. It failed then because the two halves were rivals from the start. This one was built by an emperor who recovered the west himself and then declined to pretend he could administer it from the Bosporus."
 cc_byz_west.91.a: "Two Augusti, and one empire between them."

 cc_byz_west.92.title: "The Acclamation"
 cc_byz_west.92.desc: "It happens the way it always happens. Not a rebellion, not a manifesto: a parade ground, an army that has not been paid, a general who has been, and the shout going up before anyone has decided to shout it.\n\nBy the time the news reaches Constantinople he has been purple for four months, the prefectures have recognised him, and the recognitions are worded so carefully that no single one of them is treason.\n\nThe consistory continues to meet. It was, after all, constituted by imperial authority, and it takes the view that it still is."
 cc_byz_west.92.a: "Then there are two of us, and one is a usurper."

 cc_byz_west.93.title: "The West Let Go"
 cc_byz_west.93.desc: "There is no moment. That is what makes it hard to report.\n\nThe prefects are still appointed and still confirmed. The revenue is still assessed, on figures from a census forty years old. The garrisons are still on the rolls. Somewhere between the assessment and the collection, and between the roll and the wall, the empire stopped being what governs those provinces, and nobody can say in which year.\n\nThe men who actually govern them now are local, competent, and were never appointed by anyone."
 cc_byz_west.93.a: "It was a long way to hold."

 # ---- The deadline ----
 # The situation force-resolves on reaching the Age of Revolutions, because the main mod
 # takes over the question of what a subject is at that boundary. This says so in advance.
 cc_byz_west.80.title: "The Question Cannot Be Left Open"
 cc_byz_west.80.desc: "The Master of Offices has submitted a memorandum nobody asked him for.\n\nHis point is procedural and therefore hard to argue with. The western prefectures have now existed long enough that their arrangements are older than most of the men administering them, and every year the arrangement goes unstated it becomes harder to state. Prefects are being appointed under precedents rather than instructions. Revenue is being remitted at rates nobody can produce a document for.\n\nHe does not recommend a policy. He recommends that there be one, and soon, because the alternative is that the answer arrives on its own and the palace finds out what it was afterwards."
 cc_byz_west.80.desc_westward: "The Master of Offices has submitted a memorandum nobody asked him for, and it is shorter than his usual.\n\nThe west is not being governed from here. He does not put it that baldly, but the figures do: appointments confirmed rather than made, revenue assessed in the provinces rather than in the capital, and a consistory whose votes the emperor now has to count before he calls them.\n\nNone of this was decided. All of it is now the practice, and practice becomes law in this empire by not being challenged for long enough. He suggests the challenge be made in this reign or not at all."
 cc_byz_west.80.a: "Then it will be settled in my time."

 # ---- The civil war ----
 # Not a fifth ending: the war moves the counters hard and routes into reabsorption or
 # acclamation. It requires a CONVENED consistory, because four prefects separated by weeks of
 # sailing cannot coordinate a rising without the body the emperor summoned for them.
 cc_byz_west.40.title: "The Prefects Rise"
 cc_byz_west.40.desc: "It begins as a procedural objection, which is how these things begin when the men making them are lawyers as well as soldiers.\n\nThe consistory has resolved that appointments to the western prefectures require the assent of the body. It has communicated this resolution to the capital in the correct form, with the correct seals, citing four precedents of which three are genuine. It has not resolved anything about obedience, because it does not have to: an appointment the consistory has not assented to is now, by its own resolution, not an appointment.\n\nThe western armies are in their quarters and have been paid. Not by us."
 cc_byz_west.40.desc_defied: "It begins where the last summons ended.\n\nA prefect ignored a recall and kept his province, and nothing happened to him. The consistory has now resolved that appointments to the west require the assent of the body, and the resolution reads less like a claim than like a description: the thing has already been true for some years and somebody has finally written it down.\n\nThe western armies are in their quarters and have been paid. Not by us."
 cc_byz_west.40.desc_all: "Every prefecture has signed it.\n\nThat is the part the Master of Offices keeps returning to. Not the content of the resolution, which is a lawyer's document and could be argued with, but the fact that four provinces separated by weeks of sailing produced a single text with four seals on it. They could not have done that eighty years ago. They can do it now because the empire built them a chamber to do it in, summoned them to sit in it, and told them their assent was worth having.\n\nThe western armies are in their quarters and have been paid. Not by us."
 cc_byz_west.40.a: "Then it is a war, and they are still my governors."
 cc_byz_west.40.b: "Give them the substance. I will keep the forms."
 cc_byz_west.40.c: "Buy the ones who can be bought."

 cc_byz_west.41.title: "The Reckoning in the West"
 cc_byz_west.41.desc_won: "The prefecture is wound up, its officials are dismissed or reassigned, and its territory is administered from the capital.\n\nWhat is striking, reading the correspondence afterwards, is how ordinary the legal position turned out to be. No conquest was involved and none was claimed. An office was revoked by the authority that created it, and the fact that the revocation required an army does not appear in the paperwork anywhere.\n\nThe surviving prefects have sent their congratulations. They were prompt about it."
 cc_byz_west.41.desc_none_left: "There are no prefectures left.\n\nThe western provinces are administered directly, which is to say they are administered by men sent out from the capital who do not know the country, do not speak the language of its courts, and will be rotated before they learn either. This is what was wanted. It is worth writing down, once, that it cost a war against the empire's own governors to get it."
 cc_byz_west.41.desc_unresolved: "The war did not settle it, or there was no war.\n\nThe prefectures are still there and so are the prefects, and the resolution requiring the consistory's assent to appointments has not been withdrawn. It has simply stopped being contested, which in this empire is how a claim becomes a right.\n\nThe next emperor will inherit the arrangement as a fact rather than as a question, and will not remember that it was ever otherwise."
 cc_byz_west.41.a: "The office was mine to revoke."
 cc_byz_west.41.b: "Then it is settled against me."

 # ---- The peace treaty ----
 cc_byz_reduce_prefecture: "Reduce the Prefecture"
 cc_byz_reduce_prefecture_desc: "Revoke the appointment and take the province back under direct administration. Not a conquest: the office was created by imperial authority and is ended by it, which is why it costs so little and why nobody else in Europe considers it their business."
 cc_byz_reduce_prefecture_tt: "The prefecture is dissolved and its territory returns to direct imperial administration"

 # ---- The casus belli ----
 cc_byz_cb_reduce_the_prefectures: "Reduce the Prefectures"
 cc_byz_cb_reduce_the_prefectures_desc: "The western prefects have made their assent a condition of their own appointment. They remain, in law, imperial officials in imperial provinces, and the emperor proposes to remind them of the first half of that sentence."
 cc_byz_cb_reduce_the_prefectures_PROV: "Reduce the Prefectures"

 # ---- The warning, and the live indicators ----
 # The rising needs four conditions and two of them were invisible: the autonomy threshold is
 # never stated on the panel, and exarch loyalty has no interface anywhere. These trip one step
 # inside the rising's gates, so there is room to act rather than only to be informed.
 cc_byz_west.35.title: "Letters Not Addressed to Us"
 cc_byz_west.35.desc: "The dispatch pouch from the west has been arriving lighter, and it has taken the chancery some time to work out why.\n\nIt is not that less is being written. It is that a good deal of what is being written now goes directly between the prefectures, on matters the capital would previously have arbitrated: a boundary question settled between two governors without reference to anyone, an agreement on grain prices, a joint complaint about the assessment that was drafted and then not sent.\n\nNone of it is improper. The Master of Offices makes that point twice, which is how the emperor knows he is worried."
 cc_byz_west.35.desc_defied: "The dispatch pouch from the west has been arriving lighter, and this time nobody has to work out why.\n\nA summons was ignored and nothing followed. What the prefectures have been doing since is corresponding with each other rather than with us: boundary questions settled between governors, grain prices agreed, a joint complaint about the assessment drafted and circulated for signature.\n\nThat last document has not been sent. The chancery's view is that it is being kept for when it will be worth more."
 cc_byz_west.35.desc_many: "Three prefectures and more, and they have discovered they can write to each other.\n\nThe correspondence is entirely proper and that is what makes it difficult to object to. Boundary questions settled between governors. Grain prices agreed. A joint statement on the assessment, drafted, circulated for signature, and held.\n\nWhat has changed is not any single letter but the existence of a habit. Eighty years ago the west could not have coordinated anything, because there was no west, only a set of provinces that each dealt with the capital. There is a west now. We built it a chamber and summoned it to sit."
 cc_byz_west.35.a: "Pay the arrears. All of them, this year."
 cc_byz_west.35.b: "Deal with the one who is drafting the letters."
 cc_byz_west.35.c: "Note it. There are nearer problems."

 STATIC_MODIFIER_NAME_cc_byz_west_restive: "The West Is Restive"
 STATIC_MODIFIER_DESC_cc_byz_west_restive: "The prefectures are corresponding with each other rather than with the capital, and at least one prefect has stopped pretending to be satisfied. This is the condition that precedes a rising."
