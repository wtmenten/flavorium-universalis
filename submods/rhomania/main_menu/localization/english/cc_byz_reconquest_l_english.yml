l_english:
 # Mission pack
 cc_byz_renovatio_campaign: "Renovatio Imperii"
 cc_byz_renovatio_campaign_DESCRIPTION: "Justinian recovered Africa, Italy and a strip of Spain, and the recovery cost more than the territory was ever worth. The plague came with the fleet, the treasury never recovered, and Italy was ruined by the war fought to save it.\n\nThis is that campaign, run again by an empire that starts from a great deal less. Each theatre is winnable. None of them is free."
 cc_byz_renovatio_campaign_BUTTON_TOOLTIP: "Recover the western provinces"
 cc_byz_renovatio_campaign_BUTTON_DETAILS: "Illyricum, Italy, Africa and Spania, in that order, ending with the sea itself."
 cc_byz_renovatio_campaign_CRITERIA_DESCRIPTION: "The western provinces have been recovered and the Mediterranean is a Roman sea again."
 cc_byz_task_illyricum: "Illyricum and Dalmatia"
 cc_byz_task_illyricum_desc: "Salona, Split and Durres. The nearest theatre, reachable overland, and the only one that can plausibly be held with the empire's own manpower."
 cc_byz_task_italy: "Italy and the Exarchate"
 cc_byz_task_italy_desc: "Rome, Ravenna and Naples, held under an appointed exarch rather than a garrison. Taking the cities is not enough; Italy is not recovered until it is being governed."
 cc_byz_task_africa: "Africa"
 cc_byz_task_africa_desc: "Palermo, Syracuse, Tunis and Tripoli. The richest theatre and the one that never settles."
 cc_byz_task_spania: "Spania"
 cc_byz_task_spania_desc: "Cartagena and Malaga. The cheapest theatre to take and the hardest to justify keeping."
 cc_byz_task_mare_nostrum: "Mare Nostrum"
 cc_byz_task_mare_nostrum_desc: "All four theatres. The sea is Roman again, and the empire has spent a century finding out what that costs."

 # Theatre triggers
 cc_byz_theatre_illyricum_tt: "We or a subject hold Salona, Split and Durres"
 cc_byz_theatre_italy_tt: "We or a subject hold Rome, Ravenna and Naples, and an exarchate governs them"
 cc_byz_theatre_africa_tt: "We or a subject hold Palermo, Syracuse, Tunis and Tripoli"
 cc_byz_theatre_spania_tt: "We or a subject hold Cartagena and Malaga"
 cc_byz_theatre_mare_nostrum_tt: "We have completed all four western theatres"

 # Theatre actions
 cc_byz_claim_theatre_illyricum: "Proclaim the Recovery of Illyricum"
 cc_byz_claim_theatre_illyricum_desc: "Declare the Dalmatian coast restored to the empire and settle what is to be done with the people living on it."
 cc_byz_claim_theatre_italy: "Proclaim the Recovery of Italy"
 cc_byz_claim_theatre_italy_desc: "Declare Italy restored and governed. Requires an exarch in place: cities taken by an army are held, not recovered."
 cc_byz_claim_theatre_africa: "Proclaim the Recovery of Africa"
 cc_byz_claim_theatre_africa_desc: "Declare the African provinces restored, and discover what garrisoning them costs every year for the rest of the empire's existence."
 cc_byz_claim_theatre_spania: "Proclaim the Recovery of Spania"
 cc_byz_claim_theatre_spania_desc: "Declare the Spanish coast restored. It is a narrow holding at the far end of the sea with nothing behind it, and everyone in the palace knows it."
 cc_byz_claim_mare_nostrum: "Proclaim Mare Nostrum"
 cc_byz_claim_mare_nostrum_desc: "Declare the Mediterranean a Roman sea again, for the first time in nine hundred years."

 # Country modifiers
 STATIC_MODIFIER_NAME_cc_byz_theatre_illyricum_held: "Illyricum Recovered"
 STATIC_MODIFIER_DESC_cc_byz_theatre_illyricum_held: "The Dalmatian coast and its harbours are imperial again, and the men of the interior are available to be recruited."
 STATIC_MODIFIER_NAME_cc_byz_theatre_italy_held: "Italy Recovered"
 STATIC_MODIFIER_DESC_cc_byz_theatre_italy_held: "Rome is governed from Constantinople through an exarch. Every chancery in Europe has had to decide how to address the arrangement."
 STATIC_MODIFIER_NAME_cc_byz_theatre_africa_held: "Africa Recovered"
 STATIC_MODIFIER_DESC_cc_byz_theatre_africa_held: "The grain and the customs of Africa reach the capital again. So do the reports from the frontier forts."
 STATIC_MODIFIER_NAME_cc_byz_theatre_spania_held: "Spania Recovered"
 STATIC_MODIFIER_DESC_cc_byz_theatre_spania_held: "A strip of the Spanish coast, its harbours, and a permanent argument about whether any of it is worth the garrison."
 STATIC_MODIFIER_NAME_cc_byz_mare_nostrum: "Mare Nostrum"
 STATIC_MODIFIER_DESC_cc_byz_mare_nostrum: "The Mediterranean is a Roman sea. Not a claim, not a title: the harbours on every shore answer to Constantinople, and a ship can cross it without leaving the empire."
 STATIC_MODIFIER_NAME_cc_byz_federate_settlement: "Federate Settlement"
 STATIC_MODIFIER_DESC_cc_byz_federate_settlement: "The Slavic and Vlach populations of the interior hold their land on imperial terms in exchange for service. They are the frontier garrison now, and their grandchildren will describe themselves as Romans."
 STATIC_MODIFIER_NAME_cc_byz_italy_restored: "Italy Restored"
 STATIC_MODIFIER_DESC_cc_byz_italy_restored: "The aqueducts run, the roads are repaired and the cities are being repopulated, all at the expense of a treasury that had other commitments."
 STATIC_MODIFIER_NAME_cc_byz_african_limes: "The African Limes"
 STATIC_MODIFIER_DESC_cc_byz_african_limes: "The frontier forts are manned and the garrisons are paid on time, which is the entire difference between a frontier and a raiding ground."
 STATIC_MODIFIER_NAME_cc_byz_spania_reinforced: "Spania Reinforced"
 STATIC_MODIFIER_DESC_cc_byz_spania_reinforced: "The Spanish holdings are supplied and defended from the sea, which works for exactly as long as the fleet has nothing more urgent to do."
 STATIC_MODIFIER_NAME_cc_byz_army_of_the_west: "The Army of the West"
 STATIC_MODIFIER_DESC_cc_byz_army_of_the_west: "A veteran field army, permanently stationed a thousand miles from the capital, loyal to the officers who feed it and increasingly a constituency in its own right."

 # cc_byz_reconquest.1 - Illyricum
 cc_byz_reconquest.1.title: "The People of the Interior"
 cc_byz_reconquest.1.desc: "The coast was the easy part. The cities are Roman, have always been Roman, and were waiting to be liberated by somebody.\n\nThe interior is a different question. Slavs and Vlachs have farmed and pastured it for seven hundred years, they were not consulted about the reconquest, and they will still be there when the current arrangement has been replaced by whatever comes next. They pay no tax that reaches the capital and they have no particular objection to paying one, provided somebody explains who to and why.\n\nEvery previous imperial answer to this question is on record. None of them worked for longer than a century."
 cc_byz_reconquest.1.a: "Land for service. Settle them as federates."
 cc_byz_reconquest.1.b: "Move them. It has been done before."
 cc_byz_reconquest.1.c: "The coastal cities keep their liberties. Leave the interior alone."

 # cc_byz_reconquest.10 - Italy
 cc_byz_reconquest.10.title: "The Condition of Italy"
 cc_byz_reconquest.10.desc: "Italy has been recovered and the reports from it are worse than the reports from the campaign.\n\nThe aqueducts serving three cities were cut during the fighting and have not been repaired. The countryside north of Rome was fought over twice in six years and is not being farmed. The population of the city itself is a fraction of what the assessment expected, and the assessment was already pessimistic.\n\nThe empire has recovered Italy. What it has not recovered is anything in Italy worth the recovering, and putting that right is a project measured in reigns."
 cc_byz_reconquest.10.desc_strained: "Italy has been recovered and it did not come in by terms.\n\nThe empire was already fighting on two fronts and paying for both, and there was neither the money nor the time for a campaign of sieges and negotiated surrenders. So the cities were stormed where they resisted, the countryside was foraged bare by an army that had to eat, and the reports now arriving describe a province that has been comprehensively wrecked by the process of being liberated.\n\nThis is precisely what happened the first time. The difference is that Justinian could afford to be surprised by it."
 cc_byz_reconquest.10.a: "Rebuild it at our expense."
 cc_byz_reconquest.10.b: "Tax it. It will pay for the next theatre."
 cc_byz_reconquest.10.c: "Remit its taxes for a generation."

 # cc_byz_reconquest.20 - Africa
 cc_byz_reconquest.20.title: "The African Frontier"
 cc_byz_reconquest.20.desc: "Africa is rich, which is why it was worth taking, and it does not settle, which is why it was lost.\n\nThe coastal cities and the grain country are secure and produce a genuine surplus. Everything inland of them is a frontier, and the frontier does not hold still: the Moorish chiefs raid when the garrisons are weak, take imperial pay when they are strong, and change their assessment of which is the case roughly twice a year.\n\nThe forts work. The forts require garrisons, the garrisons require pay, and the pay has to cross the sea. The dispatches from the frontier commanders are unanimous on all three points and increasingly direct about the third."
 cc_byz_reconquest.20.a: "Pay the garrisons. Man the forts."
 cc_byz_reconquest.20.b: "Let them live off the country."
 cc_byz_reconquest.20.c: "Buy the chiefs. It is cheaper than the forts."

 # cc_byz_reconquest.30 - Spania
 cc_byz_reconquest.30.title: "The Spanish Coast"
 cc_byz_reconquest.30.desc: "Spania is held: a strip of coast, two good harbours, and a hinterland belonging to somebody else that begins immediately behind the walls.\n\nIt was taken cheaply because nobody defended it seriously, and it is defensible only from the sea, by a fleet with nothing better to do, against opponents who can concentrate against it at a week's notice while reinforcement takes three months. The garrison commander has submitted an assessment. It is professionally worded and its conclusion is that the position is untenable in any circumstance where it matters.\n\nIt is also the westernmost point of the empire and a Roman fleet is anchored there for the first time in nine centuries."
 cc_byz_reconquest.30.a: "Reinforce it. It can be held."
 cc_byz_reconquest.30.b: "Trade it for something on this side of the sea."
 cc_byz_reconquest.30.c: "Hold it with the fleet, not a garrison."

 # cc_byz_reconquest.40 - the capstone
 cc_byz_reconquest.40.title: "Mare Nostrum"
 cc_byz_reconquest.40.desc: "A ship leaving Constantinople can put in at Thessalonica, Durres, Syracuse, Carthage, Cartagena and back by way of Naples and Ravenna, and at no point on that voyage will it enter a foreign harbour.\n\nThis was true nine hundred years ago and has not been true since. The clerks who prepared the announcement had to consult the older registers to find the correct formula, and the formula they found was written for an emperor who governed from Ravenna and would not have recognised the empire that has now repeated his achievement.\n\nIt is done. The sea is Roman."
 cc_byz_reconquest.40.desc_traded: "A ship leaving Constantinople can cross the whole sea and put in only at imperial harbours, with one gap that is mentioned in none of the proclamations.\n\nSpania was traded away, for good reasons, at a good price, to a power that has kept its side of the bargain. The formula being read out in the Great Church describes the recovery of the western provinces and does not enumerate them, and the clerk who drafted it that way was thanked privately for his tact.\n\nThe sea is Roman. It is Roman by a margin that would not survive a determined examination, and the examination is not going to be conducted."
 cc_byz_reconquest.40.desc_exhausted: "The sea is Roman, and the empire that made it so is in no condition to enjoy the fact.\n\nThe treasury is committed for a generation. The field armies are veteran, distant, and owed arrears that nobody can presently pay. Whole provinces recovered at enormous cost are administered by men the capital has never met, because the capital has nobody to send. The announcement was read in the Great Church to a congregation that has been taxed for this for forty years.\n\nJustinian's reconquest ended exactly here, at the moment of complete success, with the state that achieved it hollowed out by the achieving. That is not a coincidence and it was not unforeseeable."
 cc_byz_reconquest.40.a: "Have it read in the Great Church."

 # cc_byz_reconquest.50 - strain: the provinces stop paying
 cc_byz_reconquest.50.title: "The Provinces Stop Paying"
 cc_byz_reconquest.50.desc: "The remittances from the western provinces have stopped, and the explanations are all individually reasonable.\n\nAfrica has spent its revenue on its garrisons. Italy has spent its revenue on repairs the capital ordered. The Dalmatian cities have spent theirs on walls, and produced the correspondence in which the capital told them to. In each case the money was spent on something the empire needed and in each case the empire is not going to see it.\n\nThe difficulty is that the capital budgeted for all of it, and the armies that took these provinces are still in them, and still being paid from a treasury that assumed the provinces would pay for themselves by now."
 cc_byz_reconquest.50.desc_ruined: "The remittances from the west have stopped, and the western account can be summarised in one line: Italy.\n\nAfrica pays. Dalmatia pays a little. Italy, which was the largest single item in every projection the treasury made when this began, produces almost nothing, because the province that was supposed to fund the rest of the campaign was wrecked in the course of being taken.\n\nThe clerks have prepared a comparison against the pre-war assessment. It was not requested and it is being circulated anyway, which tells the palace something about the mood in the treasury. Italy is currently costing more in garrisons and repairs than it returns in tax, and on present trends will continue to do so for longer than anyone now serving will be alive."
 cc_byz_reconquest.50.a: "Borrow against next year. Hold everything."
 cc_byz_reconquest.50.b: "Give the far provinces to whoever can hold them."
 cc_byz_reconquest.50.c: "Abandon the least defensible, before they are lost for us."

 # cc_byz_reconquest.51 - strain: the army of the west
 cc_byz_reconquest.51.title: "The Army of the West"
 cc_byz_reconquest.51.desc: "There is now a western army, and nobody decided to create one.\n\nIt was assembled piecemeal over thirty years from expeditionary forces that were never withdrawn, and it has become a permanent institution with its own supply arrangements, its own recruitment from the provinces it garrisons, and its own officers who have served nowhere else. A soldier in it may be the son of a soldier in it. Its senior commanders correspond with each other more than any of them corresponds with the capital.\n\nIt is the most effective army the empire has. It is stationed a thousand miles from the palace, it is owed money, and the men in it think of themselves as the army of the west rather than as the emperor's army. All three of those facts have been true before."
 cc_byz_reconquest.51.a: "Note it, and pay them what we can."

 # cc_byz_reconquest.52 - the general
 cc_byz_reconquest.52.title: "The Victorious General"
 cc_byz_reconquest.52.desc: "The commander in the west has done everything asked of him and rather more, and that is the problem.\n\nHe took the province, he holds it, his men are devoted to him, and his dispatches are models of correct form. He has given the palace no grounds for concern of any kind, which is itself a kind of grounds: a man that competent, that far away, at the head of that army, is a set of circumstances rather than an accusation.\n\nThe empire has been here many times. On most of those occasions the general in question had no intention whatever of becoming emperor, right up until the point where his troops made the decision for him."
 cc_byz_reconquest.52.desc_unpaid: "The commander in the west has not been paid, his men have not been paid, and he has solved the problem himself.\n\nHe is provisioning his army from the province directly, on his own authority, through arrangements with local landowners that the capital was informed of afterwards. It works. The province is quiet, the troops are fed and the frontier is held, and none of it now depends on anything arriving from Constantinople.\n\nThat last clause is the one being read closely in the palace. An army that does not need the capital's money is an army that has stopped needing the capital."
 cc_byz_reconquest.52.a: "Recall him. Honour him publicly."
 cc_byz_reconquest.52.b: "Leave him there. Pay his men from here, directly."
 cc_byz_reconquest.52.c: "Divide the command between three officers."
