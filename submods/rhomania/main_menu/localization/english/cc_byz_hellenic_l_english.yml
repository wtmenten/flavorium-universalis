 cc_byz_faith_location_share_tt: "The imperial faith holds this place"
 cc_byz_faith_country_share_tt: "The imperial faith holds the realm"

 # ---- Modifiers ----
 STATIC_MODIFIER_NAME_cc_byz_old_learning: "The Old Learning"
 STATIC_MODIFIER_DESC_cc_byz_old_learning: "A house, a stipend, and the emperor's name over the door. The men who read there will go into the chanceries, and they will have read Plato first."
 STATIC_MODIFIER_NAME_cc_byz_antiquarian_licence: "The Antiquarians Unleashed"
 STATIC_MODIFIER_DESC_cc_byz_antiquarian_licence: "They have been told to follow the argument wherever it goes. Several of them have taken this literally and the clergy have begun keeping notes."
 STATIC_MODIFIER_NAME_cc_byz_the_apostasy: "The Apostasy"
 STATIC_MODIFIER_DESC_cc_byz_the_apostasy: "There is a word for this in every chancery in Christendom and they are all using it. Nobody forgets, and nobody has to be reminded."
 STATIC_MODIFIER_NAME_cc_byz_edict_of_toleration: "The Edict of Toleration"
 STATIC_MODIFIER_DESC_cc_byz_edict_of_toleration: "Both altars stand and neither is the state's business. The magistrates know what to do again, which was most of the point."
 STATIC_MODIFIER_NAME_cc_byz_temples_restored: "The Sanctuaries Restored"
 STATIC_MODIFIER_DESC_cc_byz_temples_restored: "Imperial money, imperial masons, and the stone brought back out of the walls it had spent six hundred years in. It cost what a war costs and it cannot be taxed."
 STATIC_MODIFIER_NAME_cc_byz_two_altars: "Two Altars"
 STATIC_MODIFIER_DESC_cc_byz_two_altars: "Two calendars, two processions, and a prefect of the city who closes a street twice a year and thinks nothing of it."
 STATIC_MODIFIER_NAME_cc_byz_emperors_own_rite: "The Emperor's Own Rite"
 STATIC_MODIFIER_DESC_cc_byz_emperors_own_rite: "He sacrifices at the Palace shrine and the empire does not. Understood by everyone, stated by nobody, and it will not outlive him."
 STATIC_MODIFIER_NAME_cc_byz_perm_pontifex: "Pontifex Maximus"
 STATIC_MODIFIER_DESC_cc_byz_perm_pontifex: "Chief of the bridge-builders, and nobody has ever explained the name. The rites of the empire are the emperor's to order."

 # ---- Opinion ----
 cc_byz_opinion_apostate: "Abandoned the Faith"
