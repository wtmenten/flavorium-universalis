l_english:
 # The old rites: the Hellenic thread.
 #
 # See in_game/events/cc_byz_hellenic.txt for the arc's shape and why it exists. Briefly: Fate
 # of the Phoenix ships a complete, supported route out of Orthodoxy and the submod had assumed
 # Orthodoxy in 341 places, so converting broke six mission tasks and left the union arc
 # negotiating with Rome on behalf of a church the emperor had left.
 #
 # VOICE. This is a court that has watched something it has no vocabulary for. Nobody in these
 # texts calls it paganism and nobody calls it a reformation; they call it what happened, and
 # they are careful. The mechanics live in the option tooltips and the modifier descriptions,
 # not in the event bodies.
 #
 # HISTORICAL FOOTING. Gemistos Plethon really did teach at Mistra in this period, really did
 # write a code of law invoking the Olympian gods, and his book really was burned by Patriarch
 # Gennadios after his death. Julian is the other precedent and every Byzantine reader knew his
 # name. Neither is quoted directly, because attributing an invented line to a real man is the
 # one thing this file will not do.

 # ---- .1  The Academy reopened ----
 cc_byz_hellenic.1.title: "The Old Learning"
 cc_byz_hellenic.1.desc: "There is a man at Mistra who teaches Plato to anyone who will make the journey, and a surprising number make it. He is careful. He speaks of the ancients as ancients and of the Church as the Church, and in thirty years nobody has been able to write down a sentence of his that could be brought before a synod.\n\nHis students are less careful, and some of them are now in the palace.\n\nWhat is asked is small: a house, a stipend, and the emperor's name over the door. What is being asked underneath it is whether the empire regards a thousand years of its own inheritance as an inheritance or as a temptation it survived."
 cc_byz_hellenic.1.a: "Philosophy is ours. Theology is the Church's."
 cc_byz_hellenic.1.b: "Let them follow the argument where it goes."
 cc_byz_hellenic.1.c: "We have libraries enough. Close it."

 # ---- .10  The rupture ----
 cc_byz_hellenic.10.title: "The Emperor's Religion"
 cc_byz_hellenic.10.desc: "It was not done in a day and it is being spoken of as though it were.\n\nThe household knew first, then the guard, then the men who keep the chapels, and by the time the Patriarch was told there was nothing left to tell him. He did not shout. He asked, twice, whether he had understood correctly, and then he went to write to people.\n\nOutside, the city has not yet decided what it thinks. That is the only mercy in this and it will not last the season."
 cc_byz_hellenic.10.desc_after_union: "Twice in one reign.\n\nThe first time, the emperor stood in the Great Church and had the union with Rome read aloud, and the city called him a Latin and worse. Whatever they called him then, they were at least arguing about which church he belonged to.\n\nNo one is confused now. The men who fought the union and the men who signed it have discovered they agree about something, which nothing else in two hundred years managed. They agree about him."
 cc_byz_hellenic.10.desc_returned: "The chapels are open. The lamps are lit. The Patriarch, who by every account expected to die in exile and had made arrangements accordingly, received the news standing and said nothing at all for some time.\n\nWhat was done is not undone. There are men in the provinces who took the emperor at his word and built their lives on it, and they have now been told the word has changed. The empire will be some years finding out how many of them there are."
 cc_byz_hellenic.10.a: "It is done. Let them say what they will."

 # ---- .20  The edict ----
 cc_byz_hellenic.20.title: "What the Law Now Says"
 cc_byz_hellenic.20.desc: "The question is not what the emperor believes. Everyone has that settled to their own satisfaction and no proclamation will improve it.\n\nThe question is what the law says about everybody else, and the law is currently silent in a way that is becoming expensive. Magistrates are writing to ask which oaths bind. Two governors have suspended trials rather than guess. A tax farmer in Bithynia has declined to pay on the grounds that he no longer knows to whom.\n\nSomething has to be written down, and whatever is written down will be read for a century as what the emperor meant."
 cc_byz_hellenic.20.a: "Both altars stand. Neither is the state's business."
 cc_byz_hellenic.20.b: "The endowments follow the emperor's rite."
 cc_byz_hellenic.20.c: "The Patriarchate has become a rival court. End it."

 # ---- .21  The temples ----
 cc_byz_hellenic.21.title: "The Sanctuaries"
 cc_byz_hellenic.21.desc: "Surveyors have come back from Delphi, Olympia and Eleusis, and their reports agree on the essentials.\n\nThe stone is mostly there. It is in the walls of the villages, in the churches, in a bridge outside Megara that has been carrying carts for six hundred years. The oracle at Delphi is a farmyard and the farmer has been polite about the surveyors but has questions about compensation. At Olympia the river moved and buried most of it, which is the only reason most of it survives.\n\nNone of this is beyond the empire. All of it costs what a war costs and produces nothing that can be taxed."
 cc_byz_hellenic.21.desc_suppressed: "Surveyors have come back from Delphi, Olympia and Eleusis, and the reports are as expected: the stone is in the walls of the villages and the churches, and getting it out means taking those apart.\n\nThat is now a smaller difficulty than it was. Since the Patriarchate was dealt with, the men who would have objected have been finding reasons not to, and several bishops have written offering materials before anyone asked them for materials.\n\nThe surveyors note this in the margin without comment. They have been careful to write nothing that could be read either way."
 cc_byz_hellenic.21.a: "Rebuild them properly. The treasury will find it."
 cc_byz_hellenic.21.b: "The cities may honour their own gods at their own cost."
 cc_byz_hellenic.21.c: "The rites do not require the buildings."

 # ---- .22  The reaction ----
 cc_byz_hellenic.22.title: "The City Answers"
 cc_byz_hellenic.22.desc: "It did not begin as a riot. It began as a procession, which is a thing this city has always been permitted, and the route was the customary one until it was not.\n\nThey are not asking for the emperor's abdication. Some of them are, and those are the ones the guard can deal with. The rest are asking a harder question and asking it in a form nobody can arrest: they are simply going to church in numbers nobody has seen in living memory, on days that are not feast days, in quarters that had stopped bothering.\n\nA city cannot be compelled to stop attending church. The emperor has read enough history to know how the last man who tried it is remembered."
 cc_byz_hellenic.22.desc_funded: "The money did it.\n\nWhile the sanctuaries were a proclamation the city could tell itself the emperor was indulging a taste, as emperors do. Then the carts started going west with imperial silver in them, and the accounts were read aloud in the Hippodrome by someone who had obtained them, and the argument stopped being about the emperor's soul and started being about the grain dole.\n\nThey have worked out what the temples cost. They have worked out what else it would have bought. Somebody has been very careful to make sure they worked out both."
 cc_byz_hellenic.22.desc_furious: "There are quarters of this city the guard now enters in company or not at all.\n\nA deacon was killed at the Chalke gate, by whom is disputed and will remain disputed, and he has been buried three times in three different accounts of what happened. The version that is spreading has him blessing the crowd as he fell. Nobody who was there says this. It has stopped mattering what anybody who was there says.\n\nThe Patriarch, or the man the crowds are calling Patriarch, has not been seen for eleven days and is variously in Trebizond, in a cistern, and at the emperor's right hand having sold everyone."
 cc_byz_hellenic.22.a: "Let them keep their churches. They will keep the peace."
 cc_byz_hellenic.22.b: "Break it. Now, and completely."
 cc_byz_hellenic.22.c: "Enough. The rites are the emperor's own, and no one else's."

 # ---- .23  What was settled ----
 cc_byz_hellenic.23.title: "The Settlement"
 cc_byz_hellenic.23.desc_tolerated: "A generation on, and the thing nobody predicted is how ordinary it became.\n\nThere are two calendars in the capital and everyone keeps whichever they were raised in. The temples have congregations, smaller than the churches and better funded. Twice a year the processions cross and the prefect of the city closes a street, and this is now simply a thing the prefect of the city does.\n\nThe empire spent eleven hundred years believing this arrangement was impossible. It has turned out to be merely inconvenient."
 cc_byz_hellenic.23.desc_suppressed: "It is quiet, and quiet is what was wanted.\n\nThe Patriarchate is an office in the emperor's gift held by a man who understands the terms. The great monasteries have been endowed into obedience or emptied into obedience. In the villages the priests say what they have always said, and the emperor's men have concluded that pursuing the villages costs more than the villages are worth.\n\nWhat was won is real and the cost is not recorded anywhere in one place. It is in the tax rolls, in the recruiting returns, and in a generation of able men who went into the Church because the alternative was the emperor's service."
 cc_byz_hellenic.23.desc_private: "The emperor sacrifices at the Palace shrine, and the empire does not.\n\nThis is where these things have generally ended. The court is careful, the Church is grateful in a way that has an edge to it, and the arrangement is understood by everyone and stated by nobody. Ambassadors are briefed on which chapel to attend.\n\nHis successor will not continue it. Everyone knows that too, including him, and it has not changed his mind about a thing."
 cc_byz_hellenic.23.a: "Let it stand."

 # ---- .30  The ferment ----
 cc_byz_hellenic.30.title: "Preaching in the Quarters"
 cc_byz_hellenic.30.desc: "A monk nobody had heard of a month ago is drawing crowds at the Forum of the Ox, and what he is saying is not seditious, exactly. He is preaching on the reign of Julian. He gives the dates, the campaigns, the letters, and the death in Persia at thirty-one with no heir, and he does not once mention the present emperor.\n\nHe does not have to. The crowd is doing that for him, on the way home, in the wine shops, all the way down to the harbour."
 cc_byz_hellenic.30.a: "Send the guard to the Forum."
 cc_byz_hellenic.30.b: "Find out what the quarter wants and pay it."
 cc_byz_hellenic.30.c: "Let the Patriarch answer him. He is better at this than we are."

 # ---- Mission tasks ----
 cc_byz_task_academy: "The Academy Reopened"
 cc_byz_task_academy_desc: "Justinian closed the schools at Athens in 529 and the philosophers went to Persia, where the king received them kindly and they were disappointed in him.\n\nThe books did not go with them. They have been in this city the whole time, copied by monks who disagreed with every line and copied them accurately anyway, which is the strangest kindness in the empire's history."
 cc_byz_task_old_rites: "The Old Rites"
 cc_byz_task_old_rites_desc: "There were sacrifices in the Mani peninsula in the ninth century, four hundred years after the empire had finished being pagan, and the men who reported it were not certain whether to be scandalised or to leave it alone.\n\nThey left it alone. It is remarkable how much of this the empire has always simply left alone."
 cc_byz_task_temples: "The Sanctuaries Restored"
 cc_byz_task_temples_desc: "Delphi, Eleusis, Olympia.\n\nPausanias walked to all three and wrote down what he saw, and he was already writing about a world that was closing: temples with no priests, festivals kept by three old men, an oracle that answered questions nobody was asking any more. He is the reason it is possible to rebuild them. He wrote it all down because he could see it going."
 cc_byz_task_pontifex: "Pontifex Maximus"
 cc_byz_task_pontifex_desc: "The title was the emperor's for four hundred years and no Christian emperor gave it up in a hurry. Gratian was the first to refuse it, in 382, and the Senate took it badly enough to be still complaining a decade later.\n\nIt means chief of the bridge-builders. Nobody has ever been able to explain that satisfactorily, including the Romans."

 # ---- Trigger tooltips ----
 cc_byz_academy_tt: "Hold Athens or Constantinople"
 cc_byz_old_rites_tt: "The old rites are established in law"
 cc_byz_temples_tt: "Hold Delphi, Eleusis and Olympia"
 cc_byz_pontifex_tt: "The religious settlement is concluded"
