l_english:
 # Subject type
 cc_byz_exarchate: "Exarchate"
 cc_byz_exarchate_desc: "A western province governed by an appointed exarch who holds both the civil and the military command, answerable to the emperor and to no one local. The arrangement is how Ravenna was held for two centuries. It works precisely as long as the exarch's interests and the palace's remain the same."

 # Capability modifier
 MODIFIER_TYPE_NAME_cc_byz_can_appoint_exarch: "May Appoint an Exarch"
 MODIFIER_TYPE_DESC_cc_byz_can_appoint_exarch: "This allows a western province to be placed under an appointed exarch while the capital remains at [ShowLocationName('constantinople')]."

 # Renovatio advances
 cc_byz_renovatio_imperii: "Renovatio Imperii"
 cc_byz_renovatio_imperii_desc: "The west is not recovered by moving the throne to Rome. It is recovered by governing Rome from the city that never fell. An exarch is sent, given the civil and military command together, and left to hold the peninsula on the emperor's behalf."
 cc_byz_exarchal_chancery: "The Exarchal Chancery"
 cc_byz_exarchal_chancery_desc: "A standing office in the palace whose only business is the western command: its correspondence, its accounts, its appointments, and the six weeks a message takes each way. Distance cannot be removed. It can be administered."

 cc_byz_capital_is_constantinople_tt: "Our capital is [ShowLocationName('constantinople')]"

 # Exarch government reforms
 cc_byz_exarch_caretaker_reform: "Caretaker Exarch"
 cc_byz_exarch_caretaker_reform_desc: "A palace official with no western connections and no ambitions the emperor need worry about. He will follow his instructions exactly, including the ones that no longer fit the situation, and he will not build a following."
 cc_byz_exarch_effective_reform: "Effective Exarch"
 cc_byz_exarch_effective_reform_desc: "A capable administrator given the discretion to govern rather than merely to report. The province will pay for itself within a decade. So will the network of local men who owe him their positions."
 cc_byz_exarch_strategos_reform: "Exarch and Strategos"
 cc_byz_exarch_strategos_reform_desc: "A general sent west with the troops and the authority to use them, which is what the exarchs of Ravenna actually were. He can hold Italy. Whether he holds it for the emperor is a separate question, answered later."

 # Character interaction.
 # Key set mirrors vanilla assign_governor (character_interactions_l_english.yml:261-270),
 # which needs _concept, _act, _desc_specific, _past and _act_past alongside the base keys.
 cc_byz_appoint_exarch: "Appoint an Exarch"
 cc_byz_appoint_exarch_concept: "[character|e]"
 cc_byz_appoint_exarch_act: "$cc_byz_appoint_exarch$"
 cc_byz_appoint_exarch_desc: "Place a western [area|e] under an appointed exarch holding the civil and military command together. Our capital remains at [ShowLocationName('constantinople')]."
 cc_byz_appoint_exarch_desc_specific: "Place a western [area|e] under [SCOPE.sCharacter('recipient').GetName], holding the civil and military command together on our behalf."
 cc_byz_appoint_exarch_past: "[SCOPE.sCharacter('recipient').GetName] is appointed Exarch over [target_area.GetName]"
 cc_byz_appoint_exarch_act_past: "By decree of the [SCOPE.sCountry('actor').GetGovernment.GetRulerTitle], [SCOPE.sCharacter('recipient').GetName] has been appointed Exarch over [target_area.GetName], as a [target_reform.GetName]"
 cc_byz_choose_exarch: "Choose the [character|e] to send west:"
 cc_byz_select_exarch_type: "Select the terms of appointment"
 cc_byz_select_exarch_type_none: "@trigger_no! There are no terms of appointment available."
 cc_byz_select_exarchate_area: "Select the [area|e] to place under an exarch"
 cc_byz_select_exarchate_area_none: "@trigger_no! We hold no western [area|e] large enough to place under an exarch."
 cc_byz_appoint_exarch_effect_tt: "The [area|e] becomes an Exarchate under [SCOPE.sCharacter('recipient').GetName] as a [target_reform.GetName], seated on its most developed [location|e]. Our capital is unchanged. Establishing the western command revives our claim to the old borders."
