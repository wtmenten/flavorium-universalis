l_english:
 # Stepping-stone mission tasks.
 #
 # These 25 tasks are mission-mode only: mission packs default to OFF, and the stepping
 # stones deliberately have no generic-action twin. Only the nine cornerstones do.
 #
 # DESCRIPTION STYLE, and it is the opposite of what this file used to do.
 #
 # Descriptions carry NO mechanical condition. The engine renders the enabled trigger above
 # them, which is what the custom_tooltip wrappers in this pack exist for, so a description that
 # restates the requirement is spending the only line of flavour the task gets on information
 # already on screen. Vanilla's own mission descriptions never state a condition either
 # (missions/generic_missions_l_english.yml: "The expansion of our realm at the expense of
 # weaker neighbors is merely the natural law").
 #
 # Register is mixed by tier: court voice in the first person plural for the stepping stones,
 # an attributed quotation on the capstones WHERE ONE IS GENUINELY KNOWN, and a third-person
 # historical note where neither fits.
 #
 # QUOTATIONS ARE REAL OR THEY ARE NOT ATTRIBUTED. Where the attribution is traditional rather
 # than contemporary, the text says so: Justinian's line at the dedication of Hagia Sophia comes
 # from an account written centuries later, and is marked as tradition rather than credited to
 # anyone. In-world lines carry no attribution at all.
 #
 # The exceptions are the tasks whose requirement cannot be guessed from the name: the two
 # subset reconvergences, the bureau funding average, and the five exclusive forks. Those close
 # on one short sentence naming what is actually being asked.

 # A. The House in Order
 cc_byz_task_walls: "The Walls Stand"
 cc_byz_task_walls_desc: "Fifty-six towers on the outer wall, ninety-six on the inner, and a moat that has been dry since anyone can remember. They have failed once in a thousand years and that once was to Latins who came by sea.\n\nThe masonry is Theodosian. The repairs are everyone's."
 cc_byz_task_hippodrome: "Bread and Circuses"
 cc_byz_task_hippodrome_desc: "Blues on one side, Greens on the other, and an emperor in the kathisma who has learned to listen. It is not a racecourse. It is the only building in the empire where the people can say a thing to his face and not be arrested for it, and every emperor who forgot that found out in the same week."
 cc_byz_task_council: "A Full Council"
 cc_byz_task_council_desc: "One man cannot read every dispatch, and an emperor who tries will read none of them properly. We need men at the table who know a province each, and we need them to disagree with us out loud."
 cc_byz_task_bureaus: "The Bureaus Funded"
 cc_byz_task_bureaus_desc: "Every empire that has lasted was in the end a room full of clerks. Ours are unpaid, which is a thing we have decided to stop noticing.\n\nThey must be funded, and funded steadily. A generous month before an inspection is not an administration."
 cc_byz_task_arsenal: "The Arsenal"
 cc_byz_task_arsenal_desc: "The straits are the reason this city has survived, and the straits are worth nothing without hulls in the water. We have been renting Italian ships for fifty years and paying more than a fleet would have cost."

 # B. The Greek Claimants
 cc_byz_task_no_second_emperor: "No Second Emperor"
 cc_byz_task_no_second_emperor_desc: "Trebizond styles its ruler Emperor and Autocrat of the Romans, which is our title, and has done since the city fell to the Latins and everyone with a claim went somewhere else with it. The Grand Komnenoi are cousins. That has never made the arithmetic any better."
 cc_byz_task_duchy_dissolved: "The Duchy Dissolved"
 cc_byz_task_duchy_dissolved_desc: "A Burgundian family holds the Acropolis and calls itself the Duchy of Athens. The Parthenon has been a cathedral under them for a century, which is at least a use, and the arrangement dates from the sack of this city in 1204."
 cc_byz_task_despotate: "The Despotate"
 cc_byz_task_despotate_desc: "Mistra, in the hills above Sparta, is the one province of this empire that is growing. Scholars go there now instead of coming here. That should be a comfort and is not."
 cc_byz_task_greek_again: "Greek Again"
 cc_byz_task_greek_again_desc: "Athens has been governed by Latins long enough that a generation has grown up under their rite and does not remember another. Taking the city back is a season's work. The rest is not."

 # C. Anatolia
 cc_byz_task_beylik_ended: "The Beylik Ended"
 cc_byz_task_beylik_ended_desc: "A frontier emirate at Sogut, two days' ride from the sea, ruled by a family nobody in this city could have named forty years ago. They have taken Bursa. They have taken Nicaea. They have crossed to Gallipoli.\n\nThey can still be ended."
 cc_byz_task_themes: "The Themes Reformed"
 cc_byz_task_themes_desc: "Soldiers settled on land they hold in exchange for holding the line, mustering under a strategos who is also their governor. It worked for three hundred years, and then the magnates bought the land and the line went with it."
 cc_byz_task_pronoia_host: "The Pronoia Host"
 cc_byz_task_pronoia_host_desc: "Grant a man the revenue of a district and he brings soldiers when called. It costs the treasury nothing, which is why it is irresistible, and it costs the treasury the district, which is why it should be resisted.\n\nTaking this closes the road of the tagmata."

 # D. The Levant
 cc_byz_task_antioch: "Antioch Restored"
 cc_byz_task_antioch_desc: "One of the five patriarchal sees, the city where the followers of Christ were first called Christians, and imperial territory within living memory of the First Crusade. The patriarch of Antioch has lived in Constantinople for two hundred years because there has been nowhere else for him to live."
 cc_byz_task_holy_city: "The Holy City"
 cc_byz_task_holy_city_desc: "The Sepulchre, the rock, and every road in Christendom running toward them. The empire has paid for the lamps in that church through three changes of master and has never once been asked to stop."
 cc_byz_task_patriarch: "The Patriarch Returns"
 cc_byz_task_patriarch_desc: "The patriarchate survived eight centuries of Muslim rule by being extremely careful. It will take more than a change of garrison to make it stop."
 cc_byz_task_egypt: "Egypt and the Delta"
 cc_byz_task_egypt_desc: "Egypt fed this city for three hundred years and has fed somebody else for seven hundred. The grain fleet's berths at the harbour are still called by their old names and are used for something else."
 cc_byz_task_lighthouse: "The Lighthouse"
 cc_byz_task_lighthouse_desc: "It stood for sixteen hundred years and the earthquakes have had most of it. What survives is a stump on a mole in a working harbour, which is a more useful thing than a wonder and a less impressive one."
 cc_byz_task_sinai_road: "The Sinai Road"
 cc_byz_task_sinai_road_desc: "The isthmus between two seas, and the only land any of the spice touches between the Indies and Alexandria. Whoever holds it taxes everything that passes and needs no fleet to do it."

 # E. The Western Crossing
 cc_byz_task_adriatic: "The Adriatic Crossing"
 cc_byz_task_adriatic_desc: "Dyrrhachium is where the road to Italy begins and where every invasion of the Balkans from the west has landed. The Via Egnatia runs from its gate to ours."
 cc_byz_task_exarch_seated: "The Exarch Seated"
 cc_byz_task_exarch_seated_desc: "A governor at Ravenna with the troops, the courts and the revenue of Italy in his hands, appointed by an emperor six weeks' sailing away.\n\nThe office worked for two hundred years. It is worth knowing how it ended."
 cc_byz_task_carthage: "Carthage Recovered"
 cc_byz_task_carthage_desc: "Belisarius took Africa from the Vandals in a single season with fifteen thousand men, which remains the most successful thing this empire has ever done and set an expectation nobody has met since."
 cc_byz_task_pillars: "The Pillars"
 cc_byz_task_pillars_desc: "The Pillars of Hercules, and the end of the world as the ancients had it. The empire held the far side of them for seventy years and could never quite explain to itself why."

 # F. The Merchant Empire
 cc_byz_task_galata: "The Galata Customs"
 cc_byz_task_galata_desc: "The Genoese quarter across the Horn pays us a fraction of what it takes and takes seven times what our own customs house does. The figures were laid before the emperor in 1348 and the war that followed was lost at sea."
 cc_byz_task_merchant_fleet: "A Merchant Fleet"
 cc_byz_task_merchant_fleet_desc: "Not a fleet the empire owns. A fleet that sails under its flag, pays its dues here, and would rather be protected by us than by anyone else.\n\nThe registers name every Latin holding in the Aegean that does neither."
 cc_byz_task_spice_dues: "The Spice Dues"
 cc_byz_task_spice_dues_desc: "At this level the customs house is worth more than several provinces and costs nothing to garrison. Everyone in Italy has done the same arithmetic."

 # Stepping-stone reward modifiers
 STATIC_MODIFIER_NAME_cc_byz_reward_fortifications: "Walls in Good Repair"
 STATIC_MODIFIER_DESC_cc_byz_reward_fortifications: "The masonry is sound, the cisterns are full and the garrison has been paid. None of it is permanent."
 STATIC_MODIFIER_NAME_cc_byz_reward_naval: "A Season of Shipbuilding"
 STATIC_MODIFIER_DESC_cc_byz_reward_naval: "Timber, rope and men who know what to do with both."
 STATIC_MODIFIER_NAME_cc_byz_reward_trade: "The Customs Are Working"
 STATIC_MODIFIER_DESC_cc_byz_reward_trade: "Dues collected where they should be, by men who remit them."
 STATIC_MODIFIER_NAME_cc_byz_reward_administration: "The Offices Are Staffed"
 STATIC_MODIFIER_DESC_cc_byz_reward_administration: "The assessment is current, the clerks are paid, and somebody knows where the registers are."
 STATIC_MODIFIER_NAME_cc_byz_reward_manpower: "Recruits from the Themes"
 STATIC_MODIFIER_DESC_cc_byz_reward_manpower: "Men from a province that has decided it is ours, which is not the same as a province we hold."
 STATIC_MODIFIER_NAME_cc_byz_reward_confidence: "The City Believes"
 STATIC_MODIFIER_DESC_cc_byz_reward_confidence: "A public success, and a capital prepared to give the throne the benefit of the doubt for a while."
