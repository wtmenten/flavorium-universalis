l_english:
 # Stepping-stone mission tasks.
 #
 # These 25 tasks are mission-mode only: mission packs default to OFF, and the stepping
 # stones deliberately have no generic-action twin. Only the nine cornerstones do.
 #
 # Descriptions state the condition plainly, because a mission task the player cannot work
 # out how to complete is not content. Flavour goes in the second sentence, never the first.

 # A. The House in Order
 cc_byz_task_walls: "The Walls Stand"
 cc_byz_task_walls_desc: "Maintain the Theodosian Walls at Constantinople. They have failed exactly once in nine hundred years, and the city has never stopped paying for the repair."
 cc_byz_task_hippodrome: "Bread and Circuses"
 cc_byz_task_hippodrome_desc: "Maintain the Hippodrome. It is where the people of this city tell their emperor what they think of him, which is worth knowing before it is shouted."
 cc_byz_task_council: "A Full Council"
 cc_byz_task_council_desc: "Seat five members in the cabinet. An emperor who governs alone is an emperor whose successor inherits nothing but a chair."
 cc_byz_task_bureaus: "The Bureaus Funded"
 cc_byz_task_bureaus_desc: "Run four bureaucracies at full maintenance. Unglamorous, expensive, and the difference between an empire and a court."
 cc_byz_task_arsenal: "The Arsenal"
 cc_byz_task_arsenal_desc: "Maintain a shipyard at Constantinople. The straits are the only reason this city has survived, and they are worth nothing without hulls in the water."

 # B. The Greek Claimants
 cc_byz_task_no_second_emperor: "No Second Emperor"
 cc_byz_task_no_second_emperor_desc: "End the Empire of Trebizond. Their claim is genuine, their descent is imperial, and there cannot be two."
 cc_byz_task_duchy_dissolved: "The Duchy Dissolved"
 cc_byz_task_duchy_dissolved_desc: "End the Duchy of Athens. A Latin adventurer's holding on Greek ground, governed in French, three days' sail from the capital."
 cc_byz_task_despotate: "The Despotate"
 cc_byz_task_despotate_desc: "Hold Achaea and Arcadia entire. The Morea is the last part of the empire that still feeds itself and still sends soldiers."
 cc_byz_task_greek_again: "Greek Again"
 cc_byz_task_greek_again_desc: "Hold Attica entire and bring Athens to an Orthodox majority. The city has been governed by Latins long enough that a generation has grown up under their rite."

 # C. Anatolia
 cc_byz_task_beylik_ended: "The Beylik Ended"
 cc_byz_task_beylik_ended_desc: "End the Ottoman state. Every other question the empire faces is a question about time, and this is the one that decides how much of it there is."
 cc_byz_task_themes: "The Themes Reformed"
 cc_byz_task_themes_desc: "Hold twenty-five locations in Anatolia. The thematic system was how this empire fed and raised its armies, and it needs Asia Minor to exist at all."
 cc_byz_task_pronoia_host: "The Pronoia Host"
 cc_byz_task_pronoia_host_desc: "Maintain three pronoia grants. Land held in exchange for soldiers: cheaper than paying them, and the bill arrives in a later reign."

 # D. The Levant
 cc_byz_task_antioch: "Antioch Restored"
 cc_byz_task_antioch_desc: "Hold Antioch, or secure its patriarchal seat. One of the five ancient sees, lost to the Arabs before the schism was even a quarrel."
 cc_byz_task_holy_city: "The Holy City"
 cc_byz_task_holy_city_desc: "Hold Jerusalem, or secure its patriarchal seat. No Roman emperor has governed it since Heraclius, and he did not govern it long."
 cc_byz_task_patriarch: "The Patriarch Returns"
 cc_byz_task_patriarch_desc: "Bring Jerusalem to an Orthodox majority. The patriarchate survived eight centuries of Muslim rule by being careful; it will need time to stop being careful."
 cc_byz_task_egypt: "Egypt and the Delta"
 cc_byz_task_egypt_desc: "Hold Alexandria and Cairo, or secure the Alexandrian seat. The granary of the old empire, and the richest customs house between here and India."
 cc_byz_task_lighthouse: "The Lighthouse"
 cc_byz_task_lighthouse_desc: "Maintain the Lighthouse of Alexandria. It guided ships into that harbour for a thousand years and the harbour has never been the same without it."
 cc_byz_task_sinai_road: "The Sinai Road"
 cc_byz_task_sinai_road_desc: "Hold the Sinai. Egypt without it is a terminus. Egypt with it is a corridor, and the far end of that corridor is India."

 # E. The Western Crossing
 cc_byz_task_adriatic: "The Adriatic Crossing"
 cc_byz_task_adriatic_desc: "Hold Durres and Split. The old road west began at Durres, and no army has reached Italy from here without it."
 cc_byz_task_exarch_seated: "The Exarch Seated"
 cc_byz_task_exarch_seated_desc: "Appoint an exarch to govern in Italy. Cities taken by an army are held. Cities governed by an appointed official are recovered."
 cc_byz_task_carthage: "Carthage Recovered"
 cc_byz_task_carthage_desc: "Hold Tunis entire. Africa fed Rome for four centuries and paid for the reconquest that lost it."
 cc_byz_task_pillars: "The Pillars"
 cc_byz_task_pillars_desc: "Hold Murcia or Almeria entire. The far end of the sea, where Justinian's Spania was and where it did not stay."

 # F. The Merchant Empire
 cc_byz_task_galata: "The Galata Customs"
 cc_byz_task_galata_desc: "Hold Galata. The quarter across the water has collected more of this city's customs than this city has, and it is time that stopped."
 cc_byz_task_merchant_fleet: "A Merchant Fleet"
 cc_byz_task_merchant_fleet_desc: "Reach fifteen ducats of monthly trade income. Not a fleet the empire owns, but one that sails under its flag and pays its dues here."
 cc_byz_task_spice_dues: "The Spice Dues"
 cc_byz_task_spice_dues_desc: "Reach thirty ducats of monthly trade income. At this point the customs are worth more than several provinces, and everybody in Italy has noticed."

 # Stepping-stone reward modifiers
 STATIC_MODIFIER_NAME_cc_byz_reward_fortifications: "Walls in Good Repair"
 STATIC_MODIFIER_DESC_cc_byz_reward_fortifications: "The masonry is sound, the cisterns are full and the garrison has been paid. None of it is permanent."
 STATIC_MODIFIER_NAME_cc_byz_reward_naval: "A Season of Shipbuilding"
 STATIC_MODIFIER_DESC_cc_byz_reward_naval: "Timber, rope and men who know what to do with both."
 STATIC_MODIFIER_NAME_cc_byz_reward_trade: "The Customs Are Working"
 STATIC_MODIFIER_DESC_cc_byz_reward_trade: "Dues collected where they should be, by men who remit them."
 STATIC_MODIFIER_NAME_cc_byz_reward_administration: "The Offices Are Staffed"
 STATIC_MODIFIER_DESC_cc_byz_reward_administration: "The assessment is current, the clerks are paid, and somebody knows where the registers are."
 STATIC_MODIFIER_NAME_cc_byz_reward_manpower: "Recruits from the Themes"
 STATIC_MODIFIER_DESC_cc_byz_reward_manpower: "Men from a province that has decided it is ours, which is not the same as a province we hold."
 STATIC_MODIFIER_NAME_cc_byz_reward_confidence: "The City Believes"
 STATIC_MODIFIER_DESC_cc_byz_reward_confidence: "A public success, and a capital prepared to give the throne the benefit of the doubt for a while."
