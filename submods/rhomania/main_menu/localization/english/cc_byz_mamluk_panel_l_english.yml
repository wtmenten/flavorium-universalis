l_english:
 # The Levantine Confrontation: situation panel, map legend, actions and payload modifiers.
 #
 # A SEPARATE FILE FROM cc_byz_mamluk_l_english.yml, deliberately. That file is the event
 # thread's text and is stable; everything here arrived with the panel and the action set, which
 # are the parts most likely to be revised again after the next playtest.
 #
 #
 # VOICE. The card bodies are the court speaking, not the manual. Every number, threshold and
 # mechanical consequence lives in a _INFO key behind the card's info icon instead. The first
 # version of this file put the arithmetic in the body and read like a briefing paper, which is
 # the recurring failure the whole submod was audited for: describing the system to the player
 # rather than describing the world to the emperor.
 #
 # The _TT keys on individual bars and flags stay factual, because those ARE the tooltip layer.

 # ---- Panel header ----
 CC_BYZ_MAM_HDR_EMPIRE: "Empire"
 CC_BYZ_MAM_HDR_CAIRO: "Cairo"
 CC_BYZ_MAM_PHASE_COLD: "The Cold Frontier"
 CC_BYZ_MAM_PHASE_COLD_TT: "No one has declared anything. Envoys go down and come back, pilgrims are counted and taxed, the border emirs take money from both sides and see no contradiction in it, and the holy places are argued over in letters that take a season to arrive.\n\nWars have been avoided this way for a hundred years at a time."
 CC_BYZ_MAM_PHASE_WAR: "The Pentarchy War"
 CC_BYZ_MAM_PHASE_WAR_TT: "The letters have stopped. What is being decided now will be decided by whoever is standing in the holy places when it is over."

 # ---- Card: the two positions ----
 CC_BYZ_MAM_CARD_STANDING: "Standing in the Levant"
 CC_BYZ_MAM_CARD_STANDING_DESC: "Two courts, one frontier, and no agreement anywhere along it about who owns what.\n\nNeither side is losing what the other gains. The frontier is eight hundred miles long and what happens at Aleppo has never told anybody anything about what is happening at Siwa."
 CC_BYZ_MAM_CARD_STANDING_INFO: "Two independent counters, each running 0 to 100.\n\n#T The Empire's Position#! rises with custody won, border emirs retained, the eastern patriarchs protected, and terms taken while Cairo is distracted.\n\n#T Cairo's Position#! rises when the frontier is abandoned, the eastern hierarchies are left to make their own arrangements, or the sultan is given time to settle his emirs.\n\nWhichever reaches 100 ends the confrontation in that court's favour. It also ends if either country ceases to exist, or on reaching 1650."
 CC_BYZ_MAM_BAR_EMPIRE: "The Empire's Position"
 CC_BYZ_MAM_BAR_EMPIRE_TT: "Rises with custody won, emirs retained, patriarchs protected, and terms taken while Cairo is distracted. At 100 the confrontation ends in the empire's favour."
 CC_BYZ_MAM_BAR_CAIRO: "Cairo's Position"
 CC_BYZ_MAM_BAR_CAIRO_TT: "Rises when the frontier is abandoned, the eastern hierarchies are left to their own arrangements, or the sultan is given time to settle his emirs. At 100 the confrontation ends in Cairo's favour."
 CC_BYZ_MAM_BAR_FOOTER: "Whichever reaches 100 ends the confrontation. It also ends if either court ceases to exist, or by 1650."

 # ---- Card: pressure and standing arrangements ----
 CC_BYZ_MAM_CARD_PRESSURE: "Levantine Pressure"
 CC_BYZ_MAM_CARD_PRESSURE_DESC: "How hard the empire is leaning, and Cairo can feel it from Damascus.\n\nAn emperor who has spent thirty years fortifying the border has made an argument, and he will find the sultan has stopped answering letters about custody. There is a kind of patience that buys more than any garrison, and it looks exactly like weakness from the inside."
 CC_BYZ_MAM_CARD_PRESSURE_INFO: "Runs from -5 to 5.\n\nHigh pressure opens the military branches of the thread and closes the diplomatic ones. #T Negotiating custody of the holy places requires pressure at or below 0.#!\n\nRaised by fortifying the frontier, pressing the patriarchal claim, and asserting custody by right. Lowered by embassies, paying the customary dues, and taking terms.\n\nThe flags below record settlements already reached. They are read by later events in the thread and by the mission tree."
 CC_BYZ_MAM_FLAG_CONDOMINIUM: "Custody is shared by written agreement"
 CC_BYZ_MAM_FLAG_CONDOMINIUM_TT: "Both courts have signed. The holy places are administered jointly, pilgrims travel under a stated tariff, and neither side has conceded the underlying claim.\n\nSeveral emperors thought this the best available outcome. It is a real ending and not a consolation."
 CC_BYZ_MAM_FLAG_PATRIARCHS_BACKED: "The eastern hierarchs are under imperial protection"
 CC_BYZ_MAM_FLAG_PATRIARCHS_BACKED_TT: "They answer to Constantinople and it is known in Cairo that they do. Worth a great deal in the argument over custody, and it makes any reprisal against them the empire's business."
 CC_BYZ_MAM_FLAG_PATRIARCHS_SOLD: "The eastern hierarchs were left to themselves"
 CC_BYZ_MAM_FLAG_PATRIARCHS_SOLD_TT: "They made their own arrangement with the sultan, as they had every reason to. The empire's claim to speak for the east is harder to state now that the east has stopped waiting for it."
 CC_BYZ_MAM_FLAG_WAR_DECLARED: "The Pentarchy War has begun"
 CC_BYZ_MAM_FLAG_WAR_DECLARED_TT: "The claim is being pressed by force. The diplomatic routes are closed for as long as this lasts."

 # ---- Card: the eastern seats ----
 # DUAL READING. These three cities carry the eastern patriarchates AND three of vanilla's
 # Hellenic holy sites, and at the same locations: the Serapeum is at Alexandria, the sanctuary
 # at Daphne is at Antioch. An emperor who has taken up the old rites wants the same three
 # cities for a different reason, so the copy names what is in them rather than naming a church.
 CC_BYZ_MAM_CARD_SEATS: "The Eastern Seats"
 CC_BYZ_MAM_CARD_SEATS_DESC: "Jerusalem, Antioch, Alexandria.\n\nWhatever the empire believes this century, these are the three cities it has never stopped believing are its own. There has been an argument about them since before there was an argument about anything else, and the men who hold them now inherited it from men who inherited it."
 CC_BYZ_MAM_CARD_SEATS_INFO: "With Constantinople and Rome, these five are the pentarchy, and holding all five is what vanilla's mending of the schism requires. Rome comes through the exarchate; these three come through this confrontation.\n\nHeld status is read from ownership, so it is true regardless of the empire's religion. Under the old rites the same three cities carry the Serapeum at Alexandria and the sanctuary at Daphne outside Antioch."
 CC_BYZ_MAM_SEAT_JERUSALEM: "Jerusalem"
 CC_BYZ_MAM_SEAT_ANTIOCH: "Antioch"
 CC_BYZ_MAM_SEAT_ALEXANDRIA: "Alexandria"
 CC_BYZ_MAM_SEAT_HELD: "Held"
 CC_BYZ_MAM_SEAT_CAIRO: "The sultan's"
 CC_BYZ_MAM_SEAT_NOT_HELD: "Neither"

 # ---- Map colouring ----
 CC_BYZ_MAM_LEGEND_EMPIRE: "Imperial"
 CC_BYZ_MAM_LEGEND_CAIRO: "Mamluk"
 cc_byz_mam_map_tt_empire: "Imperial ground, and the frontier is somewhere south of here."
 cc_byz_mam_map_tt_cairo: "The sultan's, and garrisoned like it."
 cc_byz_mam_map_tt_other: "Neither court holds this. Neither court has ever let that stop it arguing about it."

 # ---- Actions ----
 cc_byz_mam_send_embassy: "Send an Embassy to Cairo"
 cc_byz_mam_send_embassy_desc: "Gifts, a letter about the pilgrim tolls, and a month in Cairo learning what the sultan is worried about this decade. It is rarely what the last embassy reported.\n\nNothing is settled by this. Things are settled later, by people who went."
 cc_byz_mam_subsidise_faction: "Subsidise a Faction in Cairo"
 cc_byz_mam_subsidise_faction_desc: "The emirs quarrel over the succession as a matter of routine, and money arriving quietly at the losing side keeps a routine quarrel from resolving.\n\nA sultan managing his own emirs is not managing the frontier. Nobody will ever know where the money came from, which is the point, and also why it buys the empire nothing it can be seen to have."
 cc_byz_mam_negotiate_custody: "Negotiate Custody of the Holy Places"
 cc_byz_mam_negotiate_custody_desc: "Joint administration, a stated tariff for pilgrims, and both courts signing a document in which neither concedes a thing.\n\nIt has been done before and it held for two generations, which in this part of the world is a long peace."
 cc_byz_mam_press_claim: "Press the Patriarchal Claim"
 cc_byz_mam_press_claim_desc: "The emperor says, in public and at length, that the eastern sees are his to protect and always were.\n\nEvery word of it is true and every word of it is heard in Cairo as the opening of something. The sultan's emirs have been asking him why they pay for an army; the emperor has now answered for him."

 # ---- Payload modifiers ----
 STATIC_MODIFIER_NAME_cc_byz_emirs_retained: "The Border Emirs Retained"
 STATIC_MODIFIER_DESC_cc_byz_emirs_retained: "They hold the line for exactly as long as the money lasts. That is what buying a frontier gets you, and why it gets bought again."
 STATIC_MODIFIER_NAME_cc_byz_syrian_garrisons: "The Border Towns Garrisoned"
 STATIC_MODIFIER_DESC_cc_byz_syrian_garrisons: "Paid, walled and provisioned. Nobody has to be bribed next year, which is the whole argument for the expense."
 STATIC_MODIFIER_NAME_cc_byz_frontier_left_alone: "The Frontier Left to Itself"
 STATIC_MODIFIER_DESC_cc_byz_frontier_left_alone: "The men who live on it defend it better than the empire ever did. They also answer to their own people while doing it, and the fisc has stopped hearing from them entirely."
 STATIC_MODIFIER_NAME_cc_byz_cairo_pressed: "The Advantage Pressed"
 STATIC_MODIFIER_DESC_cc_byz_cairo_pressed: "The empire moved while Cairo was arguing with itself, and was seen to move first. Being seen was half of it."
 STATIC_MODIFIER_NAME_cc_byz_cairo_divided: "Cairo Divided"
 STATIC_MODIFIER_DESC_cc_byz_cairo_divided: "The quarrel goes on, funded. Nobody in Cairo knows who is funding it, which is the point, and also why it buys no glory."
 STATIC_MODIFIER_NAME_cc_byz_levantine_terms: "Terms with Cairo"
 STATIC_MODIFIER_DESC_cc_byz_levantine_terms: "An arrangement that suited both courts in one particular year. The caravans run. Both sides know precisely what it is worth and neither says so."

 # ---- Action cooldowns ----
 STATIC_MODIFIER_NAME_cc_byz_mam_embassy_sent: "Embassy at Cairo"
 STATIC_MODIFIER_DESC_cc_byz_mam_embassy_sent: "An embassy is in Cairo, or was recently enough. A second one now would be read as anxiety."
 STATIC_MODIFIER_NAME_cc_byz_mam_faction_bought: "A Faction Bought"
 STATIC_MODIFIER_DESC_cc_byz_mam_faction_bought: "Money is already moving. A second payment down the same channels would be traced, and the tracing is the disaster, not the payment."
 STATIC_MODIFIER_NAME_cc_byz_mam_claim_pressed: "The Claim Pressed"
 STATIC_MODIFIER_DESC_cc_byz_mam_claim_pressed: "It has been said recently and at length. Saying it again soon would only prove that saying it changes nothing."

 # ---- Opinion ----
 cc_byz_opinion_levantine_terms: "Terms over the Holy Places"
