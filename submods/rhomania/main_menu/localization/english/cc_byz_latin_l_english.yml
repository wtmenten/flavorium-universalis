l_english:
 # Tooltips
 cc_byz_lat_bride_tt: "Our ruler or heir is married to the ruler or heir of a Catholic great power that has a royal marriage with us and is not at war with us"
 cc_byz_lat_opens_chain_tt: "Opens #Y The Latin Empress#!, a series of events over about a decade with the strongest Catholic great power married into our dynasty"
 cc_byz_lat_bond_plus1_tt: "#Y Bond with [cc_lat_partner.GetName]#! #G +1#!"
 cc_byz_lat_bond_plus2_tt: "#Y Bond with [cc_lat_partner.GetName]#! #G +2#!"
 cc_byz_lat_bond_minus1_tt: "#Y Bond with [cc_lat_partner.GetName]#! #R -1#!"
 cc_byz_lat_bond_minus2_tt: "#Y Bond with [cc_lat_partner.GetName]#! #R -2#!"
 cc_byz_lat_company_pay_tt: "In 5 to 8 years the company's pay comes due"
 cc_byz_lat_opens_union_tt: "Opens contacts with Rome on church union, at no cost"
 cc_byz_lat_papal_standing_plus1_tt: "#Y Papal standing#! #G +1#!"
 cc_byz_lat_crusade_tt: "We and [cc_lat_partner.GetName] each gain a 15-year war claim on [cc_lat_target.GetName]. If [cc_lat_partner.GetName] is not controlled by a player and not already our ally, it becomes our ally for 20 years. Our armies gain a 10-year bonus"
 cc_byz_lat_letters_unnoticed_tt: "#G 70%:#! nobody at their court notices"
 cc_byz_lat_letters_discovered_tt: "#R 30%:#! their court discovers what her letters are used for"

 # Casus belli
 cc_byz_cb_latin_crusade: "Latin Crusade"
 cc_byz_cb_latin_crusade_desc: "Sworn jointly with Catholic in-laws to recover provinces lost to a Muslim power."
 cc_byz_cb_latin_crusade_PROV: "Latin Crusade"

 # Opinion modifiers
 cc_byz_lat_honoured: "Honoured by the Emperor"
 cc_byz_lat_rebuffed: "Rebuffed by the Emperor"
 cc_byz_lat_affronted: "Affronted by the Emperor"
 cc_byz_lat_kin: "One Family with the Emperor"

 # Country modifiers
 STATIC_MODIFIER_NAME_cc_byz_lat_latin_chapel: "A Latin Chapel in the Palace"
 STATIC_MODIFIER_DESC_cc_byz_lat_latin_chapel: "The empress hears Mass in the Blachernae. Western envoys take it as a sign of goodwill; the clergy do not."
 STATIC_MODIFIER_NAME_cc_byz_lat_orthodox_empress: "An Orthodox Empress"
 STATIC_MODIFIER_DESC_cc_byz_lat_orthodox_empress: "The empress took an Orthodox name and confession. The Church blesses the marriage."
 STATIC_MODIFIER_NAME_cc_byz_lat_orthodox_queen_abroad: "An Orthodox Queen Abroad"
 STATIC_MODIFIER_DESC_cc_byz_lat_orthodox_queen_abroad: "A princess of the imperial house keeps her faith at a Latin court. The Church holds her up as an example."
 STATIC_MODIFIER_NAME_cc_byz_lat_catholic_princess: "A Princess Received by Rome"
 STATIC_MODIFIER_DESC_cc_byz_lat_catholic_princess: "A princess of the imperial house has joined the Roman Church. Western courts approve; our clergy do not."
 STATIC_MODIFIER_NAME_cc_byz_lat_scholars_abroad: "Greek Scholars Abroad"
 STATIC_MODIFIER_DESC_cc_byz_lat_scholars_abroad: "Scholars and manuscripts went west with the princess. They teach Greek at a foreign court and are missed at home."
 STATIC_MODIFIER_NAME_cc_byz_lat_greek_learning: "Greek Learning"
 STATIC_MODIFIER_DESC_cc_byz_lat_greek_learning: "Byzantine scholars arrived with a Greek princess and teach at our court."
 STATIC_MODIFIER_NAME_cc_byz_lat_sacred_ceremonial: "The Ceremonial Carried West"
 STATIC_MODIFIER_DESC_cc_byz_lat_sacred_ceremonial: "A princess of the imperial house keeps the ceremonial of the Sacred Palace at a western court, and its rulers have started to copy it."
 STATIC_MODIFIER_NAME_cc_byz_lat_princess_letters: "Letters from the West"
 STATIC_MODIFIER_DESC_cc_byz_lat_princess_letters: "A princess at a western court writes home often, and her letters are read by more people than her family."
 STATIC_MODIFIER_NAME_cc_byz_lat_latin_knights: "Latin Knights in Service"
 STATIC_MODIFIER_DESC_cc_byz_lat_latin_knights: "A company of western knights serves in the imperial army. The archontes resent their pay and their precedence."
 STATIC_MODIFIER_NAME_cc_byz_lat_company_at_large: "The Company at Large"
 STATIC_MODIFIER_DESC_cc_byz_lat_company_at_large: "The unpaid company is collecting its wages from the provinces."
 STATIC_MODIFIER_NAME_cc_byz_lat_latin_quarter: "Latin Quarter and Exemptions"
 STATIC_MODIFIER_DESC_cc_byz_lat_latin_quarter: "The in-laws' merchants hold a quarter on the Golden Horn and pay no customs. Trade grows; the treasury and our own merchants pay for it."
 STATIC_MODIFIER_NAME_cc_byz_lat_latin_quarter_taxed: "Latin Quarter"
 STATIC_MODIFIER_DESC_cc_byz_lat_latin_quarter_taxed: "The in-laws' merchants hold a quarter on the Golden Horn and pay the full customs."
 STATIC_MODIFIER_NAME_cc_byz_lat_privileges_in_romania: "Privileges in Romania"
 STATIC_MODIFIER_DESC_cc_byz_lat_privileges_in_romania: "Our merchants hold a quarter in Constantinople and trade there free of customs."
 STATIC_MODIFIER_NAME_cc_byz_lat_union_sponsors: "Sponsors of the Union"
 STATIC_MODIFIER_DESC_cc_byz_lat_union_sponsors: "Our Catholic in-laws argue the case for church union at the papal court."
 STATIC_MODIFIER_NAME_cc_byz_lat_crusade_preparations: "The Crusade Sworn"
 STATIC_MODIFIER_DESC_cc_byz_lat_crusade_preparations: "We and our Catholic in-laws have sworn a joint expedition. Knights and levies are being gathered."
 STATIC_MODIFIER_NAME_cc_byz_lat_western_kinship: "Kinship with the West"
 STATIC_MODIFIER_DESC_cc_byz_lat_western_kinship: "Two ruling houses, one Greek and one Latin, now treat each other as family."
 STATIC_MODIFIER_NAME_cc_byz_lat_western_friendship: "Friends in the West"
 STATIC_MODIFIER_DESC_cc_byz_lat_western_friendship: "The marriage left a lasting friendship with a western court."
 STATIC_MODIFIER_NAME_cc_byz_lat_dowager_court: "The Dowager's Court"
 STATIC_MODIFIER_DESC_cc_byz_lat_dowager_court: "The Latin empress stayed in Constantinople after her family's fortunes changed, and western envoys still call on her."

 # .1 The empress arrives
 cc_byz_latin.1.title: "The Latin Empress"
 cc_byz_latin.1.desc: "The bride from [cc_lat_partner.GetName] has arrived in Constantinople with her ladies, her chaplains and a confessor. The Patriarch asks whether she will be received into the Orthodox Church and given a Greek name, as Bertha of Sulzbach became Irene. Her own household expects her to keep her rite.\n\nWhatever is decided will be read in her father's court as a statement of how we regard it."
 cc_byz_latin.1.a: "She takes an Orthodox name and confession."
 cc_byz_latin.1.b: "She keeps her rite. Open a Latin chapel in the Blachernae."
 cc_byz_latin.1.c: "The Patriarch marries them; her confessor stays, privately."

 # .11 Western branch: our princess at their court
 cc_byz_latin.11.title: "A Princess in the West"
 cc_byz_latin.11.desc: "[cc_lat_princess.GetName] has reached the court of [cc_lat_partner.GetName] with her household, her icons and an Orthodox chaplain. Her new family expects her to be received into the Roman Church before the coronation. The Patriarch has written to remind her that she is a daughter of the purple.\n\nWhat she decides will be read in both capitals as our decision."
 cc_byz_latin.11.a: "She is received into the Roman Church."
 cc_byz_latin.11.b: "She keeps her faith and her chaplain."
 cc_byz_latin.11.c: "Their rite in public, hers in private, and a larger dowry."

 # .12 Western branch: what she carries west
 cc_byz_latin.12.title: "What the Princess Carried West"
 cc_byz_latin.12.desc: "[cc_lat_princess.GetName] has settled at the court of [cc_lat_partner.GetName] and asks what more she may bring from home. Sophia Palaiologina took the double-headed eagle and the ceremonial of the Sacred Palace to Moscow, and her husband's court was never the same. Greek scholars followed every Byzantine embassy into Italy and many did not come back.\n\nShe could take teachers and books, the forms of the palace, or simply write home often."
 cc_byz_latin.12.a: "Send scholars and manuscripts with her household."
 cc_byz_latin.12.b: "Let her keep the ceremonial of the Sacred Palace."
 cc_byz_latin.12.c: "Read her letters as dispatches."

 # .2 Latin knights
 cc_byz_latin.2.title: "Latin Knights at Court"
 cc_byz_latin.2.desc: "[cc_lat_partner.GetName] has sent a company of knights to serve the emperor, as a mark of the alliance. They are heavily armed, very expensive, and contemptuous of everything Greek. Manuel Komnenos favoured such men and his archontes never forgave him. Andronikos II hired the Catalans and spent the next decade fighting them.\n\nThe company's captain asks for a contract. His men would accept a tournament in their honour as a lesser alternative."
 cc_byz_latin.2.a: "Take them into service."
 cc_byz_latin.2.b: "Hold a tournament in the Hippodrome instead."
 cc_byz_latin.2.c: "Thank them and send them home."

 # .21 The company's pay
 cc_byz_latin.21.title: "The Company's Pay"
 cc_byz_latin.21.desc: "The Latin company's contract has run its course and its captain has presented the account. It is larger than anyone remembers agreeing to. If it is not paid, his men will collect it themselves, as the Catalans did in Thrace."
 cc_byz_latin.21.a: "Pay in full and renew the contract."
 cc_byz_latin.21.b: "Pay them off and see them onto the ships."
 cc_byz_latin.21.c: "The account is fraudulent. Pay nothing."

 # .3 Merchant privileges
 cc_byz_latin.3.title: "The Merchants' Privileges"
 cc_byz_latin.3.desc: "Merchants from [cc_lat_partner.GetName] have followed the marriage to Constantinople. Their envoy asks for a quarter on the Golden Horn and freedom from the customs, the terms Alexios I gave Venice in 1082.\n\nThe Venetian privileges bought a fleet when the empire needed one. They also cost the treasury its customs for two centuries and put the city's trade in foreign hands."
 cc_byz_latin.3.a: "Grant the quarter and the exemption."
 cc_byz_latin.3.b: "Grant the quarter. The customs stand."
 cc_byz_latin.3.c: "The customs of Constantinople are not a wedding gift."

 # .4 The Pope's letter
 cc_byz_latin.4.title: "A Letter from Rome"
 cc_byz_latin.4.desc: "The Pope has written to congratulate us on the marriage, and to observe that a union of houses is a good beginning for a union of churches. [cc_lat_partner.GetName] has let it be known that it shares the hope.\n\nThe letter asks us to receive papal legates."
 cc_byz_latin.4.desc_progress: "The Pope has written to say that our marriage into [cc_lat_partner.GetName] gives him hope for the union now under discussion. Our in-laws offer to speak for it at the papal court, which would help in Rome and be noticed in Constantinople."
 cc_byz_latin.4.desc_received: "The Pope has written to thank us. A Roman emperor married into a Catholic royal house, and in communion with Rome, is what the papacy has wanted for two hundred years. [cc_lat_partner.GetName] has added its own congratulations."
 cc_byz_latin.4.desc_repudiated: "The Pope has written to say that our repudiation of the union dishonours the marriage. [cc_lat_partner.GetName] is embarrassed in front of Rome and wants some gesture from us."
 cc_byz_latin.4.desc_hellenic: "The Pope has written to [cc_lat_partner.GetName], not to us, asking how a Catholic house can stay married into a court that has returned to the old gods. Our in-laws have forwarded the letter and await an answer."
 cc_byz_latin.4.a: "Receive the legates."
 cc_byz_latin.4.b: "A marriage is not a council."
 cc_byz_latin.4.c: "Let our in-laws speak for the union."
 cc_byz_latin.4.d: "Ask them to stay out of church matters."
 cc_byz_latin.4.e: "Thank His Holiness."
 cc_byz_latin.4.f: "Send gifts to soften it."
 cc_byz_latin.4.g: "The repudiation stands."
 cc_byz_latin.4.h: "Send gold and say nothing about the gods."
 cc_byz_latin.4.i: "Our gods are our own affair."

 # .5 The crusade proposal
 cc_byz_latin.5.title: "The Crusade Proposal"
 cc_byz_latin.5.desc: "[cc_lat_partner.GetName] proposes a joint expedition against [cc_lat_target.GetName]: its knights by sea, our armies by land, to recover the provinces the Turks and Arabs took. Every western marriage into the dynasty has brought a proposal like this.\n\nThe last crusade that came east, in 1204, took Constantinople instead."
 cc_byz_latin.5.a: "Take the cross with them."
 cc_byz_latin.5.b: "Ask for gold for the walls instead."
 cc_byz_latin.5.c: "We remember 1204. Decline."

 # .6 The settlement
 cc_byz_latin.6.title: "The Marriage, Ten Years On"
 cc_byz_latin.6.desc_kin: "A decade after the marriage, [cc_lat_partner.GetName] and Constantinople behave like one family. Envoys travel without ceremony, princes of both houses are godparents to each other's children, and western courts treat an insult to one as an insult to both."
 cc_byz_latin.6.desc_friends: "A decade after the marriage, relations with [cc_lat_partner.GetName] are good. Neither court has given the other everything it asked for, and neither has a serious grievance."
 cc_byz_latin.6.desc_cool: "A decade after the marriage, relations with [cc_lat_partner.GetName] are correct and no warmer. Too many requests were refused on both sides. The empress is respected in the palace and has little influence outside it."
 cc_byz_latin.6.desc_kin_west: "A decade after the marriage, [cc_lat_partner.GetName] and Constantinople behave like one family. [cc_lat_princess.GetName] is the most influential figure at her husband's court after the king, and her children will inherit a claim to two crowns."
 cc_byz_latin.6.desc_friends_west: "A decade after the marriage, relations with [cc_lat_partner.GetName] are good. [cc_lat_princess.GetName] is respected at their court, and her letters still arrive every season."
 cc_byz_latin.6.desc_cool_west: "A decade after the marriage, relations with [cc_lat_partner.GetName] are correct and no warmer. [cc_lat_princess.GetName] is treated well at their court and has little say in it."
 cc_byz_latin.6.a: "Two houses, one family."
 cc_byz_latin.6.b: "A friendship worth keeping."
 cc_byz_latin.6.c: "At least the marriage holds."
 cc_byz_latin.6.d: "Send the Latin household home."

 # .90 The partnership ends
 cc_byz_latin.90.title: "The Latin Alliance Ends"
 cc_byz_latin.90.desc: "[cc_lat_partner.GetName] is no longer the partner it was when the marriage was made: it has lost its standing among the great powers, left the Roman Church, or the marriage tie between our houses has lapsed. The arrangements that rested on it are wound up."
 cc_byz_latin.90.desc_dowager: "[cc_lat_partner.GetName] is no longer the partner it was when the marriage was made. The empress has chosen to stay in Constantinople, and the friendships she made at court stay with her."
 cc_byz_latin.90.desc_dowager_west: "[cc_lat_partner.GetName] is no longer the partner it was when the marriage was made. The princess we sent there is still honoured at that court, and the friendships she made there remain."
 cc_byz_latin.90.desc_war: "We are at war with [cc_lat_partner.GetName]. The empress's household is under watch in the palace, and the arrangements made at the marriage are void."
 cc_byz_latin.90.desc_bride_died: "Empress [cc_lat_their_spouse.GetName] has died. Her household is going home to [cc_lat_partner.GetName], and the arrangements made at her marriage end with her."
 cc_byz_latin.90.desc_bride_died_west: "[cc_lat_princess.GetName] has died at the court of [cc_lat_partner.GetName]. Her household is coming home, and the arrangements made at her marriage end with her."
 cc_byz_latin.90.desc_widowed: "With the death of [cc_lat_our_spouse.GetName], the marriage that joined our house to [cc_lat_partner.GetName] has ended. Empress [cc_lat_their_spouse.GetName] is a widow in Constantinople, and the new reign owes her family nothing."
 cc_byz_latin.90.desc_widowed_west: "With the death of [cc_lat_their_spouse.GetName], [cc_lat_princess.GetName] is a widow at the court of [cc_lat_partner.GetName]. The marriage that joined the two houses has ended, and her husband's successors owe us nothing."
 cc_byz_latin.90.desc_succession: "The marriage still stands, but [cc_lat_our_spouse.GetName] and [cc_lat_their_spouse.GetName] are no longer both in line for their thrones. Their children will not inherit two crowns, and the arrangements built on that prospect are wound up."
 cc_byz_latin.90.a: "She stays, and keeps her friends."
 cc_byz_latin.90.b: "So be it."
 cc_byz_latin.90.c: "Send the Latin household home."
