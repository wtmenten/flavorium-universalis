l_english:
 # Hint entries for the submod's two situations.
 #
 # Both keys are required per hint tag: <tag> is the title shown in the hints list, and
 # <tag>_hint_text is the body.
 #
 # TITLES ARE WRITTEN OUT RATHER THAN RESOLVED THROUGH GetSituationByKey, which is what vanilla
 # does here (hints_l_english.yml:652). Two reasons to depart from it. CWTools reports the
 # command as undefined, and while that is probably just an incomplete schema, the submod has
 # already been bitten once by assuming a vanilla precedent guarantees a token resolves from our
 # call site: religion_percentage_in_country_greater_or_equal is a real vanilla key whose
 # TARGET_RELIGION token does not populate when called our way, and it errored in game while
 # looking correct. A situation title is two words and never changes. Not worth the class of
 # risk to save typing them.

 hint_cc_byz_the_west: "The West"
 hint_cc_byz_the_west_hint_text: "The prefectures are governed provinces with governors of their own, and the emperor's problem is that both of those facts are true at once.\n\nTwo measures track it, and they are independent rather than opposed. #T Imperial grip#! is how much the empire is actually holding. #T Western autonomy#! is how much the west would rather be let go. Both can be high together, and that combination is what the rising comes out of.\n\nThe consistory is where it is decided. The emperor votes three as Augustus, a senior exarch votes two, every other exarch votes one. One prefecture and he cannot lose. Four and he is outvoted by the body he built.\n\nThe situation resolves before the Age of Revolutions in every case, one way or another."

 hint_cc_byz_mamluk_confrontation: "The Levantine Confrontation"
 hint_cc_byz_mamluk_confrontation_hint_text: "The empire and the Sultanate of Cairo face each other over holy places both of them claim, with the Italian republics selling to both and lending to both.\n\n#T It can be settled without a war.#! A written condominium over the holy places is a real ending, and it requires that the empire has not spent the intervening decades pressing the frontier. Levantine pressure is the number that decides which routes stay open.\n\nThe other road is the Pentarchy War, for Jerusalem, Antioch and Alexandria. Those three with Constantinople and Rome are the five patriarchates, and holding all five is what mending the schism requires."
