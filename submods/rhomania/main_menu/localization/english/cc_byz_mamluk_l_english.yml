l_english:
 # Situation
 cc_byz_mamluk_confrontation: "The Levantine Confrontation"
 cc_byz_mamluk_confrontation_desc: "With Anatolia settled, the empire and the Sultanate of Cairo face each other across a frontier neither of them chose, over holy places both of them claim, with the Italian republics selling to both and lending to both.\n\nIt can be settled by negotiation. A written condominium over the holy places is a real ending and several emperors have thought it the best available one. It can also become the Pentarchy War, which is the other kind of ending."

 # Country modifiers
 STATIC_MODIFIER_NAME_cc_byz_pentarchy_restored: "The Pentarchy Restored"
 STATIC_MODIFIER_DESC_cc_byz_pentarchy_restored: "Constantinople, Rome, Jerusalem, Antioch and Alexandria. All five ancient sees answer to one emperor for the first time since the seventh century, and every argument about authority in the Christian world now has a single address."

 # Opinion modifiers
 cc_byz_levant_accommodation: "An Accommodation in the Levant"
 cc_byz_abandoned_the_east: "Abandoned the Eastern Sees"
 cc_byz_restored_the_east: "Restored the Eastern Sees"

 # cc_byz_mamluk.1 - the holy places
 cc_byz_mamluk.1.title: "The Custody of the Holy Places"
 cc_byz_mamluk.1.desc: "The arrangement at the Holy Sepulchre is old, complicated, and has been working after a fashion for two centuries.\n\nThe sultan holds the city. The Orthodox clergy hold the keys to most of what matters, subject to dues paid annually to Cairo. Pilgrims come, are taxed, and are protected, which is a service the sultan provides competently because pilgrims are profitable.\n\nWhat has changed is that there is now an emperor to the north who is not fighting for his survival, and who takes the view that these rights are his by inheritance rather than the sultan's to license. The clergy in Jerusalem, who have to live there, have asked with some feeling that he consider the matter carefully."
 cc_byz_mamluk.1.desc_unionist: "The arrangement at the Holy Sepulchre is old and complicated, and it has just become more so.\n\nThe union has been signed, and the Latins have read it as settling a question that had been open since the crusades: if the churches are one church under Rome, then Latin claims to custody in Jerusalem are no longer competing with the emperor's, they are the same claim, and the Franciscans have begun acting on that interpretation without waiting to be asked.\n\nThe Orthodox clergy in Jerusalem have written to Constantinople. Their letter is respectful and its substance is that the emperor has acquired a partner in this matter whom they did not want and cannot remove."
 cc_byz_mamluk.1.a: "Pay the dues, as every emperor has since the conquest."
 cc_byz_mamluk.1.b: "The custody is ours by inheritance. Stop paying."
 cc_byz_mamluk.1.c: "Negotiate a standing arrangement. Fixed dues, fixed rights."

 # cc_byz_mamluk.2 - Cairo
 cc_byz_mamluk.2.title: "The Emperor to the North"
 cc_byz_mamluk.2.desc: "The reports from the northern frontier have changed character. For two centuries the empire of the Greeks has been a spent power to be traded with, occasionally raided, and otherwise not thought about.\n\nIt is no longer spent. It has settled Anatolia, it has a fleet, and it has begun asking questions about Jerusalem in a tone that the diwan finds unfamiliar. The sultan's advisors are divided between those who consider this a commercial opportunity and those who consider it a frontier problem, and both groups have precedent on their side."
 cc_byz_mamluk.2.a: "A frontier problem. Reinforce the north."
 cc_byz_mamluk.2.b: "A commercial opportunity. Open discussions."

 # cc_byz_mamluk.3 - spice and grain
 cc_byz_mamluk.3.title: "Spice, Grain and the Republics"
 cc_byz_mamluk.3.desc: "The Red Sea transit and the Alexandria factories are the richest trade in the world, and they run through Cairo's hands to Venetian and Genoese ships.\n\nThe republics are entirely candid about this when asked. They trade with Cairo because Cairo has the spice; they would trade with Constantinople instead if Constantinople had it; and in the meantime they see no contradiction in doing business with a power the emperor is in confrontation with, because they are merchants and he is not their sovereign.\n\nThe straits, however, are his."
 cc_byz_mamluk.3.desc_indebted: "The Red Sea transit runs through Cairo's hands to Venetian and Genoese ships, and the emperor's position in the matter is complicated by the fact that those same houses hold a great deal of his paper.\n\nThey have raised the subject themselves, which is the courteous way of doing it. Their factors observe that a closure of the straits would be a serious matter for their Alexandria business, that their Alexandria business is what services the loans, and that they are confident these considerations need not be set against each other.\n\nEverything in that formulation is true. It is also a description of who is in a position to inconvenience whom."
 cc_byz_mamluk.3.a: "Let them trade. The customs are worth more than the principle."
 cc_byz_mamluk.3.b: "Close the straits to the Alexandria trade."
 cc_byz_mamluk.3.c: "Take a cut of it. Become a party to the trade."

 # cc_byz_mamluk.4 - the frontier
 cc_byz_mamluk.4.title: "The Frontier"
 cc_byz_mamluk.4.desc: "The border between the empire and the sultanate is not a line and has never been drawn as one.\n\nIt is a belt of country two hundred miles deep, occupied by Turkmen and Bedouin who graze across it seasonally, garrisoned by emirs who hold from Cairo in a sense that varies with how recently they were paid, and administered by nobody. Raiding is constant, low-level, and understood by everyone involved as a form of taxation rather than as war.\n\nTwo of the border emirs have made approaches to Constantinople. Both were careful to leave themselves the option of denying it."
 cc_byz_mamluk.4.desc_war: "The frontier has stopped being a belt of country and become a front, and the men who live on it have had to decide things they spent two centuries not deciding.\n\nThe Turkmen have moved their herds south, away from the campaigning, which has emptied a hundred miles of grazing and removed the empire's best source of intelligence about what is coming. The border emirs who were quietly negotiating with Constantinople have gone silent; an emir hedging in peacetime is prudent, an emir hedging in wartime is a traitor, and they know which one they would be tried as.\n\nThe raiding has stopped. Nobody in the border command regards this as good news."
 cc_byz_mamluk.4.a: "Buy the emirs. They are for sale."
 cc_byz_mamluk.4.b: "Garrison the border towns. Let the raiding come to the walls."
 cc_byz_mamluk.4.c: "Leave the frontier to the men who live on it."

 # cc_byz_mamluk.5 - Cairo's troubles
 cc_byz_mamluk.5.title: "Trouble in Cairo"
 cc_byz_mamluk.5.desc: "The sultan is dead and the succession is being settled the way Mamluk successions are settled, which is by the senior emirs, in stages, with troops in the streets.\n\nThis is neither a crisis nor a surprise; the sultanate has changed hands this way for two centuries and the state has survived every time. What it does mean is that for eighteen months or so nobody in Cairo can make a binding decision about anything, the frontier garrisons are being drawn south by factions who need them, and the northern border is as open as it ever gets.\n\nThe reports reached Constantinople three weeks after the fact. They will reach Venice about now."
 cc_byz_mamluk.5.a: "Press the advantage while they quarrel."
 cc_byz_mamluk.5.b: "Subsidise the losing faction. Keep it going."
 cc_byz_mamluk.5.c: "Offer terms. He needs a quiet northern border."

 # cc_byz_mamluk.10 - the eastern patriarchs
 cc_byz_mamluk.10.title: "The Eastern Patriarchs"
 cc_byz_mamluk.10.desc: "The patriarchs of Antioch, Jerusalem and Alexandria are Orthodox, they are the emperor's co-religionists, and they are the sultan's subjects. All three of those facts are permanent and the third is the one that governs.\n\nThey have appealed to Constantinople, as they periodically do, over restrictions on building, on processions and on the appointment of bishops. The appeal is genuine and the grievances are real.\n\nIt is also the case that every previous imperial intervention on their behalf has been followed by reprisals against them, and that they know this and have appealed anyway, which tells the palace something about how bad it has become."
 cc_byz_mamluk.10.desc_unionist: "The patriarchs of Antioch, Jerusalem and Alexandria have appealed to Constantinople, and this time their letter spends more space on the union than on the sultan.\n\nThey were not consulted. They were not represented at the council. They have been informed, by a document arriving from a city none of them has visited, that they are now in communion with Rome, and they are being asked by their own clergy what this means for sees that have been Orthodox under Muslim rule for eight hundred years and have survived by being unambiguous about it.\n\nThe grievances against the sultan are in the letter too, further down."
 cc_byz_mamluk.10.desc_partial: "The three of them no longer write from the same position.\n\nThe sees the emperor has recovered are governed from Constantinople now, and their difficulties are the ordinary difficulties of a diocese under a new authority. The rest are still the sultan's subjects, and their letter makes the point, politely, that what has happened to their colleagues has made their own position worse rather than better. A patriarch under Muslim rule whose neighbouring see has just been annexed by a Christian emperor is a patriarch under suspicion, and the local governor does not need to be told twice.\n\nThey are asking for help and warning against it in the same paragraph. Both halves are sincere."
 cc_byz_mamluk.10.a: "Protect them openly."
 cc_byz_mamluk.10.b: "Leave them to their own arrangements."
 cc_byz_mamluk.10.c: "Extract written guarantees instead of protection."

 # cc_byz_mamluk.11 - escalation
 cc_byz_mamluk.11.title: "Settlement or War"
 cc_byz_mamluk.11.desc: "The confrontation has reached the point where it either becomes an arrangement or becomes a war, and it will not stay where it is much longer.\n\nThe case for settling is that the empire has more frontiers than it has armies, that Cairo is a competent state which honours agreements it has signed, and that a written condominium over the holy places would give the emperor in practice most of what a war would give him in theory.\n\nThe case for war is that the seats of Jerusalem, Antioch and Alexandria are three of the five, that no emperor since Heraclius has held them, and that the argument about who speaks for the whole church cannot be won without them."
 cc_byz_mamluk.11.desc_condominium: "The confrontation has reached its decision point, and the groundwork for the peaceful answer is already done.\n\nThe negotiations over the holy places have gone further than anyone expected. There is a draft. It is detailed, it has survived several rounds of objection from both sides, and the officials who produced it are quietly proud of it. Signed, it would settle the custody question in writing for the first time since the crusades.\n\nThe alternative is on the table as well, because the seats of Jerusalem, Antioch and Alexandria are three of the five, and a draft agreement is not the same thing as a pentarchy."
 cc_byz_mamluk.11.desc_holding: "The confrontation has reached the point where it either becomes an arrangement or becomes a war, and the emperor is arguing from ground none of his predecessors had.\n\nSome of the ancient eastern seats are already his. That changes what a settlement is worth and what a war would be for. Cairo is negotiating over what it still holds rather than over the whole question, and the sultan's officials have been correct and unhurried about it in a manner suggesting they have worked the same thing out.\n\nThe case for stopping here is that the empire has more frontiers than it has armies and has just acquired another one. The case for going on is that a partial pentarchy settles no argument at all, which is the objection made to every partial recovery since the seventh century."
 cc_byz_mamluk.11.a: "Sign the condominium. It is a better peace than a war."
 cc_byz_mamluk.11.b: "Keep the pressure on. Commit to nothing."
 cc_byz_mamluk.11.c: "The Pentarchy War. Three seats, and the argument settled."

 # cc_byz_mamluk.12 - the seats
 cc_byz_mamluk.12.title: "The Ancient Sees"
 cc_byz_mamluk.12.desc: "A see that has been under Muslim rule since the seventh century has been recovered, and the ceremony of installing a patriarch in it has had to be reconstructed from the archives, because no living person has seen one.\n\nThe congregation that assembled for it is the same congregation that was there the year before, worshipping in the same building under the same clergy. Nothing about their faith has changed. What has changed is the authority over their heads, and several of them have observed privately that they have seen authorities change before."
 cc_byz_mamluk.12.a: "Let the installation be done properly."
 cc_byz_mamluk.12.b: "There are five seats. Press on."

 # cc_byz_mamluk.13 - the pentarchy
 cc_byz_mamluk.13.title: "The Pentarchy Restored"
 cc_byz_mamluk.13.desc: "Constantinople, Rome, Jerusalem, Antioch and Alexandria. All five, held by one emperor, for the first time since before the Arab conquests.\n\nThe five patriarchates were the structure through which the undivided church governed itself, and the argument about who inherited that authority has run for eight centuries precisely because nobody could hold all five and settle it. That objection no longer applies.\n\nWhat follows is now a matter for the emperor. The instrument exists."
 cc_byz_mamluk.13.a: "The schism can be addressed on our terms now."

 # cc_byz_mamluk.14 - the sees in the emperor's hand
 cc_byz_mamluk.14.title: "The Patriarchs as Subjects"
 cc_byz_mamluk.14.desc: "The patriarchs of Antioch, Jerusalem and Alexandria are Orthodox, they are the emperor's co-religionists, and they are now the emperor's subjects. The third fact is the one that has changed and it is still the one that governs.\n\nThe sees have run themselves for eight centuries. They have their own customs of election, their own understandings with the local notables, their own liturgical practice that Constantinople considers provincial and they consider older. None of it was ever imperial, because for eight hundred years there was no empire there to make it so.\n\nThe question in front of the palace is who appoints the next patriarch of Antioch. Every answer to it is a decision about what kind of church the emperor believes he has recovered."
 cc_byz_mamluk.14.desc_unionist: "The patriarchs of Antioch, Jerusalem and Alexandria are the emperor's subjects now. They were informed of the union by letter some years before they were informed of anything else.\n\nThey have been Orthodox under Muslim rule for eight centuries and they survived it by being unambiguous about what they were. They are now being asked to be in communion with Rome by a court that has just annexed them, which is a difficult sequence to present as anything other than what it looks like. Their clergy have already begun presenting it that way.\n\nSo the question of who appoints the next patriarch of Antioch is also the question of whether the union survives contact with the sees it was meant to bring in."
 cc_byz_mamluk.14.a: "Appoint from Constantinople. The sees are imperial."
 cc_byz_mamluk.14.b: "Confirm the sitting patriarchs. Leave the sees their customs."
 cc_byz_mamluk.14.c: "Call a synod. Their rites, our appointments."

 # cc_byz_mamluk.20 - endings
 cc_byz_mamluk.20.title: "The Levant"
 cc_byz_mamluk.20.desc_pentarchy: "The confrontation is over and it ended in the maximal outcome: the eastern sees recovered, the pentarchy whole, and an emperor in Constantinople who holds every ancient patriarchate of the Christian world.\n\nIt cost what such things cost. The armies that did it are in Syria and Egypt and will have to stay there. The frontier has moved south and become longer. Cairo, defeated, is still Cairo, and will be a problem again within a generation.\n\nBut the argument that has run since the seventh century is settled, and it is settled in Constantinople's favour, and that will outlast every one of those difficulties."
 cc_byz_mamluk.20.desc_eastern_sees: "The confrontation is over and the Levant is imperial.\n\nJerusalem and Antioch are held and garrisoned. The custody question is closed because there is nobody left to dispute it with, the patriarchs of both sees answer to Constantinople as they did before the Arab conquests, and the dues at the Holy Sepulchre are collected by the emperor's own officials. That last is a smaller thing than it sounds and was argued over for three centuries.\n\nWhat it has not produced is a pentarchy. Rome is in other hands, and so, perhaps, is Alexandria. The question of who speaks for the undivided church is not answered by holding most of the seats. It has been narrowed, which is a real achievement and is not the same thing."
 cc_byz_mamluk.20.desc_condominium: "The confrontation is over and it ended in a document rather than a battle.\n\nThe condominium over the holy places is precise, mutually irritating, and has been observed by both parties. Orthodox clergy hold the rights the agreement gives them, the dues are fixed and are paid, and pilgrims come under a protection that both powers guarantee and neither can withdraw unilaterally.\n\nIt is not a triumph and nobody in the capital has pretended otherwise. It is the first settled eastern frontier the empire has had in four hundred years, and the emperors who follow will find that worth considerably more than a campaign."
 cc_byz_mamluk.20.desc_defeat: "The confrontation is over and Cairo won it.\n\nThe dues at the Holy Sepulchre have been raised, the Orthodox clergy there hold their rights on worse terms than before the emperor took an interest, and the eastern patriarchs have made their own arrangements with the sultanate on the reasonable grounds that Constantinople could not protect them and Cairo is where they live.\n\nThe empire pressed and could not follow through, which is the specific way to come out of a confrontation worse than not having begun it. Everyone involved understands this, including the patriarchs."
 cc_byz_mamluk.20.desc_stalemate: "The confrontation has not so much ended as stopped being current.\n\nNothing was settled. The dues are still paid, the custody is still disputed in the same terms, the frontier is still a belt of country rather than a line, and the correspondence between the two chanceries has reverted to the routine business of pilgrims and grain. Both powers found other frontiers more urgent.\n\nThe questions remain open. They have been open since the seventh century and there is no particular reason to expect this generation to have been the one that closed them."
 cc_byz_mamluk.20.a: "So it rests."
