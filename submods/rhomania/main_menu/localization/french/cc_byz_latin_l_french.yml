l_french:
 # Tooltips
 cc_byz_lat_bride_tt: "Notre dirigeant ou héritier est marié au dirigeant ou à l'héritière d'une grande puissance catholique qui a un mariage royal avec nous et n'est pas en guerre contre nous"
 cc_byz_lat_opens_chain_tt: "Ouvre #Y L'Impératrice Latine#!, une série d'événements s'étalant sur environ une décennie avec la plus puissante grande puissance catholique mariée à notre dynastie"
 cc_byz_lat_bond_plus1_tt: "#Y Lien avec [cc_lat_partner.GetName]#! #G +1#!"
 cc_byz_lat_bond_plus2_tt: "#Y Lien avec [cc_lat_partner.GetName]#! #G +2#!"
 cc_byz_lat_bond_minus1_tt: "#Y Lien avec [cc_lat_partner.GetName]#! #R -1#!"
 cc_byz_lat_bond_minus2_tt: "#Y Lien avec [cc_lat_partner.GetName]#! #R -2#!"
 cc_byz_lat_company_pay_tt: "Dans 5 à 8 ans, la solde de la compagnie arrivera à échéance"
 cc_byz_lat_opens_union_tt: "Ouvre des contacts avec Rome concernant l'union des Églises, sans coût"
 cc_byz_lat_papal_standing_plus1_tt: "#Y Statut papal#! #G +1#!"
 cc_byz_lat_crusade_tt: "Nous et [cc_lat_partner.GetName] obtenons chacun une revendication de guerre de 15 ans sur [cc_lat_target.GetName]. Si [cc_lat_partner.GetName] n'est pas contrôlé par un joueur et n'est pas déjà notre allié, il devient notre allié pour 20 ans. Nos armées obtiennent un bonus de 10 ans"
 cc_byz_lat_letters_unnoticed_tt: "#G 70%:#! personne à leur cour ne s'en aperçoit"
 cc_byz_lat_letters_discovered_tt: "#R 30%:#! leur cour découvre l'usage de ses lettres"

 # Casus belli
 cc_byz_cb_latin_crusade: "Croisade latine"
 cc_byz_cb_latin_crusade_desc: "Assermenté conjointement avec des alliés catholiques pour récupérer les provinces perdues face à une puissance musulmane."
 cc_byz_cb_latin_crusade_PROV: "Croisade latine"

 # Opinion modifiers
 cc_byz_lat_honoured: "Honoré par l'Empereur"
 cc_byz_lat_rebuffed: "Éconduit par l'Empereur"
 cc_byz_lat_affronted: "Offensé par l'Empereur"
 cc_byz_lat_kin: "Une famille avec l'Empereur"

 # Country modifiers
 STATIC_MODIFIER_NAME_cc_byz_lat_latin_chapel: "Une chapelle latine dans le palais"
 STATIC_MODIFIER_DESC_cc_byz_lat_latin_chapel: "L'impératrice assiste à la messe à Blachernae. Les envoyés occidentaux y voient un signe de bonne volonté ; le clergé non."
 STATIC_MODIFIER_NAME_cc_byz_lat_orthodox_empress: "Une impératrice orthodoxe"
 STATIC_MODIFIER_DESC_cc_byz_lat_orthodox_empress: "L'impératrice a adopté un nom et une confession orthodoxes. L'Église bénit le mariage."
 STATIC_MODIFIER_NAME_cc_byz_lat_orthodox_queen_abroad: "Une reine orthodoxe à l'étranger"
 STATIC_MODIFIER_DESC_cc_byz_lat_orthodox_queen_abroad: "Une princesse de la maison impériale conserve sa foi à une cour latine. L'Église la présente comme un exemple."
 STATIC_MODIFIER_NAME_cc_byz_lat_catholic_princess: "Une princesse reçue par Rome"
 STATIC_MODIFIER_DESC_cc_byz_lat_catholic_princess: "Une princesse de la maison impériale a rejoint l'Église romaine. Les cours occidentales approuvent ; notre clergé non."
 STATIC_MODIFIER_NAME_cc_byz_lat_scholars_abroad: "Savants grecs à l'étranger"
 STATIC_MODIFIER_DESC_cc_byz_lat_scholars_abroad: "Des savants et des manuscrits sont partis vers l'ouest avec la princesse. Ils enseignent le grec à une cour étrangère et manquent ici."
 STATIC_MODIFIER_NAME_cc_byz_lat_greek_learning: "Savoir grec"
 STATIC_MODIFIER_DESC_cc_byz_lat_greek_learning: "Des savants byzantins sont arrivés avec une princesse grecque et enseignent à notre cour."
 STATIC_MODIFIER_NAME_cc_byz_lat_sacred_ceremonial: "Le cérémonial transporté vers l'Ouest"
 STATIC_MODIFIER_DESC_cc_byz_lat_sacred_ceremonial: "Une princesse de la maison impériale maintient le cérémonial du Palais Sacré à une cour occidentale, et ses dirigeants ont commencé à l'imiter."
 STATIC_MODIFIER_NAME_cc_byz_lat_princess_letters: "Lettres d'Occident"
 STATIC_MODIFIER_DESC_cc_byz_lat_princess_letters: "Une princesse à une cour occidentale écrit souvent chez elle, et ses lettres sont lues par plus de personnes que par sa propre famille."
 STATIC_MODIFIER_NAME_cc_byz_lat_latin_knights: "Chevaliers latins au service"
 STATIC_MODIFIER_DESC_cc_byz_lat_latin_knights: "Une compagnie de chevaliers occidentaux sert dans l'armée impériale. Les archontes déplorent leur solde et leur préséance."
 STATIC_MODIFIER_NAME_cc_byz_lat_company_at_large: "La compagnie en liberté"
 STATIC_MODIFIER_DESC_cc_byz_lat_company_at_large: "La compagnie non payée perçoit ses gages dans les provinces."
 STATIC_MODIFIER_NAME_cc_byz_lat_latin_quarter: "Quartier latin et exemptions"
 STATIC_MODIFIER_DESC_cc_byz_lat_latin_quarter: "Les marchands des alliés par alliance occupent un quartier sur la Corne d'Or et ne paient pas de douanes. Le commerce croît ; le trésor et nos propres marchands en paient le prix."
 STATIC_MODIFIER_NAME_cc_byz_lat_latin_quarter_taxed: "Quartier latin"
 STATIC_MODIFIER_DESC_cc_byz_lat_latin_quarter_taxed: "Les marchands des alliés par alliance occupent un quartier sur la Corne d'Or et paient l'intégralité des douanes."
 STATIC_MODIFIER_NAME_cc_byz_lat_privileges_in_romania: "Privilèges en Roumanie"
 STATIC_MODIFIER_DESC_cc_byz_lat_privileges_in_romania: "Nos marchands détiennent un quartier à Constantinople et y commercent sans droits de douane."
 STATIC_MODIFIER_NAME_cc_byz_lat_union_sponsors: "Sponsors de l'Union"
 STATIC_MODIFIER_DESC_cc_byz_lat_union_sponsors: "Nos alliés cathologiques plaident la cause de l'union des Églises à la cour papale."
 STATIC_MODIFIER_NAME_cc_byz_lat_crusade_preparations: "La croisade assermentée"
 STATIC_MODIFIER_DESC_cc_byz_lat_crusade_preparations: "Nous et nos alliés catholiques par alliance avons juré une expédition commune. Chevaliers et levies sont en train d'être rassemblés."
 STATIC_MODIFIER_NAME_cc_byz_lat_western_kinship: "Parenté avec l'Occident"
 STATIC_MODIFIER_DESC_cc_byz_lat_western_kinship: "Deux maisons régnantes, l'une grecque et l'autre latine, se considèrent désormais comme membres d'une même famille."
 STATIC_MODIFIER_NAME_cc_byz_lat_western_friendship: "Des amis en Occident"
 STATIC_MODIFIER_DESC_cc_byz_lat_western_friendship: "Le mariage a laissé une amitié durable avec une cour occidentale."
 STATIC_MODIFIER_NAME_cc_byz_lat_dowager_court: "La cour de la douairière"
 STATIC_MODIFIER_DESC_cc_byz_lat_dowager_court: "L'impératrice latine est restée à Constantinople après le déclin de sa famille, et des envoyés occidentaux lui rendent encore visite."

 # .1 The empress arrives
 cc_byz_latin.1.title: "L'impératrice latine"
 cc_byz_latin.1.desc: "La mariée de [cc_lat_partner.GetName] est arrivée à Constantinople avec ses dames, ses chapelains et un confesseur. Le Patriarche demande si elle sera reçue dans l'Église orthodoxe et si on lui donnera un nom grec, comme Bertha de Sulzbach devint Irène. Sa propre maison s'attend à ce qu'elle conserve son rite.\n\nQuelle que soit la décision prise, elle sera lue à la cour de son père comme une déclaration de la manière dont nous considérons la situation."
 cc_byz_latin.1.a: "Elle prend un nom et une confession orthodoxes."
 cc_byz_latin.1.b: "Elle conserve son rite. Ouvrir une chapelle latine à Blachernae."
 cc_byz_latin.1.c: "Le patriarche les marie ; son confesseur reste, en privé."

 # .11 Western branch: our princess at their court
 cc_byz_latin.11.title: "Une princesse en Occident"
 cc_byz_latin.11.desc: "[cc_lat_princess.GetName] has reached the court of [cc_lat_partner.GetName] with her household, her icons and an Orthodox chaplain. Her new family expects her to be received into the Roman Church before the coronation. The Patriarch has written to remind her that she is a daughter of the purple.

What she decides will be read in both capitals as our decision."
 cc_byz_latin.11.a: "Elle est reçue dans l'Église romaine."
 cc_byz_latin.11.b: "Elle conserve sa foi et son aumônier."
 cc_byz_latin.11.c: "Leur rite en public, le sien en privé, et une dot plus importante."

 # .12 Western branch: what she carries west
 cc_byz_latin.12.title: "Ce que la princesse a apporté en Occident"
 cc_byz_latin.12.desc: "[cc_lat_princess.GetName] has settled at the court of [cc_lat_partner.GetName] and asks what more she may bring from home. Sophia Palaiologina took the double-headed eagle and the ceremonial of the Sacred Palace to Moscow, and her husband's court was never the same. Greek scholars followed every Byzantine embassy into Italy and many did not come back.

She could take teachers and books, the forms of the palace, or simply write home often."
 cc_byz_latin.12.a: "Envoyer des savants et des manuscrits avec sa maison."
 cc_byz_latin.12.b: "Lui laisser le cérémonial du Palais sacré."
 cc_byz_latin.12.c: "Lire ses lettres comme des dépêches."

 # .2 Latin knights
 cc_byz_latin.2.title: "Chevaliers latins à la cour"
 cc_byz_latin.2.desc: "[cc_lat_partner.GetName] a envoyé une compagnie de chevaliers pour servir l'empereur, en marque d'alliance. Ils sont lourdement armés, très coûteux et méprisent tout ce qui est grec. Manuel Comnène appréciait ces hommes et ses archontes ne lui ont jamais pardonné. Andronique II a engagé les Catalans et a passé la décennie suivante à les combattre.\n\nLe capitaine de la compagnie demande un contrat. Ses hommes accepteraient un tournoi en leur honneur comme alternative moindre."
 cc_byz_latin.2.a: "Les prendre à son service."
 cc_byz_latin.2.b: "Organiser plutôt un tournoi dans l'Hippodrome."
 cc_byz_latin.2.c: "Les remercier et les renvoyer chez eux."

 # .21 The company's pay
 cc_byz_latin.21.title: "La solde de la compagnie"
 cc_byz_latin.21.desc: "Le contrat de la compagnie latine est arrivé à son terme et son capitaine a présenté les comptes. Le montant est plus élevé que ce que quiconque se rappelle avoir accepté. S'il n'est pas payé, ses hommes s'en chargeront eux-mêmes, comme les Catalans l'ont fait en Thrace."
 cc_byz_latin.21.a: "Payer la totalité et renouveler le contrat."
 cc_byz_latin.21.b: "Les payer et les raccompagner aux navires."
 cc_byz_latin.21.c: "Le compte est frauduleux. Ne payez rien."

 # .3 Merchant privileges
 cc_byz_latin.3.title: "Les privilèges des marchands"
 cc_byz_latin.3.desc: "Des marchands de [cc_lat_partner.GetName] ont suivi le mariage jusqu'à Constantinople. Leur envoyé demande un quartier sur la Corne d'Or et l'exemption des douanes, selon les termes qu'Alexios Ier avait accordés à Venise en 1082.\n\nLes privilèges vénitiens ont permis d'acquérir une flotte quand l'empire en avait besoin. Ils ont également coûté au trésor ses revenus douaniers pendant deux siècles et ont placé le commerce de la ville entre des mains étrangères."
 cc_byz_latin.3.a: "Accorder le quartier et l'exemption."
 cc_byz_latin.3.b: "Accorder le quartier. Les douanes restent en vigueur."
 cc_byz_latin.3.c: "Les coutumes de Constantinople ne sont pas un cadeau de mariage."

 # .4 The Pope's letter
 cc_byz_latin.4.title: "Une lettre de Rome"
 cc_byz_latin.4.desc: "Le Pape a écrit pour nous féliciter du mariage, et pour observer que l'union de maisons est un bon début pour l'union des églises. [cc_lat_partner.GetName] a fait savoir qu'elle partageait cet espoir.\n\nLa lettre nous demande de recevoir des légats papaux."
 cc_byz_latin.4.desc_progress: "Le Pape a écrit pour dire que notre mariage avec [cc_lat_partner.GetName] lui donne espoir quant à l'union actuellement en discussion. Nos alliés proposent d'en plaider la cause à la cour papale, ce qui aiderait à Rome et serait remarqué à Constantinople."
 cc_byz_latin.4.desc_received: "Le Pape a écrit pour nous remercier. Un empereur romain marié à une maison royale catholique, et en communion avec Rome, est ce que la papauté souhaite depuis deux cents ans. [cc_lat_partner.GetName] a ajouté ses propres félicitations."
 cc_byz_latin.4.desc_repudiated: "Le Pape a écrit pour dire que notre répudiation de l'union déshonore le mariage. [cc_lat_partner.GetName] est embarrassée devant Rome et souhaite un geste de notre part."
 cc_byz_latin.4.desc_hellenic: "Le Pape a écrit à [cc_lat_partner.GetName], et non à nous, demandant comment une maison catholique peut rester liée par alliance à une cour revenue aux anciens dieux. Nos alliés nous ont transmis la lettre et attendent une réponse."
 cc_byz_latin.4.a: "Recevoir les légats."
 cc_byz_latin.4.b: "Un mariage n'est pas un conseil."
 cc_byz_latin.4.c: "Laisser nos alliés par alliance s'exprimer sur l'union."
 cc_byz_latin.4.d: "Leur demander de ne pas s'immiscer dans les affaires de l'Église."
 cc_byz_latin.4.e: "Remercier Sa Sainteté."
 cc_byz_latin.4.f: "Envoyer des cadeaux pour adoucir la situation."
 cc_byz_latin.4.g: "La répudiation est maintenue."
 cc_byz_latin.4.h: "Envoyer de l'or et ne rien dire sur les dieux."
 cc_byz_latin.4.i: "Nos dieux sont notre propre affaire."

 # .5 The crusade proposal
 cc_byz_latin.5.title: "La proposition de croisade"
 cc_byz_latin.5.desc: "[cc_lat_partner.GetName] propose une expédition commune contre [cc_lat_target.GetName] : ses chevaliers par mer, nos armées par terre, pour récupérer les provinces prises par les Turcs et les Arabes. Chaque mariage occidental au sein de la dynastie a apporté une proposition de ce genre.\n\nLa dernière croisade venue en Orient, en 1204, s'est approprié Constantinople à la place."
 cc_byz_latin.5.a: "Prendre la croix avec eux."
 cc_byz_latin.5.b: "Demander plutôt de l'or pour les murs."
 cc_byz_latin.5.c: "Nous nous souvenons de 1204. Refuser."

 # .6 The settlement
 cc_byz_latin.6.title: "Le mariage, dix ans plus tard"
 cc_byz_latin.6.desc_kin: "Dix ans après le mariage, [cc_lat_partner.GetName] et Constantinople se comportent comme une seule famille. Les envoyés voyagent sans cérémonie, les princes des deux maisons sont parrains des enfants de l'autre, et les cours occidentales considèrent une insulte envers l'un comme une insulte envers les deux."
 cc_byz_latin.6.desc_friends: "Dix ans après le mariage, les relations avec [cc_lat_partner.GetName] sont bonnes. Aucune des deux cours n'a satisfait toutes les demandes de l'autre, et aucune n'a de grief sérieux."
 cc_byz_latin.6.desc_cool: "Dix ans après le mariage, les relations avec [cc_lat_partner.GetName] sont correctes mais sans chaleur. Trop de requêtes ont été refusées des deux côtés. L'impératrice est respectée dans le palais mais a peu d'influence à l'extérieur."
 cc_byz_latin.6.desc_kin_west: "Dix ans après le mariage, [cc_lat_partner.GetName] et Constantinople se comportent comme une seule famille. [cc_lat_princess.GetName] est la figure la plus influente à la cour de son époux après le roi, et ses enfants hériteront d'un droit sur deux couronnes."
 cc_byz_latin.6.desc_friends_west: "Dix ans après le mariage, les relations avec [cc_lat_partner.GetName] sont bonnes. [cc_lat_princess.GetName] est respectée à leur cour, et ses lettres arrivent toujours chaque saison."
 cc_byz_latin.6.desc_cool_west: "Dix ans après le mariage, les relations avec [cc_lat_partner.GetName] sont correctes mais sans chaleur. [cc_lat_princess.GetName] est bien traitée à leur cour mais n'y a guère son mot à dire."
 cc_byz_latin.6.a: "Deux maisons, une seule famille."
 cc_byz_latin.6.b: "Une amitié qui vaut la peine d'être préservée."
 cc_byz_latin.6.c: "Au moins, le mariage tient."
 cc_byz_latin.6.d: "Renvoyer la maison latine chez elle."

 # .90 The partnership ends
 cc_byz_latin.90.title: "La fin de l'alliance latine"
 cc_byz_latin.90.desc: "[cc_lat_partner.GetName] n'est plus le partenaire qu'il était lors du mariage : il a perdu son rang parmi les grandes puissances, a quitté l'Église romaine, ou le lien matrimonial entre nos maisons a expiré. Les arrangements qui en dépendaient sont dénoués."
 cc_byz_latin.90.desc_dowager: "[cc_lat_partner.GetName] n'est plus le partenaire qu'il était lors du mariage. L'impératrice a choisi de rester à Constantinople, et les amitiés qu'elle s'est faites à la cour restent avec elle."
 cc_byz_latin.90.desc_dowager_west: "[cc_lat_partner.GetName] n'est plus le partenaire qu'il était lors du mariage. La princesse que nous y avons envoyée est toujours honorée à cette cour, et les amitiés qu'elle y a nouées perdurent."
 cc_byz_latin.90.desc_war: "Nous sommes en guerre avec [cc_lat_partner.GetName]. La maison de l'impératrice est surveillée dans le palais, et les arrangements conclus lors du mariage sont nuls."
 cc_byz_latin.90.a: "Elle reste, et garde ses amis."
 cc_byz_latin.90.b: "Qu'il en soit ainsi."
 cc_byz_latin.90.c: "Renvoyer la maison latine chez elle."
 cc_byz_latin.90.desc_bride_died: "L'impératrice [cc_lat_their_spouse.GetName] est décédée. Sa maison retourne chez [cc_lat_partner.GetName], et les arrangements conclus lors de son mariage prennent fin avec elle."
 cc_byz_latin.90.desc_bride_died_west: "[cc_lat_princess.GetName] est décédée à la cour de [cc_lat_partner.GetName]. Sa maison rentre chez elle, et les arrangements conclus lors de son mariage prennent fin avec elle."
 cc_byz_latin.90.desc_widowed: "Avec le décès de [cc_lat_our_spouse.GetName], le mariage qui unissait notre maison à celle de [cc_lat_partner.GetName] a pris fin. L'impératrice [cc_lat_their_spouse.GetName] est veuve à Constantinople, et le nouveau règne ne doit rien à sa famille."
 cc_byz_latin.90.desc_widowed_west: "Avec le décès de [cc_lat_their_spouse.GetName], [cc_lat_princess.GetName] est veuve à la cour de [cc_lat_partner.GetName]. Le mariage qui unissait les deux maisons a pris fin, et les successeurs de son époux ne nous doivent rien."
 cc_byz_latin.90.desc_succession: "Le mariage demeure, mais [cc_lat_our_spouse.GetName] et [cc_lat_their_spouse.GetName] ne sont plus tous deux dans la ligne de succession de leurs trônes. Leurs enfants n'hériteront pas de deux couronnes, et les arrangements fondés sur cette perspective sont dénoués."
