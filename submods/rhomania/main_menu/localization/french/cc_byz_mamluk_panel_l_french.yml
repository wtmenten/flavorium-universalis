l_french:
 # The Levantine Confrontation: situation panel, map legend, actions and payload modifiers.
 #
 # A SEPARATE FILE FROM cc_byz_mamluk_l_english.yml, deliberately. That file is the event
 # thread's text and is stable; everything here arrived with the panel and the action set, which
 # are the parts most likely to be revised again after the next playtest.
 #
 #
 # VOICE. The card bodies are the court speaking, not the manual. Every number, threshold and
 # mechanical consequence lives in a _INFO key behind the card's info icon instead. The first
 # version of this file put the arithmetic in the body and read like a briefing paper, which is
 # the recurring failure the whole submod was audited for: describing the system to the player
 # rather than describing the world to the emperor.
 #
 # The _TT keys on individual bars and flags stay factual, because those ARE the tooltip layer.

 # ---- Panel header ----
 CC_BYZ_MAM_HDR_EMPIRE: "Empire"
 CC_BYZ_MAM_HDR_CAIRO: "Le Caire"
 CC_BYZ_MAM_PHASE_COLD: "La frontière froide"
 CC_BYZ_MAM_PHASE_COLD_TT: "Personne n'a rien déclaré. Les envoyés font l'aller-retour, les pèlerins sont comptés et taxés, les émirs frontaliers prennent de l'argent des deux côtés sans y voir de contradiction, et on se dispute les lieux saints dans des lettres qui mettent une saison à arriver.\n\nC'est ainsi que les guerres ont été évitées pendant cent ans d'affilée."
 CC_BYZ_MAM_PHASE_WAR: "La guerre de la Pentarchie"
 CC_BYZ_MAM_PHASE_WAR_TT: "Les lettres ont cessé. Ce qui est décidé maintenant le sera par quiconque se tiendra dans les lieux saints quand tout cela sera terminé."

 # ---- Card: the two positions ----
 CC_BYZ_MAM_CARD_STANDING: "Position au Levant"
 CC_BYZ_MAM_CARD_STANDING_DESC: "Deux cours, une frontière, et aucun accord nulle part le long de celle-ci sur qui possède quoi.\n\nAucun camp ne perd ce que l'autre gagne. La frontière mesure huit cents milles de long et ce qui se passe à Alep n'a jamais rien dit à personne sur ce qui se passe à Siwa."
 CC_BYZ_MAM_CARD_STANDING_INFO: "Deux compteurs indépendants, allant chacun de 0 à 100.\n\n#T Position de l'Empire#! augmente avec la garde obtenue, les émirs frontaliers conservés, les patriarches orientaux protégés et les conditions acceptées pendant que Le Caire est distrait.\n\n#T Position du Caire#! augmente lorsque la frontière est abandonnée, que les hiérarchies orientales sont laissées à leurs propres arrangements, ou que le sultan a le temps d'installer ses émirs.\n\nCelui qui atteint 100 met fin à la confrontation en faveur de cette cour. Cela se termine également si l'un des deux pays cesse d'exister, ou en atteignant l'année 1650."
 CC_BYZ_MAM_BAR_EMPIRE: "La position de l'Empire"
 CC_BYZ_MAM_BAR_EMPIRE_TT: "Augmente lorsque la garde est acquise, les émirs conservés, les patriarches protégés et les conditions acceptées pendant que le Caire est distrait. À 100, la confrontation se termine en faveur de l'empire."
 CC_BYZ_MAM_BAR_CAIRO: "La position du Caire"
 CC_BYZ_MAM_BAR_CAIRO_TT: "Augmente lorsque la frontière est abandonnée, que les hiérarchies orientales sont laissées à leurs propres arrangements, ou que le sultan a le temps d'installer ses émirs. À 100, la confrontation se termine en faveur du Caire."
 CC_BYZ_MAM_BAR_FOOTER: "Le premier à atteindre 100 met fin à la confrontation. Elle prend également fin si l'une des deux cours cesse d'exister, ou en 1650."

 # ---- Card: pressure and standing arrangements ----
 CC_BYZ_MAM_CARD_PRESSURE: "Pression levantine"
 CC_BYZ_MAM_CARD_PRESSURE_DESC: "À quel point l'empire pèse de tout son poids, et le Caire peut le ressentir depuis Damas.\n\nUn empereur qui a passé trente ans à fortifier la frontière a avancé un argument, et il constatera que le sultan a cessé de répondre aux lettres concernant la garde. Il existe une sorte de patience qui achète plus que n'importe quelle garnison, et qui ressemble exactement à de la faiblesse vue de l'intérieur."
 CC_BYZ_MAM_CARD_PRESSURE_INFO: "Varie de -5 à 5.\n\nUne pression élevée ouvre les branches militaires du fil et ferme les branches diplomatiques. #T Négocier la garde des lieux saints nécessite une pression égale ou inférieure à 0.#!\n\nAugmentée par la fortification de la frontière, le fait de faire valoir la revendication patriarcale et l'affirmation de la garde par droit. Diminuée par les ambassades, le paiement des taxes coutumières et l'acceptation des conditions.\n\nLes drapeaux ci-dessous enregistrent les accords déjà conclus. Ils sont lus par des événements ultérieurs du fil et par l'arbre de missions."
 CC_BYZ_MAM_FLAG_CONDOMINIUM: "La garde est partagée par accord écrit"
 CC_BYZ_MAM_FLAG_CONDOMINIUM_TT: "Les deux cours ont signé. Les lieux saints sont administrés conjointement, les pèlerins voyagent selon un tarif établi, et aucune des parties n'a renoncé à sa revendication fondamentale.\n\nPlusieurs empereurs ont pensé que c'était le meilleur résultat possible. C'est une véritable conclusion et non une consolation."
 CC_BYZ_MAM_FLAG_PATRIARCHS_BACKED: "Les hiérarques d'Orient sont sous protection impériale"
 CC_BYZ_MAM_FLAG_PATRIARCHS_BACKED_TT: "Ils répondent à Constantinople et c'est connu à Le Caire. Cela a beaucoup de valeur dans l'argument sur la garde, et cela fait de toute représaille contre eux l'affaire de l'empire."
 CC_BYZ_MAM_FLAG_PATRIARCHS_SOLD: "Les hiérarques d'Orient ont été laissés à eux-mêmes"
 CC_BYZ_MAM_FLAG_PATRIARCHS_SOLD_TT: "Ils ont conclu leur propre arrangement avec le sultan, comme ils avaient toutes les raisons de le faire. La prétention de l'empire à parler pour l'Orient est plus difficile à affirmer maintenant que l'Orient a cessé de l'attendre."
 CC_BYZ_MAM_FLAG_WAR_DECLARED: "La guerre de la Pentarchie a commencé"
 CC_BYZ_MAM_FLAG_WAR_DECLARED_TT: "La revendication est appuyée par la force. Les voies diplomatiques sont fermées tant que cela durera."

 # ---- Card: the eastern seats ----
 # DUAL READING. These three cities carry the eastern patriarchates AND three of vanilla's
 # Hellenic holy sites, and at the same locations: the Serapeum is at Alexandria, the sanctuary
 # at Daphne is at Antioch. An emperor who has taken up the old rites wants the same three
 # cities for a different reason, so the copy names what is in them rather than naming a church.
 CC_BYZ_MAM_CARD_SEATS: "Les sièges de l'Est"
 CC_BYZ_MAM_CARD_SEATS_DESC: "Jérusalem, Antioche, Alexandrie.\n\nQuoi que l'empire croie en ce siècle, ce sont les trois villes qu'il n'a jamais cessé de croire être les siennes. Il y a eu un différend à leur sujet avant même qu'il n'y ait un différend sur quoi que ce soit d'autre, et les hommes qui les détiennent aujourd'hui l'ont hérité d'hommes qui l'avaient hérité."
 CC_BYZ_MAM_CARD_SEATS_INFO: "Avec Constantinople et Rome, ces cinq-là forment la pentarchie, et détenir les cinq est ce qu'exige la réparation du schisme dans la version vanilla. Rome s'obtient via l'exarchat ; ces trois-là s'obtiennent via cette confrontation.\n\nLe statut de possession est lu à partir de la propriété, il est donc vrai quelle que soit la religion de l'empire. Selon les anciens rites, les trois mêmes villes abritent le Serapeum d'Alexandrie et le sanctuaire de Daphné aux portes d'Antioche."
 CC_BYZ_MAM_SEAT_JERUSALEM: "Jérusalem"
 CC_BYZ_MAM_SEAT_ANTIOCH: "Antioche"
 CC_BYZ_MAM_SEAT_ALEXANDRIA: "Alexandrie"
 CC_BYZ_MAM_SEAT_HELD: "Détenu"
 CC_BYZ_MAM_SEAT_NOT_HELD: "Non détenu"

 # ---- Map colouring ----
 CC_BYZ_MAM_LEGEND_EMPIRE: "Impérial"
 CC_BYZ_MAM_LEGEND_CAIRO: "Mamelouk"
 cc_byz_mam_map_tt_empire: "Terre impériale, et la frontière se trouve quelque part au sud d'ici."
 cc_byz_mam_map_tt_cairo: "Celle du sultan, et garnisonnée comme telle."
 cc_byz_mam_map_tt_other: "Aucune des deux cours ne les détient. Aucune des deux n'a jamais laissé cela l'empêcher d'en débattre."

 # ---- Actions ----
 cc_byz_mam_send_embassy: "Envoyer une ambassade au Caire"
 cc_byz_mam_send_embassy_desc: "Des cadeaux, une lettre sur les taxes des pèlerins, et un mois au Caire à découvrir ce qui inquiète le sultan en cette décennie. C'est rarement ce que la dernière ambassade a rapporté.\n\nRien n'est réglé par cela. Les choses sont réglées plus tard, par ceux qui s'y sont rendus."
 cc_byz_mam_subsidise_faction: "Subventionner une faction au Caire"
 cc_byz_mam_subsidise_faction_desc: "Les émirs se querellent pour la succession comme à leur habitude, et l'argent arrivant discrètement du côté perdant empêche une querelle habituelle de se résoudre.\n\nUn sultan qui gère ses propres émirs ne gère pas la frontière. Personne ne saura jamais d'où venait l'argent, ce qui est le but, et aussi pourquoi cela n'achète rien à l'empire que l'on puisse voir."
 cc_byz_mam_negotiate_custody: "Négocier la garde des Lieux Saints"
 cc_byz_mam_negotiate_custody_desc: "Administration conjointe, un tarif établi pour les pèlerins, et les deux cours signant un document dans lequel aucune des deux ne concède quoi que ce soit.\n\nCela a déjà été fait et cela a tenu pendant deux générations, ce qui, dans cette partie du monde, est une longue paix."
 cc_byz_mam_press_claim: "Faire valoir la revendication patriarcale"
 cc_byz_mam_press_claim_desc: "L'empereur déclare, publiquement et longuement, que les sièges orientaux sont sous sa protection et l'ont toujours été.\n\nChaque mot est vrai et chaque mot est entendu au Caire comme l'ouverture de quelque chose. Les émirs du sultan lui ont demandé pourquoi ils payaient pour une armée ; l'empereur a maintenant répondu pour lui."

 # ---- Payload modifiers ----
 STATIC_MODIFIER_NAME_cc_byz_emirs_retained: "Les émirs frontaliers conservés"
 STATIC_MODIFIER_DESC_cc_byz_emirs_retained: "Ils tiennent la ligne exactement tant que l'argent dure. C'est ce qu'on obtient en achetant une frontière, et c'est pourquoi on l'achète à nouveau."
 STATIC_MODIFIER_NAME_cc_byz_syrian_garrisons: "La garnison des villes frontalières"
 STATIC_MODIFIER_DESC_cc_byz_syrian_garrisons: "Payé, fortifié et ravitaillé. Personne n'aura besoin d'être soudoyé l'année prochaine, ce qui justifie entièrement la dépense."
 STATIC_MODIFIER_NAME_cc_byz_frontier_left_alone: "La frontière livrée à elle-même"
 STATIC_MODIFIER_DESC_cc_byz_frontier_left_alone: "Les hommes qui y vivent le défendent mieux que l'empire ne l'a jamais fait. Ils répondent également à leur propre peuple en le faisant, et le fisc n'a plus aucune nouvelle d'eux."
 STATIC_MODIFIER_NAME_cc_byz_cairo_pressed: "L'avantage exploité"
 STATIC_MODIFIER_DESC_cc_byz_cairo_pressed: "L'empire a bougé pendant que le Caire se querellait avec lui-même, et on a vu qu'il avait bougé le premier. Être vu représentait la moitié du travail."
 STATIC_MODIFIER_NAME_cc_byz_cairo_divided: "Le Caire divisé"
 STATIC_MODIFIER_DESC_cc_byz_cairo_divided: "La querelle continue, financée. Personne au Caire ne sait qui la finance, ce qui est le but, et aussi pourquoi elle n'apporte aucune gloire."
 STATIC_MODIFIER_NAME_cc_byz_levantine_terms: "Conditions avec le Caire"
 STATIC_MODIFIER_DESC_cc_byz_levantine_terms: "Un arrangement qui a convenu aux deux cours lors d'une année particulière. Les caravanes circulent. Les deux parties savent précisément ce que cela vaut et aucune ne le dit."

 # ---- Action cooldowns ----
 STATIC_MODIFIER_NAME_cc_byz_mam_embassy_sent: "Ambassade au Caire"
 STATIC_MODIFIER_DESC_cc_byz_mam_embassy_sent: "Une ambassade est au Caire, ou l'y était récemment. Une seconde maintenant serait interprétée comme de l'anxiété."
 STATIC_MODIFIER_NAME_cc_byz_mam_faction_bought: "Une faction achetée"
 STATIC_MODIFIER_DESC_cc_byz_mam_faction_bought: "L'argent circule déjà. Un second paiement via les mêmes canaux serait tracé, et c'est le traçage qui serait le désastre, non le paiement."
 STATIC_MODIFIER_NAME_cc_byz_mam_claim_pressed: "La revendication affirmée"
 STATIC_MODIFIER_DESC_cc_byz_mam_claim_pressed: "Cela a été dit récemment et longuement. Le redire bientôt ne prouverait que le fait de le dire ne change rien."

 # ---- Opinion ----
 cc_byz_opinion_levantine_terms: "Conditions sur les Lieux Saints"
