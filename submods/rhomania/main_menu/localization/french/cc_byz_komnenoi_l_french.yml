 # Decision
 cc_byz_kom_raise_the_question_decision.title: "La question comnène"
 cc_byz_kom_raise_the_question_decision.title.entry: "La question comnène"
 cc_byz_kom_raise_the_question_decision.desc: "Les Grands Comnènes de [cc_kom_tre.GetName] se sont proclamés Empereurs des Romains depuis 1204. Deux cours revendiquent un seul titre, et [target_character.GetName] peut ouvrir la question : par une négociation aboutissant à une union des couronnes, ou en préparant le terrain pour s'emparer de la seconde couronne par la force.\n\nLa question s'étend sur environ une décennie. Les choix effectués tout au long du processus augmentent l' #Y Accord#! (les chances d'une union ou d'une acclamation pure et simple) et le #Y Prétexte#! (la durée d'une revendication de guerre et la réduction du coût d'annexion de Trébizonde lors du traité de paix). Elle ne peut être ouverte qu'une seule fois."
 cc_byz_kom_raise_the_question_decision.desc.entry: "Les Grands Comnènes de Trébizonde se sont proclamés Empereurs des Romains depuis 1204. Ouvrez la question de la seconde couronne, par la négociation ou par un prétexte. Cela s'étend sur environ une décennie et ne peut être ouvert qu'une seule fois."
 cc_byz_kom_raise_the_question_decision.a: "Envoyer à Trébizonde."
 cc_byz_kom_raise_the_question_decision.a.entry: "Envoyer à Trébizonde."

 # Score tooltips
 cc_byz_kom_accord_plus1_tt: "#Y Accord#! #G +1#!"
 cc_byz_kom_accord_plus2_tt: "#Y Accord#! #G +2#!"
 cc_byz_kom_accord_plus3_tt: "#Y Accord#! #G +3#!"
 cc_byz_kom_accord_minus1_tt: "#Y Accord#! #R -1#!"
 cc_byz_kom_pretext_plus1_tt: "#Y Prétexte#! #G +1#!"
 cc_byz_kom_pretext_plus2_tt: "#Y Prétexte#! #G +2#!"
 cc_byz_kom_shortcut_tt: "La question passe directement au règlement, sautant l'étape suivante"
 cc_byz_kom_roll_acclamation_tt: "#G Acclamation :#! [cc_kom_tre.GetName] est annexé"
 cc_byz_kom_roll_union_tt: "#G Union :#! [cc_kom_tre.GetName] nous rejoint dans une union personnelle, avec nous comme partenaire senior"
 cc_byz_kom_roll_refused_tt: "#R Refus :#! l'alliance prend fin, les deux cours subissent un malus d'opinion et nous obtenons une revendication de 15 ans sur la couronne de [cc_kom_tre.GetName]"
 cc_byz_kom_human_tre_decides_tt: "Le souverain de [cc_kom_tre.GetName] décide s'il accepte"
 cc_byz_kom_pretext_outcome_tt: "Nous obtenons une revendication de guerre sur la couronne de [cc_kom_tre.GetName] pour 10 ans, plus la moitié de notre #Y Prétexte#!. L'alliance prend fin. Avec un #Y Prétexte#! de 6 ou plus, nos armées bénéficient également d'un bonus de 10 ans"
 cc_byz_kom_tre_accept_tt: "Notre couronne est jointe à celle de Constantinople. Les archontes tranchent entre une union personnelle et une annexion complète ; plus Byzance a établi d' #Y Accords#!, plus l'annexion est probable"
 cc_byz_kom_tre_refuse_tt: "L'alliance avec Byzance prend fin et Byzance obtient une revendication de 15 ans sur notre couronne"
 cc_byz_kom_no_second_emperor_tt: "Trébizonde n'existe pas, est notre sujet (non un tributaire), ou est notre partenaire junior dans une union"

 # Peace treaties and CB
 cc_byz_cb_reunify_pontus: "Réunifier le Pont"
 cc_byz_cb_reunify_pontus_desc: "La couronne de Trébizonde est un commandement provincial qui a conservé son titre après 1204. L'empereur le revendique."
 cc_byz_cb_reunify_pontus_PROV: "Réunifier le Pont"
 cc_byz_kom_reunify: "Réunifier le Pont"
 cc_byz_kom_reunify_desc: "Annexer Trébizonde. Moins coûteux selon la quantité de #Y Prétexte#! accumulée avant la guerre."
 cc_byz_kom_reunify_tt: "Trébizonde est annexée"
 cc_byz_kom_despotate: "Créer le Despotat du Pont"
 cc_byz_kom_despotate_desc: "Faire de Trébizonde un vassal sous son propre dirigeant, avec le titre de Despote au lieu d'Empereur. Moins coûteux selon l'importance du #Y Prétexte#! établi avant la guerre."
 cc_byz_kom_pretext_discount_desc: "Prétexte Comnène"

 # Opinion modifiers
 cc_byz_kom_courted: "Courtisé par l'Empereur"
 cc_byz_kom_honoured: "Titre de Despote octroyé"
 cc_byz_kom_slighted: "Dignité impériale offensée"
 cc_byz_kom_suitor_courted: "Approché au sujet de Trébizonde"
 cc_byz_kom_spurned: "L'union refusée"
 cc_byz_kom_pretext_proclaimed: "Couronne déclarée usurpation"

 # Country modifiers
 STATIC_MODIFIER_NAME_cc_byz_kom_imperial_aid: "Troupes impériales à la frontière"
 STATIC_MODIFIER_DESC_cc_byz_kom_imperial_aid: "Un tagma byzantin tient la frontière pontique contre les Turkmènes."
 STATIC_MODIFIER_NAME_cc_byz_kom_troops_abroad: "Tagma dans le Pont"
 STATIC_MODIFIER_DESC_cc_byz_kom_troops_abroad: "Les soldats envoyés pour défendre Trébizonde ne sont pas disponibles ici."
 STATIC_MODIFIER_NAME_cc_byz_kom_acclaimed: "Acclamé à Trébizonde"
 STATIC_MODIFIER_DESC_cc_byz_kom_acclaimed: "Trébizonde a accepté l'empereur sans guerre. Il n'y a plus qu'un seul empereur romain."
 STATIC_MODIFIER_NAME_cc_byz_kom_crowns_joined: "Deux Couronnes, Un Empereur"
 STATIC_MODIFIER_DESC_cc_byz_kom_crowns_joined: "L'empereur de Constantinople porte également la couronne de Trébizonde."
 STATIC_MODIFIER_NAME_cc_byz_kom_turned_away: "Constantinople refusée"
 STATIC_MODIFIER_DESC_cc_byz_kom_turned_away: "Trébizonde a refusé l'union avec Byzance et courtise d'autres alliés."
 STATIC_MODIFIER_NAME_cc_byz_kom_just_war: "Une revendication juste"
 STATIC_MODIFIER_DESC_cc_byz_kom_just_war: "La revendication de la couronne de Trébizonde a été préparée pendant des années, et l'armée y croit."

 # .1
 cc_byz_komnenoi.1.title: "La question comnène"
 cc_byz_komnenoi.1.desc: "Depuis 1204, deux cours ont nommé leur souverain Empereur des Romains : la nôtre et celle des Grands Comnènes à [cc_kom_tre.GetName]. L'empire n'a jamais formellement concédé ce point et Trébizonde n'a jamais abandonné ce titre.\n\nLe conseil souhaite régler la question. Une union des deux couronnes mettrait fin au litige. Une guerre le ferait également. Dans les deux cas, la première étape est une ambassade."
 cc_byz_komnenoi.1.desc_family: "Le souverain de [cc_kom_tre.GetName] appartient à notre propre maison. Pour la première fois depuis 1204, les deux titres impériaux sont détenus par des membres d'une même famille, et le conseil y voit une opportunité qui pourrait ne pas se représenter.\n\nUne union des couronnes pourrait être organisée comme un arrangement familial. Cela nécessitera toujours une ambassade, et ce, rapidement."
 cc_byz_komnenoi.1.desc_hostility: "Les relations avec [cc_kom_tre.GetName] se sont détériorées au point que le conseil ne considère plus les Comnènes comme des alliés. Ils appellent toujours leur dirigeant Empereur des Romains, et plusieurs de nos ministres soutiennent désormais que ce titre devrait leur être repris par la force.\n\nD'autres souhaitent une dernière ambassade. Les deux groupes s'accordent sur le fait que la question doit être tranchée."
 cc_byz_komnenoi.1.desc_alliance: "[cc_kom_tre.GetName] est notre allié depuis des années et sa cour a une bonne opinion de nous. Le conseil propose d'utiliser cette bonne volonté pour soulever la vieille question : s'il doit y avoir deux empereurs romains.\n\nUne union des couronnes mettrait fin au litige sans guerre. Cela demandera des années d'ambassades et certains frais."
 cc_byz_komnenoi.1.desc_peril: "[cc_kom_tre.GetName] est en difficulté, avec une cour instable ou une guerre à sa frontière. Le conseil souligne qu'une Trébizonde faible pourrait accepter des conditions qu'une Trébizonde forte refuserait, et que l'empire peut offrir sa protection ou simplement attendre.\n\nQuoi qu'il en soit, il est temps de soulever la question des deux couronnes."
 cc_byz_komnenoi.1.a: "Envoyer des envoyés qui sauront d'abord écouter."
 cc_byz_komnenoi.1.b: "Il n'y a qu'un seul empire, et sa capitale est Constantinople."
 cc_byz_komnenoi.1.c: "Écrivez-leur comme à des membres de la famille."

 # .2
 cc_byz_komnenoi.2.title: "La cour pontique"
 cc_byz_komnenoi.2.desc: "Nos envoyés rapportent que le gouvernement de [cc_kom_tre.GetName] repose sur un petit conseil d'archontes, les grandes familles terriennes du Pont. Ils décident de ce que le Grand Comnène peut accepter, et ils sont ouverts à la persuasion.\n\nLes envoyés suggèrent des cadeaux, un mariage entre les deux maisons, ou un appel via l'Église. Un envoyé suggère une approche différente : créer un parti à la cour qui préférerait un empereur lointain à un empereur proche."
 cc_byz_komnenoi.2.a: "Cadeaux pour les archontes."
 cc_byz_komnenoi.2.b: "Proposer un mariage entre [cc_kom_byz_spouse.GetName] et [cc_kom_tre_spouse.GetName]."
 cc_byz_komnenoi.2.c: "Demander au Patriarche d'écrire au métropolite."
 cc_byz_komnenoi.2.d: "Former un parti à la cour."

 # .3
 cc_byz_komnenoi.3.title: "La frontière turkmène"
 cc_byz_komnenoi.3.desc: "Les tribus turkmènes dans les collines derrière [cc_kom_tre.GetName] pillent les vallées pontiques chaque été. La capacité de Trébizonde à tenir cette frontière est la raison principale de son indépendance actuelle, et sa cour le sait.\n\nUne aide à la frontière serait mémorisée. Un refus serait également mémémorisé, et une Trébizonde ayant perdu des hommes et des villages sera plus facile à gérer."
 cc_byz_komnenoi.3.desc_war: "[cc_kom_tre.GetName] est en guerre, et ses envoyés sont venus demander ce que Constantinople compte faire à ce sujet.\n\nUne aide immédiate serait mémorisée. Un refus le serait également, et une Trébizonde ayant perdu des hommes et des villages sera plus facile à gérer."
 cc_byz_komnenoi.3.a: "Envoyer un tagma vers l'est."
 cc_byz_komnenoi.3.b: "Payer pour les murs et la garnison."
 cc_byz_komnenoi.3.c: "Trébizonde peut tenir sa propre frontière."

 # .4
 cc_byz_komnenoi.4.title: "Fierté Comnène"
 cc_byz_komnenoi.4.desc: "Les négociations en sont venues à la question des titres. Le Grand Comnène ne deviendra pas un simple gouverneur, et notre conseil n'acceptera pas un second empereur.\n\nIl existe une position intermédiaire reconnue. Le titre de Despote arrive juste après l'empereur et a été accordé aux parents impériaux pendant deux siècles. L'offrir nous coûte un peu de prestige. Refuser d'offrir quoi que ce soit indique clairement où se dirigent les négociations."
 cc_byz_komnenoi.4.a: "Offrir le titre de Despote."
 cc_byz_komnenoi.4.b: "Ils doivent abandonner le style impérial."
 cc_byz_komnenoi.4.c: "Régler cela comme une affaire de famille."

 # .5
 cc_byz_komnenoi.5.title: "Prétendants rivaux"
 cc_byz_komnenoi.5.desc: "D'autres cours ont remarqué nos ambassades à [cc_kom_tre.GetName]. Des envoyés de l'étranger y sont arrivés avec leurs propres offres : privilèges commerciaux, alliances et mariages. Les archontes les écoutent tous.\n\nNous pouvons surenchérir, ou dénoncer publiquement les tractations de Trébizonde avec les étrangers."
 cc_byz_komnenoi.5.desc_suitor: "Des envoyés de [cc_kom_suitor.GetName] sont arrivés à [cc_kom_tre.GetName] avec des offres de privilèges commerciaux, d'alliance et de mariage. Les archontes sont à l'écoute.\n\nNous pouvons surenchérir, dénoncer publiquement les tractations de Trébizonde avec les étrangers, ou approcher [cc_kom_suitor.GetName] directement pour parvenir à un accord concernant le Pont."
 cc_byz_komnenoi.5.a: "Surenchérir."
 cc_byz_komnenoi.5.b: "Dénoncer les tractations de Trébizonde."
 cc_byz_komnenoi.5.c: "S'entendre avec [cc_kom_suitor.GetName]."

 # .6
 cc_byz_komnenoi.6.title: "Le règlement de Trébizonde"
 cc_byz_komnenoi.6.desc: "Après des années d'ambassades, le conseil doit décider comment régler la question des deux couronnes.\n\nNous pouvons formellement proposer une union. Si les archontes acceptent, un seul empereur portera les deux couronnes et, si notre prestige à Trébizonde est suffisamment élevé, ils pourraient simplement l'acclamer et mettre fin à l'existence de l'État séparé. S'ils refusent, l'alliance prend fin.\n\nOu nous pouvons déclarer la couronne de Trébizonde comme une usurpation et la revendiquer de plein droit.\n\n#Y Accord#! actuel : #Y [ROOT.GetCountry.MakeScope.GetVariable('cc_byz_kom_accord').GetValue|0]#!\n#Y Prétexte#! actuel : #Y [ROOT.GetCountry.MakeScope.GetVariable('cc_byz_kom_pretext').GetValue|0]#!"
 cc_byz_komnenoi.6.a: "Proposer l'union."
 cc_byz_komnenoi.6.b: "Déclarer leur couronne comme une usurpation."
 cc_byz_komnenoi.6.c: "Laissons la question là-dessus."

 # .20
 cc_byz_komnenoi.20.title: "La proposition de l'Empereur"
 cc_byz_komnenoi.20.desc: "Des envoyés de [cc_kom_emperor.GetName] ont présenté une proposition formelle : les couronnes de Constantinople et de Trébizonde réunies sous un seul empereur.\n\nSi nous acceptons, les archontes décideront des termes. Ils pourraient se contenter d'une union personnelle avec Constantinople comme partenaire senior, ou ils pourraient acclamer l'empereur sans réserve et mettre fin à l'existence de Trébizonde en tant qu'État distinct. Si nous refusons, l'alliance avec Constantinople prendra fin et l'empereur aura un droit sur notre couronne."
 cc_byz_komnenoi.20.a: "Nous acceptons."
 cc_byz_komnenoi.20.b: "Trébizonde a son propre empereur."

 # .21
 cc_byz_komnenoi.21.title: "Trébizonde accepte"
 cc_byz_komnenoi.21.desc: "La cour de [cc_kom_tre.GetName] a accepté l'union sur le principe. Les archontes se réunissent pour régler les modalités. Ils accepteront soit une union personnelle sous notre empereur, soit le proclameront directement comme leur propre souverain."
 cc_byz_komnenoi.21.a: "Nous attendons leur réponse."

 # .30
 cc_byz_komnenoi.30.title: "Acclamation à Trébizonde"
 cc_byz_komnenoi.30.desc: "Les archontes de [cc_kom_tre.GetName] ont acclaimed notre empereur comme leur propre souverain. La cour des Grands Comnènes est dissoute, ses terres deviennent des provinces de l'empire et, pour la première fois depuis 1204, il n'y a qu'un seul empereur romain."
 cc_byz_komnenoi.30.a: "Un seul empire."

 # .31
 cc_byz_komnenoi.31.title: "Deux Couronnes, Un Empereur"
 cc_byz_komnenoi.31.desc: "Les archontes de [cc_kom_tre.GetName] ont accepté une union personnelle. Trébizonde conserve sa propre cour et ses propres lois, et notre empereur est désormais également son souverain.\n\nL'intégration complète prendra des décennies. Les lois de l'union déterminent la rapidité avec laquelle cela peut se produire."
 cc_byz_komnenoi.31.a: "C'est un début."

 # .32
 cc_byz_komnenoi.32.title: "Trébizonde refuse"
 cc_byz_komnenoi.32.desc: "La cour de [cc_kom_tre.GetName] a rejeté l'union. Ses envoyés ont quitté Constantinople et l'alliance entre les deux cours est terminée. Des rapports indiquent que Trébizonde recherche déjà d'autres alliés.\n\nLe conseil note que ce refus donne à l'empire un droit sur la couronne de Trébizonde, pour quiconque souhaiterait le faire valoir."
 cc_byz_komnenoi.32.a: "Ils le regretteront."

 # .40
 cc_byz_komnenoi.40.title: "Une couronne usurpée"
 cc_byz_komnenoi.40.desc: "L'empereur a déclaré que la couronne de [cc_kom_tre.GetName] a été prise en 1204 par une famille n'y ayant aucun droit et qu'elle est détenue illégalement aujourd'hui. L'empire la revendique.\n\nL'alliance avec Trébizonde est terminée. L'armée est prête à faire valoir ce droit."
 cc_byz_komnenoi.40.a: "La couronne sera récupérée."

 # .50
 cc_byz_komnenoi.50.title: "Sous Une Seule Couronne"
 cc_byz_komnenoi.50.desc: "Les archontes se sont accordés sur une union personnelle. L'empereur de Constantinople gouverne désormais également Trébizonde, en tant que partenaire senior. Notre cour et nos lois restent les nôtres."
 cc_byz_komnenoi.50.a: "Qu'il en soit ainsi."

 # .51
 cc_byz_komnenoi.51.title: "La revendication de l'Empereur"
 cc_byz_komnenoi.51.desc: "[cc_kom_emperor.GetName] a déclaré que notre couronne était une usurpation et l'a revendiquée de plein droit. L'alliance est terminée, et une armée en provenance de Constantinople risque de suivre."
 cc_byz_komnenoi.51.a: "Mannez les murs."

 # .90
 cc_byz_komnenoi.90.title: "La question s'éteint"
 cc_byz_komnenoi.90.desc: "Les circonstances ont rattrapé les négociations avec Trébizonde. L'autre partie ne peut plus rien régler de son propre chef, ou les deux cours sont en guerre. Les ambassades sont rappelées et l'affaire est close."
 cc_byz_komnenoi.90.a: "Qu'il en soit ainsi."
 cc_byz_kom_needs_entry_tt: "Au moins une condition d'ouverture est remplie : une dynastie commune, une alliance ou un mariage avec de bonnes relations, une réputation diplomatique et un prestige élevés, une rivalité ou une inimitié, ou Trébizonde en difficulté (régence, instabilité ou guerre)"
