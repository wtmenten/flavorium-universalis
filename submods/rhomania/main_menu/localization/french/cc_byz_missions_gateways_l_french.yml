l_french:
 # Tasks added by the second structural pass: the four gateways, the new stones and spurs, and
 # the trigger tooltips that replace unlocalised engine fallbacks.
 #
 # Descriptions state the condition plainly in the first sentence, because a mission task the
 # player cannot work out how to complete is not content. Flavour goes second, never first.

 # ---- The four gateways ----
 # The State Restored used to open twelve tasks at once. These four sit between it and that
 # cluster, so each branch of the empire's problem has a door of its own.
 cc_byz_task_roman_title: "Le titre romain"
 cc_byz_task_roman_title_desc: "Trois cours en Europe se disent romaines. L'une d'elles est à Rome et a un évêque plutôt qu'un empereur, l'autre est allemande et a été couronnée par cet évêque, et la troisième détient la charge en succession ininterrompue depuis Auguste.\n\nSeule la troisième est embarrassée par le sujet."
 cc_byz_task_balkan_frontier: "La frontière des Balkans"
 cc_byz_task_balkan_frontier_desc: "Tout ce qui se trouve au nord de Thessalonique est une route vers Constantinople. Les Avars le savaient, les Bulgares le savaient, les Serbes le savent aujourd'hui, et l'empire l'a appris plus de fois qu'il n'ose l'enregistrer."
 cc_byz_task_latin_powers: "Les puissances latines"
 cc_byz_task_latin_powers_desc: "L'Occident n'est pas une entité unique. C'est un pape, deux républiques qui se haïssent, un roi de France, un empereur allemand et un grand nombre de personnes revendiquant nos provinces. Ils ne s'entendent sur rien, sauf sur le fait que nous sommes des schismatiques.\n\nL'un d'eux acceptera nos lettres. C'est là que tout commence."
 cc_byz_task_anatolian_return: "Le retour anatolien"
 cc_byz_task_anatolian_return_desc: "Le terrain de recrutement. Le grenier. L'endroit d'où venait chaque soldat de l'ancienne armée, et la raison pour laquelle il y avait une ancienne armée.\n\nElle a disparu depuis deux cent cinquante ans et les hommes qui y vivent maintenant y sont également nés."

 # ---- New stones: the Fisc ----
 cc_byz_task_mint: "L'atelier monétaire de Thessalonique"
 cc_byz_task_mint_desc: "La seconde ville a frappé sa propre monnaie pendant des siècles. Un empire qui frappe sa monnaie en un seul lieu est un empire qu'un seul siège peut laisser sans argent."
 cc_byz_task_bank: "La dette acquittée"
 cc_byz_task_bank_desc: "En 1343, les joyaux de la couronne sont partis à Venise pour trente mille ducats. Ils n'ont jamais été rachetés, et les copies en verre sont ce que l'impératrice portait lors de son propre couronnement.\n\nNous aimerions ne rien devoir à personne."

 # ---- New stones: the Faith ----
 cc_byz_task_orthodox_concord: "La concorde orthodoxe"
 cc_byz_task_orthodox_concord_desc: "Nous partageons un rite avec les hommes qui nous ont le plus pris. Que cela soit le début ou la fin d'une dispute n'a jamais été tranché, et aucun empereur n'a essayé très fort de le trancher."

 # ---- New stones: the Sword ----
 cc_byz_task_fleet_restored: "La flotte rétablie"
 cc_byz_task_fleet_restored_desc: "La flotte impériale a été licenciée en 1284 par mesure d'économie. L'économie réalisée a depuis été dépensée plusieurs fois pour des coques génoises et vénitiennes, et l'empire a appris ce qu'il coûte d'être en mer sur les navires d'autrui."

 # ---- New spurs, by region ----
 cc_byz_task_purple_born: "Né dans la Pourpre"
 cc_byz_task_purple_born_desc: "Un enfant né dans la chambre de porphyre alors que son père régnait l'emporte sur tout général ayant jamais saisi un trône, et tout le monde dans l'empire l'accepte sans pouvoir dire pourquoi.\n\nC'est le seul argument qui ait jamais rendu une succession byzantine paisible."
 cc_byz_task_bulgarian_question: "La question bulgare"
 cc_byz_task_bulgarian_question_desc: "Basile II y a passé vingt-huit ans et a gagné un surnom pour cela. En moins de deux cents ans, il y avait à nouveau un tsar bulgare, dans une nouvelle capitale, avec son propre patriarche.\n\nLa leçon est accessible à quiconque la souhaite."
 cc_byz_task_danube: "Le Danube atteint"
 cc_byz_task_danube_desc: "Le fleuve a été la frontière pendant huit cents ans. Cela ne l'est plus depuis cent cinquante ans, et tout ce qui se trouve entre lui et la capitale est une campagne ouverte que personne ne défend."
 cc_byz_task_union_received: "L'union reçue"
 cc_byz_task_union_received_desc: "La signature est la partie facile et l'a toujours été. Des empereurs ont signé à Lyon et signeront à nouveau à Florence, et la ville les a tous rejetés depuis la chaire en moins d'un mois.\n\nCeci ne demande que l'existence de l'encre."
 cc_byz_task_cataphracts: "L'aile des cataphractes"
 cc_byz_task_cataphracts_desc: "L'homme et le cheval tous deux en cotte de mailles, lance, masse et arc sur le même cavalier, disposés en coin et chargés de briser une ligne frontalement. Ruineusement coûteux, et c'est la raison pour laquelle les ennemis de l'empire ont passé six siècles à écrire sur sa cavalerie."
 cc_byz_task_akritai: "L'installation des Akritai"
 cc_byz_task_akritai_desc: "Les chants de frontière sont toujours chantés : Digenes Akritas, né de deux peuples, tenant la ligne sur l'Euphrate contre tous. Les hommes des chants gardaient leurs terres parce qu'ils tenaient la frontière, et l'arrangement a survécu à la mémoire de l'empire quant à la raison de son efficacité."
 cc_byz_task_pilgrim_road: "La route des pèlerins"
 cc_byz_task_pilgrim_road_desc: "La garde des lieux saints vaut la peine d'être discutée à cause du trafic, et le trafic débarque à Jaffa. Détenir le sanctuaire sans le port, c'est détenir l'argument sans les revenus."

 # ---- Trigger tooltips ----
 #
 # These wrap triggers the engine cannot localise on its own. religion_percentage in LOCATION
 # scope has only NONE/GLOBAL/THIRD trigger_localization forms, so a direct comparison in a
 # mission's enabled block falls back to religion_percentage_greater_or_equal, which vanilla
 # does not define. Wrapping in custom_tooltip is the fix; adding the missing engine key would
 # also need $TARGET_RELIGION$ to resolve in a scope where it does not.
 cc_byz_athens_orthodox_tt: "Athènes est au moins aux trois cinquièmes orthodoxe"
 cc_byz_jerusalem_orthodox_tt: "Jérusalem est possédée et au moins à moitié orthodoxe"
 cc_byz_second_patriarchal_seat_tt: "Posséder le siège d'un second patriarcat autocéphale : Tarnovo, Nicosie, Tbilissi ou Sis"
 cc_byz_union_signed_tt: "L'union avec Rome a été signée"

 # ---- Casus belli ----
 cc_byz_cb_reclaim_the_balkans: "Reconquérir la frontière des Balkans"
 cc_byz_cb_reclaim_the_balkans_desc: "L'empire n'a jamais renoncé à la ligne du Danube. Cette revendication ne repose sur rien qui puisse être perdu : ni sur Rome, ni sur un exarque, ni sur l'opinion d'un pape. C'est simplement le territoire, et l'argument n'a pas changé depuis 1185."

 # ---- Reward modifiers ----
 STATIC_MODIFIER_NAME_cc_byz_reward_levies: "Le thème convoqué"
 STATIC_MODIFIER_DESC_cc_byz_reward_levies: "Des levées rassemblées, et rassemblées à nouveau avant que la première armée n'ait fini de rentrer chez elle."
 STATIC_MODIFIER_NAME_cc_byz_reward_credit: "Crédit à de meilleures conditions"
 STATIC_MODIFIER_DESC_cc_byz_reward_credit: "Les prêteurs ont vu l'évaluation et ont revu leur opinion sur le risque."

 # ---- Permanent capstone modifiers ----
 STATIC_MODIFIER_NAME_cc_byz_perm_logothete: "Le cours rétabli"
 STATIC_MODIFIER_DESC_cc_byz_perm_logothete: "La poste fonctionne, les routes font l'objet de rapports, et le trésor sait ce qu'on lui doit avant même que cela ne soit dû."
 STATIC_MODIFIER_NAME_cc_byz_perm_ecumenical: "Le trône œcuménique"
 STATIC_MODIFIER_DESC_cc_byz_perm_ecumenical: "Le patriarche appartient à l'empereur, et les églises filles le savent."
 STATIC_MODIFIER_NAME_cc_byz_perm_field_army: "L'armée de campagne"
 STATIC_MODIFIER_DESC_cc_byz_perm_field_army: "Une armée capable de marcher deux fois au cours d'un règne, ce qu'aucun empereur byzantin depuis Manuel n'a possédé."
 STATIC_MODIFIER_NAME_cc_byz_perm_state_restored: "L'État rétabli"
 STATIC_MODIFIER_DESC_cc_byz_perm_state_restored: "L'empire a cessé de subir son déclin et a commencé à choisir la marche à suivre."
 STATIC_MODIFIER_NAME_cc_byz_perm_anatolia: "Anatolie sécurisée"
 STATIC_MODIFIER_DESC_cc_byz_perm_anatolia: "Le bassin de recrutement est redevenu impérial, quelle que soit la manière dont la question turque a été tranchée."
 STATIC_MODIFIER_NAME_cc_byz_perm_eastern_sees: "Les sièges orientaux"
 STATIC_MODIFIER_DESC_cc_byz_perm_eastern_sees: "Les patriarcats de l'Orient sous la protection de l'empereur, et les routes de caravanes qui les suivent."
 STATIC_MODIFIER_NAME_cc_byz_perm_western_sea: "La mer occidentale"
 STATIC_MODIFIER_DESC_cc_byz_perm_western_sea: "Des ports sur les deux rives, et assez de coques pour naviguer entre eux sans demander d'abord l'avis d'une république."
 STATIC_MODIFIER_NAME_cc_byz_perm_city_adorned: "La ville ornée"
 STATIC_MODIFIER_DESC_cc_byz_perm_city_adorned: "Les gens viennent encore ici pour voir à quoi ressemble un empire."
 STATIC_MODIFIER_NAME_cc_byz_perm_greek_fire: "Feu Grégeois restauré"
 STATIC_MODIFIER_DESC_cc_byz_perm_greek_fire: "Les siphons sont reconstruits, les équipages sont formés, et la composition est consignée en plus d'un seul endroit cette fois."
 cc_byz_bureau_funding_avg_tt: "Bureaucraties financées à 50 % ou plus, en moyenne sur les cinq dernières années"
 cc_byz_bureau_funding_avg_high_tt: "Bureaucraties financées à 75 % ou plus, en moyenne sur les cinq dernières années"
 cc_byz_anatolia_orthodox_tt: "Au moins sept personnes sur dix dans l'empire sont orthodoxes"
