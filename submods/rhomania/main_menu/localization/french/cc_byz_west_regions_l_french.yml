l_french:
 # The three new prefectures, each failing in its own way.
 #
 # Italy is not here: it already has the papal and Italian threads plus the shared friction and
 # demand arcs. These exist to answer the question the shared threads cannot, which is why
 # Africa is a different problem from Italy rather than the same problem further away.
 #
 # The Gallic thread is openly counterfactual. No eastern emperor ever held any of Gaul. It is
 # written as a thread about a Provencal aristocracy that never stopped being Roman being
 # informed that it has been recovered.

 # ---- AFRICA: the Moorish frontier ----
 cc_byz_prov.1.title: "Le Limes"
 cc_byz_prov.1.desc: "La frontière est une ligne sur une carte dans la capitale et un ensemble de forts dans un pays que personne ne gouverne.\n\nLes confédérations mauresques au sud de celle-ci ne sont pas un État et ne peuvent être vaincues de la manière dont on vainc un État. On peut les payer, les combattre ou les ignorer, et les prédécesseurs de l'empire ici ont essayé les trois dans cet ordre. Les forts sont toujours debout. Plusieurs sont tenus par des hommes qui n'ont pas vu de payeur impérial depuis trois ans et qui ont passé des accords avec les gens qu'ils sont censés surveiller.\n\nLe rapport de l'exarque est inhabituellement direct. Il veut soit de l'argent, soit la permission d'arrêter de faire semblant."
 cc_byz_prov.1.a: "Payer la frontière. C'est à cela qu'elle sert."
 cc_byz_prov.1.b: "Achetez une confédération et laissez-la tenir la ligne."
 cc_byz_prov.1.c: "Tenez la côte. L'intérieur n'a jamais été nôtre."

 cc_byz_prov.2.title: "L'évêque à l'intérieur des terres"
 cc_byz_prov.2.desc: "Il existe une congrégation à quatre jours de route dans les terres avec un évêque que le patriarche n'a pas consacré, suivant une discipline que la capitale a condamnée pour la dernière fois il y a huit cents ans et qui, apparemment, attendait son heure.\n\nIls ne sont pas des hérétiques d'une manière qu'un concile reconnaîtrait. Ils soutiennent qu'un prêtre ayant fui les persécutions ne peut administrer les sacrements, que l'église des martyrs n'est pas l'église des compromis, et que Carthage n'a pas besoin de Constantinople pour lui dire ce que signifiaient ses propres martyrs.\n\nC'est du donatisme en tout point, sauf pour le nom, et le nom est la seule partie qui ait jamais importé pour quiconque à la capitale."
 cc_byz_prov.2.desc_coast: "La congrégation se trouve à quatre jours de route dans les terres, c'est-à-dire bien au-delà de tout ce que l'empire prétend gouverner actuellement.\n\nIls ont un évêque que le patriarche n'a pas consacré et une discipline que la capitale a condamnée il y a huit cents ans. Ils possèdent également la seule structure ecclésiastique fonctionnelle entre la côte et le désert, et les villes côtières commercent avec eux.\n\nL'exarque note, sans rien recommander, que l'empire a récemment décidé que l'intérieur ne regardait pas ses affaires."
 cc_byz_prov.2.a: "Condamnez-le, comme tout empereur l'a fait."
 cc_byz_prov.2.b: "L'Afrique s'est toujours disputée à ce sujet. Laissons-la faire."

 cc_byz_prov.3.title: "Les arriérés"
 cc_byz_prov.3.desc: "La solde a onze mois de retard dans les forts du désert et sept sur la côte, et la différence entre ces deux chiffres est tout le problème : les hommes au poste le plus difficile sont ceux à qui l'on doit le plus.\n\nCe sont des professionnels. Ils attendront. La question à laquelle chaque garnison africaine a fini par répondre est : combien de temps, et l'empire n'a jamais connu la réponse avant qu'elle ne soit donnée."
 cc_byz_prov.3.desc_paid: "La solde a quatre mois de retard, ce qui dans cette province est considéré comme rapide.\n\nLa frontière a été financée lorsqu'on l'a demandé et la différence est visible : les forts sont garnisonnés par des hommes qui s'attendent à être payés, et les hommes qui s'attendent à être payés ont tendance à continuer d'y croire plutôt qu'à prendre d'autres dispositions.\n\nLe secrétaire de l'exarque a joint les chiffres sans commentaire, ce qui, venant de lui, est une sorte de commentaire."
 cc_byz_prov.3.a: "Rachetez-les. Peu importe le prix."
 cc_byz_prov.3.b: "Ils ont tenu bon. Dites-le publiquement."

 # ---- SPANIA: the narrow province ----
 cc_byz_prov.10.title: "La loi dans les villes"
 cc_byz_prov.10.desc: "La province a des tribunaux. Ce ne sont pas les tribunaux de l'empire.\n\nLes villes ici fonctionnent selon un code wisigoth depuis six cents ans : écrit, cohérent, enseigné et administré par des hommes dont les pères l'administraient. Il gère les successions différemment du droit romain, il gère les dettes différemment, et c'est ce que tout le monde à Carthagène entend par « la loi ».\n\nLa propre loi de l'empire est plus ancienne, meilleure, et étrangère. Ce dernier mot fait tout le travail."
 cc_byz_prov.10.a: "Le droit romain appartient à l'empire. Imposez-le."
 cc_byz_prov.10.b: "Une loi que personne ne suit est pire qu'une loi qui n'est pas la nôtre."

 cc_byz_prov.11.title: "L'offre du voisin"
 cc_byz_prov.11.desc: "La taïfa de l'intérieur a envoyé un marchand plutôt qu'un envoyé, ce qui est en soi le message.\n\nIls préféreraient commercer que combattre. Ils ont de l'argent, la côte a des ports, et aucune des deux parties n'a la force de prendre à l'autre quelque chose qui vaudrait le coût de la prise. La proposition est détaillée, commercialement sensée, et rendrait la province solvable pour la première fois depuis sa récupération.\n\nCela signifierait également que les fonctionnaires d'un empereur orthodoxe s'assoient avec eux pour convenir de tarifs, par écrit, avec signatures."
 cc_byz_prov.11.a: "La solvabilité n'est pas un détail."
 cc_byz_prov.11.b: "Nous ne négocions pas avec eux."

 cc_byz_prov.12.title: "La province indéfendable"
 cc_byz_prov.12.desc: "L'évaluation a été soumise, et c'est la même évaluation que chaque gouverneur ici a soumise.\n\nLa province est une bande côtière avec des montagnes derrière elle et aucun arrière-pays. Elle ne peut nourrir sa propre garnison. Elle ne peut être renforcée que par mer, et la route maritime parcourt la longueur de la Méditerranée en passant devant deux côtes hostiles. Tenue face à une tentative sérieuse, elle tombe ; tenue sans raison particulière, elle coûte.\n\nCe qu'elle possède, ce sont des ports, et des ports à cette extrémité de la mer ont une certaine valeur pour une flotte."
 cc_byz_prov.12.desc_latin: "L'évaluation a été soumise, et il y a un paragraphe qu'il n'y avait pas dans les précédentes.\n\nLa province ne peut être tenue, ne peut être nourrie et ne peut être renforcée que par mer. Cela reste inchangé. Ce qui est nouveau, c'est l'observation que les villes fonctionnent désormais selon leur propre loi, dans leur propre langue, sous des notables que l'empire confirme plutôt qu'il ne nomme, et que si la garnison impériale partait demain, la différence concrète mettrait une décennie à devenir visible.\n\nLe gouverneur ne tire pas de conclusion. Il n'en avait pas besoin."
 cc_byz_prov.12.a: "Échangez cela contre quelque chose qui importe."
 cc_byz_prov.12.b: "Une station navale, et rien de plus."
 cc_byz_prov.12.c: "La renforcer correctement."

 # ---- GAUL: the Rhone command ----
 cc_byz_prov.20.title: "Déjà romain"
 cc_byz_prov.20.desc: "La délégation des villes provençales est polie, bien vêtue, et parle un latin d'une qualité qui a embarrassé deux des secrétaires de l'empereur.\n\nIls souhaitent féliciter l'empereur pour la reconquête de la province. Ils souhaitent qu'il soit noté que la province a été romaine en continu, que ses institutions municipales ont fonctionné sans interruption depuis avant la fondation de la capitale, et que ses familles détiennent des titres conférés par des empereurs dont la chancellerie impériale a dû rechercher les noms.\n\nIls ne cherchent pas à être difficiles. Ils sont extrêmement clairs sur ce qu'ils pensent qu'il vient de se passer, à savoir que Constantinople est enfin revenue."
 cc_byz_prov.20.a: "Confirmer leur rang. Ils étaient Romains avant tout."
 cc_byz_prov.20.b: "C'est une province recouvrée comme toutes les autres."

 cc_byz_prov.21.title: "La revendication du Nord"
 cc_byz_prov.21.desc: "La position franque, pour faire court, est que la vallée du Rhône leur appartient depuis huit cents ans et que l'apparition d'une administration grecque n'y change rien.\n\nCette position n'est pas déraisonnable. La ligne que l'empire peut réellement tenir est celle des Alpes et du fleuve, et tout ce qui se trouve au nord a été gouverné depuis un autre lieu bien avant qu'il n'existe un empire d'Orient pour s'en charger.\n\nL'exarque a demandé des ingénieurs, de l'argent et une décision. Il note qu'il peut obtenir deux de ces trois éléments localement."
 cc_byz_prov.21.a: "Tenez les cols. C'est là que réside la province."
 cc_byz_prov.21.b: "Corrompez-les. Nous l'avons fait sur des frontières plus longues."
 cc_byz_prov.21.c: "C'est son commandement. Laissez-le commander."

 cc_byz_prov.22.title: "Le commandement du Rhône"
 cc_byz_prov.22.desc: "Quelle que soit la nature de cette province, elle n'est pas une préfecture au sens où la chancellerie utilise le mot.\n\nC'est un fleuve, un ensemble de cols, une douzaine de villes qui se gouvernent elles-mêmes avec compétence et l'ont toujours fait, et une garnison recrutée localement depuis une génération car envoyer des hommes de l'est vers le Rhône est une manière absurde de défendre le Rhône.\n\nLa question n'est pas de savoir comment la gouverner. C'est de savoir comment appeler la chose qui la gouverne déjà."
 cc_byz_prov.22.desc_march: "La province se gouverne elle-même et le fait depuis la première confirmation des notables locaux, que le palais n'a jamais tout à fait pris le temps de réviser.\n\nElle détient les cols. Elle paie quelque chose. Elle envoie des contingents quand on lui demande, généralement. Ses familles dirigeantes utilisent les titres impériaux avec une correction parfaite et n'ont pas eu besoin d'une instruction impériale depuis onze ans.\n\nLa chancellerie aimerait trouver un mot pour désigner cela."
 cc_byz_prov.22.a: "Une marche. Elle tient la frontière et décide comment."
 cc_byz_prov.22.b: "Laissons la substance aux Francs. Nous gardons le titre."
 cc_byz_prov.22.c: "Gouvernez-la directement, et payez-en le prix."
