 CC_BYZ_WEST_VOTES_SAFE: "L'empereur ne peut être mis en minorité"
 CC_BYZ_WEST_VOTES_TIE: "Égalité : les motions contre l'empereur échouent, tout comme les siennes"
 CC_BYZ_WEST_VOTES_LOST: "Les préfets peuvent mettre l'empereur en minorité"
 CC_BYZ_WEST_CONS_QUESTIONS: "Le consistoire vote sur quatre questions : à qui obéissent les armées d'Occident, où vont les revenus d'Occident, quel rite utilisent les églises d'Occident et comment un préfet décédé est remplacé."
 CC_BYZ_WEST_COL_VOTES: "Votes"

