 # GENERATED FILE. Do not edit by hand: python tools/generate_west_panel.py

 # ---- Per-prefecture actions ----
 cc_byz_west_pf_donative_italy: "Payer les garnisons de Ravenne"
 cc_byz_west_pf_donative_italy_desc: "Payer les arriérés des garnisons de cette province. Un tiers du coût d'un donatif complet, pour une province.\n\nL'exarque gagne #G 2#! de loyauté et l'emprise impériale augmente de #G 1#!."
 cc_byz_west_pf_honours_italy: "Conférer un titre de cour à l'exarque de Ravenne"
 cc_byz_west_pf_honours_italy_desc: "Nommer l'exarque patrikios, ou magistros s'il l'est déjà. Cela coûte du prestige à l'empereur et ne donne pas plus de poids à l'occident.\n\nL'exarque gagne #G 2#! de loyauté et perd #G 1#! d'appétit."
 cc_byz_west_pf_confirm_son_italy: "Confirmer le fils de l'exarque de Ravenne"
 cc_byz_west_pf_confirm_son_italy_desc: "Confirmer le fils de l'exarque comme son successeur. La charge devient celle de sa famille.\n\nL'exarque gagne #G 3#! de loyauté. L'autonomie occidentale augmente de #R 8#!, et l'empire penche vers les Dynatoi. La première confirmation crée un précédent que chaque autre exarque citera."
 cc_byz_west_pf_strategos_italy: "Envoyer un Stratège à Ravenne"
 cc_byz_west_pf_strategos_italy_desc: "Envoyer un général et ses hommes dans cette province. L'exarque gagne de la tradition militaire et des effectifs.\n\nL'autonomie occidentale augmente de #R 5#! : un général en occident dispose de troupes qui le connaissent."
 cc_byz_west_pf_recall_italy: "Invoquer l'exarque de Ravenne"
 cc_byz_west_pf_recall_italy_desc: "Ordonner à cet exarque de se rendre à la capitale. Sa venue dépendra de sa loyauté et du fait que son office soit devenu héréditaire."
 cc_byz_west_pf_charter_italy: "Octroyer une charte communale à Ravenne"
 cc_byz_west_pf_charter_italy_desc: "Accorder une charte à une ville. Le commerce et les bourgeois en profitent, et l'exarque gagne #G 1#! de loyauté.\n\nL'autonomie occidentale augmente de #R 6#!. La première charte est le précédent que chaque autre commune citera."
