 cc_byz_west_succ_consistory_tt: "Le consistoire choisit soit un homme avec lequel la capitale peut cohabiter (#G +1#! de loyauté, autonomie #R +2#!), soit l'un des hommes de l'Occident (#R -1#! de loyauté, autonomie #R +5#!). Les chances sont égales, penchant vers l'homme de la capitale avec une emprise impériale de 60+ ou un prédécesseur loyal (2+), et vers celui de l'Occident avec une autonomie occidentale de 60+."
