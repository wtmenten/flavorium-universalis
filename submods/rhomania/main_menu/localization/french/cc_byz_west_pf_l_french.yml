 CC_BYZ_WEST_PF_EMPTY: "Aucun exarque en poste"
 CC_BYZ_WEST_PF_OPEN: "Un exarque peut être nommé dès maintenant"
 CC_BYZ_WEST_KIND_1: "Exarque intérimaire"
 CC_BYZ_WEST_KIND_2: "Exarque effectif"
 CC_BYZ_WEST_KIND_3: "Stratège exarque"
 CC_BYZ_WEST_TAG_HEREDITARY: "Héréditaire"
 CC_BYZ_WEST_TAG_HEREDITARY_TT: "La succession de son fils a été confirmée. La charge reste dans cette famille."
 CC_BYZ_WEST_TAG_DISAFFECTED: "Mécontent"
 CC_BYZ_WEST_TAG_DISAFFECTED_TT: "Il lève des hommes, et pas pour l'usage de la capitale."
 CC_BYZ_WEST_TAG_CONTENTED: "Satisfait"
 CC_BYZ_WEST_TAG_CONTENTED_TT: "Payé, confirmé, et s'en sortant très bien grâce à cet arrangement."
 CC_BYZ_WEST_TAG_SENIOR: "Exarque senior"
 CC_BYZ_WEST_COL_APPETITE: "Appétit"
 CC_BYZ_WEST_COL_APPETITE_TT: "La part de sa province qu'il estime lui revenir, de 0 à 5. Augmente lorsque ses requêtes sont refusées et que la révision des cessions est retenue ; diminue lorsqu'elles sont accordées ou qu'il est honoré."
 CC_BYZ_WEST_REVIEW_DONE: "Révision de la cession : effectuée au cours des cinq dernières années"
 CC_BYZ_WEST_REVIEW_DUE: "Révision de la cession : due si nous maintenons nos positions dans sa région"
 CC_BYZ_WEST_TAB_CONSISTORY: "Consistoire"
 CC_BYZ_WEST_CONS_DORMANT: "Dormant : les préfets gouvernent, mais ne se réunissent pas"
 CC_BYZ_WEST_CONS_SITTING: "En session"
 CC_BYZ_WEST_VOTES_EMPEROR: "L'empereur : 3 voix"
