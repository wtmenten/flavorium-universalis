 cc_byz_west_pf_cooldown_tt: "Cette province a été traitée de cette manière récemment"
 cc_byz_west_pf_needs_loyal_tt: "La loyauté de l'exarque est d'au moins 1"
 cc_byz_west_succ_resist_tt: "La province peut préférer le fils. Si c'est le cas, le nouvel exarque perd #R 2#! de loyauté et l'autonomie occidentale augmente de #R 5#!. Partant de 30 %, cela est #G moins probable#! avec un candidat capable (160+ points de capacité, encore plus à 200+), une emprise impériale de 60+, ou si l'exarque décédé était loyal (2+). C'est #R plus probable#! avec un candidat faible (moins de 120), une autonomie occidentale de 60+, un poste héréditaire ou un exarque déloyal (-2 ou moins). Un candidat de 180+ qui est accepté commence avec #G 1#! de loyauté."

 # ---- Panel ----
 CC_BYZ_WEST_PANEL_HEADER: "Les préfectures de l'Occident"
 CC_BYZ_WEST_PANEL_HEADER_TT: "L'emprise et l'autonomie sont deux compteurs distincts. Chaque carte de préfecture affiche son exarque et les actions qui s'appliquent à cette seule province. Les actions à l'échelle de l'empire se trouvent sur la carte Gouvernance, et le consistoire possède son propre onglet."
 CC_BYZ_WEST_THIS_YEAR: "cette année"
 CC_BYZ_WEST_ENDINGS: "Où cela se termine"
 CC_BYZ_WEST_ENDINGS_TT: "La situation prend fin dès que les compteurs atteignent un coin. Si aucun n'y est parvenu à l'Âge des révolutions, le coin le plus proche est retenu. La cellule surlignée est la moitié dans laquelle se trouve chaque compteur actuellement."
 CC_BYZ_WEST_END_REABSORB: "Réabsorbé"
 CC_BYZ_WEST_END_REABSORB_REQ: "Emprise 65+, autonomie inférieure à 35"
 CC_BYZ_WEST_END_DIARCHY: "La diarchie"
 CC_BYZ_WEST_END_DIARCHY_REQ: "Emprise 60+, autonomie 60+"
 CC_BYZ_WEST_END_NEGLECT: "Négligé"
 CC_BYZ_WEST_END_NEGLECT_REQ: "Emprise inférieure à 25, autonomie inférieure à 30"
 CC_BYZ_WEST_END_ACCLAIM: "L'acclamation"
 CC_BYZ_WEST_END_ACCLAIM_REQ: "Autonomie 80+, emprise inférieure à 40"
 CC_BYZ_WEST_AXIS_AUT: "Autonomie faible / élevée"
 CC_BYZ_WEST_DEADLINE: "Réglé au plus tard à l'Âge des Révolutions"
