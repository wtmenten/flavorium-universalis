 # cc_byz_exarch.10 - the prompt
 cc_byz_exarch.10.title: "Qui gouverne l'Italie ?"
 cc_byz_exarch.10.desc: "Le territoire italien est aux mains de l'empire et est administré, tant bien que mal, par dépêches. Les dépêches prennent six semaines à l'aller comme au retour.\n\nL'objection pratique a été soulevée par les fonctionnaires responsables, qui soulignent qu'on leur demande de régler des litiges entre des seigneurs italiens dont ils ne peuvent prononcer les noms, sur la base de preuves vieilles de trois mois, dans une tradition juridique qu'aucun d'entre eux n'a étudiée. Ils le font mal et ils le disent.\n\nL'ancienne réponse à ce problème était l'exarque : un seul homme, sur place, détenant ensemble l'autorité civile et militaire, décidant au nom de l'empereur sans demander au préalable. Cela a fonctionné pendant cent cinquante ans, puis cela a cessé de fonctionner, d'une manière que les archives consignent longuement."
 cc_byz_exarch.10.desc_rome: "Rome est tenue, et l'empire découvre que tenir Rome et gouverner Rome sont deux problèmes distincts.\n\nLa ville possède un évêque avec ses propres tribunaux, une noblesse avec ses propres querelles, une population habituée à n'être administrée par aucun des deux, et un ensemble de coutumes juridiques qui précèdent la reconquête de plusieurs siècles. Les fonctionnaires impériaux envoyés pour la diriger sont des hommes compétents qui se noient, et ils ont écrit pour le dire en des termes notablement moins déférents que d'habitude.\n\nL'ancienne réponse était un exarque, siégeant à Ravenne ou dans la ville elle-même, détenant ensemble les autorités civile et militaire. Tout le monde au palais connaît le précédent. Tout le monde sait également comment ce précédent s'est terminé."
 cc_byz_exarch.10.a: "Un intendant. Des mandats courts, et rien à lui."
 cc_byz_exarch.10.b: "Un gouverneur efficace. Laissons-le réellement diriger."
 cc_byz_exarch.10.c: "Un stratège. Le commandement civil et militaire réunis."
 cc_byz_exarch.10.d: "Gouvernez-le d'ici. Nous avons des fonctionnaires pour cela."

 # cc_byz_demand.1 - the request
 cc_byz_demand.1.title: "La requête de l'exarque"
 cc_byz_demand.1.desc: "L'exarque a écrit pour demander que certains districts italiens, encore administrés directement depuis Constantinople, soient placés sous son autorité.\n\nLa lettre est prudente et l'argument est bon. Les districts bordent les siens, ils sont administrés à six semaines de distance par des hommes qui ne les ont jamais vus, et leurs revenus couvrent à peine le coût de leur collecte. Il ne demande rien sur quoi l'empire réalise un profit.\n\nIl a également, sans le dire, établi qu'il écrit désormais au palais au sujet des frontières de sa propre fonction plutôt que sur la gestion de celle-ci."
 cc_byz_demand.1.desc_persistent: "L'exarque a encore écrit au sujet des districts italiens, et ce n'est pas la deuxième fois.\n\nLes arguments sont les mêmes et restent valables, ce qui contribue à rendre la correspondance lassante. Ce qui a changé, c'est le ton : les lettres précédentes demandaient, et celle-ci décrit un arrangement qui serait sensé et attend de savoir si le palais est d'accord.\n\nLe scribe qui archive ces documents a commencé à les regrouper dans un seul paquet. Personne ne lui a demandé de le faire."
 cc_byz_demand.1.desc_hostile: "L'exarque a écrit au sujet des districts italiens, et la lettre a été lue trois fois au palais en raison de ce qu'elle ne contient pas.\n\nIl n'y a aucune requête. Il y a un compte rendu de la manière dont les districts sont actuellement administrés, une évaluation de la manière dont ils pourraient être mieux administrés, et un paragraphe final exprimant la confiance que l'empereur verra la question comme lui.\n\nC'est la lettre d'un homme qui a cessé de considérer la réponse comme étant incertaine. Sa propre loyauté est remise en question depuis un certain temps. Cela ne tranche pas la question en sa faveur."
 cc_byz_demand.1.desc_after_seizure: "L'exarque a écrit pour demander certains districts italiens, et le palais a dû vérifier les registres pour établir lesquels il ne détient pas déjà.\n\nLa lettre respecte toutes les formes. Elle demande, elle expose des raisons, elle s'en remet au jugement de l'empereur, et elle concerne un territoire adjacent à des districts que ses officiers ont commencé à collecter il y a quelques années sans demander l'avis de personne. La courtoisie est délibérée et ne s'adresse pas à l'empereur : elle est faite pour les archives, afin que ce qui se passera ensuite puisse être décrit comme un octroi.\n\nIl propose de laisser le palais garder l'apparence de décider. C'est là la proposition réelle."
 cc_byz_demand.1.a: "Refuser. Les districts sont administrés d'ici."
 cc_byz_demand.1.b: "Accordez-les-lui. Il les gouverne mieux que nous."
 cc_byz_demand.1.c: "Refuser, et présenter cela comme une question territoriale plutôt que comme un affront."
 cc_byz_demand.1.d: "Donnez-lui les revenus. Gardez l'autorité."

 # cc_byz_demand.2 - the argument
 cc_byz_demand.2.title: "L'exarque expose ses arguments"
 cc_byz_demand.2.desc: "L'exarque a cessé d'écrire des lettres et a produit un document.\n\nIl s'agit d'un mémorandum sur l'administration de l'Italie : historique, bien documenté et discrètement dévastateur. Il expose ce qu'était l'exarchat sous Justinien et ses successeurs, quelle autorité ses détenteurs exerçaient, et comment l'arrangement actuel se compare. La comparaison n'est pas flatteuse pour l'arrangement actuel, et elle n'est pas censée l'être.\n\nDes copies ont été envoyées au palais. Des copies ont également, note le palais, été envoyées à plusieurs autres personnes."
 cc_byz_demand.2.desc_precedent: "L'exarque a produit un mémorandum sur l'administration de l'Italie, et son passage le plus efficace est celui qui cite l'octroi de l'empereur lui-même.\n\nOn lui avait déjà confié des districts. Le document traite cet octroi comme ayant établi un principe plutôt que réglé un cas particulier, et en tire des conclusions avec soin : si ces districts étaient mieux administrés depuis Rome, et c'était le cas, alors l'argument s'applique au reste selon exactement la même logique.\n\nC'est un bon argument. C'est un bon argument parce qu'il s'appuie sur une action du palais, ce qui constitue la difficulté des précédents."
 cc_byz_demand.2.a: "Concédez-le. L'Italie est administrée depuis Rome."
 cc_byz_demand.2.b: "Refuser, en utilisant la même forme publique que lui."
 cc_byz_demand.2.c: "Rappelez-le à ce sujet."

 # cc_byz_demand.3 - he stopped asking
 cc_byz_demand.3.title: "Il a cessé de demander"
 cc_byz_demand.3.desc: "Les officiers de l'exarque collectent les taxes dans les districts contestés. Ils le font depuis deux saisons. Le palais l'a appris grâce à un retour d'impôts qui n'est jamais arrivé.\n\nIl n'y a eu ni proclamation ni saisie. Ses hommes étaient déjà l'autorité la plus proche, les garnisons étaient les siennes depuis des années, et à un moment donné, les fonctionnaires locaux ont simplement commencé à rendre compte à l'homme qui était réellement sur place. Lorsque l'anomalie a été soulevée, il a répondu promptement et courtoisement, s'étonnant que l'arrangement n'ait pas été formalisé plus tôt.\n\nLes options de l'empire sont une guerre en Italie qu'il ne peut actuellement financer, ou un document. Il en est raisonnablement convaincu depuis un certain temps."
 cc_byz_demand.3.a: "Ratifiez-le. Appelez cela une concession pour sauver les apparences."
 cc_byz_demand.3.b: "Refuser de le reconnaître. Que les registres restent inchangés."
