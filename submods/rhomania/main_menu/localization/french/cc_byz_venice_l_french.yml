l_french:
 # Mission task
 cc_byz_ven_task_free_tt: "Venise existe, n'est le sujet de personne, n'est pas en guerre avec nous, et nous tenons Constantinople"
 cc_byz_ven_opens_chain_tt: "Ouvre #Y La Question de la Sérénissime#!, une série d'événements s'étalant sur environ cinquante ans qui peut se conclure avec Venise comme alliée perpétuelle, comme Duché client, tenue à l'écart du Saint Empire romain germanique, ou comme ennemie"

 # Score tooltips
 cc_byz_ven_concord_plus1_tt: "#Y Concorde avec Venise#! #G +1#!"
 cc_byz_ven_concord_plus2_tt: "#Y Concorde avec Venise#! #G +2#!"
 cc_byz_ven_concord_minus1_tt: "#Y Concorde avec Venise#! #R -1#!"
 cc_byz_ven_concord_minus2_tt: "#Y Concorde avec Venise#! #R -2#!"
 cc_byz_ven_leverage_plus1_tt: "#Y Influence sur Venise#! #G +1#!"
 cc_byz_ven_leverage_plus2_tt: "#Y Influence sur Venise#! #G +2#!"
 cc_byz_ven_leverage_minus1_tt: "#Y Influence sur Venise#! #R -1#!"
 cc_byz_ven_creditor_grip_plus1_tt: "#Y Emprise du créancier#! #R +1#!"
 cc_byz_ven_exarch_restrained_tt: "Notre exarque en Italie veut moins de terres vénitiennes, et s'offusque qu'on le lui dise : #Y appétit de l'exarque#! #G -1#!, #Y loyauté de l'exarque#! #R -1#!"
 cc_byz_ven_exarch_unleashed_tt: "Notre exarque en Italie en veut davantage : #Y appétit de l'exarque#! #R +1#!"
 cc_byz_ven_dux_offered_tt: "Si la question se conclut par une alliance ou le Duché, Venise sera tenue à l'écart du Saint Empire romain germanique"

 # Offers
 cc_byz_ven_port_buy_tt: "Nous proposons d'acheter [cc_ven_port.GetName]. Venise demande 25 d'or par point de développement, entre 150 et 600"
 cc_byz_ven_port_swap_tt: "Nous offrons à [cc_ven.GetName] des droits commerciaux sur nos marchés pendant 30 ans en échange de [cc_ven_port.GetName]. #Y Influence#! #R -1#! si accepté"
 cc_byz_ven_venice_decides_tt: "Le gouvernement de [cc_ven.GetName] décide"
 cc_byz_ven_port_ai_rule_tt: "[cc_ven.GetName] accepte si la #Y Concorde#! est de 5 ou plus"
 cc_byz_ven_ducate_ai_rule_tt: "[cc_ven.GetName] peut accepter ou refuser. Les chances s'améliorent avec une #Y Concorde#! de 9 ou plus et une #Y Influence#! de 4 ou plus. Un refus nous accorde tout de même l'alliance perpétuelle"
 cc_byz_ven_port_accept_tt: "Le port passe à [cc_ven_emperor.GetName]"
 cc_byz_ven_port_refuse_tt: "Nous gardons le port. Les relations se refroidissent légèrement"
 cc_byz_ven_proposal_accept_tt: "Nous acceptons la proposition de [cc_ven_emperor.GetName]"
 cc_byz_ven_proposal_refuse_tt: "Nous refusons. Les relations avec [cc_ven_emperor.GetName] se poursuivent sur leurs bases actuelles"
 cc_byz_ven_ducate_tt: "Venise devient le #Y Duché de Vénétie#! : un sujet qui conserve sa république, sa flotte, ses guerres et sa diplomatie, paie un faible tribut et permet à nos marchands de commercer sans tarifs douaniers. Elle ne pourra jamais être annexée. Venise est exclue du Saint Empire romain germanique"
 cc_byz_ven_alliance_tt: "Une alliance perpétuelle avec Venise, avec des bonus navals et commerciaux durables pour les deux parties"
 cc_byz_ven_rupture_tt: "Les relations avec Venise sont rompues. Nous obtenons un casus belli de 25 ans sur ses ports en Morée et en Égée"

 # Subject type
 cc_byz_venetian_ducate: "Duché de Venise"
 cc_byz_venetian_ducate_desc: "Venise reconnaît à nouveau l'empereur, comme le firent ses premiers doges. La république se gouverne elle-même, conserve sa flotte et ses colonies, et mène ses propres guerres. Elle envoie un tribut et permet aux marchands impériaux de commercer sans tarifs douaniers."

 # Casus belli
 cc_byz_cb_stato_da_mar: "Le Stato da Mar"
 cc_byz_cb_stato_da_mar_desc: "Venise a trahi l'empire. Ses ports dans le Morée et en mer Égée étaient romains avant d'être vénitiens."
 cc_byz_cb_stato_da_mar_PROV: "Le Stato da Mar"

 # Opinion modifiers
 cc_byz_ven_courted: "Courtisée par l'Empereur"
 cc_byz_ven_slighted: "Offensé par l'Empereur"
 cc_byz_ven_wronged: "Lésé par l'Empereur"
 cc_byz_ven_sworn_friends: "Amis jurés de l'Empereur"
 cc_byz_ven_broken_faith: "Foi rompue"

 # Country modifiers
 STATIC_MODIFIER_NAME_cc_byz_ven_old_privileges: "L'exemption vénitienne"
 STATIC_MODIFIER_DESC_cc_byz_ven_old_privileges: "Les termes de 1082 sont maintenus : les marchands vénitiens commercent en Roumanie sans droits de douane."
 STATIC_MODIFIER_NAME_cc_byz_ven_reduced_privileges: "Les deux pour cent"
 STATIC_MODIFIER_DESC_cc_byz_ven_reduced_privileges: "Les marchands vénitiens paient un taux de douane réduit de deux pour cent."
 STATIC_MODIFIER_NAME_cc_byz_ven_full_kommerkion: "Le Kommerkion intégral"
 STATIC_MODIFIER_DESC_cc_byz_ven_full_kommerkion: "Les cargaisons vénitiennes paient la totalité des dix pour cent. Le trésor y gagne et le commerce s'amenuise."
 STATIC_MODIFIER_NAME_cc_byz_ven_anti_genoese_league: "Ligue contre Gênes"
 STATIC_MODIFIER_DESC_cc_byz_ven_anti_genoese_league: "Nos galères naviguent avec la flotte vénitienne contre les Génois."
 STATIC_MODIFIER_NAME_cc_byz_ven_sea_league: "La Ligue maritime"
 STATIC_MODIFIER_DESC_cc_byz_ven_sea_league: "Une flotte commune avec Venise patrouille en mer Égée contre les Turcs."
 STATIC_MODIFIER_NAME_cc_byz_ven_perpetual_alliance: "Alliance perpétuelle avec Venise"
 STATIC_MODIFIER_DESC_cc_byz_ven_perpetual_alliance: "L'empire et la Sérénissime sont liés l'un à l'autre sans limite de temps."
 STATIC_MODIFIER_NAME_cc_byz_ven_romania_rights: "Droits en Romanie"
 STATIC_MODIFIER_DESC_cc_byz_ven_romania_rights: "Nos marchands détiennent des droits sur les marchés de l'empire romain."
 STATIC_MODIFIER_NAME_cc_byz_ven_good_relations: "Amitié avec Venise"
 STATIC_MODIFIER_DESC_cc_byz_ven_good_relations: "Les relations avec Venise sont bonnes et stables, sans qu'un traité ne les lie."

 # .1 The chrysobull renewed
 cc_byz_venice.1.title: "La Chrysobulle renouvelée"
 cc_byz_venice.1.desc: "Le bailo vénitien est venu au palais avec la chrysobulle de 1082 et demande qu'elle soit confirmée. Alexis Ier avait accordé à Venise un quartier sur la Corne d'Or et l'exemption des douanes en échange d'une flotte contre les Normands. Les Normands sont partis depuis longtemps. L'exemption coûte toujours au trésor.\n\nLes Génois de Galata observent pour voir ce que Venise obtiendra."
 cc_byz_venice.1.a: "Confirmer pleinement les termes de 1082."
 cc_byz_venice.1.b: "Réduire l'exemption à deux pour cent."
 cc_byz_venice.1.c: "Le révoquer. Venise paie l'intégralité du kommerkion."
 cc_byz_venice.1.d: "Notre ministre du commerce rédige les termes."

 # .2 The jewels and the loans
 cc_byz_venice.2.title: "Les bijoux et les prêts"
 cc_byz_venice.2.desc: "Des banquiers vénitiens ont proposé un prêt au trésor à des conditions avantageuses. Les conditions avantageuses de Venise ont tendance à devenir sévères, mais l'argent est réel et l'empire en a besoin."
 cc_byz_venice.2.desc_jewels: "Les joyaux de la couronne sont toujours dans un coffre-fort vénitien, retenus en garantie d'un prêt que l'empire n'a pas remboursé. Chaque envoyé vénitien le sait et aucun n'en parle. Les banquiers proposent désormais un second prêt sur la même garantie."
 cc_byz_venice.2.a: "Rembourser la dette et demander les bijoux en toute bonne foi."
 cc_byz_venice.2.b: "Accepter le prêt."
 cc_byz_venice.2.c: "Nous ne devrons rien à Venise."

 # .3 The Genoese war
 cc_byz_venice.3.title: "La guerre génoise"
 cc_byz_venice.3.desc: "Venise et Gênes sont à nouveau en guerre pour le commerce de la mer Noire, et toutes deux ont envoyé des envoyés. Venise demande nos galères, comme Jean VI les lui donna en 1351. Gênes nous rappelle que Galata se trouve de l'autre côté de la Corne face au palais, et que c'est Gênes qui a aidé à remettre un Paléologue sur le trône."
 cc_byz_venice.3.desc_no_genoa: "Gênes a cessé d'être une puissance, et son ancienne querelle avec Venise s'est éteinte avec elle. Venise se souvient de qui se tenait où pendant que cela durait."
 cc_byz_venice.3.a: "S'allier à Venise contre les Génois."
 cc_byz_venice.3.b: "Ne pas s'en mêler."
 cc_byz_venice.3.c: "S'allier à Gênes."
 cc_byz_venice.3.d: "La querelle est terminée."

 # .4 The sea league
 cc_byz_venice.4.title: "La Ligue maritime"
 cc_byz_venice.4.desc: "Venise propose une flotte commune pour débarrasser la mer Égée des corsaires turcs, comme le fit la ligue de 1344 lors de la prise de Smyrne. Chaque partie paie pour ses propres galères. Venise veut savoir si les nôtres viendront."
 cc_byz_venice.4.a: "Payer pour des galères dans la flotte de la ligue."
 cc_byz_venice.4.b: "Notre amiral commande l'escadre de la ligue."
 cc_byz_venice.4.c: "Nos navires gardent nos propres côtes."

 # .5 Dalmatia
 cc_byz_venice.5.title: "Dalmatie"
 cc_byz_venice.5.desc: "Les Hongrois font pression sur les villes dalmates tenues par Venise, et Venise sollicite notre soutien. La Dalmatie était une province romaine, et la revendication vénitienne a débuté comme une commission de Constantinople."
 cc_byz_venice.5.a: "Soutenir les revendications de Venise sur la côte."
 cc_byz_venice.5.b: "Médiatiser le conflit entre Venise et les Hongrois."
 cc_byz_venice.5.c: "La Dalmatie n'est pas notre querelle."

 # .6 The mainland question
 cc_byz_venice.6.title: "La question du continent"
 cc_byz_venice.6.desc: "Venise s'étend sur le continent, dans des villes que l'empereur d'Occident considère comme siennes. Venise accueillerait volontiers notre soutien contre les seigneurs de l'Empire, et se souviendrait de son absence."
 cc_byz_venice.6.desc_exarch: "Notre exarque [cc_ven_exarch.GetName] gouverne les terres adjacentes à la lagune et a commencé à considérer la terraferma vénitienne comme une affaire inachevée. Venise a demandé s'il parle au nom de l'empereur."
 cc_byz_venice.6.a: "Contenir l'exarque."
 cc_byz_venice.6.b: "Qu'il fasse pression sur eux."
 cc_byz_venice.6.c: "Soutenir Venise sur le continent."
 cc_byz_venice.6.d: "Le territoire continental de Venise ne regarde que Venise."

 # .7 The Stato da Mar
 cc_byz_venice.7.title: "Le Stato da Mar"
 cc_byz_venice.7.desc: "Venise détient [cc_ven_port.GetName], l'un des ports qu'elle a pris à l'empire après 1204. Nos gouverneurs dans le Morée et les îles veulent le récupérer. Venise ne le cédera pas par la force, mais c'est une république marchande et elle pourrait le vendre, ou l'échanger au juste prix sur nos marchés."
 cc_byz_venice.7.desc_none: "Venise ne détient plus aucun port en Morée ou en mer Égée digne d'être négocié. Ses envoyés s'en sont rendu compte."
 cc_byz_venice.7.a: "Proposer de l'acheter."
 cc_byz_venice.7.b: "Offrir des droits commerciaux en échange."
 cc_byz_venice.7.c: "Laisser le Stato da Mar à Venise."
 cc_byz_venice.7.d: "Il ne reste plus rien à négocier."

 # .20 (Venice) The port offer
 cc_byz_venice.20.title: "Une offre pour [cc_ven_port.GetName]"
 cc_byz_venice.20.desc_buy: "[cc_ven_emperor.GetName] propose d'acheter [cc_ven_port.GetName] à la république pour 25 d'or par point de développement, entre 150 et 600."
 cc_byz_venice.20.desc_swap: "[cc_ven_emperor.GetName] offre à nos marchands des droits commerciaux sur ses marchés pendant trente ans, en échange de [cc_ven_port.GetName]."
 cc_byz_venice.20.a: "Accepter."
 cc_byz_venice.20.b: "Refuser."

 # .22 The port answer
 cc_byz_venice.22.title: "Venise répond"
 cc_byz_venice.22.desc_yes: "Venise a accepté. [cc_ven_port.GetName] revient à l'empire."
 cc_byz_venice.22.desc_no: "Venise a refusé. [cc_ven_port.GetName] reste vénitien."
 cc_byz_venice.22.a: "Le drapeau est hissé au-dessus du port."
 cc_byz_venice.22.b: "Une autre fois."

 # .8 The Emperor's vicariate
 cc_byz_venice.8.title: "Le Vicariat de l'Empereur"
 cc_byz_venice.8.desc: "L'empereur d'Occident a offert au doge un vicariat impérial sur les villes du continent. Cela ferait de Venise un prince de l'Empire. Les premiers doges de Venise tenaient leur titre de Constantinople, et certains dans la lagune ne l'ont pas oublié."
 cc_byz_venice.8.desc_member: "Venise siège désormais à la diète de l'Empire, et l'empereur d'Occident a proposé au doge une place plus importante. Les premiers doges de Venise tenaient leur titre de Constantinople, et certains dans la lagune ne l'ont pas oublié."
 cc_byz_venice.8.a: "Offrir au doge l'ancien titre : dux et protosebastos."
 cc_byz_venice.8.b: "Surenchérir l'empereur d'Occident avec de l'or."
 cc_byz_venice.8.c: "Laisser Venise choisir son empereur."

 # .9 St Mark's and the purple
 cc_byz_venice.9.title: "Saint-Marc et le Pourpre"
 cc_byz_venice.9.desc: "Saint-Marc a été construite sur le modèle des Saints-Apôtres de Constantinople, et son trésor regorge d'objets pris dans nos églises en 1204. Les procurateurs de Saint-Marc ont demandé un don impérial pour la basilique."
 cc_byz_venice.9.desc_union: "Saint-Marc a été construite sur le modèle des Saints-Apôtres de Constantinople. Avec la réunification des églises, les procurateurs de Saint-Marc ont demandé un don impérial pour la basilique, et Venise présente l'union comme son propre accomplissement."
 cc_byz_venice.9.desc_repudiated: "Saint-Marc a été construite sur le modèle des Saints-Apôtres de Constantinople. Depuis que l'union a été répudiée, Venise a dû justifier son amitié avec nous auprès du Pape. Les procurateurs de Saint-Marc ont tout de même demandé un don impérial pour la basilique."
 cc_byz_venice.9.a: "Envoyer des manuscrits à la bibliothèque de Saint-Marc."
 cc_byz_venice.9.b: "De l'or et de l'émail pour la Pala d'Oro."
 cc_byz_venice.9.c: "Demander que le serment du doge nomme à nouveau l'empereur."

 # .10 The climax
 cc_byz_venice.10.title: "La question de la Sérénissime"
 cc_byz_venice.10.desc: "Un demi-siècle de relations avec Venise a abouti à une situation stable. Les rapports sont corrects, mais sans plus. Aucune des deux parties n'a de raison d'en changer."
 cc_byz_venice.10.desc_alliance: "Un demi-siècle de relations avec Venise a fait des deux États des partenaires de fait. Le conseil du doge est prêt à rendre cet état permanent."
 cc_byz_venice.10.desc_ducate: "Un demi-siècle de relations avec Venise est allé plus loin que quiconque dans la lagune ne l'avait prévu. Venise fait confiance à l'empire et en a besoin. Certains membres du conseil du doge disent désormais ouvertement que la république fut autrefois une province romaine, et qu'elle pourrait reconnaître à nouveau l'empereur sans perdre rien de ce qui lui est précieux."
 cc_byz_venice.10.desc_rupture: "Un demi-siècle de relations avec Venise s'est soldé par une méfiance réciproque. Le bailo a été rappelé. Venise ne prétend plus être notre amie."
 cc_byz_venice.10.a: "Proposer le Duché de Vénétie."
 cc_byz_venice.10.b: "Proposer une alliance perpétuelle."
 cc_byz_venice.10.c: "Laisser l'amitié en l'état."
 cc_byz_venice.10.d: "Alors les ports seront nôtres."
 cc_byz_venice.10.e: "Tournez-vous vers Gênes."

 # .25 (Venice) The proposal
 cc_byz_venice.25.title: "Une proposition de Constantinople"
 cc_byz_venice.25.desc_ducate: "[cc_ven_emperor.GetName] propose que Venise reconnaisse l'empereur comme le firent ses premiers doges, en tant que Duché de Vénétie. La république conserverait son gouvernement, sa flotte, ses colonies et ses guerres, paierait un faible tribut et permettrait aux marchands impériaux de commercer sans nos tarifs. Elle ne pourrait jamais être annexée et resterait en dehors de l'Empire d'Occident."
 cc_byz_venice.25.desc_alliance: "[cc_ven_emperor.GetName] propose une alliance perpétuelle entre l'empire et la république, sans limite de durée."
 cc_byz_venice.25.a: "Accepter."
 cc_byz_venice.25.b: "Refuser."

 # .26 The proposal answer
 cc_byz_venice.26.title: "Venise décide"
 cc_byz_venice.26.desc_ducate: "Le doge a prêté serment à l'empereur. Venise est redevenue le Duché de Vénétie."
 cc_byz_venice.26.desc_alliance: "Le doge a juré une alliance perpétuelle avec l'empire."
 cc_byz_venice.26.desc_ducate_refused: "Le conseil du doge ne reconnaît pas l'empereur. Il a proposé une alliance perpétuelle à la place."
 cc_byz_venice.26.desc_alliance_refused: "Le conseil du doge a décliné une alliance perpétuelle. Les relations restent amicales et sans lien formel."
 cc_byz_venice.26.a: "Le Duché de Vénétie"
 cc_byz_venice.26.b: "Une alliance sans terme."
 cc_byz_venice.26.c: "Amis, alors."

 # .90 The question lapses
 cc_byz_venice.90.title: "La question de la Sérénissime s'éteint"
 cc_byz_venice.90.desc: "La question de Venise est tombée."
 cc_byz_venice.90.desc_gone: "Venise n'existe plus en tant qu'État. Il ne reste plus personne dans la lagune avec qui traiter."
 cc_byz_venice.90.desc_city: "Constantinople est perdue. Venise n'a aucune raison de traiter avec un empereur qui ne la possède pas."
 cc_byz_venice.90.desc_subject: "Venise est devenue le sujet d'une autre puissance et ne peut plus fixer ses propres conditions."
 cc_byz_venice.90.desc_war: "Dix ans de guerre avec Venise ont anéanti toute perspective de régler la question."
 cc_byz_venice.90.a: "Qu'il en soit ainsi."
 LEAD_cc_byz_venetian_ducate: "Empereur"
 AM_cc_byz_venetian_ducate: "Duché de Venetia"
 CANCEL_cc_byz_venetian_ducateTITLE: "Libérer le Duché"
 CANCEL_cc_byz_venetian_ducate_DESC: "Libérer Venise de sa reconnaissance de l'empereur. La république redevient pleinement indépendante."
 CANCEL_cc_byz_venetian_ducate_CATEGORY: "CATEGORY_SUBJECT_ACTIONS"
