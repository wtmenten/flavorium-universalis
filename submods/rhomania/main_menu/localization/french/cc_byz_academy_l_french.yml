l_french:
 # Mission task
 cc_byz_acad_5_universities_tt: "Nous possédons au moins 5 lieux dotés d'une université"
 cc_byz_acad_opens_chain_tt: "Ouvre #Y L'Académie#!, une série d'événements s'étalant sur 6 à 10 ans qui détermine qui enseigne, quoi enseigner, et se termine par une charte de récompenses"

 # Tooltips
 cc_byz_acad_lean_latin2_tt: "L'Académie penche #Y 2#! vers la scolastique latine"
 cc_byz_acad_lean_hellenic2_tt: "L'Académie penche #Y 2#! vers les platoniciens de Pléthon"
 cc_byz_acad_lean_toward_middle_tt: "L'orientation de l'Académie revient #Y 1#! vers le centre"
 cc_byz_acad_unlock_policy_tt: "Débloque la récompense de charte #Y Politique d'Académie impériale#!"
 cc_byz_acad_unlock_literacy_tt: "Débloque la récompense de charte #Y Universités lettrées#!"
 cc_byz_acad_unlock_institution_tt: "Débloque la récompense de charte #Y Savoir occidental#!"
 cc_byz_acad_unlock_tactics_tt: "Débloque la récompense de charte #Y L'enseignement de la Tactica#!"
 cc_byz_acad_unlock_law_tt: "Débloque la récompense de charte #Y Faculté de droit#!"
 cc_byz_acad_unlock_theology_tt: "Débloque la récompense de charte #Y Faculté de théologie#!"
 cc_byz_acad_reconciled_tt: "L'Église est réconciliée avec l'Académie : #G +1#! choix de charte"
 cc_byz_acad_dispute_won_tt: "#G Gagné :#! l'école gagne en renommée et en qualité, nous gagnons #G +1#! choix de charte, et #Y Universités lettrées#! est débloqué"
 cc_byz_acad_dispute_lost_tt: "#R Perdu :#! l'école perd de la renommée"
 cc_byz_acad_reward_policy_tt: "L'Éducation d'élite gagne la politique #Y Académie Impériale#!. Tant qu'elle est appliquée, elle attire également notre société vers le camp qui a remporté l'Académie"
 cc_byz_acad_reward_literacy_tt: "Chaque lieu que nous possédons et qui dispose d'une université reçoit #G +4%#! de littératie maximale pour les nobles et les bourgeois, permanent. Les universités construites plus tard en bénéficient également"
 cc_byz_acad_reward_institution_tt: "Chaque lieu que nous possédons et qui dispose d'une université bénéficie d'une croissance plus rapide des institutions, permanent. Les universités construites plus tard en bénéficient également"
 cc_byz_acad_reward_tactics_tt: "#G +0.01#! de tactiques militaires pour chaque université que nous possédons, jusqu'à #G +0.2#! pour 20 universités, permanent"

 # Law policy
 cc_byz_imperial_academy: "Académie Impériale"
 cc_byz_imperial_academy_desc: "Les fonctionnaires de l'État sont formés dans une Académie dont l'empereur a accordé la charte et finance le fonctionnement. Ils y étudient le droit, les lettres et les manuels de guerre sous la direction de maîtres nommés par la cour."

 # Modifiers
 STATIC_MODIFIER_NAME_cc_byz_acad_literacy: "Maîtres de l'Académie"
 STATIC_MODIFIER_DESC_cc_byz_acad_literacy: "Des maîtres formés à l'Académie impériale enseignent dans cette université."
 STATIC_MODIFIER_NAME_cc_byz_acad_institutions: "Savoir occidental"
 STATIC_MODIFIER_DESC_cc_byz_acad_institutions: "Cette université étudie les scolastiques latins via des traductions grecques, et de nouvelles idées les accompagnent."
 STATIC_MODIFIER_NAME_cc_byz_acad_law_faculty: "Faculté de Droit"
 STATIC_MODIFIER_DESC_cc_byz_acad_law_faculty: "Le code de Justinien est enseigné à l'Académie, et ses diplômés occupent les fonctions d'État."
 STATIC_MODIFIER_NAME_cc_byz_acad_theology_latin: "Faculté de Théologie : Scolastique"
 STATIC_MODIFIER_DESC_cc_byz_acad_theology_latin: "Les théologiens de l'Académie lisent Aquinas et argumentent avec les Latins selon leurs propres termes."
 STATIC_MODIFIER_NAME_cc_byz_acad_theology_palamite: "Faculté de Théologie : Hésychaste"
 STATIC_MODIFIER_DESC_cc_byz_acad_theology_palamite: "Les théologiens de l'Académie enseignent la doctrine de Grégoire Palamas, et les monastères leur font confiance."
 STATIC_MODIFIER_NAME_cc_byz_acad_theology_platonist: "Faculté de Théologie : Platoniste"
 STATIC_MODIFIER_DESC_cc_byz_acad_theology_platonist: "Les théologiens de l'Académie lisent Platon aux côtés des Pères. Le clergé les surveille de près."
 STATIC_MODIFIER_NAME_cc_byz_acad_drift_latin: "L'Académie lit le latin"
 STATIC_MODIFIER_DESC_cc_byz_acad_drift_latin: "Les scolastiques latins ont gagné l'Académie, et ses diplômés transportent leurs habitudes dans les bureaux de l'État."
 STATIC_MODIFIER_NAME_cc_byz_acad_drift_hellenic: "L'Académie lit Platon"
 STATIC_MODIFIER_DESC_cc_byz_acad_drift_hellenic: "Le cercle de Pléthon a remporté l'Académie, et ses diplômés apportent le savoir ancien dans les bureaux de l'État."
 AUTO_MODIFIER_NAME_cc_byz_acad_tactics: "La Tactica enseignée"
 AUTO_MODIFIER_DESC_cc_byz_acad_tactics: "Les officiers étudient la Tactica de Léon VI et les manuels plus anciens à l'Académie. Plus les universités sont nombreuses à les former, mieux ils combattent."
 AUTO_MODIFIER_NAME_cc_byz_acad_policy_latin: "Académie Impériale : Maîtres Latins"
 AUTO_MODIFIER_DESC_cc_byz_acad_policy_latin: "La politique de l'Académie Impériale, sous la direction de maîtres qui lisent la scolastique latine."
 AUTO_MODIFIER_NAME_cc_byz_acad_policy_hellenic: "Académie Impériale : Maîtres Platonistes"
 AUTO_MODIFIER_DESC_cc_byz_acad_policy_hellenic: "La politique de l'Académie Impériale, sous la direction de maîtres du cercle de Pléthon."

 # .1 Who leads the Academy
 cc_byz_academy.1.title: "L'Académie a rouvert"
 cc_byz_academy.1.desc: "L'empereur a fondé par charte une Académie à [cc_acad_seat.GetName], la première école de ce genre depuis le Pandidakterion. Ses salles sont prêtes. Ses maîtres ne sont pas encore choisis, et trois partis convoitent la nomination.\n\nLes Latinophrones lisent Aquinas dans la traduction de Demetrios Kydones et pensent que les Latins ont quelque chose à enseigner. Les moines hésychastes de Grégoire Palamas soutiennent que l'Église sait déjà à quoi sert le savoir. À Mistra, Gemistos Pléthon enseigne Platon à quiconque fait le voyage, et ses étudiants sont déjà dans la capitale pour demander le poste."
 cc_byz_academy.1.a: "Les Latinophrones. Le savoir n'a pas de frontière."
 cc_byz_academy.1.b: "Les moines palamites. Le savoir propre à l'Église."
 cc_byz_academy.1.c: "Le cercle de Pléthon venu de Mistra."
 cc_byz_academy.1.d: "Un érudit issu de notre propre cabinet, qui nous est redevable."

 # .2 The faculties
 cc_byz_academy.2.title: "Les Facultés"
 cc_byz_academy.2.desc: "L'Académie peut se permettre d'ouvrir correctement une faculté cette décennie. Les juristes veulent une chaire de droit et un nomophylax pour l'occuper, comme Constantin IX l'a fondé en 1046. Les officiers veulent que la Tactica de Léon VI et les manuels plus anciens soient enseignés comme une discipline. Les rhéteurs soulignent que tout fonctionnaire que l'empire ait jamais eu a d'abord été formé aux lettres, et que le reste suit.\n\nUn ministre ayant la formation appropriée pourrait porter une seconde faculté."
 cc_byz_academy.2.a: "Droit. Le code de Justinien, et un nomophylax pour l'enseigner."
 cc_byz_academy.2.b: "Science militaire. La Tactica et les anciens manuels."
 cc_byz_academy.2.c: "Belles-lettres et rhétorique."
 cc_byz_academy.2.d: "Notre juriste enseigne le droit aux côtés des lettres."
 cc_byz_academy.2.e: "Notre stratège écrit une nouvelle Tactica aux côtés de la faculté des lettres."

 # .3 The translation question
 cc_byz_academy.3.title: "La Question de la Traduction"
 cc_byz_academy.3.desc: "La bibliothèque de l'Académie a demandé ce qu'elle devait traduire. L'Aquinas de Kydones circule déjà en grec et les Latinophrones souhaitent que le reste des scolastiques l'accompagne. Les moines ne veulent rien en latin sur les étagères. Les étudiants de Pléthon veulent que ses Lois soient enseignées ouvertement, ce qui reviendrait à enseigner les anciens dieux comme philosophie dans une capitale chrétienne.\n\nTout ce qui sera lu ici sera lu par chaque fonctionnaire formé par l'Académie."
 cc_byz_academy.3.a: "Traduire Thomas d'Aquin et les scolastiques latins."
 cc_byz_academy.3.b: "Textes grecs uniquement. Nous avons nos propres livres."
 cc_byz_academy.3.c: "Enseigner ouvertement les lois de Pléthon."
 cc_byz_academy.3.d: "Notre humaniste traduit dans les deux sens."

 # .4 The Patriarch objects
 cc_byz_academy.4.title: "Le Patriarche s'oppose"
 cc_byz_academy.4.desc: "Le Patriarche a écrit pour dire qu'une Académie qui enseigne la philosophie sans la théologie n'enseigne que la moitié de ce qu'un chrétien doit savoir. Il demande une chaire de théologie, nommée par l'Église, à l'intérieur des murs de l'Académie."
 cc_byz_academy.4.desc_latin: "Le Patriarche a écrit pour dire que l'Académie est devenue une école de latinisateurs, et que ses diplômés discutent du Filioque dans les couloirs du palais. Il demande une chaire de théologie, nommée par l'Église, pour leur répondre depuis l'intérieur de l'Académie."
 cc_byz_academy.4.desc_platonist: "Le Patriarche a écrit pour dire que l'Académie enseigne le paganisme sous le nom de philosophie, et que l'Église ne restera pas silencieuse pendant que l'empereur la finance. Il demande une chaire de théologie, nommée par l'Église, à l'intérieur des murs de l'Académie."
 cc_byz_academy.4.a: "Donner sa chaire à l'Église."
 cc_byz_academy.4.b: "L'Académie répond à l'empereur."
 cc_byz_academy.4.c: "Notre théologien négocie les termes."

 # .5 The court schools dispute
 cc_byz_academy.5.title: "La Dispute des Écoles"
 cc_byz_academy.5.desc: "Les maîtres de l'Académie ont convoqué une dispute publique pour fixer son programme et ont invité les autres écoles du royaume à envoyer leurs meilleurs éléments. Nous n'avons pas d'école de cour de prestige à envoyer. Des maîtres pourraient être engagés à l'étranger pour plaider en notre nom, moyennant finance."
 cc_byz_academy.5.desc_school: "Les maîtres de l'Académie ont convoqué une dispute publique pour fixer son programme et ont invité les autres écoles du royaume à envoyer leurs meilleurs éléments. Notre école de cour à [cc_acad_school_seat.GetName] pourrait relever le défi. Une victoire ferait son nom ; une défaite serait tout aussi longtemps mémorisée."
 cc_byz_academy.5.a: "Faire entrer l'école."
 cc_byz_academy.5.b: "Notre ministre dirige les disputants de l'école."
 cc_byz_academy.5.c: "Laisser les écoles en dehors de tout cela."
 cc_byz_academy.5.d: "Engager des maîtres de l'étranger."
 cc_byz_academy.5.e: "L'Académie peut plaider sa cause."

 # .6 The charter
 cc_byz_academy.6.title: "La Charte de l'Académie"
 cc_byz_academy.6.desc: "La charte de l'Académie est prête pour le sceau de l'empereur. Elle peut comporter une dotation, et une supplémentaire pour chacun des éléments suivants : l'Église réconciliée avec l'Académie, et une école de cour victorieuse lors de la dispute.\n\nChaque dotation a été ouverte par un choix précédent et certaines en nécessitent davantage :\n#Y Politique de l'Académie Impériale :#! une faculté de droit ou de lettres.\n#Y Universités lettrées :#! une faculté de lettres ou une dispute remportée, et des nobles lettrés à au moins 35 %.\n#Y Savoir occidental :#! les scolastiques latins traduits.\n#Y La Tactica enseignée :#! une faculté militaire, et un ministre ayant une compétence militaire de 65 ou plus ou une école de cour militaire.\n#Y Faculté de droit :#! une faculté de droit, et un juriste au cabinet ou une école de cour administrative.\n#Y Faculté de théologie :#! l'Église réconciliée."
 cc_byz_academy.6.policy: "Inscrire l'Académie dans la loi sur l'éducation."
 cc_byz_academy.6.literacy: "Envoyer ses maîtres dans chaque université."
 cc_byz_academy.6.institution: "Diffuser le savoir traduit dans chaque université."
 cc_byz_academy.6.tactics: "Faire de la Tactica le cours des officiers."
 cc_byz_academy.6.law: "Doter la faculté de droit."
 cc_byz_academy.6.theology: "Doter la faculté de théologie."
 cc_byz_academy.6.none: "Sceller la charte en l'état."

 # .90 The Academy closes
 cc_byz_academy.90.title: "L'Académie ferme"
 cc_byz_academy.90.desc: "Constantinople et Athènes étant toutes deux perdues, l'Académie n'a plus de foyer. Ses maîtres se sont dispersés vers l'Italie et les monastères, et sa charte n'a jamais été scellée."
 cc_byz_academy.90.a: "Une autre école perdue pour l'empire."
