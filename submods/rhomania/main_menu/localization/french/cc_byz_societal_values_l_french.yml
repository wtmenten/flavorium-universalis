l_french:
 # Societal value: Taxis vs Dynatoi
 cc_taxis_focus: "Táxis"
 cc_dynatoi_focus: "Dynatoí"
 cc_taxis_vs_cc_dynatoi: "$cc_taxis_focus$ vs $cc_dynatoi_focus$"
 cc_taxis_vs_cc_dynatoi_desc: "Un [country|e] ordonné par $cc_taxis_focus$ gouverne via le fisc et les bureaux impériaux : des fonctionnaires salariés, des taxes évaluées et une cour qui nomme et révoque à sa guise. Un pays façonné par $cc_dynatoi_focus$ gouverne via ses familles provinciales, qui détiennent la terre, lèvent les soldats et s'attendent à ce que les [ShowPopTypeName('nobles')] soient consultés plutôt qu'instruits."

 # Drift modifier types
 MODIFIER_TYPE_NAME_monthly_towards_cc_taxis: "Progrès mensuel vers les Táxis"
 MODIFIER_TYPE_DESC_monthly_towards_cc_taxis: "Ceci influence l'évolution vers les [societal_values|e] des [ShowSocietyDirectionName('cc_taxis')]."
 MODIFIER_TYPE_NAME_monthly_towards_cc_dynatoi: "Progression mensuelle vers les Dynatoí"
 MODIFIER_TYPE_DESC_monthly_towards_cc_dynatoi: "Ceci influence l'évolution vers les [societal_values|e] des [ShowSocietyDirectionName('cc_dynatoi')]."

 # Static modifiers
 STATIC_MODIFIER_NAME_cc_taxis_progress_cabinet_efficiency: "Priorité du cabinet"
 STATIC_MODIFIER_NAME_cc_dynatoi_progress_cabinet_efficiency: "Priorité du cabinet"
