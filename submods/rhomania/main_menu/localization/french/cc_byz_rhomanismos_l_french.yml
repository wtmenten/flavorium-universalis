l_french:
 # Tagmata units
 a_cc_byz_tagmata_1: "Tagmata"
 a_cc_byz_tagmata_1_desc: "Les régiments permanents de la capitale, payés par le trésor plutôt que levés sur les terres. Contrairement aux levées thématiques, ils peuvent être déplacés et engagés sur un mot de l'empereur, et contrairement aux Varangiens, ils ne sont pas confinés au palais. Ils troquent la puissance d'une ligne légionnaire contre la rapidité d'atteindre une bataille tant qu'elle est encore décisive."
 a_cc_byz_tagmata_2: "$a_cc_byz_tagmata_1$"
 a_cc_byz_tagmata_2_desc: "$a_cc_byz_tagmata_1_desc$"
 a_cc_byz_tagmata_3: "$a_cc_byz_tagmata_1$"
 a_cc_byz_tagmata_3_desc: "$a_cc_byz_tagmata_1_desc$"
 a_cc_byz_tagmata_4: "$a_cc_byz_tagmata_1$"
 a_cc_byz_tagmata_4_desc: "$a_cc_byz_tagmata_1_desc$"
 a_cc_byz_tagmata_5: "$a_cc_byz_tagmata_1$"
 a_cc_byz_tagmata_5_desc: "$a_cc_byz_tagmata_1_desc$"
 a_cc_byz_tagmata_6: "$a_cc_byz_tagmata_1$"
 a_cc_byz_tagmata_6_desc: "$a_cc_byz_tagmata_1_desc$"

 # Tagmata cap modifier
 MODIFIER_TYPE_NAME_cc_num_of_tagmata_modifier: "Régiments de Tagmata"
 MODIFIER_TYPE_DESC_cc_num_of_tagmata_modifier: "Ceci modifie le nombre de régiments de [ShowUnitTypeName('a_cc_byz_tagmata_1')] pouvant être maintenus simultanément."

 # Rhomanismos advances
 cc_byz_unlock_tagmata_advance: "$a_cc_byz_tagmata_1$"
 cc_byz_unlock_tagmata_advance_desc: "$a_cc_byz_tagmata_1_desc$"

 cc_byz_taxis_of_offices: "Ordre de préséance"
 cc_byz_taxis_of_offices_desc: "Rome a répondu au problème des hommes puissants par un Sénat. Nous y répondons par une liste. Chaque dignité a sa place dans l'ordre de préséance, son salaire, sa place à table et ses fonctions cérémonielles. Le rang n'est ni hérité ni acheté : il est accordé, et il peut être retiré."

 cc_byz_oikonomia: "Oikonomía"
 cc_byz_oikonomia_desc: "Les canons sont stricts, et l'Église a toujours su quand ne pas les appliquer. L'Oikonomía est le principe de dispense : là où la rigueur coûterait au troupeau plus que la faute, l'évêque peut assouplir la règle. Appliqué au gouvernement, cela signifie un État capable de tolérer ce qu'il ne peut pas encore corriger."

 cc_byz_tagmata_restored: "La Restauration des Tagmata"
 cc_byz_tagmata_restored_desc: "Les levées thématiques répondent aux hommes qui détiennent leurs terres. Les tagmata répondent au trésor qui les paie. Restaurer les régiments permanents est coûteux, et c'est le seul moyen pour un empereur de conserver une armée qui soit la sienne plutôt que celle de ses magnats."

 cc_byz_palaiologan_revival: "La renaissance paléologue"
 cc_byz_palaiologan_revival_desc: "Les mosaïques de Chora, les histoires, les manuscrits anciens retrouvés : un véritable floraison des lettres et des arts grecs, entreprise par un État qui ne pouvait plus se le permettre. Les siècles suivants l'appelleront la dernière lumière de Constantinople. Ceux qui l'ont vécue l'ont simplement appelée du travail."

 cc_byz_basilika: "La Basilika"
 cc_byz_basilika_desc: "Le code de Justinien a été compilé en latin pour une cour qui ne le parle plus. Les Basilika sont la même loi en grec, organisée pour les tribunaux qui l'utilisent réellement. Rien de nouveau n'est décrété ; beaucoup de choses deviennent applicables."

 cc_byz_annona: "L'Annona"
 cc_byz_annona_desc: "La flotte céréalière atteint la capitale, ou la capitale s'embrase. Cela est vrai depuis la fondation de la ville et aucun empereur n'a trouvé de solution alternative. Sécuriser les distributions gratuites n'est pas de la générosité, c'est le prix à payer pour gouverner depuis Constantinople."

 cc_byz_ecumenical_office: "Le bureau œcuménique"
 cc_byz_ecumenical_office_desc: "Rome créait des citoyens par la loi et pouvait les compter. Nous créons des Rhomaioi par la foi et l'allégeance, ce qui est plus lent, plus vague et plus difficile à révoquer. Un Slave, un Arménien ou un Vlach qui est orthodoxe et obéit à l'empereur est aussi romain que n'importe qui dans la ville."

 cc_byz_dromos: "La Poste Publique"
 cc_byz_dromos_desc: "Rome a construit les routes. Ce que nous avons maintenu sur celles-ci est le dromos : les relais, les chevaux de remplacement, les coursiers et les fonctionnaires dont tout le métier est de savoir combien de temps prend un message. Les routes se dégradent. Un calendrier peut être maintenu."

 cc_byz_thematic_administration: "Administration thématique"
 cc_byz_thematic_administration_desc: "Un thême est une province qui lève et paie ses propres soldats sur ses propres terres. C'est ainsi que l'empire a survécu aux siècles où il ne pouvait se permettre rien d'autre, et cela reste l'arrangement qui s'étend le plus loin de la capitale pour le moins d'argent possible."

 cc_byz_autokrator: "Autokrátor"
 cc_byz_autokrator_desc: "Le titre ne revendique pas une domination sans bornes. Il affirme qu'au sein de ce que l'empereur possède déjà, il n'y a aucune autre autorité, aucun partenaire et aucun recours. Un empire qui ne peut s'étendre peut tout de même être rendu entier."

 cc_byz_great_church: "La Grande Église"
 cc_byz_great_church_desc: "Sainte-Sophie tient depuis huit cents ans parce que chaque génération a payé pour la maintenir debout. Le dôme est tombé une fois et a été reconstruit. La leçon à en tirer n'est pas comment construire, mais comment entretenir."
