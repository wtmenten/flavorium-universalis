l_french:
 # The West: situation panel and map legend.
 #
 # Same split and same voice rule as cc_byz_mamluk_panel_l_english.yml. Card bodies are the
 # court speaking; every counter, threshold and vote count lives in a _INFO key behind the
 # card's info icon.

 # ---- Panel header ----
 CC_BYZ_WEST_HDR_GRIP: "Emprise"
 CC_BYZ_WEST_HDR_AUTONOMY: "Autonomie"
 CC_BYZ_WEST_HDR_RESTIVE: "L'Occident est agité"
 CC_BYZ_WEST_HDR_RESTIVE_TT: "Les lettres provenant des préfectures sont devenues prudentes. Des requêtes qui étaient autrefois des demandes sont désormais des notifications, et les coursiers mettent plus de temps que ne le justifient les routes.\n\nRien ne s'est produit. Tous à la cour peuvent vous dire exactement ce que l'on ressent, et aucun d'entre eux ne l'écrira."

 # ---- Card: the two counters ----
 CC_BYZ_WEST_CARD_BALANCE: "L'équilibre de l'Ouest"
 CC_BYZ_WEST_CARD_BALANCE_DESC: "L'empire détient l'Occident, et l'Occident a sa propre opinion sur le fait d'être détenu. Ce ne sont pas les mêmes questions, et un empereur qui les traite comme une seule sera surpris deux fois.\n\nUne province peut être gouvernée étroitement sans rien en ressentir. Une autre peut être à peine gouvernée du tout et passer quarante ans à rédiger un dossier contre la capitale. L'arrangement dangereux est celui où l'empereur serre la main et où l'Occident a cessé de comprendre pourquoi."
 CC_BYZ_WEST_CARD_BALANCE_INFO: "Deux compteurs indépendants, chacun allant de 0 à 100. Ils ne sont pas les deux extrémités d'une seule barre et peuvent tous deux être élevés simultanément.\n\n#T Emprise Impériale#! augmente avec les recensements, les stratèges envoyés, les rappels obéis et le tribut perçu. Elle chute lorsque les préfectures sont laissées à leur propre gestion.\n\n#T Autonomie Occidentale#! augmente avec les chartes accordées, les fils confirmés dans les sièges de leurs pères, les rappels refusés et les années sans supervision. Elle chute quand l'empereur est présent à l'ouest et qu'il en paie le prix.\n\nUne emprise et une autonomie toutes deux à 60 ou plus constituent l'état d'où naît la révolte. La situation se résout dans tous les cas avant l'Âge des Révolutions."
 CC_BYZ_WEST_BAR_GRIP: "Emprise impériale"
 CC_BYZ_WEST_BAR_GRIP_TT: "Augmente avec les recensements, les stratèges, les rappels obéis et les tributs perçus. Diminue lorsque les préfectures sont laissées à elles-mêmes.\n\nUne emprise élevée n'est pas automatiquement bonne. C'est elle qui fait que l'opinion de l'ouest sur l'arrangement importe."
 CC_BYZ_WEST_BAR_AUTONOMY: "Autonomie occidentale"
 CC_BYZ_WEST_BAR_AUTONOMY_TT: "Augmente avec les chartes accordées, les fils confirmés, les rappels refusés et le temps passé sans surveillance. Diminue lorsque l'empereur est présent dans l'ouest et en paie le prix.\n\nUne autonomie élevée n'est pas non plus automatiquement mauvaise. Un ouest qui se gouverne lui-même avec contentement constitue l'une des quatre fins."
 CC_BYZ_WEST_TENSION_BOTH_HIGH: "Détenu fermement, et avec ressentiment"
 CC_BYZ_WEST_TENSION_BOTH_HIGH_TT: "L'empire gouverne des provinces qui ont décidé qu'elles préféreraient ne pas être gouvernées. Les deux choses sont vraies à la fois et chacune empire l'autre.\n\nRelâcher la pression fonctionne. De même, donner à l'Occident une raison de vouloir cet arrangement. Ne faire ni l'un ni l'autre est également une décision, et elle a déjà été prise auparavant."
 CC_BYZ_WEST_TENSION_DRIFTING: "S'éloigner tranquillement"
 CC_BYZ_WEST_TENSION_DRIFTING_TT: "Rien ne va mal. Mais rien n'est non plus maîtrisé.\n\nLes préfectures deviennent une entité distincte à leur propre rythme, sans querelle et sans date que quiconque puisse pointer du doigt. D'ici un règne, les lettres de l'empereur seront lues comme celles d'une cour étrangère, et personne ne se souviendra avoir décidé cela."

 # ---- Card: the prefectures ----
 CC_BYZ_WEST_CARD_PREFECTURES: "Les préfectures"
 CC_BYZ_WEST_CARD_PREFECTURES_DESC: "Des gouverneurs de provinces que l'empire a passé trois siècles à ne pas posséder.\n\nChacun était la récompense de quelqu'un, et chacun a eu le temps de comprendre ce que le poste valait pour l'homme qui le détenait plutôt que pour l'homme qui l'avait accordé. Ce qu'ils pensent de l'empereur n'est pas un secret. On ne leur a simplement jamais demandé de l'exprimer par écrit."
 CC_BYZ_WEST_CARD_PREFECTURES_INFO: "La loyauté varie de -5 à 5 par exarque.\n\nC'est le chiffre pris en compte pour les rappels, le fil des frictions, les poids de vote du consistoire et le soulèvement. Un exarque à -3 ou moins refusera un rappel ; le soulèvement s'appuie sur les exarques à -2 ou moins.\n\nAugmentée par les donatives, les chartes et la confirmation du fils d'un exarque. Diminuée par les recensements, le tribut, les rappels et les stratèges envoyés au-dessus de sa tête."
 CC_BYZ_WEST_COL_LOYALTY: "Loyauté"

 # ---- Card: the consistory ----
 CC_BYZ_WEST_CARD_CONSISTORY: "Le Consistoire sacré"
 CC_BYZ_WEST_CARD_CONSISTORY_DESC: "L'empereur a construit une salle où l'Occident pouvait être entendu, car un Occident entendu est un Occident qui reste.\n\nIl avait raison sur ce point. Ce qu'il n'a pas fait, c'est de compter les chaises. Chaque province récupérée y ajoute une voix, et les voix n'allaient jamais continuer à être d'accord avec lui par gratitude pour la salle."
 CC_BYZ_WEST_CARD_CONSISTORY_INFO: "Des votes ont lieu au consistoire, une fois celui-ci réuni.\n\n#T Auguste#! 3 voix. #T Exarque Senior#! 2 voix. #T Chaque autre exarque#! 1 voix.\n\nAvec une seule préfecture représentée, l'empereur ne peut perdre, 3 contre 1. Avec les quatre représentées, c'est 3 contre 5 et l'ouest emporte le vote. Il n'y a pas de score de risque caché derrière cela : le danger est la reconquête elle-même, une province à la fois.\n\nLes statuts spéciaux se cumulent, donc l'élévation d'un exarque senior accorde 2 voix à la place de sa voix unique, et non en addition."
 CC_BYZ_WEST_VOTES_LEGEND: "Préfectures établies"

 # ---- Map colouring ----
 CC_BYZ_WEST_LEGEND_PREFECTURE: "Préfecture"
 CC_BYZ_WEST_LEGEND_IMPERIAL: "Impérial"
