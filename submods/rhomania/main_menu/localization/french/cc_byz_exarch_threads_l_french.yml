l_french:
 # Country modifiers
 STATIC_MODIFIER_NAME_cc_byz_protector_of_the_see: "Protecteur du Siège"
 STATIC_MODIFIER_DESC_cc_byz_protector_of_the_see: "La papauté existe parce que l'empereur l'a permis. Chaque cour catholique d'Europe comprend l'arrangement et beaucoup d'entre elles en sont discrètement reconnaissantes."

 # Opinion modifiers
 cc_byz_papal_forbearance: "Nous avons gardé notre dignité"
 cc_byz_papal_captivity: "Nous tient captifs"

 # Casus belli
 cc_byz_cb_recover_the_islands: "Récupérer les îles"
 cc_byz_cb_recover_the_islands_desc: "La mer Égée était un lac impérial dans les mémoires. Elle est aujourd'hui tenue en morceaux par un duché répondant à Venise, une famille génoise à Chios, un ordre croisé à Rhodes et quiconque détient actuellement Négrepont. Aucun d'eux ne peut défendre ses possessions contre une flotte. Tous peuvent faire appel à quelqu'un qui le peut."
 cc_byz_cb_consolidate_italy: "Consolider l'Exarchat"
 cc_byz_cb_consolidate_italy_desc: "Un exarque à Rome a le droit de plaider n'importe où en Italie, et ce droit ne vaut la peine d'être plaidé que tant qu'il y a un exarque pour le faire. Perdez l'exarchat et ceci disparaîtra avec lui."

 # cc_byz_exarch.1 - the first independent decision
 cc_byz_exarch.1.title: "Une décision prise sans consultation"
 cc_byz_exarch.1.desc: "L'exarque a réglé un différend entre deux seigneurs italiens, au nom de l'empereur, de sa propre autorité, et en a rendu compte ensuite dans une lettre respectueuse à chaque ligne et qui ne demande aucune permission.\n\nLe règlement est bon. Un homme à Constantinople n'aurait pu y parvenir, n'ayant ni la connaissance locale ni les six mois que la correspondance aurait pris. C'est précisément pour cela qu'il a été nommé et précisément pour cela que la lettre est lue trois fois au palais."
 cc_byz_exarch.1.desc_strategos: "L'exarque a réglé un différend entre deux seigneurs italiens de sa propre autorité et en a rendu compte après coup, ce pour quoi il a été nommé, puisqu'il a été nommé à des conditions lui laissant la plus large latitude possible.\n\nLe règlement est solide. C'est aussi la troisième lettre de ce genre cette année, et le palais commence à remarquer que les rapports arrivent à un intervalle confortable après les décisions, et que rien dans aucun d'eux n'a jamais été formulé comme une question."
 cc_byz_exarch.1.a: "Confirmez-le. Il a été nommé pour trancher les questions."
 cc_byz_exarch.1.b: "L'infirmer. Le suivant viendra ici en premier."
 cc_byz_exarch.1.c: "Confirmez-le publiquement. Corrigez-le en privé."

 # cc_byz_exarch.2 - going native
 cc_byz_exarch.2.title: "La cour de l'exarque"
 cc_byz_exarch.2.desc: "Les rapports de Rome sont devenus détaillés sur un sujet que personne n'a demandé.\n\nLa maison de l'exarque utilise désormais l'usage latin. Ses secrétaires écrivent dans cette langue parce que les hommes à qui ils écrivent la lisent. Sa chapelle suit le rite local car le clergé local la compose. Ses fils sont éduqués par des Italiens car ce sont les tuteurs disponibles, et il a pris une épouse italienne, ce qui était sensé, et sa famille est maintenant à sa table, ce qui était inévitable.\n\nRien de tout cela n'était de la désobéissance. Il a été envoyé pour gouverner Rome et il gouverne Rome. L'ironie n'a pas échappé à l'empereur qui a refusé d'y emménager."
 cc_byz_exarch.2.a: "Laissez faire. Un gouverneur à l'aise dans sa province la gouverne mieux."
 cc_byz_exarch.2.b: "Envoyez du clergé grec et des commis grecs, à nos frais."
 cc_byz_exarch.2.c: "Mander ses fils pour qu'ils soient élevés au palais."

 # cc_byz_exarch.3 - correspondence
 cc_byz_exarch.3.title: "La correspondance de l'exarque"
 cc_byz_exarch.3.desc: "L'exarque correspond avec Venise, avec Gênes, avec deux des communes du nord et avec un cardinal, et le palais le sait car il n'a jamais tenté de le cacher.\n\nIl dirait, et a dit, qu'un gouverneur en Italie qui ne parle pas aux Italiens est un gouverneur qui apprend tout avec six mois de retard. C'est vrai. Il est également vrai qu'il est maintenant l'homme en Italie qui sait ce que tout le monde fait, et que Constantinople l'apprend par lui."
 cc_byz_exarch.3.desc_latinised: "L'exarque correspond avec la moitié de l'Italie, en latin, via des secrétaires qui y sont nés, et les lettres qui parviennent à Constantinople sont des résumés qu'il a préparés lui-même.\n\nIl dirait qu'un gouverneur qui ne parle pas à ses voisins est inutile, et il a raison. Ce qui a changé, c'est que la cour de Rome semble désormais, pour quiconque en Italie a des affaires à traiter, être l'endroit où la politique impériale est réellement décidée. Plusieurs d'entre eux ont cessé d'écrire totalement à Constantinople."
 cc_byz_exarch.3.a: "Un gouverneur en Italie doit parler aux Italiens."
 cc_byz_exarch.3.b: "Chaque lettre doit être copiée à la capitale."
 cc_byz_exarch.3.c: "Utilisez-le. C'est un instrument que nous ne payons pas."

 # cc_byz_exarch.4 - the recall
 cc_byz_exarch.4.title: "La Convocation"
 cc_byz_exarch.4.desc: "L'exarque est convoqué à Constantinople pour rendre compte en personne. La formulation est chaleureuse, l'occasion plausible, et aucun des intervenants n'est confus quant à ce qui est testé.\n\nS'il vient, l'arrangement tient : un gouverneur qui peut être rappelé chez lui est un gouverneur. S'il ne vient pas, alors quoi que soit devenu l'exarchat, il a cessé de l'être il y a quelques années et le palais vient seulement maintenant de s'en enquérir."
 cc_byz_exarch.4.a: "Insistez. Envoyez quelqu'un pour l'escorter."
 cc_byz_exarch.4.b: "Retirez-le avant qu'il ne soit refusé publiquement."
 cc_byz_exarch.4.c: "Lui offrir quelque chose ici qui ait plus de valeur que Rome."

 # cc_byz_exarch.5 - the ending
 cc_byz_exarch.5.title: "L'exarchat"
 cc_byz_exarch.5.desc_dynasty: "Le bureau est désormais héréditaire. Aucune concession n'a été faite et aucune charte n'existe ; un fils a succédé à un père, le palais en a été informé, et le palais a constaté que ses réponses disponibles étaient soit une guerre en Italie qu'il ne pouvait financer, soit une lettre de félicitations. Il a envoyé la lettre.\n\nLes exarques versent une somme chaque année, laquelle est moindre qu'autrefois et arrive à temps, et ils mènent les guerres de l'empire quand les guerres de l'empire sont aussi les leurs. À tout autre égard, Rome est gouvernée par une famille qui la détient de plein droit et dont l'autorité remonte à une nomination que personne de vivant ne se rappelle.\n\nC'est ainsi que l'empire a perdu l'Occident la première fois. Cela a pris un peu plus de temps lors de cette occasion."
 cc_byz_exarch.5.desc_absorbed: "L'exarchat a discrètement cessé d'en être un. L'exarque actuel est le quatrième, il a été choisi à Constantinople à partir d'une liste préparée à Constantinople, il a occupé deux autres postes avant celui-ci et s'attend à en occuper un autre après, et la différence entre sa position et celle de tout autre gouverneur n'est plus qu'une question de titre sur sa correspondance.\n\nRome est une province. Elle est administrée, évaluée et garnisonnée depuis la capitale, et les hommes qui l'administrent sont des fonctionnaires plutôt qu'une famille. L'arrangement inventé pour éviter de déplacer la capitale s'est terminé en rendant ce déplacement inutile."
 cc_byz_exarch.5.desc_standing: "L'arrangement persiste, ce qui n'est pas la même chose que d'être réglé.\n\nL'exarque obéit aux instructions qui arrivent avec une autorité suffisante et interprète le reste. Il reverse ce qu'il juge nécessaire à la capitale et conserve ce qu'il juge nécessaire à Rome, et son jugement a été globalement défendable. Son successeur sera choisi en partie à Constantinople et en partie à Rome, selon un processus que personne n'a mis par écrit, et les deux parties décriront le résultat comme ayant été leur décision.\n\nCela fonctionne. Personne ne prendrait la peine d'expliquer précisément pourquoi."
 cc_byz_exarch.5.desc_recalled: "L'arrangement tient, et tous ceux qui sont impliqués savent précisément à quel point il a failli ne pas tenir.\n\nIl a été convoqué et il est venu. Il est resté à Constantinople onze semaines, a été bien reçu, a été rétabli dans son poste, et toute l'affaire est désormais qualifiée de consultation. Ce que cela a établi, c'est que la convocation fonctionne, ce que le palais avait besoin de savoir et n'avait aucun autre moyen de découvrir.\n\nCela a également établi le prix. Il est venu parce que venir était, tout compte fait, préférable à l'alternative, et les deux parties ont fait ce calcul. Le prochain exarque le fera aussi, et les conditions ne favoriseront pas toujours la capitale aussi étroitement qu'elles l'ont fait cette fois."
 cc_byz_exarch.5.a: "C'est ainsi."

 # cc_byz_papal.1 - the rite
 cc_byz_papal.1.title: "Le Rite dans les Églises de la Ville"
 cc_byz_papal.1.desc: "L'exarque demande des instructions sur un point qu'il ne peut régler lui-même, et il a raison de dire qu'il ne le peut pas.\n\nRome est une ville catholique administrée par un nommé orthodoxe au nom d'un empereur orthodoxe. Ses églises célèbrent le rite latin car elles l'ont toujours fait. La question est de savoir si elles continuent, si quelque chose change dans les églises principales, et si le nom de l'empereur est prononcé dans la liturgie d'une ville dont l'évêque le considère comme un schismatique.\n\nIl n'y a pas de réponse qui ne soit pas une affirmation, y compris la réponse consistant à ne rien toucher."
 cc_byz_papal.1.a: "Ne touchez pas aux églises. Le rite n'est pas de notre ressort."
 cc_byz_papal.1.b: "Liturgie grecque dans les églises principales."
 cc_byz_papal.1.c: "Une seule église grecque, richement dotée. Rien d'autre n'est touché."

 # cc_byz_papal.2 - guest, subject or hostage
 cc_byz_papal.2.title: "L'Évêque de Rome"
 cc_byz_papal.2.desc: "Le statut du Pape n'a pas été défini, car il a été pratique d'éviter de le définir et parce qu'aucune définition ne plairait à tout le monde.\n\nIl vit dans une ville administrée par le gouverneur de l'empereur. Il possède une maison, une correspondance, un revenu et un grand nombre de visiteurs, et pour l'instant, ces quatre éléments perdurent car personne n'a décidé qu'ils ne le devaient pas. L'exarque demande une règle, ayant été placé dans la position d'en improviser une à chaque fois qu'une question se pose, et il est en droit de le demander."
 cc_byz_papal.2.desc_hostile: "Le statut du Pape n'a pas été défini, et l'absence de définition a cessé d'être pratique.\n\nLes relations sont mauvaises. Il a protesté contre les nominations, le rite et la taxation, dans cet ordre et par écrit, et les lettres ont circulé en Occident. Il possède une maison, une correspondance et un grand nombre de visiteurs, et l'exarque a commencé à demander, avec une certaine urgence, lequel de ces trois éléments il est censé autoriser."
 cc_byz_papal.2.a: "Un invité. Sa maison, sa garde, ses lettres."
 cc_byz_papal.2.b: "Un sujet. Nous payons pour la maison et nous lisons les lettres."
 cc_byz_papal.2.c: "Laisser cela indéfini. La pratique réglera la question."

 # cc_byz_papal.3 - appointments
 cc_byz_papal.3.title: "Nominations sans assentiment"
 cc_byz_papal.3.desc: "Le Pape a nommé des évêques à des sièges au sein de l'exarchat sans consulter l'exarque ni Constantinople.\n\nIl dirait que nommer des évêques est sa raison d'être, et qu'aucun empereur n'a jamais été consulté. L'empereur répondrait qu'aucun empereur n'a jamais gouverné la ville auparavant, et que les hommes nommés possèdent des terres, collectent des revenus et commandent la loyauté de populations dont l'exarque est responsable.\n\nLes deux positions s'appuient sur quatre cents ans de précédents. Les précédents ne concordent pas, raison pour laquelle ils durent depuis quatre cents ans."
 cc_byz_papal.3.desc_subject: "Le Pape a nommé des évêques au sein de l'exarchat sans consulter personne, ce qui est une affirmation considérable de la part d'un homme dont la maison est payée par les comptes de l'exarque.\n\nC'est également, note l'exarque dans son rapport, interprété en Italie exactement comme tel : une démonstration que la papauté fonctionne toujours, faite par une papauté qui n'a plus guère d'autres moyens de le démontrer. Refuser les nominations confirmerait ce que les détracteurs de l'empereur disent de l'arrangement. Les accepter confirmerait ce qu'ils disent de l'empereur."
 cc_byz_papal.3.a: "Les refuser. Nommer nos propres hommes."
 cc_byz_papal.3.b: "Les accepter. Un évêque est un évêque."
 cc_byz_papal.3.c: "Que l'exarque règle cela localement."

 # cc_byz_papal.4 - excommunication
 cc_byz_papal.4.title: "La Sentence"
 cc_byz_papal.4.desc: "La sentence d'excommunication a été prononcée et publiée, contre l'exarque nommément et contre l'empereur en des termes qui ne laissent place à aucun doute.\n\nContre l'empereur, elle est presque insignifiante : il n'appartient pas à cette communion, et ce depuis avant la naissance de son grand-père. Contre l'exarque, elle ne l'est pas du tout. Il gouverne des catholiques, ses soldats sont catholiques, la famille de sa femme est catholique, et chacun d'eux s'est vu dire par sa propre église que l'obéissance envers lui est un péché.\n\nLe Pape a choisi l'unique instrument qui ne coûte rien à l'empereur et tout à son gouverneur."
 cc_byz_papal.4.a: "Ignorez cela. Nous n'avons jamais appartenu à sa communion."
 cc_byz_papal.4.b: "Destituer l'exarque. Nommer quelqu'un d'acceptable."
 cc_byz_papal.4.c: "Faites-le lever par l'intermédiaire de la légation, et non par soumission."

 # cc_byz_papal.10 - THE GUARD
 cc_byz_papal.10.title: "Le dernier du patrimoine"
 cc_byz_papal.10.desc: "Les États pontificaux sont finis en tant que puissance temporelle. Ce qu'il reste, c'est une ville, une maison et un vieil homme avec un titre, et les armées sur le terrain pourraient mettre fin aux trois en une saison.\n\nL'argument en faveur de cette fin est qu'une papauté dotée d'un territoire est une papauté capable de lever des armées, de financer des ennemis et de prendre parti, et elle a fait les trois. L'argument opposé est plus subtil et l'exarque l'a bien formulé : la fonction survit à la destruction de l'État, et un pape dépouillé de tout est un pape dont les successeurs sont choisis par quiconque les abrite. Mieux vaut une papauté qui doit son existence à l'empereur qu'une papauté sous la garde d'un autre, élue dans la ville d'un autre, et définitivement à la disposition de la puissance occidentale qui l'aurait accueillie.\n\nLes cardinaux observent la décision qui sera prise. Toutes les cours catholiques d'Europe font de même."
 cc_byz_papal.10.a: "Laissez-lui la ville. Prenez le reste."
 cc_byz_papal.10.b: "Prendre la ville. Lui laisser le bureau."
 cc_byz_papal.10.c: "En finir. Il n'y aura plus de papes."

 # cc_byz_papal.11 - no papacy
 cc_byz_papal.11.title: "Une Église sans tête"
 cc_byz_papal.11.desc: "Il n'y a pas de pape, et il n'y a aucune procédure pour en produire un, car chaque procédure existante passait par une institution qui n'existe plus.\n\nLes cardinaux sont dispersés dans quatre pays et chaque groupe soutient qu'il constitue à lui seul le collège. Trois rois ont proposé d'héberger une élection et chaque offre a été interprétée par les deux autres comme une tentative d'acheter purement et simplement la papauté. Les évêques correspondent furieusement et ne s'entendent sur rien.\n\nLa chrétienté occidentale découvre ce que signifie n'avoir aucun arbitre, et elle le découvre à cause d'une décision prise à Constantinople."
 cc_byz_papal.11.a: "Qu'ils s'en disputent entre eux."
 cc_byz_papal.11.b: "Convoquons nous-mêmes les évêques occidentaux."
 cc_byz_papal.11.c: "Le siège est vacant. Ses droits reviennent aux patriarches."

 # cc_byz_italy.1 - Guelph and Ghibelline
 cc_byz_italy.1.title: "Guelfes et Ghibellins"
 cc_byz_italy.1.desc: "L'Italie est divisée depuis un siècle entre le parti du Pape et le parti de l'Empereur, et la division a cessé depuis longtemps de concerner l'un ou l'autre. C'est ainsi qu'une commune sait lequel de ses voisins elle doit haïr.\n\nDans ce contexte arrive un exarchat : une nouvelle puissance en Italie, tenant Rome, gouvernant au nom d'un empereur qui est sans aucun doute un empereur et qui n'est pas celui que les Ghibellins entendent. Les deux partis ont envoyé des représentants. Tous deux ont expliqué que la position de l'exarchat leur revenait de droit. Aucun n'a envisagé qu'il puisse s'agir d'une troisième voie."
 cc_byz_italy.1.a: "Les gibelins. Il y a déjà un empereur dans cette querelle."
 cc_byz_italy.1.b: "Les guelfes. Nous détenons la ville du Pape ; tenons également son parti."
 cc_byz_italy.1.c: "Ni l'un ni l'autre. Nous sommes le parti impérial."

 # cc_byz_italy.2 - the quarters
 cc_byz_italy.2.title: "Les Quartiers dans les Ports"
 cc_byz_italy.2.desc: "Les républiques veulent dans les ports de l'exarchat ce qu'elles ont à Constantinople : un quartier, un entrepôt, leurs propres tribunaux pour leur propre peuple, et l'exemption des taxes que tout le monde paie.\n\nElles soulignent qu'elles possèdent ces choses partout ailleurs sur cette côte et que le commerce se déplacera simplement vers les ports où elles les ont. C'est vrai. Elles ne soulignent pas qu'un quartier avec ses propres tribunaux est un morceau d'un autre État, car tout le monde dans la pièce le sait déjà et le dire serait indélicat."
 cc_byz_italy.2.desc_indebted: "Les républiques veulent des quartiers dans les ports de l'exarchat, et la demande a été formulée avec une délicatesse qui est elle-même le message.\n\nElles n'ont mentionné les soldes impayées qu'une seule fois, tôt, au passage, comme une question dont elles sont convaincues qu'elle ne doit pas affecter la discussion présente. Personne dans la pièce ne l'a cru et personne n'était censé le croire. L'empereur se voit demander une faveur par des hommes qui pourraient réclamer ce qu'il leur doit, et le fait qu'ils aient choisi de demander plutôt que d'exiger est la courtoisie qui leur est accordée."
 cc_byz_italy.2.a: "Accordez les quartiers. Nous avons besoin du commerce."
 cc_byz_italy.2.b: "Refuser. Garnisonner les ports correctement."
 cc_byz_italy.2.c: "Une seule république, à condition qu'elle exclue les autres."

 # cc_byz_italy.3 - the communes
 cc_byz_italy.3.title: "Les communes"
 cc_byz_italy.3.desc: "Les communes de l'exarchat préféreraient ne pas être gouvernées par un fonctionnaire impérial, et s'appliquent à expliquer que ce n'est rien de personnel.\n\nElles gèrent leurs propres affaires depuis six générations via des conseils, des consuls et un corps de coutumes qui précède toute revendication actuelle sur elles. Ce qu'elles veulent est ce qu'elles ont toujours voulu : être confirmées dans leurs libertés par une autorité distante qui s'en aille ensuite. Plusieurs ont suggéré un signore de leur propre choix qui dépendrait de l'exarque, ce qui résout le problème avec élégance et en crée un autre."
 cc_byz_italy.3.a: "Les garnisonner."
 cc_byz_italy.3.b: "Que chacun conserve son signore, avec la confirmation de l'exarque."
 cc_byz_italy.3.c: "Les acheter avec des chartes plutôt qu'avec des garnisons."

 # cc_byz_italy.4 - a second emperor
 cc_byz_italy.4.title: "Deux empereurs romains"
 cc_byz_italy.4.desc: "La question a été soulevée dans le nord, formellement, dans un document destiné à être lu à haute voix : de quel droit le dirigeant de Constantinople se qualifie-t-il d'empereur romain alors qu'un empereur romain est couronné en Occident, et de quel autre droit garnise-t-il Rome ?\n\nLa réponse est onze cents ans de succession continue depuis Auguste, et c'est une très bonne réponse, et elle n'a jamais une seule fois réglé cet argument. L'Occident a sa propre réponse, de qualité comparable, et les deux ont coexisté par le simple moyen qu'aucune des deux parties ne détenait Rome. Ce moyen a maintenant disparu."
 cc_byz_italy.4.desc_ghibelline: "La question a été soulevée dans le nord, et la gêne est considérable, car l'exarchat est inscrit dans le parti impérial d'une querelle portant sur l'identité de l'empereur concerné.\n\nLes Ghibellins ont accepté un gouverneur d'un empereur d'Orient dans leur parti en comprenant qu'un empereur est un empereur et que les ennemis de l'Italie sont les amis du Pape. Leur protecteur en Allemagne a maintenant demandé, par écrit et publiquement, quel empereur exactement le parti impérial s'estime soutenir. Personne dans le parti ne souhaite répondre, et le document exige que quelqu'un le fasse."
 cc_byz_italy.4.desc_dynasty: "La question a été soulevée dans le nord : de quel droit le dirigeant de Constantinople se qualifie-t-il d'empereur romain, et de quel autre droit garnise-t-il Rome ?\n\nLa seconde partie de la question est la difficulté, car la réponse honnête est qu'il ne le fait pas. Rome est détenue par une famille qui la gouverne depuis quatre générations, verse un paiement de courtoisie, et traiterait une instruction de Constantinople concernant sa conduite envers l'empereur d'Occident comme une question relevant de son propre jugement.\n\nLe document venant du nord a été adressé à Constantinople. La réponse, quoi qu'elle dise, devra être mise en œuvre par des gens qui ne l'ont pas écrite et à qui on n'a rien demandé."
 cc_byz_italy.4.desc_absorbed: "La question a été soulevée dans le nord : de quel droit le dirigeant de Constantinople se qualifie-t-il d'empereur romain, et de quel autre droit garnise-t-il Rome ?\n\nEn l'occurrence, la réponse est simple, ce qui est assez inhabituel pour être noté. Rome est une province. Elle est évaluée, garnisonnée et administrée par des fonctionnaires nommés à Constantinople et rappelés à volonté, exactement comme la Thrace. L'empereur détient la ville au même titre qu'il détient toute autre ville, et la revendication occidentale est une revendication contre un État qui gouverne manifestement le lieu.\n\nC'est une position bien meilleure pour argumenter que celle qu'a occupée l'empire en Italie depuis huit cents ans."
 cc_byz_italy.4.a: "Répondez avec la même monnaie. Il n'y a qu'un seul empereur romain."
 cc_byz_italy.4.b: "Ne dites rien. Les titres ne coûtent rien, mais Rome, si."
 cc_byz_italy.4.c: "Proposer que les deux empires se reconnaissent mutuellement."
