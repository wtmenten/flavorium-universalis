l_french:
 # Country modifiers
 STATIC_MODIFIER_NAME_cc_byz_customs_conceded: "Douanes concédées"
 STATIC_MODIFIER_DESC_cc_byz_customs_conceded: "Une république étrangère détient une exemption écrite sur les douanes de la capitale. Le commerce n'a pas chuté. Il ne passe simplement plus par le trésor lors de son transit."
 STATIC_MODIFIER_NAME_cc_byz_creditors_wary: "Créanciers méfiants"
 STATIC_MODIFIER_DESC_cc_byz_creditors_wary: "Les maisons bancaires d'Italie ont comparé leurs notes sur les comptes de l'empire et ont fixé le prix du résultat. De l'argent peut encore être obtenu. Cela coûte plus cher et il y en a moins."
 STATIC_MODIFIER_NAME_cc_byz_sound_credit: "Crédit solide"
 STATIC_MODIFIER_DESC_cc_byz_sound_credit: "Les intérêts ont été payés le jour de l'échéance, en totalité, sans demande de délais. C'est coûteux, et cela vaut son prix."
 STATIC_MODIFIER_NAME_cc_byz_revenue_farmed: "Revenus affermés"
 STATIC_MODIFIER_DESC_cc_byz_revenue_farmed: "Les impôts de l'année prochaine ont été vendus cette année. L'argent n'est arrivé qu'une fois. Les hommes qui ont acheté le droit collectent les fonds pendant toute la durée du contrat, gardent la différence et ne rendent compte à personne au palais."
 STATIC_MODIFIER_NAME_cc_byz_hereditary_farm: "Ferme héréditaire"
 STATIC_MODIFIER_DESC_cc_byz_hereditary_farm: "Le droit de collecte est passé à un fils. Personne ne l'a accordé et personne ne l'a contesté. Les familles détenant les contrats les traitent désormais comme des terres, et elles n'ont pas tort."
 STATIC_MODIFIER_NAME_cc_byz_debt_repudiated: "Dette répudiée"
 STATIC_MODIFIER_DESC_cc_byz_debt_repudiated: "Une dette a été déclarée nulle par l'autorité impériale. L'autorité était suffisante. La conséquence est qu'aucune maison en Italie ne prêtera plus selon les anciens termes avant longtemps."
 STATIC_MODIFIER_NAME_cc_byz_fiscal_retrenchment: "Compression budgétaire"
 STATIC_MODIFIER_DESC_cc_byz_fiscal_retrenchment: "Réduction des dépenses, paiement des arriérés, l'évaluation reconstruite à partir du recensement. Lent, impopulaire dans tous les secteurs importants, et la seule méthode qui ait jamais fonctionné."
 STATIC_MODIFIER_NAME_cc_byz_crowned_without_regalia: "Couronné sans les regalia"
 STATIC_MODIFIER_DESC_cc_byz_crowned_without_regalia: "La couronne utilisée lors du couronnement était en verre doré. Les originales se trouvent dans un coffre vénitien. Tout le monde dans l'église le savait, et la cérémonie s'est déroulée comme si ce n'était pas le cas."

 # Opinion modifiers
 cc_byz_creditor_privilege: "Détient des privilèges impériaux"
 cc_byz_rival_privilege_granted: "Privilèges accordés à notre rival"
 cc_byz_bought_out_creditors: "Rachat de notre dette"
 cc_byz_holds_pledged_territory: "Détient notre territoire engagé"
 cc_byz_pledge_redeemed: "Ont honoré leur promesse"
 cc_byz_repudiated_debt: "Ont répudié leur dette envers nous"
 cc_byz_creditor_syndicate: "A agi contre nous en tant que syndicat"
 cc_byz_holds_tax_farm: "Fermes de nos revenus"

 # cc_byz_debt.1 - the first Italian loan
 cc_byz_debt.1.title: "Les Modalités du Prêt"
 cc_byz_debt.1.desc: "L'argent est disponible. Il l'est depuis un certain temps, et les agents qui portent l'offre ont veillé à préciser qu'elle est faite par égard pour l'empire plutôt que dans l'espoir d'un profit.\n\nLe taux est raisonnable. Il le devient encore plus si l'accord inclut certains petits arrangements concernant les douanes, que les agents mentionnent tardivement dans la conversation, comme une réflexion après coup, après s'être exercés."
 cc_byz_debt.1.desc_venal: "L'argent est disponible, et les hommes qui portent l'offre ont déjà fait des affaires dans cette ville. Ils savent quels fonctionnaires feront avancer un document et combien coûte cet avancement.\n\nLe taux est raisonnable, et il s'améliore si certains arrangements sont inclus concernant les douanes. Ils n'insistent pas. Ils ont appris qu'à Constantinople, il est rarement nécessaire d'insister deux fois sur un point."
 cc_byz_debt.1.a: "Payez le taux. Ne concédez rien."
 cc_byz_debt.1.b: "Accepter les meilleures conditions. Une question de douane ne coûte rien aujourd'hui."
 cc_byz_debt.1.c: "Refuser. L'argent peut être levé ici."

 # cc_byz_debt.2 - the customs exemption
 cc_byz_debt.2.title: "L'exemption écrite"
 cc_byz_debt.2.desc: "Ce qui était un arrangement est devenu une demande de document. La république souhaite que l'exemption soit actée sous sceau, à perpétuité, afin que la question n'ait pas à être revisitée par de futurs fonctionnaires qui pourraient être moins bien informés.\n\nLa somme en jeu n'est pas importante. C'est le précédent qui compte, et les deux parties le savent."
 cc_byz_debt.2.desc_cordial: "La relation a été bonne et la république le dit longuement avant d'en venir au fait. Le fait est un document : l'exemption établie sous sceau, à perpétuité, afin que les futurs fonctionnaires ne puissent confondre une courtoisie avec une concession ou une concession avec une courtoisie.\n\nIls ont apporté le texte déjà rédigé. C'est un texte court."
 cc_byz_debt.2.a: "Scellez-le. À perpétuité."
 cc_byz_debt.2.b: "Refuser. Les douanes ne sont pas à eux pour être accordées."
 cc_byz_debt.2.c: "Vingt-cinq ans, et pas un de plus."

 # cc_byz_debt.3 - the island pledge
 cc_byz_debt.3.title: "Garantie contre la dette"
 cc_byz_debt.3.desc: "Les créanciers ont proposé une garantie. Pas un paiement : un gage, détenu contre la dette, restituable intégralement lors du rachat. Ils suggèrent une île, et ils en ont une particulière en tête, et ils l'ont en tête depuis plus longtemps que cette conversation.\n\nLe territoire gagé est restitué lorsque la dette est apurée. Le registre de la restitution de tels gages n'est pas encourageant."
 cc_byz_debt.3.a: "Engagez-le. La dette est annulée."
 cc_byz_debt.3.b: "Payer en espèces. L'île n'est pas une monnaie."
 cc_byz_debt.3.c: "Qu'ils viennent le collecter eux-mêmes."

 # cc_byz_debt.4 - the creditors compare notes
 cc_byz_debt.4.title: "Les créanciers comparent leurs notes"
 cc_byz_debt.4.desc: "Jusqu'à présent, chaque république traitait avec le palais séparément, ce qui a été le principal avantage de l'empire en la matière : ce que l'une ne prêterait pas, une autre le ferait, et aucune ne connaissait le taux de l'autre.\n\nElles se sont rencontrées. Elles ont échangé leurs chiffres. Elles connaissent désormais la totalité de ce qui est dû, ce qui est plus que ce que chacune d'entre elles supposait individuellement, et elles sont venues ensemble au palais."
 cc_byz_debt.4.desc_conceded: "Jusqu'à présent, chaque république traitait avec le palais séparément, et l'exemption douanière accordée à l'une était déplorée par les autres d'une manière qui pouvait être exploitée.\n\nElles se sont rencontrées. Elles ont comparé l'exemption à leurs propres conditions, puis ont comparé ces conditions au montant total dû, et sont arrivées à un chiffre qu'aucune d'entre elles n'avait imaginé individuellement. Elles sont venues ensemble au palais, et elles ont apporté ce chiffre avec elles."
 cc_byz_debt.4.a: "Racheter les meneurs, quel qu'en soit le coût."
 cc_byz_debt.4.b: "Consolider. Laissez-les examiner les livres."
 cc_byz_debt.4.c: "Donnez à l'un d'eux ce que les autres désirent."

 # cc_byz_debt.5 - what the quarter became
 cc_byz_debt.5.title: "Le Quartier d'outre-mer"
 cc_byz_debt.5.desc_captured: "Le bilan est terminé et il dit ce qu'il a toujours été censé dire. Les douanes de la capitale sont collectées par des hommes qui les versent à un conseil dans une autre ville. Le quartier d'outre-mer possède ses propres murs, ses propres tribunaux et une garnison qui n'est pas celle de l'empereur.\n\nRien n'a été cédé. Chaque étape était une réponse raisonnable à une difficulté réelle, et la somme des réponses raisonnables est une ville étrangère dressée sur la rive opposée du port, surveillant le trafic maritime."
 cc_byz_debt.5.desc_free: "Le bilan est terminé. Les dettes ont été payées au taux convenu le jour convenu, les exemptions ont été refusées, et les agents qui transportent l'argent ont conclu que Constantinople est un endroit coûteux pour prêter, mais fiable.\n\nLa fiabilité a été achetée à un certain prix. Les douanes sont toujours collectées par les hommes de l'empereur, et cela s'avère avoir valu chaque paiement effectué à temps."
 cc_byz_debt.5.desc_mixed: "Le bilan est terminé et le tableau est mitigé, ce qui est l'état habituel de ces choses. Certaines exemptions subsistent et d'autres ont expiré. Les agents prêtent toujours et se disputent toujours sur le taux.\n\nLe quartier d'outre-mer s'est agrandi. Il n'est pas encore devenu une entité distincte, et la question de savoir s'il le deviendra n'est pas tranchée."
 cc_byz_debt.5.a: "Notez-le dans le registre."

 # cc_byz_debt.10 - the coronation
 cc_byz_debt.10.title: "Un couronnement sans couronne"
 cc_byz_debt.10.desc: "Les regalia sont à Venise, retenues pour une dette qui n'a pas été remboursée, et un couronnement doit avoir lieu.\n\nLe maître des cérémonies a soulevé la difficulté dans les termes les plus prudents à sa disposition. Des copies peuvent être faites. Elles peuvent être bien faites, en dorure et en verre coloré, et à une distance de vingt pas à la lumière des bougies, elles ne seront pas distinguables de ce qu'elles remplacent. Il ne dit pas ce qu'elles seront de plus près, ou pour les hommes se tenant le plus près, qui sont les hommes dont l'opinion sur la cérémonie importe le plus."
 cc_byz_debt.10.a: "Dorures et verre. La cérémonie se poursuit."
 cc_byz_debt.10.b: "Pas de couronne du tout. Laissons l'absence parler."
 cc_byz_debt.10.c: "Faites de la perte le sujet du discours."

 # cc_byz_debt.11 - the clergy on Latin creditors
 cc_byz_debt.11.title: "Le clergé au sujet des créanciers"
 cc_byz_debt.11.desc: "Un sermon prêché dans la capitale a été rapporté au palais, et le rapport était détaillé car le prédicateur l'avait voulu ainsi.\n\nSon sujet était les regalia : le fait que les insignes des empereurs romains soient conservés dans un coffre latin contre le grand livre d'un marchand, et qu'un trône incapable de racheter sa propre couronne pourrait examiner ce qu'il a été prêt à gager par ailleurs. Il n'a pas nommé l'union, ni les exemptions, ni rien d'autre. Il n'en avait pas besoin. L'assemblée s'est chargée de les fournir elle-même."
 cc_byz_debt.11.desc_customs: "Un sermon prêché dans la capitale a été rapporté au palais, et cette fois, le prédicateur a nommé les choses.\n\nIl a nommé les regalia dans le coffre vénitien. Il a nommé l'exemption douanière, le quartier de l'autre côté de l'eau, et le fait qu'un homme puisse désormais se tenir dans cette ville sous une juridiction étrangère sans rien payer à l'empereur dont il se trouve dans le port. Il a demandé ce qu'il restait à gager, a répondu lui-même à la question, et l'assemblée a acquiescé à la réponse."
 cc_byz_debt.11.a: "Être d'accord avec lui. Publiquement."
 cc_byz_debt.11.b: "Lui rappeler qu'il n'a pas offert l'argent."
 cc_byz_debt.11.c: "Demander à l'Église de financer le rachat."

 # cc_byz_debt.13 - a generation later
 cc_byz_debt.13.title: "Toujours à Venise"
 cc_byz_debt.13.desc: "Le clerc préparant le bilan annuel a inscrit les regalia dans l'inventaire des biens gagés, comme l'avait fait son prédécesseur, et celui d'avant lui. L'entrée a été recopiée sans commentaire pendant assez longtemps pour que l'écriture dans laquelle elle fut initialement rédigée ne soit plus utilisée à la chancellerie.\n\nPersonne n'a décidé d'arrêter d'essayer de les racheter. Il n'y a eu ni débat ni instruction. L'article a simplement glissé, sur trois règnes, de la liste des choses à récupérer à la liste des choses acquises, et les hommes qui servent le palais ont tiré la conclusion évidente sur ce qu'il y avait d'autre sur cette liste qui pourrait être déplaçable."
 cc_byz_debt.13.a: "Copiez-le à nouveau."

 # cc_byz_debt.20 - selling revenue forward
 cc_byz_debt.20.title: "Revenus de l'année prochaine"
 cc_byz_debt.20.desc: "Le trésor a besoin d'argent maintenant et en aura plus tard, et il y a des hommes qui échangeront la seconde condition contre la première à un taux qu'ils considèrent comme juste.\n\nLe mécanisme est ancien et bien compris. Une somme est versée au trésor aujourd'hui. En échange, l'acheteur collecte les taxes d'un district pendant un certain nombre d'années et conserve tout ce qu'il peut extraire au-delà de ce qu'il a payé. La somme arrive immédiatement. L'extraction est le problème de quelqu'un d'autre, dans un district que la cour ne visitera pas, auprès de gens qui n'ont aucun moyen de signaler ce qu'on leur fait."
 cc_byz_debt.20.desc_war: "L'armée est sur le terrain et l'armée doit être payée, et le trésor détient ce qu'il détient.\n\nIl y a des hommes qui avanceront la somme aujourd'hui en échange du droit de collecter les taxes d'un district pendant un certain nombre d'années. Ils garderont tout ce qu'ils extrairont au-delà de ce qu'ils ont payé. Tout le monde dans la pièce comprend que les conditions seraient meilleures en temps de paix et que l'empire n'est pas en position d'attendre la paix, et les hommes qui font l'offre le comprennent mieux que quiconque."
 cc_byz_debt.20.a: "Vendez-le aux bourgeois."
 cc_byz_debt.20.b: "Vendez-le aux Italiens. Ils paient plus cher."
 cc_byz_debt.20.c: "Ne vendez rien. Réduisez plutôt les dépenses."

 # cc_byz_debt.21 - how the farmers collect
 cc_byz_debt.21.title: "Comment les fermiers collectent"
 cc_byz_debt.21.desc: "Les contrats sont honorés. Les sommes arrivent le jour où elles sont dues et les comptes s'équilibrent, ce qui est le seul test que le palais a appliqué.\n\nDes rapports ont commencé à arriver par d'autres voies. Les collecteurs perçoivent les taxes avant l'évaluation, perçoivent en nature quand la monnaie manque, et prélèvent deux fois dans les mêmes villages au motif que la première collecte concernait une année différente. Il n'existe aucune procédure pour qu'un paysan conteste cela, car l'homme à qui il s'adresserait a acheté le droit d'être là."
 cc_byz_debt.21.a: "Les freiner. Le contrat vaut moins que la campagne."
 cc_byz_debt.21.b: "L'argent arrive à temps. C'était là le test."
 cc_byz_debt.21.c: "Pendez l'un d'eux là où les autres pourront le voir."

 # cc_byz_debt.22 - the farm becomes heritable
 cc_byz_debt.22.title: "Le contrat passe à un fils"
 cc_byz_debt.22.desc: "Un fermier du revenu est décédé et son fils a continué la collecte. Aucune concession n'a été faite. Aucun officiel n'a été consulté. Le fils s'est simplement présenté dans les mêmes villages avec la même escorte, et les villages ont payé, car de leur point de vue, l'arrangement n'a changé en rien sur un point où ils pourraient agir.\n\nLe palais en a été informé par courtoisie. La formulation de l'avis précise qu'une réponse n'est pas attendue."
 cc_byz_debt.22.desc_venal: "Un fermier du revenu est décédé et son fils a continué la collecte, ce qui ne surprend personne dans une chancellerie où les postes se transmettent ainsi depuis une génération.\n\nLe palais en a été informé par courtoisie. Le clerc qui a reçu l'avis l'a classé sans le transmettre à sa hiérarchie, estimant raisonnablement que c'est simplement ainsi que les choses se font désormais, et on ne l'a pas corrigé."
 cc_byz_debt.22.a: "Le reconnaître. Facturer la charte."
 cc_byz_debt.22.b: "Racheter les contrats, à n'importe quel prix."
 cc_byz_debt.22.c: "Faites des collecteurs des officiers salariés."

 # cc_byz_debt.30 - the payment cannot be made
 cc_byz_debt.30.title: "Le paiement arrive à échéance"
 cc_byz_debt.30.desc: "L'échéance tombe ce mois-ci et le trésor ne peut l'honorer. Il ne s'agit pas d'un litige sur la somme ou la date. L'argent n'est pas là, et les officiers qui normalement le trouveraient ont été sollicités et n'ont rien à suggérer qui n'ait déjà été tenté.\n\nL'agent du créancier est en ville et a demandé une audience pour le lendemain de l'échéance, ce qui est une courtoisie, et une courtoisie délibérée."
 cc_byz_debt.30.desc_grip: "L'échéance tombe ce mois-ci et le trésor ne peut l'honorer ; l'agent du créancier n'a pas demandé d'audience, car il n'a plus besoin d'en demander.\n\nIl a été au palais trois fois cette saison pour des questions de recouvrement. Il connaît l'état des comptes mieux que plusieurs hommes payés pour le connaître. Lorsque le paiement sera manqué, il ne sera pas surpris, et les conditions qu'il proposera ensuite auront été rédigées avant le défaut plutôt qu'en réponse à celui-ci."
 cc_byz_debt.30.desc_again: "L'échéance tombe ce mois-ci et le trésor ne peut l'honorer, et cela s'est déjà produit, ce qui change la nature des discussions.\n\nLa première fois, les créanciers ont traité un paiement manqué comme une difficulté et ont renégocié la dette sur cette base. Ils ne feront pas la même supposition deux fois. Un seul défaut est une mauvaise année. Un second est une description de l'état des finances, et les conditions proposées cette fois seront fixées selon cette description plutôt que selon l'année."
 cc_byz_debt.30.a: "Affamer les bureaux. La dette est payée."
 cc_byz_debt.30.b: "Leur demander de le réécrire."
 cc_byz_debt.30.c: "La dette est nulle. Qu'ils pétitionnent."
 cc_byz_debt.30.d: "Persuadez-les de le reconduire sans changement."

 # cc_byz_debt.31 - the new terms
 cc_byz_debt.31.title: "Les nouvelles conditions"
 cc_byz_debt.31.desc: "Ils sont disposés. Ils l'auraient toujours été, car une dette renégociée à leur taux a plus de valeur pour eux qu'une dette répudiée pour personne.\n\nLe taux qu'ils proposent est élevé. Ils proposent également, dans le même souffle et sur le même ton, une alternative : un taux inférieur, si la collecte est supervisée par un facteur de leur choix, résidant à la capitale, avec accès aux registres. La seconde offre est celle qu'ils veulent voir acceptée."
 cc_byz_debt.31.a: "Prendre le taux le plus élevé. Nos registres restent les nôtres."
 cc_byz_debt.31.b: "Prendre le taux le plus bas. Laisser leur homme consulter les livres."

 # cc_byz_debt.32 - the creditors act as one
 cc_byz_debt.32.title: "Un syndicat de créanciers"
 cc_byz_debt.32.desc: "Les républiques se querellent sur tout et se sont querellées sur les dettes de l'empire depuis qu'il y en a. Elles ont cessé de se quereller sur celle-ci.\n\nUne dette déclarée nulle par l'autorité impériale n'est pas un litige commercial entre une maison et une cour. C'est une proposition sur la question de savoir si la parole de l'empereur le lie, et chaque prêteur en Italie a intérêt à ce que la réponse soit non. Ils sont tombés d'accord sur la réponse. Le crédit est fermé, dans les trois villes, aux mêmes conditions, ce qui est une chose qu'ils n'avaient jamais réussi auparavant."
 cc_byz_debt.32.a: "Patientez. Nous ne leur achèterons rien."
 cc_byz_debt.32.b: "Réglez une partie du problème. Rouvrez la porte."
 cc_byz_debt.32.c: "Il y a de l'argent à l'est d'ici."

 # cc_byz_debt.33 - after the bankruptcy
 cc_byz_debt.33.title: "Après le Règlement de Comptes"
 cc_byz_debt.33.desc: "Le trésor est à sec. Pas ralenti : à sec, au sens précis où les officiers responsables des paiements ont reçu l'instruction de n'en faire aucun, et ont commencé à l'expliquer à des hommes à qui l'on devait de l'argent et qui avaient pris des dispositions en supposant le recevoir.\n\nCe qui arrive ensuite se décide dans les provinces plutôt qu'à la capitale, par quiconque possède encore là-bas des pièces pour payer des soldats. Le rôle du palais est de découvrir, le moment venu, ce qui a été décidé."
 cc_byz_debt.33.desc_jewels: "Le trésor est à sec, et la nouvelle a voyagé vers Venise plus rapidement que vers Thessalonique, car Venise l'attendait.\n\nLes regalia ont été gagés pour une dette que l'empire a maintenant formellement cessé de servir. La position juridique n'est pas compliquée et les Vénitiens ne se sont pas donné la peine de la compliquer. Ce qui arrivera dans les provinces sera décidé par quiconque possède encore là-bas des pièces pour payer des soldats, et le palais apprendra ce qui a été décidé quelques mois après les faits."
 cc_byz_debt.33.desc_strained: "Le trésor est à sec, et cela arrive au pire moment possible, ce qui n'est pas une coïncidence.\n\nLes garnisons dans les provinces récemment acquises ont déjà plusieurs mois d'arriérés. Les routes qui étaient censées lier ces provinces à la capitale n'ont pas été construites, car l'argent destiné à celles-ci est allé aux garnisons, et l'argent des garnisons a servi à payer les intérêts. Chacune de ces décisions était correcte au moment où elle a été prise. Le résultat est une frontière tenue par des hommes qui n'ont pas été payés, dans un pays qui n'a aucune raison de les nourrir, au moment précis où la capitale annonce qu'elle ne peut payer personne."
 cc_byz_debt.33.a: "Refaire l'évaluation à partir de l'enquête."
 cc_byz_debt.33.b: "Que les magnats collectent et versent ce qu'ils jugent équitable."
 cc_byz_debt.33.c: "Retournez en Italie, les livres ouverts."
 cc_byz_debt.20.d: "Vendre les revenus d'une saison. L'armée doit être payée maintenant."
