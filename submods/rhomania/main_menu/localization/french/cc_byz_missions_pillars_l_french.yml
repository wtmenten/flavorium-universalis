l_french:
 # Tasks added by the forking rework: the three pillars, the reconvergences, the five
 # exclusive forks and the optional spurs.
 #
 # FORK DESCRIPTIONS END WITH WHAT THEY CLOSE. Taking one side of an exclusive fork hides the
 # other (visible = NOT completed), so the player would otherwise never learn there was a
 # choice. Naming the road not taken in the description of the road taken is the only place
 # that information can live.

 # ---- Reconvergence tooltips ----
 # Each wraps an OR of AND pairs so the player reads one line instead of nine.
 cc_byz_two_of_three_pillars_tt: "Compléter deux des trois piliers : le Fisc, la Foi, l'Épée"
 cc_byz_two_of_three_seats_tt: "Sécuriser deux des trois sièges orientaux : Antioche, Jérusalem, Alexandrie"
 cc_byz_two_of_three_theatres_tt: "Récupérer deux des trois théâtres occidentaux : Italie, Afrique, Spania"
 cc_byz_turkish_question_settled_tt: "La question turque est réglée, par la conquête ou par le tribut"

 # ---- The Fisc ----
 cc_byz_task_nomisma: "Le nomisma restauré"
 cc_byz_task_nomisma_desc: "Porter la base fiscale à soixante. La monnaie qui fut l'étalon de la Méditerranée pendant sept cents ans a été dévaluée quatre fois au cours du siècle dernier, et tous ceux qui commercent avec elle l'ont remarqué."
 cc_byz_task_silk_looms: "Les métiers à soie"
 cc_byz_task_silk_looms_desc: "Atteindre dix ducats de revenus commerciaux mensuels. Deux moines ont sorti les vers de Chine en cachette dans un bâton de marche, et l'empire a détenu le monopole occidental pendant six siècles grâce à cela."
 cc_byz_task_literate_admin: "Une administration lettrée"
 cc_byz_task_literate_admin_desc: "Porter le taux d'alphabétisation moyen au-dessus de vingt-cinq pour cent. L'empire a fonctionné sur papier bien avant tout autre en Europe, et il ne peut continuer à le faire que tant qu'il y a des hommes capables de le lire."
 cc_byz_task_logothete: "Logothète du Cours"
 cc_byz_task_logothete_desc: "Cent points de base fiscale et cinq bureaux financés. Le bureau qui gérait la poste, les routes, le renseignement frontalier et finalement la politique étrangère, car c'était le seul à savoir ce qui se passait."

 # ---- The Faith ----
 cc_byz_task_athonite: "Les monastères d'Athos"
 cc_byz_task_athonite_desc: "Atteindre quarante d'influence religieuse. La Montagne Sainte répond au patriarche en théorie et à elle-même en pratique, et son opinion porte plus loin que celle de n'importe quel évêque."
 cc_byz_task_icons: "Les icônes restaurées"
 cc_byz_task_icons_desc: "Posséder trois œuvres d'art. Le siècle iconoclaste a coûté à l'empire plus d'images que n'importe quelle conquête, et les remplacer est le travail lent qui prouve que le débat est clos."
 cc_byz_task_autocephalous: "Les filles autocéphales"
 cc_byz_task_autocephalous_desc: "Diriger un patriarcat autocéphale. La Serbie, la Bulgarie et la Rus ont désormais toutes leurs propres églises. Diriger l'organisme auquel elles appartiennent fait la différence entre une église mère et une ancienne église mère."
 cc_byz_task_ecumenical_throne: "Le trône œcuménique"
 cc_byz_task_ecumenical_throne_desc: "Soixante-quinze d'influence religieuse et un clergé satisfait. Le patriarche de Constantinople est le premier parmi les Orthodoxes par coutume plutôt que par loi, et la coutume doit être entretenue."

 # ---- The Sword ----
 cc_byz_task_veterans: "Armées vétérans"
 cc_byz_task_veterans_desc: "Atteindre quarante de tradition militaire. L'empire n'a pas déployé d'armée correctement entraînée depuis trois générations, et les hommes qui se souviennent comment faire meurent."
 cc_byz_task_dromon: "La flotte de dromons"
 cc_byz_task_dromon_desc: "Lancer vingt navires en mer. Les détroits sont la seule raison pour laquelle cette ville a survécu, et ils ne valent rien sans coques pour les fermer."
 cc_byz_task_varangians: "La garde varangienne"
 cc_byz_task_varangians_desc: "Lever une compagnie de Varangiens. Des étrangers n'ayant aucun intérêt dans une faction byzantine, ce qui est précisément la raison pour laquelle les empereurs leur ont confié le palais pendant quatre cents ans."
 cc_byz_task_field_army: "L'armée de campagne restaurée"
 cc_byz_task_field_army_desc: "Quarante régiments avec soixante de tradition d'armée. Ni une force de garnison ni des mercenaires : une armée qui peut être envoyée quelque part et dont on peut attendre le retour."

 # ---- Reconvergence ----
 cc_byz_task_state_restored: "L'État restauré"
 cc_byz_task_state_restored_desc: "Compléter deux des trois piliers. L'empire n'a pas besoin d'être fort à tous égards en même temps, et aucun empereur n'y est jamais parvenu. Il doit être suffisamment fort dans deux domaines pour que le troisième puisse être négligé sans provoquer d'effondrement."

 # ---- The Greek World ----
 cc_byz_task_serbian_question: "La question serbe"
 cc_byz_task_serbian_question_desc: "Mettre fin à la Serbie, ou en faire un sujet. Dusan s'est couronné empereur des Serbes et des Grecs et a failli y parvenir. La revendication ne s'éteint pas parce qu'il est mort."
 cc_byz_task_latin_bride: "Une mariée latine"
 cc_byz_task_latin_bride_desc: "Contracter un mariage royal avec une puissance catholique. Chaque empereur des deux derniers siècles s'est marié à l'ouest au moins une fois, et chacun d'entre eux a été critiqué pour cela chez lui."
 cc_byz_task_embassies: "Ambassades vers l'Ouest"
 cc_byz_task_embassies_desc: "Maintenir quatre diplomates. L'empire a survécu à son pire siècle en sachant plus de choses sur ses ennemis qu'ils n'en savaient les uns des autres, et cela doit être financé en permanence."
 cc_byz_task_venetian_alliance: "L'alliance vénitienne"
 cc_byz_task_venetian_alliance_desc: "Amener Venise à porter un regard chaleureux sur l'empire. Ils détiennent les routes maritimes et le crédit, ils ont pillé cette ville une fois, et ils restent la meilleure des deux options disponibles.\n\nChoisir cette option ferme la voie génoise."
 cc_byz_task_genoese_compact: "Le pacte génois"
 cc_byz_task_genoese_compact_desc: "Amener Gênes à porter un regard chaleureux sur l'empire. Ils détiennent déjà Galata de l'autre côté de l'eau et la moitié du commerce de la mer Noire, et un arrangement avec eux est un arrangement avec les gens qui sont déjà là.\n\nChoisir cette option ferme la voie vénitienne."

 # ---- Anatolia ----
 cc_byz_task_sultan_tributary: "Le tributaire du sultan"
 cc_byz_task_sultan_tributary_desc: "Faire des Ottomans un sujet plutôt qu'un cadavre. L'empire leur a payé tribut pendant des décennies et a envoyé des troupes lors de leurs campagnes ; inverser cet arrangement coûte bien moins cher que de les détruire, et est bien plus satisfaisant.\n\nChoisir cette option ferme la voie à leur élimination totale."
 cc_byz_task_anatolia_secured: "L'Anatolie sécurisée"
 cc_byz_task_anatolia_secured_desc: "Détenir les thèmes anatoliens avec la question turque réglée, par la conquête ou par le tribut. L'Asie Mineure est l'endroit d'où proviennent les soldats et le grain de l'empire. Tout le reste n'est qu'une question de temps."
 cc_byz_task_convert_anatolia: "La foi retrouvée"
 cc_byz_task_convert_anatolia_desc: "Porter la population orthodoxe de l'empire à soixante-dix pour cent. Deux siècles de domination turque ont converti plus d'Anatolie que n'importe quelle armée n'en a conquis, et l'annuler est plus lent que ne l'a été la conquête."
 cc_byz_task_tagmata: "Les tagmata restaurés"
 cc_byz_task_tagmata_desc: "Cinquante régiments, et aucune concession de pronoïa en cours. Une armée professionnelle salariée répondant au palais, payée en monnaie plutôt qu'en terres.\n\nChoisir cette option ferme la voie de l'ost féodal."

 # ---- The Levant ----
 cc_byz_task_eastern_sees: "Les sièges orientaux"
 cc_byz_task_eastern_sees_desc: "Sécuriser deux des trois anciens patriarcats d'Orient. Les trois seraient préférables. Deux est le maximum que l'empire ait réussi à obtenir à n'importe quel moment depuis le septième siècle."
 cc_byz_task_sultans_friend: "L'ami du sultan"
 cc_byz_task_sultans_friend_desc: "Régler la question des lieux saints par un accord écrit avec Le Caire. Un condominium n'est pas un triomphe et aucun chroniqueur ne le qualifiera ainsi. C'est également la première frontière orientale stabilisée en quatre cents ans.\n\nChoisir cette option ferme la voie à la Guerre de la Pentarchie."
 cc_byz_task_pentarchy_war: "La guerre de la Pentarchie"
 cc_byz_task_pentarchy_war_desc: "Détenir les cinq anciens patriarcats. Constantinople, Rome, Jérusalem, Antioche et Alexandrie sous un seul empereur pour la première fois depuis avant les conquêtes arabes.\n\nChoisir cette option ferme la voie d'un règlement négocié."

 # ---- The West ----
 cc_byz_task_sicily: "Sicile récupérée"
 cc_byz_task_sicily_desc: "Détenir Palerme et Syracuse. L'île est la charnière entre les deux moitiés de la mer, et aucune flotte ne la traverse sans la permission de celui qui détient ces deux ports."
 cc_byz_task_ravenna: "Ravenne restaurée"
 cc_byz_task_ravenna_desc: "Détenir Ravenne. Le siège de l'ancien exarchat, et la seule ville d'Italie où l'administration impériale est remember comme un gouvernement plutôt que comme une occupation."
 cc_byz_task_western_sea: "La Mer Occidentale"
 cc_byz_task_western_sea_desc: "Récupérer deux des trois théâtres occidentaux. Justinien a pris l'Afrique d'abord et l'Italie ensuite ; l'ordre relevait de l'opportunité plutôt que du plan, et cela peut être à nouveau le cas."

 # ---- The East ----
 cc_byz_task_crown_monopoly: "Le monopole de la Couronne"
 cc_byz_task_crown_monopoly_desc: "Cinquante ducats de revenus commerciaux mensuels, transitant par la couronne. Les épices sont achetées et vendues par des fonctionnaires impériaux et le profit atteint le trésor sans diminution.\n\nChoisir cette option ferme la voie des chartes."
 cc_byz_task_chartered_company: "La compagnie à charte"
 cc_byz_task_chartered_company_desc: "Laisser une compagnie à charte gérer le commerce. Moins d'argent parvient au trésor, mais une classe marchande se développe, capable de financer l'État sans demander les conditions de l'Italie.\n\nChoisir cette option ferme la voie du monopole."

 # ---- Optional spurs ----
 cc_byz_task_reconquest_claim: "Les Antiquaires"
 cc_byz_task_reconquest_claim_desc: "Effectuer trente avancées de recherche. Des érudits travaillant sur les anciens registres provinciaux établissent ce que l'empire possédait, quand, et sur quelle base juridique. Les juristes peuvent faire beaucoup avec cela."
 cc_byz_task_greek_fire: "Le feu grec redécouvert"
 cc_byz_task_greek_fire_desc: "Cinquante de tradition navale et une population lettrée. La formule était un secret d'État détenu par une seule famille, et elle a été perdue de la manière habituelle : personne ne l'a écrite."
 cc_byz_task_hagia_sophia: "Sainte-Sophie entretenue"
 cc_byz_task_hagia_sophia_desc: "Entretenir la cathédrale de Constantinople. Le dôme s'est effondré deux fois et a été reconstruit deux fois, et l'édifice a été l'argument de l'importance de l'empire pendant huit cents ans."
 cc_byz_task_great_palace: "Le Grand Palais"
 cc_byz_task_great_palace_desc: "Posséder six œuvres d'art. Le complexe du palais s'est dégradé depuis que la cour a déménagé à Blachernes, et les visiteurs ont commencé à le remarquer par écrit."
 cc_byz_task_thessaloniki: "La seconde cité"
 cc_byz_task_thessaloniki_desc: "Détenir Thessalonique. La deuxième ville de l'empire, son second port, et le seul endroit en dehors de la capitale possédant des murs dignes de ce nom."
 cc_byz_task_city_adorned: "La cité ornée"
 cc_byz_task_city_adorned_desc: "La cathédrale entretenue, le palais meublé, la seconde ville tenue. Rien de tout cela ne permet de gagner une guerre. Tout cela est la raison pour laquelle les gens viennent encore ici voir à quoi ressemble un empire."
 cc_byz_task_triumph: "Un triomphe dans l'hippodrome"
 cc_byz_task_triumph_desc: "Soixante-dix de tradition militaire. Les formes sont consignées dans les livres cérémoniels et n'ont pas été exécutées depuis deux cents ans, si bien que la majeure partie de la ville n'en a jamais vu."
