l_french:
 # Tasks added by the forking rework: the three pillars, the reconvergences, the five
 # exclusive forks and the optional spurs.
 #
 # FORK DESCRIPTIONS END WITH WHAT THEY CLOSE. Taking one side of an exclusive fork hides the
 # other (visible = NOT completed), so the player would otherwise never learn there was a
 # choice. Naming the road not taken in the description of the road taken is the only place
 # that information can live.

 # ---- Reconvergence tooltips ----
 # Each wraps an OR of AND pairs so the player reads one line instead of nine.
 cc_byz_two_of_three_pillars_tt: "Accomplir deux des trois pierres angulaires : Logothète du Cours (les Finances), Le Trône Œcuménique (la Foi), L'Armée de Camp restaurée (l'Épée)"
 cc_byz_two_of_three_seats_tt: "Accomplir deux des trois tâches des sièges orientaux : Antioche restaurée, Le Patriarche revient, L'Égypte et le Delta"
 cc_byz_two_of_three_theatres_tt: "Accomplir deux des trois tâches du théâtre occidental : l'Italie et l'Exarchat, l'Afrique, Spania"
 cc_byz_turkish_question_settled_tt: "La question turque est réglée, par la conquête ou par le tribut"

 # ---- The Fisc ----
 cc_byz_task_nomisma: "Le nomisma restauré"
 cc_byz_task_nomisma_desc: "Pendant sept siècles, le solidus fut la monnaie que tout marché, de Ceylan à la Frise, acceptait sans la peser. Elle a été dévaluée quatre fois au cours des cent dernières années, et les marchands ont commencé à la peser."
 cc_byz_task_silk_looms: "Les métiers à soie"
 cc_byz_task_silk_looms_desc: "Deux moines ont ramené les vers de Chine dans un bâton creux au VIe siècle, et l'empire a détenu le monopole occidental pendant six cents ans grâce à ce vol. Les métiers à tisser sont toujours les nôtres. Peu d'autres choses concernant ce commerce le sont."
 cc_byz_task_literate_admin: "Une administration lettrée"
 cc_byz_task_literate_admin_desc: "L'empire fonctionnait sur papier quand l'Occident fonctionnait sur la mémoire. Il peut continuer à le faire exactement tant qu'il y a des hommes capables de lire ce qui est écrit, et pas un jour de plus."
 cc_byz_task_logothete: "Logothète du Cours"
 cc_byz_task_logothete_desc: "Le logothète du cours a commencé comme l'homme qui gérait la poste. Parce que la poste transportait les dépêches, il en a fini par savoir ce qu'elles contenaient ; parce qu'il savait ce qu'elles contenaient, il en est venu à diriger le renseignement frontalier ; et parce qu'il dirigeait cela, il a fini par diriger la politique étrangère. Personne n'a jamais décidé cela.\n\nLes bureaux dont il a besoin doivent être financés, et financés pendant des années, pas pour une saison."

 # ---- The Faith ----
 cc_byz_task_athonite: "Les monastères d'Athos"
 cc_byz_task_athonite_desc: "La Montagne Sainte répond au patriarche en théorie et à elle-même en pratique. Son opinion voyage plus loin que n'importe quelle lettre d'évêque et arrive avant la nôtre."
 cc_byz_task_icons: "Les icônes restaurées"
 cc_byz_task_icons_desc: "Pendant cent vingt ans, l'empire a brisé ses propres images, puis a décidé qu'il s'était trompé et a passé trois siècles à les remplacer. La Fête de l'Orthodoxie célèbre encore ce revirement à chaque Carême.\n\nCe qui a été brûlé ne reviendra pas. Ce qui peut être commandé le sera."
 cc_byz_task_autocephalous: "Les filles autocéphales"
 cc_byz_task_autocephalous_desc: "La Serbie a un patriarche. La Bulgarie a un patriarche. La Rus a un métropolite qui se comporte comme tel. Chacun d'eux a été accordé par Constantinople, et chacun d'eux se décrit désormais comme ayant toujours été indépendant.\n\nUne église mère est celle à laquelle les filles répondent encore."
 cc_byz_task_ecumenical_throne: "Le trône œcuménique"
 cc_byz_task_ecumenical_throne_desc: "\"Réfléchissons ensemble à la paix des églises.\"\n\nLe patriarche est choisi parmi trois noms soumis par le synode, et l'empereur choisit. Tel est l'arrangement, et il a produit des patriarches qui ont défié les empereurs en face. C'est encore mieux que l'alternative, qui est un patriarche que personne n'a choisi."

 # ---- The Sword ----
 cc_byz_task_veterans: "Armées vétérans"
 cc_byz_task_veterans_desc: "Une armée qui a combattu ensemble et est rentrée ensemble vaut trois armées qui ne l'ont pas fait. Nous avons assez d'hommes. Nous manquons d'hommes qui se sont déjà tenus côte à côte."
 cc_byz_task_dromon: "La flotte de dromons"
 cc_byz_task_dromon_desc: "Deux rangs de rames, un éperon à la proue plutôt qu'un bélier, et un siphon à l'avant si l'arsenal peut encore en fournir un. Le dromon a porté la puissance de cet empire pendant six cents ans et n'a pas été construit en nombre depuis quatre-vingts ans."
 cc_byz_task_varangians: "La garde varangienne"
 cc_byz_task_field_army: "L'armée de campagne restaurée"
 cc_byz_task_field_army_desc: "Ni une garnison, ni une levée appelée pour une saison, ni des mercenaires qui rentreront chez eux à l'automne. Une armée capable de marcher, de perdre et de marcher à nouveau sous le même règne. L'empire n'en a pas eu depuis Manzikert."

 # ---- Reconvergence ----
 cc_byz_task_state_restored: "L'État restauré"
 cc_byz_task_state_restored_desc: "Il y a un moment où un État cesse de gérer son propre déclin et commence à choisir ce qu'il fera ensuite. Ce moment est rarement marqué sur le coup, mais il devient évident pour tous après coup.\n\nDeux des trois piliers suffiront. Aucun empereur n'a jamais été fort dans les trois à la fois."

 # ---- The Greek World ----
 cc_byz_task_serbian_question: "La question serbe"
 cc_byz_task_serbian_question_desc: "Stefan Dusan s'est fait couronner Empereur des Serbes et des Romains à Skopje, selon notre rite, par un patriarche qu'il avait créé à cet effet. Il a pris la moitié de la Macédoine et la majeure partie de l'Épire, et il n'avait pas tort de penser qu'il pouvait également prendre cette ville."
 cc_byz_task_latin_bride: "Une mariée latine"
 cc_byz_task_latin_bride_desc: "Une princesse latine au palais signifie une chapelle latine au palais, un confesseur latin et une faction latine à la cour d'ici une décennie. Cela signifie également un roi occidental qui ne peut se permettre de nous voir tomber.\n\nDes empereurs ont déjà fait ce marché, et aucun n'en a été satisfait."
 cc_byz_task_embassies: "Ambassades vers l'Ouest"
 cc_byz_task_embassies_desc: "L'empire recevait autrefois des ambassadeurs sur un trône qui s'élevait jusqu'au plafond tandis que des lions dorés rugissaient à ses côtés, et Liutprand de Crémone a consigné chaque détail avec fureur.\n\nNous ne pouvons plus nous permettre la machinerie. Nous pouvons encore nous permettre les hommes."
 cc_byz_task_venetian_alliance: "L'alliance vénitienne"
 cc_byz_task_venetian_alliance_desc: "Venise a pris les chevaux de notre hippodrome, les reliques de nos églises et l'Empire lui-même pendant cinquante-sept ans, et Venise possède également la seule flotte en Méditerranée capable de nous nourrir.\n\nLes choisir ferme la route génoise."
 cc_byz_task_genoese_compact: "Le pacte génois"
 cc_byz_task_genoese_compact_desc: "Gênes s'est installée à Galata, de l'autre côté de la Corne, ne nous paie presque rien en douanes et gagne sept fois plus que notre propre port. Ce sont également eux qui ont remis un Paléologue sur ce trône.\n\nLes choisir ferme la route vénitienne."

 # ---- Anatolia ----
 cc_byz_task_sultan_tributary: "Le tributaire du sultan"
 cc_byz_task_sultan_tributary_desc: "L'empire a payé tribut à cette maison et envoyé des troupes lors de ses campagnes, et l'empereur a chevauché dans le train d'un sultan. Il y a une certaine symétrie dans un arrangement inversé, et c'est moins coûteux que de les détruire."
 cc_byz_task_anatolia_secured: "L'Anatolie sécurisée"
 cc_byz_task_anatolia_secured_desc: "Que ce soit par la conquête ou par le tribut, la question turque est résolue et les provinces orientales peuvent être gouvernées plutôt que défendues.\n\nDepuis deux siècles, aucun empereur n'a été capable d'écrire cette phrase."
 cc_byz_task_convert_anatolia: "La foi retrouvée"
 cc_byz_task_convert_anatolia_desc: "La conversion en Anatolie n'a pas été principalement forcée. Ce fut une taxe, un mariage, une carrière, et quatre générations d'un village trouvant le nouvel arrangement plus facile que l'ancien.\n\nL'inverser fonctionnera de la même manière, et prendra autant de temps."
 cc_byz_task_tagmata: "Les tagmata restaurés"
 cc_byz_task_tagmata_desc: "Salariés, casernés et payés qu'il y ait une guerre ou non. Une armée professionnelle répond à celui qui signe la caisse de solde, ce qui est l'argument en sa faveur et aussi l'argument contre.\n\nPrendre ceci ferme la route de la pronoia."

 # ---- The Levant ----
 cc_byz_task_eastern_sees: "Les sièges orientaux"
 cc_byz_task_eastern_sees_desc: "Antioche, Jérusalem, Alexandrie. Trois des cinq, perdues à moins d'une décennie d'intervalle au septième siècle, et pleurées continuellement depuis par un empire qui n'a jamais formellement admis qu'elles étaient parties.\n\nDeux des trois suffiront."
 cc_byz_task_sultans_friend: "L'ami du sultan"
 cc_byz_task_sultans_friend_desc: "Un traité sur les lieux saints, par écrit, avec un sultan. Il sera lu en Occident comme une trahison et au Caire comme une faiblesse, et il maintiendra les sanctuaires ouverts et les pèlerins en mouvement tant que les deux parties y trouveront leur compte.\n\nAccepter cela met fin à la guerre."
 cc_byz_task_pentarchy_war: "La guerre de la Pentarchie"
 cc_byz_task_pentarchy_war_desc: "Rome, Constantinople, Alexandrie, Antioche, Jérusalem. Cinq patriarches, une église, et un arrangement qui n'est plus intact depuis le septième siècle.\n\nPrendre ceci ferme le traité."

 # ---- The West ----
 cc_byz_task_sicily: "Sicile récupérée"
 cc_byz_task_sicily_desc: "Le grec était parlé ici avant le latin et est toujours parlé dans les collines. L'île a été byzantine, arabe, normande et angevine en quatre cents ans, et les Vêpres se sont chargées des Angevins."
 cc_byz_task_ravenna: "Ravenne restaurée"
 cc_byz_task_ravenna_desc: "Les mosaïques de San Vitale montrent Justinien sur un mur et Théodora sur l'autre, tous deux couronnés, tous deux face à l'autel, alors qu'aucun d'eux n'est jamais venu ici.\n\nLa ville s'ensable depuis huit cents ans. Le port qui en faisait le siège exarchal est aujourd'hui un champ."
 cc_byz_task_western_sea: "La Mer Occidentale"
 cc_byz_task_western_sea_desc: "\"Notre mer.\"\n\nC'était une plaisanterie romaine avant d'être un fait romain, et au moment où c'est devenu un fait, plus personne ne trouvait cela drôle. Deux rivages sur trois suffiront ; le troisième a toujours été un sujet de dispute."

 # ---- The East ----
 cc_byz_task_crown_monopoly: "Le monopole de la Couronne"
 cc_byz_task_chartered_company: "La compagnie à charte"
 cc_byz_task_chartered_company_desc: "Laissez les bourgeois assumer le risque et la couronne prendre une part de ce qui revient. Cela rapporte moins, mais cela rapporte sans dispute annuelle au consistoire.\n\nPrendre ceci ferme le monopole de la couronne."

 # ---- Optional spurs ----
 cc_byz_task_notitia: "Les antiquaires"
 cc_byz_task_notitia_desc: "La Notitia Dignitatum énumère chaque office et commandement de l'empire tardif, à l'ouest comme à l'est, avec l'insigne peint à côté de chacun. La plupart des postes qui y figurent avaient cessé d'exister avant que l'encre ne sèche.\n\nLes juristes peuvent faire beaucoup avec un document comme celui-ci."
 cc_byz_task_greek_fire: "Le feu grec redécouvert"
 cc_byz_task_hagia_sophia: "Sainte-Sophie entretenue"
 cc_byz_task_hagia_sophia_desc: "\"Salomon, je t'ai surpassé.\"\n\nLa tradition met ces mots dans la bouche de Justinien lors de la dédicace ; le récit date de plusieurs siècles plus tard et le sentiment est tout à fait caractéristique. Le dôme s'est effondré vingt ans après et fut reconstruit plus haut."
 cc_byz_task_great_palace: "Le Grand Palais"
 cc_byz_task_great_palace_desc: "La cour a déménagé à Blachernes il y a plusieurs générations et l'ancien palais s'y décompose depuis. Des visiteurs ont commencé à le remarquer par écrit, et c'est ainsi que ces choses deviennent l'affaire de tous."
 cc_byz_task_thessaloniki: "La seconde cité"
 cc_byz_task_thessaloniki_desc: "La seconde ville, le second port, et le seul autre endroit possédant des murs dignes de ce nom. Elle a également passé deux décennies à prendre ses propres décisions, et les Zélotes qui la dirigeaient n'ont demandé la permission pour aucune d'entre elles."
 cc_byz_task_city_adorned: "La cité ornée"
 cc_byz_task_city_adorned_desc: "Rien de tout cela ne permet de gagner une guerre. Tout cela explique pourquoi les gens viennent encore ici pour voir à quoi ressemble un empire, et pourquoi ils le consignent par écrit en rentrant chez eux."
 cc_byz_task_triumph: "Un triomphe dans l'hippodrome"
 cc_byz_task_triumph_desc: "Les formes sont consignées dans le Livre des Cérémonies, jusqu'à la porte concernée, l'acclamation et qui marche où. Elles n'ont pas été exécutées depuis deux cents ans et la majeure partie de cette ville n'en a jamais vu."
 cc_byz_task_varangians_desc: "Des Nordiques et des Anglais avec des haches, qui ne parlent pas un grec digne de ce nom et ne doivent rien à aucune famille de cette ville. C'est là tout l'intérêt. Un empereur entouré de Byzantins est entouré d'hommes ayant des cousins.\n\nIls se souviennent également à qui appartenait le Danube."
 cc_byz_task_crown_monopoly_desc: "Les épices achetées et vendues par des fonctionnaires impériaux, le profit atteignant le trésor sans passer d'abord par des mains privées.\n\nChoisir cela ferme la route à charte."
 cc_byz_task_greek_fire_desc: "\"...un feu qui s'accrochait à tout ce qu'il touchait et brûlait sur l'eau elle-même.\"\n\nAnna Comnène a vu les siphons être utilisés et a décrit les têtes de bêtes en bronze sur les proues. La composition était un secret d'État détenu par une seule famille et les ateliers impériaux, et elle a été perdue de la manière habituelle : parce que personne ne l'a consignée par écrit."
