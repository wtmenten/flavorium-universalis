l_french:
 # Bureaucracies
 cc_byz_genikon: "Logothesion tou Genikou"
 cc_byz_genikon_desc: "Le trésor général : évaluation, collecte, audit. Il emploie plus d'hommes que tout autre bureau du palais et aucun d'entre eux n'est célèbre. Chaque autre instrument de l'autorité impériale est financé par ce que celui-ci parvient à rapporter."
 cc_byz_epi_ton_deeseon: "Epi tōn Deēseōn"
 cc_byz_epi_ton_deeseon_desc: "Le Maître des pétitions. Un bureau permanent grâce auquel un agriculteur de Thrace peut faire appel au-delà de l'homme qui possède sa vallée, directement auprès du palais. Son établissement est peu coûteux et il est déploré proportionnellement à son efficacité."
 cc_byz_oikeioi: "Les Oikeioi"
 cc_byz_oikeioi_desc: "Les propres hommes de l'empereur : des intimes de la cour nommés à des commandements provinciaux sur la base d'une faveur personnelle plutôt que d'une fonction. Les décisions arrivent rapidement et les bonnes personnes sont toujours joignables. Cela enseigne également à tout homme ambitieux de l'empire que la proximité avec l'empereur prime sur tout titre qu'il pourrait acquérir."

