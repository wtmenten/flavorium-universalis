 # Country modifiers
 STATIC_MODIFIER_NAME_cc_byz_staffed_by_career_clerks: "Clercs de carrière"
 STATIC_MODIFIER_DESC_cc_byz_staffed_by_career_clerks: "Les postes sont salariés et les hommes qui les occupent doivent leur position à la fonction plutôt qu'à une famille."
 STATIC_MODIFIER_NAME_cc_byz_offices_are_property: "Les charges sont des propriétés"
 STATIC_MODIFIER_DESC_cc_byz_offices_are_property: "Les postes sont hérités et vendus comme une évidence. Personne n'a décrété cela. La couronne perçoit toujours les taxes, mais elle ne décide plus de qui sert."
 STATIC_MODIFIER_NAME_cc_byz_retrenched_bureaus: "Bureaux réduits"
 STATIC_MODIFIER_DESC_cc_byz_retrenched_bureaus: "Moins de postes, toujours salariés, toujours à la couronne."

 # cc_byz_bureaucracy.1 - staffing a new bureau
 cc_byz_bureaucracy.1.title: "Dotation du Nouveau Bureau"
 cc_byz_bureaucracy.1.desc: "Le bureau existe sur parchemin. Maintenant, il a besoin d'hommes.\n\nLes [ROOT.GetCountry.GetGovernment.GetEstateName('burghers_estate')] peuvent fournir des clercs qui ont passé leur vie à apprendre les formes et passeront le reste de celle-ci à les appliquer. Les grandes familles ont des fils qui ont besoin de postes et ont fait savoir qu'elles s'attendaient à être sollicitées. Les deux voies remplissent les bureaux. Elles les remplissent d'hommes qui répondent à des personnes différentes."
 cc_byz_bureaucracy.1.desc_venal: "Le bureau existe sur parchemin. Maintenant, il a besoin d'hommes, et la question de savoir comment les postes sont pourvus n'est plus ouverte.\n\nQuiconque a des affaires devant le palais sait déjà combien coûte un poste et approximativement qui approcher. Les clercs le savent aussi. Il ne reste plus qu'à décider si le trésor prend sa part ouvertement ou s'il la laisse aux hommes qui la prendront de toute façon."
 cc_byz_bureaucracy.1.desc_purged: "Le bureau existe sur parchemin et les bureaux sont vides, ce qui n'est pas un accident. Les hommes qui y siégeaient ont été écartés, et la manière dont ils l'ont été est encore discutée dans les quartiers où vivent les clercs.\n\nLes grandes familles ont des fils disponibles et se montrent remarquablement gracieuses à ce sujet. Les hommes salariés sont également disponibles et demandent, par des intermédiaires, quelles assurances existent quant au fait qu'une carrière au service de l'État soit bien une carrière. Il n'y a pas de bonne réponse à cette question. Le palais s'en est assuré."
 cc_byz_bureaucracy.1.a: "Commis salariés. Le bureau doit survivre à l'homme."
 cc_byz_bureaucracy.1.b: "Les grandes familles ont des fils à placer."
 cc_byz_bureaucracy.1.c: "Vendez les postes. Le trésor peut tout aussi bien prendre sa part."

 # cc_byz_bureaucracy.10 - dissolving a bureau
 cc_byz_bureaucracy.10.title: "Un bureau est dissous"
 cc_byz_bureaucracy.10.desc: "Le bureau est fermé. Ses archives vont aux archives, ses pièces à quiconque demande en premier, et son personnel nulle part en particulier.\n\nIls ne sont pas nombreux. Ils sont cependant un certain nombre d'hommes qui savent précisément comment fonctionne le palais, qui ont des familles à nourrir, et qui sont désormais disponibles."
 cc_byz_bureaucracy.10.desc_sold: "Le bureau est fermé, ce qui soulève une question que personne ne veut mettre par écrit : ces hommes ont payé pour leurs postes.\n\nIls n'ont pas acheté un salaire. Ils ont acheté une créance, et ils ont parfaitement conscience que la créance portait sur l'empire plutôt que sur un ensemble de pièces particulier. Ils voudront qu'elle soit honorée ailleurs."
 cc_byz_bureaucracy.10.a: "Leur trouver des places ailleurs dans le service."
 cc_byz_bureaucracy.10.b: "Remerciez-les et renvoyez-les."
 cc_byz_bureaucracy.10.c: "Faites un exemple du pire d'entre eux."

 # cc_byz_bureaucracy.20 - underfunded bureaus
 cc_byz_bureaucracy.20.title: "Les bureaux ne sont pas payés"
 cc_byz_bureaucracy.20.desc: "Les salaires ont plusieurs mois de retard et le travail n'a pas cessé, ce qui devrait être rassurant mais ne l'est pas.\n\nUn fonctionnaire non payé ne rentre pas chez lui. Il reste à son bureau et trouve un autre moyen d'être compensé pour y être assis, et les hommes qui viennent à ce bureau apprennent rapidement quel est le nouvel arrangement. Le temps que le trésor rattrape son retard, l'arrangement sera devenu la coutume, et la coutume dans cet empire est très difficile à abroger."
 cc_byz_bureaucracy.20.a: "Payez-les. Quel qu'en soit le coût."
 cc_byz_bureaucracy.20.b: "Ils s'en sortiront. Ils le font toujours."
 cc_byz_bureaucracy.20.c: "Moins de postes, mais correctement financés."

 # cc_byz_bureaucracy.30 - palace service against the army
 cc_byz_bureaucracy.30.title: "Le Palais et les commandants"
 cc_byz_bureaucracy.30.desc: "La querelle porte sur un contrat d'approvisionnement, et elle ne porte pas sur un contrat d'approvisionnement.\n\nLes eunuques du service du palais soulignent, avec justesse, que les comptes ne sont pas équilibrés et que les hommes qui les ont signés sont les mêmes qui en profitent. Les commandants soulignent, également avec justesse, que ce sont eux qui se retrouveront en première ligne quand le décompte sera terminé, et qu'ils n'ont jamais été renforcés par un grand livre de comptes.\n\nTous deux attendent de voir avec lequel d'entre eux l'empereur acceptera d'être vu en accord."
 cc_byz_bureaucracy.30.a: "Les comptes seront équilibrés. Veillez-y."
 cc_byz_bureaucracy.30.b: "Les hommes qui combattent méritent le bénéfice du doute."
 cc_byz_bureaucracy.30.c: "Ne dites rien. Laissez-les s'interroger."

 # cc_byz_bureaucracy.40 - entrenched and unfunded
 cc_byz_bureaucracy.40.title: "Un bureau qui s'auto-alimente"
 cc_byz_bureaucracy.40.desc: "Le bureau n'a pas été correctement financé depuis des années et n'a pas diminué d'un seul clerc, ce qui aurait dû soulever une question au trésor bien avant maintenant.\n\nLa réponse est assez simple. Les hommes qui s'y trouvent sont payés, simplement pas par nous. Des frais sont facturés pour des services autrefois gratuits, et ces frais sont collectés par une famille dont le nom n'apparaît nulle part et dont le consentement est requis pour tout. Le bureau fait toujours son travail. Il ne le fait plus pour l'empereur."
 cc_byz_bureaucracy.40.desc_venal: "Le bureau n'a pas été correctement financé depuis des années et n'a pas diminué d'un seul clerc, et à ce stade, personne au palais ne prétend être surpris.\n\nCe qui est nouveau, c'est seulement l'assurance. La famille qui le dirige a cessé de dissimuler l'arrangement et a commencé à le défendre, au motif raisonnable qu'ils ont maintenu le travail à leurs propres frais alors que le trésor ne le faisait pas. Ils n'ont pas tort. C'est là toute la difficulté."
 cc_byz_bureaucracy.40.a: "Le financer correctement. C'est à nous ou ce n'est à personne."
 cc_byz_bureaucracy.40.b: "Démanteler la structure et disperser les clercs."
 cc_byz_bureaucracy.40.c: "Vendez-leur la charge purement et simplement."

 # cc_byz_bureaucracy.50 - entrenched and funded
 cc_byz_bureaucracy.50.title: "Un bureau efficace"
 cc_byz_bureaucracy.50.desc: "Les salaires arrivent à temps, les archives sont là où l'index indique qu'elles se trouvent, et les hommes qui sont entrés comme commis juniors y sont toujours trente ans plus tard, sans ambition d'être ailleurs.\n\nCe n'est pas un exploit spectaculaire et aucune chronique ne le retiendra. Mais une requête entrant dans ce bureau reçoit une réponse, et une réponse identique quel que soit l'auteur de la demande, ce qui est plus qu'on ne peut en dire de la plupart des interactions de l'empire avec ses propres sujets."
 cc_byz_bureaucracy.50.a: "Réorganiser les autres bureaux pour correspondre."
 cc_byz_bureaucracy.50.b: "Que sa réputation fasse le travail."
 cc_byz_bureaucracy.50.c: "Un bureau aussi sécurisé ne rend compte qu'à lui-même. Détendez l'organisation."

 # cc_byz_bureaucracy.60 - a funding cut lands
 cc_byz_bureaucracy.60.title: "La réduction est annoncée"
 cc_byz_bureaucracy.60.desc: "La réduction a été décidée en un après-midi et sera comprise en une semaine.\n\nPersonne ne démissionne. Le travail continue, d'abord exactement comme avant, puis de la manière dont le travail non rémunéré continue partout : les affaires urgentes avancent toujours, et les affaires qui avancent sont celles pour lesquelles quelqu'un a une raison de pousser.\n\nPersonne ne signalera cela et tout le monde s'y adaptera."
 cc_byz_bureaucracy.60.a: "On ne peut rien y faire."
 cc_byz_bureaucracy.60.b: "Annoncez cela comme une réforme."

