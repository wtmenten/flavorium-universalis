 # cc_byz_cession.1 - the five-year cession review
 cc_byz_cession.1.title: "Le registre de la préfecture"
 cc_byz_cession.1.desc: "The terms on which the exarchate was established put every imperial district in its prefecture under the exarch's authority. Districts the empire has acquired there since are still administered from Constantinople, and the register for [SCOPE.sCountry('cc_byz_exarch').GetName] now lists them as outstanding.

The clerks review the register every five years. They need a ruling: transfer the districts as the original terms require, or keep them under the palace's own officials until the next review."
 cc_byz_cession.1.a: "Transférez-les. Telles étaient les conditions."
 cc_byz_cession.1.b: "Les garder. Ils restent rattachés au palais."
