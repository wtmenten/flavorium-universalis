 # cc_byz_cession.1 - the five-year cession review
 cc_byz_cession.1.title: "Le registre de la préfecture"
 cc_byz_cession.1.desc: "Les conditions selon lesquelles l'exarchat a été établi placent chaque district impérial de sa préfecture sous l'autorité de l'exarque. Les districts que l'empire y a acquis depuis sont toujours administrés depuis Constantinople, et le registre de [SCOPE.sCountry('cc_byz_exarch').GetName] les liste désormais comme étant en suspens.\n\nLes clercs révisent le registre tous les cinq ans. Ils ont besoin d'une décision : transférer les districts comme le prévoient les conditions originales, ou les maintenir sous les propres fonctionnaires du palais jusqu'à la prochaine révision."
 cc_byz_cession.1.a: "Transférez-les. Telles étaient les conditions."
 cc_byz_cession.1.b: "Les garder. Ils restent rattachés au palais."
