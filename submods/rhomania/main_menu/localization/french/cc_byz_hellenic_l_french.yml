l_french:
 # The old rites: the Hellenic thread.
 #
 # See in_game/events/cc_byz_hellenic.txt for the arc's shape and why it exists. Briefly: Fate
 # of the Phoenix ships a complete, supported route out of Orthodoxy and the submod had assumed
 # Orthodoxy in 341 places, so converting broke six mission tasks and left the union arc
 # negotiating with Rome on behalf of a church the emperor had left.
 #
 # VOICE. This is a court that has watched something it has no vocabulary for. Nobody in these
 # texts calls it paganism and nobody calls it a reformation; they call it what happened, and
 # they are careful. The mechanics live in the option tooltips and the modifier descriptions,
 # not in the event bodies.
 #
 # HISTORICAL FOOTING. Gemistos Plethon really did teach at Mistra in this period, really did
 # write a code of law invoking the Olympian gods, and his book really was burned by Patriarch
 # Gennadios after his death. Julian is the other precedent and every Byzantine reader knew his
 # name. Neither is quoted directly, because attributing an invented line to a real man is the
 # one thing this file will not do.

 # ---- .1  The Academy reopened ----
 cc_byz_hellenic.1.title: "Le savoir ancien"
 cc_byz_hellenic.1.desc: "Il y a un homme à Mistra qui enseigne Platon à quiconque fera le voyage, et un nombre surprenant de personnes le font. Il est prudent. Il parle des anciens comme des anciens et de l'Église comme de l'Église, et en trente ans, personne n'a été capable de noter une seule de ses phrases qui pourrait être portée devant un synode.\n\nSes élèves sont moins prudents, et certains d'entre eux sont maintenant au palais.\n\nCe qui est demandé est minime : une maison, une pension, et le nom de l'empereur sur la porte. Ce qui est demandé implicitement, c'est si l'empire considère mille ans de son propre héritage comme un héritage ou comme une tentation à laquelle il a survécu."
 cc_byz_hellenic.1.a: "La philosophie est nôtre. La théologie appartient à l'Église."
 cc_byz_hellenic.1.b: "Laissons-les suivre le fil de l'argumentation."
 cc_byz_hellenic.1.c: "Nous avons assez de bibliothèques. Fermez-la."

 # ---- .10  The rupture ----
 cc_byz_hellenic.10.title: "La religion de l'Empereur"
 cc_byz_hellenic.10.desc: "Cela ne s'est pas fait en un jour et on en parle comme si c'était le cas.\n\nLa maison a su en premier, puis la garde, puis les hommes qui tiennent les chapelles, et au moment où le Patriarche a été informé, il n'y avait plus rien à lui dire. Il n'a pas crié. Il a demandé, deux fois, s'il avait bien compris, puis il est allé écrire à des gens.\n\nÀ l'extérieur, la ville n'a pas encore décidé ce qu'elle en pense. C'est la seule merci dans tout cela et elle ne durera pas la saison."
 cc_byz_hellenic.10.desc_after_union: "Deux fois en un seul règne.\n\nLa première fois, l'empereur s'est tenu dans la Grande Église et a fait lire à haute voix l'union avec Rome, et la ville l'a traité de Latin et pire encore. Quoi qu'ils l'aient appelé alors, ils débattaient au moins de l'église à laquelle il appartenait.\n\nPlus personne n'est confus aujourd'hui. Les hommes qui ont combattu l'union et ceux qui l'ont signée ont découvert qu'ils étaient d'accord sur quelque chose, ce qu'aucune autre chose en deux cents ans n'a réussi à faire. Ils sont d'accord à son sujet."
 cc_byz_hellenic.10.desc_returned: "Les chapelles sont ouvertes. Les lampes sont allumées. Le Patriarche, qui selon toute vraisemblance s'attendait à mourir en exil et avait pris ses dispositions en conséquence, a reçu la nouvelle debout et est resté silencieux pendant un long moment.\n\nCe qui a été fait ne peut être défait. Il y a dans les provinces des hommes qui ont pris l'empereur au mot et ont bâti leur vie là-dessus, et on vient de leur dire que le mot a changé. L'empire mettra quelques années à découvrir combien ils sont."
 cc_byz_hellenic.10.a: "C'est fait. Qu'ils disent ce qu'ils veulent."

 # ---- .20  The edict ----
 cc_byz_hellenic.20.title: "Ce que la loi stipule désormais"
 cc_byz_hellenic.20.desc: "La question n'est pas de savoir ce que l'empereur croit. Chacun a réglé ce point à sa propre satisfaction et aucune proclamation ne l'améliorera.\n\nLa question est de savoir ce que la loi dit des autres, et la loi est actuellement silencieuse d'une manière qui devient coûteuse. Les magistrats écrivent pour demander quels serments sont contraignants. Deux gouverneurs ont suspendu les procès plutôt que de deviner. Un fermier d'impôts en Bithynie a refusé de payer au motif qu'il ne sait plus à qui.\n\nIl faut que quelque chose soit écrit, et tout ce qui sera écrit sera lu pendant un siècle comme étant l'intention de l'empereur."
 cc_byz_hellenic.20.a: "Les deux autels demeurent. Aucun n'est l'affaire de l'État."
 cc_byz_hellenic.20.b: "Les dotations suivent le rite de l'empereur."
 cc_byz_hellenic.20.c: "Le Patriarcat est devenu une cour rivale. Mettez-y fin."

 # ---- .21  The temples ----
 cc_byz_hellenic.21.title: "Les sanctuaires"
 cc_byz_hellenic.21.desc: "Les arpenteurs sont revenus de Delphes, Olympie et Éleusis, et leurs rapports s'accordent sur l'essentiel.\n\nLa pierre est pour la plupart là. Elle se trouve dans les murs des villages, dans les églises, dans un pont à l'extérieur de Mégare qui supporte des charrettes depuis six cents ans. L'oracle de Delphes est une basse-cour et le fermier a été poli avec les arpenteurs, mais a des questions sur l'indemnisation. À Olympie, la rivière s'est déplacée et a tout enseveli, ce qui est la seule raison pour laquelle la majeure partie a survécu.\n\nRien de tout cela ne dépasse les capacités de l'empire. Tout cela coûte le prix d'une guerre et ne produit rien qui puisse être taxé."
 cc_byz_hellenic.21.desc_suppressed: "Les arpenteurs sont revenus de Delphes, Olympie et Éleusis, et les rapports sont conformes aux attentes : la pierre se trouve dans les murs des villages et des églises, et l'extraire signifie les démanteler.\n\nC'est désormais une difficulté moindre qu'auparavant. Depuis que la question du Patriarcat a été réglée, les hommes qui auraient pu s'y opposer ont trouvé des raisons de ne pas le faire, et plusieurs évêques ont écrit pour proposer des matériaux avant même qu'on ne leur en demande.\n\nLes arpenteurs notent cela dans la marge sans commentaire. Ils ont pris soin de ne rien écrire qui puisse être interprété de deux manières différentes."
 cc_byz_hellenic.21.a: "Les reconstruire correctement. Le trésor s'en chargera."
 cc_byz_hellenic.21.b: "Les villes peuvent honorer leurs propres dieux à leurs propres frais."
 cc_byz_hellenic.21.c: "Les rites ne nécessitent pas de bâtiments."

 # ---- .22  The reaction ----
 cc_byz_hellenic.22.title: "La ville répond"
 cc_byz_hellenic.22.desc: "Cela n'a pas commencé comme une émeute. Cela a commencé comme une procession, chose que cette ville a toujours été autorisée à faire, et l'itinéraire était celui d'ordinaire jusqu'à ce qu'il ne le soit plus.\n\nIls ne demandent pas l'abdication de l'empereur. Certains le font, et ce sont ceux-là que la garde peut gérer. Les autres posent une question plus difficile et la posent d'une manière que personne ne peut arrêter : ils se rendent simplement à l'église en nombre tel qu'on n'en a pas vu de mémoire d'homme, des jours qui ne sont pas des jours de fête, dans des quartiers qui avaient cessé de s'en soucier.\n\nOn ne peut contraindre une ville à cesser d'aller à l'église. L'empereur a lu assez d'histoire pour savoir comment on se souvient du dernier homme qui a essayé."
 cc_byz_hellenic.22.desc_funded: "C'est l'argent qui a fait le travail.\n\nTant que les sanctuaires étaient une proclamation, la ville pouvait se dire que l'empereur s'adonnait à un goût personnel, comme le font les empereurs. Puis les charrettes ont commencé à partir vers l'ouest chargées d'argent impérial, et les comptes ont été lus à haute voix dans l'Hippodrome par quelqu'un qui s'en était procuré, et l'argument a cessé d'être celui de l'âme de l'empereur pour devenir celui de la distribution de grains.\n\nIls ont calculé ce que coûtent les temples. Ils ont calculé ce que cela aurait pu acheter d'autre. Quelqu'un a été très attentif à s'assurer qu'ils calculent les deux."
 cc_byz_hellenic.22.desc_furious: "Il y a des quartiers de cette ville où la garde n'entre désormais qu'en groupe ou pas du tout.\n\nUn diacre a été tué à la porte Chalke, par qui c'est contesté et le restera, et il a été enterré trois fois dans trois récits différents de ce qui s'est passé. La version qui se répand le montre bénissant la foule en tombant. Personne de ceux qui étaient là ne dit cela. Il a cessé d'importer ce que disent ceux qui étaient là.\n\nLe Patriarche, ou l'homme que les foules appellent le Patriarche, n'a pas été vu depuis onze jours et se trouve alternativement à Trébizonde, dans une citerne, ou à la droite de l'empereur après avoir trahi tout le monde."
 cc_byz_hellenic.22.a: "Qu'ils gardent leurs églises. Ils garderont ainsi la paix."
 cc_byz_hellenic.22.b: "Brisez-le. Maintenant, et complètement."
 cc_byz_hellenic.22.c: "Assez. Les rites sont ceux de l'empereur, et de personne d'autre."

 # ---- .23  What was settled ----
 cc_byz_hellenic.23.title: "L'accord"
 cc_byz_hellenic.23.desc_tolerated: "Une génération plus tard, et ce que personne n'avait prédit, c'est à quel point cela est devenu ordinaire.\n\nIl y a deux calendriers dans la capitale et chacun conserve celui avec lequel il a grandi. Les temples ont des congrégations, plus petites que les églises et mieux financées. Deux fois par an, les processions se croisent et le préfet de la ville ferme une rue, et c'est désormais simplement une chose que le préfet de la ville fait.\n\nL'empire a passé onze cents ans à croire que cet arrangement était impossible. Il s'est avéré n'être que légèrement gênant."
 cc_byz_hellenic.23.desc_suppressed: "Le calme est revenu, et c'est le calme qui était souhaité.\n\nLe Patriarcat est une charge accordée par l'empereur, tenue par un homme qui en comprend les termes. Les grands monastères ont été dotés pour être obéissants ou vidés pour être obéissants. Dans les villages, les prêtres disent ce qu'ils ont toujours dit, et les hommes de l'empereur ont conclu que poursuivre les villages coûtait plus cher que ce que les villages valent.\n\nCe qui a été gagné est réel et le coût n'est enregistré nulle part en un seul endroit. Il se trouve dans les registres fiscaux, dans les rapports de recrutement, et dans une génération d'hommes capables qui sont entrés dans l'Église parce que l'alternative était le service de l'empereur."
 cc_byz_hellenic.23.desc_private: "L'empereur sacrifie au sanctuaire du Palais, et l'empire ne le fait pas.\n\nC'est ainsi que ces choses se sont généralement terminées. La cour est prudente, l'Église est reconnaissante d'une manière qui a un certain tranchant, et l'arrangement est compris par tous et énoncé par personne. Les ambassadeurs sont briefés sur la chapelle à laquelle ils doivent assister.\n\nSon successeur ne le perpétuera pas. Tout le monde le sait aussi, y compris lui, et cela n'a rien changé à sa conviction."
 cc_byz_hellenic.23.a: "Laissez tel quel."

 # ---- .30  The ferment ----
 cc_byz_hellenic.30.title: "Prédication dans les quartiers"
 cc_byz_hellenic.30.desc: "Un moine dont personne n'avait entendu parler il y a un mois attire les foules au Forum du Bœuf, et ce qu'il dit n'est pas séditieux, à proprement parler. Il prêche sur le règne de Julien. Il donne les dates, les campagnes, les lettres, et la mort en Perse à trente et un ans sans héritier, et il ne mentionne pas une seule fois l'empereur actuel.\n\nIl n'a pas besoin de le faire. La foule s'en charge pour lui, sur le chemin du retour, dans les tavernes, jusqu'au port."
 cc_byz_hellenic.30.a: "Envoyer la garde au Forum."
 cc_byz_hellenic.30.b: "Découvrez ce que le quartier veut et payez."
 cc_byz_hellenic.30.c: "Laissons le Patriarche lui répondre. Il est meilleur que nous en la matière."

 # ---- Mission tasks ----
 cc_byz_task_academy: "L'Académie rouverte"
 cc_byz_task_academy_desc: "Justinien ferma les écoles d'Athènes en 529 et les philosophes partirent pour la Perse, où le roi les reçut avec bonté et ils furent déçus par lui.\n\nLes livres ne sont pas partis avec eux. Ils sont restés dans cette ville tout ce temps, copiés par des moines qui étaient en désaccord avec chaque ligne et qui les ont néanmoins copiés avec précision, ce qui est la plus étrange bonté de l'histoire de l'empire."
 cc_byz_task_old_rites: "Les rites anciens"
 cc_byz_task_old_rites_desc: "Il y avait des sacrifices dans la péninsule de Mani au neuvième siècle, quatre cents ans après que l'empire avait cessé d'être païen, et les hommes qui l'ont rapporté ne savaient pas s'ils devaient être scandalisés ou laisser faire.\n\nIls ont laissé faire. Il est remarquable de voir à quel point l'empire a toujours simplement laissé faire une grande partie de ces choses."
 cc_byz_task_temples: "Les sanctuaires restaurés"
 cc_byz_task_temples_desc: "Delphes, Éleusis, Olympie.\n\nPausanias s'est rendu dans ces trois lieux et a écrit ce qu'il a vu, et il écrivait déjà sur un monde qui s'éteignait : des temples sans prêtres, des festivals maintenus par trois vieillards, un oracle qui répondait à des questions que plus personne ne posait. C'est grâce à lui qu'il est possible de les reconstruire. Il a tout consigné parce qu'il voyait la fin arriver."
 cc_byz_task_pontifex: "Pontifex Maximus"
 cc_byz_task_pontifex_desc: "Le titre appartenait à l'empereur pendant quatre cents ans et aucun empereur chrétien ne l'a abandonné précipitamment. Gratien fut le premier à le refuser, en 382, et le Sénat le prit assez mal pour s'en plaindre encore une décennie plus tard.\n\nCela signifie chef des constructeurs de ponts. Personne n'a jamais été capable d'expliquer cela satisfaisamment, y compris les Romains."

 # ---- Trigger tooltips ----
 cc_byz_academy_tt: "Détenir Athènes ou Constantinople"
 cc_byz_old_rites_tt: "Les anciens rites sont établis dans la loi"
 cc_byz_temples_tt: "Détenir Delphes, Éleusis et Olympie"
 cc_byz_pontifex_tt: "Le règlement religieux est conclu"
