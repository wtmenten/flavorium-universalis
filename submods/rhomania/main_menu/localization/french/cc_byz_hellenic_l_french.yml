 cc_byz_faith_location_share_tt: "La foi impériale maintient ce lieu"
 cc_byz_faith_country_share_tt: "La foi impériale maintient le royaume"

 # ---- Modifiers ----
 STATIC_MODIFIER_NAME_cc_byz_old_learning: "Le savoir ancien"
 STATIC_MODIFIER_DESC_cc_byz_old_learning: "Une maison, une pension, et le nom de l'empereur au-dessus de la porte. Les hommes qui y étudieront entreront dans les chancelleries, et ils auront lu Platon au préalable."
 STATIC_MODIFIER_NAME_cc_byz_antiquarian_licence: "Les antiquaires déchaînés"
 STATIC_MODIFIER_DESC_cc_byz_antiquarian_licence: "On leur a dit de suivre l'argument là où il mène. Plusieurs d'entre eux ont pris cela littéralement et le clergé a commencé à prendre des notes."
 STATIC_MODIFIER_NAME_cc_byz_the_apostasy: "L'apostasie"
 STATIC_MODIFIER_DESC_cc_byz_the_apostasy: "Il existe un mot pour cela dans chaque chancellerie de la chrétienté et tous l'utilisent. Personne n'oublie, et personne n'a besoin qu'on lui rappelle."
 STATIC_MODIFIER_NAME_cc_byz_edict_of_toleration: "L'Édit de tolérance"
 STATIC_MODIFIER_DESC_cc_byz_edict_of_toleration: "Les deux autels demeurent et aucun n'est l'affaire de l'État. Les magistrats savent à nouveau quoi faire, ce qui était l'essentiel."
 STATIC_MODIFIER_NAME_cc_byz_temples_restored: "Les sanctuaires restaurés"
 STATIC_MODIFIER_DESC_cc_byz_temples_restored: "Argent impérial, maçons impériaux, et la pierre récupérée dans les murs où elle avait passé six cents ans. Cela a coûté le prix d'une guerre et cela ne peut être taxé."
 STATIC_MODIFIER_NAME_cc_byz_two_altars: "Deux Autels"
 STATIC_MODIFIER_DESC_cc_byz_two_altars: "Deux calendriers, deux processions, et un préfet de la ville qui ferme une rue deux fois par an et n'y voit aucun inconvénient."
 STATIC_MODIFIER_NAME_cc_byz_emperors_own_rite: "Le rite propre de l'Empereur"
 STATIC_MODIFIER_DESC_cc_byz_emperors_own_rite: "Il sacrifie au sanctuaire du Palais et l'empire ne le fait pas. C'est entendu par tous, affirmé par personne, et cela ne lui survivra pas."
 STATIC_MODIFIER_NAME_cc_byz_perm_pontifex: "Pontifex Maximus"
 STATIC_MODIFIER_DESC_cc_byz_perm_pontifex: "Chef des bâtisseurs de ponts, et personne n'a jamais expliqué ce nom. Les rites de l'empire sont à la discrétion de l'empereur."

 # ---- Opinion ----
 cc_byz_opinion_apostate: "Foi abandonnée"
