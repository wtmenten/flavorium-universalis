l_french:
 # Subject type
 cc_byz_exarchate: "Exarchat"
 cc_byz_exarchate_desc: "Une province occidentale gouvernée par un exarque nommé qui détient à la fois le commandement civil et militaire, responsable devant l'empereur et personne d'autre localement. C'est ainsi que Ravenne a été tenue pendant deux siècles. Cela fonctionne précisément tant que les intérêts de l'exarque et ceux du palais restent les mêmes."

 # Capability modifier
 MODIFIER_TYPE_NAME_cc_byz_can_appoint_exarch: "Peut nommer un exarque"
 MODIFIER_TYPE_DESC_cc_byz_can_appoint_exarch: "Ceci permet qu'une province occidentale soit placée sous l'autorité d'un exarque nommé tandis que la capitale reste à [ShowLocationName('constantinople')]."

 # Renovatio advances
 cc_byz_renovatio_imperii: "Renovatio Imperii"
 cc_byz_renovatio_imperii_desc: "L'Occident ne se récupère pas en déplaçant le trône à Rome. On le récupère en gouvernant Rome depuis la ville qui n'est jamais tombée. Un exarque est envoyé, recevant ensemble le commandement civil et militaire, et chargé de tenir la péninsule au nom de l'empereur."
 cc_byz_exarchal_chancery: "La chancellerie exarchale"
 cc_byz_exarchal_chancery_desc: "Un bureau permanent au palais dont la seule mission est le commandement occidental : sa correspondance, ses comptes, ses nominations, et les six semaines qu'un message met pour faire l'aller-retour. On ne peut supprimer la distance. On peut l'administrer."

 cc_byz_capital_is_constantinople_tt: "Notre capitale est [ShowLocationName('constantinople')]"

 # Exarch government reforms
 cc_byz_exarch_caretaker_reform: "Exarque intérimaire"
 cc_byz_exarch_caretaker_reform_desc: "Un officiel du palais sans connexions occidentales et sans ambitions dont l'empereur doive s'inquiéter. Il suivra ses instructions à la lettre, y compris celles qui ne conviennent plus à la situation, et il ne se créera pas de suite."
 cc_byz_exarch_effective_reform: "Exarque effectif"
 cc_byz_exarch_effective_reform_desc: "Un administrateur capable à qui l'on a donné la discrétion de gouverner plutôt que de simplement rendre compte. La province sera rentabilisée en une décennie. Tout comme le réseau d'hommes locaux qui lui doivent leur poste."
 cc_byz_exarch_strategos_reform: "Exarque et Stratège"
 cc_byz_exarch_strategos_reform_desc: "Un général envoyé à l'ouest avec des troupes et l'autorité pour les utiliser, ce que étaient réellement les exarques de Ravenne. Il peut tenir l'Italie. Qu'il la tienne pour l'empereur est une question distincte, à laquelle on répondra plus tard."

 # Character interaction.
 # Key set mirrors vanilla assign_governor (character_interactions_l_english.yml:261-270),
 # which needs _concept, _act, _desc_specific, _past and _act_past alongside the base keys.
 cc_byz_appoint_exarch: "Nommer un exarque"
 cc_byz_appoint_exarch_concept: "[character|e]"
 cc_byz_appoint_exarch_act: "$cc_byz_appoint_exarch$"
 cc_byz_appoint_exarch_desc: "Placez une [area|e] occidentale sous l'autorité d'un exarque nommé, détenant ensemble les commandements civil et militaire. Notre capitale reste à [ShowLocationName('constantinople')]."
 cc_byz_appoint_exarch_desc_specific: "Placez une [area|e] occidentale sous l'autorité de [SCOPE.sCharacter('recipient').GetName], détenant ensemble les commandements civil et militaire en notre nom."
 cc_byz_appoint_exarch_past: "[SCOPE.sCharacter('recipient').GetName] est nommé exarque de [target_area.GetName]"
 cc_byz_appoint_exarch_act_past: "Par décret du [SCOPE.sCountry('actor').GetGovernment.GetRulerTitle], [SCOPE.sCharacter('recipient').GetName] a été nommé exarque de [target_area.GetName], en tant que [target_reform.GetName]"
 cc_byz_choose_exarch: "Choisissez le [character|e] à envoyer vers l'ouest :"
 cc_byz_select_exarch_type: "Sélectionnez les conditions de nomination"
 cc_byz_select_exarch_type_none: "@trigger_no! Aucun terme de nomination n'est disponible."
 cc_byz_select_exarchate_area: "Sélectionnez la [area|e] à placer sous l'autorité d'un exarque"
 cc_byz_select_exarchate_area_none: "@trigger_no! Nous ne possédons aucune [area|e] occidentale assez vaste pour être placée sous l'autorité d'un exarque."
 cc_byz_appoint_exarch_effect_tt: "La [area|e] devient un Exarchat sous [SCOPE.sCharacter('recipient').GetName] en tant que [target_reform.GetName], siégeant dans sa [location|e] la plus développée. Notre capitale reste inchangée. L'établissement du commandement occidental ravive notre revendication sur les anciennes frontières."
