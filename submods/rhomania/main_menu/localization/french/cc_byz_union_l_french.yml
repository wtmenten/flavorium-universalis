l_french:
 # Actions
 cc_byz_open_union_contacts: "Ouvrir des contacts avec Rome"
 cc_byz_open_union_contacts_desc: "Envoyez des légats vers l'ouest pour établir les conditions de réunion que la papauté serait prête à envisager. Les lettres et les ambassades n'engagent personne et peuvent être désavouées à tout moment, ce qui est précisément la raison pour laquelle elles sont la première étape et non la dernière."
 cc_byz_summon_union_council: "Convoquer un Conseil d'Union"
 cc_byz_summon_union_council_desc: "Convoquez un concile général avec les Latins pour régler les points de doctrine qui divisent les églises. Le concile produira un texte. La question de savoir si ce texte peut être prêché à Constantinople est une question distincte et n'est pas tranchée ici."
 cc_byz_promulgate_union: "Promulguer l'Union"
 cc_byz_promulgate_union_desc: "Lisez l'acte d'union à haute voix à Sainte-Sophie et exigez que le clergé de la capitale l'accepte. La signature a été obtenue à l'étranger. C'est l'étape qui décidera s'il a une quelconque signification."
 cc_byz_repudiate_union: "Répudier l'Union"
 cc_byz_repudiate_union_desc: "Renoncer à l'acte d'union. L'alliance avec le monde orthodoxe est rétablie et l'église est à nouveau entière. Aucune flotte ne viendra de l'ouest, et chaque cour d'Italie se souviendra de quel empereur a signé puis a annulé.\n\nCeci est une fin, pas un retour en arrière. L'arc ne recommence pas."
 cc_byz_clergy_will_attend_tt: "Le [clergy_estate|E] est tout à fait disposé à envoyer une délégation"

 # Country modifiers
 STATIC_MODIFIER_NAME_cc_byz_union_contacts: "Contacts avec Rome"
 STATIC_MODIFIER_DESC_cc_byz_union_contacts: "Les légats font des allers-retours. Rien n'a été convenu et les deux parties trouvent l'ambiguïté utile."
 STATIC_MODIFIER_NAME_cc_byz_union_signed: "Union signée"
 STATIC_MODIFIER_DESC_cc_byz_union_signed: "L'acte d'union a été signé à l'étranger et n'a pas été promulgué au pays. L'Occident croit que le schisme est terminé. La ville n'en a pas été informée."
 STATIC_MODIFIER_NAME_cc_byz_union_received: "Union reçue"
 STATIC_MODIFIER_DESC_cc_byz_union_received: "L'acte d'union a été lu dans Sainte-Sophie et la ville l'a accepté. Le clergé latin est accueilli, le crédit latin est moins cher, et l'empire peut demander des choses à l'Occident et occasionnellement les obtenir."
 STATIC_MODIFIER_NAME_cc_byz_union_rejected: "Union rejetée"
 STATIC_MODIFIER_DESC_cc_byz_union_rejected: "L'acte a été signé à l'étranger et refusé au pays. L'empire supporte désormais les coûts de la position latine et les coûts de la position orthodoxe, sans en tirer aucun des bénéfices."
 STATIC_MODIFIER_NAME_cc_byz_anti_unionist_ferment: "Ferment anti-unioniste"
 STATIC_MODIFIER_DESC_cc_byz_anti_unionist_ferment: "Des prêtres qui refusent de commémorer le Pape, des congrégations qui partent lorsqu'elles l'entendent commémoré, et un nombre croissant d'hommes qui ont conclu que le palais est le problème."
 STATIC_MODIFIER_NAME_cc_byz_union_repudiated: "Union répudiée"
 STATIC_MODIFIER_DESC_cc_byz_union_repudiated: "L'union a été renoncée. L'église est entière, le monde orthodoxe est satisfait, et les puissances occidentales ont classé l'empire comme un partenaire sur lequel elles ne peuvent compter."
 STATIC_MODIFIER_NAME_cc_byz_latin_aid: "Aide latine"
 STATIC_MODIFIER_DESC_cc_byz_latin_aid: "Hommes, argent et navires venant de l'ouest, arrivant parce que l'union a tenu assez longtemps pour que quelqu'un puisse agir en conséquence."

 # Opinion modifiers
 cc_byz_union_negotiating: "Négociation de la Réunion"
 cc_byz_union_upheld: "A maintenu l'Union"
 cc_byz_union_undelivered: "L'Union n'a pu être instaurée"
 cc_byz_union_renounced: "A renoncé à l'Union"
 cc_byz_submitted_to_rome: "Soumis à Rome"
 cc_byz_held_the_faith: "Fidèle à la Foi"

 # cc_byz_union.1 - the legates
 cc_byz_union.1.title: "Légats vers l'Ouest"
 cc_byz_union.1.desc: "La proposition a déjà été faite et le sera à nouveau, et c'est toujours la même proposition : les églises ne forment qu'une seule église, elles ont simplement été administrées séparément pendant quatre cents ans, et un petit nombre de difficultés formelles séparent l'arrangement actuel d'une réunion qui obligerait l'Occident à prendre au sérieux la survie de l'empire.\n\nLe petit nombre de difficultés formelles est de quatre, et des hommes ont passé leur vie sur chacune d'entre elles. Ce qui est décidé maintenant, c'est seulement qui part, et ce qu'ils sont autorisés à dire à leur arrivée."
 cc_byz_union.1.desc_hellenic: "La proposition a déjà été faite. Elle est soulevée maintenant dans une ville qui a passé une génération à décider qu'elle était grecque et orthodoxe et que ces deux affirmations étaient identiques, et la proposition résonne différemment dans cette ville que dans la précédente.\n\nLes difficultés sont les quatre mêmes qu'elles ont toujours été. Ce qui a changé, c'est qu'un grand nombre de personnes qui les auraient autrefois qualifiées de techniques les considèrent désormais comme l'essentiel du problème, et elles attendront les légats à leur retour."
 cc_byz_union.1.a: "Des hommes qui rendront compte avec précision et ne promettront rien."
 cc_byz_union.1.b: "Des hommes qui promettront tout ce qui permettra de garder la porte ouverte."
 cc_byz_union.1.c: "Les propres hommes du patriarche. L'Église ne peut dire qu'on ne l'a pas consultée."

 # cc_byz_union.2 - Rome's terms
 cc_byz_union.2.title: "Les Conditions de Rome"
 cc_byz_union.2.desc: "La réponse est courtoise, expansive sur le sujet de la fraternité chrétienne, et parfaitement claire une fois les courtoisies mises de côté.\n\nRome acceptera la réunion sur la base que Rome a toujours eu raison. Le rite grec peut continuer. La position grecque ne le peut pas. Il y a beaucoup de discours sur le respect des vénérables coutumes des églises orientales, et aucun suggérant qu'un point de doctrine soit ouvert à la discussion.\n\nCe n'est pas une position déraisonnable pour Rome. C'est simplement une position qui ne peut être lue à haute voix dans cette ville."
 cc_byz_union.2.a: "Lisez-le au synode en l'état."
 cc_byz_union.2.b: "Faites-le d'abord traduire généreusement."
 cc_byz_union.2.c: "Répondez avec nos propres conditions."

 # cc_byz_union.10 - the council
 cc_byz_union.10.title: "Le conseil se réunit"
 cc_byz_union.10.desc: "La délégation a traversé vers l'Italie : évêques, le patriarche, théologiens, et un certain nombre d'hommes dont la fonction est d'être vus comme présents. Les Latins ont fourni le logement, une allocation et une salle.\n\nLe premier point à l'ordre du jour est la procession du Saint-Esprit, là où toutes les tentatives précédentes se sont arrêtées. Le credo latin dit que l'Esprit procède du Père et du Fils. Le credo grec dit du Père. Quatre cents ans de disputes ont établi que les deux parties comprennent parfaitement la position de l'autre et qu'aucune ne peut la concéder sans concéder qui a l'autorité pour trancher."
 cc_byz_union.10.desc_reluctant: "La délégation a traversé vers l'Italie et une bonne partie d'entre elle ne voulait pas venir. L'allocation des Latins est perçue par des hommes qui ont l'intention de voter contre tout ce qu'elle était censée encourager, et tous les intervenants le savent.\n\nLe premier point à l'ordre du jour est la procession du Saint-Esprit. C'est aussi, selon l'avis privé de la plupart de la délégation grecque, le dernier point, puisqu'ils ne sont pas venus pour être convaincus et se le sont dit longuement durant le voyage."
 cc_byz_union.10.a: "Concédez le filioque comme une formulation, et non comme une doctrine."
 cc_byz_union.10.b: "Concédez également les azymes. Le rite latin est valide."
 cc_byz_union.10.c: "Gardez les deux. Laissez Rome s'en disputer la possession."

 # cc_byz_union.11 - papal primacy
 cc_byz_union.11.title: "La Primauté"
 cc_byz_union.11.desc: "Tout le reste était préliminaire. La question est de savoir si l'évêque de Rome détient l'autorité sur l'ensemble de l'Église, ou la première place d'honneur en son sein, et aucune formulation ne satisfait les deux lectures tout en ayant un sens.\n\nRome a été patiente concernant le credo et le pain parce que Rome ne se soucie pas particulièrement du credo ou du pain. C'est l'article pour lequel les Latins sont venus, et la délégation grecque l'a compris dès le premier jour."
 cc_byz_union.11.desc_conceded: "Tout le reste a été concédé, et la délégation découvre maintenant ce que cela valait comme position de négociation, c'est-à-dire rien.\n\nLa question est celle de la primauté : l'autorité sur l'ensemble de l'Église, ou la première place d'honneur en son sein. Ayant cédé sur le credo et sur le rite, les Grecs arrivent à cet article sans aucun autre article restant pour négocier, et les Latins ont organisé l'ordre du jour précisément dans cette optique."
 cc_byz_union.11.a: "Le reconnaître, tout en préservant les droits des patriarches orientaux."
 cc_byz_union.11.b: "Offrir une primauté d'honneur. Qu'ils acceptent ou refusent."
 cc_byz_union.11.c: "Interrompre. Cela ne peut être prêché dans Sainte-Sophie."

 # cc_byz_union.12 - signed
 cc_byz_union.12.title: "L'Acte d'Union"
 cc_byz_union.12.desc: "C'est signé. Les cloches sonnent dans les églises latines, le décret est lu dans deux langues, et le schisme est déclaré terminé après quatre cent onze ans.\n\nLa délégation grecque signe puis, presque comme un seul homme, regagne ses quartiers sans faire de célébrations. Plusieurs d'entre eux composent déjà le récit qu'ils feront à leur retour. L'un d'eux a refusé de signer et les Latins ont décidé, à juste titre, qu'il valait mieux ne pas en faire un problème."
 cc_byz_union.12.desc_bought: "C'est signé, par des hommes payés pour être là, et les Latins ont remarqué lesquelles des signatures ont été apposées rapidement.\n\nLe décret est lu dans deux langues et le schisme est déclaré terminé. La délégation grecque regagne ses quartiers sans cérémonie. Plusieurs d'entre eux préparent déjà l'explication qu'ils donneront chez eux, et l'explication est dans la plupart des cas qu'ils ont signé sous la contrainte, dans une ville étrangère, avec une allocation latine, et que rien de signé dans ces conditions ne lie l'église."
 cc_byz_union.12.a: "C'est fait. Maintenant, il faut que cela soit accepté par le peuple."

 # cc_byz_union.13 - collapse
 cc_byz_union.13.title: "Le conseil se dissout"
 cc_byz_union.13.desc: "Il n'y a pas de décret. La délégation rentre chez elle avec ses frais payés et rien d'autre de réglé, et les Latins font savoir que les Grecs ont parcouru un très long chemin pour refuser ce qu'on leur avait déjà dit être requis.\n\nÀ Constantinople, cela sera rapporté comme une défense de la foi, et c'en est une. C'est aussi la fin, pour ce règne au moins, de toute perspective de voir une flotte occidentale arriver dans le Bosphore pour d'autres raisons que le commerce."
 cc_byz_union.13.a: "L'église est intacte. Dites-le haut et fort."
 cc_byz_union.13.b: "Maintenir la légation en Italie. On tentera à nouveau l'expérience."

 # cc_byz_union.20 - promulgation
 cc_byz_union.20.title: "Promulgation à Sainte-Sophie"
 cc_byz_union.20.desc: "Le décret doit être lu dans la Grande Église, en grec, devant le clergé et le peuple de la capitale, et le Pape doit être commémoré dans la liturgie par son nom.\n\nLa seconde partie est celle qui importe. Un document signé en Italie est un document. Un nom prononcé dans la liturgie à Sainte-Sophie, c'est l'Église qui le dit, et chaque personne dans le bâtiment comprendra la différence."
 cc_byz_union.20.desc_softened: "Le décret doit être lu dans la Grande Église, en grec, et le Pape commémoré dans la liturgie par son nom.\n\nIl y a une difficulté qui n'est pas encore devenue publique. Le texte diffusé chez nous a été traduit avec une certaine générosité, et le texte qui doit maintenant être lu est celui qui a été réellement signé. Un certain nombre d'hommes dans ce bâtiment ont obtenu le latin. Ils comparent les deux depuis quelques semaines et ils attendaient précisément cette occasion."
 cc_byz_union.20.desc_hostile: "Le décret doit être lu dans la Grande Église, et l'humeur de la ville a été rapportée au palais en des termes qui ne laissent place à aucune interprétation.\n\nLes monastères se sont déclarés contre. Des prêtres de la capitale ont déclaré publiquement qu'ils ne commémoreraient pas le Pape et ne serviraient pas avec ceux qui le font. Il a été suggéré à l'empereur, par des gens dont c'est le métier de savoir, que la lecture soit reportée. Il n'y a aucune date à laquelle elle serait mieux accueillie. C'est là toute la difficulté."
 cc_byz_union.20.a: "Lisez-le. Laissez les objections être entendues après."
 cc_byz_union.20.b: "Lisez-le. Arrêtez quiconque interrompt."
 cc_byz_union.20.c: "Lisez-le vous-même, et répondez-leur depuis l'ambon."

 # cc_byz_union.21 - reception
 cc_byz_union.21.title: "Ce que la Cité a fait"
 cc_byz_union.21.desc_rejected: "Cela n'a pas pris. La lecture a été achevée, ce qui est le maximum que l'on puisse en dire.\n\nLes monastères ont catégoriquement refusé l'union. La majorité du clergé paroissial de la capitale ne commémorera pas le Pape, et les fidèles ont clairement indiqué quelle liturgie ils suivront et laquelle ils quitteront. Les églises où l'union est observée se vident. Celles où elle ne l'est pas sont pleines.\n\nL'acte est la loi, mais il n'est pas la pratique de l'église dans cette ville, et tout le monde, y compris l'empereur, sait désormais que cette différence est permanente."
 cc_byz_union.21.desc_accepted: "Cela a pris, ce qui a surpris nombre de personnes qui avaient longuement prédit le contraire.\n\nLa lecture a été achevée, le Pape a été commémoré, et les objections ont été formulées par des hommes qui sont ensuite retournés dans leurs églises pour servir la liturgie. Les monastères sont mécontents et l'ont exprimé par écrit, longuement, sans aller plus loin. La ville a décidé, globalement, qu'une formule convenue par un concile est une affaire de conciles.\n\nL'union est la pratique de l'église ici. Cela n'était plus arrivé depuis avant le sac de la ville."
 cc_byz_union.21.desc_divided: "Cela a pris à moitié, ce qui est le sort habituel de ces choses et le plus difficile à gouverner.\n\nCertaines églises commémorent le Pape et d'autres non. Certains membres du clergé serviront avec les unionistes et d'autres non, et ceux qui refusent sont globalement ceux qui ont les congrégations les plus nombreuses. Les monastères ont refusé et on ne les a pas forcés à s'y plier.\n\nRien n'est rompu. Rien n'est non plus stabilisé, et chaque nomination à chaque siège est désormais une décision concernant l'union, que le palais le veuille ou non."
 cc_byz_union.21.a: "C'est ainsi."

 # cc_byz_union.22 - the ferment
 cc_byz_union.22.title: "Le ferment"
 cc_byz_union.22.desc: "La résistance n'a pas diminué et elle a cessé de porter sur le filioque.\n\nCe qui a commencé comme une objection doctrinale parmi les théologiens est maintenant l'opinion ordinaire de la capitale, et elle a accumulé tous les autres griefs en chemin : les taxes, les Italiens dans le port, les charges qui s'achètent et se vendent, le sentiment général que le palais a fait des concessions pendant un siècle en qualifiant chaque concession de nécessaire. L'union est simplement celle que les gens peuvent nommer."
 cc_byz_union.22.desc_forced: "Les arrestations n'ont rien réglé. C'est rarement le cas, et cette fois-ci, elles ont fourni à la résistance la seule chose qui lui manquait : des hommes à désigner.\n\nLe clergé arrêté lors de la promulgation est évoqué dans les monastères en termes habituellement réservés aux confesseurs. Leurs noms sont connus dans des paroisses qui n'avaient aucune opinion sur le filioque il y a un an. Quels que soient les mérites de l'union, elle est désormais le drapeau de tous les griefs de la ville, et c'est le palais qui l'y a placé."
 cc_byz_union.22.a: "L'imposer. Priver les opposants, nommer des unionistes."
 cc_byz_union.22.b: "Que cela soit prêché des deux manières."
 cc_byz_union.22.c: "Trouver un siège lointain pour le plus bruyant d'entre eux."

 # cc_byz_union.30 - repudiation
 cc_byz_union.30.title: "Renonciation à l'Union"
 cc_byz_union.30.desc: "L'acte doit être renoncé. Il n'existe aucune procédure pour cela, l'union ayant été convenue par un concile général ; la renonciation prendra donc la forme que le palais lui donnera et le palais affirmera que cette forme est suffisante.\n\nRome ne sera pas d'accord. L'accord de Rome n'a jamais été possible sur ce point et le poursuivre ne ferait que retarder les choses."
 cc_byz_union.30.desc_failed: "L'acte doit être renoncé, et la seule véritable question est de savoir pourquoi cela a pris autant de temps.\n\nCe n'est plus la pratique de l'église dans cette ville depuis le jour où il a été lu. Le clergé ne l'observe pas, les fidèles ne fréquentent pas les lieux où il est observé, et le palais a passé des années à maintenir une fiction juridique qui lui coûte sa crédibilité chez elle et ne lui a rien rapporté à l'étranger, puisque l'Occident voit parfaitement bien que l'union n'est pas en vigueur ici.\n\nLe renoncer ne change rien à ce qui se passe dans les églises. Cela change ce que l'empereur prétend."
 cc_byz_union.30.desc_held: "L'acte doit être renoncé, et c'est une chose plus difficile qu'elle ne l'aurait été il y a dix ans, car l'union a pris.\n\nLes églises l'observent. Le clergé s'y est résigné et une génération d'entre eux a été ordonnée sans rien connaître d'autre. Il y a des hommes qui ont été convaincus, à un certain prix pour eux-mêmes, que c'était la bonne voie, et on leur dira maintenant que le palais a changé d'avis.\n\nL'Occident, meanwhile, a traité l'empire comme un partenaire. Cela s'arrête avec l'annonce."
 cc_byz_union.30.a: "Le renoncer explicitement. Que le registre demeure."
 cc_byz_union.30.b: "Le renoncer, et blâmer les légats qui ont signé."
 cc_byz_union.30.c: "Renoncer au texte. Maintenir l'ambassade à Rome."

 # cc_byz_union.31 - the west reacts
 cc_byz_union.31.title: "L'Occident tire ses conclusions"
 cc_byz_union.31.desc: "La réaction n'est pas la colère, avec laquelle on pourrait travailler. C'est la conclusion arrêtée que l'empire ne peut pas livrer ce que ses empereurs signent, et que tout ce qui est convenu en Italie sera défait à Constantinople par des gens que l'empereur ne contrôle pas.\n\nLa conséquence pratique est que les propositions cessent d'arriver. Personne ne déclare quoi que ce soit. La correspondance devient simplement plus courte, puis formelle, puis occasionnelle, et les hommes qui soutenaient autrefois à Rome que les Grecs valaient la peine d'être aidés ont cessé de le soutenir parce qu'ils ont perdu."
 cc_byz_union.31.a: "L'accepter. Nous tenons ce que nous tenons avec ce que nous avons."
 cc_byz_union.31.b: "Regardez vers l'est et le sud. Les autres se moquent de ce que nous prêchons."

 # cc_byz_union.40 - the payoff
 cc_byz_union.40.title: "L'objectif de l'Union"
 cc_byz_union.40.desc: "L'union a tenu assez longtemps pour être crédible, et cette croyance a produit des résultats, ce qui n'aurait pas pu être promis au départ.\n\nIl y a de l'argent, collecté en Occident pour la défense de l'Église d'Orient, et il a été réellement envoyé plutôt qu'annoncé. Il y a des hommes : pas une armée, mais des compagnies, et des capitaines qui ont été payés pour les mener. Il y a un légat papal à la capitale qui plaide la cause de l'empire dans ses lettres vers Rome plutôt que d'en rapporter les lacunes.\n\nRien de tout cela ne serait arrivé pour un schismatique. C'était là l'argument constant, et nous le voyons ici se concrétiser."
 cc_byz_union.40.a: "Prenez les hommes et l'argent."
 cc_byz_union.40.b: "Leur demander de faire valoir nos revendications sur les sièges orientaux."
 cc_byz_union.40.c: "Demander au Pape d'aborder la question de nos regalia."
