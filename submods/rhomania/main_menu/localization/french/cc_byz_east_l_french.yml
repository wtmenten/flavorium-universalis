l_french:
 # Mission tasks
 cc_byz_task_red_sea: "Le détroit de la mer Rouge"
 cc_byz_task_red_sea_desc: "Aden et la côte yéménite. L'Égypte sans le détroit est un terminus ; l'Égypte avec lui est un corridor, et tout ce qui circule entre l'océan Indien et Alexandrie paie pour l'utiliser."
 cc_byz_task_horn: "Le littoral africain"
 cc_byz_task_horn_desc: "Zeila, Berbera et Mogadiscio. Des citernes, des entrepôts et une garnison dans chacune d'elles. Le long voyage vers l'Inde ne peut se faire sans elles, et chaque puissance ayant tenté l'expérience l'a appris de la même manière."
 cc_byz_task_india: "Les comptoirs de Malabar"
 cc_byz_task_india_desc: "Une présence commerciale sur la côte indienne, non sa conquête. Un comptoir, une charte pour le soutenir, et des taxes payées à quiconque gouverne le port."
 cc_byz_task_spice_islands: "La Source"
 cc_byz_task_spice_islands_desc: "Sumatra et Java, là où les épices poussent réellement. Tout ce qui se trouve à l'ouest d'ici n'est qu'un intermédiaire, et pendant deux siècles, cela a signifié Venise."

 # Theatre triggers
 cc_byz_eastern_gate_tt: "Nous ou un sujet détenons Alexandrie, Le Caire et le Sinaï"
 cc_byz_theatre_red_sea_tt: "Nous ou un sujet avons une présence sur la côte yéménite"
 cc_byz_theatre_horn_tt: "Nous ou un sujet détenons un comptoir dans la Corne de l'Afrique"
 cc_byz_theatre_india_tt: "Nous ou un sujet avons une présence sur la côte indienne"
 cc_byz_theatre_spice_islands_tt: "Nous ou un sujet avons une présence dans les îles aux épices"

 # Theatre actions
 cc_byz_claim_theatre_red_sea: "Proclamer le passage de la mer Rouge"
 cc_byz_claim_theatre_red_sea_desc: "Déclarez le détroit ouvert sous l'autorité impériale, et déterminez qui peut l'utiliser et à quelles conditions."
 cc_byz_claim_theatre_horn: "Proclamer les comptoirs africains"
 cc_byz_claim_theatre_horn_desc: "Établissez les stations de ravitaillement qui rendent possible le voyage vers l'Inde, et décidez si elles sont des garnisons ou des maisons d'hôtes."
 cc_byz_claim_theatre_india: "Proclamer le commerce indien"
 cc_byz_claim_theatre_india_desc: "Établissez des comptoirs sur la côte indienne et une compagnie à charte pour les gérer."
 cc_byz_claim_theatre_spice_islands: "Proclamer le commerce des épices"
 cc_byz_claim_theatre_spice_islands_desc: "Atteindre les îles où poussent les épices, et devenir la puissance qui les vend plutôt que celle qui les achète."

 # Country modifiers
 STATIC_MODIFIER_NAME_cc_byz_red_sea_transit: "Le Transit de la mer Rouge"
 STATIC_MODIFIER_DESC_cc_byz_red_sea_transit: "Le détroit est tenu et les taxes sont collectées. Chaque cargaison circulant entre l'océan Indien et la Méditerranée passe par une douane impériale."
 STATIC_MODIFIER_NAME_cc_byz_horn_stations: "Les Stations africaines"
 STATIC_MODIFIER_DESC_cc_byz_horn_stations: "Citernes, entrepôts et pilotes sur la côte somalienne. Sans prestige, et pourtant la différence entre une route et une ambition."
 STATIC_MODIFIER_NAME_cc_byz_indian_factories: "Les Factories indiennes"
 STATIC_MODIFIER_DESC_cc_byz_indian_factories: "Des marchands impériaux résidant sur la côte de Malabar, commerçant sous charte, avec leurs propres entrepôts et un consul pour défendre leurs intérêts."
 STATIC_MODIFIER_NAME_cc_byz_spice_monopoly: "Le Commerce des épices"
 STATIC_MODIFIER_DESC_cc_byz_spice_monopoly: "L'empire achète là où les épices poussent et vend là où elles sont désirées, et les maisons italiennes qui ont passé deux siècles entre les deux les achètent désormais à Constantinople."
 STATIC_MODIFIER_NAME_cc_byz_eastern_company: "La Compagnie d'Orient"
 STATIC_MODIFIER_DESC_cc_byz_eastern_company: "Une compagnie à charte assume les navires, les pertes et les risques. La couronne détient le sceau et prend une part de ce qui en revient."
 STATIC_MODIFIER_NAME_cc_byz_eastern_learning: "Apprendre de l'Orient"
 STATIC_MODIFIER_DESC_cc_byz_eastern_learning: "Des savants sont partis avec les marchands et sont revenus avec les mathématiques, l'astronomie et la médecine. La chose la moins chère que l'empire ait achetée là-bas et celle qui a survécu aux manufactures."

 # Casus belli
 cc_byz_cb_indian_ocean: "L'océan Indien"
 cc_byz_cb_indian_ocean_desc: "L'empire détient le détroit, et les puissances de l'océan au-delà sont désormais des voisins proches, que l'une ou l'autre partie l'ait souhaité ou non."

 # cc_byz_east.1 - the strait
 cc_byz_east.1.title: "Le détroit"
 cc_byz_east.1.desc: "Alexandrie, Le Caire et le Sinaï sont tenus ensemble, ce qui signifie que pour la première fois depuis Justinien, l'empire contrôle l'intégralité du passage entre l'océan Indien et la Méditerranée.\n\nL'implication a été soumise au palais par un marchand grec qui a effectué la route d'Aden à deux reprises et qui est l'une des rares personnes à Constantinople à comprendre ce qui est désormais possible. Les épices ne viennent pas du Caire. Elles passent par Le Caire, depuis des ports que l'empire n'a jamais vus, transportées par des navires que l'empire ne possède pas, et les fonctionnaires du sultan s'enrichissent depuis deux siècles en se contentant de se tenir entre les deux extrémités.\n\nCette position appartient désormais à l'empereur. Ce qu'il en fera est la question."
 cc_byz_east.1.desc_indebted: "L'empire contrôle tout le passage entre l'océan Indien et la Méditerranée, et il a des créanciers qui en ont compris les implications avant le palais.\n\nLes facteurs vénitiens et génois ont déjà demandé, séparément et avec beaucoup de tact, ce que l'empereur entend faire concernant le transit. Tous deux ont observé que les arrangements existants avaient bien servi tout le monde. Aucun n'a mentionné les soldes impayés, ce qui permet au palais de savoir que c'est bien de ces soldes dont la conversation traitait.\n\nLa route des épices est la chose la plus précieuse que l'empire ait acquise en trois cents ans, et les hommes les mieux placés pour l'exploiter sont ceux à qui il doit de l'argent."
 cc_byz_east.1.a: "Taxer le passage. Laisser tout le monde l'utiliser."
 cc_byz_east.1.b: "Fermez-le à la navigation latine."
 cc_byz_east.1.c: "Affrétez une compagnie. Laissez les marchands assumer le risque."

 # cc_byz_east.10 - the long run
 cc_byz_east.10.title: "Le long cours"
 cc_byz_east.10.desc: "La distance est le problème, et ce n'est pas un problème que l'on peut résoudre par simple volonté.\n\nUn navire quittant la mer Rouge pour la côte de Malabar reste en mer pendant des semaines sans aucun port ami, suivant le rythme des moussons qui ne permettent la traversée que deux fois par an et punissent quiconque s'y trompe. L'eau vient à manquer. Les coques s'encrassent. Les équipages tombent malades.\n\nLa réponse est connue depuis les Ptolémées et elle n'a rien de prestigieux : des stations sur la côte africaine. Zeila, Berbera, Mogadiscio. Des citernes, un entrepôt, quelqu'un qui connaît les vents. Quiconque détient ces points rend la traversée routinière, et quiconque ne les détient pas en fait une aventure."
 cc_byz_east.10.a: "Construisez-les correctement. Cisternes, entrepôts, garnisons."
 cc_byz_east.10.b: "Trouvez un accord avec les capitaines de port."
 cc_byz_east.10.c: "Envoyer la flotte en avant et prendre ce dont nous avons besoin."

 # cc_byz_east.20 - the factories
 cc_byz_east.20.title: "La côte de Malabar"
 cc_byz_east.20.desc: "L'océan Indien connaît un commerce international ordonné depuis un millénaire, et l'empire y est arrivé tardivement.\n\nL'organisation est bien comprise par tous, sauf par les nouveaux venus. Les marchands étrangers vivent dans un quartier désigné, commercent sous la protection du souverain local, paient ses taxes et règlent leurs litiges devant ses tribunaux. Arabes, Perses, Chinois et Juifs ont tous fait affaire selon ces termes pendant des siècles et s'en sont enrichis.\n\nLes facteurs impériaux se sont vu proposer exactement cela. Plusieurs d'entre eux jugent cela indigne de l'Empire romain. Ceux qui sont là depuis le plus longtemps sont ceux qui s'opposent le plus farouchement à l'accepter."
 cc_byz_east.20.desc_force: "L'empire est arrivé sur la côte de Malabar avec une flotte, ce qui a changé la nature de l'offre.\n\nLes souverains locaux ont déjà affaire à des étrangers armés et leur analyse est pragmatique : les navires sont formidables, ils sont très loin de chez eux, et la mousson signifie qu'ils ne peuvent être renforcés pendant six mois de l'année. Des conditions ont été proposées qui sont nettement moins avantageuses que celles dont jouissent les Arabes et les Perses, au motif raisonnable qu'une puissance qui arrive armée pose une question différente.\n\nLe commandant impérial a demandé des instructions. Il a également, dans un rapport séparé, noté combien de ses navires seraient encore à flot si l'arrangement tournait mal en juillet."
 cc_byz_east.20.a: "Commercer en tant qu'invités, selon la loi locale."
 cc_byz_east.20.b: "Fortifiez les comptoirs."
 cc_byz_east.20.c: "Envoyer des savants avec les marchands."

 # cc_byz_east.30 - the source
 cc_byz_east.30.title: "La Source"
 cc_byz_east.30.desc: "Les îles où pousse l'épice sont atteintes, et la chose la plus frappante à leur sujet est leur petite taille.\n\nUne marchandise qui a été la cargaison la plus précieuse du monde occidental depuis avant la chute de Rome, qui a financé la république vénitienne et la moitié des fortunes de Gênes, provient d'un éparpillement d'îles que les navigateurs impériaux ont dû se faire montrer sur une carte. Les producteurs la vendent pour une fraction de son prix à Alexandrie et sont parfaitement conscients de la disparité ; ils n'avaient simplement aucun moyen d'atteindre l'autre extrémité de la chaîne.\n\nL'empire détient désormais les deux extrémités."
 cc_byz_east.30.desc_treaty: "Les îles où pousse l'épice sont atteintes, et atteintes par des accords plutôt que par la force, ce que les facteurs impériaux considèrent comme l'accomplissement le plus durable.\n\nChaque accord, du Yémen à Java, a été négocié : taxes payées, droit local accepté, querelles réglées devant un tribunal tiers. Cela a pris plus de temps qu'une flotte n'en aurait pris et cela a produit quelque chose qu'une flotte ne pouvait pas : une route qui n'a pas besoin d'être garnisonnée pour rester ouverte.\n\nLes producteurs vendent pour une fraction du prix que l'épice atteint à Alexandrie. L'empire se trouve désormais là où Venise se trouvait, et il y est parvenu en étant un meilleur client plutôt qu'un pire voisin."
 cc_byz_east.30.desc_monopoly: "Les îles où pousse l'épice sont atteintes, et le détroit situé derrière elles a été fermé à la navigation latine pendant une génération.\n\nLa conséquence n'est pas subtile et n'était pas censée l'être. Venise et Gênes se sont construites en s'interposant entre l'épice et ses acheteurs, et elles ne s'y trouvent plus ; c'est l'empire qui s'y trouve. Le Rialto découvre ce que signifie être un client, et les rapports du sénat vénitien sont lus à Constantinople avec une attention qui n'est pas entièrement digne.\n\nC'est la chose la plus rentable que l'empire ait accomplie depuis Justinien. Cela a également fait de lui l'ennemi permanent des seules puissances de l'ouest possédant des flottes."
 cc_byz_east.30.a: "Un monopole royal."
 cc_byz_east.30.b: "Fermez-le aux bourgeois. Prenez-en une part."
 cc_byz_east.30.c: "Revendre aux Italiens leur accès, à notre prix."
