l_french:
 # Mission pack
 cc_byz_renovatio_campaign: "Renovatio Imperii"
 cc_byz_renovatio_campaign_DESCRIPTION: "Justinien a récupéré l'Afrique, l'Italie et une bande d'Espagne, et la récupération a coûté plus que le territoire n'en a jamais valu. La peste est arrivée avec la flotte, le trésor ne s'en est jamais remis, et l'Italie a été ruinée par la guerre menée pour la sauver.\n\nC'est cette campagne, menée à nouveau par un empire qui part de beaucoup moins. Chaque théâtre est gagnable. Aucun d'entre eux n'est gratuit."
 cc_byz_renovatio_campaign_BUTTON_TOOLTIP: "Récupérer les provinces occidentales"
 cc_byz_renovatio_campaign_BUTTON_DETAILS: "L'Illyricum, l'Italie, l'Afrique et l'Hispanie, dans cet ordre, pour finir par la mer elle-même."
 cc_byz_renovatio_campaign_CRITERIA_DESCRIPTION: "Les provinces occidentales ont été reconquises et la Méditerranée est redevenue un lac romain."
 cc_byz_task_illyricum: "Illyricum et Dalmatie"
 cc_byz_task_illyricum_desc: "La côte dalmate était romaine avant que Rome ne soit chrétienne et a été gouvernée depuis Constantinople, Venise, la Hongrie et par elle-même depuis lors. Les villes veulent la protection impériale. Elles sont moins enthousiastes quant à la fiscalité impériale."
 cc_byz_task_italy: "L'Italie et l'Exarchat"
 cc_byz_task_italy_desc: "\"Assez parlé des Goths.\"\n\nProcope rapporte ce sentiment et ensuite, longuement, ce que la guerre a réellement coûté : vingt ans, les aqueducs coupés, Rome assiégée trois fois et prise deux fois, et un pays récupéré dans un état qui rendait cette récupération discutable."
 cc_byz_task_africa: "Afrique"
 cc_byz_task_africa_desc: "La province qui s'autofinançait, jusqu'à ce que la frontière ne puisse plus être tenue sans payer la frontière, et que la frontière ne puisse plus être payée.\n\nCarthage tomba aux mains des Arabes soixante ans après que Constantinople eut cessé de pouvoir la renforcer."
 cc_byz_task_spania: "Spania"
 cc_byz_task_spania_desc: "Une bande de côte avec des montagnes dans son dos et aucun arrière-pays, tenue pendant soixante-dix ans contre les Wisigoths et perdue dans une guerre que personne à Constantinople n'a remarquée à l'époque.\n\nJustinien la voulait parce qu'elle avait été romaine. C'était là tout l'argument."
 cc_byz_task_mare_nostrum: "Mare Nostrum"
 cc_byz_task_mare_nostrum_desc: "\"Notre mer,\" l'appelaient les Romains, lorsqu'ils tenaient chaque rivage et pouvaient le dire sans que personne ne rie.\n\nCela n'est plus vrai depuis huit cents ans."

 # Theatre triggers
 cc_byz_theatre_illyricum_tt: "Nous ou un sujet détenons Salone, Split et Durrës"
 cc_byz_theatre_italy_tt: "Nous ou un sujet détenons Rome, Ravenne et Naples, et un exarchat les gouverne"
 cc_byz_theatre_africa_tt: "Nous ou un sujet détenons Palerme, Syracuse, Tunis et Tripoli"
 cc_byz_theatre_spania_tt: "Nous ou un sujet détenons Carthagène et Malaga"
 cc_byz_theatre_mare_nostrum_tt: "Nous avons terminé les quatre théâtres occidentaux"

 # Theatre actions
 cc_byz_claim_theatre_illyricum: "Proclamer la Reconquête de l'Illyrique"
 cc_byz_claim_theatre_illyricum_desc: "Déclarer la côte dalmate restaurée à l'empire et décider de ce qu'il convient de faire avec les populations qui y vivent."
 cc_byz_claim_theatre_italy: "Proclamer la Reconquête de l'Italie"
 cc_byz_claim_theatre_italy_desc: "Déclarer l'Italie restaurée et gouvernée. Nécessite la présence d'un exarque : les villes prises par une armée sont occupées, et non récupérées."
 cc_byz_claim_theatre_africa: "Proclamer la Reconquête de l'Afrique"
 cc_byz_claim_theatre_africa_desc: "Déclarer les provinces africaines restaurées, et découvrir ce que leur garnison coûte chaque année pour le reste de l'existence de l'empire."
 cc_byz_claim_theatre_spania: "Proclamer la Reconquête de l'Hispanie"
 cc_byz_claim_theatre_spania_desc: "Déclarer la côte espagnole restaurée. C'est une possession étroite à l'extrémité opposée de la mer avec rien derrière elle, et tout le monde au palais le sait."
 cc_byz_claim_mare_nostrum: "Proclamer Mare Nostrum"
 cc_byz_claim_mare_nostrum_desc: "Déclarer la Méditerranée redevenue une mer romaine, pour la première fois en neuf cents ans."

 # Country modifiers
 STATIC_MODIFIER_NAME_cc_byz_theatre_illyricum_held: "L'Illyrique récupérée"
 STATIC_MODIFIER_DESC_cc_byz_theatre_illyricum_held: "La côte dalmate et ses ports sont redevenus impériaux, et les hommes de l'intérieur sont disponibles pour le recrutement."
 STATIC_MODIFIER_NAME_cc_byz_theatre_italy_held: "L'Italie récupérée"
 STATIC_MODIFIER_DESC_cc_byz_theatre_italy_held: "Rome est gouvernée depuis Constantinople par l'intermédiaire d'un exarque. Chaque chancellerie d'Europe a dû décider comment qualifier cet arrangement."
 STATIC_MODIFIER_NAME_cc_byz_theatre_africa_held: "Afrique reconquise"
 STATIC_MODIFIER_DESC_cc_byz_theatre_africa_held: "Le grain et les douanes d'Afrique atteignent à nouveau la capitale. Tout comme les rapports des forts de frontière."
 STATIC_MODIFIER_NAME_cc_byz_theatre_spania_held: "La Spania récupérée"
 STATIC_MODIFIER_DESC_cc_byz_theatre_spania_held: "Une bande de la côte espagnole, ses ports, et un argument permanent pour savoir si tout cela mérite une garnison."
 STATIC_MODIFIER_NAME_cc_byz_mare_nostrum: "Mare Nostrum"
 STATIC_MODIFIER_DESC_cc_byz_mare_nostrum: "La Méditerranée est une mer romaine. Ni une revendication, ni un titre : les ports de chaque rive répondent à Constantinople, et un navire peut la traverser sans quitter l'empire."
 STATIC_MODIFIER_NAME_cc_byz_federate_settlement: "Règlement fédéré"
 STATIC_MODIFIER_DESC_cc_byz_federate_settlement: "Les populations slaves et valaques de l'intérieur détiennent leurs terres selon les termes impériaux en échange de services. Ils constituent désormais la garnison frontière, et leurs petits-enfants se décriront comme des Romains."
 STATIC_MODIFIER_NAME_cc_byz_italy_restored: "L'Italie restaurée"
 STATIC_MODIFIER_DESC_cc_byz_italy_restored: "Les aqueducs fonctionnent, les routes sont réparées et les villes sont repeuplées, le tout aux dépens d'un trésor qui avait d'autres engagements."
 STATIC_MODIFIER_NAME_cc_byz_african_limes: "Le Limes africain"
 STATIC_MODIFIER_DESC_cc_byz_african_limes: "Les forts de frontière sont gardés et les garnisons sont payées à temps, ce qui constitue toute la différence entre une frontière et un terrain de razzia."
 STATIC_MODIFIER_NAME_cc_byz_spania_reinforced: "La Spania renforcée"
 STATIC_MODIFIER_DESC_cc_byz_spania_reinforced: "Les possessions espagnoles sont ravitaillées et défendues par la mer, ce qui fonctionne exactement tant que la flotte n'a rien de plus urgent à faire."
 STATIC_MODIFIER_NAME_cc_byz_army_of_the_west: "L'Armée de l'Ouest"
 STATIC_MODIFIER_DESC_cc_byz_army_of_the_west: "Une armée de campagne vétéran, stationnée en permanence à mille milles de la capitale, fidèle aux officiers qui la nourrissent et devenant progressivement un corps électoral à part entière."

 # cc_byz_reconquest.1 - Illyricum
 cc_byz_reconquest.1.title: "Le peuple de l'intérieur"
 cc_byz_reconquest.1.desc: "La côte était la partie facile. Les villes sont romaines, l'ont toujours été, et attendaient d'être libérées par quelqu'un.\n\nL'intérieur est une question différente. Les Slaves et les Vlachs l'ont cultivée et y ont fait paître leurs bêtes pendant sept cents ans, ils n'ont pas été consultés sur la reconquête, et ils y seront encore quand l'arrangement actuel aura été remplacé par quoi que ce soit d'autre. Ils ne paient aucune taxe qui parvienne à la capitale et n'ont aucune objection particulière à en payer une, pourvu que quelqu'un explique à qui et pourquoi.\n\nChaque réponse impériale précédente à cette question est consignée. Aucune d'entre elles n'a fonctionné plus d'un siècle."
 cc_byz_reconquest.1.a: "Des terres contre le service. Les installer comme fédérés."
 cc_byz_reconquest.1.b: "Déplacez-les. Cela a déjà été fait."
 cc_byz_reconquest.1.c: "Les villes côtières conservent leurs libertés. Laissez l'intérieur tranquille."

 # cc_byz_reconquest.10 - Italy
 cc_byz_reconquest.10.title: "L'état de l'Italie"
 cc_byz_reconquest.10.desc: "L'Italie a été récupérée et les rapports qui en parviennent sont pires que ceux de la campagne.\n\nLes aqueducs desservant trois villes ont été coupés pendant les combats et n'ont pas été réparés. La campagne au nord de Rome a été disputée deux fois en six ans et n'est plus cultivée. La population de la ville elle-même n'est qu'une fraction de ce que l'évaluation prévoyait, et l'évaluation était déjà pessimiste.\n\nL'empire a récupéré l'Italie. Ce qu'il n'a pas récupéré, c'est tout ce qui en valait la peine, et remédier à cela est un projet qui se mesure en règnes."
 cc_byz_reconquest.10.desc_strained: "L'Italie a été récupérée, et ce n'est pas arrivé par voie de négociations.\n\nL'empire combattait déjà sur deux fronts et payait pour les deux, et il n'y avait ni l'argent ni le temps pour une campagne de sièges et de redditions négociées. Ainsi, les villes ont été prises d'assaut là où elles résistaient, la campagne a été pillée par une armée qui devait manger, et les rapports qui arrivent maintenant décrivent une province totalement ravagée par le processus de sa libération.\n\nC'est précisément ce qui s'est passé la première fois. La différence est que Justinien pouvait se permettre d'en être surpris."
 cc_byz_reconquest.10.a: "Le reconstruire à nos frais."
 cc_byz_reconquest.10.b: "Taxez-le. Cela paiera pour le prochain théâtre."
 cc_byz_reconquest.10.c: "Exonérer ses taxes pour une génération."

 # cc_byz_reconquest.20 - Africa
 cc_byz_reconquest.20.title: "La frontière africaine"
 cc_byz_reconquest.20.desc: "L'Afrique est riche, c'est pourquoi elle valait la peine d'être prise, et elle ne se stabilise pas, c'est pourquoi elle a été perdue.\n\nLes villes côtières et les régions céréalières sont sécurisées et produisent un véritable surplus. Tout ce qui se trouve à l'intérieur est une frontière, et la frontière ne reste pas immobile : les chefs maures pillent quand les garnisons sont faibles, acceptent la solde impériale quand elles sont fortes, et changent leur évaluation de la situation environ deux fois par an.\n\nLes forts fonctionnent. Les forts nécessitent des garnisons, les garnisons nécessitent une solde, et la solde doit traverser la mer. Les dépêches des commandants de frontière sont unanimes sur ces trois points et deviennent de plus en plus directes concernant le troisième."
 cc_byz_reconquest.20.a: "Payer les garnisons. Garnir les forts."
 cc_byz_reconquest.20.b: "Qu'ils vivent sur le pays."
 cc_byz_reconquest.20.c: "Acheter les chefs. C'est moins cher que des forts."

 # cc_byz_reconquest.30 - Spania
 cc_byz_reconquest.30.title: "La Côte Espagnole"
 cc_byz_reconquest.30.desc: "La Spania est tenue : une bande de côte, deux bons ports et un arrière-pays appartenant à quelqu'un d'autre qui commence immédiatement derrière les murs.\n\nElle a été prise à peu de frais car personne ne l'a défendue sérieusement, et elle n'est défendable que depuis la mer, par une flotte n'ayant rien de mieux à faire, contre des adversaires pouvant s'y concentrer en une semaine alors que les renforts mettent trois mois à arriver. Le commandant de la garnison a soumis une évaluation. Elle est rédigée avec professionnalisme et sa conclusion est que la position est intenable dans toute circonstance où cela importe.\n\nC'est également le point le plus à l'ouest de l'empire, et une flotte romaine s'y ancre pour la première fois en neuf siècles."
 cc_byz_reconquest.30.a: "Le renforcer. Il peut être tenu."
 cc_byz_reconquest.30.b: "Échangez-le contre quelque chose de ce côté de la mer."
 cc_byz_reconquest.30.c: "Tenez-le avec la flotte, et non avec une garnison."

 # cc_byz_reconquest.40 - the capstone
 cc_byz_reconquest.40.title: "Mare Nostrum"
 cc_byz_reconquest.40.desc: "Un navire quittant Constantinople peut faire escale à Thessalonique, Durrës, Syracuse, Carthage, Carthagène et revenir par Naples et Ravenne, et à aucun moment de ce voyage il n'entrera dans un port étranger.\n\nC'était vrai il y a neuf cents ans et cela ne l'est plus depuis. Les scribes qui ont préparé l'annonce ont dû consulter les registres les plus anciens pour trouver la formule correcte, et la formule qu'ils ont trouvée était écrite pour un empereur qui gouvernait depuis Ravenne et qui n'aurait pas reconnu l'empire qui a désormais répété son exploit.\n\nC'est fait. La mer est romaine."
 cc_byz_reconquest.40.desc_traded: "Un navire quittant Constantinople peut traverser toute la mer et ne faire escale que dans des ports impériaux, à une exception près qui n'est mentionnée dans aucune des proclamations.\n\nL'Hispanie a été cédée, pour de bonnes raisons et à un bon prix, à une puissance qui a respecté sa part du marché. La formule lue dans la Grande Église décrit la récupération des provinces occidentales sans les énumérer, et le scribe qui l'a rédigée ainsi a été remercié en privé pour son tact.\n\nLa mer est romaine. Elle l'est à une marge qui ne survivrait pas à un examen rigoureux, et cet examen ne sera pas mené."
 cc_byz_reconquest.40.desc_exhausted: "La mer est romaine, et l'empire qui l'a rendue telle n'est pas en état de jouir de ce fait.\n\nLe trésor est engagé pour une génération. Les armées de campagne sont des vétérans, éloignées, et on leur doit des arriérés que personne ne peut actuellement payer. Des provinces entières récupérées à un coût énorme sont administrées par des hommes que la capitale n'a jamais rencontrés, car la capitale n'a personne à envoyer. L'annonce a été lue dans la Grande Église devant une congrégation qui a été taxée pour cela pendant quarante ans.\n\nLa reconquête de Justinien s'est terminée exactement ici, au moment du succès complet, avec l'État qui l'a accomplie vidé par l'accomplissement même. Ce n'est pas une coïncidence et ce n'était pas imprévisible."
 cc_byz_reconquest.40.a: "Faites-le lire dans la Grande Église."

 # cc_byz_reconquest.50 - strain: the provinces stop paying
 cc_byz_reconquest.50.title: "Les Provinces cessent de payer"
 cc_byz_reconquest.50.desc: "Les transferts de fonds des provinces occidentales ont cessé, et les explications sont toutes individuellement raisonnables.\n\nL'Afrique a dépensé ses revenus pour ses garnisons. L'Italie a dépensé ses revenus pour les réparations ordonnées par la capitale. Les villes dalmates ont dépensé les leurs pour des remparts, et ont produit la correspondance dans laquelle la capitale le leur a demandé. Dans chaque cas, l'argent a été dépensé pour quelque chose dont l'empire avait besoin et dans chaque cas, l'empire ne le verra pas.\n\nLa difficulté est que la capitale a budgétisé tout cela, et les armées qui ont pris ces provinces y sont toujours, et sont toujours payées par un trésor qui supposait que les provinces se seraient déjà autofinancées."
 cc_byz_reconquest.50.desc_ruined: "Les transferts de fonds de l'Occident ont cessé, et le compte occidental peut être résumé en une ligne : l'Italie.\n\nL'Afrique paie. La Dalmatie paie un peu. L'Italie, qui était le poste unique le plus important dans toutes les projections du trésor quand cela a commencé, ne produit presque rien, car la province qui était censée financer le reste de la campagne a été ruinée au cours de sa conquête.\n\nLes commis ont préparé une comparaison avec l'évaluation d'avant-guerre. Elle n'a pas été demandée et elle circule quand même, ce qui indique au palais quelque chose sur l'humeur au trésor. L'Italie coûte actuellement plus en garnisons et en réparations qu'elle ne rapporte en taxes, et selon les tendances actuelles, elle continuera d'en être ainsi plus longtemps que n'importe lequel des serviteurs actuels ne sera en vie."
 cc_byz_reconquest.50.a: "Emprunter sur l'année prochaine. Maintenez tout."
 cc_byz_reconquest.50.b: "Donnez les provinces lointaines à quiconque pourra les tenir."
 cc_byz_reconquest.50.c: "Abandonner ce qui est le moins défendable, avant que nous ne les perdions."

 # cc_byz_reconquest.51 - strain: the army of the west
 cc_byz_reconquest.51.title: "L'Armée de l'Ouest"
 cc_byz_reconquest.51.desc: "Il y a maintenant une armée occidentale, et personne n'a décidé d'en créer une.\n\nElle a été assemblée pièce par pièce sur trente ans à partir de forces expéditionnaires qui n'ont jamais été retirées, et elle est devenue une institution permanente avec ses propres arrangements d'approvisionnement, son propre recrutement dans les provinces qu'elle garnise, et ses propres officiers qui n'ont servi nulle part ailleurs. Un soldat peut y être le fils d'un autre soldat. Ses hauts commandants correspondent entre eux plus qu'aucun d'entre eux ne correspond avec la capitale.\n\nC'est l'armée la plus efficace que possède l'empire. Elle est stationnée à mille milles du palais, on lui doit de l'argent, et les hommes qui s'y trouvent se considèrent comme l'armée de l'Occident plutôt que comme l'armée de l'empereur. Ces trois faits ont déjà été vrais auparavant."
 cc_byz_reconquest.51.a: "Notez-le, et payez-leur ce que nous pouvons."

 # cc_byz_reconquest.52 - the general
 cc_byz_reconquest.52.title: "Le Général Victorieux"
 cc_byz_reconquest.52.desc: "Le commandant à l'ouest a fait tout ce qu'on lui a demandé et même plus, et c'est là le problème.\n\nIl a pris la province, il la tient, ses hommes lui sont dévoués, et ses dépêches sont des modèles de forme correcte. Il n'a donné au palais aucun motif d'inquiétude, ce qui est en soi un motif : un homme aussi compétent, si loin, à la tête de cette armée, est un ensemble de circonstances plutôt qu'une accusation.\n\nL'empire a connu cela maintes fois. Dans la plupart de ces occasions, le général en question n'avait aucune intention d'être empereur, jusqu'au moment où ses troupes ont pris la décision pour lui."
 cc_byz_reconquest.52.desc_unpaid: "Le commandant à l'ouest n'a pas été payé, ses hommes n'ont pas été payés, et il a résolu le problème lui-même.\n\nIl ravitailles son armée directement depuis la province, de sa propre autorité, via des arrangements avec les propriétaires terriens locaux dont la capitale a été informée après coup. Cela fonctionne. La province est calme, les troupes sont nourries et la frontière est tenue, et rien de tout cela ne dépend plus d'un envoi de Constantinople.\n\nCette dernière clause est celle que l'on examine de près au palais. Une armée qui n'a pas besoin de l'argent de la capitale est une armée qui a cessé d'avoir besoin de la capitale."
 cc_byz_reconquest.52.a: "Le rappeler. L'honorer publiquement."
 cc_byz_reconquest.52.b: "Laissez-le là. Payez ses hommes d'ici, directement."
 cc_byz_reconquest.52.c: "Diviser le commandement entre trois officiers."
