l_french:
 # cc_byz_bureaucracy.62, the buy-back for a farmed-out office, and the timed societal drift
 # modifiers the bureau thread now grants.
 #
 # WHY .62 EXISTS. Playtesting: "the office farmed out being until the end of the game is too
 # harsh a punishment". It was also stacking, at three grant sites, with no removal path. The
 # modifier is now sixty years rather than permanent, and this event is the way out of it before
 # then, at a price scaled to the realm's tax base and to how dug in the office had become when
 # it was sold.

 cc_byz_bureaucracy.62.title: "L'office racheté"
 cc_byz_bureaucracy.62.desc: "La famille qui détient le poste a écrit au palais. Non pour se plaindre : pour observer, longuement et avec des chiffres, ce que le maintien de la charge leur a coûté, et pour noter qu'ils la rendraient bien sûr à la couronne si celle-ci acceptait de compenser les dépenses.\n\nCeci n'est pas une offre. C'est un prix, fixé par des gens qui ont eu longtemps pour réfléchir à ce que le poste vaut et aucune raison de le sous-estimer."
 cc_byz_bureaucracy.62.desc_dug_in: "Trois générations sont nées dans cette charge. Le grand-père du titulaire actuel l'a achetée, son père l'a administrée, et lui n'a jamais eu à se demander ce qu'il ferait autrement.\n\nLa famille a produit des comptes. Ils sont méticuleux, ils sont presque certainement honnêtes, et ils décrivent un investissement que la couronne devrait égaler pour l'annuler. Personne au palais ne prétend que la somme est déraisonnable. Elle est simplement énorme."
 cc_byz_bureaucracy.62.desc_several: "Plus d'un poste a été attribué de cette manière désormais, et les hommes qui les occupent se sont remarqués les uns les autres. Ce qui arrive au palais n'est pas une lettre d'une famille, mais une position convenue entre plusieurs personnes, citant les mêmes précédents et demandant le même prix.\n\nLa couronne a créé le précédent en vendant le premier poste. On lui rappelle maintenant ses propres règles."
 cc_byz_bureaucracy.62.a: "Payez-le. L'office appartient à la couronne."
 cc_byz_bureaucracy.62.b: "Reprendre le contrôle et les laisser porter plainte."
 cc_byz_bureaucracy.62.c: "Laissez tomber. L'argent est nécessaire ailleurs."

 # ---- Timed societal drift ----
 # Granted alongside the instant societal jumps rather than instead of them. The jump is the
 # decision landing; the drift is the decision working.
 STATIC_MODIFIER_NAME_cc_byz_taxis_reforming: "Gouvernement par bureau"
 STATIC_MODIFIER_DESC_cc_byz_taxis_reforming: "Les postes sont pourvus par nomination, occupés selon le bon vouloir du souverain et payés à temps. Rien de tout cela n'est un décret, tout cela est une politique."
 STATIC_MODIFIER_NAME_cc_byz_taxis_habit: "L'habitude administrative"
 STATIC_MODIFIER_DESC_cc_byz_taxis_habit: "Rien n'a été annoncé. Les choses se font simplement comme le fisc les fait, par des gens qui ont cessé de demander qui est le fils de qui."
 STATIC_MODIFIER_NAME_cc_byz_dynatoi_ascendant: "La consolidation des magnats"
 STATIC_MODIFIER_DESC_cc_byz_dynatoi_ascendant: "Une concession structurelle a été faite, et ceux qui en ont profité organisent leurs affaires en partant du principe qu'elle ne sera pas reprise."
 STATIC_MODIFIER_NAME_cc_byz_dynatoi_creeping: "Le transfert discret"
 STATIC_MODIFIER_DESC_cc_byz_dynatoi_creeping: "Aucune concession n'a été faite et aucune loi n'a été modifiée. Terres, soldats et offices passent dans des mains privées à la vitesse de la vie ordinaire."
