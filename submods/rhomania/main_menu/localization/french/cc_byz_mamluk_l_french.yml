 # Situation
 cc_byz_mamluk_confrontation: "La confrontation levantine"
 cc_byz_mamluk_confrontation_desc: "L'Anatolie étant stabilisée, l'empire et le sultanat du Caire se font face à travers une frontière qu'aucun d'eux n'a choisie, sur des lieux saints que tous deux revendiquent, tandis que les républiques italiennes vendent et prêtent aux deux.\n\nCela peut être réglé par la négociation. Un condominium écrit sur les lieux saints constituerait une conclusion réelle, et plusieurs empereurs ont pensé que c'était la meilleure option possible. Cela peut également devenir la guerre de la Pentarchie, qui est l'autre type de conclusion."

 # Country modifiers
 STATIC_MODIFIER_NAME_cc_byz_pentarchy_restored: "La Pentarchie restaurée"
 STATIC_MODIFIER_DESC_cc_byz_pentarchy_restored: "Constantinople, Rome, Jérusalem, Antioche et Alexandrie. Les cinq anciens sièges répondent pour la première fois depuis le septième siècle à un seul empereur, et tout débat sur l'autorité dans le monde chrétien a désormais une adresse unique."

 # Opinion modifiers
 cc_byz_levant_accommodation: "Un arrangement au Levant"
 cc_byz_abandoned_the_east: "Sièges Orientaux abandonnés"

 # cc_byz_mamluk.1 - the holy places
 cc_byz_mamluk.1.title: "La garde des Lieux saints"
 cc_byz_mamluk.1.desc: "L'arrangement au Saint-Sépulcre est ancien, compliqué, et a fonctionné tant bien que mal pendant deux siècles.\n\nLe sultan détient la ville. Le clergé orthodoxe détient les clés de tout ce qui importe, sous réserve de taxes payées annuellement au Caire. Les pèlerins viennent, sont taxés et sont protégés, ce qui est un service que le sultan fournit avec compétence car les pèlerins sont rentables.\n\nCe qui a changé, c'est qu'il y a maintenant un empereur au nord qui ne lutte pas pour sa survie, et qui considère que ces droits lui reviennent par héritage plutôt que d'être concédés par le sultan. Le clergé de Jérusalem, qui doit y vivre, a demandé avec une certaine émotion qu'il examine la question attentivement."
 cc_byz_mamluk.1.desc_unionist: "L'arrangement au Saint-Sépulcre est ancien et compliqué, et il vient de le devenir encore plus.\n\nL'union a été signée, et les Latins l'ont interprétée comme réglant une question ouverte depuis les croisades : si les églises sont une seule église sous Rome, alors les revendications latines sur la garde à Jérusalem ne sont plus en concurrence avec celles de l'empereur, elles sont la même revendication, et les Franciscains ont commencé à agir selon cette interprétation sans attendre qu'on le leur demande.\n\nLe clergé orthodoxe de Jérusalem a écrit à Constantinople. Leur lettre est respectueuse et sa substance est que l'empereur a acquis dans cette affaire un partenaire qu'ils ne voulaient pas et ne peuvent écarter."
 cc_byz_mamluk.1.a: "Payer les taxes, comme tout empereur l'a fait depuis la conquête."
 cc_byz_mamluk.1.b: "La garde nous revient par héritage. Cessez les paiements."
 cc_byz_mamluk.1.c: "Négocier un arrangement permanent. Des taxes fixes, des droits fixes."

 # cc_byz_mamluk.2 - Cairo
 cc_byz_mamluk.2.title: "L'Empereur du Nord"
 cc_byz_mamluk.2.desc: "Les rapports de la frontière nord ont changé de nature. Pendant deux siècles, l'empire des Grecs a été une puissance épuisée avec laquelle on commerçait, qu'on raidissait occasionnellement, et à laquelle on ne pensait pas autrement.\n\nElle n'est plus épuisée. Elle a colonisé l'Anatolie, elle a une flotte, et elle a commencé à poser des questions sur Jérusalem sur un ton que le diwan trouve inhabituel. Les conseillers du sultan sont divisés entre ceux qui considèrent cela comme une opportunité commerciale et ceux qui y voient un problème de frontière, et les deux groupes ont des précédents pour les soutenir."
 cc_byz_mamluk.2.a: "Un problème de frontière. Renforcer le nord."
 cc_byz_mamluk.2.b: "Une opportunité commerciale. Discussions ouvertes."

 # cc_byz_mamluk.3 - spice and grain
 cc_byz_mamluk.3.title: "Épices, Grains et Républiques"
 cc_byz_mamluk.3.desc: "Le transit par la mer Rouge et les manufactures d'Alexandrie constituent le commerce le plus riche du monde, et ils passent par les mains du Caire pour atteindre les navires vénitiens et génois.\n\nLes républiques sont tout à fait sincères à ce sujet lorsqu'on les interroge. Elles commercent avec le Caire parce que le Caire possède les épices ; elles commerceraient volontiers avec Constantinople si celle-ci les possédait ; et en attendant, elles ne voient aucune contradiction à faire affaire avec une puissance avec laquelle l'empereur est en confrontation, car elles sont marchandes et qu'il n'est pas leur souverain.\n\nLes détroits, cependant, lui appartiennent."
 cc_byz_mamluk.3.desc_indebted: "Le transit par la mer Rouge passe par les mains du Caire pour atteindre les navires vénitiens et génois, et la position de l'empereur en la matière est compliquée par le fait que ces mêmes maisons détiennent une grande partie de ses titres de créance.\n\nElles ont elles-mêmes soulevé le sujet, ce qui est la manière courtoise de procéder. Leurs agents observent qu'une fermeture des détroits serait une affaire grave pour leurs activités à Alexandrie, que ces activités sont ce qui permet de rembourser les prêts, et qu'ils sont convaincus que ces considérations n'ont pas besoin d'être opposées.\n\nTout dans cette formulation est vrai. C'est aussi une description de qui est en position d'importuner qui."
 cc_byz_mamluk.3.a: "Laissez-les commercer. Les douanes ont plus de valeur que le principe."
 cc_byz_mamluk.3.b: "Fermez les détroits au commerce d'Alexandrie."
 cc_byz_mamluk.3.c: "Prendre une part. Devenir partie prenante du commerce."

 # cc_byz_mamluk.4 - the frontier
 cc_byz_mamluk.4.title: "La frontière"
 cc_byz_mamluk.4.desc: "La frontière entre l'empire et le sultanat n'est pas une ligne et n'a jamais été tracée comme telle.\n\nC'est une bande de pays de deux cents milles de profondeur, occupée par des Turkmènes et des Bédouins qui y font paître leurs troupeaux saisonnièrement, garnisonnée par des émirs qui dépendent du Caire dans une mesure qui varie selon la date de leur dernier paiement, et administrée par personne. Les raids sont constants, de faible intensité, et compris par tous les acteurs comme une forme de taxation plutôt que comme une guerre.\n\nDeux des émirs frontaliers ont pris contact avec Constantinople. Tous deux ont pris soin de se laisser l'option de le nier."
 cc_byz_mamluk.4.desc_war: "La frontière a cessé d'être une bande de pays pour devenir un front, et les hommes qui y vivent ont dû décider de choses qu'ils ont passé deux siècles à ne pas décider.\n\nLes Turkmènes ont déplacé leurs troupeaux vers le sud, loin des campagnes, ce qui a vidé cent milles de pâturages et supprimé la meilleure source de renseignement de l'empire sur ce qui arrive. Les émirs frontaliers qui négociaient discrètement avec Constantinople se sont tus ; un émir qui hésite en temps de paix est prudent, un émir qui hésite en temps de guerre est un traître, et ils savent sous quelle qualification ils seraient jugés.\n\nLes razzias ont cessé. Personne au commandement frontalier ne considère cela comme une bonne nouvelle."
 cc_byz_mamluk.4.a: "Acheter les émirs. Ils sont à vendre."
 cc_byz_mamluk.4.b: "Garnisonner les villes frontalières. Que les raids s'arrêtent aux murs."
 cc_byz_mamluk.4.c: "Laissez la frontière aux hommes qui y vivent."

 # cc_byz_mamluk.5 - Cairo's troubles
 cc_byz_mamluk.5.title: "Troubles au Caire"
 cc_byz_mamluk.5.desc: "Le sultan est mort et la succession est réglée à la manière dont les successions mameloukes sont réglées : par les émirs les plus anciens, par étapes, avec des troupes dans les rues.\n\nCe n'est ni une crise ni une surprise ; le sultanat a changé de mains de cette façon pendant deux siècles et l'État a survécu à chaque fois. Cela signifie cependant que pendant environ dix-huit mois, personne au Caire ne peut prendre de décision contraignante sur quoi que ce soit, les garnisons frontalières sont attirées vers le sud par des factions qui en ont besoin, et la frontière nord est aussi ouverte qu'elle puisse l'être.\n\nLes rapports sont parvenus à Constantinople trois semaines après les faits. Ils devraient atteindre Venise vers maintenant."
 cc_byz_mamluk.5.a: "Profitez de l'avantage pendant qu'ils se querellent."
 cc_byz_mamluk.5.b: "Subventionner la faction perdante. Maintenir la situation."
 cc_byz_mamluk.5.c: "Proposer des conditions. Il a besoin d'une frontière nord tranquille."

 # cc_byz_mamluk.10 - the eastern patriarchs
 cc_byz_mamluk.10.title: "Les patriarches d'Orient"
 cc_byz_mamluk.10.desc: "Les patriarches d'Antioche, de Jérusalem et d'Alexandrie sont orthodoxes, ils sont coreligionnaires de l'empereur, et ils sont les sujets du sultan. Ces trois faits sont permanents et le troisième est celui qui gouverne.\n\nIls ont fait appel à Constantinople, comme ils le font périodiquement, concernant des restrictions sur la construction, sur les processions et sur la nomination des évêques. L'appel est sincère et les griefs sont réels.\n\nIl est également vrai que chaque intervention impériale précédente en leur faveur a été suivie de représailles contre eux, et qu'ils le savent et ont tout de même fait appel, ce qui indique au palais à quel point la situation s'est dégradée."
 cc_byz_mamluk.10.desc_unionist: "Les patriarches d'Antioche, de Jérusalem et d'Alexandrie ont fait appel à Constantinople, et cette fois leur lettre consacre plus d'espace à l'union qu'au sultan.\n\nIls n'ont pas été consultés. Ils n'ont pas été représentés au concile. On les a informés, par un document arrivant d'une ville qu'aucun d'eux n'a visitée, qu'ils sont désormais en communion avec Rome, et leur propre clergé leur demande ce que cela signifie pour des sièges qui sont orthodoxes sous domination musulmane depuis huit cents ans et qui ont survécu en restant sans ambiguïté à ce sujet.\n\nLes griefs contre le sultan figurent également dans la lettre, plus bas."
 cc_byz_mamluk.10.a: "Protégez-les ouvertement."
 cc_byz_mamluk.10.b: "Laissez-les s'organiser eux-mêmes."
 cc_byz_mamluk.10.c: "Extraire des garanties écrites au lieu d'une protection."

 # cc_byz_mamluk.11 - escalation
 cc_byz_mamluk.11.title: "Règlement ou Guerre"
 cc_byz_mamluk.11.desc: "La confrontation a atteint le point où elle devient soit un arrangement, soit une guerre, et elle ne restera pas ainsi bien longtemps.\n\nL'argument en faveur d'un règlement est que l'empire a plus de frontières que d'armées, que Le Caire est un État compétent qui respecte les accords qu'il a signés, et qu'un condominium écrit sur les lieux saints donnerait à l'empereur, en pratique, la majeure partie de ce qu'une guerre lui donnerait en théorie.\n\nL'argument en faveur de la guerre est que les sièges de Jérusalem, d'Antioche et d'Alexandrie sont trois des cinq, qu'aucun empereur depuis Héraclius ne les a détenus, et que l'argument sur qui parle pour l'ensemble de l'Église ne peut être gagné sans eux."
 cc_byz_mamluk.11.desc_condominium: "La confrontation a atteint son point de décision, et les bases d'une réponse pacifique sont déjà posées.\n\nLes négociations sur les lieux saints ont progressé plus que quiconque ne l'aurait imaginé. Un projet existe. Il est détaillé, il a survécu à plusieurs cycles d'objections des deux côtés, et les fonctionnaires qui l'ont élaboré en sont discrètement fiers. Une fois signé, il réglerait la question de la garde par écrit pour la première fois depuis les croisades.\n\nL'alternative est également sur la table, car les sièges de Jérusalem, d'Antioche et d'Alexandrie représentent trois des cinq sièges, et un projet d'accord n'est pas la même chose qu'une pentarchie."
 cc_byz_mamluk.11.a: "Signer le condominium. C'est une meilleure paix qu'une guerre."
 cc_byz_mamluk.11.b: "Maintenir la pression. Ne s'engager à rien."
 cc_byz_mamluk.11.c: "La guerre de la Pentarchie. Trois sièges, et le litige est tranché."

 # cc_byz_mamluk.12 - the seats
 cc_byz_mamluk.12.title: "Les sièges anciens"
 cc_byz_mamluk.12.desc: "Un siège épiscopal sous domination musulmane depuis le septième siècle a été récupéré, et la cérémonie d'installation d'un patriarche a dû être reconstruite à partir des archives, car aucune personne vivante n'en avait vu.\n\nL'assemblée réunie pour l'occasion est la même assemblée qui était là l'année précédente, adorant dans le même bâtiment sous le même clergé. Rien n'a changé dans leur foi. Ce qui a changé, c'est l'autorité au-dessus de leurs têtes, et plusieurs d'entre eux ont observé en privé qu'ils avaient déjà vu des autorités changer auparavant."
 cc_byz_mamluk.12.a: "Que l'installation soit faite correctement."
 cc_byz_mamluk.12.b: "Il y a cinq sièges. Appuyez pour continuer."

 # cc_byz_mamluk.13 - the pentarchy
 cc_byz_mamluk.13.title: "La Pentarchie restaurée"
 cc_byz_mamluk.13.desc: "Constantinople, Rome, Jérusalem, Antioche et Alexandrie. Les cinq, détenus par un seul empereur, pour la première fois depuis avant les conquêtes arabes.\n\nLes cinq patriarcats étaient la structure par laquelle l'église indivise se gouvernait, et le débat sur l'héritage de cette autorité a duré huit siècles précisément parce que personne ne pouvait détenir les cinq et trancher la question. Cette objection ne s'applique plus.\n\nLa suite est désormais une affaire relevant de l'empereur. L'instrument existe."
 cc_byz_mamluk.13.a: "Le schisme peut maintenant être abordé selon nos termes."

 # cc_byz_mamluk.20 - endings
 cc_byz_mamluk.20.title: "Le Levant"
 cc_byz_mamluk.20.desc_pentarchy: "La confrontation est terminée et elle s'est conclue par le résultat maximal : les sièges orientaux sont récupérés, la pentarchie est complète, et un empereur à Constantinople détient chaque ancien patriarcat du monde chrétien.\n\nCela a coûté le prix habituel de telles choses. Les armées qui l'ont réalisé sont en Syrie et en Égypte et devront y rester. La frontière s'est déplacée vers le sud et s'est allongée. Le Caire, vaincu, reste Le Caire, et redeviendra un problème d'ici une génération.\n\nMais l'argument qui courait depuis le septième siècle est tranché, et il l'est en faveur de Constantinople, et cela survivra à chacune de ces difficultés."
 cc_byz_mamluk.20.desc_condominium: "La confrontation est terminée et elle s'est conclue par un document plutôt que par une bataille.\n\nLe condominium sur les lieux saints est précis, mutuellement irritant, et a été respecté par les deux parties. Le clergé orthodoxe détient les droits que l'accord lui accorde, les taxes sont fixées et payées, et les pèlerins bénéficient d'une protection que les deux puissances garantissent et qu'aucune ne peut retirer unilatéralement.\n\nCe n'est pas un triomphe et personne dans la capitale n'a prétendu le contraire. C'est la première frontière orientale stabilisée que l'empire ait connue en quatre cents ans, et les empereurs qui suivront s'apercevront que cela a bien plus de valeur qu'une campagne."
 cc_byz_mamluk.20.desc_defeat: "La confrontation est terminée et Le Caire l'a emporté.\n\nLes taxes au Saint-Sépulcre ont augmenté, le clergé orthodoxe y détient ses droits à des conditions moins favorables qu'avant que l'empereur ne s'y intéresse, et les patriarches orientaux ont conclu leurs propres arrangements avec le sultanat, au motif raisonnable que Constantinople ne pouvait pas les protéger et que Le Caire est l'endroit où ils vivent.\n\nL'empire a insisté mais n'a pas pu concrétiser, ce qui est la manière spécifique de sortir d'une confrontation dans une situation pire que si elle n'avait jamais commencé. Tous les intervenants le comprennent, y compris les patriarches."
 cc_byz_mamluk.20.desc_stalemate: "La confrontation n'a pas tant pris fin qu'elle a cessé d'être d'actualité.\n\nRien n'a été réglé. Les taxes sont toujours payées, la garde est toujours contestée selon les mêmes termes, la frontière est toujours une bande de pays plutôt qu'une ligne, et la correspondance entre les deux chancelleries est revenue aux affaires routinières des pèlerins et du grain. Les deux puissances ont trouvé d'autres frontières plus urgentes.\n\nLes questions restent ouvertes. Elles le sont depuis le septième siècle et il n'y a aucune raison particulière de s'attendre à ce que cette génération ait été celle qui les aurait closes."
 cc_byz_mamluk.20.a: "Qu'il en soit ainsi."
