l_french:
 # The Greek Fire chain, fired by the cc_byz_task_greek_fire mission task.
 #
 # The historical position, which the text holds to: the composition was a state secret
 # restricted to the Kallinikos family and the imperial arsenal, it was already unreliable by
 # the twelfth century, and it was lost through ordinary bureaucratic attrition rather than any
 # catastrophe. Nobody burned the recipe. It simply stopped being written down by people who
 # knew what they were writing.

 cc_byz_fire.1.title: "Le feu liquide"
 cc_byz_fire.1.desc: "Les livres cérémoniels le décrivent. Les chroniques le décrivent. Anna Comnène décrit les têtes de bêtes en bronze sur les proues et le feu qui s'en échappait, et elle écrivait cela il y a deux cents ans à propos d'une arme que la flotte de son père portait encore.\n\nPersonne à l'arsenal ne sait le fabriquer.\n\nLe secret était détenu par une seule famille et par les ateliers impériaux, et il n'a jamais été consigné en un seul endroit, volontairement. Ce qui subsiste est dispersé : une note sur les quantités ici, une remarque sur les pompes là, l'inventaire d'un monastère qui liste un ingrédient que plus personne ne reconnaît. Le Droungarios pense qu'il pourrait être réassemblé. Il n'en est pas certain, et il n'est pas du genre à parler à la légère."
 cc_byz_fire.1.desc_lettered: "Les livres cérémoniels le décrivent, les chroniques le décrivent, et pour une fois, il y a dans cette ville des hommes capables de tous les lire.\n\nLe secret était détenu par une seule famille et par les ateliers impériaux, et il n'a jamais été consigné volontairement dans un document unique. Ce qui subsiste est dispersé à travers quatre siècles de notes, d'inventaires et de remarques marginales. Le rassembler n'est pas une question de découverte mais d'érudition, seule ressource dont la capitale n'a jamais manqué.\n\nLe Droungarios a apporté les volumes pertinents. Ils sont très nombreux."
 cc_byz_fire.1.desc_already: "L'arsenal le possède déjà.\n\nLes siphons sont coulés, les équipages connaissent la procédure, et la composition figure dans le registre de l'atelier sous un nom qui ne signifie rien pour quiconque ne l'a pas vue. Ce qui manque à la flotte, c'est l'argent pour en construire suffisamment, et c'est un problème que le trésor peut résoudre."
 cc_byz_fire.1.a_already: "Alors financez l'arsenal correctement."
 cc_byz_fire.1.a: "Charger les savants de s'en occuper."
 cc_byz_fire.1.b: "Envoyer aux monastères."
 cc_byz_fire.1.c: "Il y a un homme dans le camp de prisonniers qui fabriquait des siphons."
 cc_byz_fire.1.d: "L'empire a réussi à s'en passer pendant quatre cents ans."

 cc_byz_fire.2.title: "Les essais de siphons"
 cc_byz_fire.2.desc: "Ils possèdent quelque chose. Que ce soit la bonne chose est une autre question, et pour le découvrir, il faut une barge, un tronçon de la Corne d'Or bien éloigné de tout objet de valeur, et un équipage à qui l'on a indiqué le salaire avant de lui indiquer le travail.\n\nLes trois premiers essais produisent énormément de fumée. Le quatrième produit la chose elle-même, s'accrochant à l'eau et brûlant dessus, et l'équipage de la barge devient très silencieux.\n\nLe Droungarios veut qu'un second arsenal soit construit avant d'aller plus loin. Il souligne, avec raison, que la dernière fois qu'un empereur a fait des économies sur la flotte, l'empire a passé les cinquante années suivantes à louer des navires génois."
 cc_byz_fire.2.desc_archive: "Les moines n'étaient pas ravis qu'on les sollicite, et encore moins ravis d'avoir raison. Le passage pertinent se trouvait dans un inventaire du XIIe siècle des réserves navales à Abydos, copié par quelqu'un qui ne comprenait manifestement pas ce qu'il copiait et qui l'avait donc transcrit exactement.\n\nLes trois premiers essais produisent énormément de fumée. Le quatrième produit la chose elle-même, s'accrochant à l'eau et brûlant dessus, et l'équipage de la barge devient très silencieux.\n\nLe Droungarios veut qu'un second arsenal soit construit avant d'aller plus loin."
 cc_byz_fire.2.desc_captive: "L'ingénieur parle. Il parle beaucoup, en fait, et plus qu'on ne lui a demandé, ce qui est là la difficulté : un homme qui vend un secret a établi sa profession.\n\nLes trois premiers essais produisent énormément de fumée. Le quatrième produit la chose elle-même, s'accrochant à l'eau et brûlant dessus, et l'équipage de la barge devient très silencieux.\n\nLe Droungarios veut qu'un second arsenal soit construit avant d'aller plus loin, et il veut que l'ingénieur soit logé quelque part derrière un mur."
 cc_byz_fire.2.a: "Un seul arsenal suffira."
 cc_byz_fire.2.b: "Construire le second, et placer une garde sur les deux."

 cc_byz_fire.3.title: "Le feu rétabli"
 cc_byz_fire.3.desc: "La composition est consignée. Pas en un seul endroit : en trois, conservés séparément, par des hommes qui ignorent leurs noms respectifs, ce qui correspond approximativement à l'organisation que l'empire avait auparavant et qui est bien mieux documentée.\n\nLes siphons sont coulés en bronze à l'arsenal. Les équipages s'entraînent tout l'hiver, mal au début puis moins mal, et au printemps, des galères se trouvent dans la Corne avec sur leurs proues les têtes de bêtes décrites par Anna Comnène.\n\nC'est une arme et c'est aussi un argument. La flotte qui la portait était la flotte qui a brisé deux sièges arabes de cette ville, et quiconque en Méditerranée a lu une chronique le sait."
 cc_byz_fire.3.desc_leaked: "La composition est consignée, en trois exemplaires, conservés séparément, par des hommes qui ignorent leurs noms respectifs.\n\nElle l'est également, rapporte le Droungarios sans croiser le regard de l'empereur, à Gênes. Ou Venise. Possiblement les deux. Quelque chose est parti avec les charpentiers de marine ou les registres ou un clerc à qui l'on devait de l'argent, et il est désormais inutile de chercher lequel.\n\nLes siphons sont néanmoins coulés, et les équipages s'entraînent tout l'hiver, et au printemps, des galères se trouvent dans la Corne avec des têtes de bêtes sur leurs proues. L'empire a retrouvé son feu. Il est simplement qu'il n'est plus le seul à le posséder, ce qui est une arme différente de celle que possédait Constantin IV, et chose qu'il convient de garder à l'esprit avant de s'y fier."
 cc_byz_fire.3.a: "Fondre les siphons."

 cc_byz_fire_unlocked_tt: "Débloque les galères au feu grégeois et l'infanterie au feu grégeois"

 # ---- The generic-action twin ----
 # Mission packs default to OFF, so this is how most players reach the chain.
 cc_byz_recover_greek_fire: "Retrouver le feu liquide"
 cc_byz_recover_greek_fire_desc: "Charger l'arsenal et les savants de réassembler la composition. Elle n'a jamais été écrite en un seul endroit, c'est pourquoi elle a été perdue et pourquoi elle peut être retrouvée."
