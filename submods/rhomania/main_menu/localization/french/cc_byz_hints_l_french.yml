l_french:
 # Hint entries for the submod's two situations.
 #
 # Both keys are required per hint tag: <tag> is the title shown in the hints list, and
 # <tag>_hint_text is the body.
 #
 # TITLES ARE WRITTEN OUT RATHER THAN RESOLVED THROUGH GetSituationByKey, which is what vanilla
 # does here (hints_l_english.yml:652). Two reasons to depart from it. CWTools reports the
 # command as undefined, and while that is probably just an incomplete schema, the submod has
 # already been bitten once by assuming a vanilla precedent guarantees a token resolves from our
 # call site: religion_percentage_in_country_greater_or_equal is a real vanilla key whose
 # TARGET_RELIGION token does not populate when called our way, and it errored in game while
 # looking correct. A situation title is two words and never changes. Not worth the class of
 # risk to save typing them.

 hint_cc_byz_the_west: "L'Occident"
 hint_cc_byz_the_west_hint_text: "Les préfectures sont des provinces gouvernées avec leurs propres gouverneurs, et le problème de l'empereur est que ces deux faits sont vrais à la fois.\n\nDeux mesures permettent de suivre cela, et elles sont indépendantes plutôt qu'opposées. #T L'emprise impériale#! représente la mesure dans laquelle l'empire détient réellement le terrain. #T L'autonomie occidentale#! représente la mesure dans laquelle l'Occident préférerait être libéré. Les deux peuvent être élevées ensemble, et c'est de cette combinaison que naît l'insurrection.\n\nC'est au consistoire que la décision est prise. L'empereur vote trois voix en tant qu'Auguste, un exarque senior vote deux voix, chaque autre exarque vote une voix. Une préfecture et il ne peut pas perdre. Quatre, et il est surclassé par le corps qu'il a lui-même construit.\n\nLa situation se résout dans tous les cas avant l'Âge des Révolutions, d'une manière ou d'une autre."

 hint_cc_byz_mamluk_confrontation: "La confrontation levantine"
 hint_cc_byz_mamluk_confrontation_hint_text: "L'empire et le Sultanat du Caire se font face pour des lieux saints que tous deux revendiquent, tandis que les républiques italiennes vendent aux deux et prêtent aux deux.\n\n#T Cela peut être réglé sans guerre.#! Un condominium écrit sur les lieux saints est une conclusion réelle, et cela exige que l'empire n'ait pas passé les décennies intermédiaires à presser la frontière. La pression levantine est le chiffre qui décide quelles routes restent ouvertes.\n\nL'autre voie est la Guerre de la Pentarchie, pour Jérusalem, Antioche et Alexandrie. Ces trois-là, avec Constantinople et Rome, forment les cinq patriarcats, et détenir les cinq est ce qu'exige la réparation du schisme."
