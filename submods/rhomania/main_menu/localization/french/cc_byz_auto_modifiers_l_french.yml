l_french:
 # Auto-modifier labels.
 #
 # EVERY auto_modifier needs an AUTO_MODIFIER_NAME_<key> or it shows as a missing key in the
 # societal values breakdown. AUTO_MODIFIER_DESC_<key> is optional: vanilla ships 165 NAME
 # keys and only 16 DESC, so a name alone is the normal case and is what these use.
 #
 # CONVENTION. The name reads as the CONDITION, not as a title, because these appear in a list
 # explaining why a value is drifting. Compare vanilla's byz entries, e.g.
 # AUTO_MODIFIER_NAME_byz_capital_constantinople: "[capital|e] is [ShowLocationName('constantinople')]".
 # Each line below states the trigger it is attached to, so the player can read the list and
 # know what to change.
 #
 # Deliberately plain text rather than concept markup. These strings get machine-translated,
 # and an invented [scope.Function] token is the failure mode that errors in game, so the
 # tokens are omitted rather than guessed at.

 # Toward Dynatoi: the provincial powerful
 AUTO_MODIFIER_NAME_cc_byz_pronoia_grants: "Octrois de Pronoia en vigueur"
 AUTO_MODIFIER_NAME_cc_byz_weak_crown: "Puissance du domaine royal inférieure à 35 %"
 AUTO_MODIFIER_NAME_cc_byz_ascendant_nobles: "Nobles puissants et satisfaits"

 # Toward Taxis: the imperial bureaus
 AUTO_MODIFIER_NAME_cc_byz_staffed_bureaus: "Bureaux dotés de personnel et de fonds"
 AUTO_MODIFIER_NAME_cc_byz_strong_crown: "Puissance du domaine royal égale ou supérieure à 50 %"
 AUTO_MODIFIER_NAME_cc_byz_literate_administration: "Taux d'alphabétisation moyen supérieur à 20 %"

 # The Rhomanismos advance line. Each of these carries the conditional bulk of an advance
 # whose permanent core sits on the advance itself, so the label names the advance and the
 # requirement that keeps it live.
 AUTO_MODIFIER_NAME_cc_byz_taxis_of_offices_active: "Taxis des Bureaux, du côté des Rhomaios"
 AUTO_MODIFIER_NAME_cc_byz_oikonomia_active: "Oikonomia impériale, du côté des Rhomaios"
 AUTO_MODIFIER_NAME_cc_byz_tagmata_restored_active: "Les Tagmata restaurés, du côté des Rhomaios"
 AUTO_MODIFIER_NAME_cc_byz_palaiologan_revival_active: "La Renaissance paléologue, du côté des Rhomaios"
 AUTO_MODIFIER_NAME_cc_byz_basilika_active: "Les Basilika, du côté des Rhomaios"
 AUTO_MODIFIER_NAME_cc_byz_annona_active: "L'Annona, du côté des Rhomaios"
 AUTO_MODIFIER_NAME_cc_byz_ecumenical_office_active: "Le Bureau œcuménique, du côté des Rhomaios"
 AUTO_MODIFIER_NAME_cc_byz_dromos_active: "Le Dromos, du côté des Rhomaios"
 AUTO_MODIFIER_NAME_cc_byz_thematic_administration_active: "Administration thématique, du côté des Rhomaios"
 AUTO_MODIFIER_NAME_cc_byz_autokrator_active: "Autokrator, du côté des Rhomaios"
 AUTO_MODIFIER_NAME_cc_byz_great_church_active: "La Grande Église, du côté des Rhomaios"

 # These two additionally require the capital to still be Constantinople, which is the whole
 # trade the Renovatio track asks the player to make, so the label says so.
 AUTO_MODIFIER_NAME_cc_byz_renovatio_imperii_active: "Renovatio Imperii, du côté des Rhomaios, capitale à Constantinople"
 AUTO_MODIFIER_NAME_cc_byz_exarchal_chancery_active: "La Chancellerie exarchale, du côté des Rhomaios, capitale à Constantinople"
 AUTO_MODIFIER_NAME_cc_byz_taxis_offices: "Bureaux du fisc pourvus en personnel et financés"
 AUTO_MODIFIER_NAME_cc_byz_dynatoi_offices: "Bureaux des magnats pourvus en personnel et financés"
 AUTO_MODIFIER_NAME_cc_byz_starved_offices: "Bureaux financés à moins de la moitié"
 AUTO_MODIFIER_NAME_cc_byz_west_autonomous: "Autonomie occidentale égale ou supérieure à 50"
 AUTO_MODIFIER_NAME_cc_byz_west_latin_drift: "Autonomie occidentale égale ou supérieure à 50"
 AUTO_MODIFIER_NAME_cc_byz_west_gripped: "Emprise impériale sur l'ouest égale ou supérieure à 60"
 AUTO_MODIFIER_NAME_cc_byz_west_greek_hold: "Emprise impériale sur l'ouest égale ou supérieure à 60"
 AUTO_MODIFIER_NAME_cc_byz_west_law_rite_local: "Les préfectures s'en tiennent au rite local"
 AUTO_MODIFIER_NAME_cc_byz_west_law_rite_latin: "Les préfectures célèbrent le rite latin"
 AUTO_MODIFIER_NAME_cc_byz_west_law_command_exarchal: "Le commandement de l'ouest confié aux exarques"
 AUTO_MODIFIER_NAME_cc_byz_west_law_hereditary: "Les préfectures se transmettent par héritage"
 AUTO_MODIFIER_NAME_cc_byz_west_law_fisc_remitted: "Revenus occidentaux intégralement reversés à la capitale"
