l_french:
 # The West: the situation, the Praetorian Prefectures, the consistory and its four laws.
 #
 # The four prefectures are named for late-Roman administrative units rather than for
 # exarchates. Only Ravenna and Carthage were ever exarchates; Spania was governed by a
 # magister militum and Gaul was never recovered at all. The PREFECTURES of Italy, Africa and
 # Gaul, and the Spanish diocese under Gaul, are real, which is what an eastern emperor
 # restoring the west would claim to be restoring.

 # ---- The situation ----
 cc_byz_the_west: "L'Occident"
 cc_byz_the_west_desc: "Quatre provinces récupérées, et la question persistante de leur nature. Une préfecture gouvernée depuis Constantinople ne peut se défendre ; celle qui peut se défendre n'a pas besoin de Constantinople."
 cc_byz_the_west_map_tt: "Partie des préfectures occidentales"

 # ---- The organisation ----
 cc_byz_prefectures: "Les préfectures praetoriennes d'Occident"
 cc_byz_prefectures_desc: "L'organe administratif de l'occident reconquis, et son consistoire. L'empereur préside ; chaque préfet siège. Que l'organe délibère ou reçoive simplement des instructions est une question d'arithmétique, et l'arithmétique change à chaque province reconquise."

 # ---- Voting statuses ----
 # The whole design in three numbers: 3 votes, 2 votes, 1 vote.
 cc_byz_augustus: "Auguste"
 cc_byz_augustus_desc: "L'empereur. Trois voix au consistoire, ce qui suffit contre un préfet, suffit exactement contre deux, et ne suffit pas contre trois."
 cc_byz_senior_exarch: "Exarque senior"
 cc_byz_senior_exarch_desc: "Premier parmi les préfets, et le seul que l'empereur choisit. Deux voix."
 cc_byz_exarch_seat: "Exarque"
 cc_byz_exarch_seat_desc: "Un siège au consistoire. Une voix, et il n'y a pas de limite supérieure au nombre de voix que la reconquête de l'empereur lui-même crée."

 # ---- The consistory ----
 cc_byz_consistorium_dormant: "Consistoire non réuni"
 cc_byz_consistorium_dormant_desc: "Les préfectures existent et sont gouvernées. Elles ne se réunissent pas. Un empereur qui ne les convoque jamais en session ne perd jamais de vote, et n'apprend jamais ce qu'elles auraient dit."
 cc_byz_consistorium_assembly: "Le Consistoire Sacré"
 cc_byz_consistorium_assembly_desc: "Le conseil de l'occident en session. L'empereur parle avec trois voix, le préfet senior avec deux, chaque autre préfet avec une seule. Une égalité rejette la motion."

 # ---- The four countries ----
 cc_byz_exarchate_ravenna_name: "Exarchat de Ravenne"
 cc_byz_exarchate_ravenna_adj: "Ravennate"
 cc_byz_exarchate_carthage_name: "Exarchat de Carthage"
 cc_byz_exarchate_carthage_adj: "Carthaginois"
 cc_byz_exarchate_spania_name: "Province d'Hispania"
 cc_byz_exarchate_spania_adj: "Spanian"
 cc_byz_exarchate_gaul_name: "Préfecture des Gaules"
 cc_byz_exarchate_gaul_adj: "Gallique"

 # ---- Law: command ----
 cc_byz_west_command_law: "Commandement des armées de l'ouest"
 cc_byz_west_command_law_desc: "À qui obéissent les soldats de l'ouest. La plus ancienne des quatre questions, et celle qui a été tranchée au VIe siècle."
 cc_byz_command_imperial: "Officiers impériaux"
 cc_byz_command_imperial_desc: "Des commandants nommés depuis la capitale et permutés avant qu'ils ne s'enracinent. Les armées appartiennent à l'empereur et en sont d'autant moins efficaces."
 cc_byz_command_exarchal: "L'exarque commande"
 cc_byz_command_exarchal_desc: "Le préfet commande ses propres troupes. Les exarques de Ravenne étaient des généraux parce que l'Italie ne pouvait être défendue par un comité sur un autre continent, et c'est ce qui les rendait dangereux."
 cc_byz_command_joint: "Commandement conjoint"
 cc_byz_command_joint_desc: "Ordres contresignés en deux exemplaires. Cela fonctionne, lentement, et personne n'en est satisfait."

 # ---- Law: the fisc ----
 cc_byz_west_fisc_law: "Les Revenus occidentaux"
 cc_byz_west_fisc_law_desc: "Où va l'argent collecté à l'ouest. Une préfecture qui reverse tout ne peut pas payer ses propres garnisons ; celle qui conserve tout est un État."
 cc_byz_fisc_remitted: "Remis intégralement"
 cc_byz_fisc_remitted_desc: "Tout vers Constantinople, et l'ouest demande à le récupérer. La capitale décide de la valeur de la frontière."
 cc_byz_fisc_split: "Divisés au niveau de la préfecture"
 cc_byz_fisc_split_desc: "La province garde ce dont elle a besoin et envoie le reste. L'arrangement historique, et le seul viable."
 cc_byz_fisc_retained: "Maintenu à l'Ouest"
 cc_byz_fisc_retained_desc: "L'ouest s'autofinance et doit une courtoisie à la capitale. Prospère, bien garnisonné, et ne demandant plus rien."

 # ---- Law: the rite ----
 cc_byz_west_rite_law: "Le Rite dans les Églises occidentales"
 cc_byz_west_rite_law_desc: "Ce qui est célébré dans les provinces recouvrées. La question fondamentale : un ouest qui s'octroie des usages locaux est un ouest qui dérive vers le latin, et c'est la reconquête même de l'empereur qui lui a donné les voix pour le faire."
 cc_byz_rite_greek: "Le rite grec"
 cc_byz_rite_greek_desc: "Célébré dans la capitale, dans la chapelle propre de l'exarque, et presque nulle part ailleurs à l'ouest où quelqu'un s'y rende réellement."
 cc_byz_rite_local: "Usage local toléré"
 cc_byz_rite_local_desc: "Les églises conservent les formes qu'elles ont gardées pendant des siècles. Pragmatique, populaire, et la première étape d'une pente que le palais peut parfaitement percevoir."
 cc_byz_rite_latin: "Le rite latin"
 cc_byz_rite_latin_desc: "Ouvertement, et par vote du propre conseil de l'empereur. L'Occident a décidé à quelle église il appartient, et ce n'est pas celle dont l'empereur le gouverne."

 # ---- Law: succession ----
 cc_byz_west_succession_law: "Succession dans les préfectures"
 cc_byz_west_succession_law_desc: "La manière dont un préfet décédé est remplacé. La question qui transforme une fonction en une affaire de famille."
 cc_byz_succession_appointed: "Nommé depuis la capitale"
 cc_byz_succession_appointed_desc: "Un exarque décédé est remplacé par qui bon semble être envoyé par le palais. C'est ce qui fait de ce poste une fonction administrative."
 cc_byz_succession_acclaimed: "Acclamé localement"
 cc_byz_succession_acclaimed_desc: "L'armée et les notables de la province choisissent, et l'empereur confirme ce qui s'est déjà produit."
 cc_byz_succession_hereditary: "Héréditaire"
 cc_byz_succession_hereditary_desc: "La charge passe au fils. L'empire a désormais une dynastie à l'ouest qui ne vient pas du palais et n'en a pas besoin."

 # ---- The seven governing actions ----
 cc_byz_west_order_census: "Ordonner un recensement de l'Occident"
 cc_byz_west_order_census_desc: "Recenser la terre, le peuple et ce qu'ils doivent. La chose qu'une administration romaine faisait et qu'aucune autre en Europe ne pouvait faire, et la chose que tous ceux qui étaient recensés auraient préféré qu'elle ne fasse pas."
 cc_byz_west_donative: "Payer le donatif occidental"
 cc_byz_west_donative_desc: "Les garnisons reçoivent leurs arriérés et la solde de cette année ensemble. La seule chose qui a le plus fidèlement maintenu la loyauté d'une frontière romaine, et la seule chose que les empereurs ont cessé de faire le plus systématiquement quand l'argent manquait."
 cc_byz_west_demand_tribute: "Exiger le tribut préfectoral"
 cc_byz_west_demand_tribute_desc: "Une levée au-delà de ce que l'arrangement produit déjà. L'argent arrive. Tout comme le souvenir d'avoir été sollicité."
 cc_byz_west_send_strategos: "Envoyer le Stratège à l'Ouest"
 cc_byz_west_send_strategos_desc: "Des renforts, et un général pour les commander. L'ouest devient défendable, et il y a désormais là-bas une armée qui sait quel nom figure sur sa solde."
 cc_byz_west_confirm_son: "Confirmer le fils de l'exarque"
 cc_byz_west_confirm_son_desc: "Reconnaître la succession à l'avance. Cela achète une loyauté qu'aucun autre moyen ne peut offrir et concède, définitivement, que la charge appartient à une famille."
 cc_byz_west_recall_exarch: "Convoquer l'exarque à la capitale"
 cc_byz_west_recall_exarch_desc: "Le rappeler pour qu'il s'explique. Qu'il vienne ou non n'est pas une décision de l'empereur, et dépend entièrement de la manière dont il a été traité."
 cc_byz_west_grant_charter: "Accorder une charte à une commune"
 cc_byz_west_grant_charter_desc: "Droits et autonomie par écrit, en échange de revenus et de calme. La première charte est le précédent que toutes les autres communes citeront."

 # ---- The three consistory actions ----
 cc_byz_io_convene_consistory: "Réunir le Consistoire"
 cc_byz_io_convene_consistory_desc: "Convoquez les préfets en session. Tant que cela n'est pas fait, il n'y a pas de votes à perdre, et après cela, si."
 cc_byz_io_elevate_senior_exarch: "Élever un exarque senior"
 cc_byz_io_elevate_senior_exarch_desc: "Nommez un préfet comme premier parmi les autres. Il parle avec deux voix au consistoire, c'est donc une décision sur l'identité de celui à qui l'on remet la seconde."
 cc_byz_io_dissolve_prefecture: "Dissoudre une préfecture"
 cc_byz_io_dissolve_prefecture_desc: "Reprendre la province sous administration directe. C'est le seul moyen de réduire l'opposition du consistoire, et tous les autres préfets seront témoins de cet acte."

 # ---- Modifier types ----
 MODIFIER_TYPE_NAME_cc_byz_augustus_can_participate_in_parliament: "Auguste peut siéger au consistoire"
 MODIFIER_TYPE_NAME_cc_byz_senior_exarch_can_participate_in_parliament: "L'exarque senior peut siéger au consistoire"
 MODIFIER_TYPE_NAME_cc_byz_exarch_seat_can_participate_in_parliament: "L'exarque peut siéger au Consistoire"
 MODIFIER_TYPE_NAME_cc_byz_augustus_agenda_impact: "Impact de l'agenda d'Auguste"
 MODIFIER_TYPE_NAME_cc_byz_senior_exarch_agenda_impact: "Impact de l'agenda de l'exarque senior"
 MODIFIER_TYPE_NAME_cc_byz_exarch_seat_agenda_impact: "Impact de l'agenda de l'exarque"

 # ---- Action outcomes ----
 STATIC_MODIFIER_NAME_cc_byz_west_census_taken: "Le Registre occidental"
 STATIC_MODIFIER_DESC_cc_byz_west_census_taken: "Les terres sont recensées et les chiffres sont à jour. Ils ne le resteront pas."
 STATIC_MODIFIER_NAME_cc_byz_west_donative_paid: "Le donatif versé"
 STATIC_MODIFIER_DESC_cc_byz_west_donative_paid: "Les garnisons de l'ouest ont été payées à temps, ce dont elles se souviendront environ aussi longtemps que cela durera."
 STATIC_MODIFIER_NAME_cc_byz_west_tribute_taken: "Le Tribut perçu"
 STATIC_MODIFIER_DESC_cc_byz_west_tribute_taken: "La levée a été effectuée. Le ressentiment est consigné ailleurs."
 STATIC_MODIFIER_NAME_cc_byz_west_strategos_sent: "Un stratège à l'ouest"
 STATIC_MODIFIER_DESC_cc_byz_west_strategos_sent: "Il y a là-bas un général avec des troupes qui le connaissent, ce dont l'ouest avait besoin et ce que la capitale finira par regretter."
 STATIC_MODIFIER_NAME_cc_byz_west_recall_issued: "La Convocation émise"
 STATIC_MODIFIER_DESC_cc_byz_west_recall_issued: "L'ordre est parti vers l'ouest. Ce qui revient est une autre affaire."
 STATIC_MODIFIER_NAME_cc_byz_west_charter_granted: "Une commune chartée"
 STATIC_MODIFIER_DESC_cc_byz_west_charter_granted: "Droits par écrit, revenus en retour, et un précédent que toutes les autres communes de l'ouest citent désormais."
 STATIC_MODIFIER_NAME_cc_byz_west_recall_obeyed: "La Convocation acceptée"
 STATIC_MODIFIER_DESC_cc_byz_west_recall_obeyed: "Il est venu quand on l'a appelé. Chaque gouverneur de l'empire l'a remarqué."
 STATIC_MODIFIER_NAME_cc_byz_west_recall_refused: "La Convocation refusée"
 STATIC_MODIFIER_DESC_cc_byz_west_recall_refused: "Il n'est pas venu, et rien ne lui est arrivé. Chaque gouverneur de l'empire l'a également remarqué."
 STATIC_MODIFIER_NAME_cc_byz_west_prefecture_dissolved: "Une préfecture dissoute"
 STATIC_MODIFIER_DESC_cc_byz_west_prefecture_dissolved: "La province est à nouveau gouvernée directement depuis la capitale, au prix de la gouverner directement depuis la capitale."

 # ---- The four endings ----
 STATIC_MODIFIER_NAME_cc_byz_west_end_reabsorbed: "L'Occident réabsorbé"
 STATIC_MODIFIER_DESC_cc_byz_west_end_reabsorbed: "Les préfectures sont dissoutes dans l'empire et administrées depuis Constantinople. Il a fallu les maintenir faibles, c'est pourquoi cela a fonctionné."
 STATIC_MODIFIER_NAME_cc_byz_west_end_diarchy: "La diarchie"
 STATIC_MODIFIER_DESC_cc_byz_west_end_diarchy: "Un collègue à l'ouest, formellement investi, gouvernant des provinces assez fortes pour compter. Deux empereurs, un seul empire, et cette fois, cela a été organisé plutôt que subi."
 STATIC_MODIFIER_NAME_cc_byz_west_end_acclamation: "L'Acclamation occidentale"
 STATIC_MODIFIER_DESC_cc_byz_west_end_acclamation: "Les armées de l'occident ont proclamé leur propre empereur. C'est ainsi que l'empire avait acquis une moitié occidentale la première fois."
 STATIC_MODIFIER_NAME_cc_byz_west_end_neglect: "L'Occident négligé"
 STATIC_MODIFIER_DESC_cc_byz_west_end_neglect: "Personne ne gouverne les provinces recouvrées, y compris les hommes nommés pour le faire."

 # ---- Situation events ----
 cc_byz_west.1.title: "Les préfectures d'Occident"
 cc_byz_west.1.desc: "Le document est court, car il existe un formulaire pour cela et ce formulaire a neuf cents ans.\n\nUne préfecture praetorienne est constituée. Son préfet détient la province, commande les troupes qui s'y trouvent, entend les appels de ses tribunaux et reverse ses revenus, et il fait tout cela au nom de l'empereur à plusieurs semaines de navigation.\n\nLa chancellerie a rédigé la nomination trois fois. Chaque projet a été plus court que le précédent, car plus il est long, plus il ressemble à une liste des choses que l'homme pourra désormais faire sans demander."
 cc_byz_west.1.desc_several: "Ils sont désormais plusieurs, ce qui est une disposition différente du fait d'en avoir un seul.\n\nUn préfet est un gouverneur. Deux constituent un précédent. Ce que représentent trois ou quatre personnes est une question que la chancellerie a pris soin de ne pas mettre par écrit, et les plus anciens clercs ont commencé à utiliser l'expression « l'ouest » comme s'il s'agissait d'un lieu ayant des opinions plutôt que d'une direction."
 cc_byz_west.1.a: "C'est ainsi que l'empire a toujours été gouverné."

 cc_byz_west.10.title: "Le consistoire réuni"
 cc_byz_west.10.desc: "Ils sont convoqués, et ils viennent.\n\nLe consistoire sacré n'est pas nouveau. Les empereurs ont pris conseil sous cette forme depuis Dioclétien, et le protocole est exact : qui se tient debout, qui s'assoit, qui parle dans quel ordre, et comment une décision est enregistrée comme étant celle de l'empereur, quelle que soit la manière dont elle a été prise.\n\nCe qui est nouveau, c'est qui s'y tient debout. Les préfets de l'ouest ont voyagé longtemps pour être ici, et les hommes qui ont voyagé longtemps pour être consultés ont tendance à s'attendre à l'être réellement."
 cc_byz_west.10.desc_outnumbered: "Ils sont convoqués, et ils viennent, et ils sont plus nombreux que nous.\n\nLe protocole est exact et l'arithmétique l'est tout autant. L'empereur parle avec trois voix, comme il l'a toujours fait. Les préfets de l'ouest, ensemble, parlent désormais avec davantage de voix, et chacune de ces voix existe parce que l'empire a réussi à l'ouest.\n\nPersonne ne dit cela. Le Maître des Offices a organisé les places avec un soin extrême."
 cc_byz_west.10.a: "Qu'ils soient entendus."

 cc_byz_west.20.title: "La Convocation"
 cc_byz_west.20.desc: "L'ordre est sans ambiguïté et formulé avec courtoisie. Il doit se présenter à la capitale et rendre compte de son administration.\n\nCe qui arrive ensuite n'est pas entre les mains de l'empereur. Ce n'est plus entre les mains de l'empereur depuis quelques années, et cela a été décidé par chaque donatif payé ou retenu, chaque levée exigée, et par le fait que quelqu'un lui ait dit que son fils serait confirmé."
 cc_byz_west.20.desc_again: "L'ordre est sans ambiguïté, formulé avec courtoisie, et c'est le second.\n\nLa dernière fois, il a été ignoré et rien n'a suivi. Tout le monde à l'ouest de l'Adriatique le sait, y compris l'homme qui le lit actuellement."
 cc_byz_west.20.a: "Il sera en route d'ici la fin du mois."
 cc_byz_west.20.b: "Il regrette que la province ne puisse se passer de lui."
 cc_byz_west.20.c: "Alors on ira le chercher."

 cc_byz_west.30.title: "Dissolution de la préfecture"
 cc_byz_west.30.desc: "C'est possible. La fonction a été créée par un document et peut être abolie par un autre, et le territoire revient à l'administration directe depuis la capitale.\n\nCe que le document ne peut pas faire, c'est produire les fonctionnaires pour l'administrer. Ces hommes sont actuellement ceux du préfet, ils y vivent, et ils ont passé une carrière à apprendre une province que la capitale n'a jamais vue. Certains resteront. Ceux qui comptent ne le feront pas.\n\nLes autres préfets en seront informés avant même que les coursiers ne les atteignent."
 cc_byz_west.30.a: "Le bureau était nôtre à créer et nôtre à supprimer."
 cc_byz_west.30.b: "Laissez tomber. Il y a de meilleures batailles."

 cc_byz_west.90.title: "L'Occident réabsorbé"
 cc_byz_west.90.desc: "La dernière préfecture est liquidée et l'ouest est gouverné comme l'est est gouverné : par des fonctionnaires qui servent là où ils sont envoyés, occupent leur charge au bon vouloir de l'empereur et rentrent chez eux lorsqu'ils sont rappelés.\n\nIl a fallu maintenir les provinces faibles. Une préfecture assez forte pour se défendre aurait été assez forte pour refuser, donc aucune ne l'a jamais été, et la frontière a été tenue par des armées envoyées depuis la capitale à un coût que personne n'a jamais totalisé.\n\nL'empire est redevenu une seule entité, administrée depuis un seul lieu, dans une seule langue, par un seul service. Il n'avait pas été ainsi depuis Théodose."
 cc_byz_west.90.a: "Un seul empire, et un seul empereur en son sein."

 cc_byz_west.91.title: "La diarchie"
 cc_byz_west.91.desc: "L'arrangement est formalisé au consistoire, selon les anciennes formes, et les anciennes formes s'avèrent avoir été écrites précisément pour cela.\n\nIl y a un collègue en occident. Il est investi, acclamé et nommé dans les prières ; ses préfectures lèvent leurs propres armées, conservent leurs propres revenus et répondent de leur propre frontière, et elles répondent devant lui. Lui répond devant l'Auguste senior, ce qui est une relation réelle et non une courtoisie, car elle a été établie par un accord entre deux cours qui avaient toutes deux quelque chose à perdre.\n\nC'est ce que le quatrième siècle essayait de faire. Cela a échoué alors parce que les deux moitiés étaient rivales dès le départ. Celle-ci a été bâtie par un empereur qui a reconquis l'occident lui-même, puis a refusé de prétendre qu'il pouvait l'administrer depuis le Bosphore."
 cc_byz_west.91.a: "Deux Augustes, et un seul empire pour eux deux."

 cc_byz_west.92.title: "L'acclamation"
 cc_byz_west.92.desc: "Cela se passe comme cela se passe toujours. Ni rébellion, ni manifeste : un terrain d'exercice, une armée qui n'a pas été payée, un général qui l'a été, et le cri qui s'élève avant même que quiconque ait décidé de crier.\n\nLe temps que la nouvelle atteigne Constantinople, il porte la pourpre depuis quatre mois, les préfectures l'ont reconnu, et les reconnaissances sont formulées avec tant de soin qu'aucune d'entre elles ne constitue une trahison.\n\nLe consistoire continue de se réunir. Il a été, après tout, constitué par l'autorité impériale, et il considère qu'il l'est toujours."
 cc_byz_west.92.a: "Nous sommes alors deux, et l'un de nous est un usurpateur."

 cc_byz_west.93.title: "L'Occident libéré"
 cc_byz_west.93.desc: "Il n'y a pas de moment précis. C'est ce qui rend le rapport difficile.\n\nLes préfets sont toujours nommés et toujours confirmés. Les revenus sont toujours évalués sur la base des chiffres d'un recensement vieux de quarante ans. Les garnisons figurent toujours sur les registres. Quelque part entre l'évaluation et la collecte, et entre le registre et le mur, l'empire a cessé d'être ce qui gouverne ces provinces, et personne ne peut dire en quelle année.\n\nLes hommes qui les gouvernent réellement aujourd'hui sont locaux, compétents, et n'ont jamais été nommés par personne."
 cc_byz_west.93.a: "C'était un long chemin à tenir."
 cc_byz_west.80.title: "La question ne peut rester ouverte"
 cc_byz_west.80.desc: "Le Maître des Offices a soumis un mémorandum que personne ne lui a demandé.\n\nSon argument est procédural et donc difficile à contrer. Les préfectures occidentales existent depuis assez longtemps pour que leurs arrangements soient plus anciens que la plupart des hommes qui les administrent, et chaque année où l'arrangement reste tacite, il devient plus difficile de l'énoncer. Les préfets sont nommés selon des précédents plutôt que selon des instructions. Les revenus sont versés à des taux pour lesquels personne ne peut produire de document.\n\nIl ne recommande pas une politique. Il recommande qu'il y en ait une, et rapidement, car l'alternative est que la réponse arrive d'elle-même et que le palais découvre après coup quelle elle était."
 cc_byz_west.80.desc_westward: "Le Maître des Offices a soumis un mémorandum que personne ne lui a demandé, et il est plus court que d'habitude.\n\nL'ouest n'est pas gouverné d'ici. Il ne le formule pas aussi crûment, mais les chiffres le font : des nominations confirmées plutôt que faites, des revenus évalués dans les provinces plutôt qu'à la capitale, et un consistoire dont l'empereur doit désormais compter les voix avant de les solliciter.\n\nRien de tout cela n'a été décidé. Tout cela est désormais la pratique, et la pratique devient loi dans cet empire lorsqu'elle n'est pas contestée assez longtemps. Il suggère que la contestation soit faite durant ce règne, ou pas du tout."
 cc_byz_west.80.a: "Alors elle sera tranchée de mon vivant."
 cc_byz_west.40.title: "Le soulèvement des préfets"
 cc_byz_west.40.desc: "Cela commence par une objection procédurale, car c'est ainsi que commencent ces choses quand les hommes qui les créent sont autant d'avocats que de soldats.\n\nLe consistoire a résolu que les nominations aux préfectures de l'ouest requièrent l'assentiment du corps. Il a communiqué cette résolution à la capitale dans la forme correcte, avec les sceaux corrects, citant quatre précédents dont trois sont authentiques. Il n'a rien résolu concernant l'obéissance, car il n'en a pas besoin : une nomination que le consistoire n'a pas acceptée n'est plus, par sa propre résolution, une nomination.\n\nLes armées de l'ouest sont dans leurs quartiers et ont été payées. Pas par nous."
 cc_byz_west.40.desc_defied: "Cela commence là où la dernière convocation s'est terminée.\n\nUn préfet a ignoré un rappel et a gardé sa province, et rien ne lui est arrivé. Le consistoire a maintenant résolu que les nominations à l'ouest requièrent l'assentiment du corps, et la résolution ressemble moins à une revendication qu'à une description : la chose est déjà vraie depuis quelques années et quelqu'un l'a enfin mise par écrit.\n\nLes armées de l'ouest sont dans leurs quartiers et ont été payées. Pas par nous."
 cc_byz_west.40.desc_all: "Chaque préfecture l'a signé.\n\nC'est le point sur lequel le Maître des Offices revient sans cesse. Non pas le contenu de la résolution, qui est un document d'avocat et pourrait être contesté, mais le fait que quatre provinces séparées par des semaines de navigation aient produit un texte unique avec quatre sceaux. Ils n'auraient pas pu faire cela il y a quatre-vingts ans. Ils peuvent le faire maintenant parce que l'empire leur a construit une chambre pour le faire, les a convoqués pour s'y asseoir et leur a dit que leur assentiment avait de la valeur.\n\nLes armées de l'ouest sont dans leurs quartiers et ont été payées. Pas par nous."
 cc_byz_west.40.a: "Alors c'est une guerre, et ils sont toujours mes gouverneurs."
 cc_byz_west.40.b: "Donnez-leur le fond. Je garderai la forme."
 cc_byz_west.40.c: "Achetez ceux qui peuvent être achetés."
 cc_byz_west.41.title: "Le règlement de comptes à l'ouest"
 cc_byz_west.41.desc_won: "La préfecture est liquidée, ses fonctionnaires sont licenciés ou réaffectés, et son territoire est administré depuis la capitale.\n\nCe qui est frappant, en lisant la correspondance a posteriori, c'est à quel point la situation juridique s'est avérée ordinaire. Aucune conquête n'a été impliquée et aucune n'a été revendiquée. Une charge a été révoquée par l'autorité qui l'avait créée, et le fait que la révocation ait nécessité une armée n'apparaît nulle part dans les documents.\n\nLes préfets survivants ont envoyé leurs félicitations. Ils ont été prompts à le faire."
 cc_byz_west.41.desc_none_left: "Il ne reste plus de préfectures.\n\nLes provinces de l'ouest sont administrées directement, ce qui signifie qu'elles sont administrées par des hommes envoyés de la capitale qui ne connaissent pas le pays, ne parlent pas la langue de ses tribunaux et seront tournés avant d'avoir appris l'un ou l'autre. C'est ce qui était voulu. Cela vaut la peine d'écrire, une fois, qu'il a fallu une guerre contre les propres gouverneurs de l'empire pour y parvenir."
 cc_byz_west.41.desc_unresolved: "La guerre ne l'a pas réglé, ou il n'y a pas eu de guerre.\n\nLes préfectures sont toujours là, tout comme les préfets, et la résolution exigeant l'assentiment du consistoire pour les nominations n'a pas été retirée. Elle a simplement cessé d'être contestée, ce qui, dans cet empire, est la manière dont une revendication devient un droit.\n\nLe prochain empereur héritera de cet arrangement comme d'un fait plutôt que comme d'une question, et ne se souviendra pas que cela a jamais été autrement."
 cc_byz_west.41.a: "La charge était mienne à révoquer."
 cc_byz_west.41.b: "Alors c'est tranché contre moi."
 cc_byz_reduce_prefecture: "Réduire la préfecture"
 cc_byz_reduce_prefecture_desc: "Révocations de la nomination et reprise de la province sous administration directe. Ce n'est pas une conquête : la charge a été créée par l'autorité impériale et y met fin, c'est pourquoi elle coûte si peu et pourquoi personne d'autre en Europe ne considère que cela le regarde."
 cc_byz_reduce_prefecture_tt: "La préfecture est dissoute et son territoire revient à l'administration impériale directe"
 cc_byz_cb_reduce_the_prefectures: "Réduire les préfectures"
 cc_byz_cb_reduce_the_prefectures_desc: "Les préfets de l'ouest ont fait de leur assentiment une condition de leur propre nomination. Ils restent, en droit, des fonctionnaires impériaux dans des provinces impériales, et l'empereur propose de leur rappeler la première moitié de cette phrase."
 cc_byz_cb_reduce_the_prefectures_PROV: "Réduire les préfectures"
 cc_byz_west.35.title: "Lettres qui ne nous sont pas adressées"
 cc_byz_west.35.desc: "La sacoche de dépêches venant de l'ouest arrive plus légère, et la chancellerie a mis du temps à en comprendre la raison.\n\nCe n'est pas que l'on écrit moins. C'est qu'une grande partie de ce qui est écrit circule désormais directement entre les préfectures, sur des questions que la capitale aurait auparavant arbitrées : une question de frontière réglée entre deux gouverneurs sans consulter personne, un accord sur les prix du grain, une plainte commune sur l'évaluation qui a été rédigée puis non envoyée.\n\nRien de tout cela n'est inapproprié. Le Maître des Offices souligne ce point à deux reprises, ce qui permet à l'empereur de savoir qu'il est inquiet."
 cc_byz_west.35.desc_defied: "La sacoche de dépêches venant de l'ouest arrive plus légère, et cette fois, personne n'a besoin d'en chercher la raison.\n\nUne convocation a été ignorée et rien n'a suivi. Depuis, les préfectures correspondent entre elles plutôt qu'avec nous : des questions de frontières réglées entre gouverneurs, des prix du grain convenus, une plainte commune sur l'évaluation rédigée et diffusée pour signature.\n\nCe dernier document n'a pas été envoyé. La chancellerie estime qu'il est conservé pour le moment où il aura plus de valeur."
 cc_byz_west.35.desc_many: "Trois préfectures et plus, et elles ont découvert qu'elles pouvaient s'écrire.\n\nLa correspondance est tout à fait correcte, et c'est ce qui rend toute objection difficile. Des questions de frontières réglées entre gouverneurs. Des prix du grain convenus. Une déclaration commune sur l'évaluation, rédigée, diffusée pour signature, et conservée.\n\nCe qui a changé n'est pas une lettre en particulier, mais l'existence d'une habitude. Il y a quatre-vingts ans, l'ouest n'aurait rien pu coordonner, car l'ouest n'existait pas, seulement un ensemble de provinces traitant chacune avec la capitale. Désormais, il y a un ouest. Nous lui avons construit une chambre et nous l'avons convoqué pour y siéger."
 cc_byz_west.35.a: "Payer les arriérés. La totalité, cette année."
 cc_byz_west.35.b: "S'occuper de celui qui rédige les lettres."
 cc_byz_west.35.c: "Prendre note. Il y a des problèmes plus urgents."
 STATIC_MODIFIER_NAME_cc_byz_west_restive: "L'Ouest est agité"
 STATIC_MODIFIER_DESC_cc_byz_west_restive: "Les préfectures correspondent entre elles plutôt qu'avec la capitale, et au moins un préfet a cessé de prétendre être satisfait. C'est l'état qui précède un soulèvement."
 STATIC_MODIFIER_NAME_cc_byz_exarch_disaffected: "Un préfet mécontent"
 STATIC_MODIFIER_DESC_cc_byz_exarch_disaffected: "Ce préfet lève des hommes, et ce n'est pas pour le service de la capitale qu'il compte les utiliser."
 STATIC_MODIFIER_NAME_cc_byz_exarch_contented: "Un préfet satisfait"
 STATIC_MODIFIER_DESC_cc_byz_exarch_contented: "Payé, confirmé, et gouvernant une province qui tire profit de cet arrangement."
