l_french:
 # Stepping-stone mission tasks.
 #
 # These 25 tasks are mission-mode only: mission packs default to OFF, and the stepping
 # stones deliberately have no generic-action twin. Only the nine cornerstones do.
 #
 # Descriptions state the condition plainly, because a mission task the player cannot work
 # out how to complete is not content. Flavour goes in the second sentence, never the first.

 # A. The House in Order
 cc_byz_task_walls: "Les murs tiennent bon"
 cc_byz_task_walls_desc: "Maintenir les Murs théodosiens à Constantinople. Ils n'ont échoué qu'une seule fois en neuf cents ans, et la ville n'a jamais cessé de payer pour leur réparation."
 cc_byz_task_hippodrome: "Du pain et des jeux"
 cc_byz_task_hippodrome_desc: "Maintenir l'Hippodrome. C'est là que les habitants de cette ville disent à leur empereur ce qu'ils pensent de lui, ce qui mérite d'être su avant que cela ne soit hurlé."
 cc_byz_task_council: "Un conseil complet"
 cc_byz_task_council_desc: "Nommer cinq membres au cabinet. Un empereur qui gouverne seul est un empereur dont le successeur n'hérite de rien d'autre qu'une chaise."
 cc_byz_task_bureaus: "Les bureaux financés"
 cc_byz_task_bureaus_desc: "Gérer quatre bureaucraties avec un entretien complet. Peu prestigieux, coûteux, et c'est ce qui fait la différence entre un empire et une cour."
 cc_byz_task_arsenal: "L'Arsenal"
 cc_byz_task_arsenal_desc: "Maintenir un chantier naval à Constantinople. Les détroits sont la seule raison pour laquelle cette ville a survécu, et ils ne valent rien sans coques dans l'eau."

 # B. The Greek Claimants
 cc_byz_task_no_second_emperor: "Pas de second empereur"
 cc_byz_task_no_second_emperor_desc: "Mettre fin à l'empire de Trébizonde. Leur revendication est authentique, leur descendance est impériale, et il ne peut y en avoir deux."
 cc_byz_task_duchy_dissolved: "Le duché dissous"
 cc_byz_task_duchy_dissolved_desc: "Mettre fin au duché d'Athènes. La possession d'un aventurier latin sur sol grec, gouvernée en français, à trois jours de navigation de la capitale."
 cc_byz_task_despotate: "Le Despotat"
 cc_byz_task_despotate_desc: "Détenir l'intégralité de l'Achaïe et de l'Arcadie. La Morée est la dernière partie de l'empire qui s'auto-suffise encore et envoie toujours des soldats."
 cc_byz_task_greek_again: "À nouveau grec"
 cc_byz_task_greek_again_desc: "Détenir l'intégralité de l'Attique et rendre Athènes à majorité orthodoxe. La ville a été gouvernée par les Latins depuis assez longtemps pour qu'une génération ait grandi sous leur rite."

 # C. Anatolia
 cc_byz_task_beylik_ended: "La fin du Beylik"
 cc_byz_task_beylik_ended_desc: "Mettre fin à l'État ottoman. Toutes les autres questions auxquelles l'empire est confronté sont des questions de temps, et celle-ci est celle qui décide de combien il en reste."
 cc_byz_task_themes: "La réforme des thèmes"
 cc_byz_task_themes_desc: "Détenir vingt-cinq emplacements en Anatolie. Le système thématique était la manière dont cet empire nourrissait et levait ses armées, et l'Asie Mineure est indispensable à son existence même."
 cc_byz_task_pronoia_host: "L'armée de pronoia"
 cc_byz_task_pronoia_host_desc: "Maintenir trois concessions de pronoia. Des terres détenues en échange de soldats : moins cher que de les payer, et la facture arrive sous un règne ultérieur."

 # D. The Levant
 cc_byz_task_antioch: "Antioche restaurée"
 cc_byz_task_antioch_desc: "Détenir Antioche, ou sécuriser son siège patriarcal. L'un des cinq anciens sièges, perdu face aux Arabes avant même que le schisme ne soit une querelle."
 cc_byz_task_holy_city: "La Ville Sainte"
 cc_byz_task_holy_city_desc: "Détenir Jérusalem, ou sécuriser son siège patriarcal. Aucun empereur romain ne l'a gouvernée depuis Héraclius, et il ne l'a pas gouvernée longtemps."
 cc_byz_task_patriarch: "Le retour du patriarche"
 cc_byz_task_patriarch_desc: "Rendre Jérusalem à majorité orthodoxe. Le patriarcat a survécu à huit siècles de domination musulmane en étant prudent ; il lui faudra du temps pour cesser de l'être."
 cc_byz_task_egypt: "L'Égypte et le Delta"
 cc_byz_task_egypt_desc: "Détenir Alexandrie et Le Caire, ou sécuriser le siège d'Alexandrie. Le grenier de l'ancien empire, et la douane la plus riche entre ici et l'Inde."
 cc_byz_task_lighthouse: "Le Phare"
 cc_byz_task_lighthouse_desc: "Maintenir le Phare d'Alexandrie. Il a guidé les navires vers ce port pendant mille ans et le port n'a plus jamais été le même sans lui."
 cc_byz_task_sinai_road: "La route du Sinaï"
 cc_byz_task_sinai_road_desc: "Détenir le Sinaï. L'Égypte sans lui est un terminus. L'Égypte avec lui est un corridor, et l'extrémité lointaine de ce corridor est l'Inde."

 # E. The Western Crossing
 cc_byz_task_adriatic: "La traversée de l'Adriatique"
 cc_byz_task_adriatic_desc: "Détenir Durrës et Split. L'ancienne route vers l'ouest commençait à Durrës, et aucune armée n'a atteint l'Italie d'ici sans elle."
 cc_byz_task_exarch_seated: "L'Exarque installé"
 cc_byz_task_exarch_seated_desc: "Nommez un exarque pour gouverner en Italie. Les villes prises par une armée sont conservées. Les villes gouvernées par un fonctionnaire nommé sont récupérées."
 cc_byz_task_carthage: "Carthage récupérée"
 cc_byz_task_carthage_desc: "Détenir l'intégralité de Tunis. L'Afrique a nourri Rome pendant quatre siècles et a payé pour la reconquête qui l'a perdue."
 cc_byz_task_pillars: "Les piliers"
 cc_byz_task_pillars_desc: "Détenir l'intégralité de Murcie ou d'Almería. L'extrémité lointaine de la mer, là où se trouvait la Spania de Justinien et où elle n'est pas restée."

 # F. The Merchant Empire
 cc_byz_task_galata: "Les douanes de Galata"
 cc_byz_task_galata_desc: "Détenir Galata. Le quartier de l'autre côté de l'eau a collecté plus de douanes de cette ville que la ville elle-même, et il est temps que cela cesse."
 cc_byz_task_merchant_fleet: "Une flotte marchande"
 cc_byz_task_merchant_fleet_desc: "Atteindre quinze ducats de revenus commerciaux mensuels. Non pas une flotte que l'empire possède, mais une flotte qui navigue sous son drapeau et paie ses taxes ici."
 cc_byz_task_spice_dues: "Les taxes sur les épices"
 cc_byz_task_spice_dues_desc: "Atteindre trente ducats de revenus commerciaux mensuels. À ce stade, les douanes valent plus que plusieurs provinces, et tout le monde en Italie l'a remarqué."

 # Stepping-stone reward modifiers
 STATIC_MODIFIER_NAME_cc_byz_reward_fortifications: "Murs en bon état"
 STATIC_MODIFIER_DESC_cc_byz_reward_fortifications: "La maçonnerie est solide, les citernes sont pleines et la garnison a été payée. Rien de tout cela n'est permanent."
 STATIC_MODIFIER_NAME_cc_byz_reward_naval: "Une saison de construction navale"
 STATIC_MODIFIER_DESC_cc_byz_reward_naval: "Du bois, de la corde et des hommes qui savent quoi en faire."
 STATIC_MODIFIER_NAME_cc_byz_reward_trade: "Les douanes fonctionnent"
 STATIC_MODIFIER_DESC_cc_byz_reward_trade: "Des taxes collectées là où elles le doivent, par des hommes qui les reversent."
 STATIC_MODIFIER_NAME_cc_byz_reward_administration: "Les bureaux sont pourvus"
 STATIC_MODIFIER_DESC_cc_byz_reward_administration: "L'évaluation est à jour, les clercs sont payés et quelqu'un sait où se trouvent les registres."
 STATIC_MODIFIER_NAME_cc_byz_reward_manpower: "Recrues des Thèmes"
 STATIC_MODIFIER_DESC_cc_byz_reward_manpower: "Des hommes provenant d'une province qui a décidé qu'elle était la nôtre, ce qui n'est pas la même chose qu'une province que nous détenons."
 STATIC_MODIFIER_NAME_cc_byz_reward_confidence: "La ville croit"
 STATIC_MODIFIER_DESC_cc_byz_reward_confidence: "Un succès public, et une capitale prête à accorder au trône le bénéfice du doute pendant un certain temps."
