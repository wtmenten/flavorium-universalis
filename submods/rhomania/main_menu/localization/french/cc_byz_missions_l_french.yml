l_french:
 # Stepping-stone mission tasks.
 #
 # These 25 tasks are mission-mode only: mission packs default to OFF, and the stepping
 # stones deliberately have no generic-action twin. Only the nine cornerstones do.
 #
 # Descriptions state the condition plainly, because a mission task the player cannot work
 # out how to complete is not content. Flavour goes in the second sentence, never the first.

 # A. The House in Order
 cc_byz_task_walls: "Les murs tiennent bon"
 cc_byz_task_walls_desc: "Cinquante-six tours sur le mur extérieur, quatre-vingt-seize sur l'intérieur, et des fossés asséchés depuis que l'on s'en souvienne. Ils n'ont échoué qu'une fois en mille ans, et cette fois fut face aux Latins venus par la mer.\n\nLa maçonnerie est théodosienne. Les réparations sont l'œuvre de tous."
 cc_byz_task_hippodrome: "Du pain et des jeux"
 cc_byz_task_hippodrome_desc: "Les Bleus d'un côté, les Verts de l'autre, et un empereur dans le kathisma qui a appris à écouter. Ce n'est pas un hippodrome. C'est le seul bâtiment de l'empire où le peuple peut dire une chose en face de lui sans être arrêté, et chaque empereur qui l'a oublié s'en est rendu compte la semaine suivante."
 cc_byz_task_council: "Un conseil complet"
 cc_byz_task_council_desc: "Un seul homme ne peut lire chaque dépêche, et un empereur qui essaie n'en lira aucune correctement. Nous avons besoin d'hommes à la table qui connaissent chacun une province, et nous avons besoin qu'ils soient en désaccord avec nous à haute voix."
 cc_byz_task_bureaus: "Les bureaux financés"
 cc_byz_task_bureaus_desc: "Tout empire ayant perduré a fini par n'être qu'une pièce remplie de clercs. Les nôtres ne sont pas payés, ce qui est une chose que nous avons décidé de ne plus remarquer.\n\nIls doivent être financés, et financés régulièrement. Un mois généreux avant une inspection ne constitue pas une administration."
 cc_byz_task_arsenal: "L'Arsenal"
 cc_byz_task_arsenal_desc: "Les détroits sont la raison pour laquelle cette ville a survécu, et les détroits ne valent rien sans coques dans l'eau. Nous louons des navires italiens depuis cinquante ans et payons plus qu'une flotte n'aurait coûté."

 # B. The Greek Claimants
 cc_byz_task_no_second_emperor: "Pas de second empereur"
 cc_byz_task_no_second_emperor_desc: "Trébizonde qualifie son dirigeant d'Empereur et Autocrate des Romains, ce qui est notre titre, et ce depuis que la ville est tombée aux mains des Latins et que tous ceux qui avaient un droit au trône sont partis ailleurs avec lui. Les Grands Comnènes sont des cousins. Cela n'a jamais amélioré l'arithmétique."
 cc_byz_task_duchy_dissolved: "Le duché dissous"
 cc_byz_task_duchy_dissolved_desc: "Une famille bourguignonne détient l'Acropole et se nomme le Duché d'Athènes. Le Parthénon est une cathédrale sous leur coupe depuis un siècle, ce qui est au moins une utilité, et l'arrangement date du sac de cette ville en 1204."
 cc_byz_task_despotate: "Le Despotat"
 cc_byz_task_despotate_desc: "Mistra, dans les collines au-dessus de Sparte, est la seule province de cet empire qui croît. Les érudits s'y rendent désormais au lieu de venir ici. Cela devrait être un réconfort, mais ne l'est pas."
 cc_byz_task_greek_again: "À nouveau grec"
 cc_byz_task_greek_again_desc: "Athènes est gouvernée par les Latins depuis assez longtemps qu'une génération a grandi sous leur rite et n'en connaît pas d'autre. Reprendre la ville est l'œuvre d'une saison. Le reste ne l'est pas."

 # C. Anatolia
 cc_byz_task_beylik_ended: "La fin du Beylik"
 cc_byz_task_beylik_ended_desc: "Un émirat frontalier à Sogut, à deux jours de cheval de la mer, gouverné par une famille que personne dans cette ville n'aurait pu nommer il y a quarante ans. Ils ont pris Bursa. Ils ont pris Nicée. Ils ont traversé vers Gallipoli.\n\nOn peut encore en venir à bout."
 cc_byz_task_themes: "La réforme des thèmes"
 cc_byz_task_themes_desc: "Des soldats installés sur des terres qu'ils détiennent en échange du maintien de la ligne, rassemblés sous un stratège qui est également leur gouverneur. Cela a fonctionné pendant trois cents ans, puis les magnats ont racheté les terres et la ligne a disparu avec elles."
 cc_byz_task_pronoia_host: "L'armée de pronoia"
 cc_byz_task_pronoia_host_desc: "Accordez à un homme les revenus d'un district et il amènera des soldats quand on l'appellera. Cela ne coûte rien au trésor, c'est pourquoi c'est irrésistible, et cela coûte le district au trésor, c'est pourquoi on devrait y résister.\n\nPrendre ceci ferme la route des tagmata."

 # D. The Levant
 cc_byz_task_antioch: "Antioche restaurée"
 cc_byz_task_antioch_desc: "L'un des cinq sièges patriarcaux, la ville où les disciples du Christ furent appelés chrétiens pour la première fois, et un territoire impérial dans la mémoire vivante de la Première Croisade. Le patriarche d'Antioche vit à Constantinople depuis deux cents ans car il n'y avait nulle part ailleurs où il puisse vivre."
 cc_byz_task_holy_city: "La Ville Sainte"
 cc_byz_task_holy_city_desc: "Le Saint-Sépulcre, le rocher, et toutes les routes de la chrétienté convergeant vers eux. L'empire a payé les lampes de cette église à travers trois changements de maîtres et n'a jamais été prié d'arrêter."
 cc_byz_task_patriarch: "Le retour du patriarche"
 cc_byz_task_patriarch_desc: "Le patriarcat a survécu à huit siècles de domination musulmane en étant extrêmement prudent. Il faudra plus qu'un changement de garnison pour l'arrêter."
 cc_byz_task_egypt: "L'Égypte et le Delta"
 cc_byz_task_egypt_desc: "L'Égypte a nourri cette ville pendant trois cents ans et a nourri quelqu'un d'autre pendant sept cents ans. Les postes de la flotte céréalière au port portent toujours leurs anciens noms et sont utilisés pour autre chose."
 cc_byz_task_lighthouse: "Le Phare"
 cc_byz_task_lighthouse_desc: "Il a tenu pendant seize cents ans et les tremblements de terre en ont consommé la majeure partie. Ce qui survit est un moignon sur une jetée dans un port actif, ce qui est une chose plus utile qu'une merveille et moins impressionnante."
 cc_byz_task_sinai_road: "La route du Sinaï"
 cc_byz_task_sinai_road_desc: "L'isthme entre deux mers, et la seule terre que touchent les épices entre les Indes et Alexandrie. Quiconque le détient taxe tout ce qui passe et n'a pas besoin de flotte pour y parvenir."

 # E. The Western Crossing
 cc_byz_task_adriatic: "La traversée de l'Adriatique"
 cc_byz_task_adriatic_desc: "Dyrrhachium est l'endroit où commence la route vers l'Italie et où chaque invasion des Balkans depuis l'ouest a débarqué. La Via Egnatia court de sa porte à la nôtre."
 cc_byz_task_exarch_seated: "L'Exarque installé"
 cc_byz_task_exarch_seated_desc: "Un gouverneur à Ravenne avec les troupes, les cours et les revenus de l'Italie entre ses mains, nommé par un empereur situé à six semaines de navigation.\n\nLa fonction a fonctionné pendant deux cents ans. Cela vaut la peine de savoir comment elle s'est terminée."
 cc_byz_task_carthage: "Carthage récupérée"
 cc_byz_task_carthage_desc: "Bélisaire a pris l'Afrique aux Vandales en une seule saison avec quinze mille hommes, ce qui reste la chose la plus réussie que cet empire ait jamais accomplie et a créé une attente que personne n'a satisfaite depuis."
 cc_byz_task_pillars: "Les piliers"
 cc_byz_task_pillars_desc: "Les Colonnes d'Hercule, et la fin du monde telle que les anciens la concevaient. L'empire a tenu le côté opposé pendant soixante-dix ans sans jamais pouvoir s'expliquer tout à fait pourquoi."

 # F. The Merchant Empire
 cc_byz_task_galata: "Les douanes de Galata"
 cc_byz_task_galata_desc: "Le quartier génois de l'autre côté de la Corne nous verse une fraction de ce qu'il gagne et rapporte sept fois plus que notre propre bureau des douanes. Les chiffres ont été présentés à l'empereur en 1348 et la guerre qui a suivi a été perdue en mer."
 cc_byz_task_merchant_fleet: "Une flotte marchande"
 cc_byz_task_spice_dues: "Les taxes sur les épices"
 cc_byz_task_spice_dues_desc: "À ce niveau, la douane vaut plus que plusieurs provinces et ne coûte rien en garnison. Tout le monde en Italie a fait le même calcul."

 # Stepping-stone reward modifiers
 STATIC_MODIFIER_NAME_cc_byz_reward_fortifications: "Murs en bon état"
 STATIC_MODIFIER_DESC_cc_byz_reward_fortifications: "La maçonnerie est solide, les citernes sont pleines et la garnison a été payée. Rien de tout cela n'est permanent."
 STATIC_MODIFIER_NAME_cc_byz_reward_naval: "Une saison de construction navale"
 STATIC_MODIFIER_DESC_cc_byz_reward_naval: "Du bois, de la corde et des hommes qui savent quoi en faire."
 STATIC_MODIFIER_NAME_cc_byz_reward_trade: "Les douanes fonctionnent"
 STATIC_MODIFIER_DESC_cc_byz_reward_trade: "Des taxes collectées là où elles le doivent, par des hommes qui les reversent."
 STATIC_MODIFIER_NAME_cc_byz_reward_administration: "Les bureaux sont pourvus"
 STATIC_MODIFIER_DESC_cc_byz_reward_administration: "L'évaluation est à jour, les clercs sont payés et quelqu'un sait où se trouvent les registres."
 STATIC_MODIFIER_NAME_cc_byz_reward_manpower: "Recrues des Thèmes"
 STATIC_MODIFIER_DESC_cc_byz_reward_manpower: "Des hommes provenant d'une province qui a décidé qu'elle était la nôtre, ce qui n'est pas la même chose qu'une province que nous détenons."
 STATIC_MODIFIER_NAME_cc_byz_reward_confidence: "La ville croit"
 STATIC_MODIFIER_DESC_cc_byz_reward_confidence: "Un succès public, et une capitale prête à accorder au trône le bénéfice du doute pendant un certain temps."
 cc_byz_task_merchant_fleet_desc: "Pas une flotte que l'empire possède. Une flotte qui navigue sous son drapeau, paie ses taxes ici, et préférerait être protégée par nous que par quiconque d'autre.\n\nLes registres nomment chaque possession latine en Égée qui ne fait ni l'un ni l'autre."
