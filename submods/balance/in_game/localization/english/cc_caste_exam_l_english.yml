l_english:

 # --- India: caste privileges ---
 cc_brahmin_ritual_primacy: "Brahmin Ritual Primacy"
 cc_brahmin_ritual_primacy_desc: "The priestly caste presides over rite, learning and law. Their authority anchors the social order and the favour of the heavens — but a world ordered by birth leaves little room for the low-born to rise."
 cc_kshatriya_warrior_caste: "Kshatriya Martial Order"
 cc_kshatriya_warrior_caste_desc: "Arms and rulership are the hereditary duty of the warrior caste. Their martial pride steadies the host, yet a realm where station is inherited binds the peasant to his father's lot."
 cc_jati_occupational_order: "Jati Occupational Order"
 cc_jati_occupational_order_desc: "Each community keeps to the trade of its birth, its dues and its place. The settled order yields a reliable revenue, but a man may not easily leave the caste he was born to."

 # --- China: examination privileges ---
 cc_scholar_gentry_examination: "Scholar-Gentry Examinations"
 cc_scholar_gentry_examination_desc: "Office is the reward of the examination hall, and the literati who master the classics fill the bureaucracy. Their learning makes for an able, studious administration — but the gruelling, narrow path lets only the gentry's sons advance, and fresh talent is slow and costly to seat."
 cc_examination_lineage: "Examination Lineages"
 cc_examination_lineage_desc: "Wealthy families pour their fortunes into tutors, academies and the leisure to study, monopolising success in the examinations across the generations. Their patronage enriches the towns, yet it shuts the hall's door to those who cannot afford the years of preparation."

 # --- Government reforms ---
 cc_varna_order_reform: "The Varna Order"
 cc_varna_order_reform_desc: "Codify the fourfold order of society as a principle of governance. The hierarchy is broadly content and the realm gains an additional avenue of rule — but social mobility freezes and the administration grows rigid."
 cc_imperial_examination_reform: "The Imperial Examinations"
 cc_imperial_examination_reform_desc: "Make the keju the spine of the state. A vast, literate bureaucracy raised by examination governs ably and advances learning, and the realm gains an additional avenue of rule — but the narrow classical syllabus throttles social mobility and makes officials slow and costly to recruit."

 # --- Reform-chain modifiers ---
 STATIC_MODIFIER_NAME_cc_caste_upheaval: "Caste Upheaval"
 cc_caste_upheaval_desc: "The old hierarchy is being torn down. For a time society churns — pops rise into new stations far faster than before, but the disruption breeds unrest and strains the administration."
 STATIC_MODIFIER_NAME_cc_caste_reformed: "Reformed Social Order"
 cc_caste_reformed_desc: "Birth no longer dictates station. With the old privileges gone, talent finds its level and pops promote freely."
 STATIC_MODIFIER_NAME_cc_keju_upheaval: "Examination Upheaval"
 cc_keju_upheaval_desc: "The examination monopoly is being dismantled. For a time the bureaucracy is in flux — advancement opens dramatically, but the disruption breeds unrest and unsettles the ministries."
 STATIC_MODIFIER_NAME_cc_keju_reformed: "Reformed Bureaucracy"
 cc_keju_reformed_desc: "Office is no longer the preserve of the examination gentry. A broader, more open administration lets talent rise and quickens both learning and promotion."

 # --- cc_caste.1: Reform the Caste Order ---
 cc_caste.1.title: "Reform the Caste Order"
 cc_caste.1.desc: "For centuries birth has been destiny: priest, warrior, merchant and labourer, each kept to the duties of his caste. Reformers and new ideas press against the old varna order. To loosen it would set the low-born climbing — and shake the foundations the realm has rested upon."
 cc_caste.1.a: "Loosen the order gradually — let reform and sanskritisation do their work."
 cc_caste.1.b: "Abolish caste outright — throw the gates of advancement wide."
 cc_caste.1.c: "The varna order has served us well. Uphold it."

 # --- cc_keju.1: Reform the Examinations ---
 cc_keju.1.title: "Reform the Examinations"
 cc_keju.1.desc: "The keju has filled our ministries with the learned for generations — and locked office to the gentry who alone can afford the years of study. Reformers urge a broader path to office. To open it would draw new talent into the state, at the cost of the order the gentry have long guarded."
 cc_keju.1.a: "Broaden the curriculum — admit practical statecraft beside the classics."
 cc_keju.1.b: "Abolish the examinations — open office to talent and patronage alike."
 cc_keju.1.c: "The examinations are the glory of our administration. Keep them."
