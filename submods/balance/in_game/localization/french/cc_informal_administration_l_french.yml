 AUTO_MODIFIER_NAME_cc_informal_administration: "Administration informelle"
 AUTO_MODIFIER_DESC_cc_informal_administration: "Un gouvernement qui repose sur des liens familiaux et personnels plutôt que sur des bureaux salariés coûte moins cher à entretenir. Chaque avancée qui élargit l'administration de l'État supprime 5 % de cette économie, jusqu'à ce qu'un État pleinement développé paie le prix fort."
