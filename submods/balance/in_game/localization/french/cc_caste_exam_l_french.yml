l_french:

 # --- India: caste privileges ---
 cc_brahmin_ritual_primacy: "Primauté rituelle des Brahmanes"
 cc_brahmin_ritual_primacy_desc: "La caste sacerdotale préside aux rites, au savoir et à la loi. Leur autorité ancre l'ordre social et la faveur des cieux — mais un monde ordonné par la naissance laisse peu de place à l'ascension des gens du peuple."
 cc_kshatriya_warrior_caste: "Ordre martial Kshatriya"
 cc_kshatriya_warrior_caste_desc: "Les armes et le gouvernement sont le devoir héréditaire de la caste des guerriers. Leur fierté martiale stabilise l'armée, mais un royaume où le rang est hérité lie le paysan au sort de son père."
 cc_jati_occupational_order: "Ordre professionnel Jati"
 cc_jati_occupational_order_desc: "Chaque communauté s'en tient au métier de sa naissance, à ses obligations et à sa place. L'ordre établi procure des revenus fiables, mais un homme ne peut aisément quitter la caste dans laquelle il est né."

 # --- China: examination privileges ---
 cc_scholar_gentry_examination: "Examens de la noblesse lettrée"
 cc_scholar_gentry_examination_desc: "La charge publique est la récompense des salles d'examen, et les lettrés maîtrisant les classiques remplissent la bureaucratie. Leur savoir assure une administration compétente et studieuse — mais le chemin étroit et épuisant ne permet qu'aux fils de la noblesse de progresser, et les nouveaux talents sont lents et coûteux à installer."
 cc_examination_lineage: "Lignées d'examinateurs"
 cc_examination_lineage_desc: "Les familles riches investissent leurs fortunes dans les tuteurs, les académies et le loisir d'étudier, monopolisant ainsi le succès aux examens à travers les générations. Leur mécénat enrichit les villes, mais il ferme la porte des salles à ceux qui ne peuvent s'offrir des années de préparation."

 # --- Government reforms ---
 cc_varna_order_reform: "L'ordre Varna"
 cc_varna_order_reform_desc: "Codifier l'ordre quadripartite de la société comme principe de gouvernance. La hiérarchie est globalement satisfaite et le royaume gagne une voie de commandement supplémentaire — mais la mobilité sociale se fige et l'administration devient rigide."
 cc_imperial_examination_reform: "Les examens impériaux"
 cc_imperial_examination_reform_desc: "Faire du keju l'épine dorsale de l'État. Une vaste bureaucratie lettrée, formée par examen, gouverne avec compétence et fait progresser le savoir, et le royaume gagne une voie de commandement supplémentaire — mais le programme classique restreint étrangle la mobilité sociale et rend le recrutement des fonctionnaires lent et coûteux."

 # --- Reform-chain modifiers ---
 STATIC_MODIFIER_NAME_cc_caste_upheaval: "Bouleversement des castes"
 cc_caste_upheaval_desc: "L'ancienne hiérarchie est en train d'être renversée. Pendant un certain temps, la société bouillonne — les populations accèdent à de nouveaux rangs bien plus rapidement qu'auparavant, mais ce bouleversement engendre de l'agitation et met l'administration à rude épreuve."
 STATIC_MODIFIER_NAME_cc_caste_reformed: "Ordre social réformé"
 cc_caste_reformed_desc: "La naissance ne dicte plus le rang. Les anciens privilèges ayant disparu, le talent trouve sa place et les populations s'élèvent librement."
 STATIC_MODIFIER_NAME_cc_keju_upheaval: "Bouleversement des examens"
 cc_keju_upheaval_desc: "Le monopole des examens est en train d'être démantelé. Pendant un certain temps, la bureaucratie est en mutation — l'ascension sociale devient soudainement possible, mais ce bouleversement engendre de l'agitation et déstabilise les ministères."
 STATIC_MODIFIER_NAME_cc_keju_reformed: "Bureaucratie réformée"
 cc_keju_reformed_desc: "Les charges publiques ne sont plus le domaine réservé de la petite noblesse lettrée. Une administration plus large et plus ouverte permet au talent de s'épanouir et accélère tant l'apprentissage que la promotion."

 # --- cc_caste.1: Reform the Caste Order ---
 cc_caste.1.title: "Réformer l'ordre des castes"
 cc_caste.1.desc: "Pendant des siècles, la naissance a été le destin : prêtre, guerrier, marchand et travailleur, chacun restant attaché aux devoirs de sa caste. Les réformateurs et les idées nouvelles s'opposent à l'ancien ordre varna. L'assouplir permettrait aux gens du peuple de s'élever — et ébranlerait les fondations sur lesquelles le royaume repose."
 cc_caste.1.a: "Assouplir l'ordre progressivement — laisser les réformes et la sanskritisation faire leur œuvre."
 cc_caste.1.b: "Abolir purement et simplement les castes — ouvrir grand les portes de l'ascension."
 cc_caste.1.c: "L'ordre des varnas nous a bien servis. Maintenons-le."

 # --- cc_keju.1: Reform the Examinations ---
 cc_keju.1.title: "Réformer les examens"
 cc_keju.1.desc: "Le keju a rempli nos ministères d'érudits depuis des générations — tout en barrant l'accès aux fonctions publiques pour la gentry, seule capable de s'offrir des années d'études. Les réformateurs prônent une voie plus large vers les charges publiques. L'ouvrir attirerait de nouveaux talents au sein de l'État, au prix de l'ordre que la gentry protège depuis longtemps."
 cc_keju.1.a: "Élargir le programme — admettre l'art concret du gouvernement aux côtés des classiques."
 cc_keju.1.b: "Abolir les examens — ouvrir les charges publiques tant au talent qu'au patronage."
 cc_keju.1.c: "Les examens font la gloire de notre administration. Conservons-les."
