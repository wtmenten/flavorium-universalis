l_spanish:

 # --- India: caste privileges ---
 cc_brahmin_ritual_primacy: "Primacía Ritual Brahmán"
 cc_brahmin_ritual_primacy_desc: "La casta sacerdotal preside el rito, el saber y la ley. Su autoridad ancla el orden social y el favor de los cielos, pero un mundo ordenado por el nacimiento deja poco espacio para que los nacidos en estratos bajos asciendan."
 cc_kshatriya_warrior_caste: "Orden Marcial Kshatriya"
 cc_kshatriya_warrior_caste_desc: "Las armas y el gobierno son el deber hereditario de la casta guerrera. Su orgullo marcial estabiliza al ejército, pero un reino donde la posición se hereda ata al campesino al destino de su padre."
 cc_jati_occupational_order: "Orden Ocupacional Jati"
 cc_jati_occupational_order_desc: "Cada comunidad se mantiene en el oficio de su nacimiento, sus tributos y su lugar. El orden establecido produce unos ingresos fiables, pero un hombre no puede abandonar fácilmente la casta en la que nació."

 # --- China: examination privileges ---
 cc_scholar_gentry_examination: "Exámenes de la Nobleza Erudita"
 cc_scholar_gentry_examination_desc: "El cargo es la recompensa del salón de exámenes, y los literatos que dominan los clásicos llenan la burocracia. Su saber crea una administración capaz y estudiosa, pero el camino agotador y estrecho solo permite avanzar a los hijos de la nobleza, y el nuevo talento tarda en llegar y es costoso de instaurar."
 cc_examination_lineage: "Linajes de Examen"
 cc_examination_lineage_desc: "Las familias ricas invierten sus fortunas en tutores, academias y el ocio necesario para estudiar, monopolizando el éxito en los exámenes a través de las generaciones. Su patrocinio enriquece las ciudades, pero cierra las puertas del salón a quienes no pueden costearse los años de preparación."

 # --- Government reforms ---
 cc_varna_order_reform: "El Orden Varna"
 cc_varna_order_reform_desc: "Codificar el orden cuádruple de la sociedad como un principio de gobernanza. La jerarquía está ampliamente satisfecha y el reino gana una vía adicional de gobierno, pero la movilidad social se congela y la administración se vuelve rígida."
 cc_imperial_examination_reform: "Los Exámenes Imperiales"
 cc_imperial_examination_reform_desc: "Convertir el keju en la columna vertebral del estado. Una vasta burocracia alfabetizada, formada mediante exámenes, gobierna con capacidad y fomenta el aprendizaje, y el reino gana una vía adicional de gobierno; pero el estrecho programa clásico estrangula la movilidad social y hace que los funcionarios sean lentos y costosos de reclutar."

 # --- Reform-chain modifiers ---
 STATIC_MODIFIER_NAME_cc_caste_upheaval: "Agitación de Castas"
 cc_caste_upheaval_desc: "La antigua jerarquía está siendo derribada. Durante un tiempo, la sociedad estará en agitación: las poblaciones ascienden a nuevas posiciones mucho más rápido que antes, pero la perturbación genera malestar y tensiona la administración."
 STATIC_MODIFIER_NAME_cc_caste_reformed: "Orden Social Reformado"
 cc_caste_reformed_desc: "El nacimiento ya no dicta la posición. Desaparecidos los antiguos privilegios, el talento encuentra su lugar y los pops ascienden libremente."
 STATIC_MODIFIER_NAME_cc_keju_upheaval: "Agitación de los Exámenes"
 cc_keju_upheaval_desc: "El monopolio de los exámenes se está desmantelando. Durante un tiempo, la burocracia estará en flujo: el ascenso se vuelve drásticamente más accesible, pero la perturbación genera malestar y desestabiliza los ministerios."
 STATIC_MODIFIER_NAME_cc_keju_reformed: "Burocracia Reformada"
 cc_keju_reformed_desc: "El cargo ya no es reserva de la pequeña nobleza de los exámenes. Una administración más amplia y abierta permite que el talento ascienda y agiliza tanto el aprendizaje como el ascenso."

 # --- cc_caste.1: Reform the Caste Order ---
 cc_caste.1.title: "Reformar el Orden de Castas"
 cc_caste.1.desc: "Durante siglos el nacimiento ha sido el destino: sacerdote, guerrero, mercader y trabajador, cada uno limitado a los deberes de su casta. Los reformadores y las nuevas ideas presionan contra el antiguo orden varna. Aflojarlo permitiría que los nacidos en estratos bajos ascendieran, sacudiendo los cimientos sobre los que se ha apoyado el reino."
 cc_caste.1.a: "Aflojar el orden gradualmente: dejar que la reforma y la sanscritización hagan su trabajo."
 cc_caste.1.b: "Abolir las castas por completo: abrir de par en par las puertas del ascenso."
 cc_caste.1.c: "El orden de las varnas nos ha servido bien. Mantengámoslo."

 # --- cc_keju.1: Reform the Examinations ---
 cc_keju.1.title: "Reformar los Exámenes"
 cc_keju.1.desc: "El keju ha llenado nuestros ministerios de eruditos durante generaciones, pero ha cerrado el acceso a los cargos para la pequeña nobleza que es la única que puede costearse los años de estudio. Los reformistas instan a un camino más amplio hacia los cargos públicos. Abrirlo atraería nuevo talento al Estado, a costa del orden que la gentry ha defendido durante mucho tiempo."
 cc_keju.1.a: "Ampliar el plan de estudios: admitir el arte de gobernar práctico junto a los clásicos."
 cc_keju.1.b: "Abolir los exámenes: abrir los cargos tanto al talento como al patronazgo."
 cc_keju.1.c: "Los exámenes son la gloria de nuestra administración. Mantengámoslos."
