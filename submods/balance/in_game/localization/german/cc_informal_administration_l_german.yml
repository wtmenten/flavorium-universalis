 AUTO_MODIFIER_NAME_cc_informal_administration: "Informelle Verwaltung"
 AUTO_MODIFIER_DESC_cc_informal_administration: "Eine Regierung, die auf familiären und persönlichen Bindungen statt auf bezahlten Ämtern basiert, verursacht geringere Unterhaltskosten. Jeder Fortschritt, der die Staatsverwaltung ausweitet, reduziert diese Ersparnis um 5 %, bis ein voll entwickelter Staat den vollen Preis zahlt."
