l_german:

 # --- India: caste privileges ---
 cc_brahmin_ritual_primacy: "Rituelle Vorherrschaft der Brahmanen"
 cc_brahmin_ritual_primacy_desc: "Die Priesterkaste leitet Riten, Gelehrsamkeit und Recht. Ihre Autorität verankert die soziale Ordnung und die Gunst des Himmels – doch eine nach Geburt geordnete Welt lässt den Niedriggeborenen wenig Raum für einen Aufstieg."
 cc_kshatriya_warrior_caste: "Kriegerische Kshatriya-Ordnung"
 cc_kshatriya_warrior_caste_desc: "Waffen und Herrschaft sind die erbliche Pflicht der Kriegerkaste. Ihr kriegerischer Stolz stabilisiert das Heer, doch ein Reich, in dem der Stand vererbt wird, bindet den Bauern an das Los seines Vaters."
 cc_jati_occupational_order: "Berufliche Jati-Ordnung"
 cc_jati_occupational_order_desc: "Jede Gemeinschaft bleibt dem Handwerk ihrer Geburt, ihren Abgaben und ihrem Platz treu. Die gefestigte Ordnung bringt zuverlässige Einnahmen, aber ein Mensch kann die Kaste, in die er hineingeboren wurde, nicht leicht verlassen."

 # --- China: examination privileges ---
 cc_scholar_gentry_examination: "Prüfungen für den Gelehrtenadel"
 cc_scholar_gentry_examination_desc: "Das Amt ist die Belohnung aus dem Prüfungssaal, und die Gelehrten, welche die Klassiker beherrschen, füllen die Bürokratie. Ihr Wissen sorgt für eine fähige, studierende Verwaltung – doch der mühsame, enge Pfad lässt nur die Söhne des Adels aufsteigen, und neues Talent ist langsam und kostspielig zu installieren."
 cc_examination_lineage: "Prüfungs-Linien"
 cc_examination_lineage_desc: "Wohlhabende Familien investieren ihr Vermögen in Tutoren, Akademien und die Muße zum Studium und monopolisieren so über Generationen hinweg den Erfolg bei den Prüfungen. Ihr Mäzenatentum bereichert die Städte, doch es verschließt die Türen der Hallen vor jenen, die sich die jahrelange Vorbereitung nicht leisten können."

 # --- Government reforms ---
 cc_varna_order_reform: "Die Varna-Ordnung"
 cc_varna_order_reform_desc: "Die vierfache Ordnung der Gesellschaft als Regierungsprinzip kodifizieren. Die Hierarchie ist weitgehend zufrieden und das Reich gewinnt einen zusätzlichen Herrschaftsweg – doch die soziale Mobilität erstarrt und die Verwaltung wird starr."
 cc_imperial_examination_reform: "Die kaiserlichen Prüfungen"
 cc_imperial_examination_reform_desc: "Das Keju zum Rückgrat des Staates machen. Eine riesige, gebildete Bürokratie, die durch Prüfungen hervorgegangen ist, regiert fähig und fördert das Wissen, und das Reich gewinnt einen zusätzlichen Herrschaftsweg – doch der eng gefasste klassische Lehrplan drosselt die soziale Mobilität und macht die Rekrutierung von Beamten langsam und kostspielig."

 # --- Reform-chain modifiers ---
 STATIC_MODIFIER_NAME_cc_caste_upheaval: "Kasten-Umwälzung"
 cc_caste_upheaval_desc: "Die alte Hierarchie wird eingerissen. Für eine Weile gerät die Gesellschaft in Aufruhr – Bevölkerungsgruppen steigen weitaus schneller in neue Stände auf als zuvor, doch die Umbrüche schüren Unruhen und belasten die Verwaltung."
 STATIC_MODIFIER_NAME_cc_caste_reformed: "Reformierte Gesellschaftsordnung"
 cc_caste_reformed_desc: "Die Geburt bestimmt nicht länger den Stand. Mit dem Wegfall der alten Privilegien findet Talent seinen Platz und die Bevölkerung kann frei aufsteigen."
 STATIC_MODIFIER_NAME_cc_keju_upheaval: "Prüfungs-Umwälzung"
 cc_keju_upheaval_desc: "Das Prüfungsmonopol wird abgebaut. Für eine Weile befindet sich die Bürokratie im Wandel – Aufstiegschancen eröffnen sich dramatisch, doch die Umbrüche schüren Unruhen und verunsichern die Ministerien."
 STATIC_MODIFIER_NAME_cc_keju_reformed: "Reformierte Bürokratie"
 cc_keju_reformed_desc: "Ämter sind nicht länger das Vorrecht des Prüfungsadels. Eine breitere, offenere Verwaltung lässt Talent aufsteigen und beschleunigt sowohl das Lernen als auch die Beförderung."

 # --- cc_caste.1: Reform the Caste Order ---
 cc_caste.1.title: "Die Kastenordnung reformieren"
 cc_caste.1.desc: "Seit Jahrhunderten ist die Geburt das Schicksal: Priester, Krieger, Kaufmann und Arbeiter, jeder an die Pflichten seiner Kaste gebunden. Reformer und neue Ideen drücken gegen die alte Varna-Ordnung. Sie zu lockern würde den Niedriggeborenen den Aufstieg ermöglichen – und die Fundamente erschüttern, auf denen das Reich ruht."
 cc_caste.1.a: "Die Ordnung schrittweise lockern – Reformen und Sanskritisierung ihre Wirkung entfalten lassen."
 cc_caste.1.b: "Das Kastensystem vollständig abschaffen – die Tore zum Aufstieg weit öffnen."
 cc_caste.1.c: "Die Varna-Ordnung hat uns gut gedient. Wir sollten an ihr festhalten."

 # --- cc_keju.1: Reform the Examinations ---
 cc_keju.1.title: "Die Prüfungen reformieren"
 cc_keju.1.desc: "Das Keju hat unsere Ministerien über Generationen hinweg mit Gelehrten gefüllt – und den Zugang zu Ämtern für den niederen Adel beschränkt, der als Einziger sich die jahrelangen Studien leisten kann. Reformer drängen auf einen breiteren Weg in den Staatsdienst. Ihn zu öffnen, würde neue Talente in den Staat ziehen, jedoch auf Kosten der Ordnung, die der Adel lange Zeit bewahrt hat."
 cc_keju.1.a: "Das Curriculum erweitern – neben den Klassikern auch praktische Staatskunst zulassen."
 cc_keju.1.b: "Die Prüfungen abschaffen – Ämter sowohl für Talent als auch für Patronage öffnen."
 cc_keju.1.c: "Die Prüfungen sind der Stolz unserer Verwaltung. Behalten wir sie bei."
