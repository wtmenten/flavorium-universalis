 # ---- Court event modifiers (main_menu/common/static_modifiers/cc_pty_modifiers.txt) ----
 STATIC_MODIFIER_NAME_cc_pty_ce_confidant: "Confidente del Gobernante"
 STATIC_MODIFIER_DESC_cc_pty_ce_confidant: "Este ministro cuenta con la confianza del gobernante y habla con su autoridad."
 STATIC_MODIFIER_NAME_cc_pty_ce_minister_rule: "Gobierno por Ministro"
 STATIC_MODIFIER_DESC_cc_pty_ce_minister_rule: "Un ministro con mucha antigüedad dirige el gobierno en nombre del gobernante. El trabajo se hace, pero la autoridad de la propia corona se debilita por ello."
 STATIC_MODIFIER_NAME_cc_pty_ce_compromise: "Compromiso entre Partidos"
 STATIC_MODIFIER_DESC_cc_pty_ce_compromise: "Ministros de partidos opuestos redactaron una medida juntos y la corona la respaldó. El consejo funciona con mayor fluidez."
