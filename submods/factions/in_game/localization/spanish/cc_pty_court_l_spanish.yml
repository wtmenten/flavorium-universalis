l_spanish:
 # ---- Court events (cc_pty.80-98). Hand-written. ----

 # The Knife
 cc_pty.80.title: "Mala sangre"
 cc_pty.80.desc: "La reunión del consejo terminó en gritos. [cc_pty_ce_a.GetName], de los [ROOT.GetCountry.Custom('cc_pty_ev_a_name')], acusó a [cc_pty_ce_b.GetName], de los [ROOT.GetCountry.Custom('cc_pty_ev_b_name')], de mentir a la corona, y [cc_pty_ce_b.GetName] respondió con algo peor. Los demás ministros permanecieron en silencio. Ambos esperan ahora que la corona determine quién tenía razón."
 cc_pty.80.a: "Reprenderlos a ambos."
 cc_pty.80.b: "[cc_pty_ce_a.GetName] tenía razón."
 cc_pty.80.c: "[cc_pty_ce_b.GetName] tenía razón."
 cc_pty.80.d: "Dejar que lo resuelvan entre ellos."
 cc_pty.81.title: "Rumores de una conspiración"
 cc_pty.81.desc: "Un informante ha venido al palacio con una historia. Hombres a sueldo de [cc_pty_ce_a.GetName] han estado preguntando sobre los hábitos de [cc_pty_ce_b.GetName]: qué caminos recorren, por qué puertas salen, quién los guarda por la noche. El informante no está seguro de qué se planea, pero hay pocas dudas sobre la intención."
 cc_pty.81.a: "Arrestar a [cc_pty_ce_a.GetName]."
 cc_pty.81.b: "Advertir discretamente a [cc_pty_ce_b.GetName]."
 cc_pty.81.c: "No es una disputa de la corona."
 cc_pty.82.title: "Asesinato en la Corte"
 cc_pty.82.desc: "[cc_pty_ce_b.GetName] ha muerto, apuñalado de camino a casa desde el consejo. Los asesinos escaparon. Nadie en la corte duda de quién los envió, y los [ROOT.GetCountry.Custom('cc_pty_ev_b_name')] exigen que la corona actúe."
 cc_pty.82.a: "Cazar a los asesinos y a quien haya pagado."
 cc_pty.82.b: "Dejar que el asunto descanse."
 cc_pty.83.title: "La trama se desmorona"
 cc_pty.83.desc: "Los hombres enviados para matar a [cc_pty_ce_b.GetName] fueron capturados antes de poder actuar. Bajo interrogatorio, nombraron a su empleador: [cc_pty_ce_a.GetName]. La corte espera ver qué hará la corona con un ministro que planeó un asesinato."
 cc_pty.83.a: "Llevar a juicio a [cc_pty_ce_a.GetName]."
 cc_pty.83.b: "Enviar a [cc_pty_ce_a.GetName] al extranjero, discretamente."
 cc_pty.83.c: "Perdonar a [cc_pty_ce_a.GetName]. Nos lo agradecerán."

 # An Affair of Honour
 cc_pty.85.title: "Un asunto de honor"
 cc_pty.85.desc: "[cc_pty_ce_a.GetName], de los [ROOT.GetCountry.Custom('cc_pty_ev_a_name')], ha desafiado a [cc_pty_ce_b.GetName], de los [ROOT.GetCountry.Custom('cc_pty_ev_b_name')], a un duelo por un insulto proferido en el consejo. Los segundos han sido nombrados y el terreno elegido. Solo la corona puede detenerlo ahora."
 cc_pty.85.a: "Prohibirlo."
 cc_pty.85.b: "Permitir que se reúnan."
 cc_pty.85.c: "Lo resolverán en la mesa del consejo."
 cc_pty.86.title: "El duelo"
 cc_pty.86.desc: "[cc_pty_ce_a.GetName] y [cc_pty_ce_b.GetName] se reunieron al amanecer. [cc_pty_ce_b.GetName] fue trasladado desde el campo y murió antes del mediodía. [cc_pty_ce_a.GetName] regresó al consejo la misma semana, y los [ROOT.GetCountry.Custom('cc_pty_ev_b_name')] no lo perdonarán."
 cc_pty.86.a: "Un desperdicio de un buen ministro."

 # The Power Behind the Throne
 cc_pty.88.title: "El poder detrás del trono"
 cc_pty.88.desc: "[cc_pty_ce_a.GetName] ha servido el tiempo suficiente para conocer cada cargo y a cada funcionario, y ha empezado a emitir órdenes en nombre de [cc_pty_ce_ruler.GetName] sin preguntar primero. Las órdenes son sensatas y el trabajo se hace, pero en la corte han empezado a preguntarse quién gobierna realmente."
 cc_pty.88.a: "Recordarles quién lleva la corona."
 cc_pty.88.b: "Dejarlos gobernar. Funciona."
 cc_pty.88.c: "Destituir a [cc_pty_ce_a.GetName]."
 cc_pty.89.title: "El precio del ministro"
 cc_pty.89.desc: "[cc_pty_ce_a.GetName] ha dirigido el gobierno durante años y ahora quiere algo a cambio: cargos para los [ROOT.GetCountry.Custom('cc_pty_ev_a_name')], desde la tesorería hasta los tribunales provinciales. Los otros partidos están observando."
 cc_pty.89.a: "Darles los cargos."
 cc_pty.89.b: "Rechazar y retomar las riendas."
 cc_pty.89.c: "Destituir a [cc_pty_ce_a.GetName] de su cargo."

 # Across the Aisle
 cc_pty.91.title: "Al otro lado del pasillo"
 cc_pty.91.desc: "[cc_pty_ce_a.GetName], de los [ROOT.GetCountry.Custom('cc_pty_ev_a_name')], y [cc_pty_ce_b.GetName], de los [ROOT.GetCountry.Custom('cc_pty_ev_b_name')], no coinciden en casi nada; sin embargo, han presentado al consejo una medida que redactaron juntos. Ninguno de los dos partidos está contento, pero ambos han dicho que la aceptarán si la corona lo hace."
 cc_pty.91.a: "Apoyar su compromiso."
 cc_pty.91.b: "Adoptarlo como una idea propia de la corona."
 cc_pty.91.c: "Archivarlo."
 cc_pty.92.title: "Una amistad improbable"
 cc_pty.92.desc: "Desde que su medida fue aprobada, [cc_pty_ce_a.GetName] y [cc_pty_ce_b.GetName] han sido vistos cenando juntos y paseando por los jardines del palacio. Sus partidos refunfuñan, pero el consejo rara vez ha funcionado mejor."
 cc_pty.92.a: "Honrarlos a ambos."
 cc_pty.92.b: "Que su ejemplo hable por sí mismo."

 # A Friend at Court
 cc_pty.94.title: "Un amigo en la corte"
 cc_pty.94.desc: "[cc_pty_ce_ruler.GetName] y [cc_pty_ce_a.GetName] han empezado a conversar mucho después de que el consejo se levante: sobre el reino, sobre libros, sobre nada en particular. Es raro que un gobernante tenga a alguien con quien hablar con franqueza."
 cc_pty.94.a: "Tomar a [cc_pty_ce_a.GetName] en confianza."
 cc_pty.94.b: "Un gobernante debe mantener una distancia adecuada."
 cc_pty.95.title: "Celos en la Corte"
 cc_pty.95.desc: "[cc_pty_ce_b.GetName], de los [ROOT.GetCountry.Custom('cc_pty_ev_b_name')], se ha quejado abiertamente de que [cc_pty_ce_a.GetName] tiene la confianza del gobernante, y que las decisiones se toman durante la cena en lugar de en el consejo. Otros empiezan a decir lo mismo."
 cc_pty.95.a: "Apoyar a [cc_pty_ce_a.GetName]."
 cc_pty.95.b: "Tomar cierta distancia."

 # Loyalty Tested
 cc_pty.97.title: "Lealtad a Prueba"
 cc_pty.97.desc: "El [ROOT.GetCountry.Custom('cc_pty_ev_a_name')] se ha vuelto contra el gobierno y ha pedido a sus ministros que se mantengan alejados del consejo en señal de protesta. [cc_pty_ce_a.GetName] se negó y vino a trabajar como de costumbre. Su partido no lo ha tomado bien."
 cc_pty.97.a: "Honrar a [cc_pty_ce_a.GetName] públicamente."
 cc_pty.97.b: "Recompensar a [cc_pty_ce_a.GetName] en privado."
 cc_pty.97.c: "Un servidor leal no necesita recompensa."

