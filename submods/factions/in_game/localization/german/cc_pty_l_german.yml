l_german:
 # Flavorium Universalis - Factions (hand-written keys)
 # Party names, agendas, per-party modifiers and action names are generated into
 # cc_pty_catalogue_l_english.yml by tools/generate_factions.py.

 # ---- Situation ----
 cc_pty_legend_realm: "Unser Reich"
 cc_pty_legend_lt_low: "Liberales Denken: vorhanden"
 cc_pty_legend_lt_mid: "Liberales Denken: 30 oder mehr"
 cc_pty_legend_lt_high: "Liberales Denken: 60 oder mehr"
 cc_pty_map_tt_realm: "Die Politik dieses Reiches ist in Parteien organisiert."
 cc_pty_map_tt_lt: "Das liberale Denken wächst hier mit der Alphabetisierung, dem Hof, der Aufklärung und einer liberalen Gesellschaft und sinkt, während die absolutistische Partei das Reich führt."

 # ---- Panel ----
 CC_PTY_HEADER: "Die Kammer"
 CC_PTY_HEADER_DESC: "Vier Parteien sitzen in der Kammer. Welche vier dies sind, hängt von der Regierung, dem Alter und den Ständen ab; die Besetzung wird alle fünfzehn bis fünfundzwanzig Jahre überprüft.\n\n#T Sitze#! resultieren aus dem Reich selbst: Jede Megalopolis zählt als 3, jede Stadt als 2, jede Kleinstadt als 1 und jede ländliche Siedlung als ein Fünftel; die Sitze jedes Ortes werden unter den Ständen entsprechend ihrer dortigen Macht aufgeteilt. Eine Partei übernimmt die Sitze ihrer Stände. Die Kammer umfasst 20 bis 84 Sitze, unabhängig von der Größe des Reiches; Sitze sind also ein Anteil und keine absolute Anzahl an Orten. Jeder Minister im Kabinett bringt seiner Partei zudem 2 ernannte Sitze ein, bis zu maximal der Hälfte der Kammer. Die #T Macht#! einer Partei ist ihr Anteil an den Sitzen.\n\nDie #T Zufriedenheit#! wird alle zwei bis vier Jahre überprüft und bewegt sich zur Hälfte in Richtung dessen, was die Partei erwartet, was von ihrem Stand und ihren Ministern abhängt. Zufriedene Parteien helfen dem Reich und lassen ihre Minister härter arbeiten; verärgerte tun das Gegenteil, wobei der Effekt mit steigender Sitzanzahl zunimmt.\n\nDie #T Kriegspartei#!, die #T Regionalpartei#! und die #T Liberalpartei#! müssen kontrolliert werden: Bleiben sie bei einem Anteil von einem Fünftel der Sitze verärgert, eskaliert dies zu einem Putsch, einer Revolte oder einem Aufstand."
 CC_PTY_LABEL_POWER: "Macht"
 CC_PTY_LABEL_SATISFACTION: "Zufriedenheit"
 CC_PTY_LABEL_MEMBERS: "Minister"
 CC_PTY_LABEL_AGENDA: "Agenda:"
 CC_PTY_LABEL_CABINET: "Kabinett:"
 CC_PTY_LABEL_LIBERAL_THOUGHT: "Liberales Denken"
 CC_PTY_POWER_TT: "Der Anteil dieser Partei an der kombinierten Stärke aller vier Parteien. Stärke ergibt sich aus der Macht ihrer Stände, plus 8 für jeden ihrer Minister im Kabinett. Ein Angriff reduziert sie für fünf Jahre um 40%."
 CC_PTY_SAT_TT: "Von -100 bis 100. Alle zwei bis vier Jahre überprüft; der Wert bewegt sich dabei auf die Hälfte dessen zu, was die Partei erwartet (die Zahl nach dem Pfeil). Die Ernennung oder Entlassung eines Ministers der Partei verschiebt den Wert sofort um 10."
 CC_PTY_MEMBERS_TT: "Minister im Kabinett, die dieser Partei angehören."
 CC_PTY_AGENDA_TT: "Eine Partei mit einem Viertel der Sitze oder mehr legt alle fünf bis zwölf Jahre eine Agenda fest und gibt der Regierung sechs Jahre Zeit, diese zu erfüllen. Erfüllt: +30 Zufriedenheit und politischer Einfluss in Höhe der Hälfte der Sitze der Partei. Nicht erfüllt: -25."
 CC_PTY_DOMINANT: "#P Führend#!"
 CC_PTY_DOMINANT_TT: "Die stärkste Partei mit 30% Macht oder mehr. Die Gesellschaft bewegt sich in ihrer Richtung: halb so schnell unter einem ausgewogenen Kabinett, nochmals halb so schnell, wenn es zudem ein einseitig besetztes Kabinett ist."
 CC_PTY_MOOD_PLEASED: "#P Zufrieden#!"
 CC_PTY_MOOD_PLEASED_TT: "Zufriedenheit über 30. Das Reich erhält den Wohlwollens-Modifikator dieser Partei, skaliert nach ihrer Macht und Zufriedenheit, und ihre Minister arbeiten 5% effizienter."
 CC_PTY_MOOD_CONTENT: "Zufrieden"
 CC_PTY_MOOD_CONTENT_TT: "Zufriedenheit von -20 bis 30. In beide Richtungen kein Effekt."
 CC_PTY_MOOD_DISCONTENT: "#N Unzufrieden#!"
 CC_PTY_MOOD_DISCONTENT_TT: "Zufriedenheit von -50 bis -20. Das Reich erhält den Unzufriedenheits-Modifikator dieser Partei, skaliert nach deren Macht und Zufriedenheit, und seine Minister arbeiten 10% schlechter."
 CC_PTY_MOOD_ANGRY: "#N Verärgert#!"
 CC_PTY_MOOD_ANGRY_TT: "Zufriedenheit unter -50. Das Reich erhält den Unzufriedenheits-Modifikator dieser Partei, skaliert nach ihrer Macht und Zufriedenheit, und ihre Minister arbeiten 20% schlechter."
 CC_PTY_ESC_WARN: "#N Eskalierend#!"
 CC_PTY_ESC_WARN_TT: "Diese Partei ist zornig und besitzt 20% Macht oder mehr, und sie bewegt sich auf offenen Trotz zu. Jede Überprüfung, die so verbracht wird, ist ein Schritt: zuerst eine Warnung, dann Unruhen, dann das Ergebnis. Erhöhe ihre Zufriedenheit über -50 oder senke ihre Macht unter 20%, um sie wieder einen Schritt zurückzustufen."
 CC_PTY_COMP_STACKED: "Gestapelt"
 CC_PTY_COMP_STACKED_TT: "Eine Partei hält mehr als die Hälfte der Kabinettssitze. +5 % Kabinetteffizienz und +10 % politischer Einflussgewinn, und das Goodwill und der Druck dieser Partei sind stärker. Jede andere Partei erwartet 10 weniger Zufriedenheit, und die Rivalität am Hof wächst."
 CC_PTY_COMP_BALANCED: "Ausgeglichen"
 CC_PTY_COMP_BALANCED_TT: "Keine Partei hält mehr als 40 % der Sitze und mindestens drei sind besetzt. +0,5 monatlicher politischer Einfluss, Stabilität ist günstiger, Bestechungen und Angriffe kosten 25 % weniger, und das Zufriedenheitsziel keiner Partei fällt unter -20. Goodwill-Boni sind 25 % schwächer und die Gesellschaft bewegt sich nur halb so schnell."
 CC_PTY_COMP_MIXED: "Gemischt"
 CC_PTY_COMP_MIXED_TT: "Weder konzentriert noch ausgewogen. Weniger als drei Sitze oder kein klares Muster."
 CC_PTY_TERMLIMITS: "#T Amtszeitbeschränkungen#!"
 CC_PTY_TERMLIMITS_TT: "Solange die Reformpartei oder die Liberalpartei das Reich führt, scheidet ein Minister, der zehn Jahre gedient hat, bei der nächsten Überprüfung aus dem Amt aus und kann für zehn Jahre nicht zurückkehren."
 CC_PTY_LIBERAL_THOUGHT_TT: "Der Durchschnitt des liberalen Denkens in der Hauptstadt und den Städten, dargestellt auf der Karte durch diese Situation. Er wächst mit der Alphabetisierung, der Aufklärung und einer liberalen Gesellschaft. Bei 50 bildet sich die Liberale Partei."
 CC_PTY_BTN_BRIBE: "Bestechen"
 CC_PTY_BTN_ATTACK: "Angreifen"
 CC_PTY_BTN_FAVOUR: "Gunst"

 # ---- Action requirements ----
 cc_pty_tt_bribe_cooldown: "Diese Partei wurde vor weniger als zwei Jahren bestochen"
 cc_pty_tt_attack_cooldown: "Diese Partei wurde vor weniger als fünf Jahren angegriffen"
 cc_pty_tt_attack_power: "Die Partei besitzt mindestens 10% Macht"
 cc_pty_tt_favour_cooldown: "Diese Partei hat vor weniger als fünf Jahren einen Gefallen gewährt"
 cc_pty_tt_favour_sat: "Die Zufriedenheit der Partei liegt bei mindestens 10"

 # ---- Rebels ----
 cc_pty_regional_rebels: "Provinzialbund"

 # ---- Disasters ----
 cc_pty_praetorian_coup: "Der Offiziersputsch"
 cc_pty_praetorian_coup_desc: "Die Kriegspartei hat die Geduld verloren. Offiziere haben die Wachstuben besetzt, Minister haben Angst, nach Hause zu gehen, und kein Regierungsbefehl wird ausgeführt, bevor die Armee ihm zustimmt. Dies endet, wenn die Kriegspartei wieder zufrieden ist, oder nach fünf Jahren."
 cc_pty_liberal_uprising: "Der Liberale Aufstand"
 cc_pty_liberal_uprising_desc: "Die liberalen Clubs sind auf den Straßen. Sie wollen eine Verfassung, Einschränkungen der Krone und ein Mitspracherecht in der Regierung, und sie werden nicht ohne einen Teil davon nach Hause gehen. Dies endet, wenn die Liberale Partei wieder zufrieden ist, oder nach fünf Jahren."

 # ---- Events ----
 cc_pty.10.title: "Neue Parteien"
 cc_pty.10.desc: "Die alten Bündnisse sind zerbrochen und neue haben an ihrer Stelle Form angenommen. Die Politik des Reiches ist nun gespalten zwischen den [ROOT.GetCountry.Custom('cc_pty_name_1')], den [ROOT.GetCountry.Custom('cc_pty_name_2')], den [ROOT.GetCountry.Custom('cc_pty_name_3')] und den [ROOT.GetCountry.Custom('cc_pty_name_4')].\n\nParteien, die überlebt haben, behalten ihren Status. Neue beginnen ohne welchen, und Minister, deren Partei sich aufgelöst hat, werden eine andere finden."
 cc_pty.10.a: "Wir werden ihre Namen erfahren."
 cc_pty.20.title: "Eine Agenda"
 cc_pty.20.desc: "Die Anführer der [ROOT.GetCountry.Custom('cc_pty_event_name')] haben der Regierung ihre Forderungen geschickt. Vor allem wollen sie eine Sache:\n\n#T [ROOT.GetCountry.Custom('cc_pty_event_agenda')]#!\n\nSie geben uns sechs Jahre Zeit. Wenn es erledigt wird, werden sie sich daran erinnern. Wenn nicht, werden sie das ebenfalls tun."
 cc_pty.20.a: "Wir werden sehen, was getan werden kann."
 cc_pty.20.a.tt: "Erfüllen Sie die Agenda innerhalb von sechs Jahren für +30 Zufriedenheit dieser Partei. Bei Nichterfüllung werden 25 abgezogen."
 cc_pty.20.b: "Die Regierung nimmt keine Befehle entgegen."
 cc_pty.30.title: "Übertritt zur Gegenseite"
 cc_pty.30.desc: "[cc_pty_defector.GetName] hat genug von der [ROOT.GetCountry.Custom('cc_pty_defect_from_name')]. Ihr Streit mit der Regierung ist zu ihrem eigenen geworden, und sie wurden dabei beobachtet, wie sie mit den Führern der [ROOT.GetCountry.Custom('cc_pty_defect_to_name')] speisten. Sie haben gefragt, ob die Regierung Einwände hätte."
 cc_pty.30.a: "Lass sie gehen, wohin sie wollen."
 cc_pty.30.b: "Erinnere sie daran, wer sie ernannt hat."
 cc_pty.30.c: "Dann können sie ebenfalls das Kabinett verlassen."
 cc_pty.40.title: "Die Offiziere rücken aus"
 cc_pty.40.desc: "Die Kriegspartei hat aufgehört zu bitten. Ihr treue Offiziere haben die Wachstuben und Arsenale besetzt, und ihre Sprecher haben der Regierung Bedingungen präsentiert. Bisher wurde niemand verletzt."
 cc_pty.40.a: "Geben Sie den Offizieren, was sie wollen."
 cc_pty.40.b: "Verhaftet die Anführer."
 cc_pty.41.title: "Die Provinzen lehnen sich auf"
 cc_pty.41.desc: "Die Provinzherren haben einen Bund gegen die Hauptstadt geschlossen. Sie wollen ihre alten Rechte zurück, ihre eigenen Richter und ihre eigenen Steuern, und sie rekrutieren Männer, um dies zu erzwingen."
 cc_pty.41.a: "Das Reich wird nicht geteilt werden."
 cc_pty.41.a.tt: "Ein Rebellenbund nimmt etwa ein Fünftel unserer Provinzen ein, niemals die der Hauptstadt, und ein Bürgerkrieg beginnt."
 cc_pty.41.b: "Gewähren Sie den Provinzen ihre Rechte."
 cc_pty.42.title: "Die Clubs gehen auf die Straße"
 cc_pty.42.desc: "Die Clubs der Liberalen Partei haben ihre Mitglieder mobilisiert. Auf den Plätzen drängen sich Menschenmengen, an jeder Tür hängen gedruckte Forderungen und die Soldaten sind sich nicht sicher, auf welcher Seite sie stehen."
 cc_pty.42.a: "Räumen Sie einige Reformen ein."
 cc_pty.42.b: "Schließen Sie die Clubs und verhaften Sie die Anführer."
 cc_pty.43.title: "Die Untertanen entfremden sich"
 cc_pty.43.desc: "Die Regionalpartei hat ihren Streit mit der Hauptstadt zu unseren Untertanen getragen, und diese haben zugehört. Ihre Gerichte antworten langsamer auf unsere Briefe und sprechen schneller untereinander."
 cc_pty.43.a: "Lass sie schmollen."
 cc_pty.43.b: "Für ihr Wohlwollen bezahlen."
 cc_pty.45.title: "Die Offiziere ziehen sich zurück"
 cc_pty.45.desc: "Die Offiziere sind in ihre Kasernen zurückgekehrt. Unabhängig davon, was versprochen oder angedroht wurde, regiert die Regierung wieder."
 cc_pty.45.a: "Gut."
 cc_pty.46.title: "Die Straßen sind ruhig"
 cc_pty.46.desc: "Die Menschenmengen sind nach Hause gegangen und die Clubs sind dazu zurückgekehrt, untereinander zu streiten."
 cc_pty.46.a: "Gut."
 cc_pty.50.title: "Die Liberale Partei"
 cc_pty.50.desc: "Das liberale Denken hat sich in unseren Städten so weit verbreitet, dass es nun eine eigene Partei hat. Sie fordert eine konstitutionelle Regierung, Einschränkungen der Krone und Ämter, die nach Verdienst vergeben werden. Sie wird sofort einen Platz unter den Parteien des Reiches einnehmen."
 cc_pty.50.a: "Wir werden uns mit ihnen auseinandersetzen müssen."
 cc_pty.60.title: "Amtszeitbeschränkungen"
 cc_pty.60.desc: "Die Reformer führen nun das Reich an und haben ihren Willen bekommen: Kein Minister soll sein Amt auf Lebenszeit innehaben. Von nun an tritt ein Minister, der zehn Jahre gedient hat, bei der nächsten Überprüfung zurück und darf für weitere zehn Jahre nicht zurückkehren."
 cc_pty.60.a: "So sei es."
 cc_pty.61.title: "Amtszeitbeschränkungen aufgehoben"
 cc_pty.61.desc: "Die Reformer führen das Reich nicht mehr an, und die Regel, dass Minister nach zehn Jahren zurücktreten, ist hinfällig."
 cc_pty.61.a: "So sei es."
 STATIC_MODIFIER_NAME_cc_pty_member_content: "Partei zufrieden"
 STATIC_MODIFIER_DESC_cc_pty_member_content: "Die Partei dieses Ministers ist mit der Regierung zufrieden, und der Minister arbeitet dementsprechend."
 STATIC_MODIFIER_NAME_cc_pty_member_discontent: "Partei unzufrieden"
 STATIC_MODIFIER_DESC_cc_pty_member_discontent: "Die Partei dieses Ministers ist mit der Regierung unzufrieden. Der Minister tut nur das Nötigste."
 STATIC_MODIFIER_NAME_cc_pty_member_angry: "Partei verärgert"
 STATIC_MODIFIER_DESC_cc_pty_member_angry: "Die Partei dieses Ministers ist der Regierung gegenüber offen feindselig, und es wird erwartet, dass der Minister dies zeigt."
 STATIC_MODIFIER_NAME_cc_pty_comp_stacked: "Einseitiges Kabinett"
 STATIC_MODIFIER_DESC_cc_pty_comp_stacked: "Eine Partei hält mehr als die Hälfte der Kabinettssitze. Das Kabinett arbeitet wie eine Einheit, und die anderen Parteien bemerken dies."
 STATIC_MODIFIER_NAME_cc_pty_comp_balanced: "Ausgeglichenes Kabinett"
 STATIC_MODIFIER_DESC_cc_pty_comp_balanced: "Keine Partei hält mehr als 40 % der Kabinettssitze. Jede Partei hat eine Stimme, und keine fühlt sich ausgeschlossen."
 STATIC_MODIFIER_NAME_cc_pty_regional_concession: "Provinzialrechte"
 STATIC_MODIFIER_DESC_cc_pty_regional_concession: "Den Provinzen wurden ihre alten Rechte gewährt, um einen Aufstand zu beenden, weshalb die Autorität der Hauptstadt nun weniger weit reicht."
 cc_pty_tt_bribe_effect: "Die Zufriedenheit dieser Partei steigt um 25."
 cc_pty_tt_attack_effect: "Die Stärke dieser Partei sinkt für fünf Jahre um 40 % und ihre Zufriedenheit um 30. Ihr gegenüberstehende Parteien gewinnen 10 Zufriedenheit."
 cc_pty_tt_favour_effect: "Wir erhalten den Gefallen dieser Partei für fünf Jahre. Ihre Zufriedenheit sinkt um 15."
 cc_pty_tt_refuse_agenda: "Die Partei gibt ihre Agenda auf und verliert 15 Zufriedenheit."
 cc_pty_tt_defect: "[cc_pty_defector.GetName] schließt sich der [ROOT.GetCountry.Custom('cc_pty_defect_to_name')] an."
 cc_pty_tt_military_concede: "Die Kriegspartei gewinnt 60 Zufriedenheit."
 cc_pty_tt_military_purge: "Die Stärke der Kriegspartei sinkt für zehn Jahre um 40 % und sie verliert 20 Zufriedenheit."
 cc_pty_tt_liberal_concede: "Die Liberale Partei gewinnt 60 Zufriedenheit."
 cc_pty_tt_liberal_purge: "Die Stärke der Liberalen Partei sinkt für zehn Jahre um 40 % und sie verliert 20 Zufriedenheit."
 cc_pty_tt_regional_concede: "Die Regionalpartei gewinnt 50 Zufriedenheit."
 cc_pty_tt_regional_sat_30: "Die Regionalpartei gewinnt 30 Zufriedenheit."
 cc_pty_tt_regional_sat_40: "Die Regionalpartei gewinnt 40 Zufriedenheit."
 CC_PTY_LABEL_TOP_AGENDA: "Agenda:"
 CC_PTY_TOP_AGENDA_TT: "Die Agenda der führenden Partei oder, falls diese keine hat, die einer anderen Partei. Jede Karte zeigt die Agenda ihrer eigenen Partei."
 CC_PTY_NO_TOP_AGENDA: "Keine Partei hat eine Agenda"
 CC_PTY_LABEL_SEATS: "Sitze"
 CC_PTY_CHAMBER_TT: "Die Größe der Kammer. Sie wächst mit dem Reich, von 20 Sitzen bis zu maximal 84, und wird unter den Parteien entsprechend den Sitzen aufgeteilt, die ihre Stände im gesamten Reich halten."
 CC_PTY_SEATS_TT: "Von dieser Partei gehaltene Sitze: jene, die ihre Stände im gesamten Reich halten, plus 2 für jeden ihrer Minister im Kabinett. Ihre Macht ist ihr Anteil an der Kammer."
 CC_PTY_CARD_SELECT_TT: "Wähle diese Partei aus. Die untenstehenden Schaltflächen wirken auf die ausgewählte Partei."
 CC_PTY_LABEL_LEADER: "Anführer"
 CC_PTY_NO_LEADER: "Kein Anführer"
 CC_PTY_NO_LEADER_TT: "Die Partei hat keinen Minister im Kabinett. In unserem Reich tritt bei der nächsten Überprüfung ein neuer Anführer hervor."
 CC_PTY_SELECT_HINT: "Wähle eine Partei aus, um eine Aktion durchzuführen."
 CC_PTY_BTN_APPOINT: "Anführer ernennen"
 CC_PTY_BTN_CONCEDE: "Einlenken"
 CC_PTY_BTN_ELECTION: "Wahlen ausrufen"
 cc_pty_election: "Eine Wahl ausrufen"
 cc_pty_election_desc: "Löse die Kammer auf und zähle die Sitze sofort neu, anstatt erst bei der nächsten Überprüfung. Parteien, die ihren Halt verloren haben, können ersetzt werden. Einmal alle zehn Jahre."
 cc_pty_tt_appoint_effect: "Der Parteiführer nimmt einen Sitz im Kabinett ein und ersetzt den am wenigsten dienstälteren Minister einer anderen Partei, sofern kein Sitz frei ist."
 cc_pty_tt_concede_effect: "Die Agenda gilt als erfüllt: Diese Partei gewinnt 30 Zufriedenheit und wir gewinnen politischen Einfluss in Höhe der Hälfte ihrer Sitze. Jede Partei, die ihr gegenübersteht, verliert 10."
 cc_pty_tt_election_effect: "Die Sitze werden erneut gezählt und die Parteien werden nun überprüft. Wir gewinnen 2 politischen Einfluss für jeden Sitz, den die Partei des Kabinettschefs gewinnt, und verlieren 1 für jeden Sitz, den sie verliert."
 cc_pty_tt_appoint_leader: "Die Partei hat einen lebenden Anführer"
 cc_pty_tt_appoint_not_seated: "Der Anführer ist noch nicht im Kabinett"
 cc_pty_tt_concede_agenda: "Die Partei hat eine Agenda"
 cc_pty_tt_election_cooldown: "In den letzten zehn Jahren wurden keine Wahlen ausgerufen"
 cc_pty_factions: "Fraktionen"
 cc_pty_factions_desc: "Die Parteien des Reiches, wie viel Macht jede einzelne besitzt und wie zufrieden sie mit ihrer Behandlung ist."
 CC_PTY_FX_HEADER: "Effekte der ausgewählten Partei"
 CC_PTY_FX_HEADER_TT: "Was die ausgewählte Partei derzeit im Reich bewirkt. Jede Partei gewährt ihre Stellung durch den Besitz von Sitzen; ihre Stimmung, ihre Führung und jegliche gewährten Gunst fügen weiteres hinzu."
 CC_PTY_FX_STRENGTH_TT: "Aktuelle Stärke. 100% entspricht dem aufgeführten Wert: beim Ansehen einem Viertel der Kammer; bei Stimmungen einem Viertel der Kammer mit einer Zufriedenheit von 50 oder -50."
 CC_PTY_FX_STANDING: "Ansehen"
 CC_PTY_FX_STANDING_TT: "Gewährt durch jede Partei mit einem Zehntel der Sitze oder mehr, unabhängig von ihrer Stimmung. Skaliert mit ihrem Anteil an der Kammer."
 CC_PTY_FX_MARGINAL: "#N Marginalisiert#!"
 CC_PTY_FX_MARGINAL_TT: "Die Partei hält weniger als ein Zehntel der Kammer, und der Stand hinter ihr fühlt sich nicht gehört."
 CC_PTY_FX_GOODWILL: "#P Wohlwollen#!"
 CC_PTY_FX_DISCONTENT: "#N Unzufrieden#!"
 CC_PTY_FX_PUSH: "Aufsteigend"
 CC_PTY_FX_FAVOUR: "Gunst"
 CC_PTY_FX_FAVOUR_TT: "Ein Gefallen, den diese Partei auf Anfrage gewährt hat. Dauert fünf Jahre."
 CC_PTY_TARGET_TT: "Was die Partei erwartet und in welche Richtung sich ihre Zufriedenheit bei der nächsten Überprüfung bewegt:\n- die Stimmung ihres Standes\n- +15 für einen Minister im Kabinett, +25 für zwei oder mehr\n- -20 ohne Minister, während sie ein Fünftel der Sitze hält\n- +15, wenn das Oberhaupt des Kabinetts ihr angehört\n- +10, wenn der Herrscher ihr angehört\n- in einem einseitig besetzten Kabinett +10 für die Partei, die es führt, und -10 für die anderen\n- in einem ausgewogenen Kabinett niemals unter -20"
 CC_PTY_MAJORITY: "#P Arbeitsmehrheit#!"
 CC_PTY_MAJORITY_TT: "Die Partei des Kabinettschefs hält 40 % der Sitze oder mehr: +15 % politischer Einflussgewinn."
 CC_PTY_HUNG: "#N Zersplitterte Kammer#!"
 CC_PTY_HUNG_TT: "Keine Partei hält 30 % der Sitze: -10 % politischer Einflussgewinn."
 CC_PTY_LABEL_LEADERS_IN: "Amtierende Führungspersönlichkeiten:"
 CC_PTY_LEADERS_IN_TT: "Parteien, deren Anführer im Kabinett sitzt. Jede gibt +0,05 monatlichen politischen Einfluss."
 STATIC_MODIFIER_NAME_cc_pty_leaders_in_office: "Amtierende Parteiführer"
 STATIC_MODIFIER_DESC_cc_pty_leaders_in_office: "Parteiführer, die im Kabinett sitzen, bringen die Unterstützung ihrer Parteien mit. Skaliert mit der Anzahl der Parteien, deren Anführer ein Amt bekleidet."
 STATIC_MODIFIER_NAME_cc_pty_working_majority: "Arbeitsmehrheit"
 STATIC_MODIFIER_DESC_cc_pty_working_majority: "Die Partei des Kabinettschefs hält mindestens 40 % der Kammer, und die Regierungsgeschäfte werden vorangetrieben."
 STATIC_MODIFIER_NAME_cc_pty_hung_chamber: "Zersplitterte Kammer"
 STATIC_MODIFIER_DESC_cc_pty_hung_chamber: "Keine Partei hält auch nur 30 % der Kammer, und jede Maßnahme muss ausgehandelt werden."
