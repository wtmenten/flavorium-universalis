 MODIFIER_TYPE_NAME_cc_pty_party_royalist: "Mitglied der Royalisten"
 MODIFIER_TYPE_DESC_cc_pty_party_royalist: "Dieser Charakter gehört zu den Royalisten, die für die Autorität der Krone stehen, oder des Staates, wo es keine Krone gibt."
 MODIFIER_TYPE_NAME_cc_pty_party_aristocratic: "Mitglied der Magnaten"
 MODIFIER_TYPE_DESC_cc_pty_party_aristocratic: "Dieser Charakter gehört zu den Magnaten, die sich für den Adel sprechen."
 MODIFIER_TYPE_NAME_cc_pty_party_mercantile: "Mitglied der Kaufleute"
 MODIFIER_TYPE_DESC_cc_pty_party_mercantile: "Dieser Charakter gehört zu den Kaufleuten, die sich für die Bürger und die Handelshäuser sprechen."
 MODIFIER_TYPE_NAME_cc_pty_party_clerical: "Mitglied der Kleriker"
 MODIFIER_TYPE_DESC_cc_pty_party_clerical: "Dieser Charakter gehört zu den Klerikalisten, die sich für den Klerus sprechen."
 MODIFIER_TYPE_NAME_cc_pty_party_military: "Mitglied der Falken"
 MODIFIER_TYPE_DESC_cc_pty_party_military: "Dieser Charakter gehört zu den Falken, die sich für die Offiziere und das Heer sprechen."
 MODIFIER_TYPE_NAME_cc_pty_party_agrarian: "Mitglied der Agrarier"
 MODIFIER_TYPE_DESC_cc_pty_party_agrarian: "Dieser Charakter gehört zu den Agrariern, die sich für die Bauernschaft und das Land sprechen."
 MODIFIER_TYPE_NAME_cc_pty_party_reformist: "Mitglied der Reformer"
 MODIFIER_TYPE_DESC_cc_pty_party_reformist: "Dieser Charakter gehört zu den Reformern, die einen besser geführten, moderneren Staat anstreben."
 MODIFIER_TYPE_NAME_cc_pty_party_absolutist: "Mitglied der Absolutisten"
 MODIFIER_TYPE_DESC_cc_pty_party_absolutist: "Dieser Charakter gehört zu den Absolutisten, die wollen, dass alle Macht in der Krone gebündelt wird."
 MODIFIER_TYPE_NAME_cc_pty_party_regionalist: "Mitglied der Partikularisten"
 MODIFIER_TYPE_DESC_cc_pty_party_regionalist: "Dieser Charakter gehört zu den Partikularisten, die sich für die Provinzen und Vasallenlande gegen die Hauptstadt aussprechen."
 MODIFIER_TYPE_NAME_cc_pty_party_colonial: "Mitglied der Kolonialisten"
 MODIFIER_TYPE_DESC_cc_pty_party_colonial: "Dieser Charakter gehört zu den Kolonialisten, die sich für die Kolonien und die mit ihnen handelnden Kompanien sprechen."
 MODIFIER_TYPE_NAME_cc_pty_party_liberal: "Mitglied der Liberalen"
 MODIFIER_TYPE_DESC_cc_pty_party_liberal: "Dieser Charakter gehört zu den Liberalen, die eine konstitutionelle Regierung und die Bürgerrechte fordern."
 cc_pty_concern_royalist_1: "Die Macht der Krone"
 cc_pty_concern_royalist_1_desc: "Wenn die Krone 35% der Macht des Reiches hält, ist dies neutral. Jeder weitere Punkt gibt +1, bis zu +15; jeder Punkt weniger kostet 1, bis zu -15."
 cc_pty_concern_royalist_2: "Stabilität"
 cc_pty_concern_royalist_2_desc: "Stabilität 0 ist neutral. Alle 10 Stabilität in jede Richtung bringen 1,5, bis zu +15 oder bis zu -15."
 cc_pty_concern_royalist_3: "Hofausgaben"
 cc_pty_concern_royalist_3_desc: "Wird im Budget festgelegt. Die Mitte ist neutral. Höhere Ausgaben für den Hof bringen bis zu +10; das andere Ende kostet 10."
 cc_pty_concern_aristocratic_1: "Die Zufriedenheit des Adels"
 cc_pty_concern_aristocratic_1_desc: "Zufriedenheit von 50% ist neutral. Von -20 bei 0% bis +20 bei 100%. Steigern Sie diese durch Privilegien, niedrigere Steuern und Sitze im Kabinett für den Adel."
 cc_pty_concern_aristocratic_2: "Privilegien des Adels"
 cc_pty_concern_aristocratic_2_desc: "2 Privilegien sind neutral. Jedes weitere ist +4 wert, bis zu +12; jedes weniger kostet 4, bis zu -10."
 cc_pty_concern_aristocratic_3: "Steuern auf den Adel"
 cc_pty_concern_aristocratic_3_desc: "Ein Steuersatz von 30 % ist neutral. Niedrigere Steuern für den Adel erfreuen die Partei, bis zu +10; eine Erhöhung auf 55 % oder mehr kostet 10."
 cc_pty_concern_mercantile_1: "Die Zufriedenheit der Bürger"
 cc_pty_concern_mercantile_1_desc: "Zufriedenheit von 50% ist neutral. Von -20 bei 0% bis +20 bei 100%. Steigern Sie diese durch Privilegien, niedrigere Steuern und Sitze im Kabinett für die Bürger."
 cc_pty_concern_mercantile_2: "Steuern auf die Bürger"
 cc_pty_concern_mercantile_2_desc: "Ein Steuersatz von 30 % ist neutral. Niedrigere Steuern für die Bürger erfreuen die Partei, bis zu +10; eine Erhöhung auf 55 % oder mehr kostet 10."
 cc_pty_concern_mercantile_3: "Frieden und Kredit"
 cc_pty_concern_mercantile_3_desc: "+5 im Frieden ohne Kredite. Krieg kostet 8, jeder Kredit 2 und ein Staatsbankrott in den letzten zwanzig Jahren 10. Nie unter -15."
 cc_pty_concern_clerical_1: "Die Zufriedenheit des Klerus"
 cc_pty_concern_clerical_1_desc: "Zufriedenheit von 50% ist neutral. Von -20 bei 0% bis +20 bei 100%. Steigern Sie diese durch Privilegien, niedrigere Steuern und Sitze im Kabinett für den Klerus."
 cc_pty_concern_clerical_2: "Religiöse Einheit"
 cc_pty_concern_clerical_2_desc: "80 % der Bevölkerung, die die Staatsreligion teilen, sind neutral. Vollständige Einheit ist +10 wert; jeder 2 Punkte unter 80 % kosten 1, bis zu -15."
 cc_pty_concern_clerical_3: "Privilegien des Klerus"
 cc_pty_concern_clerical_3_desc: "2 Privilegien sind neutral. Jedes weitere ist +4 wert, bis zu +12; jedes weniger kostet 4, bis zu -10."
 cc_pty_concern_military_1: "Kriegsbilanz"
 cc_pty_concern_military_1_desc: "+10 während eines Krieges, +10 für einen in den letzten zehn Jahren gewonnenen Krieg, -15 für einen in den letzten zehn Jahren verlorenen Krieg und -10 nach zehn Jahren ohne Krieg. Von -20 bis +20."
 cc_pty_concern_military_2: "Armeeunterhalt"
 cc_pty_concern_military_2_desc: "Wird im Budget festgelegt. Die Mitte ist neutral. Höhere Armeeunterhaltung bringt bis zu +15; das andere Ende kostet 15."
 cc_pty_concern_military_3: "Größe der Armee"
 cc_pty_concern_military_3_desc: "Eine Armee bei 75 % ihrer erwarteten Größe ist neutral. Jeder weitere Punkt zählt 0,4, bis zu +10; jeder fehlende Punkt kostet 0,4, bis zu -15."
 cc_pty_concern_agrarian_1: "Die Zufriedenheit der Bauernschaft"
 cc_pty_concern_agrarian_1_desc: "Zufriedenheit von 50% ist neutral. Von -20 bei 0% bis +20 bei 100%. Steigern Sie diese durch Privilegien, niedrigere Steuern und Sitze im Kabinett für die Bauernschaft."
 cc_pty_concern_agrarian_2: "Steuern auf die Bauernschaft"
 cc_pty_concern_agrarian_2_desc: "Ein Steuersatz von 30 % ist neutral. Niedrigere Steuern für die Bauern gefallen der Partei, bis zu +10; eine Erhöhung auf 55 % oder mehr kostet 10."
 cc_pty_concern_agrarian_3: "Kriegsmüdigkeit"
 cc_pty_concern_agrarian_3_desc: "+5 bei keiner Kriegsmüdigkeit. Jeder Punkt Kriegsmüdigkeit kostet 1,5, bis hinunter zu -15."
 cc_pty_concern_reformist_1: "Innovative Gesellschaft"
 cc_pty_concern_reformist_1_desc: "Die Gesellschaft in der Mitte ist neutral. Vollständige Ausrichtung auf Innovation bringt +20; die entgegengesetzte Richtung kostet 20. Die stärkste Partei lenkt die Gesellschaft in ihre Richtung."
 cc_pty_concern_reformist_2: "Alphabetisierung"
 cc_pty_concern_reformist_2_desc: "Eine durchschnittliche Alphabetisierungsrate von 20 % ist neutral. Jeder Punkt darüber ist 0,3 wert, bis zu +15; jeder Punkt darunter kostet 0,3, bis zu -6."
 cc_pty_concern_reformist_3: "Reformtempo"
 cc_pty_concern_reformist_3_desc: "+8, wenn in den letzten fünf Jahren ein Gesetz geändert wurde; -4, wenn keines geändert wurde."
 cc_pty_concern_absolutist_1: "Absolutistische Gesellschaft"
 cc_pty_concern_absolutist_1_desc: "Die Gesellschaft in der Mitte ist neutral. Vollständige Ausrichtung auf Absolutismus bringt +20; die entgegengesetzte Richtung kostet 20. Die stärkste Partei lenkt die Gesellschaft in ihre Richtung."
 cc_pty_concern_absolutist_2: "Die Macht der Krone"
 cc_pty_concern_absolutist_2_desc: "Wenn die Krone 45% der Macht des Reiches hält, ist dies neutral. Jeder weitere Punkt gibt +1, bis zu +15; jeder Punkt weniger kostet 1, bis zu -15."
 cc_pty_concern_absolutist_3: "Ständeprivilegien"
 cc_pty_concern_absolutist_3_desc: "Sechs Privilegien über alle Stände hinweg sind neutral. Jedes fehlende Privileg bringt +2, bis zu +10; jedes zusätzliche kostet 2, bis zu -10."
 cc_pty_concern_regionalist_1: "Dezentralisierte Gesellschaft"
 cc_pty_concern_regionalist_1_desc: "Die Gesellschaft in der Mitte ist neutral. Vollständige Ausrichtung auf Dezentralisierung bringt +20; die entgegengesetzte Richtung kostet 20. Die stärkste Partei lenkt die Gesellschaft in ihre Richtung."
 cc_pty_concern_regionalist_2: "Die Zufriedenheit des Adels"
 cc_pty_concern_regionalist_2_desc: "Zufriedenheit von 50% ist neutral. Von -15 bei 0% bis +15 bei 100%. Steigern Sie diese durch Privilegien, niedrigere Steuern und Sitze im Kabinett für den Adel."
 cc_pty_concern_regionalist_3: "Hofausgaben"
 cc_pty_concern_regionalist_3_desc: "Wird im Budget festgelegt. Die Mitte ist neutral. Niedrigere Ausgaben für den Hof bringen bis zu +10; das andere Ende kostet 10."
 cc_pty_concern_colonial_1: "Koloniale Vasallen"
 cc_pty_concern_colonial_1_desc: "-5 bei einem Kolonialuntertan; jeder weitere ist +5 wert, bis zu +15."
 cc_pty_concern_colonial_2: "Die Zufriedenheit der Bürger"
 cc_pty_concern_colonial_2_desc: "Zufriedenheit von 50% ist neutral. Von -15 bei 0% bis +15 bei 100%. Steigern Sie diese durch Privilegien, niedrigere Steuern und Sitze im Kabinett für die Bürger."
 cc_pty_concern_colonial_3: "Die Seewege"
 cc_pty_concern_colonial_3_desc: "Ein halber Flottenunterhalt ist neutral; voller Unterhalt bringt +10 und kein Unterhalt kostet 10. Krieg kostet weitere 5."
 cc_pty_concern_liberal_1: "Liberale Gesellschaft"
 cc_pty_concern_liberal_1_desc: "Die Gesellschaft in der Mitte ist neutral. Vollständige Ausrichtung auf Liberalismus bringt +20; die entgegengesetzte Richtung kostet 20. Die stärkste Partei lenkt die Gesellschaft in ihre Richtung."
 cc_pty_concern_liberal_2: "Amtszeitbeschränkungen"
 cc_pty_concern_liberal_2_desc: "+10, solange Minister begrenzte Amtszeiten haben, -5, wenn dies nicht der Fall ist."
 cc_pty_concern_liberal_3: "Steuern auf die Bürger"
 cc_pty_concern_liberal_3_desc: "Ein Steuersatz von 30 % ist neutral. Niedrigere Steuern für die Bürger erfreuen die Partei, bis zu +10; eine Erhöhung auf 55 % oder mehr kostet 10."
