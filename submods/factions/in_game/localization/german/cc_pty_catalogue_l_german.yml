 MODIFIER_TYPE_NAME_cc_pty_party_royalist: "Mitglied der Hofpartei"
 MODIFIER_TYPE_DESC_cc_pty_party_royalist: "Dieser Charakter gehört zur Hofpartei, die für die eigene Autorität der Krone steht."
 MODIFIER_TYPE_NAME_cc_pty_party_aristocratic: "Mitglied der Aristokratischen Fraktion"
 MODIFIER_TYPE_DESC_cc_pty_party_aristocratic: "Dieser Charakter gehört zur Aristokratischen Fraktion, die sich für den Adel spricht."
 MODIFIER_TYPE_NAME_cc_pty_party_mercantile: "Mitglied des Kaufmannsinteresses"
 MODIFIER_TYPE_DESC_cc_pty_party_mercantile: "Dieser Charakter gehört zum Kaufmannsinteresse, das sich für die Bürger und die Handelshäuser spricht."
 MODIFIER_TYPE_NAME_cc_pty_party_clerical: "Mitglied der Klerikalen Partei"
 MODIFIER_TYPE_DESC_cc_pty_party_clerical: "Dieser Charakter gehört zur Klerikalen Partei, die sich für den Klerus spricht."
 MODIFIER_TYPE_NAME_cc_pty_party_military: "Mitglied der Kriegspartei"
 MODIFIER_TYPE_DESC_cc_pty_party_military: "Dieser Charakter gehört zur Kriegspartei, die sich für die Offiziere und das Heer spricht."
 MODIFIER_TYPE_NAME_cc_pty_party_agrarian: "Mitglied der Agrarpartei"
 MODIFIER_TYPE_DESC_cc_pty_party_agrarian: "Dieser Charakter gehört zur Agrarpartei, die sich für die Bauernschaft und das Land spricht."
 MODIFIER_TYPE_NAME_cc_pty_party_reformist: "Mitglied der Reformpartei"
 MODIFIER_TYPE_DESC_cc_pty_party_reformist: "Dieser Charakter gehört zur Reformpartei, die einen besser geführten, moderneren Staat anstrebt."
 MODIFIER_TYPE_NAME_cc_pty_party_absolutist: "Mitglied der Absolutistischen Partei"
 MODIFIER_TYPE_DESC_cc_pty_party_absolutist: "Dieser Charakter gehört zur Absolutistischen Partei, die möchte, dass alle Macht in der Krone vereint wird."
 MODIFIER_TYPE_NAME_cc_pty_party_regionalist: "Mitglied der Regionalpartei"
 MODIFIER_TYPE_DESC_cc_pty_party_regionalist: "Dieser Charakter gehört zur Regionalpartei, die sich für die Provinzen und Vasallenlande gegen die Hauptstadt spricht."
 MODIFIER_TYPE_NAME_cc_pty_party_colonial: "Mitglied der Koloniallobby"
 MODIFIER_TYPE_DESC_cc_pty_party_colonial: "Dieser Charakter gehört zur Koloniallobby, die sich für die Kolonien und die mit ihnen handelnden Kompanien spricht."
 MODIFIER_TYPE_NAME_cc_pty_party_liberal: "Mitglied der Liberalen Partei"
 MODIFIER_TYPE_DESC_cc_pty_party_liberal: "Dieser Charakter gehört zur Liberalen Partei, die eine konstitutionelle Regierung und die Rechte der Bürger fordert."
