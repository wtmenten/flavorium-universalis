 CC_PTY_FX_DISCONTENT_MEMBERS: "Ses ministres travaillent également 10 % moins bien, ou 20 % moins bien en dessous de -50."
 CC_PTY_FX_PUSH_OFF: "Parti le plus fort, 30 % des sièges"
 CC_PTY_FX_FAVOUR_OFF: "Demander une faveur au parti"
