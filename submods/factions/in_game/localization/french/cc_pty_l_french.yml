l_french:
 # Flavorium Universalis - Factions (hand-written keys)
 # Party names, agendas, per-party modifiers and action names are generated into
 # cc_pty_catalogue_l_english.yml by tools/generate_factions.py.

 # ---- Situation ----
 cc_pty_legend_realm: "Notre royaume"
 cc_pty_legend_lt_low: "Pensée libérale : présente"
 cc_pty_legend_lt_mid: "Pensée libérale : 30 ou plus"
 cc_pty_legend_lt_high: "Pensée libérale : 60 ou plus"
 cc_pty_map_tt_realm: "La politique de ce royaume est organisée en partis."
 cc_pty_map_tt_lt: "Ici, la pensée libérale croît avec l'alphabétisation, la cour, les Lumières et une société libérale, et diminue lorsque le Parti absolutiste dirige le royaume."

 # ---- Panel ----
 CC_PTY_HEADER: "La Chambre"
 CC_PTY_HEADER_DESC: "Quatre partis siègent à la chambre. Les quatre dépendent du gouvernement, de l'âge et des ordres, et la composition est révisée tous les quinze à vingt-cinq ans.\n\nLes #T Sièges#! proviennent du royaume lui-même : chaque mégalopole vaut 3, chaque ville 2, chaque bourg 1 et chaque établissement rural un cinquième de siège, et les sièges de chaque lieu sont partagés entre les ordres selon leur pouvoir local. Un parti récupère les sièges de ses ordres. La chambre compte entre 20 et 84 sièges quelle que soit la taille du royaume ; les sièges représentent donc une part, et non un décompte des lieux. Chaque ministre du cabinet apporte également à son parti 2 sièges nommés, jusqu'à la moitié de la chambre. Le #T pouvoir#! d'un parti est sa part des sièges.\n\nLa #T Satisfaction#! est révisée tous les deux à quatre ans et évolue à mi-chemin vers ce que le parti attend, ce qui dépend de son ordre et de ses ministres. Les partis satisfaits aident le royaume et leurs ministres à travailler plus dur ; les mécontents font l'inverse, d'autant plus s'ils détiennent beaucoup de sièges.\n\nLe #T Parti de la Guerre#!, le #T Parti Régionaliste#! et le #T Parti Libéral#! doivent être gérés : s'ils restent mécontents avec un cinquième des sièges, ils peuvent provoquer un coup d'État, une insurrection ou un soulèvement."
 CC_PTY_LABEL_POWER: "Puissance"
 CC_PTY_LABEL_SATISFACTION: "Satisfaction"
 CC_PTY_LABEL_MEMBERS: "Ministres"
 CC_PTY_LABEL_AGENDA: "Programme :"
 CC_PTY_LABEL_CABINET: "Cabinet :"
 CC_PTY_LABEL_LIBERAL_THOUGHT: "Pensée libérale"
 CC_PTY_POWER_TT: "La part de ce parti dans la force combinée des quatre partis. La force provient du pouvoir de ses États, plus 8 pour chacun de ses ministres au cabinet. Une attaque la réduit de 40 % pendant cinq ans."
 CC_PTY_SAT_TT: "De -100 à 100. Révisé tous les deux à quatre ans, se déplaçant à mi-chemin vers ce que le parti attend (le nombre après la flèche). La nomination ou le renvoi d'un ministre du parti le modifie de 10 points instantanément."
 CC_PTY_MEMBERS_TT: "Ministres au sein du cabinet appartenant à ce parti."
 CC_PTY_AGENDA_TT: "Un parti détenant un quart des sièges ou plus fixe un programme tous les cinq à douze ans et donne six ans au gouvernement pour le réaliser. Atteint : +30 de satisfaction, et une influence politique égale à la moitié des sièges du parti. Manqué : -25."
 CC_PTY_DOMINANT: "#P Dominant#!"
 CC_PTY_DOMINANT_TT: "Le parti le plus fort, avec 30 % de pouvoir ou plus. La société évolue selon sa volonté : deux fois moins vite sous un cabinet équilibré, et encore deux fois moins vite s'il gère également un cabinet monolithique."
 CC_PTY_MOOD_PLEASED: "#P Satisfait#!"
 CC_PTY_MOOD_PLEASED_TT: "Satisfaction supérieure à 30. Le royaume reçoit le modificateur de bonne volonté de ce parti, proportionnellement à sa puissance et à sa satisfaction, et ses ministres sont 5 % plus efficaces."
 CC_PTY_MOOD_CONTENT: "Satisfait"
 CC_PTY_MOOD_CONTENT_TT: "Satisfaction de -20 à 30. Aucun effet."
 CC_PTY_MOOD_DISCONTENT: "#N Mécontent#!"
 CC_PTY_MOOD_DISCONTENT_TT: "Satisfaction de -50 à -20. Le royaume reçoit le modificateur de mécontentement de ce parti, proportionnellement à sa puissance et à sa satisfaction, et ses ministres travaillent 10 % moins bien."
 CC_PTY_MOOD_ANGRY: "#N En colère#!"
 CC_PTY_MOOD_ANGRY_TT: "Satisfaction inférieure à -50. Le royaume reçoit le modificateur de mécontentement de ce parti, proportionnellement à sa puissance et à sa satisfaction, et ses ministres sont 20 % moins efficaces."
 CC_PTY_ESC_WARN: "#N Escalade#!"
 CC_PTY_ESC_WARN_TT: "Ce parti est en colère, détient 20 % de pouvoir ou plus, et s'achemine vers un défi ouvert. Chaque revue passée ainsi est une étape : d'abord un avertissement, puis l'agitation, puis le dénouement. Augmentez sa satisfaction au-dessus de -50 ou réduisez son pouvoir en dessous de 20 % pour faire reculer l'étape."
 CC_PTY_COMP_STACKED: "Cumulé"
 CC_PTY_COMP_STACKED_TT: "Un parti détient plus de la moitié des sièges du cabinet. +5 % d'efficacité du cabinet et +10 % de gain d'influence politique, et la bonne volonté ainsi que l'influence de ce parti sont plus fortes. Chaque autre parti attend 10 points de satisfaction de moins, et la rivalité de la cour s'accroît."
 CC_PTY_COMP_BALANCED: "Équilibré"
 CC_PTY_COMP_BALANCED_TT: "Aucun parti ne détient plus de 40 % des sièges et au moins trois sont installés. +0,5 d'influence politique mensuelle, la stabilité est moins coûteuse, les pots-de-vin et les attaques coûtent 25 % de moins, et l'objectif de satisfaction d'aucun parti ne descend en dessous de -20. Les bonus de bonne volonté sont 25 % plus faibles et la société évolue deux fois moins vite."
 CC_PTY_COMP_MIXED: "Mixte"
 CC_PTY_COMP_MIXED_TT: "Ni hégémonique ni équilibré. Moins de trois sièges, ou aucun schéma clair."
 CC_PTY_TERMLIMITS: "#T Limites de mandat#!"
 CC_PTY_TERMLIMITS_TT: "Tant que le Parti de la Réforme ou le Parti Libéral dirige le royaume, un ministre ayant servi dix ans quitte ses fonctions lors de la prochaine révision et ne peut revenir pendant dix ans."
 CC_PTY_LIBERAL_THOUGHT_TT: "La moyenne de la Pensée Libérale dans la capitale et les villes, affichée sur la carte par cette situation. Elle croît avec l'alphabétisation, les Lumières et une société libérale. À 50, le Parti Libéral se forme."
 CC_PTY_BTN_BRIBE: "Pots-de-vin"
 CC_PTY_BTN_ATTACK: "Attaquer"
 CC_PTY_BTN_FAVOUR: "Faveur"

 # ---- Action requirements ----
 cc_pty_tt_bribe_cooldown: "Ce parti a été soudoyé il y a moins de deux ans"
 cc_pty_tt_attack_cooldown: "Ce parti a été attaqué il y a moins de cinq ans"
 cc_pty_tt_attack_power: "Le parti détient au moins 10 % de pouvoir"
 cc_pty_tt_favour_cooldown: "Ce parti a accordé une faveur il y a moins de cinq ans"
 cc_pty_tt_favour_sat: "La satisfaction du parti est d'au moins 10"

 # ---- Rebels ----
 cc_pty_regional_rebels: "Ligue provinciale"

 # ---- Disasters ----
 cc_pty_praetorian_coup: "Le coup d'État des officiers"
 cc_pty_praetorian_coup_desc: "Le Parti de la Guerre a perdu patience. Les officiers ont pris le contrôle des salles de garde, les ministres craignent de rentrer chez eux, et aucun ordre du gouvernement n'est exécuté sans l'accord de l'armée. Cela prend fin lorsque le Parti de la Guerre est à nouveau satisfait, ou après cinq ans."
 cc_pty_liberal_uprising: "L'insurrection libérale"
 cc_pty_liberal_uprising_desc: "Les clubs libéraux sont dans les rues. Ils veulent une constitution, des limites au pouvoir de la couronne et un mot à dire dans le gouvernement, et ils ne rentreront pas chez eux sans avoir obtenu une partie de ces demandes. Cela prend fin lorsque le Parti Libéral est à nouveau satisfait, ou après cinq ans."

 # ---- Events ----
 cc_pty.10.title: "Nouveaux partis"
 cc_pty.10.desc: "Les anciennes alliances se sont brisées et de nouvelles se sont formées à leur place. La politique du royaume est désormais divisée entre le [ROOT.GetCountry.Custom('cc_pty_name_1')], le [ROOT.GetCountry.Custom('cc_pty_name_2')], le [ROOT.GetCountry.Custom('cc_pty_name_3')] et le [ROOT.GetCountry.Custom('cc_pty_name_4')].\n\nLes partis qui ont survécu conservent leur rang. Les nouveaux partent de zéro, et les ministres dont le parti a été dissous en rejoindront un autre."
 cc_pty.10.a: "Nous apprendrons leurs noms."
 cc_pty.20.title: "Un programme"
 cc_pty.20.desc: "Les chefs du [ROOT.GetCountry.Custom('cc_pty_event_name')] ont envoyé leurs exigences au gouvernement. Ils veulent une chose avant tout :\n\n#T [ROOT.GetCountry.Custom('cc_pty_event_agenda')]#!\n\nIls nous donnent six ans. Si c'est fait, ils s'en souviendront. Sinon, ils s'en souviendront également."
 cc_pty.20.a: "Nous verrons ce qui peut être fait."
 cc_pty.20.a.tt: "Remplissez l'ordre du jour d'ici six ans pour +30 de satisfaction avec ce parti. En cas d'échec, perdez-en 25."
 cc_pty.20.b: "Le gouvernement ne reçoit pas d'ordres."
 cc_pty.30.title: "Changer de camp"
 cc_pty.30.desc: "[cc_pty_defector.GetName] en a assez du [ROOT.GetCountry.Custom('cc_pty_defect_from_name')]. Sa querelle avec le gouvernement est devenue la leur, et ils ont été vus dîner avec les chefs du [ROOT.GetCountry.Custom('cc_pty_defect_to_name')]. Ils ont demandé si le gouvernement s'y opposerait."
 cc_pty.30.a: "Laissez-les aller où bon leur semble."
 cc_pty.30.b: "Leur rappeler qui les a nommés."
 cc_pty.30.c: "Ils peuvent alors également quitter le cabinet."
 cc_pty.40.title: "Le mouvement des officiers"
 cc_pty.40.desc: "Le Parti de la Guerre a cessé de demander. Les officiers qui lui sont fidèles ont occupé les salles de garde et les arsenaux, et leurs porte-parole ont présenté des conditions au gouvernement. Personne n'a encore été blessé."
 cc_pty.40.a: "Donnez aux officiers ce qu'ils veulent."
 cc_pty.40.b: "Arrêter les meneurs."
 cc_pty.41.title: "La révolte des provinces"
 cc_pty.41.desc: "Les seigneurs provinciaux ont formé une ligue contre la capitale. Ils veulent retrouver leurs anciens droits, leurs propres juges et leurs propres taxes, et ils lèvent des hommes pour l'imposer."
 cc_pty.41.a: "Le royaume ne sera pas divisé."
 cc_pty.41.a.tt: "Une ligue rebelle s'empare d'environ un cinquième de nos provinces, jamais de celle de la capitale, et une guerre civile commence."
 cc_pty.41.b: "Accordez aux provinces leurs droits."
 cc_pty.42.title: "Les Clubs descendent dans la rue"
 cc_pty.42.desc: "Les clubs du parti libéral ont appelé leurs membres à sortir. Des foules occupent les places, des revendications imprimées sont affichées sur toutes les portes et des soldats ne savent plus de quel côté se ranger."
 cc_pty.42.a: "Accordez quelques réformes."
 cc_pty.42.b: "Fermez les clubs et arrêtez les dirigeants."
 cc_pty.43.title: "Les sujets s'éloignent"
 cc_pty.43.desc: "Le Parti Régional a porté sa querelle avec la capitale auprès de nos sujets, et ceux-ci ont été attentifs. Leurs cours répondent plus lentement à nos lettres et communiquent plus rapidement entre elles."
 cc_pty.43.a: "Laissez-les bouder."
 cc_pty.43.b: "Payer pour leur bonne volonté."
 cc_pty.45.title: "Le retrait des officiers"
 cc_pty.45.desc: "Les officiers sont retournés dans leurs casernes. Quoi qu'il ait été promis ou menacé, le gouvernement gouverne à nouveau."
 cc_pty.45.a: "Bon."
 cc_pty.46.title: "Les rues sont calmes"
 cc_pty.46.desc: "La foule est rentrée chez elle et les clubs sont retournés à leurs disputes internes."
 cc_pty.46.a: "Bon."
 cc_pty.50.title: "Le parti libéral"
 cc_pty.50.desc: "La pensée libérale s'est suffisamment propagée dans nos villes pour disposer désormais de son propre parti. Il souhaite un gouvernement constitutionnel, des limites au pouvoir de la couronne et des fonctions ouvertes au mérite. Il prendra immédiatement place parmi les partis du royaume."
 cc_pty.50.a: "Nous devrons composer avec eux."
 cc_pty.60.title: "Limites de mandat"
 cc_pty.60.desc: "Les réformateurs dirigent désormais le royaume, et ils ont obtenu gain de cause : aucun ministre ne doit occuper son poste à vie. Désormais, un ministre ayant servi dix ans démissionne lors de la prochaine revue et ne peut revenir avant dix ans."
 cc_pty.60.a: "Qu'il en soit ainsi."
 cc_pty.61.title: "Limites de mandat levées"
 cc_pty.61.desc: "Les réformateurs ne dirigent plus le royaume, et la règle selon laquelle les ministres démissionnent après dix ans a expiré."
 cc_pty.61.a: "Qu'il en soit ainsi."
 STATIC_MODIFIER_NAME_cc_pty_member_content: "Parti satisfait"
 STATIC_MODIFIER_DESC_cc_pty_member_content: "Le parti de ce ministre est satisfait du gouvernement, et le ministre travaille en conséquence."
 STATIC_MODIFIER_NAME_cc_pty_member_discontent: "Mécontentement du parti"
 STATIC_MODIFIER_DESC_cc_pty_member_discontent: "Le parti de ce ministre est mécontent du gouvernement. Le ministre fait le strict nécessaire."
 STATIC_MODIFIER_NAME_cc_pty_member_angry: "Parti en colère"
 STATIC_MODIFIER_DESC_cc_pty_member_angry: "Le parti de ce ministre est ouvertement hostile au gouvernement, et on s'attend à ce que le ministre le manifeste."
 STATIC_MODIFIER_NAME_cc_pty_comp_stacked: "Cabinet disproportionné"
 STATIC_MODIFIER_DESC_cc_pty_comp_stacked: "Un seul parti détient plus de la moitié des sièges du cabinet. Le cabinet agit d'une seule voix, et les autres partis le remarquent."
 STATIC_MODIFIER_NAME_cc_pty_comp_balanced: "Cabinet équilibré"
 STATIC_MODIFIER_DESC_cc_pty_comp_balanced: "Aucun parti ne détient plus de 40 % des sièges du cabinet. Chaque parti a son mot à dire, et aucun ne se sent exclu."
 STATIC_MODIFIER_NAME_cc_pty_regional_concession: "Droits provinciaux"
 STATIC_MODIFIER_DESC_cc_pty_regional_concession: "Les provinces se sont vu accorder leurs anciens droits pour mettre fin à un soulèvement, et l'autorité de la capitale en est affaiblie."
 cc_pty_tt_bribe_effect: "La satisfaction de ce parti augmente de 25."
 cc_pty_tt_attack_effect: "La force de ce parti diminue de 40 % pendant cinq ans et sa satisfaction de 30. Les partis qui s'y opposent gagnent 10 de satisfaction."
 cc_pty_tt_favour_effect: "Nous bénéficions de la faveur de ce parti pendant cinq ans. Sa satisfaction diminue de 15."
 cc_pty_tt_refuse_agenda: "Le parti abandonne son programme et perd 15 de satisfaction."
 cc_pty_tt_defect: "[cc_pty_defector.GetName] rejoint le [ROOT.GetCountry.Custom('cc_pty_defect_to_name')]."
 cc_pty_tt_military_concede: "Le Parti de la Guerre gagne 60 de satisfaction."
 cc_pty_tt_military_purge: "La force du Parti de la Guerre diminue de 40 % pendant dix ans et il perd 20 de satisfaction."
 cc_pty_tt_liberal_concede: "Le Parti Libéral gagne 60 de satisfaction."
 cc_pty_tt_liberal_purge: "La force du Parti Libéral diminue de 40 % pendant dix ans et il perd 20 de satisfaction."
 cc_pty_tt_regional_concede: "Le Parti Régionaliste gagne 50 de satisfaction."
 cc_pty_tt_regional_sat_30: "Le Parti Régionaliste gagne 30 de satisfaction."
 cc_pty_tt_regional_sat_40: "Le Parti Régionaliste gagne 40 de satisfaction."
 CC_PTY_LABEL_TOP_AGENDA: "Ordre du jour :"
 CC_PTY_TOP_AGENDA_TT: "L'ordre du jour du parti dominant, ou s'il n'en a pas, celui d'un autre parti. Chaque carte affiche l'ordre du jour de son propre parti."
 CC_PTY_NO_TOP_AGENDA: "Aucun parti n'a d'ordre du jour"
 CC_PTY_LABEL_SEATS: "sièges"
 CC_PTY_CHAMBER_TT: "La taille de la chambre. Elle croît avec le royaume, de 20 sièges jusqu'à un maximum de 84, et est répartie entre les partis selon les sièges que leurs domaines détiennent à travers le royaume."
 CC_PTY_SEATS_TT: "Sièges détenus par ce parti : ceux que ses ordres détiennent à travers le royaume, plus 2 pour chacun de ses ministres au cabinet. Son pouvoir est sa part de la chambre."
 CC_PTY_CARD_SELECT_TT: "Sélectionner ce parti. Les boutons ci-dessous agissent sur le parti sélectionné."
 CC_PTY_LABEL_LEADER: "Chef"
 CC_PTY_NO_LEADER: "Pas de chef"
 CC_PTY_NO_LEADER_TT: "Le parti n'a aucun ministre au cabinet. Dans notre royaume, un chef se présente lors de la prochaine révision."
 CC_PTY_SELECT_HINT: "Sélectionnez un parti pour agir sur celui-ci."
 CC_PTY_BTN_APPOINT: "Nommer un chef"
 CC_PTY_BTN_CONCEDE: "Concéder"
 CC_PTY_BTN_ELECTION: "Convoquer des élections"
 cc_pty_election: "Convoquer une élection"
 cc_pty_election_desc: "Dissoudre la chambre et recomptabiliser les sièges dès maintenant, au lieu d'attendre la prochaine révision. Les partis qui ont perdu pied peuvent être remplacés. Une fois tous les dix ans."
 cc_pty_tt_appoint_effect: "Le chef du parti siège au cabinet, remplaçant le ministre le moins ancien d'un autre parti si aucun siège n'est vacant."
 cc_pty_tt_concede_effect: "Le programme est considéré comme atteint : ce parti gagne 30 de satisfaction et nous gagnons une influence politique égale à la moitié de ses sièges. Chaque parti s'y opposant en perd 10."
 cc_pty_tt_election_effect: "Les sièges sont recomptés et les partis sont réévalués maintenant. Nous gagnons 2 d'influence politique pour chaque siège gagné par le parti du chef du cabinet, et en perdons 1 pour chaque siège perdu."
 cc_pty_tt_appoint_leader: "Le parti a un chef vivant"
 cc_pty_tt_appoint_not_seated: "Le chef n'est pas déjà au cabinet"
 cc_pty_tt_concede_agenda: "Le parti a un ordre du jour"
 cc_pty_tt_election_cooldown: "Aucune élection n'a été convoquée au cours des dix dernières années"
 cc_pty_factions: "Factions"
 cc_pty_factions_desc: "Les partis du royaume, la part de pouvoir que chacun détient et la manière dont chacun estime être traité."
 CC_PTY_FX_HEADER: "Effets du parti sélectionné"
 CC_PTY_FX_HEADER_TT: "L'effet actuel du parti sélectionné sur le royaume. Chaque parti accorde son influence en détenant des sièges ; son humeur, son leadership et toute faveur accordée s'y ajoutent."
 CC_PTY_FX_STRENGTH_TT: "Force actuelle. 100 % correspond à la valeur indiquée : pour l'influence, un quart de la chambre ; pour les humeurs, un quart de la chambre avec une satisfaction de 50 ou -50."
 CC_PTY_FX_STANDING: "Influence"
 CC_PTY_FX_STANDING_TT: "Accordée par tout parti détenant un dixième des sièges ou plus, quelle que soit son humeur. Varie selon sa part dans la chambre."
 CC_PTY_FX_MARGINAL: "#N Marginalisés#!"
 CC_PTY_FX_MARGINAL_TT: "Le parti détient moins d'un dixième de la chambre, et l'état qui le soutient se sent ignoré."
 CC_PTY_FX_GOODWILL: "#P Bonne volonté#!"
 CC_PTY_FX_DISCONTENT: "#N Mécontentement#!"
 CC_PTY_FX_PUSH: "Ascendant"
 CC_PTY_FX_FAVOUR: "Faveur"
 CC_PTY_FX_FAVOUR_TT: "Une faveur accordée par ce parti lorsqu'on le lui a demandé. Dure cinq ans."
 CC_PTY_TARGET_TT: "Ce que le parti attend, et vers quoi sa satisfaction tend lors de la prochaine révision :\n- l'humeur de son domaine\n- +15 pour un ministre au cabinet, +25 pour deux ou plus\n- -20 sans ministre alors qu'il détient un cinquième des sièges\n- +15 si le chef du cabinet en fait partie\n- +10 si le souverain en fait partie\n- dans un cabinet empilé, +10 pour le parti qui le dirige et -10 pour les autres\n- dans un cabinet équilibré, jamais en dessous de -20"
 CC_PTY_MAJORITY: "#P Majorité opérationnelle#!"
 CC_PTY_MAJORITY_TT: "Le parti du chef du cabinet détient 40 % des sièges ou plus : +15 % de gain d'influence politique."
 CC_PTY_HUNG: "#N Chambre suspendue#!"
 CC_PTY_HUNG_TT: "Aucun parti ne détient 30 % des sièges : -10 % de gain d'influence politique."
 CC_PTY_LABEL_LEADERS_IN: "Dirigeants en fonction :"
 CC_PTY_LEADERS_IN_TT: "Partis dont le dirigeant siège au cabinet. Chacun apporte +0,05 d'influence politique mensuelle."
 STATIC_MODIFIER_NAME_cc_pty_leaders_in_office: "Dirigeants de partis en fonction"
 STATIC_MODIFIER_DESC_cc_pty_leaders_in_office: "Les dirigeants de partis qui siègent au cabinet apportent avec eux le soutien de leurs partis. Varie selon le nombre de partis dont le dirigeant est en fonction."
 STATIC_MODIFIER_NAME_cc_pty_working_majority: "Majorité opérationnelle"
 STATIC_MODIFIER_DESC_cc_pty_working_majority: "Le parti du chef du cabinet détient au moins 40 % de la chambre, et les affaires du gouvernement aboutissent."
 STATIC_MODIFIER_NAME_cc_pty_hung_chamber: "Chambre suspendue"
 STATIC_MODIFIER_DESC_cc_pty_hung_chamber: "Aucun parti ne détient même 30 % de la chambre, et chaque mesure doit faire l'objet d'une négociation."
