 CC_PTY_EXP_TITLE: "Ce qu'elle attend"
 CC_PTY_EXP_CABINET: "Ministres au cabinet"
 CC_PTY_EXP_CABINET_TT: "+5 pour l'un de ses ministres au cabinet, +25 pour deux ou plus. -20 s'il n'en a aucun alors qu'il détient un cinquième des sièges ou plus."
 CC_PTY_EXP_HEAD: "Chef du cabinet"
 CC_PTY_EXP_HEAD_TT: "+15 tant que le chef du cabinet appartient à ce parti."
 CC_PTY_EXP_RULER: "Le dirigeant"
 CC_PTY_EXP_RULER_TT: "+10 tant que le dirigeant appartient à ce parti."
 CC_PTY_EXP_COMP: "Composition du cabinet"
 CC_PTY_EXP_COMP_TT: "Dans un cabinet monolithique, +10 pour le parti qui le dirige et -10 pour tous les autres. Dans un cabinet équilibré, l'attente ne descend jamais en dessous de -20."
 CC_PTY_CARD_FX_TT: "Tout ce que ce parti applique désormais au royaume, cumulé par modificateur : son prestige, sa bonne volonté ou son mécontentement, son avance, toute faveur accordée et toute escalade. Sélectionnez le parti pour le détail."
 CC_PTY_ESC_1_TT: "#N Avertissement.#! Ce parti est en colère et détient 20 % de puissance ou plus : un examen a été passé ainsi. Un autre entraînera l'agitation, et un troisième le dénouement. Augmentez sa satisfaction au-dessus de -50 ou réduisez sa puissance sous les 20 % pour faire redescendre l'échelon."
 CC_PTY_ESC_2_TT: "#N Agitation.#! Ce parti est en colère, détient 20 % de puissance ou plus, et ce depuis deux examens. Encore un et il agira. Augmentez sa satisfaction au-dessus de -50 ou réduisez sa puissance sous les 20 % pour faire redescendre l'échelon."
