 cc_pty_tt_liberal_sat_15: "Les Libéraux gagnent 15 de satisfaction."
 cc_pty_tt_liberal_sat_40: "Les Libéraux gagnent 40 de satisfaction."
 cc_pty_tt_liberal_sat_minus_10: "Les Libéraux perdent 10 de satisfaction."
 cc_pty_lu_tt_down_5: "L'élan de l'insurrection diminue de 5."
 cc_pty_lu_tt_down_6: "L'élan de l'insurrection diminue de 6."
 cc_pty_lu_tt_down_8: "L'élan de l'insurrection diminue de 8."
 cc_pty_lu_tt_down_10: "L'élan du soulèvement diminue de 10."
 cc_pty_lu_tt_down_12: "L'élan du soulèvement diminue de 12."
 cc_pty_lu_tt_down_15: "L'élan de l'insurrection diminue de 15."
 cc_pty_lu_tt_down_25: "L'élan de l'insurrection diminue de 25."
 cc_pty_lu_tt_up_5: "L'élan de l'insurrection augmente de 5."
 cc_pty_lu_tt_up_8: "L'élan de l'insurrection augmente de 8."
 cc_pty_lu_tt_up_10: "L'élan de l'insurrection augmente de 10."
 cc_pty_lu_tt_up_12: "L'élan de l'insurrection augmente de 12."
 cc_pty_lu_tt_repressed: "Les clubs se souviennent de l'usage de la force : l'élan augmente 0,5 plus rapidement chaque mois pour le reste du soulèvement, et un martyr pourrait émerger."
 cc_pty_lu_tt_repression_lifted: "Le souvenir de la force s'estompe : l'élan n'augmente plus plus rapidement à cause de cela."
 cc_pty_lu_end_defused_tt: "L'élan de l'insurrection est tombé à 0"
 cc_pty_lu_end_boiled_tt: "L'élan de l'insurrection a atteint 100 (la couronne doit répondre)"
 CC_PTY_LU_MOMENTUM: "Élan de l'insurrection : #high [FixedPointToInt(Player.MakeScope.GetVariable('cc_pty_lu_momentum').GetValue)]#! / 100"
 CC_PTY_LU_MOMENTUM_TT: "Augmente de 1 par mois tant que rien n'est fait, plus 0,5 pour chaque cas où les clubs se souviennent de l'usage de la force et où la stabilité est négative. Diminue de 1,5 lorsque la satisfaction attendue des libéraux est de 0 ou plus, et de 0,5 pour chaque ministre libéral au cabinet, si la société tend vers le libéralisme à 30 ou plus, et si des limites de mandat sont en vigueur. À 0, l'insurrection prend fin ; à 100, la couronne doit accorder une constitution ou combattre."
 cc_pty_liberal_uprising_desc: "Les clubs libéraux sont dans les rues. Ils veulent une constitution, des limites au pouvoir de la couronne et un rôle dans le gouvernement, et ils ne rentreront pas chez eux sans avoir obtenu une partie de ces demandes.\n\nL'insurrection possède un élan, affiché ci-dessus, qui commence à 60. Il augmente de 1 par mois tant que rien n'est fait. Il diminue une fois que les griefs des Libéraux sont traités : leur satisfaction attendue à 0 ou plus, un ministre libéral au cabinet, la société à 30 ou plus vers le libéralisme, ou des limitations de mandat en vigueur. Les événements survenant pendant l'insurrection modifient cet élan. À 0, l'insurrection prend fin. À 100, la couronne doit accorder une constitution ou mener une guerre civile. Après cinq ans, elle se termine sans résolution."
 cc_pty.42.desc: "Les clubs des Libéraux ont appelé leurs membres à sortir. Des foules occupent les places, des revendications imprimées sont placardées sur toutes les portes et des soldats ne savent plus de quel côté ils se situent.\n\nUne seule réponse ne suffira pas à les renvoyer chez eux. Le soulèvement commence avec un élan de 60 et continue de croître jusqu'à ce que leurs griefs soient traités. À 0, il prend fin ; à 100, la couronne doit accorder une constitution ou combattre."
 CC_PTY_FX_ON: "#P Actif#!"
