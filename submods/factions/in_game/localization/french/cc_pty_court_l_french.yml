 cc_pty_ce_tt_rivalry_eased: "La rivalité à la cour s'apaise."
 cc_pty_ce_tt_followup: "Nous en entendrons parler davantage."

 # ---- Court event modifiers (main_menu/common/static_modifiers/cc_pty_modifiers.txt) ----
 STATIC_MODIFIER_NAME_cc_pty_ce_confidant: "Confident du souverain"
 STATIC_MODIFIER_DESC_cc_pty_ce_confidant: "Ce ministre a la confiance du souverain et parle avec l'autorité du souverain."
 STATIC_MODIFIER_NAME_cc_pty_ce_minister_rule: "Gouvernement par le ministre"
 STATIC_MODIFIER_DESC_cc_pty_ce_minister_rule: "Un ministre de longue date dirige le gouvernement au nom du souverain. Le travail est fait, mais l'autorité propre de la couronne s'en trouve affaiblie."
 STATIC_MODIFIER_NAME_cc_pty_ce_compromise: "Compromis transpartisan"
 STATIC_MODIFIER_DESC_cc_pty_ce_compromise: "Des ministres de partis opposés ont élaboré une mesure ensemble, et la couronne l'a soutenue. Le conseil fonctionne plus harmonieusement."
