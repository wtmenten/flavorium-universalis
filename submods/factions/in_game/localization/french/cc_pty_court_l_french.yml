 # ---- Court events (cc_pty.80-98). Hand-written. ----

 # The Knife
 cc_pty.80.title: "Du sang versé"
 cc_pty.80.desc: "La réunion du conseil s'est terminée dans les cris. [cc_pty_ce_a.GetName] du [ROOT.GetCountry.Custom('cc_pty_ev_a_name')] a accusé [cc_pty_ce_b.GetName] du [ROOT.GetCountry.Custom('cc_pty_ev_b_name')] d'avoir menti à la couronne, et [cc_pty_ce_b.GetName] a répondu par des insultes plus graves encore. Les autres ministres sont restés silencieux. Tous deux attendent maintenant que la couronne dise qui avait raison."
 cc_pty.80.a: "Les réprimander tous les deux."
 cc_pty.80.b: "[cc_pty_ce_a.GetName] avait raison."
 cc_pty.80.c: "[cc_pty_ce_b.GetName] avait raison."
 cc_pty.80.d: "Les laisser régler cela entre eux."
 cc_pty.81.title: "Murmures d'un complot"
 cc_pty.81.desc: "Un informateur s'est rendu au palais avec un récit. Des hommes à la solde de [cc_pty_ce_a.GetName] se sont renseignés sur les habitudes de [cc_pty_ce_b.GetName] : quelles routes ils empruntent, par quelles portes ils sortent, qui les garde la nuit. L'informateur n'est pas certain de ce qui est prévu, mais il y a peu de doute sur l'intention."
 cc_pty.81.a: "Arrêter [cc_pty_ce_a.GetName]."
 cc_pty.81.b: "Avertir discrètement [cc_pty_ce_b.GetName]."
 cc_pty.81.c: "Ce n'est pas une querelle qui regarde la couronne."
 cc_pty.82.title: "Meurtre à la Cour"
 cc_pty.82.desc: "[cc_pty_ce_b.GetName] est mort, poignardé sur le chemin du retour après le conseil. Les meurtriers se sont échappés. Personne à la cour ne doute de savoir qui les a envoyés, et les [ROOT.GetCountry.Custom('cc_pty_ev_b_name')] exigent que la couronne agisse."
 cc_pty.82.a: "Traquer les tueurs, et quiconque les a payés."
 cc_pty.82.b: "Laisser l'affaire s'éteindre."
 cc_pty.83.title: "Le complot se dévoile"
 cc_pty.83.desc: "Les hommes envoyés pour tuer [cc_pty_ce_b.GetName] ont été capturés avant d'avoir pu agir. Lors de leur interrogatoire, ils ont nommé leur employeur : [cc_pty_ce_a.GetName]. La cour attend de voir ce que la couronne fera d'un ministre ayant planifié un meurtre."
 cc_pty.83.a: "Traduire [cc_pty_ce_a.GetName] en justice."
 cc_pty.83.b: "Envoyer [cc_pty_ce_a.GetName] à l'étranger, discrètement."
 cc_pty.83.c: "Gracier [cc_pty_ce_a.GetName]. Ils nous en seront reconnaissants."

 # An Affair of Honour
 cc_pty.85.title: "Une affaire d'honneur"
 cc_pty.85.desc: "[cc_pty_ce_a.GetName] des [ROOT.GetCountry.Custom('cc_pty_ev_a_name')] a défié [cc_pty_ce_b.GetName] des [ROOT.GetCountry.Custom('cc_pty_ev_b_name')] en duel suite à une insulte proférée au conseil. Les témoins ont été nommés et le terrain choisi. Seule la couronne peut désormais l'arrêter."
 cc_pty.85.a: "L'interdire."
 cc_pty.85.b: "Les laisser se réunir."
 cc_pty.85.c: "Ils régleront cela à la table du conseil."
 cc_pty.86.title: "Le duel"
 cc_pty.86.desc: "[cc_pty_ce_a.GetName] et [cc_pty_ce_b.GetName] se sont rencontrés à l'aube. [cc_pty_ce_b.GetName] a été transporté hors du champ et est mort avant midi. [cc_pty_ce_a.GetName] est retourné au conseil la semaine même, et les [ROOT.GetCountry.Custom('cc_pty_ev_b_name')] ne le pardonneront pas."
 cc_pty.86.a: "Le gaspillage d'un bon ministre."

 # The Power Behind the Throne
 cc_pty.88.title: "Le pouvoir derrière le trône"
 cc_pty.88.desc: "[cc_pty_ce_a.GetName] a servi assez longtemps pour connaître chaque bureau et chaque officier, et a commencé à donner des ordres au nom de [cc_pty_ce_ruler.GetName] sans demander l'autorisation. Les ordres sont sensés et le travail est fait, mais on commence à se demander à la cour qui gouverne réellement."
 cc_pty.88.a: "Leur rappeler qui porte la couronne."
 cc_pty.88.b: "Les laisser gouverner. Cela fonctionne."
 cc_pty.88.c: "Renvoyer [cc_pty_ce_a.GetName]."
 cc_pty.89.title: "Le prix du ministre"
 cc_pty.89.desc: "[cc_pty_ce_a.GetName] dirige le gouvernement depuis des années maintenant, et souhaite quelque chose en retour : des postes pour les [ROOT.GetCountry.Custom('cc_pty_ev_a_name')], du trésor aux tribunaux provinciaux. Les autres partis observent."
 cc_pty.89.a: "Leur accorder les charges."
 cc_pty.89.b: "Refuser, et reprendre les rênes."
 cc_pty.89.c: "Destituer [cc_pty_ce_a.GetName] de ses fonctions."

 # Across the Aisle
 cc_pty.91.title: "De l'autre côté de l'allée"
 cc_pty.91.desc: "[cc_pty_ce_a.GetName] des [ROOT.GetCountry.Custom('cc_pty_ev_a_name')] et [cc_pty_ce_b.GetName] des [ROOT.GetCountry.Custom('cc_pty_ev_b_name')] ne s'entendent sur presque rien, et pourtant ils ont présenté au conseil une mesure qu'ils ont rédigée ensemble. Aucun des deux partis n'en est satisfait, mais tous deux ont déclaré qu'ils l'accepteraient si la couronne le faisait."
 cc_pty.91.a: "Soutenir leur compromis."
 cc_pty.91.b: "L'adopter comme si c'était l'idée de la couronne."
 cc_pty.91.c: "Mettre le projet au placard."
 cc_pty.92.title: "Une amitié improbable"
 cc_pty.92.desc: "Depuis que leur mesure a été adoptée, [cc_pty_ce_a.GetName] et [cc_pty_ce_b.GetName] ont été vus dînant ensemble et se promenant dans les jardins du palais. Leurs partis grognent, mais le conseil n'a jamais mieux fonctionné."
 cc_pty.92.a: "Les honorer tous les deux."
 cc_pty.92.b: "Que leur exemple parle de lui-même."

 # A Friend at Court
 cc_pty.94.title: "Un ami à la cour"
 cc_pty.94.desc: "[cc_pty_ce_ruler.GetName] et [cc_pty_ce_a.GetName] ont pris l'habitude de discuter longtemps après la levée du conseil : du royaume, de livres, ou de rien en particulier. Il est rare qu'un souverain ait quelqu'un à qui parler franchement."
 cc_pty.94.a: "Prendre [cc_pty_ce_a.GetName] en confidence."
 cc_pty.94.b: "Un souverain doit garder une distance appropriée."
 cc_pty.95.title: "Jalousie à la Cour"
 cc_pty.95.desc: "[cc_pty_ce_b.GetName] du [ROOT.GetCountry.Custom('cc_pty_ev_b_name')] s'est plaint ouvertement que [cc_pty_ce_a.GetName] a l'oreille du souverain, et que les décisions sont prises lors du souper plutôt qu'en conseil. D'autres commencent à dire la même chose."
 cc_pty.95.a: "Soutenir [cc_pty_ce_a.GetName]."
 cc_pty.95.b: "Prendre nos distances."

 # Loyalty Tested
 cc_pty.97.title: "Loyauté mise à l'épreuve"
 cc_pty.97.desc: "Le [ROOT.GetCountry.Custom('cc_pty_ev_a_name')] s'est retourné contre le gouvernement et a demandé à ses ministres de s'éloigner du conseil en signe de protestation. [cc_pty_ce_a.GetName] a refusé et est venu travailler comme d'habitude. Son parti ne l'a pas bien pris."
 cc_pty.97.a: "Honorer [cc_pty_ce_a.GetName] publiquement."
 cc_pty.97.b: "Récompenser [cc_pty_ce_a.GetName] en privé."
 cc_pty.97.c: "Un serviteur loyal n'a pas besoin de récompense."

