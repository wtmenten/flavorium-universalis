 cc_pty_ce_tt_a_suppressed: "La force du [ROOT.GetCountry.Custom('cc_pty_ev_a_name')] diminue de 40 % pendant dix ans."
 cc_pty_ce_tt_a_grudge: "[cc_pty_ce_a.GetName] ne forgottera pas cela."
