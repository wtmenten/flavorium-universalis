 MODIFIER_TYPE_NAME_cc_pty_party_royalist: "Membre des royalistes"
 MODIFIER_TYPE_DESC_cc_pty_party_royalist: "Ce personnage appartient aux Royalistes, qui défendent l'autorité de la couronne, ou de l'État en l'absence de couronne."
 MODIFIER_TYPE_NAME_cc_pty_party_aristocratic: "Membre des magnats"
 MODIFIER_TYPE_DESC_cc_pty_party_aristocratic: "Ce personnage appartient aux Magnats, qui s'expriment au nom de la noblesse."
 MODIFIER_TYPE_NAME_cc_pty_party_mercantile: "Membre des marchands"
 MODIFIER_TYPE_DESC_cc_pty_party_mercantile: "Ce personnage appartient aux Marchands, qui s'expriment au nom des bourgeois et des maisons de commerce."
 MODIFIER_TYPE_NAME_cc_pty_party_clerical: "Membre des cléricaux"
 MODIFIER_TYPE_DESC_cc_pty_party_clerical: "Ce personnage appartient aux Cléricaux, qui s'expriment au nom du clergé."
 MODIFIER_TYPE_NAME_cc_pty_party_military: "Membre des faucons"
 MODIFIER_TYPE_DESC_cc_pty_party_military: "Ce personnage appartient aux Faucons, qui s'expriment au nom des officiers et de l'armée."
 MODIFIER_TYPE_NAME_cc_pty_party_agrarian: "Membre des agrariens"
 MODIFIER_TYPE_DESC_cc_pty_party_agrarian: "Ce personnage appartient aux Agrariens, qui s'expriment au nom de la paysannerie et des campagnes."
 MODIFIER_TYPE_NAME_cc_pty_party_reformist: "Membre des réformateurs"
 MODIFIER_TYPE_DESC_cc_pty_party_reformist: "Ce personnage appartient aux Réformateurs, qui souhaitent un État mieux géré et plus moderne."
 MODIFIER_TYPE_NAME_cc_pty_party_absolutist: "Membre des absolutistes"
 MODIFIER_TYPE_DESC_cc_pty_party_absolutist: "Ce personnage appartient aux Absolutistes, qui souhaitent que tout le pouvoir soit concentré dans la couronne."
 MODIFIER_TYPE_NAME_cc_pty_party_regionalist: "Membre des particularistes"
 MODIFIER_TYPE_DESC_cc_pty_party_regionalist: "Ce personnage appartient aux Particularistes, qui s'expriment au nom des provinces et des terres vassales contre la capitale."
 MODIFIER_TYPE_NAME_cc_pty_party_colonial: "Membre des colonialistes"
 MODIFIER_TYPE_DESC_cc_pty_party_colonial: "Ce personnage appartient aux Colonialistes, qui s'expriment au nom des colonies et des compagnies qui y commercent."
 MODIFIER_TYPE_NAME_cc_pty_party_liberal: "Membre des libéraux"
 MODIFIER_TYPE_DESC_cc_pty_party_liberal: "Ce personnage appartient aux Libéraux, qui souhaitent un gouvernement constitutionnel et les droits du citoyen."
 cc_pty_concern_royalist_1: "Le pouvoir de la couronne"
 cc_pty_concern_royalist_1_desc: "Le fait que la couronne détienne 35 % du pouvoir du royaume est neutre. Chaque point supplémentaire vaut +1, jusqu'à +15 ; chaque point en moins coûte 1, jusqu'à -15."
 cc_pty_concern_royalist_2: "Stabilité"
 cc_pty_concern_royalist_2_desc: "Une stabilité de 0 est neutre. Chaque tranche de 10 de stabilité dans un sens ou l'autre vaut 1,5, jusqu'à +15 ou -15."
 cc_pty_concern_royalist_3: "Dépenses de la cour"
 cc_pty_concern_royalist_3_desc: "Fixé sur le budget. Le milieu est neutre. Des dépenses plus élevées pour la cour valent jusqu'à +10 ; l'autre extrémité coûte 10."
 cc_pty_concern_aristocratic_1: "La satisfaction de la noblesse"
 cc_pty_concern_aristocratic_1_desc: "Une satisfaction de 50 % est neutre. De -20 à 0 % jusqu'à +20 à 100 %. Augmentez-la avec des privilèges, des taxes moins élevées et des sièges au cabinet pour la noblesse."
 cc_pty_concern_aristocratic_2: "Privilèges de la noblesse"
 cc_pty_concern_aristocratic_2_desc: "2 privilèges sont neutres. Chaque privilège supplémentaire vaut +4, jusqu'à +12 ; chaque privilège en moins coûte 4, jusqu'à -10."
 cc_pty_concern_aristocratic_3: "Taxes sur la noblesse"
 cc_pty_concern_aristocratic_3_desc: "Un taux d'imposition de 30 % est neutre. Des impôts plus bas sur la noblesse plaisent au parti, jusqu'à +10 ; les augmenter à 55 % ou plus coûte 10."
 cc_pty_concern_mercantile_1: "La satisfaction des bourgeois"
 cc_pty_concern_mercantile_1_desc: "Une satisfaction de 50 % est neutre. De -20 à 0 % jusqu'à +20 à 100 %. Augmentez-la avec des privilèges, des taxes moins élevées et des sièges au cabinet pour les bourgeois."
 cc_pty_concern_mercantile_2: "Taxes sur les bourgeois"
 cc_pty_concern_mercantile_2_desc: "Un taux d'imposition de 30 % est neutre. Des impôts plus bas sur les bourgeois plaisent au parti, jusqu'à +10 ; les augmenter à 55 % ou plus coûte 10."
 cc_pty_concern_mercantile_3: "Paix et crédit"
 cc_pty_concern_mercantile_3_desc: "+5 en temps de paix et sans emprunts. La guerre coûte 8, chaque emprunt 2, et une banqueroute au cours des vingt dernières années 10. Jamais en dessous de -15."
 cc_pty_concern_clerical_1: "La satisfaction du clergé"
 cc_pty_concern_clerical_1_desc: "Une satisfaction de 50 % est neutre. De -20 à 0 % jusqu'à +20 à 100 %. Augmentez-la avec des privilèges, des taxes moins élevées et des sièges au cabinet pour le clergé."
 cc_pty_concern_clerical_2: "Unité religieuse"
 cc_pty_concern_clerical_2_desc: "80 % de la population partageant la religion d'État est neutre. Une unité totale vaut +10 ; tous les 2 points en dessous de 80 % coûtent 1, jusqu'à -15."
 cc_pty_concern_clerical_3: "Privilèges du clergé"
 cc_pty_concern_clerical_3_desc: "2 privilèges sont neutres. Chaque privilège supplémentaire vaut +4, jusqu'à +12 ; chaque privilège en moins coûte 4, jusqu'à -10."
 cc_pty_concern_military_1: "Bilan de guerre"
 cc_pty_concern_military_1_desc: "+10 en temps de guerre, +10 pour une guerre gagnée au cours des dix dernières années, -15 pour une guerre perdue au cours des dix dernières années, et -10 après dix ans sans guerre. De -20 à +20."
 cc_pty_concern_military_2: "Entretien de l'armée"
 cc_pty_concern_military_2_desc: "Fixé sur le budget. Le milieu est neutre. Un entretien de l'armée plus élevé vaut jusqu'à +15 ; l'autre extrémité coûte 15."
 cc_pty_concern_military_3: "Taille de l'armée"
 cc_pty_concern_military_3_desc: "Une armée à 75 % de sa taille prévue est neutre. Chaque point supplémentaire vaut 0,4, jusqu'à +10 ; chaque point en moins coûte 0,4, jusqu'à -15."
 cc_pty_concern_agrarian_1: "La satisfaction de la paysannerie"
 cc_pty_concern_agrarian_1_desc: "Une satisfaction de 50 % est neutre. De -20 à 0 % jusqu'à +20 à 100 %. Augmentez-la avec des privilèges, des taxes moins élevées et des sièges au cabinet pour la paysannerie."
 cc_pty_concern_agrarian_2: "Taxes sur la paysannerie"
 cc_pty_concern_agrarian_2_desc: "Un taux d'imposition de 30 % est neutre. Des impôts plus bas sur la paysannerie plaisent au parti, jusqu'à +10 ; les augmenter à 55 % ou plus coûte 10."
 cc_pty_concern_agrarian_3: "Épuisement de guerre"
 cc_pty_concern_agrarian_3_desc: "+5 sans épuisement de guerre. Chaque point d'épuisement de guerre coûte 1,5, jusqu'à -15."
 cc_pty_concern_reformist_1: "Société innovante"
 cc_pty_concern_reformist_1_desc: "Une société au centre est neutre. Pleinement vers l'Innovation vaut +20 ; pleinement dans l'autre direction coûte 20. Le parti le plus fort oriente la société vers sa vision."
 cc_pty_concern_reformist_2: "Alphabétisation"
 cc_pty_concern_reformist_2_desc: "Un taux d'alphabétisation moyen de 20 % est neutre. Chaque point supplémentaire vaut 0,3, jusqu'à +15 ; chaque point en moins coûte 0,3, jusqu'à -6."
 cc_pty_concern_reformist_3: "Rythme des réformes"
 cc_pty_concern_reformist_3_desc: "+8 si une loi a été modifiée au cours des cinq dernières années ; -4 si aucune ne l'a été."
 cc_pty_concern_absolutist_1: "Société absolutiste"
