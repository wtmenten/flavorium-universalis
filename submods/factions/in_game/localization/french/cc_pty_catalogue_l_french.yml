 cc_pty_concede_1: "Concéder l'ordre du jour"
 cc_pty_concede_1_desc: "Satisfaire l'ordre du jour du parti par décret. Il est considéré comme rempli dès maintenant, pour +30 de satisfaction, et chaque parti s'y opposant perd 10."
