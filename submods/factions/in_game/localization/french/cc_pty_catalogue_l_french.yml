 cc_pty_appoint_1: "Nommer le chef du parti"
 cc_pty_appoint_1_desc: "Installer le chef du parti au cabinet : sur un siège vacant s'il y en a un, sinon à la place du ministre le moins ancien d'un autre parti. Le parti du chef gagne les sièges apportés par un ministre."
