 cc_pty_concern_absolutist_3: "Privilèges des États"
 cc_pty_concern_absolutist_3_desc: "Six privilèges répartis entre tous les ordres sont neutres. Chaque privilège en moins vaut +2, jusqu'à +10 ; chaque privilège supplémentaire coûte 2, jusqu'à -10."
