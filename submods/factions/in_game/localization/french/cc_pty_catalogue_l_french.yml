 MODIFIER_TYPE_NAME_cc_pty_party_royalist: "Membre du parti de la cour"
 MODIFIER_TYPE_DESC_cc_pty_party_royalist: "Ce personnage appartient au parti de la cour, qui défend l'autorité propre de la couronne."
 MODIFIER_TYPE_NAME_cc_pty_party_aristocratic: "Membre de la faction aristocratique"
 MODIFIER_TYPE_DESC_cc_pty_party_aristocratic: "Ce personnage appartient à la faction aristocratique, qui s'exprime au nom de la noblesse."
 MODIFIER_TYPE_NAME_cc_pty_party_mercantile: "Membre des intérêts marchands"
 MODIFIER_TYPE_DESC_cc_pty_party_mercantile: "Ce personnage appartient aux intérêts marchands, qui s'expriment au nom des bourgeois et des maisons de commerce."
 MODIFIER_TYPE_NAME_cc_pty_party_clerical: "Membre du parti clérical"
 MODIFIER_TYPE_DESC_cc_pty_party_clerical: "Ce personnage appartient au parti clérical, qui s'exprime au nom du clergé."
 MODIFIER_TYPE_NAME_cc_pty_party_military: "Membre du parti de la guerre"
 MODIFIER_TYPE_DESC_cc_pty_party_military: "Ce personnage appartient au parti de la guerre, qui s'exprime au nom des officiers et de l'armée."
 MODIFIER_TYPE_NAME_cc_pty_party_agrarian: "Membre du parti agraire"
 MODIFIER_TYPE_DESC_cc_pty_party_agrarian: "Ce personnage appartient au parti agraire, qui s'exprime au nom de la paysannerie et des campagnes."
 MODIFIER_TYPE_NAME_cc_pty_party_reformist: "Membre du parti réformiste"
 MODIFIER_TYPE_DESC_cc_pty_party_reformist: "Ce personnage appartient au parti réformiste, qui souhaite un État plus moderne et mieux géré."
 MODIFIER_TYPE_NAME_cc_pty_party_absolutist: "Membre du parti absolutiste"
 MODIFIER_TYPE_DESC_cc_pty_party_absolutist: "Ce personnage appartient au parti absolutiste, qui souhaite que tout le pouvoir soit concentré entre les mains de la couronne."
 MODIFIER_TYPE_NAME_cc_pty_party_regionalist: "Membre du parti régionaliste"
 MODIFIER_TYPE_DESC_cc_pty_party_regionalist: "Ce personnage appartient au parti régionaliste, qui s'exprime au nom des provinces et des terres vassales contre la capitale."
 MODIFIER_TYPE_NAME_cc_pty_party_colonial: "Membre du lobby colonial"
 MODIFIER_TYPE_DESC_cc_pty_party_colonial: "Ce personnage appartient au lobby colonial, qui s'exprime au nom des colonies et des compagnies qui y commercent."
 MODIFIER_TYPE_NAME_cc_pty_party_liberal: "Membre du parti libéral"
 MODIFIER_TYPE_DESC_cc_pty_party_liberal: "Ce personnage appartient au parti libéral, qui souhaite un gouvernement constitutionnel et le respect des droits du citoyen."
