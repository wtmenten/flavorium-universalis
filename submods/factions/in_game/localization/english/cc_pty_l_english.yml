l_english:
 # Flavorium Universalis - Factions (hand-written keys)
 # Party names, agendas, per-party modifiers and action names are generated into
 # cc_pty_catalogue_l_english.yml by tools/generate_factions.py.

 # ---- Situation ----
 cc_pty_factions: "Factions"
 cc_pty_factions_desc: "The parties of the realm, how much of its power each one holds, and how well each thinks it is being treated."
 cc_pty_legend_realm: "Our realm"
 cc_pty_legend_lt_low: "Liberal Thought: present"
 cc_pty_legend_lt_mid: "Liberal Thought: 30 or more"
 cc_pty_legend_lt_high: "Liberal Thought: 60 or more"
 cc_pty_map_tt_realm: "This realm's politics are organised into parties."
 cc_pty_map_tt_lt: "Liberal Thought here grows with literacy, the court, the Enlightenment and a liberal society, and falls while the Absolutist Party leads the realm."

 # ---- Panel ----
 CC_PTY_HEADER: "The Chamber"
 CC_PTY_HEADER_DESC: "Four parties sit in the chamber. Which four depends on the government, the age and the estates, and the line-up is reviewed every fifteen to twenty-five years.\n\n#T Seats#! come from the realm itself: every megalopolis is worth 3, every city 2, every town 1 and every rural settlement a fifth of one, and each location's seats are shared among the estates by their power there. A party takes the seats of its estates. The chamber holds 20 to 84 seats however large the realm, so seats are a share, not a count of locations. Each minister in the cabinet also brings their party 2 appointed seats, up to half the chamber. A party's #T power#! is its share of the seats.\n\n#T Satisfaction#! is reviewed every two to four years and moves halfway toward what the party expects, which depends on its estate and on its ministers. Pleased parties help the realm and their ministers work harder; angry ones do the opposite, more so the more seats they hold.\n\nThe #T War Party#!, the #T Regional Party#! and the #T Liberal Party#! must be handled: left angry with a fifth of the seats, they escalate to a coup, a rising or an uprising."
 CC_PTY_LABEL_POWER: "Power"
 CC_PTY_LABEL_SATISFACTION: "Satisfaction"
 CC_PTY_LABEL_MEMBERS: "Ministers"
 CC_PTY_LABEL_AGENDA: "Agenda:"
 CC_PTY_LABEL_CABINET: "Cabinet:"
 CC_PTY_LABEL_LIBERAL_THOUGHT: "Liberal Thought"
 CC_PTY_POWER_TT: "This party's share of the combined strength of all four parties. Strength comes from its estates' power, plus 8 for each of its ministers in the cabinet. An attack cuts it by 40% for five years."
 CC_PTY_SAT_TT: "From -100 to 100. Reviewed every two to four years, moving halfway toward what the party expects (the number after the arrow). A minister of the party being seated or dismissed moves it by 10 at once."
 CC_PTY_MEMBERS_TT: "Ministers in the cabinet who belong to this party."
 CC_PTY_AGENDA_TT: "A party with a quarter of the seats or more sets an agenda every five to twelve years and gives the government six years to meet it. Met: +30 satisfaction, and political influence equal to half the party's seats. Missed: -25."
 CC_PTY_DOMINANT: "#P Leading#!"
 CC_PTY_DOMINANT_TT: "The strongest party, with 30% power or more. Society moves its way: half as fast under a balanced cabinet, half again as fast if it also runs a stacked cabinet."
 CC_PTY_MOOD_PLEASED: "#P Pleased#!"
 CC_PTY_MOOD_PLEASED_TT: "Satisfaction above 30. The realm gets this party's goodwill modifier, scaled by its power and satisfaction, and its ministers work 5% better."
 CC_PTY_MOOD_CONTENT: "Content"
 CC_PTY_MOOD_CONTENT_TT: "Satisfaction from -20 to 30. No effect either way."
 CC_PTY_MOOD_DISCONTENT: "#N Discontent#!"
 CC_PTY_MOOD_DISCONTENT_TT: "Satisfaction from -50 to -20. The realm gets this party's discontent modifier, scaled by its power and satisfaction, and its ministers work 10% worse."
 CC_PTY_MOOD_ANGRY: "#N Angry#!"
 CC_PTY_MOOD_ANGRY_TT: "Satisfaction below -50. The realm gets this party's discontent modifier, scaled by its power and satisfaction, and its ministers work 20% worse."
 CC_PTY_ESC_WARN: "#N Escalating#!"
 CC_PTY_ESC_WARN_TT: "This party is angry and holds 20% power or more, and it is moving toward open defiance. Each review spent like this is a step: first a warning, then unrest, then the outcome. Raise its satisfaction above -50 or cut its power below 20% to step it back down."
 CC_PTY_COMP_STACKED: "Stacked"
 CC_PTY_COMP_STACKED_TT: "One party holds more than half the cabinet seats. +5% cabinet efficiency and +10% political influence gain, and that party's goodwill and push are stronger. Every other party expects 10 less satisfaction, and the court's rivalry grows."
 CC_PTY_COMP_BALANCED: "Balanced"
 CC_PTY_COMP_BALANCED_TT: "No party holds more than 40% of the seats and at least three are seated. +0.5 monthly political influence, stability is cheaper, bribes and attacks cost 25% less, and no party's satisfaction target falls below -20. Goodwill bonuses are 25% weaker and society moves half as fast."
 CC_PTY_COMP_MIXED: "Mixed"
 CC_PTY_COMP_MIXED_TT: "Neither stacked nor balanced. Fewer than three seats, or no clear pattern."
 CC_PTY_TERMLIMITS: "#T Term limits#!"
 CC_PTY_TERMLIMITS_TT: "While the Reform Party or the Liberal Party leads the realm, a minister who has served ten years leaves office at the next review and cannot return for ten years."
 CC_PTY_LIBERAL_THOUGHT_TT: "The average of Liberal Thought in the capital and the cities, shown on the map by this situation. It grows with literacy, the Enlightenment and a liberal society. At 50 the Liberal Party forms."
 CC_PTY_BTN_BRIBE: "Bribe"
 CC_PTY_BTN_ATTACK: "Attack"
 CC_PTY_BTN_FAVOUR: "Favour"

 # ---- Action requirements ----
 cc_pty_tt_bribe_cooldown: "This party was bribed less than two years ago"
 cc_pty_tt_attack_cooldown: "This party was attacked less than five years ago"
 cc_pty_tt_attack_power: "The party holds at least 10% power"
 cc_pty_tt_favour_cooldown: "This party granted a favour less than five years ago"
 cc_pty_tt_favour_sat: "The party's satisfaction is at least 10"

 # ---- Rebels ----
 cc_pty_regional_rebels: "Provincial League"

 # ---- Disasters ----
 cc_pty_praetorian_coup: "The Officers' Coup"
 cc_pty_praetorian_coup_desc: "The War Party has run out of patience. Officers have taken the guardrooms, ministers are afraid to go home, and nothing the government orders is carried out until the army agrees to it. It ends when the War Party is satisfied again, or after five years."
 cc_pty_liberal_uprising: "The Liberal Uprising"
 cc_pty_liberal_uprising_desc: "The liberal clubs are in the streets. They want a constitution, limits on the crown and a say in government, and they will not go home without some of it. It ends when the Liberal Party is satisfied again, or after five years."

 # ---- Events ----
 cc_pty.10.title: "New Parties"
 cc_pty.10.desc: "The old alignments have broken up and new ones have formed in their place. The realm's politics are now divided between the [ROOT.GetCountry.Custom('cc_pty_name_1')], the [ROOT.GetCountry.Custom('cc_pty_name_2')], the [ROOT.GetCountry.Custom('cc_pty_name_3')] and the [ROOT.GetCountry.Custom('cc_pty_name_4')].\n\nParties that survived keep their standing. New ones start with none, and ministers whose party has dissolved will find another."
 cc_pty.10.a: "We will learn their names."
 cc_pty.20.title: "An Agenda"
 cc_pty.20.desc: "The leaders of the [ROOT.GetCountry.Custom('cc_pty_event_name')] have sent the government their demands. They want one thing above all:\n\n#T [ROOT.GetCountry.Custom('cc_pty_event_agenda')]#!\n\nThey will give us six years. If it is done, they will remember it. If it is not, they will remember that too."
 cc_pty.20.a: "We will see what can be done."
 cc_pty.20.a.tt: "Meet the agenda within six years for +30 satisfaction with this party. Miss it and lose 25."
 cc_pty.20.b: "The government does not take orders."
 cc_pty.30.title: "Crossing the Floor"
 cc_pty.30.desc: "[cc_pty_defector.GetName] has had enough of the [ROOT.GetCountry.Custom('cc_pty_defect_from_name')]. Its quarrel with the government has become their quarrel, and they have been seen dining with the leaders of the [ROOT.GetCountry.Custom('cc_pty_defect_to_name')]. They have asked whether the government would object."
 cc_pty.30.a: "Let them go where they like."
 cc_pty.30.b: "Remind them who appointed them."
 cc_pty.30.c: "Then they can leave the cabinet as well."
 cc_pty.40.title: "The Officers Move"
 cc_pty.40.desc: "The War Party has stopped asking. Officers loyal to it have occupied the guardrooms and the arsenals, and their spokesmen have presented the government with terms. Nobody has been harmed yet."
 cc_pty.40.a: "Give the officers what they want."
 cc_pty.40.b: "Arrest the ringleaders."
 cc_pty.41.title: "The Provinces Rise"
 cc_pty.41.desc: "The provincial lords have formed a league against the capital. They want their old rights back, their own judges and their own taxes, and they are raising men to make the point."
 cc_pty.41.a: "The realm will not be divided."
 cc_pty.41.a.tt: "A rebel league takes about a fifth of our provinces, never the capital's, and a civil war begins."
 cc_pty.41.b: "Grant the provinces their rights."
 cc_pty.42.title: "The Clubs Take to the Streets"
 cc_pty.42.desc: "The Liberal Party's clubs have called their members out. There are crowds in the squares, printed demands on every door and soldiers who are not sure whose side they are on."
 cc_pty.42.a: "Concede some reforms."
 cc_pty.42.b: "Close the clubs and arrest the leaders."
 cc_pty.43.title: "The Subjects Pull Away"
 cc_pty.43.desc: "The Regional Party has carried its quarrel with the capital to our subjects, and they have listened. Their courts are slower to answer our letters and quicker to talk to each other."
 cc_pty.43.a: "Let them sulk."
 cc_pty.43.b: "Pay for their goodwill."
 cc_pty.45.title: "The Officers Stand Down"
 cc_pty.45.desc: "The officers have returned to their barracks. Whatever was promised or threatened, the government governs again."
 cc_pty.45.a: "Good."
 cc_pty.46.title: "The Streets Are Quiet"
 cc_pty.46.desc: "The crowds have gone home and the clubs have gone back to arguing among themselves."
 cc_pty.46.a: "Good."
 cc_pty.50.title: "The Liberal Party"
 cc_pty.50.desc: "Liberal Thought has spread far enough in our cities that it now has a party of its own. It wants constitutional government, limits on the crown and offices open to merit. It will take a place among the realm's parties at once."
 cc_pty.50.a: "We will have to deal with them."
 cc_pty.60.title: "Term Limits"
 cc_pty.60.desc: "The reformers now lead the realm, and they have had their way: no minister should hold office for life. From now on a minister who has served ten years steps down at the next review, and may not return for ten more."
 cc_pty.60.a: "So be it."
 cc_pty.61.title: "Term Limits Lifted"
 cc_pty.61.desc: "The reformers no longer lead the realm, and the rule that ministers step down after ten years has lapsed."
 cc_pty.61.a: "So be it."

 # ---- Hand-written modifiers (main_menu/common/static_modifiers/cc_pty_modifiers.txt) ----
 STATIC_MODIFIER_NAME_cc_pty_member_content: "Party Pleased"
 STATIC_MODIFIER_DESC_cc_pty_member_content: "This minister's party is pleased with the government, and the minister works accordingly."
 STATIC_MODIFIER_NAME_cc_pty_member_discontent: "Party Discontent"
 STATIC_MODIFIER_DESC_cc_pty_member_discontent: "This minister's party is unhappy with the government. The minister does what is required and little more."
 STATIC_MODIFIER_NAME_cc_pty_member_angry: "Party Angry"
 STATIC_MODIFIER_DESC_cc_pty_member_angry: "This minister's party is openly hostile to the government, and the minister is expected to show it."
 STATIC_MODIFIER_NAME_cc_pty_comp_stacked: "Stacked Cabinet"
 STATIC_MODIFIER_DESC_cc_pty_comp_stacked: "One party holds more than half the cabinet seats. The cabinet works as one, and the other parties notice."
 STATIC_MODIFIER_NAME_cc_pty_comp_balanced: "Balanced Cabinet"
 STATIC_MODIFIER_DESC_cc_pty_comp_balanced: "No party holds more than 40% of the cabinet seats. Every party has a voice, and none feels shut out."
 STATIC_MODIFIER_NAME_cc_pty_regional_concession: "Provincial Rights"
 STATIC_MODIFIER_DESC_cc_pty_regional_concession: "The provinces were granted their old rights to end a rising, and the capital's writ runs less far for it."

 # ---- Effect tooltips (actions and event options) ----
 cc_pty_tt_bribe_effect: "This party's satisfaction rises by 25."
 cc_pty_tt_attack_effect: "This party's strength falls by 40% for five years and its satisfaction by 30. Parties opposed to it gain 10 satisfaction."
 cc_pty_tt_favour_effect: "We receive this party's favour for five years. Its satisfaction falls by 15."
 cc_pty_tt_refuse_agenda: "The party drops its agenda and loses 15 satisfaction."
 cc_pty_tt_defect: "[cc_pty_defector.GetName] joins the [ROOT.GetCountry.Custom('cc_pty_defect_to_name')]."
 cc_pty_tt_military_concede: "The War Party gains 60 satisfaction."
 cc_pty_tt_military_purge: "The War Party's strength falls by 40% for ten years and it loses 20 satisfaction."
 cc_pty_tt_liberal_concede: "The Liberal Party gains 60 satisfaction."
 cc_pty_tt_liberal_purge: "The Liberal Party's strength falls by 40% for ten years and it loses 20 satisfaction."
 cc_pty_tt_regional_concede: "The Regional Party gains 50 satisfaction."
 cc_pty_tt_regional_sat_30: "The Regional Party gains 30 satisfaction."
 cc_pty_tt_regional_sat_40: "The Regional Party gains 40 satisfaction."

 # ---- Chamber panel ----
 CC_PTY_LABEL_TOP_AGENDA: "Agenda:"
 CC_PTY_TOP_AGENDA_TT: "The leading party's agenda, or if it has none, another party's. Each card shows its own party's agenda."
 CC_PTY_NO_TOP_AGENDA: "No party has an agenda"
 CC_PTY_LABEL_SEATS: "seats"
 CC_PTY_CHAMBER_TT: "The size of the chamber. It grows with the realm, from 20 seats to at most 84, and is shared among the parties by the seats their estates hold across the realm."
 CC_PTY_SEATS_TT: "Seats held by this party: those its estates hold across the realm, plus 2 for each of its ministers in the cabinet. Its power is its share of the chamber."
 CC_PTY_CARD_SELECT_TT: "Select this party. The buttons below act on the selected party."
 CC_PTY_LABEL_LEADER: "Leader"
 CC_PTY_NO_LEADER: "No leader"
 CC_PTY_NO_LEADER_TT: "The party has no minister in the cabinet. In our realm a leader steps forward at the next review."
 CC_PTY_SELECT_HINT: "Select a party to act on it."
 CC_PTY_BTN_APPOINT: "Appoint Leader"
 CC_PTY_BTN_CONCEDE: "Concede"
 CC_PTY_BTN_ELECTION: "Call Election"

 # ---- New actions ----
 cc_pty_election: "Call an Election"
 cc_pty_election_desc: "Dissolve the chamber and count the seats again now, instead of at the next review. Parties that have lost their footing may be replaced. Once every ten years."
 cc_pty_tt_appoint_effect: "The party's leader takes a seat in the cabinet, replacing the least senior minister of another party if no seat is open."
 cc_pty_tt_concede_effect: "The agenda counts as met: this party gains 30 satisfaction and we gain political influence equal to half its seats. Every party opposed to it loses 10."
 cc_pty_tt_election_effect: "The seats are counted again and the parties are reviewed now. We gain 2 political influence for each seat the head of the cabinet's party gains, and lose 1 for each seat it loses."
 cc_pty_tt_appoint_leader: "The party has a living leader"
 cc_pty_tt_appoint_not_seated: "The leader is not already in the cabinet"
 cc_pty_tt_concede_agenda: "The party has an agenda"
 cc_pty_tt_election_cooldown: "No election has been called in the last ten years"

 # ---- Effects section ----
 CC_PTY_FX_HEADER: "Effects of the selected party"
 CC_PTY_FX_HEADER_TT: "What the selected party is doing to the realm right now. Every party grants its standing by holding seats; its mood, its lead and any favour it has granted add more."
 CC_PTY_FX_STRENGTH_TT: "Current strength. 100% is the value listed: for standing, a quarter of the chamber; for moods, a quarter of the chamber at satisfaction 50 or -50."
 CC_PTY_FX_STANDING: "Standing"
 CC_PTY_FX_STANDING_TT: "Granted by every party with a tenth of the seats or more, whatever its mood. Scales with its share of the chamber."
 CC_PTY_FX_MARGINAL: "#N Marginalised#!"
 CC_PTY_FX_MARGINAL_TT: "The party holds less than a tenth of the chamber, and the estate behind it feels unheard."
 CC_PTY_FX_GOODWILL: "#P Goodwill#!"
 CC_PTY_FX_DISCONTENT: "#N Discontent#!"
 CC_PTY_FX_PUSH: "Ascendant"
 CC_PTY_FX_FAVOUR: "Favour"
 CC_PTY_FX_FAVOUR_TT: "A favour this party granted when asked. Lasts five years."
 CC_PTY_TARGET_TT: "What the party expects, and where its satisfaction is heading at the next review:\n- its estate's mood\n- +15 for one minister in the cabinet, +25 for two or more\n- -20 with no minister while it holds a fifth of the seats\n- +15 if the head of the cabinet belongs to it\n- +10 if the ruler belongs to it\n- in a stacked cabinet, +10 for the party that runs it and -10 for the others\n- in a balanced cabinet, never below -20"
 CC_PTY_MAJORITY: "#P Working majority#!"
 CC_PTY_MAJORITY_TT: "The head of the cabinet's party holds 40% of the seats or more: +15% political influence gain."
 CC_PTY_HUNG: "#N Hung chamber#!"
 CC_PTY_HUNG_TT: "No party holds 30% of the seats: -10% political influence gain."
 CC_PTY_LABEL_LEADERS_IN: "Leaders in office:"
 CC_PTY_LEADERS_IN_TT: "Parties whose leader sits in the cabinet. Each gives +0.05 monthly political influence."
 STATIC_MODIFIER_NAME_cc_pty_leaders_in_office: "Party Leaders in Office"
 STATIC_MODIFIER_DESC_cc_pty_leaders_in_office: "Party leaders who sit in the cabinet bring their parties' support with them. Scales with the number of parties whose leader holds office."
 STATIC_MODIFIER_NAME_cc_pty_working_majority: "Working Majority"
 STATIC_MODIFIER_DESC_cc_pty_working_majority: "The head of the cabinet's party holds at least 40% of the chamber, and the government's business gets through."
 STATIC_MODIFIER_NAME_cc_pty_hung_chamber: "Hung Chamber"
 STATIC_MODIFIER_DESC_cc_pty_hung_chamber: "No party holds even 30% of the chamber, and every measure has to be bargained for."
