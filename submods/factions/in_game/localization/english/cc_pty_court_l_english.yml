 # ---- Court event modifiers (main_menu/common/static_modifiers/cc_pty_modifiers.txt) ----
 STATIC_MODIFIER_NAME_cc_pty_ce_confidant: "Ruler's Confidant"
 STATIC_MODIFIER_DESC_cc_pty_ce_confidant: "This minister has the ruler's trust and speaks with the ruler's authority."
 STATIC_MODIFIER_NAME_cc_pty_ce_minister_rule: "Government by Minister"
 STATIC_MODIFIER_DESC_cc_pty_ce_minister_rule: "A long-serving minister runs the government in the ruler's name. The work gets done, and the crown's own authority is thinner for it."
 STATIC_MODIFIER_NAME_cc_pty_ce_compromise: "Cross-Party Compromise"
 STATIC_MODIFIER_DESC_cc_pty_ce_compromise: "Ministers of opposed parties drafted a measure together, and the crown backed it. The council works more smoothly."
