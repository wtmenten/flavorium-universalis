l_english:
 # ---- Court events (cc_pty.80-98). Hand-written. ----

 # The Knife
 cc_pty.80.title: "Bad Blood"
 cc_pty.80.desc: "The council meeting ended in shouting. [cc_pty_ce_a.GetName] of the [ROOT.GetCountry.Custom('cc_pty_ev_a_name')] accused [cc_pty_ce_b.GetName] of the [ROOT.GetCountry.Custom('cc_pty_ev_b_name')] of lying to the crown, and [cc_pty_ce_b.GetName] answered with worse. The other ministers sat in silence. Both now expect the crown to say who was in the right."
 cc_pty.80.a: "Rebuke them both."
 cc_pty.80.b: "[cc_pty_ce_a.GetName] was in the right."
 cc_pty.80.c: "[cc_pty_ce_b.GetName] was in the right."
 cc_pty.80.d: "Let them settle it between themselves."
 cc_pty.81.title: "Whispers of a Plot"
 cc_pty.81.desc: "An informer has come to the palace with a story. Men in the pay of [cc_pty_ce_a.GetName] have been asking about [cc_pty_ce_b.GetName]'s habits: which roads they ride, which doors they leave by, who guards them at night. The informer is not certain what is planned, but there is little doubt about the intent."
 cc_pty.81.a: "Arrest [cc_pty_ce_a.GetName]."
 cc_pty.81.b: "Warn [cc_pty_ce_b.GetName] quietly."
 cc_pty.81.c: "It is not the crown's quarrel."
 cc_pty.82.title: "Murder at Court"
 cc_pty.82.desc: "[cc_pty_ce_b.GetName] is dead, stabbed on the way home from the council. The killers escaped. Nobody at court doubts who sent them, and the [ROOT.GetCountry.Custom('cc_pty_ev_b_name')] is demanding that the crown act."
 cc_pty.82.a: "Hunt down the killers, and whoever paid them."
 cc_pty.82.b: "Let the matter rest."
 cc_pty.83.title: "The Plot Unravels"
 cc_pty.83.desc: "The men sent to kill [cc_pty_ce_b.GetName] were taken before they could act. Under questioning they named their employer: [cc_pty_ce_a.GetName]. The court is waiting to see what the crown will do with a minister who planned a murder."
 cc_pty.83.a: "Put [cc_pty_ce_a.GetName] on trial."
 cc_pty.83.b: "Send [cc_pty_ce_a.GetName] abroad, quietly."
 cc_pty.83.c: "Pardon [cc_pty_ce_a.GetName]. They will owe us for it."

 # An Affair of Honour
 cc_pty.85.title: "An Affair of Honour"
 cc_pty.85.desc: "[cc_pty_ce_a.GetName] of the [ROOT.GetCountry.Custom('cc_pty_ev_a_name')] has challenged [cc_pty_ce_b.GetName] of the [ROOT.GetCountry.Custom('cc_pty_ev_b_name')] to a duel over an insult given in council. The seconds have been named and the ground chosen. Only the crown can stop it now."
 cc_pty.85.a: "Forbid it."
 cc_pty.85.b: "Let them meet."
 cc_pty.85.c: "They will settle it at the council table."
 cc_pty.86.title: "The Duel"
 cc_pty.86.desc: "[cc_pty_ce_a.GetName] and [cc_pty_ce_b.GetName] met at dawn. [cc_pty_ce_b.GetName] was carried from the field and died before noon. [cc_pty_ce_a.GetName] returned to the council the same week, and the [ROOT.GetCountry.Custom('cc_pty_ev_b_name')] will not forgive it."
 cc_pty.86.a: "A waste of a good minister."

 # The Power Behind the Throne
 cc_pty.88.title: "The Power Behind the Throne"
 cc_pty.88.desc: "[cc_pty_ce_a.GetName] has served long enough to know every office and every officer, and has begun issuing orders in the name of [cc_pty_ce_ruler.GetName] without asking first. The orders are sensible and the work gets done, but people at court have started to ask who actually governs."
 cc_pty.88.a: "Remind them who wears the crown."
 cc_pty.88.b: "Let them govern. It works."
 cc_pty.88.c: "Dismiss [cc_pty_ce_a.GetName]."
 cc_pty.89.title: "The Minister's Price"
 cc_pty.89.desc: "[cc_pty_ce_a.GetName] has run the government for years now, and wants something in return: offices for the [ROOT.GetCountry.Custom('cc_pty_ev_a_name')], from the treasury to the provincial courts. The other parties are watching."
 cc_pty.89.a: "Give them the offices."
 cc_pty.89.b: "Refuse, and take back the reins."
 cc_pty.89.c: "Remove [cc_pty_ce_a.GetName] from office."

 # Across the Aisle
 cc_pty.91.title: "Across the Aisle"
 cc_pty.91.desc: "[cc_pty_ce_a.GetName] of the [ROOT.GetCountry.Custom('cc_pty_ev_a_name')] and [cc_pty_ce_b.GetName] of the [ROOT.GetCountry.Custom('cc_pty_ev_b_name')] agree on almost nothing, yet they have brought the council a measure they drafted together. Neither party is happy about it, but both have said they will accept it if the crown does."
 cc_pty.91.a: "Back their compromise."
 cc_pty.91.b: "Adopt it as the crown's own idea."
 cc_pty.91.c: "Shelve it."
 cc_pty.92.title: "An Unlikely Friendship"
 cc_pty.92.desc: "Since their measure passed, [cc_pty_ce_a.GetName] and [cc_pty_ce_b.GetName] have been seen dining together and walking in the palace gardens. Their parties grumble, but the council has rarely worked better."
 cc_pty.92.a: "Honour them both."
 cc_pty.92.b: "Let their example speak for itself."

 # A Friend at Court
 cc_pty.94.title: "A Friend at Court"
 cc_pty.94.desc: "[cc_pty_ce_ruler.GetName] and [cc_pty_ce_a.GetName] have taken to talking long after the council rises: about the realm, about books, about nothing in particular. It is rare for a ruler to have someone to speak to plainly."
 cc_pty.94.a: "Take [cc_pty_ce_a.GetName] into confidence."
 cc_pty.94.b: "A ruler should keep a proper distance."
 cc_pty.95.title: "Jealousy at Court"
 cc_pty.95.desc: "[cc_pty_ce_b.GetName] of the [ROOT.GetCountry.Custom('cc_pty_ev_b_name')] has complained openly that [cc_pty_ce_a.GetName] has the ruler's ear, and that decisions are made over supper rather than in council. Others are beginning to say the same."
 cc_pty.95.a: "Stand by [cc_pty_ce_a.GetName]."
 cc_pty.95.b: "Put some distance between us."

 # Loyalty Tested
 cc_pty.97.title: "Loyalty Tested"
 cc_pty.97.desc: "The [ROOT.GetCountry.Custom('cc_pty_ev_a_name')] has turned against the government and asked its ministers to stay away from the council in protest. [cc_pty_ce_a.GetName] refused, and came to work as usual. Their party has not taken it well."
 cc_pty.97.a: "Honour [cc_pty_ce_a.GetName] publicly."
 cc_pty.97.b: "Reward [cc_pty_ce_a.GetName] privately."
 cc_pty.97.c: "A loyal servant needs no reward."

