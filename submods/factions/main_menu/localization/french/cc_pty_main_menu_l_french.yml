 # Flavorium Universalis - Factions: game rule and situation hint

 rule_cc_factions: "C&C : Partis politiques"
 rule_cc_factions_desc: "Lorsqu'elle est activée, le joueur, les grandes puissances et les royaumes ayant un développement de 100 ou plus disposent de quatre partis politiques tirés de leurs ordres, de leur gouvernement et de l'époque. Chaque ministre appartient à l'un d'eux. Les partis gagnent ou perdent en satisfaction selon la manière dont leur ordre est traité et s'ils détiennent des sièges au cabinet, fixent des agendas et influencent le royaume et leurs ministres. Certains doivent être gérés, sinon ils dégénèrent en coup d'État, en soulèvement ou en insurrection."
 setting_cc_factions_on: "Activé"
 setting_cc_factions_on_desc: "Les partis sont simulés pour votre royaume ainsi que pour les royaumes d'IA plus importants."
 setting_cc_factions_off: "Désactivé"
 setting_cc_factions_off_desc: "Aucun parti. Tout modificateur de parti déjà appliqué sera supprimé lors de la prochaine mise à jour annuelle."

 hint_cc_pty_factions: "Factions"
 hint_cc_pty_factions_hint_text: "Votre royaume compte quatre partis, choisis parmi onze par votre gouvernement, l'époque et vos ordres, et choisis à nouveau tous les quinze à vingt-cinq ans. Chaque ministre appartient à l'un d'eux.\n\nLes partis siègent dans une #T chambre#! de 20 à 84 sièges. Les sièges proviennent de vos lieux selon leur rang et sont partagés entre les ordres selon leur pouvoir local ; chaque parti récupère les sièges de ses ordres, et chaque ministre apporte 2 sièges supplémentaires à son parti. Le pouvoir d'un parti correspond à sa part des sièges.\n\nTous les deux à quatre ans, chaque parti examine la manière dont il est traité. Des sièges au cabinet et un ordre satisfait augmentent sa satisfaction ; exclure un parti puissant la diminue. Les partis satisfaits aident le royaume ; ceux qui sont en colère lui nuisent, d'autant plus qu'ils détiennent de sièges.\n\nSélectionnez la carte d'un parti pour agir : #T Corrompre#!, #T Attaquer#!, #T Demander une faveur#!, #T Nommer le chef#! ou #T Concéder l'ordre du jour#!. #T Convoquer des élections#! recompte les sièges immédiatement.\n\nLe Parti de la Guerre, le Parti Régionaliste et le Parti Libéral doivent être gérés. S'ils restent en colère avec un cinquième des sièges, ils provoquent un coup d'État, une insurrection ou un soulèvement."
