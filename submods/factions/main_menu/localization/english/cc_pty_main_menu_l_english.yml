l_english:
 # Flavorium Universalis - Factions: game rule and situation hint

 rule_cc_factions: "C&C: Political Parties"
 rule_cc_factions_desc: "When enabled, the player, great powers and realms with 100 or more development have four political parties drawn from their estates, government and age. Every minister belongs to one. Parties gain and lose satisfaction based on how their estate is treated and whether they hold cabinet seats, set agendas, and affect the realm and their ministers. Some must be handled or they escalate to a coup, a rising or an uprising."
 setting_cc_factions_on: "Enabled"
 setting_cc_factions_on_desc: "Parties are simulated for your realm and for larger AI realms."
 setting_cc_factions_off: "Disabled"
 setting_cc_factions_off_desc: "No parties. Any party modifiers already applied are removed at the next yearly update."

 hint_cc_pty_factions: "Factions"
 hint_cc_pty_factions_hint_text: "Your realm has four parties, chosen from eleven by your government, the age and your estates, and chosen again every fifteen to twenty-five years. Every minister belongs to one.\n\nThe parties sit in a #T chamber#! of 20 to 84 seats. Seats come from your locations by rank and are shared among the estates by their power there; each party takes its estates' seats, and each minister brings their party 2 more. A party's power is its share of the seats.\n\nEvery two to four years each party reviews how it is treated. Seats in the cabinet and a content estate raise its satisfaction; shutting a strong party out lowers it. Pleased parties help the realm; angry ones hurt it, more so the more seats they hold.\n\nSelect a party's card to act on it: #T Bribe#!, #T Attack#!, #T Ask a Favour#!, #T Appoint the Leader#! or #T Concede the Agenda#!. #T Call an Election#! recounts the seats at once.\n\nThe War Party, the Regional Party and the Liberal Party must be handled. Left angry with a fifth of the seats, they escalate to a coup, a rising or an uprising."
