l_spanish:
 # Flavorium Universalis - Factions: game rule and situation hint

 rule_cc_factions: "C&C: Partidos Políticos"
 rule_cc_factions_desc: "Cuando está activado, el jugador, las grandes potencias y los reinos con 100 o más de desarrollo tienen cuatro partidos políticos derivados de sus estamentos, gobierno y era. Cada ministro pertenece a uno. Los partidos ganan y pierden satisfacción según cómo sea tratado su estamento y si ocupan escaños en el gabinete, establecen agendas y afectan al reino y a sus ministros. Algunos deben ser gestionados o escalarán hacia un golpe de estado, una sublevación o una insurrección."
 setting_cc_factions_on: "Activado"
 setting_cc_factions_on_desc: "Los partidos se simulan para tu reino y para los reinos de la IA más grandes."
 setting_cc_factions_off: "Desactivado"
 setting_cc_factions_off_desc: "No hay partidos. Cualquier modificador de partido ya aplicado se eliminará en la próxima actualización anual."

 hint_cc_pty_factions: "Facciones"
 hint_cc_pty_factions_hint_text: "Tu reino tiene cuatro partidos, elegidos entre once según tu gobierno, la época y tus estamentos, y elegidos de nuevo cada quince o veinticinco años. Cada ministro pertenece a uno.\n\nLos partidos se sientan en una #T cámara#! de 20 a 84 escaños. Los escaños provienen de tus ubicaciones según su rango y se reparten entre los estamentos según su poder allí; cada partido toma los escaños de sus estamentos, y cada ministro aporta 2 más a su partido. El poder de un partido es su proporción de escaños.\n\nCada dos o cuatro años, cada partido revisa cómo está siendo tratado. Los puestos en el gabinete y un estamento satisfecho aumentan su satisfacción; excluir a un partido fuerte la reduce. Los partidos complacidos ayudan al reino; los enfadados lo perjudican, y más cuanto más escaños posean.\n\nSelecciona la carta de un partido para actuar sobre él: #T Sobornar#!, #T Atacar#!, #T Pedir un favor#!, #T Nombrar al líder#! o #T Conceder la agenda#!. #T Convocar elecciones#! recalcula los escaños inmediatamente.\n\nEl Partido de la Guerra, el Partido Regional y el Partido Liberal deben ser gestionados. Si se quedan enfadados poseyendo una quinta parte de los escaños, escalarán hacia un golpe de estado, una insurrección o un levantamiento."
