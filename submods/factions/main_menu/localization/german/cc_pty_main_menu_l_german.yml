l_german:
 # Flavorium Universalis - Factions: game rule and situation hint

 rule_cc_factions: "C&C: Politische Parteien"
 rule_cc_factions_desc: "Wenn aktiviert, verfügen der Spieler, Großmächte und Reiche mit 100 oder mehr Entwicklung über vier politische Parteien, die aus ihren Ständen, der Regierung und dem Zeitalter hervorgehen. Jeder Minister gehört zu einer davon. Parteien gewinnen oder verlieren an Zufriedenheit, je nachdem, wie ihr Stand behandelt wird und ob sie Kabinettsitze innehaben, Agenden festlegen und das Reich sowie ihre Minister beeinflussen. Einige müssen kontrolliert werden, da sie sonst zu einem Putsch, einem Aufstand oder einer Rebellion eskalieren."
 setting_cc_factions_on: "Aktiviert"
 setting_cc_factions_on_desc: "Parteien werden für Ihr Reich und für größere KI-Reiche simuliert."
 setting_cc_factions_off: "Deaktiviert"
 setting_cc_factions_off_desc: "Keine Parteien. Alle bereits angewandten Parteimodifikatoren werden beim nächsten jährlichen Update entfernt."

 hint_cc_pty_factions: "Fraktionen"
 hint_cc_pty_factions_hint_text: "Ihr Reich hat vier Parteien, die von Ihrer Regierung, dem Zeitalter und Ihren Ständen aus elf möglichen ausgewählt wurden und alle fünfzehn bis fünfundzwanzig Jahre neu bestimmt werden. Jeder Minister gehört einer an.\n\nDie Parteien sitzen in einer #T Kammer#! mit 20 bis 84 Sitzen. Sitze werden basierend auf dem Rang Ihrer Orte vergeben und unter den Ständen entsprechend ihrer dortigen Macht aufgeteilt; jede Partei erhält die Sitze ihrer Stände, und jeder Minister bringt seiner Partei 2 weitere Sitze ein. Die Macht einer Partei ist ihr Anteil an den Sitzen.\n\nAlle zwei bis vier Jahre überprüft jede Partei, wie sie behandelt wird. Sitze im Kabinett und ein zufriedener Stand erhöhen ihre Zufriedenheit; das Ausschließen einer starken Partei senkt sie. Zufriedene Parteien helfen dem Reich; wütende schaden ihm, wobei der Schaden mit der Anzahl ihrer Sitze steigt.\n\nWählen Sie die Karte einer Partei, um eine Aktion auszuführen: #T Bestechen#!, #T Angreifen#!, #T Um einen Gefallen bitten#!, #T Den Anführer ernennen#! oder #T Die Agenda akzeptieren#!. #T Wahlen ausrufen#! zählt die Sitze sofort neu.\n\nDie Kriegspartei, die Regionalpartei und die Liberalpartei müssen kontrolliert werden. Wenn sie wütend sind und über ein Fünftel der Sitze verfügen, eskaliert dies zu einem Putsch, einer Auflehnung oder einem Aufstand."
