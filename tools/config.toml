### Translation ###
source_language = "english" # Options: english, french, german, spanish, polish, russian, simp_chinese, turkish, braz_por, japanese, korean
translate_workshop = false # Auto-translate workshop title/description into other languages. You can also use -wp/--workshop-pages instead.
translate_change_notes_by_default = false # Should running translate.py translate change notes? You can also use -cn/--change-notes instead.
translate_submods_by_default = false # Should running translate.py include all submods from submods/? You can also use -s/--submods instead.
localization_translator = "local" # Options: local, deepl, gemini-3-flash
workshop_title_translator = "local" # Options: local, deepl, gemini-3-flash
workshop_description_translator = "local" # Options: local, deepl, gemini-3-flash

# Local OpenAI-compatible server (llama.cpp / llama-swap / LM Studio / Ollama) #
local_api_base = "http://127.0.0.1:9292/v1"
local_model = "gemma_4_31b_it_heretic-Q4_K_M"
local_api_key = "" # Optional bearer token; leave blank for an unauthenticated local server.
local_batch_size = 25 # Localization strings sent per request. Larger batches are faster but risk dropped entries.
local_concurrency = 3 # Parallel in-flight requests. Match your server's parallel slot count.
local_temperature = 0.2
local_max_tokens = 8192
local_timeout_seconds = 600 # Raise this if the server has to swap a large model in.
local_disable_thinking = true # Sends chat_template_kwargs.enable_thinking=false. Reasoning models are ~8x slower without it.

# Prompts for use with Gemini-3-Flash #
gemini_localization_system_prompt = "You are a professional localization translator. Translate the user's Europa Universalis localization text into {target_language}. Preserve any bracketed tokens, variables, and EU5 markup exactly. Do not add commentary; output only the translated text."
gemini_description_system_prompt = "You are a professional Steam mod page translator. Translate the user's Europa Unversalis mod description into {target_language}. Preserve all BBCode tags, list markers, URLs, and bracketed tokens exactly. Do not add commentary; output only the translated text."
gemini_title_system_prompt = "You are a professional Steam mod title translator. Translate the user's Europa Unversalis mod title into {target_language}. Do not add commentary; output only the translated title for use on the Steam Workshop mod page."
gemini_additional_context = "" # Optional: additional context appended to all Gemini translation prompts (localization, title, and description). e.g. "This mod is set in the fantasy world of X and uses terms like Y to mean Z"

### Uploading ####
### 1.3b temp workshop_upload_item_id = 3738496083 # Replace with your mod's Workshop item ID (0 creates a new item)
workshop_upload_item_id = 3737705389 # Replace with your mod's Workshop item ID (0 creates a new item)
workshop_upload_item_id_dev = 0 # Optional: dev Workshop item ID for upload.py -d/--dev (0 creates a new item)
upload_mod_by_default = true # Should running upload.py upload the mod? You can also use -m/--mod instead.
upload_workshop_pages_by_default = false # Should running upload.py upload the mod's Workshop pages? You can also use -wp/--workshop-pages instead.
upload_only_on_version_change = false # If true, mod/submod uploads only run when the metadata.json version changed since the last successful upload.
upload_change_notes_by_default = false # Should running upload.py upload change notes? You can also use -cn/--change-notes instead.
upload_submods_by_default = false # Should running upload.py upload all submods from submods/? You can also use -s/--submods instead.
workshop_dev_name = "" # Optional: override dev mod name for upload.py -d/--dev

