l_spanish:
 # ============================================================
 # SITUATION NAME / DESCRIPTION / HINT
 # ============================================================
 cc_balance_of_power: "El equilibrio de poder"
 cc_balance_of_power_desc: "A lo largo de Europa y el Cercano Oriente, las grandes potencias se observan con recelo. Mientras un estado aspira a la preeminencia, los demás se unen para negársela: el aspirante Bloque Preponderante contra la Coalición de Equilibrio. Mientras ninguno prevalezca, el equilibrio se mantendrá; si este se rompe, podría surgir un nuevo amo del continente, el este podría desbordarse hacia el oeste o la revolución podría barrer por completo el viejo orden."
 hint_cc_balance_of_power: "El equilibrio de poder es una situación de potencias greatness de dos polos. La potencia elegible más fuerte lidera el Bloque Preponderante; la potencia más fuerte que le teme lidera la Coalición de Equilibrio. La Cuota de Preponderancia (0-100, 50 = equilibrio) mide cuán dominante se ha vuelto el bloque líder. Las cortes pueden atraerse entre los bloques mediante el parentesco, la fe, el miedo, las amenazas o el oro; la coalición puede subsidiar a los miembros más débiles, cortejar a los neutrales y convocar un Congreso para cerrar filas. La situación termina cuando el equilibrio se rompe —a través de la hegemonía, un diluvio oriental o una revolución— o se preserva como un Concierto de Europa duradero."

