 cc_bop_needs_free_hands_minister_tt: "Debe asignarse un ministro del gabinete a la tarea #Y $cc_duty_free_hands$#!: un estadista que mantenga abiertas nuestras opciones."
 cc_bop_needs_diplomat_minister_tt: "Un ministro del gabinete debe estar en una misión diplomática — la tarea de #Y $cc_duty_diplomatic_mission$#! o el #Y cuerpo diplomático#! — para trabajar en los canales secundarios."
 cc_bop_cannot_leave_at_war_tt: "Debemos estar #R en paz#! — un bloque cierra filas en tiempos de guerra, y ningún miembro puede abandonar a sus aliados mientras esté bajo las armas."

