 # ============================================================
 # CUSTOM PANEL STRINGS
 # ============================================================
 CC_BOP_EQUILIBRIUM_HEADER: "El Equilibrio"
 CC_BOP_EQUILIBRIUM_DESC: "El 50% representa el equilibrio perfecto. A medida que la cuota del bloque dominante asciende hacia el 65% o más, el equilibrio se acerca al punto de ruptura y puede surgir un hegemón. El círculo muestra la fuerza relativa de los tres bandos: el bloque preponderante, la coalición de equilibrio y las potencias no alineadas."
 CC_BOP_SHARE_SUBLABEL: "Preponderancia"
 CC_BOP_PRE_LEADER_LABEL: "Hegemón aspirante"
 CC_BOP_COA_LEADER_LABEL: "Equilibrador jefe"
 CC_BOP_PRE_TT: "El Bloque Preponderante: el aspirante a hegemon y las potencias reunidas a su alrededor. Su cuota respecto a la fuerza combinada de los tres bandos."
 CC_BOP_COA_TT: "La Coalición de Equilibrio: las potencias unidas para negar a cualquier estado único el dominio del continente. Su cuota de la fuerza combinada de los tres bandos."
 CC_BOP_NEU_TT: "Los no alineados: potencias elegibles que se mantienen al margen del gran juego. Su peso combinado aún puede alterar el equilibrio si son atraídas a cualquiera de los bandos."
 CC_BOP_TENSION_TT: "La Cuota de Preponderancia oscila entre 0 y 100, donde 50 es el equilibrio. A medida que la cuota del bloque dominante supera los 50, la tensión aumenta, y más allá de 65 el equilibrio se acerca al punto de ruptura: podría surgir un hegemon."
 CC_BOP_PREPONDERANCE_PANEL_HEADER: "El Bloque Preponderante"
 CC_BOP_COALITION_PANEL_HEADER: "La Coalición de Equilibrio"
 CC_BOP_OVERVIEW_HEADER: "El Gran Juego"
 CC_BOP_OVERVIEW_DESC: "Dos bandos luchan por el destino de Europa y el Cercano Oriente. El Bloque Preponderante se agrupa detrás de la potencia más fuerte mientras esta busca la preeminencia; la Coalición de Equilibrio se forma para negársela. Mantén el equilibrio —mediante la diplomacia, subsidios, amenazas u oro— y la paz del continente perdurará. Deja que se rompa, y un nuevo orden nacerá en su lugar."

 # ============================================================
 # EVENTS
 # ============================================================
 cc_balance_of_power.1.title: "Un nuevo equilibrio"
 cc_balance_of_power.1.desc: "Las cancillerías de Europa y el Cercano Oriente se han vuelto sofisticadas en el cálculo del poder. Los príncipes ya no buscan la conquista a ciegas; ahora sopesan, miden y combinan, para que ninguna corona individual pueda sobresalir sobre las demás. Amanece una nueva era de diplomacia: la era del equilibrio de poder."
 cc_balance_of_power.1.a: "Jugaremos el juego."

 cc_balance_of_power.2.title: "La potencia aspirante"
 cc_balance_of_power.2.desc: "Nuestra fuerza supera ahora la de cualquier rival. Las cortes del continente nos observan con envidia y temor, y ya susurran sobre coaliciones para limitarnos. El camino hacia la preeminencia está abierto, pero cada paso en él atrae a los demás para unirse contra nosotros."
 cc_balance_of_power.2.a: "Que nos teman. Europa se doblegará ante nuestra voluntad."
 cc_balance_of_power.2.b: "Buscamos la preeminencia, no el dominio — por ahora."

 cc_balance_of_power.3.title: "El poder indispensable"
 cc_balance_of_power.3.desc: "Somos lo suficientemente fuertes como para importar, pero no tanto como para asustar. Eso nos convierte en el fulcro natural del continente: el peso que, lanzado sobre la balanza más ligera, restaura el equilibrio. Las cortes más pequeñas recurren a nosotros para organizar su defensa contra el aspirante a hegemonía."
 cc_balance_of_power.3.a: "Seremos el equilibrio de Europa."
 cc_balance_of_power.3.b: "Dejar que otros carguen con este peso."

 cc_balance_of_power.10.title: "Eligiendo bandos"
 cc_balance_of_power.10.desc: "Enviados de ambos bandos abarrotan nuestras antecámaras. La potencia aspirante ofrece amistad —y advierte del coste del rechazo—. La coalición ofrece solidaridad —y la seguridad de los números—. Nuestra corte no puede permanecer ajena para siempre; ha llegado el momento de elegir."
 cc_balance_of_power.10.a: "Unirse a la Coalición de Equilibrio."
 cc_balance_of_power.10.b: "Unirse al Bloque Preponderante."
 cc_balance_of_power.10.c: "Mantener nuestras manos libres: permanecer neutrales."

 cc_balance_of_power.20.title: "Presión y persuasión"
 cc_balance_of_power.20.desc: "Una corte menor duda en seguirnos. Nuestros ministros aconsejan que hay varias formas de someter a un príncipe vacilante: el puño de hierro o la bolsa abierta. Cualquiera servirá, aunque cada una deja su propio residuo de resentimiento o dependencia."
 cc_balance_of_power.20.a: "Amenácelos para que entren en nuestro bloque."
 cc_balance_of_power.20.b: "Compra su neutralidad con oro."
 cc_balance_of_power.20.c: "Dejarlos estar, por ahora."

 cc_balance_of_power.30.title: "Miedo al Hegemón"
 cc_balance_of_power.30.desc: "Nos llegan informes sobre las ambiciones de la potencia dominante, cada una más alarmante que la anterior. Nuestros socios de coalición nos miran: ¿daremos voz al temor común o guardaremos silencio para evitar provocar al coloso?"
 cc_balance_of_power.30.a: "Denunciar abiertamente al aspirante a hegemonía."
 cc_balance_of_power.30.b: "Guardar silencio y observar."

 cc_balance_of_power.40.title: "Restablecer el equilibrio"
 cc_balance_of_power.40.desc: "Como equilibrador, los medios para apuntalar el plato más ligero están en nuestras manos. El oro puede reforzar a un socio vacilante; la diplomacia paciente puede ganar a un neutral para nuestra causa. Cada elección gasta algo —tesoro o esfuerzo— para evitar que el equilibrio se rompa."
 cc_balance_of_power.40.a: "Subvencionar a un socio de coalición."
 cc_balance_of_power.40.b: "Atraer a una potencia neutral hacia la coalición."
 cc_balance_of_power.40.c: "No hacer nada y conservar nuestras fuerzas."

 cc_balance_of_power.50.title: "Un congreso de potencias"
 cc_balance_of_power.50.desc: "Los enviados de la coalición se reúnen a nuestra invitación. Alrededor de la mesa se sientan las potencias que desean mantener el continente libre, y cada una nos mira en busca de dirección. Un fondo de guerra común, un cierre de filas o simples palabras: el Congreso será lo que nosotros queramos que sea."
 cc_balance_of_power.50.a: "Establecer un fondo de guerra colectivo."
 cc_balance_of_power.50.b: "Resolución para contener al hegemón: cerrar filas."
 cc_balance_of_power.50.c: "Levantar la sesión sin acuerdo."

 cc_balance_of_power.60.title: "El equilibrio tambalea"
 cc_balance_of_power.60.desc: "La balanza se inclina peligrosamente. El bloque de la potencia dominante crece mientras el nuestro se deshilacha en los bordes. Si no actuamos ahora para reunir a cada corte vacilante, el equilibrio que nos hemos esforzado por preservar se romperá y, con él, la independencia del continente."
 cc_balance_of_power.60.a: "Reúne a todas las cortes contra la hegemonía acechante."
 cc_balance_of_power.60.b: "Es posible que ya sea demasiado tarde."

 cc_balance_of_power.70.title: "Maestro de Europa"
 cc_balance_of_power.70.desc: "Las coaliciones se han estrellado contra nosotros como olas contra una roca. Ninguna combinación de potencias puede ahora refrenar nuestra voluntad. Un nuevo Carlomagno, un nuevo César; la historia registrará que en esta era, el equilibrio de Europa estaba bajo nuestro mando."
 cc_balance_of_power.70.a: "El continente es nuestro."

 cc_balance_of_power.71.title: "El Hegemón Triunfante"
 cc_balance_of_power.71.desc: "A pesar de cada alianza y cada congreso, no pudimos contener al coloso. El equilibrio se ha roto y una sola potencia domina ahora el continente. Nuestros enviados son recibidos con fría cortesía en una Europa que ha aprendido a inclinarse."
 cc_balance_of_power.71.a: "No olvidaremos esta humillación."

 cc_balance_of_power.72.title: "El Diluvio del Este"
 cc_balance_of_power.72.desc: "El viejo orden occidental, a pesar de todos sus cuidadosos equilibrios, no pudo comprender la tormenta que se gestaba en el este. Ahora nuestros ejércitos se desbordan a través de sus fronteras, y las cancillerías que se creían los árbitros del mundo luchan por sobrevivir."
 cc_balance_of_power.72.a: "El futuro nos pertenece."

 cc_balance_of_power.73.title: "El viejo orden cae"
 cc_balance_of_power.73.desc: "El cuidadoso equilibrio de los reyes no sirvió de nada una vez que el pueblo se levantó. Los tronos tambalean, las fronteras se disuelven y la diplomacia de los gabinetes cede el paso a la furia de la revolución. El mundo del equilibrio de poder ha desaparecido y comienza una era nueva y terrible."
 cc_balance_of_power.73.a: "Nada volverá a ser como antes."

 cc_balance_of_power.74.title: "El Concierto de Europa"
 cc_balance_of_power.74.desc: "Contra todo pronóstico, el equilibrio se ha mantenido. A través del congreso y el compromiso, el subsidio y la moderación, las potencias han aprendido a gestionar sus rivalidades en lugar de dejarse gobernar por ellas. Lo que comenzó como un equilibrio precario ha madurado hasta convertirse en un concierto duradero: un orden que podría mantener la paz durante generaciones."
 cc_balance_of_power.74.a: "Dejar que el concierto perdure."

 cc_balance_of_power.70.b: "Coloca una corona sobre un rival humillado."

 cc_balance_of_power.41.title: "La Batalla de las Naciones"
 cc_balance_of_power.41.desc: "Las huestes de la coalición han convergido en el campo. Nunca habían ondeado tantos estandartes juntos contra el coloso. Nuestros generales nos dicen que la hora ha llegado: lancemos cada batallón y la apuesta por la hegemonía puede romperse aquí, entre sangre y humo — o conservemos nuestras fuerzas y dejemos que el enemigo se marchite en una guerra más larga."
 cc_balance_of_power.41.a: "Apuéstalo todo a un enfrentamiento general."
 cc_balance_of_power.41.b: "Hostigar y retrasar: conservar nuestras fuerzas."

 cc_balance_of_power.42.title: "Tierra quemada"
 cc_balance_of_power.42.desc: "Los ejércitos del hegemón marchan hacia nuestro corazón, vastos y confiados. No podemos enfrentarlos en batalla abierta, pero la tierra misma puede convertirse en un arma. Quemen los graneros, envenenen los pozos y retrocedan ante ellos hacia el frío y la distancia, hasta que su gran hueste muera de hambre entre las cenizas."
 cc_balance_of_power.42.a: "Quema la tierra ante ellos y retírate."
 cc_balance_of_power.42.b: "Mantenerse y defender nuestros hogares."

 cc_balance_of_power.43.title: "La Úlcera Sangrante"
 cc_balance_of_power.43.desc: "Todo un pueblo se ha levantado contra nuestra ocupación, no en batallas campales, sino mediante emboscadas y asesinatos; mil pequeñas heridas que nunca cierran. Nuestros ejércitos mantienen las ciudades y controlan los caminos de día, pero sangran en las colinas de noche. Esta llaga abierta nos desangra mientras el resto del continente observa y se anima."
 cc_balance_of_power.43.a: "Enviar tropas para aplastar la revuelta."
 cc_balance_of_power.43.b: "Guarnecer las ciudades y soportar el desgaste."

 cc_balance_of_power.44.title: "El sistema continental"
 cc_balance_of_power.44.desc: "No podemos alcanzar a nuestros principales rivales solo mediante la fuerza de las armas, pero podemos cerrar los mercados del continente a sus mercaderes. Que ningún puerto bajo nuestro dominio admita sus mercancías; que su comercio se marchite y sus casas de banca fracasen. Un bloqueo de todo el continente es un arma que nunca antes se había empuñado a tal escala, y vinculará nuestro propio comercio tan seguramente como el suyo."
 cc_balance_of_power.44.a: "Proclamar el bloqueo: estrangular su comercio."
 cc_balance_of_power.44.b: "Mantener abiertas las rutas marítimas: beneficiamos más con el comercio."

 cc_balance_of_power.45.title: "Levée en Masse"
 cc_balance_of_power.45.desc: "La lucha ha superado a los ejércitos de gabinete de antaño. Nuestros ministros proponen una medida sin precedentes: convocar a toda la nación a las armas; que cada hombre capaz sea un soldado y cada taller una manufactura de guerra. Esto conjuraría ejércitos incontables, pero también pondría mosquetes en manos del pueblo y aflojaría para siempre los vínculos del viejo orden."
 cc_balance_of_power.45.a: "Llamar a toda la nación a las armas."
 cc_balance_of_power.45.b: "Confía en el ejército profesional."

 cc_balance_of_power.46.title: "Una paz separada"
 cc_balance_of_power.46.desc: "Los enviados del hegemón vienen a nosotros en secreto, con palabras suaves y términos generosos. ¿Por qué sangrar por una coalición que aún puede fracasar, preguntan, cuando un acuerdo podría ahorrar a nuestro pueblo y hasta enriquecer a nuestra casa?"
 cc_balance_of_power.46.a: "Llegar a un acuerdo con el hegemon."
 cc_balance_of_power.46.b: "Mantenerse firme: nuestro lugar está con la coalición."

 cc_balance_of_power.47.title: "Un matrimonio de Estado"
 cc_balance_of_power.47.desc: "Nuestra preeminencia es ahora tal que las cortes menores buscan nuestro favor, y el vínculo más seguro entre tronos ha sido siempre el lecho matrimonial. Una unión dinástica vincularía a una potencia vacilante a nuestra casa o, presionando más, podríamos colocar a uno de nuestros parientes en su trono y gobernarlo como un reino satélite en todo menos en el nombre."
 cc_balance_of_power.47.a: "Vincularlos a nuestra casa."
 cc_balance_of_power.47.b: "Instálelos como un reino satélite."
 cc_balance_of_power.47.c: "Solo una cortesía: retratos y amabilidades."

 cc_balance_of_power.75.title: "El concierto flaquea"
 cc_balance_of_power.75.desc: "Durante una generación, el concierto se mantuvo y las cancillerías se felicitaron por haber domado las ambiciones de los príncipes. Pero ningún orden perdura para siempre. Una potencia ha roto su palabra y ha aspirado nuevamente a la preeminencia; los antiguos congresos callan, las garantías suenan vacías y el cauteloso cálculo del equilibrio comienza de nuevo."
 cc_balance_of_power.75.a: "La paz no podía durar para siempre."

 # ============================================================
 # ACTION EVENTS (80-92)
 # ============================================================
 cc_balance_of_power.80.title: "Una petición de adhesión"
 cc_balance_of_power.80.desc: "Un enviado de [cc_bop_petitioner.GetName] nos espera con una propuesta: su corte se uniría a nuestro bloque y marcharía bajo nuestro estandarte. Otra espada siempre es bienvenida, pero cada cliente que reunimos nos vincula más estrechamente a sus disputas tanto como las nuestras a las suyas."
 cc_balance_of_power.80.a: "Admitirlos en nuestro bloque."
 cc_balance_of_power.80.b: "No tenemos necesidad de ellos."

 cc_balance_of_power.81.title: "Una petición de adhesión"
 cc_balance_of_power.81.desc: "Un enviado de [cc_bop_petitioner.GetName] solicita una audiencia: temerosos del aspirante a hegemon, su corte se uniría a la coalición y añadiría su peso a la causa del equilibrio. Los números son la fuerza de la coalición, aunque cada nuevo socio es una voz más que satisfacer en la mesa del consejo."
 cc_balance_of_power.81.a: "Les damos la bienvenida a la coalición."
 cc_balance_of_power.81.b: "No tenemos necesidad de ellos."

 cc_balance_of_power.91.title: "Nuestra petición ha sido respondida"
 cc_balance_of_power.91.desc: "Llegan noticias del líder del bloque: nuestra petición ha sido aceptada y nuestra corte ha sido admitida en su compañía. Ya no estamos solos en el gran juego."
 cc_balance_of_power.91.a: "Que así sea; ahora estamos comprometidos."

 cc_balance_of_power.92.title: "Nuestra petición ha sido rechazada"
 cc_balance_of_power.92.desc: "El líder del bloque ha rechazado nuestro acercamiento con fría cortesía. No nos queda más remedio que abrirnos camino solos en la contienda, y recordar el desaire."
 cc_balance_of_power.92.a: "Recordaremos esto."

 cc_balance_of_power.93.title: "Se convoca el Congreso"
 cc_balance_of_power.93.desc: "A nuestro llamamiento, las potencias de la coalición se reúnen en un congreso permanente. Lo que era una alianza laxa de conveniencia tiene ahora una sala en la que deliberar, una mesa en la que votar y los medios para vincularse a un propósito común. La tarea de equilibrar al coloso puede realizarse ahora de concierto."
 cc_balance_of_power.93.a: "Que el congreso sesione."

 cc_balance_of_power.94.title: "Regresar a la familia europea"
 cc_balance_of_power.94.desc: "Ha pasado una generación desde nuestra derrota. Las heridas del gran ajuste han sanado lo suficiente como para que las potencias, conscientes de que ningún acuerdo perdura mientras una gran nación permanezca en el exilio, tiendan la mano. Se nos invita a ocupar nuestro asiento en el Concierto de Europa; ya no somos el paria, sino una vez más un socio en la gestión de la paz del continente."
 cc_balance_of_power.94.a: "Retomamos nuestro lugar legítimo."

 cc_balance_of_power.82.title: "Neutralidad Armada"
 cc_balance_of_power.82.desc: "En lugar de dejarnos arrastrar por las disputas de las grandes potencias, nuestra corte declara la neutralidad armada: amistosos con todos, dependientes de nadie; nuestros puertos y fronteras abiertos al comercio honesto y cerrados a los sargentos reclutadores de cualquier bloque. El oro extranjero fluye libremente para mantenernos así."
 cc_balance_of_power.82.a: "Nuestras manos permanecen libres."

 cc_balance_of_power.83.title: "Jugando a dos bandas"
 cc_balance_of_power.83.desc: "Nuestros diplomáticos son maestros de la palabra discreta y la insinuación oportuna. Al inclinarnos, muy ligeramente, hacia el bando que sea más débil, mantenemos la contienda finamente equilibrada y aseguramos que ambas partes paguen generosamente por nuestra continua buena voluntad."
 cc_balance_of_power.83.a: "Que ambos intenten cortejarnos."

 cc_balance_of_power.84.title: "Apoyándose en los no alineados"
 cc_balance_of_power.84.desc: "Con la confianza de nuestra creciente ascendencia, nuestros enviados presionan a las vacilantes cortes del continente. Una palabra sobre el destino de quienes se opongan a nosotros, un recordatorio de los ejércitos bajo nuestro mando... y la balanza se inclina a nuestro favor sin disparar un solo tiro."
 cc_balance_of_power.84.a: "Aprenderán a temernos."

 cc_balance_of_power.85.title: "El sistema continental"
 cc_balance_of_power.85.desc: "Proclamamos que los mercados del continente están cerrados al comercio de nuestros rivales. Que ningún puerto bajo nuestro dominio admita sus mercancías; que sus casas de banca fracasen y sus mercaderes clamen. El comercio de la coalición se marchita bajo el peso de nuestra ambición."
 cc_balance_of_power.85.a: "Estrangular su comercio."

 cc_balance_of_power.86.title: "Consolidando la hegemonía"
 cc_balance_of_power.86.desc: "Ha llegado el momento de recoger los frutos de nuestra ambición. Se pagan los subsidios, se despliegan las guarniciones, se cierran pactos dinásticos y cien pequeñas cortes se alinean tras nosotros. El equilibrio se inclina hacia nuestro dominio y el bloque se fortalece gracias a ello."
 cc_balance_of_power.86.a: "El continente se doblega ante nuestra voluntad."

 cc_balance_of_power.87.title: "Subvencionando a los Aliados"
 cc_balance_of_power.87.desc: "Los miembros menores de la coalición no pueden igualar solos la bolsa del hegemón, así que abrimos la nuestra. El oro fluye para reforzar sus levas y estabilizar su determinación, para que ningún socio tenga que negociar con el enemigo por falta de moneda."
 cc_balance_of_power.87.a: "Que ningún aliado pase necesidad."

 cc_balance_of_power.88.title: "Mando Supremo Asumido"
 cc_balance_of_power.88.desc: "Salimos al campo en persona, con nuestros propios estandartes a la cabeza del ejército aliado. Las potencias menores se alinean tras una sola voluntad, y nuestro prestigio otorga a la coalición la firmeza de la que carecía. Con una sola mano dirigiendo la guerra, el equilibrio es arrastrado de vuelta hacia la estabilidad."
 cc_balance_of_power.88.a: "El mando es nuestro."

 cc_balance_of_power.89.title: "Una revolución diplomática"
 cc_balance_of_power.89.desc: "De un plumazo, nuestro gabinete anula la diplomacia de una generación: un renversement des alliances que deja al aspirante repentinamente desprovisto de amigos y a la coalición hinchada de nueva fuerza. El equilibrio se inclina decisivamente de nuevo hacia la mayoría."
 cc_balance_of_power.89.a: "El juego se ha rehecho."

 cc_balance_of_power.90.title: "El bloqueo naval"
 cc_balance_of_power.90.desc: "Si el hegemon cierra la tierra a nuestro comercio, nosotros cerraremos el mar al suyo. Nuestras flotas barrerán los accesos y bloquearán los grandes puertos; los mercantes del bloque preponderante se pudrirán anclados mientras el comercio de sus rivales se filtra. La guerra económica corta en ambos sentidos, pero que así sea."
 cc_balance_of_power.90.a: "Bloquear sus costas."

 # --- Betrayal & the reversal of alliances ---
 cc_balance_of_power.100.title: "Una inversión de alianzas"
 cc_balance_of_power.100.desc: "Nuestra posición en este bloque se ha vuelto intolerable: su fortuna decae, su líder presume sobre nosotros y, al otro lado de las líneas, el campo contrario deja saber que nuestra amistad sería ricamente recompensada. Cambiar de bando ahora sería la traición más negra a los ojos de nuestros aliados actuales —y el golpe de estado más certero a los ojos de la posteridad. Todo el equilibrio del continente puede depender de nuestra respuesta."
 cc_balance_of_power.100.a: "Revertir nuestras alianzas: pasarnos al otro bando."
 cc_balance_of_power.100.b: "Mantenemos la fe. Nuestro lugar está con nuestros aliados."

 cc_balance_of_power.101.title: "Una traición nefanda"
 cc_balance_of_power.101.desc: "Llegan noticias de que [bop_defector.GetName] ha abandonado nuestra causa y se ha pasado al enemigo; las alianzas se han invertido de la noche a la mañana, nuestros consejos han sido traicionados y el equilibrio se ha inclinado en nuestra contra por un solo acto de perfidia. Nuestros socios restantes observan cómo soportamos el golpe."
 cc_balance_of_power.101.a: "Tal traición no será olvidada."

 cc_balance_of_power.103.title: "Consumar la traición"
 cc_balance_of_power.103.desc: "La paz está firmada, nuestros regimientos han retrocedido y se han reorganizado, y nuestro nuevo patrón ahora espera que justifiquemos nuestra deserción. Nuestros antiguos aliados —siendo [bop_old_target.GetName] el principal de ellos— quedan expuestos ante nosotros. Podemos caer sobre ellos como esperan nuestros nuevos amigos, o jugar un juego aún más profundo y no responder ante nadie más que ante nosotros mismos."
 cc_balance_of_power.103.a: "Tomar las armas contra nuestros antiguos aliados."
 cc_balance_of_power.103.b: "Un juego doble: mantenemos nuestros propios secretos."

 cc_balance_of_power.102.title: "Una traición comprada"
 cc_balance_of_power.102.desc: "Nuestras arcas están llenas y nuestros maestros espías activos. Un miembro descontento del bando enemigo — [bop_treason_target.GetName] — ha dejado entrever que el incentivo adecuado podría desligarlo por completo de sus aliados. El oro y la intriga podrían convertir la fuerza de un rival en la nuestra, aunque tales tratos dejan una mancha que los príncipes recuerdan durante mucho tiempo."
 cc_balance_of_power.102.a: "Compra su traición."
 cc_balance_of_power.102.b: "Tales intrigas están por debajo de nosotros."

 # --- Coalition victory: the chief balancer's reward ---
 cc_balance_of_power.76.title: "El arquitecto del equilibrio"
 cc_balance_of_power.76.desc: "Al aspirante a hegemonía se le ha denegado su objetivo, y el equilibrio que nos esforzamos por preservar ahora queda institucionalizado como un concierto duradero. De todas las potencias que se aliaron contra el coloso, fue nuestra mano la que guio la coalición, nuestro oro y nuestra diplomacia los que la mantuvieron unida. Europa nos mira ahora como nunca antes, y la pregunta es qué haremos con esa preeminencia. ¿Coronaremos nuestra obra como el garante confiable de la paz, o convertiremos el dominio que ganamos sobre la coalición en ambiciones propias?"
 cc_balance_of_power.76.a: "Somos el garante de la paz de Europa."
 cc_balance_of_power.76.b: "Ahora dejemos que el continente siga nuestro ejemplo."

 # --- The coalition takes up arms ---
 cc_balance_of_power.110.title: "La Hora de la Decisión"
 cc_balance_of_power.110.desc: "Los informes ya no pueden ignorarse: el aspirante a hegemon se encuentra en el umbral mismo del dominio, y cada mes de retraso hace que otra corte caiga en su órbita. Nuestros congresos y subsidios no han sido suficientes. Si es que el equilibrio puede salvarse, debe ser ahora, mediante la espada. Nuestros generales aconsejan que la coalición, marchando como una sola, aún podría derrotar al coloso antes de que crezca más allá de cualquier control. Pero golpear primero es apostarlo todo en el campo de batalla."
 cc_balance_of_power.110.a: "Golpear ahora, antes de que el equilibrio se rompa definitivamente."
 cc_balance_of_power.110.b: "Todavía no; no nos atrevemos a enfrentar al coloso sin estar preparados."

 cc_balance_of_power.111.title: "Honrar la Unión"
 cc_balance_of_power.111.desc: "Los ejércitos del hegemón han caído sobre [bop_victim.GetName], nuestro socio en la coalición, e incluso ahora claman por la ayuda que prometimos cuando se formó la unión. Marchar en su defensa es atraer todo el peso del coloso sobre nosotros; sin embargo, abandonarlos es ver cómo la coalición se deshilacha hilo a hilo, dejando a cada socio para ser devorado en solitario. La credibilidad de toda la alianza depende de nuestra respuesta."
 cc_balance_of_power.111.a: "Honra la unión: marcha en su defensa."
 cc_balance_of_power.111.b: "No nos atrevemos a provocar al coloso; deben valerse por sí mismos."

 # ============================================================
 # GENERIC ACTIONS — names & descriptions
 # ============================================================
 cc_bop_petition_preponderance: "Solicitar al Bloque Preponderante"
 cc_bop_petition_preponderance_desc: "Pedir al aspirante a hegemon que admita nuestra corte en el Bloque Preponderante. El líder decidirá si nos acepta. Disponible para potencias comprometidas y no alineadas. No se puede repetir durante 4 años."
 cc_bop_petition_coalition: "Solicitar a la Coalición de Equilibrio"
 cc_bop_petition_coalition_desc: "Pedir al principal equilibrador que admita nuestra corte en la Coalición de Equilibrio. El líder decidirá si nos acepta. Disponible para potencias comprometidas y no alineadas. No se puede repetir durante 4 años."
 cc_bop_proclaim_neutrality: "Proclamar la neutralidad armada"
 cc_bop_proclaim_neutrality_desc: "Declarar nuestra corte neutral en el gran juego, atrayendo oro extranjero para mantenernos así. Requiere un ministro de gabinete asignado a la tarea $cc_duty_free_hands$. No puede repetirse durante 6 años."
 cc_bop_play_both_sides: "Jugar a dos bandas"
 cc_bop_play_both_sides_desc: "Inclinarse discretamente hacia el bloque más débil para mantener equilibrado el certamen, y hacer que ambos bandos paguen por nuestra buena voluntad. Requiere un ministro del gabinete en una misión diplomática ($cc_duty_diplomatic_mission$ o el cuerpo diplomático). No se puede repetir durante 5 años."
 cc_bop_io_intimidate: "Intimidar a los No Alineados"
 cc_bop_io_intimidate_desc: "Gasta la Ambición del bloque para presionar a las cortes vacilantes del continente y elevar el equilibrio. Requiere 25 de Ambición (gasta 20). No se puede repetir durante 4 años."
 cc_bop_io_continental_system: "Proclamar el Bloqueo Continental"
 cc_bop_io_continental_system_desc: "Gasta la Ambición del bloque para cerrar los mercados del continente a la coalición, bloqueando su comercio. Requiere 40 de Ambición (gasta 30) y una Cuota de Preponderancia de al menos el 55%. No puede repetirse durante 5 años."
 cc_bop_io_consolidate_hegemony: "Consolidar la hegemonía"
 cc_bop_io_consolidate_hegemony_desc: "Un impulso final: gasta una gran cantidad de Ambición para inclinar la balanza drásticamente hacia la maestría y envalentonar a todo el bloque. Requiere 70 de Ambición (gasta 50). No se puede repetir durante 6 años."
 cc_bop_io_subsidize_allies: "Subvencionar a los Aliados"
 cc_bop_io_subsidize_allies_desc: "Gasta la Determinación de la coalición para fortalecer a sus miembros menores frente al hegemón. Requiere 25 de Determinación (gasta 20). No se puede repetir durante 4 años."
 cc_bop_io_naval_blockade: "Ordenar un bloqueo naval"
 cc_bop_io_naval_blockade_desc: "La respuesta de la coalición al Sistema Continental: gastar Determinación para bloquear las costas del bloque preponderante y asfixiar su comercio. Una medida reactiva: requiere 35 de Determinación (gasta 25) y una Cuota de Preponderancia de al menos el 55%. No puede repetirse durante 5 años."
 cc_bop_io_convene_the_congress: "Convocar el Congreso"
 cc_bop_io_convene_the_congress_desc: "Convocar al congreso latente a sesión, abriendo el Congreso de Equilibrio permanente para que el bloque pueda votar leyes y presentar mociones parlamentarias. Un acto estructural: requiere al menos 3 miembros y 20 de Resolución (reúne la causa por +5)."
 cc_bop_io_assume_supreme_command: "Asumir el mando supremo"
 cc_bop_io_assume_supreme_command_desc: "Salir al campo en persona: aportar el propio prestigio del equilibrador al esfuerzo aliado y devolver la balanza hacia el equilibrio. Un golpe unilateral: requiere 40 de Resolución (gasta 30) y una Cuota de Preponderancia de al menos el 55%. No puede repetirse durante 4 años."
 cc_bop_io_diplomatic_revolution: "Orquestar una Revolución Diplomática"
 cc_bop_io_diplomatic_revolution_desc: "Un renversement des alliances: el propio gabinete del equilibrador orquesta un realineamiento drástico, devolviendo el equilibrio decisivamente hacia las mayorías. Un hito unilateral: requiere 70 de Resolución (gasta 50). No puede repetirse durante 6 años."
 cc_bop_io_leave_bloc: "Abandonar el bloque"
 cc_bop_io_leave_bloc_desc: "Retirar nuestra corte de su bloque. Seremos tachados de desertores y la posición de nuestro antiguo bloque se verá afectada. Disponible para miembros que no sean líderes. No puede repetirse durante 3 años."

 # ai_will_do factor descriptions
 CC_BOP_FRIENDLY_LEADER: "La potencia dominante nos mira con buenos ojos"
 CC_BOP_BANDWAGON: "Los fuertes se hacen más fuertes; lo mejor es unirse a ellos"
 CC_BOP_BEHIND: "Nos estamos quedando atrás y debemos aprovechar nuestra ventaja"
 CC_BOP_GREAT_POWER: "Una gran potencia tiene un lugar en la mesa"
 CC_BOP_NEAR_HEGEMON: "El aspirante a hegemonía acecha en nuestro umbral"

 # ============================================================
 # PANEL — IO shortcut
 # ============================================================
 CC_BOP_OPEN_IO_TT: "Abrir la vista de organización de este bloque, donde se encuentran las acciones y el tesoro de su líder."

 # ============================================================
 # GAME RULE
 # ============================================================
 cc_balance_of_power_rule: "El equilibrio de poder"
 cc_balance_of_power_rule_desc: "Controla si puede activarse la situación del Equilibrio de poder europeo."
 cc_balance_of_power_on: "Habilitado"
 cc_balance_of_power_on_desc: "La situación del equilibrio de poder surgirá una vez que una gran potencia adopte la doctrina del equilibrio de poder, o una vez que se abra la era revolucionaria."
 cc_balance_of_power_off: "Desactivado"
 cc_balance_of_power_off_desc: "La situación del equilibrio de poder nunca se activará."

 # ============================================================
 # ADVANCE / REFORMS / PRIVILEGE
 # ============================================================
 cc_balance_of_power_advance: "Doctrina del equilibrio de poder"
 cc_balance_of_power_advance_desc: "El arte de la razón de Estado madura hasta convertirse en una ciencia del equilibrio: alianzas formadas y disueltas, subsidios y garantías, todo orientado al único fin de evitar que cualquier rival domine el continente. La primera gran potencia en adoptar esta doctrina marca el inicio de la era del equilibrio de poder europeo. Desbloquea las reformas $cc_balancer_doctrine_reform$ y $cc_raison_detat_reform$, así como el privilegio $ep_noble_diplomatic_corps$."
 cc_balancer_doctrine_reform: "Doctrina del equilibrador"
 cc_balancer_doctrine_reform_desc: "Nuestra diplomacia se organiza en torno al mantenimiento del equilibrio, lo que nos otorga reputación y el alcance diplomático para ensamblar coaliciones mientras mitigamos el antagonismo que provocan nuestras maniobras."
 cc_raison_detat_reform: "Raison d'État"
 cc_raison_detat_reform_desc: "La política se rige por el frío cálculo del interés estatal en lugar del sentimiento dinástico o la lealtad confesional, lo que otorga a nuestro arte de gobernar flexibilidad, prestigio y resiliencia en luchas prolongadas."
 ep_noble_diplomatic_corps: "Cuerpo Diplomático Noble"
 ep_noble_diplomatic_corps_desc: "La alta nobleza dota y financia un servicio diplomático profesional, dotando las embajadas de Europa y ampliando el alcance y la reputación diplomática de la corona."

 # ============================================================
 # NEW END REASONS
 # ============================================================
 cc_bop_end_coalition: "El equilibrio se ha mantenido: la coalición ha reducido las ambiciones del aspirante a hegemonía."
 cc_bop_end_stagnation: "El momento del aspirante ha pasado: superado y eclipsado, su ambición se ha desvanecido en la irrelevancia."

 # ============================================================
 # THE RECKONING — ticker panel
 # ============================================================
 CC_BOP_RECKONING_HEADER: "El ajuste de cuentas"
 CC_BOP_HEGEMONY_TICKER_LABEL: "Camino hacia la hegemonía"
 CC_BOP_HEGEMONY_TICKER_TT: "Cada mes que el aspirante a hegemon mantenga una cuota de preponderancia de 65 o más, este contador aumenta; cuando el bloque caiga por debajo, volverá a bajar. A los 60 meses, el equilibrio estará listo para romperse, pero solo una guerra final podrá resolverlo. La coalición se ve obligada a hacer un último esfuerzo; si prevalecen, se negará la victoria del hegemon."
 CC_BOP_FINAL_WAR_LABEL: "#R Ajuste de cuentas final: la coalición hace su última resistencia.#!"
 CC_BOP_FINAL_WAR_TT: "El contador está lleno. La situación no terminará hasta que se decida una última guerra entre la coalición y el aspirante a hegemonía. Si el hegemon sigue dominando cuando las armas callen, el equilibrio se rompe definitivamente; si la coalición lo frena, la pretensión es denegada y la contienda continúa."
 CC_BOP_COALITION_TICKER_LABEL: "Camino hacia la contención"
 CC_BOP_COALITION_TICKER_TT: "Cada mes que la coalición equilibradora mantenga la cuota de preponderancia del aspirante en 35 o menos, este contador aumenta. A los 60 meses, la coalición estará lista para asestar el golpe definitivo, siempre que su congreso haya votado a favor del golpe de gracia."
 CC_BOP_COALITION_WAR_LABEL: "#R El golpe de gracia: la coalición se dispone a aniquilar al aspirante.#!"
 CC_BOP_STAGNATION_TICKER_LABEL: "Eclipse del aspirante"
 CC_BOP_STAGNATION_TICKER_TT: "Mientras el aspirante a hegemon se estanca en el terreno intermedio y es superado por un rival surgido a su sombra, este contador aumenta. A los 60 meses, el equilibrio simplemente se disuelve: sin un ganador decisivo, el momento del aspirante se ha perdido."

 # ============================================================
 # RECKONING / DESPERATION / WAR-TOOL EVENTS
 # ============================================================
 cc_balance_of_power.77.title: "El aspirante es humillado"
 cc_balance_of_power.77.desc: "Está hecho. La larga labor de la coalición —los subsidios, los congresos, la sangre derramada en una docena de campañas— finalmente ha dado sus frutos. El poder que aspiraba al dominio del continente ha sido quebrantado por la unión de sus rivales y reducido al rango de una potencia grande ordinaria. El equilibrio perdura, reivindicado, y nuestro nombre con él."
 cc_balance_of_power.77.a: "Europa vuelve a respirar."
 cc_balance_of_power.78.title: "Un momento perdido"
 cc_balance_of_power.78.desc: "El momento ha pasado. Intentamos alcanzar la maestría de Europa y solo atrapamos el aire; mientras vacilábamos y nos demorábamos, otros crecieron, y ahora una potencia surgida a nuestra propia sombra nos eclipsa. La coalición no necesita asestar ningún golpe: nuestra apuesta simplemente se ha desvanecido y el equilibrio se disuelve sin nosotros en su centro."
 cc_balance_of_power.78.a: "Lo que podría haber sido."
 cc_balance_of_power.112.title: "El Ajuste de Cuentas Final"
 cc_balance_of_power.112.desc_hegemony: "La balanza se ha inclinado tanto como puede soportar. El aspirante a hegemon se encuentra en el umbral del dominio, y las cortes de Europa saben que la cuestión ya no puede posponerse. La coalición debe plantarse ahora, en una última guerra; pues si el coloso prevalece, no habrá una segunda oportunidad para frenarlo."
 cc_balance_of_power.112.desc_coalition: "La coalición de equilibrio ha ascendido y ha llegado el momento de resolver el asunto definitivamente. Con el mandato del congreso en la mano, las potencias se movilizan para reducir al pretendiente a hegemonía en una guerra final y decisiva."
 cc_balance_of_power.112.a: "Así que hemos llegado a esto."
 cc_balance_of_power.120.title: "Arcas demasiado vacías"
 cc_balance_of_power.120.desc: "Nuestros enviados llevaron el llamamiento a la corte de nuestro aliado, y regresaron con él sin respuesta. El precio de arrastrar a una potencia tan grande a nuestra guerra supera lo que nuestro tesoro o la paciencia del bloque pueden soportar actualmente. Debemos reservar nuestras monedas y buscar espadas más pequeñas, o esperar."
 cc_balance_of_power.120.a: "Entonces no podemos permitirnos contratarlos."
 cc_balance_of_power.121.title: "Se ha dispuesto un fondo de guerra"
 cc_balance_of_power.121.desc: "Se ha repartido oro discretamente entre las reacias cortes de nuestro bloque: pensiones prometidas, deudas perdonadas, palmas engrasadas. La próxima vez que los llamemos a las armas, la convocatoria llegará a oídos mucho más dispuestos, y a una fracción del coste habitual."
 cc_balance_of_power.121.a: "Que los subsidios hagan su trabajo."
 cc_balance_of_power.122.title: "La Gran Guerra"
 cc_balance_of_power.122.desc: "No esperaremos a que nuestros rivales estén dispuestos. Todo el peso del bloque se ha reunido, el casus belli ha sido proclamado y los ejércitos se han puesto en marcha contra la coalición de equilibrio. Que el asunto se decida bajo nuestros términos, en una guerra elegida por nosotros."
 cc_balance_of_power.122.a: "Adelante, por el dominio."
 cc_balance_of_power.130.title: "Medidas desesperadas"
 cc_balance_of_power.130.desc: "La sombra del aspirante se alarga por todo el continente y los instrumentos ordinarios de gobierno ya no son suficientes. El congreso, ahora dotado de poderes permanentes, nos impone medidas extremas. El equilibrio debe restablecerse, cueste lo que cueste."
 cc_balance_of_power.130.a: "Compra una espada extranjera para la guerra."
 cc_balance_of_power.130.b: "Convocar una movilización general en todo el bloque."
 cc_balance_of_power.130.c: "No intervenir: el coste es demasiado elevado."
 cc_balance_of_power.131.title: "El último recurso"
 cc_balance_of_power.131.desc: "El coloso está sobre nosotros. Ya no habrá diplomacia astuta, ni congresos para deliberar; solo la cuestión de cómo resistiremos. Nuestro pueblo nos mira, y debemos responder con hierro."
 cc_balance_of_power.131.a: "Quema los puentes: tierra quemada ante ellos."
 cc_balance_of_power.131.b: "Convoca una gran leva: todas las manos a las armas."

 # ============================================================
 # NEW PREPONDERANT WAR-TOOL ACTIONS
 # ============================================================
 cc_bop_io_call_to_arms: "Llamada a las Armas"
 cc_bop_io_call_to_arms_desc: "Arrastrar a un miembro de nuestro bloque a nuestra guerra contra la coalición. El coste en oro escala con la base impositiva del aliado —y se duplica con cada aliado ya convocado en esta guerra— por lo que, en la práctica, solo pueden permitirse uno o dos. Requiere 20 de Ambición. Un fondo de guerra permanente reduce la factura a la mitad."
 cc_bop_io_war_chest: "Crear un fondo de guerra"
 cc_bop_io_war_chest_desc: "Reparte subsidios entre las cortes renuentes de nuestro bloque por adelantado, reduciendo a la mitad el coste de nuestra próxima Llamada a las Armas. Requiere 30 de Ambición (gasta 30) y una suma de oro. No puede repetirse durante 3 años."
 cc_bop_io_grand_war: "Gran Guerra contra la Coalición"
 cc_bop_io_grand_war_desc: "Una pieza clave: golpear primero. Declaramos nuestra propia guerra al equilibrador principal y ponemos en marcha a todo el bloque preponderante, inclinando la balanza drásticamente a nuestro favor. Requiere 70 de Ambición (gasta 60). No se puede repetir durante 6 años."

 # ============================================================
 # AI REASON STRINGS (shown in action / vote tooltips)
 # ============================================================
 CC_BOP_OVEREXTENDED: "Nuestro bloque ya está demasiado extendido"
 CC_BOP_AT_WAR: "Estamos en guerra y necesitamos cada aliado"
 CC_BOP_WARLIKE: "Nuestro consejo de guerra tiene hambre de lucha"
 CC_BOP_ASCENDANT: "Estamos en ascenso — ahora es el momento"
 CC_BOP_LAW_BASE: "Inclinación actual"
 CC_BOP_LAW_HAVE_BETTER: "Ya mantenemos una política más fuerte"
 CC_BOP_LAW_HEGEMON_FALLING: "El aspirante se debilita"
 CC_BOP_LAW_HEGEMON_RISING: "El aspirante se vuelve peligroso"
 CC_BOP_LAW_RECKONING: "El ajuste de cuentas ha llegado"
 CC_BOP_LAW_ASCENDANT: "Nuestra coalición se mantiene ascendente"
 CC_BOP_LAW_KEEP: "Esta política nos sirve bien"
 cc_balance_of_power.69.title: "Mano libre"
 cc_balance_of_power.69.desc: "[bop_new_master.GetName] ha dominado el continente, y las cortes que le juraron lealtad descubren ahora qué han comprado con ella. Nosotros no juramos nada. Recibimos audiencias de ambos bandos, prometimos poco a cualquiera y somos la única cancillería en Europa que no tiene que dar explicaciones a nadie. Los enviados en quienes sus amigos no pueden confiar siguen valiendo la pena ser recibidos; los enviados que nunca pertenecieron a nadie valen aún más."
 cc_balance_of_power.69.a: "Mantuvimos nuestras manos libres."
 cc_balance_of_power.79.title: "Bajo el nuevo amo"
 cc_balance_of_power.79.desc: "Apoyamos a [bop_new_master.GetName] y [bop_new_master.GetName] ha vencido. Las recompensas son reales e inmediatas: ningún vecino se atreve ahora a reclamar contra un amigo del hegemón, y una corte que no necesita comprar su seguridad puede permitirse gastar en otras cosas. Las recompensas son también, somos plenamente conscientes, enteramente condicionales."
 cc_balance_of_power.79.a: "Un lugar cómodo en el nuevo orden."
