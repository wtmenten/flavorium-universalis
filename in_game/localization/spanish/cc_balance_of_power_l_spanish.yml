 # MAP LEGEND & TOOLTIPS
 # ============================================================
 CC_BOP_PREPONDERANCE_LEGEND: "Bloque preponderante"
 CC_BOP_COALITION_LEGEND: "Coalición equilibradora"
 CC_BOP_NEUTRAL_LEGEND: "Poder no alineado"
 cc_bop_preponderance_member_tt: "Esta tierra pertenece a un miembro del Bloque Preponderante."
 cc_bop_coalition_member_tt: "Esta tierra pertenece a un miembro de la Coalición de Equilibrio."
 cc_bop_neutral_tt: "Esta tierra pertenece a una potencia no alineada que observa el equilibrio desde la barrera."

 # ============================================================
 # CABINET-MINISTER & WARTIME CONDITION TOOLTIPS (situation / IO actions)
