l_spanish:
 # ============================================================
 # NEGATIVE TRAITS
 # ============================================================

 stagnant_counselor: "Consejero estancado"
 desc_stagnant_counselor: "Este ministro ha estado demasiado tiempo en su cargo sin ser cuestionado. Sus métodos se han calcificado, su entusiasmo se ha apagado y la vanguardia de su experiencia se ha embotado. Sigue siendo competente, pero a duras penas."
 stagnant_counselor_die_desc: "[CHARACTER.GetName] ha muerto. La historia no juzgará severamente su carrera, solo el último capítulo."

 war_profiteer: "Especulador de guerra"
 desc_war_profiteer: "Este ministro ha aprendido a ver el conflicto como una oportunidad. Sus consejos orientan cada acuerdo diplomático hacia su propio enriquecimiento, y el reino sufre las secuelas más lentas y costosas de guerras que terminaron peor de lo que deberían."
 war_profiteer_die_desc: "[CHARACTER.GetName] ha muerto. La contabilidad de su fortuna personal y el dividendo de la paz del reino nunca cuadrarán del todo."

 court_schemer: "Intrigante de la corte"
 desc_court_schemer: "La intriga ha sustituido a la lealtad en la práctica de gobierno de este ministro. Socavan a sus rivales dentro de la corte, fracturan las coaliciones legislativas y tratan cada nombramiento como un movimiento en un juego que no tiene ningún resultado que valga la pena."

 inefficient_bureaucrat: "Burócrata Ineficiente"
 desc_inefficient_bureaucrat: "Este ministro ha superado su propia competencia. Una edad más joven podría haberlo pulido hasta convertirlo en algo útil; la era actual simplemente ha expuesto lo poco que se ha desarrollado desde el principio."
 inefficient_bureaucrat_die_desc: "[CHARACTER.GetName] ha muerto. Su sucesor encontrará el escritorio en mejor estado que la obra."

 corrupted_official: "Funcionario corrupto"
 desc_corrupted_official: "La riqueza que fluía a través de las manos de este ministro ha sido redirigida. Una parte de la prosperidad del reino llena sus bolsillos, y el privilegio que protegen es el suyo propio. Los estamentos están complacidos, y con razón."
 corrupted_official_die_desc: "[CHARACTER.GetName] ha muerto. Los auditores estarán ocupados."

 zealous_fanatic: "Fanático celoso"
 desc_zealous_fanatic: "La fe del ministro se ha agriado hasta convertirse en algo más duro y estrecho que una convicción. La duda se suprime, la diferencia se persigue y la razón cede ante el celo. La iglesia puede prosperar; la vida intelectual del reino, no."
 zealous_fanatic_die_desc: "[CHARACTER.GetName] ha muerto. Las cenizas de lo que [CHARACTER.GetSheHe] quemó se enfriarán lentamente."

 outdated_general: "General anticuado"
 desc_outdated_general: "Este ministro aprendió su doctrina militar en una era diferente y se ha negado a actualizarla. Sus métodos cuestan más de lo que deberían y producen menos de lo que el enemigo espera, lo cual es la peor combinación en la guerra."
 outdated_general_die_desc: "[CHARACTER.GetName] ha muerto. El ejército que [CHARACTER.GetSheHe] entrenó para luchar en la última guerra tendrá que aprender a luchar en la siguiente."

 cynical_courtier: "cortesano cínico"
 desc_cynical_courtier: "Tantos años viendo cómo el idealismo se convertía en compromiso han dejado a este ministro incapaz de abogar por nada con sinceridad. Los estamentos ven a través de sus gestos vacíos y responden de la misma manera."
 cynical_courtier_die_desc: "[CHARACTER.GetName] ha muerto. Al final, incluso el cinismo requiere de alguien que lo practique."

 reckless_expander: "Expansor Temerario"
 desc_reckless_expander: "Este ministro ve cada frontera como una invitación y cada riesgo como un coste que alguien más pagará. El antagonismo que genera nuestra expansión y las empresas coloniales que han colapsado bajo su guía tardarán años en repararse."
 reckless_expander_die_desc: "[CHARACTER.GetName] ha muerto. Las fronteras que [CHARACTER.GetSheHe] expandió siguen siendo disputadas."

 # ============================================================
 # NEGATIVE TRAIT GRANT EVENTS (cc_neg namespace)
 # ============================================================

 cc_neg.1.title: "Un ministro que se estanca"
 cc_neg.1.desc: "[minister.GetName] ha servido fielmente; quizás con demasiada fidelidad y durante demasiado tiempo. En la corte se rumorea que [minister.GetSheHe] repite sus propios consejos. Las nuevas ideas llegan a su escritorio y salen sin cambios. Aún hay tiempo para intervenir[minister.GetHerHis][minister.GetHerHis]."
 cc_neg.1.a: "Asignarles un nuevo proyecto exigente para sacudirlos."
 cc_neg.1.b: "Liberar a [minister.GetHerHim] del servicio con gratitud."
 cc_neg.1.c: "Permitir que se asiente el estancamiento. Su experiencia aún tiene valor."

 cc_neg.2.title: "Un ministro habituado a la guerra"
 cc_neg.2.a: "Investigar las operaciones financieras del ministro."
 cc_neg.2.b: "Adviérteles en privado. Este comportamiento debe cesar."
 cc_neg.2.c: "No decir nada por ahora."

 cc_neg.3.title: "Una facción en ciernes"
 cc_neg.3.desc: "Dos ministros con convicciones opuestas han estado en la corte el tiempo suficiente para que su desacuerdo se cristalice en facción. [minister.GetName] muestra signos de preferir la intriga sobre la gobernanza. La corte empieza a tomar partido."
 cc_neg.3.a: "Incorpore a [minister.GetHerHim] directamente; asígneles una tarea que requiera cooperación."
 cc_neg.3.b: "Permita que [minister.GetHerHim] cultive su facción. Es mejor conocer su red de contactos."
 cc_neg.3.c: "Destituir a [minister.GetHerHim] antes de que esto se agrave."

 cc_neg.4.title: "Un ministro de rendimientos decrecientes"
 cc_neg.4.a: "Darle a [minister.GetHerHim] la oportunidad de demostrar su relevancia."
 cc_neg.4.b: "Dejar que la burocracia encuentre su propio nivel."
 cc_neg.4.c: "Retirar a [minister.GetHerHim]; necesitamos a alguien más perspicaz."

 cc_neg.5.title: "El olor a corrupción"
 cc_neg.5.desc: "Con la riqueza acumulándose en la corte y los estamentos engordando, [minister.GetName] ha encontrado una oportunidad. Las cuentas están técnicamente equilibradas, pero parece que el equilibrio ha sido diseñado para beneficiar a alguien que no es la corona."
 cc_neg.5.a: "Enfrentar a [minister.GetHerHim] con las pruebas; exigir una reforma."
 cc_neg.5.b: "Aceptarlo. Los estamentos están contentos; dejemos que sigan estándolo."
 cc_neg.5.c: "Destituir a [minister.GetHerHim] sin ceremonias."

 cc_neg.6.title: "Un viejo soldado fuera de su tiempo"
 cc_neg.6.desc: "[minister.GetName] sirvió brillantemente en otra era. Pero los ejércitos de esta época exigen un pensamiento diferente: diferentes formaciones, diferente logística, diferente doctrina. [minister.GetSheHe] se niega a aprenderlas. El ejército lo está pagando."
 cc_neg.6.a: "Exigir la asistencia a un nuevo programa de formación."
 cc_neg.6.b: "Honrar el servicio de [minister.GetHerHis] y dejar que [minister.GetHerHim] lo termine a su manera."
 cc_neg.6.c: "Reemplazarlos por alguien de la era actual."

 cc_neg.7.title: "Una corte vuelto cínica"
 cc_neg.7.desc: "Hemos dejado pasar demasiadas oportunidades, rechazado demasiadas buenas opciones. [minister.GetName] lo ha notado. La sinceridad ha desaparecido del consejo de [minister.GetHerHis], sustituida por una competencia irónica que los estamentos ya no encuentran inspiradora."
 cc_neg.7.a: "Darle a [minister.GetHerHim] algo en qué creer; esta vez, tomar el camino ambicioso."
 cc_neg.7.b: "El cinismo mantiene honestos a los asesores."
 cc_neg.7.c: "Deje marchar a [minister.GetHerHim]."

 cc_neg.8.title: "Ambición sin cautela"
 cc_neg.8.desc: "[minister.GetName] nos ha visto luchar y fracasar, expandirnos y retroceder, y ha sacado la conclusión equivocada de todo ello: que no fuimos lo suficientemente audaces. Sus consejos ahora impulsan la adquisición a cualquier precio, y el antagonismo y los fracasos coloniales que sigan no serán responsabilidad suya."
 cc_neg.8.a: "Redirigir la energía de [minister.GetHerHis]: ideas audaces, ejecución cuidadosa."
 cc_neg.8.b: "El consejo audaz tiene sus utilidades."
 cc_neg.8.c: "Relevar a [minister.GetHerHim] de [minister.GetHerHis] cargo."

 # ============================================================
 # NEGATIVE TRAIT REHABILITATION EVENTS (cc_neg.11-19)
 # ============================================================

 cc_neg.11.title: "El Consejero Encuentra un Nuevo Propósito"
 cc_neg.11.desc: "La capital ha estado creciendo. Nuevas construcciones, nueva riqueza, nuevos desafíos... y [minister.GetName] se ha encontrado frente a una corte que ya no tolera las respuestas fáciles. Algo ha cambiado en sus consejeros[minister.GetHerHim][minister.GetHerHis]."
 cc_neg.11.a: "Financia un programa formal de renovación: dale un nuevo uso a su experiencia [minister.GetHerHis]."
 cc_neg.11.b: "Permitir que [minister.GetHerHim] se retire dignamente, con su legado intacto."

 cc_neg.12.title: "La paz cambia a un ministro"
 cc_neg.12.a: "Reconoce el cambio. Su experiencia vuelve a ser una ventaja."

 cc_neg.13.title: "El intrigante cede al deber"
 cc_neg.13.desc: "[minister.GetName] ha recibido una exigente tarea de integración, una que requería trabajar con los mismos ministros a los que [minister.GetSheHe] había estado socavando. En algún punto de ese trabajo, la creación de facciones se volvió tediosa y la tarea en sí se volvió interesante."
 cc_neg.13.a: "La corte es más fuerte gracias a sus esfuerzos."

 cc_neg.14.title: "La eficiencia regresa al gabinete"
 cc_neg.14.desc: "El gabinete vuelve a funcionar bien, y [minister.GetName] ha sido parte de la razón. Rodeado de sistemas operativos, ha encontrado la manera de contribuir en lugar de obstruir. La inercia burocrática ha desaparecido."
 cc_neg.14.a: "Reconocer la mejora: este es el ministro que necesitábamos."

 cc_neg.15.title: "Corrupción eliminada"
 cc_neg.15.desc: "Resuelto el acaparamiento de riquezas y abiertas las cuentas al escrutinio adecuado, [minister.GetName] no ha tenido dónde esconder las discrepancias. El enriquecimiento del estamento ha terminado. Silenciosamente, la corrupción ha terminado con él."
 cc_neg.15.a: "Tomen nota del cambio. Vigilaremos más de cerca."

 cc_neg.16.title: "La duda regresa al zelote"
 cc_neg.16.desc: "Un ministro que no tolera a los herejes ha sido colocado en una corte donde la tolerancia era el precio de la paz. Le ha costado algo, pero lo perdido parece haber sido sustituido por algo más antiguo y útil: el matiz."
 cc_neg.16.a: "Damos la bienvenida a [rehabilitated_minister.GetHerHim] de vuelta al consejo pleno."
 cc_neg.16.b: "Contratar asesoramiento teológico privado para acelerar la reforma de [rehabilitated_minister.GetHerHis]."

 cc_neg.17.title: "Un general que aprendió nuevos trucos"
 cc_neg.17.desc: "El avance militar ha superado la antigua doctrina y [minister.GetName] —finalmente— ha seguido el ritmo. Sus consejos sobre la composición del ejército y la planificación de campañas ya no son un lastre. El ejército lo ha notado."
 cc_neg.17.a: "Restaurarles la autoridad militar completa."

 cc_neg.18.title: "La leyenda lo cambia todo"
 cc_neg.18.a: "Permita que [minister.GetHerHim] hable. La corte escuchará."

 cc_neg.19.title: "Un expansor temerario encuentra un nuevo rumbo"
 cc_neg.19.desc: "Años de paz y un antagonismo disminuido han dado a [minister.GetName] tiempo para reflexionar sobre cuál es la verdadera función de un consejo audaz. La respuesta a la que [minister.GetSheHe] ha llegado es más moderada que sus consejos pasados, pero sigue siendo ambiciosa."
 cc_neg.19.a: "Su energía es ahora un activo: una expansión constante, no temeraria."
 cc_neg.19.b: "Redirigir esa energía por completo: dejar que [minister.GetHerHim] se convierta en un provocador."

 # ============================================================
 # Follow-Up Events (cc_neg.100–103)
 # ============================================================

 cc_neg.100.title: "El nuevo proyecto del ministro"
 cc_neg.100.desc: "Meses después de que [minister.GetName] recuperara su propósito, llegan noticias de lo que [minister.GetSheHe] logró —o no logró—. La inversión ha dado sus frutos de una forma u otra. Si esa forma es bienvenida es otra cuestión."
 cc_neg.100.a: "¿En qué quedó la iniciativa del ministro?"

 cc_neg.101.title: "El ministro reasignado informa"
 cc_neg.101.a: "Tomen nota del resultado."

 cc_neg.102.title: "Las Secuelas del Soborno"
 cc_neg.102.desc: "El pago se realizó. El acuerdo quedó entendido. Lo que no estaba claro era si [minister.GetName] lo respetaría, o si simplemente se guardaría el oro y consideraría la transacción como un primer plazo. Los meses transcurridos han dado una respuesta."
 cc_neg.102.a: "Rinde cuentas de lo sucedido."

 cc_neg.103.title: "La Sombra del Asesor Despedido"
 cc_neg.103.desc: "El despido de un consejero expansionista rara vez pasa desapercibido. Las cortes observan estas cosas. Algunos interpretan la moderación como sabiduría; otros ven vulnerabilidad. Han llegado noticias de cómo se ha recibido la decisión."
 cc_neg.103.a: "Así ha sido señalado."
 court_schemer_die_desc: "[CHARACTER.GetName] ha muerto. Las redes que construyeron —las deudas, los favores, los secretos— se disuelven con ellos. Quizás sea una misericordia."
 cc_neg.2.desc: "Nuestro tesoro ha estado lleno, y [minister.GetName] ha estado en la corte durante cada campaña de la última década. Un patrón está surgiendo en sus consejos de [minister.GetHerHis]: los acuerdos que [minister.GetSheHe] recomienda son siempre un poco menos favorables de lo que nuestra posición justifica. La ventaja parece fluir hacia otro lugar."
 cc_neg.4.desc: "La edad ha avanzado, pero [minister.GetName] no. Sus métodos de [minister.GetHerHis] fueron adecuados alguna vez. Ahora son simplemente cautelosos, y cauteloso es otra forma de decir lento. La eficiencia del gabinete sufre silenciosamente."
 cc_neg.12.desc: "Años de paz tienen la manera de recordarles a los ministros para qué sirve realmente el gobierno. [minister.GetName] ha pasado este periodo de tranquilidad en una reflexión genuina. La voz del lucro en su consejo de [minister.GetHerHis] se ha vuelto más silenciosa."
 cc_neg.18.desc: "Algo extraordinario ha sucedido en esta corte, y [minister.GetName] estuvo presente. El cinismo que se había instalado en [minister.GetHerHis] actitud ha dado paso a algo que [minister.GetSheHe] había olvidado que era posible: la convicción."
 cc_neg.101.desc: "A [minister.GetName] se le asignó una tarea exigente para canalizar [minister.GetHerHis] ambiciones. Han pasado varios meses. Los resultados han llegado, y revelan si esa reasignación cambió algo en absoluto."
