l_spanish:
 # ============================================================
 # Pillar 02 — Estate-Aligned Cabinet Factions
 # ============================================================

 # --- Estate Faction Traits (Family G) ---
 noble_champion_of_court: "Campeón Noble de la Corte"
 noble_champion_of_court_desc: "Este ministro es la voz inequívoca del estamento noble dentro del gabinete. Los títulos, los privilegios y las prerrogativas militares son el lenguaje que [character.GetHeShe] habla, y los estamentos lo saben."

 merchant_of_the_crown: "Mercader de la Corona"
 merchant_of_the_crown_desc: "Nacido en las casas de comercio, este ministro aporta el razonamiento comercial del estamento burgués a cada consejo. Las rutas comerciales son política; el beneficio es arte de gobernar."

 court_prelate: "Prelado de la corte"
 court_prelate_desc: "Este ministro ostenta dos cargos: un asiento en el gabinete y el peso de la fe. El clero ve en [character.GetHimHer] a su defensor dentro del círculo íntimo de la corona."

 tribune_of_the_commons: "Tribuno de los Comunes"
 tribune_of_the_commons_desc: "Existen pocos ministros así; aún menos sobreviven a la indiferencia de la corte. Este lo ha logrado. [character.GetHeShe|c] escucha las peticiones campesinas que otros descartan y las traduce en políticas que previenen las rebeliones en lugar de suprimirlas."

 steppe_voice: "Voz de la Estepa"
 steppe_voice_desc: "Este ministro camina por la corte y por la llanura abierta con la misma facilidad. [character.GetHeShe|c] media entre las expectativas del estamento tribal y las demandas de un gobierno sedentario; un equilibrio inestable, pero necesario."

 dhimmi_advocate: "Defensor de los dhimmi"
 dhimmi_advocate_desc: "Donde otros ven una base imponible, este ministro ve a un electorado. La comunidad dhimmi ha encontrado una voz dentro del gabinete — y el reino es, al menos marginalmente, más estable gracias a ello."

 cossack_hetman_liaison: "Enlace del Hetman cosaco"
 cossack_hetman_liaison_desc: "El hetman confía en este ministro para representar los intereses cosacos donde el hetman no puede cabalgar. [character.GetHeShe|c] lleva las demandas de la estepa y el orgullo de los cosacos a salas de consejo que, de otro modo, nunca las escucharían."

 # --- cc_fac.1 — The Nobles Demand ---
 cc_fac.1.title: "Los nobles exigen"
 cc_fac.1.desc: "Con [noble_minister.GetName] y un segundo ministro alineado con la nobleza ya firmemente establecidos en el gabinete, el estamento noble ha empezado a actuar como si la corte les perteneciera. El delegado formal de los estamentos ha presentado una demanda —presentada como una petición, pero todos saben lo que es: un privilegio, una concesión o una reforma que consolidará el poder noble durante una generación."

 cc_fac.1.a: "Conceder el privilegio — los nobles son demasiado poderosos para rechazarlos."
 cc_fac.1.a.tooltip: "Los nobles están satisfechos y el gabinete respalda la decisión con alivio. El tesoro soporta el coste. La composición de la corte funciona exactamente a medida que se concentra el poder del estamento noble, y los ministros se aseguran de ello."

 cc_fac.1.b: "Rechazar: la corona no gobierna mediante el consentimiento noble."
 cc_fac.1.b.tooltip: "Un rechazo rotundo. El estamento noble se siente afrentado; [noble_minister.GetName] está visiblemente avergonzado por la reprimenda. La corte capta la señal, pero también todas las casas nobles del reino."

 cc_fac.1.c: "Ofrecer una concesión parcial para preservar la paz."
 cc_fac.1.c.tooltip: "Un compromiso que no satisface completamente a nadie y no ofende fatalmente a ninguno. Los estamentos reciben un gesto modesto; la corona conserva su prerrogativa; el tesoro paga una pequeña tarifa por la paz."

 # --- cc_fac.2 — The Merchant Compact ---
 cc_fac.2.title: "El pacto mercantil"
 cc_fac.2.desc: "Los ministros alineados con la burguesía han estado trabajando discretamente. [merchant_minister.GetName] presenta el resultado: un acuerdo comercial formal, patrocinado por las redes mercantiles del estamento y estructurado para enriquecer a la corona. El trato es legalmente sólido, políticamente conveniente y —según los nobles que han leído la letra pequeña— profundamente humillante para todo aquel que no sea comerciante."

 cc_fac.2.a: "Acepta el pacto: el poder comercial es el poder real."
 cc_fac.2.a.tooltip: "El tesoro aumenta sustancialmente. El estamento burgués está encantado. El estamento noble, cuyas levas e ingresos fiscales sobre la tierra se ven discretamente mermados por el acuerdo, alimenta un resentimiento silencioso."

 cc_fac.2.b: "Rechazar el pacto: la corona no debe gobernar a través de mercaderes."
 cc_fac.2.b.tooltip: "El rechazo es digno pero claro. [merchant_minister.GetName] lo recibe en silencio y lo archiva. El estamento está descontento, y la confianza del ministro en la corona ha disminuido."

 cc_fac.2.c: "Aceptar una versión más reducida del acuerdo."
 cc_fac.2.c.tooltip: "Un pacto limitado: el oro fluye hacia adentro, y con él cierta presión inflacionaria. Los burgueses dicen que es un comienzo. Los nobles dicen que es el primer paso. Probablemente ambos tengan razón."

 # --- cc_fac.3 — The Prelates Move ---
 cc_fac.3.title: "Los prelados se mueven"
 cc_fac.3.desc: "[clergy_minister.GetName] ha convocado a un consejo privado de las voces clérigas del gabinete. El resultado es un documento de postura formal: debe percibirse que la corte impone la conformidad confesional dentro de las instituciones del reino. Los ministros no hablan de herejía, sino de «coherencia administrativa». Pero los estamentos, los herejes y las cortes extranjeras entienden perfectamente lo que se propone en realidad."

 cc_fac.3.a: "Respaldar al clero: la unidad confesional fortalece el reino."
 cc_fac.3.a.tooltip: "El clero queda satisfecho; el aparato de conversión recibe un mandato formal. El prestigio aumenta ligeramente junto con la piedad visible del reino. Los comerciantes burgueses con redes de fe mixta comienzan a trasladarse discretamente."

 cc_fac.3.b: "Resistir el movimiento: la corona gobierna todos los estamentos por igual."
 cc_fac.3.b.tooltip: "Un rechazo firme a que la corona sea un instrumento de imposición confesional. El clero está descontento; la estabilidad se afianza; [clergy_minister.GetName] está furioso en privado."

 cc_fac.3.c: "Llegar a un compromiso: dar más influencia al clero sin una aplicación formal."
 cc_fac.3.c.tooltip: "El clero recibe una mayor autoridad de agenda sobre los asuntos religiosos dentro de la competencia del gabinete. No es lo que querían, pero es suficiente para considerarlo una concesión."

 # ============================================================
 # Modifier Display Names (Pillar 02 — Auto-Modifiers)
 # ============================================================
 MODIFIER_NAME_nobles_court_captured: "Los nobles dominan el gabinete"
 MODIFIER_DESC_nobles_court_captured: "Dos o más ministros alineados con la nobleza han convertido el gabinete en una herramienta del estamento noble. El prestigio recae en sus patrones; las agendas comerciales y clérigas son sistemáticamente despriorizadas."

 MODIFIER_NAME_burghers_court_captured: "Los burgueses dominan el gabinete"
 MODIFIER_DESC_burghers_court_captured: "Dos o más ministros alineados con la burguesía han convertido el gabinete en un motor comercial. La eficiencia comercial aumenta; los intereses militares y clérigos son ignorados silenciosamente."

 MODIFIER_NAME_clergy_court_captured: "El clero domina el gabinete"
 MODIFIER_DESC_clergy_court_captured: "Dos o más ministros alineados con el clero han hecho que el gabinete hable con una sola voz confesional. La influencia religiosa aumenta; la tolerancia a la heterodoxia colapsa."

 # ============================================================
 # Static Modifier Names (Pillar 02 — Country Modifiers)
 # ============================================================
 STATIC_MODIFIER_NAME_cc_nobles_court_captured: "Captura de Noble"
 STATIC_MODIFIER_DESC_cc_nobles_court_captured: "El estamento noble controla el gabinete. El prestigio y el poder de la agenda noble aumentan; los intereses comerciales y clérigos sufren."

 STATIC_MODIFIER_NAME_cc_burghers_court_captured: "Captura de burgueses"
 STATIC_MODIFIER_DESC_cc_burghers_court_captured: "El estamento mercantil controla el gabinete. La eficiencia comercial aumenta; los intereses nobles y clericales se ven perjudicados."

 STATIC_MODIFIER_NAME_cc_clergy_court_captured: "Captura del clero"
 STATIC_MODIFIER_DESC_cc_clergy_court_captured: "El clero controla el gabinete. La influencia religiosa aumenta; la tolerancia disminuye; los intereses comerciales sufren."
 desc_cossack_hetman_liaison: "Habla por el hetman en nuestra corte y de nuestra corte al hetman, y goza de confianza en ambos extremos. La nobleza escucha, y también los jinetes."
 desc_court_prelate: "Un clérigo con un asiento en la mesa y sin intención de cederlo. La fe habla con nuestra voz en el extranjero, y el clero habla con mucha más fuerza en casa."
 desc_dhimmi_advocate: "Sostiene que los súbditos de otras fes son, ante todo, súbditos, y lo ha sostenido durante tanto tiempo que la gente ha dejado de objetar. Como resultado, las cortes extranjeras consideran que es más fácil tratar con nosotros."
 desc_merchant_of_the_crown: "Un hombre de negocios que asumió un cargo y nunca dejó del todo de ser un hombre de negocios. Nuestras mercancías se venden mejor, y los burgueses han encontrado una voz en la corte."
 desc_noble_champion_of_court: "El hombre de la nobleza en el gabinete, y orgulloso de ello. La corona gana lustre por la asociación y la nobleza gana todo lo demás."
 desc_steppe_voice: "Conoce las praderas y a los hombres que viven en ellas, y puede movilizar a ambos. La caballería ligera llega más lejos y el ejército es más estable gracias a ellos."
 desc_tribune_of_the_commons: "Habla por las personas de quienes se suele hablar. Las quejas llegan al gabinete antes de llegar a las calles, y el reino está más tranquilo de lo que tiene derecho a estar."
