 # ========================
 # IO UNITY MODIFIERS
 # ========================
 STATIC_MODIFIER_NAME_ccim_high_unity_bonus: "Fuerza confederada"
 ccim_high_unity_bonus: "Fuerza confederada"
 ccim_high_unity_bonus_desc: "La Confederación Mesoamericana habla con una sola voz. Nuestros guerreros sacan confianza del vínculo inquebrantable entre nuestros pueblos."
 STATIC_MODIFIER_NAME_ccim_low_unity_penalty: "Fracturas de la confederación"
 ccim_low_unity_penalty: "Fracturas de la confederación"
 ccim_low_unity_penalty_desc: "Las tensiones dentro de la confederación socavan la moral y debilitan el reclutamiento. La unidad debe restaurarse antes de que los invasores aprovechen nuestras divisiones."
 STATIC_MODIFIER_NAME_ccim_newly_joined_bonus: "Nuevo miembro de la confederación"
 ccim_newly_joined_bonus: "Nuevo miembro de la confederación"
 ccim_newly_joined_bonus_desc: "Un renovado sentido del propósito sigue a nuestra entrada en la Confederación Mesoamericana. Nuestros guerreros están animados y su moral aumenta."
 STATIC_MODIFIER_NAME_ccim_confederation_betrayer: "Abandono de la confederación"
 ccim_confederation_betrayer: "Abandono de la confederación"
 ccim_confederation_betrayer_desc: "Abandonamos a la Confederación Mesoamericana en su hora de necesidad. Nuestros guerreros están desmoralizados y nuestra reputación entre los pueblos nativos ha disminuido."
 STATIC_MODIFIER_NAME_ccim_war_council_boost: "Decreto del Consejo de Guerra"
 ccim_war_council_boost: "Decreto del Consejo de Guerra"
 ccim_war_council_boost_desc: "El consejo de guerra de la confederación ha emitido un decreto de movilización total. Cada estado miembro compromete a sus guerreros a una causa común."

 # ========================
 # IO LEADER ACTIONS
 # ========================
 ccim_io_war_council: "Convocar Consejo de Guerra"
 ccim_io_war_council_desc: "Convoca al consejo de guerra y emite un decreto de movilización total. Todos los miembros de la confederación reciben una mejora de la moral militar y de las levas. Requiere estar en guerra. Cuesta 15 de Unidad de Confederación. No se puede repetir durante 5 años."

 ccim_io_tribute_levy: "Recaudar Tributo de la Confederación"
 ccim_io_tribute_levy_desc: "Invocar el derecho de recaudación de tributos. Cada miembro que no sea el líder paga 20 de oro al fondo de guerra del líder. La extracción de tributos tensa la buena voluntad de los miembros. Cuesta 10 de Unidad de Confederación. No se puede usar durante una guerra. No se puede repetir durante 8 años."

 ccim_io_send_envoys: "Enviar enviados de la Confederación"
 ccim_io_send_envoys_desc: "Enviar enviados con regalos y una invitación formal a una potencia nativa independiente vecina. Si aceptan, se unirán a la Confederación Mesoamericana. Cuesta 50 de oro y 10 de Unidad de la Confederación. No puede repetirse durante 3 años."

 ccim_io_strike_invaders: "Golpear a los Invasores"
 ccim_io_strike_invaders_desc: "Emitir el mandato de guerra de la confederación contra una potencia colonial vecina. Si ya se posee un casus belli contra el objetivo, se declara la guerra inmediatamente y todos los miembros reciben una bonificación de combate. De lo contrario, se concede el casus belli para su uso posterior. Gana 20 de unidad de la confederación. No puede repetirse durante 10 años."

 ccim_io_absorb_tribe: "Absorber una tribu vecina"
 ccim_io_absorb_tribe_desc: "Usar la autoridad de la confederación para absorber diplomáticamente a una nación nativa independiente vecina, anexionando sus tierras al reino del líder. Cuesta 25 de Unidad de Confederación. No se puede repetir durante 15 años."

 # Action target choice UI
 ccim_choose_envoy_target: "Elige una nación nativa a la que invitar"
 ccim_choose_strike_target: "Elige una potencia colonial a la que atacar"
 ccim_choose_absorb_target: "Elige una tribu vecina para absorber"

 # CB
 cc_repel_invaders: "Expulsar a los Invasores"
 cc_repel_invaders_desc: "La Confederación Mesoamericana ha emitido un mandato para expulsar a las fuerzas coloniales de las tierras sagradas de Mesoamérica."

 # ========================
 # EVENTS 60–63 (IO Confederation)
 # ========================
 cc_invasion_mexico.60.title: "El Consejo de la Confederación delibera"
 cc_invasion_mexico.60.desc: "La estación ha cambiado y los líderes de la confederación se han reunido. Como jefe supremo, todas las miradas se vuelven hacia ti: ¿En qué debería centrar la confederación su energía en los próximos meses? ¿Hacia la guerra y la preparación, o hacia el fortalecimiento de los vínculos entre nuestros pueblos?"
 cc_invasion_mexico.60.a: "Centrar nuestros esfuerzos en la preparación militar; los invasores no esperarán."
 cc_invasion_mexico.60.b: "Invertir en los vínculos entre nuestros pueblos. La unidad es nuestra mayor arma. [Root.GetTreasuryCost(40)|Y]"
 cc_invasion_mexico.60.c: "Enviar enviados a un pueblo vecino: ampliar el alcance de la confederación."

 cc_invasion_mexico.61.title: "La Confederación se está fracturando"
 cc_invasion_mexico.61.desc: "Llegan despachos preocupantes de toda la confederación. Las disputas sobre recursos, autoridad y obligaciones han estallado. Algunos estados miembros están considerando retirarse. La confederación que se erigió como baluarte contra la conquista podría desmoronarse desde dentro a menos que actuemos."
 cc_invasion_mexico.61.a: "Convoca un consejo de emergencia. Une a los pueblos, cueste lo que cueste. [Root.GetTreasuryCost(60)|Y]"
 cc_invasion_mexico.61.b: "Que las tensiones sigan su curso. La verdadera unidad no puede forzarse."

 cc_invasion_mexico.62.title: "El Sumo Sacerdote Bendice la Confederación"
 cc_invasion_mexico.62.desc: "El sumo sacerdote ha convocado a los líderes de la confederación al recinto sagrado para una ceremonia de unidad y favor divino. Los tambores suenan, el incienso llena el aire y los sacerdotes leen los presagios para la confederación en su conjunto. Ya sea que honremos la ceremonia plenamente o la aplacemos por preocupaciones prácticas, este momento exige una respuesta."
 cc_invasion_mexico.62.a: "Honrar la ceremonia en su totalidad. Los dioses de todos nuestros pueblos nos bendigan."
 cc_invasion_mexico.62.b: "Enviar nuestros saludos, pero nuestros guerreros necesitan acción, no oración."

 cc_invasion_mexico.63.title: "Enviados de la Confederación Mesoamericana"
 cc_invasion_mexico.63.desc: "Llega una delegación portando regalos de jade, plumas y grano —y una invitación formal. La Confederación Mesoamericana nos ofrece un lugar entre sus estados miembros: defensa compartida, ayuda mutua y la protección de un frente nativo unido contra los invasores extranjeros que presionan desde la costa. Es una oferta que merece ser sopesada cuidadosamente."
 cc_invasion_mexico.63.a: "Aceptamos la invitación. Nuestro pueblo estará junto a la confederación."
 cc_invasion_mexico.63.b: "Rechazamos la oferta. Nuestro camino es nuestro para elegirlo."

 # ========================
 # EVENT 64 — The Fall of Our Neighbors (fear cascade)
 # ========================
 cc_invasion_mexico.64.title: "La Caída de Nuestros Vecinos"
 cc_invasion_mexico.64.desc: "Un pueblo vecino ha sido subyugado por los invasores. Sus guerreros derrotados, sus jefes humillados, sus tierras repartidas entre señores extranjeros. Los emisarios de la confederación presentan su caso con renovada urgencia: 'Habéis visto lo que ocurre con quienes se mantienen solos. Nuestra oferta no permanecerá abierta para siempre'."
 cc_invasion_mexico.64.a: "Su destino ha decidido el nuestro. Nos unimos a la confederación."
 cc_invasion_mexico.64.b: "Negociaremos nuestros propios términos con los invasores."

 # ========================
 # EVENT 70 — The Hour of Conquest (Colonial War Push)
 # ========================
 cc_invasion_mexico.70.title: "La Hora de la Conquista"
 cc_invasion_mexico.70.desc: "Nuestros comandantes insisten con creciente urgencia: tenemos un casus belli, nuestras fuerzas están desplegadas y las potencias nativas se fortalecen cada temporada que nos demoramos. La ventana de oportunidad está abierta, pero las ventanas no permanecen abiertas para siempre."
 cc_invasion_mexico.70.a: "Dar la orden. Comenzar la campaña."
 cc_invasion_mexico.70.b: "Primero debemos consolidar nuestra posición."

 # Situation end reason descriptions
 ccim_end_year_limit: "La era de las conquistas ha pasado: se ha alcanzado el año 1600."
 ccim_end_natives_subjugated: "Todas las potencias nativas independientes de Mesoamérica han sido subyugadas o destruidas."
