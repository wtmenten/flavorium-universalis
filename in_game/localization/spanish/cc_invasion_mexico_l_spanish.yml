l_spanish:

 # ========================
 # SITUATION
 # ========================
 cc_invasion_mexico: "Invasión de México"
 cc_invasion_mexico_desc: "Las potencias coloniales de costas lejanas han llegado al corazón de Mesoamérica. Los grandes imperios azteca, maya y sus parientes se enfrentan a una amenaza existencial. ¿Forjarán los pueblos nativos la unidad contra los invasores, o reclamará la era de la conquista estas antiguas civilizaciones para siempre?"

 # ========================
 # GAME RULE
 # ========================
 cc_invasion_mexico_rule: "Invasión de México"
 cc_invasion_mexico_rule_desc: "Controla si puede activarse la situación de la Invasión de México, añadiendo eventos narrativos, casus belli personalizados y acciones en el panel de situación tanto para las potencias coloniales como para las nativas."
 cc_invasion_mexico_on: "Habilitado (Histórico)"
 cc_invasion_mexico_on_desc: "La situación de la Invasión de México se activará cuando se cumplan las condiciones del activador."
 cc_invasion_mexico_off: "Desactivado"
 cc_invasion_mexico_off_desc: "La situación de la Invasión de México nunca se activará."

 # ========================
 # HINT
 # ========================
 hint_cc_invasion_mexico: "La situación de la Invasión de México representa la conquista española de Mesoamérica. Las potencias coloniales pueden obtener casus belli especiales contra las naciones nativas y organizar expediciones desde el panel de situación. Las potencias nativas pueden unirse en la Confederación mesoamericana para su defensa mutua, u ofrecer tributos para evitar la agresión. La situación termina cuando todas las potencias nativas independientes son subyugadas, o cuando se alcanza el año 1600."

 # ========================
 # EVENT 1 — Announcement
 # ========================
 cc_invasion_mexico.1.title: "Comienza la Era de las Conquistas"
 cc_invasion_mexico.1.desc_native: "La noticia se extiende rápidamente por nuestras tierras: barcos extranjeros han desembarcado y soldados extraños marchan hacia el interior. Estos invasores no vienen como comerciantes sino como conquistadores, portando acero y fuego. La forma en que respondamos ahora puede determinar el destino de nuestra civilización."
 cc_invasion_mexico.1.desc_colonial: "Nuestros exploradores han llegado a los grandes imperios continentales del Nuevo Mundo. Ciudades de oro y plata están a nuestro alcance. Los pueblos nativos son numerosos y belicosos, pero están divididos, y nosotros estamos decididos. La era de la conquista ha comenzado."
 cc_invasion_mexico.1.a: "Estaremos a la altura de este momento."

 # ========================
 # EVENTS 2–4 — Federation Requests
 # ========================
 cc_invasion_mexico.2.title: "El Imperio en la Encrucijada"
 cc_invasion_mexico.2.desc: "Hombres extraños con armas de trueno han desembarcado y ya hablan de reclamar nuestras tierras como suyas. Llegan emisarios proponiendo una gran confederación de pueblos nativos. Pero nuestros señores se preguntan si este imperio debe doblegarse ante cualquier alianza, o si nuestras propias murallas y guerreros son suficientes para enfrentar esta amenaza."
 cc_invasion_mexico.2.a: "Forjaremos y lideraremos esta alianza."
 cc_invasion_mexico.2.b: "El imperio se sostiene únicamente por su propia fuerza."

 cc_invasion_mexico.3.title: "Viejos rivales, nuevas amenazas"
 cc_invasion_mexico.3.desc: "Llegan emisarios proponiendo una confederación de los pueblos de esta tierra. Durante generaciones nos hemos mantenido apartados —y a veces enfrentados— a quienes ahora extienden esta oferta. Sin embargo, los soldados extranjeros no nos distinguen cuando marchan. Quizás los viejos rencores importen menos que la supervivencia."
 cc_invasion_mexico.3.a: "Dejemos atrás las viejas rivalidades. Nos unimos."
 cc_invasion_mexico.3.b: "No confiamos en ninguna alianza forjada por nuestros viejos rivales."

 cc_invasion_mexico.4.title: "El Consejo delibera"
 cc_invasion_mexico.4.desc: "Nuestros jefes de guerra y sacerdotes se han reunido. Los emisarios traen términos generosos: protección mutua, recursos compartidos, un frente unido. Pero nuestros ancianos recuerdan la última vez que confiamos nuestro destino a una potencia mayor. El consejo está dividido entre quienes ven seguridad en el número y quienes aconsejan que nuestro destino está en nuestras propias manos."
 cc_invasion_mexico.4.a: "Los números hablan por sí solos. Nos unimos."
 cc_invasion_mexico.4.b: "Nuestro destino está en nuestras propias manos."

 # ========================
 # EVENT 5 — Defensive Preparation
 # ========================
 cc_invasion_mexico.5.title: "Soldados Extranjeros en la Frontera"
 cc_invasion_mexico.5.desc: "Los exploradores informan que soldados coloniales se han apoderado de tierras en el límite de nuestro territorio. Sus armas son extrañas y sus números crecen. Debemos decidir cómo responder a esta amenaza antes de que llegue a nuestra puerta."
 cc_invasion_mexico.5.a: "Reforzar nuestras fortificaciones y organizar a nuestros guerreros."
 cc_invasion_mexico.5.b: "Buscar seguridad en la alianza: unirse a la Confederación."

 # ========================
 # EVENTS 10–12 — Monthly Confederate Events
 # ========================
 cc_invasion_mexico.10.title: "La Confederación resiste"
 cc_invasion_mexico.10.desc: "A pesar de la presión de la invasión, los vínculos de nuestra confederación siguen siendo fuertes. Mercancías, guerreros y mensajes fluyen entre nuestros pueblos. Juntos somos algo a lo que los colonizadores aún no se han enfrentado."
 cc_invasion_mexico.10.a: "Nuestra unidad es nuestra mayor arma."

 cc_invasion_mexico.11.title: "Tensiones dentro de la Confederación"
 cc_invasion_mexico.11.desc: "El peso de la confederación se vuelve pesado. Líderes rivales disputan la autoridad y algunos de nuestros súbditos cuestionan si esta alianza realmente sirve a nuestros intereses. La amenaza colonial no ha desaparecido, pero tampoco la vieja ambición."
 cc_invasion_mexico.11.a: "Soportamos la fricción. La unidad debe prevalecer."
 cc_invasion_mexico.11.b: "Esta confederación no merece nuestra sumisión. Nos retiramos."

 cc_invasion_mexico.12.title: "Los colonizadores exigen tributo"
 cc_invasion_mexico.12.desc: "Llegan emisarios de la potencia colonial vecina con un mensaje inequívoco: enviad tributo o afrontad las consecuencias. Nuestro tesoro está mermado, pero también nuestro orgullo. ¿Cómo responderemos?"
 cc_invasion_mexico.12.a: "Pagar el tributo. Nos dará tiempo."
 cc_invasion_mexico.12.b: "No nos someteremos a la extorsión."

 # ========================
 # EVENT 20 — Colonial Neighbor Interaction
 # ========================
 cc_invasion_mexico.20.title: "La frontera nativa"
 cc_invasion_mexico.20.desc: "Nuestras fuerzas comparten ahora frontera con uno de los grandes imperios nativos de Mesoamérica. Nos observan desde el otro lado de la frontera. ¿Cómo deberíamos abordarlos?"
 cc_invasion_mexico.20.a: "Enviar un enviado con regalos: que la diplomacia abra el camino."
 cc_invasion_mexico.20.b: "Plantear una reivindicación sobre sus tierras. La conquista vendrá cuando estemos listos."

 # ========================
 # EVENT 21 — Native Response to Colonial Envoy
 # ========================
 cc_invasion_mexico.21.title: "El Enviado Regresa"
 cc_invasion_mexico.21.desc_default: "Nuestra misión diplomática ha regresado de la corte nativa. Fueron recibidos con curiosidad y cautela. Se han sentado las bases para futuros tratos."
 cc_invasion_mexico.21.desc_conf: "Nuestro enviado fue recibido en la frontera por una guardia confederada y escoltado bajo estrecha vigilancia hasta la corte del gobernante. Nuestra diplomacia causó cierta impresión, pero la sombra de la confederación es larga."
 cc_invasion_mexico.21.a: "Un comienzo prometedor."

 # ========================
 # EVENT 25 — Commission Expedition (Monthly)
 # ========================
 cc_invasion_mexico.25.title: "Informes del Interior"
 cc_invasion_mexico.25.desc: "Nuestros agentes han regresado de explorar el interior. Vastas ciudades, almacenes de oro y comida, y una población madura para la subyugación; todo está a nuestro alcance. ¿Debemos comisionar una expedición formal para reclamar nuestro derecho?"
 cc_invasion_mexico.25.a: "Encargar la expedición de inmediato."
 cc_invasion_mexico.25.b: "El momento aún no es el adecuado."

 # ========================
 # EVENT 26 — Protectorate Offer Response
 # ========================
 cc_invasion_mexico.26.title: "La oferta del colonizador"
 cc_invasion_mexico.26.desc: "Un poderoso gobernante colonial ha enviado emisarios con una propuesta extraordinaria: en lugar de enfrentarnos a la conquista, podríamos aceptar un estatus de protección, conservando nuestras costumbres, nuestros gobernantes y nuestras tierras bajo su señorío nominal. Es un cáliz amargo. Pero, ¿vale la pena el precio por la supervivencia?"
 cc_invasion_mexico.26.a: "Aceptamos. La supervivencia de nuestro pueblo debe ser lo primero."
 cc_invasion_mexico.26.b: "Nos negamos. Es mejor caer luchando que inclinarse."

 # ========================
 # EVENT 30 — Expedition Departs
 # ========================
 cc_invasion_mexico.30.title: "La Expedición Parte"
 cc_invasion_mexico.30.desc: "Se han reunido capitanes y soldados, se han cargado los suministros y se han izado los estandartes. La expedición al corazón de Mesoamérica parte con gran ceremonia y altas expectativas. La gloria —y el saqueo— nos aguardan."
 cc_invasion_mexico.30.a: "Si Dios quiere, regresarán victoriosos."

 # ========================
 # EVENTS 35–36 — End Events
 # ========================
 cc_invasion_mexico.35.title: "Termina la Era de las Conquistas"
 cc_invasion_mexico.35.desc_free: "La era de la gran invasión ha terminado, pero nuestro pueblo resiste. Hemos sobrevivido donde otros cayeron. Pase lo que pase a continuación, nuestra civilización ha demostrado su resiliencia."
 cc_invasion_mexico.35.desc_subject: "La era de las conquistas ha llegado a su fin. Nuestras tierras ya no son nuestras, y nuestro pueblo debe aprender a vivir bajo un cielo extranjero. El viejo mundo ha desaparecido. Comienza uno nuevo, doloroso e incierto."
 cc_invasion_mexico.35.a: "Resistimos."

 cc_invasion_mexico.36.title: "La conquista de Mesoamérica"
 cc_invasion_mexico.36.desc_conqueror: "Los grandes imperios nativos de Mesoamérica han sido quebrantados. Sus pueblos sirven ahora bajo nuestro estandarte, sus riquezas fluyen hacia nuestros tesoros. La historia recordará esto como la era en que el Nuevo Mundo pasó a ser nuestro."
 cc_invasion_mexico.36.desc_observer: "La lucha por Mesoamérica ha llegado a su fin. Otros han reclamado sus riquezas, pero la fortuna y el ejemplo de la conquista resonarán en todo el mundo colonial durante generaciones."
 cc_invasion_mexico.36.a: "Comienza una nueva era."

 # ========================
 # CASUS BELLI
 # ========================
 cc_seize_mexico_native: "Conquista colonial"
 cc_seize_mexico_native_PROV: "Conquista colonial (provincia)"
 cc_seize_mexico_native_desc: "Según la doctrina del descubrimiento, esta potencia colonial reclama el derecho de subyugar a los pueblos nativos de Mesoamérica. No se incurre en antagonismo; esta conquista se considera justa según la ley colonial."

 cc_seize_mexico_colonial: "Reclamaciones coloniales enfrentadas"
 cc_seize_mexico_colonial_PROV: "Reclamaciones coloniales enfrentadas (Provincia)"
 cc_seize_mexico_colonial_desc: "Dos potencias coloniales disputan el dominio sobre el mismo rincón del Nuevo Mundo. No se incurre en antagonismo, aunque el coste de imponer una relación de vasallaje será mayor dado el derecho disputado del rival."

 # ========================
 # GENERIC ACTIONS
 # ========================
 ccim_call_confederation: "Pedir la Confederación"
 ccim_call_confederation_desc: "Reúne a los pueblos nativos de Mesoamérica en una confederación defensiva. Crea la Confederación Mesoamericana IO si no existe, o se une a ella. Se invitará a unirse a los vecinos nativos aliados. Cuesta prestigio. No puede repetirse durante 10 años."
 ccim_call_confederation_create_tt: "Crea la Confederación Mesoamericana como líder fundador, o se une a ella si ya existe."

 ccim_offer_tribute: "Ofrecer tributo"
 ccim_offer_tribute_desc: "Enviar oro a una potencia colonial vecina a cambio de mejores relaciones y un respiro temporal de la agresión. Elimina cualquier casus belli que esa potencia tenga contra nosotros. No se puede repetir durante 5 años."

 ccim_commission_expedition: "Encargar Expedición"
 ccim_commission_expedition_desc: "Gasta oro para enviar una expedición a territorio nativo, otorgando un casus belli contra una nación nativa elegida durante 8 años. No puede repetirse durante 5 años."

 ccim_negotiate_protectorate: "Negociar protectorado"
 ccim_negotiate_protectorate_desc: "Acércate a una potencia nativa con términos para una relación de vasallaje. El gobernante nativo recibirá un evento y podrá aceptar o rechazar. Requiere relaciones no hostiles. No se puede repetir durante 8 años."

 # ========================
 # SITUATION PANEL UI
 # ========================
 CCIM_CONFEDERATION_PANEL_HEADER: "Confederación mesoamericana"
 CCIM_SITUATION_OVERVIEW_HEADER: "La lucha por Mesoamérica"
 CCIM_SITUATION_OVERVIEW_DESC: "Las potencias coloniales avanzan hacia Mesoamérica desde la costa. Las naciones nativas pueden unirse en la Confederación o buscar acuerdos de tributo. Utiliza el mapa de situación para ver qué tierras están en manos de cada bando. Las potencias coloniales pueden Encargar Expediciones y Negociar Protectorados; las potencias nativas pueden Convocar a la Confederación u Ofrecer Tributo."

 # Map legend
 CCIM_CONFEDERATION_LEGEND: "Confederación mesoamericana"
 CCIM_NATIVE_UNAFFILIATED_LEGEND: "Estado Nativo Independiente"

 # Map tooltips
 ccim_confederation_member_tt: "Esta tierra pertenece a un miembro de la Confederación Mesoamericana."
 ccim_native_unaffiliated_tt: "Esta tierra pertenece a un estado nativo independiente."
 ccim_colonial_power_tt: "Esta tierra está controlada por una potencia colonial."

 # Situation explanation tooltip (appears on event 1 option)
 ccim_situation_explanation_tt: "La situación de la Invasión de México ya está activa. Las potencias nativas pueden formar una Confederación mesoamericana y ofrecer tributos desde el panel de situación. Las potencias coloniales pueden organizar expediciones y negociar protectorados."

 # No confederation exists tooltip
 ccim_no_confederation_exists_tt: "La Confederación Mesoamericana aún no se ha formado. Primero, una potencia nativa importante debe convocarla."

 # Generic action error tooltips
 ccim_offer_tribute_no_target_tt: "No se ha seleccionado ninguna potencia colonial válida a la cual ofrecer tributo."
 ccim_commission_expedition_no_target_tt: "No se ha seleccionado ningún objetivo nativo válido para la expedición."
 ccim_negotiate_protectorate_no_target_tt: "No se ha seleccionado ninguna potencia nativa válida para las negociaciones del protectorado."

 # Biases (opinion modifiers)
 opinion_ccim_tribute_received: "Tributo Recibido"
 opinion_ccim_diplomatic_approach: "Aproximación diplomática"
 opinion_ccim_tribute_paid: "Tributo Pagado"

 # Event target selection UI
 ccim_choose_tribute_target: "Elige una potencia colonial a la que enviar tributo"
 ccim_choose_expedition_target: "Elige una nación nativa como objetivo"
 ccim_choose_protectorate_target: "Elige una nación nativa a la que contactar"

 # IO opinion modifier (required by the IO engine)
 io_opinion_cc_mesoamerican_confederation: "Compañero miembro de la Confederación"

 # Country modifiers
 STATIC_MODIFIER_NAME_ccim_defensive_preparations: "Preparativos defensivos"
 ccim_defensive_preparations: "Preparativos defensivos"
 ccim_defensive_preparations_desc: "Nuestros ejércitos están desplegados y nuestras fronteras fortificadas ante la expectativa de una agresión colonial."
 STATIC_MODIFIER_NAME_ccim_confederation_solidarity: "Solidaridad de la confederación"
 ccim_confederation_solidarity: "Solidaridad de la confederación"
 ccim_confederation_solidarity_desc: "Los vínculos de la Confederación Mesoamericana fortalecen nuestra resolución y agudizan a nuestros guerreros."
 STATIC_MODIFIER_NAME_ccim_expedition_morale: "Moral de la Expedición"
 ccim_expedition_morale: "Moral de la Expedición"
 ccim_expedition_morale_desc: "Una expedición recién comisionada parte, llena de propósito y ambición."
 STATIC_MODIFIER_NAME_ccim_contested_claims: "Reclamaciones coloniales disputadas"
 ccim_contested_claims: "Reclamaciones coloniales disputadas"
 ccim_contested_claims_desc: "Dos potencias coloniales compiten por el mismo rincón del Nuevo Mundo, haciendo que la subyugación sea más costosa de lo habitual."
 STATIC_MODIFIER_NAME_ccim_divine_blessing: "Bendición de los dioses"
 ccim_divine_blessing: "Bendición de los dioses"
 ccim_divine_blessing_desc: "Las ceremonias sagradas han conmovido los corazones de los guerreros. Los dioses de nuestros antepasados marchan con nosotros."
 STATIC_MODIFIER_NAME_ccim_sacred_fortifications: "Sitios Sagrados Fortificados"
 ccim_sacred_fortifications: "Sitios Sagrados Fortificados"
 ccim_sacred_fortifications_desc: "Nuestros lugares más sagrados han sido reforzados. Sus murallas frenarán a cualquier invasor que se atreva a acercarse."
 STATIC_MODIFIER_NAME_ccim_native_weakness: "Consejo dividido"
 ccim_native_weakness: "Consejo dividido"
 ccim_native_weakness_desc: "Los sobornos y las promesas han sembrado la discordia entre las facciones nobles. Las órdenes del gobernante suenan vacías."
 STATIC_MODIFIER_NAME_ccim_tribute_windfall: "Ganancia Inesperada de Tributo"
 ccim_tribute_windfall: "Ganancia Inesperada de Tributo"
 ccim_tribute_windfall_desc: "El oro extraído de nuestras posesiones mesoamericanas fluye hacia el tesoro, enriqueciendo la campaña."
 STATIC_MODIFIER_NAME_ccim_refugee_influx: "Guerreros refugiados"
 ccim_refugee_influx: "Guerreros refugiados"
 ccim_refugee_influx_desc: "Los supervivientes de los pueblos vecinos caídos han aumentado nuestras filas con guerreros aptos hambrientos de venganza."

 # Opinion modifiers (new)
 opinion_ccim_bribed_noble: "Facción Noble Sobornada"

 # ========================
 # NEW GENERIC ACTIONS
 # ========================
 ccim_fortify_sacred_sites: "Fortificar Sitios Sagrados"
 ccim_fortify_sacred_sites_desc: "Encargar el refuerzo de vuestros lugares sagrados y fortalezas fronterizas. Otorga un modificador de fortificación defensiva y bendice a todos los miembros de la Confederación con protección divina. Cuesta 60 de oro. No se puede repetir durante 8 años."

 ccim_seek_tribal_alliance: "Buscar una alianza tribal"
 ccim_seek_tribal_alliance_desc: "Enviar emisarios a una nación nativa independiente vecina instándoles a unirse a la Confederación Mesoamericana. Considerarán la oferta y podrían aceptarla. Requiere pertenecer a la Confederación. No se puede repetir durante 10 años."

 ccim_extract_tribute: "Extraer tributo"
 ccim_extract_tribute_desc: "Exigir pagos de tributo de tus territorios mesoamericanos. Obtén oro por cada ubicación poseída en la región y aplica una breve bonificación de ingresos. No se puede repetir durante 8 años."

 ccim_bribe_noble_faction: "Sobornar a la Facción Noble"
 ccim_bribe_noble_faction_desc: "Gasta oro para sembrar la división interna entre la nobleza de una potencia nativa. El objetivo sufre un modificador de debilitamiento durante 4 años. Cuesta 80 de oro. No puede repetirse durante 10 años."

 # Action target choice UI
 ccim_choose_bribe_target: "Elige una nación nativa a la que sobornar"

 # Action error tooltip
 ccim_bribe_noble_faction_no_target_tt: "No se ha seleccionado ningún objetivo nativo válido para el soborno."

 # ========================
 # EVENTS 40–43 (Native)
 # ========================
 cc_invasion_mexico.40.title: "El Sumo Sacerdote Insta a la Acción"
 cc_invasion_mexico.40.desc: "El sumo sacerdote ha convocado a nuestros líderes al recinto sagrado. Los dioses, declara, han hablado: el momento de actuar es ahora. Ceremonias sagradas, sacrificios y rituales de protección fortalecerán a nuestros guerreros e invocarán el favor divino sobre nuestra causa. ¿Atenderemos la llamada de las antiguas costumbres?"
 cc_invasion_mexico.40.a: "Honrar los antiguos ritos. Los dioses guiarán a nuestros guerreros."
 cc_invasion_mexico.40.b: "Nuestros guerreros necesitan acero y entrenamiento, no ceremonias."

 cc_invasion_mexico.41.title: "Signos en el humo sagrado"
 cc_invasion_mexico.41.desc: "Las ceremonias han terminado. Los sacerdotes han leído el humo del copal, el vuelo de las aves y los patrones en la ceniza. Hablan de una señal, no de derrota, sino de resistencia. Ya sea en alianza o en desafío solitario, nuestro pueblo se ha fortalecido gracias a los ritos."
 cc_invasion_mexico.41.a: "Un presagio favorable: ¡los dioses están con nosotros!"
 cc_invasion_mexico.41.b: "Signos oscuros. Los sacerdotes nos instan a prepararnos para lo peor."

 cc_invasion_mexico.42.title: "Refugiados de tierras caídas"
 cc_invasion_mexico.42.desc: "Una columna harapienta de supervivientes llega a nuestras puertas: hombres, mujeres y guerreros de un pueblo vecino cuyas tierras han sido arrebatadas por los invasores. No traen más que sus vidas y lo que saben sobre las tácticas de los extranjeros. ¿Cómo los recibiremos?"
 cc_invasion_mexico.42.a: "Acogerlos. Sus guerreros lucharán junto a los nuestros."
 cc_invasion_mexico.42.b: "Interrógales para obtener inteligencia sobre los métodos de los invasores."

 cc_invasion_mexico.43.title: "Una oferta de hermandad"
 cc_invasion_mexico.43.desc: "Han llegado enviados de la Confederación Mesoamericana portando regalos y un mensaje solemne: unidos, los pueblos de esta tierra pueden hacer retroceder la marea de la conquista. Divididos, caeremos uno a uno. La oferta de unirse a la Confederación está ante nosotros."
 cc_invasion_mexico.43.a: "Aceptamos. Nuestros pueblos permanecerán unidos."
 cc_invasion_mexico.43.b: "Encontraremos nuestro propio camino. Les agradecemos la oferta."

 # ========================
 # EVENTS 50–52 (Colonial)
 # ========================
 cc_invasion_mexico.50.title: "Un capitán audaz da un paso adelante"
 cc_invasion_mexico.50.desc: "Un capitán experimentado —curtido en batalla, ambicioso y hambriento de gloria— se ha ofrecido voluntario para liderar una expedición de reconocimiento hacia el interior nativo. Los riesgos son reales: el terreno es desconocido y los nativos están alerta. Pero la inteligencia obtenida podría ser decisiva. ¿Comisionamos su expedición?"
 cc_invasion_mexico.50.a: "Encargar su expedición."
 cc_invasion_mexico.50.b: "El momento no es el adecuado. Esperamos."

 cc_invasion_mexico.51.title: "El Informe del Capitán"
 cc_invasion_mexico.51.desc_success: "¡El capitán ha regresado! Su expedición se adentró profundamente en el interior, trazando mapas de pasos, fuentes de agua y la disposición de las fuerzas nativas. Trae consigo inteligencia detallada y relatos de ciudades que esperan ser reclamadas. Se ha preparado un casus belli contra la potencia nativa más cercana."
 cc_invasion_mexico.51.desc_failure: "El capitán ha regresado, aunque a duras penas. Su expedición encontró una resistencia feroz y se vio obligada a retirarse tras sufrir graves pérdidas. Los hombres están conmocionados, el tesoro es más ligero y el propio capitán se recupera de sus heridas. Una costosa lección sobre los peligros del exceso de confianza."
 cc_invasion_mexico.51.a_success: "Excelente trabajo. Preparen la campaña."
 cc_invasion_mexico.51.b_failure: "Un revés doloroso. Debemos reagruparnos."

 cc_invasion_mexico.52.title: "La fiebre del oro se apodera del campamento"
 cc_invasion_mexico.52.desc: "Se ha extendido la noticia entre nuestros soldados: los nativos esconden vastas cantidades de oro en sus templos y almacenes. La disciplina se está desmoronando mientras los hombres susurran sobre fortunas por reclamar. Debemos decidir cómo manejar la creciente inquietud en las filas."
 cc_invasion_mexico.52.a: "Prometerles una parte del botín. La codicia puede ser un arma."
 cc_invasion_mexico.52.b: "Mantener una disciplina estricta. El orden gana campañas, no la codicia."

