 # === cc_bonds.202 — Faith Under the Surface ===
 cc_bonds.202.title: "Fe bajo la superficie"
 cc_bonds.202.desc: "La conversión de [bond_subj.GetName] a la fe de la Corona ocurrió cuando la relación cultural entre nosotros ya estaba en su punto más tenso. El clero lo certificó; las ceremonias se llevaron a cabo; el registro oficial es correcto. Pero los informes que nos llegan ahora describen algo que el registro oficial no contempla: objetos devocionales ocultos tras los puestos del mercado, rituales observados en sótanos, un clero de la antigua fe que no se ha dispersado, sino que ha guardado silencio.\n\nParece que la conversión no llegó tan lejos como nos dijeron. La cuestión es hasta dónde estamos dispuestos a llegar para completarla, y cuál será el coste de hacerlo."

 cc_bonds.202.a: "Purga a los fieles ocultos. La conversión debe hacerse realidad."
 cc_bonds.202.a.tooltip: "Una inquisición vigorosa genera influencia religiosa, pero los costes políticos y militares son reales. El deseo de libertad aumenta a medida que la represión deja claro lo que la conversión siempre fue."

 cc_bonds.202.b: "Que la práctica continúe discretamente. No vemos nada; no oímos nada."
 cc_bonds.202.b.tooltip: "La relación cultural se deteriora aún más; la práctica tolerada sin aceptación formal erosiona el vínculo. La bandera de religión forzada persiste; esta situación podría resurgir."

 cc_bonds.202.c: "Formalizar una tolerancia limitada. La antigua fe podrá practicarse en privado."
 cc_bonds.202.c.tooltip: "Un coste real en influencia religiosa, pero la dimensión cultural se recupera y la estabilidad mejora a medida que el súbdito experimenta una concesión significativa de la Corona. El recuerdo se borra."
