l_spanish:
 # ============================================================
 # TYPE A — RULER + CABINET SYNERGY
 # ============================================================
 cc_synergy.1.title: "Hierro y sangre"
 cc_synergy.1.desc: "La disciplina de hierro de nuestro gobernante y la experiencia de nuestro comandante militar han creado algo notable en los consejos de guerra. Ambos han desarrollado una doctrina compartida que está remodelando la forma en que reclutamos y desplegamos nuestras fuerzas."
 cc_synergy.1.a: "Encargar la nueva doctrina militar"
 cc_synergy.1.b: "Ascender al comandante"
 cc_synergy.1.c: "El reino tiene otras prioridades"

 cc_synergy.2.title: "Una corte de letras"
 cc_synergy.2.desc: "La profundidad académica de nuestro gobernante y las ambiciones artísticas de nuestro ministro han atraído una atención inusual de todo el reino. Letrados, eruditos y artistas acuden a nuestra corte, y la capital se está convirtiendo en algo más que una sede de poder: se está convirtiendo en una sede de cultura."
 cc_synergy.2.a: "Establecer la Corte del Saber"
 cc_synergy.2.b: "Profundizar el programa cultural"
 cc_synergy.2.c: "Reconoce el progreso realizado"

 cc_synergy.20.title: "La Corte se Profundiza"
 cc_synergy.20.desc: "El programa cultural que establecimos ha echado raíces. Los eruditos debaten en nuestros pasillos; los artistas compiten por el patronazgo. Esto ya no es simplemente una corte: es una civilización."
 cc_synergy.20.a: "Dejar que florezca"

 cc_synergy.3.title: "La Red del Califato"
 cc_synergy.3.desc: "La maestría de nuestro gobernante en el arte de gobernar y las profundas conexiones de nuestro ministro dentro del mundo islámico se han combinado para producir algo extraordinario: un aparato diplomático que abarca las cortes de los fieles y goza de un respeto genuino."
 cc_synergy.3.a: "Formalizar la corte diplomática"
 cc_synergy.3.b: "Acepta el reconocimiento que conlleva"

 cc_synergy.4.title: "Tradición y Parlamento"
 cc_synergy.4.desc: "Ha surgido una alianza improbable entre los instintos parlamentarios de nuestro gobernante y el profundo respeto de nuestro ministro por las instituciones tradicionales. El resultado es un parlamento que los antiguos órdenes pueden aceptar y un proceso de reforma con el que las nuevas fuerzas pueden convivir."
 cc_synergy.4.a: "Cultivar la armonía parlamentaria"
 cc_synergy.4.b: "Reconoce las contribuciones de ambas partes"

 cc_synergy.5.title: "La mente reformadora"
 cc_synergy.5.desc: "Las convicciones progresistas de nuestro gobernante y la profundidad filosófica de nuestro ministro han creado juntos algo inusual en esta corte: un programa intelectual genuino para la reforma. Las instituciones del reino no están siendo simplemente ajustadas; están siendo reimaginadas."
 cc_synergy.5.a: "Financia el salto institucional"
 cc_synergy.5.b: "Las ideas están listas — comenzar la transición formal"
 cc_synergy.5.b.tt: "Desbloquea la reforma de la Corte de los Filósofos cuando se cumplan las condiciones"

 cc_synergy.6.title: "La síntesis sufí"
 cc_synergy.6.desc: "La profundidad espiritual de nuestro gobernante y la maestría de nuestro ministro en la diplomacia islámica han producido una síntesis notable: una corte donde la sabiduría sufí se encuentra con el cálculo político, y donde la autoridad mística refuerza el poder diplomático."
 cc_synergy.6.a: "Cultivar la tradición sufí"
 cc_synergy.6.b: "Aumentar la autoridad formal del ministro"

 cc_synergy.7.title: "El Mandato del Cielo se aproxima"
 cc_synergy.7.desc: "La comprensión pragmática de nuestro gobernante sobre la gobernanza oriental y la maestría de nuestro ministro en la administración confuciana han comenzado a acercarse a algo notable: una corte que gobierna no solo por la fuerza, sino por la legitimidad que proviene del orden adecuado."
 cc_synergy.7.a: "El Mandato del Aprendizaje: cultívalo"
 cc_synergy.7.b: "Formalizar la tradición burocrática"
 cc_synergy.7.b.tt: "Desbloquea la reforma de la Burocracia del Mandato cuando se cumplan las condiciones"

 cc_synergy.8.title: "La Gran Empresa"
 cc_synergy.8.desc: "La ambición inquieta de nuestro gobernante y la experiencia colonial de nuestro ministro se han encontrado, y lo que planean juntos es más grande de lo que cualquiera de los dos podría haber intentado solo. Las empresas de ultramar están a punto de cambiar en carácter y escala."
 cc_synergy.8.a: "Lanzar el Sindicato Colonial"
 cc_synergy.8.b: "Canalizar la energía hacia ganancias inmediatas"

 cc_synergy.9.title: "Surge la hegemonía de hierro"
 cc_synergy.9.desc: "La combinación de la disciplina implacable de nuestro gobernante, el genio militar de nuestro comandante supremo y la marca militar en nuestra frontera ha atraído la atención de todas las cortes vecinas. No somos simplemente poderosos: somos dominantes de una manera que cambia los cálculos."
 cc_synergy.9.a: "Formalizar la Hegemonía de Hierro"
 cc_synergy.9.b: "Aprovechar la ventaja militar ahora"

 cc_synergy.91.title: "Hegemonía de hierro desbloqueada"
 cc_synergy.91.desc: "Se han cumplido las condiciones para una Hegemonía de Hierro. El aparato militar, el señor de la marca y los estamentos nobles están alineados. Ha llegado el momento de formalizar nuestro dominio."
 cc_synergy.91.a: "Emitir la Carta de Hierro"
 cc_synergy.91.a.tt: "Desbloquea la reforma gubernamental de la Hegemonía de Hierro"

 cc_synergy.10.title: "Tribuno del Pueblo"
 cc_synergy.10.desc: "En esta era revolucionaria, los instintos progresistas de nuestro gobernante y la maestría de nuestro ministro en el parlamento han convergido en algo que no se había visto antes: un gobierno que es genuinamente popular, que cuenta con el afecto tanto de los estamentos como del pueblo llano."
 cc_synergy.10.a: "El Tribuno del Pueblo ha llegado"
 cc_synergy.10.b: "Canalizar la energía popular a través del parlamento"

 # ============================================================
 # TYPE B — CABINET + CABINET SYNERGY
 # ============================================================
 cc_synergy.11.title: "Oriente y Occidente en diálogo"
 cc_synergy.11.desc: "Nuestro ministro innovador y nuestro erudito confuciano han comenzado un intercambio intelectual extraordinario. La tensión entre sus tradiciones está resultando más productiva de lo que cualquiera esperaba: su rivalidad está generando ideas."
 cc_synergy.11.a: "Apoyar la Rivalidad Erudita"
 cc_synergy.11.b: "La capital debería reflejar este florecimiento"

 cc_synergy.12.title: "La hoja del comercio"
 cc_synergy.12.desc: "El comercio y el acero han encontrado su alianza en nuestra corte. Nuestro ministro mercantil y nuestro comandante noble se han dado cuenta de que sus intereses, debidamente alineados, se refuerzan mutuamente: el comercio abre los caminos que los ejércitos protegen, y los ejércitos protegen la riqueza que el comercio genera."
 cc_synergy.12.a: "Formalizar el acuerdo de la Hoja Comercial"
 cc_synergy.12.b: "Reconoce las contribuciones de ambos estamentos"

 cc_synergy.13.title: "Reforma a través del Parlamento"
 cc_synergy.13.desc: "Nuestro ministro innovador y nuestro gestor parlamentario han encontrado su proyecto compartido: no solo una reforma, ni solo una gestión parlamentaria, sino la transformación del parlamento mismo en un vehículo para el cambio progresista."
 cc_synergy.13.a: "Desbloquear la reforma del Compromiso Parlamentario"
 cc_synergy.13.a.tt: "Desbloquea la reforma gubernamental del Compromiso Parlamentario"
 cc_synergy.13.b: "Cultivar la armonía parlamentaria por ahora"

 cc_synergy.14.title: "Integración y Desarrollo"
 cc_synergy.14.desc: "El ministro que integra nuestros nuevos territorios y el ministro que desarrolla nuestras provincias han comparado notas y han descubierto que su trabajo es más complementario que competitivo. Juntos, proponen un enfoque que aceleraría ambos procesos."
 cc_synergy.14.a: "Financia el Oleada de Integración"
 cc_synergy.14.b: "La capital se beneficia directamente"

 cc_synergy.15.title: "Paño y cáliz"
 cc_synergy.15.desc: "Nuestro ministro del clero y nuestro ministro mercantil han llegado a un entendimiento inesperado en el parlamento. Lo sagrado y lo comercial, debidamente reconciliados, no son enemigos, y su alianza está haciendo que el parlamento funcione con más fluidez de lo que nadie esperaba."
 cc_synergy.15.a: "Celebrar el concordato"
 cc_synergy.15.b: "El acuerdo habla por sí solo"

 cc_synergy.16.title: "El consejo de guerra"
 cc_synergy.16.desc: "Nuestro comandante de caballería y nuestro ingeniero de asedio han estado consultando estrechamente, y lo que han producido juntos supera la suma de sus partes. Proponen una doctrina unificada para la campaña actual que haría que nuestras fuerzas fueran drásticamente más efectivas."
 cc_synergy.16.a: "Implementa la doctrina del Consejo de los Señores de la Guerra"
 cc_synergy.16.b: "Obtener ventaja táctica inmediata"

 cc_synergy.17.title: "La Gran Red"
 cc_synergy.17.desc: "La experiencia diplomática de nuestros ministros senior ha alcanzado una masa crítica. Juntos, no se limitan a dirigir la política exterior: están construyendo una arquitectura de relaciones que llevará décadas desmantelar."
 cc_synergy.17.a: "Construir la Red Diplomática"
 cc_synergy.17.b: "Aprovecha la red para una negociación focalizada"

 cc_synergy.18.title: "La Corte Ilustrada"
 cc_synergy.18.desc: "La convergencia de la filosofía humanista y la administración innovadora en nuestra corte ha producido algo raro: un gabinete donde las ideas se ponen a prueba en lugar de afirmarse, donde la reforma fluye de la razón en lugar del interés. Las cortes extranjeras están empezando a notarlo."
 cc_synergy.18.a: "La Corte Ilustrada prosperará"
 cc_synergy.18.b: "Ha llegado el momento de la Corte del Filósofo"
 cc_synergy.18.b.tt: "Desbloquea la reforma gubernamental de la Corte de los Filósofos"

 # ============================================================
 # TYPE C — CABINET + ACTIVE CONTENT SYNERGY
 # ============================================================
 cc_synergy.21.title: "La red en la sombra ha despertado"
 cc_synergy.21.desc: "La maestría diplomática de nuestro ministro en el mundo islámico se ha combinado con la autoridad formal de nuestra corte diplomática, y el resultado es algo que va más allá de la diplomacia ordinaria. Una red de influencia irradia ahora desde nuestra capital que las potencias extranjeras luchan por contrarrestar."
 cc_synergy.21.a: "Activar la Red de Sombras"
 cc_synergy.21.b: "Profundizar los vínculos con el Califato"

 cc_synergy.22.title: "El brazo académico del Mandato"
 cc_synergy.22.desc: "Nuestro mandarín confuciano y el concordato erudito han encontrado su síntesis: una visión del gobierno en la que el aprendizaje y la administración no son vocaciones separadas, sino una única llamada. La corte se está convirtiendo en algo que los antiguos habrían reconocido."
 cc_synergy.22.a: "Mandato de Aprendizaje: dejar que florezca"
 cc_synergy.22.b: "La capital debería beneficiarse directamente"

 cc_synergy.23.title: "El pacto parlamentario"
 cc_synergy.23.desc: "El mediador parlamentario y la Reforma del Compromiso Parlamentario han alcanzado su destino lógico: una carta formal entre los estamentos mercantiles y el parlamento que hace que el proceso legislativo sea más eficiente y legítimo simultáneamente."
 cc_synergy.23.a: "Conceder la Carta Parlamentaria a los burgueses"
 cc_synergy.23.b: "Cultivar la armonía parlamentaria en su lugar"

 cc_synergy.24.title: "La marca y el comisario"
 cc_synergy.24.desc: "La combinación de nuestro administrador militar, la Carta de la Marca y la marca militar activa ha creado algo que tanto los nobles como los generales reconocen como excepcional. La marca no es simplemente un estado tapón: es una proyección de nuestro poder militar, y la corte posee la experiencia para utilizarla como tal."
 cc_synergy.24.a: "La hegemonía de hierro está al alcance"
 cc_synergy.24.b: "Aumentar la pericia en asedios del ministro"

 cc_synergy.25.title: "El pacto de gobierno"
 cc_synergy.25.desc: "El administrador eficiente y la Reforma del Gobernador se han encontrado, y el gobierno provincial está funcionando mejor de lo que nadie esperaba. Lo que comenzó como un arreglo administrativo se está convirtiendo en un modelo de cómo gobernar un reino extenso sin perder la coherencia."
 cc_synergy.25.a: "El pacto de gobierno — formalizarlo"
 cc_synergy.25.b: "Un dividendo más corto pero inmediato"
 cc_synergy.25.b.tt: "Otorga un modificador más corto y reduce los costes de eliminación de burocracia"

 cc_synergy.26.title: "El pacto marítimo"
 cc_synergy.26.desc: "La experiencia marítima de nuestro ministro y el poder comercial de nuestras compañías privilegiadas han alcanzado una alineación productiva. Los burgueses están invirtiendo, los marineros están navegando y el resultado es una red comercial que comienza a definir el lugar de nuestro reino en el mundo."
 cc_synergy.26.a: "El sindicato colonial madura"
 cc_synergy.26.b: "Obtener las ganancias comerciales inmediatas"
