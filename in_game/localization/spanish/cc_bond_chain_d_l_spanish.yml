l_spanish:
 # === cc_bonds.130 — A Brilliant Student ===
 cc_bonds.130.title: "Un estudiante brillante"
 cc_bonds.130.desc: "Un erudito de talento notable ha surgido de [bond_subj.GetName]: una mente joven cuyo enfoque parece ser la filosofía, la gobernanza y la historia de los pueblos. Por su reputación y por el puñado de obras cortas que ya circulan, se trata de alguien cuyas ideas importarán. La pregunta a la que nos enfrentamos es: ¿qué tipo de ideas, y al servicio de quién? Si se deja a su suerte, escribirá lo que produzca su patria. Traído a nuestra corte, escribirá lo que nuestra corte moldee. Puesto a trabajar como propagandista, escribirá lo que necesitemos, y todo el mundo lo sabrá."
 cc_bonds.130.a: "Tráigalo a nuestra corte. Que aprenda sobre el imperio desde adentro."
 cc_bonds.130.b: "Financia su educación en su tierra natal y deja que publique libremente. Deja que sea quien es."
 cc_bonds.130.c: "Ofrecerle empleo. Su talento debe servir a los propósitos de la Corona."
 cc_bonds.130.d: "Es un erudito en un estado vasallo. No es necesario que nos involucremos."

 # === cc_bonds.131 — The Scholar's First Work ===
 cc_bonds.131.title: "La primera obra del erudito"
 cc_bonds.131.desc_court: "El erudito de [bond_subj.GetName] ha completado una obra importante: pulida, segura y profundamente moldeada por sus años en nuestra corte. El argumento central es aquel que enmarca la historia del sujeto como una preparación para el imperio del que ahora forma parte: sus tradiciones como precursoras de nuestras instituciones, sus logros como tributarios de una historia cultural más amplia. Es, al estilo de toda historiografía imperial bien elaborada, tan halagadora como ligeramente incómoda de leer."
 cc_bonds.131.desc_home: "El erudito de [bond_subj.GetName] ha publicado una obra trascendental, y no es lo que habríamos predicho. Es un relato meticuloso y bellamente escrito de la historia cultural del sujeto: su lengua, sus tradiciones, su herencia filosófica distintiva. No ataca la relación de vasallaje. No aboga por nada. Simplemente insiste, con considerable elegancia, en que hay algo aquí que merece ser descrito, y que la descripción es su propio argumento."
 cc_bonds.131.desc_prop: "El propagandista de [bond_subj.GetName] ha entregado su obra según lo previsto. Argumenta, como le pedimos, que la asociación [overlord.GetNameWithNoTooltip]-[bond_subj.GetNameWithNoTooltip] se basa en el beneficio mutuo, que el gobierno de [overlord.GetName] ha enriquecido a [bond_subj.GetNameWithNoTooltip] y que el pueblo [bond_subj_culture.GetName] comparte un destino común. La obra ha sido distribuida. Ha sido leída. Entre los pocos instruidos en [bond_subj.GetNameWithNoTooltip], se ha discutido principalmente con el tono que se usa al hablar de algo que resulta ligeramente vergonzoso."
 cc_bonds.131.desc_free: "El erudito de [bond_subj.GetName] —aquel al que ni patrocinamos ni reclutamos— ha publicado una obra que ha circulado más allá del territorio. Su tono es ambivalente: no celebra la relación de vasallaje ni la condena. Describe lo que hay. Su efecto, donde ha sido leída, es modesto: una pequeña impresión positiva de la cultura intelectual del sujeto, y nada más."
 cc_bonds.131.a_use: "Utilizarlo como texto oficial. Distribuirlo a través de los canales de la Corona."
 cc_bonds.131.a_standalone: "Dejar que se mantenga por sí solo. Una obra como esta gana más respeto sin la mano de la Corona sobre ella."
 cc_bonds.131.b_sponsor: "Patrocina un volumen complementario que sitúe esta obra dentro de la historia más amplia del imperio."
 cc_bonds.131.b_allow: "Dejar que permanezca. Esta es su historia y no amenaza la nuestra."
 cc_bonds.131.b_suppress: "Suprimirlo. Este tipo de asertividad cultural tiene consecuencias."
 cc_bonds.131.c_more: "Encargar más. El trabajo está cumpliendo la función para la que fue diseñado."
 cc_bonds.131.c_distance: "Aleja la Corona de esto. La obra no nos ha servido de mucho."
 cc_bonds.131.d_note: "Anotado. El súbdito produce mentes interesantes."

 # === cc_bonds.132 — The Scholar's Legacy ===
 cc_bonds.132.title: "El legado del erudito"
 cc_bonds.132.desc_aligned: "El erudito de [bond_subj.GetName] ha muerto, como mueren los eruditos, habiendo producido más de lo que pretendía. Sus ideas han permeado la clase educada del territorio durante una generación. Lo que es notable, desde nuestra perspectiva, es cómo han sido recibidas: como la obra de alguien que comprendió para qué servía el imperio y eligió pertenecer a él. Sus alumnos lo citan en defensa de la relación de vasallaje. Se ha convertido, póstumamente, en uno de los argumentos más persuasivos a favor de la lealtad que el territorio haya producido jamás."
 cc_bonds.132.desc_contested: "El erudito de [bond_subj.GetName] ha muerto habiendo escrito cosas que le sobrevivirán por generaciones. Ahora existe en el territorio una escuela de pensamiento que parte de su premisa: que la cultura del sujeto es distinta, coherente y digna de ser preservada. Esto tiene dos caras. Aquellos estudiantes que también creen en el imperio argumentan que ambas cosas son compatibles; que se puede ser profundamente uno mismo y, al mismo tiempo, leal. Quienes no creen en el imperio encuentran en esos mismos textos su justificación más elocuente."
 cc_bonds.132.desc_suppressed: "El erudito que suprimimos lleva años muerto, y su obra se lee ahora más ampliamente que cuando la prohibimos. Circulan copias clandestinas. Los estudiantes las copian a mano. Las ideas que juzgamos demasiado peligrosas para permitirlas se han convertido, precisamente debido a ese juicio, en las ideas más emocionantes del territorio. La supresión no terminó con el argumento; le dio al argumento un martirio."
 cc_bonds.132.desc_default: "Ha pasado una generación desde que el erudito de [bond_subj.GetName] produjo la obra con la que interactuamos — o decidimos no interactuar. El paisaje intelectual del territorio ha cambiado de formas que son difíciles de atribuir a una sola causa. La contribución del erudito, fuera cual fuese, ha sido absorbida por la cultura general y ya no puede separarse de ella."
 cc_bonds.132.a: "Su legado sirve bien al imperio. Lo reconoceremos formalmente."
 cc_bonds.132.b_embrace: "Su identidad cultural y su lealtad hacia nosotros no son contradictorias. Acepte ambas."
 cc_bonds.132.b_neutral: "Las ideas han echado raíces. Dejaremos que crezcan como quieran."
 cc_bonds.132.c: "La represión ha producido lo contrario de lo que pretendíamos."
 cc_bonds.132.d: "El capítulo del erudito se ha cerrado."

 cc_bonds.132.desc_counter: "El erudito pasó las últimas décadas de [scholar_char.GetHerHis] carrera trabajando en circunstancias que nunca se resolvieron del todo. Empleado como propagandista, tratado con distancia política cuando el trabajo se volvía demasiado transparente; la situación produjo algo que la Corona no esperaba. Al negarnos a respaldar plenamente lo que [scholar_char.GetSheHe] había escrito, le dimos espacio para ser algo más que propaganda. Se leyó de esa manera. El territorio recuerda a [scholar_char.GetName] no como una contratación de la corte, sino como una figura complicada y con principios. El legado es más matizado —y más duradero— de lo que habría sido un trabajo por encargo."

 cc_bonds.132.e: "Reconoce la distancia principled del erudito. Hizo que el trabajo de [scholar_char.GetHerHis] fuera honesto."
 cc_bonds.132.e.tooltip: "La decisión del señor supremo de distanciarse de la propaganda otorgó al trabajo del erudito una autenticidad que la glorificación encargada no podría lograr. Tanto el Cul como el Per mejoran, y se crea una crónica duradera."

 # === Works of art created by the brilliant scholar chain ===
 cc_scholar_early_notes: "Primeras notas de una corte distante"
 cc_scholar_early_notes_desc: "Una colección de observaciones y reflexiones producidas en el periodo formativo de una extraordinaria carrera académica."

 cc_scholar_imperial_chronicle: "Una crónica imperial"
 cc_scholar_imperial_chronicle_desc: "Un relato histórico trascendental que presenta el pasado del súbdito como una preparación para el imperio al que ahora pertenece: erudito, ambicioso y cuidadosamente situado."

 cc_scholar_homeland_chronicle: "Una crónica de la patria"
 cc_scholar_homeland_chronicle_desc: "Un relato meticuloso de la historia cultural, las tradiciones y el legado filosófico distintivo del territorio sujeto, insistiendo, con considerable elegancia, en que hay algo aquí que merece ser preservado."

 cc_scholar_propaganda_work: "Un tratado sobre el destino compartido"
 cc_scholar_propaganda_work_desc: "Una obra encargada que sostiene que la asociación señor-vasallo se basa en el beneficio mutuo y un futuro común. Leída con cortés escepticismo en el territorio que describe."

 cc_scholar_legacy_work: "El legado del erudito"
 cc_scholar_legacy_work_desc: "La obra cumbre de una carrera distinguida: una síntesis que ya ha comenzado a dar forma a la vida intelectual de una generación."

 cc_scholar_forbidden_work: "El tratado suprimido"
 cc_scholar_forbidden_work_desc: "Una obra que circuló en copias clandestinas mucho después de su prohibición formal. La supresión le otorgó un martirio que no habría podido ganar por sí sola."
