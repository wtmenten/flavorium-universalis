l_spanish:
 # ============================================================
 # Colonial Divan Events — Pillar 07
 # ============================================================

 # ============================================================
 # Section A — Colonial Posting Events (cc_posting namespace)
 # ============================================================

 # --- cc_posting.1 — The Governor's Dispatch ---
 cc_posting.1.title: "El despacho del gobernador"
 cc_posting.1.desc: "Ha llegado una carta sellada de [minister.GetName], enviada desde el extranjero donde gobierna [colony.GetName]. El relato de [minister.GetHerHis|c] sobre las condiciones en la colonia es moderado y profesional, pero la corona debe decidir ahora cómo responder a las necesidades que [minister.GetHeShe] describe."

 cc_posting.1.a: "Invertir en el futuro de la colonia."
 cc_posting.1.a.tooltip: "El dinero fluye hacia [colony.GetName]. La inversión acelerará la prosperidad colonial y mejorará la relación económica: una apuesta a largo plazo por la expansión del imperio."

 cc_posting.1.b: "El despacho es satisfactorio; confírmelo."
 cc_posting.1.b.tooltip: "Los cuidadosos informes de [minister.GetName] hablan bien de su servicio. Unas palabras de reconocimiento real agudizarán su perspicacia diplomática[minister.GetHerHis][minister.GetHerHis]."

 cc_posting.1.c: "Exigir que la colonia envíe más tributo de inmediato."
 cc_posting.1.c.tooltip: "Las necesidades del imperio tienen prioridad. Los ingresos fluyen hacia la metrópoli, pero los administradores coloniales resentirán la extracción y el vínculo con [colony.GetName] se debilitará."

 # --- cc_posting.2 — Corruption in the Colony ---
 cc_posting.2.title: "Corrupción en la colonia"
 cc_posting.2.desc: "[minister.GetName] ha descubierto un patrón de irregularidades financieras entre los funcionarios coloniales de [colony.GetName]. Fondos destinados a infraestructuras han sido desviados; las cuentas no cuadran. [minister.GetHeShe] escribe solicitando orientación."

 cc_posting.2.a: "Erradicarlo: destituir a los funcionarios corruptos."
 cc_posting.2.a.tooltip: "Una respuesta firme restablece el orden. Un [minister.GetName] con experiencia administrativa transformará la crisis en una reforma; sin ella, la limpieza seguirá costando dinero al tesoro."

 cc_posting.2.b: "Extraer una tajada personal e ignorar el problema."
 cc_posting.2.b.tooltip: "La corrupción se comparte discretamente en lugar de eliminarse. El oro regresa a la corona, pero las finanzas de la colonia se deterioran aún más, y el carácter de [minister.GetName] podría quedar permanentemente marcado por esta elección."

 cc_posting.2.c: "Informar los hechos; no interferir."
 cc_posting.2.c.tooltip: "Se presenta un informe formal y no se hace nada. La inacción cuesta prestigio e inquieta a la corte, pero al menos no se inflige más daño."

 # --- cc_posting.3 — A Native Uprising ---
 cc_posting.3.title: "Un levantamiento nativo"
 cc_posting.3.desc: "Las comunidades indígenas del territorio alrededor de [colony.GetName] se han alzado en resistencia armada. [minister.GetName] escribe con una petición urgente: la corona debe decidir cómo responder antes de que la situación escale aún más."

 cc_posting.3.a: "Enviar fuerzas coloniales: reprimir el levantamiento."
 cc_posting.3.a.tooltip: "Se han enviado tropas. El levantamiento es sofocado por la fuerza, pero la relación de la población colonial con la corona queda permanentemente dañada, y la leva de hombres se siente en la metrópoli."

 cc_posting.3.b: "Negociar un acuerdo."
 cc_posting.3.b.tooltip: "El oro y las concesiones compran una paz inestable. La solución diplomática cuesta al tesoro pero otorga prestigio, y [minister.GetName] emerge como un negociador más hábil."

 cc_posting.3.c: "Comprometerse a una pacificación militar total."
 cc_posting.3.c.tooltip: "Se lanza una campaña militar exhaustiva para acabar con la resistencia permanentemente. El coste en mano de obra y estabilidad es severo, pero [minister.GetName] se fortalece con la experiencia."

 # --- cc_posting.4 — Fever in the Colony ---
 cc_posting.4.title: "Fiebre en la colonia"
 cc_posting.4.desc: "Llega una carta con noticias sombrías: la fiebre tropical ha azotado el asentamiento donde está destinado [minister.GetName]. [minister.GetHeShe] está enfermo, el personal está mermado y la administración colonial se ha detenido casi por completo. [minister.GetName] aguarda la decisión de la corona."

 cc_posting.4.a: "Ordenar a [minister.GetName] que supere la enfermedad."
 cc_posting.4.a.tooltip: "[minister.GetName] permanece en su puesto a pesar de la fiebre. Su dedicación se gana la admiración real, pero la enfermedad pasa factura a sus capacidades administrativas y diplomáticas[minister.GetHerHis|c][minister.GetHerHis]."

 cc_posting.4.b: "Ordenar descanso y una carga de trabajo reducida."
 cc_posting.4.b.tooltip: "[minister.GetName] queda relevado de las tareas más pesadas hasta su recuperación. La administración colonial flaquea y la estabilidad sufre, pero el ministro se libra de lo peor."

 # ============================================================
 # Section B — Charter Company Events (cc_colonial namespace)
 # ============================================================

 # --- cc_colonial.1 — The Company's Accounts ---
 cc_colonial.1.title: "Las cuentas de la compañía"

 cc_colonial.1.a: "Aprobar las devoluciones en su totalidad."
 cc_colonial.1.a.tooltip: "Las conexiones mercantiles de [minister.GetName] han convertido las cuentas en una ganancia inesperada. La compañía informa de sus beneficios totales a la corona: una suma considerable."

 cc_colonial.1.b: "Ordenar primero una auditoría exhaustiva."
 cc_colonial.1.b.tooltip: "La inspección metódica de [minister.GetName] detecta irregularidades antes de que se conviertan en escándalos. La auditoría arroja un rendimiento menor pero impecablemente limpio, y la diligencia del ministro es notada en la corte."

 cc_colonial.1.c: "Realizar una revisión estándar."
 cc_colonial.1.c.tooltip: "Las cuentas se revisan sin contratiempos. La diligencia del consejo en la supervisión de los asuntos de la compañía otorga un prestigio modesto: un respaldo silencioso a una gobernanza sólida."

 # --- cc_colonial.2 — A Monopoly Dispute ---
 cc_colonial.2.title: "Una disputa de monopolio"
 cc_colonial.2.desc: "[minister.GetName] ha presentado ante el consejo una petición formal: el estamento burgués busca ampliar los derechos comerciales para la compañía privilegiada de [colony.GetName]. Los nobles objetan, ruidosamente, que esto socavaría sus propios intereses comerciales. El gobernante debe decidir quién prevalece."

 cc_colonial.2.a: "Conceder a la compañía un monopolio comercial."
 cc_colonial.2.a.tooltip: "Se conceden derechos exclusivos sobre los flujos comerciales de [colony.GetName] a la compañía privilegiada. Una parte de los ingresos mercantiles se desvía a la Corona durante los próximos quince a veinticinco años. El estamento burgués queda satisfecho; la nobleza está discretamente furiosa."

 cc_colonial.2.b: "Restringir la expansión propuesta."
 cc_colonial.2.b.tooltip: "Los estamentos nobles prevalecen. Sus intereses comerciales quedan protegidos y el prestigio de la corona se ve realzado por esta muestra de moderación real; pero el estamento burgués no olvidará el desaire."

 cc_colonial.2.c: "Medie un compromiso de la corona."
 cc_colonial.2.c.tooltip: "[minister.GetName] intermedia en un camino medio. Ambos estamentos reciben concesiones modestas, el oro fluye a través de canales comerciales y la reputación del ministro como negociador hábil crece."

 # --- cc_colonial.3 — The Governor's Letter ---
 cc_colonial.3.title: "La carta del gobernador"
 cc_colonial.3.desc: "Ha llegado una carta formal de [minister.GetName], destinado en [colony.GetName] como gobernador. [minister.GetHeShe] escribe con una petición clara: la administración colonial requiere apoyo adicional de la corona. La forma que tome ese apoyo es decisión de la corona."

 cc_colonial.3.a: "Enviar refuerzos de tropas."
 cc_colonial.3.a.tooltip: "Se envían soldados a [colony.GetName]. La relación militar entre la corona y la colonia se fortalece, y [minister.GetName] adquiere experiencia de mando directa."

 cc_colonial.3.b: "Enviar apoyo financiero."
 cc_colonial.3.b.tooltip: "El oro de la Corona fluye hacia la tesorería de [colony.GetName]. Las bases económicas de la colonia se fortalecen y [minister.GetName] demuestra la competencia administrativa que requiere el cargo."

 cc_colonial.3.c: "Rechazar la solicitud: la corona no puede permitirse los recursos."
 cc_colonial.3.c.tooltip: "La petición del gobernador es rechazada. El prestigio de [minister.GetName] en la corte disminuye debido a la evidente falta de confianza real, y la administración colonial se vuelve más suspicaz ante las intenciones de la corona."

 # ============================================================
 # Section C — Decolonization Crisis (cc_colonial namespace)
 # ============================================================

 # --- cc_colonial.10 — The Colonial Petition ---
 cc_colonial.10.title: "La Petición Colonial"
 cc_colonial.10.desc: "[minister.GetName] ha presentado una petición formal ante el consejo en nombre de [colony.GetName]: la población colonial exige un mayor autogobierno. La retórica revolucionaria del ministro ha galvanizado el movimiento. La forma en que responda la corona definirá la relación del imperio con sus territorios de ultramar durante una generación."

 cc_colonial.10.a: "Conceder mayor autonomía — iniciar negociaciones."
 cc_colonial.10.a.tooltip: "La corona reconoce la legitimidad de la petición. Se sacrifica la estabilidad en favor del sentido de Estado: la relación política con [colony.GetName] mejora y posteriormente se establecerán acuerdos formales."

 cc_colonial.10.b: "Rechazar la petición rotundamente."
 cc_colonial.10.b.tooltip: "La corona se niega a negociar con los agitadores coloniales. Se mantiene el prestigio, pero la respuesta de [minister.GetName] a este rechazo es impredecible y la situación política en [colony.GetName] sigue siendo volátil."

 cc_colonial.10.c: "Eliminar a [minister.GetName] del gabinete."
 cc_colonial.10.c.tooltip: "La influencia del agitador se corta de raíz. [minister.GetName] es destituido, la petición pierde a su defensor en la corte y la crisis queda contenida, pero la reputación de tolerancia de la corona se ve afectada."

 # --- cc_colonial.11 — The Defection ---
 cc_colonial.11.title: "La Deserción"
 cc_colonial.11.desc: "Llega al palacio la noticia de que [minister.GetName] ha desaparecido de la corte. Los informes de [colony.GetName] confirman lo peor: el ministro se ha unido al movimiento de independencia colonial, aportando conocimientos cortesanos y conexiones reales a la causa independentista. El daño debe ser contenido."

 cc_colonial.11.a: "Dejar ir a [minister.GetName]: contener las consecuencias."
 cc_colonial.11.a.tooltip: "La deserción es un golpe al prestigio de la corona. Las relaciones diplomáticas se deterioran en todo el imperio, ya que la partida del ministro señala vulnerabilidad, pero la causa colonial gana un impulso que llevará años revertir."

 cc_colonial.11.b: "Enviar agentes para arrestar a [minister.GetName] antes de que crucen la frontera."
 cc_colonial.11.b.tooltip: "El ministro es capturado antes de llegar a la colonia. La deserción se evita, pero la respuesta contundente desestabiliza la corte y devasta la relación política con [colony.GetName]."

 # --- cc_colonial.12 — The Compromise ---
 cc_colonial.12.title: "El compromiso"
 cc_colonial.12.desc: "Meses después de la promesa de la corona de conceder una mayor autonomía, los acuerdos formales deben quedar ahora por escrito. El liderazgo colonial de [colony.GetName] espera el compromiso de la corona —o su retirada de dicho compromiso—."

 cc_colonial.12.a: "Formalizar el pacto de autonomía."
 cc_colonial.12.a.tooltip: "La corona cumple su palabra. [colony.GetName] recibe el reconocimiento formal de su autonomía ampliada. La colonia prospera bajo el nuevo acuerdo y los vínculos políticos y culturales con la metrópoli se fortalecen en lugar de romperse."

 cc_colonial.12.b: "Retirar la oferta: la corona no puede ceder tanto."
 cc_colonial.12.b.tooltip: "La promesa se ha roto. El prestigio colapsa cuando el liderazgo colonial se da cuenta de que la promesa estaba vacía, y la relación política con [colony.GetName] sufre un golpe del cual podría no recuperarse."

 # ============================================================
 # Colonial Divan Modifier Names
 # ============================================================
 STATIC_MODIFIER_NAME_cc_col_colonial_investment: "Inversión colonial"
 cc_col_colonial_investment: "Inversión colonial"
 cc_col_colonial_investment_desc: "Los recursos de la Corona se han canalizado hacia el desarrollo de esta colonia. La prosperidad crece y la eficiencia comercial mejora bajo la inversión directa del gobierno imperial."

 STATIC_MODIFIER_NAME_cc_col_colonial_autonomy: "Pacto de autonomía colonial"
 cc_col_colonial_autonomy: "Pacto de autonomía colonial"
 cc_col_colonial_autonomy_desc: "Se ha concedido a esta colonia el reconocimiento formal de su autogobierno ampliado. La prosperidad y la actividad comercial florecen bajo este acuerdo, y la relación con la metrópoli se fortalece gracias a ello."

 STATIC_MODIFIER_NAME_cc_col_defection_fallout: "Secuelas de la deserción colonial"
 cc_col_defection_fallout: "Secuelas de la deserción colonial"
 cc_col_defection_fallout_desc: "La deserción de un ministro del gabinete hacia el movimiento de independencia colonial ha dañado la posición de la corona. La lealtad de los súbditos se tambalea y la reputación diplomática sufre en todo el imperio."



# Colonial buildings

 colonial_migration_center: "Centro de migración"
 colonial_migration_center_desc: "Una oficina colonial para registrar a los recién llegados, asignar hogares y dirigir a los colonos hacia las tierras y el trabajo disponibles."
 colonial_migration_center_maintenance: "Mantenimiento del centro de migración"
 colonial_migration_center_maintenance_desc: "Los centros de migración requieren registros, libros, telas, monedas y herramientas para organizar las llegadas y las concesiones de asentamiento."
 cc_colonial.1.desc: "[minister.GetName] ha pasado los últimos meses analizando los libros de contabilidad de [colony.GetName]. [minister.GetHeShe] presenta ahora las cuentas al consejo. El panorama es complejo: beneficios, pasivos y algunas cifras que no cuadran del todo."
