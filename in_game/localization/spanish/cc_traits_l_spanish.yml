l_spanish:
 learned_counselor: "Consejero erudito"
 desc_learned_counselor: "Este miembro del gabinete ha dedicado toda una vida al estudio y las letras. Bajo su guía, la alfabetización se extiende por todo el reino, ya que se asegura de que la educación se tome en serio en todos los niveles de gobierno."
 law_reformer: "Reformador legal"
 desc_law_reformer: "Una mente legal aguda y un apetito por la reforma han hecho que este asesor sea invaluable para agilizar el proceso legislativo. Los estatutos contradictorios y las costumbres arcaicas caen ante su pluma cuidadosa."
 law_reformer_die_desc: "[CHARACTER.GetName] ha muerto, y muchos abogados lamentan la pérdida de la mente jurídica más aguda contra la que jamás hayan argumentado."
 loyal_steward: "Mayordomo Leal"
 desc_loyal_steward: "Pocas cosas mantienen unido un imperio como la confianza. Este asesor ha cultivado relaciones personales profundas con los gobernantes de nuestros reinos vasallos, recordándoles que la lealtad es recíproca."
 loyal_steward_die_desc: "[CHARACTER.GetName] se ha ido, y el hilo de confianza que [CHARACTER.GetSheHe] tejió entre nosotros y nuestros súbditos se ha vuelto un poco más delgado."
 tactical_advisor: "Asesor táctico"
 desc_tactical_advisor: "Veterano condecorado y estudioso de la guerra, este asesor traduce la experiencia ganada en el campo de batalla en una doctrina que afila el filo de cada regimiento a nuestro servicio."
 tactical_advisor_die_desc: "[CHARACTER.GetName] ha quedado en silencio. Los manuales que [CHARACTER.GetSheHe] escribió sobrevivirán a [CHARACTER.GetHerHim], pero un maestro de tácticas vivo vale más que diez volúmenes impresos."
 ecumenist: "Ecumenista"
 desc_ecumenist: "Criado entre diferentes fes o simplemente bendecido con la paciencia de un filósofo, este asesor ve la humanidad compartida donde otros ven herejía. Las minorías religiosas fares mejor cuando su consejo moldea la política."
 ecumenist_die_desc: "[CHARACTER.GetName] ha dejado este mundo. Los puentes silenciosos que [CHARACTER.GetSheHe] construyó entre las fes podrían sobrevivir al recuerdo de quién los construyó."
 colonial_planner: "Planificador colonial"
 desc_colonial_planner: "Mapas, vientos alisios y los sueños de los colonos: este asesor vive y respira la expansión colonial. Bajo su dirección, las migraciones fluyen con mayor eficiencia hacia las fronteras de nuestras ambiciones transoceánicas."
 prosperity_planner: "Planificador de la prosperidad"
 desc_prosperity_planner: "Este asesor tiene instinto para identificar y cultivar las condiciones que permiten que las comunidades prosperen. La prosperidad no ocurre simplemente: se planifica, y nadie la planifica mejor que él."
 prosperity_planner_die_desc: "[CHARACTER.GetName] ha fallecido. Los campos que ayudó a cultivar seguirán floreciendo, pero una mano guía ha abandonado el arado."
 iron_disciplinarian: "Disciplinador de hierro"
 desc_iron_disciplinarian: "Este asesor gobierna a través del orden, la jerarquía y la obediencia. El reino funciona eficientemente bajo su vigilancia, pero la disciplina resulta irritante. La nobleza se inquieta y las cortes extranjeras susurran sobre la tiranía."
 iron_disciplinarian_die_desc: "[CHARACTER.GetName] ha muerto. La máquina que [CHARACTER.GetSheHe] construyó sigue moliendo, pero los ingenieros que temían a [CHARACTER.GetHerHim] ya están aflojando los pernos."
 shadow_counselor: "Consejero en la sombra"
 desc_shadow_counselor: "Este asesor trabaja a través de informantes y presiones discretas en lugar de canales oficiales. Las potencias extranjeras negocian con cuidado, sabiendo que este individuo está escuchando. Pero ningún estamento confía en un manipulador, y los diplomáticos mantienen su distancia."
 shadow_counselor_die_desc: "[CHARACTER.GetName] ha muerto, o al menos eso afirman los informes oficiales. Quienes [CHARACTER.GetHerHim] conocieron bien se reservan su juicio."
 progressive_reformist: "Reformista progresista"
 desc_progressive_reformist: "Este asesor está convencido de que las viejas costumbres deben dar paso a las nuevas. La alfabetización aumenta, las leyes se modernizan y el impulso innovador se extiende, pero cada reforma es también una perturbación que inquieta al viejo orden."
 progressive_reformist_die_desc: "[CHARACTER.GetName] ha muerto con la mitad de las reformas aún sin terminar. Si eso es una tragedia o una misericordia depende de a quién se le pregunte."
 war_hawk: "Halcón de Guerra"
 desc_war_hawk: "Este asesor ansía la guerra. Bajo su influencia, la excelencia militar alcanza nuevas cumbres, al igual que el apetito por el conflicto. Los enemigos toman nota de un reino que no puede descansar, y se forman coaliciones contra él."
 war_hawk_die_desc: "[CHARACTER.GetName] ha muerto, y los oficiales a los que [CHARACTER.GetSheHe] entrenó exhalan lentamente por primera vez en años."
 zealous_inquisitor: "Inquisidor celoso"
 desc_zealous_inquisitor: "Un fuego arde en el alma de este asesor, y consume la duda, la herejía y la vacilación con igual hambre. En un reino de una sola fe, esto es un don. En un reino de muchas, es una catástrofe esperando a suceder."
 zealous_inquisitor_die_desc: "[CHARACTER.GetName] ha pasado a mejor vida y ahora tendrá que responder a algunas preguntas difíciles por [CHARACTER.GetHerHis] cuenta."
 fumbling_integrator: "Integrador torpe"
 desc_fumbling_integrator: "Este asesor tiene buenas intenciones, pero simplemente está superado por las circunstancias. Papeleo mal archivado, edictos mal redactados y delegaciones dejadas esperando; bajo su cuidado, la incorporación de nuevas tierras al reino avanza a un paso dolorosamente lento."
 fumbling_integrator_die_desc: "[CHARACTER.GetName] ha muerto. Tres departamentos tardaron una semana en confirmar el papeleo."
 able_integrator: "Integrador Capaz"
 desc_able_integrator: "Administrador capaz y versátil, este asesor gestiona la compleja tarea de integrar nuevos territorios con una competencia silenciosa. No es brillante, pero es fiable, y la fiabilidad suele valer más."
 able_integrator_die_desc: "[CHARACTER.GetName] ha muerto. Los archivos están en orden, las transiciones programadas y el trabajo, como siempre, continuará."
 master_integrator: "Maestro Integrador"
 desc_master_integrator: "Este asesor es sumamente capaz en asuntos administrativos, militares y diplomáticos. En sus manos, la incorporación de nuevas tierras avanza rápida y fluidamente."
 master_integrator_die_desc: "[CHARACTER.GetName] ha muerto, y los sucesores de tres departamentos están descubriendo exactamente cuánto había estado haciendo una sola persona."
 iron_integrator: "Integrador de hierro"
 desc_iron_integrator: "La integración es normalmente un arte lento y cauteloso. Este asesor la trata como una campaña de conquista: rápida, implacable y total. El reino se cohesiona con una velocidad inusual, pero los súbditos integrados rara vez se sienten consultados, y los estamentos hacen saber su descontento."
 iron_integrator_die_desc: "[CHARACTER.GetName] ha muerto. Las provincias que absorbió están tranquilas, por ahora."
 provocateur: "Provocador"
 desc_provocateur: "Manejando las relaciones exteriores con la gracia de una bala de cañón, este asesor logra la notable hazaña de antagonizar a vecinos que no tenían ninguna disputa particular con nosotros anteriormente."
 provocateur_die_desc: "[CHARACTER.GetName] ha muerto. Varios embajadores han enviado flores. El sentimiento es genuino."
 tactful_envoy: "Enviado tactful"
 desc_tactful_envoy: "Un diplomático que comprende que el silencio es un arma y que el momento oportuno lo es todo; este asesor suaviza las asperezas de nuestras relaciones exteriores sin grandes gestos ni promesas que no podamos cumplir."
 master_statesman: "Maestro Estadista"
 desc_master_statesman: "Este asesor es un negociador experto capaz de dejar satisfechas a las cortes rivales incluso cuando han cedido. Bajo su guía, el resentimiento que otras naciones podrían dirigir hacia nosotros tiende a desvanecerse."
 dove_of_court: "Paloma de la Corte"
 desc_dove_of_court: "Este asesor ha elevado el arte de no hacer enemigos a una filosofía de gobierno. El antagonismo extranjero se desvanece y las reputaciones mejoran, pero también lo hace cierta blandura en nuestros consejos, una creciente preferencia por la conciliación sobre la ventaja que los rivales más astutos no tardarán en explotar."
 dove_of_court_die_desc: "[CHARACTER.GetName] ha muerto. El reino que [CHARACTER.GetSheHe] deja atrás es apreciado y quizás demasiado acostumbrado a la comodidad."
 timid_landlubber: "Tímido marino"
 desc_timid_landlubber: "Este asesor mira un mapa del mar y solo ve formas de ahogarse. Cada expedición requiere más garantías que provisiones los barcos, y el ritmo de nuestra exploración lo refleja."
 timid_landlubber_die_desc: "[CHARACTER.GetName] ha muerto, sin haber puesto un pie en un barco ni una sola vez, y orgulloso de ello."
 capable_explorer: "Explorador capaz"
 desc_capable_explorer: "Una mano competente y fiable para apoyar expediciones, este asesor asegura que los barcos partan a tiempo, que los suministros sean adecuados y que los despachos regresen prontamente. No es un visionario, pero la exploración prospera tanto gracias a una administración competente como a capitanes audaces."
 capable_explorer_die_desc: "[CHARACTER.GetName] ha muerto. Sus libros de contabilidad eran impecables y las flotas que suministró todavía están en el mar[CHARACTER.GetHerHis][CHARACTER.GetSheHe]."
 legendary_navigator: "Navegante legendario"
 desc_legendary_navigator: "Este asesor parece entender el mar de la misma manera que otros entienden su lengua materna. Bajo su dirección, nuestros exploradores encuentran vientos favorables donde otros encuentran tormentas, y las fronteras del mundo conocido se reducen con cada año que pasa."
 legendary_navigator_die_desc: "[CHARACTER.GetName] ha muerto, y los cartógrafos ya están discutiendo sobre cómo nombrar los accidentes geográficos que [CHARACTER.GetSheHe] ayudó a descubrir."
 restless_pioneer: "Pionero Inquieto"
 desc_restless_pioneer: "Este asesor no puede mirar un espacio en blanco en un mapa sin querer llenarlo. La exploración se acelera y los colonos fluyen hacia nuevas tierras, pero la ambición colonial nunca calla, y las potencias del mundo empiezan a observarnos con recelo."
 restless_pioneer_die_desc: "[CHARACTER.GetName] ha muerto en algún lugar en los confines del mundo conocido, que es exactamente donde [CHARACTER.GetSheHe] habría querido estar."
 learned_counselor_die_desc: "[CHARACTER.GetName] ha partido de este mundo, y las bibliotecas que [CHARACTER.GetSheHe] llenó permanecerán como [CHARACTER.GetHerHis] legado mucho después de que la tinta de estas páginas se desvanezca."
 colonial_planner_die_desc: "[CHARACTER.GetName] ha muerto, y algún cabo sin nombre en una costa inexplorada jamás llevará [CHARACTER.GetHerHis] nombre."
 tactful_envoy_die_desc: "[CHARACTER.GetName] has died. [CHARACTER.GetHerHis] absence will be felt in a dozen small courtesies that we no longer know how to perform."
 master_statesman_die_desc: "[CHARACTER.GetName] ha muerto, y las cortes extranjeras que lo/la admiraban están enviando cartas de sinceras condolencias a [CHARACTER.GetHerHim]."
