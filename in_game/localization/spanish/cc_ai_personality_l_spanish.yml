l_spanish:

 # ---------------------------------------------------------------------------
 # Drift Events
 # ---------------------------------------------------------------------------

 cc_personality.1.title: "Los vientos de guerra"
 cc_personality.1.desc: "Con nuestros ejércitos en el campo y el olor a humo en el viento, el consejo discute sobre cómo aprovechar nuestra ventaja: si golpear con más fuerza o conservar lo que tenemos."

 cc_personality.1.a: "Presionen el ataque; no tengan piedad."
 cc_personality.1.b: "Mantener nuestra posición; no debemos extendernos demasiado."

 cc_personality.2.title: "Ambiciones Imperiales"
 cc_personality.2.desc: "En paz y en la cúspide de nuestra fuerza, los grandes ministros de estado debaten el camino a seguir. ¿Intentamos aprovechar lo que podamos o observamos y esperamos el momento adecuado?"

 cc_personality.2.a: "Extender nuestras fronteras y nuestra influencia."
 cc_personality.2.b: "Paciencia: aprovecha las debilidades de los demás cuando surjan."

 cc_personality.3.title: "Tiempo de cautela"
 cc_personality.3.desc: "Nuestro prestigio ha disminuido y nuestros rivales nos observan cuidadosamente. El consejo insta a la corona a proceder con cautela, pero ¿cuánta cautela?"

 cc_personality.3.a: "Fortificar nuestra posición contra todas las amenazas."
 cc_personality.3.b: "Diplomacia cuidadosa ante todo; evitar la provocación."

 cc_personality.4.title: "Comercio y Diplomacia"
 cc_personality.4.desc: "Nuestro tesoro está lleno y nuestros mercaderes prosperan. La cuestión ante el consejo es si utilizar esta riqueza para forjar amistades o para aprovecharse discretamente de quienes nos rodean."

 cc_personality.4.a: "Construya alianzas y buena voluntad — el oro compra amigos."
 cc_personality.4.b: "Dejar que otros vean nuestra riqueza como una oportunidad: estar atentos a las oportunidades."

 cc_personality.5.title: "Una cuestión de estrategia"
 cc_personality.5.desc: "La corte delibera sobre la dirección estratégica del reino. Las viejas certezas se han desvanecido; debe elegirse un nuevo enfoque."

 cc_personality.5.aggressive: "Debemos dominar: golpear antes de que otros nos golpeen a nosotros."
 cc_personality.5.expansionist: "Ampliar nuestro alcance: las fronteras son tan permanentes como nuestra voluntad."
 cc_personality.5.defensive: "Conservar lo que tenemos: la fuerza reside en la resistencia."
 cc_personality.5.cautious: "Diplomacia cuidadosa y riesgo medido; nunca excederse."
 cc_personality.5.opportunistic: "Vigila el tablero, muévete cuando otros tropiecen."
 cc_personality.5.isolationist: "Mira hacia adentro: nuestra fuerza reside en nuestras propias tierras."
 cc_personality.5.friendly: "Alianzas y buena voluntad: un estado apreciado es un estado seguro."

 # ---------------------------------------------------------------------------
 # Ottoman Inflection Events
 # ---------------------------------------------------------------------------

 cc_personality.10.title: "El sultán conquistador"
 cc_personality.10.desc: "El imperio se encuentra en la cúspide de su poder. Nuestro gran sultán ha derrotado al Egipto mameluco, ha humillado a los persas y ha plantado la media luna sobre los Balcanes. El mundo tiembla ante nosotros. Ahora, ¿cómo aprovechamos nuestra ventaja?"

 cc_personality.10.a: "No hay paz, solo conquista. Adelante, siempre adelante."
 cc_personality.10.b: "Nuestras fronteras son vastas. Debemos expandirnos con disciplina, no con furia."

 cc_personality.11.title: "El largo estancamiento"
 cc_personality.11.desc: "Los días de conquistas relámpago han quedado atrás. Nuestras fronteras están defendidas por grandes fortalezas, pero rara vez avanzan más. Los jenízaros discuten, los visires conspiran y el tesoro se agota. Debemos elegir nuestra postura en un mundo más difícil."

 cc_personality.11.a: "Defender lo que poseemos; el imperio es demasiado grande para arriesgarlo en una guerra temeraria."
 cc_personality.11.b: "Cautela ante todo; mantener mediante la diplomacia lo que no podemos ganar por la fuerza."

 # ---------------------------------------------------------------------------
 # France / England Inflection Events
 # ---------------------------------------------------------------------------

 cc_personality.20.title: "El ascenso del Rey Sol"
 cc_personality.20.desc: "Se abre el reinado de una nueva era. El rey ordena que Francia domine Europa: mediante la diplomacia donde sea posible, mediante la guerra donde sea necesario. La corte de Versalles irradia una confianza absoluta. Francia está destinada a la hegemonía. La cuestión es únicamente el método."

 cc_personality.20.a: "La guerra es el instrumento de los reyes. Impondremos nuestra voluntad."
 cc_personality.20.b: "Hegemonía mediante la sutileza: que los demás nos teman sin provocar una coalición."

 cc_personality.21.title: "El Imperio Marítimo de Britania"
 cc_personality.21.desc: "La era del puesto comercial da paso a la era del imperio. Nuestra armada domina los mares y nuestras colonias se extienden por continentes. La cuestión es si Gran Bretaña se limitará a comerciar o si gobernará."

 cc_personality.21.a: "Gobernar, no solo comerciar. Proyectaremos nuestro poder dondequiera que ondee nuestra bandera."
 cc_personality.21.b: "Un imperio marítimo saca el mayor provecho de la flexibilidad: explota, no te comprometas en exceso."

 # ---------------------------------------------------------------------------
 # Muscovy Inflection Event
 # ---------------------------------------------------------------------------

 cc_personality.30.title: "El zar terrible"
 cc_personality.30.desc: "El nuevo zar gobierna tanto mediante el miedo como mediante la ley. Su oprichnina purga a los rivales, sus ejércitos golpean al este y al oeste sin piedad. Rusia será grande, a base de sangre si es necesario. Los boyardos tiemblan. La pregunta es hasta dónde nos llevará esta furia."

 cc_personality.30.a: "Sin piedad. Rusia avanza mediante la fuerza absoluta de su voluntad."
 cc_personality.30.b: "Expandirse deliberadamente; no hace falta destruir lo que podemos simplemente tomar."

 # ---------------------------------------------------------------------------
 # Castile Inflection Event
 # ---------------------------------------------------------------------------

 cc_personality.40.title: "El imperio del Nuevo Mundo"
 cc_personality.40.desc: "El oro llega a raudales desde las Américas. Nuestros conquistadores han reclamado medio mundo en nombre de la corona y la fe. Nos encontramos en el centro de un imperio global como ningún otro que haya visto la historia. La cuestión es cómo utilizaremos este poder."

 cc_personality.40.a: "Cruzada y conquista: el mundo se inclinará ante la fe y la corona."
 cc_personality.40.b: "Construya un imperio duradero — expándase con orden, no solo con fuego."

 # ---------------------------------------------------------------------------
 # Sweden Inflection Event
 # ---------------------------------------------------------------------------

 # ---------------------------------------------------------------------------
 # Four-Yearly Deep Analysis Events (60-65)
 # ---------------------------------------------------------------------------

 cc_personality.60.title: "El Reino Agotado"
 cc_personality.60.desc: "Nuestros ejércitos han marchado durante años y el pueblo está agotado. El agotamiento por la guerra carcome cada rincón del reino: las levas están agotadas, el tesoro tensionado y los nobles murmuran sobre una era sin descanso. El consejo debe decidir cómo enfrentaremos al mundo de ahora en adelante."

 cc_personality.60.a: "Defender lo que tenemos; no más aventuras costosas."
 cc_personality.60.b: "Diplomacia cuidadosa ante todo; no podemos permitirnos otra guerra."

 cc_personality.61.title: "Ambición del Vencedor"
 cc_personality.61.desc: "Nuestros ejércitos han visto mucha guerra, pero siguen siendo fuertes; nuestros enemigos se han desmoronado ante nosotros una y otra vez. El pueblo mira a la corona con orgullo, los soldados con disposición. Este es el momento en que se crean los imperios. ¿Qué hacemos con este poder?"

 cc_personality.61.a: "Dominamos. Golpeen fuerte, golpeen primero, que no quede duda de nuestra supremacía."
 cc_personality.61.b: "Expandirse con propósito: reclamar lo que es nuestro, frontera a frontera."

 cc_personality.62.title: "Rodeados por Todos Lados"
 cc_personality.62.desc: "Las grandes potencias nos miran con ojos hambrientos. Estados rivales han instigado a sus nobles contra nosotros, han susurrado sobre coaliciones y han puesto a prueba nuestras fronteras. El consejo debate cómo sobrevivir en un mundo que parece estar cerrándose sobre nosotros."

 cc_personality.62.a: "Fortificarlo todo: hacernos demasiado costosos de atacar."
 cc_personality.62.b: "Mira hacia adentro: deja que las grandes potencias se peleen entre sí."
 cc_personality.62.c: "Navega con cuidado; mantén a cada enemigo potencial incierto sobre nuestras intenciones."

 cc_personality.63.title: "Un reino en agitación"
 cc_personality.63.desc: "Los vasallos refunfuñan, la lealtad flaquea y nuestra posición en el mundo se ve disminuida. El reino no está roto, pero está tensionado, y un paso en falso ahora podría convertir el descontento en rebelión. El consejo recomienda prudencia por encima de todo."

 cc_personality.63.a: "Gobernanza cuidadosa y deliberada; restaurar la confianza antes de buscar la gloria."
 cc_personality.63.b: "Reforzar nuestras defensas: asegurarnos de que nuestro control sobre el reino no pueda ser roto."

 cc_personality.64.title: "La oportunidad imperial"
 cc_personality.64.desc: "Nos encontramos en un momento excepcional: una gran potencia en paz, nuestro tesoro lleno, nuestros rivales debilitados. El mundo es nuestro para moldearlo, si decidimos alcanzarlo. La corte debate con entusiasmo el camino que tenemos por delante."

 cc_personality.64.a: "Ampliar nuestro alcance: esta riqueza y fuerza deben traducirse en un dominio duradero."
 cc_personality.64.b: "Este es nuestro momento: ataquemos antes de que los rivales se consoliden contra nosotros."
 cc_personality.64.c: "Mantener la fluidez: aprovechar las oportunidades según surjan en lugar de comprometerse con una sola dirección."

 cc_personality.65.title: "El camino del Mercader"
 cc_personality.65.desc: "Nuestras arcas desbordan y nuestros mercaderes prosperan en puertos de todo el mundo. Hemos evitado las guerras ruinosas que han desangrado a nuestros vecinos. La cuestión ante el consejo es qué hacer con esta prosperidad, y qué tipo de potencia deseamos ser."

 cc_personality.65.a: "La riqueza es una ventaja: úsala para explotar las vulnerabilidades ajenas."
 cc_personality.65.b: "Invertir en buena voluntad: los aliados y amigos son la salvaguardia más segura de la prosperidad."

 cc_personality.50.title: "El Gran Ajuste de Cuentas del Norte"
 cc_personality.50.desc: "La era de la gloria imperial sueca ha terminado. La Gran Guerra del Norte ha destrozado nuestro imperio báltico, y Rusia se encuentra ahora donde antes dominaba Suecia. Debemos reconstruirnos, ¿pero de qué forma? ¿Fortificamos y resistimos, o trazamos un rumbo más cauteloso?"

 cc_personality.50.a: "Suecia resiste. Defendemos lo que queda y reconstruimos desde la fuerza."
 cc_personality.50.b: "La era de la ambición ha pasado. La cautela y la prudencia deben guiarnos ahora."
