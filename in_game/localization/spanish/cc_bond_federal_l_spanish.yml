l_spanish:

 # ============================================================
 # AoR FEDERAL BOND EVENTS — cc_bonds.140–145
 # ============================================================

 # === cc_bonds.140 — The Federal Member Stands with the Union ===
 cc_bonds.140.title: "El Miembro Federal Permanece Leal a la Unión"
 cc_bonds.140.desc: "La Era de las Revoluciones ha llegado y cada vínculo de lealtad está siendo puesto a prueba. [bond_subj.GetName] ha superado la prueba con una claridad que no necesita interpretación. Su parlamento ha renovado el pacto federal, sus líderes han abogado por la unión en público y su población, en un momento en que mirar hacia otro lado habría sido fácil, no lo ha hecho. Años de trato equitativo y consultas genuinas han producido lo que ningún administrador puede fabricar."
 cc_bonds.140.a: "Celebrar esto públicamente. El imperio se construye sobre relaciones como esta."
 cc_bonds.140.b: "Formalizarlo. Que el parlamento federal, y no la corona, mantenga unida la unión."

 # === cc_bonds.141 — The Federal Member Demands Equal Rights ===
 cc_bonds.141.title: "El Miembro Federal Exige Igualdad de Derechos"
 cc_bonds.141.desc: "La Era de las Revoluciones ha llegado a [bond_subj.GetName], y su parlamento ha redactado algo contundente: una demanda formal de representación equitativa y posición igualitaria dentro del pacto federal, refiriéndose a la clase sustancial y no a la meramente nominal. El documento es tranquilo en su tono y devastador en su contenido. Enumera las decisiones en las que su representación fue ignorada y los momentos en que lo «federal» resultó significar «sujeto a revisión». No amenazan con la independencia. Preguntan si la federación es real."
 cc_bonds.141.a: "Es real. Concédeles la representación total que les corresponde."
 cc_bonds.141.b: "Se toma nota de la demanda. La respuesta es no."

 # === cc_bonds.142 — The Associate Member Submits Its Petition ===
 cc_bonds.142.title: "El miembro asociado presenta su petición"
 cc_bonds.142.desc: "El liderazgo de [bond_subj.GetName] ha presentado una petición formal. No es una demanda, ya que son demasiado cautelosos para ello, pero es lo más parecido a una que estuvieron dispuestos a hacer. Preguntan con considerable delicadeza si ahora podrían considerarse los fundamentos para una membresía federal completa, y señalan sus contribuciones económicas, su apoyo militar y sus años de cooperación a pesar de las limitaciones del estatus de asociado. Lo preguntan porque se lo han ganado y sospechan que la corte podría estar de acuerdo."
 cc_bonds.142.a: "Aprobar la petición. Elevarlos a miembros federales plenos."
 cc_bonds.142.b: "Reconocerlo. Honrar la petición con oro y la promesa de una revisión."
 cc_bonds.142.c: "Desestimarlo. Son un miembro asociado, y eso es suficiente."

 # === cc_bonds.143 — The False Federation Unravels ===
 cc_bonds.143.title: "La Falsa Federación se Desmorona"
 cc_bonds.143.desc: "Alguien ha estado llevando las cuentas. Los despachos de [bond_subj.GetName] dejan claro que la contabilidad ha terminado y que las cifras no son favorables. La carta prometía una posición equitativa y un gobierno compartido; los años transcurridos han traído una extracción a gran escala y decisiones impuestas sin consulta, en un acuerdo que, al examinarlo, parece la relación colonial que debía sustituir. Los panfletos que circulan en su capital han dejado de argumentar que la independencia es deseable para empezar a argumentar que es necesaria."
 cc_bonds.143.a: "Terminar con las pretensiones. Convertir la carta en administración directa."
 cc_bonds.143.b: "Compra el silencio. Paga lo necesario para estabilizar la situación."
 cc_bonds.143.c: "Haga que la carta sea real en lugar de defender la mentira."

 # === cc_bonds.144 — The Colony Asserts Its Place ===
 cc_bonds.144.title: "La colonia reivindica su lugar"
 cc_bonds.144.desc: "La noticia de [bond_subj.GetName] no es una petición ni una exigencia, sino algo más difícil de recibir: una declaración. El liderazgo colonial escribe que han observado las corrientes revolucionarias que barren el mundo y que no les temen, porque creen que poseen algo que esas corrientes no pueden ofrecer, construido a lo largo de décadas de trato honesto y gobernanza compartida. Les gustaría que esa relación se formalizara, como socios en lugar de súbditos. Creen que ha llegado el momento y que el imperio será más fuerte gracias a ello."
 cc_bonds.144.a: "Acójanlos como socios federales plenos. La unión es más fuerte gracias a esto."
 cc_bonds.144.b: "Ofrezca una membresía asociada. Un paso genuino, aunque no sea el que pidieron."
 cc_bonds.144.c: "Invítelos al Consejo Imperial como primer paso."
 cc_bonds.144.d: "Rechazar. El acuerdo actual nos sirve adecuadamente."

 # === cc_bonds.145 — The Client Seeks Cover ===
 cc_bonds.145.title: "El Cliente Busca Cobertura"
 cc_bonds.145.desc: "El liderazgo de [bond_subj.GetName] ha enviado una comunicación privada. Han estado observando la Era de las Revoluciones y han identificado algo que la retórica revolucionaria no puede ofrecerles: estabilidad bajo un marco imperial reconocido. Lo que quieren es legitimidad, la clase de legitimidad que proviene de ser un socio nombrado en un acuerdo constitucional en lugar de un cliente informal cuyo estatus depende de la buena voluntad del gobierno actual. Piden que se les integre. La pregunta es qué tipo de integración estamos ofreciendo."
 cc_bonds.145.a: "Integrarlos en el Consejo Imperial. Un acuerdo constitucional genuino."
 cc_bonds.145.b: "Ofrézcales una carta federal. La asociación que desean, bajo nuestros términos."
 cc_bonds.145.c: "Mantener el acuerdo actual. No hay necesidad de formalizar nada."

 # ============================================================
 # SYNERGY EVENTS — cc_synergy.27–28
 # ============================================================

 # === cc_synergy.27 — National Reformer + Federal Architect ===
 cc_synergy.27.title: "Un parlamento para el imperio"
 cc_synergy.27.desc: "Dos de las mentes más influyentes de la corte han estado hablando entre sí. [minister_a.GetName], quien ha dedicado su carrera a rediseñar la arquitectura interna del estado, y [minister_b.GetName], quien ha dedicado la suya a mantener los diversos territorios del imperio en una relación productiva; han encontrado un proyecto común. Proponen la formalización de un parlamento federal: un cuerpo con legitimidad legislativa real, que represente a los territorios miembros en proporción a sus contribuciones, con autoridad real sobre asuntos compartidos de defensa, comercio y ley. Preguntan si la Corona está preparada para gobernar un imperio mediante la ley en lugar de mediante la voluntad."
 cc_synergy.27.a: "Sí. Encargue el Pacto Federal y convoque al parlamento."
 cc_synergy.27.b: "Primero un paso más pequeño. Formalizar la armonía parlamentaria y ver qué sucede después."

 # === cc_synergy.28 — Federal Architect + False Federal Member ===
 cc_synergy.28.title: "El arquitecto lee el estatuto"
 cc_synergy.28.desc: "[minister.GetName] ha dedicado tiempo a revisar el acuerdo de la carta con [bond_subj.GetName], y su evaluación es incómoda. El documento, leído detenidamente, es una carta federal de nombre y un pacto colonial en la práctica. El parlamento del miembro no tiene autoridad vinculante. La representación es consultiva. El acuerdo económico fluye en una sola dirección. No dice esto para avergonzar a la corte, sino porque cree que el acuerdo es una debilidad: cuando la población de [bond_subj.GetName] comprenda plenamente lo que se les dio en lugar de lo que se les prometió, la reacción será peor que si el engaño nunca hubiera ocurrido. La cuestión es si la corte quiere solucionar esto mientras solucionarlo sea todavía una elección."
 cc_synergy.28.a: "Hacerlo realidad. Convertir la carta en una membresía federal completa."
 cc_synergy.28.b: "Reforma parcial. Elévalos a miembros asociados; una mejora genuina."
 cc_synergy.28.c: "El acuerdo es rentable. Déjalo como está."
 cc_bonds.140.desc.deep: "El parlamento de [bond_subj.GetName] ha hecho más que renovar el pacto. Ha votado enviar sus propios regimientos a guarnecer provincias que no son suyas, bajo el argumento de que la unión es un solo país o no es nada. El debate fue público, la votación no fue ajustada y la transcripción ha sido reimpresa en otras tres capitales federales. No nos están defendiendo a nosotros. Están defendiendo algo que consideran en parte suyo."
 cc_bonds.141.desc.deep: "El parlamento de [bond_subj.GetName] ha respondido a su propia pregunta. Ha aprobado una resolución declarando el pacto federal nulo por incumplimiento, ha citado cuarenta años de precedentes y se ha suspendido la sesión. Sus delegados han regresado a casa. No se han movilizado tropas ni se ha emitido ninguna declaración, lo que de alguna manera lo empeora: no se han rebelado contra la unión, han dictaminado que esta no existe."
 cc_bonds.141.desc.scholar: "La demanda de [bond_subj.GetName] no está escrita en el lenguaje de las peticiones. Está escrita en el lenguaje del erudito que suprimimos hace una generación, cuyos argumentos sobre el consentimiento y el pacto eran lo suficientemente peligrosos como para silenciarlos y, aparentemente, no lo suficientemente peligrosos como para responderles. Su parlamento ha adoptado su marco teórico íntegramente. Tuvimos la oportunidad de discutir con un hombre. Ahora estamos discutiendo con una legislatura que lo ha memorizado."
 cc_bonds.141.c: "Disolver la unión en lugar de pelear por la palabra."
 cc_bonds.142.desc.deep: "La petición de [bond_subj.GetName] llega con un apéndice que nadie pidió: una comparación de sus contribuciones frente a las de dos miembros plenos, a lo largo de sesenta años, con fuentes. El caso es irrebatible y ellos lo saben. También se han encargado de presentarla en privado en lugar de publicarla, que es lo más persuasivo del documento."
 cc_bonds.143.desc.deep: "La carta de [bond_subj.GetName] ha sido leída en voz alta en su asamblea, cláusula por cláusula, seguida del registro correspondiente de lo que ocurrió en realidad tras cada una. Llevó dos días. Una transcripción ya circula por cada capital que haya firmado algo con nosotros. La federación no se está desmoronando. Ha sido desmantelada públicamente por personas que llevaron mejores registros que nosotros."
 cc_bonds.143.d: "Deje que se desarrolle. Ya hemos gestionado crisis anteriormente."
 cc_bonds.144.desc.deep: "La asamblea colonial de [bond_subj.GetName] ha votado a favor de la federación y ha enviado el resultado con una delegación en lugar de un mensajero. Su argumento es que han funcionado como socios durante dos generaciones y preferirían que el papeleo se pusiera al día. También han dejado claro, cortésmente, que han considerado la alternativa y la han rechazado por méritos propios y no por falta de oportunidad."
 cc_bonds.144.desc.voice: "La asamblea que fundamos hace décadas ha votado, y ha votado a favor de la federación. Ese voto es el argumento completo: piden formalizar algo que han estado practicando desde el día en que les dimos una sala para practicarlo. Todas las demás colonias del mundo están descubriendo este año qué sucede cuando no hay lugar donde llevar a cabo el debate. Esta lo ha hecho, y ha llegado a una conclusión con la que podemos convivir."
 cc_bonds.145.desc.deep: "La comunicación de [bond_subj.GetName] es inusualmente directa para un estado cliente. Dicen claramente que este año han recibido acercamientos de otras dos potencias y que prefieren quedarse. Nos piden que les demos una razón que sobreviva al próximo cambio de gobierno en nuestra capital. Una carta fundacional serviría. La buena voluntad, señalan, no ha sido suficiente."
