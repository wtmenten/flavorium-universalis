l_spanish:

 # ============================================================
 # AoR FEDERAL BOND EVENTS — cc_bonds.140–145
 # ============================================================

 # === cc_bonds.140 — The Federal Member Stands with the Union ===
 cc_bonds.140.title: "El Miembro Federal Permanece Leal a la Unión"
 cc_bonds.140.desc: "La Era de las Revoluciones ha llegado, y con ella la prueba de cada vínculo de lealtad. [bond_subj.GetName] ha superado esta prueba con una claridad que no requiere interpretación. Su parlamento ha renovado formalmente el pacto federal, sus líderes han hablado públicamente a favor de la unión y su población —en un momento político en el que habría sido fácil mirar hacia otro lado— no lo ha hecho. Los años de trato equitativo, de consulta genuina, de gobernanza compartida en lugar de autoridad impuesta, han producido lo que ningún administrador colonial puede fabricar: un pueblo que ha decidido, por voluntad propia, que esta unión merece ser defendida."
 cc_bonds.140.a: "Celebrar esto públicamente. El imperio se construye sobre relaciones como esta."
 cc_bonds.140.b: "Formalizar el vínculo: ampliar su representación en el parlamento federal."

 # === cc_bonds.141 — The Federal Member Demands Equal Rights ===
 cc_bonds.141.title: "El Miembro Federal Exige Igualdad de Derechos"
 cc_bonds.141.desc: "La Era de las Revoluciones ha llegado a [bond_subj.GetName], y su parlamento ha redactado algo contundente: una demanda formal de representación equitativa, igualdad de derechos y el mismo estatus dentro del pacto federal; no la igualdad sobre el papel que se les prometió, sino la igualdad sustantiva que no han recibido. El documento es calmado en su tono y devastador en su contenido. Enumera, punto por punto, las decisiones en las que su representación fue ignorada, las leyes en las que sus intereses fueron dejados de lado, los momentos en que la palabra 'federal' resultó significar 'sujeto a revisión'. No están amenazando con la independencia. Están preguntando si la federación es real."
 cc_bonds.141.a: "Es real. Concédeles la representación total que les corresponde."
 cc_bonds.141.b: "Se toma nota de la demanda. La respuesta es no."

 # === cc_bonds.142 — The Associate Member Submits Its Petition ===
 cc_bonds.142.title: "El miembro asociado presenta su petición"
 cc_bonds.142.desc: "El liderazgo de [bond_subj.GetName] ha presentado una petición formal. No es una exigencia —son demasiado cautelosos para ello— pero es lo más parecido a una que han estado dispuestos a formular. Preguntan, con considerable delicadeza diplomática, si ahora podrían considerarse los fundamentos para una membresía federal completa. Señalan sus contribuciones económicas, su apoyo militar y sus años de cooperación a pesar de las limitaciones del estatus de asociado. No piden ser iguales porque se sientan con derecho a ello. Lo piden porque se lo han ganado y creen, cautelosamente, que la corte podría estar de acuerdo."
 cc_bonds.142.a: "Aprobar la petición. Elevarlos a miembros federales plenos."
 cc_bonds.142.b: "Reconoce la petición: hónrala con oro y una promesa de revisión."
 cc_bonds.142.c: "Rechazar la petición. Son un miembro asociado, y eso es suficiente."

 # === cc_bonds.143 — The False Federation Unravels ===
 cc_bonds.143.title: "La Falsa Federación se Desmorona"
 cc_bonds.143.desc: "Alguien ha estado llevando la cuenta. Los despachos de [bond_subj.GetName] dejan claro que la contabilidad se ha completado y las cifras no son favorables. La carta federal prometía igualdad de condiciones, un gobierno compartido y una asociación genuina. Los años transcurridos han traído una extracción a gran escala, decisiones administrativas impuestas sin consulta y un acuerdo de gobierno que, al examinarlo, se parece mucho más a la relación colonial que debía sustituir. El liderazgo de [bond_subj.GetName] aún no está en abierta rebelión. Pero los panfletos revolucionarios que circulan por la capital han dejado de argumentar que la independencia es deseable; han empezado a argumentar que es necesaria."
 cc_bonds.143.a: "Terminar con las pretensiones. Convertir la carta en administración directa."
 cc_bonds.143.b: "Compra el silencio. Paga lo necesario para estabilizar la situación."
 cc_bonds.143.c: "Dejar que se desarrolle. Ya hemos gestionado crisis anteriormente."

 # === cc_bonds.144 — The Colony Asserts Its Place ===
 cc_bonds.144.title: "La colonia reivindica su lugar"
 cc_bonds.144.desc: "El mensaje de [bond_subj.GetName] no es una petición ni una exigencia; es algo más difícil de recibir: una declaración. El liderazgo colonial ha escrito para decir, con considerable confianza, que han estado observando las corrientes revolucionarias que barren el mundo y que no les temen. No tienen miedo porque creen que poseen algo que esas corrientes no pueden ofrecer: una relación genuina con la metrópoli imperial, construida a lo largo de décadas de trato honesto, gobernanza compartida e inversión mutua. Escriben para decir que les gustaría que esa relación se formalizara, no como súbditos, sino como socios. Creen que ha llegado el momento de un acuerdo federal y creen que el imperio será más fuerte gracias a ello."
 cc_bonds.144.a: "Los recibimos como socios federales plenos. La unión es más fuerte en este momento."
 cc_bonds.144.b: "Ofrecer una membresía asociada; un paso genuino, aunque no el paso completo que solicitaron."
 cc_bonds.144.c: "Invitarlos al Consejo Imperial como primer paso."
 cc_bonds.144.d: "Rechazar. El acuerdo actual nos sirve adecuadamente."

 # === cc_bonds.145 — The Client Seeks Cover ===
 cc_bonds.145.title: "El Cliente Busca Cobertura"
 cc_bonds.145.desc: "El liderazgo de [bond_subj.GetName] ha enviado una comunicación privada. Han estado observando la Era de las Revoluciones y han identificado algo que la retórica revolucionaria no puede ofrecerles: estabilidad bajo un marco imperial reconocido. Lo que buscan es legitimidad, del tipo que proviene de ser un socio nombrado en un acuerdo constitucional más amplio, en lugar de un cliente informal cuyo estatus depende enteramente de la buena voluntad del gobierno actual. En resumen, piden ser integrados. La cuestión es qué tipo de integración les ofrecemos."
 cc_bonds.145.a: "Incorpórelos al Consejo Imperial — un acuerdo constitucional genuino."
 cc_bonds.145.b: "Ofrecerles una carta federal: la asociación que desean, bajo nuestros términos."
 cc_bonds.145.c: "Mantener el acuerdo actual. No hay necesidad de formalizar nada."

 # ============================================================
 # SYNERGY EVENTS — cc_synergy.27–28
 # ============================================================

 # === cc_synergy.27 — National Reformer + Federal Architect ===
 cc_synergy.27.title: "Un parlamento para el imperio"
 cc_synergy.27.desc: "Dos de las mentes más influyentes de la corte han estado hablando entre sí. [minister_a.GetName], quien ha dedicado su carrera a rediseñar la arquitectura interna del estado, y [minister_b.GetName], quien ha dedicado la suya a mantener los diversos territorios del imperio en una relación productiva; han encontrado un proyecto común. Proponen la formalización de un parlamento federal: un cuerpo con legitimidad legislativa real, que represente a los territorios miembros en proporción a sus contribuciones, con autoridad real sobre asuntos compartidos de defensa, comercio y ley. Preguntan si la Corona está preparada para gobernar un imperio mediante la ley en lugar de mediante la voluntad."
 cc_synergy.27.a: "Sí. Encargue el Pacto Federal y convoque al parlamento."
 cc_synergy.27.b: "Primero un paso más pequeño. Formalizar la armonía parlamentaria y ver qué sucede después."

 # === cc_synergy.28 — Federal Architect + False Federal Member ===
 cc_synergy.28.title: "El arquitecto lee el estatuto"
 cc_synergy.28.desc: "[minister.GetName] ha dedicado tiempo a revisar el acuerdo de la carta con [bond_subj.GetName], y su evaluación es incómoda. El documento, leído detenidamente, es una carta federal de nombre y un pacto colonial en la práctica. El parlamento del miembro no tiene autoridad vinculante. La representación es consultiva. El acuerdo económico fluye en una sola dirección. No dice esto para avergonzar a la corte, sino porque cree que el acuerdo es una debilidad: cuando la población de [bond_subj.GetName] comprenda plenamente lo que se les dio en lugar de lo que se les prometió, la reacción será peor que si el engaño nunca hubiera ocurrido. La cuestión es si la corte quiere solucionar esto mientras solucionarlo sea todavía una elección."
 cc_synergy.28.a: "Hacerlo realidad. Convertir la carta en una membresía federal completa."
 cc_synergy.28.b: "Reforma parcial. Elévalos a miembros asociados; una mejora genuina."
 cc_synergy.28.c: "El acuerdo es rentable. Déjalo como está."
