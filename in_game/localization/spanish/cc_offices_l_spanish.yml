 cc_office.10.title: "Las Cuentas de la Casa"
 cc_office.10.desc: "Han revisado las cuentas de la casa. El dinero se ha estado filtrando por las cocinas y los establos durante años, y quienes lo toman tienen buenos contactos."
 cc_office.10.a: "Deténganlo, a quien sea que ofenda."
 cc_office.10.b: "En silencio, y sin nombres."
 cc_office.10.c: "Deja que reorganicen la casa."
 cc_office.11.title: "Una disputa sobre la precedencia"
 cc_office.11.desc: "Están enfrentados con las grandes familias sobre quién camina primero en la corte, y ambas partes esperan que la corona lo resuelva."
 cc_office.11.a: "Apoyar al oficial."
 cc_office.11.b: "Apoyar a las familias."
 cc_office.11.c: "Sus largos servicios lo resuelven."
 cc_office.12.title: "Un sermón en la corte"
 cc_office.12.desc: "Predicaron ante toda la corte, y el sermón se está repitiendo en todas las iglesias de la capital."
 cc_office.12.a: "Hacer que se imprima."
 cc_office.12.b: "Un buen sermón. Nada más."
 cc_office.12.c: "Hacer que lo prediquen por todo el reino."
 cc_office.13.title: "Una cuestión de conciencia"
 cc_office.13.desc: "Se han negado a respaldar una decisión de la corona y lo dicen abiertamente."
 cc_office.13.a: "Anúlalos."
 cc_office.13.b: "Ceder."
 cc_office.13.c: "Se han ganado el derecho a ser escuchados."
 cc_office.14.title: "Las peticiones se acumulan"
 cc_office.14.desc: "Las peticiones a la corona se están acumulando en su oficina más rápido de lo que pueden leerse."
 cc_office.14.a: "Despeja el camino, tarde lo que tarde."
 cc_office.14.b: "Haz que esperen."
 cc_office.14.c: "Hacer que reformen el procedimiento."
 cc_office.15.title: "Una inspección de las oficinas"
 cc_office.15.desc: "Quieren inspeccionar cada oficina bajo su mando, y los escribanos se han enterado."
 cc_office.15.a: "Inspecciónalo todo."
 cc_office.15.b: "Bastará con una advertencia."
 cc_office.15.c: "Confíe en que saben dónde buscar."
 cc_office.16.title: "Un festival en la corte"
 cc_office.16.desc: "Proponen un festival a la antigua usanza, con música, obras de teatro y mucha comida."
 cc_office.16.a: "Que no falte ningún gasto."
 cc_office.16.b: "Mantén la modestia."
 cc_office.16.c: "Deja que ellos lo organicen."
 cc_office.17.title: "Una moda extranjera"
 cc_office.17.desc: "Han adoptado una moda del extranjero y la mitad de la corte los ha seguido. La otra mitad se siente ofendida."
 cc_office.17.a: "Adóptalo en la corte."
 cc_office.17.b: "Prohibirlo."
 cc_office.17.c: "Saben qué es lo que perdurará."
 cc_office.18.title: "Noticias de la frontera"
 cc_office.18.desc: "Traen noticias de las provincias fronterizas: disturbios, malas cosechas y funcionarios a los que nadie ha supervisado en años."
 cc_office.18.a: "Actúa ahora mismo."
 cc_office.18.b: "Archivarlo para más tarde."
 cc_office.18.c: "Envíenlos a encargarse de ello."
 cc_office.19.title: "Los Notables Provinciales"
 cc_office.19.desc: "Han traído a la corte una delegación de notables provinciales que quieren ser escuchados."
 cc_office.19.a: "Recíbanlos con honor."
 cc_office.19.b: "Envíenlos a casa."
 cc_office.19.c: "Conocen a estas personas."
 cc_office_seneschal_appoint: "Nombrar a un Senescal"
 cc_office_seneschal_appoint_desc: "Elige un ministro para el cargo de Senescal. Se te ofrecerán los ministros más veteranos capacitados para ello."
