l_spanish:
 # ============================================================
 # cc_cond.1 — Capital Development Trait Event
 # ============================================================
 cc_cond.1.title: "Un ministro que promete mucho"
 cc_cond.1.a: "Nombrar a [minister.GetName] como [ShowTraitName('master_urbanist')]."
 cc_cond.1.b: "Fomentar que [minister.GetName] sea un [ShowTraitName('enlightenment_herald')]."
 cc_cond.1.c: "Desarrollar a [minister.GetName] como un [ShowTraitName('progressive_rationalist')]."
 cc_cond.1.d: "Acepta a [minister.GetName] como [ShowTraitName('revolutionary_herald')]."
 cc_cond.1.e: "Desarrollar a [minister.GetName] como [ShowTraitName('grand_architect')]."
 cc_cond.1.f: "Fomentar que [minister.GetName] sea un [ShowTraitName('arts_patron')]."
 cc_cond.1.g: "Convertir a [minister.GetName] en un [ShowTraitName('learned_courtier')]."
 cc_cond.1.h: "Desarrollar a [minister.GetName] como [ShowTraitName('reform_minded_counselor')]."
 cc_cond.1.i: "Dirige a [minister.GetName] como [ShowTraitName('urban_planner')]."
 cc_cond.1.j: "Anima a [minister.GetName] como [ShowTraitName('prosperity_herald')]."
 cc_cond.1.k: "Nombrar a [minister.GetName] como [ShowTraitName('merchant_syndic')]."
 cc_cond.1.dismiss: "El crecimiento de la capital hablará por sí mismo."

 # ============================================================
 # cc_cond.3 — Military Specialist (Ages 1–4, mil > 33)
 # ============================================================
 cc_cond.3.title: "Emerge una mente militar"
 cc_cond.3.desc: "[minister.GetName] ha demostrado ser un administrador militar capaz. Su dominio de la logística, la táctica y la organización lo distingue de otros en la corte. Con la dirección adecuada, este talento puede aprovecharse para fines específicos."
 cc_cond.3.a: "Dirige a [minister.GetName] como un [ShowTraitName('infantry_drillmaster')]."
 cc_cond.3.b: "Desarrollar a [minister.GetName] como un [ShowTraitName('scout_captain')]."
 cc_cond.3.c: "Fomentar que [minister.GetName] sea un [ShowTraitName('military_engineer')]."
 cc_cond.3.dismiss: "No se requiere dirección en este momento."

 # ============================================================
 # cc_cond.4 — Regional / Cultural / Religious Specialist
 # ============================================================
 cc_cond.4.title: "Un consejero del mundo"
 cc_cond.4.desc: "[minister.GetName] ha mostrado una profundidad de conocimiento inusual en cuanto a las costumbres, religiones y pueblos que nos rodean. Su experiencia podría desarrollarse más para servir a fines específicos."
 cc_cond.4.christian: "Guía a [minister.GetName] como [ShowTraitName('christian_diplomat')]."
 cc_cond.4.orthodox: "Desarrollar a [minister.GetName] como un [ShowTraitName('ecumenical_patriarch_advisor')]."
 cc_cond.4.muslim: "Dirige a [minister.GetName] como un [ShowTraitName('caliphate_diplomat')]."
 cc_cond.4.dharmic: "Fomentar que [minister.GetName] sea un [ShowTraitName('brahmin_counselor')]."
 cc_cond.4.buddhist: "Guía a [minister.GetName] como [ShowTraitName('dharma_minister')]."
 cc_cond.4.western_europe: "Forja a [minister.GetName] como un [ShowTraitName('renaissance_patron')]."
 cc_cond.4.africa: "Desarrollar a [minister.GetName] como un [ShowTraitName('griot_diplomat')]."
 cc_cond.4.central_asia: "Fomentar que [minister.GetName] sea un [ShowTraitName('steppe_strategos')]."
 cc_cond.4.south_asia: "Guía a [minister.GetName] como [ShowTraitName('mughal_administrator')]."
 cc_cond.4.new_world: "Dirige a [minister.GetName] como un [ShowTraitName('new_world_pioneer')]."
 cc_cond.4.maritime: "Forja a [minister.GetName] como un [ShowTraitName('maritime_champion')]."
 cc_cond.4.dismiss: "Su experiencia encontrará su propio camino."

 # ============================================================
 # cc_cond.5 — Parliamentary / Diplomatic Specialist
 # ============================================================
 cc_cond.5.title: "Un diplomático de habilidad excepcional"
 cc_cond.5.desc: "[minister.GetName] ha navegado por las cortes y asambleas de este reino con una gracia inusual. Sus instintos diplomáticos son agudos. ¿Cómo los desarrollaremos?"
 cc_cond.5.a: "Fomentar que [minister.GetName] sea un [ShowTraitName('parliamentary_broker')]."
 cc_cond.5.b: "Nombrar a [minister.GetName] como [ShowTraitName('diplomatic_attache')]."
 cc_cond.5.c: "Nombrar a [minister.GetName] como [ShowTraitName('grand_chancellor')]."
 cc_cond.5.dismiss: "Sus habilidades se desarrollarán naturalmente."

 # ============================================================
 # cc_cond.6 — Advanced Military Specialist (Ages 5–6, mil > 66)
 # ============================================================
 cc_cond.6.title: "Una mente militar veterana"
 cc_cond.6.desc: "[minister.GetName] es un comandante experimentado cuyos instintos se han forjado en décadas de campañas. No es alguien a quien desperdiciar en rutinas administrativas. ¿Cómo canalizaremos sus dones?"
 cc_cond.6.a: "Convertir a [minister.GetName] en un [ShowTraitName('commissariat_officer')]."
 cc_cond.6.b: "Nombrar a [minister.GetName] como [ShowTraitName('cavalry_marshal')]."
 cc_cond.6.c: "Desarrollar a [minister.GetName] como un [ShowTraitName('siege_engineer')]."
 cc_cond.6.d: "Nombrar a [minister.GetName] como [ShowTraitName('supreme_commander')]."
 cc_cond.6.dismiss: "Sus dones no necesitan más moldearse."

 # ============================================================
 # cc_cond.20 — Intellectual / Religious Cluster
 # ============================================================
 cc_cond.20.title: "Un consejero moldeado por la época"
 cc_cond.20.desc: "[minister.GetName] ha sido formado por el clima intelectual y espiritual de este reino. Sus convicciones son profundas. ¿Qué camino captura mejor su naturaleza?"
 cc_cond.20.innovative: "Desarrollar a [minister.GetName] como un [ShowTraitName('innovative_counselor')]."
 cc_cond.20.traditionalist: "Forja a [minister.GetName] como un [ShowTraitName('traditionalist_guardian')]."
 cc_cond.20.spiritualist: "Fomentar que [minister.GetName] sea un [ShowTraitName('mystical_patriarch')]."
 cc_cond.20.humanist: "Guía a [minister.GetName] como [ShowTraitName('humanist_philosopher')]."
 cc_cond.20.mysticism: "Desarrollar a [minister.GetName] como un [ShowTraitName('mystical_counselor')]."
 cc_cond.20.jurisprudence: "Dirige a [minister.GetName] como un [ShowTraitName('legal_scholar')]."
 cc_cond.20.dismiss: "Su naturaleza se manifestará con el tiempo."

 # ============================================================
 # cc_cond.21 — Social Order Cluster
 # ============================================================
 cc_cond.21.title: "Un consejero del orden social"
 cc_cond.21.desc: "El pensamiento de [minister.GetName] sobre la organización de la sociedad se ha agudizado debido al clima político actual. Sus creencias están claras. ¿Cómo debemos orientarlas?"
 cc_cond.21.absolutist: "Fomentar que [minister.GetName] sea un [ShowTraitName('royal_absolutist')]."
 cc_cond.21.liberal: "Guía a [minister.GetName] como [ShowTraitName('liberal_reformer')]."
 cc_cond.21.centralized: "Desarrollar a [minister.GetName] como un [ShowTraitName('efficiency_administrator')]."
 cc_cond.21.decentralized: "Forja a [minister.GetName] como un [ShowTraitName('regional_magnate')]."
 cc_cond.21.serfdom: "Nombrar a [minister.GetName] como [ShowTraitName('serf_overseer')]."
 cc_cond.21.free_subjects: "Nombrar a [minister.GetName] como [ShowTraitName('emancipation_minister')]."
 cc_cond.21.individualism: "Desarrollar a [minister.GetName] como [ShowTraitName('free_spirit_counselor')]."
 cc_cond.21.communalism: "Guía a [minister.GetName] como [ShowTraitName('community_steward')]."
 cc_cond.21.dismiss: "Su visión social encontrará expresión en otro lugar."

 # ============================================================
 # cc_cond.22 — Military Doctrine Cluster
 # ============================================================
 cc_cond.22.title: "Una filosofía militar toma forma"
 cc_cond.22.desc: "[minister.GetName] ha absorbido las lecciones militares de la historia reciente de este reino. Sus convicciones doctrinales son ahora claras. ¿Cómo deberíamos desarrollarlas?"
 cc_cond.22.quality: "Forja a [minister.GetName] como un [ShowTraitName('elite_trainer')]."
 cc_cond.22.quantity: "Dirige a [minister.GetName] como un [ShowTraitName('mass_levy_commander')]."
 cc_cond.22.offensive: "Fomentar que [minister.GetName] sea un [ShowTraitName('offensive_strategist')]."
 cc_cond.22.defensive: "Guía a [minister.GetName] como [ShowTraitName('defensive_commander')]."
 cc_cond.22.land: "Desarrollar a [minister.GetName] como un [ShowTraitName('continental_marshal')]."
 cc_cond.22.naval: "Forja a [minister.GetName] como un [ShowTraitName('admiral_counselor')]."
 cc_cond.22.opt_belligerent: "Fomentar que [minister.GetName] sea un [ShowTraitName('hawk_minister')]."
 cc_cond.22.conciliatory: "Guía a [minister.GetName] como [ShowTraitName('peacemaker_counselor')]."
 cc_cond.22.dismiss: "Dejar que la doctrina siga su propio curso."

 # ============================================================
 # cc_cond.23 — Economic Doctrine Cluster
 # ============================================================
 cc_cond.23.title: "Surge una filosofía económica"
 cc_cond.23.desc: "[minister.GetName] ha cristalizado sus convicciones económicas. Los mercados, los estamentos y los debates del reino han moldeado su pensamiento hasta convertirlo en algo afilado y útil. ¿Cómo lo desplegaremos?"
 cc_cond.23.aristocracy: "Fomentar que [minister.GetName] sea un [ShowTraitName('noble_champion')]."
 cc_cond.23.plutocracy: "Forja a [minister.GetName] como un [ShowTraitName('merchant_prince')]."
 cc_cond.23.mercantilism: "Desarrollar a [minister.GetName] como un [ShowTraitName('mercantilist_official')]."
 cc_cond.23.free_trade: "Guía a [minister.GetName] como [ShowTraitName('free_market_advocate')]."
 cc_cond.23.capital_economy: "Dirige a [minister.GetName] como un [ShowTraitName('capitalist_minister')]."
 cc_cond.23.traditional_economy: "Forja a [minister.GetName] como un [ShowTraitName('estate_guardian')]."
 cc_cond.23.dismiss: "El pensamiento económico se desarrollará por sí solo."

 # ============================================================
 # cc_cond.24 — Expansion / Cultural Identity Cluster
 # ============================================================
 cc_cond.24.title: "Una visión de la identidad del reino"
 cc_cond.24.desc: "[minister.GetName] ha desarrollado fuertes convicciones sobre la dirección cultural y el lugar del reino en el mundo. Su perspectiva refleja la influencia de esta era. ¿Cómo la dirigiremos?"
 cc_cond.24.outward: "Forja a [minister.GetName] como un [ShowTraitName('expansionist_advisor')]."
 cc_cond.24.inward: "Fomentar que [minister.GetName] sea un [ShowTraitName('consolidation_minister')]."
 cc_cond.24.latinized: "Guía a [minister.GetName] como [ShowTraitName('roman_administrator')]."
 cc_cond.24.hellenized: "Desarrollar a [minister.GetName] como un [ShowTraitName('hellenistic_scholar')]."
 cc_cond.24.sinicized: "Forja a [minister.GetName] como un [ShowTraitName('confucian_mandarin')]."
 cc_cond.24.unsinicized: "Dirige a [minister.GetName] como un [ShowTraitName('steppe_warlord_advisor')]."
 cc_cond.24.dismiss: "La identidad cultural hablará por sí misma."

 # ============================================================
 # cc_cond.101 — Urban Ambitions Take Shape (follow-up to cc_cond.1 Tier 1)
 # ============================================================

 cc_cond.101.title: "Las ambiciones urbanas toman forma"
 cc_cond.101.desc: "[minister.GetName] ha estado trabajando desde que la corona reconoció sus dotes para la gobernanza urbana. La capital ha sentido los efectos; si han sido para mejor o para peor depende de cómo se haya desarrollado el proyecto."
 cc_cond.101.a: "Informar el resultado a la corona."
 cc_cond.1.desc: "[minister.GetName] has distinguished [minister.GetHerHim]self through the administration of our growing capital. The prosperity of [country.GetCapital.GetName] seems to have sharpened their mind. How shall we direct their talents?"
