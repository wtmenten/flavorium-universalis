 # ============================================================

 imperial_council_member: "Miembro del Consejo Imperial"
 LEAD_imperial_council_member: "Soberano Federal"
 AM_imperial_council_member: "Miembro del Consejo Imperial"
 CANCEL_imperial_council_memberTITLE: "Disolver la membresía del consejo"
 CANCEL_imperial_council_member_DESC: "Retirar la invitación al Consejo Imperial, poniendo fin a la relación de asesoría y devolviendo la plena independencia al antiguo miembro."

 equal_federal_member: "Miembro Federal"
 LEAD_equal_federal_member: "Parlamento Federal"
 AM_equal_federal_member: "Miembro Federal"
 CANCEL_equal_federal_memberTITLE: "Disolver la membresía federal"
 CANCEL_equal_federal_member_DESC: "Disuelve el pacto federal, rompiendo la asociación legislativa y militar. El reino miembro no olvidará que la promesa de igualdad fue revocada."

 lesser_federal_member: "Miembro asociado"
 LEAD_lesser_federal_member: "Parlamento Federal"
 AM_lesser_federal_member: "Miembro asociado"
 CANCEL_lesser_federal_memberTITLE: "Retirar el Estatus de Asociado"
 CANCEL_lesser_federal_member_DESC: "Finalizar el acuerdo de membresía asociada, devolviendo al reino a su estado anterior. Los resentimientos generados por el trato de segunda clase no se disuelven tan fácilmente."

 false_federal_member: "Titular de la Carta Federal"
 LEAD_false_federal_member: "Autoridad de acta"
 AM_false_federal_member: "Tenedor del acta"
 CANCEL_false_federal_memberTITLE: "Revocar el fuero federal"
 CANCEL_false_federal_member_DESC: "Revocar el fuero federal, poniendo fin al acuerdo. Las poblaciones a las que se les prometió una membresía equitativa y en su lugar recibieron extracción no estarán inclinadas a la gratitud."

 # Upgrade tooltip strings
 federal_member_upgrade_tt: "Este miembro fue admitido recientemente en el Consejo; la maquinaria constitucional para una actualización federal completa aún se está estableciendo."
 lesser_federal_member_upgrade_tt: "Este miembro fue admitido recientemente en el Consejo; la maquinaria constitucional para una actualización federal completa aún se está estableciendo."

 # ============================================================
 # ADVANCES — Imperial Federalization
 # ============================================================

 colonial_assembly_advance: "Asambleas coloniales"
 colonial_assembly_advance_desc: "Establecer asambleas representativas en nuestros territorios coloniales, otorgando al liderazgo local una voz formal en el gobierno imperial. El primer paso hacia una relación más duradera con las colonias."

 federal_constitution_advance: "Constitución Federal"
 federal_constitution_advance_desc: "Redactar un marco constitucional para la federación imperial, otorgando estatus legislativo a las asambleas coloniales dentro de un parlamento federal más amplio. Abre el camino hacia la membresía en el consejo imperial y la unión federal completa."

 imperial_trade_compact_advance: "Compacto Comercial Imperial"
 imperial_trade_compact_advance_desc: "Formalizar una zona de comercio preferencial en todo el imperio, vinculando las colonias a la metrópoli mediante intereses comerciales compartidos. El lenguaje de la asociación oculta el lenguaje del beneficio."

 false_federal_charter_advance: "Carta Federal"
 false_federal_charter_advance_desc: "Emitir cartas federales a los territorios coloniales y clientes existentes. Estos documentos prometen los derechos de membresía mientras preservan la mecánica de extracción. Una federación de nombre; un imperio de hecho."

