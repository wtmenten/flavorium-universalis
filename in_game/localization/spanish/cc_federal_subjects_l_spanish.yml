 # ============================================================
 # CABINET TRAIT — Federal Architect
 # ============================================================

 federal_architect: "Arquitecto Federal"
 desc_federal_architect: "Moldeado por los desafíos de gobernar un imperio mediante el consentimiento en lugar de la compulsión, este asesor ha dedicado su carrera a la teoría y práctica del gobierno federal. Sabe cómo mantener unido un imperio diverso: otorgando la autonomía suficiente para que los súbditos se sientan comprometidos, mientras mantiene la integración necesaria para que el todo sea mayor que la suma de sus partes."
 federal_architect_die_desc: "La cuidadosa labor de construcción federal que mantuvieron requerirá de muchas manos para continuar. Parte de lo que construyeron perdurará. Otra parte dependerá enteramente de quién venga después."

 # cc_traits.40 event text
 cc_traits.40.title: "Un arquitecto del orden federal"
 cc_traits.40.desc: "[minister.GetName] ha dedicado su carrera a observar cómo el imperio lucha por mantener unidos sus diversos territorios: las colonias que exigen más, las dependencias que resienten recibir menos, los clientes que toman cada concesión como una invitación para la siguiente demanda. Mientras que la mayoría de los asesores ven esto como un problema de autoridad, [minister.GetName] lo ve como un problema de diseño. Ha estado redactando algo: un marco para gobernar mediante el consentimiento en lugar de la coerción, para construir estructuras federales que sean duraderas porque son genuinamente compartidas. Pregunta si la corte está preparada para pensar seriamente en el futuro del imperio."
 cc_traits.40.a: "Sí. Nombre a [minister.GetName] como [ShowTraitName('federal_architect')] y encargue la obra."
 cc_traits.40.b: "El imperio se mantiene unido por la autoridad, no por constituciones. Todavía no."

 # ============================================================
 # MODIFIER NAMES — Imperial Federalization
 # ============================================================

 STATIC_MODIFIER_NAME_cc_federal_union_solidarity: "Solidaridad de la Unión Federal"
 STATIC_MODIFIER_DESC_cc_federal_union_solidarity: "Un miembro federal ha reafirmado su compromiso con la unión en un momento de crisis. La demostración de lealtad compartida fortalece la posición del imperio."

 STATIC_MODIFIER_NAME_cc_false_federation_exposed: "Engaño al descubierto"
 STATIC_MODIFIER_DESC_cc_false_federation_exposed: "La brecha entre las promesas de la membresía federal y su realidad se ha vuelto innegable. La credibilidad del imperio como socio —con este territorio y otros observando— se ha visto dañada."

 STATIC_MODIFIER_NAME_cc_synergy_federal_compact: "Pacto Federal"
 STATIC_MODIFIER_DESC_cc_synergy_federal_compact: "El parlamento federal se ha formalizado a través de un pacto constitucional: un marco compartido que otorga a sus miembros una participación real en el gobierno del imperio."
