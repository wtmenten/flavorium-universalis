l_spanish:
 # === cc_bonds.50 — The Royal Visit ===
 cc_bonds.50.title: "La visita real"
 cc_bonds.50.desc: "Hemos recibido aviso de que [bond_subj.GetName] se ha preparado para una recepción oficial; su pueblo espera algún gesto de la Corona. La casa gobernante de la dependencia ha insinuado, a través de canales diplomáticos, que una visita personal sería recordada durante generaciones. Un enviado real sería apropiado. Una carta formal cumpliría técnicamente con la obligación. La diferencia es considerable."
 cc_bonds.50.a: "Realizar el viaje personalmente. Esto es importante."
 cc_bonds.50.b: "Enviar un enviado real con la ceremonia adecuada."
 cc_bonds.50.c: "Una carta formal servirá para el propósito."

 # === cc_bonds.51 — Dependency Trade Preferences ===
 cc_bonds.51.title: "Preferencias comerciales de la dependencia"
 cc_bonds.51.desc: "Nuestros asesores comerciales nos han informado que los acuerdos comerciales actuales con [bond_subj.GetName] no están definidos formalmente; se han desarrollado orgánicamente y funcionan razonablemente bien, pero dejan sin resolver decisiones de ingresos significativas. Se han redactado tres opciones. La más rentable para la Corona es también la más onerosa para la dependencia."
 cc_bonds.51.a: "Establecer términos comerciales favorables para la dependencia."
 cc_bonds.51.b: "Formalizar términos de igualdad. Beneficio mutuo, posición equitativa."
 cc_bonds.51.c: "Establecer términos que maximicen los ingresos de la Corona."

 # === cc_bonds.52 — Royal Family Ceremony ===
 cc_bonds.52.title: "Ceremonia de la familia real"
 cc_bonds.52.desc: "Se está planificando una ocasión real significativa: el aniversario de una coronación, un bautizo, una boda o un banquete de estado. La familia gobernante de [bond_subj.GetName] ha realizado una consulta discreta sobre el papel que se espera de ellos. Han asistido a cada ocasión de este tipo que se recuerde. El hecho de que aparezcan de forma prominente, marginal o que no aparezcan en absoluto envía una señal clara sobre cómo vemos la relación."
 cc_bonds.52.a: "Incluya a su delegación de manera prominente. Son familia en todo menos en el nombre."
 cc_bonds.52.b: "Enviar una invitación simbólica. Son bienvenidos, siempre que conozcan su lugar."
 cc_bonds.52.c: "La ocasión es un asunto interno de la Corona. No se ha extendido ninguna invitación."

 # === cc_bonds.53 — Dependency Faces External Threat ===
 cc_bonds.53.title: "La dependencia se enfrenta a una amenaza externa"
 cc_bonds.53.desc: "Un despacho de [bond_subj.GetName] trae noticias alarmantes. Una potencia vecina —con ambiciones territoriales arraigadas en la región— ha estado moviendo fuerzas hacia las fronteras de la dependencia. Las propias fuerzas de la dependencia son limitadas. Su carta tiene cuidado de no suplicar, pero el mensaje es claro: confían en nosotros y están observando cómo respondemos."
 cc_bonds.53.a: "Enviar nuestras fuerzas inmediatamente. Están bajo nuestra protección."
 cc_bonds.53.b: "Financia y refuerza sus defensas sin intervención directa."
 cc_bonds.53.c: "Deben encargarse de esto ellos mismos. Tenemos nuestras propias preocupaciones."

 # === cc_bonds.54 — The Dependency's Cultural Festival ===
 cc_bonds.54.title: "El Festival Cultural de la Dependencia"
 cc_bonds.54.desc: "Se acerca un importante festival cultural en [bond_subj.GetName], una celebración que, según su tradición, marca la continuidad de la identidad y la historia de su pueblo. La casa gobernante ha extendido una invitación. El festival es una oportunidad: para ser vistos como partícipes de su herencia, para ser vistos como respetuosos con ella desde la distancia, o para ser vistos como demasiado ocupados para asistir."
 cc_bonds.54.a: "Patrocina el festival generosamente. Celebramos junto a ellos."
 cc_bonds.54.b: "Asistir en persona sin acaparar la ocasión."
 cc_bonds.54.c: "Enviar una carta de felicitación y pesar."
 cc_bonds.54.d: "No tenemos nada que aportar a sus asuntos locales."

 # === cc_bonds.55 — The Dependency Wants Voice in Succession ===
 cc_bonds.55.title: "La Dependencia Quiere Voz en la Sucesión"
 cc_bonds.55.desc: "La casa reinante de [bond_subj.GetName] ha presentado una petición formal. Desean ser consultados en cualquier acuerdo de sucesión que les afecte materialmente; no para elegir, enfatizan, sino para ser escuchados. Su argumento es el de la continuidad y el interés mutuo. Nuestros asesores están divididos. Algunos ven esto como una petición enteramente razonable de un socio leal. Otros ven un precedente que, una vez establecido, no puede revocarse fácilmente."
 cc_bonds.55.a: "Conceder derechos de consulta. Su voz es importante en los asuntos que les afectan."
 cc_bonds.55.b: "Ofrecer un papel consultivo. Podrán ser escuchados, aunque la decisión recae en nosotros."
 cc_bonds.55.c: "Rechazar. La sucesión es una prerrogativa de la Corona, no un asunto de consulta."
