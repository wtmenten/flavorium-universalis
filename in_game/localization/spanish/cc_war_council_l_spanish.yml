l_spanish:
 # ============================================================
 # War Council Events (Pillar 04)
 # ============================================================

 # --- cc_wc.1 — The Council of War ---
 cc_wc.1.title: "El Consejo de Guerra"

 cc_wc.1.a: "Presionar la ofensiva: aprovechar el momento."
 cc_wc.1.a.tooltip: "La defensa del [minister.GetName] por una campaña agresiva envalentona al ejército. La moral aumenta, pero la sobreextensión estratégica conlleva el riesgo de inestabilidad política interna."

 cc_wc.1.b: "Aconsejar paciencia; dejar que el enemigo se canse."
 cc_wc.1.b.tooltip: "La doctrina de defensa paciente del ministro se consolida. Las columnas enemigas sufrirán gravemente en nuestro territorio y el coste de mantener nuestros fuertes disminuye."

 cc_wc.1.c: "No prometer la paz sin una victoria total."
 cc_wc.1.c.tooltip: "La exigencia de términos incondicionales por parte de los halcones moviliza a la corte. El prestigio aumenta y los ministros están obligados a proseguir la guerra hasta su conclusión."

 cc_wc.1.d: "El consejo del ministro estabiliza la campaña."
 cc_wc.1.d.tooltip: "El sólido asesoramiento profesional de [minister.GetName] evita que el consejo tome decisiones precipitadas. La experiencia crece con cada campaña planificada."

 # --- cc_wc.2 — Financing the War ---
 cc_wc.2.title: "Financiación de la guerra"
 cc_wc.2.desc: "El tesoro está bajo presión. [minister.GetName] ha sido convocado para presentar una solución, o al menos un relato franco de cuán grave es la situación en realidad."

 cc_wc.2.a: "Presiona a la población: extrae lo que sea necesario."
 cc_wc.2.a.tooltip: "El control administrativo del ministro fuerza ingresos adicionales del reino. El resentimiento campesino aumenta y la estabilidad se debilita bajo la presión."

 cc_wc.2.b: "Negociar préstamos de guerra: oro ahora, intereses después."
 cc_wc.2.b.tooltip: "El ministro gestiona financiación a corto plazo de casas mercantiles y prestamistas. El tesoro aumenta, pero la inflación es la compañera inevitable del oro prestado."

 cc_wc.2.c: "Soportad la escasez: recortad gastos y resistid."
 cc_wc.2.c.tooltip: "No se presenta ninguna solución elegante. El reino se aprieta el cinturón, pero la moral de la corte sufre debido a la debilidad visible."

 # --- cc_wc.3 — The General's Request ---
 cc_wc.3.title: "La petición del general"
 cc_wc.3.desc: "[minister.GetName] ha presentado una solicitud formal al consejo: la campaña requiere más recursos si quiere tener éxito. La corona debe decidir si el ejército o el tesoro tienen prioridad."

 cc_wc.3.a: "Conceder los recursos — dejar que el ejército haga su trabajo."
 cc_wc.3.a.tooltip: "Refuerzos, suministros y monedas fluyen hacia el frente. La moral del ejército aumenta y se restaura la confianza de [minister.GetName] en la corona."

 cc_wc.3.b: "Rechazar: el tesoro no puede soportarlo."
 cc_wc.3.b.tooltip: "[minister.GetName] recibe el rechazo con un desprecio mal disimulado. Su opinión sobre el compromiso de la corona con la guerra [minister.GetHerHis|c] se verá permanentemente disminuida."

 # --- cc_wc.10 — Standing Army Reform ---
 cc_wc.10.title: "La propuesta del ejército permanente"
 cc_wc.10.desc: "Con la guerra concluida y las lecciones del campo de batalla frescas en la mente de [minister.GetName], el ministro ha redactado una propuesta formal: reemplazar el sistema de leva feudal por un ejército profesional permanente financiado por la corona. La nobleza no recibirá bien este cambio."

 cc_wc.10.a: "Promulgar la reforma del ejército permanente."
 cc_wc.10.a.tooltip: "Se establece una fuerza permanente: entrenada, mantenida y leal únicamente a la corona. La disciplina y la mano de obra mejoran sustancialmente, pero la nobleza pierde prestigio y autoridad de leva."

 cc_wc.10.b: "Rechazar; la nobleza no lo permitiría."
 cc_wc.10.b.tooltip: "La propuesta queda archivada. La ventana para la reforma pasa sin consecuencias."

 # --- cc_wc.11 — Supply Reform ---
 cc_wc.11.title: "La propuesta de reforma de suministros"

 cc_wc.11.a: "Financia la reforma del comisariado."
 cc_wc.11.a.tooltip: "Se establece un comisariado adecuado. Las columnas de suministros ahora mantienen el ritmo del ejército y el desgaste por atrición cae drásticamente en todas las campañas."

 cc_wc.11.b: "El coste es demasiado elevado; rechazar."
 cc_wc.11.b.tooltip: "La propuesta es demasiado costosa dadas las condiciones actuales. La ventana de reforma expira."

 # --- cc_wc.12 — Fortification Doctrine ---
 cc_wc.12.title: "La doctrina de fortificación"
 cc_wc.12.desc: "Tras haber estudiado el arte del asedio enemigo durante toda la campaña, [minister.GetName] propone una revisión exhaustiva de la política de fortificaciones: diseños de bastiones estandarizados, rotaciones regulares de guarniciones y un calendario de mantenimiento unificado. Le costará caro al tesoro, pero los enemigos encontrarán nuestro territorio mucho más costoso de atravesar."

 cc_wc.12.a: "Invertir en la nueva doctrina de fortificación."
 cc_wc.12.a.tooltip: "Nuestros fuertes han sido reconstruidos y racionalizados. Los costes de mantenimiento disminuyen bajo el nuevo calendario, y los ejércitos hostiles que marchen por nuestro territorio sangrarán en cada legua."

 cc_wc.12.b: "Demasiado caro; rechazar la propuesta."
 cc_wc.12.b.tooltip: "La reforma se aplaza. El plazo de cinco años para la reforma posterior a la guerra se cierra."

 # --- cc_wc.20 — Outdated General Resolution ---
 cc_wc.20.title: "Una decisión del consejo sobre el viejo general"

 cc_wc.20.a: "Retirar a [minister.GetName] con honor."
 cc_wc.20.a.tooltip: "El consejo retira formalmente al general del mando activo. El coste de prestigio de apartar a un veterano es real, pero el gabinete queda liberado de una voz anticuada."

 cc_wc.20.b: "Permitir que [minister.GetName] complete la campaña."
 cc_wc.20.b.tooltip: "El viejo soldado conoce bien estos campos de batalla. La deferencia del consejo le otorga un modesto prestigio: hay dignidad en la lealtad."

 # ============================================================
 # War Council Modifier Names
 # ============================================================
 cc_wc_offensive_surge: "Oleada ofensiva"
 cc_wc_offensive_surge_desc: "El consejo de guerra ha respaldado una campaña ofensiva agresiva. La moral y la recuperación del ejército aumentan mientras dure la ofensiva."

 cc_wc_defensive_posture: "Postura defensiva"
 cc_wc_defensive_posture_desc: "El consejo de guerra aconseja paciencia. Los ejércitos hostiles sufren un gran desgaste al cruzar nuestro territorio, y el mantenimiento de las fortificaciones se reduce."

 cc_standing_army_reform: "Reforma del ejército permanente"
 cc_standing_army_reform_desc: "Una fuerza profesional permanente ha sustituido al antiguo sistema de levas. La disciplina es más rigurosa y las reservas de mano de obra han crecido."

 cc_supply_reform: "Reforma del Suministro"
 cc_supply_reform_desc: "Un comisariado reformado mantiene al ejército abastecido en campaña. El desgaste de las tropas se reduce sustancialmente."

 cc_fortification_doctrine: "Doctrina de Fortificación"
 cc_fortification_doctrine_desc: "Los diseños de bastiones estandarizados y las rotaciones de guarniciones hacen que nuestras fortificaciones sean más eficientes y que nuestro territorio sea más costoso de invadir."

 cc_wc_general_defied: "General desafiante"

 # --- cc_wc.50 — The Hawk's Reckoning ---
 cc_wc.50.title: "El Ajuste de Cuentas del Halcón"
 cc_wc.50.desc: "[minister.GetName] no levanta la voz. No hace falta que lo haga. La promesa se hizo en esta misma cámara: que no habría paz sin una victoria total. Las palabras eran nuestras para aceptarlas o rechazarlas, y las aceptamos. Ahora ha llegado el despacho con los términos de la paz, y [minister.GetName] lo lee con una expresión que dice todo lo que [minister.GetSheHe] no dirá en voz alta.\n\nLa forma en que respondamos en la próxima hora determinará si este ministerio sobrevive al final de la guerra[minister.GetHerHis][minister.GetSheHe]."

 cc_wc.50.a: "La paz era necesaria. [minister.GetName] lo aceptará, o encontrará otro puesto."
 cc_wc.50.a.tooltip: "Prestigio derivado de un gobierno firme. [minister.GetName] no lo acepta con elegancia; [minister.GetSheHe] guardará rencor por algún tiempo."

 cc_wc.50.b: "Reconoce la dificultad. Honra el servicio y compromiso de [minister.GetHerHis]."
 cc_wc.50.b.tooltip: "Un coste modesto de prestigio. [minister.GetName] recibe el reconocimiento y se vuelve más capaz gracias a ello. La tensión se resuelve sin una resolución clara."

 cc_wc.50.c: "Prometer la siguiente campaña. Prometerlo ante el consejo."
 cc_wc.50.c.tooltip: "Una promesa pública de que la próxima guerra se luchará hasta el final. Coste de prestigio, pero el modificador de Oleada Ofensiva refleja un compromiso marcial genuinamente renovado, y [minister.GetName] queda satisfecho."

 # --- cc_wc.51 — The General's Resentment ---
 cc_wc.51.title: "El resentimiento del general"

 cc_wc.51.a: "Compensar a [minister.GetName]. Oro y un reconocimiento formal de que la negativa fue un error."
 cc_wc.51.a.tooltip: "Un acuerdo material: [minister.GetName] recibe oro y reconocimiento. El libro de cuentas queda saldado y [minister.GetSheHe] crece gracias a la resolución."

 cc_wc.51.b: "Conceder a [minister.GetName] un honor simbólico ante el consejo."
 cc_wc.51.b.tooltip: "Un coste modesto de prestigio por un reconocimiento público. Las relaciones mejoran ligeramente, pero se toma nota de la fricción subyacente en lugar de resolverla."

 cc_wc.51.c: "Destituir a [minister.GetName]. Un general resentido en el gabinete es una carga."

 cc_wc.51.d: "Ignóralo. Los ministros sirven a voluntad de la Corona, y no al revés."
 cc_wc.1.desc: "[minister.GetName] convoca al consejo alrededor de los mapas de campaña. [minister.GetHerHis|c] evaluación de la situación militar define qué opciones se presentan ante el trono."
 cc_wc.11.desc: "[minister.GetName] ha presentado una auditoría detallada de los fallos logísticos de la última campaña. [minister.GetHerHis|c] propuesta para un comisariado reformado eliminaría el despilfarro y el desgaste que tanto le costaron al ejército, pero la inversión inicial es sustancial."
 cc_wc.20.desc: "El consejo ha planteado lo que muchos han susurrado durante meses: las tácticas de [minister.GetName] pertenecen a una era anterior. La campaña ha dejado al descubierto la brecha entre sus métodos de [minister.GetHerHis] y el campo de batalla moderno. Los ministros proponen una jubilación formal y digna, pero no pasará desapercibida."
 cc_wc.51.desc: "El agravio de [minister.GetName] ha tenido meses para calcificarse. Los recursos que [minister.GetSheHe] solicitó antes de la campaña fueron rechazados, y ahora [minister.GetSheHe] ha tenido tiempo de contar el coste: en vidas, en terreno perdido, en un libro de cuentas personal que no cuadra. [minister.GetSheHe] no ha presentado una queja formal. [minister.GetSheHe] ha sido peor: perfectamente correcto, precisamente obediente y frío de una manera que todo el gabinete ha notado.\n\nEsto no puede continuar sin convertirse en algo mayor."
 cc_wc.51.c.tooltip: "Coste de estabilidad por la perturbación. [minister.GetName] se marcha llevando consigo [minister.GetHerHis] agravio, y podría encontrar formas de expresarlo desde fuera del gabinete."
 cc_wc.51.d.tooltip: "[minister.GetName] interpreta el silencio correctamente. [minister.GetHerHis] sumisión se convierte en resentimiento formal; el gabinete notará hacia dónde han derivado las cosas."
