 cc_pty_tt_liberal_sat_40: "Los Liberales ganan 40 de satisfacción."
 cc_pty_tt_liberal_sat_minus_10: "Los Liberales pierden 10 de satisfacción."
 cc_pty_lu_tt_down_5: "El impulso del levantamiento disminuye en 5."
 cc_pty_lu_tt_down_6: "El impulso del levantamiento disminuye en 6."
 cc_pty_lu_tt_down_8: "El impulso del levantamiento disminuye en 8."
