l_spanish:
 # Flavorium Universalis - Factions (hand-written keys)
 # Party names, agendas, per-party modifiers and action names are generated into
 # cc_pty_catalogue_l_english.yml by tools/generate_factions.py.

 # ---- Situation ----
 cc_pty_legend_lt_low: "Pensamiento liberal: presente"
 cc_pty_legend_lt_mid: "Pensamiento liberal: 30 o más"
 cc_pty_legend_lt_high: "Pensamiento liberal: 60 o más"
 cc_pty_map_tt_lt: "El Pensamiento Liberal aquí crece con la alfabetización, la corte, la Ilustración y una sociedad liberal, y cae mientras los Absolutistas dirigen el reino."

 # ---- Panel ----
 CC_PTY_HEADER: "La Cámara"
 CC_PTY_HEADER_DESC: "Cuatro partidos se sientan en la cámara. Cuáles cuatro depende del gobierno, la edad y los estamentos, y la alineación se revisa cada quince a veinticinco años.\n\nLos #T Escaños#! provienen del reino mismo: cada megalópolis vale 3, cada ciudad 2, cada villa 1 y cada asentamiento rural una quinta parte de uno, y los escaños de cada ubicación se reparten entre los estamentos según su poder allí. Un partido toma los escaños de sus estamentos. La cámara tiene entre 20 y 84 escaños independientemente del tamaño del reino, por lo que los escaños son una proporción, no un recuento de ubicaciones. Cada ministro en el gabinete también aporta a su partido 2 escaños designados, hasta la mitad de la cámara. El #T poder#! de un partido es su proporción de escaños.\n\nLa #T Satisfacción#! se revisa cada dos a cuatro años y se desplaza a mitad de camino hacia lo que el partido espera. Cada partido vigila tres cosas propias, como el poder de la corona, el mantenimiento del ejército, los impuestos sobre su estamento o hasta qué punto la sociedad se inclina hacia ellos, y también cuenta sus ministros. Selecciona un partido para ver cada término. Los partidos satisfechos ayudan al reino y sus ministros trabajan más duro; los enfadados hacen lo contrario, y más cuanto más escaños posean.\n\nLos #T Halcones#!, los #T Particularistas#! y los #T Liberales#! deben ser gestionados: si se dejan enfadados con una quinta parte de los escaños, escalarán a un golpe de estado, una insurrección o un levantamiento."
 CC_PTY_LABEL_POWER: "Poder"
 CC_PTY_LABEL_SATISFACTION: "Satisfacción"
 CC_PTY_LABEL_MEMBERS: "Ministros"
 CC_PTY_LABEL_AGENDA: "Agenda:"
 CC_PTY_LABEL_CABINET: "Gabinete:"
 CC_PTY_LABEL_LIBERAL_THOUGHT: "Pensamiento liberal"
 CC_PTY_POWER_TT: "La cuota de este partido sobre la fuerza combinada de los cuatro partidos. La fuerza proviene del poder de sus estamentos, más 8 por cada uno de sus ministros en el gabinete. Un ataque la reduce en un 40% durante cinco años."
 CC_PTY_SAT_TT: "De -100 a 100. Se revisa cada dos a cuatro años, moviéndose a mitad de camino hacia lo que el partido espera (el número después de la flecha; selecciona el partido para ver por qué). El nombramiento o despido de un ministro del partido lo desplaza en 10 inmediatamente."
 CC_PTY_MEMBERS_TT: "Ministros en el gabinete que pertenecen a este partido."
 CC_PTY_AGENDA_TT: "Un partido con una cuarta parte de los escaños o más establece una agenda cada cinco a doce años y le da al gobierno seis años para cumplirla. Cumplida: +30 de satisfacción e influencia política igual a la mitad de los escaños del partido. Incumplida: -25."
 CC_PTY_DOMINANT_TT: "#P Dominante.#! El partido más fuerte, con un 30% de poder o más. La sociedad se mueve a su manera: la mitad de rápido bajo un gabinete equilibrado, y la mitad de nuevo si también cuenta con un gabinete acaparado."
 CC_PTY_MOOD_PLEASED_TT: "#P Satisfecho.#! Satisfacción superior a 30. El reino recibe el modificador de buena voluntad de este partido, escalado por su poder y satisfacción, y sus ministros trabajan un 5% mejor."
 CC_PTY_MOOD_CONTENT_TT: "Conforme. Satisfacción de -20 a 30. No tiene efecto en ningún sentido."
 CC_PTY_MOOD_DISCONTENT_TT: "#N Descontento.#! Satisfacción de -50 a -20. El reino recibe el modificador de descontento de este partido, escalado por su poder y satisfacción, y sus ministros trabajan un 10% peor."
 CC_PTY_MOOD_ANGRY_TT: "#N Enfurecido.#! Satisfacción inferior a -50. El reino recibe el modificador de descontento de este partido, escalado por su poder y satisfacción, y sus ministros trabajan un 20% peor."
 CC_PTY_COMP_STACKED_TT: "#T Apilado#!, por el partido mostrado. Un partido posee más de la mitad de los asientos del gabinete. +5% de eficiencia del gabinete y +10% de ganancia de influencia política, y la buena voluntad y el empuje de ese partido son más fuertes. Cada uno de los demás partidos espera 10 menos de satisfacción, y la rivalidad de la corte crece."
 CC_PTY_COMP_BALANCED: "Equilibrado"
 CC_PTY_COMP_BALANCED_TT: "Ningún partido posee más del 40% de los escaños y al menos tres están representados. +0.5 de influencia política mensual, la estabilidad es más barata, los sobornos y ataques cuestan un 25% menos, y el objetivo de satisfacción de ningún partido cae por debajo de -20. Las bonificaciones de buena voluntad son un 25% más débiles y la sociedad avanza a la mitad de velocidad."
 CC_PTY_COMP_MIXED: "Mixto"
 CC_PTY_COMP_MIXED_TT: "Ni acumulado ni equilibrado. Menos de tres escaños, o sin un patrón claro."
 CC_PTY_TERMLIMITS: "#T Límites de mandato#!"
 CC_PTY_TERMLIMITS_TT: "Mientras los Reformistas o los Liberales lideren el reino, un ministro que haya servido diez años dejará el cargo en la próxima revisión y no podrá regresar durante diez años."
 CC_PTY_LIBERAL_THOUGHT_TT: "El promedio del Pensamiento Liberal en la capital y las ciudades, mostrado en el mapa por esta situación. Crece con la alfabetización, la Ilustración y una sociedad liberal. Al llegar a 50, se forman los Liberales."
 CC_PTY_BTN_BRIBE: "Sobornar"
 CC_PTY_BTN_ATTACK: "Atacar"
 CC_PTY_BTN_FAVOUR: "Favor"

 # ---- Action requirements ----
 cc_pty_tt_bribe_cooldown: "Este partido fue sobornado hace menos de dos años"
 cc_pty_tt_attack_cooldown: "Este partido fue atacado hace menos de cinco años"
 cc_pty_tt_attack_power: "El partido posee al menos un 10% de potencia"
 cc_pty_tt_favour_cooldown: "Este partido concedió un favor hace menos de cinco años"
 cc_pty_tt_favour_sat: "La satisfacción del partido es de al menos 10"

 # ---- Rebels ----
 cc_pty_regional_rebels: "Liga provincial"

 # ---- Disasters ----
 cc_pty_praetorian_coup: "El golpe de los oficiales"
 cc_pty_praetorian_coup_desc: "Los halcones se han quedado sin paciencia. Los oficiales han tomado las guardias, los ministros temen volver a casa y ninguna orden del gobierno se ejecuta hasta que el ejército esté de acuerdo. Termina cuando los halcones vuelvan a estar satisfechos o después de cinco años."
 cc_pty_liberal_uprising: "El levantamiento liberal"

 # ---- Events ----
 cc_pty.10.title: "Nuevos partidos"
 cc_pty.10.desc: "Las antiguas alineaciones se han roto y nuevas se han formado en su lugar. La política del reino está ahora dividida entre el [ROOT.GetCountry.Custom('cc_pty_name_1')], el [ROOT.GetCountry.Custom('cc_pty_name_2')], el [ROOT.GetCountry.Custom('cc_pty_name_3')] y el [ROOT.GetCountry.Custom('cc_pty_name_4')].\n\nLos partidos que sobrevivieron mantienen su posición. Los nuevos comienzan sin ninguna, y los ministros cuyo partido se haya disuelto buscarán otro."
 cc_pty.10.a: "Aprenderemos sus nombres."
 cc_pty.20.title: "Una agenda"
 cc_pty.20.desc: "Los líderes del [ROOT.GetCountry.Custom('cc_pty_event_name')] han enviado sus demandas al gobierno. Quieren una cosa por encima de todas:\n\n#T [ROOT.GetCountry.Custom('cc_pty_event_agenda')]#!\n\nNos darán seis años. Si se cumple, lo recordarán. Si no, también lo recordarán."
 cc_pty.20.a: "Veremos qué se puede hacer."
 cc_pty.20.a.tt: "Cumple la agenda en seis años para obtener +30 de satisfacción con este partido. Si fallas, perderás 25."
 cc_pty.20.b: "El gobierno no acepta órdenes."
 cc_pty.30.title: "Cambio de bando"
 cc_pty.30.desc: "[cc_pty_defector.GetName] ha tenido suficiente del [ROOT.GetCountry.Custom('cc_pty_defect_from_name')]. Su disputa con el gobierno se ha convertido en la suya, y se les ha visto cenando con los líderes del [ROOT.GetCountry.Custom('cc_pty_defect_to_name')]. Han preguntado si el gobierno pondría alguna objeción."
 cc_pty.30.a: "Que vayan a donde quieran."
 cc_pty.30.b: "Recordarles quién los nombró."
 cc_pty.30.c: "Entonces también podrán dejar el gabinete."
 cc_pty.40.title: "Los oficiales se movilizan"
 cc_pty.40.desc: "Los halcones han dejado de pedir. Los oficiales leales a ellos han ocupado las guardias y los arsenales, y sus portavoces han presentado condiciones al gobierno. Nadie ha resultado herido todavía."
 cc_pty.40.a: "Dar a los oficiales lo que desean."
 cc_pty.40.b: "Arrestar a los cabecillas."
 cc_pty.41.title: "Las provincias se levantan"
 cc_pty.41.desc: "Los señores provinciales han formado una liga contra la capital. Quieren recuperar sus antiguos derechos, sus propios jueces y sus propios impuestos, y están reclutando hombres para imponer su voluntad."
 cc_pty.41.a: "El reino no será dividido."
 cc_pty.41.a.tt: "Una liga rebelde toma aproximadamente una quinta parte de nuestras provincias, nunca la de la capital, y comienza una guerra civil."
 cc_pty.41.b: "Conceder a las provincias sus derechos."
 cc_pty.42.title: "Los Clubes salen a las calles"
 cc_pty.42.a: "Conceda algunas reformas."
 cc_pty.42.b: "Cierre los clubes y arreste a los líderes."
 cc_pty.43.title: "Los súbditos se distancian"
 cc_pty.43.desc: "Los particularistas han extendido su disputa con la capital a nuestros súbditos, y estos los han escuchado. Sus cortes tardan más en responder a nuestras cartas y son más rápidas en hablar entre sí."
 cc_pty.43.a: "Que sigan resentidos."
 cc_pty.43.b: "Pagar por su buena voluntad."
 cc_pty.45.title: "Los oficiales se retiran"
 cc_pty.45.desc: "Los oficiales han regresado a sus cuarteles. Independientemente de lo prometido o amenazado, el gobierno vuelve a gobernar."
 cc_pty.45.a: "Bueno."
 cc_pty.46.title: "Las calles están tranquilas"
 cc_pty.46.desc: "Las multitudes han vuelto a casa y los clubes han vuelto a discutir entre sí."
 cc_pty.46.a: "Bueno."
 cc_pty.50.title: "Los Liberales"
 cc_pty.50.desc: "El pensamiento liberal se ha extendido lo suficiente en nuestras ciudades como para tener ahora su propio partido. Desea un gobierno constitucional, límites a la corona y cargos basados en el mérito. Ocupará un lugar entre los partidos del reino de inmediato."
 cc_pty.50.a: "Tendremos que lidiar con ellos."
 cc_pty.60.title: "Límites de mandato"
 cc_pty.60.desc: "Los reformistas lideran ahora el reino y han salido adelante con su propuesta: ningún ministro debe ocupar el cargo de por vida. A partir de ahora, un ministro que haya servido diez años dimitirá en la siguiente revisión y no podrá regresar durante otros diez."
 cc_pty.60.a: "Que así sea."
 cc_pty.61.title: "Límites de mandato eliminados"
 cc_pty.61.desc: "Los reformistas ya no lideran el reino, y la norma de que los ministros dimitan después de diez años ha caducado."
 cc_pty.61.a: "Que así sea."
 STATIC_MODIFIER_NAME_cc_pty_member_content: "Partido satisfecho"
 STATIC_MODIFIER_DESC_cc_pty_member_content: "El partido de este ministro está satisfecho con el gobierno, y el ministro trabaja en consecuencia."
 STATIC_MODIFIER_NAME_cc_pty_member_discontent: "Descontento partidista"
 STATIC_MODIFIER_DESC_cc_pty_member_discontent: "El partido de este ministro no está satisfecho con el gobierno. El ministro hace lo estrictamente necesario y poco más."
 STATIC_MODIFIER_NAME_cc_pty_member_angry: "Partido enfadado"
 STATIC_MODIFIER_DESC_cc_pty_member_angry: "El partido de este ministro es abiertamente hostil al gobierno, y se espera que el ministro lo demuestre."
 STATIC_MODIFIER_NAME_cc_pty_comp_stacked: "Gabinete concentrado"
 STATIC_MODIFIER_DESC_cc_pty_comp_stacked: "Un solo partido posee más de la mitad de los escaños del gabinete. El gabinete trabaja como uno solo, y los demás partidos lo notan."
 STATIC_MODIFIER_NAME_cc_pty_comp_balanced: "Gabinete equilibrado"
 STATIC_MODIFIER_DESC_cc_pty_comp_balanced: "Ningún partido posee más del 40% de los escaños del gabinete. Todos los partidos tienen voz y ninguno se siente excluido."
 STATIC_MODIFIER_NAME_cc_pty_regional_concession: "Derechos provinciales"
 STATIC_MODIFIER_DESC_cc_pty_regional_concession: "Se concedieron a las provincias sus antiguos derechos para poner fin a un levantamiento, y por ello la autoridad de la capital llega menos lejos."
 cc_pty_tt_bribe_effect: "La satisfacción de este partido aumenta en 25."
 cc_pty_tt_attack_effect: "La fuerza de este partido cae un 40% durante cinco años y su satisfacción en 30. Los partidos opuestos a él ganan 10 de satisfacción."
 cc_pty_tt_favour_effect: "Recibimos el favor de este partido durante cinco años. Su satisfacción cae en 15."
 cc_pty_tt_refuse_agenda: "El partido abandona su agenda y pierde 15 de satisfacción."
 cc_pty_tt_defect: "[cc_pty_defector.GetName] se une al [ROOT.GetCountry.Custom('cc_pty_defect_to_name')]."
 cc_pty_tt_military_concede: "Los halcones ganan 60 de satisfacción."
 cc_pty_tt_military_purge: "La fuerza de los Halcones disminuye en un 40% durante diez años y pierden 20 de satisfacción."
 cc_pty_tt_liberal_concede: "Los Liberales ganan 20 de satisfacción."
 cc_pty_tt_liberal_purge: "La fuerza de los Liberales disminuye en un 40% durante diez años y pierden 20 de satisfacción."
 cc_pty_tt_regional_concede: "Los particularistas ganan 50 de satisfacción."
 cc_pty_tt_regional_sat_30: "Los particularistas ganan 30 de satisfacción."
 cc_pty_tt_regional_sat_40: "Los particularistas ganan 40 de satisfacción."
 CC_PTY_LABEL_TOP_AGENDA: "Agenda:"
 CC_PTY_TOP_AGENDA_TT: "La agenda del partido dominante o, si no tiene ninguna, la de otro partido. Cada carta muestra la agenda de su propio partido."
 CC_PTY_NO_TOP_AGENDA: "Ningún partido tiene una agenda"
 CC_PTY_CHAMBER_TT: "El tamaño de la cámara. Crece con el reino, desde 20 asientos hasta un máximo de 84, y se reparte entre los partidos según los asientos que sus estamentos posean en todo el reino."
 CC_PTY_SEATS_TT: "Escaños poseídos por este partido: aquellos que sus estamentos poseen en todo el reino, más 2 por cada uno de sus ministros en el gabinete. Su poder es su proporción en la cámara."
 CC_PTY_CARD_SELECT_TT: "Selecciona este partido. Los botones de abajo actúan sobre el partido seleccionado."
 CC_PTY_LABEL_LEADER: "Líder"
 CC_PTY_NO_LEADER: "Sin líder"
 CC_PTY_NO_LEADER_TT: "El partido no tiene ningún ministro en el gabinete. En nuestro reino, un líder dará un paso adelante en la próxima revisión."
 CC_PTY_SELECT_HINT: "Selecciona un partido para actuar sobre él."
 CC_PTY_BTN_APPOINT: "Nombrar líder"
 CC_PTY_BTN_CONCEDE: "Conceder"
 CC_PTY_BTN_ELECTION: "Convocar elecciones"
 cc_pty_election: "Convocar una elección"
 cc_pty_election_desc: "Disuelve la cámara y cuenta los escaños ahora, en lugar de en la próxima revisión. Los partidos que hayan perdido su base pueden ser reemplazados. Una vez cada diez años."
 cc_pty_tt_appoint_effect: "El líder del partido ocupa un asiento en el gabinete, sustituyendo al ministro menos veterano de otro partido si no hay asientos disponibles."
 cc_pty_tt_concede_effect: "La agenda se considera cumplida: este partido gana 30 de satisfacción y nosotros ganamos influencia política igual a la mitad de sus escaños. Cada partido opuesto a ella pierde 10."
 cc_pty_tt_election_effect: "Se vuelven a contar los escaños y se revisan los partidos ahora. Ganamos 2 de influencia política por cada escaño que gane el partido del jefe del gabinete, y perdemos 1 por cada escaño que pierda."
 cc_pty_tt_appoint_leader: "El partido tiene un líder vivo"
 cc_pty_tt_appoint_not_seated: "El líder no está ya en el gabinete"
 cc_pty_tt_concede_agenda: "El partido tiene una agenda"
 cc_pty_tt_election_cooldown: "No se han convocado elecciones en los últimos diez años"
 cc_pty_factions: "Facciones"
 cc_pty_factions_desc: "Los partidos del reino, cuánto poder ostenta cada uno y qué tan bien consideran que están siendo tratados."
 CC_PTY_FX_HEADER: "Lo que concede"
 CC_PTY_FX_HEADER_TT: "Todo lo que el partido seleccionado puede hacer por el reino. Las cartas a todo color se aplican ahora, con los valores mostrados. Las cartas desvanecidas no se aplican; sus valores están a fuerza total, como referencia."
 CC_PTY_FX_STRENGTH_TT: "Fuerza actual. El 100% es la fuerza total: para el prestigio, una cuarta parte de la cámara; para la buena voluntad y el descontento, una cuarta parte de la cámara con satisfacción 50 o -50; para el liderazgo, un gabinete mixto."
 CC_PTY_FX_STANDING: "Prestigio"
 CC_PTY_FX_STANDING_TT: "Otorgado por cada partido con una décima parte de los escaños o más, independientemente de su estado de ánimo. Escala según su proporción en la cámara."
 CC_PTY_FX_MARGINAL: "Marginado"
 CC_PTY_FX_MARGINAL_TT: "Se aplica mientras el partido posea menos de una décima parte de la cámara: el estamento que lo respalda se siente ignorado."
 CC_PTY_FX_GOODWILL: "Buena voluntad"
 CC_PTY_FX_DISCONTENT: "Descontento"
 CC_PTY_FX_PUSH: "Ascendente"
 CC_PTY_FX_FAVOUR: "Favor"
 CC_PTY_FX_FAVOUR_TT: "Un favor que este partido concedió al ser solicitado. Dura cinco años."
 CC_PTY_TARGET_TT: "Lo que el partido espera. Cada revisión mueve su satisfacción la mitad del camino hacia ese valor, y en la tarjeta del partido la flecha muestra hacia dónde se mueve. Selecciona el partido para ver qué contribuye a ello: las primeras tres filas son lo que este partido vigila en el reino (pasa el ratón sobre una para ver cómo moverla), el resto proviene del gabinete."
 CC_PTY_MAJORITY: "#P Mayoría operativa#!"
 CC_PTY_MAJORITY_TT: "El partido del jefe del gabinete posee el 40% de los escaños o más: +15% de ganancia de influencia política."
 CC_PTY_HUNG: "#N Cámara fragmentada#!"
 CC_PTY_HUNG_TT: "Ningún partido posee el 30% de los escaños: -10% de ganancia de influencia política."
 CC_PTY_LABEL_LEADERS_IN: "Líderes en el cargo:"
 CC_PTY_LEADERS_IN_TT: "Partidos cuyo líder está en el gabinete. Cada uno otorga +0.05 de influencia política mensual."
 STATIC_MODIFIER_NAME_cc_pty_leaders_in_office: "Líderes de partido en el cargo"
 STATIC_MODIFIER_DESC_cc_pty_leaders_in_office: "Los líderes de partido que están en el gabinete traen consigo el apoyo de sus partidos. Escala con el número de partidos cuyo líder ocupa un cargo."
 STATIC_MODIFIER_NAME_cc_pty_working_majority: "Mayoría operativa"
 STATIC_MODIFIER_DESC_cc_pty_working_majority: "El partido del jefe del gabinete posee al menos el 40% de la cámara, y los asuntos del gobierno se aprueban."
 STATIC_MODIFIER_NAME_cc_pty_hung_chamber: "Cámara fragmentada"
 STATIC_MODIFIER_DESC_cc_pty_hung_chamber: "Ningún partido posee siquiera el 30% de la cámara, y cada medida tiene que ser negociada."
 cc_pty_liberal_rebels: "Clubes Constitucionales"
 cc_pty.42.c: "Esperar y ver."
 cc_pty.47.title: "La Corona debe responder"
 cc_pty.47.desc: "Los clubes han superado a las plazas. Sus líderes se sientan como una asamblea permanente, los gremios recaudan impuestos en su nombre y la guarnición ya no marchará contra ellos. Exigen una constitución escrita. El gobierno puede concederla o intentar recuperar las ciudades por la fuerza."
 cc_pty.47.a: "Conceder la constitución."
 cc_pty.47.b: "No permitiremos que nos dicten."
 cc_pty.47.b.tt: "Una facción rebelde toma las provincias de nuestras ciudades más liberales, hasta aproximadamente una sexta parte del reino y nunca la capital, y comienza una guerra civil."
 cc_pty.48.title: "Los clubes perduran"
 cc_pty.48.desc: "Las multitudes se han dispersado y las plazas están abiertas de nuevo, pero no se ha resuelto nada. Los clubes siguen reuniéndose, sus periódicos siguen circulando y la próxima disputa con el gobierno los encontrará preparados."
 cc_pty.48.a: "Al menos está tranquilo."
 cc_pty.70.title: "La guerra de los panfletos"
 cc_pty.70.desc: "Las imprentas de los clubes funcionan día y noche. Cada semana llega un nuevo panfleto sobre los derechos de los ciudadanos y los fallos del gobierno, y se leen en voz alta en todas las tabernas."
 cc_pty.70.a: "Censurar la prensa."
 cc_pty.70.b: "Responderles por escrito."
 cc_pty.70.c: "Permitir que impriman."
 cc_pty.71.title: "Una petición al trono"
 cc_pty.71.desc: "Una delegación de ciudadanos respetables ha traído una petición a las puertas del palacio, firmada por miles de personas. Piden presentarla en persona."
 cc_pty.71.a: "Recibir a los peticionarios."
 cc_pty.71.b: "Recházalos."
 cc_pty.72.title: "Soldados entre la multitud"
 cc_pty.72.desc: "Hombres de la guarnición de la ciudad, con meses de retraso en su paga, han sido vistos en las reuniones de los clubes. Sus oficiales informan que es posible que no obedezcan una orden de despejar las calles."
 cc_pty.72.a: "Pagar los atrasos de la guarnición."
 cc_pty.72.b: "Traer regimientos leales."
 cc_pty.72.c: "Dejarlos estar."
 cc_pty.73.title: "Las tiendas cierran"
 cc_pty.73.desc: "Los gremios han cerrado sus tiendas en apoyo a los clubes. Los mercados están vacíos y las aduanas no recaudan nada."
 cc_pty.73.a: "Reunirse con los gremios."
 cc_pty.73.b: "Rompere la huelga."
 cc_pty.74.title: "Un mártir"
 cc_pty.74.desc: "Un orador de un club arrestado el mes pasado ha muerto en custodia. Su funeral atrajo a la multitud más grande que la ciudad haya visto, y su nombre ahora está pintado en las paredes."
 cc_pty.74.a: "Realizar una investigación pública."
 cc_pty.74.b: "Culpar a agitadores extranjeros."
 cc_pty.75.title: "Los moderados ofrecen condiciones"
 cc_pty.75.desc: "Los líderes de los clubes más cautos han enviado aviso de que se conformarían con menos que una constitución: voz en la tributación y protección contra arrestos arbitrarios. Los radicales lo llamarán traición, pero muchos seguirían a los moderados a casa."
 cc_pty.75.a: "Aceptar sus términos."
 cc_pty.75.b: "Resistir para obtener más."
 STATIC_MODIFIER_NAME_cc_pty_liberal_constitution: "Constitución"
 STATIC_MODIFIER_DESC_cc_pty_liberal_constitution: "La corona concedió una constitución para poner fin a un levantamiento liberal. Sus poderes están limitados por ley y las ciudades tienen voz en el gobierno."
