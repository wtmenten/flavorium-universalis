 cc_pty_lu_tt_down_15: "El impulso del levantamiento disminuye en 15."
 cc_pty_lu_tt_down_25: "El impulso del levantamiento disminuye en 25."
 cc_pty_lu_tt_up_5: "El impulso del levantamiento aumenta en 5."
 cc_pty_lu_tt_up_8: "El impulso del levantamiento aumenta en 8."
 cc_pty_lu_tt_up_10: "El impulso del levantamiento aumenta en 10."
 cc_pty_lu_tt_up_12: "El impulso del levantamiento aumenta en 12."
 cc_pty_lu_tt_repressed: "Los clubes recuerdan el uso de la fuerza: el impulso aumenta 0,5 más rápido cada mes durante el resto del levantamiento y podría surgir un mártir."
 cc_pty_lu_tt_repression_lifted: "El recuerdo de la fuerza se desvanece: el impulso ya no aumenta más rápido por ello."
 cc_pty_lu_end_defused_tt: "El impulso del levantamiento ha caído a 0"
 cc_pty_lu_end_boiled_tt: "El impulso del levantamiento ha alcanzado 100 (la corona debe responder)"
 CC_PTY_LU_MOMENTUM: "Impulso del levantamiento: #high [FixedPointToInt(Player.MakeScope.GetVariable('cc_pty_lu_momentum').GetValue)]#! / 100"
 CC_PTY_LU_MOMENTUM_TT: "Aumenta en 1 al mes mientras no se haga nada, más 0,5 cada vez que los clubes recuerden el uso de la fuerza y mientras la estabilidad sea negativa. Disminuye en 1,5 mientras la satisfacción esperada de los liberales sea 0 o superior, y en 0,5 por cada ministro liberal en el gabinete, si la sociedad está en 30 o más hacia el liberalismo y si hay límites de mandato en vigor. En 0 el levantamiento termina; en 100 la corona debe conceder una constitución o luchar."
 cc_pty_liberal_uprising_desc: "Los clubes liberales están en las calles. Quieren una constitución, límites para la corona y voz en el gobierno, y no volverán a casa sin conseguir algo de ello.\n\nEl levantamiento tiene un impulso, mostrado arriba, que comienza en 60. Aumenta en 1 al mes mientras no se haga nada. Disminuye una vez que se aborde la demanda de los liberales: su satisfacción esperada en 0 o más, un ministro liberal en el gabinete, la sociedad en 30 o más hacia el liberalismo, o límites de mandato en vigor. Los eventos durante el levantamiento lo desplazan aún más. En 0, el levantamiento termina. En 100, la corona debe conceder una constitución o luchar en una guerra civil. Después de cinco años, termina sin resolverse."
 cc_pty.42.desc: "Los clubes de los Liberales han convocado a sus miembros. Hay multitudes en las plazas, demandas impresas en cada puerta y soldados que no están seguros de en qué bando estar.\n\nNinguna respuesta única los hará volver a casa. El levantamiento comienza con un impulso de 60 y seguirá aumentando hasta que se aborde su demanda. Al llegar a 0 termina; al llegar a 100, la corona deberá conceder una constitución o luchar."
 CC_PTY_FX_ON: "#P Activo#!"
 CC_PTY_FX_STANDING_OFF: "Necesita una décima parte de los escaños"
 CC_PTY_FX_MARGINAL_OFF: "Menos de una décima parte de los escaños"
 CC_PTY_FX_GOODWILL_OFF: "Satisfacción superior a 30"
 CC_PTY_FX_GOODWILL_MEMBERS: "Sus ministros también trabajan un 5% mejor."
 CC_PTY_FX_DISCONTENT_OFF: "Satisfacción inferior a -20"
 CC_PTY_FX_DISCONTENT_MEMBERS: "Sus ministros también trabajan un 10% peor, o un 20% peor por debajo de -50."
 CC_PTY_FX_PUSH_OFF: "Partido más fuerte, 30% de los escaños"
 CC_PTY_FX_FAVOUR_OFF: "Pedir un favor al partido"
 CC_PTY_FX_ESC1: "Advertencia"
 CC_PTY_FX_ESC1_OFF: "Enojados y poderosos en una revisión"
 CC_PTY_FX_ESC2: "Agitación"
 CC_PTY_FX_ESC2_OFF: "Enojados y poderosos en dos revisiones"
 CC_PTY_EXP_TITLE: "Lo que espera"
 CC_PTY_EXP_CABINET: "Ministros en el gabinete"
 CC_PTY_EXP_CABINET_TT: "+5 para uno de sus ministros en el gabinete, +25 para dos o más. -20 si no hay ninguno mientras ostente una quinta parte de los escaños o más."
 CC_PTY_EXP_HEAD: "Jefe del gabinete"
 CC_PTY_EXP_HEAD_TT: "+15 mientras el jefe del gabinete pertenezca a este partido."
 CC_PTY_EXP_RULER: "El gobernante"
 CC_PTY_EXP_RULER_TT: "+10 mientras el gobernante pertenezca a este partido."
 CC_PTY_EXP_COMP: "Forma del gabinete"
 CC_PTY_EXP_COMP_TT: "En un gabinete apilado, +10 para el partido que lo dirige y -10 para todos los demás. En un gabinete equilibrado, la expectativa nunca cae por debajo de -20."
 CC_PTY_CARD_FX_TT: "Todo lo que este partido aplica ahora al reino, sumado por modificador: su prestigio, su buena voluntad o descontento, su ventaja, cualquier favor concedido y cualquier escalada. Selecciona el partido para ver el desglose."
 CC_PTY_ESC_1_TT: "#N Advertencia.#! Este partido está enfurecido y posee un 20% de poder o más: ha pasado una revisión así. Otra traerá agitación, y una tercera el resultado. Aumenta su satisfacción por encima de -50 o reduce su poder por debajo del 20% para hacer que retroceda de nivel."
 CC_PTY_ESC_2_TT: "#N Agitación.#! Este partido está enfurecido y posee un 20% de poder o más, y ha estado así durante dos revisiones. Una más y actuará. Aumenta su satisfacción por encima de -50 o reduce su poder por debajo del 20% para hacer que retroceda de nivel."
 CC_PTY_LEADERS_NONE: "Ninguno"
 CC_PTY_LEDGER_XP_OFF: "La experiencia del gabinete está desactivada para esta partida, por lo que el Libro de la Corte no tiene pestañas de plantilla o de corte. Los partidos de tu reino y la cámara se encuentran en la pestaña de Facciones."
