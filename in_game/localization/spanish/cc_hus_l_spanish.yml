l_spanish:
 ########################################
 # cc_hus.1 — The Pope Calls for Aid
 ########################################
 cc.hus.1.title: "Con un solo pequeño préstamo de nuestro padre..."
 cc.hus.1.desc: "La guerra ha estallado entre Roma y Bohemia. [current_pope.GetName] ha alzado su estandarte contra la herejía husita, haciendo un llamado a todos los príncipes católicos fieles para que respondan. El resultado de esta lucha dará forma al alma de la cristiandad, y nuestra respuesta será recordada tanto en Roma como en Praga."
 cc.hus.1.a: "Estamos con el Santo Padre. Nuestras armas son Suyas."
 cc.hus.1.b: "Acepta las monedas papales y retírate de esta guerra."
 cc.hus.1.c: "No nos dejaremos comprar. Nuestra causa prevalece."
 cc.hus.1.d: "Emprender la cruzada. Unirse a la guerra del Papa contra la herejía."
 cc.hus.1.e: "Esta no es nuestra guerra. Dejemos que Roma libre sus propias batallas."
