 cc_xp_studio_visit: "Visitar el Estudio"
 cc_xp_studio_visit_desc: "Visitar a un artista en su trabajo y decidir qué hará la corona con lo que encuentre."
 cc_xp_studio_visit_concept: "[cabinet|e]"
 cc_xp_choose_studio: "¿Qué artista?"
 cc_xp_tt_needs_studio: "Requiere un artista en la corte que no haya sido visitado en los últimos tres años"
 cc_xp_none_studio: "@trigger_no! No hay ningún artista en la corte disponible para una visita."
 cc_xp.70.title: "El Estudio"
 cc_xp.70.desc.working: "[cc_xp_artist.GetName] está trabajando cuando llegas, y continúa trabajando un rato antes de reconocer que estás allí. La obra está lo suficientemente avanzada como para ver qué será, pero no lo suficiente como para estar seguro de que será buena.\n\nLa corona puede pagar lo que la obra realmente necesita, o puede dejarse claro que la corte espera ver la pieza terminada."
 cc_xp.70.desc.idle: "[cc_xp_artist.GetName] no tiene nada en el caballete. Hay bocetos, excusas y un largo recuento de lo que costaron los materiales del último encargo.\n\nUn artista en la corte sin trabajo entre manos es un artista al que la corte paga por pensar."
 cc_xp.70.a: "Pagar lo que la obra requiera."
 cc_xp.70.b: "Dejar claro que la corte espera que esté terminado."
 cc_xp.70.c: "Asignarles un tema a cargo de la corona."
 cc_xp.70.d: "Mirar, no decir nada e irse."
 cc_xp.71.title: "La Inauguración"
 cc_xp.71.desc.unfinished: "La fecha se fijó hace meses y la sala ya está preparada. La obra no.\n\n[cc_xp_artist.GetName] no tiene prisa y explica detalladamente que la alternativa habría sido una pintura peor."
 cc_xp.71.desc.finished: "Está terminado, está colgado y la corte desfila ante él.\n\nIndependientemente de lo que se le haya pagado a [cc_xp_artist.GetName], la obra ahora pertenece al reino."
 cc_xp.71.a: "Que se tomen su tiempo."
 cc_xp.71.b: "Mostrarla a la corte."
 cc_xp.80.title: "Un alumno para [cc_xp_mentor.GetName]"
 cc_xp.80.desc: "[cc_xp_mentor.GetName] ha aceptado recibir a alguien. No es poca cosa pedírselo a un ministro con un departamento que dirigir, y la oferta no permanecerá abierta indefinidamente.\n\nQuien sea elegido pasará la próxima década aprendiendo el oficio de [cc_xp_mentor.GetSheHe], y crecerá en la disciplina de [cc_xp_mentor.GetHisHer] en lugar de en la suya propia."
 cc_xp.80.a: "[cc_xp_pupil_1.GetName]"
 cc_xp.80.b: "[cc_xp_pupil_2.GetName]"
 cc_xp.80.c: "[cc_xp_pupil_3.GetName]"
 cc_xp.80.d: "[cc_xp_pupil_4.GetName]"
 cc_xp.81.title: "Un puesto para [cc_xp_envoy.GetName]"
 cc_xp.81.desc: "[cc_xp_envoy.GetName] será enviado como residente. El hogar está contratado, los gastos acordados y solo queda decir a dónde.\n\nUn residente se marcha durante años. Lo que construyan en ese tiempo desplaza la dimensión del vínculo que toca su propia disciplina, por lo que un administrador, un diplomático y un soldado son tres puestos genuinamente diferentes."
 cc_xp.81.a: "La corte de [cc_xp_court_1.GetName]"
 cc_xp.81.b: "La corte de [cc_xp_court_2.GetName]"
 cc_xp.81.c: "La corte de [cc_xp_court_3.GetName]"
 cc_xp.81.d: "La corte de [cc_xp_court_4.GetName]"
 cc_xp.82.title: "Un lugar para [cc_xp_school_student.GetName]"
 cc_xp.82.desc: "Las tasas están pagadas y la carta de presentación está escrita. Solo necesita una dirección.\n\nUn miembro de una escuela progresa en la disciplina de dicha escuela cada año, ya sea que ocupe un cargo o no."
 cc_xp.82.a: "La escuela fundada por [Player.MakeScope.GetVariable('cc_xp_school_1_founder').GetCharacter.GetName]"
 cc_xp.82.b: "La escuela fundada por [Player.MakeScope.GetVariable('cc_xp_school_2_founder').GetCharacter.GetName]"
 cc_xp.82.c: "La escuela fundada por [Player.MakeScope.GetVariable('cc_xp_school_3_founder').GetCharacter.GetName]"
 cc_xp.83.title: "Un mecenas para [cc_xp_artist.GetName]"
 cc_xp.83.desc: "La corona ha decidido que vale la pena conservar a [cc_xp_artist.GetName]. Sin embargo, el mecenazgo no depende solo del dinero de la corona: quiere un nombre asociado, y ese nombre debe pertenecer a alguien con la suficiente posición en la corte para que signifique algo.\n\nQuien sea será presentado durante los próximos veinticinco años como la persona que descubrió a [cc_xp_artist.GetName], y será mejor diplomático gracias a ello."
 cc_xp.83.a: "[cc_xp_patron_1.GetName]"
 cc_xp.83.b: "[cc_xp_patron_2.GetName]"
 cc_xp.83.c: "[cc_xp_patron_3.GetName]"
 cc_xp.83.d: "[cc_xp_patron_4.GetName]"
 cc_xp.84.title: "Una venta discreta"
 cc_xp.84.desc: "Hay un comprador, y el comprador no hace preguntas, y tampoco las hace nadie más siempre que se haga correctamente.\n\nLas piezas más valiosas de las que la colección podría desprenderse decentemente se enumeran a continuación, junto con lo que se estima que vale cada una. Una venta discreta reporta menos que una abierta, y el precio de una pieza depende de su calidad y de cuánto peso tenga el nombre de la cultura que la produjo. La corte notará qué pared queda vacía."
 cc_xp.84.a: "[cc_xp_work_1.GetName], de [cc_xp_work_1.GetCreatorName]: [cc_xp_work_1.GetQualityName] ([cc_xp_work_1.GetQuality|Y]%)"
 cc_xp.84.b: "[cc_xp_work_2.GetName], de [cc_xp_work_2.GetCreatorName]: [cc_xp_work_2.GetQualityName] ([cc_xp_work_2.GetQuality|Y]%)"
 cc_xp.84.c: "[cc_xp_work_3.GetName], de [cc_xp_work_3.GetCreatorName]: [cc_xp_work_3.GetQualityName] ([cc_xp_work_3.GetQuality|Y]%)"
 cc_xp.84.d: "[cc_xp_work_4.GetName], de [cc_xp_work_4.GetCreatorName]: [cc_xp_work_4.GetQualityName] ([cc_xp_work_4.GetQuality|Y]%)"
 cc_xp.84.e: "No vender nada."
 cc_xp.85.title: "Digno de observar"
 cc_xp.85.desc: "La corona tiene dinero y atención para dedicar a alguien que aún no ocupa un cargo. La corte tiene opiniones sobre quién debería ser, y la nobleza tiene opiniones sobre el hecho de que la corona tenga opiniones.\n\nUn protegido acumula experiencia lentamente mientras espera, puede ser enviado a formarse y puede recibir un mentor. El objetivo es tener un sucesor listo antes de que quede una vacante."
 cc_xp.85.a: "[cc_xp_cand_1.GetName]"
 cc_xp.85.b: "[cc_xp_cand_2.GetName]"
 cc_xp.85.c: "[cc_xp_cand_3.GetName]"
 cc_xp.85.d: "[cc_xp_cand_4.GetName]"
 cc_xp_tt_needs_free_university: "Una universidad que aún no alberga una escuela"
