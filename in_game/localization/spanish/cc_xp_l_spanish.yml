 cc_xp.90.title: "Una carrera para [cc_xp_subject.GetName]"
 cc_xp.90.desc: "[cc_xp_subject.GetName] ha regresado de la cancillería con una aptitud y ningún puesto donde aplicarla. Los escribanos superiores tienen opiniones sobre dónde sería más útil [cc_xp_subject.GetSheHe], al igual que todos los demás que se han enterado.\n\nLo que se decide ahora es una carrera, no una competencia. Empezará desde abajo y ascenderá a medida que gane la experiencia administrativa necesaria para hacerlo."
 cc_xp.90.a: "El camino del reformador. Asígnale el libro de estatutos."
 cc_xp.90.b: "La tesorería. Asígnale las cuentas."
 cc_xp.90.c: "El camino del erudito. Deja que lea."
 cc_xp.90.d: "El constructor. Envíalo a inspeccionar la capital."
 cc_xp.90.e: "El jurista. Asígnale los tribunales."
 cc_xp.90.f: "El integrador. Asígnale las nuevas provincias."
 cc_xp.91.title: "Una carrera para [cc_xp_subject.GetName]"
 cc_xp.91.desc: "[cc_xp_subject.GetName] ha regresado del circuito de embajadas sabiendo con qué embajadores vale la pena hablar y cuáles están simplemente bien vestidos. Eso es un comienzo, pero aún no es un cargo.\n\nLo que se decide ahora es una carrera, no una competencia. Empezará desde abajo y ascenderá a medida que gane la experiencia diplomática necesaria para hacerlo."
 cc_xp.91.a: "El ascenso del diplomático. Asígnale una legación."
 cc_xp.91.b: "La mano colonial. Envíalo a las estaciones remotas."
 cc_xp.91.c: "El camino del mercader. Vincúlalo a la casa comercial."
 cc_xp.91.d: "El navegante. Ponlo a bordo de algo."
 cc_xp.91.e: "La sombra. No escribas lo que hace."
 cc_xp.92.title: "Una carrera para [cc_xp_subject.GetName]"
 cc_xp.92.desc: "[cc_xp_subject.GetName] ha regresado del colegio de estado mayor con opiniones; la mayoría prestadas y una o dos propias [cc_xp_subject.GetHisHer]. El ejército tiene lugar para [cc_xp_subject.GetHimHer] en varios sitios y una fuerte preferencia por decidir cuál.\n\nLo que se decide ahora es una carrera, no una competencia. Empezará desde abajo y ascenderá a medida que gane la experiencia militar necesaria para hacerlo."
 cc_xp.92.a: "El endurecimiento militar. Vincúlalo a un estado mayor de campo."
 cc_xp.92.b: "El maestro de instrucción. Asígnale un campo de desfile."
 cc_xp.92.c: "El ingeniero. Asígnale las fortificaciones."
 cc_xp.92.d: "La caballería. Asígnale el depósito de remontas."
 cc_xp.90.g: "Ninguno de estos conviene. Déjalo por ahora."
 cc_xp.91.f: "Ninguno de estos conviene. Déjalo por ahora."
 cc_xp.92.e: "Ninguno de estos conviene. Déjalo por ahora."
