 cc_xp_recall_envoy: "Retirar a un residente"
 cc_xp_recall_envoy_desc: "Finaliza un puesto prematuramente y trae al ministro a casa. Cualquier relación establecida se mantiene: un vínculo es un registro de lo ocurrido, no un modificador que estés alquilando."
 cc_xp_recall_envoy_desc_specific: "[SCOPE.sCharacter('recipient').GetName] será retirado de su puesto y regresará al gabinete."
 cc_xp_recall_envoy_act: "$cc_xp_recall_envoy$"
 cc_xp_recall_envoy_past: "Se ha retirado a un residente"
 cc_xp_recall_envoy_act_past: "[SCOPE.sCharacter('recipient').GetName] está de camino a casa."
 cc_xp_choose_recalled: "¿Quién regresa a casa?"
 cc_xp.60.title: "El enviado escribe"
 cc_xp.60.a: "Actúa al respecto. Que vean que leemos lo que nos envían."
 cc_xp.60.b: "Archívalo. Nuestro hombre aprende más guardando silencio."
 cc_xp.61.title: "El enviado se extralimita"
 cc_xp.61.a: "Apóyalos. El hombre de la corona es el hombre de la corona."
 cc_xp.61.b: "Pedir disculpas. Públicamente y con cierto detalle."
 cc_xp.62.title: "Un favor pedido"
 cc_xp.62.a: "Concédela. Es raro comprar la buena voluntad tan barata."
 cc_xp.62.b: "Que nuestro hombre explique, amablemente, por qué no."
 cc_xp_found_institution_desc: "Establece una escuela de pensamiento permanente bajo el mando de un ministro veterano, cuya propia disciplina se convertirá en la de la escuela. Todos los inscritos a partir de entonces progresarán en esa disciplina cada año, estén en el cargo o no.\n\nUn reino puede tener como máximo tres: la primera requiere una universidad en la capital, la segunda el avance de Órdenes Eruditas y la tercera Administración Iluminada. Por diseño, están separadas por un siglo."
 cc_xp_host_soiree_desc: "Haz que un ministro abra la temporada con una velada en la corte. Esto alquila el salón; lo que la velada cuesta realmente, y para quién es, se decide esa misma noche.\n\nSiempre ocurre algo en estos eventos. Qué tipo de cosa depende de cuánto hayas gastado."
 cc_xp.50.desc: "El salón está alquilado, las invitaciones enviadas y [cc_xp_host.GetName] está en medio preguntando algo cuya respuesta cuesta dinero: ¿para quién es realmente esta velada?\n\nLas grandes familias esperan ser invitadas. Las casas mercantiles y los hombres de la universidad se sentirían halagados de serlo, y lo recordarían por más tiempo. Y hay una tercera opción que no agradará a nadie, que es limitar la lista de invitados a personas de las que la corona realmente necesite algo."
 cc_xp.52.desc: "[cc_xp_subject.GetName] y [cc_xp_other.GetName] quedaron sentados juntos por accidente y seguían hablando cuando los músicos recogieron sus cosas.\n\nSea lo que sea que hayan encontrado el uno en el otro, ha sobrevivido al contacto con la mañana siguiente. Se les ha visto juntos dos veces desde entonces, y ambos están trabajando mejor gracias a ello."
 cc_xp.53.desc: "No está claro cuánto había bebido [cc_xp_subject.GetName], y ahora apenas importa. Lo que importa es que se dijo en una habitación con cuarenta personas, y que al menos seis de ellas entendieron exactamente qué se estaba admitiendo.\n\nLa historia ya está cobrando fuerza. Puede comprarse, o puede dejarse correr hasta que muera en una temporada, que es la opción más barata y la más humillante."
 cc_xp.54.desc: "[cc_xp_subject.GetName] ha estado en la corte durante años, sin ocupar ningún cargo ni atraer la atención, y pasó una hora esta noche explicándole algo a un ministro que anteriormente no había pensado que hubiera nada que explicar.\n\nNadie los había mirado adecuadamente jamás. Ahora eso es una decisión en lugar de un descuido."
 cc_xp.55.desc.nobles: "Tres de las grandes familias se han concertado para estar juntas cerca de la puerta, lo cual en este tipo de eventos nunca es un accidente. Tienen una queja sobre la precedencia y han elegido la velada en la que rechazarlas sería conspicuo.\n\nSe conformarán con dinero, como suelen hacer."
 cc_xp.55.desc.burghers: "Las casas mercantiles han enviado a su hombre más razonable, que es como sabes que la petición no es razonable. Espera hasta que la sala esté medio vacía, elogia el vino y explica lo que los gremios desearían.\n\nCostaría algo. También sería recordado."
 cc_xp.55.desc.clergy: "El obispo ha estado merodeando durante una hora y finalmente sorprende a la corona entre una conversación y la siguiente. Hay un asunto sobre una fundación, y sobre quién la paga.\n\nEstá totalmente dispuesto a que se le rechace. Simplemente preferiría que no fuera así."
 cc_xp_second_to_subject_desc: "Envía a un ministro a uno de tus súbditos como residente. Desaparecerán de tu gabinete durante años, crecerán considerablemente mientras estén allí y la relación que construyan moverá el vínculo de ese súbdito cada año.\n\nQué vínculo depende de a quién envíes. Un administrador profundiza la relación política, un diplomático la personal y un soldado la militar."
 cc_xp.60.desc: "El despacho de [cc_xp_subject_court.GetName] se extiende por once páginas, lo cual es síntoma de minuciosidad o de soledad. Enterrado en medio hay algo útil: quién en esa corte es escuchado realmente y quién simplemente habla primero.\n\nSe puede actuar al respecto, lo cual será notado, o archivarlo, lo cual no lo será."
 cc_xp.61.desc: "Nuestro residente en [cc_xp_subject_court.GetName] ha dado una instrucción. No una sugerencia, ni una petición transmitida en nombre de la corona: una instrucción, a un ministro de una corte que no es la nuestra, delante de la gente.\n\nProbablemente tenían razón. Esa no es la dificultad. La dificultad es que ahora todos allí saben exactamente qué opina la corona de ellos, y están esperando a ver si lo decimos en voz alta."
 cc_xp.62.desc: "A [cc_xp_subject_court.GetName] le han llevado tres años de hospitalidad llegar a esto, lo que sugiere que hablan en serio. La petición llegó a través de nuestro propio residente, con cautela, durante la cena, de la manera en que se hacen estas cosas cuando debe seguir siendo posible la negativa.\n\nQuieren dinero. Han sido discretos al pedirlo."
 cc_xp_enroll_in_school: "Matricular en una escuela"
 cc_xp_enroll_in_school_desc: "Coloca a un ministro o protegido en una escuela existente. A partir de entonces, ganarán la disciplina de esa escuela cada año.\n\nPara esto sirven los protegidos: los años dedicados a absorber una disciplina mientras esperan un puesto significan que llegan al gabinete ya orientados hacia sus escalas, en lugar de empezar de cero."
 cc_xp_enroll_in_school_desc_specific: "[SCOPE.sCharacter('recipient').GetName] se unirá a una de las escuelas del reino y ganará su disciplina cada año a partir de entonces. Usted elige cuál."
