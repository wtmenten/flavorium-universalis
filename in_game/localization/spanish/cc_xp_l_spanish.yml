 cc_xp_protege_tt_taken: "Entra bajo el cuidado de la corona como protegido, ganando experiencia cada año y siendo apto para entrenamiento, mentoría y una escuela"
 cc_xp_protege_tt_noble: "De la nobleza, que no se ofende de que uno de los suyos sea ascendido"
 cc_xp_protege_tt_outsider: "Que no sea de la nobleza, que resiente que la corona se interese por alguien que ellos no hayan avalado"
 cc_xp_protege_tt_burghers: "De los burgueses, cuya casa financia todo el coste de su ascenso"
 cc_xp_protege_tt_peasants: "Del campesinado, cuya comunidad cubre la mitad del coste entre todos"
 cc_xp_protege_tt_clergy: "Del clero, y la iglesia recompensa a la corona con prestigio en lugar de moneda"
 cc_xp_protege_tt_clergy_none: "Del clero, aunque nuestra fe no mantiene ninguna medida de influencia con la que la iglesia pueda recompensarnos"
