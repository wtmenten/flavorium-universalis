l_spanish:
 # === cc_bonds.30 — The Palatinate Lord's First Homage ===
 cc_bonds.30.title: "El primer homenaje del señor del Palatinado"
 cc_bonds.30.desc: "El señor de [bond_subj.GetName] aguarda la confirmación de su posición bajo el nuevo acuerdo. La cuestión que tenemos delante es de ceremonia: ¿recibiremos su juramento en un entorno público formal que anuncie al mundo la naturaleza de nuestra relación, o manejaremos los asuntos con la discreta reserva del protocolo privado? La elección parece administrativa. No lo es."
 cc_bonds.30.a: "Una ceremonia grandiosa. Que toda la corte sea testigo de su fidelidad."
 cc_bonds.30.b: "Un juramento privado. Formalidades observadas, sin teatralidad."
 cc_bonds.30.c: "Prescindamos totalmente de la ceremonia. Sabemos dónde residen sus lealtades."

 # === cc_bonds.31 — Noble Marriage Alliance ===
 cc_bonds.31.title: "Alianza matrimonial noble"
 cc_bonds.31.desc: "El señor del palatinado ha planteado la cuestión de un matrimonio entre su casa y la nuestra, o al menos entre un miembro de su familia y un compañero adecuado en nuestros círculos cortesanos. La conexión sería visible, dinástica y vinculante de la manera en que solo la sangre puede vincular. El hecho de que veamos esto como una oportunidad o como una complicación revela algo sobre cómo percibimos la relación."
 cc_bonds.31.a: "Organizar el matrimonio. Las dinastías se construyen a través de la familia."
 cc_bonds.31.b: "Rechazar. No es el momento adecuado."
 cc_bonds.31.c: "El señor puede organizar los asuntos de su propia familia."

 # === cc_bonds.32 — Military Service Demand ===
 cc_bonds.32.title: "Demanda de Servicio Militar"
 cc_bonds.32.desc: "Necesitamos fuerzas adicionales, y el palatinado de [bond_subj.GetName] comanda un cuerpo sustancial de nobles entrenados y sus séquitos. El señor siempre ha cumplido sus obligaciones, pero la cuestión es cómo planteamos la petición: como una orden, como una oferta o como algo que le pedimos. Notará la diferencia."
 cc_bonds.32.a: "Convocar la leva noble completa. Se debe el servicio."
 cc_bonds.32.b: "Solicitar servicio voluntario y proporcionar una compensación."
 cc_bonds.32.c: "Eximir al palatinado de esta leva. Su seguridad también importa."

 # === cc_bonds.33 — Palatinate Church Appointment ===
 cc_bonds.33.title: "Nombramiento eclesiástico del Palatinado"
 cc_bonds.33.desc: "El obispado dentro de [bond_subj.GetName] queda vacante. El señor ya ha realizado indagaciones informales sobre su candidato preferido: un hombre de prestigio local y claras lealtades hacia el palatinado. Nuestros propios consejeros eclesiásticos tienen otro nombre en mente: un leal a la corona cuyo nombramiento extendería nuestra influencia sobre la vida espiritual del palatinado. La elección no pasará desapercibida para ninguna de las partes."
 cc_bonds.33.a: "La Corona nombra al obispo. Esta es nuestra prerrogativa."
 cc_bonds.33.b: "Que el señor nomine. Esta es su diócesis."
 cc_bonds.33.c: "Un proceso de aprobación conjunto. Ambas partes tienen voz."

 # === cc_bonds.34 — The Border Dispute ===
 cc_bonds.34.title: "La Disputa Fronteriza"
 cc_bonds.34.desc: "El señor de [bond_subj.GetName] escribe con evidente frustración. Una casa noble vecina ha movido los marcadores de límites y ha disputado los derechos de pastoreo a lo largo del borde oriental del palatinado. Pide nuestro respaldo: una carta formal, una declaración legal, alguna señal de que la Corona apoya su reclamación. La casa vecina también tiene conexiones en la corte. Ningún resultado carece de coste."
 cc_bonds.34.a: "Respaldar plenamente al señor. Escribir la carta. Hacer la declaración."
 cc_bonds.34.b: "Exigir que ambas partes lleguen a un acuerdo mediante un arbitraje formal."
 cc_bonds.34.c: "No intervenir. Las disputas locales se resuelven solas."

 # === cc_bonds.35 — The Palatinate Asks for Tax Relief ===
 cc_bonds.35.title: "El Palatinado solicita una reducción de impuestos"
 cc_bonds.35.desc: "Una difícil temporada de cosechas y varios años de obligaciones militares han tensionado el palatinado de [bond_subj.GetName]. El señor escribe con cuidadosa dignidad —no suplicando, sino pidiendo claramente— una reducción temporal de la carga fiscal que se espera que soporten sus nobles. La petición es razonable bajo cualquier medida. Lo que preocupa a nuestros asesores es el precedente que sienta."
 cc_bonds.35.a: "Conceder el alivio. Han servido fielmente y lo merecen."
 cc_bonds.35.b: "Rechazar la solicitud. Las obligaciones no pueden renegociarse según las circunstancias."
 cc_bonds.35.c: "Ofrecer una reducción temporal modesta."

 # === cc_bonds.36 — The Old Lord Dies ===
 cc_bonds.36.title: "El viejo señor muere"
 cc_bonds.36.desc: "El señor del palatinado de [bond_subj.GetName] ha muerto. Sirvió durante mucho tiempo y sin incidentes significativos, y su heredero —conocido por nosotros, preparado por su padre— está listo para recibir el título. La sucesión es procesalmente sencilla. Lo que no es sencillo es la liquidación financiera: el patrimonio del palatinado es sustancial, y la cuestión de cómo abordemos la transición definirá la primera impresión que el nuevo señor tenga de la Corona."
 cc_bonds.36.a: "Confirmar al heredero graciosamente y eximirlo de todos los impuestos de sucesión."
 cc_bonds.36.b: "Exigir el impuesto de sucesiones completo antes de confirmar la sucesión."
 cc_bonds.36.c: "Aprovechemos el interregno para revisar la organización del palatinado."
