l_spanish:
 # === cc_bonds.10 — The Colony's First Harvest ===
 cc_bonds.10.title: "La primera cosecha de la colonia"
 cc_bonds.10.desc: "Nos llegan informes de [bond_subj.GetName]: ha concluido la primera temporada completa de administración colonial coordinada. Los colonos han producido un excedente, las rutas comerciales se están estableciendo y el gobernador solicita orientación sobre cómo desea la Corona proceder con los acuerdos de ingresos. La oportunidad ante nosotros es clara, pero también lo son las decisiones que exige."
 cc_bonds.10.a: "Maximice la extracción. La colonia existe para servir a la Corona."
 cc_bonds.10.b: "Invertir en infraestructura. Una colonia próspera rinde más a largo plazo."
 cc_bonds.10.c: "No hacer acuerdos específicos. Dejar que se gestionen como consideren oportuno."

 # === cc_bonds.11 — Colonial Conscription ===
 cc_bonds.11.title: "Reclutamiento colonial"
 cc_bonds.11.desc: "Nuestras fuerzas están al límite, y los territorios coloniales de [bond_subj.GetName] representan una reserva de hombres aptos. Se ha preguntado al gobernador sobre la viabilidad de reclutar tropas de la población colonial. Su respuesta es cautelosa — los colonos son primero pobladores y luego soldados — pero aguarda nuestras instrucciones."
 cc_bonds.11.a: "Reclutar del contingente colonial. Necesitamos hombres."
 cc_bonds.11.b: "Contratar mercenarios en su lugar. Perdonen a los colonos."
 cc_bonds.11.c: "Rechazar el reclutamiento de tropas adicionales en este momento."

 # === cc_bonds.12 — The Governor Reports Unrest ===
 cc_bonds.12.title: "El gobernador informa de disturbios"
 cc_bonds.12.desc: "Llega un despacho de [bond_subj.GetName] marcado como urgente. El gobernador escribe sobre el creciente descontento entre la población colonial: quejas por los impuestos, reclamaciones sobre funcionarios de la Corona que se extralimitan en sus mandatos y, en un distrito, una concentración que solo se disolvió cuando llegaron hombres armados. Solicita orientación. La situación aún no está fuera de control, pero requiere una respuesta."
 cc_bonds.12.a: "Enviar tropas para reprimir el malestar. Dar un ejemplo."
 cc_bonds.12.b: "Investigar a los recaudadores de impuestos. Reformar lo que sea necesario reformar."
 cc_bonds.12.c: "Reemplazar al gobernador. Una mano nueva restaurará el orden."
 cc_bonds.12.d: "Enviar regalos y promesas. Ganar tiempo."

 # === cc_bonds.13 — Colonial Trade Monopoly Dispute ===
 cc_bonds.13.title: "Disputa por el monopolio comercial colonial"
 cc_bonds.13.desc: "Los gremios mercantiles locales han presentado una petición solicitando derechos comerciales exclusivos con [bond_subj.GetName]. Argumentan que esto racionalizaría el comercio colonial y aumentaría los ingresos de la Corona mediante pagos de aranceles fiables. El gobernador colonial ha planteado objeciones discretamente: sus colonos comercian libremente con los puertos vecinos y ven un monopolio como una expropiación. La decisión recae en nosotros."
 cc_bonds.13.a: "Conceder el monopolio. El comercio estructurado beneficia a todos."
 cc_bonds.13.b: "Rechazar la petición. Los patrones comerciales de la colonia están funcionando."
 cc_bonds.13.c: "Permitir que la colonia establezca sus propios términos comerciales. Dejad que prosperen libremente."

 # === cc_bonds.14 — The Colony Seeks a Voice ===
 cc_bonds.14.title: "La colonia busca una voz"
 cc_bonds.14.desc: "Una delegación de [bond_subj.GetName] ha viajado desde muy lejos. Su petición es moderada pero clara: la colonia ha crecido, su gente ha construido algo duradero y creen que se han ganado el derecho a opinar sobre las decisiones que rigen sus vidas. No exigen la independencia; piden ser escuchados. La corte observa cómo respondemos."
 cc_bonds.14.a: "Conceder representación formal. Se la han ganado."
 cc_bonds.14.b: "Ofrecer un reconocimiento simbólico. Un papel consultivo, nada vinculante."
 cc_bonds.14.c: "Rechazar la petición. La Corona habla por todos sus territorios."

 # === cc_bonds.15 — Cultural Assimilation Pressure ===
 cc_bonds.15.title: "Presión de asimilación cultural"
 cc_bonds.15.desc: "El territorio colonial de [bond_subj.GetName] ha desarrollado una identidad local distintiva: sus propios festivales, sus propios patrones de habla, sus propios días de santos. Algunos asesores sostienen que este alejamiento de la cultura de la Corona invita a futuras deslealtades y debe corregirse mediante políticas. Otros aconsejan que intentar remodelar a los colonos a nuestra imagen provocará precisamente el resentimiento que tememos. La elección es nuestra."
 cc_bonds.15.a: "Impulsar la integración cultural. Una Corona, un pueblo."
 cc_bonds.15.b: "Apoyar las costumbres locales. Su identidad es lo que los define."
 cc_bonds.15.c: "No adoptar ninguna postura al respecto."

 # === cc_bonds.16 — Colonial Militia Incident ===
 cc_bonds.16.title: "Incidente de la milicia colonial"
 cc_bonds.16.desc: "Se ha formado un grupo armado en [bond_subj.GetName]: colonos que han asumido la tarea de patrullar sus propios distritos, resolver sus propias disputas y, en varios casos, resistirse físicamente a los funcionarios fiscales de la Corona. El gobernador los llama milicia. Otros los llaman algo peor. Sea cual sea su nombre, representan una resistencia organizada, y la administración colonial no puede funcionar a su alrededor."
 cc_bonds.16.a: "Identifica a los cabecillas y haz que sirvan de ejemplo."
 cc_bonds.16.b: "Negociar. Comprender sus agravios antes de actuar."
 cc_bonds.16.c: "Ordenar la disolución inmediata de la milicia."

 # === cc_bonds.200 — The Colonial Congress Convenes ===
 cc_bonds.200.title: "Se Convoca el Congreso Colonial"
 cc_bonds.200.desc: "La representación que concedimos a [bond_subj.GetName] hace algunos años ha crecido más allá de la ceremonia que fue al principio. Los colonos se han organizado. Han elegido delegados, redactado un programa y convocado un congreso con una agenda formal. Sus peticiones no son revolucionarias: mejoras en la administración colonial, protocolos comerciales más claros, un papel consultivo en las decisiones que les afectan directamente. Pero el aparato que han construido para presentar estas peticiones es algo nuevo. Les concedimos una voz; ellos la han usado para construir una cámara.\n\nLa cuestión que tenemos ahora delante es si honramos aquello en lo que esa voz se ha convertido, o si la corregimos."

 cc_bonds.200.a: "Ratificar una Carta Colonial. Lo que han construido merece un reconocimiento formal."
 cc_bonds.200.a.tooltip: "El congreso se convierte en una institución formal con legitimidad duradera. Se extiende el modificador de Era de Legitimidad Colonial. Ganancia de Pol y cul; coste de prestigio por ceder la iniciativa."

 cc_bonds.200.b: "Reconoce el congreso sin vincularnos a él."
 cc_bonds.200.b.tooltip: "El congreso es reconocido pero no formalizado. El pol gains modestamente. El recuerdo voice_granted persiste; es posible que esta situación madure más adelante."

 cc_bonds.200.c: "El congreso excede su mandato. Recorten la representación que concedimos."
 cc_bonds.200.c.tooltip: "La cámara se disuelve antes de que se convierta en un precedente. Tanto Pol como Cul caen; el deseo de libertad aumenta. La memoria de voice_granted se borra: el experimento ha terminado."
