l_spanish:
 cc_request_heir_religion_group: "Solicitar ley de religión del heredero"
 dip_cc_request_heir_religion_group: "Solicitar ley de religión del heredero"
 dip_cc_request_heir_religion_group_CATEGORY: "CATEGORY_FRIENDLY_ACTIONS"
 cc_request_heir_religion_group_desc: "Pedir a un socio de matrimonio real de otra fe dentro de nuestro [religion_group|e] que cambie su [ShowLawName('heir_religion_law')] a [ShowPolicyName('heir_same_religion_group')], para que los herederos de nuestra fe puedan heredar su trono."
 cc_request_heir_religion_group_act: "Pedir a [SCOPE.sCountry('recipient').GetName] que cambie su [ShowLawName('heir_religion_law')]."
 cc_request_heir_religion_group_effect_text: "[SCOPE.sCountry('actor').GetName] pide a [SCOPE.sCountry('recipient').GetName] que adopte [ShowPolicyName('heir_same_religion_group')]."
 cc_request_heir_religion_group_effect_text_past: "[SCOPE.sCountry('actor').GetName] ha pedido a [SCOPE.sCountry('recipient').GetName] que adopte [ShowPolicyName('heir_same_religion_group')]."
 PROPOSE_cc_request_heir_religion_group: "¿Pedir a $RECIPIENT$ que cambie su [ShowLawName('heir_religion_law')] a [ShowPolicyName('heir_same_religion_group')]?\n\n$INFO$"
 cc_request_heir_religion_group_reject_effect_text: "$generic_reject_request_effect_string$"
 cc_request_heir_religion_group_reject_effect_text_past: "$generic_reject_request_effect_string_past$"
 INCOMING_OFFER_TITLE_cc_request_heir_religion_group: "Petición de religión del heredero"
 INCOMING_OFFER_cc_request_heir_religion_group: "$ACTOR$ nos pide que cambiemos nuestra [ShowLawName('heir_religion_law')] a [ShowPolicyName('heir_same_religion_group')].\n\n$INFO$"
 cc_hrl_request_tt: "[SCOPE.sCountry('recipient').GetName] decidirá si cambia su [ShowLawName('heir_religion_law')] de [ShowPolicyName('heir_same_religion')] a [ShowPolicyName('heir_same_religion_group')]. Pueden aceptar, rechazar o aceptar solo si nosotros hacemos el mismo cambio.\nEs más probable que acepten si tienen una buena [opinion|e] sobre nosotros y confían en nosotros, y si tenemos una alta [diplomatic_reputation|e] y [prestige|e], somos una [great_power|e] o tenemos la cultura más fuerte. Un rechazo reduce nuestra [opinion|e] sobre ellos."
 cc_hrl_has_same_religion_policy_tt: "Su [ShowLawName('heir_religion_law')] es [ShowPolicyName('heir_same_religion')]"
 cc_hrl_policy_not_locked_tt: "Su [ShowLawName('heir_religion_law')] no está bloqueada"
 cc_hrl_group_policy_available_tt: "[ShowPolicyName('heir_same_religion_group')] está disponible para ellos"
 cc_hrl_not_recently_asked_tt: "Nadie les ha pedido que cambien esta ley en los últimos 10 años"

 opinion_cc_hrl_request_granted: "Cambió la ley de religión del heredero a petición nuestra"
 opinion_cc_hrl_request_refused: "Rechazó nuestra petición de religión del heredero"
 opinion_cc_hrl_reciprocal_pact: "Acuerdo mutuo sobre la religión del heredero"

 cc_hrl.1.title: "Una petición de [cc_hrl_requester.GetName]"
 cc_hrl.1.desc: "Los enviados de [cc_hrl_requester.GetName], unidos a nosotros por matrimonio real, piden que abramos nuestra sucesión a herederos de la fe [cc_hrl_requester.GetReligion.GetName]. Nuestra ley requiere actualmente un heredero de nuestra propia religión. Dado que ambas fes comparten un grupo religioso, nos piden que solo requiramos eso. Nuestro clero no recibirá bien el cambio, pero fortalecería los vínculos entre las dos cortes."
 cc_hrl.1.a: "Aceptar el cambio."
 cc_hrl.1.b: "Nuestra sucesión no es asunto suyo."
 cc_hrl.1.c: "Solo si ellos hacen lo mismo."
 cc_hrl.1.c.tt: "[cc_hrl_requester.GetName] recibirá la petición de cambiar su propia [ShowLawName('heir_religion_law')] a [ShowPolicyName('heir_same_religion_group')]. Si aceptan, ambos países lo cambiarán juntos."

 cc_hrl.2.title: "[cc_hrl_partner.GetName] Aceptar"
 cc_hrl.2.desc: "[cc_hrl_partner.GetName] ha cambiado su [ShowLawName('heir_religion_law')] a [ShowPolicyName('heir_same_religion_group')]. Un heredero de nuestra fe ahora puede heredar su trono."
 cc_hrl.2.a: "Bien."

 cc_hrl.3.title: "[cc_hrl_partner.GetName] Rechazar"
 cc_hrl.3.desc: "[cc_hrl_partner.GetName] ha rechazado nuestra petición. Su trono sigue cerrado a los herederos que no comparten su religión."
 cc_hrl.3.a: "Que así sea."

 cc_hrl.4.title: "[cc_hrl_partner.GetName] Pedir lo mismo"
 cc_hrl.4.desc: "[cc_hrl_partner.GetName] cambiará su [ShowLawName('heir_religion_law')] a [ShowPolicyName('heir_same_religion_group')], pero solo si nosotros también cambiamos la nuestra. Nuestro clero y la corte se resistirán a abrir nuestra propia sucesión a herederos de la fe [cc_hrl_partner.GetReligion.GetName], y forzar el cambio nos costará."
 cc_hrl.4.a: "Acordado. Ambas coronas cambiarán la ley."
 cc_hrl.4.b: "No abriremos nuestra propia sucesión."

 cc_hrl.5.title: "Acuerdo con [cc_hrl_requester.GetName]"
 cc_hrl.5.desc: "[cc_hrl_requester.GetName] ha aceptado nuestros términos. Ambos países utilizan ahora [ShowPolicyName('heir_same_religion_group')], y un heredero de cualquiera de las dos fes puede heredar cualquiera de los dos tronos."
 cc_hrl.5.a: "Bien."

 cc_hrl.6.title: "[cc_hrl_requester.GetName] Rechazar"
 cc_hrl.6.desc: "[cc_hrl_requester.GetName] no cambiaría su propia [ShowLawName('heir_religion_law')]. Nuestra ley permanece como estaba."
 cc_hrl.6.a: "Entonces nada cambia."
