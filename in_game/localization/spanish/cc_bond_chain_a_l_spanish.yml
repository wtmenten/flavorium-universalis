l_spanish:
 # === cc_bonds.1 — Monitor ===
 cc_bonds.1.title: "Vínculos formándose"
 cc_bonds.1.desc: "Los vínculos entre nosotros y nuestro vasallo están tomando forma."
 # === cc_bonds.100 — The Young Heir ===
 cc_bonds.100.title: "El joven heredero"
 cc_bonds.100.desc: "Un despacho de [bond_subj.GetName] contiene un detalle que no habíamos previsto: el gobernante actual tiene un heredero joven, quizás de ocho o diez años, que ya está siendo preparado para las responsabilidades que un día heredará. Hay tiempo, y hay una pregunta. ¿Qué tipo de relación deseamos tener con el hombre en el que se convertirá este niño? Las decisiones que tomemos ahora darán forma a su comprensión de lo que significa la Corona: si somos patrones, socios o señores distantes a los que se puede esperar pacientemente."
 cc_bonds.100.a: "Invitar al heredero a nuestra corte. Crecerá comprendiendo quiénes somos."
 cc_bonds.100.b: "Enviar tutores y regalos generosos a su corte natal. La buena voluntad plantada temprano crece profundamente."
 cc_bonds.100.c: "Esto no es asunto nuestro. La sucesión en [bond_subj.GetName] es problema suyo."

 # === cc_bonds.101 — The Heir Comes of Age ===
 cc_bonds.101.title: "El Heredero Alcanza la Mayoría de Edad"
 cc_bonds.101.desc_court: "El joven heredero de [bond_subj.GetName] se ha convertido en un joven refinado y capaz: educado en nuestra corte, fluido en la lengua de nuestra nobleza y cómodo en nuestra mesa. Es leal a nosotros de una manera casi reflexiva. Lo que menos le agrada, según notan nuestros cortesanos, es la idea de volver a casa. Su patria es ahora algo abstracto para él; la corte es lo real. Se encuentra en una encrucijada, y nosotros también."
 cc_bonds.101.desc_gifted: "El heredero de [bond_subj.GetName] ha alcanzado la mayoría de edad en su patria, bien educado y —según todos los informes— bien dispuesto hacia la Corona. Los tutores que le enviamos dejaron su huella. Habla de su señor con un afecto genuino, algo que no se puede comprar simplemente. Es dueño de sí mismo, arraigado en su propio territorio, pero los cimientos fueron bien asentados."
 cc_bonds.101.desc_ignored: "El heredero de [bond_subj.GetName] ha alcanzado la mayoría de edad sin ninguna conexión particular con nuestra corte. Es capaz, independiente y —según informan nuestros enviados— ligeramente frío en su actitud hacia la Corona. Ha construido sus propias relaciones, cultivado sus propios vínculos y formado sus propias opiniones sobre lo que significa para él la relación de vasallaje. Esas opiniones no son hostiles; simplemente no son cálidas."
 cc_bonds.101.a_keep: "Manténlo en la corte un poco más. Hay más que debe aprender aquí."
 cc_bonds.101.a_send: "Enviarlo a casa con honores y un acuerdo matrimonial. Está listo."
 cc_bonds.101.b_invite: "Invitarlo a la corte ahora. Formalizar lo que los tutores comenzaron."
 cc_bonds.101.b_gift: "Enviarle una escritura de propiedad en nuestro reino. Un gesto tangible de asociación."
 cc_bonds.101.c_gift: "Hacer acercamientos: enviar regalos fastuosos. No es demasiado tarde para construir algo."
 cc_bonds.101.c_ignore: "Es el heredero de un estado vasallo. No necesitamos cultivarlo."
 cc_bonds.101.c_interfere: "Las conexiones que está estableciendo a nivel local nos preocupan. Las interrumpiremos."

 # === cc_bonds.102 — The Old Lord's Passing ===
 cc_bonds.102.title: "El fallecimiento del viejo señor"
 cc_bonds.102.desc_loyal: "El antiguo señor de [bond_subj.GetName] ha muerto, y su heredero —el joven que conocimos en nuestra corte, o aquel que creció con gratos recuerdos de nuestra generosidad— ha ocupado su lugar. Su primer acto como gobernante es una carta a la Corona. El tono es personal. Recuerda bondades específicas. Renueva su juramento sin que se le pida, con un lenguaje que va más allá de la fórmula. No está fingiendo lealtad. La siente. Estamos viendo, plenamente, el resultado de aquellas decisiones tempranas."
 cc_bonds.102.desc_neutral: "El antiguo señor de [bond_subj.GetName] ha muerto. Su heredero ha enviado una renovación formal del juramento: correcta en todos los aspectos, de tono profesional y totalmente carente de calidez. Está cumpliendo con sus obligaciones. Ha sido educado para comprender cuáles son esas obligaciones. Si hay algo más detrás de ellas es imposible saberlo a partir de una carta cuidadosamente redactada."
 cc_bonds.102.desc_hostile: "El antiguo señor de [bond_subj.GetName] ha muerto. Su heredero aún no ha enviado la acostumbrada renovación del juramento. Pasa una semana. Luego dos. Nuestros secretarios comienzan a redactar un recordatorio. El nuevo señor no está en rebelión; no se ha declarado nada, ni se ha repudiado nada. Simplemente nos hace esperar, en el lenguaje más antiguo del descontento feudal: la pausa deliberada."
 cc_bonds.102.a_reward: "Concederle un título honorífico. Su lealtad merece un reconocimiento formal."
 cc_bonds.102.a_acknowledge: "Reconocemos su renovación con calidez. La relación ha comenzado bien."
 cc_bonds.102.b_push: "Esta transición es una oportunidad. Pediremos una concesión."
 cc_bonds.102.b_accept: "La renovación es aceptada. La relación continúa en los términos existentes."
 cc_bonds.102.c_demand: "Prestará el juramento ahora. No esperaremos."
 cc_bonds.102.c_envoy: "Enviar un enviado con regalos. Comenzar la relación bien, aunque sea tarde."
