l_spanish:
 cc_legend.1.title: "La corte del filósofo"
 cc_legend.1.desc: "La convergencia de un gobernante ilustrado, un gabinete dedicado enteramente a la administración y al aprendizaje, y la riqueza material de una gran capital ha producido algo que los filósofos soñaron pero rara vez presenciaron: una corte donde el gobierno y la sabiduría son la misma cosa. Cada semana llegan eruditos extranjeros. Nuestras instituciones crecen más rápido de lo que nuestros rivales pueden explicar. La historia está tomando nota."
 cc_legend.1.a: "Establecer la Corte de los Filósofos"
 cc_legend.1.a.tt: "Desbloquea la reforma gubernamental de la Corte de los Filósofos. Otorga al gobernante el rasgo legendario de Rey Filósofo."
 cc_legend.1.b: "Honrar el logro con una celebración"

 cc_legend.2.title: "El Santo Imperio"
 cc_legend.2.desc: "En una era en la que la fe y el poder luchan por la primacía, hemos logrado lo que pocos pudieron: una corte donde la autoridad sagrada y el poder político se refuerzan mutuamente en lugar de socavarse. El clero sostiene el reino, el reino sostiene la fe y, juntos, sostienen algo que parece, para quienes tienen ojos para verlo, un imperio santo reconstituido."
 cc_legend.2.a: "Proclamar el Sacro Imperio"
 cc_legend.2.a.tt: "Otorga el privilegio del Imperio Santo al estamento del clero. Aplica un modificador permanente de Imperio Santo al reino."
 cc_legend.2.b: "Un momento para la oración y la gratitud"

 cc_legend.3.title: "El Gran Bazar"
 cc_legend.3.desc: "La gran tradición de comercio cosmopolita del mundo islámico ha encontrado su expresión en nuestro reino. Nuestro ministro gestiona una red diplomática que abarca el dar al-Islam y más allá; nuestros súbditos comerciales operan en puertos que nuestros rivales jamás han visto; nuestro Gran Canciller ha convertido nuestra reputación en un activo comercial. El Gran Bazar no es un lugar: es una forma de hacer negocios que el mundo imitará."
 cc_legend.3.a: "Abrir el Gran Bazar"
 cc_legend.3.a.tt: "Desbloquea la reforma gubernamental del Gran Bazar. Otorga al miembro del gabinete Gran Canciller el rasgo legendario de Gran Visir."
 cc_legend.3.b: "Honrar el logro con una ceremonia"

 cc_legend.4.title: "El hegemon de hierro"
 cc_legend.4.desc: "La combinación de un gobernante de voluntad férrea, un comandante militar supremo, una red de especialistas militares y una marca militar que proyecta nuestro poder más allá de nuestras fronteras ha producido algo que pocos reinos logran: la hegemonía. No solo preponderancia, sino el tipo de dominio que moldea el comportamiento de los vecinos antes de que marche un solo soldado. Hemos construido al Hegemón de Hierro."
 cc_legend.4.a: "Formalizar la Hegemonía de Hierro"
 cc_legend.4.a.tt: "Desbloquea la reforma gubernamental de la Hegemonía de Hierro."
 cc_legend.4.b: "La ventaja militar es recompensa suficiente"

 cc_legend.5.title: "El Tribuno del Pueblo"
 cc_legend.5.desc: "En la era de la revolución, cuando el viejo orden colapsa y el nuevo lucha por nacer, hemos logrado lo que los reformadores siempre prometieron y rara vez cumplieron: un reino donde el pueblo consiente genuinamente ser gobernado. Cada estamento está satisfecho. El Parlamento funciona. Nuestro ministro habla en nombre del pueblo y el pueblo, sorprendentemente, se lo cree. La historia llamará a esto el momento en que apareció un Tribuno del Pueblo."
 cc_legend.5.a: "Proclamar al Tribuno del Pueblo"
 cc_legend.5.a.tt: "Desbloquea la reforma gubernamental de la Asamblea Popular. Otorga al miembro del gabinete Intermediario Parlamentario el rasgo legendario de Tribuno del Pueblo."
 cc_legend.5.b: "Dejar que hable el Tribuno del Pueblo"

 cc_legend.8.title: "La Era de las Exploraciones"
 cc_legend.8.desc: "Las estrellas han sido cartografiadas. Los vientos han sido nombrados. Las costas que antaño marcaban el límite del mundo conocido son ahora los puntos de partida de un comercio regular. Este reino no solo ha participado en la era de las exploraciones, sino que ha ayudado a definirla. Un ministro, por encima de todos los demás, encarna ese logro. Sus viajes serán estudiados durante generaciones."
 cc_legend.8.a: "Celebre la ocasión: el legendario navegante se ha ganado el título."
 cc_legend.8.a.tt: "Otorga el rasgo Navegante Legendario al ministro de exploración. Aplica un modificador permanente de la Era de los Descubrimientos al reino. Desbloquea la reforma gubernamental Gremio de Exploradores."
 cc_legend.8.b: "El logro habla por sí solo; que siga siendo una cuestión de comercio, no de leyenda."
