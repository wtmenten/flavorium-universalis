l_spanish:
 # ============================================================
 # FAMILY A — CAPITAL DEVELOPMENT-GATED TRAITS
 # ============================================================

 # Tier 1: Prosperity & Urbanization
 urban_planner: "Planificador Urbano"
 desc_urban_planner: "Este asesor tiene un ojo agudo para la disposición eficiente de las ciudades y el comercio. Bajo su dirección, las nuevas construcciones avanzan rápida y económicamente, y el tejido urbano del reino se vuelve más denso con cada año que pasa."

 prosperity_herald: "Heraldo de la prosperidad"
 desc_prosperity_herald: "Este asesor trae las buenas nuevas de un reino floreciente. Donde se acumula la riqueza, el talento la sigue, y este ministro ha convertido la prosperidad de nuestra capital en un imán para consejeros ambiciosos de todo el país."
 prosperity_herald_die_desc: "[CHARACTER.GetName] se ha ido. Las puertas abiertas que [CHARACTER.GetSheHe] mantuvo entre nuestra corte y las mentes más brillantes del reino serán más difíciles de conservar sin [CHARACTER.GetHerHim]."

 merchant_syndic: "Síndico mercader"
 desc_merchant_syndic: "Veterano de las casas de cuentas y los gremios comerciales, este asesor sabe cómo traducir la riqueza urbana en capital político. La clase mercantil asciende junto con la ciudad, y este ministro asegura que dicho ascenso beneficie a la corona."
 merchant_syndic_die_desc: "[CHARACTER.GetName] ha fallecido. Los puentes que [CHARACTER.GetSheHe] construyó entre la casa de cuentas y el trono llevarán tiempo en reconstruirse."

 # Tier 2: Cultural & Intellectual Flourishing
 grand_architect: "Gran Arquitecto"
 desc_grand_architect: "Donde otros asesores ven estadísticas, este ministro ve horizontes urbanos. Una gran capital atrae a eruditos, artistas y reformadores — y nadie comprende mejor las condiciones materiales para tal florecimiento que este extraordinario consejero."
 grand_architect_die_desc: "[CHARACTER.GetName] ha muerto. Los monumentos que [CHARACTER.GetSheHe] levantó sobrevivirán a cualquier piedra: son las ciudades que [CHARACTER.GetSheHe] ayudó a construir."

 arts_patron: "Mecenas de las Artes"
 desc_arts_patron: "Generoso benefactor de pintores, poetas y músicos, este asesor comprende que el mecenazgo cultural es también poder político. La excelencia artística pule la reputación de la corona y abre las mentes a nuevas ideas."
 arts_patron_die_desc: "[CHARACTER.GetName] ha fallecido. Cada artista a quien [CHARACTER.GetSheHe] apoyó recordará la mano que los alimentó y, por lo tanto, así lo hará la posteridad en sus obras."

 learned_courtier: "cortesano erudito"
 desc_learned_courtier: "Formado en filosofía natural, derecho y letras, este consejero ha convertido la corte en un centro de aprendizaje. Los eruditos se reúnen a su alrededor, las instituciones echan raíces y la alfabetización se extiende desde la capital."
 learned_courtier_die_desc: "[CHARACTER.GetName] ha partido. Los seminarios que [CHARACTER.GetSheHe] organizaba han terminado, pero las mentes que [CHARACTER.GetSheHe] moldeó llevarán ese aprendizaje hacia adelante."

 reform_minded_counselor: "Consejero reformista"
 desc_reform_minded_counselor: "La prosperidad tiene una forma de aflojar el control de las viejas estructuras, y este asesor lo sabe bien. Como defensor de la reforma moderada, ha logrado que la corte sea más receptiva al cambio institucional sin provocar una revolución."
 reform_minded_counselor_die_desc: "[CHARACTER.GetName] ha muerto. Las reformas que [CHARACTER.GetSheHe] cultivó discretamente fueron la obra de toda una vida y, como todas esas obras, su destino ahora depende de otros."

 # Tier 3: Transformative / Enlightenment Ideas
 master_urbanist: "Maestro Urbanista"
 desc_master_urbanist: "Este asesor ve la ciudad como un laboratorio para el florecimiento humano. Desde la planificación urbana hasta la política cultural y la financiación científica, ha transformado nuestra capital en un motor de progreso que las cortes rivales solo pueden envidiar."
 master_urbanist_die_desc: "[CHARACTER.GetName] ha muerto. La ciudad que [CHARACTER.GetSheHe] ayudó a dar forma será [CHARACTER.GetHerHis] mayor monumento, y sobrevivirá a todos los reyes."

 enlightenment_herald: "Heraldo de la Ilustración"
 desc_enlightenment_herald: "Este asesor llegó trayendo nuevas ideas: que la razón, más que la revelación, es la guía adecuada para el gobierno; que el conocimiento debe ser puesto a prueba, no simplemente recibido; que las instituciones pueden mejorarse. Han hecho que esas ideas sean contagiosas."
 enlightenment_herald_die_desc: "[CHARACTER.GetName] ha partido de este mundo, pero las ideas que [CHARACTER.GetSheHe] difundió no son tan fáciles de enterrar. Viven en panfletos, en conferencias y en la mente de aquellos a quienes [CHARACTER.GetSheHe] enseñó."

 progressive_rationalist: "Racionalista progresista"
 desc_progressive_rationalist: "Defensor de la razón, la alfabetización y el método científico, este asesor ha desafiado sistemáticamente la superstición dondequiera que la haya encontrado. Bajo su influencia, la corte se ha vuelto más receptiva a la evidencia que a la autoridad."
 progressive_rationalist_die_desc: "[CHARACTER.GetName] ha muerto. Los enemigos de la razón celebrarán, pero descubrirán que el mundo es un lugar obstinadamente diferente a como era antes de [CHARACTER.GetHerHim]."

 revolutionary_herald: "Heraldo revolucionario"
 desc_revolutionary_herald: "Este asesor llegó con ideas que ponen nerviosa a la vieja guardia: que el pueblo tiene derechos; que el gobierno legítimo requiere consentimiento; que la disposición actual del poder no es eterna. Aconsejan la reforma y, si se deniega la reforma, la historia aconsejará algo más."
 revolutionary_herald_die_desc: "[CHARACTER.GetName] ha muerto. Las ideas que [CHARACTER.GetSheHe] portaba ya estaban más allá de [CHARACTER.GetHerHis] capacidad de retención; ahora pertenecen a la época."

 # ============================================================
 # FAMILY B — SOCIETAL VALUE-GATED TRAITS
 # ============================================================

 # Axis 1: traditionalist_vs_innovative
 innovative_counselor: "Consejero Innovador"
 desc_innovative_counselor: "El cambio no es una amenaza para este asesor, sino el motor del progreso. Han convertido nuestra corte en un lugar donde las nuevas ideas se ponen a prueba en lugar de suprimirse, y las instituciones se fortalecen gracias a ello."
 innovative_counselor_die_desc: "[CHARACTER.GetName] ha muerto. El espíritu inquieto de indagación que [CHARACTER.GetSheHe] cultivó no encontrará fácilmente a otro defensor."

 traditionalist_guardian: "Guardián Tradicionalista"
 desc_traditionalist_guardian: "Las viejas costumbres nos han servido bien, y este consejero pretende que sigan siendo así. Defensor incansable de la costumbre y la jerarquía, ha fortalecido los vínculos entre la corona y sus pilares tradicionales de apoyo."
 traditionalist_guardian_die_desc: "[CHARACTER.GetName] ha fallecido. Las tradiciones que [CHARACTER.GetSheHe] defendió persistirán, pero se ha ido la mirada vigilante que las custodiaba."

 # Axis 2: absolutism_vs_liberalism
 royal_absolutist: "Absolutista real"
 desc_royal_absolutist: "El poder debe concentrarse para ser útil; este asesor nunca lo ha dudado. Bajo su consejo, la maquinaria de la autoridad real se ha vuelto más eficiente y los costes de absorber nuevos territorios han disminuido."
 royal_absolutist_die_desc: "[CHARACTER.GetName] ha muerto. La arquitectura de poder centralizado que [CHARACTER.GetSheHe] construyó permanecerá, pero aquellos que se sientan asfixiados por ella encontrarán su oportunidad."

 liberal_reformer: "Reformista Liberal"
 desc_liberal_reformer: "Este asesor cree que un reino gobernado con el consentimiento de su pueblo es más fuerte que uno gobernado por el miedo. Ha abierto más canales entre la corona y sus súbditos, y el resultado es un país con menos probabilidades de fracturarse."
 liberal_reformer_die_desc: "[CHARACTER.GetName] ha muerto. Los acuerdos que [CHARACTER.GetSheHe] medió entre la corona y el pueblo se pondrán a prueba ahora que el mediador ha desaparecido."

 # Axis 3: centralization_vs_decentralization
 efficiency_administrator: "Administrador de eficiencia"
 desc_efficiency_administrator: "El despilfarro es el enemigo de este consejero. Ha auditado cada proceso burocrático, eliminado cada redundancia y optimizado la maquinaria del gobierno hasta que funciona con una economía notable."
 efficiency_administrator_die_desc: "[CHARACTER.GetName] ha fallecido. La maquinaria bien engrasada que [CHARACTER.GetSheHe] construyó funcionará un tiempo más por sí sola, pero las máquinas necesitan mantenimiento."

 regional_magnate: "Magnate regional"
 desc_regional_magnate: "Las regiones fuertes crean un reino fuerte, o al menos eso sostiene este asesor. Han cultivado a los grandes señores de las provincias y se han asegurado de que el poder local trabaje con el centro en lugar de contra él."
 regional_magnate_die_desc: "[CHARACTER.GetName] se ha ido. La red de lealtades regionales que [CHARACTER.GetSheHe] mantuvo requerirá un cuidado meticuloso ahora que [CHARACTER.GetHerHis] mano ya no está al volante."

 # Axis 4: spiritualist_vs_humanist
 mystical_patriarch: "Patriarca místico"
 desc_mystical_patriarch: "La fe es la base de la cosmovisión de este asesor, y ha trasladado esa convicción a cada rincón del gobierno. El clero es más influyente, los fieles más firmes y el reino más resistente a las ideas heterodoxas."
 mystical_patriarch_die_desc: "[CHARACTER.GetName] ha dejado este mundo. La piedad que [CHARACTER.GetSheHe] encarnaba era una forma de gobierno, y su pérdida se sentirá en ámbitos que ningún balance contable puede medir."

 humanist_philosopher: "Filósofo Humanista"
 desc_humanist_philosopher: "Este asesor cree que la razón humana, y no el decreto divino, debe guiar al reino. Bajo su influencia ha crecido la tolerancia, así como la alfabetización y la voluntad de cuestionar la sabiduría recibida."
 humanist_philosopher_die_desc: "[CHARACTER.GetName] ha muerto. Los argumentos que [CHARACTER.GetSheHe] ganó —a favor de la tolerancia, de la investigación, de la dignidad de la mente humana— serán litigados de nuevo ahora. Esperemos que el veredicto se mantenga."

 # Axis 5: aristocracy_vs_plutocracy
 noble_champion: "Campeón Noble"
 desc_noble_champion: "El linaje y el servicio: estos son los dos pilares del credo de este asesor. Como incansable defensor de la nobleza, se ha asegurado de que las grandes casas sigan siendo la columna vertebral de nuestro orden militar y político."
 noble_champion_die_desc: "[CHARACTER.GetName] ha muerto. Las casas nobles que [CHARACTER.GetSheHe] defendió llorarán ruidosamente y, en su duelo, recordarán lo que le deben a la corona."

 merchant_prince: "Príncipe mercader"
 desc_merchant_prince: "Este asesor nunca ha confundido el dinero antiguo con el dinero bueno. Defensor de las clases comerciales, ha abierto nuevos canales comerciales, cultivado los estamentos mercantiles y convertido la riqueza en influencia."
 merchant_prince_die_desc: "[CHARACTER.GetName] ha fallecido. Las redes comerciales que [CHARACTER.GetSheHe] tejió persistirán; las rutas comerciales no lloran a sus arquitectos."

 # Axis 6: serfdom_vs_free_subjects
 serf_overseer: "Supervisor de siervos"
 desc_serf_overseer: "El orden depende de la jerarquía, y la jerarquía depende de que cada uno conozca su lugar. Este asesor se ha asegurado de que el sistema de trabajo rural funcione con la máxima eficiencia: la nobleza está satisfecha, aunque el campesinado no lo esté."

 emancipation_minister: "Ministro de Emancipación"
 desc_emancipation_minister: "La marea creciente eleva todos los barcos: este asesor ha dedicado su carrera a aflojar los vínculos que mantienen al campesinado atado a la tierra. La alfabetización aumenta, la movilidad crece y el potencial humano del reino comienza a florecer."

 # Axis 7: mysticism_vs_jurisprudence
 mystical_counselor: "Consejero místico"
 desc_mystical_counselor: "Para este consejero, lo sagrado y lo político no están separados. Ha tejido la legitimidad religiosa a través del tejido del gobierno, otorgando a las acciones del reino una autoridad espiritual que las potencias extranjeras tratan con cautela."
 mystical_counselor_die_desc: "[CHARACTER.GetName] ha partido. El peso espiritual que [CHARACTER.GetSheHe] aportaba a nuestras decisiones será difícil de reemplazar con meros argumentos."

 legal_scholar: "Erudito legal"
 desc_legal_scholar: "La ley, debidamente codificada y aplicada de manera coherente, es la herramienta más poderosa de la civilización; o al menos eso sostiene este asesor. Bajo su influencia, la gobernanza se ha vuelto más sistemática, más predecible y más difícil de abusar."
 legal_scholar_die_desc: "[CHARACTER.GetName] ha muerto. El edificio legal que [CHARACTER.GetSheHe] construyó puede sobrevivir a cada ministro que venga después; esa era la intención."

 # Axis 8: mercantilism_vs_free_trade
 mercantilist_official: "Funcionario mercantilista"
 desc_mercantilist_official: "El comercio es poder, y el poder debe ser dirigido por el estado; este asesor nunca lo ha dudado. Bajo su supervisión, el alcance comercial de la corona ha crecido y los intereses enfrentados han sido puestos firmemente bajo la supervisión real."
 mercantilist_official_die_desc: "[CHARACTER.GetName] ha fallecido. El aparato comercial que [CHARACTER.GetSheHe] construyó seguirá funcionando, aunque sin [CHARACTER.GetHerHis] mano en el acelerador, podría derivar."

 free_market_advocate: "Defensor del Libre Mercado"
 desc_free_market_advocate: "Eliminar las barreras y ver florecer el comercio; este asesor ha presentado ese argumento ante cada escéptico de la corte, y los resultados han sido difíciles de refutar. Los gremios de mercaderes los adoran."
 free_market_advocate_die_desc: "[CHARACTER.GetName] ha muerto. Los mercaderes que [CHARACTER.GetSheHe] liberó no erigirán estatuas, pero recordarán su nombre al calcular sus beneficios."

 # Axis 9: capital_economy_vs_traditional_economy
 capitalist_minister: "Ministro capitalista"
 desc_capitalist_minister: "Inversión, acumulación y reinversión: este asesor comprende la lógica del capital como pocos consejeros. Bajo su guía, la economía del reino ha comenzado a desarrollarse según una lógica interna nueva y productiva."
 capitalist_minister_die_desc: "[CHARACTER.GetName] ha fallecido. La maquinaria económica que [CHARACTER.GetSheHe] puso en marcha no se detendrá; el capital tiene ahora su propio impulso."

 estate_guardian: "Guardián del Estamento"
 desc_estate_guardian: "Las viejas formas de organizar la riqueza y el trabajo han demostrado ser duraderas por buenas razones, y este consejero no ve sabiduría en abandonarlas en favor de teorías no probadas. Las grandes propiedades prosperan, las órdenes tradicionales están satisfechas y el reino es estable."

 # Axis 10: individualism_vs_communalism
 free_spirit_counselor: "Consejero de Espíritu Libre"
 desc_free_spirit_counselor: "Cada gran logro comienza con una sola persona que pensó de manera diferente; este asesor ha construido su política en torno a esa convicción. Se cultiva el talento individual, el mecenazgo artístico florece y la burocracia se flexibiliza ligeramente para dar cabida al genio."
 free_spirit_counselor_die_desc: "[CHARACTER.GetName] ha muerto. Las mentes singulares que [CHARACTER.GetSheHe] alentó se dispersarán, y algunas no encontrarán a otro protector."

 community_steward: "Administrador comunitario"
 desc_community_steward: "Un reino no son sus gobernantes, sino su gente; este asesor ha gobernado según ese principio. Los vínculos comunitarios son más fuertes, las poblaciones locales son más móviles y prósperas, y el pueblo llano está más comprometido con el éxito del reino."
 community_steward_die_desc: "[CHARACTER.GetName] se ha ido. Las comunidades que [CHARACTER.GetSheHe] cuidó no fueron el tipo de logro que gana retratos en el palacio, pero podrían resultar más duraderas."

 # Axis 11: quality_vs_quantity
 elite_trainer: "Entrenador de Élite"
 desc_elite_trainer: "Menos soldados, mejores soldados: este asesor ha apostado su reputación por ese principio. El ejército que surge de sus reformas es más pequeño, más costoso y devastadoramente eficaz."

 mass_levy_commander: "Comandante de Levas Masivas"
 desc_mass_levy_commander: "Los números ganan batallas, y los números son algo que tenemos. Este asesor ha convertido la fuerza militar del reino en un activo estratégico, manteniendo bajos los costes de reclutamiento y las filas perpetuamente llenas."
 mass_levy_commander_die_desc: "[CHARACTER.GetName] ha fallecido. Los hombres que [CHARACTER.GetSheHe] crió y entrenó recordarán la voz que los llamó a filas, aunque la historia no registre su nombre."

 # Axis 12: offensive_vs_defensive
 offensive_strategist: "Estratega ofensivo"
 desc_offensive_strategist: "La mejor defensa es un buen ataque, y este asesor ha organizado nuestra planificación militar en consecuencia. Cada recurso está orientado a proyectar fuerza hacia el exterior, manteniendo al enemigo demasiado ocupado con sus propios problemas como para amenazar los nuestros."
 offensive_strategist_die_desc: "[CHARACTER.GetName] ha muerto. La doctrina que [CHARACTER.GetSheHe] escribió sobrevivirá a [CHARACTER.GetHerHim] en los manuales, aunque los manuales no pueden adaptarse a las circunstancias cambiantes de la manera en que [CHARACTER.GetSheHe] podía."

 defensive_commander: "Comandante Defensivo"
 desc_defensive_commander: "Los fuertes mantienen terrenos que los ejércitos no pueden. Este asesor ha invertido profundamente en la infraestructura defensiva del reino, asegurando que cualquier agresor se enfrente a una agotadora campaña de desgaste en lugar de una guerra de movimientos limpia."
 defensive_commander_die_desc: "[CHARACTER.GetName] ha muerto. Las murallas que [CHARACTER.GetSheHe] construyó sobrevivirán a [CHARACTER.GetHerHim] por siglos; y ese era el plan."

 # Axis 13: belligerent_vs_conciliatory
 hawk_minister: "Ministro Halcón"
 desc_hawk_minister: "Este asesor cree que la fuerza impone respeto y la debilidad invita a la agresión. Bajo su consejo, hemos aprovechado más nuestras ventajas y exigido más a los enemigos derrotados, aunque esto haya inquietado a algunos vecinos."
 hawk_minister_die_desc: "[CHARACTER.GetName] ha muerto. Los enemigos que [CHARACTER.GetSheHe] se ganó no guardarán luto. Pero tampoco lo harán los comandantes cuyas ambiciones [CHARACTER.GetSheHe] alimentó."

 peacemaker_counselor: "Consejero Pacificador"
 desc_peacemaker_counselor: "Cada guerra cuesta más de lo que admiten sus defensores, y este asesor ha dedicado su carrera a demostrar ese punto. Bajo su influencia, el antagonismo ha disminuido, los canales diplomáticos han permanecido abiertos y nuestros vecinos se han sentido menos inclinados a unirse contra nosotros."

 # Axis 14: outward_vs_inward
 expansionist_advisor: "Asesor Expansionista"
 desc_expansionist_advisor: "El mapa tiene espacios en blanco que piden ser llenados; o al menos eso cree este asesor. Bajo su guía, nuestras ambiciones coloniales y exploratorias se han vuelto más agudas y mejor dotadas de recursos."
 expansionist_advisor_die_desc: "[CHARACTER.GetName] ha muerto. Los horizontes hacia los que [CHARACTER.GetSheHe] señaló siguen ahí. Si llegamos a ellos es ahora nuestra única elección."

 consolidation_minister: "Ministro de consolidación"
 desc_consolidation_minister: "El reino que tenemos merece ser perfeccionado antes de aspirar a más. Este consejero ha centrado nuestras energías hacia el interior: desarrollando lo que poseemos, integrando lo que hemos conquistado y reformando lo que necesita reforma."
 consolidation_minister_die_desc: "[CHARACTER.GetName] se ha ido. La labor interna que [CHARACTER.GetSheHe] defendió siempre será menos glamurosa que la conquista, y siempre más necesaria."

 # Axis 15: land_vs_naval
 continental_marshal: "Mariscal continental"
 desc_continental_marshal: "La tierra es donde se ganan las guerras y se crean los imperios; este asesor nunca lo ha dudado. El ejército es el instrumento de nuestro poder, y ellos lo han perfeccionado en consecuencia."

 admiral_counselor: "Consejero Almirante"
 desc_admiral_counselor: "El mar es la gran autopista del mundo, y quien lo domina, domina todo lo que fluye a través de él. Este asesor ha orientado nuestro pensamiento estratégico hacia el mar, y los resultados se han sentido tanto en nuestros ingresos comerciales como en nuestro registro naval."
 admiral_counselor_die_desc: "[CHARACTER.GetName] ha fallecido. El mar no guarda luto, pero los marineros que [CHARACTER.GetSheHe] entrenó contarán historias sobre [CHARACTER.GetHerHim] en cada puerto."

 # Axis 16: latinization_vs_hellenization
 roman_administrator: "Administrador romano"
 desc_roman_administrator: "Orden, ley y latín: estas son las herramientas del imperio. Este consejero ha aplicado la tradición administrativa romana a nuestro gobierno, abaratando las anexiones y haciendo que las reformas sean más sistemáticas."
 roman_administrator_die_desc: "[CHARACTER.GetName] ha muerto. El legado administrativo que [CHARACTER.GetSheHe] construyó sigue la tradición romana: sobrevivirá a quien lo construyó."

 hellenistic_scholar: "Erudito Helenístico"
 desc_hellenistic_scholar: "La tradición griega perdura: en la filosofía, en la ciencia y en el cultivo de la mente inquisitiva. Este asesor ha convertido nuestra corte en un centro de dicha tradición, y la alfabetización y la influencia cultural han crecido en consecuencia."

 # Axis 17: sinicized_vs_unsinicized
 confucian_mandarin: "Mandarín confuciano"
 desc_confucian_mandarin: "Los reyes sabios construyeron la civilización sobre la base de las relaciones adecuadas y la gobernanza meritocrática. Este asesor ha traído esos principios a nuestra corte, mejorando la administración y acelerando la asimilación de nuevos pueblos en el reino."
 confucian_mandarin_die_desc: "[CHARACTER.GetName] ha muerto. El ideal confuciano que [CHARACTER.GetSheHe] encarnó —el gobierno como una vocación moral— será más difícil de encontrar en la corte que le sigue."

 steppe_warlord_advisor: "Asesor Señor de la Guerra de la Estepa"
 desc_steppe_warlord_advisor: "La estepa no produce administradores; produce comandantes. Este asesor aporta la despiadada doctrina de caballería del mundo nómada a nuestro ejército, y nuestros enemigos han aprendido a temerla."
 steppe_warlord_advisor_die_desc: "[CHARACTER.GetName] ha muerto. Los comandantes que [CHARACTER.GetSheHe] entrenó llevarán adelante [CHARACTER.GetHerHis] ferocidad. La estepa no olvida sus lecciones."

 # ============================================================
 # FAMILY C — REGIONAL / RELIGIOUS TRAITS
 # ============================================================

 # Religion-group diplomats
 christian_diplomat: "Diplomático cristiano"
 desc_christian_diplomat: "Dentro de la comunidad de naciones cristianas, este consejero se mueve con una facilidad poco común. La fe compartida es una moneda diplomática y ellos la han gastado sabiamente: reduciendo el antagonismo, abriendo puertas y otorgando legitimidad a nuestros asuntos exteriores."

 caliphate_diplomat: "Diplomático del Califato"
 desc_caliphate_diplomat: "Impregnado de las tradiciones de la gobernanza islámica y las relaciones interestatales, este asesor ha otorgado a nuestra posición diplomática en el mundo musulmán un prestigio que el mero poder militar no puede comprar. Las conexiones que mantiene abarcan tanto cortes como rutas comerciales."
 caliphate_diplomat_die_desc: "[CHARACTER.GetName] ha fallecido. La reputación que [CHARACTER.GetSheHe] construyó perdurará, pero las reputaciones requieren cuidados."

 brahmin_counselor: "Consejero Brahmin"
 desc_brahmin_counselor: "El aprendizaje, el ritual y la gestión de la autoridad sagrada: este asesor domina las tres cosas. Bajo su guía, el estamento sacerdotal se ha convertido en un instrumento de gobierno más eficaz, y las necesidades espirituales de la población se han entrelazado más estrechamente con el tejido administrativo de la corona."
 brahmin_counselor_die_desc: "[CHARACTER.GetName] ha muerto. La autoridad espiritual que [CHARACTER.GetSheHe] cultivó en nuestro nombre tardará años en reconstruirse."

 dharma_minister: "Ministro del Dharma"
 desc_dharma_minister: "Este asesor ha basado su consejo en el concepto de la conducta correcta, tanto en el gobierno como en la vida personal. El resultado es una corte que aborda sus decisiones con un cuidado inusual, y una reputación de equidad que ha facilitado la gobernanza del reino."
 dharma_minister_die_desc: "[CHARACTER.GetName] ha fallecido. El ejemplo que [CHARACTER.GetSheHe] dio valió más que cualquier política que [CHARACTER.GetSheHe] implementara. Ese es el tipo de legado más difícil de preservar."

 # Sub-continent specialists
 renaissance_patron: "Mecenas renacentista"
 desc_renaissance_patron: "Las artes están floreciendo, y este consejero es en gran medida el responsable. Como mecenas generoso y perspicaz de pintores, escultores y escritores, ha convertido nuestra corte en un destino para las mentes creativas más brillantes de la era."
 renaissance_patron_die_desc: "[CHARACTER.GetName] ha muerto. Los artistas a los que [CHARACTER.GetSheHe] patrocinó dedicarán sus próximas obras a su memoria y, al hacerlo, asegurarán que su nombre sobreviva al siglo[CHARACTER.GetHerHis][CHARACTER.GetHerHis]."

 griot_diplomat: "Diplomático griot"
 desc_griot_diplomat: "La memoria, la historia y la palabra hablada son los cimientos de la tradición diplomática en esta parte del mundo, y este asesor ha dominado los tres. Se desplaza entre las cortes con la soltura de quien lleva el pasado en su voz."
 griot_diplomat_die_desc: "[CHARACTER.GetName] ha muerto. Cuando muere un griot, arde una biblioteca. La historia oral que [CHARACTER.GetSheHe] portaba será contada de manera diferente por quienes vengan después."

 steppe_strategos: "Estratego de la Estepa"
 desc_steppe_strategos: "Este asesor nació para la silla de montar y para la lógica rápida y brutal de la guerra de las estepas. Bajo su consejo, nuestra caballería ha alcanzado un nuevo nivel de eficiencia, y nuestros enemigos han aprendido a respetar la vista de nuestros exploradores en el horizonte."
 steppe_strategos_die_desc: "[CHARACTER.GetName] ha muerto. La doctrina de caballería que [CHARACTER.GetSheHe] trajo de la estepa sobrevivirá a [CHARACTER.GetHerHim] en los manuales de entrenamiento; pero quienes cabalgaron con [CHARACTER.GetHerHim] dicen que los manuales omiten algo esencial."

 mughal_administrator: "Administrador Mogol"
 desc_mughal_administrator: "Maestro de la sofisticada tradición administrativa que ha hecho gobernable a los grandes imperios multiétnicos, este consejero ha traído esos métodos a nuestro propio gobierno, acelerando la asimilación, reduciendo los costes de integración y haciendo que la corte funcione con mayor fluidez."
 mughal_administrator_die_desc: "[CHARACTER.GetName] ha fallecido. El legado administrativo que [CHARACTER.GetSheHe] construyó se basa en siglos de sabiduría acumulada. No será olvidado."

 maritime_champion: "Campeón Marítimo"
 desc_maritime_champion: "Los puertos y las rutas marítimas son las arterias del poder para cualquier reino costero, y este asesor se ha asegurado de que los nuestros estén saludables. Los estamentos mercantiles prosperan, el puerto bulle y la influencia marítima de la corona crece con cada temporada de navegación."
 maritime_champion_die_desc: "[CHARACTER.GetName] ha muerto. La marea sube y baja sin importar los capitanes de puerto que trazaron su comportamiento, pero esos capitanes siguen haciendo falta."

 ecumenical_patriarch_advisor: "Asesor del Patriarca Ecuménico"
 desc_ecumenical_patriarch_advisor: "Este consejero posee toda la autoridad de la tradición ortodoxa: su liturgia, su teología y su antigua pretensión de ser el verdadero heredero del ideal imperial cristiano. Bajo su influencia, el clero es un instrumento de gobierno más potente."
 ecumenical_patriarch_advisor_die_desc: "[CHARACTER.GetName] ha partido de este mundo. La Iglesia llenará el asiento —siempre lo hace—, pero la sabiduría particular que [CHARACTER.GetSheHe] aportó al gobierno no se reemplaza fácilmente con ceremonias."

 new_world_pioneer: "Pionero del Nuevo Mundo"
 desc_new_world_pioneer: "Este asesor llegó con el instinto del explorador y el pragmatismo del colono. Bajo su guía, nuestra presencia en las nuevas tierras ha sido más sistemática y rentable."
 new_world_pioneer_die_desc: "[CHARACTER.GetName] ha muerto. La frontera que [CHARACTER.GetSheHe] ayudó a abrir no tendrá ningún monumento para [CHARACTER.GetHerHim]; los pioneros rara vez reciben monumentos. Reciben los lugares que vienen después."

 # ============================================================
 # FAMILY D — MILITARY COST SPECIALISTS
 # ============================================================

 # Age 2-4 Early Tier
 infantry_drillmaster: "Maestro de Instrucción de Infantería"
 desc_infantry_drillmaster: "Este veterano ha dedicado su carrera a convertir levas novatas en soldados disciplinados. Bajo su mando, la infantería cuesta menos en reclutarse y rinde mejor en el campo."

 scout_captain: "Capitán explorador"
 desc_scout_captain: "Rápido, silencioso y siempre adelantado a la fuerza principal: este consejero ha convertido nuestro reconocimiento de caballería en una forma de arte. La caballería ligera es más barata y se utiliza mejor bajo su doctrina."
 scout_captain_die_desc: "[CHARACTER.GetName] ha fallecido. Los jinetes que [CHARACTER.GetSheHe] entrenó seguirán cabalgando, pero menos se ofrecerán voluntarios para las rutas más peligrosas sin [CHARACTER.GetHerHim] para guiarlos."

 military_engineer: "Ingeniero militar"
 desc_military_engineer: "El asedio es una ciencia, y este asesor ha aportado rigor científico a la misma. Bajo su supervisión, la construcción de artillería y equipo de infantería pesada cuesta menos, y los resultados hablan por sí solos ante los muros de las fortificaciones enemigas."
 military_engineer_die_desc: "[CHARACTER.GetName] ha muerto. Los manuales de asedio que [CHARACTER.GetSheHe] escribió se utilizarán mucho después de que el autor sea olvidado; esa es la inmortalidad del ingeniero."

 # Age 5-6 Strong Tier
 commissariat_officer: "Oficial de Intendencia"
 desc_commissariat_officer: "Un ejército que no puede alimentarse ni equiparse no puede luchar. Este asesor ha resuelto el desafío logístico que arruina las campañas menores, asegurando que nuestra infantería esté siempre debidamente provista y que la nobleza se beneficie de los contratos."
 commissariat_officer_die_desc: "[CHARACTER.GetName] ha muerto. Las cadenas de suministro que [CHARACTER.GetSheHe] estableció seguirán funcionando; la verdadera prueba llegará cuando se vean obligados a improvisar sin [CHARACTER.GetHerHim]."

 cavalry_marshal: "Mariscal de caballería"
 desc_cavalry_marshal: "Los mejores soldados de caballería del reino recurren a este asesor para definir su doctrina, sus estándares de equipamiento y su sentido de identidad profesional. La caballería bajo su mando cuesta la mitad y es el doble de peligrosa."
 cavalry_marshal_die_desc: "[CHARACTER.GetName] ha muerto. Todos los oficiales de caballería de este ejército aprendieron algo de [CHARACTER.GetHerHim], incluso aquellos que nunca sirvieron directamente bajo el mando de [CHARACTER.GetHerHis]."

 siege_engineer: "Ingeniero de asedio"
 desc_siege_engineer: "Los muros caen y los fuertes se rinden cuando este asesor está en el campo. Maestro de la doctrina de artillería y la construcción de asedios, ha hecho que nuestras operaciones ofensivas sean drásticamente más eficientes y que nuestras propias fortificaciones sean significativamente más difíciles de vulnerar."
 siege_engineer_die_desc: "[CHARACTER.GetName] ha muerto. Las fortificaciones que [CHARACTER.GetSheHe] diseñó permanecerán como [CHARACTER.GetHerHis] memorial, aunque probablemente [CHARACTER.GetSheHe] preferiría que fueran mejoradas en lugar de preservadas."

 supreme_commander: "Comandante Supremo"
 desc_supreme_commander: "Cada brazo del ejército ha sido tocado por la mano reformadora de este asesor. Los nobles se lo reconocen, el comisariado se lo reconoce, y la infantería, la caballería y la artillería cuestan menos porque han racionalizado todo el aparato de guerra."
 supreme_commander_die_desc: "[CHARACTER.GetName] ha muerto. El ejército que [CHARACTER.GetSheHe] construyó es nuestra herencia. Esperemos ser dignos de él."

 # ============================================================
 # FAMILY E — PARLIAMENTARY / DIPLOMATIC SPECIALISTS
 # ============================================================

 parliamentary_broker: "Intermediario parlamentario"
 desc_parliamentary_broker: "El Parlamento es un instrumento complicado, y este asesor lo maneja como un virtuoso. Bajo su guía, el apoyo legislativo se ha vuelto drásticamente más fiable y el umbral de apoyo para las votaciones más difíciles ha disminuido."
 parliamentary_broker_die_desc: "[CHARACTER.GetName] ha muerto. Las relaciones parlamentarias que [CHARACTER.GetSheHe] cultivó sobrevivirán a [CHARACTER.GetHerHim], pero las relaciones eran personales, y las relaciones personales mueren con sus dueños."

 diplomatic_attache: "Agregado diplomático"
 desc_diplomatic_attache: "La letra pequeña de los acuerdos internacionales es donde se construyen o destruyen los imperios, y este asesor es un maestro en ello. Los costes de anexión son menores gracias a su cuidadosa negociación, y nuestro alcance diplomático ha crecido en consecuencia."
 diplomatic_attache_die_desc: "[CHARACTER.GetName] ha fallecido. Los tratados que [CHARACTER.GetSheHe] redactó seguirán siendo vinculantes; los tratados sobreviven a sus autores, que es precisamente el objetivo."

 grand_chancellor: "Gran Canciller"
 desc_grand_chancellor: "Este asesor no se limita a llevar a cabo la diplomacia; dirige la política exterior. Todo el aparato de nuestro compromiso internacional ha sido remodelado bajo su supervisión: la capacidad, la reputación, la anexión y la posición parlamentaria han mejorado."
 grand_chancellor_die_desc: "[CHARACTER.GetName] ha muerto. El edificio diplomático que [CHARACTER.GetSheHe] construyó fue un monumento a toda una vida de trabajo paciente y calculador. Sus cimientos resistirán; esperemos que sus plantas superiores no requieran de [CHARACTER.GetHerHis] genio particular para mantenerse."

 # ============================================================
 # FAMILY F — ACTION-FORGED TRAITS
 # ============================================================

 seasoned_integrator: "Integrador experimentado"
 desc_seasoned_integrator: "Los años dedicados a supervisar la absorción de nuevos territorios han otorgado a este ministro un dominio excepcional de la integración, tanto en su maquinaria administrativa como en sus condiciones diplomáticas previas. Bajo su guía, la integración avanza más rápido y los costes de anexión son menores."
 seasoned_integrator_die_desc: "[CHARACTER.GetName] ha muerto. Los marcos de integración que [CHARACTER.GetSheHe] estableció seguirán funcionando; las burocracias, como los ríos, encuentran su propio nivel."

 frontier_administrator: "Administrador Fronterizo"
 desc_frontier_administrator: "Este ministro ha hecho de la frontera su hábitat natural: trazando nuevos territorios, resolviendo disputas entre colonos y pueblos existentes, y convirtiendo reclamaciones distantes en asentamientos funcionales. La colonización llega más rápido y los migrantes vienen más dispuestos."
 frontier_administrator_die_desc: "[CHARACTER.GetName] ha muerto. Los puestos fronterizos que [CHARACTER.GetSheHe] estableció son permanentes; el conocimiento de cómo construirlos era propiedad exclusiva de [CHARACTER.GetHerHis]."

 development_patron: "Mecenas del desarrollo"
 desc_development_patron: "La capital, bajo el cuidado de este ministro, se ha desarrollado con una rapidez inusual, y los métodos que aplicó se han extendido discretamente al resto del reino. El desarrollo crece más rápido y los edificios cuestan menos dondequiera que dirijan su atención."
 development_patron_die_desc: "[CHARACTER.GetName] ha fallecido. El crecimiento que [CHARACTER.GetSheHe] fomentó no fue accidental; fue el producto de un enfoque sistemático que ahora tendrá que reconstruirse desde los principios básicos."

 espionage_director: "Director de Espionaje"
 desc_espionage_director: "Las sombras y el silencio son las herramientas de este ministro. Bajo su supervisión, nuestras redes de inteligencia se han vuelto más extensas y fiables, y nuestra reputación diplomática se ha beneficiado discretamente de lo que sabemos —y de lo que otros temen que sepamos."
 espionage_director_die_desc: "[CHARACTER.GetName] ha muerto. Las redes que [CHARACTER.GetSheHe] dirigía requerirán una reconstrucción cuidadosa; la inteligencia, a diferencia de la mayoría de las formas de conocimiento, muere con sus custodios."

 treasury_enforcer: "Ejecutor del Tesoro"
 desc_treasury_enforcer: "Este ministro ha aplicado un ojo forense a cada línea de los gastos de la corona. El gasto de la corte ha disminuido, el gabinete se ha vuelto más eficiente y nadie en la corte se ofrece voluntario para gastos innecesarios mientras ocupa su cargo."
 treasury_enforcer_die_desc: "[CHARACTER.GetName] ha fallecido. La disciplina que [CHARACTER.GetSheHe] impuso no era popular, pero era productiva. El tesoro notará la ausencia antes que los ministros."

 retired_legend: "Leyenda retirada"
 desc_retired_legend: "Este ministro ha pasado la antorcha de su obra más importante a manos más jóvenes y, al hacerlo, se ha convertido en algo más raro que un consejero activo: una institución viviente. Su presencia continua en la corte conlleva un peso de sabiduría acumulada que hace que su reemplazo sea impensable, incluso mientras se retira de las tareas más exigentes."
 retired_legend_die_desc: "[CHARACTER.GetName] ha muerto. Se retiró en la cima de su poder y eligió pasar sus últimos años como mentor en lugar de como monumento. Eso es, a su manera, lo más notable que hizo."

 # ============================================================
 # ACTION-FORGED TRAIT EVENTS (cc_cond.30-34)
 # ============================================================

 cc_cond.30.title: "El especialista en integración"
 cc_cond.30.desc: "[minister.GetName] ha estado dirigiendo la integración de nuevos territorios con una competencia poco común. La maquinaria administrativa y diplomática implicada es compleja, y [minister.GetSheHe] ha dominado ambas. ¿Qué reconocimiento formal desea otorgar la corona?"
 cc_cond.30.a: "Nombrar a [minister.GetName] como nuestro Integrador Experimentado; que su maestría se convierta en un activo duradero."
 cc_cond.30.b: "Reconocer el trabajo capaz de [minister.GetName] sin una elevación formal."

 cc_cond.31.title: "El estratega colonial"
 cc_cond.31.desc: "[minister.GetName] ha estado a la vanguardia de nuestra expansión fronteriza, no solo administrándola, sino dando forma a su dirección. Los colonos llegan con más facilidad y nuestras expediciones avanzan más rápido cuando [minister.GetSheHe] está involucrado. ¿Qué papel les asignamos?"
 cc_cond.31.a: "Nombrar a [minister.GetName] como nuestro Administrador de Fronteras; formalizar lo que ya es."
 cc_cond.31.b: "Elogiar el trabajo fronterizo de [minister.GetName] sin un título formal."

 cc_cond.32.title: "El Comisionado de Desarrollo"
 cc_cond.32.desc: "[minister.GetName] ha estado supervisando un programa sostenido de desarrollo en nuestra creciente capital, y los resultados son visibles en piedra y madera por toda la ciudad. ¿Cómo reconoceremos lo que han construido?"
 cc_cond.32.a: "Nombrar a [minister.GetName] como Patrón del Desarrollo; que sus métodos se apliquen en todo el reino."
 cc_cond.32.b: "Reconoce el trabajo de [minister.GetName] sin un nombramiento formal."

 cc_cond.33.title: "El manipulador en la sombra"
 cc_cond.33.desc: "[minister.GetName] ha estado dirigiendo una operación de contrainteligencia discreta pero notablemente efectiva. Nuestros enemigos encuentran que su información es extrañamente poco fiable, y nuestra reputación diplomática se ha beneficiado de capacidades que ninguna corte extranjera puede explicar del todo. ¿Cómo procedemos?"
 cc_cond.33.a: "Formalizar el papel de [minister.GetName] como Director de Espionaje; que crezca la red de sombras."
 cc_cond.33.b: "Permitir que [minister.GetName] continúe su trabajo sin un título formal."

 cc_cond.34.title: "El inspector del tesoro"
 cc_cond.34.desc: "[minister.GetName] ha completado una revisión exhaustiva de los gastos de la corona, y el informe es una lectura incómoda para todos excepto para el tesoro. Las cifras sugieren que es posible realizar ahorros sustanciales. ¿Qué haremos con los hallazgos de [minister.GetHerHis]?"
 cc_cond.34.b: "Implementa algunas de las recomendaciones de [minister.GetName] sin un nombramiento formal."

 # ============================================================
 # LEGENDARY TRAITS
 # ============================================================

 philosopher_king: "Rey Filósofo"
 desc_philosopher_king: "Este gobernante combina un poder intelectual real con autoridad política. El resultado es una corte donde las ideas tienen peso y las artes y las ciencias florecen."

 grand_vizier_legendary: "Gran Visir"
 desc_grand_vizier_legendary: "Hay ministros, y luego está esto. La reputación del Gran Visir precede a cada contacto diplomático, su red abarca el mundo conocido y las potencias extranjeras tratan sus palabras como política vinculante. Han hecho que nuestro reino sea más formidable de lo que podrían hacer sus ejércitos por sí solos."
 grand_vizier_legendary_die_desc: "[CHARACTER.GetName] ha muerto. El mundo se reorganizará ante la ausencia de [CHARACTER.GetHerHis] influencia, y algunas de esas reorganizaciones no serán en nuestro beneficio."

 tribune_of_the_people: "Tribuno del Pueblo"
 desc_tribune_of_the_people: "Este asesor es genuinamente popular entre el pueblo llano y utiliza esa popularidad para gobernar: agilizando la legislación a través del parlamento, suprimiendo los disturbios y haciendo que los estamentos se sientan escuchados."
 tribune_of_the_people_die_desc: "[CHARACTER.GetName] ha muerto. El pueblo llorará de forma visible y ruidosa, lo cual es un tipo de mensaje político para quienes ahora ostentan el poder."

 urban_planner_die_desc: "[CHARACTER.GetName] ha muerto. Los planos que [CHARACTER.GetSheHe] dejó seguirán dando forma a nuestras ciudades mucho después de que [CHARACTER.GetHerHis] mano haya quedado inmóvil."
 serf_overseer_die_desc: "[CHARACTER.GetName] ha muerto. El sistema que [CHARACTER.GetSheHe] mantenía no era popular, pero era productivo. Lo que suceda a continuación dependerá de quién ocupe [CHARACTER.GetHerHis] silla."
 emancipation_minister_die_desc: "[CHARACTER.GetName] ha partido. Las libertades que [CHARACTER.GetSheHe] defendió rara vez se ceden sin luchar; eso, al menos, es su legado de [CHARACTER.GetHerHis]."
 estate_guardian_die_desc: "[CHARACTER.GetName] ha muerto. El orden tradicional que [CHARACTER.GetSheHe] preservó se enfrentará pronto a sus desafiantes; se enfrentará a ellos sin [CHARACTER.GetHerHis] defensa."
 elite_trainer_die_desc: "[CHARACTER.GetName] ha muerto. Los oficiales que [CHARACTER.GetSheHe] entrenó continuarán con [CHARACTER.GetHerHis] métodos; después de todo, la disciplina se propaga por sí sola."
 peacemaker_counselor_die_desc: "[CHARACTER.GetName] ha partido. Los acuerdos tácitos que [CHARACTER.GetSheHe] mantenía con nuestros vecinos nunca se pusieron por escrito; solo existían en [CHARACTER.GetHerHis] relaciones. Esa es la tragedia del pacificador."
 continental_marshal_die_desc: "[CHARACTER.GetName] ha muerto. Los regimientos que [CHARACTER.GetSheHe] entrenó y los fuertes que [CHARACTER.GetSheHe] encargó llevarán [CHARACTER.GetHerHis] nombre en las órdenes de batalla mucho después de [CHARACTER.GetHerHis] muerte."
 hellenistic_scholar_die_desc: "[CHARACTER.GetName] has passed. In [CHARACTER.GetHerHis] own way, [CHARACTER.GetSheHe] has added another chapter to a very long book."
 christian_diplomat_die_desc: "[CHARACTER.GetName] ha muerto. La red de conexiones cristianas que [CHARACTER.GetSheHe] mantenía se deshilachará sin [CHARACTER.GetHerHis] atención constante."
 infantry_drillmaster_die_desc: "[CHARACTER.GetName] ha muerto. Los sargentos que [CHARACTER.GetSheHe] entrenó transmitirán [CHARACTER.GetHerHis] métodos a través de las filas durante una generación."
 cc_cond.34.a: "Nombra a [minister.GetName] como Ejecutor del Tesoro; que su auditoría de [minister.GetHerHis] se convierta en política."
 philosopher_king_die_desc: "[CHARACTER.GetName] ha muerto. La historia discutirá si [CHARACTER.GetSheHe] fue realmente lo que el título afirmaba. Los libros que [CHARACTER.GetSheHe] escribió y las instituciones que [CHARACTER.GetSheHe] fundó argumentarán en [CHARACTER.GetHerHis] nombre."
