l_spanish:
 # ============================================================
 # SUBJECT TYPES
 # ============================================================
 LEAD_provincial_governorate: "Corona"
 AM_provincial_governorate: "Governación provincial"
 CANCEL_provincial_governorateTITLE: "Disolver el gobierno provincial"
 CANCEL_provincial_governorate_DESC: "Revocar el fuero de la gobernación, poniendo fin a la administración nombrada por la Corona y devolviendo la región al control directo."

 LEAD_tax_farm: "Corona"
 AM_tax_farm: "Arrendamiento de impuestos"
 CANCEL_tax_farmTITLE: "Finalizar Acuerdo de Exacción Fiscal"
 CANCEL_tax_farm_DESC: "Rescindir el contrato de arrendamiento de impuestos, restaurando la recaudación directa y poniendo fin a la concesión del señor sobre estos ingresos."

 LEAD_military_march: "Señor"
 AM_military_march: "Marcha militar"
 CANCEL_military_marchTITLE: "Revocar el fuero de la marca"
 CANCEL_military_march_DESC: "Revocar el fuero de la marca, despojando al señor de la marca de su autoridad militar ofensiva. La frontera será menos agresiva y menos impredecible."

 provincial_governorate: "Governación provincial"
 provincial_governorate_desc: "Una región administrativa de alta autonomía gobernada por un magnate nombrado por la Corona. La gobernación gestiona sus propios asuntos internos y defiende nuestras fronteras, pero las ambiciones del Gobernador no siempre coinciden con las nuestras."
 provincial_governorate_upgrade_tt: "El Gobernador provincial puede ser ascendido a Palatinado una vez que haya transcurrido el tiempo suficiente."

 tax_farm: "Arrendamiento de impuestos"
 tax_farm_desc: "Un acuerdo de extracción explotador en el que un señor poderoso gestiona la recaudación de ingresos a cambio de una parte de los beneficios. Extremadamente rentable a corto plazo, profundamente inestable a largo plazo. Las poblaciones tributarias acabarán exigiendo un alivio."
 tax_farm_upgrade_tt: ""

 military_march: "Marcha militar"
 military_march_desc: "Un vasallo fronterizo ofensivo que posee una carta militar especial para proyectar poder más allá de nuestras fronteras. El Señor de la Marca es formidable, leal (cuando los nobles están satisfechos) y, ocasionalmente, imposible de controlar. Realizarán incursiones contra nuestros vecinos, ya sea que nosotros lo sancionemos o no."
 military_march_upgrade_tt: ""

 # ============================================================
 # ADVANCES
 # ============================================================
 late_governorate_advance: "Gobernanza provincial"
 late_governorate_advance_desc: "Un sistema formalizado de gobernaciones nombradas por la Corona permite al reino extender su alcance administrativo sobre regiones distantes sin una anexión directa. Desbloquea el tipo de súbdito Gobernación Provincial, el privilegio de estamento Carta de Gobernación y la Reforma de la Gobernación."

 tax_farming_advance: "Arrendamiento de impuestos"
 tax_farming_advance_desc: "Contratación de la recaudación de ingresos a señores locales poderosos, por un precio. Desbloquea el tipo de vasallo Granja de impuestos, el privilegio de estamento Carta tributaria y la Reforma de arrendamiento de impuestos."

 military_march_advance: "Marchas Militares"
 military_march_advance_desc: "Designar territorios fronterizos como marcas militares crea amortiguadores ofensivos que extienden nuestro poder en la frontera. Desbloquea el tipo de súbdito Marca Militar, el privilegio de estamento Carta de la Marca y la Reforma de la Carta de la Marca."

 # ============================================================
 # GOVERNMENT REFORMS — STANDARD
 # ============================================================
 cc_governorate_reform: "Sistema de Gobernaciones"
 cc_governorate_reform_desc: "Formaliza el sistema de gobernaciones provinciales nombradas por la Corona, mejorando la capacidad administrativa en todo el reino."

 cc_tax_farming_reform: "Contratos de arrendamiento de impuestos"
 cc_tax_farming_reform_desc: "Sistematiza la práctica de delegar la recaudación de impuestos en señores poderosos, reduciendo los gastos burocráticos a cambio de eficiencia local."

 cc_march_charter_reform: "Carta de Marca"
 cc_march_charter_reform_desc: "Emite cartas formales a los territorios fronterizos designándolos como marcas militares, creando una red de amortiguadores ofensivos a lo largo de las fronteras más disputadas del reino."

 # ============================================================
 # GOVERNMENT REFORMS — LEGENDARY
 # ============================================================
 cc_philosophers_court_reform: "La corte del filósofo"
 cc_philosophers_court_reform_desc: "La corte más erudita del mundo. La investigación se acelera, las instituciones se difunden y la reputación intelectual del reino atrae talento de todo el mundo conocido."

 cc_grand_bazaar_reform: "El Gran Bazar"
 cc_grand_bazaar_reform_desc: "Una red comercial y diplomática cosmopolita formalizada como principio de gobierno. Los centros comerciales florecen, la capacidad diplomática se expande y nuestra reputación en el mundo islámico se convierte en un activo estratégico."

 cc_iron_hegemony_reform: "La hegemonía de hierro"
 cc_iron_hegemony_reform_desc: "Dominio militar formalizado como principio constitucional. Todas las ramas del ejército están subsidiadas por el estado; los estamentos nobles están ligados a la maquinaria militar; los vecinos del reino ajustan su comportamiento en consecuencia."

 cc_parliamentary_compromise_reform: "Compromiso parlamentario"
 cc_parliamentary_compromise_reform_desc: "Un acuerdo formal entre la corona y la legislatura que hace que el parlamento sea más eficaz y más legítimo simultáneamente."

 cc_mandate_bureaucracy_reform: "Mandato de Burocracia"
 cc_mandate_bureaucracy_reform_desc: "La implementación del ideal burocrático confuciano: gobernanza meritocrática, relaciones adecuadas y la premisa de que el estado existe para servir al orden moral. Disponible para los reinos de Asia Oriental y Sudoriental."

 cc_peoples_assembly_reform: "Asamblea Popular"
 cc_peoples_assembly_reform_desc: "En la era de la revolución, un gobierno que genuinamente cuenta con el consentimiento popular. El malestar disminuye; la eficiencia legislativa aumenta; la historia toma nota."

 # ============================================================
 # ESTATE PRIVILEGES
 # ============================================================
 ep_nobles_governorate_charter: "Carta de Gobernación"
 ep_nobles_governorate_charter_desc: "La nobleza recibe autoridad formal para administrar gobernaciones provinciales en nombre de la Corona, a cambio de contribuciones al desarrollo y lealtad continua."

 ep_nobles_march_charter: "Carta de Marca"
 ep_nobles_march_charter_desc: "La nobleza recibe autoridad formal para establecer marcas militares a lo largo de la frontera: poderosas, ofensivas y, ocasionalmente, imposibles de controlar plenamente."

 ep_nobles_diplomatic_court: "Corte diplomática"
 ep_nobles_diplomatic_court_desc: "La nobleza financia y organiza una corte diplomática formal que eleva la reputación del reino en el mundo islámico, proyectando poder y prestigio en igual medida."

 ep_burghers_tax_charter: "Carta tributaria"
 ep_burghers_tax_charter_desc: "Los estamentos mercantiles reciben autoridad formal para administrar la recaudación de impuestos en regiones designadas, reduciendo los costes burocráticos a cambio de una comisión comercial de los ingresos."

 ep_burghers_parliamentary_charter: "Carta parlamentaria"
 ep_burghers_parliamentary_charter_desc: "Los burgueses reciben una carta parlamentaria formal que codifica sus derechos legislativos, aumentando simultáneamente el apoyo parlamentario y la influencia política comercial."

 # ============================================================
 # SUBJECT DRAWBACK MODIFIERS
 # ============================================================
 cc_subject_autonomy_pressure: "Presión por la autonomía"
 cc_subject_autonomy_pressure_desc: "La población del súbdito está inquieta y exige un mayor autogobierno. Se están organizando movimientos rebeldes."

 cc_subject_tax_relief: "Alivio fiscal"
 cc_subject_tax_relief_desc: "La reducción de la presión de extracción ha calmado a la población del súbdito. El malestar disminuye y la legitimidad se recupera lentamente."

 # ============================================================
 # LEGEND MODIFIER
 # ============================================================
 cc_legend_holy_empire: "Imperio Sagrado"
 cc_legend_holy_empire_desc: "El reino ha alcanzado el estatus de Imperio Santo: una entidad política sagrada en la que la autoridad espiritual y temporal se refuerzan mutuamente. La influencia religiosa fluye hacia el exterior, la conversión se acelera y el poder político del clero alcanza su apogeo."

