l_spanish:
 # === cc_bonds.60 — The March Lord's Formal Investiture ===
 cc_bonds.60.title: "La investidura del señor de la marca"
 cc_bonds.60.desc: "El nuevo señor de [bond_subj.GetName] está listo para recibir su investidura formal. Entre los señores fronterizos, la ceremonia no es mera tradición: es el lenguaje del estatus, la obligación y la confianza. Una ceremonia grandiosa nos costaría prestigio y oro que podríamos gastar en otra parte. Una ceremonia modesta cumpliría el mismo propósito legal por una fracción del coste. La casa del señor de la marca ha estado observando cómo respondemos a esa cuestión."
 cc_bonds.60.a: "Celebrar una ceremonia grandiosa con todos los privilegios nobiliarios. Este señor lo merece."
 cc_bonds.60.b: "Celebrar una investidura estándar. Adecuada, digna y proporcionada."
 cc_bonds.60.c: "Bastará con una ceremonia mínima. La ley exige el juramento, no el despliegue escénico."

 # === cc_bonds.61 — Sharing the War Spoils ===
 cc_bonds.61.title: "Reparto del botín de guerra"
 cc_bonds.61.desc: "Nuestras fuerzas y los soldados del señor de la marca lucharon juntos en la reciente campaña, y ahora comienza el ajuste de cuentas. Las fuerzas de la marca sufrieron bajas, guarnecieron terrenos difíciles y anclaron nuestro flanco. Qué parte del botín reciban es, estrictamente hablando, una decisión nuestra. Ellos lo saben. Observan atentamente para ver si recordamos lo que aportaron, o si se les agradecerá con palabras y se les compensará con nada."
 cc_bonds.61.a: "Darles una parte generosa. Se lo han ganado, y más."
 cc_bonds.61.b: "Dividir el botín según el acuerdo estándar."
 cc_bonds.61.c: "La mayor parte del botín pertenece a la Corona. Así es el acuerdo."

 # === cc_bonds.62 — March Lord Requests Garrison Funding ===
 cc_bonds.62.title: "Solicitud de financiación de la guarnición"
 cc_bonds.62.desc: "Un despacho de [bond_subj.GetName] expone el caso claramente: las fortificaciones fronterizas se están deteriorando, la guarnición es insuficiente y el señor de la marca no tiene ingresos suficientes para abordar ambos problemas simultáneamente. Solicita financiación de la Corona. La marca existe para defender nuestra frontera, lo cual nos beneficia tanto a nosotros como a él. El hecho de que decidamos reconocer ese interés compartido en nuestra asignación —o tratarlo como un problema exclusivo suyo— será recordado por cada oficial a su servicio."
 cc_bonds.62.a: "Financia la guarnición por completo. La frontera es nuestra responsabilidad compartida."
 cc_bonds.62.b: "Proporcionar financiación parcial. Nosotros compartimos el coste, ellos el resto."
 cc_bonds.62.c: "La frontera es su mando. Deben financiarla ellos mismos."

 # === cc_bonds.63 — The March Lord's Feud ===
 cc_bonds.63.title: "La disputa del señor de la marca"
 cc_bonds.63.desc: "El señor de la marca de [bond_subj.GetName] se ha visto envuelto en una amarga disputa con una casa noble vecina: una reclamación de límites que ha escalado hasta convertirse en un asunto de honor. Ambas partes han apelado a nuestra corte. La casa vecina tiene conexiones más profundas entre la nobleza, una mejor posición legal sobre la cuestión de los límites y más amigos en la capital. El señor de la marca tiene algo más: es nuestro, y está observando para ver si eso importa."
 cc_bonds.63.a: "Apoyar al señor de la marca. Independientemente de los méritos legales, es nuestro hombre."
 cc_bonds.63.b: "Medie entre las partes. Encuentre una resolución que ambos puedan aceptar."
 cc_bonds.63.c: "La ley habla por sí misma. Fallamos a favor de la casa vecina."

 # === cc_bonds.64 — Frontier Administration Rights ===
 cc_bonds.64.title: "Derechos de Administración Fronteriza"
 cc_bonds.64.desc: "El señor de la marca de [bond_subj.GetName] ha presentado una petición formal: la población fronteriza ha sido gobernada durante mucho tiempo bajo acuerdos ad hoc que dejan muchas cuestiones legales sin resolver. Propone que la Corona conceda formalmente a la marca autoridad judicial sobre su propio territorio: el derecho a resolver disputas, hacer cumplir contratos e imponer sanciones locales. Nuestro asesor legal señala que tal autoridad, una vez concedida, es difícil de revocar. Nuestro asesor militar señala que un señor con plena autoridad administrativa sobre su territorio es mucho más fácil de gobernar que uno que debe discutir cada decisión a través de la capital."
 cc_bonds.64.a: "Conceder plena autoridad judicial a la marca. La frontera necesita una gobernanza clara."
 cc_bonds.64.b: "Mantener los derechos judiciales de la Corona sobre la marca. La autoridad permanece con nosotros."
 cc_bonds.64.c: "Establecer una corte fronteriza conjunta. Gobernamos juntos."

 # === cc_bonds.65 — Campaign Alongside the March Lord ===
 cc_bonds.65.title: "Campaña junto al Señor de la Marca"
 cc_bonds.65.desc: "La campaña actual ofrece una oportunidad inusual. El señor de marcha de [bond_subj.GetName] está comprometido en una frontera a la que nuestras fuerzas también se aproximan. Podríamos combinar nuestros esfuerzos y luchar junto a él personalmente —o enviar a un general real en nuestro lugar— o dejar que opere en su teatro de forma independiente. La cuarta opción, planteada por nuestros oficiales de logística, es redirigir sus fuerzas enteramente a nuestro frente principal. Nos serían de gran utilidad allí. Lo que ellos pensarían de la reasignación es una cuestión distinta."
 cc_bonds.65.a: "Comandaré personalmente junto al señor de la marcha."
 cc_bonds.65.b: "Enviar un general real. La coordinación es importante; la presencia es opcional."
 cc_bonds.65.c: "Que el señor de la marca gestione su teatro de forma independiente. Él es quien mejor lo conoce."
 cc_bonds.65.d: "Reasignar las fuerzas de la marca a nuestro frente principal, donde son necesarias."

 # === cc_bonds.66 — The March Lord's Heir ===
 cc_bonds.66.title: "El heredero del señor de la marca"
 cc_bonds.66.desc: "El señor de la marca de [bond_subj.GetName] tiene un heredero de edad adecuada. Hay una decisión que tomar. Podríamos invitar al joven heredero a nuestra corte, para que aprenda nuestras costumbres, establezca conexiones entre nuestra nobleza y crezca comprendiendo que la Corona es su patrón natural. El señor de la marca sabe lo que esto significa: su hijo crecería siendo tanto nuestro como suyo. Alternativamente, podríamos concertar un matrimonio favorable que fortalezca la posición de la familia sin requerir que el heredero deje su hogar. O podríamos dejar que el señor de la marca maneje el asunto a su debido tiempo."
 cc_bonds.66.a: "Invitar al heredero a nuestra corte como pupilo. Aprenderá a servir a la Corona."
 cc_bonds.66.b: "Organizar un matrimonio prestigioso para el heredero."
 cc_bonds.66.c: "Este es un asunto privado de la casa del señor de la marca."
