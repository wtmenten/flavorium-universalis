l_spanish:
 # === cc_bonds.40 — The Puppet Requests an Ambassador ===
 cc_bonds.40.title: "El títere solicita un embajador"
 cc_bonds.40.desc: "El gobierno de [bond_subj.GetName] ha presentado una solicitud formal de representación diplomática permanente en nuestra corte. Su razonamiento es moderado: como estado estrechamente vinculado a nuestros intereses, creen que merecen voz en las decisiones que les afectan. Es una petición razonable. También es la primera prueba de qué tipo de relación pretendemos tener."
 cc_bonds.40.a: "Establecer una misión diplomática completa. Merecen una representación adecuada."
 cc_bonds.40.b: "Asignar un representante limitado. Representación, pero sin pleno estatus."
 cc_bonds.40.c: "Rechazar la solicitud. Nuestra relación no requiere de una embajada formal."

 # === cc_bonds.41 — Puppet Economic Integration ===
 cc_bonds.41.title: "Integración económica del vasallo"
 cc_bonds.41.desc: "Nuestros consejeros han redactado un memorando sobre la relación económica entre nuestro reino y [bond_subj.GetName]. Se presentan tres opciones. Un sistema monetario unificado simplificaría considerablemente la fiscalidad y la contabilidad comercial, pero el memorando señala, en lenguaje cauteloso, que la transición sería «administrativamente desafiante para las poblaciones locales». Las otras opciones implican menos perturbaciones y menos control."
 cc_bonds.41.a: "Impón un sistema monetario unificado. Racionaliza la relación."
 cc_bonds.41.b: "Mantener sistemas monetarios paralelos. Integración sin imposición."
 cc_bonds.41.c: "Establecer acuerdos comerciales conjuntos. Beneficio mutuo, términos mutuos."

 # === cc_bonds.42 — The Puppet's Internal Faction ===
 cc_bonds.42.title: "La facción interna del títere"
 cc_bonds.42.desc: "Los informes de inteligencia de [bond_subj.GetName] describen una división interna significativa. Una facción es ampliamente amistosa con nuestros intereses; la otra cuenta con un mayor apoyo popular. Respaldar a la facción pro-Corona extendería nuestra influencia en los asuntos internos del títere, pero la interferencia encubierta conlleva riesgos. El descubrimiento sería políticamente costoso. Por otra parte, es posible que la facción popular no siga siendo amistosa."
 cc_bonds.42.a: "Apoyar encubiertamente a la facción pro-Corona."
 cc_bonds.42.b: "Apoyar a la facción popular. Un títere estable nos sirve mejor."
 cc_bonds.42.c: "No intervenir. Los asuntos internos son cosa suya."

 # === cc_bonds.43 — Directing Puppet Foreign Policy ===
 cc_bonds.43.title: "Dirigiendo la política exterior del títere"
 cc_bonds.43.desc: "El estado títere de [bond_subj.GetName] ha formado una alianza diplomática que complica nuestra propia posición exterior. Necesitamos que la terminen. La cuestión es cómo entregamos ese mensaje: como una orden, como un requisito con condiciones, o a través de una consulta que llegue al mismo resultado mientras los hacen sentir escuchados."
 cc_bonds.43.a: "Ordenarles que rompan la alianza inmediatamente."
 cc_bonds.43.b: "Exigir la ruptura con ciertas condiciones adjuntas."
 cc_bonds.43.c: "Consúltales primero. Llegad al mismo resultado juntos."

 # === cc_bonds.44 — Puppet Succession Crisis ===
 cc_bonds.44.title: "Crisis de sucesión del vasallo"
 cc_bonds.44.desc: "La casa reinante de [bond_subj.GetName] se ha fracturado. Dos pretendientes disputan la sucesión: uno es nuestro candidato preferido, el otro cuenta con un apoyo popular más amplio dentro del estado títere. Nuestro candidato preferido no puede ganar sin nosotros. Podemos forzar el resultado que deseamos. La cuestión es si forzarlo es la elección correcta."
 cc_bonds.44.a: "Instale a nuestro candidato preferido por la fuerza. Asegure la sucesión."
 cc_bonds.44.b: "Apoyar al heredero popular. Que el pueblo del títere elija."
 cc_bonds.44.c: "Intermedie un proceso supervisado. Un compromiso que ambas partes puedan aceptar."

 # === cc_bonds.45 — Puppet Requests Military Expansion ===
 cc_bonds.45.title: "El vasallo solicita expansión militar"
 cc_bonds.45.desc: "El gobierno de [bond_subj.GetName] ha presentado una propuesta para ampliar sus fuerzas permanentes. Alegan preocupaciones sobre la seguridad fronteriza y sostienen que un ejército más fuerte los convierte en un socio más valioso para nosotros. No se equivocan, pero un títere más fuerte es también uno más independiente. La propuesta incluye una solicitud de asistencia financiera."
 cc_bonds.45.a: "Aprobar la expansión y proporcionar la financiación."
 cc_bonds.45.b: "Aprobar la expansión. Ellos mismos pueden financiarla."
 cc_bonds.45.c: "Rechazar la solicitud. Sus fuerzas actuales son suficientes."

 # === cc_bonds.46 — The Loyal Puppet's Request ===
 cc_bonds.46.title: "La petición del títere leal"
 cc_bonds.46.desc: "El gobierno de [bond_subj.GetName] ha enviado una carta personal; no una petición formal, ni un memorando diplomático, sino una carta. Describen su compromiso continuo con la relación, señalan varios sacrificios recientes realizados en nuestro nombre y piden algo a cambio. La petición es modesta. Lo que importa es si decidimos honrarla."
 cc_bonds.46.a: "Atiende la petición generosamente. La lealtad merece reconocimiento."
 cc_bonds.46.b: "Aprovechemos este momento de buena voluntad para pedir algo a cambio."
