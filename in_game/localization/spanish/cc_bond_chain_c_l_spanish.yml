l_spanish:
 # === cc_bonds.120 — The Fort Needs Repair ===
 cc_bonds.120.title: "El fuerte necesita reparaciones"
 cc_bonds.120.desc: "Ha llegado un informe de [bond_subj.GetName] indicando que la fortaleza clave que protege su territorio se ha deteriorado significativamente: muros agrietados, una puerta que gotea y una guarnición insuficiente. Los ingresos del propio súbdito no bastan para cubrir tanto las fortificaciones como la administración regular. Preguntan si la Corona podría contribuir a la reparación. El fuerte no es nuestro, estrictamente hablando. Pero tampoco lo es la frontera que custodia: es tan nuestra como suya."
 cc_bonds.120.a: "Financia las reparaciones completas. Compartimos la frontera; compartimos el coste."
 cc_bonds.120.b: "Financia reparaciones parciales. Contribuimos con lo que podemos."
 cc_bonds.120.c: "Deben financiarlo ellos mismos. La frontera es su mando."
 cc_bonds.120.d: "Archivar el informe. Lo abordaremos cuando las circunstancias lo permitan."

 # === cc_bonds.121 — The Fort Is Tested ===
 cc_bonds.121.title: "El fuerte es puesto a prueba"
 cc_bonds.121.desc_funded: "Una potencia vecina, que evidentemente esperaba que la frontera fuera tan permeable como hace una década, ha enviado fuerzas para sondear el territorio de [bond_subj.GetName]. Se encontraron con algo inesperado: una fortaleza totalmente reparada, una guarnición bien suministrada y un señor que había recibido los recursos para hacer su trabajo correctamente. La incursión ha sido repelida. El informe se archiva bajo 'defensa exitosa'. Lo que queda es la cuestión de a quién atribuir el mérito."
 cc_bonds.121.desc_partial: "Una potencia vecina ha puesto a prueba las fronteras de [bond_subj.GetName]. La fortaleza resistió, a duras penas. El comandante de la guarnición describió el enfrentamiento en términos que dejaron claro lo cerca que estuvieron del desastre. Con financiación total, el resultado habría sido decisivo; con la mitad de la financiación, estuvo muy ajustado. La frontera es segura. Pero la conversación sobre cuánto costará esa 'seguridad' la próxima vez no lo es."
 cc_bonds.121.desc_failed: "Una potencia vecina ha vulnerado la frontera de [bond_subj.GetName]. La fortaleza —con poca personal, sus murallas parcialmente colapsadas y su guarnición trabajando con suministros inadecuados— no pudo resistir. La ocupación fue breve; el vecino ha sido expulsado con la ayuda de la Corona. Pero el territorio fue ocupado. La población se vio afectada. La fortaleza que podría haberlo evitado sigue en mal estado, como lo ha estado desde que se presentó el informe. Como lo ha estado desde que decidimos no actuar según dicho informe."
 cc_bonds.121.a_credit: "Dejar claro que fue la inversión de la Corona lo que hizo posible esta defensa."
 cc_bonds.121.a_subject_credit: "El mérito pertenece al señor y a su guarnición. Lo diremos públicamente."
 cc_bonds.121.b_reinforce: "Enviar refuerzos y suministros de emergencia inmediatamente."
 cc_bonds.121.b_blame: "El resultado parcial refleja la insuficiente preparación del sujeto."
 cc_bonds.121.c_lead: "Lideraremos personalmente la recuperación. Se lo debemos."
 cc_bonds.121.c_supplies: "Enviar suministros y moneda. La Corona contribuirá a la reconstrucción."

 # === cc_bonds.122 — Who Commands the Fort? ===
 cc_bonds.122.title: "¿Quién Comanda el Fuerte?"
 cc_bonds.122.desc: "La fortaleza en [bond_subj.GetName] ha sido reconstruida, reforzada y dotada de personal. Ahora se erige como una de las posiciones defensivas más capaces de nuestra frontera. Hay una cuestión que la restauración ha hecho inevitable: ¿quién la comanda? El acuerdo actual es informal; el señor vasallo ha estado dirigiendo la guarnición por costumbre en lugar de por autoridad formal. Formalizar la estructura de mando implica elegir si esa autoridad recae en la Corona o en el señor que ha convivido con el fuerte durante una generación."
 cc_bonds.122.desc_positive: "La fortaleza en [bond_subj.GetName] ha sido reconstruida y dotada de personal. Se mantiene firme. La guarnición del señor vasallo —las mismas personas que la defendieron cuando llegó la prueba, y a quienes la Corona elogió públicamente— la han convertido en lo que es. La cuestión de la autoridad de mando formal llega ya condicionada. Cuando les dimos el crédito por la defensa, no solo estábamos siendo generosos; estábamos sentando un precedente que no han olvidado."
 cc_bonds.122.desc_bitter: "La fortaleza en [bond_subj.GetName] ha sido reconstruida. Ahora resiste porque la Corona pagó para restaurar lo que anteriormente se había negado a mantener, un detalle que el señor vasallo nunca ha mencionado directamente y que nunca nos ha permitido olvidar. Los acuerdos de mando han sido informales desde la reconstrucción. Cada temporada de silencio sobre el vasallo es un recordatorio implícito de lo que el acuerdo informal les cuesta."
 cc_bonds.122.a: "Nombrar a un oficial de la Corona al mando. No podemos dejar un activo estratégico a acuerdos informales."
 cc_bonds.122.b: "Conceder formalmente al señor vasallo la autoridad de mando sobre el fuerte. Se lo ha ganado."
 cc_bonds.122.c: "Establecer un acuerdo de mando conjunto. El fuerte es nuestro conjuntamente."
 cc_bonds.122.d: "Formalizar el mando bajo el señor vasallo. La decisión quedó zanjada cuando les dimos el crédito."
 cc_bonds.122.d.tooltip: "La buena voluntad derivada del reconocimiento público rinde frutos aquí. El señor vasallo recibe la autoridad de mando formal con fuertes ganancias políticas, personales y militares, y prestigio para la Corona."
 cc_bonds.122.e_repair: "Reconoce el antiguo fracaso. Compensa al señor antes de establecer el mando."
 cc_bonds.122.e_repair.tooltip: "Un acuerdo material y simbólico. El pago no anula el incumplimiento, pero abre la cuestión del mando sobre una base más favorable. La política y la percepción mejoran."
 cc_bonds.122.e_ignore: "Resuelve la cuestión del mando como si la historia no existiera."
 cc_bonds.122.e_ignore.tooltip: "El señor vasallo saca sus propias conclusiones del silencio. Tanto Per como Pol caen: la cuestión del mando ha sido respondida, pero no la de la relación."
