 # ============================================================
 # LEGACY EVENTS (cc_legacy namespace)
 # ============================================================

 cc_legacy.1.title: "Un mentor planea su sucesión"
 cc_legacy.1.desc: "[cc_legacy_elder.GetName] ha servido en esta corte durante más de una década, y los años empiezan a pasar factura. Un ministro de su talla no se jubila simplemente: deja una huella en la institución, y esa huella debe llenarse deliberadamente o abandonarse al azar. [cc_legacy_elder.GetName] ha solicitado una audiencia. Desea discutir el futuro."
 cc_legacy.1.a: "Permita que [cc_legacy_elder.GetName] transfiera los frutos de su experiencia a un ministro más joven."
 cc_legacy.1.a.tt: "El ministro veterano transfiere su rasgo principal de gabinete a un joven cortesano, obtiene el rasgo de Leyenda Retirada y se aparta del trabajo más exigente. La variable de seguimiento numérico se establece para cuando finalmente fallezca."
 cc_legacy.1.b: "Anima a [cc_legacy_elder.GetName] a invertir sus años restantes en cultivar las habilidades de un sucesor."
 cc_legacy.1.b.tt: "El ministro veterano entrena personalmente a un joven cortesano, otorgándole una mejora significativa de habilidades. El veterano conserva su rasgo pero invierte en la siguiente generación."
 cc_legacy.1.c: "Este no es el momento. Dejemos que [cc_legacy_elder.GetName] continúe como está."

 cc_legacy.3.title: "El Regalo Final del Anciano"
 cc_legacy.3.desc: "[cc_legacy_minister.GetName] ha muerto. Pasó sus últimos años como una Leyenda Retirada —una institución viviente, más un mentor que un ministro activo— y no desperdició ese tiempo. La estructura de todo lo que construyó ha quedado en fideicomiso. La cuestión ahora es cómo recibimos esa herencia."
 cc_legacy.3.a: "Aceptar el legado de [cc_legacy_minister.GetName]: que se convierta en una característica permanente de este reino."
 cc_legacy.3.a.tt: "Aplica un modificador de país permanente basado en la antigua especialización de gabinete del anciano. Sin coste."
 cc_legacy.3.b: "Consagrar el legado con una ceremonia y un fondo fundacional adecuado."
 cc_legacy.3.b.tt: "Cuesta 15× los ingresos mensuales. Aplica una versión mejorada y consagrada del modificador heredado, de forma permanente."

 cc_legacy.2.title: "Una leyenda parte"
 cc_legacy.2.desc: "[cc_legacy_minister.GetName] fue más que un ministro. La corte a la que sirvió, las instituciones que moldeó, las decisiones en las que influyó... estas cosas le sobrevivirán. Lo que decidamos hacer con su memoria determinará si la leyenda se convierte en una fuerza viva en este reino o simplemente en un nombre en una placa."
 cc_legacy.2.a: "Establecer un monumento duradero; que la leyenda pase a formar parte de la identidad permanente del reino."
 cc_legacy.2.a.tt: "Aplica un modificador de país pequeño pero permanente en honor a este ministro legendario."
 cc_legacy.2.b: "Consagrar el legado con una ceremonia adecuada y un fondo fundacional."
 cc_legacy.2.b.tt: "Cuesta 25× los ingresos mensuales. Aplica una versión mejorada y consagrada del modificador heredado, de forma permanente."
