l_spanish:
 # === cc_bonds.110 — A Merchant Seeks Passage ===
 cc_bonds.110.title: "Un mercader busca pasaje"
 cc_bonds.110.desc: "Un comerciante de [bond_subj.GetName] ha llamado nuestra atención. Su propuesta es sencilla: desea establecer una ruta comercial que pase por nuestro territorio: nuestros puertos, nuestras carreteras, nuestros acuerdos de licencias. Aún no es lo suficientemente rico como para ser peligroso, ni lo suficientemente pobre como para estar desesperado. Tiene talento, ambición y un plan. Lo que necesita es permiso. Lo que debemos decidir es qué tipo de permiso le damos y qué esperamos a cambio. Hombres como este tienen la costumbre de volverse más grandes de lo previsto."
 cc_bonds.110.a: "Concederle plenos derechos de paso y un monopolio comercial. Permitamos que crezca y sea leal."
 cc_bonds.110.b: "Conceder derechos de paso. Puede comerciar libremente, pero sin monopolio."
 cc_bonds.110.c: "Denegar la petición. No nos dedicamos a enriquecer a mercaderes extranjeros."

 # === cc_bonds.111 — The Merchant's Expansion ===
 cc_bonds.111.title: "La expansión del Mercader"
 cc_bonds.111.desc_patronized: "El comerciante de [bond_subj.GetName] se ha convertido, en los años transcurridos, en un hombre muy rico; y por riqueza nos referimos al tipo que remodela la economía de un territorio. Emplea a cientos de personas. Sus barcos conectan puertos desde aquí hasta la frontera colonial. Su crédito es bueno en la mitad del mundo conocido. El monopolio que concedimos hizo exactamente lo que hacen los monopolios: concentró el capital eficientemente, y ese capital se construyó sobre nuestro patrocinio. Ahora busca ampliar aún más su red, llegando a puertos y territorios de [bond_secondary.GetName], y a comerciantes que no responden ante nosotros. La cuestión es cómo respondemos ante un hombre que ha superado sus orígenes."
 cc_bonds.111.desc_allowed: "El comerciante de [bond_subj.GetName] ha prosperado modestamente a lo largo de los años: una casa comercial sólida, una flota pequeña, un nombre respetable. No es la fuerza comercial dominante en su territorio, pero es notable, y recuerda que le concedimos el paso cuando no estábamos obligados a ello. Ahora se expande más, llegando a puertos coloniales y mercados extranjeros en [bond_secondary.GetName]. Está, en el lenguaje del comercio, bien dispuesto hacia nosotros. Que nosotros sigamos bien dispuestos hacia él dependerá de cuánto de esta expansión deseemos controlar."
 cc_bonds.111.desc_denied: "El comerciante al que rechazamos ha encontrado, según todos los informes, otra ruta. Construyó sus conexiones a través de territorio rival, aumentó su riqueza moderadamente sin nuestra ayuda y ahora llega aún más lejos, a mercados coloniales y puertos extranjeros en [bond_secondary.GetName] donde nuestra influencia no llega. No ha expresado resentimiento. Tampoco ha expresado gratitud. Simplemente buscó la vuelta, como hacen los comerciantes. Ahora pregunta, en el lenguaje indirecto del comercio, si deseamos cambiar los términos de ese acuerdo."
 cc_bonds.111.a_back: "Financia su empresa en expansión. Un mercader bien respaldado es un mercader que recuerda quién lo respaldó."
 cc_bonds.111.b_observe: "Permitir que extienda su alcance de forma independiente. Evaluaremos el resultado."
 cc_bonds.111.c_discourage: "Desalentar esta expansión. Crece más allá de lo que nos es útil."

 # === cc_bonds.112 — Fortune and Tempest ===
 cc_bonds.112.title: "Fortuna y Tempestad"
 cc_bonds.112.desc_piracy: "Los piratas han atacado las principales rutas comerciales del mercader. Dos de sus barcos se han perdido o dañado; un tercero ha regresado al puerto. Su red no está rota, pero está sangrando, y la interrupción le ha costado credibilidad ante los socios que observaban si podía mantener el suministro. Nos ha enviado un mensaje preguntando si podríamos ayudar a asegurar las rutas. Lo plantea como un interés mutuo, y lo es: si las rutas colapsan, el comercio también."
 cc_bonds.112.desc_rival: "Ha surgido una casa mercantil competidora de la misma red colonial, respaldada por intereses que no son los nuestros. Han bajado los precios del mercader en dos mercancías, han robado a dos de sus capitanes de barco contratados y están haciendo acercamientos a puertos que antes eran leales a él. El mercader no ha entrado en pánico, pero la inteligencia que recibimos sugiere que la situación se deteriora más rápido de lo que él admite."
 cc_bonds.112.desc_succession: "El comerciante está envejeciendo. No tiene un heredero evidente: un hijo está en el extranjero, otro en un monasterio, y la hija mayor ya ha formado una alianza con una casa comercial que consideramos rival. La cuestión de quién controlará el negocio familiar tras su muerte es ahora una cuestión política actual, y la respuesta definirá las futuras lealtades de la red. No carecemos de influencia aquí, si decidimos ejercerla."
 cc_bonds.112.desc_drought: "Una sequía prolongada ha azotado los mercados principales de los que depende la red del mercader. Las malas cosechas significan menos mercancías para enviar, menores ingresos para los territorios y menor capacidad para pagar las deudas. El mercader es solvente, a duras penas, pero sus socios en las regiones afectadas no lo son. Si varios de ellos caen simultáneamente, la red se contraerá bruscamente y la recuperación tardará años."
 cc_bonds.112.desc_blockade: "Una disputa naval —no es nuestra guerra, pero está incómodamente cerca— ha provocado un bloqueo de facto del puerto más productivo del mercader. Los barcos esperan anclados. Los contratos están en mora. El mercader ha agotado sus canales diplomáticos y ahora solicita nuestra intervención, formal o de otro modo, para romper el punto muerto antes de que las pérdidas sean permanentes."
 cc_bonds.112.a_1_escort: "Financia una flota de escolta para sus principales rutas comerciales. Protegemos lo que nos importa."
 cc_bonds.112.b_1_demand: "Él es responsable de la seguridad de sus propias rutas. Ese es el precio de la independencia."
 cc_bonds.112.a_2_buyout: "Compra los intereses de la casa rival. Despeja el camino."
 cc_bonds.112.b_2_let: "Dejar que la competencia comercial se resuelva sola. No tomamos partido en las disputas de los mercaderes."
 cc_bonds.112.a_3_heir: "Apoya discretamente al heredero cuyas lealtades coincidan con las nuestras."
 cc_bonds.112.b_3_neutral: "La sucesión de un comerciante no es asunto nuestro."
 cc_bonds.112.a_4_relief: "Emitir crédito de emergencia a sus socios clave. La red debe sobrevivir a la temporada."
 cc_bonds.112.b_4_reduce: "Reducir las expectativas para este año. La sequía pasará."
 cc_bonds.112.a_5_pressure: "Ejercer presión diplomática para levantar el bloqueo. Nuestro nombre tiene peso aquí."
 cc_bonds.112.b_5_wait: "Aceptar el retraso. Estas cosas acaban resolviéndose solas."

 # === cc_bonds.113 — The Merchant's Legacy ===
 cc_bonds.113.title: "El legado del Mercader"
 cc_bonds.113.desc_flourish: "La casa comercial ha prosperado. Lo que comenzó como un solo mercader buscando derechos de paso se ha convertido en una dinastía: múltiples puertos, una flota, líneas de crédito que se extienden por los mercados coloniales y una reputación que ahora es inseparable de la red que ayudamos a construir. El patriarca de la familia, dirigiéndose a la reunión anual de su casa, describió a la Corona como 'el cimiento sobre el cual se construyó nuestra fortuna'. La historia entre nosotros ha sido productiva. La cuestión es cómo formalizarla."
 cc_bonds.113.desc_modest: "La casa comercial ha tenido un desempeño razonablemente bueno; no es la dinastía que podría haber sido, pero es una institución comercial estable y creíble con un alcance real en varios puertos. Los hijos del mercader conocen nuestra historia con su padre. No son idealistas al respecto ni guardan resentimiento. Están, a la manera de los mercaderes de todas partes, calculando cómo podría ser el próximo acuerdo y si les beneficia aceptarlo."
 cc_bonds.113.desc_collapse: "El comerciante ha muerto. Su casa no es una dinastía: es una colección de deudas, contratos disputados y lealtades fragmentadas. La red que podría haber sido nunca llegó a cohesionarse. Sus hijos se están repartiendo lo que queda y los rivales se mueven para llenar el vacío. Nos limitamos a observar el colapso de algo que, con decisiones diferentes en momentos distintos, podría haber sido un activo comercial duradero."
 cc_bonds.113.a_charter: "Conceder a la casa una carta comercial formal. Hacer que la asociación sea oficial y duradera."
 cc_bonds.113.b_accept: "Acepta el legado tal como está. Sin un acuerdo formal, pero manteniendo los canales abiertos."
 cc_bonds.113.c_decline: "La casa debe valerse por sí misma. Lo que se construyó entre nosotros ha llegado a su fin."

 # === Scripted relation display ===
 cc_merchant_trade_boost: "Red comercial mercante"
 cc_merchant_trade_boost_desc: "Una red comercial establecida a través de la dinastía mercantil canaliza una parte del tráfico comercial a través de los mercados de este señor."

 # === cc_bonds.115 — hidden cleanup event ===
 cc_bonds.115.title: "El cargo del Mercader expira"
 cc_bonds.115.a: "La presencia del comerciante se desvanece."
 cc_bonds.113.desc_flourish_foreign: "La casa comercial ha prosperado, y dejó de ser nuestra. Lo que comenzó como un solo mercader buscando derechos de paso se ha convertido en una dinastía que ondea cuatro banderas: hijos casados en puertos extranjeros, líneas de crédito que no responden a ninguna corona en particular y una flota cuyos capitanes portan documentos de potencias que no comandamos. El patriarca todavía llama a la Corona 'el cimiento sobre el cual se construyó nuestra fortuna', y lo dice en serio. También señalaría, si se le presiona, que un cimiento es la parte de un edificio que ya no se ve."
 cc_bonds.113.desc_modest_foreign: "La casa comercial ha tenido un desempeño razonablemente bueno, y más en el extranjero que en casa. No es la dinastía que podría haber sido, sino una empresa comercial estable con una presencia real tanto en puertos extranjeros como en los nuestros. Los hijos del mercader conocen nuestra historia con su padre, y saben lo que pagan sus socios extranjeros. No son idealistas ni resentidos, simplemente están bien informados sobre sus alternativas."
