l_spanish:
 # ============================================================
 # Colonial Consolidation & Border Friction — Pillar 07
 # ============================================================

 # --- Section D: Border Friction ---

 cc_colonial.20.title: "La disputa fronteriza"
 cc_colonial.20.desc: "Llegan noticias del Nuevo Mundo sobre problemas a lo largo de una frontera no delimitada. [colony_a.GetName] y su vecino [colony_b.GetName] —pueblos de estirpe [colony_a_culture.GetName] y otra, con poca simpatía entre ellos— ambos reclaman el mismo tramo de tierra no explorada. Los agrimensores intercambian insultos, los colonos intercambian golpes y cada gobernador escribe para exigir que la Corona tome partido."
 cc_colonial.20.a: "Trazar la línea a favor de [colony_a.GetName]. El asiento más fuerte debería mantener el terreno."
 cc_colonial.20.b: "Dejar que los colonos lo resuelvan entre ellos. La Corona tiene cosas mejores que hacer."
 cc_colonial.20.c: "Enviar un agrimensor real de inmediato, antes de que se derrame sangre."

 cc_colonial.21.title: "Incursiones en la línea"
 cc_colonial.21.desc: "La disputa se ha agriado hasta convertirse en incursiones abiertas. Los graneros arden a ambos lados de la frontera disputada, y los gobernadores de [colony_a.GetName] y [colony_b.GetName] ahora hablan el uno del otro como enemigos en lugar de vecinos. Si la Corona no actúa, las colonias podrían tomar las riendas totalmente por su cuenta."
 cc_colonial.21.a: "Enviar tropas de la Corona para vigilar la frontera y poner fin a las incursiones."
 cc_colonial.21.b: "Respaldar por la fuerza la reclamación de [colony_a.GetName]. Que se decida el asunto."
 cc_colonial.21.c: "Es una disputa en un país lejano. Dejemos que sangren."

 cc_colonial.22.title: "El Arbitraje de la Corona"
 cc_colonial.22.desc: "Los comisarios reales han recorrido el terreno en disputa, consultado las cartas y trazado una frontera que tanto [colony_a.GetName] como [colony_b.GetName] puedan aceptar. Un acuerdo vinculante solo aguarda el sello de la Corona."
 cc_colonial.22.a: "Ratificar la frontera justa. Que ambas colonias prosperen tras una línea establecida."
 cc_colonial.22.b: "Que nuestro ministro más capaz negocie un acuerdo generoso que no deje a nadie insatisfecho."

 # --- Section E: Consolidation / Viceroyalty ---

 cc_colonial.30.title: "Una petición de gobernanza unificada"
 cc_colonial.30.desc: "Dos de nuestras colonias se han fusionado orgánicamente. [colony_a.GetName] y la más pequeña [colony_b.GetName] —ambas pobladas por colonos de cultura [colony_a_culture.GetName], compartiendo caminos, parroquias y mercados— laboran ahora bajo administraciones separadas y superpuestas. Sus gobernadores solicitan conjuntamente a la Corona que racionalice la disposición antes de que la duplicidad de cargos agote el tesoro."
 cc_colonial.30.a: "Unirlos en un solo virreinato. [colony_b.GetName] será integrada en [colony_a.GetName]."
 cc_colonial.30.b: "Vincularlos bajo un consejo compartido, pero permitiendo que cada uno conserve su propio asiento."
 cc_colonial.30.c: "Mantener el acuerdo tal como está. El cambio trae sus propios problemas."

 cc_colonial.31.title: "El Acta de Unión de las Colonias"
 cc_colonial.31.desc: "Está hecho. El territorio, los ingresos y las instituciones de [colony_b.GetName] se integran en [colony_a.GetName], que la Corona eleva a sede virreinal para gobernar todo el reino consolidado. Un nuevo virreinato toma su lugar entre las joyas del imperio."
 cc_colonial.31.a: "Inaugure el virreinato con toda la ceremonia debida."

 cc_colonial.32.title: "Asientos Gemelos Preservados"
 cc_colonial.32.desc: "En lugar de disolver una colonia orgullosa en su vecina, la Corona vincula a [colony_a.GetName] y [colony_b.GetName] bajo un consejo de coordinación compartido. Pondrán en común sus cortes, sus caminos y sus defensas, mientras cada una conserva su propio gobernador y sello."
 cc_colonial.32.a: "Formalizar el consejo compartido. Que la cooperación haga el trabajo de la unión."

 cc_colonial.33.title: "La primera corte del virrey"
 cc_colonial.33.desc: "El nuevo virreinato de [colony_a.GetName] convoca su primera corte, y todas las miradas se centran en la cuestión de quién se sentará a la cabeza. La elección marcará el tono del gobierno virreinal durante una generación."
 cc_colonial.33.a: "Nombrar a un leal a la corona de confianza. El control importa más que la buena voluntad."
 cc_colonial.33.b: "Nombrar a un criollo respetado. Un asiento satisfecho es un asiento próspero."

 # --- Section F: Labor & Demographics ---

 cc_colonial.40.title: "La cuestión laboral"
 cc_colonial.40.desc: "[colony_a.GetName] ha superado los arreglos provisionales de su fundación. Sus plantaciones y minas claman por mano de obra, y la manera en que se consigan esas manos dará forma a la colonia —y a la conciencia de la Corona— durante generaciones. Los plantadores, las misiones y las casas mercantiles proponen cada uno una respuesta diferente."
 cc_colonial.40.a: "Consolidar la encomienda. La tierra será trabajada, cueste lo que cueste."
 cc_colonial.40.b: "Conceder actas para plantaciones mercantiles. Dejar que los burgueses dirijan una economía de cultivos comerciales."
 cc_colonial.40.c: "Fundar misiones y fomentar el asentamiento libre. Construir una colonia cohesiva y devota."

 cc_colonial.41.title: "La misión y la plantación"
 cc_colonial.41.desc: "En la frontera de [colony_a.GetName], las misiones que dan refugio a los conversos y los plantadores que codician su mano de obra han llegado a una disputa abierta. Los frailes piden protección para su rebaño; los plantadores piden las manos que, según dicen, la Corona les prometió. No se puede satisfacer a ambos."
 cc_colonial.41.a: "Apoya a las misiones. Protege a los conversos y deja que los colonos se quejen."
 cc_colonial.41.b: "Apoya a los colonos. La riqueza debe fluir, digan lo que digan los frailes."

 cc_colonial.42.title: "Agravios criollos"
 cc_colonial.42.desc_default: "Una generación de élites nacidas en las colonias ha alcanzado la madurez en [colony_a.GetName], y se sienten asfixiadas bajo el mando de designados metropolitanos que llegan sin saber nada de la tierra y parten habiendo aprendido poco. Peticionan cargos, reconocimiento y una voz en su propio gobierno."
 cc_colonial.42.desc_coerced: "Una generación de élites nacidas en las colonias ha alcanzado la madurez en [colony_a.GetName], y se han enriquecido gracias a una economía de trabajo forzado que ahora sienten que tienen derecho a comandar. Resienten a los designados metropolitanos puestos sobre ellos y la distante interferencia de la Corona en una sociedad que solo ellos comprenden. Peticionan, con un toque de amenaza, por cargos y una voz propia."
 cc_colonial.42.a: "Abrir oficinas para la élite criolla. Una concesión ahora evita una revuelta más tarde."
 cc_colonial.42.b: "Reafirmar el control metropolitano. Las colonias se gobiernan desde la capital."

 cc_colonial.43.title: "Un ajuste de cuentas demográfico"
 cc_colonial.43.desc: "Décadas de un orden colonial endurecido han dejado su marca en [colony_a.GetName]: una sociedad estratificada por el nacimiento y el trabajo, con sus divisiones escritas en su propia población. El ajuste de cuentas que la Corona postergó durante mucho tiempo ha llegado, y no será barato solucionarlo."
 cc_colonial.43.a: "Invertir en la reconciliación y la integración, cueste lo que cueste."
 cc_colonial.43.b: "Aceptar la sociedad dividida tal como es. La huella perdurará."
