l_spanish:
 # === cc_bonds.20 — The Governor's First Annual Report ===
 cc_bonds.20.title: "El primer informe anual del gobernador"
 cc_bonds.20.desc: "El gobernador de [bond_subj.GetName] ha presentado su primer informe anual completo sobre los asuntos de la provincia. Se incluyen las cifras de ingresos junto con una evaluación de la administración local, las obras públicas y la disposición de la población. Espera instrucciones sobre cómo desea la Corona abordar la gobernanza actual: ya sea con objetivos firmes y una supervisión estrecha, o con cierta libertad para adaptarse a las condiciones locales."
 cc_bonds.20.a: "Establece objetivos estrictos de ingresos. La provincia debe aportar su parte íntegra."
 cc_bonds.20.b: "Permitir una administración flexible. Los resultados importan más que el método."
 cc_bonds.20.c: "Establecer un consejo de supervisión. La gobernanza debe ser transparente."

 # === cc_bonds.21 — Provincial Road and Market ===
 cc_bonds.21.title: "Calzadas y mercados provinciales"
 cc_bonds.21.desc: "El gobernador de [bond_subj.GetName] presenta una propuesta: una nueva carretera comercial que conecte el interior provincial con la costa, y un mercado supervisado para racionalizar el comercio local. El proyecto tardaría varios años en completarse y requiere capital. Los beneficios económicos son reales; la cuestión es quién asume el coste."
 cc_bonds.21.a: "Que la provincia lo financie con los ingresos locales."
 cc_bonds.21.b: "La Corona proporcionará el capital."
 cc_bonds.21.c: "Aplazar la propuesta. Tenemos preocupaciones más urgentes."

 # === cc_bonds.22 — The Governor's Military Levy ===
 cc_bonds.22.title: "La leva militar del gobernador"
 cc_bonds.22.desc: "Se le ha pedido al gobernador de [bond_subj.GetName] que evalúe la capacidad militar de la provincia. Su informe es sincero: los hombres están allí, pero reclutarlos interrumpirá las labores agrícolas en una temporada crítica, y la provincia tiene sus propias preocupaciones de seguridad. Puede movilizar las tropas si se le ordena. Nos pregunta si eso es realmente lo que queremos."
 cc_bonds.22.a: "Convoca la leva completa. La provincia debe responder al llamado de la Corona."
 cc_bonds.22.b: "Ofrecer servicio voluntario con compensación. Perdonar a los reacios."
 cc_bonds.22.c: "No reclutes tropas de esta provincia en este momento."

 # === cc_bonds.23 — Governor's Son Seeks Appointment ===
 cc_bonds.23.title: "El hijo del gobernador busca un nombramiento"
 cc_bonds.23.desc: "Nos llega la noticia de que el gobernador de [bond_subj.GetName] tiene un hijo con la edad adecuada para un nombramiento en la corte: bien educado, con buenos contactos en los círculos provinciales y claramente la elección de su padre para progresar. La petición no es explícita, pero es inequívoca. Si vemos esto como una oportunidad o como una imposición depende de cómo abordemos la relación con la provincia."
 cc_bonds.23.a: "Encontrar al joven un puesto adecuado en la corte."
 cc_bonds.23.b: "Los nombramientos se hacen por mérito. Que solicite el puesto a través de los canales adecuados."
 cc_bonds.23.c: "Ignora la petición implícita."

 # === cc_bonds.24 — Provincial Legal Customs Conflict ===
 cc_bonds.24.title: "Conflicto de costumbres legales provinciales"
 cc_bonds.24.desc: "Las cortes provinciales de [bond_subj.GetName] operan bajo un cuerpo de costumbres locales que precede a la administración de la Corona por varias generaciones. Los abogados de la Corona argumentan que esta inconsistencia socava la autoridad legal y complica la administración. Los líderes provinciales replican que sus costumbres son legítimas, funcionales y están profundamente arraigadas en la vida local. Un conflicto sobre un caso de herencia disputada ha forzado la cuestión."
 cc_bonds.24.a: "Estandarizar la ley de la corona en toda la provincia. Una ley para todos."
 cc_bonds.24.b: "Codificar un sistema híbrido. Preservar lo que funciona, integrar lo que sea necesario."
 cc_bonds.24.c: "Reconocer formalmente las costumbres locales. Su ley es suya."

 # === cc_bonds.25 — The Governor Petitions for Permanence ===
 cc_bonds.25.title: "El gobernador solicita permanencia"
 cc_bonds.25.desc: "El gobernador actual de [bond_subj.GetName] ha cumplido dos mandatos completos y está llegando al final del tercero. Su petición llega con un apoyo considerable: de los nobles provinciales, del clero local y de los mercaderes que se han sentido cómodos con su administración. Pide ser confirmado como gobernador hereditario, para que su familia ostente el cargo a perpetuidad. La solicitud es halagadora. También es trascendental."
 cc_bonds.25.a: "Conceder el gobierno hereditario. Sus servicios lo han ameritado."
 cc_bonds.25.b: "Mantener el sistema de rotación de la corona. Sin cargos hereditarios."
 cc_bonds.25.c: "Prorrogar considerablemente su mandato actual. Un compromiso."

 # === cc_bonds.26 — Corruption Reports ===
 cc_bonds.26.title: "Informes de corrupción"
 cc_bonds.26.desc: "Nos han llegado informes confidenciales que sugieren que ciertos funcionarios en [bond_subj.GetName] han estado complementando sus salarios mediante medios irregulares: contratos inflados, desvío de recibos fiscales y licencias preferenciales. Las cantidades no son ruinosas, y el propio gobernador no está al tanto o ha sido deliberadamente ignorado. Pero la pérdida es real, y nuestra respuesta sentará un precedente."
 cc_bonds.26.a: "Ignora los informes. Un cierto grado de corrupción es el coste de la administración."
 cc_bonds.26.b: "Encargar una auditoría completa. Los responsables rendirán cuentas."
 cc_bonds.26.c: "Enviar un regalo privado al gobernador. Fomentar la discreción."

 # === cc_bonds.201 — The Council Delivers Its Report ===
 cc_bonds.201.title: "El Consejo presenta su informe"
 cc_bonds.201.desc: "El consejo de supervisión que establecimos en [bond_subj.GetName] ha completado su trabajo. El informe es exhaustivo, quizás más de lo que esperábamos cuando creamos el consejo. Documenta lagunas administrativas, estima el coste de corregirlas y concluye con un conjunto de recomendaciones que van desde reformas procesales hasta gasto en infraestructura. El consejo ha hecho exactamente lo que le pedimos. La cuestión es qué hacemos con la respuesta.\n\nLas recomendaciones no son baratas. No son políticamente neutrales. Y el consejo está atento para ver si su trabajo ha servido de algo."

 cc_bonds.201.a: "Acepta las recomendaciones. Financia las reformas identificadas por el consejo."
 cc_bonds.201.a.tooltip: "Se honra el trabajo del consejo. Una inversión real en la administración provincial: mejoran tanto la economía como la política, y la provincia se gobierna de manera más eficiente."

 cc_bonds.201.b: "Anula la decisión del consejo. Toma las ganancias económicas y omite las reformas estructurales."
 cc_bonds.201.b.tooltip: "La extracción a corto plazo es real: ganancias ecológicas sin coste. La estabilidad política disminuye a medida que se dejan de lado las conclusiones del consejo. Las lagunas administrativas persisten."

 cc_bonds.201.c: "Formalizar el consejo como una institución permanente de gobernanza provincial."
 cc_bonds.201.c.tooltip: "La inversión más grande — pero tanto la economía como la política ganan sustancialmente, y la provincia envía una expresión formal de buena voluntad a la Corona. El consejo pasa a formar parte de la estructura provincial permanentemente."
