l_spanish:
 # ============================================================
 # Cabinet Events Localization
 # cc_cabinet.1–52
 # ============================================================


 # cc_cabinet.5 — The Minister Responds to Refusal
 cc_cabinet.5.title: "El Ministro responde al rechazo"
 cc_cabinet.5.desc: "El ministro que rechazamos ha tenido meses para reflexionar sobre la decisión. Ahora llegan las consecuencias."
 cc_cabinet.5.a: "El ministro se ha retirado en un distanciamiento huraño. Su falta de cooperación dificulta las revocaciones. (−prestige, revoke cost +)"
 cc_cabinet.5.b: "El ministro encontró otras formas de enriquecerse. El tesoro ha sufrido silenciosamente. (−gold)"
 cc_cabinet.5.c: "El ministro se volcó hacia los estamentos nobles, ganándose su favor contra los intereses de la Corona. (Noble satisfaction +, Burgher satisfaction −)"

 # cc_cabinet.50 — The Snubbed Estate Retaliates
 cc_cabinet.50.title: "El estamento ninguneado no ha olvidado"
 cc_cabinet.50.desc: "Nos llega la noticia de que el estamento ignorado en nuestros recientes arreglos cortesanos ha estado alimentando su agravio con mucho cuidado. Se nos recuerda que la paciencia y el resentimiento a menudo parecen lo mismo hasta que dejan de serlo."
 cc_cabinet.50.a: "Ofrecer una conciliación."
 cc_cabinet.50.b: "Que sigan hirviendo en rabia."

 # cc_cabinet.52 — The Minister's Idle Influence (standard)
 cc_cabinet.52.title: "La influencia ociosa del ministro"
 cc_cabinet.52.desc: "Los meses sin supervisión del ministro han moldeado silenciosamente el reino. Los detalles salen a la luz ahora, demasiado tarde para cambiarlos, pero lo suficientemente claros como para rendir cuentas."
 cc_cabinet.52.a: "Sus conexiones producen una modesta ganancia inesperada."
 cc_cabinet.52.b: "Su conducta discreta se ha ganado la aprobación de un estamento."
 cc_cabinet.52.c: "Sus emprendimientos resultan en muy poco."
 cc_cabinet.52.d: "Sus gestiones no autorizadas han ofendido a las personas equivocadas."

 # cc_cabinet.53 — The Minister's Subtle Gambit (skilled / diplomatic minister)
 cc_cabinet.53.title: "El sutil gambito del ministro"
 cc_cabinet.53.desc: "Un ministro de notable talento diplomático rara vez permanece inactivo. Se profundizaron los contactos, se intercambiaron favores y se hicieron acuerdos sin su conocimiento directo. Los resultados llegan ahora, y el ministro ha dejado su huella."
 cc_cabinet.53.a: "Sus conexiones comerciales generan beneficios."
 cc_cabinet.53.b: "Han abierto puertas con una potencia vecina."
 cc_cabinet.53.c: "Su trabajo silencioso amplía nuestro alcance diplomático."
 cc_cabinet.53.d: "Han forzado demasiado su posición y la maniobra ha resultado contraproducente."

 # cc_cabinet.54 — Idle Hands in Troubled Times (restless estates)
 cc_cabinet.54.title: "Manos Ociosas en Tiempos Difíciles"
 cc_cabinet.54.desc: "Le dio al ministro margen de maniobra precisamente en el momento en que los estamentos se inquietaron. Ya sea por astucia o negligencia, el ministro se ha visto envuelto en las tensiones, y sus decisiones llegan ahora a la corona."
 cc_cabinet.54.a: "Calman silenciosamente al estamento inquieto."
 cc_cabinet.54.b: "Convierten el malestar en ventaja para la corona."
 cc_cabinet.54.c: "Su intromisión aviva aún más las tensiones."
