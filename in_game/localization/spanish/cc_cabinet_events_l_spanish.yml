l_spanish:
 # ============================================================
 # Cabinet Events Localization
 # cc_cabinet.1–52
 # ============================================================


 # cc_cabinet.5 — The Minister Responds to Refusal
 cc_cabinet.5.title: "El Ministro responde al rechazo"
 cc_cabinet.5.desc: "El ministro que rechazamos ha tenido meses para reflexionar sobre la decisión. Ahora llegan las consecuencias."
 cc_cabinet.5.a: "El ministro se ha retirado en un distanciamiento huraño. Su falta de cooperación dificulta las revocaciones. (−prestige, revoke cost +)"
 cc_cabinet.5.b: "El ministro encontró otras formas de enriquecerse. El tesoro ha sufrido silenciosamente. (−gold)"
 cc_cabinet.5.c: "El ministro se volcó hacia los estamentos nobles, ganándose su favor contra los intereses de la Corona. (Noble satisfaction +, Burgher satisfaction −)"

 # cc_cabinet.50 — The Snubbed Estate Retaliates
 cc_cabinet.50.title: "El estamento ninguneado no ha olvidado"
 cc_cabinet.50.desc: "Nos llega la noticia de que el estamento ignorado en nuestros recientes arreglos cortesanos ha estado alimentando su agravio con mucho cuidado. Se nos recuerda que la paciencia y el resentimiento a menudo parecen lo mismo hasta que dejan de serlo."
 cc_cabinet.50.a: "Ofrecer una conciliación. (−3× ingresos)"
 cc_cabinet.50.b: "Que sigan hirviendo en rabia."

 # cc_cabinet.52 — The Minister's Idle Influence (standard)
 cc_cabinet.52.title: "La influencia ociosa del ministro"
 cc_cabinet.52.desc: "Los meses de supervisión nula del ministro han moldeado silenciosamente el reino. Los detalles salen a la luz ahora; es demasiado tarde para cambiarlos, pero lo suficientemente claro como para rendir cuentas."
 cc_cabinet.52.a: "Las conexiones del ministro producen una modesta ganancia inesperada. (+2× monthly income)"
 cc_cabinet.52.b: "La discreta conducta del ministro se ha ganado la aprobación silenciosa de un estamento. (Satisfacción de los estamentos +)"
 cc_cabinet.52.c: "Las empresas del ministro aportan poco valor. (−2× ingresos mensuales)"
 cc_cabinet.52.d: "Los manejos no autorizados del ministro han molestado a las personas equivocadas. (Satisfacción de los estamentos −)"

 # cc_cabinet.53 — The Minister's Subtle Gambit (skilled / diplomatic minister)
 cc_cabinet.53.title: "El sutil gambito del ministro"
 cc_cabinet.53.desc: "Un ministro de notable talento diplomático rara vez permanece ocioso. Se profundizaron los contactos, se intercambiaron favores y se hicieron acuerdos sin vuestro conocimiento directo. Los resultados llegan ahora: el ministro ha dejado su huella."
 cc_cabinet.53.a: "Las conexiones comerciales del ministro generan beneficios. (+3× ingresos mensuales, +prestigio)"
 cc_cabinet.53.b: "El ministro ha abierto puertas diplomáticas con una potencia vecina. (+mutual opinion, +prestige)"
 cc_cabinet.53.c: "La sutil labor del ministro expande silenciosamente nuestro alcance diplomático. (Modificador de influencia, 8 años)"
 cc_cabinet.53.d: "El ministro forzó demasiado su posición; la maniobra ha resultado contraproducente. (−prestige, nobles satisfaction −)"

 # cc_cabinet.54 — Idle Hands in Troubled Times (restless estates)
 cc_cabinet.54.title: "Manos Ociosas en Tiempos Difíciles"
 cc_cabinet.54.desc: "Le dio al ministro margen de maniobra precisamente en el momento en que los estamentos se inquietaron. Ya sea por astucia o negligencia, el ministro se ha visto envuelto en las tensiones latentes; sus decisiones ahora repercuten en la corona."
 cc_cabinet.54.a: "El ministro calma silenciosamente al estamento inquieto. (Estate satisfaction +, +prestige)"
 cc_cabinet.54.b: "El ministro aprovecha el malestar en beneficio de la corona. (+3× monthly income, investment modifier)"
 cc_cabinet.54.c: "La intromisión del ministro exacerba aún más las tensiones. (Satisfacción de los estamentos −, −prestigio)"
