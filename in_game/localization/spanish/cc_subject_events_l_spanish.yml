l_spanish:
 # ============================================================
 # Provincial Governorate Events
 # ============================================================

 cc.gov.1.title: "Las ambiciones del gobernador"
 cc.gov.1.desc: "Los informes de [governor.GetName] hablan de una corte inquieta: promesas hechas a funcionarios locales, expectativas elevadas y un aparato gubernamental que comienza a imaginarse a sí mismo mucho más independiente de lo que habíamos previsto."
 cc.gov.1.a: "Pagar las cuentas de la corte del gobernador."
 cc.gov.1.b: "Suprimir las ambiciones con firmeza."
 cc.gov.1.c: "Ignóralo por ahora."

 cc.gov.2.title: "El gobernador observa a los vecinos"
 cc.gov.2.desc: "[governor.GetName] ha enviado un memorándum señalando la debilidad militar de [target_neighbor.GetName] a lo largo de nuestra frontera. El gobernador plantea la sugerencia claramente: aquí hay una oportunidad."
 cc.gov.2.a: "Sancionar una expansión limitada."
 cc.gov.2.b: "Prohibir cualquier aventurismo de este tipo."

 # ============================================================
 # Tax Farm Events
 # ============================================================

 cc.tax.1.title: "La revuelta de la arrendación de impuestos"
 cc.tax.1.desc: "Nos llegan noticias de [tax_lord.GetName]: los recaudadores han presionado demasiado y los lugareños han respondido. Hay disturbios en las calles e incendios en los almacenes. Debe hacerse algo."
 cc.tax.1.a: "Aliviar la extracción: conceder cierto alivio."
 cc.tax.1.b: "Mantenerse firme. El orden será restaurado."

 cc.tax.2.title: "Los recaudadores de impuestos y los vecinos"
 cc.tax.2.desc: "Los vecinos de [tax_lord.GetName] han presentado una queja formal. Afirman que nuestros recaudadores de impuestos han estado operando más allá de la frontera, confiscando bienes, interrogando a mercaderes y tratando el territorio extranjero como si fuera propio."
 cc.tax.2.a: "Compensar a los vecinos y refrenar a los recaudadores."
 cc.tax.2.b: "Los recaudadores estaban en su derecho."

 # ============================================================
 # Military March Events
 # ============================================================

 cc.march.1.title: "La incursión del señor de la marca"
 cc.march.1.desc: "Nuestro señor de la marca [march_lord.GetName] ha lanzado una incursión contra [raided_neighbor.GetName]: oportunista, rentable y totalmente sin nuestra autorización. Se ha entregado un informe completo. Ahora debemos decidir cómo responder."
 cc.march.1.a: "Sancionar la incursión. Que se queden con el botín."
 cc.march.1.b: "Restringir al señor de la marca. Esto no está permitido."

 cc.march.2.title: "Intento de Independencia del Señor de Marca"
 cc.march.2.desc: "Con la nobleza cada vez más inquieta, [march_lord.GetName] ha elegido este momento para poner a prueba nuestra resolución. Los agentes del señor de la marca están en la capital, hablando de agravios, viejas deudas y la independencia de la que disfrutaron sus antepasados."
 cc.march.2.a: "Pagarlos: otorgar oro y concesiones nobles."
 cc.march.2.b: "Convertir la marca en un protectorado."

 cc.march.3.title: "El Señor de Marca Amenaza a los Vecinos"
 cc.march.3.desc: "[march_lord.GetName] ha reunido tropas en la frontera con [threatened_neighbor.GetName] y está haciendo exigencias que nunca autorizamos. El vecino recurre a nosotros en busca de guía... o de moderación."
 cc.march.3.a: "Apoyar la agresión del señor de la marca."
 cc.march.3.b: "Denunciar la conducta del señor de la marca."
 cc.march.3.c: "Medie la disputa."

 cc.march.charter.1.title: "Se establece una marcha militar"
 cc.march.charter.1.desc: "Por el privilegio de nuestros nobles, se ha otorgado formalmente una marca militar. Su señor está listo para servir como la espada del reino en la frontera, a cambio de la autonomía que su función exige."
 cc.march.charter.1.a: "Que se conceda la carta fundacional."
 cc.march.charter.1.a.tt: "Otorga una mayor satisfacción del estamento noble al señor de la marca."

 # ============================================================
 # Subject Lobbying Events (cc.201-203)
 # ============================================================

 cc.company.lobby.1.title: "La Petición de la Compañía Privilegiada"
 cc.company.lobby.1.desc: "Los agentes de [company.GetName] han llegado a la corte con una petición formal: desean protecciones más sólidas para sus rutas comerciales, reconocimiento legal en puertos disputados y una señal clara de la corona de que su expansión está sancionada. Los demás súbditos están observando nuestra respuesta."
 cc.company.lobby.1.a: "Conceder las protecciones comerciales que solicitan."
 cc.company.lobby.1.b: "Financia la expansión de sus operaciones directamente."
 cc.company.lobby.1.c: "Rechazar la petición. La corona no renegocia las cartas constitutivas a petición."

 cc.march.lobby.1.title: "Las exigencias del señor de la marca"
 cc.march.lobby.1.desc: "[march_lord.GetName] ha enviado un emisario con un mensaje claro: la marca ha identificado una debilidad en la frontera con [expansion_target.GetName], y el señor de la marca tiene la intención de actuar al respecto. Solicitan —formalmente, esta vez— la bendición de la corona."
 cc.march.lobby.1.a: "Conceder la autorización — permitir que se expandan."
 cc.march.lobby.1.b: "Subvenciona mejor las fortificaciones fronterizas: expansión sin guerra."
 cc.march.lobby.1.c: "Rechazar la solicitud: la corona elige sus guerras."

 cc.subject.rivalry.1.title: "Una rivalidad entre súbditos"
 cc.subject.rivalry.1.desc: "[company_rival.GetName] y [march_rival.GetName] están en disputa. Los detalles varían según a quién se pregunte: reclamaciones enfrentadas sobre una ruta comercial, una escaramuza fronteriza, un insulto en una conferencia. Lo que no está en disputa es que ambos súbditos esperan ahora que la corona tome partido."
 cc.subject.rivalry.1.a: "Ponte del lado de [company_rival.GetName]."
 cc.subject.rivalry.1.b: "Ponte del lado de [march_rival.GetName]."
 cc.subject.rivalry.1.c: "Medie la disputa: compense a ambas partes."

 # ============================================================
 # Shadow Network Events (cc.140–cc.143)
 # ============================================================

 cc.shadow.intel.1.title: "Inteligencia desde las Sombras"
 cc.shadow.intel.1.desc: "[shadow_agent.GetName] ha entregado un informe cifrado. Nuestros agentes dentro de [intel_target.GetName] han identificado algo accionable: una debilidad, una apertura, un secreto mal guardado. Cómo usemos esta ventaja es decisión nuestra."
 cc.shadow.intel.1.a: "Aprovéchalo diplomáticamente: presiona a [intel_target.GetName]."
 cc.shadow.intel.1.b: "Comparte la inteligencia con un aliado."
 cc.shadow.intel.1.c: "Recompensar la diligencia de la red."

 cc.shadow.conflict.1.title: "Estados en la sombra en conflicto"
 cc.shadow.conflict.1.desc: "Dos de nuestras redes encubiertas se han topado la una con la otra. [shadow_a.GetName] y [shadow_b.GetName] compiten por los mismos contactos, las mismas rutas, los mismos rincones invisibles del mundo. Sin intervención, la fricción no hará más que crecer."
 cc.shadow.conflict.1.a: "Arbitrar — separar sus esferas."
 cc.shadow.conflict.1.b: "Que dominen los fuertes."
 cc.shadow.conflict.1.c: "Tenemos influencia, extorsionemos al más débil."
 cc.shadow.conflict.1.d: "Aprovechar el conflicto para extraer beneficios de ambos."

 cc.shadow.legit.1.title: "Un estado en la sombra busca legitimidad"
 cc.shadow.legit.1.desc: "[petitioner.GetName] ha operado en las sombras durante tiempo suficiente. Sus agentes en la corte hablan de un reconocimiento formal, de tratados declarados explícitamente en lugar de implícitos, de un lugar en la mesa en lugar de debajo de ella. La petición tiene peso. La decisión es nuestra."
 cc.shadow.legit.1.a: "Elevarlos a un acuerdo formal de títere."
 cc.shadow.legit.1.b: "Recompensar su lealtad, sin reconocimiento formal."
 cc.shadow.legit.1.c: "Rechazar la petición. El secreto es su propósito."
 cc.shadow.legit.1.d: "Redactar un marco de autonomía reconocida. [our_statesman.GetName] puede encargarse de esto."

 cc.shadow.dark.1.title: "La red queda en silencio"
 cc.shadow.dark.1.desc: "Los informes de [dark_agent.GetName] han cesado. No hay mensajes, ni correspondencia cifrada, ni confirmaciones susurradas de que la red siga operando. Nuestra oficina de la corte en las sombras ya no puede confirmar si nuestros agentes son leales, están comprometidos o simplemente esperan."
 cc.shadow.dark.1.a: "Enviar agentes para restablecer el contacto."
 cc.shadow.dark.1.b: "Esperemos. La red volverá a surgir, o no lo hará."

 # ============================================================
 # Client State / Puppet State Events (cc.150–cc.152)
 # ============================================================

 cc.client.1.title: "El Estado Cliente Hace Valer su Autonomía"
 cc.client.1.desc: "[client.GetName] ha empezado a actuar de forma independiente en la disputa actual con [dispute_neighbor.GetName], asumiendo compromisos, enviando señales y posicionándose de manera que sugiere que ya no se considera vinculado a nuestra política exterior. Ya sea por ambición o negligencia, esto exige una respuesta."
 cc.client.1.a: "Refrenarlos; esta no es una guerra que deban iniciar ellos."
 cc.client.1.b: "Que actúen; su iniciativa podría resultar útil."

 cc.puppet.1.title: "Los hilos del títere"
 cc.puppet.1.desc: "Han llegado a la corte enviados de [puppet.GetName] con una petición familiar. Han servido fielmente, luchado cuando se les ha pedido y pagado lo debido. Ahora desean sentarse en el consejo; no para gobernar, sino para ser vistos. Los hilos siguen ahí; simplemente quieren que parezcan una túnica."
 cc.puppet.1.a: "Conceder reconocimiento simbólico."
 cc.puppet.1.b: "Rechazar la solicitud firmemente."
 cc.puppet.1.c: "Compra su silencio."

 cc.client.puppet.1.title: "Estado cliente y marioneta enfrentados"
 cc.client.puppet.1.desc: "Nos llega la noticia de que [the_client.GetName] ha abierto negociaciones secretas con [the_puppet.GetName], totalmente sin nuestro conocimiento o sancción. No está claro qué discutieron, pero el hecho de que hablaran sin informarnos es precisamente el tipo de deriva que no podemos permitir que se convierta en hábito."
 cc.client.puppet.1.a: "Prohibir el contacto directo: todas las comunicaciones pasarán a través de nosotros."
 cc.client.puppet.1.b: "Permitir el contacto: la cooperación entre nuestros súbditos no es una amenaza."
 cc.client.puppet.1.c: "Medie el contacto formalmente."

 # Elite Enclave / Palatinate events are localised in cc_subjects_l_english.yml

 # ============================================================
 # Associated Republic Events (cc.170–cc.171)
 # ============================================================

 cc.republic.1.title: "El intercambio académico de la República"
 cc.republic.1.desc: "Delegados de [republic.GetName] han propuesto un programa de intercambio formal: sus eruditos a nuestras academias, nuestros ministros a sus consejos y un flujo constante de obras impresas entre ambas cortes. Lo plantean como un enriquecimiento mutuo. También podría ser algo más."
 cc.republic.1.a: "Financia el programa formalmente."
 cc.republic.1.b: "Absorber a un erudito republicano en nuestro gabinete."
 cc.republic.1.c: "Rechazar la propuesta."

 cc.republic.2.title: "Disidencia republicana"
 cc.republic.2.desc: "La correspondencia de [republic.GetName] describe una creciente inquietud entre la clase burguesa. Nuestras políticas —sobre el comercio, la fiscalidad y el trato a los intereses mercantiles— han generado fricciones que el consejo de la república ya no puede absorber en silencio. Nos piden que hagamos ajustes. Su tono sugiere que esperan que nos neguemos."
 cc.republic.2.a: "Hacer concesiones: ajustar las políticas."
 cc.republic.2.b: "Ignora el descontento; la comodidad republicana no es nuestro mandato."

 # ============================================================
 # Crown Dependency / Protectorate Events (cc.180–cc.181)
 # ============================================================

 cc.crowndep.1.title: "La Dependencia de la Corona Busca el Favor"
 cc.crowndep.1.desc: "[dependency.GetName] ha invocado el vínculo de la conexión real; formalmente, a través de los canales adecuados y con todas las cortesías correspondientes. Solicitan apoyo en un asunto en curso y han dejado claro que esperan que la corona recuerde que la lealtad es recíproca."
 cc.crowndep.1.a: "Apoyar su petición; el vínculo lo exige."
 cc.crowndep.1.b: "Enviar oro: ayuda práctica por encima de la ceremonia."
 cc.crowndep.1.c: "Rechazar; la corona no puede atender todas las peticiones."

 cc.protectorate.1.title: "Dificultades del crecimiento del protectorado"
 cc.protectorate.1.desc: "[ward.GetName] está pasando por dificultades. Los informes describen finanzas tensas, tensiones internas y el avance silencioso de la inestabilidad que, si no se controla, se convierte en crisis. Han pedido apoyo; no ruidosamente, ni dramáticamente, pero la petición es clara. Si lo proporcionamos, y cómo, dará forma a lo que este protectorado llegue a ser."
 cc.protectorate.1.a: "Proporcionar apoyo estabilizador: aliviar sus cargas."
 cc.protectorate.1.b: "Enviar oro para apuntalar sus finanzas."
 cc.protectorate.1.c: "Convertirlos en un estado cliente; formalizar nuestro compromiso."
