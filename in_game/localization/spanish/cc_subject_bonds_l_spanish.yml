l_spanish:
 # ============================================================
 # SITUATION NAME / DESCRIPTION
 # ============================================================
 cc_subject_bonds: "Libro de Relaciones con Vasallos"
 cc_subject_bonds_desc: "Un registro permanente de las relaciones de la Corona con sus súbditos, dimensión por dimensión. Cada vínculo se mide en cinco líneas —económica, militar, política, cultural y personal— desde el resentimiento abierto (-5) hasta la lealtad devota (+5)."
 cc_subject_bonds_end: "La Corona ya no posee súbditos vinculados por bonos."

 # ============================================================
 # PANEL HEADER
 # ============================================================
 CC_BOND_LEDGER_HEADER: "Vínculos de Vasallaje"
 CC_BOND_LEDGER_DESC: "Su vínculo con cada súbdito se rastrea a lo largo de cinco dimensiones, cada una con un rango de -5 (hostil) a +5 (devoto). Pase el cursor sobre un valor para ver qué lo determina. Utilice las acciones debajo de cada súbdito para gestionar la relación directamente, con un coste y un tiempo de reutilización.\n\nCada vínculo mantiene tanto una puntuación reciente como una memoria vital: cada pocas generaciones, la puntuación actual se integra en un promedio a largo plazo y se olvida parcialmente. Utilice el interruptor de vista para cambiar entre ambas."

 # ============================================================
 # VIEW TOGGLE + ESTABLISHMENT DATE
 # ============================================================
 CC_BOND_VIEW_STM: "Reciente"
 CC_BOND_VIEW_LTM: "De por vida"
 CC_BOND_VIEW_TOGGLE: "Cambiar Vista"
 CC_BOND_VIEW_TT: "Alterna entre el vínculo #Y Reciente#! (la puntuación actual, -5..+5) y el vínculo #Y Vitalicio#! (el promedio a largo plazo derivado de cada ciclo de memoria). La memoria vitalicia es lo que más influye en el comportamiento de un súbdito cuando llega la era de las revoluciones."
 CC_BOND_EST_SEP: "· est."

 # ============================================================
 # COLUMN LABELS
 # ============================================================
 CC_BOND_COL_SUBJECT: "Vasallo"
 CC_BOND_COL_ECO: "Eco"
 CC_BOND_COL_MIL: "Mil"
 CC_BOND_COL_POL: "Pol"
 CC_BOND_COL_CUL: "Cul"
 CC_BOND_COL_PER: "Por"

 # ============================================================
 # DIMENSION TOOLTIPS — what raises and lowers each bond
 # ============================================================
 CC_BOND_DIM_ECO_TT: "Vínculo económico: comercio, equidad fiscal y prosperidad compartida.\n\nAumentado por: edificios reales en las tierras del súbdito, provincias en crecimiento, instituciones compartidas y el respaldo de su tesorería.\nDisminuido por: negligencia, pérdida de provincias, extracción excesiva y que el súbdito te supere en instituciones de las que careces."
 CC_BOND_DIM_MIL_TT: "Vínculo militar: obligaciones de guerra, lealtad marcial y voluntad de luchar.\n\nAumenta con: moderación en los llamados a las armas, acudir en defensa del súbdito cuando se solicita y revistas militares conjuntas.\nDisminuye con: llamados frecuentes o ofensivos a la guerra, rechazar la petición de ayuda del súbdito y un historial de guerras injustas."
 CC_BOND_DIM_POL_TT: "Vínculo político — gobernanza, autonomía e integración política.\n\nSe incrementa mediante: el respeto al estatus del súbdito, la concesión de fueros de privilegio y una administración estable.\nSe reduce mediante: la traición, un gobierno autoritario y un historial de actos desleales o traicioneros."
 CC_BOND_DIM_CUL_TT: "Vínculo cultural: aceptación cultural, armonía religiosa e identidad.\n\nAumentado por: permitir que el súbdito conserve su carácter distintivo, vínculos favorables de fe e instituciones, y patrocinar sus festivales.\nDisminuido por: conversión forzada de cultura o fe, y fricción cultural."
 CC_BOND_DIM_PER_TT: "Vínculo personal: la calidez entre las dos cortes y gobernantes.\n\nSe incrementa mediante: atención personal, atender peticiones de ayuda y gestos dinásticos y diplomáticos.\nSe reduce mediante: rechazar las llamadas del sujeto, exigir tributos, reprimendas severas y negligencia prolongada."

 # ============================================================
 # ENGAGE ACTION BUTTONS + TOOLTIPS
 # ============================================================
 CC_BOND_ACT_ECO: "Suscribir"
 CC_BOND_ACT_ECO_TT: "Avalar la Tesorería Local\nEl oro de la Corona — escalado según vuestros ingresos y el valor del súbdito — respalda las finanzas del súbdito durante una década.\n\n#G El súbdito obtiene:#! crédito más barato (#G Interés bancario -1%#!) y una ceca más rica (#G Ingresos de acuñación +10%#!) durante 10 años.\nVínculo económico +1 (máx. +5). Tiempo de espera de 2 años compartido con las otras acciones para este súbdito."
 CC_BOND_ACT_MIL: "Revisar"
 CC_BOND_ACT_MIL_TT: "Realizar un Desfile Militar Conjunto\nEntrena a los dos ejércitos juntos, con un coste proporcional a tus medios.\n\n#G Tanto tú como el súbdito ganáis:#! un mantenimiento menor (#G Eficiencia de Mantenimiento del Ejército y la Armada +10%#!) durante 10 años.\nVínculo Militar +1 (máx. +5). Enfriamiento de 2 años."
 CC_BOND_ACT_POL: "Conceder acta"
 CC_BOND_ACT_POL_TT: "Otorgar una Carta de Privilegios (cuesta prestigio)\nAfirmar formalmente las libertades y la posición del súbdito.\n\n#G El súbdito obtiene:#! libertades comerciales (#G Eficiencia de exportación e importación +10%#!) y #G Lealtad al señor +10#! durante 10 años.\n#R Tú concedes:#! parte de sus ingresos (#R Ingresos del súbdito -5%#!) durante 10 años.\nVínculo político +1 (máx. +5). Enfriamiento de 2 años."
 CC_BOND_ACT_CUL: "Festival"
 CC_BOND_ACT_CUL_TT: "Patrocinar un festival cultural\nOrganiza un gran festival para celebrar al sujeto, con un coste proporcional a tus medios.\n\n#G Como anfitrión, obtienes:#! #G Influencia cultural +2#!, #G Reputación diplomática +1#! y #G Prestigio mensual +0.05#! durante 10 años.\nVínculo cultural +1 (máx. +5). Enfriamiento de 2 años."
 CC_BOND_ACT_PER: "Enviado"
 CC_BOND_ACT_PER_TT: "Enviar un Enviado Personal (gana prestigio)\nEstacionar un emisario de confianza en la corte del vasallo, con regalos proporcionales a sus medios.\n\n#G El vasallo gana:#! #G Lealtad al Soberano +15#! durante 10 años, y mejora su relación con vuestra Corona (#G +20 de opinión#!).\nVínculo Personal +1 (máx. +5). Tiempo de espera de 2 años."
 CC_BOND_ACT_TRIBUTE: "Tributo"
 CC_BOND_ACT_TRIBUTE_TT: "Exigir tributo\nExprimid al vasallo para obtener monedas; una suma extraída de sus propias arcas. Rentable, pero genera resentimiento.\n\nVínculo personal -1 (mín. -5). Tiempo de espera de 2 años."
 CC_BOND_ACT_REPRIMAND: "Reprender"
 CC_BOND_ACT_REPRIMAND_TT: "Emitir una reprimenda severa\nUn reproche frío que obliga al súbdito a obedecer, pero enfría las relaciones.\n\nVínculo político +1 / Vínculo personal -1. Tiempo de espera de 2 años."

 # ============================================================
 # ENGAGE EVENTS (cc_bonds.300-306)
 # ============================================================
 cc_bonds.300.t: "Avalar la Tesorería"
 cc_bonds.300.d: "Llegan noticias de [cc_engage_subject.GetName] sobre sus escasas arcas: el comercio está estancado, la cosecha ha sido pobre y los registros fiscales están al límite. Al respaldar sus finanzas, la Corona puede conseguirles un crédito más barato y una ceca más rica, y recordarles cuya generosidad los sostiene."
 cc_bonds.300.a: "Abrir el tesoro (moneda de la Corona). El súbdito obtiene préstamos más baratos y una mejor acuñación durante una década; Vínculo Económico +1."
 cc_bonds.300.b: "Se las arreglarán solos."

 cc_bonds.301.t: "Una revisión militar conjunta"
 cc_bonds.301.d: "Los capitanes de [cc_engage_subject.GetName] proponen una gran revista de armas en común con nuestro propio ejército: estandartes desfilando juntos, ejercicios realizados hombro con hombro. Tal disciplina compartida vincula a los soldados a una causa común y agudiza la logística de ambos ejércitos."
 cc_bonds.301.a: "Realizar el desfile (moneda de la Corona). Ambos reinos disfrutan de un menor mantenimiento del ejército y la armada durante una década; Vínculo Militar +1."
 cc_bonds.301.b: "No tenemos tiempo para desfiles."

 cc_bonds.302.t: "Una carta de privilegios"
 cc_bonds.302.d: "Los notables de [cc_engage_subject.GetName] solicitan una carta formal que afirme sus libertades comerciales y su posición dentro de nuestro dominio. Concederla implica renunciar a parte de los ingresos que obtenemos de ellos, pero halaga su orgullo y los vincula más estrechamente a la Corona."
 cc_bonds.302.a: "Conceder la carta (cuesta prestigio). El súbdito gana libertades comerciales y lealtad, pero renunciamos a parte de sus ingresos durante una década; Vínculo Político +1."
 cc_bonds.302.b: "Sus privilegios son suficientes tal como están."

 cc_bonds.303.t: "Un festival cultural"
 cc_bonds.303.d: "Artistas y actores de [cc_engage_subject.GetName] buscan nuestro mecenazgo para un gran festival en honor a su carácter distintivo: música, desfiles y banquetes bajo el nombre de la Corona. Albergar tal esplendor magnifica nuestra propia fama en las cortes del mundo."
 cc_bonds.303.a: "Financia el festival (moneda de la Corona). Como anfitrión, la Corona gana influencia cultural, reputación y prestigio durante una década; Vínculo Cultural +1."
 cc_bonds.303.b: "Que celebren a su propia costa."

 cc_bonds.304.t: "Un enviado personal"
 cc_bonds.304.d: "Ha pasado demasiado tiempo desde que asistimos personalmente a la corte de [cc_engage_subject.GetName]. Un emisario de confianza estacionado bajo nuestro propio sello, con pequeños regalos, los mantendría firmemente en la órbita de la Corona y calentaría su estima por nuestra casa."
 cc_bonds.304.a: "Enviar al enviado (moneda de la Corona; gana prestigio). El súbdito se vuelve más leal y se muestra más afectuoso con nosotros durante una década; Vínculo Personal +1."
 cc_bonds.304.b: "Bastará con un reconocimiento formal."

 cc_bonds.305.t: "Exigir tributo"
 cc_bonds.305.d: "Nuestro tesoro tiene necesidades, y [cc_engage_subject.GetName] no carece de medios. Podríamos presionarlos para obtener un tributo extraordinario; rentable, ciertamente, aunque no olvidarán pronto la imposición."
 cc_bonds.305.a: "Exigir el tributo (monedas de sus arcas). Vínculo personal -1."
 cc_bonds.305.b: "No rebajaremos nuestro nivel presionándolos."

 cc_bonds.306.t: "Una reprimenda severa"
 cc_bonds.306.d: "La conducta de [cc_engage_subject.GetName] se ha vuelto errática. Una reprimenda fría y pública les recordaría su lugar y reforzaría su obediencia, aunque tales palabras dejan un frío que perdura entre las cortes."
 cc_bonds.306.a: "Entregar la reprimenda. Vínculo político +1, Vínculo personal -1."
 cc_bonds.306.b: "Ignóralo por ahora."

 # ============================================================
 # ENGAGE-ACTION MODIFIERS (granted by cc_bonds.300-304)
 # ============================================================
 STATIC_MODIFIER_NAME_cc_bond_underwritten: "Suscripción de la Corona"
 STATIC_MODIFIER_DESC_cc_bond_underwritten: "El señor supremo está respaldando nuestro tesoro, facilitando nuestro crédito y enriqueciendo nuestra ceca."
 STATIC_MODIFIER_NAME_cc_bond_drilled: "Revisión militar conjunta"
 STATIC_MODIFIER_DESC_cc_bond_drilled: "El entrenamiento conjunto con nuestros anfitriones ha perfeccionado la logística y reducido el mantenimiento de nuestras fuerzas."
 STATIC_MODIFIER_NAME_cc_bond_chartered: "Acta de Privilegios"
 STATIC_MODIFIER_DESC_cc_bond_chartered: "Una cédula real afirma nuestras libertades comerciales y nuestra posición, vinculándonos en lealtad a la Corona."
 STATIC_MODIFIER_NAME_cc_bond_charter_granted: "Acta concedida"
 STATIC_MODIFIER_DESC_cc_bond_charter_granted: "Las libertades concedidas a un súbdito mediante carta cuestan a la Corona una parte de los ingresos que obtiene de ellos."
 STATIC_MODIFIER_NAME_cc_bond_festival_host: "Patrocinador del festival"
 STATIC_MODIFIER_DESC_cc_bond_festival_host: "La organización de un festival célebre ha magnificado la influencia cultural y el renombre de la Corona."
 STATIC_MODIFIER_NAME_cc_bond_envoy_received: "Enviado Residente de la Corona"
 STATIC_MODIFIER_DESC_cc_bond_envoy_received: "Un emisario de confianza del señor mantiene nuestra corte firmemente dentro de la órbita de la Corona."

 # ============================================================
 # ENGAGE-ACTION OPINION BIAS
 # ============================================================
 cc_bond_envoy_warmth: "Honrado por un Enviado Personal"
 cc_bond_legend_overlord: "Nuestro reino"
 cc_bond_legend_weak: "Un vasallo que hemos descuidado"
 cc_bond_legend_strong: "Un vasallo que hemos mantenido cerca"
