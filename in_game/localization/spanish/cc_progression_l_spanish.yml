l_spanish:
 # ============================================================
 # Stepping Stone Traits — Tier 0 Entry Points
 # ============================================================
 fumbling_reformist: "Reformista torpe"
 fumbling_reformist_desc: "Este ministro ha comenzado a trabajar en la reforma administrativa, pero su toque es incierto. Los borradores se revisan, los procedimientos se confunden y los resultados son más esperanzadores que efectivos. Con tiempo y perseverancia, mejorará."

 tentative_envoy: "Enviado tentativo"
 tentative_envoy_desc: "Un diplomático que aún está encontrando su camino. El instinto del ministro para la negociación está ahí, pero la cautela le hace vacilar donde se necesita audacia. Las cortes extranjeras toman nota, aunque no siempre favorablemente."

 green_adjutant: "Ayudante verde"
 green_adjutant_desc: "Recién asignado a los asuntos militares, este ministro tiene mucho entusiasmo pero poca experiencia. Sus consejos son sinceros pero incompletos. Las campañas le enseñarán lo que las aulas no pudieron."

 clumsy_accountant: "Contable torpe"
 clumsy_accountant_desc: "El ministro se ha puesto con los libros del tesoro, y los resultados son... prometedores, de la misma manera que lo son los primeros borradores. Los errores son pequeños y corregibles, pero se acumulan. La práctica los hará exactos."

 # ============================================================
 # Stepping Stone Traits — Chain Endpoints
 # ============================================================
 master_reformer: "Maestro Reformador"
 master_reformer_desc: "Forjado a través de años de defensa implacable y contratiempos costosos, este ministro se ha convertido en un arquitecto del cambio duradero. Donde otros ven intereses arraigados, él ve palancas. Las instituciones del reino se pliegan a su voluntad, y no al revés."

 returned_colonial_governor: "Gobernador colonial regresado"
 returned_colonial_governor_desc: "Este ministro ha pasado años supervisando las posesiones distantes del reino, navegando por las penurias de la frontera, la ambición colonial y la intrincada política de los gobernadores lejanos. Regresa a casa transformado, portando una experiencia que ninguna educación cortesana podría proporcionar."

