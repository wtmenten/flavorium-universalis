l_spanish:
 # ============================================================
 # Stepping Stone Traits — Tier 0 Entry Points
 # ============================================================
 fumbling_reformist: "Reformista torpe"
 fumbling_reformist_desc: "Este ministro ha comenzado a trabajar en la reforma administrativa, pero su toque es incierto. Los borradores se revisan, los procedimientos se confunden y los resultados son más esperanzadores que efectivos. Con tiempo y perseverancia, mejorará."

 tentative_envoy: "Enviado tentativo"
 tentative_envoy_desc: "Un diplomático que aún está encontrando su camino. El instinto del ministro para la negociación está ahí, pero la cautela le hace vacilar donde se necesita audacia. Las cortes extranjeras toman nota, aunque no siempre favorablemente."

 green_adjutant: "Ayudante verde"
 green_adjutant_desc: "Recién asignado a los asuntos militares, este ministro tiene mucho entusiasmo pero poca experiencia. Sus consejos son sinceros pero incompletos. Las campañas le enseñarán lo que las aulas no pudieron."

 clumsy_accountant: "Contable torpe"
 clumsy_accountant_desc: "El ministro se ha puesto con los libros del tesoro, y los resultados son... prometedores, de la misma manera que lo son los primeros borradores. Los errores son pequeños y corregibles, pero se acumulan. La práctica los hará exactos."

 # ============================================================
 # Stepping Stone Traits — Chain Endpoints
 # ============================================================
 master_reformer: "Maestro Reformador"
 master_reformer_desc: "Forjado a través de años de defensa implacable y contratiempos costosos, este ministro se ha convertido en un arquitecto del cambio duradero. Donde otros ven intereses arraigados, él ve palancas. Las instituciones del reino se pliegan a su voluntad, y no al revés."

 returned_colonial_governor: "Gobernador colonial regresado"
 returned_colonial_governor_desc: "Este ministro ha pasado años supervisando las posesiones distantes del reino, navegando por las penurias de la frontera, la ambición colonial y la intrincada política de los gobernadores lejanos. Regresa a casa transformado, portando una experiencia que ninguna educación cortesana podría proporcionar."

 # ============================================================
 # Chain A — The Reformer's Path (cc_prog.1–4)
 # ============================================================
 cc_prog.1.title: "El reformista lucha contra la ley"
 cc_prog.1.desc: "El ministro ha pasado meses luchando con la reforma administrativa, produciendo resultados que son más esperanzadores que impresionantes. Los antiguos estatutos son un laberinto y el progreso es lento. Pero están aprendiendo."
 cc_prog.1.a: "Así es como se construye la experiencia: lentamente."
 cc_prog.1.b: "La reforma crea confusión en las provincias."

 cc_prog.2.title: "Toma forma un reformista"
 cc_prog.2.desc: "Tras años de esfuerzo persistente y lecciones ganadas a pulso, el tacto incierto del ministro con la reforma administrativa ha dado paso a algo más fiable. Los días de torpeza han quedado atrás."
 cc_prog.2.a: "Nombrarlos como reformador legal pleno."

 cc_prog.3.title: "El reformador legal se vuelve audaz"
 cc_prog.3.desc: "La visión reformista del ministro se ha vuelto más audaz con cada año de servicio. Lo que antes parecía radical, ahora parece simplemente correcto. El reino puede llegar más lejos, y el ministro tiene la intención de llevarlo allí."
 cc_prog.3.a: "Que lleven a cabo una reforma progresista."

 cc_prog.4.title: "Surge el Maestro Reformador"
 cc_prog.4.desc: "Tras más de una década de defensa implacable y lucha institucional, el ministro ha dominado el arte de la reforma. Reestructuran administraciones donde otros solo ven obstáculos, y su legado ya se está escribiendo en los libros de leyes."
 cc_prog.4.a: "El reino honra a su maestro reformador."

 # ============================================================
 # Chain C — The Diplomat's Ascent (cc_prog.10–12)
 # ============================================================
 cc_prog.10.title: "El enviado tentativo tantea el terreno"
 cc_prog.10.desc: "Las primeras incursiones del ministro en el arte de gobernar son cautelosas: tantea el terreno antes de comprometerse con una posición. Las cortes extranjeras notan tanto su cuidado como su vacilación."
 cc_prog.10.a: "Un enfrentamiento preliminar cuidadoso pero exitoso."
 cc_prog.10.b: "Un traspié diplomático, recuperado rápidamente."

 cc_prog.11.title: "El Enviado Encuentra su Voz"
 cc_prog.11.desc: "Gracias a la exposición repetida a las cortes ajenas, el tacto diplomático del ministro se ha vuelto seguro y firme. Lo que antes requería un cálculo cuidadoso ahora fluye con naturalidad. Han encontrado su voz."
 cc_prog.11.a: "Nómbralos el enviado tactful del reino."
 cc_prog.11.b: "Su puesto en el extranjero los ha moldeado; nombrémoslos nuestro agregado."

 cc_prog.12.title: "El Enviado Domina el Arte de Gobernar"
 cc_prog.12.desc: "Una larga carrera de negociaciones cuidadosas, rivalidades gestionadas y relaciones cultivadas ha agudizado el juicio del ministro hasta darle un filo preciso. Leen una habitación como un general lee un campo de batalla, y actúan en consecuencia."
 cc_prog.12.a: "El reino gana a un maestro estadista."

 # ============================================================
 # Chain D — The Military Hardening (cc_prog.20–22)
 # ============================================================
 cc_prog.20.title: "El Ayudante Verde en el Campo"
 cc_prog.20.desc: "El ministro ha estado revisando los registros de campaña y observando la disposición de las tropas, aprendiendo el arte de la guerra desde cero. El progreso es moderado, pero es real."
 cc_prog.20.a: "Un bautismo de fuego: las campañas les enseñan rápidamente."
 cc_prog.20.b: "Estudian las campañas de los grandes comandantes."

 cc_prog.21.title: "El ayudante se gana sus estrellas"
 cc_prog.21.desc: "Después de años de estudio diligente y observación de campo, el conocimiento del ayudante sobre asuntos militares se ha cristalizado en una comprensión estratégica genuina. Ya no están aprendiendo; ahora están asesorando."
 cc_prog.21.a: "Nombrarlos como asesor táctico pleno."

 cc_prog.22.title: "El asesor táctico elige un camino"
 cc_prog.22.desc: "El asesor táctico ha llegado al punto en que un mayor crecimiento exige una elección de especialización. ¿Construirá los ejércitos permanentes del reino, dominará el arte de la ofensiva o dedicará sus dones a una defensa sólida?"
 cc_prog.22.a: "Construye el ejército permanente: la disciplina por encima de todo."
 cc_prog.22.b: "Domine la ofensiva: golpee con rapidez y decisión."
 cc_prog.22.c: "Fortificar el reino: mantener lo que tenemos, no perder nada."

 # ============================================================
 # Chain F — The Fiscal Path (cc_prog.30–32)
 # ============================================================
 cc_prog.30.title: "El Contador Torpe Revisa los Libros de Contabilidad"
 cc_prog.30.desc: "El ministro ha estado conciliando los libros del tesoro, encontrando pequeños errores y adquiriendo lentamente una comprensión de las finanzas del reino. El proceso es ocasionalmente doloroso, pero siempre instructivo."
 cc_prog.30.a: "Se ha encontrado un error contable a favor del tesoro; el reino toma nota."
 cc_prog.30.b: "Un pequeño descuido avergüenza al ministro, pero este aprende de ello."

 cc_prog.31.title: "El contador demuestra su valía"
 cc_prog.31.desc: "Mediante una revisión minuciosa de las cuentas y el cuidadoso cultivo de los administradores subordinados, el ministro ha pasado de ser un recién llegado tentativo a un administrador fiable de las finanzas del reino."
 cc_prog.31.a: "Nombrarlos mayordomo leal de la tesorería."

 cc_prog.32.title: "El mayordomo leal traza un rumbo"
 cc_prog.32.desc: "Con un control firme de las finanzas del reino, el ministro se encuentra en una encrucijada. Puede cultivar la prosperidad de manera generalizada —fomentando el crecimiento en todas las provincias— o imponer una disciplina más estricta en el funcionamiento del tesoro."
 cc_prog.32.a: "Cultivar la prosperidad en todo el reino."
 cc_prog.32.b: "Impón la disciplina fiscal y haz valer la autoridad del tesoro."

 # ============================================================
 # Chain E — The Colonial Pioneer (cc_prog.40)
 # ============================================================
 cc_prog.40.title: "El gobernador regresa"
 cc_prog.40.desc: "Después de años supervisando las distantes posesiones coloniales del reino —navegando por las penurias de la frontera, la ambición local y la intrincada política de los gobernadores remotos— el ministro ha regresado a casa. No vuelven siendo los mismos que cuando partieron."
 cc_prog.40.a: "Damos la bienvenida al gobernador a casa. El reino es más rico gracias a ello."
