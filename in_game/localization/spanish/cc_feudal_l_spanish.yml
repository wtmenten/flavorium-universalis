l_spanish:
 # ============================================================
 # FEUDAL COURT TRAITS (Age 1)
 # ============================================================

 seneschal: "Senescal"
 desc_seneschal: "El senescal es la mano derecha del señor: guardián del hogar, gestor de la propiedad y administrador de todo lo que la corona requiere para funcionar. Bajo su cuidadosa gestión, se reducen los gastos de la corte y se cultiva la buena voluntad de la nobleza."
 seneschal_die_desc: "[CHARACTER.GetName] ha muerto. Las cuentas domésticas deberán ser auditadas antes de que alguien pueda estar seguro de qué se mantuvo en orden y qué se mantuvo oculto."

 court_chaplain: "Capellán de la corte"
 desc_court_chaplain: "El confesor y asesor espiritual de la corte, siempre al lado del gobernante. El clero recurre a él en busca de guía y patrocinio; la corte recurre a él en busca de la sanción de Dios. Su influencia no cesa cuando termina la reunión del gabinete."
 court_chaplain_die_desc: "[CHARACTER.GetName] ha muerto. Se encenderán las velas y se dirán las oraciones, y se encontrará un nuevo confesor. Pero la intimidad del consejo espiritual tarda años en reconstruirse."

 marshal_of_the_court: "Mariscal de la Corte"
 desc_marshal_of_the_court: "El comandante del séquito militar de la casa, el Mariscal, asegura que la caballería del señor esté bien montada, bien entrenada y lista para cabalgar. Bajo su mando, las fuerzas montadas cuestan menos de reclutar y rinden mejor en el campo."
 marshal_of_the_court_die_desc: "[CHARACTER.GetName] ha muerto. Las formaciones de caballería que [CHARACTER.GetSheHe] entrenó mantendrán su disciplina durante una temporada. Después de eso, alguien más deberá tomar el estandarte."

 master_of_coin: "Maestre de la Moneda"
 desc_master_of_coin: "El gestor del tesoro de la corte feudal: a menudo un mercader italiano, siempre un contable meticuloso. El Maestro de la Moneda orienta el flujo del comercio en beneficio de la corona y mantiene al gremio de mercaderes bien dispuesto hacia los proyectos del gobernante."
 master_of_coin_die_desc: "[CHARACTER.GetName] ha muerto. Los libros de contabilidad que [CHARACTER.GetSheHe] mantuvo son meticulosos. Si [CHARACTER.GetHerHis] sucesor puede leerlos es otra cuestión."

 herald_of_arms: "Heraldo de Armas"
 desc_herald_of_arms: "El heraldo es la voz de la corte en el mundo más allá de sus muros: lleva mensajes entre príncipes, gestiona el protocolo y mantiene la delicada ficción de que la diplomacia está por encima de los intereses. Bajo su guía, la reputación diplomática del reino se cuida meticulosamente."
 herald_of_arms_die_desc: "[CHARACTER.GetName] ha muerto. Las conexiones que [CHARACTER.GetSheHe] mantuvo a través de años de cuidadosa correspondencia no sobrevivirán sin atención. Alguien debe hacerse cargo de la correspondencia."

 court_astrologer: "Astrólogo de la corte"
 desc_court_astrologer: "El astrólogo se encuentra en la intersección entre el saber y la autoridad espiritual; es consultado para buscar fechas favorables, presagios significativos y asuntos de importancia celestial. Su influencia sobre el clima intelectual de la corte es silenciosa pero persistente."
 court_astrologer_die_desc: "[CHARACTER.GetName] ha muerto. Los mapas y cálculos que [CHARACTER.GetSheHe] dejó serán estudiados durante años, aunque interpretados, como siempre, para convenir a quien los lea."

 # ============================================================
 # FEUDAL COURT EVENTS (cc_feudal namespace)
 # ============================================================

 cc_feudal.2.title: "¿Banquete o ayuno?"
 cc_feudal.2.desc: "Con el tesoro lleno y la cosecha abundante, los nobles están inquietos por la expectativa. Se ha propuesto un gran banquete: una ocasión para la generosidad y el despliegue. El tesoro no sufriría si nos negáramos, pero la buena voluntad de los nobles podría."
 cc_feudal.2.a: "Abrir las cocinas y las bodegas de vino: la corte banqueteará."
 cc_feudal.2.b: "El reino tiene mejores usos para ese oro; pasamos hambre."

 cc_feudal.3.title: "El confesor del rey"
 cc_feudal.3.desc: "El capellán de la corte ha solicitado una audiencia privada. Habla del deber, de la fe, del peso espiritual de las decisiones de la corona y, con cuidadosa delicadeza, de la guerra venidera. ¿Dejaremos que la fe guíe nuestra mano o trazaremos nuestro propio rumbo?"
 cc_feudal.3.a: "Escucha el consejo del capellán; deja que la fe tenga voz en esto."
 cc_feudal.3.b: "Agradecerles sus oraciones y guardar silencio sobre los propios planes."

 cc_feudal.4.title: "El censo fiscal"
 cc_feudal.4.desc: "El maestro de la moneda ha propuesto un estudio formal de nuestros ingresos provinciales: una contabilidad cuidadosa de lo que el reino produce realmente y lo que paga realmente. Costaría algo de oro realizarlo adecuadamente, pero los resultados serían precisos."
 cc_feudal.4.a: "Financia el estudio: unas cuentas precisas valen el coste."
 cc_feudal.4.b: "Invertir los fondos en la capital en lugar de en la contabilidad."

 cc_feudal.5.title: "Torneo de la Corte"
 cc_feudal.5.desc: "El mariscal de la corte ha propuesto un torneo: tres días de justas, banquetes y despliegue. Los nobles están entusiasmados; el tesoro, menos. Un torneo fomenta la lealtad y la moral, pero no resulta barato."
 cc_feudal.5.a: "Organizar el torneo; que la corte muestre sus colores."
 cc_feudal.5.b: "Canalizar la energía del torneo hacia un entrenamiento militar real en su lugar."

 cc_feudal.6.title: "Un extranjero erudito busca servicio"
 cc_feudal.6.desc: "Un erudito de una corte distante ha llegado buscando empleo. Su saber es genuino, aunque sus métodos resulten desconocidos. Una corte cautelosa podría rechazarlo; una abierta podría descubrir que aporta algo de lo que carecíamos."
 cc_feudal.6.a: "Nombrar al extranjero [foreigner.GetName]; el aprendizaje no tiene fronteras. (Los nobles no están contentos, pero el erudito se une a nuestra corte)."
 cc_feudal.6.b: "Organiza un intercambio académico entre el extranjero y nuestro capellán de la corte. El conocimiento compartido es conocimiento multiplicado."
 cc_feudal.6.c: "Rechazar; la corte no necesita novedades extranjeras."

 cc_feudal.7.title: "El Llamado a la Guerra Santa"
 cc_feudal.7.desc: "El alto clero de la corte se ha puesto en pie en la sala del trono y ha emitido una declaración: la fe exige acción. Un reino vecino de religión diferente se encuentra en nuestra frontera, y los soldados de Dios no deben permanecer ociosos. La corte contiene el aliento."
 cc_feudal.7.a: "Responde a la llamada: que marchen los ejércitos de la fe."
 cc_feudal.7.b: "Autorizar la preparación espiritual: estaremos listos, pero nosotros elegiremos el momento."
 cc_feudal.7.c: "La corona responde ante Dios y ante la razón. Esta no es nuestra guerra."
