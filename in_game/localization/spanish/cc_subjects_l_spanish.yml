l_spanish:


 # ============================================================
 # SUBJECT TYPE UI KEYS (LEAD_/AM_/CANCEL_)
 # ============================================================
 junior_partner: "Socio menor"
 LEAD_junior_partner: "Gobernante Senior"
 AM_junior_partner: "Socio menor"
 CANCEL_junior_partnerTITLE: "Disolver la unión real"
 CANCEL_junior_partner_DESC: "Finalizar la unión real, rompiendo el vínculo dinástico entre nuestras cortes y restaurando la plena independencia del reino socio."

 LEAD_lesser_partner: "Gobernante Senior"
 AM_lesser_partner: "Socio menor"
 CANCEL_lesser_partnerTITLE: "Disolver la asociación menor"
 CANCEL_lesser_partner_DESC: "Disuelve la asociación menor, devolviendo al reino socio su política exterior independiente. La profunda integración económica de los últimos cincuenta años no puede deshacerse fácilmente."

 LEAD_shadow_state: "Patrón en la sombra"
 AM_shadow_state: "Estado en la sombra"
 CANCEL_shadow_stateTITLE: "Retirar la Suzeranía en la Sombra"
 CANCEL_shadow_state_DESC: "Ruptura discreta de la suzeranía encubierta, liberando al estado en la sombra de sus obligaciones del tratado y poniendo fin a nuestra influencia informal sobre sus asuntos."

 LEAD_puppet_state: "Soberano"
 AM_puppet_state: "Estado vasallo"
 CANCEL_puppet_stateTITLE: "Liberar estado títere"
 CANCEL_puppet_state_DESC: "Conceder la independencia al estado títere, retirando la supervisión administrativa directa. El reino recupera el control de su propia política exterior."

 LEAD_elite_enclave: "Patrón"
 AM_elite_enclave: "Enclave de Élite"
 CANCEL_elite_enclaveTITLE: "Revocar el fuero del enclave"
 CANCEL_elite_enclave_DESC: "Revocar el fuero del enclave cultural, poniendo fin a la autonomía formal y al acuerdo de patronazgo noble. Las casas nobles no olvidarán este desaire."

 LEAD_palatinate: "Señor"
 AM_palatinate: "Palatinado"
 CANCEL_palatinateTITLE: "Disolver el palatinado"
 CANCEL_palatinate_DESC: "Disuelve el palatinado, despojando al conde palatino de su autoridad soberana y poniendo fin a una de las asociaciones culturales más prestigiosas de nuestro reino."

 LEAD_associated_republic: "Patrón"
 AM_associated_republic: "República asociada"
 CANCEL_associated_republicTITLE: "Finalizar Asociación Republicana"
 CANCEL_associated_republic_DESC: "Retirarse del acuerdo de patrocinio, poniendo fin al intercambio académico y a la asociación formal con la república."

 LEAD_chartered_company: "Corona otorgante"
 AM_chartered_company: "Compañía privilegiada"
 CANCEL_chartered_companyTITLE: "Revocar el fuero comercial"
 CANCEL_chartered_company_DESC: "Revocar el fuero comercial real, disolviendo el estatus legal de la compañía como brazo de la corona. Los estamentos mercantiles impugnarán esto vigorosamente."

 LEAD_artists_commune: "Patrón"
 AM_artists_commune: "Comuna de Artistas"
 CANCEL_artists_communeTITLE: "Disolver la comuna de artistas"
 CANCEL_artists_commune_DESC: "Retirar la carta de la comuna, poniendo fin al acuerdo formal de patrocinio y dispersando a los artistas que se reunieron bajo nuestra protección."

 LEAD_scientific_college: "Patrón"
 AM_scientific_college: "Colegio científico"
 CANCEL_scientific_collegeTITLE: "Disolver el concordato académico"
 CANCEL_scientific_college_DESC: "Finalizar el concordato académico, rompiendo la relación formal entre nuestra corona y la hermandad erudita. Las conexiones de investigación tardarán años en reconstruirse."

 LEAD_naval_administration: "Corona"
 AM_naval_administration: "Administración naval"
 CANCEL_naval_administrationTITLE: "Revocar el fuero naval"
 CANCEL_naval_administration_DESC: "Revocar el fuero naval, poniendo fin al estatus administrativo semiindependiente de la ciudad portuaria. Las contribuciones de los marineros a nuestra flota cesarán."

 LEAD_protectorate: "Protector"
 AM_protectorate: "Protectorado"
 CANCEL_protectorateTITLE: "Finalizar Protectorado"
 CANCEL_protectorate_DESC: "Retirar nuestra protección formal, liberando al protectorado para que gestione su propia seguridad. La proyección de poder y la reputación diplomática que ganamos se desvanecerán."

 LEAD_crown_dependency: "Corona"
 AM_crown_dependency: "Dependencia de la Corona"
 CANCEL_crown_dependencyTITLE: "Liberar dependencia de la Corona"
 CANCEL_crown_dependency_DESC: "Finalizar el acuerdo de gobernanza dinástica, rompiendo el gobierno familiar compartido y liberando a la dependencia para que gestione sus propios asuntos."

 LEAD_holy_protectorate: "Protector Sagrado"
 AM_holy_protectorate: "Protectorado Sagrado"
 CANCEL_holy_protectorateTITLE: "Retirar la Protección Sagrada"
 CANCEL_holy_protectorate_DESC: "Retirar nuestro patrocinio espiritual, liberando al estado correligionario de su estatus de protegido. Nuestra posición entre los fieles sufrirá por el abandono."

 # ============================================================
 # SUBJECT TYPE DESCRIPTIONS
 # ============================================================
 junior_partner_desc: "Un $junior_partner$ conserva su propio gobernante y lleva a cabo una política exterior independiente, aunque reconoce la preeminencia de su señor. Ambos reinos se benefician de una propagación más rápida de las instituciones y del refuerzo mutuo de la legitimidad. Crear un $junior_partner$ requiere el avance $royal_union_network_advance$ y un feudo existente sujeto a mejorar."
 junior_partner_tt: "Aún no se puede mejorar: la relación actual con el súbdito debe estabilizarse antes de que se pueda ofrecer un nuevo acuerdo."

 lesser_partner: "Socio menor"
 lesser_partner_desc: "Un $lesser_partner$ es la maduración de un $junior_partner$ tras cincuenta años de dinastía compartida. La política exterior independiente del reino se ve restringida, pero la integración económica se profundiza: el tributo aumenta considerablemente mientras que ambas cortes se vuelven más estables y legítimas."
 lesser_partner_upgrade_tt: "Aún no se puede mejorar: el vínculo de unión requiere cincuenta años para madurar en una Asociación Menor."

 shadow_state: "Estado en la sombra"
 shadow_state_desc: "Un $shadow_state$ es formalmente independiente, vinculado únicamente por un tratado secreto y acuerdos discretos. El señor ejerce influencia sin anexión, ganando proyección de poder mientras que el súbdito disfruta de estabilidad y legitimidad. Esta relación solo puede establecerse mediante un tratado con una nación independiente existente. Requiere el avance $shadow_diplomacy_advance$."

 cc_force_shadow_state: "Exigir suzeranía en la sombra"
 cc_force_shadow_state_entry: "Exigir suzeranía en la sombra"
 cc_force_shadow_state_entry_short: "Exigir suzeranía en la sombra"
 cc_force_shadow_state_desc: "Obligar a la nación derrotada a aceptar una suzeranía encubierta, reconociendo vuestro dominio mediante un tratado secreto en lugar de una subyugación pública. La relación proyectará vuestro poder sin todo el antagonismo de una conquista abierta. Requiere el avance de Diplomacia en las Sombras."

 client_state: "Estado cliente"
 client_state_desc: "Un $client_state$ es una nación integrada en la órbita de una potencia más fuerte mediante un tratado o provincias liberadas. Conserva su propia política exterior, pero paga un tributo modesto y eventualmente puede ser ascendido a $puppet_state$. Requiere el avance $client_state_advance$."

 puppet_state: "Estado vasallo"
 puppet_state_desc: "Un $puppet_state$ es una nación anteriormente independiente puesta bajo la supervisión administrativa total de su señor. Su política exterior está controlada, su tesoro dirigido y sus ejércitos convocados a voluntad. Tanto los súbditos $shadow_state$ como $client_state$ pueden ser ascendidos a este estatus después de cincuenta años. Requiere el avance $puppet_state_advance$."
 puppet_state_upgrade_tt: "Aún no se puede mejorar: la subyugación actual es demasiado reciente para permitir una mayor consolidación del control."

 elite_enclave: "Enclave de Élite"
 elite_enclave_desc: "Un $elite_enclave$ es un dominio culturalmente afín al que se le ha concedido el autogobierno en reconocimiento a su herencia noble. No participa en guerras, pero confiere un prestigio cultural notable, aumentando la influencia cultural, la tradición cultural y la satisfacción del estamento noble. Limitado a un solo súbdito de este tipo. Requiere el avance $noble_patronage_advance$ y el privilegio de estamento Derechos del Enclave Noble."

 palatinate: "Palatinado"
 palatinate_desc: "Un $palatinate$ es un $elite_enclave$ que ha crecido hasta convertirse en una potencia semi-soberana. El conde palatino puede ahora declarar la guerra, convocar levas y unirse a campañas. Los beneficios culturales y de prestigio para el señor son considerables. Solo puede crearse mejorando un $elite_enclave$ después de veinte años. Requiere el avance $palatinate_advance$."
 palatinate_upgrade_tt: "Aún no se puede mejorar: el enclave debe madurar durante veinte años antes de ser elevado a Palatinado."

 associated_republic: "República asociada"
 associated_republic_desc: "Una $associated_republic$ es un estado republicano independiente bajo un patrocinio formal. Ambas partes mantienen su independencia política, pero el súbdito se somete a su patrón en guerras defensivas, y ambos se benefician de un intercambio académico que acelera la investigación. El súbdito debe tener un tipo de gobierno republicano. Requiere el avance $republican_patronage_advance$."

 chartered_company: "Compañía privilegiada"
 chartered_company_desc: "Una $chartered_company$ es una corporación comercial con carta real que opera en tierras lejanas en nombre de su señor. Paga un tributo elevado en oro, mano de obra y marineros, al tiempo que potencia la fuerza del centro comercial y la velocidad de investigación. Los súbditos deben estar en un subcontinente diferente al de la capital del señor. Requiere el avance $chartered_company_advance$, la reforma del Sistema de Cartas Coloniales y una burocracia activa de la Oficina Comercial Real."

 artists_commune: "Comuna de Artistas"
 artists_commune_desc: "Una $artists_commune$ es una comunidad autónoma de pintores, escultores y artesanos cuyas obras redundan en la gloria de su patrón. Aportando poco oro, produce dividendos espectaculares en influencia cultural y velocidad de investigación. Debe compartir el grupo cultural del señor, estar limitada a una provincia y solo puede existir una. Requiere el avance $artistic_patronage_advance$."

 scientific_college: "Colegio científico"
 scientific_college_desc: "Un $scientific_college$ es una institución académica de una entidad gobernada religiosamente, libre de dedicarse al aprendizaje en nombre de su patrón. Sus beneficios —propagación más rápida de instituciones, reducción de costes de adopción y mejora de la resistencia a enfermedades— fluyen en ambas direcciones. El súbdito debe ser una teocracia, y solo puede existir uno. Requiere el avance $scholarly_orders_advance$ y el privilegio de estamento clérigo de Hermandad Erudita."

 naval_administration: "Administración naval"
 naval_administration_desc: "Una $naval_administration$ es una ciudad portuaria a la que se le ha concedido semi-independencia para gestionar la logística marítima de la flota de su patrón. Paga una proporción inusualmente alta de sus marineros, además de oro y mano de obra. Debe compartir el grupo cultural del señor, y solo puede existir una. Requiere el avance $naval_charter_advance$ y el privilegio de estamento burgués de Carta Naval."

 protectorate: "Protectorado"
 protectorate_desc: "Un $protectorate$ es un estado vecino más débil bajo la protección de una potencia más fuerte sin una subyugación formal. No paga tributo y lucha sus propias guerras, pero reconoce la veteranía del patrón. El señor gana proyección de poder y reputación diplomática, y niega el territorio a sus rivales. Requiere el avance $protectorate_rights_advance$."

 crown_dependency: "Dependencia de la Corona"
 crown_dependency_desc: "Una $crown_dependency$ es un reino vinculado a su señor por lazos de dinastía compartida, donde la misma familia gobernante rige ambas cortes sin una unión personal formal. La dependencia paga un tributo considerable y se une a las guerras de su patrón, mientras que ambas partes se benefician de una mayor prestige y legitimidad. Requiere el avance $dynastic_governance_advance$ y una familia gobernante compartida."

 holy_protectorate: "Protectorado Sagrado"
 holy_protectorate_desc: "Un $holy_protectorate$ es un estado coreligionista puesto bajo el patrocinio espiritual de una potencia mayor. No paga tributo en oro, pero proporciona al señor influencia religiosa, proyección de poder y prestigio. Ambas partes siempre se unen a las guerras defensivas del otro. El súbdito debe compartir el grupo religioso del señor. Requiere el avance $holy_patronage_advance$."


 royal_union_network_advance: "Red de Unión Real"
 royal_union_network_advance_desc: "Las uniones personales no tienen por qué ser herencias pasivas. Al cultivar una red de vínculos dinásticos e instituciones compartidas, la unión puede convertirse en un instrumento vivo de política. Desbloquea los tipos de sujeto $junior_partner$ y $lesser_partner$."

 shadow_diplomacy_advance: "Diplomacia en la sombra"
 shadow_diplomacy_advance_desc: "No toda la influencia se manifiesta abiertamente. Mediante tratados silenciosos y la colocación discreta de agentes de confianza, un monarca puede vincular a un estado vecino a sus intereses sin mover un solo ejército. Desbloquea el tipo de súbdito $shadow_state$ y el privilegio de estamento noble Red de Sombras."

 artistic_patronage_advance: "Mecenazgo Artístico"
 artistic_patronage_advance_desc: "Encargar grandes obras de arte es dejar una huella en el tiempo mismo. Un gobernante que abre el tesoro a pintores, poetas y arquitectos acumula un capital cultural que perdura más que cualquier campaña militar. Desbloquea el tipo de súbdito $artists_commune$ y el privilegio de estamento noble Patronazgo de las Artes."

 noble_patronage_advance: "Patrocinio noble"
 noble_patronage_advance_desc: "Un gobernante sabio reconoce que la alta nobleza, si se le concede una autonomía honrosa, devolverá lealtad en lugar de resentimiento. El reconocimiento formal de los enclaves nobles transforma a los rivales potenciales en campeones culturales. Desbloquea el tipo de vasallo $elite_enclave$ y el privilegio de estamento Derechos del Enclave Noble."

 republican_patronage_advance: "Patrocinio Republicano"
 republican_patronage_advance_desc: "Las repúblicas poseen un genio práctico que las monarquías harían bien en cultivar. A través del patrocinio formal, un rey puede asegurar la producción intelectual de una república libre sin amenazar su identidad. Desbloquea el tipo de súbdito $associated_republic$."

 dynastic_governance_advance: "Gobernanza dinástica"
 dynastic_governance_advance_desc: "La red de matrimonios reales que une a las cortes europeas no tiene por qué seguir siendo ceremonial. Con un diseño cuidadoso, una dinastía compartida puede convertirse en un marco de coordinación política genuina. Desbloquea el tipo de súbdito $crown_dependency$."

 client_state_advance: "Diplomacia de estados clientes"
 client_state_advance_desc: "Al ofrecer protección a cambio de tributo, una gran potencia puede extender su influencia hacia los territorios vecinos sin el gasto de una conquista total. Las relaciones de clientela son la savia de la expansión hegemónica. Desbloquea el tipo de súbdito $client_state$."

 naval_charter_advance: "Carta naval"
 naval_charter_advance_desc: "Una gran flota requiere no solo barcos, sino infraestructura: diques secos, redes de abastecimiento y experiencia mercantil. Otorgar un estatus administrativo especial a un puerto estratégico garantiza que estas necesidades siempre se cubran. Desbloquea el tipo de súbdito $naval_administration$ y el privilegio de estamento burgués de Carta Naval."

 protectorate_rights_advance: "Derechos del protectorado"
 protectorate_rights_advance_desc: "El derecho de gentes permite que una potencia más fuerte se declare protectora de un vecino más débil, extendiendo un escudo sin requerir una subyugación formal. Tales acuerdos son más baratos de establecer que el vasallaje. Desbloquea el tipo de súbdito $protectorate$."

 scholarly_orders_advance: "Órdenes eruditas"
 scholarly_orders_advance_desc: "Las grandes órdenes religiosas han sido durante mucho tiempo las guardianas del saber. Al formalizar la relación entre la corona y el claustro, un gobernante puede aprovechar los conocimientos acumulados de la iglesia. Desbloquea el tipo de sujeto $scientific_college$ y el privilegio de estamento del clero Hermandad Erudita."

 palatinate_advance: "Sistema del Palatinado"
 palatinate_advance_desc: "Los enclaves nobles más elevados pueden ser reconocidos como palatinados, territorios soberanos dentro de un soberano cuyos condes ejercen una autoridad casi regia. Tal reconocimiento profundiza el vínculo cultural y militar entre el palatinado y el señor superior. Desbloquea la mejora de $palatinate$ para los súbditos de $elite_enclave$."

 holy_patronage_advance: "Patrocinio Sagrado"
 holy_patronage_advance_desc: "La fe es un vínculo más fuerte que cualquier tratado. Un gobernante que se posiciona como guardián de sus vecinos correligionarios no solo asegura aliados, sino un flujo de prestigio espiritual que emana de cada comunión compartida. Desbloquea el tipo de súbdito $holy_protectorate$."

 puppet_state_advance: "Administración del estado vasallo"
 puppet_state_advance_desc: "La influencia en la sombra debe acabar cediendo el paso a la administración directa. Con los mecanismos burocráticos adecuados, un señor puede transformar a un cliente débilmente vinculado o a un estado en la sombra en un títere cuyos asuntos se dirijan desde la capital del señor. Desbloquea la mejora $puppet_state$ para los súbditos $shadow_state$ y $client_state$."

 chartered_company_advance: "Compañías comerciales privilegiadas"
 chartered_company_advance_desc: "Las clases mercantiles han demostrado una capacidad sin precedentes para organizar el comercio a escala global. Mediante la emisión de cartas reales, una corona puede dirigir esta energía hacia continentes lejanos, asegurando tributos y comercio. Desbloquea el tipo de súbdito $chartered_company$, el privilegio del estamento burgués Carta Comercial Real y la reforma Sistema de Cartas Coloniales."


 ep_noble_elite_enclave: "Derechos de Enclave Noble"
 ep_noble_elite_enclave_desc: "La corona reconoce formalmente el derecho de la alta nobleza de cultura afín a gobernar enclaves como dominios autoadministrados, convirtiendo el resentimiento noble en prestigio cultural para la dinastía."

 ep_noble_patronage_arts: "Mecenazgo de las Artes"
 ep_noble_patronage_arts_desc: "La nobleza asume un papel formal como mecenas de pintores, escultores y poetas, asociando su prestigio con el florecimiento cultural del reino."

 ep_noble_shadow_network: "Red en la sombra"
 ep_noble_shadow_network_desc: "La alta nobleza establece una red clandestina de informantes y mediadores de influencia en los estados vecinos, proyectando el poder del reino a través de intermediarios en lugar de ejércitos."

 ep_clergy_scholarly_college: "Hermandad erudita"
 ep_clergy_scholarly_college_desc: "El clero establece una hermandad formal dedicada a la preservación y el avance del saber, concediendo libertad académica a los eruditos de las órdenes religiosas a cambio de que su producción intelectual beneficie al reino."

 ep_burgher_naval_charter: "Carta naval"
 ep_burgher_naval_charter_desc: "La clase mercantil asume la responsabilidad formal del abastecimiento y la administración de la infraestructura naval del reino, a cambio de privilegios especiales sobre ciudades portuarias designadas."

 ep_burgher_royal_charter: "Carta Comercial Real"
 ep_burgher_royal_charter_desc: "La corona otorga a los estamentos mercantiles el derecho de organizar corporaciones comerciales con carta real, permitiendo operaciones comerciales en tierras lejanas bajo la protección de la autoridad de la corona."


 cc_shadow_court_bureau: "Corte en la sombra"
 cc_shadow_court_bureau_desc: "Una institución clandestina a través de la cual se gestionan los intereses diplomáticos encubiertos del reino: agentes colocados en cortes extranjeras, comunicaciones mantenidas con estados en la sombra e influencia construida fuera del registro público. La Corte de las Sombras amplifica la proyección de poder y la reputación diplomática, pero el descuido genera malestar entre los estamentos nobles."

 cc_royal_trading_bureau: "Oficina Comercial Real"
 cc_royal_trading_bureau_desc: "Un organismo gubernamental formal que supervisa las empresas comerciales chárter del reino en el extranjero. La Oficina coordina las licencias, la resolución de disputas y el flujo de bienes tributarios hacia la corona. Cuando se mantiene bien, genera ingresos fiscales significativos y expande la capacidad marítima."

 cc_scholarly_concordat: "Concordato erudito"
 cc_scholarly_concordat_desc: "Un acuerdo formal entre la corona y el clero que establece las condiciones bajo las cuales pueden operar las instituciones académicas: investigaciones realizadas, instituciones acogidas y conocimientos médicos aplicados en nombre del reino. Produce un crecimiento institucional más rápido y resistencia a las enfermedades cuando se financia adecuadamente."

 cc_colonial_charter_reform: "Sistema de fueros coloniales"
 cc_colonial_charter_reform_desc: "La corona establece un marco legal formal para emitir cartas reales a empresas comerciales que operen en tierras lejanas, otorgándoles autoridad militar y comercial a cambio de tributo y lealtad. Esta reforma permite la creación de súbditos de Compañías Privilegiadas."

 cc_internalized_scholarship: "Erudición Interiorizada"
 cc_internalized_scholarship_desc: "En lugar de establecer un colegio externo, el reino ha orientado a su propio clero hacia metas académicas más ambiciosas."

 cc_scholarly_exchange_modifier: "Intercambio erudito"
 cc_scholarly_exchange_modifier_desc: "Un intercambio formal de conocimientos entre el reino y su Colegio Científico enriquece a ambas partes con avances en el aprendizaje y la medicina."

 cc_thriving_port_modifier: "Puerto Naval Próspero"
 cc_thriving_port_modifier_desc: "La inversión en las instalaciones de la Administración Naval ha dado lugar a una infraestructura marítima ampliada que aumenta la capacidad de marineros del reino."

 cc_holy_league_modifier: "Liga Sagrada"
 cc_holy_league_modifier_desc: "El establecimiento formal de una Liga Santa entre el reino y su protectorado correligionario ha generado una ola de entusiasmo religioso y prestigio."

 cc_scholastic_disputation: "Disputa escolástica"
 cc_scholastic_disputation_desc: "Una célebre disputa teológica en nuestro Colegio Científico ha agudizado las mentes de todo el reino, impulsando el aprendizaje y fomentando la tolerancia hacia el intercambio del debate razonado."
 cc_theological_condemnation: "Condena teológica"
 cc_theological_condemnation_desc: "Una doctrina audaz impulsada por nuestro colegio ha sido condenada. El clima de sospecha resultante ha enfriado la investigación, erosionado la autoridad de la iglesia y fomentado la intolerancia en todo el reino."
 cc_reformed_scholarship: "Erudición reformada"
 cc_reformed_scholarship_desc: "Nuestra academia reformada se sitúa a la vanguardia de la teología escolástica, atrayendo a eruditos de toda la cristiandad y acelerando la difusión del conocimiento y de las nuevas instituciones."


 cc.shadow.1.title: "Rumores en la Corte"
 cc.shadow.1.desc: "Circulan rumores entre la alta nobleza sobre acuerdos clandestinos con cortes vecinas. Nuestros nobles más confiables hablan de una red ya medio formada: agentes infiltrados en consejos extranjeros, correspondencia que fluye por canales secundarios e influencia que se extiende allí donde nuestros ejércitos no pueden marchar.\n\n«Dadle vuestra bendición, mi señor», instan, «y proyectaremos nuestra sombra sobre sus dominios»."
 cc.shadow.1.a: "Formalizar la red en la sombra."
 cc.shadow.1.b: "Rechazar. Tales acuerdos invitan al escándalo."

 cc.shadow.2.title: "La red toma forma"
 cc.shadow.2.desc: "La red en la sombra ha demostrado su valor. Nuestros nobles proponen ahora formalizar el acuerdo en una institución permanente: una Corte en la Sombra que opere en los márgenes de la diplomacia oficial.\n\nLos beneficios serían considerables. Los costes correrían a cargo de otros."
 cc.shadow.2.a: "Establecer la Oficina de la Corte Sombría."
 cc.shadow.2.b: "Mantener la red de forma informal: la denegación plausible tiene sus ventajas."

 cc.shadow.bureau.1.title: "Se ofrece un títere"
 cc.shadow.bureau.1.desc: "Nuestra Corte en la Sombra ha identificado una oportunidad. Mediante presiones discretas, crisis sucesorias manipuladas y la retirada silenciosa de mecenas competidores, uno de nuestros estados sombra ha quedado totalmente dependiente de nuestra buena voluntad. La Oficina propone formalizar esta dependencia.\n\nEl objetivo no se resistirá. No tienen a nadie más a quien recurrir."
 cc.shadow.bureau.1.a: "Formalizar el acuerdo de marioneta."
 cc.shadow.bureau.1.b: "Mantener la relación en las sombras; la discreción sigue siendo preferible."

 cc.clergy.college.1.title: "Los eruditos buscan un hogar"
 cc.clergy.college.1.desc: "Ha llegado a nuestra corte la noticia de una congregación de clérigos eruditos —astrónomos, médicos, filósofos naturales— que han superado las instituciones disponibles para ellos. Buscan un hogar donde el conocimiento pueda florecer libre de las obligaciones parroquiales.\n\nEl clero ha inspeccionado nuestro reino y propone varias sedes entre nuestra propia gente donde podría dotarse un colegio teocrático autónomo, vinculado a nuestro reino, pero libre de perseguir el conocimiento según los hermanos consideren oportuno. A una sede más humilde se le concederían derechos de ciudad para albergarlos adecuadamente.\n\n¿Cuál dotaremos?"
 cc.clergy.college.1.opt1: "Dotar al colegio de [college_loc_1.GetName]."
 cc.clergy.college.1.opt2: "Dotar al colegio de [college_loc_2.GetName]."
 cc.clergy.college.1.opt3: "Dotar al colegio de [college_loc_3.GetName]."
 cc.clergy.college.1.b: "Alentar a los eruditos a permanecer dentro de nuestras propias instituciones."

 cc.clergy.college.2.title: "La hermandad erudita"
 cc.clergy.college.2.desc: "El colegio académico se ha establecido y su reputación ya está creciendo. En reconocimiento al patrocinio que lo hizo posible, los hermanos se han ofrecido a compartir sus descubrimientos con nuestra corte: un intercambio formal que promete acelerar considerablemente nuestro desarrollo intelectual."
 cc.clergy.college.2.a: "Acepta formalmente el intercambio académico."
 cc.clergy.college.2.b: "Agradecerles la oferta pero rechazar los acuerdos formales."

 cc.college.1.title: "La Gran Disputa"
 cc.college.1.desc: "Los maestros de nuestro Colegio Científico han convocado una gran disputa: un certamen formal de teología y filosofía natural que ha atraído a hombres eruditos de todas partes. Las salas resuenan con argumentos sobre la naturaleza de los cielos, el alma y la lectura correcta de las escrituras.\n\nTal reunión podría dar lugar a un tratado que se copiaría durante generaciones, pero solo si la corona está dispuesta a financiar la labor de los eruditos."
 cc.college.1.a: "Patrocina la disputa generosamente."
 cc.college.1.b: "Dejar que las universidades debatan a su propia costa."

 cc.college.2.title: "Una doctrina en cuestión"
 cc.college.2.desc: "Un brillante y joven erudito del colegio ha propuesto una nueva y audaz doctrina, una que reconcilia la filosofía antigua con la verdad revelada de una manera nunca antes intentada. Para algunos es una percepción profunda; para otros, una herejía peligrosa.\n\nEl colegio recurre a nosotros. ¿Defendemos esta doctrina ante el mundo erudito o la suprimimos antes de que se extienda?"
 cc.college.2.a: "Defender la doctrina."
 cc.college.2.b: "Suprimirlo y reafirmar la ortodoxia."

 cc.college.3.title: "La síntesis académica"
 cc.college.3.desc: "Años de estudio paciente en el colegio han producido una gran síntesis: un cuerpo unificado de conocimiento que tiende un puente entre la teología, la medicina y las ciencias naturales. Los hermanos preguntan cómo deseamos que se utilice este conocimiento.\n\n¿Deberá difundirse libremente, extendiendo nuevas instituciones por todo el reino y más allá, o mantenerse dentro de la iglesia, como un tesoro para el claustro?"
 cc.college.3.a: "Difundir la síntesis ampliamente."
 cc.college.3.b: "Mantenerlo dentro de la iglesia."

 cc.college.4.title: "La Academia Reformada"
 cc.college.4.desc: "Nuestro colegio se ha convertido en un célebre centro de erudición reformada. Donde antaño dominaban los escolásticos de la antigua iglesia, nuestros teólogos lideran ahora las disputas de la cristiandad, uniendo un método riguroso con las convicciones de la Reforma.\n\nLos eruditos acuden en masa a nuestras puertas. Con el favor de la corona, la academia podría convertirse en un faro para todo el mundo protestante."
 cc.college.4.a: "Adopta la academia reformada."
 cc.college.4.b: "Dotarlo generosamente desde el tesoro."

 cc.arts.1.title: "La Petición de los Maestros del Gremio"
 cc.arts.1.desc: "Los maestros gremiales de nuestras ciudades más grandes se han presentado en la corte con una petición inusual. Hablan de un distrito dedicado enteramente a las artes, exento de los impuestos gremiales ordinarios, gobernado por su propio consejo y dedicado a la producción de obras que llevarán el nombre de nuestra dinastía durante siglos. Han nombrado varias de nuestras propias ciudades, ricas en artesanos, donde tal comuna podría prosperar.\n\n'Concédanos una carta', dice su portavoz, 'y haremos que vuestro nombre sea eterno'."
 cc.arts.1.opt1: "Conceder el acta de la comuna en [commune_loc_1.GetName]."
 cc.arts.1.opt2: "Conceder el acta de la comuna en [commune_loc_2.GetName]."
 cc.arts.1.opt3: "Conceder el acta de la comuna en [commune_loc_3.GetName]."
 cc.arts.1.b: "Ahora no. Mantengamos a los maestros gremiales dentro de nuestros muros por el momento."
 cc.arts.1.b.tt: "No conceder ninguna comuna por ahora. El privilegio permanece; es posible que se le ofrezca la elección más adelante."

 cc.arts.2.title: "Una ciudad de cultura"
 cc.arts.2.desc: "La Comuna de Artistas se ha establecido y las primeras obras producidas bajo su estandarte han generado una admiración considerable. Los maestros del gremio proponen una inversión inaugural: fondos para construir estudios adecuados, talleres y una biblioteca digna de la empresa.\n\n'El retorno superará con creces el desembolso', prometen."
 cc.arts.2.a: "Invertir en las instalaciones de la comuna."
 cc.arts.2.b: "Que se desarrollen a su propio ritmo."

 cc.naval.1.title: "La petición del Almirantazgo"
 cc.naval.1.desc: "Nuestros estamentos mercantiles han presentado una petición formal. Argumentan que las crecientes ambiciones navales del reino requieren una administración portuaria dedicada, y tienen una ciudad candidata en mente. A cambio de una carta de semi-independencia, prometen un flujo constante de marineros entrenados para nuestra flota."
 cc.naval.1.a: "Conceder la carta naval. Establecer la Administración Naval."
 cc.naval.1.b: "Rechazar por ahora. El acuerdo requiere más consideración."

 cc.naval.2.title: "El puerto prospera"
 cc.naval.2.desc: "La Administración Naval ha demostrado su valía. Los barcos están bien provistos, las tripulaciones están entrenadas y el flujo de marineros hacia nuestra flota ha sido constante. Los administradores proponen ahora una expansión: un nuevo dique seco, almacenes ampliados y campos de entrenamiento mejorados.\n\n'La inversión se amortizará en una década', insiste el capitán de puerto."
 cc.naval.2.a: "Financia la expansión."
 cc.naval.2.b: "Las instalaciones actuales son suficientes."

 cc.holy.1.title: "Coreligionarios buscan refugio"
 cc.holy.1.desc: "Llegan noticias a través de un mensajero agitado: un estado vecino de nuestra propia fe, debilitado por conflictos internos y presionado por vecinos hostiles, busca nuestra protección. Su clero escribe en tonos de desesperación, invocando nuestra fe compartida y el deber de los fuertes de proteger a los débiles.\n\nLas ventajas estratégicas no son despreciables. Tampoco lo es el prestigio espiritual."
 cc.holy.1.a: "Ofrecer nuestra protección. Tomarlos como un Protectorado Sagrado."
 cc.holy.1.b: "No podemos comprometernos con enredos extranjeros en este momento."

 cc.111.title: "El Protectorado reclama los frutos de la Guerra Santa"
 cc.111.desc: "Nuestros ejércitos regresan de la guerra santa y, con ellos, llega una petición de [ward.GetName]. Su clero habla en términos medidos pero inequívocos: la guerra se libró en nombre de la fe compartida y los territorios conquistados cerca de sus fronteras son, a sus ojos, el fruto legítimo de esa lucha. No han exigido nada, todavía. Pero la expectativa permanece en la cámara como una espada desenvainada.\n\nCeder la tierra es honrar el vínculo. Conservarla es poner a prueba si el vínculo resiste."
 cc.111.a: "Conceder a [ward.GetName] los territorios conquistados cerca de sus fronteras. La fe se fortalece cuando los fieles poseen aquello que defienden."
 cc.111.b: "Estas tierras fueron ganadas por nuestros ejércitos y seguirán siendo nuestras. Nuestro protectorado aceptará la victoria... y nuestro juicio."

 cc.noble.enclave.1.title: "Un asiento para la nobleza"
 cc.noble.enclave.1.desc: "Habiéndose concedido ya los Derechos del Enclave Noble, la alta nobleza nos presiona para que reconozcamos uno de nuestros dominios urbanos como un enclave autónomo: una sede de herencia antigua donde las grandes casas puedan gobernar a los suyos. Sus administradores han inspeccionado nuestro reino y ofrecen varios candidatos dignos entre las ciudades de nuestro propio pueblo.\n\n¿Qué sede elevaremos a enclave noble, o los haremos esperar un poco más?"
 cc.noble.enclave.1.opt1: "Establecer el enclave en [enclave_loc_1.GetName]."
 cc.noble.enclave.1.opt2: "Establecer el enclave en [enclave_loc_2.GetName]."
 cc.noble.enclave.1.opt3: "Establecer el enclave en [enclave_loc_3.GetName]."
 cc.noble.enclave.1.b: "Todavía no. La nobleza puede esperar a que nosotros decidamos."
 cc.noble.enclave.1.b.tt: "No fundar ningún enclave por ahora. El privilegio permanece; es posible que se le vuelva a ofrecer la elección."

 cc.burgher.charter.1.title: "La carta real sellada"
 cc.burgher.charter.1.desc: "Los estamentos mercantiles han recibido la carta real con celebraciones y ceremonias. Ya se están enviando agentes a continentes lejanos, las inversiones fluyen y los primeros informes de puestos comerciales remotos empiezan a llegar a la corte. Los burgueses consideran que esta es una nueva era de asociación comercial con la corona."
 cc.burgher.charter.1.a: "Un acuerdo rentable para todas las partes."
 cc.burgher.charter.1.a.tt: "Habilita la creación de súbditos de Compañías Privilegiadas en subcontinentes distantes."

 # ============================================================
 # MILITARY ACADEMY — Subject type, advance, privilege
 # ============================================================
 military_academy: "Academia militar"
 LEAD_military_academy: "Patrón"
 AM_military_academy: "Academia militar"
 CANCEL_military_academyTITLE: "Disolver la academia militar"
 CANCEL_military_academy_DESC: "Retirar la carta de la academia, dispersando el cuerpo de oficiales y poniendo fin al acuerdo de formación formal. La tradición militar del reino sufrirá por la pérdida."

 military_academy_desc: "Una $military_academy$ es una institución noble dedicada a la formación formal de oficiales de la propia cultura del señor. No participa en guerras, pero proporciona un flujo constante de comandantes disciplinados, mejorando la efectividad militar general del reino. Limitado a una provincia, y solo puede existir una. Requiere el avance $military_academy_advance$ y el privilegio de estamento noble de Carta de Academia Militar."

 military_academy_advance: "Academia militar"
 military_academy_advance_desc: "El aprendizaje informal de caballeros y capitanes ha dado paso al estudio organizado de la estrategia, la logística y el arte de la guerra. Al establecer una academia formal dentro de un enclave noble, la corona transforma la energía militar de la alta nobleza en excelencia institucional. Desbloquea el tipo de súbdito $military_academy$ y el privilegio de estado noble Carta de la Academia Militar."

 ep_nobles_academy_charter: "Estatutos de la academia militar"
 ep_nobles_academy_charter_desc: "Los nobles asumen la responsabilidad formal de dotar y supervisar una academia militar dedicada, formando a oficiales de la propia cultura del reino en el arte de la guerra a cambio del reconocimiento de su herencia marcial."

 crown_dependency_conversion_tt: "No se puede convertir: o bien el socio de la unión ha sido convertido recientemente, o no cumple los requisitos de tamaño para esta era."

 # ============================================================
 # MILITARY ACADEMY EVENTS (cc.190–cc.193)
 # ============================================================
 cc.academy.0.title: "Se ha concedido el Estatuto de la Academia"
 cc.academy.0.desc: "Nuestros estamentos nobles han recibido la carta de la Academia Militar con gran entusiasmo. Los mejores vástagos de familias caballerescas ya se están reuniendo en la provincia designada, ansiosos por demostrar que la era de la guerra indisciplinada ha pasado. La instrucción formalizada en tácticas, logística y el arte del mando comienza de inmediato."
 cc.academy.0.a: "Un comienzo auspicioso."

 cc.academy.1.title: "Revisión del Cuerpo de Oficiales"
 cc.academy.1.desc: "La academia ha preparado a su última promoción para la inspección real. Los jóvenes oficiales permanecen en formación precisa —comandantes de caballería, capitanes de infantería, ingenieros de asedio— y su portavoz da un paso adelante con una petición. Han demostrado su disciplina; desean demostrar su valor al servicio de una causa tangible.\n\n'Concedenos una provincia que defender, mi señor, y la convertiremos en una fortaleza.'"
 cc.academy.1.a: "Prometer recompensas territoriales a los oficiales más distinguidos."
 cc.academy.1.b: "Honra la revisión, pero no asumas compromisos."

 cc.academy.2.title: "Ejercicios militares"
 cc.academy.2.desc: "El comandante de la academia solicita permiso para realizar maniobras a gran escala: formaciones de infantería entrenando entre sí en terrenos simulados, caballería practicando cargas coordinadas e ingenieros de artillería calculando trayectorias. El coste de municiones, forraje y fortificaciones de campaña no es trivial.\n\nEl beneficio para la cohesión y la moral de nuestro ejército podría ser considerable."
 cc.academy.2.a: "Financia los ejercicios en su totalidad."
 cc.academy.2.b: "Observar los ejercicios sin patrocinarlos."

 cc.academy.3.title: "Susurros en la Corte"
 cc.academy.3.desc: "Rumores inquietantes han llegado a nuestros oídos: se dice que ciertos oficiales nobles de la academia se reúnen en privado, con conversaciones cautelosas y miradas calculadoras. Algunos dicen que discuten las listas de ascensos; otros sospechan ambiciones mayores.\n\nUna indagación confidencial podría aclarar los asuntos —o exponernos a acusaciones de desconfianza hacia la misma clase que hemos estado cultivando."
 cc.academy.3.a: "Investiga discretamente los rumores."
 cc.academy.3.b: "Desestimar los rumores. La confianza no se otorga sin riesgo."

 # ============================================================
 # ELITE ENCLAVE EVENTS (cc.160, cc.162, cc.163, cc.164, cc.194)
 # ============================================================
 cc.enclave.court.title: "Los nobles compiten por cargos en la corte"
 cc.enclave.court.desc: "El enclave se ha convertido en un centro de vida social noble y, con ello, ha llegado una feroz competencia por los limitados puestos que nuestra corte puede ofrecer: oficiales de casa, chambelanes, maestros de ceremonias. La alta nobleza clama por nombramientos, comprendiendo bien que un puesto en la corte vincula a una familia noble a la corona mucho más que cualquier juramento por sí solo.\n\nPodemos aprovechar este apetito."
 cc.enclave.court.a: "Conceder cargos cortesanos a las principales familias nobles."
 cc.enclave.court.c: "Asígnalos a una gran concentración de caballería; que entrenen a los caballos del reino."
 cc.enclave.court.b: "Mantener los cargos bajo nombramiento real directo; evitar que la nobleza capture nuestra corte."

 cc.enclave.patronage.title: "El Mecenazgo Cultural del Señor del Enclave"
 cc.enclave.patronage.desc: "Los maestros del enclave se han embarcado en una obra ambiciosa —un gran salón, un ciclo de frescos, una biblioteca capaz de rivalizar con cualquier otra del reino— y han acudido a nosotros en busca de patrocinio. La nobleza del enclave se enorgullece de su cultura tanto como de su linaje, y un gesto generoso aquí será recordado durante mucho tiempo.\n\nO simplemente podríamos atraer el mejor de sus talentos hacia nuestra propia capital."
 cc.enclave.patronage.a: "Financiar la obra. Que la gloria del enclave redondee a la corona."
 cc.enclave.patronage.b: "Convoca a sus mejores elementos a nuestra capital en su lugar. Sus dones pertenecen al centro."

 cc.enclave.tournament.title: "El Gran Torneo"
 cc.enclave.tournament.desc: "El enclave propone organizar un gran torneo: una reunión de la nobleza ecuestre del reino para poner a prueba la lanza y el sable, honrar a la corona y resolver en combate amistoso la eterna cuestión de quién, entre las grandes casas, despliega a los mejores caballeros. Tal espectáculo pule la caballería que es el orgullo de nuestra nobleza, y de él puede surgir un verdadero campeón para liderar nuestros ejércitos.\n\nEl coste de los premios y los pabellones no sería pequeño."
 cc.enclave.tournament.a: "Organízalo con esplendor. Que nuestros caballeros demuestren su valía y nos encuentren un campeón."
 cc.enclave.tournament.b: "Rechazar. No tenemos monedas para gastar en pompas nobiliarias."

 cc.enclave.feud.title: "Una disputa noble"
 cc.enclave.feud.desc: "Dos de las casas principales del enclave han caído en una amarga disputa. Lo que comenzó como un conflicto sobre precedencia y matrimonio se ha agriado hasta convertirse en enemistad abierta, con sirvientes peleando en las calles y cada bando apelando a nosotros para que tomemos partido. Si se deja que se prolongue, tal disputa puede envenenar la lealtad de toda la nobleza; manejada con destreza, es una oportunidad para actuar como árbitro y vincular a ambas casas a nuestro juicio.\n\nPodríamos intervenir —o dejar que se agoten mutuamente."
 cc.enclave.feud.a: "Medie la disputa. Gaste lo que sea necesario para lograr una paz duradera."
 cc.enclave.feud.b: "Que lo resuelvan entre ellos. El honor encontrará su propio nivel."

 cc.enclave.established.title: "El Enclave Establecido"
 cc.enclave.established.desc: "Por primera vez, un dominio de cultura compartida y herencia antigua se gobierna a sí mismo como un enclave reconocido bajo nuestra protección: su consejo está establecido, sus tradiciones aseguradas y su lealtad prometida. La alta nobleza observa con silenciosa satisfacción y el reino gana una joya de cultivo y prestigio.\n\n¿Cómo marcaremos la ocasión?"
 cc.enclave.established.a: "Una gran investidura; que no se escatime en gastos para honrar al nuevo enclave."
 cc.enclave.established.b: "Un reconocimiento discreto: la dignidad no requiere extravagancias."

 # ============================================================
 # HOLY PROTECTORATE EVENTS (cc.195–cc.196)
 # ============================================================
 cc.holy_prot.1.title: "La Fe Bajo Amenaza"
 cc.holy_prot.1.desc: "Nuestro protectorado sagrado [ward.getName] se enfrenta al peligro. Potencias vecinas —hostiles a la fe compartida que nos une— han estado presionando sus fronteras, acosando a su clero y fomentando la herejía entre su población. Nuestros hermanos escriben en términos urgentes, invocando nuestra promesa de protección.\n\nActuar es costoso. Fallarles es ser visto como un protector desleal."
 cc.holy_prot.1.a: "Enviar fuerzas y recursos para defender a nuestros correligionarios."
 cc.holy_prot.1.b: "Ofrecer oraciones y censura diplomática, pero ningún compromiso material."
 cc.holy_prot.1.c: "El tiempo de la defensa ha pasado. Inicia una guerra santa contra [threat.GetName]."

 cc.holy_prot.frontier.title: "Voces a través de la Frontera"
 cc.holy_prot.frontier.desc: "Las fronteras de nuestro protectorado sagrado [ward.GetName] vibran con el movimiento de la fe. Los vecinos coreligionistas nos miran con cautelosa esperanza, mientras que los señores de credos diferentes observan desde el otro lado de la frontera con una recelosa actitud que podría endurecerse en hostilidad o suavizarse en acomodo.\n\nLa forma en que gestionemos estas relaciones fronterizas definirá el clima espiritual de toda la región."
 cc.holy_prot.frontier.a: "Enviar enviados a nuestros vecinos correligionarios. Que sepan que no están solos en su fe."
 cc.holy_prot.frontier.b: "Abrir la frontera al discurso religioso. El entendimiento puede construir lo que la fe por sí sola no puede."
 cc.holy_prot.frontier.c: "Fortificar la frontera de los fieles. Los vecinos paganos deben saber dónde estamos."
 cc.holy_prot.frontier.d: "Estos son asuntos fronterizos del propio pupilo. Dejen que ellos gestionen a sus vecinos."

 # ============================================================
 # HOLY PROTECTORATE PERIODIC EVENTS (cc.229–cc.231)
 # ============================================================
 cc.holy_prot.papacy.title: "La Santa Sede Toma Nota"
 cc.holy_prot.papacy.desc: "La noticia ha llegado a Roma. Los representantes del Papa han comunicado que él está al tanto de nuestro protectorado sagrado sobre [ward.GetName], un acuerdo que habla bien de nuestra piedad y nuestro compromiso con la fe. La Santa Sede no es indiferente en su atención, y podemos moldear el resultado de ello.\n\nEste es un momento de diplomacia pastoral. Lo que hagamos con él definirá nuestra relación con la autoridad máxima de la iglesia."
 cc.holy_prot.papacy.a: "Invocar la protección papal para nuestro pupilo. Que la Santa Sede los acoja formalmente."
 cc.holy_prot.papacy.b: "Solicitar que se envíe un legado papal: un clérigo erudito de Roma para servir en nuestras tierras."
 cc.holy_prot.papacy.c: "Acepta el reconocimiento con gratitud. La atención del Papa es, en sí misma, una bendición."

 cc.holy_prot.shepherd.title: "Un pastor para el rebaño"
 cc.holy_prot.shepherd.desc: "Nuestro protectorado sagrado [ward.GetName] necesita guía espiritual o marcial. Ya sea que la cuestión sea de fe, que requiere manos firmes para cuidarla, o de defensa fronteriza, que requiere un liderazgo experimentado, la necesidad es real.\n\nEstamos bien posicionados para ayudar — o para beneficiarnos. La elección de qué hacer requiere claridad sobre lo que más valoramos."
 cc.holy_prot.shepherd.a: "Enviar a nuestro consejero erudito para guiar al clero del pupilo. La fe merece el sacrificio."
 cc.holy_prot.shepherd.b: "Reasignar al comandante del distrito para que sirva en nuestras campañas. Sus talentos se desperdician allí."
 cc.holy_prot.shepherd.c: "Financia la formación de un nuevo teólogo para la tutela. Nuestro tesoro puede soportarlo."
 cc.holy_prot.shepherd.d: "La vida espiritual del pupilo es asunto suyo. No intervendremos."

 cc.holy_prot.preacher.title: "El predicador errante"
 cc.holy_prot.preacher.desc: "Un predicador carismático ha aparecido en los territorios de nuestro protectorado sagrado [ward.GetName], atrayendo a multitudes enormes con sermones de un fervor inusual. Hablan de renovación, de la expansión de la fe, de un llamado divino a la acción al que la piedad ordinaria se ha vuelto demasiado cómoda para responder.\n\nSus palabras conmueven a la población. Que ese fuego arda para bien o para mal depende en gran medida de la guía que ofrezcamos."
 cc.holy_prot.preacher.a: "Respaldar al predicador y enviarlo en misión al exterior. Que su celo llegue más allá de las fronteras del distrito."
 cc.holy_prot.preacher.b: "Canalizar los seguidores del predicador hacia nuestra propia misión fronteriza. Su energía nos será de gran utilidad."
 cc.holy_prot.preacher.c: "Que lleven al predicador ante las autoridades eclesiásticas para ser juzgado. La ortodoxia debe ser custodiada."
 cc.holy_prot.preacher.d: "Ignora el asunto. El fervor popular sube y baja sin nuestra intervención."

 # ============================================================
 # ARTISTS' COMMUNE EVENTS (cc.197–cc.199)
 # ============================================================
 cc.artists.1.title: "El encargo del maestro"
 cc.artists.1.desc: "Un renombrado artista de la comuna ha propuesto un encargo de extraordinaria ambición: un ciclo de obras que definirá el legado cultural de nuestra dinastía durante generaciones. Solo los materiales costarían una fortuna, y el proyecto ocuparía a los mejores talentos de la comuna durante años.\n\n'Valdrá la pena', promete, con la serena confianza de quienes gastan el dinero de otros."
 cc.artists.1.a: "Financia la comisión. Deja que creen algo inmortal."
 cc.artists.1.b: "Rechazar. La comuna puede encontrar mecenas dentro de sus propios muros."

 cc.artists.2.title: "Rivalidad Artística"
 cc.artists.2.desc: "Dos escuelas rivales de pensamiento artístico han surgido dentro de la comuna, cada una afirmando representar la verdadera dirección de nuestro mecenazgo. Los clasicistas favorecen la elegancia estudiada; los naturalistas exigen una representación cruda de la vida tal como es. Cada escuela produce obras maestras. Cada escuela desprecia a la otra.\n\nHan traído la disputa ante nosotros."
 cc.artists.2.a: "Elige una escuela favorecida. La otra deberá adaptarse o marcharse."
 cc.artists.2.b: "Dejar que la competencia continúe. De una gran rivalidad surge un gran trabajo."

 cc.artists.3.title: "Exportación cultural"
 cc.artists.3.desc: "La noticia de nuestra Comuna de Artistas se ha extendido más allá de nuestras fronteras. Una corte extranjera ha expresado admiración por sus obras y ha preguntado si podrían adquirirse ejemplos o exhibirse en el extranjero.\n\nLa comuna está dividida: algunos ven en esto una oportunidad para que el prestigio del reino viaje más lejos de lo que nuestros ejércitos podrían llevarlo. Otros temen que lo que salga de nuestras fronteras enriquezca a nuestros rivales tanto como a nosotros mismos."
 cc.artists.3.a: "Alentar la exportación. Nuestra cultura debe difundirse libremente."
 cc.artists.3.b: "Mantener las mejores obras en casa. El prestigio cultural es un recurso que debe atesorarse."

 # ============================================================
 # PALATINATE EVENTS (cc.161, cc.165, cc.210, cc.211, cc.213, cc.214, cc.215)
 # ============================================================
 cc.palatinate.recognition.title: "El Palatinado exige reconocimiento"
 cc.palatinate.recognition.desc: "El conde palatino ha enviado una delegación formal. El mensaje es cortés pero inequívoco: habiendo servido como el socio cultural más prestigioso de nuestro reino durante años, el palatinado espera un reconocimiento formal de su posición dinástica; el reconocimiento de que el linaje del conde no es meramente una casa subordinada, sino una que comparte la dignidad de nuestra dinastía.\n\nConceder esto es vincularlos más estrechamente. Rechazarlo es recordarles el abismo que nos separa."
 cc.palatinate.recognition.a: "Conceder reconocimiento dinástico formal. Que se reconozca su dignidad."
 cc.palatinate.recognition.b: "Rechazar. El reconocimiento implica obligaciones que no estamos preparados para asumir."
 cc.palatinate.recognition.c: "¿No podemos encontrar un punto medio?"

 cc.palatinate.dynastic.title: "Una cuestión de dinastía"
 cc.palatinate.dynastic.desc: "El conde palatino solicita un vínculo aún más profundo: un matrimonio con nuestra casa, un cuartelado de armas, un lugar para su linaje en los límites de la sucesión. Concederlo es integrar permanentemente al palatinado en la dignidad de nuestra dinastía, un vínculo de prestigio y legitimidad que sobrevivirá a cualquier reinado individual. Rechazarlo es herir a una casa orgullosa y poderosa.\n\nEl conde espera nuestra palabra, y no espera pacientemente."
 cc.palatinate.dynastic.a: "Conceder el vínculo dinástico. Que su sangre se mezcle con el honor de nuestra casa."
 cc.palatinate.dynastic.b: "Rechazar. La dignidad de nuestra dinastía no es un privilegio que se pueda compartir."

 cc.palatinate.tournament.title: "El torneo del Palatinado"
 cc.palatinate.tournament.desc: "El conde palatino ha anunciado un gran torneo: caballeros de todo el reino y de más allá invitados a competir en nuestro nombre, los mejores artesanos comisionados para decorar los pabellones y banquetes de los que se hablará durante una generación. El conde presenta a sus propios caballeros domésticos y, de tal campo, podría surgir un comandante sin igual. Solicita nuestra asistencia personal y una contribución al fondo de premios.\n\nTal espectáculo genera un prestigio que perdura más que cualquier batalla individual."
 cc.palatinate.tournament.a: "Asistir y patrocinar el torneo generosamente."
 cc.palatinate.tournament.b: "Enviar una delegación para representar a la corona."

 cc.palatinate.levy.title: "El Palatinado responde a la llamada"
 cc.palatinate.levy.desc: "El conde palatino se ofrece a levantar sus estandartes: la leva noble completa del palatinate, escuadrones de caballería pesada liderados por hombres que han conocido la silla desde la infancia. Es una formidable muestra de lealtad, y la caballería que puede desplegar reforzaría cualquier ejército nuestro. Sin embargo, recurrir a sus vasallos es reconocer hasta dónde llega ya su autonomía, y el conde esperará que se recuerde su servicio.\n\nO podríamos dejar que sus caballeros se queden en casa y mantener la correa corta."
 cc.palatinate.levy.a: "Movilizar la caballería noble. Que los caballos del reino cabalguen a la guerra."
 cc.palatinate.levy.b: "Perdona a sus vasallos. Respetamos la autonomía del conde y nos ganamos su buena voluntad."

 cc.palatinate.overreach.title: "El Conde Palatino se Excede"
 cc.palatinate.overreach.desc: "Nos informan que el conde palatino se ha estado haciendo llamar príncipe en todo menos en el nombre: acuñando su propia moneda, manteniendo una corte que imita la nuestra y recibiendo enviados extranjeros como si fuera un soberano. Es el peligro perenne del palatinado: un honor tan grande que engendra ambición. Algunos en la corte nos instan a consentirlo, ya que su prestigio se refleja en la corona; otros exigen que se le recuerde, tajantemente, cuál es su lugar.\n\nSi se dejan sin control, tales pretensiones suelen terminar en una disputa abierta."
 cc.palatinate.overreach.a: "Complazca sus pretensiones. Su grandeza es nuestra grandeza."
 cc.palatinate.overreach.b: "Refrenarlo. Recordará quién es el amo aquí."
 cc.palatinate.overreach.c: "Mira hacia otro lado. Deja que el asunto siga su curso."

 cc.palatinate.neighbor.title: "El Palatinado provoca a un vecino"
 cc.palatinate.neighbor.desc: "El conde palatino ha traspasado la frontera con [provoked_neighbor.GetName], saqueando sus marcas, dando refugio a sus forajidos y pregonando una antigua reclamación familiar sobre tierras al otro lado de la frontera. Sus enviados llegan furiosos, exigiendo que reprimamos a nuestro vasallo. Pero el conde no se arrepiente: insiste en que el honor del reino está en juego y que, con nuestro respaldo, podría humillarlos por completo.\n\nUn palatinado excesivamente poderoso tiene la costumbre de convertir sus disputas en las nuestras."
 cc.palatinate.neighbor.a: "Respaldar al conde. Que su disputa con [provoked_neighbor.GetName] se convierta en nuestra guerra."
 cc.palatinate.neighbor.b: "Contenerlo. No nos dejaremos arrastrar por una disputa fronteriza."
 cc.palatinate.neighbor.c: "Cómpralo. Redirige sus energías antes de que nos cuesten una guerra."

 cc.palatinate.elevated.title: "El Palatinado elevado"
 cc.palatinate.elevated.desc: "Por primera vez, un enclave de nuestro reino ha sido elevado a palatinado: se ha concedido a su conde una autoridad casi regia, el derecho a reclutar tropas, a mantener su propia corte y a marchar a la guerra bajo su propio estandarte. Es el honor más alto que puede ostentar un dominio noble, y su prestigio brilla sobre toda la dinastía. El conde se arrodilla para recibir su ascenso; nosotros decidiremos cuán grandiosamente lo celebraremos.\n\nUna ceremonia magnífica anunciaría al mundo entero la dignidad de nuestra casa."
 cc.palatinate.elevated.a: "Una elevación magnífica; y que el conde despliegue a sus mejores caballeros en nuestro honor."
 cc.palatinate.elevated.b: "Una ceremonia digna y modesta. El honor habla por sí solo."

 # ============================================================
 # PROTECTORATE MARCH UPGRADE EVENT (cc.212)
 # ============================================================
 cc.protectorate.march.1.title: "Un protectorado propone lealtad formal"
 cc.protectorate.march.1.desc: "El enviado del protectorado llega con una propuesta inesperada. A lo largo de años de intereses compartidos, la protección informal que hemos extendido ha crecido hasta convertirse en algo más profundo: una alineación genuina de intereses e identidad. Su liderazgo propone ahora transformar la relación por completo.\n\n'Concédanos el estatus de marca militar', dicen, 'y guardaremos su frontera con nuestras vidas'."
 cc.protectorate.march.1.a: "Aceptar. Formalizarlos como una Marca Militar."
 cc.protectorate.march.1.b: "Rechazar. El acuerdo actual nos sirve lo suficientemente bien."

 # ============================================================
 # NEW MODIFIER NAMES
 # ============================================================
 cc_academy_exercises: "Ejercicios Militares de la Academia"
 cc_academy_exercises_desc: "Una ronda de rigurosos ejercicios militares financiados por la corona ha agudizado la disciplina y la moral de nuestras fuerzas combatientes."

 cc_court_intrigue_scandal: "Escándalo de intrigas cortesanas"
 cc_court_intrigue_scandal_desc: "Una investigación sobre rumores en la academia salió mal; las acusaciones de improcedencia han dañado la reputación de la corona entre los estamentos nobles."

 cc_enclave_court_favour: "Favor Noble de la Corte"
 cc_enclave_court_favour_desc: "La concesión de cargos cortesanos a las familias líderes del enclave noble ha satisfecho sus ambiciones, acercándolas al mismo tiempo a la órbita de la corona."

 cc_palatinate_tournament: "Torneo del Palatinado"
 cc_palatinate_tournament_desc: "Un magnífico torneo celebrado bajo el patrocinio del conde palatino y la corona ha impulsado el prestigio dinástico y la influencia cultural en todo el reino."

 STATIC_MODIFIER_NAME_cc_holy_protectorate_defense: "Defensa Sagrada"
 cc_holy_protectorate_defense: "Defensa Sagrada"
 cc_holy_protectorate_defense_desc: "La defensa de nuestras fuerzas del protectorado sagrado contra la presión religiosa ha revitalizado la moral de nuestros soldados y asegurado la gratitud de nuestros correligionarios."
 STATIC_MODIFIER_NAME_cc_holy_prot_spiritual_neglect: "Protector sin fe"
 cc_holy_prot_spiritual_neglect: "Protector sin fe"
 cc_holy_prot_spiritual_neglect_desc: "Se ha extendido la noticia de que solo ofrecimos oraciones cuando nuestro protectorado sagrado solicitó ayuda material. Los fieles cuestionan nuestro compromiso y nuestra autoridad espiritual decae."
 STATIC_MODIFIER_NAME_cc_holy_prot_frontier_accord: "Acuerdo Fronterizo"
 cc_holy_prot_frontier_accord: "Acuerdo Fronterizo"
 cc_holy_prot_frontier_accord_desc: "Nuestra voluntad de dialogar más allá de las líneas religiosas en nombre de nuestro protectorado sagrado nos ha valido una reputación de estadistas moderados entre las potencias vecinas."
 STATIC_MODIFIER_NAME_cc_holy_prot_border_faith: "Frontera de los Fieles"
 cc_holy_prot_border_faith: "Frontera de los Fieles"
 cc_holy_prot_border_faith_desc: "La firme postura del señor supremo hacia los vecinos paganos ha reforzado las guarniciones fronterizas del protectorado y ha revitalizado la fe de sus soldados."
 STATIC_MODIFIER_NAME_cc_holy_prot_papal_mandate: "Mandato papal"
 cc_holy_prot_papal_mandate: "Mandato papal"
 cc_holy_prot_papal_mandate_desc: "La Santa Sede ha reconocido formalmente la posición de este estado bajo la autoridad espiritual de su protector. La bendición del Papa ha fortalecido la resolución del protegido y ha abierto nuevas almas a la fe."
 STATIC_MODIFIER_NAME_cc_holy_prot_sponsored_scholar: "Erudito patrocinado"
 cc_holy_prot_sponsored_scholar: "Erudito patrocinado"
 cc_holy_prot_sponsored_scholar_desc: "Un teólogo erudito enviado o financiado por el señor ha establecido una escuela de instrucción religiosa dentro del protectorado, acelerando la conversión y aportando un nuevo vigor al clero."
 STATIC_MODIFIER_NAME_cc_holy_prot_zealous_mission: "Misión celosa"
 cc_holy_prot_zealous_mission: "Misión celosa"
 cc_holy_prot_zealous_mission_desc: "El predicador errante, respaldado por el señor supremo, ha partido en misión más allá de las fronteras del protectorado; sus sermones atraen nuevas almas a la fe y aportan renombre espiritual al territorio del protectorado."

