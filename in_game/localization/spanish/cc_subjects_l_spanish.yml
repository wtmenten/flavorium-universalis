 # ============================================================
 # PROTECTORATE / HOLY PROTECTORATE EVOLUTION EVENTS (cc.220–cc.226)
 # ============================================================

 # cc.220 — A Ward No Longer
 cc.ward_no_longer.title: "Ya no es un pupilo"
 cc.ward_no_longer.desc.holy: "[ward.GetName] ha permanecido durante mucho tiempo bajo el manto de nuestra protección sagrada: un protegido de la fe, guardado y guiado a través de décadas de propósito compartido. Pero el mundo ha cambiado, y también nuestro vínculo. Su enviado llega no con necesidad, sino con una confianza tranquila.\n\n'Estamos agradecidos por todo lo que nos habéis dado', dicen, 'pero estamos listos para estar a vuestro lado en lugar de debajo de vosotros'."
 cc.ward_no_longer.desc.prot: "[ward.GetName] ha dependido durante mucho tiempo de nuestra protección informal, un acuerdo cómodo que sirvió a ambas partes en tiempos más tranquilos. Pero los años han pasado y algo ha cambiado. Su enviado llega no como un suplicante, sino como un igual.\n\n'El acuerdo nos ha servido bien', dicen, 'pero quizás sea hora de reconocer en qué nos hemos convertido realmente'."
 cc.ward_no_longer.a: "Aceptamos la transición. Se lo han ganado."
 cc.ward_no_longer.a_cruel: "Absorbértelos por decreto. Ellos nos sirven a nosotros, y no al revés."
 cc.ward_no_longer.a_zealot: "Cumple la obligación sagrada. La carga santa ha sido liberada."
 cc.ward_no_longer.a_master: "Una transición magistral: nuestro ministro se asegura de que la ceremonia sea excepcional."
 cc.ward_no_longer.a_integration: "Un futuro integrado: nuestro ministro construye el marco para una asociación duradera."
 cc.ward_no_longer.b: "Aún no es el momento adecuado. Deja que la relación se profundice más."
 cc.ward_no_longer.c: "Rechazar. El acuerdo actual todavía nos es útil."
 cc.ward_no_longer.c_demand_release: "Aceptar la demanda. Liberarlos."
 cc.ward_no_longer.c_demand_refuse: "Rechazar rotundamente. No aceptaremos dictados."
 cc.ward_no_longer.d_honor: "Liberarlos con todos los honores. Que la historia lo recuerde bien."
 cc.ward_no_longer.d_embarrass: "Liberarlos. El acuerdo ha terminado."

 # cc.221 — An Emboldened Ward
 cc.emboldened_ward.title: "Un pupilo envalentonado"
 cc.emboldened_ward.desc: "Llegan noticias de que [ward.GetName] se ha extralimitado. Sus funcionarios han mantenido un intercambio hostil con [rival.GetName]: acusaciones, exigencias y provocaciones que han dejado a la corte vecina furiosa.\n\nEl asunto recae ahora en nuestras manos. [rival.GetName] no olvidará esto. La forma en que respondamos definirá nuestra reputación y la naturaleza de nuestra protección."
 cc.emboldened_ward.a: "Enviar enviados. Solucionaremos esto discretamente."
 cc.emboldened_ward.a_master: "Una mediación magistral: nuestro ministro convierte el incidente en una demostración de nuestra autoridad serena."
 cc.emboldened_ward.a_peace: "Una resolución tranquila: nuestro consejero encuentra puntos en común antes de que el asunto escale."
 cc.emboldened_ward.b: "Mantenerse firme. Respaldamos plenamente a nuestro protegido."
 cc.emboldened_ward.c: "Dar un paso atrás. Esta no es nuestra lucha."

 # cc.222 — The Rival Makes Their Move
 cc.rival_moves.title: "El rival hace su movimiento"
 cc.rival_moves.desc: "[rival.GetName] ha perdido la paciencia. En lugar de aceptar el desaire, han declarado la guerra a [ward.GetName]. Nuestro protegido está bajo ataque y el mundo está observando.\n\nLos hemos respaldado. Debemos decidir cuánto vale realmente ese respaldo."
 cc.rival_moves.b1: "Luchamos. Declarar la guerra a [rival.GetName] en defensa de nuestro protegido."
 cc.rival_moves.b1_force: "Muestra de fuerza. Nuestro ejército dará una lección ante esta agresión."
 cc.rival_moves.b1_sacred: "Deber sagrado. Nos unimos como defensores de la fe."
 cc.rival_moves.b2: "No podemos comprometernos con esta guerra. Abandonemos el protectorado."

 # cc.223 — Ward Abandoned to Their Fate
 cc.ward_abandoned.title: "Protegido abandonado a su suerte"
 cc.ward_abandoned.desc: "[rival.GetName] ha declarado la guerra a [ward.GetName]. Nosotros retrocedimos, y el mundo lo ha notado. Nuestro protectorado se enfrenta a esto solo.\n\nLa noticia se extenderá."
 cc.ward_abandoned.a: "Un día difícil. Esperemos que las consecuencias sean limitadas."

 # cc.224 — The Ward's Own Ambitions
 cc.ward_ambitions.title: "Las propias ambiciones del pupilo"
 cc.ward_ambitions.desc: "[ward.GetName] se ha convertido en una potencia significativa. Su dominio se ha expandido, su tesorería está llena y su pueblo ha desarrollado un orgullo que hace que el antiguo acuerdo informal ya no encaje del todo.\n\nSu enviado llega, no con peticiones, sino con exigencias. Quieren una relación definida. En sus propios términos."
 cc.ward_ambitions.a: "Concederles el estatus de estado cliente. Reconocer su crecimiento."
 cc.ward_ambitions.b: "Ofrecer el estatus de vasallo en su lugar. Tendrán una definición, pero bajo nuestros términos."
 cc.ward_ambitions.b_minister: "Un acuerdo sutil: nuestro ministro se asegura de que vean el vínculo más estrecho como una recompensa."
 cc.ward_ambitions.c: "Denegar la petición. Son nuestros pupilos, y con eso basta."
 cc.ward_ambitions.c_war: "Se les ha negado demasiadas veces. Ahora toman su libertad por la fuerza."

 # cc.225 — The Faith Grows Cold
 cc.faith_cold.title: "La Fe se Enfría"
 cc.faith_cold.desc: "Llega una carta de [ward.GetName]. El tono es formal, pero el mensaje es inequívoco: el vínculo espiritual entre nosotros se ha debilitado. Nuestra negligencia en los deberes religiosos no ha pasado desapercibida.\n\n'Acudimos a vosotros con fe', dice la carta. 'Pedimos ahora ser liberados, para encontrar nuestro propio camino'."
 cc.faith_cold.a: "Liberarlos. Su fe merece una mejor gestión de la que hemos brindado."
 cc.faith_cold.b: "Renovar nuestro compromiso. No dejaremos que el vínculo se marchite."
 cc.faith_cold.c: "Rechazar. El acuerdo continúa."
 cc.faith_cold.c_zealot: "El deber sagrado no puede abandonarse. Nos mantenemos firmes."
 cc.faith_cold.e: "Una resolución diplomática: nuestro ministro encuentra términos que satisfacen sin requerir sacrificios."
 cc.faith_cold.c_war: "Se les ha rechazado demasiadas veces. El vínculo se rompe entre llamas."

 # cc.226 — Patron of the Faith
 cc.patron_faith.title: "Patrón de la Fe"
 cc.patron_faith.desc: "La noticia se ha extendido por las cortes de la cristiandad y más allá: nuestra administración de [ward_a.GetName] y [ward_b.GetName] no ha pasado desapercibida. Mantener no uno sino dos protectorados sagrados, preservar la fe de los pueblos protegidos a través del tumulto de esta era, es algo que habla de propósito y poder.\n\nNos están llamando Patrón de la Fe."
 cc.patron_faith.a: "Acepta el título. Somos lo que ellos dicen que somos."
 cc.patron_faith.a_zealot: "Campeón de la Fe. Somos más que un patrón: somos su espada."
 cc.patron_faith.b: "Permanecer humilde. El trabajo importa más que el título."
 cc.patron_faith.c: "Use el reconocimiento con sabiduría. El prestigio es una moneda en sí misma."

