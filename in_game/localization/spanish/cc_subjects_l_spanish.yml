 STATIC_MODIFIER_NAME_cc_diplomatic_scramble: "Disputa diplomática"
 cc_diplomatic_scramble: "Disputa diplomática"
 cc_diplomatic_scramble_desc: "Un incidente diplomático embarazoso ha requerido maniobras apresuradas; nuestra reputación se ha visto afectada temporalmente mientras trabajábamos para contener las consecuencias."

 STATIC_MODIFIER_NAME_cc_righteous_intervention: "Intervención justa"
 cc_righteous_intervention: "Intervención justa"
 cc_righteous_intervention_desc: "Nuestras fuerzas intervinieron decisivamente para defender nuestro protectorado. El acto de protección ha galvanizado la disciplina y la moral en todo el ejército."

 STATIC_MODIFIER_NAME_cc_smooth_integration: "Integración fluida"
 cc_smooth_integration: "Integración fluida"
 cc_smooth_integration_desc: "Una transición excepcionalmente gestionada de protectorado a vasallo ha dejado al nuevo protegido con una sensación de asociación en lugar de restricción."

 STATIC_MODIFIER_NAME_cc_magnanimous_overlord: "Soberano Magnánimo"
 cc_magnanimous_overlord: "Soberano Magnánimo"
 cc_magnanimous_overlord_desc: "Nuestra voluntad de reconocer el crecimiento del pupilo y concederle una mayor independencia ha mejorado nuestra reputación como una potencia justa y vanguardista."

 STATIC_MODIFIER_NAME_cc_patron_of_faith: "Patrón de la Fe"
 cc_patron_of_faith: "Patrón de la Fe"
 cc_patron_of_faith_desc: "Reconocidos por los coreligionistas como protectores de los fieles, nuestra influencia espiritual y autoridad en asuntos de religión han crecido considerablemente."

 STATIC_MODIFIER_NAME_cc_faith_renewed: "Fe renovada"
 cc_faith_renewed: "Fe renovada"
 cc_faith_renewed_desc: "Un compromiso público con nuestro sagrado encargo ha revitalizado nuestra posición religiosa y ha dotado nuevamente de sentido al vínculo espiritual."

 STATIC_MODIFIER_NAME_cc_recognized_partner: "Socio Reconocido"
 cc_recognized_partner: "Socio Reconocido"
 cc_recognized_partner_desc: "Un acuerdo negociado por nuestro ministro ha dado a este vasallo una sensación de asociación genuina; su lealtad está anclada en la gratitud, no solo en la obligación."

 STATIC_MODIFIER_NAME_cc_forced_subjection: "Sujeción forzada"
 cc_forced_subjection: "Sujeción forzada"
 cc_forced_subjection_desc: "La transición al vasallaje fue impuesta en lugar de ofrecida. El resentimiento bulle bajo la superficie."

 STATIC_MODIFIER_NAME_cc_faithless_overlord_repute: "Soberano sin fe"
 cc_faithless_overlord_repute: "Soberano sin fe"
 cc_faithless_overlord_repute_desc: "Abandonamos a quienes dependían de nuestra protección. La reputación tiene consecuencias."

 STATIC_MODIFIER_NAME_cc_gracious_release: "Liberación Graciosa"
 cc_gracious_release: "Liberación Graciosa"
 cc_gracious_release_desc: "La liberación digna de un pupilo ha mejorado nuestra reputación como estadista en lugar de un tirano de la dependencia."

 STATIC_MODIFIER_NAME_cc_sacred_defense: "Defensa sagrada"
 cc_sacred_defense: "Defensa sagrada"
 cc_sacred_defense_desc: "Nuestra defensa de un protectorado sagrado por motivos de fe ha profundizado nuestra influencia religiosa y ha galvanizado a los fieles."

 STATIC_MODIFIER_NAME_cc_champion_of_faith: "Campeón de la Fe"
 cc_champion_of_faith: "Campeón de la Fe"
 cc_champion_of_faith_desc: "Al aceptar el título de Campeón de la Fe en todo su sentido, nos hemos comprometido a defender a los correligionarios tanto con nuestras armas como con nuestras oraciones."

 STATIC_MODIFIER_NAME_cc_zealous_refusal: "Rechazo celoso"
 cc_zealous_refusal: "Rechazo celoso"
 cc_zealous_refusal_desc: "Nuestra negativa pública a liberar a nuestro protectorado sagrado basándonos en la obligación sagrada ha galvanizado nuestra posición religiosa, aunque haya tensado la relación."

 STATIC_MODIFIER_NAME_cc_papal_patron: "Patrón de la Fe (Papal)"
 cc_papal_patron: "Patrón de la Fe (Papal)"
 cc_papal_patron_desc: "El Santo Padre ha reconocido formalmente nuestra administración sobre los fieles. El respaldo de Roma tiene peso ante las potencias católicas de toda Europa."

 STATIC_MODIFIER_NAME_cc_faith_rift_tension: "Tensión por cisma religioso"
 cc_faith_rift_tension: "Tensión por cisma religioso"
 cc_faith_rift_tension_desc: "El pacto espiritual que una vez vinculó este acuerdo se ha deshilachado. El protegido se vuelve inquieto bajo la autoridad de un señor cuya fe ya no refleja la suya propia."

 # ============================================================
 # cc.220 — A Ward No Longer (Catholic flavor additions)
 # ============================================================
 cc.ward_no_longer.a.tt_papal: "El Papa notará con decepción la disolución de este acuerdo sagrado."

 # ============================================================
 # cc.225 — The Faith Grows Cold (new Catholic option)
 # ============================================================
 cc.faith_cold.d_papal: "Buscar la mediación papal"
 cc.faith_cold.d_papal.tt: "El Santo Padre envía un legado que renueva el vínculo espiritual entre nosotros y nuestro protegido. Gastamos algo de buena voluntad en Roma, pero el acuerdo se preserva."

 # ============================================================
 # cc.226 — Patron of the Faith (new Catholic option)
 # ============================================================
 cc.patron_faith.a_papal: "Aceptar el reconocimiento papal"
 cc.patron_faith.a_papal.tt: "El Santo Padre respalda formalmente nuestro papel como Patrón de la Fe. El reconocimiento tiene peso ante todas las potencias católicas. Nuestros protegidos encuentran consuelo en la bendición de Roma."

 # ============================================================
 # cc.227 — A Rift in the Sacred Bond
 # ============================================================
 cc.faith_rift.title: "Una brecha en el vínculo sagrado"
 cc.faith_rift.desc: "[ward.GetName] ya no comparte nuestra fe. El pacto sagrado que definía nuestro acuerdo de protectorado descansa sobre una base espiritual que se ha desmoronado. Ya sea que hayamos sido nosotros quienes nos alejamos de las viejas costumbres o ellos quienes buscaron un nuevo camino, la contradicción no puede ignorarse indefinidamente."

 cc.faith_rift.a: "Exigir que [ward.GetName] regrese a la verdadera fe"
 cc.faith_rift.a.tt: "Dejamos claro que el acuerdo requiere una fe compartida. El pupilo no se tomará esto a la ligera."
 cc.faith_rift.a_zealot: "Las exigencias de la fe no permiten compromisos"
 cc.faith_rift.a_zealot.tt: "Un fanático no tolera ninguna desviación espiritual. Emitimos el ultimátum con todo el peso de nuestra convicción."
 cc.faith_rift.b: "Liberar a [ward.GetName]: el pacto sagrado ha cumplido su ciclo"
 cc.faith_rift.b.tt: "Es mejor reconocer la verdad con claridad que perpetuar un acuerdo vacío."
 cc.faith_rift.c: "Mantener el acuerdo a pesar de la brecha"
 cc.faith_rift.c.tt: "Por ahora, la utilidad política pesa más que la pureza espiritual. El pupilo no olvidará esta contradicción."
 cc.faith_rift.c_master: "Negociar una excepción formal"
 cc.faith_rift.c_master.tt: "Nuestro ministro encuentra un acuerdo que permite salvar las apariencias. El protectorado acepta, por ahora, aunque la tensión persiste."
 cc.faith_rift.d_papal: "Presentar el asunto ante el Santo Padre"
 cc.faith_rift.d_papal.tt: "Consultamos a Roma en lugar de actuar unilateralmente. El Papa está complacido de intervenir y ejerce presión espiritual sobre el protegido para que se reconvierta."

 # ============================================================
 # cc.228 — The Ward Seeks Their Own Path
 # ============================================================
 cc.faith_rift_escalate.title: "El pupilo busca su propio camino"
 cc.faith_rift_escalate.desc: "[ward.GetName] ha estado incómodo durante mucho tiempo bajo el ultimátum de reconversión. Con la lealtad en su punto más bajo, ahora exigen abiertamente la independencia, citando el pacto espiritual roto como motivo para disolver el acuerdo. El pretexto de un pacto sagrado ya no puede mantenerse."

 cc.faith_rift_escalate.a: "Conceder la independencia a [ward.GetName]"
 cc.faith_rift_escalate.a.tt: "Acepta lo inevitable. Libéralos antes de que lo tomen por la fuerza."
 cc.faith_rift_escalate.b: "No cederemos lo que es nuestro"
 cc.faith_rift_escalate.b.tt: "Rechazar rotundamente. El protectorado declara su independencia y entra en guerra. Si son católicos y nosotros no, es muy probable que Roma tome partido por ellos."

 # ============================================================
 # New bias localization
 # ============================================================
 cc_papal_patron_recognition: "Respaldo papal"
 cc_papal_patron_recognition_desc: "El Santo Padre ha reconocido formalmente a este gobernante como Patrón de la Fe, un reconocimiento prestigioso que tiene peso en las cortes católicas."

 cc_papal_mediation_called: "Favor papal gastado"
 cc_papal_mediation_called_desc: "Pedimos a Roma que mediara en una crisis con nuestro protegido sagrado. El Papa está encantado de ayudar, pero tal buena voluntad no es infinita."

 # ============================================================
 # CROSS-REALM SUBJECT INTERACTIONS (cc.236 college, cc.240 commune)
 # ============================================================
 cc.college.exchange.title: "Una correspondencia de eruditos"
 cc.college.exchange.desc: "Nos llega la noticia de que los maestros de nuestro Colegio Científico han entablado correspondencia con sus homólogos en [cc_rival_overlord.GetName], un colegio extranjero de renombre comparable. Cartas, tratados y rumores de descubrimientos disputados pasan de un lado a otro de la frontera.\n\nTal contacto entre casas eruditas puede madurar en un intercambio fructífero que honre a ambas coronas, o agriarse en una rivalidad celosa, con maestros seducidos y reputaciones cuestionadas. ¿Cómo guiaremos a nuestros eruditos?"
 cc.college.exchange.a: "Fomentar el intercambio: patrocinar una disputa conjunta."
 cc.college.exchange.b: "Presionarlos para eclipsar a [cc_rival_overlord.GetName] y atraer a sus maestros."
 cc.college.exchange.c: "Mantenerse al margen: que los eruditos se correspondan a su antojo."

 cc.commune.exchange.title: "Una confluencia de artistas"
 cc.commune.exchange.desc: "Nuestra Comuna de Artistas ha caído en la órbita de una comuna afín en [cc_rival_overlord.GetName], cuyos pintores y escultores son mencionados con igual admiración. Los aprendices viajan entre ambas; los mecenas de ambos bandos observan la comparación con atención.\n\nUna exposición conjunta podría coronar a ambas escuelas con gloria, o podríamos enfrentar a nuestros maestros contra los suyos, atrayendo a sus mejores talentos al precio de una amarga enemistad. ¿Cuál es nuestro deseo?"
 cc.commune.exchange.a: "Organiza una exposición conjunta que celebre ambas escuelas."
 cc.commune.exchange.b: "Enfrentemos a nuestros maestros contra los suyos: atraigamos su talento."
 cc.commune.exchange.c: "Mantenerse al margen: que los artistas sigan su propio camino."

 cc.annex.resist.title: "Resistencia a la Integración"
 cc.annex.resist.desc: "Nuestro movimiento para absorber este reino por completo ha encontrado una resistencia silenciosa pero obstinada. Sus consejos dilatan, sus notables se vuelven distantes y los vínculos de lealtad que exige la integración se niegan a arraigar. Podemos ceder y dejar que mantengan su estatus distintivo, o presionar el asunto —a un precio— para forzar la unión."
 cc.annex.resist.a: "Respetar su autonomía: dejar la integración en pausa por ahora."
 cc.annex.resist.b: "Compra a los resistentes: gasta oro para forzar la integración."
 cc.annex.resist.c: "Apoyarse en el peso dinástico: gastar prestigio para forzar la integración."

 tax_farm_cooldown_tt: "Ninguna arrendación de impuestos ha sido liquidada aquí en los últimos 15 años"
 march_cooldown_tt: "Ninguna marcha ha sido disuelta aquí en los últimos 20 años"
 lesser_partner_maturation_tt: "La asociación se ha estabilizado (50 años desde que se creó)"
