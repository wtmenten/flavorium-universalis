 MODIFIER_TYPE_NAME_cc_pty_party_royalist: "Miembro de los Realistas"
 MODIFIER_TYPE_DESC_cc_pty_party_royalist: "Este personaje pertenece a los Realistas, que defienden la autoridad de la corona, o del estado donde no hay corona."
 MODIFIER_TYPE_NAME_cc_pty_party_aristocratic: "Miembro de los Magnates"
 MODIFIER_TYPE_DESC_cc_pty_party_aristocratic: "Este personaje pertenece a los Magnates, que representan a la nobleza."
 MODIFIER_TYPE_NAME_cc_pty_party_mercantile: "Miembro de los Mercaderes"
 MODIFIER_TYPE_DESC_cc_pty_party_mercantile: "Este personaje pertenece a los Mercaderes, que representan a los burgueses y a las casas comerciales."
 MODIFIER_TYPE_NAME_cc_pty_party_clerical: "Miembro de los Clericales"
 MODIFIER_TYPE_DESC_cc_pty_party_clerical: "Este personaje pertenece a los Clericales, que representan al clero."
 MODIFIER_TYPE_NAME_cc_pty_party_military: "Miembro de los Halcones"
 MODIFIER_TYPE_DESC_cc_pty_party_military: "Este personaje pertenece a los Halcones, que representan a los oficiales y al ejército."
 MODIFIER_TYPE_NAME_cc_pty_party_agrarian: "Miembro de los Agrarios"
 MODIFIER_TYPE_DESC_cc_pty_party_agrarian: "Este personaje pertenece a los Agrarios, que representan al campesinado y al campo."
 MODIFIER_TYPE_NAME_cc_pty_party_reformist: "Miembro de los Reformistas"
 MODIFIER_TYPE_DESC_cc_pty_party_reformist: "Este personaje pertenece a los Reformistas, que desean un estado más moderno y mejor gestionado."
 MODIFIER_TYPE_NAME_cc_pty_party_absolutist: "Miembro de los Absolutistas"
 MODIFIER_TYPE_DESC_cc_pty_party_absolutist: "Este personaje pertenece a los Absolutistas, que quieren que todo el poder se concentre en la corona."
 MODIFIER_TYPE_NAME_cc_pty_party_regionalist: "Miembro de los Particularistas"
 MODIFIER_TYPE_DESC_cc_pty_party_regionalist: "Este personaje pertenece a los Particularistas, que defienden las provincias y las tierras vasallas frente a la capital."
 MODIFIER_TYPE_NAME_cc_pty_party_colonial: "Miembro de los Colonialistas"
 MODIFIER_TYPE_DESC_cc_pty_party_colonial: "Este personaje pertenece a los Colonialistas, que representan a las colonias y a las compañías que comercian con ellas."
 MODIFIER_TYPE_NAME_cc_pty_party_liberal: "Miembro de los Liberales"
 MODIFIER_TYPE_DESC_cc_pty_party_liberal: "Este personaje pertenece a los Liberales, que quieren un gobierno constitucional y los derechos del ciudadano."
 cc_pty_concern_royalist_1: "El poder de la corona"
 cc_pty_concern_royalist_1_desc: "Que la corona posea el 35% del poder del reino es neutral. Cada punto más otorga +1, hasta +15; cada punto menos resta 1, hasta -15."
 cc_pty_concern_royalist_2: "Estabilidad"
 cc_pty_concern_royalist_2_desc: "La estabilidad 0 es neutral. Cada 10 de estabilidad en cualquier dirección aporta 1.5, hasta +15 o hasta -15."
 cc_pty_concern_royalist_3: "Gastos de la corte"
 cc_pty_concern_royalist_3_desc: "Se establece en el presupuesto. El punto medio es neutral. Un mayor gasto en la corte aporta hasta +10; el otro extremo cuesta 10."
 cc_pty_concern_aristocratic_1: "La satisfacción de la nobleza"
 cc_pty_concern_aristocratic_1_desc: "La satisfacción al 50% es neutral. De -20 al 0% a +20 al 100%. Auméntala con privilegios, impuestos más bajos y puestos en el gabinete para la nobleza."
 cc_pty_concern_aristocratic_2: "Privilegios de la nobleza"
 cc_pty_concern_aristocratic_2_desc: "2 privilegios son neutrales. Cada uno más vale +4, hasta +12; cada uno menos cuesta 4, hasta -10."
 cc_pty_concern_aristocratic_3: "Impuestos a la nobleza"
 cc_pty_concern_aristocratic_3_desc: "Una tasa impositiva del 30% es neutral. Impuestos más bajos para la nobleza agradan al partido, hasta +10; subirlos al 55% o más cuesta 10."
 cc_pty_concern_mercantile_1: "La satisfacción de los burgueses"
 cc_pty_concern_mercantile_1_desc: "La satisfacción al 50% es neutral. De -20 al 0% a +20 al 100%. Auméntala con privilegios, impuestos más bajos y puestos en el gabinete para los burgueses."
 cc_pty_concern_mercantile_2: "Impuestos a los burgueses"
 cc_pty_concern_mercantile_2_desc: "Una tasa impositiva del 30% es neutral. Impuestos más bajos para los burgueses agradan al partido, hasta +10; subirlos al 55% o más cuesta 10."
 cc_pty_concern_mercantile_3: "Paz y crédito"
 cc_pty_concern_mercantile_3_desc: "+5 en paz y sin préstamos. La guerra cuesta 8, cada préstamo 2 y una bancarrota en los últimos veinte años 10. Nunca por debajo de -15."
 cc_pty_concern_clerical_1: "La satisfacción del clero"
 cc_pty_concern_clerical_1_desc: "La satisfacción al 50% es neutral. De -20 al 0% a +20 al 100%. Auméntala con privilegios, impuestos más bajos y puestos en el gabinete para el clero."
 cc_pty_concern_clerical_2: "Unidad religiosa"
 cc_pty_concern_clerical_2_desc: "Que el 80% de la población comparta la religión estatal es neutral. La unidad total vale +10; cada 2 puntos por debajo del 80% cuestan 1, hasta -15."
 cc_pty_concern_clerical_3: "Privilegios del clero"
 cc_pty_concern_clerical_3_desc: "2 privilegios son neutrales. Cada uno más vale +4, hasta +12; cada uno menos cuesta 4, hasta -10."
 cc_pty_concern_military_1: "Historial de guerra"
 cc_pty_concern_military_1_desc: "+10 mientras esté en guerra, +10 por una guerra ganada en los últimos diez años, -15 por una guerra perdida en los últimos diez años y -10 después de diez años sin una guerra. De -20 a +20."
 cc_pty_concern_military_2: "Mantenimiento del ejército"
 cc_pty_concern_military_2_desc: "Se establece en el presupuesto. El punto medio es neutral. Un mantenimiento del ejército más alto aporta hasta +15; el otro extremo cuesta 15."
 cc_pty_concern_military_3: "Tamaño del ejército"
 cc_pty_concern_military_3_desc: "Un ejército al 75% de su tamaño esperado es neutral. Cada punto más vale 0.4, hasta +10; cada punto menos cuesta 0.4, hasta -15."
 cc_pty_concern_agrarian_1: "La satisfacción del campesinado"
 cc_pty_concern_agrarian_1_desc: "La satisfacción al 50% es neutral. De -20 al 0% a +20 al 100%. Auméntala con privilegios, impuestos más bajos y puestos en el gabinete para el campesinado."
 cc_pty_concern_agrarian_2: "Impuestos al campesinado"
 cc_pty_concern_agrarian_2_desc: "Una tasa impositiva del 30% es neutral. Impuestos más bajos para el campesinado agradan al partido, hasta +10; subirlos al 55% o más cuesta 10."
 cc_pty_concern_agrarian_3: "Agotamiento de guerra"
 cc_pty_concern_agrarian_3_desc: "+5 sin agotamiento de guerra. Cada punto de agotamiento de guerra cuesta 1.5, hasta un mínimo de -15."
 cc_pty_concern_reformist_1: "Sociedad innovadora"
 cc_pty_concern_reformist_1_desc: "La sociedad en el centro es neutral. Totalmente hacia lo Innovador aporta +20; totalmente en la otra dirección cuesta 20. El partido más fuerte desplaza la sociedad hacia su lado."
 cc_pty_concern_reformist_2: "Alfabetización"
 cc_pty_concern_reformist_2_desc: "Una alfabetización promedio del 20% es neutral. Cada punto más vale 0.3, hasta +15; cada punto menos cuesta 0.3, hasta -6."
 cc_pty_concern_reformist_3: "Ritmo de reforma"
 cc_pty_concern_reformist_3_desc: "+8 si se cambió una ley en los últimos cinco años; -4 si no se cambió ninguna."
 cc_pty_concern_absolutist_1: "Sociedad absolutista"
 cc_pty_concern_absolutist_1_desc: "La sociedad en el centro es neutral. Totalmente hacia el Absolutismo aporta +20; totalmente en la otra dirección cuesta 20. El partido más fuerte desplaza la sociedad hacia su lado."
 cc_pty_concern_absolutist_2: "El poder de la corona"
 cc_pty_concern_absolutist_2_desc: "Que la corona posea el 45% del poder del reino es neutral. Cada punto más otorga +1, hasta +15; cada punto menos resta 1, hasta -15."
 cc_pty_concern_absolutist_3: "Privilegios estamentales"
 cc_pty_concern_absolutist_3_desc: "Seis privilegios entre todos los estamentos es neutral. Cada uno menos aporta +2, hasta +10; cada uno más cuesta 2, hasta -10."
 cc_pty_concern_regionalist_1: "Sociedad descentralizada"
 cc_pty_concern_regionalist_1_desc: "La sociedad en el centro es neutral. Totalmente hacia la Descentralización aporta +20; totalmente en la otra dirección cuesta 20. El partido más fuerte desplaza la sociedad hacia su lado."
 cc_pty_concern_regionalist_2: "La satisfacción de la nobleza"
 cc_pty_concern_regionalist_2_desc: "La satisfacción al 50% es neutral. De -15 al 0% a +15 al 100%. Auméntala con privilegios, impuestos más bajos y puestos en el gabinete para la nobleza."
 cc_pty_concern_regionalist_3: "Gastos de la corte"
 cc_pty_concern_regionalist_3_desc: "Se establece en el presupuesto. El punto medio es neutral. Un menor gasto en la corte aporta hasta +10; el otro extremo cuesta 10."
 cc_pty_concern_colonial_1: "Súbditos coloniales"
 cc_pty_concern_colonial_1_desc: "-5 con un súbdito colonial; cada uno adicional vale +5, hasta +15."
 cc_pty_concern_colonial_2: "La satisfacción de los burgueses"
 cc_pty_concern_colonial_2_desc: "La satisfacción al 50% es neutral. De -15 al 0% a +15 al 100%. Auméntala con privilegios, impuestos más bajos y puestos en el gabinete para los burgueses."
 cc_pty_concern_colonial_3: "Las rutas marítimas"
 cc_pty_concern_colonial_3_desc: "El mantenimiento naval a la mitad es neutral; el mantenimiento total vale +10 y ninguno cuesta 10. La guerra cuesta otros 5."
 cc_pty_concern_liberal_1: "Sociedad liberal"
 cc_pty_concern_liberal_1_desc: "La sociedad en el centro es neutral. Totalmente hacia el Liberalismo aporta +20; totalmente en la otra dirección cuesta 20. El partido más fuerte desplaza la sociedad hacia su lado."
 cc_pty_concern_liberal_2: "Límites de mandato"
 cc_pty_concern_liberal_2_desc: "+10 mientras los ministros desempeñen mandatos limitados, -5 mientras no lo hagan."
 cc_pty_concern_liberal_3: "Impuestos a los burgueses"
 cc_pty_concern_liberal_3_desc: "Una tasa impositiva del 30% es neutral. Impuestos más bajos para los burgueses agradan al partido, hasta +10; subirlos al 55% o más cuesta 10."
