 STATIC_MODIFIER_DESC_cc_frontier_control_buff: "El gobernador residente de la frontera y el séquito noble refuerzan el control de la corona sobre las marcas circundantes."
 cc_frontier_market_buff: "Mercados Fronterizos"
 STATIC_MODIFIER_NAME_cc_frontier_market_buff: "Mercados Fronterizos"
 STATIC_MODIFIER_DESC_cc_frontier_market_buff: "Los mercados burgueses privilegiados alrededor del gobernador fronterizo atraen el comercio a través de las tierras fronterizas."
 cc_frontier_growth_buff: "Asentamiento Fronterizo"
 STATIC_MODIFIER_NAME_cc_frontier_growth_buff: "Asentamiento Fronterizo"
 STATIC_MODIFIER_DESC_cc_frontier_growth_buff: "Los colonos se sienten atraídos por las tierras protegidas alrededor del gobernador de la frontera."
 cc_frontier_conversion_buff: "Misiones Fronterizas"
 STATIC_MODIFIER_NAME_cc_frontier_conversion_buff: "Misiones Fronterizas"
 STATIC_MODIFIER_DESC_cc_frontier_conversion_buff: "El clero enviado desde la sede del gobernador fronterizo predica la fe estatal por todas las marcas circundantes."

 MODIFIER_TYPE_NAME_cc_num_frontier_governors: "Conde Gobernador Fronterizo"
 MODIFIER_TYPE_DESC_cc_num_frontier_governors: "Gobernadores locales menores que no requieren una conexión vial ni ciudad, y que pueden especializarse mediante privilegios de los estamentos."
