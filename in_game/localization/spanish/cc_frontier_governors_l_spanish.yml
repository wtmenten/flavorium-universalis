l_spanish:

 # Advance

 cc_frontier_administration_advance: "Administración Fronteriza"
 cc_frontier_administration_advance_desc: "En lugar de esperar a que los caminos y las ciudades lleguen a las marcas, la corona establece gobernadores nobles residentes directamente en el interior no colonizado, vinculando las tierras fronterizas a la capital mediante la lealtad donde aún no puede vincularlas con piedra. Desbloquea el edificio $cc_lesser_local_governor$ y los privilegios de la propiedad fronteriza, y otorga una gobernación fronteriza adicional. Especialmente valorado por los reinos que se expanden a través de la estepa, las montañas y el interior profundo."

 # Building

 cc_lesser_local_governor: "Gobernador Fronterizo"
 cc_lesser_local_governor_desc: "Un administrador noble residente establecido en una provincia fronteriza subdesarrollada. A diferencia de un gobernador local completo, no necesita camino hacia la capital y puede situarse en tierras rurales, pero debe permanecer conectado a la capital por tierra (directamente o a través de súbditos) y proyecta menos proximidad. Se extrae de un grupo pequeño y dedicado. Requiere el avance $cc_frontier_administration_advance$."
 cc_lesser_local_governor_tt: "Los gobernadores de frontera construidos deben ser menores que el límite de gobernadores de frontera del reino"
 cc_lesser_local_governor_maintenance: "Mantenimiento del Gobernador Fronterizo"

 # Estate Privileges

 ep_frontier_governance: "Gobernanza Fronteriza"
 ep_frontier_governance_desc: "La alta nobleza se hace cargo de las marcas en persona.\n\nOtorga un Gobernador de Frontera adicional (+1 al grupo de gobernadores de frontera).\n\nCada año, cada ubicación propiedad de una provincia de $cc_lesser_local_governor$ y sus provincias vecinas obtienen el modificador $cc_frontier_control_buff$: +5% de Control Máximo y +0.2% de Control Mensual. La bonificación se renueva anualmente y desaparece en dos años si se pierde el gobernador o este privilegio.\n\nRequiere el avance $cc_frontier_administration_advance$."
 ep_frontier_missions: "Misiones Fronterizas"
 ep_frontier_missions_desc: "El clero lleva la fe estatal hacia las tierras fronterizas.\n\nCada año, cada ubicación propiedad del estado en la provincia de un $cc_lesser_local_governor$ y sus provincias vecinas obtiene el modificador $cc_frontier_conversion_buff$: +25% de velocidad de conversión de población. La bonificación se renueva anualmente y desaparece en dos años si se pierde el gobernador o este privilegio.\n\nRequiere el avance $cc_frontier_administration_advance$."
 ep_frontier_markets: "Mercados Fronterizos"
 ep_frontier_markets_desc: "Los mercados burgueses privilegiados se agrupan alrededor de la sede del gobernador, atrayendo el comercio a través de las marcas.\n\nCada año, cada ubicación propiedad de un $cc_lesser_local_governor$ en su provincia y en las provincias vecinas obtiene el modificador $cc_frontier_market_buff$: +1% de Acceso al mercado y +5% de Poder del centro comercial. La bonificación se renueva anualmente y desaparece en dos años si se pierde el gobernador o este privilegio.\n\nRequiere el avance $cc_frontier_administration_advance$."
 ep_frontier_settlement: "Asentamiento Fronterizo"
 ep_frontier_settlement_desc: "Los colonos y pequeños propietarios se sienten atraídos por la frontera protegida.\n\nCada año, cada ubicación propiedad de un $cc_lesser_local_governor$ en su provincia y en las provincias vecinas obtiene el modificador $cc_frontier_growth_buff$: +5% de Atracción de migración y +0.1% de Velocidad de promoción de población. La bonificación se renueva anualmente y desaparece en dos años si se pierde el gobernador o este privilegio.\n\nRequiere el avance $cc_frontier_administration_advance$."

