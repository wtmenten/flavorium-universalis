l_spanish:
 # The bureau system: the Order/Magnates axis, the thread, the steward duty, the privileges and
 # the two reforms.
 #
 # VOICE. The court speaking, not the manual. Numbers and thresholds live in the modifier
 # descriptions and the trigger tooltips, which is where a player goes looking for them; the
 # event bodies describe what is happening in the realm.

 # ---- The societal value ----
 cc_order_vs_cc_magnates: "El orden y los magnates"
 cc_order_focus: "Orden"
 cc_magnates_focus: "Magnates"

 MODIFIER_TYPE_NAME_monthly_towards_cc_order: "Progreso mensual hacia el Orden"
 MODIFIER_TYPE_DESC_monthly_towards_cc_order: "Esto afecta al cambio hacia el [societal_value|e] del [ShowSocietyDirectionName('cc_order')]."
 MODIFIER_TYPE_NAME_monthly_towards_cc_magnates: "Progreso mensual hacia los Magnates"
 MODIFIER_TYPE_DESC_monthly_towards_cc_magnates: "Esto afecta al cambio hacia el [societal_value|e] de los [ShowSocietyDirectionName('cc_magnates')]."

 # Shown in a bureaucracy's negative modifier tooltip, where the extra entrenchment factor is
 # applied. See zzz_cc_vanilla_bureau_overrides.txt for why the malus side is scaled twice.
 CC_BUREAU_ENTRENCHMENT_SCALE: "Atrincheramiento"

 # ---- The cabinet duty ----
 cc_duty_bureau_steward: "Administrador de una oficina"
 cc_duty_bureau_steward_desc: "Poner a un ministro a cargo de una oficina y dejar que viva en ella.\n\nÉl aprende cuánto cuesta, algo que nadie en la corte se ha molestado en averiguar, y en un año la está gestionando por menos de lo que el tesoro había presupuestado. Para entonces, es también el único hombre que la comprende."
 cc_duty_bureau_steward_select: "¿Qué oficina?"

 # ---- .1  A new bureau ----
 cc_bureau.1.title: "La plantilla"
 cc_bureau.1.desc: "La orden está firmada y las salas han sido encontradas. Lo que queda es la parte que nadie escribe: quién se sienta en ellas.\n\nNo faltan candidatos. Faltan candidatos que puedan hacer el trabajo y no tengan motivos para estar agradecidos con nadie, y la corte nunca en su historia ha producido más que un puñado de ellos a la vez."
 cc_bureau.1.desc_venal: "La orden está firmada, y tres familias distintas ya han escrito para preguntar por los nombramientos. Dos de ellas adjuntaron cifras.\n\nEsto no es corrupción según entiende la palabra cualquiera aquí. Es simplemente cómo se han llenado los puestos durante una generación, y los hombres que escriben estarían genuinamente desconcertados de oír que se llame de otra manera."
 cc_bureau.1.a: "Oficinistas asalariados. Deberán el cargo al cargo mismo."
 cc_bureau.1.b: "Los hijos menores de las grandes casas."
 cc_bureau.1.c: "Vender los nombramientos. El tesoro necesita el dinero."

 # ---- .10  A bureau is dissolved ----
 cc_bureau.10.title: "La oficina liquidada"
 cc_bureau.10.desc: "La oficina cierra y la pregunta es qué pasará con cuarenta hombres que han pasado su vida laboral en ella.\n\nNo son hombres importantes. Varios de ellos son las únicas personas vivas que saben cómo se hace una cosa en particular, y a ninguno de ellos se le ha preguntado qué cosa en particular."
 cc_bureau.10.desc_sold: "La oficina cierra, y los hombres en ella pagaron por sus puestos.\n\nNadie en la corte ha sido capaz de dar una respuesta clara sobre si ese dinero debe devolverse. Los escribanos tienen su propia opinión, la han puesto por escrito cuidadosamente y uno de ellos ha ido a ver a un abogado."
 cc_bureau.10.a: "Buscarles lugares en otra parte."
 cc_bureau.10.b: "Agradecerles y dejarlos ir."
 cc_bureau.10.c: "Dar un ejemplo con el peor de ellos."

 # ---- .20  The offices find their own income ----
 cc_bureau.20.title: "Los atrasos"
 cc_bureau.20.desc: "Las oficinas no han sido pagadas en su totalidad desde hace tiempo. No han dejado de trabajar, lo cual el tesoro ha tomado discretamente como prueba de que el salario nunca fue lo importante.\n\nSí lo es. Lo que ha sucedido en su lugar es que ha aparecido una tasa: pequeña, informal y cobrada en el momento en que el peticionario más desea que se haga la tarea. Nadie la estableció y todo el mundo conoce la tarifa."
 cc_bureau.20.a: "Pagar los atrasos. Todos ellos."
 cc_bureau.20.b: "Han encontrado sus propios ingresos. Déjalo así."
 cc_bureau.20.c: "Menos puestos, pagados adecuadamente."

 # ---- .21  The fees are the custom ----
 cc_bureau.21.title: "La costumbre de la oficina"
 cc_bureau.21.desc: "Doce años, y la tasa ya no es informal. Tiene una tarifa, la tarifa está escrita en un tablero, y un escribano se la explicará cortésmente antes de que termine de preguntar.\n\nLos hombres que la cobran han construido sus vidas sobre ella. Han comprado casas gracias a ella y han casado a sus hijas gracias a ella, y le dirán sin vergüenza que se les paga de esta manera porque la corona decidió no pagarles de otra forma. Tienen razón."
 cc_bureau.21.a: "Abolirlo. Cueste lo que cueste."
 cc_bureau.21.b: "Gravarlo. La corona bien puede llevarse su parte."
 cc_bureau.21.c: "No decir nada y dejar que permanezca así."

 # ---- .30  The clerks against the great houses ----
 cc_bureau.30.title: "Una cuestión de precedencia"
 cc_bureau.30.desc: "Un subsecretario ha rechazado a un duque.\n\nEl rechazo era correcto. El papeleo no estaba en orden, el hombre lo dijo, y lo dijo delante de la gente. Lo que el duque quiere ya no es el papeleo; lo que el duque quiere es establecer que un hombre con esa descripción no le dice nada a un hombre con la suya.\n\nLa mitad de la corte está disfrutando esto enormemente y la otra mitad ha comprendido lo que realmente se está decidiendo."
 cc_bureau.30.a: "El nombramiento se mantiene. Al igual que el rechazo."
 cc_bureau.30.b: "Al duque se le debe su cortesía."
 cc_bureau.30.c: "La corona no adjudica entre servidores."

 # ---- .40  Entrenched and unfunded ----
 cc_bureau.40.title: "El feudo"
 cc_bureau.40.desc: "La oficina no ha tenido una financiación adecuada en veinte años y nunca la ha pedido, lo cual debería haber sido la advertencia.\n\nEs totalmente solvente. Es solvente porque se ha convertido en el asunto privado de la familia que la dirige, obteniendo sus ingresos de acuerdos cuyos términos nadie en la corte ha visto, y ha desempeñado su función impecablemente durante todo este tiempo. Eso es lo que lo hace difícil. No hay nada de qué quejarse excepto el hecho mismo."
 cc_bureau.40.a: "Financiarlo adecuadamente y recuperarlo."
 cc_bureau.40.b: "Dividirlo en piezas lo suficientemente pequeñas como para sostenerlas."
 cc_bureau.40.c: "Venderles el cargo directamente. Por ley."

 # ---- .50  Entrenched and funded ----
 cc_bureau.50.title: "Un pilar del Estado"
 cc_bureau.50.desc: "La oficina tiene cuarenta años, está debidamente remunerada y ha sobrevivido a tres de los hombres que la fundaron sin que nadie notara diferencia alguna en su rendimiento.\n\nEsa última parte es el logro. Ha dejado de depender de quién trabaje allí. Un escribano que murió el invierno pasado dejó un conjunto de instrucciones permanentes tan completas que el hombre que lo reemplazó no necesitó instrucción alguna, y la oficina simplemente continuó.\n\nLa corona ha construido algo que sobrevivirá a la atención de la corona. Lo que queda es decidir cuánta cuerda darle."
 cc_bureau.50.a: "Dejar que escriba su propio procedimiento."
 cc_bureau.50.b: "Llevar su cabeza al consejo."
 cc_bureau.50.c: "Rotar a los oficiales antes de que cualquiera de ellos eche raíces."

 # ---- .60  A funding cut ----
 cc_bureau.60.title: "Se anuncia el recorte"
 cc_bureau.60.desc: "La estimación fue reducida y alguien tiene que decírselo.\n\nEl jefe de la oficina recibió la noticia de pie, agradeció al mensajero y lanzó una pregunta: si se esperaba que la reducción fuera permanente. Le dijeron que era por el año. Él respondió que eso era lo que le habían dicho la última vez, y volvió a su escritorio.\n\nNo dimitirá ni protestará. Lo que hará será dejar de rechazar los pequeños favores que ha estado rechazando durante once años, y nadie en el palacio se enterará de nada."
 cc_bureau.60.a: "Decírselo claramente. Este año no hay dinero."
 cc_bureau.60.b: "Recortar la estructura, no el salario."
 cc_bureau.60.c: "Encontrarlo en algún otro lugar."

 # ---- .61  What the cut cost ----
 cc_bureau.61.title: "Lo que costó"
 cc_bureau.61.desc: "Diez años después, la oficina todavía existe y sigue respondiendo cartas.\n\nLo que ya no hace es responderlas de la misma manera independientemente de quién pregunte. No hubo una decisión. Nadie fue sobornado en un sentido que la corte pudiera procesar. Es simplemente que un hombre al que no se le ha pagado adecuadamente en una década desarrolla el sentido de qué corresponsales valen la pena, y cada hombre en ese edificio desarrolló el mismo sentido aproximadamente al mismo tiempo.\n\nLa corona logra que se haga el trabajo. Pero lo logra en segundo lugar."
 cc_bureau.61.a: "Reconstruirlo. Cueste lo que cueste."
 cc_bureau.61.b: "Es más barato que antes. Dejarlo así."

 # ---- Thread modifiers ----
 STATIC_MODIFIER_NAME_cc_bureau_career_clerks: "Un servicio asalariado"
 STATIC_MODIFIER_DESC_cc_bureau_career_clerks: "Hombres que deben el puesto al puesto. Lentos, sin glamur, y se agrava cada año que nadie interviene."
 STATIC_MODIFIER_NAME_cc_bureau_offices_are_property: "Los cargos son propiedad"
 STATIC_MODIFIER_DESC_cc_bureau_offices_are_property: "Los cargos se heredan y venden como algo habitual, y nadie lo ha decretado. La corona sigue recaudando. Ya no decide quién sirve."
 STATIC_MODIFIER_NAME_cc_bureau_paid_in_full: "Atrasos liquidados"
 STATIC_MODIFIER_DESC_cc_bureau_paid_in_full: "Veinticinco años de escribanos pagados a tiempo, que es lo más caro de comprar en todo este hilo y lo único que deshace el resto."
 STATIC_MODIFIER_NAME_cc_bureau_fees_became_custom: "Las tasas se convirtieron en costumbre"
 STATIC_MODIFIER_DESC_cc_bureau_fees_became_custom: "Una oficina que vive de sus propias tasas responde a quien las paga, y la tarifa está en un tablero junto a la puerta."
 STATIC_MODIFIER_NAME_cc_bureau_retrenched: "Plantilla reducida"
 STATIC_MODIFIER_DESC_cc_bureau_retrenched: "Menos puestos, aún asalariados, aún de la corona. Una administración más pequeña sigue siendo una administración."
 STATIC_MODIFIER_NAME_cc_bureau_office_farmed_out: "La oficina arrendada"
 STATIC_MODIFIER_DESC_cc_bureau_office_farmed_out: "El puesto pertenece ahora a otra persona y la corona cobra un alquiler por su propia administración. Funciona. Pero también lleva toda una vida deshacerlo."
 STATIC_MODIFIER_NAME_cc_bureau_crown_backed_clerks: "La Corona respaldó a sus escribanos"
 STATIC_MODIFIER_DESC_cc_bureau_crown_backed_clerks: "Dicho una vez, en público, frente a un duque. Cada subsecretario del reino se enteró en menos de un mes."
 STATIC_MODIFIER_NAME_cc_bureau_standing_procedure: "Procedimiento estándar"
 STATIC_MODIFIER_DESC_cc_bureau_standing_procedure: "La oficina ha puesto por escrito cómo hace las cosas y, por lo tanto, ha dejado de depender de las personas que actualmente las llevan a cabo. Esa es la definición completa de una institución."
 STATIC_MODIFIER_NAME_cc_bureau_head_in_council: "El secretario del Consejo"
 STATIC_MODIFIER_DESC_cc_bureau_head_in_council: "La oficina tiene voz y voto. La corona tiene un rival que al menos puede ver, que es el mejor tipo de rival."
 STATIC_MODIFIER_NAME_cc_bureau_rotated_officers: "Oficiales rotados"
 STATIC_MODIFIER_DESC_cc_bureau_rotated_officers: "Nadie se queda lo suficiente como para construir nada, que es el objetivo, y también el coste."

 # ---- Estate privileges ----
 ep_noble_offices_by_right: "Las oficinas son nuestras por derecho"
 ep_noble_offices_by_right_desc: "Los puestos pasan a las familias y las familias pagan por ellos, por lo que el gasto del tesoro disminuye el año en que se concede esto y cada año posterior.\n\nLo que disminuye con ello es la capacidad de la corona para elegir quién sirve. Ese no es un coste que nadie note hasta la primera vez que importa."
 ep_burgher_examined_service: "Servicio por examen"
 ep_burgher_examined_service_desc: "Cargos ocupados por quien apruebe el examen, venga de donde venga. Produce una administración mejor que cualquier otro método que alguien haya intentado, y es lento, caro y detestado por cada familia con un nombre que proteger."
 ep_clergy_keepers_of_record: "Guardianes del Registro"
 ep_clergy_keepers_of_record_desc: "Antes de que hubiera archivos hubo monasterios, y durante varios siglos fueron la misma cosa. El clero guarda los rollos, la corona se ahorra el coste de mantenerlos.\n\nEl precio es que ahora la iglesia sabe exactamente qué posee la corona."
 ep_peasant_relief_from_fees: "Alivio de las tasas"
 ep_peasant_relief_from_fees_desc: "Los cargos informales cesan, por proclama, y se les comunica a las oficinas que, en su lugar, se les pagará debidamente.\n\nLa corona acaba de aceptar asumir un coste que había estado trasladando discretamente a personas que no tenían forma de rechazarlo. Es más caro de lo que nadie esperaba."

 # ---- Government reforms ----
 cc_venal_offices_reform: "Las oficinas venales"
 cc_venal_offices_reform_desc: "Los cargos se convierten en propiedad por ley: se compran, venden, heredan y la corona los grava en cada transferencia.\n\nFrancia funcionó así durante dos siglos y dio resultado, en el sentido estricto de que recaudó dinero de manera fiable y sin discusiones. Lo que no pudo hacer fue producir una administración que respondiera ante alguien."
 cc_salaried_establishment_reform: "La plantilla asalariada"
 cc_salaried_establishment_reform_desc: "Los cargos son asalariados, nombrados y mantenidos a voluntad de la corona.\n\nCada estado que perduró llegó aquí eventualmente, y la mayoría de ellos llegaron después de intentar lo otro primero y pasar un siglo lamentándolo. Es costoso de la misma manera que lo son las murallas."
