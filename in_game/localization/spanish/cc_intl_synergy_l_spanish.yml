l_spanish:
 # ============================================================
 # CROSS-COUNTRY SYNERGY EVENTS (cc_intl namespace)
 # ============================================================

 # -------- STATIC MODIFIER NAMES --------
 STATIC_MODIFIER_NAME_cc_intl_scholar_influx: "Afluencia de eruditos"
 STATIC_MODIFIER_NAME_cc_intl_military_exchange: "Intercambio militar"
 STATIC_MODIFIER_NAME_cc_intl_trade_compact: "Compacto Comercial"
 STATIC_MODIFIER_NAME_cc_intl_steppe_alliance: "Alianza de la Estepa"
 STATIC_MODIFIER_NAME_cc_intl_pilgrimage_network: "Red de Peregrinaciones"
 STATIC_MODIFIER_NAME_cc_intl_religious_solidarity: "Solidaridad religiosa"
 STATIC_MODIFIER_NAME_cc_intl_shadow_operations: "Operaciones en la sombra"
 STATIC_MODIFIER_NAME_cc_intl_diplomatic_compact: "Pacto diplomático"
 STATIC_MODIFIER_NAME_cc_intl_intellectual_rivalry: "Rivalidad Intelectual"

 # -------- GROUP A: INTELLECTUAL & SCHOLARLY --------

 cc_intl.1.title: "El intercambio del filósofo"
 cc_intl.1.desc: "Nos llegan noticias de [target_nation.GetName]: su corte ha producido ministros de una distinción intelectual inusual. [minister.GetName] se ha estado correspondiendo con ellos durante meses. Las cartas han sido extraordinarias, y la oportunidad que representan puede serlo aún más."
 cc_intl.1.a: "Proponer un intercambio académico formal; ambas cortes se benefician."
 cc_intl.1.b: "Invitar a sus eruditos aquí. Que el talento fluya hacia nosotros."
 cc_intl.1.c: "Nuestra corte guarda sus propios secretos."

 cc_intl.2.title: "Eruditos en el exilio"
 cc_intl.2.desc: "La guerra que engulle a [war_nation.GetName] ha creado un flujo de refugiados; entre ellos eruditos, médicos y administradores de considerable talento. Están cruzando nuestras fronteras sin nada más que sus conocimientos. [minister.GetName] cree que deberíamos recibirlos."
 cc_intl.2.a: "Abrir la corte a los exiliados. Sus conocimientos son nuestra ganancia."
 cc_intl.2.b: "Paguemos a algunos mercenarios para mantener fuera a la chusma."
 cc_intl.2.c: "Esta no es nuestra guerra, y estos no son nuestros eruditos."

 cc_intl.3.title: "El filósofo rival"
 cc_intl.3.desc: "La corte de [rival_court.GetName] se ha declarado el centro de aprendizaje más importante del mundo conocido. La afirmación no carece de fundamento, pero tampoco está exenta de controversia. Nuestros propios logros intelectuales son considerables. ¿Cómo respondemos?"
 cc_intl.3.a: "Que la rivalidad agudice ambas cortes. La competencia hace avanzar el conocimiento."
 cc_intl.3.b: "Desafiar su preeminencia directamente. No cederemos el título."
 cc_intl.3.c: "Proponer una academia conjunta. Juntos superaremos lo que cualquiera logre por sí solo."

 # -------- GROUP B: MILITARY COOPERATION --------

 cc_intl.4.title: "La doctrina del Mariscal"
 cc_intl.4.desc: "[military_minister.GetName] ha estado observando la guerra de [military_ally.GetName] con interés profesional. Las campañas han revelado debilidades, y nuestra propia doctrina tiene algo que ofrecer a cambio. Hay una oportunidad aquí: compartir conocimientos, beneficiarse de la experiencia o simplemente observar."
 cc_intl.4.a: "Comparte nuestra doctrina libremente. Los buenos aliados luchan mejor."
 cc_intl.4.b: "Solicitar sus veteranos a cambio. Los soldados experimentados valen oro."
 cc_intl.4.c: "Vender la experiencia. Su oro es tan bueno como su gratitud."

 cc_intl.5.title: "Migración nómada"
 cc_intl.5.desc: "Los señores tribales de [steppe_neighbor.GetName] están inquietos. [minister.GetName], que comprende la mentalidad de la estepa mejor que la mayoría en esta corte, cree que nos encontramos en una encrucijada: alianza, suzeranía o transacción. Cada camino tiene su precio y su recompensa."
 cc_intl.5.a: "Forjar una alianza. Su caballería y nuestra administración: una combinación formidable."
 cc_intl.5.b: "Exigir tributo. Los fuertes toman; los débiles dan."
 cc_intl.5.c: "Contratar su caballería directamente. Esto es cuestión de negocios, no de política."

 # -------- GROUP C: RELIGIOUS & FAITH NETWORKS --------

 cc_intl.6.title: "La Solidaridad del Califato"
 cc_intl.6.desc: "Nuestro canciller ha recibido una delegación de [muslim_partner.GetName] con un mensaje de fraternidad. El mundo islámico no es un solo imperio, es una sola civilización. Hay formas de fortalecer el tejido conectivo de esa civilización que beneficien a todos los que comparten la fe."
 cc_intl.6.a: "Solidaridad islámica. Nuestros destinos están unidos por algo más que un tratado."
 cc_intl.6.b: "Un pacto de red comercial. La mayor fuerza del dar al-Islam es su comercio."
 cc_intl.6.c: "Convocar una cumbre teológica. Los eruditos deben hablar."

 cc_intl.7.title: "Solidaridad protestante"
 cc_intl.7.desc: "La Reforma ha creado aliados extraños y enemigos aún más extraños. [protestant_partner.GetName] comparte nuestra confesión, enfrenta presiones similares y se ha puesto en contacto a través de la red de nuestros ministros. La cuestión es cuánta solidaridad deseamos demostrar, y a qué coste."
 cc_intl.7.a: "Declarar nuestra hermandad abiertamente. Permanecemos juntos ante Dios y ante Roma."
 cc_intl.7.b: "Un intercambio académico. El arma más poderosa de la Reforma es el argumento, no las armas."
 cc_intl.7.c: "Reconoce el vínculo discretamente. La prudencia es la mejor parte de la política confesional."

 cc_intl.8.title: "La peregrinación sagrada"
 cc_intl.8.desc: "Los lugares sagrados atraen peregrinos de todo el mundo, incluidos los de [pilgrimage_partner.GetName]. Nuestro ministro —cuya autoridad espiritual se extiende más allá de la sala del gabinete— cree que la corona debería asumir un papel activo en la acogida, dirección y lucro de este flujo de viajeros fieles."
 cc_intl.8.a: "Organiza la gran peregrinación. Que esta corte se convierta en un centro sagrado."
 cc_intl.8.b: "Enviar emisarios espirituales a su corte en su lugar."
 cc_intl.8.c: "Actuar como árbitro espiritual entre nuestras cortes: la fe como diplomacia."

 # -------- GROUP D: TRADE & DIPLOMATIC --------

 cc_intl.9.title: "El Pacto del Mercader"
 cc_intl.9.desc: "La comunidad mercantil de [trade_partner.GetName] ha establecido contacto con la nuestra. Nuestro ministro ve una oportunidad: las rutas comerciales que cada uno controla se solapan de formas que son más complementarias que competitivas. Un pacto ahora podría definir el comercio en esta región durante una generación."
 cc_intl.9.a: "Una empresa comercial conjunta. Ambas cortes prosperan; ninguna domina."
 cc_intl.9.b: "Negociar derechos exclusivos. Nuestros mercaderes toman la posición de liderazgo."
 cc_intl.9.c: "Estudia sus prácticas discretamente. El conocimiento es una forma de comercio en sí misma."

 cc_intl.10.title: "La influencia del Gran Canciller"
 cc_intl.10.desc: "La corte de [junior_state.GetName] es más pequeña, más débil y —según nuestro canciller— susceptible a la persuasión. La cuestión es qué forma debe tomar esa persuasión: patronazgo, extracción o una demostración de fuerza."
 cc_intl.10.a: "Extender un patrocinio diplomático. Entran en nuestra órbita voluntariamente."
 cc_intl.10.b: "Establecer un acuerdo tributario. El poder tiene sus privilegios."
 cc_intl.10.c: "Hacer una demostración de fuerza. Que vean lo que cuesta la resistencia."

 # -------- GROUP E: ESPIONAGE & SHADOW PLAY --------

 cc_intl.11.title: "La corte en la sombra tiende la mano"
 cc_intl.11.desc: "[minister.GetName] ha estado observando a [shadow_target.GetName] durante algún tiempo. La hostilidad allí no es accidental; es cultivada, quizás por aquellos que temen lo que representamos. Nuestro consejero en la sombra cree que ha llegado el momento de actuar: reunir inteligencia, captar su talento o fabricar el pretexto que necesitamos."
 cc_intl.11.a: "Construya la operación de inteligencia. Conózcalos antes de que ellos nos conozcan a nosotros."
 cc_intl.11.b: "Reclutar a sus nobles descontentos. Su pérdida es nuestra ganancia."
 cc_intl.11.c: "Provocar un incidente diplomático. Tendremos nuestra justificación."

 # -------- GROUP F: RULER-TO-RULER --------

 cc_intl.12.title: "La misión confuciana"
 cc_intl.12.desc: "Nuestro ministro confuciano ha observado la corte de [tributary_state.GetName], y su observación es esta: son más pequeños, son vecinos y se encuentran dentro de la órbita de la tradición Celestial. La forma en que nos acerquemos a ellos definirá el carácter de esa relación: patronazgo, cultura o autoridad."
 cc_intl.12.a: "Ofrecer relaciones tributarias. La jerarquía celestial pide reconocimiento, no sumisión."
 cc_intl.12.b: "Enviar una misión cultural. La práctica administrativa confuciana es nuestra mayor exportación."
 cc_intl.12.c: "Reivindicar la supremacía celestial. Nuestra cultura se expande; su resistencia ha sido notada."
