l_spanish:
 # ===== RED HERRING EVENTS — cc_bonds.70–89 =====
 # False positives fire after secretly bad choices. False negatives after good ones.

 # === cc_bonds.70 — False Positive (generic — works for colony and march) ===
 cc_bonds.70.title: "Gratitud desde la frontera"
 cc_bonds.70.desc: "Llega un despacho informando que los acuerdos recientes han sido recibidos con una calidez sorprendente. La administración local parece funcionar sin problemas y varias figuras notables han expresado satisfacción con la manera en que se han manejado los asuntos. Los informes son brillantes, quizás incluso inesperadamente."
 cc_bonds.70.a: "Bien. Estos acuerdos benefician a todos."

 # === cc_bonds.71 — False Positive (spoils / extraction) ===
 cc_bonds.71.title: "No se han reportado quejas"
 cc_bonds.71.desc: "Nuestros enviados han regresado de [bond_subj.GetName] con un informe irrelevante. La distribución de los ingresos recientes ha sido aceptada sin protestas formales. No se han presentado peticiones ni se han planteado quejas a través de los canales oficiales. El asunto parece estar cerrado."
 cc_bonds.71.a: "Como debe ser."

 # === cc_bonds.72 — False Positive (dismissal / replacement) ===
 cc_bonds.72.title: "Estabilidad restaurada"
 cc_bonds.72.desc: "Los informes de [bond_subj.GetName] sugieren que las medidas recientes han tenido el efecto deseado. Cualquier tensión existente parece haberse disipado, y los observadores describen la situación como tranquila y ordenada. La decisión parece haber sido la correcta."
 cc_bonds.72.a: "El asunto está zanjado, entonces."

 # === cc_bonds.73 — False Positive (refusal / reassignment) ===
 cc_bonds.73.title: "Una carta de cooperación"
 cc_bonds.73.desc: "Ha llegado un mensaje inesperadamente amable de [bond_subj.GetName]. La casa gobernante reconoce la decisión de la Corona, no expresa resentimiento y reafirma su compromiso con el acuerdo. El tono es cálido. El despacho no contiene ningún subtexto que nuestros secretarios puedan detectar."
 cc_bonds.73.a: "Una respuesta satisfactoria."

 # === cc_bonds.74 — False Positive (colonial militia disbandment) ===
 cc_bonds.74.title: "Orden totalmente restaurada"
 cc_bonds.74.desc: "La administración colonial ha presentado un informe detallado sobre las consecuencias de la represión de la milicia. El orden ha sido restaurado en toda la colonia; no se han registrado más incidentes; la población parece haber vuelto a sus asuntos habituales. El gobernador alaba la acción decisiva de la Corona."
 cc_bonds.74.a: "La situación está bajo control."

 # === cc_bonds.75 — False Negative (flexible administration — the good choice) ===
 cc_bonds.75.title: "Preocupaciones en la corte"
 cc_bonds.75.desc: "Varios de nuestros asesores más tradicionales han expresado reservas discretas sobre los flexibles acuerdos administrativos extendidos a [bond_subj.GetName]. Un memorándum, distribuido entre el consejo, sugiere que la laxitud en la administración es difícil de revertir una vez establecida. Se toma nota de la preocupación. Si esta refleja la realidad o una ansiedad conservadora es menos claro."
 cc_bonds.75.a: "Anotado. Vigilaremos la situación."

 # === cc_bonds.76 — False Negative (no levy — the good choice) ===
 cc_bonds.76.title: "Murmullos de súbditos envalentonados"
 cc_bonds.76.desc: "Se rumorea que la decisión de no reclutar tropas de [bond_subj.GetName] ha sido interpretada por algunos observadores como una debilidad. Un informe —nos dicen que no es una opinión generalizada— sugiere que el gobernador ha empezado a «poner a prueba los límites de lo que la Corona exigirá». Nuestros secretarios no pueden confirmarlo. Podría ser simplemente el habitual cotilleo de la corte."
 cc_bonds.76.a: "Especulación. Mantenemos nuestra decisión."

 # === cc_bonds.77 — False Positive (merit appointment — the worse choice) ===
 cc_bonds.77.title: "El nombramiento ha sido bien recibido"
 cc_bonds.77.desc: "Nuestro nombramiento basado en el mérito para el puesto provincial ha sido elogiado en varios despachos como un modelo de buen gobierno. El designado ha causado una primera impresión favorable en los administradores locales. La casa del gobernador no ha planteado ninguna objeción formal. El nombramiento parece haber satisfecho a todas las partes."
 cc_bonds.77.a: "El mérito habla por sí mismo."

 # === cc_bonds.78 — False Negative (preserve local customs — the good choice) ===
 cc_bonds.78.title: "Los nobles cuestionan la indulgencia"
 cc_bonds.78.desc: "Varias voces prominentes en el estamento noble han cuestionado la decisión de la Corona de preservar las costumbres locales en [bond_subj.GetName]. Su argumento se basa en un principio administrativo: la inconsistencia debilita la autoridad de la ley de la Corona. La crítica es formal y cortés, pero incisiva. Nos queda determinar si se trata de una preocupación sustancial o de la fricción previsible de cualquier reforma."
 cc_bonds.78.a: "Los nobles expresan su opinión. Hemos tomado nuestra decisión."

 # === cc_bonds.79 — False Positive (waive palatinate ceremony) ===
 cc_bonds.79.title: "El señor se pone a prueba"
 cc_bonds.79.desc: "Cualesquiera que hayan sido las reservas del señor del palatinado sobre la investidura simplificada, no ha dejado que se noten. En los meses transcurridos, ha gestionado varios asuntos locales difíciles con eficiencia y lealtad. Nuestro enviado informa que está «totalmente dedicado a sus deberes». Si la falta de ceremonia dejó alguna huella, no es visible desde fuera."
 cc_bonds.79.a: "Bien. La sustancia importa más que la ceremonia."

 # === cc_bonds.80 — False Negative (palatinate levy exemption — the good choice) ===
 cc_bonds.80.title: "Rumores de un Palatinado envalentonado"
 cc_bonds.80.desc: "Nos ha llegado la noticia —a través de canales informales— de que la decisión de eximir a [bond_subj.GetName] del reciente impuesto ha sido interpretada como vacilación. Un cortesano sugiere que el señor del palatinado se ha sentido 'envalentonado'. La fuente no es totalmente fiable y la afirmación no ha sido corroborada, pero es el tipo de rumor que persiste si no lo abordamos."
 cc_bonds.80.a: "Veremos cómo se comporta el señor."

 # === cc_bonds.81 — False Positive (ignore palatinate border dispute) ===
 cc_bonds.81.title: "La Disputa se Resuelve Silenciosamente"
 cc_bonds.81.desc: "Nuestros secretarios han archivado una breve nota: la disputa fronteriza que involucra a [bond_subj.GetName] parece haberse calmado sin la intervención de la Corona. Las partes han llegado a un acuerdo informal. Nuestra neutralidad, aparentemente, no ha creado ninguna dificultad visible."
 cc_bonds.81.a: "Como esperábamos."

 # === cc_bonds.82 — False Negative (temporary tax relief — the sensible choice) ===
 cc_bonds.82.title: "El señor pide más"
 cc_bonds.82.desc: "El señor del palatinado ha enviado una comunicación de seguimiento. Aunque expresó gratitud por el alivio temporal en su respuesta inicial, ahora pregunta si existe alguna posibilidad de prorrogar el acuerdo. La petición está formulada cuidadosamente, pero su significado es claro: ha tomado el gesto como una invitación a negociar. Nuestros consejeros están divididos sobre si esto es oportunismo o una expectativa razonable."
 cc_bonds.82.a: "Responderemos a su debido tiempo."

 # === cc_bonds.83 — False Positive (refuse puppet ambassador) ===
 cc_bonds.83.title: "El títere acepta el acuerdo"
 cc_bonds.83.desc: "El gobierno de [bond_subj.GetName] ha reconocido nuestra decisión respecto a la solicitud de la embajada. Su respuesta es formal y comedida: sin protestas, sin declaraciones públicas y sin retirar la cooperación en ningún asunto activo. A todas luces, han aceptado el acuerdo y han pasado página."
 cc_bonds.83.a: "Asentado."

 # === cc_bonds.84 — False Positive (ignore puppet faction dispute) ===
 cc_bonds.84.title: "La Tensión de la Facción se Alivia"
 cc_bonds.84.desc: "Los informes de [bond_subj.GetName] indican que la disputa entre facciones internas se ha calmado considerablemente en los últimos meses. Ninguna facción ha emergido como dominante, pero la situación tampoco ha escalado. Los observadores describen la situación política como «estable». Nuestra neutralidad parece haber evitado avivar a cualquiera de las dos partes."
 cc_bonds.84.a: "A veces, la moderación es la política más sabia."

 # === cc_bonds.85 — False Positive (forbid puppet military expansion) ===
 cc_bonds.85.title: "La Directiva es Aceptada"
 cc_bonds.85.desc: "El gobierno de [bond_subj.GetName] ha reconocido formalmente la decisión de la Corona sobre la expansión militar. Su respuesta es cooperativa en tono; no expresan desacuerdo público y no han hecho ningún esfuerzo visible por buscar acuerdos alternativos. El asunto parece cerrado por su parte."
 cc_bonds.85.a: "Han comprendido el mensaje."

 # === cc_bonds.86 — False Positive (send formal letter instead of visiting) ===
 cc_bonds.86.title: "Una respuesta cálida"
 cc_bonds.86.desc: "Nuestra carta a [bond_subj.GetName] ha sido recibida y reconocida. La casa reinante ha respondido con grácil cortesía, agradeciendo a la Corona su atención a la ocasión y expresando que el gesto fue apreciado. La respuesta se extiende a tres páginas y no podría ser más cordial. Resulta difícil saber, a través de una carta, si la cordialidad es genuina o diplomática."
 cc_bonds.86.a: "Se han cumplido las formalidades."

 # === cc_bonds.87 — False Positive (exclude dependency from royal ceremony) ===
 cc_bonds.87.title: "Una carta de felicitación"
 cc_bonds.87.desc: "La casa reinante de [bond_subj.GetName] ha enviado una reflexiva carta de felicitación por la reciente ocasión real. No mencionan su ausencia. La carta es cálida en su lenguaje e incluye un regalo. Nuestro chambelán señala que el regalo es algo más modesto que en años anteriores, pero no ofrece ninguna interpretación."
 cc_bonds.87.a: "La ocasión fue un éxito."

 # === cc_bonds.88 — False Negative (dependency mobilizes on their own) ===
 cc_bonds.88.title: "La Dependencia se Moviliza"
 cc_bonds.88.desc: "Los informes de [bond_subj.GetName] describen una impresionante movilización local en respuesta a la amenaza fronteriza. La casa gobernante ha reclutado fuerzas, reforzado sus posiciones fronterizas y repelido la incursión inicial sin nuestra intervención directa. Los observadores lo describen como una demostración de resiliencia. Lo que no están discutiendo —al menos no en los despachos que recibimos— es cómo se sintieron al manejarlo solos."
 cc_bonds.88.a: "Se las arreglaron. Bien."

 # === cc_bonds.89 — False Positive (refuse dependency succession consultation) ===
 cc_bonds.89.title: "La prerrogativa aceptada"
 cc_bonds.89.desc: "La casa reinante de [bond_subj.GetName] ha reconocido nuestra decisión sobre la cuestión de la consulta de sucesión. Su respuesta formal afirma la prerrogativa de la Corona en estos asuntos y retira la petición sin más comentarios. No hay nada en el lenguaje que sugiera resentimiento. Nuestros secretarios describen el tono como 'enteramente apropiado'."
 cc_bonds.89.a: "Como debe ser. La sucesión no es asunto suyo."
