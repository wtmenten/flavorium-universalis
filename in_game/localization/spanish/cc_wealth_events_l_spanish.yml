 cc_wealth_corruption_5: "Riqueza concentrada (V)"
 cc_wealth_corruption_5_desc: "Cuando la corona acumula oro, los estamentos se dan cuenta. Los acuerdos parasitarios enriquecen silenciosamente a la nobleza y al clero a expensas de la legitimidad real."
 cc_wealth.7.title: "Una demolición rentable"
 cc_wealth.7.desc: "Uno de los estamentos ha propuesto un acuerdo peculiar. A cambio de una suma significativa del tesoro, eliminarán una de sus propias estructuras señoriales, poniendo la tierra a disposición de otros usos y recaudando capital inmediato. Es una oferta inusual, pero el oro es real."
 cc_wealth.7.a: "Acepta sus términos."
 cc_wealth.7.b: "Rechazar. El acuerdo no nos conviene."

 cc_wealth.8.title: "Una propuesta de inversión burguesa"
 cc_wealth.8.desc: "La clase mercantil ha identificado una ubicación urbana próspera lista para la expansión. Están dispuestos a financiar los trabajos preliminares —preparar los cimientos, despejar solares, coordinar la construcción— a cambio de una parte del tesoro proporcional a la riqueza de la ubicación."
 cc_wealth.8.a: "Aceptar. Financiar la expansión."
 cc_wealth.8.b: "Rechazar por ahora."

 cc_wealth_urban_construction: "Expansión urbana burguesa"
 cc_wealth_urban_construction_desc: "Los burgueses han preparado este lugar para un desarrollo acelerado, proporcionando tres espacios de construcción adicionales durante diez años."
 STATIC_MODIFIER_NAME_cc_wealth_urban_construction: "Expansión urbana burguesa"
