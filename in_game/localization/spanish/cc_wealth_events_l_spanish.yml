 # Wealth Corruption Modifier Names

 cc_wealth_corruption_1: "Riqueza concentrada (I)"
 cc_wealth_corruption_1_desc: "Cuando la corona acumula oro, los estamentos se dan cuenta. Los acuerdos parasitarios enriquecen silenciosamente a la nobleza y al clero a expensas de la legitimidad real."
 cc_wealth_corruption_2: "Riqueza concentrada (II)"
 cc_wealth_corruption_2_desc: "Cuando la corona acumula oro, los estamentos se dan cuenta. Los acuerdos parasitarios enriquecen silenciosamente a la nobleza y al clero a expensas de la legitimidad real."
