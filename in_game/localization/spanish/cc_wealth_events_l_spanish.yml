 # Wealth Hoarding Events

 cc_wealth.1.title: "Mantener las apariencias"
 cc_wealth.1.desc: "Nuestro tesoro ha crecido más allá de toda necesidad práctica. La corte se inquieta: los nobles chismorrean sobre la tacañería y las potencias menores observan nuestra inmovilidad con curiosidad. Las apariencias deben mantenerse, de una forma u otra."
 cc_wealth.1.a: "Organiza las grandes ceremonias."
 cc_wealth.1.b: "Nuestras monedas tienen mejores usos que el espectáculo."

 cc_wealth.2.title: "Una fiesta fastuosa"
 cc_wealth.2.desc: "Nuestros ministros han propuesto una celebración extraordinaria: una reunión de cortes, un festival del reino. Costaría una suma considerable, pero el prestigio obtenido bien podría valer el gasto."
 cc_wealth.2.a: "No escatimes en gastos. Deja que se maravillen."
 cc_wealth.2.b: "Bastará con una velada tranquila."

 cc_wealth.3.title: "La nobleza exige construcción"
 cc_wealth.3.desc: "La alta nobleza se ha vuelto inquieta. Nuestro tesoro, dicen, debería destinarse a obras tangibles: fortificaciones, complejos señoriales e instituciones que consoliden el poder noble. Han venido con un precio."
 cc_wealth.3.a: "Financia la construcción."
 cc_wealth.3.b: "Nuestro tesoro es nuestro para conservarlo."

 cc_wealth.5.title: "Los mercaderes exigen inversión"
 cc_wealth.5.desc: "La clase burguesa se ha impacientada. Argumentan que nuestro tesoro acumulado debería emplearse en expandir la infraestructura comercial. Han presentado una propuesta, y un precio."
 cc_wealth.5.a: "Financia la expansión."
 cc_wealth.5.b: "Sus ambiciones no son nuestra obligación."

 cc_wealth.6.title: "El Clero Exige Obras Sagradas"
 cc_wealth.6.desc: "El clero ha observado la magnitud de nuestro tesoro con preocupación espiritual. La riqueza acumulada no trae bendiciones, dicen; solo las obras dedicadas a lo divino pueden justificar tal acumulación. Han fijado un precio."
 cc_wealth.6.a: "Financia las obras sagradas."
 cc_wealth.6.b: "El tesoro no es un diezmo."

 cc_wealth.4.title: "Una llegada ambiciosa"
 cc_wealth.4.desc: "Se ha extendido la noticia de la prosperidad de nuestro reino. Una figura capaz —erudito, soldado o estadista— ha llegado a la corte buscando empleo. Sus servicios tienen un precio, pero el talento de este tipo rara vez se presenta dos veces."
 cc_wealth.4.a: "Los recibimos. Pagad el precio."
 cc_wealth.4.b: "Tenemos suficiente en la corte."

