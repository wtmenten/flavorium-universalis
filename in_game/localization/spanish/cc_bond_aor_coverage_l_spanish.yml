l_spanish:
 # === cc_bonds.150 — The Client Regime Holds ===
 cc_bonds.150.title: "El régimen cliente resiste"
 cc_bonds.150.desc: "Los gobiernos clientes son lo primero que desaparece en una era como esta, y [bond_subj.GetName] no ha desaparecido. Los hombres que instalamos siguen en sus despachos, siguen firmando nuestra correspondencia y, al parecer, aún pueden caminar por su propia capital. Hiciera falta que hiciéramos en las décadas de administración silenciosa, el resultado fue un régimen con una base electoral propia en lugar de una guarnición y una nómina."
 cc_bonds.150.desc.deep: "El gobierno de [bond_subj.GetName] ha sobrevivido a un año que eliminó a tres de sus vecinos, y lo hizo sin pedirnos tropas. Sus ministros salieron y defendieron el acuerdo en público, y suficientes personas encontraron el argumento persuasivo. Un estado cliente que puede defenderse políticamente ya no es realmente un estado cliente. Es un aliado que casualmente nos debe dinero."
 cc_bonds.150.a: "No cambiar nada. El acuerdo está funcionando."
 cc_bonds.150.b: "dele una base formal. Ya no necesita nuestra guarnición."

 # === cc_bonds.151 — The Client Regime Falls ===
 cc_bonds.151.title: "Cae el régimen cliente"
 cc_bonds.151.desc: "El gobierno de [bond_subj.GetName] ha perdido el control de su propia capital. Nuestros ministros informan desde una casa de campo a las afueras de la ciudad, lo cual es una forma diplomática de decir que la han abandonado. El régimen que instalamos nunca adquirió una base electoral más allá de las oficinas que pagamos y, en un año en el que tales cosas han importado, la carencia se ha convertido en la historia completa."
 cc_bonds.151.desc.deep: "Ya no hay un gobierno en [bond_subj.GetName] que responda ante nosotros. El ministerio ha sido disuelto por una multitud, nuestro residente ha recibido salvoconducto hacia la frontera, y los hombres que ahora emiten proclamas citan los términos de nuestro propio tratado de clientela como evidencia de lo que se les hizo. No estamos negociando. Nos están usando como un argumento."
 cc_bonds.151.desc.scholar: "Los hombres que ahora gobiernan [bond_subj.GetName] son los estudiantes del erudito que habíamos silenciado. Él no vivió para ver esto, algo que mencionan varias de las proclamaciones. Suprimir el argumento hace décadas no lo resolvió; solo garantizó que cuando el argumento finalmente ganara, ganaría con nuestro nombre unido al lado equivocado."
 cc_bonds.151.a: "Vuelva a sostenerlo. Cueste lo que cueste ahora."
 cc_bonds.151.b: "Instale uno nuevo. Esta vez con una guarnición que lo respalde."
 cc_bonds.151.c: "Desconocerlo. Nunca valió la pena la credibilidad."

 # === cc_bonds.152 — The Council Seat Proves Its Worth ===
 cc_bonds.152.title: "El asiento en el consejo demuestra su valor"
 cc_bonds.152.desc: "Cuando incorporamos a [bond_subj.GetName] al Consejo Imperial fue un gesto, y los gestos son baratos. Ha dejado de serlo. Su delegado ha pasado esta sesión defendiendo nuestra posición ante miembros que vacilaban, bajo el argumento de que ahora es también su posición. Resulta que un asiento en la mesa es algo duradero una vez que se le ha dado a alguien."
 cc_bonds.152.desc.deep: "El delegado de [bond_subj.GetName] ha hecho más en esta sesión que votar con nosotros. Ha mantenido unido al consejo durante un mes en el que podría haberse disuelto fácilmente, ha mediado entre dos miembros que no hablarían con nosotros directamente y ha planteado todo el asunto como el consejo gobernándose a sí mismo en lugar de la corona gobernando al consejo. Que es exactamente lo que queríamos que fuera, aunque no lo esperábamos del todo."
 cc_bonds.152.a: "Que el consejo se encargue del acuerdo. Para eso está."
 cc_bonds.152.b: "Elévelos a socio federal pleno. Se han ganado el resto."

 # === cc_bonds.153 — The Council Seat Was Never Enough ===
 cc_bonds.153.title: "El asiento en el consejo nunca fue suficiente"
 cc_bonds.153.desc: "El delegado de [bond_subj.GetName] ha expuesto, en una sesión que no pudimos aplazar, exactamente cuánto vale el asiento en el consejo. Puede hablar, y ha hablado, y nada ha resultado de ello. No está pidiendo más tiempo de palabra. Está preguntando para qué sirve el asiento, y la respuesta honesta es una que preferiríamos no dar en público."
 cc_bonds.153.desc.deep: "La delegación de [bond_subj.GetName] se ha retirado del consejo y ha publicado sus razones. El documento es calmado y enumera cada moción que presentaron durante cuarenta años, con el voto y el resultado al lado. El patrón no es halagador. Ellos depositaron en la institución más buena fe de la que nosotros lo hicimos, y han terminado de hacerlo frente a todos los demás miembros."
 cc_bonds.153.a: "Amplíe el asiento para convertirlo en una participación real en el poder."
 cc_bonds.153.b: "Recuérdeles qué era el asiento: una cortesía, no un derecho."

 # === cc_bonds.154 — One Nation, Two Languages ===
 cc_bonds.154.title: "Una Nación, Dos Idiomas"
 cc_bonds.154.desc: "[bond_subj.GetName] llegó a nosotros hablando otro idioma y rezando de manera diferente, y nunca resolvimos eso. En una era en la que la identidad es el argumento que todo el mundo sostiene, lo no resuelto ha resultado ser una ventaja. A su gente no se le pide que elija entre lo que son y lo que somos nosotros, así que no están eligiendo. Los revolucionarios de otros lugares están encontrando que esta es una provincia difícil en la que trabajar."
 cc_bonds.154.desc.deep: "El acuerdo en [bond_subj.GetName] se ha mantenido tan completamente que ha empezado a funcionar a la inversa. Sus cortes funcionan en dos idiomas y nadie lo comenta. Su nobleza envía hijos a nuestras academias y la nuestra envía hijos de vuelta. Cuando llegaron los panfletos revolucionarios prometiendo una nación para cada pueblo, el argumento no cuajó, porque la cuestión de a quién pertenece esta nación fue respondida aquí hace dos generaciones de una manera que satisfizo a todos."
 cc_bonds.154.desc.scholar: "El erudito que patrocinamos produjo aquello que hizo esto posible: un cuerpo de trabajo en su idioma que trata la unión como su propio sujeto en lugar de como una imposición. Sus escuelas lo enseñan. Las nuestras han empezado a hacerlo. Cuando llegaron los panfletos preguntando si un pueblo puede pertenecer a un imperio sin dejar de ser un pueblo, [bond_subj.GetName] ya tenía el equivalente a una biblioteca de respuestas."
 cc_bonds.154.a: "Déjelo como está. Funciona porque nadie lo legisló."
 cc_bonds.154.b: "Inscríbalo en la ley, y deje que los nobles se quejen."

 # === cc_bonds.155 — The Old Language Comes Back ===
 cc_bonds.155.title: "Regresa la lengua antigua"
 cc_bonds.155.desc: "Los estatutos de asimilación se aplicaron en [bond_subj.GetName] mientras fue posible aplicarlos, y este es el año en que dejó de serlo. La lengua antigua ha vuelto a las cortes, a las escuelas y a las imprentas, y ha vuelto enfadada. Lo que suprimimos no desapareció; esperó, y adquirió un agravio para acompañarlo."
 cc_bonds.155.desc.deep: "[bond_subj.GetName] ha derogado nuestros estatutos sin consultarnos, lo cual no es una potestad que posea. La señalética, la liturgia, los registros judiciales y el currículo escolar han revertido en menos de una estación, y la velocidad del proceso indica que el aparato para la reversión fue ensamblado hace tiempo y se mantuvo listo. La era revolucionaria no creó esto. Solo eliminó la última razón para seguir esperando."
 cc_bonds.155.desc.faith: "Los viejos ritos y el viejo lenguaje han regresado a [bond_subj.GetName] juntos, que era como siempre regresarían. La conversión que ordenamos fue obedecida pero nunca aceptada, y el clero que la administró es el que ahora la deshace, con los registros para probar que ellos tampoco creyeron en ella. La fe y el lenguaje son un solo agravio aquí, y lo creamos de un solo golpe."
 cc_bonds.155.desc.scholar: "El renacimiento en [bond_subj.GetName] está siendo liderado desde la imprenta que fundó el erudito reprimido y que nosotros permitimos que siguiera operando bajo la teoría de que era inofensiva. Imprimió diccionarios y gramáticas durante cuarenta años. En una era que ha convertido el lenguaje en una cuestión política, cuarenta años de filología silenciosa han resultado ser lo más efectivo que alguien haya hecho jamás en esa provincia."
 cc_bonds.155.a: "Derogue los estatutos. Nunca valieron lo que costaron."
 cc_bonds.155.b: "Imponerlos con más fuerza. La ley es la ley."

 # === Rebel name for cc_bonds_aor_spawn_sympathy_revolt ===
 cc_bond_sympathy_rebels: "Simpatizantes de las colonias"
