l_spanish:
 # ============================================================
 # Cabinet Experience — the court ledger panel
 #
 # Panel: in_game/gui/panels/situation/cc_cabinet_court.gui
 # Situation: in_game/common/situations/cc_cabinet_court.txt
 # ============================================================

 # The situation's own name, shown on the header icon.
 cc_cabinet_court: "La Corte"
 cc_cabinet_court_desc: "Un registro permanente de quién sirve a la corona, qué han aprendido y cuánto camino le queda por recorrer a cada uno de ellos."

 CC_XP_COURT_HEADER: "La Corte"
 CC_XP_COURT_DESC: "Cada ministro y cada protegido patrocinado, con lo que han hecho de sí mismos hasta ahora.\n\nLa #Y Antigüedad#! es el nivel junto a cada nombre, del 1 al 10. Proviene de la experiencia total en las tres ramas y refleja todo lo que una persona ha pasado. Determina su posición en la corte.\n\nLa #Y Especialización#! es el nivel mostrado en cada rama, del 0 al 3. Proviene de la experiencia propia de esa rama y es lo que decide qué rasgos están a su alcance. Un ministro puede tener mucha antigüedad y seguir siendo un soldado de nivel 0.\n\nLa experiencia proviene de los cargos que ocupan, los años que sirven, las guerras, leyes y matrimonios que el reino lleva a cabo, y cualquier cosa que estés dispuesto a gastar en su formación."

 CC_XP_SECTION_CABINET: "MINISTROS EN FUNCIONES"
 CC_XP_SECTION_PROTEGES: "PROTEGIDOS"
 CC_XP_NO_PROTEGES: "Nadie está siendo preparado. Elige a un protegido a través de las interacciones de un personaje para tener un sucesor listo antes de que quede una vacante."

 CC_XP_LEVEL_LABEL: "nivel"
 CC_XP_LEVEL_MAX: "En la cima de su carrera."
 CC_XP_SENIORITY_TT: "Progreso hacia el siguiente nivel de antigüedad. El nivel se obtiene a partir de la experiencia total en las tres ramas y otorga una bonificación creciente a la eficacia con la que trabaja esta persona."

 CC_XP_COL_ADM: "ADM"
 CC_XP_COL_DIP: "DIP"
 CC_XP_COL_MIL: "MIL"
 CC_XP_TRACK_ADM_TT: "Experiencia administrativa y el nivel alcanzado. Proviene de tareas administrativas, leyes implementadas y tiempo en la cancillería. Nivel 1 a los 150, nivel 2 a los 500, nivel 3 a los 1200."
 CC_XP_TRACK_DIP_TT: "Experiencia diplomática y el nivel alcanzado. Proviene de las funciones diplomáticas, los matrimonios reales y el circuito de embajadas. Nivel 1 a los 150, nivel 2 a los 500, nivel 3 a los 1200."
 CC_XP_TRACK_MIL_TT: "Experiencia militar y el nivel alcanzado. Proviene de las funciones militares, las guerras ganadas y el colegio de estado mayor. Nivel 1 a los 150, nivel 2 a los 500, nivel 3 a los 1200."

 CC_XP_STATUS_AWAY: "ausente"
 CC_XP_STATUS_AWAY_TT: "Actualmente en un puesto, o organizando un examen cortesano. No pueden ser enviados a otro lugar ni recibir un alumno hasta que regresen."
 CC_XP_STATUS_MENTORED: "tutorizado"
 CC_XP_STATUS_MENTORED_TT: "Ser instruido por un ministro veterano y ganar experiencia cada año en aquello en lo que ese mentor sea más fuerte."

 # ============================================================
 # Cabinet Experience — cabinet card badge
 # (in_game/gui/shared/cc_xp_cabinet_card.gui)
 # ============================================================
 CC_XP_CARD_LVL: "nv"
 CC_XP_CARD_LEVEL_TT: "Antigüedad, del 1 al 10. Se obtiene a partir de la experiencia total en las tres ramas y otorga una bonificación creciente a la eficacia con la que trabaja este ministro. Abre el panel de la Corte para ver el registro completo."
 CC_XP_TAB_PATRONAGE: "Mecenazgo"
 CC_XP_TAB_SCHOOLS: "Escuelas"
 CC_XP_WORKS_LABEL: "Obras en el reino"
 CC_XP_ARTISTS_LABEL: "Artistas vivos"
 CC_XP_NO_ARTISTS: "No hay artistas trabajando en el reino. Los artistas aparecen a través del sistema de cultura; entonces se puede asignar a un ministro para que patrocine a uno."
 CC_XP_HAS_PATRON: "patrocinado"
 CC_XP_HAS_PATRON_TT: "Un ministro ha respaldado a este artista con su nombre y su dinero. La corona gana prestigio mientras dure el acuerdo, y el ministro gana experiencia diplomática."
 CC_XP_WORKS_BY_TT: "Obras completadas por este artista."
 CC_XP_NO_SCHOOLS: "No se han fundado instituciones. Construye una universidad en tu capital y luego haz que un ministro superior funde una escuela bajo su propia disciplina."
 CC_XP_SCHOOL_FOUNDED_BY: "fundado por"
 CC_XP_SCHOOL_TEACHES: "enseña"
 CC_XP_SCHOOL_FOUNDER_DEAD: "(fundador fallecido)"
 CC_XP_SCHOOL_FOUNDER_DEAD_TT: "El fundador ha muerto y la escuela continúa sin él. Esa es la diferencia entre una institución y una reputación."
 CC_XP_SCHOOLS_DESC: "Una escuela de pensamiento es una institución permanente: enseña la disciplina de su fundador a todos los inscritos, estén en el cargo o no, y sigue enseñando después de que el fundador ha muerto.\n\nUn reino puede tener como máximo tres. La primera requiere una universidad en la capital, la segunda el avance de Órdenes Eruditas y la tercera Administración Iluminada."
 CC_XP_BTN_SELL_WORK: "Vender una obra"
 CC_XP_BTN_SPONSOR: "Patrocinar a un artista"
 CC_XP_BTN_FOUND: "Fundar una institución"
 CC_XP_BTN_ENROL: "Inscribirse"
 CC_XP_ARTISTS_HEADER: "ARTISTAS EN EL REINO"
 CC_XP_SCHOOLS_HEADER: "INSTITUCIONES"
 CC_XP_SLOT_OPEN: "Se puede fundar una institución"
 CC_XP_SLOT_LOCKED: "Aún no desbloqueado"
 CC_XP_SLOT_REQ_1: "Requiere una universidad en la capital."
 CC_XP_SLOT_REQ_2: "Requiere el avance de Órdenes Eruditas."
 CC_XP_SLOT_REQ_3: "Requiere el avance de Administración Iluminada."
