l_spanish:

 ########################
 # AGE-SPECIFIC TRAIT NAMES & DESCRIPTIONS
 ########################

 eastern_pragmatist: "Pragmático oriental"
 desc_eastern_pragmatist: "Alimentado por las tradiciones intelectuales de Oriente, este asesor aplica una cultura de administración académica de hace siglos a los desafíos de la época. Las instituciones se difunden con mayor eficiencia y el desarrollo tiene un coste moderado."
 eastern_pragmatist_die_desc: "Una voz moderada ha dejado la corte. La erudición y la disciplina administrativa que defendieron dejan un legado más silencioso que el de muchos, y quizás uno más duradero."

 sufi_scholar: "Erudito Sufí"
 desc_sufi_scholar: "Impregnada de las tradiciones místicas y racionales del saber islámico, esta asesora tiende un puente entre la doctrina y la investigación. El trabajo misionero se agudiza, los herejes reciben una escucha más paciente y la alfabetización crece silenciosamente."
 sufi_scholar_die_desc: "Los círculos de aprendizaje que este ministro mantuvo vivos no serán fáciles de reemplazar."

 cautious_merchant: "Mercader cauteloso"
 desc_cautious_merchant: "Comerciante por instinto, este consejero ve las apuestas coloniales con sospecha: los rendimientos son demasiado lentos, los riesgos demasiado grandes. El comercio florece bajo su guía, pero las expediciones pierden a un defensor silencioso."
 cautious_merchant_die_desc: "Los libros de cuentas mantenidos equilibrados por esta mano cuidadosa sobreviven a la propia mano por una generación."

 reformist_theologian: "Teólogo reformista"
 desc_reformist_theologian: "Las convulsiones religiosas de la época han llegado más allá de la cristiandad. Este consejero, moldeado por las corrientes de renovación doctrinal dentro de su propia tradición, impulsa la conversión con el celo de un reformador y la precisión de un erudito."
 reformist_theologian_die_desc: "Los debates internos que este ministro provocó continuarán sin él."

 orthodox_defender: "Defensor de la Fe"
 desc_orthodox_defender: "En un mundo de doctrinas cambiantes, este asesor se mantiene firme en las enseñanzas establecidas. La herejía no debe tolerarse: la creencia correcta debe defenderse, sea cual sea la exigencia de la época."
 orthodox_defender_die_desc: "Las tradiciones que este ministro defendió permanecen, al menos por ahora."

 crown_theologian: "Teólogo de la Corona"
 desc_crown_theologian: "Este asesor navega el delicado terreno entre la iglesia y la corona. Al mantener satisfecho al clero y intactas las prerrogativas del rey, preserva un equilibrio que ninguna de las dos partes respalda plenamente, pero con el que ambas pueden convivir."
 crown_theologian_die_desc: "El cuidadoso equilibrio mantenido entre la corte y el clero se verá seriamente puesto a prueba ahora que este ministro ha partido."

 renaissance_humanist: "Humanista renacentista"
 desc_renaissance_humanist: "Moldeado por el florecimiento de las artes y el saber, este asesor defiende el libre intercambio de ideas. Acelera la difusión de nuevas instituciones y fomenta la alfabetización dondequiera que sirva."
 renaissance_humanist_die_desc: "[CHARACTER.GetName] ha muerto. Las bibliotecas que [CHARACTER.GetSheHe] fundó y los eruditos que [CHARACTER.GetSheHe] mentorizó llevarán adelante [CHARACTER.GetHerHis] legado."

 age_of_discovery_pioneer: "Pionero del Descubrimiento"
 desc_age_of_discovery_pioneer: "Forjado en la Era de los Descubrimientos, este asesor arde con el espíritu de exploración. La velocidad de las expediciones aumenta y las empresas coloniales atraen a más almas dispuestas."
 age_of_discovery_pioneer_die_desc: "[CHARACTER.GetName] se ha ido, y las costas inexploradas que [CHARACTER.GetSheHe] cartografió permanecen como testimonio de un alma inquieta."

 age_of_discovery_skeptic: "Escéptico de los mares"
 desc_age_of_discovery_skeptic: "Este asesor aconseja precaución: las rutas marítimas son traicioneras y los rendimientos inciertos. Las expediciones bajo su sombra avanzan con más vacilación."
 age_of_discovery_skeptic_die_desc: "[CHARACTER.GetName] ha fallecido. Quizás [CHARACTER.GetSheHe] tenía razón al ser cauteloso."

 reformation_preacher: "Predicador de la Reforma"
 desc_reformation_preacher: "Moldeado por las grandes convulsiones religiosas de la época, este asesor predica la tolerancia como camino hacia la paz. Los herejes encuentran un oído más comprensivo en la corte y los esfuerzos de conversión se revitalizan."
 reformation_preacher_die_desc: "[CHARACTER.GetName] ha muerto, y las voces moderadas que [CHARACTER.GetSheHe] defendió se vuelven un poco más silenciosas."

 reformation_inquisitor: "Inquisidor de la Reforma"
 desc_reformation_inquisitor: "Producto de las guerras confesionales, este asesor ve la diferencia de fe como una amenaza existencial. La tolerancia hacia herejes y paganos sufre bajo su consejo."
 reformation_inquisitor_die_desc: "[CHARACTER.GetName] ha muerto. Pocos lamentaron su partida; menos aún lamentarán la desaparición de sus rígidas certezas[CHARACTER.GetHerHim][CHARACTER.GetHerHis]."

 absolute_administrator: "Administrador Absoluto"
 desc_absolute_administrator: "Formado en la doctrina de la autoridad soberana, este asesor refuerza el control de la corona sobre los asuntos locales. El control se extiende con más facilidad, pero los estamentos se sienten asfixiados por la centralización."
 absolute_administrator_die_desc: "[CHARACTER.GetName] ha muerto. La maquinaria de control que [CHARACTER.GetSheHe] construyó sobrevivirá a [CHARACTER.GetHerHim]."

 noble_patron: "Patrón noble"
 desc_noble_patron: "Este asesor sabe que la buena voluntad de la nobleza vale más que el simple oro. La nobleza prospera bajo su cuidadosa gestión, aunque se desalienta discretamente el enriquecimiento de las grandes casas."
 noble_patron_die_desc: "[CHARACTER.GetName] se ha ido, y la nobleza que [CHARACTER.GetSheHe] cultivó tardará un tiempo en encontrar un nuevo patrón."

 parliamentarian: "Parlamentario"
 desc_parliamentarian: "Un operador experto en los pasillos del parlamento, este asesor construye amplias coaliciones y persuade a los miembros reacios para obtener sus votos, aunque revocar los privilegios nobiliarios resulta más costoso cuando ellos tienen influencia."

 privilege_reformer: "Reformador del privilegio"
 desc_privilege_reformer: "Este asesor cree que la autoridad soberana no debe verse obstaculizada por prerrogativas estamentales obsoletas. Revocar privilegios resulta más barato, aunque los nobles resienten cada paso."
 privilege_reformer_die_desc: "[CHARACTER.GetName] se ha ido, y los estamentos dejan escapar un suspiro de alivio."

 revolutionary_agitator: "Agitador revolucionario"
 desc_revolutionary_agitator: "Arrastrado por las corrientes de la revolución, la retórica de este consejero inflama tanto como inspira. Las facciones rebeldes encuentran terreno fértil dondequiera que [CHARACTER.GetSheHe] ocupe un cargo."
 revolutionary_agitator_die_desc: "[CHARACTER.GetName] ha muerto. Queda por ver si los fuegos que [CHARACTER.GetSheHe] encendió se apagarán o se propagarán."

 counterrevolutionary: "Contrarrevolucionario"
 desc_counterrevolutionary: "Este asesor ve la revolución como una catástrofe que debe evitarse a cualquier precio, incluso a costa de satisfacer a los mismos estamentos cuya cooperación necesita la corona. Revocar privilegios se vuelve más difícil a medida que atrincheran los intereses reaccionarios."
 counterrevolutionary_die_desc: "[CHARACTER.GetName] ha fallecido. Es posible que el orden que [CHARACTER.GetSheHe] trabajó para preservar no sobreviva mucho tiempo a [CHARACTER.GetHerHim]."

 privilege_champion: "Defensor del privilegio"
 desc_privilege_champion: "En una era de revolución, este asesor lucha por reducir las cargas de la corona eliminando las prerrogativas de los estamentos. Es más barato revocarlas, pero la prosperidad sufre a medida que la confianza institucional flaquea."
 privilege_champion_die_desc: "[CHARACTER.GetName] se ha ido, y los privilegios que [CHARACTER.GetSheHe] luchó por abolir podrían encontrar nuevos defensores."

 ########################
 # COUNTRY MODIFIERS
 ########################

 cc_cabinet_ministerial_investment: "Inversión Ministerial"
 cc_cabinet_ministerial_investment_desc: "Un miembro del gabinete ha destinado fondos públicos a mejoras duraderas en la posición diplomática y la prosperidad nacional."

 cc_cabinet_revoke_difficulty: "Resistencia de los Estamentos"
 cc_cabinet_revoke_difficulty_desc: "Los estamentos envalentonados están dificultando que la corona revoque sus privilegios."

 cc_cabinet_parliamentary_guidance: "Guía parlamentaria"
 cc_cabinet_parliamentary_guidance_desc: "Una mano parlamentaria experta en el gabinete está mejorando la influencia de la corona sobre la cámara."

 cc_cabinet_diplomatic_influence: "Influencia diplomática"
 cc_cabinet_diplomatic_influence_desc: "La diplomacia activa de un miembro del gabinete ha reducido el antagonismo que nuestros vecinos dirigen hacia nosotros."

 cc_cabinet_provincial_flourishing: "Florecimiento provincial"
 cc_cabinet_provincial_flourishing_desc: "La atención de un ministro ha revitalizado la prosperidad de esta provincia."

 cc_cabinet_pop_conversion: "Impulso de Conversión Ministerial"
 cc_cabinet_pop_conversion_desc: "Un miembro del gabinete está promoviendo activamente la conversión religiosa en todo el reino."

 cc_cabinet_cultural_outreach: "Difusión cultural"
 cc_cabinet_cultural_outreach_desc: "Un ministro está fomentando el intercambio cultural y la alfabetización en esta provincia."

 ########################
 # TRAIT EVENT LOCALIZATION (cc_traits namespace)
 ########################

 # cc_traits.1 — Integration Trait Grant
 cc_traits.1.title: "Comienza el Trabajo de Integración"
 cc_traits.1.desc: "Nuestro ministro [minister.GetName], asignado para supervisar los esfuerzos de integración, ha encontrado su ritmo. Su enfoque refleja sus capacidades y dejará una marca duradera en la forma en que se lleva a cabo el trabajo."
 cc_traits.1.a: "Permitir que [minister.GetName] proceda como un [ShowTraitName('iron_integrator')]."
 cc_traits.1.b: "Permitir que [minister.GetName] proceda como un [ShowTraitName('master_integrator')]."
 cc_traits.1.c: "Permitir que [minister.GetName] proceda como un [ShowTraitName('able_integrator')]."
 cc_traits.1.d: "Permitir que [minister.GetName] proceda como un [ShowTraitName('fumbling_integrator')]."
 cc_traits.1.e: "Reconsiderémoslo"

 # ========================
 # NEW AGE TRAITS (cc_traits.30-39)
 # ========================

 dogmatic_zealot: "Zelote Dogmático"
 desc_dogmatic_zealot: "Los fuegos de la agitación religiosa no han abierto la mente de este ministro; la han sellado. Como rígido defensor de la doctrina ortodoxa, ha hecho que nuestra corte sea menos tolerante con el disenso y más dependiente de la buena voluntad clerical."
 dogmatic_zealot_die_desc: "[CHARACTER.GetName] ha fallecido. Pocos echarán de menos las rígidas certezas que [CHARACTER.GetSheHe] impuso, aunque el clero podría hacerlo."

 empiricist_counselor: "Consejero Empirista"
 desc_empiricist_counselor: "Moldeado por los nuevos métodos de observación y experimentación, este ministro aplica un riguroso enfoque empírico a la gobernanza. Bajo su influencia, la investigación se acelera y la difusión de una administración alfabetizada se amplía discretamente."
 empiricist_counselor_die_desc: "[CHARACTER.GetName] ha muerto. Los hábitos de indagación cuidadosa que [CHARACTER.GetSheHe] modeló persistirán más que cualquier descubrimiento específico que [CHARACTER.GetSheHe] haya realizado."

 civic_chancellor: "Canciller civil"
 desc_civic_chancellor: "Donde otros ministros ven ciudades, este asesor ve sistemas de gobernanza esperando ser optimizados. Su dominio de la reforma urbana ha reducido el coste de la construcción y ha convertido al gabinete en un instrumento más eficiente de la voluntad de la corona."
 civic_chancellor_die_desc: "[CHARACTER.GetName] ha fallecido. La maquinaria cívica que [CHARACTER.GetSheHe] ajustó seguirá funcionando, pero las máquinas necesitan mecánicos."

 chief_cartographer: "Cartógrafo jefe"
 desc_chief_cartographer: "Los espacios en blanco de un mapa no son ignorancia, sino oportunidad. Este ministro ha convertido nuestras ambiciones exploratorias en una empresa sistemática, acelerando las expediciones y atrayendo a nuevos colonos hacia la frontera."
 chief_cartographer_die_desc: "[CHARACTER.GetName] ha muerto. Los mapas que [CHARACTER.GetSheHe] encargó y corrigió guiarán nuestros barcos mucho después de que la mano del cartógrafo haya quedado inmóvil."

 trade_consortium_minister: "Ministro del Consorcio Comercial"
 desc_trade_consortium_minister: "El comercio es el sistema nervioso del imperio, y este ministro comprende cada nodo de la red. Los centros comerciales florecen bajo su guía, y la capacidad diplomática crece con cada nueva relación mercantil que cultiva."
 trade_consortium_minister_die_desc: "[CHARACTER.GetName] ha fallecido. Las relaciones comerciales que [CHARACTER.GetSheHe] mantuvo persistirán; los mercaderes son leales al beneficio, no a los ministros."

 peace_commissioner: "Comisionado de Paz"
 desc_peace_commissioner: "Este ministro ha convertido la tolerancia en un instrumento geopolítico. Al reducir la fricción entre confesiones, ha disminuido el antagonismo que nuestros vecinos dirigen hacia nosotros y ha ganado un margen de maniobra que el conflicto abierto habría cerrado."
 peace_commissioner_die_desc: "[CHARACTER.GetName] ha muerto. Las frágiles tolerancias que [CHARACTER.GetSheHe] mantuvo serán puestas a prueba ahora. Esperemos que el precedente se mantenga."

 theological_statesman: "Estadista teológico"
 desc_theological_statesman: "Para este ministro, la fe y la gobernanza no son ámbitos separados: son el mismo proyecto. Al alinear los intereses clericales con la agenda legislativa de la corona, han logrado que el parlamento sea más manejable y que el clero esté más comprometido con el éxito del reino."
 theological_statesman_die_desc: "[CHARACTER.GetName] ha muerto. El cuidadoso equilibrio que [CHARACTER.GetSheHe] mantuvo entre la iglesia y el parlamento requerirá una habilidad extraordinaria para preservarse."

 standing_army_advocate: "Defensor del ejército permanente"
 desc_standing_army_advocate: "La era de la leva temporal ha terminado; este ministro ha convertido la doctrina del ejército permanente en el cimiento definitivo de nuestro poder militar. La disciplina ha mejorado, los costes de fortificación han bajado y la nobleza ha encontrado un nuevo argumento para su indispensabilidad."
 standing_army_advocate_die_desc: "[CHARACTER.GetName] ha muerto. La cultura militar profesional que [CHARACTER.GetSheHe] defendió sobrevivirá a [CHARACTER.GetHerHim]: los ejércitos permanentes, como todas las instituciones, adquieren su propio impulso."

 tax_inspector_general: "Inspector General de Impuestos"
 desc_tax_inspector_general: "Ninguna moneda queda sin contar y ninguna exención pasa sin ser escrutada mientras este ministro ocupe su cargo. El gasto de la corte ha disminuido, la eficiencia del gabinete ha aumentado y el tesoro ha aprendido a temer sus auditorías."
 tax_inspector_general_die_desc: "[CHARACTER.GetName] ha muerto. Los libros de contabilidad que [CHARACTER.GetSheHe] mantuvo en un orden tan impecable serán la primera víctima de un sucesor menos diligente."

 national_reformer: "Reformador nacional"
 desc_national_reformer: "En la era de las revoluciones, este ministro ha encontrado un camino intermedio: la reforma sistemática a través del proceso parlamentario. Los cambios gubernamentales costosos se vuelven más asequibles y la base de apoyo del parlamento crece allí donde trabajan."
 national_reformer_die_desc: "[CHARACTER.GetName] ha muerto. Las reformas que [CHARACTER.GetSheHe] aprobó en el parlamento son permanentes; la tradición reformista que [CHARACTER.GetSheHe] estableció no lo es."

 industrial_visionary: "Visionario Industrial"
 desc_industrial_visionary: "Este ministro ha vislumbrado el futuro en una imprenta y un horno. La aplicación de nuevos métodos mecánicos a la construcción y la producción ha reducido los costes de edificación y acelerado el ritmo al que puede crecer nuestro reino."
 industrial_visionary_die_desc: "[CHARACTER.GetName] ha fallecido. Las máquinas que [CHARACTER.GetSheHe] encargó seguirán funcionando sin [CHARACTER.GetHerHim]; ese siempre fue el objetivo."

 # ========================
 # AGE TRAIT EVENTS (cc_traits.30-39)
 # ========================

 cc_traits.30.title: "El Método del Empirista"
 cc_traits.30.desc: "[minister.GetName] ha estado experimentando con los nuevos métodos de indagación sistemática: observación, hipótesis, verificación. Los resultados han sido notados. ¿Cómo dirigiremos esta mente metódica?"
 cc_traits.30.a: "Nombrar a [minister.GetName] como [ShowTraitName('empiricist_counselor')]; que los nuevos métodos guíen nuestro gobierno."
 cc_traits.30.b: "Alentar la indagación de [minister.GetName] sin un nombramiento formal."

 cc_traits.31.title: "El reformador urbano"
 cc_traits.31.desc: "[minister.GetName] ha pasado un tiempo considerable en los talleres y salas del consejo de la capital, catalogando ineficiencias y proponiendo mejoras. Los estamentos burgueses lo han notado. ¿Cómo responderemos?"
 cc_traits.31.a: "Formalizar el papel de [minister.GetName] como [ShowTraitName('civic_chancellor')]; que sistematicen lo que han comenzado."
 cc_traits.31.b: "Apoyar la labor de [minister.GetName] sin un nombramiento formal."

 cc_traits.32.title: "El Encargo del Cartógrafo"
 cc_traits.32.desc: "[minister.GetName] ha estado trabajando estrechamente con nuestros exploradores y navegantes, convirtiendo sus observaciones en cartas sistemáticas. El trabajo es impresionante. ¿Cómo lo dirigiremos?"
 cc_traits.32.a: "Nombrar a [minister.GetName] como nuestro [ShowTraitName('chief_cartographer')] — que los mapas guíen nuestras ambiciones."
 cc_traits.32.b: "Permitir que [minister.GetName] continúe sin un nombramiento formal: otorgar [ShowTraitName('age_of_discovery_skeptic')]."

 cc_traits.33.title: "El Gran Tour del Mercader"
 cc_traits.33.desc: "[minister.GetName] ha regresado de un extenso estudio de nuestras rutas comerciales y territorios vasallos, lleno de propuestas para consolidar nuestra posición comercial. La comunidad mercantil está entusiasmada. ¿Cuál es nuestra respuesta?"
 cc_traits.33.a: "Nombrar a [minister.GetName] como [ShowTraitName('trade_consortium_minister')]; que el comercio se convierta en un instrumento diplomático."
 cc_traits.33.b: "Apoyar la labor comercial de [minister.GetName] sin un ascenso formal."

 cc_traits.34.title: "El gambito del pacificador"
 cc_traits.34.desc: "[minister.GetName] se ha acercado a nuestros vecinos con una propuesta para reducir las tensiones religiosas, un riesgo calculado en una era dividida. Algunos en la corte aplauden la iniciativa; otros lo ven como una debilidad. ¿Cómo respondemos?"
 cc_traits.34.a: "Respaldar la labor pacificadora de [minister.GetName]: nombrarlo como nuestro [ShowTraitName('peace_commissioner')]."
 cc_traits.34.b: "Rechazar la propuesta: la tolerancia es una concesión a la herejía; otorga [ShowTraitName('dogmatic_zealot')]."
 cc_traits.34.c: "Permita que [minister.GetName] continúe discretamente, sin un nombramiento formal."

 cc_traits.35.title: "El estadista teológico"
 cc_traits.35.desc: "[minister.GetName] ha estado tendiendo puentes entre el clero y la cámara parlamentaria, un proyecto delicado que parece estar funcionando. ¿Cómo reconoceremos formalmente este logro?"
 cc_traits.35.a: "Nombrar a [minister.GetName] como nuestro [ShowTraitName('theological_statesman')]: que la fe y el gobierno se conviertan en un solo proyecto."
 cc_traits.35.b: "Otorgar a [minister.GetName] el título formal de [ShowTraitName('crown_theologian')]."
 cc_traits.35.c: "Elogiar el trabajo de [minister.GetName] sin una elevación formal."

 cc_traits.36.title: "El defensor del ejército permanente"
 cc_traits.36.desc: "[minister.GetName] ha pasado años abogando por la transición a un ejército profesional y permanente, y recientemente ha presentado una propuesta exhaustiva sobre cómo lograrlo. Los nobles se muestran escépticos pero escuchan. ¿Cómo procedemos?"
 cc_traits.36.a: "Respaldar la propuesta de [minister.GetName]: nombrarlo como nuestro [ShowTraitName('standing_army_advocate')]."
 cc_traits.36.b: "Apoyar el concepto sin un nombramiento formal."

 cc_traits.37.title: "El inspector de impuestos"
 cc_traits.37.desc: "[minister.GetName] ha realizado una auditoría exhaustiva de los gastos de la corona y ha presentado un conjunto de recomendaciones desalentadoras. La corte está incómoda, pero los números no mienten. ¿Cómo respondemos?"
 cc_traits.37.a: "Nombrar a [minister.GetName] como [ShowTraitName('tax_inspector_general')]; que se cuente cada moneda."
 cc_traits.37.b: "Adoptar algunas de las recomendaciones de [minister.GetName] sin un nombramiento formal."

 cc_traits.38.title: "El ministro nacional"
 cc_traits.38.desc: "[minister.GetName] ha desarrollado un programa integral de reforma para el sistema parlamentario, una propuesta que podría cambiar el funcionamiento del gobierno durante generaciones. La cámara está observando."
 cc_traits.38.a: "Nombrar a [minister.GetName] como nuestro [ShowTraitName('national_reformer')] — que el parlamento se convierta en un instrumento de cambio duradero."
 cc_traits.38.b: "Adoptar partes del programa de [minister.GetName] sin una elevación formal."

 cc_traits.39.title: "El visionario industrial"
 cc_traits.39.desc: "[minister.GetName] ha regresado de una inspección de los talleres de la capital con los ojos brillantes. Nuevos métodos de producción, nuevos materiales, nuevas posibilidades y una propuesta detallada para implementarlos a escala. Los estamentos burgueses están intrigados."
 cc_traits.39.a: "Nombrar a [minister.GetName] como nuestro [ShowTraitName('industrial_visionary')] — que los nuevos métodos transformen el reino."
 cc_traits.39.b: "Apoyar la iniciativa sin un nombramiento formal."

 # cc_traits.10 — Renaissance-era intellectual trait spawn (culturally branched)
 cc_traits.10.title: "Un erudito de la época"
 cc_traits.10.desc: "[minister.GetName] ha sido moldeado por las grandes corrientes intelectuales de esta era. La forma que toma el aprendizaje puede diferir según la tradición, pero el potencial para canalizarlo hacia el servicio es el mismo."
 cc_traits.10.a: "Un avance bienvenido; que el nuevo saber guíe su trabajo: concede [ShowTraitName('renaissance_humanist')]."
 cc_traits.10.b: "Sigue un camino de sabiduría práctica y arte de gobernar: otorga [ShowTraitName('eastern_pragmatist')]."
 cc_traits.10.c: "El camino del estudio y la contemplación les sienta bien; conceder [ShowTraitName('sufi_scholar')]."
 cc_traits.10.d: "Alentar a [minister.GetName] a seguir observando; el reino podría beneficiarse con el tiempo."

 # cc_traits.11 — Discovery Pioneer / Skeptic / Cautious Merchant
 cc_traits.11.title: "Forjando Nuevos Horizontes"
 cc_traits.11.desc: "La era de las exploraciones ha dejado su huella en [minister.GetName]. ¿Cómo canalizaremos la relación de [minister.GetHerHis] con el mar?"
 cc_traits.11.a: "Alentar la exploración audaz: otorgar [ShowTraitName('age_of_discovery_pioneer')]."
 cc_traits.11.b: "Aconsejar cautela y moderación: otorga [ShowTraitName('age_of_discovery_skeptic')]."
 cc_traits.11.c: "Dirige su energía hacia el comercio, no hacia costas lejanas; concede [ShowTraitName('cautious_merchant')]."
 cc_traits.11.d: "¡Enviarlo a los astilleros!"

 # cc_traits.12 — Reformation / Religious Upheaval traits (culturally branched)
 cc_traits.12.title: "Voces de Reforma"
 cc_traits.12.desc: "Las llamas del cambio religioso han puesto a prueba la fe de [minister.GetName]. Si esa prueba ha abierto su mente o ha fortalecido sus convicciones, dependerá de nuestra guía[minister.GetHerHis][minister.GetHerHis]."
 cc_traits.12.a: "Fomentar la tolerancia y el diálogo: otorgar [ShowTraitName('reformation_preacher')]."
 cc_traits.12.b: "Defender la fe contra la desviación: otorga [ShowTraitName('reformation_inquisitor')]."
 cc_traits.12.c: "Alentar la renovación doctrinal dentro de nuestra tradición: otorgar [ShowTraitName('reformist_theologian')]."
 cc_traits.12.d: "Las enseñanzas establecidas deben defenderse a toda costa: concede [ShowTraitName('orthodox_defender')]."
 cc_traits.12.e: "[minister.GetName] se niega a comprometerse con nada de esto; otorgar [ShowTraitName('dogmatic_zealot')]."

 # cc_traits.13 — Absolutism traits
 cc_traits.13.title: "La gobernanza en la Era de los Reyes"
 cc_traits.13.a: "Enfatiza el control central: otorga [ShowTraitName('absolute_administrator')]."
 cc_traits.13.b: "Cultivar la buena voluntad noble: otorgar [ShowTraitName('noble_patron')]."
 cc_traits.13.c: "Trabajar a través del parlamento: otorga [ShowTraitName('parliamentarian')]."
 cc_traits.13.d: "Reformar la estructura de privilegios: conceder [ShowTraitName('privilege_reformer')]."
 cc_traits.13.e: "Que el teólogo de la corona navegue entre la iglesia y el estado: otorgar [ShowTraitName('crown_theologian')]."

 # cc_traits.14 — Revolutions traits
 cc_traits.14.title: "El espíritu de revolución"
 cc_traits.14.desc: "La era revolucionaria ha llegado a [minister.GetName]. El hecho de que [minister.GetSheHe] cabalgue sobre su ola, se oponga a ella o intente aprovecharla para la corona definirá lo que vendrá después."
 cc_traits.14.a: "Que el espíritu revolucionario fluya: otorgar [ShowTraitName('revolutionary_agitator')]."
 cc_traits.14.b: "Mantenerse firme por el orden y la jerarquía; otorga [ShowTraitName('counterrevolutionary')]."
 cc_traits.14.c: "Aprovechemos el momento para despojar a los estamentos de sus antiguos privilegios: conceda [ShowTraitName('privilege_champion')]."

 # cc_traits.20 — Ruler Teaches
 cc_traits.20.title: "El [Root.GetRulerTitle] ofrece sabiduría"
 cc_traits.20.desc: "Nuestro gobernante ha notado el potencial de [student.GetName]. Con la guía adecuada, [student.GetSheHe] podría convertirse en un ministro de verdadera distinción. ¿Qué conocimientos compartirá la corona?"
 cc_traits.20.a: "Enseñar a [student.GetName] las disciplinas de la guerra y el mando: otorga [ShowTraitName('tactical_advisor')]."
 cc_traits.20.b: "Comparte las artes del saber y la legislación: otorga [ShowTraitName('learned_counselor')]."
 cc_traits.20.c: "Imparte la sabiduría de la lealtad y la diplomacia: concede [ShowTraitName('loyal_steward')]."
 cc_traits.20.d: "En otro momento."

 # cc_traits.21 — Peer Learning
 cc_traits.21.title: "Un joven ministro entusiasta"
 cc_traits.21.a: "Alentar el estudio académico y el aprendizaje: otorgar [ShowTraitName('learned_counselor')]."
 cc_traits.21.b: "Dirige a [learner.GetHerHim] hacia la doctrina militar: otorga [ShowTraitName('tactical_advisor')]."
 cc_traits.21.c: "Guía a [learner.GetHerHim] en diplomacia y arte de gobernar: otorga [ShowTraitName('loyal_steward')]."

 ########################
 # CABINET EVENT LOCALIZATION (cc_cabinet namespace)
 ########################

 # cc_cabinet.1 — The Minister Seeks Counsel
 cc_cabinet.1.title: "El Ministro busca consejo"
 cc_cabinet.1.desc: "[minister.GetName] ha solicitado una audiencia. El consejo del ministro ha sido acertado, y quizás unas palabras de aliento —o una tarea— le vendrían bien. ¿Qué le ofreceremos?"
 cc_cabinet.1.a: "Reconoce la obra académica de [minister.GetHerHis]: otorga [ShowTraitName('learned_counselor')]."
 cc_cabinet.1.b: "Reconoce el servicio de [minister.GetHerHis] al reino: concede [ShowTraitName('loyal_steward')]."
 cc_cabinet.1.c: "Reconoce la perspicacia militar de [minister.GetHerHis]: otorga [ShowTraitName('tactical_advisor')]."
 cc_cabinet.1.d: "Enviarlos de vuelta a sus funciones."

 # cc_cabinet.2 — A Request for Funds
 cc_cabinet.2.title: "Una solicitud de fondos"
 cc_cabinet.2.a: "Conceder los fondos."
 cc_cabinet.2.b: "Rechazar. El tesoro tiene otras necesidades."

 # cc_cabinet.3 — Funds follow-up
 cc_cabinet.3.title: "El Ministro pone los fondos a trabajar"
 cc_cabinet.3.desc: "Los fondos llegaron a manos de [minister.GetName] y fueron utilizados. Llegan noticias de que la inversión ha producido resultados significativos, o al menos eso es lo que dice [minister.GetSheHe]."
 cc_cabinet.3.a: "Recuperamos lo que pudimos."

 # cc_cabinet.4 — Parliamentary Affairs (Age of Absolutism)
 cc_cabinet.4.title: "El Ministro asesora sobre asuntos parlamentarios"
 cc_cabinet.4.desc: "[minister.GetName] ha pasado un tiempo considerable estudiando el funcionamiento del parlamento y cree que hay una oportunidad para fortalecer la mano de la corona dentro de la cámara. ¿Qué rumbo tomaremos?"
 cc_cabinet.4.a: "Trabajar de forma más activa a través de la cámara."
 cc_cabinet.4.b: "[minister.GetName] debería perseguir esto personalmente; otorgar [ShowTraitName('parliamentarian')]."
 cc_cabinet.4.c: "Que lo gestionen como mejor les parezca."

 # cc_cabinet.10 — Courting the Estates
 cc_cabinet.10.title: "Cortejar a los Estados"
 cc_cabinet.10.desc: "[minister.GetName] ha desarrollado conexiones considerables con los grandes estamentos. Ahora tiene la influencia necesaria para alterar el equilibrio de poder entre las casas nobles, pero cada ganancia para un estamento significa una pérdida para otro."
 cc_cabinet.10.a: "Favorecer a la nobleza sobre los mercaderes."
 cc_cabinet.10.b: "Favorecer a los mercaderes sobre la nobleza."
 cc_cabinet.10.c: "Difunde la buena voluntad ampliamente, a costa del tesoro."
 cc_cabinet.10.d: "Dejar que los estamentos actúen por su cuenta."

 # cc_cabinet.11 — Estate Grievances
 cc_cabinet.11.title: "Agravios de los Estamentos"
 cc_cabinet.11.desc: "[minister.GetName] informa que los estamentos tienen agravios que empiezan a agravarse. Si no se atienden, su insatisfacción podría convertirse en un problema. ¿Qué debemos hacer?"
 cc_cabinet.11.a: "Gasta el oro y suaviza las cosas."
 cc_cabinet.11.b: "Ignora las quejas; no rendimos cuentas a nadie."

 # cc_cabinet.12 — Revolutionary Sentiments
 cc_cabinet.12.title: "Sentimientos revolucionarios en la corte"
 cc_cabinet.12.desc: "[minister.GetName] ha regresado de las provincias con relatos de sentimientos revolucionarios entre el pueblo. La era exige una respuesta. ¿Seguiremos la corriente o nos opondremos a ella?"
 cc_cabinet.12.a: "Sigue la energía del cambio: otorga [ShowTraitName('revolutionary_agitator')]."
 cc_cabinet.12.b: "Suprimir estas ideas peligrosas."
 cc_cabinet.12.c: "No es asunto nuestro."

 # cc_cabinet.13 — Minister's Ambitions (Age of Absolutism)
 cc_cabinet.13.title: "Las ambiciones del Ministro"
 cc_cabinet.13.desc: "[minister.GetName] se ha vuelto ambicioso en esta era de consolidación. Han planteado dos caminos ante la corona: uno hacia la reforma y otro hacia un control más estricto. Debemos decidir."
 cc_cabinet.13.a: "Apoyar el impulso para reformar los privilegios de los estamentos: conceder [ShowTraitName('privilege_reformer')]."
 cc_cabinet.13.b: "Centralizar el control —los estamentos se adaptarán— otorgar [ShowTraitName('absolute_administrator')]."
 cc_cabinet.13.c: "Ninguno. Mantener el rumbo actual."

 # cc_cabinet.20 — Diplomatic Overtures
 cc_cabinet.20.title: "Aproximaciones diplomáticas"
 cc_cabinet.20.desc: "[minister.GetName] ha estado cultivando vínculos con [neighbor_country.GetName]. Hay una oportunidad aquí: ¿la usaremos para generar buena voluntad o para reducir discretamente las tensiones que pesan sobre nuestra reputación?"
 cc_cabinet.20.a: "Formalizar nuestra amistad con [neighbor_country.GetName]."
 cc_cabinet.20.b: "Justificar acción agresiva."
 cc_cabinet.20.c: "No intervenir en el asunto."

 # cc_cabinet.21 — Border Tensions
 cc_cabinet.21.title: "Tensiones fronterizas"
 cc_cabinet.21.desc: "[minister.GetName] informa de tensiones latentes a lo largo de la frontera con [neighbor_country.GetName]. Esto podría ser una oportunidad para establecer el dominio o una crisis que debe desactivarse discretamente."
 cc_cabinet.21.a: "Usemos la tensión para hacernos valer."
 cc_cabinet.21.b: "Enviar a [minister.GetName] para apaciguar los asuntos discretamente."

 # cc_cabinet.22 — Overseas Contacts
 cc_cabinet.22.title: "Contactos de ultramar"
 cc_cabinet.22.desc: "La era de la exploración ha abierto canales de contacto que habrían parecido imposibles hace una generación. [minister.GetName] se encuentra en el centro de varias de estas relaciones. ¿Cómo las fomentaremos?"
 cc_cabinet.22.a: "Permitir que [minister.GetName] lidere el camino; la exploración es el futuro: otorgar [ShowTraitName('age_of_discovery_pioneer')]."
 cc_cabinet.22.b: "Usemos estos contactos para mejorar nuestra posición diplomática."
 cc_cabinet.22.c: "Centrarse en las prioridades existentes."

 # cc_cabinet.23 — Religious Tensions Abroad
 cc_cabinet.23.title: "Tensiones religiosas en el extranjero"
 cc_cabinet.23.desc: "La reformación ha fracturado la fe de nuestros vecinos tanto como la nuestra. [minister.GetName] tiene la oportunidad de aprovechar las divisiones religiosas de [neighbor_country.GetName] en nuestro beneficio, o de tender un puente sobre la brecha."
 cc_cabinet.23.a: "Buscar puntos en común con [neighbor_country.GetName]."
 cc_cabinet.23.b: "Explotar las tensiones para nuestro beneficio."
 cc_cabinet.23.c: "Esto no es nuestra preocupación."

 # cc_cabinet.30 — Provincial Investment
 cc_cabinet.30.title: "Inversión provincial"
 cc_cabinet.30.desc: "El trabajo de [minister.GetName] en las provincias ha atraído la atención de los notables locales. Con una inversión modesta, la corona podría acelerar el desarrollo o canalizar esa energía hacia una prosperidad duradera."
 cc_cabinet.30.a: "Invertir en desarrollo directo."
 cc_cabinet.30.b: "Alentar la prosperidad a largo plazo."
 cc_cabinet.30.c: "Dejar que [minister.GetName] actúe por [minister.GetHerHis] cuenta."

 # cc_cabinet.31 — Cultural Affairs
 cc_cabinet.31.title: "Asuntos culturales"
 cc_cabinet.31.desc: "[minister.GetName] ha estado en contacto con las comunidades locales en [target_province.GetName]. Hay una oportunidad aquí: fomentar el intercambio cultural y la alfabetización, o acelerar la conversión religiosa."
 cc_cabinet.31.a: "Alentar la integración cultural y el aprendizaje."
 cc_cabinet.31.b: "Centrarse en los esfuerzos de conversión."
 cc_cabinet.31.c: "Dejar que la provincia se gestione a sí misma."

 # cc_cabinet.32 — Confessional Province Work
 cc_cabinet.32.title: "Un ministro de la fe"
 cc_cabinet.32.desc: "La reformación ha convertido cada provincia en un terreno de disputa religiosa. [minister.GetName] tiene una elección, y nosotros también. ¿Buscaremos el entendimiento o la ortodoxia?"
 cc_cabinet.32.a: "Perseguir la conversión activa: otorga [ShowTraitName('reformation_preacher')]."
 cc_cabinet.32.b: "Defender la fe con firme resolución: otorga [ShowTraitName('reformation_inquisitor')]."
 cc_cabinet.32.c: "La fe es un asunto privado."

 # cc_cabinet.33 — Administrative Reform
 cc_cabinet.33.title: "Reforma Administrativa"
 cc_cabinet.33.desc: "La época exige una gobernanza eficiente. [minister.GetName] ha propuesto reformas que reforzarían el control administrativo en [target_province.GetName]. La corona puede invertir más o dejar que el ministro se encargue de su trabajo."
 cc_cabinet.33.a: "Involucre personalmente a [minister.GetName] en el esfuerzo de reforma — otorgue [ShowTraitName('absolute_administrator')]."
 cc_cabinet.33.b: "Invierta directamente en el desarrollo provincial."
 cc_cabinet.33.c: "Dejar que [minister.GetName] actúe según [minister.GetHerHis] propio criterio."



 # ============================================================
 # cc_traits.110 — A Scholar's Work (follow-up to cc_traits.10)
 # ============================================================

 cc_traits.110.title: "La obra de un erudito"
 cc_traits.110.desc: "Meses después de que [minister.GetName] abrazara el espíritu de esta era del aprendizaje, llegan noticias de su primera obra significativa. Eruditos, arquitectos y cortesanos lo han notado; algunos con admiración, otros con sospecha."
 cc_traits.110.a: "Presentar su trabajo ante la corte."

 cc_master_balancer: "Maestro del Equilibrio"
 desc_cc_master_balancer: "Este estadista ha hecho del equilibrio de Europa la obra de su vida. Cortejado por cada cancillería y temido por nadie, nos gana reputación en el extranjero y mitiga el antagonismo que nuestras maniobras provocarían de otro modo."
 cc_master_balancer_die_desc: "[CHARACTER.GetName] ha muerto. Pocas manos fueron tan hábiles manteniendo el equilibrio; debemos esperar que se encuentre un sucesor digno antes de que el gran juego se vuelva contra nosotros."
 parliamentarian_die_desc: "[CHARACTER.GetName] ha muerto. Quienquiera que ocupe [CHARACTER.GetHerHis] asiento luchará por igualar [CHARACTER.GetHerHis] maestría en la cámara."
 cc_traits.13.desc: "[minister.GetName] ha sido moldeado por las exigencias de una era en la que la autoridad soberana debe consolidarse. La forma en que [minister.GetSheHe] ejerza esa convicción definirá [minister.GetHerHis] legado."
 cc_traits.21.desc: "[learner.GetName] has time on [learner.GetHerHis] hands and a sharp mind ready to be shaped. What path should we encourage [learner.GetHerHim] to pursue?"
 cc_cabinet.2.desc: "[minister.GetName] ha presentado una petición a la tesorería solicitando [minister.GetHerHis] asignación de fondos. [minister.GetSheHe] nos asegura que la inversión dará frutos — aunque [minister.GetSheHe] diría eso, ¿verdad que [minister.GetSheHe]?"
