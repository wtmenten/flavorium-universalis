 cc_rival_dismissed: "Ministro Desplazado"
 cc_court_favored: "Favor de la Corona"
 cc_court_reconciliation: "Reconciliación"
 cc_cabal_bond: "Vínculo de Cabala"
 cc_rival_estate_purge: "Purga de Estamentos"

 # ============================================================
 # Modifier Display Names (Pillar 01)
 # ============================================================
 STATIC_MODIFIER_NAME_court_tension: "Tensión en la corte"
 STATIC_MODIFIER_DESC_court_tension: "Dos o más miembros del gabinete representan posiciones irreconciliables. Se ha instaurado la parálisis política: el prestigio se desvanece, la reputación diplomática sufre y cada decisión cuesta más."

 STATIC_MODIFIER_NAME_cc_cabal_compact: "Pacto de Gabinete"
 STATIC_MODIFIER_DESC_cc_cabal_compact: "Dos ministros aliados han formalizado su relación de trabajo. El gabinete funciona con mayor fluidez y la autoridad compartida reduce las fricciones de la gobernanza."

 STATIC_MODIFIER_NAME_cc_faction_purge_fallout: "Secuelas facciosas"
 STATIC_MODIFIER_DESC_cc_faction_purge_fallout: "El despido de un ministro no ha quedado sin respuesta. La red del ministro purgado está contraatacando silenciosamente: el prestigio se erosiona y los contactos diplomáticos se enfrían."

 # ============================================================
 # Character Interaction — Dismiss Rival Minister
 # ============================================================
 dismiss_rival_minister: "Destituir ministro"
 dismiss_rival_minister_desc: "La corte se está fracturando debido a una rivalidad faccional. Despedir a uno de los ministros resolverá el conflicto inmediato, aunque a costa del prestigio y, si el ministro está alineado con un estamento, de las relaciones con dicho estamento."
 choose_minister_to_dismiss: "Elige un ministro para destituir"
 cc_rival.1.a.tooltip: "[rival_b.GetName] recibe el mensaje claro de que [rival_b.GetHerHis] posición en esta corte depende de su moderación. El desaire no se olvidará, pero la tensión se rompe."
 cc_rival.1.b.tooltip: "[rival_a.GetName] es puesto en [rival_a.GetHerHis] lugar. La corte capta la señal; una facción se enfría mientras la otra lamiendo sus heridas."
