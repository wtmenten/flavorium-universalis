l_spanish:
 # ============================================================
 # Pillar 01 — Court Rivalry & Cabinet Intrigue
 # ============================================================

 # --- cc_rival.1 — The Minister's Complaint ---
 cc_rival.1.title: "La queja del ministro"
 cc_rival.1.desc: "La tensión entre [rival_a.GetName] y [rival_b.GetName] ha alcanzado una ruptura abierta. Ambos han presentado representaciones formales ante la corona, exigiendo cada uno que el otro sea destituido o reprendido. La corte observa."

 cc_rival.1.a: "Ponte del lado de [rival_a.GetName]."

 cc_rival.1.b: "Ponte del lado de [rival_b.GetName]."

 cc_rival.1.c: "Intermedie una reconciliación entre ellos."
 cc_rival.1.c.tooltip: "Un ejercicio costoso y agotador de paciencia real. Ambos ministros abandonan la sala del trono satisfechos, por ahora. La puntuación de rivalidad disminuye y la buena voluntad se compra al coste de monedas y prestigio."

 cc_rival.1.d: "Aprovechar la tensión: abrir su correspondencia."
 cc_rival.1.d.tooltip: "Que los maestros espías de la corte abran lo que ha sido sellado. Si hay intrigas, es mejor saberlo. Si no hay nada, al menos uno de ellos se preguntará qué has encontrado."

 # --- cc_rival.2 — A Letter Unsealed ---
 cc_rival.2.title: "Una carta desellada"
 cc_rival.2.desc: "La correspondencia de [rival_b.GetName] ha sido revisada discretamente. Lo que se ha encontrado no es traicionero, pero sí perjudicial. Comunicaciones privadas con los oponentes de [rival_a.GetName]; compromisos asumidos sin la aprobación real; favores prometidos en nombre de la corona. La carta se encuentra ahora ante usted."

 cc_rival.2.a: "Utilizarlo para purgar a [rival_b.GetName] del gabinete."
 cc_rival.2.a.tooltip: "La carta se convierte en un pretexto formal. [rival_b.GetName] es confrontado, el prestigio sufre debido al espectáculo de un despido abierto, y la red de [rival_b.GetHerHis] resentirá silenciosamente a la corona durante años."

 cc_rival.2.b: "Pásalo a [rival_a.GetName] como moneda de cambio."
 cc_rival.2.b.tooltip: "La carta llega a manos del rival. [rival_a.GetName] la utilizará como munición, y el conflicto faccional se intensificará antes de resolverse. Ganamos prestigio gracias a [rival_a.GetHerHis] gratitud, pero la guerra entre ellos no ha hecho más que empezar."

 cc_rival.2.c: "Suprimirlo: quemar la carta."
 cc_rival.2.c.tooltip: "La elección más sabia es, a veces, saber menos. La puntuación de rivalidad disminuye ligeramente y nadie sabrá exactamente qué se leyó, excepto usted."

 # --- cc_rival.3 — The Faction Hardens ---
 cc_rival.3.title: "La Facción se Endurece"
 cc_rival.3.desc: "[rival_a.GetName] ha manejado la inteligencia con eficacia. La corte está ahora abiertamente dividida. Los partidarios de [rival_b.GetName] han empezado a formar un bloque: cenas tranquilas, correspondencia compartida, posiciones coordinadas en cada asunto. Lo que empezó como una rivalidad personal se ha convertido en una confrontación faccional."

 cc_rival.3.a: "Reprimir a la facción."
 cc_rival.3.a.tooltip: "Una intervención costosa y visible. La red de [rival_b.GetName] es desmantelada; la corte sabe que la corona no tolerará una oposición abierta. El prestigio disminuye, la estabilidad se debilita y los supervivientes de la facción se dispersan, pero recordarán."

 cc_rival.3.b: "Permitir que la facción se agote a sí misma."
 cc_rival.3.b.tooltip: "No hace nada y deja que las facciones luchen. La tensión perdurará durante años, la estabilidad se verá afectada y la corte se volverá más conflictiva, pero no se derramará sangre ni nadie se convertirá en enemigo de la corona."

 cc_rival.3.c: "Elevar públicamente la facción de [rival_a.GetName]."
 cc_rival.3.c.tooltip: "Una declaración formal de preferencia. [rival_a.GetName] recibe el respaldo de la corona: una ganancia en habilidad y una lealtad renovada. La facción de [rival_b.GetName] se disuelve avergonzada. El coste de prestigio es real, pero también lo es la resolución."

 # --- cc_rival.4 — The Scorned Counselor ---
 cc_rival.4.title: "El consejero despreciado"
 cc_rival.4.desc: "[scorned_counselor.GetName] no se ha marchado discretamente. Destituido del gabinete pero aún presente en la corte, [scorned_counselor.GetHeShe] ha pasado los meses transcurridos cultivando aliados, reabriendo viejos agravios y haciendo sugerencias cuidadosamente redactadas de que la corona se ha vuelto errática. Los susurros empiezan a ser audibles."

 cc_rival.4.a: "Desterrar a [scorned_counselor.GetName] del reino."
 cc_rival.4.a.tooltip: "Un acto decisivo y visible. El consejero es escoltado hasta la frontera; la corte comprende que la paciencia de la corona tiene límites. El prestigio sufre debido al espectáculo, pero la amenaza queda eliminada por completo."

 cc_rival.4.b: "Ofrecer un acuerdo privado: dinero a cambio de silencio."
 cc_rival.4.b.tooltip: "Un trato pragmático. [scorned_counselor.GetName] recibe monedas suficientes para retirarse cómodamente en otro lugar de la corte y, a cambio, [scorned_counselor.GetHeShe] retira la campaña de susurros. Es costoso y sienta un precedente, pero el problema queda resuelto."

 cc_rival.4.c: "Ignora los gruñidos; no llegarán a nada."
 cc_rival.4.c.tooltip: "Un error de cálculo. Permitir que un exministro resentido actúe en la corte sin control es una invitación al faccionalismo. La tensión se acumula y otros empiezan a preguntarse si la corona está prestando atención."

 # --- cc_cabal.1 — The Alliance Forms ---
 cc_cabal.1.title: "Una alianza en la corte"
 cc_cabal.1.desc: "Se ha observado que [cabal_a.GetName] y [cabal_b.GetName] han desarrollado una relación de trabajo notable. Se ceden el paso en el consejo, comparten inteligencia entre sus carteras y presentan una posición unificada en casi todos los asuntos significativos. Ya sea por amistad, cálculo o algo intermedio, la corte ha empezado a hablar de ellos como una pareja."

 cc_cabal.1.a: "Formalizar su alianza: permitir que trabajen como un pacto."
 cc_cabal.1.a.tooltip: "Algo poco común: dos ministros cuyas ambiciones están alineadas. Formalizar el pacto señala vuestra confianza y convierte su cooperación en política oficial. A esto seguirá una propuesta de reforma conjunta."

 cc_cabal.1.b: "Que colaboren informalmente."
 cc_cabal.1.b.tooltip: "Sin sanciones formales, pero tampoco objeciones. El vínculo entre ellos se profundiza sin convertirse en una institución cortesana. Más simple y más seguro."

 cc_cabal.1.c: "Desalentar la alianza."
 cc_cabal.1.c.tooltip: "Dos ministros poderosos en coordinación explícita representan un riesgo político. Una palabra discreta desde el trono deja claro que el gabinete no debe convertirse en una facción. Ambos ministros se distancian ligeramente."

 # --- cc_cabal.2 — The Joint Reform Proposal ---
 cc_cabal.2.title: "La propuesta de reforma conjunta"
 cc_cabal.2.desc: "[cabal_a.GetName] y [cabal_b.GetName] han presentado una propuesta conjunta formal a la corona: una reforma coordinada que aprovecha sus respectivas áreas de especialización. El documento es exhaustivo, políticamente astuto y, casi con seguridad, el producto de muchos meses de preparación privada. Solo aguarda la aprobación real."

 cc_cabal.2.a: "Aprobar la propuesta conjunta."
 cc_cabal.2.a.tooltip: "El pacto queda ratificado. Ambos ministros reciben un reconocimiento formal de su autoridad combinada. La eficiencia del gabinete mejora, la estabilidad aumenta ligeramente y la camarilla se convierte en una característica institucional de la corte."

 cc_cabal.2.b: "Rechazar; la corona no debe ceder esta iniciativa."
 cc_cabal.2.b.tooltip: "Un rechazo frío. La propuesta queda archivada. Ambos ministros entendieron el mensaje claramente, y ninguno está del todo satisfecho."

 # --- cc_cabal.3 — The Informal Cabal Stirs ---
 cc_cabal.3.title: "La cábala informal se agita"
 cc_cabal.3.desc: "La asociación entre [cabal_a.GetName] y [cabal_b.GetName] nunca se formalizó. No se firmó ningún pacto ni se dio peso oficial a lo que hacen juntos. Pero la corte lo ha notado. En el clima actual de tensión, su coordinación silenciosa ha empezado a parecer algo más deliberado, y ambos han solicitado una audiencia privada para discutir el asunto directamente.\n\nQuieren algo. Ya sea formalizar su acuerdo, canalizar sus energías o simplemente ser vistos haciendo algo trascendente; la cuestión es si les damos una estructura en la cual trabajar o desmantelamos la asociación antes de que se convierta en una facción."

 cc_cabal.3.a: "Formalizar la asociación. Concederles un pacto de trabajo."
 cc_cabal.3.a.tooltip: "Un Pacto de Gabinete más corto que la formalización completa: cinco años en lugar de diez. Ambos ministros se vuelven más capaces. La asociación tiene ahora una estructura oficial."

 cc_cabal.3.b: "Canalizar su coordinación: que [cabal_a.GetName] lidere una iniciativa conjunta."
 cc_cabal.3.b.tooltip: "[cabal_a.GetName] lidera la iniciativa y crece gracias a la experiencia. No hay un pacto, pero la asociación tiene una vía de salida productiva."

 cc_cabal.3.c: "Enfrentar el acuerdo directamente. Disolver el vínculo informal."
 cc_cabal.3.c.tooltip: "Ambos ministros reciben el mensaje. Su alianza termina — y comienza su resentimiento."

