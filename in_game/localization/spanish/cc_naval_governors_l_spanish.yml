l_spanish:

 # Estate Privileges

 ep_noble_admiralty_commission: "Comisión del Almirantazgo"
 ep_noble_admiralty_commission_desc: "La corona formaliza el mando naval bajo el patronazgo noble, otorgando a la alta nobleza la supervisión de la administración de la flota a cambio de una mayor capacidad portuaria. Requiere una monarquía y el avance de la Carta Naval."

 # Advance

 naval_administration_advance: "Administración naval"
 naval_administration_advance_desc: "El estado establece una junta de almirantazgo permanente para supervisar las estaciones navales distantes, extendiendo el control real sobre los mares. Requiere el avance $naval_charter_advance$. Desbloquea la reforma de Administración Naval."

 # Government Reform

 cc_naval_administration_reform: "Administración naval"
 cc_naval_administration_reform_desc: "El establecimiento de una junta del almirantazgo permanente extiende la autoridad real sobre las estaciones navales distantes, permitiendo un gobierno naval adicional y reduciendo el coste de mantenimiento de los puertos remotos."

 # Building

 naval_academy: "Academia naval"
 naval_academy_desc: "Una institución dedicada a la formación de oficiales y al perfeccionamiento de la doctrina naval. Aumenta los marineros locales, reduce el desgaste de la flota en puerto y —si se establece en la capital— mejora la moral, la tradición y el tamaño previsto de la armada en todo el reino. Requiere el avance $naval_charter_advance$. Puede construirse en cualquier ciudad o megalópolis con un puerto."
 naval_academy_maintenance: "Suministros de la academia naval"
