l_spanish:
 # === cc_bonds.2 — A Colonial Horizon ===
 cc_bonds.2.title: "Un horizonte colonial"
 cc_bonds.2.desc: "La noticia ha llegado a todas las cortes del mundo: [bond_subj.GetName] se ha convertido en la primera nación colonial de esta era; un asentamiento permanente al otro lado del mar, gobernado a distancia y sostenido por la voluntad de [bond_subj.GetOverlord.GetName]. Es un umbral. El mundo es más grande que ayer."
 cc_bonds.2.a: "Un logro notable. Hagamos saber a la corte que estamos orgullosos."
 cc_bonds.2.b: "Tomen nota del desarrollo y continúen."

 # === cc_bonds.3 — The First March ===
 cc_bonds.3.title: "La primera marcha"
 cc_bonds.3.desc: "La institución de la marca ha sido establecida por primera vez en la memoria viva: [bond_subj.GetName] ha sido elevado para servir como un amortiguador fortificado bajo el estandarte de [bond_subj.GetOverlord.GetName]. Donde las fronteras son disputadas y los asaltantes son audaces, un señor de la marca se interpone entre la civilización y la frontera."
 cc_bonds.3.a: "La frontera resistirá. Honramos a quienes la custodian."
 cc_bonds.3.b: "Un acuerdo práctico. Que quede registrado."

 # === cc_bonds.4 — A Formal Compact ===
 cc_bonds.4.title: "Un pacto formal"
 cc_bonds.4.desc: "Se ha establecido el primer pacto formal de este tipo: [bond_subj.GetName] entabla una relación estructurada con [bond_subj.GetOverlord.GetName]; ni un simple aliado ni una provincia conquistada, sino algo más deliberado. La cuestión de cómo se gobiernan tales relaciones ha empezado a cobrar importancia."
 cc_bonds.4.a: "Un nuevo capítulo en el arte de gobernar. Estamos satisfechos."
 cc_bonds.4.b: "Documentarlo y proceder."

 # === cc_bonds.5 — Word from the Provinces ===
 cc_bonds.5.title: "Noticias de las Provincias"
 cc_bonds.5.desc.thriving: "Los últimos despachos de [bond_subj.GetName] hablan de una temporada próspera. El comercio fluye libremente, la cosecha fue generosa y el pueblo parece contento bajo sus acuerdos actuales. Nuestro vínculo con el súbdito parece estar dando frutos."
 cc_bonds.5.desc.strained: "Informes inquietantes han llegado a la capital. Los mercaderes hablan de exacciones injustas y los funcionarios notan un creciente resentimiento entre la población de [bond_subj.GetNameWithNoTooltip]. La relación, por mucho que prefiramos no examinarla de cerca, no parece estar totalmente sana."
 cc_bonds.5.desc.neutral: "Llegan despachos rutinarios de [bond_subj.GetNameWithNoTooltip]. La administración avanza según lo previsto y no se informan incidentes notables. La relación con [bond_subj.GetNameWithNoTooltip] continúa prácticamente igual que siempre."
 cc_bonds.5.a: "Responder con atención personal."
 cc_bonds.5.b: "Archivarlo con los demás informes."

 # === cc_bonds.6 — The Diplomat's Report ===
 cc_bonds.6.title: "El Informe del Diplomático"
 cc_bonds.6.desc.content: "Nuestro enviado regresa de [bond_subj.GetName] con un relato alentador. Los colonos parecen prosperar, el comercio está activo y el gobernador habla con calidez de los acuerdos de la Corona. Hay una sensación palpable de que la relación es mutuamente beneficiosa."
 cc_bonds.6.desc.discontent: "El informe de nuestro diplomático desde [bond_subj.GetNameWithNoTooltip] resulta incómodo de leer. Las cargas fiscales son una queja recurrente, las restricciones comerciales generan resentimiento y en las tabernas se dice que la Corona quita más de lo que da."
 cc_bonds.6.desc.neutral: "El informe del diplomático desde [bond_subj.GetNameWithNoTooltip] es irrelevante. El comercio prosigue, la administración funciona y no hay preocupaciones urgentes que requieran nuestra atención."
 cc_bonds.6.a: "Enviar un elogio personal al gobernador."
 cc_bonds.6.b: "Confirmar recepción."

 # === cc_bonds.7 — Rumors at Court ===
 cc_bonds.7.title: "Rumores en la corte"
 cc_bonds.7.desc.loyal: "Los visitantes de [bond_subj.GetName] hablan con orgullo de la fidelidad de su señor a la Corona. La casa del noble brinda por el señor supremo en cada banquete, y se dice que sus soldados entrenan pensando en nosotros. Independientemente de lo que susurre la corte, este parece genuinamente vinculado a nuestra causa."
 cc_bonds.7.desc.restless: "La corte se ha llenado de rumores. Viajeros de [bond_subj.GetNameWithNoTooltip] hablan de un señor que se distancia, cuyos brindis a la Corona se han vuelto superficiales y cuya casa conspira silenciosamente sobre lo que está por venir. Puede que no signifique nada. O puede que sí."
 cc_bonds.7.desc.neutral: "Los chismes de la corte llegan ocasionalmente a oídos del señor de la marca. Nada alarmante: las quejas habituales sobre impuestos y obligaciones, mezcladas con los alardes habituales de destreza marcial. La relación parece irrelevante."
 cc_bonds.7.a: "Enviar una carta personal de consideración."
 cc_bonds.7.b: "Desestimar los chismes."

 # === cc_bonds.8 — A Letter from the Dependency ===
 cc_bonds.8.title: "Una carta de [bond_subj.GetNameWithNoTooltip]"
 cc_bonds.8.desc.warm: "Llega una carta de [bond_subj.GetName] con todas las marcas de un afecto genuino. La casa gobernante habla de esfuerzos compartidos, de gratitud por las atenciones de la Corona y del orgullo que sienten por el vínculo. Se lee menos como una correspondencia formal que como una carta familiar."
 cc_bonds.8.desc.cold: "Llega una carta formal de [bond_subj.GetNameWithNoTooltip]. Se observan las cortesías correctas, los sellos están colocados adecuadamente, pero la calidez brilla por su ausencia. Entre líneas de un fraseo cuidadoso yace la fría distancia de una relación a la que se ha dejado derivar."
 cc_bonds.8.desc.formal: "Llega la correspondencia estacional de [bond_subj.GetNameWithNoTooltip]: correcta, bien redactada y totalmente anodina. La casa gobernante mantiene sus obligaciones. La relación permanece intacta, aunque no sea cálida."
 cc_bonds.8.a: "Responder con calidez personal."
 cc_bonds.8.b: "Enviar un acuse de recibo estándar."

 # === cc_bonds.9 — The Governor's Annual Dispatch ===
 cc_bonds.9.title: "El despacho anual del gobernador"
 cc_bonds.9.desc.harmonious: "El informe anual del gobernador de [bond_subj.GetName] presenta un panorama alentador. Los ingresos son saludables, la administración es fluida y la población local parece haberse adaptado a la autoridad de la Corona sin fricciones. El despacho habla de una provincia que funciona bien bajo sus acuerdos actuales."
 cc_bonds.9.desc.troubled: "El informe anual del gobernador plantea varias preocupaciones. La recaudación de ingresos ha encontrado resistencia, los funcionarios locales no cooperan y hay pasajes que parecen casi deliberadamente vagos. La provincia no está en abierta rebelión, pero tampoco parece estar satisfecha."
 cc_bonds.9.desc.routine: "El despacho anual del gobernador llega según lo previsto. Las cifras de ingresos son adecuadas, los asuntos administrativos están en orden y no se observan preocupaciones especiales. [bond_subj.GetNameWithNoTooltip] continúa a su manera habitual."
 cc_bonds.9.a: "Enviar elogios al gobernador."
 cc_bonds.9.b: "Archivar para revisión."
