l_spanish:
 # ============================================================
 # DUAL-LAYER SYNERGY EVENTS (cc_dual namespace)
 # Cabinet × Religious_Figure pair events
 # ============================================================

 cc_dual.1.title: "El místico guerrero"
 cc_dual.1.desc: "[minister.GetName] es una contradicción que la edad ha hecho posible: un comandante de caballería de genuina habilidad cuya práctica sufí ha profundizado, en lugar de dividir, su comprensión de la guerra. La espada y la oración son, en sus manos, expresiones de la misma disciplina[minister.GetHerHis][minister.GetHerHis]."
 cc_dual.1.a: "Este es un comandante como ningún otro. Que su dualidad se convierta en nuestra fuerza."
 cc_dual.1.b: "La conversión del territorio conquistado es donde mejor se dirige su energía espiritual."

 cc_dual.2.title: "El diplomático sagrado"
 cc_dual.2.desc: "En la tradición bizantina, lo sagrado y lo diplomático nunca estuvieron separados: las vestiduras del patriarca y el sello del canciller compartían la misma antecámara. [minister.GetName] ha revivido esa síntesis: su autoridad religiosa y capacidad diplomática hablan con una sola voz, y las cortes que visitan han aprendido a escuchar."
 cc_dual.2.a: "Esto es el arte de gobernar tal como se practicaba antaño. Dejemos que funcione."
 cc_dual.2.b: "Despliégalos donde más se necesiten la conversión y la diplomacia."

 cc_dual.3.title: "El teólogo racional"
 cc_dual.3.desc: "[minister.GetName] rechaza la elección entre la razón y la fe. Los grandes filósofos islámicos la rechazaron. También lo hicieron los escolásticos. Y también [minister.GetHerHim]: una mente formada en la indagación de la Ilustración aplicada a cuestiones de doctrina. Las instituciones que este ministro crea son más fuertes por integrar ambas tradiciones."
 cc_dual.3.a: "Esta síntesis es exactamente lo que la era necesita. Dejad que trabajen."
 cc_dual.3.b: "Su claridad filosófica ha revelado algo mayor: los cimientos de la corte de un filósofo."
 cc_dual.3.b.tt: "Desbloquea la reforma gubernamental de la Corte de los Filósofos."

 cc_dual.4.title: "El Parlamento protestante"
 cc_dual.4.a: "Que su fe reformada fortalezca los cimientos del parlamento."
 cc_dual.4.b: "La satisfacción del clero es la necesidad más inmediata; dirijan su energía hacia allí."

 cc_dual.5.title: "Mandato del Cielo"
 cc_dual.5.desc: "El erudito confuciano que también posee dones proféticos es una figura respetada y temida por la tradición clásica. [minister.GetName] posee ambos: la disciplina meritocrática de la cultura de los exámenes y la autoridad oracular que silencia las cortes cuando habla. El mandato del cielo, dicen, pasa a quienes pueden leer tanto sus dimensiones administrativas como místicas."
 cc_dual.5.a: "Esta es la síntesis confuciana: el aprendizaje y la bendición del cielo unidos."
 cc_dual.5.b: "Sus dones apuntan hacia algo más grande: los cimientos del Reino Medio."
 cc_dual.5.b.tt: "Desbloquea el camino hacia la misión legendaria del Reino Medio."

 cc_dual.6.title: "La ley y la letra"
 cc_dual.6.a: "La ley y las escrituras juntas son un cimiento más estable que cualquiera de ellas por separado."
 cc_dual.6.b: "Su inversión ministerial habla por sí sola."

 cc_dual.7.title: "La espada renuente"
 cc_dual.7.desc: "[minister.GetName] es un comandante defensivo que preferiría no serlo. Su práctica como ermitaño —o su temperamento como tal— ha dado a sus consejos militares una cualidad inusual: diseña fortificaciones excelentemente porque genuinamente desea que nunca tengan que utilizarse. El agotamiento por la guerra le preocupa más que a la mayoría."
 cc_dual.7.a: "Un general que prefiere la paz sigue siendo un general. Dejad que trabaje."
 cc_dual.7.b: "Su deseo de paz debe canalizarse a través de la diplomacia."

 cc_dual.8.title: "El tesorero piadoso"
 cc_dual.8.desc: "El defterdar gestiona las finanzas del imperio; el asceta busca desligarse de ellas. [minister.GetName] ha hecho las paces con esta tensión tratando la gestión financiera como una disciplina espiritual: el despilfarro es pecado, la eficiencia es virtud, y el clero puede estar satisfecho precisamente porque este ministro se niega a enriquecerse a expensas de la fe."
 cc_dual.8.a: "Disciplina financiera y convicción espiritual juntas: el reino se beneficia."
 cc_dual.8.b: "La satisfacción del clero y una modesta inversión ministerial son los frutos prácticos."

 cc_dual.9.title: "El caballero de Dios"
 cc_dual.9.desc: "En el ideal caballeresco, lo marcial y lo espiritual no eran contradicciones; eran la misma virtud expresada en diferentes registros. [minister.GetName] ha vivido este ideal: un campeón noble que es también el capellán de la corte, cuyo brazo armado y autoridad pastoral hablan el mismo lenguaje de servicio sagrado."
 cc_dual.9.a: "El ideal caballeresco vive en este ministro. Que inspire a la nobleza."
 cc_dual.9.b: "Sus dones espirituales se orientan mejor hacia el clero y la fe."

 cc_dual.10.title: "Una crisis de fe"
 cc_dual.10.desc: "[minister.GetName] ha llegado a una posición imposible: la autoridad del Gran Inquisidor requiere la supresión precisamente de los cuestionamientos reformistas que la teología reformista de [minister.GetHerHis] respalda. La contradicción se ha hecho evidente. La corte observa para ver qué convicción prevalece."
 cc_dual.10.a: "Suprimir la duda: el papel del Inquisidor exige certeza."
 cc_dual.10.b: "Que la contradicción se resuelva: ambas convicciones ceden ante algo más grande."
 cc_dual.10.b.tt: "El ministro pierde ambos rasgos. Emerge un Teólogo de la Corona sintetizador."
 cc_dual.10.c: "Destituir a [minister.GetHerHim] antes de que el conflicto se extienda."
 cc_dual.4.desc: "The Reformation redrew the map of faith and governance simultaneously. [minister.GetName] stands at that intersection: a parliamentary operator whose reformist theology gives [minister.GetHerHis] legislative work a moral seriousness that purely transactional politics lacks. The chamber has noticed."
 cc_dual.6.desc: "La mayoría de las cortes convierten al administrador práctico y al jurista escritural en rivales. [minister.GetName] ha rechazado esa rivalidad. Su administración eficiente se fundamenta en una lectura de la ley sagrada como la fuente original del buen gobierno. La reforma, para ellos, no es un alejamiento de la tradición, sino un retorno a ella."
