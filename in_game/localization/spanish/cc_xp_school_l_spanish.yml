l_spanish:
 # ============================================================
 # Cabinet Experience: school seats, kinds and curricula
 # ============================================================

 # Notifications (events/cc_xp_school_events.txt)
 cc_xp_school.1.title: "La escuela se traslada"
 cc_xp_school.1.desc: "La escuela fundada por [cc_xp_school_founder.GetName] ya no puede mantener su sede en [cc_xp_school_old_seat.GetName]. Sus maestros, libros y estudiantes se han trasladado a la universidad de [cc_xp_school_new_seat.GetName], y la enseñanza continúa allí."
 cc_xp_school.1.a: "Deja que se asiente."
 cc_xp_school.2.title: "Una escuela en el exilio"
 cc_xp_school.2.desc: "La escuela fundada por [cc_xp_school_founder.GetName] ha perdido su sede en [cc_xp_school_old_seat.GetName], y ninguna otra universidad del reino está libre para acogerla.\n\nSus miembros siguen estudiando y ganando en su disciplina. Hasta que una universidad esté libre, la escuela no tendrá sede: sus bonificaciones y acciones de sede quedan suspendidas. Regresará por sí sola tan pronto como una lo esté."
 cc_xp_school.2.a: "Encontraremos un hogar para ello."
 cc_xp_school.3.title: "La escuela regresa"
 cc_xp_school.3.desc: "La escuela fundada por [cc_xp_school_founder.GetName] tiene sede de nuevo, en la universidad de [cc_xp_school_new_seat.GetName]. Sus bonificaciones y acciones de sede se reanudan."
 cc_xp_school.3.a: "Bienvenido de nuevo."

 # Kind of institution, from the seat's religion (cc_xp_school_N_kind)
 CC_XP_SCHOOL_KIND_1: "Studium"
 CC_XP_SCHOOL_KIND_2: "Academia"
 CC_XP_SCHOOL_KIND_3: "Madrasa"
 CC_XP_SCHOOL_KIND_4: "Shuyuan"
 CC_XP_SCHOOL_KIND_5: "Vihara"
 CC_XP_SCHOOL_KIND_6: "Gurukula"
 CC_XP_SCHOOL_KIND_7: "Yeshivá"
 CC_XP_SCHOOL_KIND_8: "Escuela"

 # Curriculum (cc_xp_school_N_curriculum)
 CC_XP_CURRICULUM_1: "Derecho"
 CC_XP_CURRICULUM_2: "Teología"
 CC_XP_CURRICULUM_3: "Filosofía Natural"
 CC_XP_CURRICULUM_4: "Letras"
 CC_XP_CURRICULUM_5: "Ciencia Militar"

 # Curriculum tooltips
 CC_XP_CURRICULUM_1_TT: "Derecho. En la sede: mayor control máximo y menos malestar. En todo el reino: crecimiento de control más rápido.\n\nLas bonificaciones se escalan según la calidad de la escuela. El reino obtiene la bonificación nacional de cada plan de estudios una sola vez, independientemente de cuántas escuelas lo impartan."
 CC_XP_CURRICULUM_2_TT: "Teología. En la sede: conversión más rápida de herejes y menos agitación. En todo el reino: influencia religiosa y tolerancia de la fe estatal.\n\nLas bonificaciones se escalan según la calidad de la escuela. El reino obtiene la bonificación nacional de cada plan de estudios una sola vez, independientemente de cuántas escuelas lo enseñen."
 CC_XP_CURRICULUM_3_TT: "Filosofía Natural. En la sede: mayor alfabetización máxima. En todo el reino: investigación más rápida. Requiere calidad 40 para adoptarse.\n\nLas bonificaciones se escalan según la calidad de la escuela. El reino obtiene la bonificación nacional de cada plan de estudios una sola vez, independientemente de cuántas escuelas lo impartan."
 CC_XP_CURRICULUM_4_TT: "Letras. En la sede: influencia cultural. En todo el reino: prestigio mensual.\n\nLas bonificaciones se escalan según la calidad de la escuela. El reino obtiene la bonificación nacional de cada plan de estudios una sola vez, independientemente de cuántas escuelas lo impartan."
 CC_XP_CURRICULUM_5_TT: "Ciencia Militar. En la sede: crecimiento de control más rápido. En todo el reino: moral terrestre.\n\nLas bonificaciones se escalan según la calidad de la escuela. El reino obtiene la bonificación nacional de cada plan de estudios una sola vez, independientemente de cuántas escuelas lo impartan."

 # ---- Schools tab ----
 CC_XP_SCHOOLS_FOUNDED_LABEL: "Escuelas"
 CC_XP_SCHOOLS_FOUNDED_TT: "Escuelas fundadas, del número total que este reino puede albergar."
 CC_XP_SCHOOLS_MEMBERS_LABEL: "Miembros"
 CC_XP_SCHOOL_OF: "de"
 CC_XP_SCHOOL_IN_EXILE: "#R En el exilio#!"
 CC_XP_SCHOOL_IN_EXILE_TT: "Esta escuela ha perdido su sede y ninguna otra universidad del reino está libre. Sus miembros siguen ganando experiencia, pero sus bonificaciones y proyectos de sede están suspendidos. Regresa por sí sola tan pronto como una universidad esté libre."
 CC_XP_SCHOOL_TRACK_TT: "La disciplina que enseña esta escuela. Cada miembro gana experiencia en ella cada año."
 CC_XP_SCHOOL_FOUNDER_LABEL: "Fundador"
 CC_XP_SCHOOL_RECTOR_LABEL: "Rector"
 CC_XP_SCHOOL_NO_RECTOR: "Sin Rector"
 CC_XP_SCHOOL_RECTOR_TT: "Asigne a un ministro la tarea de #Y Rector#! en la pantalla del gabinete y elija la sede de esta escuela. Mientras sirvan, los miembros ganan el doble de experiencia, los proyectos surgen cada 2 años en lugar de 3, el plan de estudios puede cambiarse después de 5 años en lugar de 10, y la sede gana crecimiento de institución y alfabetización."
 CC_XP_SCHOOL_MEMBERS_LABEL: "Miembros"
 CC_XP_SCHOOL_MEMBERS_TT: "Miembros activos de esta escuela. Cada uno gana experiencia en su disciplina cada año: la mitad más para un miembro que comparta la cultura de la sede, y el doble bajo un Rector."
 CC_XP_SCHOOL_CURRICULUM_LABEL: "Plan de estudios"

 # Buttons
 CC_XP_SCHOOL_BTN_ENDOW: "Dotar"
 CC_XP_SCHOOL_BTN_CHAIRS: "Cátedras Reales"
 CC_XP_SCHOOL_BTN_SCHOLARS: "Eruditos"
 CC_XP_SCHOOL_BTN_DISPUTATION: "Disputa"
 CC_XP_SCHOOL_BTN_CURRICULUM: "Plan de estudios"

 # Actions (aliased per school by cc_xp_school_actions_l_english.yml)
 cc_xp_school_endow: "Dotar la Biblioteca"
 cc_xp_school_endow_desc: "Financiar libros, instrumentos y un edificio para esta escuela. Progreso de investigación inmediato y mayor alfabetización en la sede durante diez años.\n\nUna escuela asume un proyecto a la vez: después necesita 3 años (2 bajo un Rector) antes del siguiente."
 cc_xp_school_chairs: "Cátedras Reales"
 cc_xp_school_chairs_desc: "Financiar cátedras remuneradas por un periodo. Cada miembro de esta escuela gana experiencia en su disciplina. Los protegidos ganan más que los ministros, ya que la escuela es todo lo que tienen.\n\nUna escuela asume un proyecto a la vez: después necesita 3 años (2 bajo un Rector) antes del siguiente."
 cc_xp_school_scholars: "Invitar a Eruditos Extranjeros"
 cc_xp_school_scholars_desc: "Utilizar el nombre de la corte para atraer eruditos del extranjero. La sede progresa hacia cada institución que el reino conozca y la sede carezca, y desarrolla las instituciones más rápido durante diez años.\n\nUna escuela asume un proyecto a la vez: después, necesita 3 años (2 bajo un Rector) antes del siguiente."
 cc_xp_school_disputation: "Celebrar una Disputatio"
 cc_xp_school_disputation_desc: "Organizar un debate público sobre una cuestión del plan de estudios de la escuela. La corte decide cómo termina.\n\nUna escuela asume un proyecto a la vez: después necesita 3 años (2 bajo un Rector) antes del siguiente."
 cc_xp_school_curriculum: "Cambiar plan de estudios"
 cc_xp_school_curriculum_desc: "Elija qué enseña esta escuela. Cada plan de estudios otorga una bonificación en la sede y otra en todo el reino, y decide qué disputas mantiene. Una vez cambiado, no podrá cambiarse de nuevo durante 10 años (5 bajo un Rector)."

 # Action gates
 cc_xp_tt_school_exists: "Esta escuela ha sido fundada"
 cc_xp_tt_school_not_exiled: "Esta escuela tiene una sede (no está en el exilio)"
 cc_xp_tt_school_not_busy: "Esta escuela no tiene ningún proyecto en curso"
 cc_xp_tt_school_has_members: "Esta escuela tiene al menos un miembro vivo"
 cc_xp_tt_school_curriculum_settled: "Esta escuela no ha cambiado su plan de estudios recientemente"

 # ---- Rector duty ----
 cc_duty_rector: "Rector"
 cc_duty_rector_desc: "El ministro se hace cargo de una de las escuelas del reino. Sus miembros ganan el doble de experiencia, sus proyectos y cambios de plan de estudios llegan antes, y su sede desarrolla instituciones y alfabetización más rápidamente."
 cc_duty_rector_action: "Rector"
 cc_duty_rector_active: "Sirviendo como Rector"
 cc_duty_rector_select_school: "¿Qué escuela?"
 cc_duty_rector_no_school: "@trigger_no! El reino no tiene ninguna escuela establecida sin un Rector."

 # ---- Disputations ----
 cc_xp_school.11.title: "Una disputa sobre la ley"
 cc_xp_school.11.desc: "Los maestros de [cc_xp_school_new_seat.GetName] han discutido durante una semana sobre una cuestión: cuando la costumbre y el estatuto real discrepan, ¿a cuál debe seguir la corte? El salón estuvo lleno todos los días. Ambas partes quieren ahora que la corona diga quién ganó."
 cc_xp_school.11.a: "Estatuto. La ley de la corona es vinculante."
 cc_xp_school.11.b: "Personalizado. Se mantiene la antigua ley de la tierra."
 cc_xp_school.11.c: "Publicar ambos argumentos y dejar que las cortes los lean."
 cc_xp_school.12.title: "Una cuestión de doctrina"
 cc_xp_school.12.desc: "Una disputa en [cc_xp_school_new_seat.GetName] ha ido más allá de lo previsto. Un joven maestro defendió una lectura de las escrituras que el clero considera peligrosa, y los estudiantes se pusieron de su lado. Los obispos han escrito a la corona."
 cc_xp_school.12.a: "Mantener las enseñanzas recibidas."
 cc_xp_school.12.b: "Deja que discutan. Para eso es la escuela."
 cc_xp_school.12.c: "Remitir la cuestión al clero."
 cc_xp_school.13.title: "Un experimento ante la corte"
 cc_xp_school.13.desc: "Los maestros de [cc_xp_school_new_seat.GetName] han mostrado a la corte un experimento: un resultado que las antiguas autoridades decían que era imposible, repetido tres veces ante testigos. Los burgueses quieren saber cuánto vale. El clero quiere saber qué significa."
 cc_xp_school.13.a: "Pagar por más ensayos."
 cc_xp_school.13.b: "Suficiente. Ponga fin a las demostraciones."
 cc_xp_school.13.c: "Hacer que los estudiantes lo repitan hasta que lo entiendan."
 cc_xp_school.14.title: "Un certamen de letras"
 cc_xp_school.14.desc: "La escuela en [cc_xp_school_new_seat.GetName] ha celebrado un concurso público de poesía y oratoria. Las entradas ganadoras ya están siendo copiadas y distribuidas por la corte."
 cc_xp_school.14.a: "Corone al ganador ante la corte."
 cc_xp_school.14.b: "Imprimir las entradas."
 cc_xp_school.14.c: "Enviar copias a las cortes extranjeras."
 cc_xp_school.15.title: "Una disputa sobre la guerra"
 cc_xp_school.15.desc: "Los maestros de [cc_xp_school_new_seat.GetName] han terminado un tratado sobre el entrenamiento y el orden de batalla, y lo han debatido frente a dos capitanes veteranos. Los capitanes perdieron. A la nobleza, que es la oficialidad del ejército, no le agradó escucharlo."
 cc_xp_school.15.a: "Adoptar el nuevo entrenamiento."
 cc_xp_school.15.b: "Mantenerlo en la sala de conferencias por ahora."
 cc_xp_school.15.c: "Enviar a los maestros a enseñar en las guarniciones."

 # ---- Change curriculum ----
 cc_xp_school.20.title: "¿Qué deberá enseñar la escuela?"
 cc_xp_school.20.desc: "Los maestros de la escuela en [cc_xp_school_new_seat.GetName] esperan la decisión de la corona sobre su plan de estudios. La elección determinará qué enseñan, qué obtienen la sede y el reino de ello, y sobre qué cuestiones discutirán durante los próximos años."
 cc_xp_school.20.a: "Derecho"
 cc_xp_school.20.b: "Teología"
 cc_xp_school.20.c: "Filosofía Natural"
 cc_xp_school.20.d: "Letras"
 cc_xp_school.20.e: "Ciencia Militar"
 cc_xp_school.20.f: "Mantener el plan de estudios actual."
 cc_xp_school.20.g: "Medicina"
 cc_xp_school.20.h: "Navegación"

 # ---- Renown and quality ----
 CC_XP_SCHOOL_RENOWN_LABEL: "Renombre"
 CC_XP_SCHOOL_QUALITY_LABEL: "Calidad"
 CC_XP_SCHOOL_RENOWN_TIER_1: "Local"
 CC_XP_SCHOOL_RENOWN_TIER_2: "Regional"
 CC_XP_SCHOOL_RENOWN_TIER_3: "Famoso"
 CC_XP_SCHOOL_RENOWN_TIER_4: "Ilustre"
 CC_XP_SCHOOL_QUALITY_TIER_1: "Pobre"
 CC_XP_SCHOOL_QUALITY_TIER_2: "Adecuado"
 CC_XP_SCHOOL_QUALITY_TIER_3: "Bueno"
 CC_XP_SCHOOL_QUALITY_TIER_4: "Excelente"
 CC_XP_SCHOOL_RENOWN_TT_HEAD: "#T Renombre#!\nQué tan conocida es la escuela. Cada año avanza un 15% hacia su objetivo, que es la suma de:"
 CC_XP_SCHOOL_RENOWN_TT_FOOT: "Reducido a la mitad mientras se está en el exilio. Los eventos y proyectos impulsan el renombre directamente; el impulso se desvanece hacia el objetivo durante los años siguientes.\n\nEl renombre establece el prestigio del reino y la influencia cultural de sus escuelas, y atrae a eruditos (desde 40), estudiantes extranjeros (desde 30) y artistas (desde 50)."
 CC_XP_SCHOOL_QUALITY_TT_HEAD: "#T Calidad#!\nQué tan buena es la enseñanza. Cada año avanza un 20% hacia su objetivo, que es la suma de:"
 CC_XP_SCHOOL_QUALITY_TT_FOOT: "10 fijo mientras esté en el exilio. Las Dotaciones y las Cátedras Reales aumentan la calidad directamente.\n\nLa calidad escala los bonos de plaza y currículo de la escuela, así como la experiencia anual de sus miembros. Escala actual:"
 CC_XP_SCHOOL_TT_AGE: "Edad:"
 CC_XP_SCHOOL_TT_SEAT: "Sede (desarrollo, alfabetización, capital):"
 CC_XP_SCHOOL_TT_REALM: "Reino (prestigio, rango, gran potencia):"
 CC_XP_SCHOOL_TT_TEACHING: "Enseñanza (una quinta parte de la calidad):"
 CC_XP_SCHOOL_TT_TARGET: "Objetivo:"
 CC_XP_SCHOOL_TT_FUNDING: "Financiación (Presupuesto cultural):"
 CC_XP_SCHOOL_TT_RECTOR: "Rector (10 más su antigüedad):"
 CC_XP_SCHOOL_TT_STABLE: "Plan de estudios establecido:"
 CC_XP_SCHOOL_TT_SENIORS: "Miembros veteranos (3 cada uno, hasta 15):"
 CC_XP_SCHOOL_STANDING_PREFIX: "Rango"
 CC_XP_SCHOOL_STANDING_TT: "Dónde sitúa el renombre de esta escuela entre las universidades del mundo. Cada ubicación extranjera con una universidad es puntuada una vez al año según su sede y su reino, más 15 como fundación establecida. Esto es uno más que el número de aquellas que puntúan por encima del renombre de esta escuela."
 CC_XP_SCHOOL_FOUNDED_PREFIX: "Fundado"
 CC_XP_SCHOOL_FOUNDER_TT: "El ministro que fundó esta escuela y eligió su disciplina."
 CC_XP_SCHOOLS_RIVAL_LABEL: "Universidad extranjera líder:"
 CC_XP_SCHOOLS_RIVAL_TT: "La universidad más prominente fuera del reino y su puntuación. Recalculada cada año. Una escuela cuya fama sea inferior en más de 10 puntos a la suya puede perder maestros y estudiantes frente a ella."

 # Funding
 CC_XP_SCHOOL_FUNDING_LABEL: "Financiación"
 CC_XP_SCHOOL_FUNDING_CULTURE: "Presupuesto cultural en #Y [Player.MakeScope.GetVariable('cc_xp_school_culture_pos').GetValue|%0]#!"
 CC_XP_SCHOOL_FUNDING_CUSTOMARY: "Asignación consuetudinaria"
 CC_XP_SCHOOL_FUNDING_CUSTOMARY_TT: "Este reino aún no puede invertir en cultura. Hasta que pueda, sus escuelas viven de una asignación habitual que fija la calidad en 35 y no cuesta nada."
 CC_XP_SCHOOL_FUNDING_TT: "Las escuelas se pagan con el presupuesto de #Y Cultura#! del reino. Cuanto más alto sea el deslizador de Cultura, mayor será la calidad que alcance cada escuela (20 con el deslizador vacío, 45 a la mitad, 70 al máximo) y más costará: hasta un 5% de los ingresos mensuales de comercio e impuestos por escuela establecida, escalado según el deslizador. Antes de que el reino pueda invertir en cultura, las escuelas viven de una asignación consuetudinaria que fija la calidad en 35 y no cuesta nada. No se paga nada mientras una escuela esté en el exilio."
 CC_XP_SCHOOL_PER_MONTH: "al mes"

 # Option gates
 cc_xp_tt_school_quality_40: "La calidad de la escuela es al menos 40"
 cc_xp_tt_school_quality_50: "La calidad de la escuela es al menos 50"
 cc_xp_tt_school_quality_60: "La calidad de la escuela es al menos 60"
 cc_xp_tt_school_coastal: "La sede de la escuela está en la costa"

 # New curricula
 CC_XP_CURRICULUM_6: "Medicina"
 CC_XP_CURRICULUM_7: "Navegación"
 CC_XP_CURRICULUM_6_TT: "Medicina. En la sede: resistencia a las enfermedades y crecimiento poblacional. En todo el reino: resistencia a las enfermedades. Requiere calidad 50 para adoptarse.\n\nLas bonificaciones se escalan según la calidad de la escuela. El reino obtiene la bonificación nacional de cada plan de estudios una sola vez, independientemente de cuántas escuelas lo impartan."
 CC_XP_CURRICULUM_7_TT: "Navegación. En la sede: construcción naval más rápida y más marineros. En todo el reino: alcance naval. Requiere una sede costera para adoptarse.\n\nLas bonificaciones se escalan según la calidad de la escuela. El reino obtiene la bonificación nacional de cada plan de estudios una sola vez, independientemente de cuántas escuelas lo impartan."

 # Fourth disputation options (quality 60)
 cc_xp_school.11.d: "Hacer que los maestros redacten un código que resuelva la cuestión."
 cc_xp_school.12.d: "Convoque a los maestros y a los obispos juntos."
 cc_xp_school.13.d: "Anuncie el resultado a los eruditos de cada corte."
 cc_xp_school.14.d: "Fundar una imprenta en la escuela."
 cc_xp_school.15.d: "Deja que los maestros escriban el manual de instrucción del reino."
 cc_xp_school.16.title: "Una disputa sobre los médicos"
 cc_xp_school.16.desc: "Los médicos de [cc_xp_school_new_seat.GetName] se han dividido. Una parte enseña basándose en las antiguas autoridades; la otra ha estado estudiando los cuerpos de criminales ejecutados y afirma que las autoridades están equivocadas. Ambos han pedido a la corona que lo resuelva."
 cc_xp_school.16.a: "Financiar un hospital donde ambos puedan ser probados."
 cc_xp_school.16.b: "Siga a las antiguas autoridades."
 cc_xp_school.16.c: "Deja que los estudiantes estudien a los muertos."
 cc_xp_school.16.d: "Publicar los hallazgos."
 cc_xp_school.17.title: "Cartas y Estrellas"
 cc_xp_school.17.desc: "Los maestros de [cc_xp_school_new_seat.GetName] han terminado un nuevo conjunto de tablas para encontrar la posición de un barco en el mar. Los mercaderes quieren que se reserven para sus propios capitanes. Los maestros quieren que se impriman."
 cc_xp_school.17.a: "Encárgueles nuevas cartas."
 cc_xp_school.17.b: "Enviar a los maestros al mar con la flota."
 cc_xp_school.17.c: "Reservar las tablas para nuestros propios capitanes."
 cc_xp_school.17.d: "Imprimir las tablas para que todos las usen."

 # ---- Renown events ----
 cc_xp_school.30.title: "Un erudito prometedor"
 cc_xp_school.30.desc: "La escuela en [cc_xp_school_new_seat.GetName] ha atraído a un joven erudito de verdadera capacidad, [cc_xp_school_scholar.GetName], que vino debido al nombre de la escuela. Los maestros creen que podrían convertirlo en alguien importante."
 cc_xp_school.30.a: "Tomarlos bajo el cuidado de la corona como protegidos."
 cc_xp_school.30.b: "Darles un lugar en la corte y en la escuela."
 cc_xp_school.30.c: "No tenemos lugar para ellos."
 cc_xp_school.31.title: "Un estudiante extranjero"
 cc_xp_school.31.desc: "Una familia de prestigio en el extranjero ha enviado a su heredero a estudiar en [cc_xp_school_new_seat.GetName]. El nombre de la escuela llegó a ellos antes que cualquier embajador nuestro."
 cc_xp_school.31.a: "Cobre las tasas completas."
 cc_xp_school.31.b: "Eximir las tasas como cortesía."
 cc_xp_school.31.c: "Darles los mejores maestros que tenemos."
 cc_xp_school.32.title: "Un artista atraído por la escuela"
 cc_xp_school.32.desc: "[cc_xp_school_artist.GetName], un artista con una reputación creciente, ha venido a [cc_xp_school_new_seat.GetName] para trabajar entre sus eruditos, y pregunta si la corona tiene un lugar para ellos."
 cc_xp_school.32.a: "Ofréceles un lugar en la corte."
 cc_xp_school.32.b: "No tenemos espacio para ellos."
 cc_xp_school.40.title: "Se corteja a un maestro"
 cc_xp_school.40.desc: "A uno de los mejores maestros de [cc_xp_school_new_seat.GetName] se le ha ofrecido una cátedra en [cc_xp_school_rival.GetName], cuya universidad ahora eclipsa la nuestra. La oferta es generosa."
 cc_xp_school.40.a: "Iguala la oferta."
 cc_xp_school.40.b: "Recordarles lo que le deben a la corona."
 cc_xp_school.40.c: "Déjalos ir."
 cc_xp_school.41.title: "Los estudiantes se marchan"
 cc_xp_school.41.desc: "Los estudiantes que habrían venido a [cc_xp_school_new_seat.GetName] se dirigen en su lugar a [cc_xp_school_rival.GetName]. Sus maestros son más conocidos, y los hijos de nuestros propios mercaderes están entre los que se marchan."
 cc_xp_school.41.a: "Financiar becas para mantenerlos aquí."
 cc_xp_school.41.b: "Prohibir los estudios en el extranjero."
 cc_xp_school.41.c: "Déjalos ir."
 cc_xp_school.42.title: "Primero entre Universidades"
 cc_xp_school.42.desc: "No se habla de ninguna universidad en el mundo conocido más que de la escuela de [cc_xp_school_new_seat.GetName]. Eruditos que antes iban a otros lugares ahora vienen aquí, y las cortes extranjeras solicitan a sus maestros por nombre."
 cc_xp_school.42.a: "Organizar un congreso de eruditos."
 cc_xp_school.42.b: "Celébrelo en la corte."
 cc_xp_school_tt_curriculum_switch: "Las bonificaciones del plan de estudios actual de la escuela terminan, y las del nuevo plan se aplican en su sede y en todo el reino."
 cc_xp_school_while_seated: "mientras la escuela tenga su sede aquí"
 cc_xp_school_while_taught: "mientras una de nuestras escuelas enseñe este plan de estudios"
 cc_xp_school_while_renowned: "mientras nuestras escuelas mantengan su renombre"
 STATIC_MODIFIER_NAME_cc_xp_school_seat_law: "Sede de una Escuela de Derecho"
 STATIC_MODIFIER_DESC_cc_xp_school_seat_law: "La escuela de aquí forma a abogados y escribanos, y la ciudad está gobernada por personas que aprendieron su oficio en ella."
 STATIC_MODIFIER_NAME_cc_xp_school_seat_theology: "Sede de una Escuela de Teología"
 STATIC_MODIFIER_DESC_cc_xp_school_seat_theology: "La escuela de aquí forma a predicadores y confesores, y sus sermones llegan a toda la ciudad."
 STATIC_MODIFIER_NAME_cc_xp_school_seat_natural_philosophy: "Sede de una Escuela de Filosofía Natural"
 STATIC_MODIFIER_DESC_cc_xp_school_seat_natural_philosophy: "La escuela de aquí enseña lectura, medición y cálculo a cualquiera que pueda pagarlo, y muchos pueden."
 STATIC_MODIFIER_NAME_cc_xp_school_seat_letters: "Sede de una Escuela de Letras"
 STATIC_MODIFIER_DESC_cc_xp_school_seat_letters: "Poetas, oradores y copistas se reúnen en torno a la escuela local, y lo que escriben se difunde."
 STATIC_MODIFIER_NAME_cc_xp_school_seat_military_science: "Sede de una Escuela de Ciencias Militares"
 STATIC_MODIFIER_DESC_cc_xp_school_seat_military_science: "Los oficiales formados en la escuela local mantienen el orden en el territorio circundante."
 STATIC_MODIFIER_NAME_cc_xp_school_seat_medicine: "Sede de una Escuela de Medicina"
 STATIC_MODIFIER_DESC_cc_xp_school_seat_medicine: "Los médicos de la escuela de aquí atienden a la ciudad, y menos personas mueren por causas tratables."
 STATIC_MODIFIER_NAME_cc_xp_school_seat_navigation: "Sede de una Escuela de Navegación"
 STATIC_MODIFIER_DESC_cc_xp_school_seat_navigation: "Los carpinteros de ribera y los pilotos aprenden su oficio en la escuela de aquí."
 STATIC_MODIFIER_NAME_cc_xp_school_realm_law: "Formado en Derecho"
 STATIC_MODIFIER_DESC_cc_xp_school_realm_law: "Los funcionarios del reino se forman en su propia escuela de derecho."
 STATIC_MODIFIER_NAME_cc_xp_school_realm_theology: "Instruido en Teología"
 STATIC_MODIFIER_DESC_cc_xp_school_realm_theology: "El clero del reino se forma en su propia escuela de teología."
 STATIC_MODIFIER_NAME_cc_xp_school_realm_natural_philosophy: "Formado en Filosofía Natural"
 STATIC_MODIFIER_DESC_cc_xp_school_realm_natural_philosophy: "La propia escuela de filosofía natural del reino aporta nuevos conocimientos a la corte."
 STATIC_MODIFIER_NAME_cc_xp_school_realm_letters: "Formado en Letras"
 STATIC_MODIFIER_DESC_cc_xp_school_realm_letters: "La escuela de letras del reino hace que su corte sea admirada en el extranjero."
 STATIC_MODIFIER_NAME_cc_xp_school_realm_military_science: "Formado en Ciencia Militar"
 STATIC_MODIFIER_DESC_cc_xp_school_realm_military_science: "Los oficiales del reino se forman en su propia escuela de ciencias militares."
 STATIC_MODIFIER_NAME_cc_xp_school_realm_medicine: "Formado en Medicina"
 STATIC_MODIFIER_DESC_cc_xp_school_realm_medicine: "Los médicos formados en la escuela de medicina del reino ejercen por todo el país."
 STATIC_MODIFIER_NAME_cc_xp_school_realm_navigation: "Formado en Navegación"
 STATIC_MODIFIER_DESC_cc_xp_school_realm_navigation: "Los pilotos del reino se forman en su propia escuela de navegación."
 STATIC_MODIFIER_NAME_cc_xp_school_kind_studium: "Studium"
 STATIC_MODIFIER_DESC_cc_xp_school_kind_studium: "Aquí se encuentra un studium de la iglesia occidental."
 STATIC_MODIFIER_NAME_cc_xp_school_kind_academy: "Academia"
 STATIC_MODIFIER_DESC_cc_xp_school_kind_academy: "Aquí se encuentra una academia de la tradición oriental."
 STATIC_MODIFIER_NAME_cc_xp_school_kind_madrasa: "Madraza"
 STATIC_MODIFIER_DESC_cc_xp_school_kind_madrasa: "Aquí se encuentra una madraza."
 STATIC_MODIFIER_NAME_cc_xp_school_kind_shuyuan: "Shuyuan"
 STATIC_MODIFIER_DESC_cc_xp_school_kind_shuyuan: "Aquí se encuentra un shuyuan, una academia de la tradición del este de Asia."
 STATIC_MODIFIER_NAME_cc_xp_school_kind_vihara: "Vihara"
 STATIC_MODIFIER_DESC_cc_xp_school_kind_vihara: "Aquí se encuentra una escuela monástica."
 STATIC_MODIFIER_NAME_cc_xp_school_kind_gurukula: "Gurukula"
 STATIC_MODIFIER_DESC_cc_xp_school_kind_gurukula: "Aquí se encuentra un gurukula."
 STATIC_MODIFIER_NAME_cc_xp_school_kind_yeshiva: "Yeshivá"
 STATIC_MODIFIER_DESC_cc_xp_school_kind_yeshiva: "Aquí se encuentra una yeshivá."
 STATIC_MODIFIER_NAME_cc_xp_school_kind_school: "Sede de una Escuela"
 STATIC_MODIFIER_DESC_cc_xp_school_kind_school: "Aquí se encuentra una de las escuelas del reino."
 STATIC_MODIFIER_NAME_cc_xp_school_library: "Biblioteca dotada"
 STATIC_MODIFIER_DESC_cc_xp_school_library: "La corona ha pagado los libros, los instrumentos y un edificio para la escuela de aquí."
 STATIC_MODIFIER_NAME_cc_xp_school_scholars: "Eruditos extranjeros"
 STATIC_MODIFIER_DESC_cc_xp_school_scholars: "Eruditos del extranjero han venido a enseñar a la escuela local y traen consigo nuevas ideas."
 STATIC_MODIFIER_NAME_cc_xp_school_drill: "El Entrenamiento de la Escuela"
 STATIC_MODIFIER_DESC_cc_xp_school_drill: "El ejército entrena siguiendo un manual escrito en la escuela de ciencias militares del reino."
 STATIC_MODIFIER_NAME_cc_xp_school_statute: "El Estatuto sobre la Costumbre"
 STATIC_MODIFIER_DESC_cc_xp_school_statute: "Los tribunales siguen el estatuto real cuando este y la costumbre discrepan, tal como argumentaron los abogados de la escuela."
 STATIC_MODIFIER_NAME_cc_xp_school_renown: "Escuelas renombradas"
 STATIC_MODIFIER_DESC_cc_xp_school_renown: "Las escuelas del reino son conocidas en el extranjero, y su reputación es la de la corte. Escala con el renombre de la escuela más prestigiosa del reino."
