 STATIC_MODIFIER_NAME_cc_xp_school_seat_public_finance: "Sede de una Escuela de Finanzas Públicas"
 STATIC_MODIFIER_DESC_cc_xp_school_seat_public_finance: "Los escribanos formados en la escuela de aquí llevan las cuentas de los talleres de la ciudad, y menos de ellos fracasan."
 STATIC_MODIFIER_NAME_cc_xp_school_realm_public_finance: "Instruido en Finanzas Públicas"
 STATIC_MODIFIER_DESC_cc_xp_school_realm_public_finance: "Los funcionarios fiscales del reino se forman en su propia escuela de finanzas públicas."
 STATIC_MODIFIER_NAME_cc_xp_school_seat_rhetoric: "Sede de una Escuela de Retórica"
 STATIC_MODIFIER_DESC_cc_xp_school_seat_rhetoric: "Los oradores de la escuela de aquí exponen las quejas de la ciudad en el ayuntamiento en lugar de en la calle."
 STATIC_MODIFIER_NAME_cc_xp_school_realm_rhetoric: "Instruido en Retórica"
 STATIC_MODIFIER_DESC_cc_xp_school_realm_rhetoric: "Los enviados del reino se forman en su propia escuela de retórica."
 STATIC_MODIFIER_NAME_cc_xp_school_seat_languages: "Sede de una Escuela de Lenguas"
 STATIC_MODIFIER_DESC_cc_xp_school_seat_languages: "Traductores y viajeros se reúnen en la escuela de aquí, y el habla de la ciudad trasciende las fronteras del reino."
 STATIC_MODIFIER_NAME_cc_xp_school_realm_languages: "Instruido en Lenguas"
 STATIC_MODIFIER_DESC_cc_xp_school_realm_languages: "Los intérpretes formados en la escuela de lenguas del reino sirven a sus cortes, a sus enviados y a sus provincias."
 STATIC_MODIFIER_NAME_cc_xp_school_seat_commerce: "Sede de una Escuela de Comercio"
 STATIC_MODIFIER_DESC_cc_xp_school_seat_commerce: "La escuela de aquí enseña cálculo y cambio a los mercaderes de la ciudad, y su mercado atrae el comercio."
 STATIC_MODIFIER_NAME_cc_xp_school_realm_commerce: "Instruido en Comercio"
 STATIC_MODIFIER_DESC_cc_xp_school_realm_commerce: "Los agentes y mercaderes del reino se forman en su propia escuela de comercio."
 STATIC_MODIFIER_NAME_cc_xp_school_seat_history: "Sede de una Escuela de Historia y Genealogía"
 STATIC_MODIFIER_DESC_cc_xp_school_seat_history: "Los cronistas de la escuela de aquí mantienen los registros y las costumbres de la ciudad."
 STATIC_MODIFIER_NAME_cc_xp_school_realm_history: "Instruido en Historia y Genealogía"
 STATIC_MODIFIER_DESC_cc_xp_school_realm_history: "La propia escuela de historia del reino mantiene sus registros y la ascendencia de su casa reinante."
 STATIC_MODIFIER_NAME_cc_xp_school_seat_fortification: "Sede de una Escuela de Fortificación"
 STATIC_MODIFIER_DESC_cc_xp_school_seat_fortification: "Los ingenieros formados en la escuela de aquí mantienen las murallas de la ciudad guarnecidas y reparadas."
 STATIC_MODIFIER_NAME_cc_xp_school_realm_fortification: "Instruido en Fortificación"
 STATIC_MODIFIER_DESC_cc_xp_school_realm_fortification: "Los fuertes del reino son mantenidos por ingenieros formados en su propia escuela de fortificación."
 STATIC_MODIFIER_NAME_cc_xp_school_seat_gunnery: "Sede de una Escuela de Artillería"
 STATIC_MODIFIER_DESC_cc_xp_school_seat_gunnery: "Los fundidores de cañones trabajan junto a la escuela de aquí, y las fundiciones de la ciudad prosperan gracias a ello."
 STATIC_MODIFIER_NAME_cc_xp_school_realm_gunnery: "Instruido en Artillería"
 STATIC_MODIFIER_DESC_cc_xp_school_realm_gunnery: "Los artilleros del reino se forman en su propia escuela de artillería."
 STATIC_MODIFIER_NAME_cc_xp_school_seat_logistics: "Sede de una Escuela de Logística"
 STATIC_MODIFIER_DESC_cc_xp_school_seat_logistics: "Los intendentes formados en la escuela de aquí mantienen llenos los graneros de la ciudad."
 STATIC_MODIFIER_NAME_cc_xp_school_realm_logistics: "Instruido en Logística"
 STATIC_MODIFIER_DESC_cc_xp_school_realm_logistics: "Los intendentes del reino se forman en su propia escuela de logística."
 CC_XP_SCHOOL_ADMISSION_LABEL: "Admisión"
 CC_XP_SCHOOL_ADMISSION_1: "Baja"
 CC_XP_SCHOOL_ADMISSION_2: "Media"
 CC_XP_SCHOOL_ADMISSION_3: "Alta"
 CC_XP_SCHOOL_ADMISSION_1_TT: "Cualquier persona del reino puede inscribirse por voluntad propia. La escuela crece considerablemente, y la aptitud promedio de sus miembros, y con ella la calidad, es modesta. Cada miembro contribuye a la bonificación de la disciplina de la escuela a nivel de todo el reino."
 CC_XP_SCHOOL_ADMISSION_2_TT: "Solo aquellos con una aptitud de 40 o más en la disciplina se inscriben por voluntad propia. La aptitud es la habilidad en la disciplina más 3 por cada nivel de antigüedad superior al primero."
 CC_XP_SCHOOL_ADMISSION_3_TT: "Solo aquellos con una aptitud de 60 o más en la disciplina se inscriben por voluntad propia. La escuela permanece pequeña, y la alta aptitud promedio de sus miembros eleva la calidad, lo que fortalece el plan de estudios. La aptitud es la habilidad en la disciplina más 3 por cada nivel de antigüedad superior al primero."
 cc_xp_tt_school_admission_settled: "Esta escuela no ha cambiado su admisión en los últimos 5 años"
 cc_xp_school_tt_admission_to_1: "La admisión pasa a ser #Y Baja#!: cualquier persona del reino puede inscribirse por voluntad propia."
 cc_xp_school_tt_admission_to_2: "La admisión pasa a ser #Y Media#!: solo se inscriben por voluntad propia aquellos con una aptitud de 40 o más en la disciplina."
 cc_xp_school_tt_admission_to_3: "La admisión pasa a ser #Y Alta#!: solo se inscriben por voluntad propia aquellos con una aptitud de 60 o más en la disciplina."
 cc_xp_school_tt_admission_keeps: "Los miembros actuales permanecen, independientemente de su aptitud."
 CC_XP_SCHOOL_TT_RANK: "Rango del reino (las grandes potencias 5 más, hasta 25):"
 CC_XP_SCHOOL_TT_PRESTIGE: "Prestigio del reino (una décima parte, hasta 10):"
 CC_XP_SCHOOL_TT_WEALTH: "Desarrollo de la sede (hasta 15):"
 CC_XP_SCHOOL_TT_LEARNING: "Alfabetización de los nobles y burgueses de la sede (hasta 20):"
 CC_XP_SCHOOL_TT_MEMBERS_APT: "Miembros (una quinta parte de su aptitud promedio, hasta 20):"
 CC_XP_SCHOOL_TT_APT_AVG: "Aptitud promedio:"
