l_spanish:
 ########################################
 # cc_hyw.1 — The Auld Alliance
 ########################################
 cc_hyw.1.title: "La Antigua Alianza"
 cc_hyw.1.desc: "Con Inglaterra concentrando fuerzas y presionando su reclamación sobre el trono francés, nuestros aliados tradicionales en Escocia observan ansiosamente desde el otro lado del Canal. Si Francia formaliza su compromiso con la independencia de Escocia, bloquearemos el flanco norte de Inglaterra, pero correremos el riesgo de atraer la ira real de Londres."
 cc_hyw.1.a: "Garantizar la independencia de Escocia."
 cc_hyw.1.b: "Prometer apoyo informal, sin un compromiso formal."
 cc_hyw.1.c: "Francia lucha sus propias batallas. Escocia debe valerse por sí misma."

 ########################################
 # cc_hyw.10 — Victory Over England
 ########################################
 cc_hyw.10.title: "Victoria sobre Inglaterra"
 cc_hyw.10.desc: "Los ingleses han sido repelidos. Nuestros ejércitos han demostrado su valía y la flor de lis ondea en lo alto. ¿Cómo aprovecharemos este momento de triunfo?"
 cc_hyw.10.a: "Que el reino se regocije. Renovemos nuestro vínculo con Escocia."
 cc_hyw.10.b: "Aprovechemos nuestra ventaja. Los súbditos de Inglaterra en Francia podrían ser persuadidos."

 ########################################
 # cc_hyw.11 — Defeat Darkens the Kingdom
 ########################################
 cc_hyw.11.title: "La derrota ensombrece el Reino"
 cc_hyw.11.desc: "La guerra no ha resultado como esperábamos. Nuestros ejércitos han sido repelidos y la nobleza se inquieta. La larga sombra de la derrota cae sobre el reino."
 cc_hyw.11.a: "Regruparse y resistir. Francia ha superado cosas peores."
 cc_hyw.11.b: "Exigir sacrificios a los nobles. Proporcionarán las levas que necesitamos, pero a un precio."

 ########################################
 # cc_hyw.12 — War Breaks Out in the West
 ########################################
 cc_hyw.12.title: "Estalla la guerra en el Oeste"
 cc_hyw.12.desc: "Llegan noticias de que [GetCountryName(scope:actor)] ha declarado la guerra a [GetCountryName(scope:recipient)]. Las grandes potencias de la cristiandad occidental están una vez más enfrentadas. ¿Cómo responderemos?"
 cc_hyw.12.a: "Ofrecer mediar entre las partes."
 cc_hyw.12.b: "Expresar nuestro apoyo a [GetCountryName(scope:actor)]."
 cc_hyw.12.c: "Apoyar a [GetCountryName(scope:recipient)]."
 cc_hyw.12.d: "Esto no es asunto nuestro."

 ########################################
 # cc_hyw.13 — Victory in the West
 ########################################
 cc_hyw.13.title: "Victoria en el Oeste"
 cc_hyw.13.desc: "Nuestros ejércitos han prevalecido. Otro enemigo ha sido repelido del suelo francés. El reino se fortalece y la nobleza celebra en los salones de París."
 cc_hyw.13.a: "Que los nobles banqueteen. Francia es victoriosa."
 cc_hyw.13.b: "Aprovechemos la ventaja antes de que nuestro enemigo pueda recuperarse."

 ########################################
 # cc_hyw.20 — Our Suzerain Falters
 ########################################
 cc_hyw.20.title: "Nuestro suzerano flaquea"
 cc_hyw.20.desc: "Francia ha sufrido una derrota y París parece lejana. La nobleza murmura. Al otro lado del agua, los ingleses hacen promesas y extienden cálidos saludos. Puede que haya llegado el momento de reconsiderar dónde residen nuestros verdaderos intereses."
 cc_hyw.20.a: "Contactar con Inglaterra para solicitar apoyo."
 cc_hyw.20.b: "Exigir una mayor autonomía a la corona francesa."
 cc_hyw.20.c: "Permanecer leales. Nuestras fortunas están ligadas a Francia."

 ########################################
 # cc_hyw.21 — A Vassal Reaches Toward England
 ########################################
 cc_hyw.21.title: "Un vasallo busca el acercamiento a Inglaterra"
 cc_hyw.21.desc: "[wavering_subject.GetName] ha estado en contacto con los ingleses, buscando garantías, tal vez, o algo más. La corona no puede permitirse parecer débil. ¿Cómo respondemos a este acto de desafío?"
 cc_hyw.21.a: "Castiga la deslealtad. La autoridad de la corona no será cuestionada."
 cc_hyw.21.b: "Apacigúyalos con oro. La lealtad puede comprarse."
 cc_hyw.21.c: "Que se vayan. No podemos permitirnos esta distracción ahora."

 ########################################
 # cc_hyw.22 — Our Suzerain England Falters
 ########################################
 cc_hyw.22.title: "Inglaterra ha sido derrotada"
 cc_hyw.22.desc: "Los ejércitos de Inglaterra han sido repelidos y el rey lucha por mantener el control sobre sus territorios continentales. Los franceses están haciendo propuestas. Quizás sea momento de reconsiderar nuestra posición."
 cc_hyw.22.a: "Buscar la protección francesa."
 cc_hyw.22.b: "Exigir más autonomía a la corona inglesa."
 cc_hyw.22.c: "Mantenerse firme. Inglaterra se recuperará."

 ########################################
 # cc_hyw.23 — An English Vassal Demands Concessions
 ########################################
 cc_hyw.23.title: "Un vasallo exige concesiones"
 cc_hyw.23.desc: "[eng_wavering_subject.GetName] se ha vuelto audaz tras nuestra derrota. Exigen concesiones, y el susurro de Francia flota en el aire. Inglaterra no puede permitirse parecer débil ante sus súbditos continentales."
 cc_hyw.23.a: "Reivindicar la autoridad inglesa. No se harán concesiones."
 cc_hyw.23.b: "Pagarlos. Un vasallo leal vale cada moneda."
 cc_hyw.23.c: "Liberarlos. Dan más problemas de los que valen."

 ########################################
 # cc_hyw.30 — The Lowlands Question
 ########################################
 cc_hyw.30.title: "La cuestión de las tierras bajas"
 cc_hyw.30.desc: "[lowlands_subject.GetName] envía emisarios a [GetName] con una demanda firme: las provincias neerlandesas aseguradas en nuestra reciente victoria les pertenecen por derecho de proximidad, cultura y largo interés. Negar su reclamación pone en riesgo la lealtad de un vasallo vital, pero concederla implica renunciar a un rico enclave en el norte."
 cc_hyw.30.a: "Conceder a [lowlands_subject.GetName] las provincias de las Tierras Bajas."
 cc_hyw.30.b: "Rechazar. Que busquen otro señor."
 cc_hyw.30.c: "Rechazar la reclamación. Están ligados a nosotros; no se atreverán a marcharse."

 ########################################
 # cc_hyw.31 — A Duchy Without a Lord
 ########################################
 cc_hyw.31.title: "Un ducado sin señor"
 cc_hyw.31.desc: "Nuestros ejércitos han asegurado tierras en los Países Bajos, pero ningún señor las gobierna en nuestro nombre. Los burgueses neerlandeses miran con recelo el dominio extranjero. Podríamos establecer aquí un ducado vasallo leal y ganar buena voluntad en la región, o conservar estas ricas provincias para la corona y aceptar los disturbios resultantes."
 cc_hyw.31.a: "Establecer un ducado vasallo neerlandés para gobernar estas tierras."
 cc_hyw.31.b: "Estas tierras pertenecen a la corona. Las gobernaremos directamente."

 ########################################
 # Bias display names
 ########################################
 cc_hyw_lowlands_land_refused: "Reclamación de las Tierras Bajas Denegada"
 cc_hyw_lowlands_hre_displeasure: "Descontento con la Política de las Tierras Bajas"
 cc_hyw_dutch_nations_anger: "Enojo por vasallo holandés rechazado"

 ########################################
 # Country Interaction: Replace the Appanage Ruler
 ########################################
 cc_hyw_replace_appanage_ruler: "Reemplazar al gobernante del appanage"
 cc_hyw_replace_appanage_ruler_desc: "Reivindicar la autoridad real forzando un cambio de gobernante en un apanage desleal. La intervención reducirá significativamente el deseo de libertad del apanage, pero inquietará a la nobleza francesa y propagará el malestar entre los demás apanages."
 cc_hyw_replace_appanage_ruler_trigger_desc: "La corona francesa reafirma su autoridad sobre [recipient.GetName], instalando una casa más leal al frente del appanage."
