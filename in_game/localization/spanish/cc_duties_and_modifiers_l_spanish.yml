l_spanish:
 # ============================================================
 # Cabinet Duty Actions
 # ============================================================
 cc_duty_free_hands: "Manos Libres"
 cc_duty_free_hands_desc: "El ministro atiende a todo lo que la corte requiera: disponible para audiencias, peticiones y toda la gama de deberes cortesanos triviales. Todos los sistemas de eventos del gabinete permanecen activos a su ritmo base."
 cc_duty_free_hands_action: "Manos Libres"
 cc_duty_free_hands_active: "Manos Libres"

 cc_duty_war_council: "Consejo de Guerra"
 cc_duty_war_council_desc: "El ministro tiene la tarea formal de dirigir la guerra: asesorar sobre campañas, gestionar la logística y mantener la voluntad de luchar. Los eventos del Consejo de Guerra se activan con más frecuencia mientras esté asignado este deber. Termina automáticamente al firmarse la paz."
 cc_duty_war_council_action: "Consejo de Guerra"
 cc_duty_war_council_active: "Asesorando al Consejo de Guerra"

 cc_duty_diplomatic_mission: "Misión diplomática"
 cc_duty_diplomatic_mission_desc: "El ministro es destinado a una corte extranjera, entablando relaciones y promoviendo los intereses del reino en el exterior. Los eventos de sinergia internacional con la corte objetivo se vuelven más frecuentes."
 cc_duty_diplomatic_mission_action: "Misión diplomática"
 cc_duty_diplomatic_mission_active: "En misión diplomática"
 cc_duty_diplomatic_mission_select_target: "Selecciona la corte a la que enviarás a este ministro:"

 cc_duty_domestic_reform: "Reforma Interna"
 cc_duty_domestic_reform_desc: "El ministro se dedica a la gobernanza interna: redactando leyes, reestructurando la burocracia e impulsando propuestas de reforma. Los eventos de progresión de rasgos puente se activan al doble de la velocidad normal."
 cc_duty_domestic_reform_action: "Reforma Interna"
 cc_duty_domestic_reform_active: "Redacción de Reformas"

 cc_duty_scholarly_inquiry: "Indagación erudita"
 cc_duty_scholarly_inquiry_desc: "El ministro se corresponde con eruditos, patrocina el aprendizaje y lleva a cabo investigaciones empíricas. La cadena de eventos de la Corte del Erudito se vuelve más activa mientras se desempeñe este cargo."
 cc_duty_scholarly_inquiry_action: "Indagación erudita"
 cc_duty_scholarly_inquiry_active: "Búsqueda de indagación académica"

 cc_duty_colonial_posting: "Nombramiento colonial"
 cc_duty_colonial_posting_desc: "El ministro es destinado al extranjero para gestionar un súbdito colonial: una compañía privilegiada, una nación colonial o un gobierno provincial. Los eventos de gobernanza colonial se activan regularmente, y el ministro puede regresar con una experiencia en la frontera ganada a pulso."
 cc_duty_colonial_posting_action: "Nombramiento colonial"
 cc_duty_colonial_posting_active: "Destinado al extranjero"
 cc_duty_colonial_posting_select_colony: "Selecciona el súbdito colonial al que enviarás a este ministro:"

 cc_duty_religious_oversight: "Supervisión religiosa"
 cc_duty_religious_oversight_desc: "El ministro supervisa los asuntos confesionales: gestionando la conformidad religiosa, las relaciones interconfesionales y la política teológica en la corte. Los eventos de Reforma y tensión religiosa se vuelven más activos."
 cc_duty_religious_oversight_action: "Supervisión religiosa"
 cc_duty_religious_oversight_active: "Supervisión de asuntos confesionales"

 # ============================================================
 # Cabinet Composition Auto-Modifiers
 # ============================================================
 warlord_court: "Corte del señor de la guerra"
 warlord_court_desc: "El consejo habla con una sola voz marcial. Dos o más especialistas militares dominan el gabinete, aportando disciplina y resolución, pero otros intereses del reino quedan descuidados."

 merchant_republic_spirit: "Espíritu de la casa de cuentas"
 merchant_republic_spirit_desc: "El comercio y las finanzas gobiernan el pensamiento del gabinete. Las redes comerciales florecen, pero las ambiciones militares del reino se quedan discretamente sin hombres."

 enlightened_court: "Corte ilustrada"
 enlightened_court_desc: "Los empiristas y racionalistas han encontrado un hogar en la corte. El conocimiento avanza y el coste del arte de gobernar disminuye, aunque el prestigio marcial ya no es lo que era."

 court_paralysis: "Parálisis de la corte"
 court_paralysis_desc: "Las facciones opuestas dentro del gabinete han llegado a un punto muerto. Cada decisión es cuestionada, cada reforma retrasada; sin embargo, la tensión aún podría producir compromisos inesperados."

 entrenched_court: "Corte consolidada"
 entrenched_court_desc: "El gabinete está compuesto enteramente por veteranos de larga trayectoria. Su profundo conocimiento de las costumbres del reino aporta estabilidad, pero escasean las ideas frescas."

 balanced_court: "Corte equilibrada"
 balanced_court_desc: "Ninguna facción domina, ninguna ideología divide. El gabinete se mantiene en un equilibrio estudiado: el prestigio aumenta para el reino y la palabra del gobernante es su propia respuesta."
 AUTO_MODIFIER_NAME_warlord_court: "Dos o más soldados en el gabinete"
 AUTO_MODIFIER_NAME_merchant_republic_spirit: "Dos o más hombres de comercio en el gabinete"
 AUTO_MODIFIER_NAME_enlightened_court: "Dos o más empiristas en el gabinete"
 AUTO_MODIFIER_NAME_court_paralysis: "Dos ministros de convicciones opuestas"
 AUTO_MODIFIER_NAME_entrenched_court: "Cada ministro es un veterano con larga trayectoria"
 AUTO_MODIFIER_NAME_balanced_court: "Sin facciones ni disputas en el gabinete"
 AUTO_MODIFIER_NAME_nobles_court_captured: "Dos o más nobles en el gabinete"
 AUTO_MODIFIER_NAME_burghers_court_captured: "Dos o más burgueses en el gabinete"
 AUTO_MODIFIER_NAME_clergy_court_captured: "Dos o más clérigos en el gabinete"
