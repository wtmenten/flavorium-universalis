l_spanish:

 ########################################################################
 # CASUS BELLI
 ########################################################################

 cb_assert_junior_partnership: "Reivindicar sociedad menor"
 cb_assert_junior_partnership_desc: "Nuestro socio de unión ha disfrutado durante mucho tiempo de la comodidad de un acuerdo informal. Como potencia senior indiscutible en esta unión, tenemos derecho a formalizar esa relación y a imponerla si es necesario."

 cb_assert_crown_dependency: "Reivindicar dependencia de la corona"
 cb_assert_crown_dependency_desc: "Nuestro matrimonio real con este reino, combinado con nuestra posición dominante en la unión, nos otorga el derecho de formalizarlos como una dependencia de la corona. Haremos que este vínculo sea permanente."

 ########################################################################
 # PEACE TREATIES
 ########################################################################

 cc_force_junior_partnership: "Formalizar como Socio Menor"
 cc_force_junior_partnership_entry: "$cc_force_junior_partnership$"
 cc_force_junior_partnership_entry_short: "$cc_force_junior_partnership$"
 cc_force_junior_partnership_desc: "El reino derrotado reconocerá formalmente nuestra antigüedad, aceptando el estatus vinculante de socio menor en la unión. Su autonomía se verá reducida en consecuencia."

 cc_force_crown_dependency: "Reivindicar dependencia de la corona"
 cc_force_crown_dependency_entry: "$cc_force_crown_dependency$"
 cc_force_crown_dependency_entry_short: "$cc_force_crown_dependency$"
 cc_force_crown_dependency_desc: "El reino derrotado quedará vinculado a nuestra corona como una dependencia formal. El matrimonio real entre nuestras casas hace que esta sea una conclusión natural."

 ########################################################################
 # BIASES / OPINION MODIFIERS
 ########################################################################

 antagonism_cc_force_junior_partnership: "Forzado a una Asociación Menor"
 antagonism_cc_force_crown_dependency: "Forzado a ser Dependencia de la Corona"

 opinion_cc_forced_junior_partnership: "Resiente la Formalización Forzada"
 opinion_cc_forced_crown_dependency: "Resiente la Dependencia Dinástica Forzada"
 opinion_cc_bribed_into_partnership: "Agradecidos por el asentamiento generoso"

 ########################################################################
 # EVENTS — cc_pu.1 (Junior Partner path)
 ########################################################################

 cc_pu.1.title: "Una propuesta para formalizar la unión"

 cc_pu.1.desc: "La unión entre nuestras coronas ha perdurado, pero nuestra relación con [pu_target.GetName] sigue siendo una herencia informal de las circunstancias. Dado que su reino es considerablemente más pequeño que el nuestro, nuestros asesores coinciden en que ha llegado el momento de proponer una asociación formal subordinada, convirtiendo la unión personal en un acuerdo dinástico vinculante que refleje el verdadero equilibrio de poder."

 cc_pu.1.a: "Proponer la asociación formal."
 cc_pu.1.a.tt: "Una propuesta diplomática directa. [pu_target.GetName] aceptará, aunque su corte pueda sentir que el acuerdo no fue enteramente su elección."

 cc_pu.1.b: "Endulzar el trato con un acuerdo generoso. [150 gold]"
 cc_pu.1.b.tt: "Ofrecer un acuerdo financiero a la corte de [pu_target.GetName]. La generosidad elimina cualquier sensación de coerción; el acuerdo es bien recibido en lugar de ser resentido."

 cc_pu.1.c: "Enviar a [cc_pu_minister.GetName] a negociar."
 cc_pu.1.c.tt: "Que nuestro diplomático senior gestione la transición. La habilidad de [cc_pu_minister.GetName] asegura que la propuesta sea recibida como un honor en lugar de una imposición."

 ########################################################################
 # EVENTS — cc_pu.2 (Crown Dependency path)
 ########################################################################

 cc_pu.2.title: "Fortalecimiento del Vínculo Dinástico"

 cc_pu.2.desc: "Nuestro matrimonio real con [pu_target.GetName] ofrece una oportunidad que va más allá del acuerdo de unión ordinario. Con los vínculos dinásticos y la pertenencia a la unión conectando nuestros reinos, podríamos proponer formalizar a [pu_target.GetName] como una dependencia de la corona; un vínculo que honra el linaje compartido mientras establece una precedencia clara para las generaciones futuras."

 cc_pu.2.a: "Proponer la dependencia de la corona formalmente."
 cc_pu.2.a.tt: "Una propuesta dinástica directa. [pu_target.GetName] aceptará el acuerdo, aunque su corte pueda sentir que el cambio no fue enteramente idea suya."

 cc_pu.2.b: "Acompaña la propuesta con un regalo real. [100 gold]"
 cc_pu.2.b.tt: "Un gesto generoso hacia la corte de [pu_target.GetName] suaviza la transición. Sus nobles se sienten compensados en lugar de presionados."

 cc_pu.2.c: "Que [cc_pu_minister.GetName] presente la propuesta en la corte."
 cc_pu.2.c.tt: "Un diplomático hábil hace que el acuerdo de dependencia se sienta como un privilegio. [pu_target.GetName] gana tanto prestigio por la asociación como lo que pierde en autonomía."
