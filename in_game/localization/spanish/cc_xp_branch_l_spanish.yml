l_spanish:
 # ============================================================
 # Cabinet Experience — ladder branch points
 #
 # One entry per event in in_game/events/cc_xp_branch_events.txt (generated).
 # Each fires when a minister has earned a rung that offers two destinations.
 # Option text uses [ShowTraitName('x')] so the player can hover the actual trait
 # and read its real modifiers instead of trusting this copy to restate them.
 #
 # Saved scopes drop the scope: prefix in loc. See docs/scripting-gotchas.md.
 # ============================================================

 # --- cc_xp.20  fiscal: loyal_steward -> prosperity_planner | treasury_enforcer
 cc_xp.20.title: "El Libro de Cuentas del Administrador"
 cc_xp.20.desc: "[cc_xp_subject.GetName] ha llevado los libros de la corona el tiempo suficiente para saber a dónde va realmente el dinero, y ha empezado a decirlo en voz alta. Hay una propuesta sobre la mesa, y otra muy diferente detrás de ella.\n\nLa primera es gastar: poner el excedente en los lugares que lo devolverán triplicado y aceptar cierto desperdicio como el precio del crecimiento. La segunda es detener las fugas. [cc_xp_subject.GetName] puede nombrar cada oficina que cuesta más de lo que devuelve, y desearía permiso para decirlo públicamente."
 cc_xp.20.a: "Invierte. Deja que construyan. ([ShowTraitName('prosperity_planner')])"
 cc_xp.20.b: "Auditoría. Que recorten. ([ShowTraitName('treasury_enforcer')])"

 # --- cc_xp.21  learning: progressive_rationalist -> enlightenment_herald | humanist_philosopher
 cc_xp.21.title: "Una cuestión de audiencia"
 cc_xp.21.desc: "[cc_xp_subject.GetName] ha superado las lecturas que le formaron, y la corte se ha dado cuenta. Lo que queda es la pregunta de qué hacer con ello.\n\nPodrían llevar el argumento hacia afuera: panfletos, correspondencia, el trabajo paciente de convencer a personas que no pidieron ser convencidas. O podrían volverse hacia adentro, hacia la tarea más lenta y menos popular de hacer las cosas bien antes de decirlas."
 cc_xp.21.a: "Deja que prediquen. ([ShowTraitName('enlightenment_herald')])"
 cc_xp.21.b: "Deja que piensen. ([ShowTraitName('humanist_philosopher')])"

 # --- cc_xp.22  law: efficiency_administrator -> estate_guardian | regional_magnate
 cc_xp.22.title: "Dónde debe residir la autoridad"
 cc_xp.22.desc: "[cc_xp_subject.GetName] ha pasado años haciendo que la maquinaria del reino funcione, y ha llegado a una conclusión sobre quién debería girar la manivela.\n\nUna respuesta son los estamentos: antiguos, lentos y duraderos, con obligaciones que funcionan en ambos sentidos. La otra son las provincias: los grandes señores locales que ya poseen la tierra y solo necesitan la bendición de la corona para poseerla formalmente. Ambos son estabilidad. Pero no son la misma estabilidad."
 cc_xp.22.a: "Los estamentos conservan sus derechos. ([ShowTraitName('estate_guardian')])"
 cc_xp.22.b: "Las provincias conservan a sus señores. ([ShowTraitName('regional_magnate')])"

 # --- cc_xp.23  integration: seasoned_integrator -> master_integrator | iron_integrator
 cc_xp.23.title: "El Ritmo de Incorporación"
 cc_xp.23.desc: "Integrar adecuadamente nuevas tierras al reino es un trabajo lento, y [cc_xp_subject.GetName] ha hecho lo suficiente como para que se confíe en su opinión sobre qué tan rápido debería hacerse.\n\nHecho con paciencia, perdura: hombres locales en cargos locales, las viejas costumbres mantenidas donde no cuesten nada. Hecho rápidamente, también perdura, por un tiempo, y el reino queda completo mucho antes. [cc_xp_subject.GetName] está dispuesto a hacerlo de cualquier manera y le gustaría saber cuál."
 cc_xp.23.a: "Pacientemente. Lo que se une correctamente, permanece unido. ([ShowTraitName('master_integrator')])"
 cc_xp.23.b: "Rápidamente. No tenemos una generación que desperdiciar. ([ShowTraitName('iron_integrator')])"

 # --- cc_xp.24  envoy: tentative_envoy -> tactful_envoy | diplomatic_attache
 cc_xp.24.title: "El Enviado Encuentra su Lugar"
 cc_xp.24.desc: "La vacilación ha desaparecido. [cc_xp_subject.GetName] ha pasado por suficientes negociaciones como para dejar de disculparse por estar en la sala, y en lo que queda son visibles dos diplomáticos muy diferentes.\n\nUno maneja el entorno: lee el estado de ánimo, sabe cuándo no decir nada y deja cada corte un poco más predispuesta de lo que estaba. El otro maneja el documento, donde realmente se esconden las concesiones, y ha desarrollado un apetito inquietante por las cláusulas."
 cc_xp.24.a: "Envíalos a la mesa de negociaciones. ([ShowTraitName('tactful_envoy')])"
 cc_xp.24.b: "Envíalos a los archivos. ([ShowTraitName('diplomatic_attache')])"

 # --- cc_xp.25  trade: merchant_syndic -> mercantilist_official | free_market_advocate
 cc_xp.25.title: "De quién es el comercio"
 cc_xp.25.desc: "[cc_xp_subject.GetName] surgió de las casas mercantiles y nunca ha dejado del todo de pensar como tal, que es precisamente la razón por la cual el argumento que sostiene ahora tiene peso.\n\nO bien el comercio es un instrumento de la corona, para ser fletado, dirigido e impositivo donde haga el mayor bien, o es algo que crece mejor cuando la corona le quita la mano y se conforma con una parte menor de una suma mayor."
 cc_xp.25.a: "El comercio sirve a la corona. ([ShowTraitName('mercantilist_official')])"
 cc_xp.25.b: "El comercio se sirve a sí mismo, y a nosotros con él. ([ShowTraitName('free_market_advocate')])"

 # --- cc_xp.26  command: tactical_advisor -> offensive_strategist | defensive_commander
 cc_xp.26.title: "Una doctrina para el ejército"
 cc_xp.26.desc: "[cc_xp_subject.GetName] ha dejado de limitarse a transmitir las opiniones de los generales y ha empezado a tener las suyas propias. Se ha pedido al estado mayor que se prepare para la próxima guerra; la cuestión es para qué guerra deben prepararse.\n\nUn plan asume que elegimos el momento y golpeamos primero. El otro asume que no podremos elegir, y gasta la misma cantidad de dinero en murallas, depósitos y la tarea poco glamurosa de no perder."
 cc_xp.26.a: "Golpearemos primero. ([ShowTraitName('offensive_strategist')])"
 cc_xp.26.b: "No nos pillarán desprevenidos. ([ShowTraitName('defensive_commander')])"

 # --- cc_xp.27  command: offensive_strategist -> supreme_commander | continental_marshal
 cc_xp.27.title: "El Alcance de una Reputación"
 cc_xp.27.desc: "La doctrina ofensiva ha sido reivindicada las veces suficientes para que [cc_xp_subject.GetName] ya no argumente a favor de ella, sino que simplemente la aplique. Lo que se decide ahora es el tamaño de la mano que se le entrega.\n\nPodrían ser puestos al frente de todo el establecimiento militar, en cada una de sus ramas, con la autoridad para reformar lo que encuentren. O podrían mantenerse donde han sido innegablemente excelentes, recibiendo el ejército de campaña y los recursos para convertirlo en el mejor del mundo."
 cc_xp.27.a: "Daleslo todo. ([ShowTraitName('supreme_commander')])"
 cc_xp.27.b: "Dales el ejército. ([ShowTraitName('continental_marshal')])"

 # --- cc_xp.28  command: defensive_commander -> supreme_commander | continental_marshal
 cc_xp.28.title: "La Recompensa por No Perder"
 cc_xp.28.desc: "Es difícil demostrar el valor de una guerra que no ocurrió, pero los fuertes que [cc_xp_subject.GetName] construyó siguen en pie y las fronteras que custodiaban están tranquilas. La corte ha concluido a regañadientes que esto no fue suerte.\n\nPueden ser ascendidos sobre todo el establecimiento militar, con el mandato de aplicar la misma minuciosidad en todas partes. O pueden entregárseles el ejército de campaña, bajo la teoría de que un comandante que entiende el terreno se desperdicia detrás de un escritorio."
 cc_xp.28.a: "Elévalos por encima de todo. ([ShowTraitName('supreme_commander')])"
 cc_xp.28.b: "Dales el ejército. ([ShowTraitName('continental_marshal')])"
