 MODIFIER_TYPE_NAME_cc_shadow_court_bureau_impact_modifier: "Eficiencia de la corte en la sombra"
 MODIFIER_TYPE_DESC_cc_shadow_court_bureau_impact_modifier: "Modifica la eficacia de la burocracia de la Corte en la Sombra, escalando su proyección de poder y sus bonificaciones diplomáticas."

 MODIFIER_TYPE_NAME_cc_royal_trading_bureau_impact_modifier: "Eficiencia de la Oficina Comercial Real"
 MODIFIER_TYPE_DESC_cc_royal_trading_bureau_impact_modifier: "Modifica la eficacia de la Oficina Comercial Real, escalando sus ingresos fiscales y las bonificaciones de capacidad marítima."

 MODIFIER_TYPE_NAME_cc_scholarly_concordat_impact_modifier: "Eficiencia del concordato erudito"
 MODIFIER_TYPE_DESC_cc_scholarly_concordat_impact_modifier: "Modifica la eficacia del Concordato Erudito, escalando su velocidad de investigación y las bonificaciones de crecimiento institucional."

 MODIFIER_TYPE_DESC_monthly_towards_pru_hre: "Deriva mensual hacia la interpretación prusiana de los principios constitucionales del Sacro Imperio Romano Germánico."
 MODIFIER_TYPE_DESC_monthly_towards_pru_empire: "Deriva mensual hacia el establecimiento de un imperio al estilo prusiano mediante una reforma constitucional."

 # ============================================================
 # SUBJECT BOND MODIFIERS — Colonial Nation (cc_bonds.12, cc_bonds.14)
 # ============================================================

 STATIC_MODIFIER_NAME_cc_governor_unrest_reform: "Reforma fiscal colonial"
 STATIC_MODIFIER_DESC_cc_governor_unrest_reform: "Los investigadores enviados para erradicar la corrupción en el aparato fiscal colonial han perturbado los flujos de ingresos existentes. Los ingresos por acuñación y la recaudación de impuestos se verán afectados a corto plazo mientras se asientan las reformas."

 STATIC_MODIFIER_NAME_cc_governor_unrest_appeasement: "Agitación colonial: apaciguada"
 STATIC_MODIFIER_DESC_cc_governor_unrest_appeasement: "Las promesas y los regalos han comprado una calma temporal en la colonia, pero los agravios subyacentes persisten. El sentimiento rebelde sigue creciendo."

 STATIC_MODIFIER_NAME_cc_colonial_representative_strain: "Órganos representativos coloniales"
 STATIC_MODIFIER_DESC_cc_colonial_representative_strain: "El establecimiento de instituciones representativas formales para la colonia requiere navegar entre tradiciones legales enfrentadas y ampliar la capacidad administrativa. Los procesos legislativos se ralentizan y los costes burocráticos aumentan mientras los nuevos organismos encuentran su lugar."

