 STATIC_MODIFIER_NAME_cc_noble_resentment: "Resentimiento noble"
 STATIC_MODIFIER_DESC_cc_noble_resentment: "El estamento noble no ha olvidado el desaire. La cooperación militar y el entusiasmo por la agenda se ven afectados en consecuencia."

