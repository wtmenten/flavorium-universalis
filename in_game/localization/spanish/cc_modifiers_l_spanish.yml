 # Elite enclave / palatinate modifiers
 STATIC_MODIFIER_NAME_cc_enclave_court_favour: "Favor Noble de la Corte"
 STATIC_MODIFIER_DESC_cc_enclave_court_favour: "Las familias líderes del enclave han sido honradas con puestos en la corte, vinculando su lealtad a la corona."
 STATIC_MODIFIER_NAME_cc_palatinate_tournament: "Torneo del Palatinado"
 STATIC_MODIFIER_DESC_cc_palatinate_tournament: "El gran torneo del conde palatino ha extendido la fama del reino a los cuatro vientos."
 STATIC_MODIFIER_NAME_cc_enclave_grand_tournament: "Gran Torneo"
 STATIC_MODIFIER_DESC_cc_enclave_grand_tournament: "Un gran torneo de la nobleza ecuestre ha perfeccionado la caballería del reino y ha pulido el prestigio de la corona."
 STATIC_MODIFIER_NAME_cc_noble_levy_call: "Leva noble"
 STATIC_MODIFIER_DESC_cc_noble_levy_call: "La caballería noble ha respondido a la llamada a las armas: escuadrones de caballos blindados, adiestrados y ansiosos, cabalgan bajo nuestro estandarte."
 STATIC_MODIFIER_NAME_cc_palatinate_dynastic_prestige: "Vínculo dinástico"
 STATIC_MODIFIER_DESC_cc_palatinate_dynastic_prestige: "El linaje del palatinado se ha entrelazado con la dignidad de nuestra dinastía, aportando prestigio y legitimidad a toda la casa."
 STATIC_MODIFIER_NAME_cc_noble_feud: "Disputa noble"
 STATIC_MODIFIER_DESC_cc_noble_feud: "Una amarga disputa entre la alta nobleza se agrava sin control, mermando el prestigio, desgastando la disciplina y agriando la relación con los estamentos."

 STATIC_MODIFIER_NAME_cc_fra_lowlands_ambition: "Ambición de las Tierras Bajas"
 STATIC_MODIFIER_NAME_cc_tur_no_colonization: "Desinterés otomano por la colonización"
 STATIC_MODIFIER_NAME_cc_mam_foreign_rule: "Casta Militar Extranjera"
 STATIC_MODIFIER_NAME_cc_mam_military_strain: "Fragilidad militar"
 STATIC_MODIFIER_NAME_cc_ai_personality_guard: "Enfriamiento del cambio de personalidad de la IA"

 # Hundred Years War modifiers
 STATIC_MODIFIER_NAME_cc_fra_hyw_feudal_strain: "Tensión de guerra feudal"
 STATIC_MODIFIER_DESC_cc_fra_hyw_feudal_strain: "La larga guerra con Inglaterra ha afianzado el dominio noble sobre las levas francesas y ha desgastado la lealtad de los estamentos, decayendo a lo largo de un siglo de conflicto."
 STATIC_MODIFIER_NAME_cc_fra_hyw_war_defeat: "La sombra de la derrota"
 STATIC_MODIFIER_DESC_cc_fra_hyw_war_defeat: "Una derrota reciente ha envalentonado a la nobleza, aumentado el cansancio de la guerra y dificultado el reclutamiento de campesinos. Se acumula con derrotas posteriores."
 STATIC_MODIFIER_NAME_cc_fra_hyw_war_victory: "Confianza del Vencedor"
 STATIC_MODIFIER_DESC_cc_fra_hyw_war_victory: "Una victoria reciente ha elevado la moral y envalentonado el reclutamiento de campesinos. Compensa parcialmente las derrotas acumuladas."
 STATIC_MODIFIER_NAME_cc_fra_hyw_noble_sacrifice: "Sacrificio noble"
 STATIC_MODIFIER_DESC_cc_fra_hyw_noble_sacrifice: "El rey ha exigido que la nobleza proporcione levas adicionales tras la derrota. Ellos acceden — pero a costa de su buena voluntad."
 STATIC_MODIFIER_NAME_cc_eng_hyw_martial_tradition: "Tradición marcial inglesa"
 STATIC_MODIFIER_DESC_cc_eng_hyw_martial_tradition: "La cultura noble inglesa y la tradición del arco largo otorgan al reino una ventaja marcial al inicio de la Guerra de los Cien Años, que se irá diluyendo a lo largo de un siglo."
 STATIC_MODIFIER_NAME_cc_eng_hyw_ascendancy: "Ascendencia inglesa"
 STATIC_MODIFIER_DESC_cc_eng_hyw_ascendancy: "Una victoria reciente ha confirmado la supremacía marcial inglesa, impulsando las levas nobles, la mano de obra y la moral."
 STATIC_MODIFIER_NAME_cc_eng_hyw_setback: "Revés inglés"
 STATIC_MODIFIER_DESC_cc_eng_hyw_setback: "Una derrota ha mermado la confianza inglesa, reduciendo la mano de obra, la moral y la satisfacción de la nobleza."
 STATIC_MODIFIER_NAME_cc_fra_appanage_purge_resentment: "Resentimiento por el appanage"
 STATIC_MODIFIER_DESC_cc_fra_appanage_purge_resentment: "La sustitución forzosa de la casa reinante ha dejado heridas profundas. Las levas nobles se ven reducidas y la satisfacción de los estamentos permanece baja."
 STATIC_MODIFIER_NAME_cc_fra_purge_noble_unease: "Inquietud noble"
 STATIC_MODIFIER_DESC_cc_fra_purge_noble_unease: "La demostración de fuerza de París contra un apanage ha inquietado a la nobleza en general. Los estamentos observan atentamente."

 STATIC_MODIFIER_NAME_cc_colonial_legitimacy_era: "Era de la Legitimidad Colonial"
 STATIC_MODIFIER_DESC_cc_colonial_legitimacy_era: "Otorgar representación formal a una colonia ha resonado en todo el mundo occidental: atrayendo colonos, mejorando la lealtad de los súbditos y otorgando a la Corona una reputación de gobernanza mesurada."
 STATIC_MODIFIER_NAME_cc_colonial_supremecy_era: "Era de la Supremacía Colonial"
 STATIC_MODIFIER_DESC_cc_colonial_supremecy_era: "Por qué conceder representación a cosas tan patéticas."

