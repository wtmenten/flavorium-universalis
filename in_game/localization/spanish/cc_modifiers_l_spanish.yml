 # Colonial Consolidation & Border Friction
 # ============================================================

 STATIC_MODIFIER_NAME_cc_col_viceroyalty: "Sede Virreinal"
 STATIC_MODIFIER_DESC_cc_col_viceroyalty: "Elevado a virreinato que gobierna un reino colonial consolidado, este asiento atrae colonos, comercio y prestigio."
 STATIC_MODIFIER_NAME_cc_col_unified_administration: "Administración Colonial Unificada"
 STATIC_MODIFIER_DESC_cc_col_unified_administration: "La fusión de dos gobiernos coloniales superpuestos en uno solo ha optimizado el gobierno de ultramar de la Corona."
 STATIC_MODIFIER_NAME_cc_col_colonial_coordination: "Coordinación colonial"
 STATIC_MODIFIER_DESC_cc_col_colonial_coordination: "Un consejo de coordinación compartido permite que las colonias vecinas cooperen sin renunciar a sus respectivos escaños."
 STATIC_MODIFIER_NAME_cc_col_frontier_tension: "Frontera en disputa"
 STATIC_MODIFIER_DESC_cc_col_frontier_tension: "Una disputa fronteriza no resuelta agota la prosperidad y aviva el malestar a lo largo de la línea colonial."
 STATIC_MODIFIER_NAME_cc_col_settled_frontier: "Frontera asentada"
 STATIC_MODIFIER_DESC_cc_col_settled_frontier: "Una frontera sondeada y reconocida ha traído calma y confianza a la colonia."
 STATIC_MODIFIER_NAME_cc_col_coerced_labor_regime: "Régimen de trabajo forzado"
 STATIC_MODIFIER_DESC_cc_col_coerced_labor_regime: "Un sistema arraigado de trabajo forzado enriquece a la colonia a un coste duradero para su cohesión."

 STATIC_MODIFIER_NAME_cc_col_plantation_economy: "Economía de plantación"
 STATIC_MODIFIER_DESC_cc_col_plantation_economy: "Las plantaciones de cultivos comerciales impulsan la producción, aunque la mano de obra que exigen genera descontento local."
 STATIC_MODIFIER_NAME_cc_col_encomienda_labor: "Trabajo de Encomienda"
 STATIC_MODIFIER_DESC_cc_col_encomienda_labor: "El trabajo nativo forzado aumenta los ingresos de la colonia mientras suprime a su población."
 STATIC_MODIFIER_NAME_cc_col_mission_district: "Distrito de Misiones"
 STATIC_MODIFIER_DESC_cc_col_mission_district: "Un asentamiento centrado en la conversión que pacifica la frontera y estabiliza la colonia."

 # ============================================================
 # BALANCE OF POWER
 # ============================================================
 STATIC_MODIFIER_NAME_cc_bop_defector: "Desertor del bloque"
 STATIC_MODIFIER_DESC_cc_bop_defector: "Habiendo abandonado su alineación, esta corte es considerada desleal por las cancillerías de Europa."
 STATIC_MODIFIER_NAME_cc_bop_coalition_partner: "Nuevo socio de coalición"
 STATIC_MODIFIER_DESC_cc_bop_coalition_partner: "Recién inscrito en la coalición de equilibrio, impulsado por la promesa de un propósito común."
 STATIC_MODIFIER_NAME_cc_bop_ascendant_confidence: "Confianza Ascendente"
 STATIC_MODIFIER_DESC_cc_bop_ascendant_confidence: "El impulso crece detrás del aspirante a hegemon y de todos los que marchan con él."
 STATIC_MODIFIER_NAME_cc_bop_coalition_solidarity: "Solidaridad de la coalición"
 STATIC_MODIFIER_DESC_cc_bop_coalition_solidarity: "Una coalición unida se mantiene firme ante cualquier intento de dominio del continente."
 STATIC_MODIFIER_NAME_cc_bop_coalition_wavering: "Coalición vacilante"
 STATIC_MODIFIER_DESC_cc_bop_coalition_wavering: "La duda y la discordia se extienden por una coalición que pierde los nervios."
 STATIC_MODIFIER_NAME_cc_bop_bought_ally: "Subsidios Extranjeros"
 STATIC_MODIFIER_DESC_cc_bop_bought_ally: "El oro extranjero llena el tesoro y, con él, llegan los consejos de neutralidad y apaciguamiento."
 STATIC_MODIFIER_NAME_cc_bop_hegemonic_overstretch: "Sobreextensión Hegemónica"
 STATIC_MODIFIER_DESC_cc_bop_hegemonic_overstretch: "La búsqueda del dominio ha agotado nuestros ejércitos y ha inflamado los temores de cada vecino."
 STATIC_MODIFIER_NAME_cc_bop_subsidized: "Subsidios de la coalición"
 STATIC_MODIFIER_DESC_cc_bop_subsidized: "Los fondos de guerra abiertos por la coalición refuerzan nuestra fuerza contra la potencia preponderante."
 STATIC_MODIFIER_NAME_cc_bop_subsidy_strain: "Tensión del Tesoro de Guerra"
 STATIC_MODIFIER_DESC_cc_bop_subsidy_strain: "Financiar la coalición ha vaciado nuestras arcas: el tesoro se desangra, la moneda se devalúa y nuestra propia corte debe apretarse el cinturón."
 STATIC_MODIFIER_NAME_cc_bop_war_footing: "En pie de guerra"
 STATIC_MODIFIER_DESC_cc_bop_war_footing: "Arrastrados por la gran contienda, nuestros ejércitos forrajean libremente por el teatro de operaciones y marchan sin temor a la escasez."
 STATIC_MODIFIER_NAME_cc_bop_balancer_prestige: "Equilibrador de Europa"
 STATIC_MODIFIER_DESC_cc_bop_balancer_prestige: "Reconocido como el árbitro indispensable cuyo peso decide el equilibrio del continente."
 STATIC_MODIFIER_NAME_cc_bop_master_of_europe: "Maestro de Europa"
 STATIC_MODIFIER_DESC_cc_bop_master_of_europe: "El equilibrio se ha roto y nos alzamos sobre el continente: un nuevo Carlomagno, un nuevo César."
 STATIC_MODIFIER_NAME_cc_bop_humbled_power: "Poder Humillado"
 STATIC_MODIFIER_DESC_cc_bop_humbled_power: "No logramos detener al hegemon, y el recuerdo de ese fracaso acompaña a nuestros enviados en cada corte."
 STATIC_MODIFIER_NAME_cc_bop_scourge_of_the_west: "Azote del Oeste"
 STATIC_MODIFIER_DESC_cc_bop_scourge_of_the_west: "El viejo orden occidental no pudo detenernos; nuestros ejércitos se desbordan a través de sus fronteras."
 STATIC_MODIFIER_NAME_cc_bop_western_bulwark: "Baluarte Occidental"
 STATIC_MODIFIER_DESC_cc_bop_western_bulwark: "Castigado pero no derrotado, el oeste se prepara para resistir y reconstruirse."
 STATIC_MODIFIER_NAME_cc_bop_concert_of_europe: "Concierto de Europa"
 STATIC_MODIFIER_DESC_cc_bop_concert_of_europe: "Un orden diplomático duradero, sostenido por congresos y la resolución compartida de mantener la paz."
 STATIC_MODIFIER_NAME_cc_bop_revolutionary_upheaval: "Agitación revolucionaria"
 STATIC_MODIFIER_DESC_cc_bop_revolutionary_upheaval: "El viejo orden es barrido mientras la revolución hace añicos el cuidadoso equilibrio de los reyes."
 STATIC_MODIFIER_NAME_cc_bop_scorched_earth: "Atrapados en una Tierra Quemada"
 STATIC_MODIFIER_DESC_cc_bop_scorched_earth: "El enemigo quema el país ante nosotros; nuestras columnas mueren de hambre y disminuyen en un páramo creado por ellos mismos."
 STATIC_MODIFIER_NAME_cc_bop_continental_blockade: "Bloqueo continental"
 STATIC_MODIFIER_DESC_cc_bop_continental_blockade: "El decreto del hegemón excluye a nuestros mercaderes de los mercados del continente, estrangulando el comercio y fomentando el descontento."
 STATIC_MODIFIER_NAME_cc_bop_levee_en_masse: "La nación en armas"
 STATIC_MODIFIER_DESC_cc_bop_levee_en_masse: "Todo un pueblo movilizado: mano de obra y fervor en abundancia, aunque la leva pone a prueba los vínculos del antiguo orden."
 STATIC_MODIFIER_NAME_cc_bop_arbiter_of_europe: "Árbitro de Europa"
 STATIC_MODIFIER_DESC_cc_bop_arbiter_of_europe: "Mantuvimos unida la coalición y rechazamos al pretendiente a amo del continente. Ahora Europa nos ve como el garante fiable de su paz: nuestra palabra tiene peso en cada cancillería y nuestros mercaderes prosperan bajo el orden que mantenemos."
 STATIC_MODIFIER_NAME_cc_bop_aspiring_hegemon: "El hegemon aspirante"
 STATIC_MODIFIER_DESC_cc_bop_aspiring_hegemon: "Habiendo dominado la coalición que humilló a un aspirante a hegemon, hemos aprendido cómo se construye —y se rompe— tal bloque. Los ejércitos y la ambición que salvaron el equilibrio ahora se orientan hacia nuestra propia preeminencia."
 STATIC_MODIFIER_NAME_cc_bop_vindicated_balancer: "El equilibrador reivindicado"
 STATIC_MODIFIER_DESC_cc_bop_vindicated_balancer: "Sostuvimos la balanza de Europa y, cuando una potencia llegó demasiado lejos, la derribamos. La fe de la coalición no estuvo mal depositada, y el continente recuerda quién lo mantuvo libre."
 STATIC_MODIFIER_NAME_cc_bop_cut_down_to_size: "Poner en su lugar"
 STATIC_MODIFIER_DESC_cc_bop_cut_down_to_size: "Buscamos la maestría y fuimos quebrantados por la unión de nuestros rivales. Reducidos al rango de potencias ordinarias, con nuestros ejércitos mermados y nuestro nombre disminuido, debemos reconstruirnos desde una base más humilde."
 STATIC_MODIFIER_NAME_cc_bop_faded_ambition: "Ambición desvanecida"
 STATIC_MODIFIER_DESC_cc_bop_faded_ambition: "Nuestro momento llegó y pasó. Nunca asestamos el golpe decisivo y, mientras vacilábamos, el mundo siguió adelante sin nosotros."
 STATIC_MODIFIER_NAME_cc_bop_risen_in_shadow: "Surgido en las sombras"
 STATIC_MODIFIER_DESC_cc_bop_risen_in_shadow: "Mientras el aspirante se agotaba intentando alcanzar un dominio que nunca comprendió, nosotros crecimos silenciosamente a su sombra — y le sobrevivimos."
 STATIC_MODIFIER_NAME_cc_bop_coalition_solidarity_empowered: "Solidaridad Empoderada"
 STATIC_MODIFIER_DESC_cc_bop_coalition_solidarity_empowered: "Una coalición que se ha dotado de garras reales —defensa mutua y poderes permanentes— vincula mucho más fuerte que cualquier alianza sobre el papel."
 STATIC_MODIFIER_NAME_cc_bop_war_subsidies: "Caja de Guerra"
 STATIC_MODIFIER_DESC_cc_bop_war_subsidies: "Los subsidios distribuidos por adelantado entre aliados reacios están listos para reducir a la mitad el coste de nuestra próxima llamada a las armas."
 STATIC_MODIFIER_NAME_cc_bop_dragged_to_war: "Arrastrados a la guerra"
 STATIC_MODIFIER_DESC_cc_bop_dragged_to_war: "Arrastrados a una guerra que no elegimos, nuestros soldados marchan con amargura y nuestras arcas sangran por la ambición de otro."

 # --- Coalition parliament actions ---
 STATIC_MODIFIER_NAME_cc_bop_chaumont_pledge: "Tratado de Chaumont"
 STATIC_MODIFIER_DESC_cc_bop_chaumont_pledge: "Unidos por la promesa solemne de no firmar una paz separada, la coalición se mantiene firme y sigue luchando como una sola."
 STATIC_MODIFIER_NAME_cc_bop_combined_command: "El ejército pragmático"
 STATIC_MODIFIER_DESC_cc_bop_combined_command: "Un mando aliado unificado convierte una coalición de ejércitos en un único instrumento de guerra."
 STATIC_MODIFIER_NAME_cc_bop_war_aims_committed: "Objetivos de guerra acordados"
 STATIC_MODIFIER_DESC_cc_bop_war_aims_committed: "Con los botines de la victoria ya repartidos, cada corte tiene un interés en llevar la guerra hasta el final."

 # --- Concert of Europe ---
 STATIC_MODIFIER_NAME_cc_concert_member: "Asiento en el Concierto"
 STATIC_MODIFIER_DESC_cc_concert_member: "Un lugar entre las grandes potencias que gobiernan la paz de Europa otorga a nuestra diplomacia un peso real."
 STATIC_MODIFIER_NAME_cc_concert_intervention_mandate: "Mandato de Intervención"
 STATIC_MODIFIER_DESC_cc_concert_intervention_mandate: "Actuando con la sanción del Concierto, mantenemos el orden establecido con mano firme y libre."
 STATIC_MODIFIER_NAME_cc_concert_sphere_of_influence: "Esfera de influencia"
 STATIC_MODIFIER_DESC_cc_concert_sphere_of_influence: "Las potencias han reconocido nuestra esfera; una cosecha silenciosa de comercio y prestigio emana del acuerdo."

 # --- Concert parliament participation (modifier types) ---
 MODIFIER_TYPE_NAME_cc_concert_president_can_participate_in_parliament: "Presidente en el Congreso"
 MODIFIER_TYPE_DESC_cc_concert_president_can_participate_in_parliament: "El Presidente del Concierto se sienta y vota en el Congreso de las Potencias."
 MODIFIER_TYPE_NAME_cc_concert_seat_can_participate_in_parliament: "Miembro del Congreso"
 MODIFIER_TYPE_DESC_cc_concert_seat_can_participate_in_parliament: "Un miembro del Concierto se sienta y vota en el Congreso de las Potencias."

