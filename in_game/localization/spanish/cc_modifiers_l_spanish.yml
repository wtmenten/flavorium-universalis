 # Temporary age-event modifiers
 STATIC_MODIFIER_NAME_cc_temp_renaissance_observation: "Observación del erudito"
 STATIC_MODIFIER_DESC_cc_temp_renaissance_observation: "El estudio metódico de un ministro sobre los nuevos conocimientos ha producido una mejora modesta pero mensurable en la investigación institucional y la alfabetización."

 # Legacy Track C — Elder's Final Gift modifiers (base + consecrated, 11 pairs)
 STATIC_MODIFIER_NAME_cc_legacy_elder_grand_chancellor: "Legado del gran canciller"
 STATIC_MODIFIER_DESC_cc_legacy_elder_grand_chancellor: "Las décadas de diplomacia paciente del Gran Canciller perduran como un aumento permanente de nuestro alcance diplomático, reputación y capacidad."
 STATIC_MODIFIER_NAME_cc_legacy_elder_grand_chancellor_consecrated: "Legado consagrado del Gran Canciller"
 STATIC_MODIFIER_DESC_cc_legacy_elder_grand_chancellor_consecrated: "Una solemne ceremonia de consagración ha elevado el legado del Gran Canciller a una característica definitoria de la identidad de la política exterior de este reino."

 STATIC_MODIFIER_NAME_cc_legacy_elder_cavalry_marshal: "Legado del mariscal de caballería"
 STATIC_MODIFIER_DESC_cc_legacy_elder_cavalry_marshal: "La doctrina de guerra móvil del Mariscal perdura en la reducción de los costes de caballería, una disciplina más fuerte y una tradición de acciones ofensivas audaces."
 STATIC_MODIFIER_NAME_cc_legacy_elder_cavalry_marshal_consecrated: "Legado consagrado del Mariscal de Caballería"
 STATIC_MODIFIER_DESC_cc_legacy_elder_cavalry_marshal_consecrated: "La memoria del Mariscal ha sido elevada a un ideal marcial: un multiplicador de fuerza permanente para cada comandante que cabalgue bajo nuestro estandarte."

 STATIC_MODIFIER_NAME_cc_legacy_elder_supreme_commander: "Legado del comandante supremo"
 STATIC_MODIFIER_DESC_cc_legacy_elder_supreme_commander: "Las reformas sistemáticas del Comandante Supremo en nuestro aparato militar perduran: costes reducidos, mejor disciplina y una cadena de mando racionalizada."
 STATIC_MODIFIER_NAME_cc_legacy_elder_supreme_commander_consecrated: "Legado consagrado del comandante supremo"
 STATIC_MODIFIER_DESC_cc_legacy_elder_supreme_commander_consecrated: "El legado del Comandante Supremo ha quedado consagrado permanentemente como una tradición militar: cada regimiento entrena según el estándar que él estableció."

 STATIC_MODIFIER_NAME_cc_legacy_elder_learned_courtier: "Legado del cortesano erudito"
 STATIC_MODIFIER_DESC_cc_legacy_elder_learned_courtier: "El amor del cortesano erudito por el saber perdura en forma de una investigación institucional mejorada y una cultura de alfabetización duradera en la corte."
 STATIC_MODIFIER_NAME_cc_legacy_elder_learned_courtier_consecrated: "Legado consagrado del Cortesano Erudito"
 STATIC_MODIFIER_DESC_cc_legacy_elder_learned_courtier_consecrated: "La memoria del cortesano erudito se ha convertido en un ideal fundacional de nuestra cultura intelectual; aquí las instituciones crecen tan naturalmente como los árboles."

 STATIC_MODIFIER_NAME_cc_legacy_elder_enlightenment_herald: "Legado del heraldo de la Ilustración"
 STATIC_MODIFIER_DESC_cc_legacy_elder_enlightenment_herald: "El desafío del heraldo a la superstición y a la sabiduría aceptada ha dejado una huella permanente: la alfabetización aumenta y las reformas llegan con menor resistencia."
 STATIC_MODIFIER_NAME_cc_legacy_elder_enlightenment_herald_consecrated: "Legado consagrado del Heraldo de la Ilustración"
 STATIC_MODIFIER_DESC_cc_legacy_elder_enlightenment_herald_consecrated: "Las ideas del Heraldo de la Ilustración han sido consagradas en la filosofía fundacional de este reino; aquí gobierna la razón tanto como la tradición."

 STATIC_MODIFIER_NAME_cc_legacy_elder_master_urbanist: "Legado del maestro urbanista"
 STATIC_MODIFIER_DESC_cc_legacy_elder_master_urbanist: "La visión del Maestro Urbanista de la ciudad como motor de progreso perdura en la reducción de los costes de construcción y la aceleración del desarrollo."
 STATIC_MODIFIER_NAME_cc_legacy_elder_master_urbanist_consecrated: "Legado consagrado del maestro urbanista"
 STATIC_MODIFIER_DESC_cc_legacy_elder_master_urbanist_consecrated: "El legado del Maestro Urbanista ha sido consagrado como doctrina cívica; nuestras ciudades se construyen y gobiernan según el estándar establecido por [CHARACTER.GetSheHe]."

 STATIC_MODIFIER_NAME_cc_legacy_elder_progressive_rationalist: "Legado del racionalista progresista"
 STATIC_MODIFIER_DESC_cc_legacy_elder_progressive_rationalist: "El desmantelamiento sistemático de la superstición por parte del racionalista ha dejado un legado permanente de investigación acelerada y receptividad institucional."
 STATIC_MODIFIER_NAME_cc_legacy_elder_progressive_rationalist_consecrated: "Legado consagrado del racionalista progresista"
 STATIC_MODIFIER_DESC_cc_legacy_elder_progressive_rationalist_consecrated: "La filosofía del racionalista progresista se ha vuelto fundamental: este reino avanza por instinto institucional, no por decreto real."

 STATIC_MODIFIER_NAME_cc_legacy_elder_confucian_mandarin: "Legado del mandarín confuciano"
 STATIC_MODIFIER_DESC_cc_legacy_elder_confucian_mandarin: "La devoción del mandarín por la gobernanza meritocrática y las relaciones adecuadas perdura como una ganancia permanente en la eficiencia del gabinete y la velocidad de asimilación."
 STATIC_MODIFIER_NAME_cc_legacy_elder_confucian_mandarin_consecrated: "Legado consagrado del Mandarín Confuciano"
 STATIC_MODIFIER_DESC_cc_legacy_elder_confucian_mandarin_consecrated: "Los principios del mandarín confuciano han sido consagrados en el alma administrativa de este reino: el gobierno como vocación moral."

 STATIC_MODIFIER_NAME_cc_legacy_elder_caliphate_diplomat: "Legado del diplomático del califato"
 STATIC_MODIFIER_DESC_cc_legacy_elder_caliphate_diplomat: "La maestría del Diplomático del Califato en las relaciones interestatales perdura en forma de un mayor alcance diplomático, un menor antagonismo y conexiones comerciales más fuertes."
 STATIC_MODIFIER_NAME_cc_legacy_elder_caliphate_diplomat_consecrated: "Legado consagrado del Diplomático del Califato"
 STATIC_MODIFIER_DESC_cc_legacy_elder_caliphate_diplomat_consecrated: "El legado del Diplomático del Califato ha sido consagrado como una tradición diplomática; las cortes extranjeras comprenden lo que representa nuestra bandera."

 STATIC_MODIFIER_NAME_cc_legacy_elder_seneschal: "Legado del senescal"
 STATIC_MODIFIER_DESC_cc_legacy_elder_seneschal: "Toda una vida del senescal gestionando las grandes casas perdura en forma de costes de corte reducidos y una mejora permanente de la eficiencia administrativa."
 STATIC_MODIFIER_NAME_cc_legacy_elder_seneschal_consecrated: "Legado consagrado del senescal"
 STATIC_MODIFIER_DESC_cc_legacy_elder_seneschal_consecrated: "La maestría del senescal en la gestión de la corte ha sido consagrada como doctrina institucional: cada tesorería y casa sigue un estándar establecido por él."

 STATIC_MODIFIER_NAME_cc_legacy_elder_marshal_of_the_court: "Legado del mariscal de la corte"
 STATIC_MODIFIER_DESC_cc_legacy_elder_marshal_of_the_court: "El doble dominio del Mariscal sobre la ceremonia y el mando perdura en la mejora de las relaciones con la nobleza, una mejor disciplina militar y una corte más prestigiosa."
 STATIC_MODIFIER_NAME_cc_legacy_elder_marshal_of_the_court_consecrated: "Legado consagrado del Mariscal de la Corte"
 STATIC_MODIFIER_DESC_cc_legacy_elder_marshal_of_the_court_consecrated: "La memoria del mariscal de la corte ha quedado permanentemente tejida en la estructura de nuestra cultura cortesana: la disciplina y la ceremonia como una única expresión del poder soberano."

