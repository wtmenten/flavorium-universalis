l_spanish:
 # === cc_bonds.90 — A Loyal Colony in Turbulent Times ===
 cc_bonds.90.title: "Una colonia leal en tiempos turbulentos"
 cc_bonds.90.desc: "La Era de las Revoluciones ha llegado y las colonias del mundo se están agitando. [bond_subj.GetName] no lo hace. Décadas de gobierno compartido e inversión económica han producido una población colonial que ve su futuro dentro del imperio en lugar de fuera de él, y un liderazgo colonial que ha pasado este año conteniendo a su propio pueblo frente a los panfletos. Eso no es suerte. Es el libro de cuentas."
 cc_bonds.90.a: "Reconozca su lealtad formalmente, y deje que todas las demás colonias lean sobre ello."
 cc_bonds.90.b: "Presione las levas de emergencia mientras tengamos su buena voluntad."
 cc_bonds.90.c: "Invitarlos al Consejo Imperial."

 # === cc_bonds.91 — The Colony Finds Its Voice ===
 cc_bonds.91.title: "La colonia encuentra su voz"
 cc_bonds.91.desc: "[bond_subj.GetName] no ha esperado a que se le diga de qué lado está. Los panfletos revolucionarios circulan abiertamente, las reuniones públicas se han convertido en manifestaciones y el estado de ánimo ha pasado del agravio a la convicción. El libro de cuentas de la extracción, las peticiones denegadas y los gobernadores que gravaron y tomaron sin dar nada a cambio se ha llevado con cuidado. El ajuste de cuentas ha llegado."
 cc_bonds.91.a: "Tomar medidas estrictas. Dejar claro quién gobierna esta colonia."
 cc_bonds.91.b: "Conceder todo lo que deberíamos haber concedido hace años."

 # === cc_bonds.92 — The Governor Stands With the Crown ===
 cc_bonds.92.title: "El gobernador se mantiene fiel a la corona"
 cc_bonds.92.desc: "El momento revolucionario que ha sacudido a otras provincias encuentra a [bond_subj.GetName] tranquila. El gobernador no solo ha mantenido el orden; ha alineado la administración local con la corona, ha suprimido la agitación antes de que echara raíces y ha escrito para explicar cómo lo hizo en lugar de pedir crédito. La infraestructura que financiamos y los administradores que tratamos como socios están dando dividendos ahora, cuando más importa."
 cc_bonds.92.a: "Elogiar al gobernador públicamente."

 # === cc_bonds.93 — The Province Remembers ===
 cc_bonds.93.title: "La provincia recuerda"
 cc_bonds.93.desc: "La era revolucionaria ha llegado a [bond_subj.GetName], y la provincia la estaba esperando. Los despachos del gobernador se han vuelto más cortos y sus respuestas más lentas. El último describía la situación como manejable, que es la palabra burocrática para una situación que no lo es. Décadas de extracción, de gobernadores recompensados por la recaudación en lugar de por la gobernanza, de leyes locales anuladas por conveniencia administrativa: nada de esto se ha olvidado."
 cc_bonds.93.a: "Pague lo necesario para mantener esta provincia. Cueste lo que cueste."
 cc_bonds.93.b: "Manténgalo con la guarnición. El consentimiento ya no es el instrumento disponible."

 # === cc_bonds.94 — The Palatinate Answers the Call ===
 cc_bonds.94.title: "El Palatinado responde a la llamada"
 cc_bonds.94.desc: "La Era de las Revoluciones trae consigo una prueba de lealtades, y [bond_subj.GetName] ha respondido con claridad. El señor del palatinado se ha movilizado sin que se lo pidieran, ha escrito para ofrecer todo su apoyo militar y ha enviado a su hijo mayor a servir en nuestro ejército como un gesto personal. Las ceremonias respetadas, las levas gestionadas con justicia, las disputas mediadas con paciencia: él tampoco ha olvidado nada de ello."
 cc_bonds.94.a: "Estamos honrados. El palatinado permanece con nosotros."
 cc_bonds.94.b: "Saldemos primero la vieja deuda y luego salgamos al campo juntos."

 # === cc_bonds.95 — The Palatinate Declares Armed Neutrality ===
 cc_bonds.95.title: "El Palatinado declara la neutralidad armada"
 cc_bonds.95.desc: "El señor de [bond_subj.GetName] ha enviado una declaración formal. No se une a la revolución. Tampoco se une a nosotros. El palatinado se encuentra en estado de neutralidad armada, lo que significa en la práctica que sus fuerzas defenderán su territorio y ningún otro, que no responderá a los llamados a las armas y que tiene la intención de ver cómo se resuelve la era antes de comprometerse más. Décadas de peticiones ignoradas y ceremonias omitidas produjeron a un señor al que ha dejado de importarle si la corona sobrevive."
 cc_bonds.95.a: "Aceptar la declaración. La neutralidad es mejor que una revuelta abierta."
 cc_bonds.95.b: "Rescatar al señor. Sea cual sea el monto de los atrasos, pagarlos."

 # === cc_bonds.96 — The March Holds the Frontier ===
 cc_bonds.96.title: "La marca sostiene la frontera"
 cc_bonds.96.desc: "La era revolucionaria ha desestabilizado muchas fronteras y [bond_subj.GetName] ha mantenido cada centímetro de las nuestras. El señor de la marca ha defendido la frontera de una manera que hace que la corona parezca competente: rápido, capaz y actuando claramente en nuestro nombre. Sus cartas son breves y profesionales. No pide reconocimiento. Las ceremonias honradas, los botines compartidos, la guarnición financiada; todo ello construyó una cultura militar que ahora nos sirve."
 cc_bonds.96.a: "El señor de la marca ha servido bien a la corona. Así sea."
 cc_bonds.96.b: "Traer al pupilo bajo nuestro propio mando. Ya ha superado la frontera."

 # === cc_bonds.97 — The March Lord Raises His Own Banner ===
 cc_bonds.97.title: "El señor de la marca levanta su propio estandarte"
 cc_bonds.97.desc: "El señor de la marca de [bond_subj.GetName] ha levantado su propio estandarte. Esto no es una revuelta campesina ni un panfleto. Este es un comandante militar con soldados entrenados, un conocimiento íntimo de la frontera y años de agravios acumulados que no tomamos en serio. La guarnición denegada, los botines retenidos, la ceremonia omitida: él llevó su propio libro de cuentas, y ha decidido que la deuda se pague ahora en una moneda diferente."
 cc_bonds.97.a: "Envíe un enviado con términos. Pague lo que deberíamos haber pagado hace años."
 cc_bonds.97.b: "Es un súbdito en revuelta. Tratarlo como tal."

 # === cc_bonds.98 — The Dependency Stands True ===
 cc_bonds.98.title: "La Dependencia Permanece Leal"
 cc_bonds.98.desc: "Entre los alarmantes despachos de la era revolucionaria, una nota se lee de forma distinta. La casa gobernante de [bond_subj.GetName] ha escrito no para pedir nada, ni para negociar, ni para advertirnos de disturbios, sino para reafirmar su lealtad. La carta es personal. Recuerda las visitas y las ceremonias, los momentos en que la corona trató a su casa como familia en lugar de como un cliente. Las cortes vecinas lo han notado."
 cc_bonds.98.a: "Responder en la misma moneda. Así es como luce una relación duradera."

 # === cc_bonds.99 — The Dependency Looks Elsewhere ===
 cc_bonds.99.title: "La Dependencia Mira hacia Otro Lugar"
 cc_bonds.99.desc: "Ha llegado una carta de la casa gobernante de [bond_subj.GetName]. Es cortés, mesurada y devastadora. No están declarando su independencia ni se están uniendo a ninguna coalición revolucionaria. Simplemente están explorando, de manera formal y discreta, qué otros acuerdos podrían estar disponibles. Han identificado a una potencia vecina que ha expresado interés. Nos lo comunican a nosotros primero, lo cual puede ser su último acto de lealtad."
 cc_bonds.99.a: "Ofrezca todo lo que deberíamos haber ofrecido hace años. Pídales que se queden."
 cc_bonds.99.b: "Si han encontrado un mejor acuerdo, no se interpongan en su camino."
 cc_bonds.99.c: "Son nuestra dependencia. No tienen derecho a explorar acuerdos."
 cc_bonds.90.desc.deep: "La Era de las Revoluciones ha llegado y las colonias del mundo se están agitando. En [bond_subj.GetName], la asamblea colonial ha aprobado una resolución de lealtad sin que se le solicitara, y la milicia ha sido puesta a nuestra disposición en lugar de permanecer en casa. Su gobernador escribe que no espera problemas, y ofrece razones en lugar de garantías. Una relación así de profunda vale ahora más para la corona que una flota."
 cc_bonds.90.desc.voice: "La Era de las Revoluciones ha llegado y, en [bond_subj.GetName], la discusión se está llevando a cabo en la sala de asambleas que nosotros mismos fundamos, en lugar de en la calle. Los delegados debaten largamente y en público sobre la lealtad, los impuestos y la representación, y lo hacen como miembros del imperio y no como sus críticos. Para cada queja que gritan los revolucionarios en otros lugares, esta colonia tiene un canal formal. Ese canal es la razón por la que estamos leyendo una transcripción en lugar de una lista de bajas."
 cc_bonds.91.desc.deep: "[bond_subj.GetName] ya no discute con nosotros. La asamblea colonial, tal como existía, se ha disuelto y se ha reconstituido como algo con un nombre diferente y una declaración adjunta. Las compañías de milicia están entrenando a plena luz del día. Nuestros oficiales de aduanas han sido escoltados hasta los muelles con sus papeles y su dignidad intactos, lo cual es, de alguna manera, peor. No están pidiendo reparación. Están describiendo lo que sucederá a continuación."
 cc_bonds.91.desc.scholar: "Los panfletos que circulan en [bond_subj.GetName] no son importados. Se están escribiendo allí, y se están escribiendo bien, por el erudito que decidimos hace una generación que era más seguro silenciar que responder. La supresión no terminó con el argumento; eliminó nuestro lado de la discusión. Las imprentas coloniales no pueden seguir el ritmo de la demanda, y las manifestaciones frente a la residencia del gobernador nos están citando nuestras propias cartas constitutivas."
 cc_bonds.91.desc.faith: "El momento revolucionario ha llegado a [bond_subj.GetName] y el clero lo está liderando. La conversión que impusimos fue aceptada en público y resentida en privado mientras el resentimiento fuera todo lo disponible. Los antiguos ritos han reaparecido la misma semana que los nuevos panfletos, y ambos se predican desde los mismos púlpitos. La fe y el agravio se han encontrado, y ahora ninguno es negociable."
 cc_bonds.91.c: "Libérelos, antes de que la disputa cruce el océano."
 cc_bonds.92.desc.deep: "[bond_subj.GetName] está más silencioso este año de lo que ha estado en una década. El gobernador ha hecho más que mantener su provincia: nos ha enviado un método de trabajo, probado localmente, para mantener a una población leal en una era que recompensa lo contrario. Sus oficiales son competentes, sus cuentas son honestas y sus cartas se leen como si la revolución fuera un fenómeno meteorológico para el cual se había preparado. Nos vendrían bien veinte como él."
 cc_bonds.92.desc.council: "El consejo provincial que cartilageamos ha pasado este año haciendo aquello para lo que sirven los consejos. Ha escuchado las quejas que se están convirtiendo en disturbios en otros lugares, ha debatido sobre ellas largamente y ha producido recomendaciones en lugar de exigencias. El gobernador las reenvía con su respaldo. [bond_subj.GetName] no está tranquila porque esté satisfecha; está tranquila porque tiene un lugar donde depositar su descontento."
 cc_bonds.92.b: "Envíe a sus administradores a nuestras propias provincias. Necesitamos lo que él sabe."
 cc_bonds.93.desc.deep: "El gobernador de [bond_subj.GetName] ha dejado de escribir. Lo que nos llega en su lugar es una petición, firmada por nombres que no empleamos, enumerando cada estatuto que impusimos contra la objeción local con la fecha y la objeción registrada al lado. No es una amenaza. Es un acta de acusación, y es precisa. La provincia ha estado guardando este documento durante un siglo y ha decidido que ha llegado el momento de presentarlo."
 cc_bonds.93.desc.faith: "La provincia ha tomado el momento revolucionario como permiso para responder a una pregunta antigua. La conversión que ordenamos se está revirtiendo en la práctica más rápido de lo que podemos registrarlo, y los hombres que lideran la reversión son los mismos que nosotros nombramos para imponerla. [bond_subj.GetName] no está rechazando la autoridad de la corona en general. Está rechazando el único uso de ella que nadie allí aceptó jamás."
 cc_bonds.93.c: "La situación es la que es. Nos manejamos lo mejor que podemos."
 cc_bonds.94.desc.deep: "El señor de [bond_subj.GetName] llegó a la corte en persona, algo que no estaba obligado a hacer, al frente de una columna que reunió a sus propios gastos, algo que ciertamente no estaba obligado a hacer. Se ha puesto a sí mismo y a su casa bajo nuestro mando por el tiempo que dure el conflicto y no ha pedido nada por escrito. En una era en la que las grandes potencias están perdiendo sus capitales ante sus propios ciudadanos, un señor palatino se comporta como si las viejas obligaciones todavía significaran lo que dicen."
 cc_bonds.94.desc.interregnum: "El palatinate se ha movilizado, y la carta del señor es afectuosa, y hay una segunda carta doblada dentro de la primera. Se refiere al interregno: los meses en que la sucesión fue disputada, cuando su casa pidió a la corona que arbitrara y la corona no respondió a tiempo. No se dijo nada después. Tampoco está diciendo mucho ahora. Simplemente señala que el asunto nunca se resolvió, y que se está movilizando de todos modos."
 cc_bonds.94.c: "Pedir a su mejor caballero. Tenemos una guerra que luchar y a nadie que la lidere."
 cc_bonds.95.desc.deep: "La declaración de [bond_subj.GetName] tiene tres frases de largo y ha sido copiada a todas las cortes vecinas antes de llegarnos. El palatinado se defenderá a sí mismo. Reconocerá al gobierno que controle nuestra capital al final de todo esto. Considera sus obligaciones cumplidas. El señor no se ha rebelado, lo cual sería al menos una relación. Simplemente nos ha borrado por completo de sus cálculos."
 cc_bonds.95.desc.fort: "La declaración del señor menciona la fortaleza una vez, de pasada, como el lugar desde el cual llevará a cabo su neutralidad. No necesita decir más. Negamos la financiación, las murallas se levantaron de todos modos con sus propias monedas y la guarnición ha respondido a su casa desde entonces. Nosotros construimos el agravio y él construyó la fortaleza, y ahora ambos son el mismo objeto."
 cc_bonds.95.c: "El palatinado nos responde. Responderá ahora."
 cc_bonds.96.desc.deep: "[bond_subj.GetName] ha pasado el año haciendo algo más difícil que mantener la frontera. Ha mantenido la frontera mientras el interior ardía, ha absorbido dos oleadas de refugiados de provincias que no pudimos proteger y ha repelido un ataque exploratorio de un vecino que asumió que nuestros problemas eran una oportunidad. El despacho del señor de la marca sobre el asunto consta de cuatro líneas. Tres de ellas tratan sobre el suministro."
 cc_bonds.96.desc.fort: "La frontera ha resistido, y la razón es la fortaleza que financiamos. El informe del señor de la marca es, en gran medida, una lista de lo que las murallas hicieron innecesario: enfrentamientos que no se libraron, aldeas que no fueron evacuadas, un asedio que terminó cuando el sitiador contó los cañones y regresó a casa. El dinero gastado hace décadas en piedra ha resultado ser el soldado más barato que jamás compramos."
 cc_bonds.96.desc.ward: "El joven que criamos en la corte ha vuelto a casa para comandar las fuerzas de su padre, y la frontera nunca ha estado mejor defendida. Conoce a nuestro personal, nuestro sistema de suministros y nuestras expectativas, porque creció dentro de ellos, y conoce el terreno porque nació en él. Lo que empezó como un acuerdo de rehenes ha producido lo único que ningún tratado puede: un comandante de frontera que es genuinamente nuestro y genuinamente suyo a la vez."
 cc_bonds.97.desc.deep: "La marca ha pasado enteramente a su bando. No una facción de ella, ni una sucesión disputada: el señor, sus oficiales, sus levas y sus fortalezas, en un solo movimiento, en una fecha que claramente eligió de antemano. Nuestras guarniciones fronterizas se enteraron cuando sus columnas de relevo no llegaron. Ha pasado una generación aprendiendo cómo hacemos campaña, y está a punto de demostrarlo."
 cc_bonds.97.desc.fort: "La bandera ondeó sobre la fortaleza, que es el detalle que importa. Nos negamos a financiar esos muros; el señor de la marcha los construyó de todos modos y nunca volvió a mencionarlo. Ahora, la posición más fuerte de nuestra frontera está ocupada contra nosotros por el hombre que la pagó, y cada argumento que podamos presentar sobre la obligación choca con un conjunto de cuentas que preferiríamos no leer en voz alta."
 cc_bonds.97.desc.ward: "El señor de la marca que ha levantado su estandarte contra nosotros es el muchacho que trajimos a la corte. Le enseñamos nuestro entrenamiento, nuestro trabajo de estado mayor y nuestras tablas de suministros, y al mismo tiempo le enseñamos exactamente cuán poco se valoraba el servicio de su familia. Nos ha agradecido la primera educación poniéndola en práctica. Los oficiales que ahora lo enfrentan entrenaron junto a él."
 cc_bonds.97.c: "Dejarlo ir. Que la era se lo lleve, y que sea lejos de aquí."
 cc_bonds.98.desc.deep: "La casa reinante de [bond_subj.GetName] ha hecho algo que ningún tratado los obligaba a hacer. Han escrito a las cortes que estaban tanteándolos y les han dicho, en un lenguaje que se cuidaron de hacer citable, que la cuestión no se plantea. La carta para nosotros llegó después, casi como una ocurrencia tardía, y trata principalmente sobre un bautizo. Ahora media Europa sabe cuánto vale nuestra palabra, porque alguien más la ha dicho por nosotros."
 cc_bonds.98.b: "Pedirles que hablen por nosotros en las cortes que nos observan."
 cc_bonds.99.desc.deep: "La carta de [bond_subj.GetName] ya no es exploratoria. Se han discutido los términos, existe un borrador y se ha mencionado una fecha. Nos han enviado la cortesía de un resumen. Al leerlo, lo sorprendente es lo poco que nos concierne: nosotros somos el acuerdo que está siendo reemplazado, descrito en tiempo pasado, por personas que dejaron de esperar algo de nosotros hace tiempo y finalmente han encontrado otro lugar de donde esperarlo."
