l_spanish:
 # === cc_bonds.90 — A Loyal Colony in Turbulent Times ===
 cc_bonds.90.title: "Una colonia leal en tiempos turbulentos"
 cc_bonds.90.desc: "La Era de las Revoluciones ha llegado y las colonias del mundo se están agitando. Pero [bond_subj.GetName] no se agita: se mantiene firme. Décadas de gobernanza compartida, inversión económica y asociación política han producido algo que ninguna proclama podría fabricar: una población colonial que ve su futuro dentro del imperio en lugar de fuera de él. El liderazgo colonial no se ha limitado a evitar unirse a las corrientes revolucionarias, sino que ha trabajado activamente para retener a su población. Así es como luce una generación de buenas decisiones."
 cc_bonds.90.a: "Reconocer formalmente la lealtad de [bond_subj.GetName]. Elevar su posición dentro del imperio."
 cc_bonds.90.b: "Reclutar levas de emergencia mientras tengamos su buena voluntad. La revolución no ha terminado."
 cc_bonds.90.c: "Invitarlos al Consejo Imperial."

 # === cc_bonds.91 — The Colony Finds Its Voice ===
 cc_bonds.91.title: "La colonia encuentra su voz"
 cc_bonds.91.desc: "La Era de las Revoluciones ha llegado, y [bond_subj.GetName] no ha esperado a que le digan de qué lado estar. El liderazgo colonial —o lo que queda de él que nos sea leal— informa que los panfletos revolucionarios circulan abiertamente, que las reuniones públicas se están convirtiendo en manifestaciones y que el estado de ánimo ha pasado del agravio a la convicción. Esto no ha surgido de la noche a la mañana. El libro de cuentas de la extracción, de las peticiones denegadas, de los gobernadores que gravaron y quitaron sin dar nunca nada a cambio... se ha llevado un registro, y el ajuste de cuentas ha llegado."
 cc_bonds.91.a: "Tomar medidas estrictas. Dejar claro quién gobierna esta colonia."
 cc_bonds.91.b: "Cedemos. Todo lo que deberíamos haber hecho hace años, lo hacemos ahora."

 # === cc_bonds.92 — The Governor Stands With the Crown ===
 cc_bonds.92.title: "El gobernador se mantiene fiel a la corona"
 cc_bonds.92.desc: "El momento revolucionario que ha sacudido a otras provincias encuentra a [bond_subj.GetName] notablemente tranquilo. El gobernador no se ha limitado a mantener el orden: ha movilizado activamente la administración local hacia la lealtad a la Corona, ha suprimido la agitación antes de que echara raíces y nos ha escrito para asegurarnos la estabilidad de su provincia. La infraestructura que financiamos, los marcos legales que construimos juntos, los administradores que tratamos como socios en lugar de instrumentos... todo ello está dando dividendos ahora, cuando más importa."
 cc_bonds.92.a: "El gobernador ha servido con distinción. Lo diremos públicamente."

 # === cc_bonds.93 — The Province Remembers ===
 cc_bonds.93.title: "La provincia recuerda"
 cc_bonds.93.desc: "La era revolucionaria ha llegado a [bond_subj.GetName], y la provincia la estaba esperando. Los despachos del gobernador se han vuelto más cortos, sus respuestas más lentas. El último informe describía la situación como 'manejable', la palabra burocrática para una situación que no lo es. Décadas de extracción, de gobernadores recompensados por la recaudación en lugar del gobierno, de leyes locales anuladas por conveniencia administrativa... la provincia no ha olvidado nada de ello. Simplemente ha estado esperando el momento adecuado para decirlo."
 cc_bonds.93.a: "Pagaremos lo necesario para conservar esta provincia. Cueste lo que cueste."
 cc_bonds.93.b: "La situación es la que es. Debemos gestionarla lo mejor posible."

 # === cc_bonds.94 — The Palatinate Answers the Call ===
 cc_bonds.94.title: "El Palatinado responde a la llamada"
 cc_bonds.94.desc: "La Era de las Revoluciones trae consigo una prueba de lealtades, y [bond_subj.GetName] ha respondido en los términos más claros posibles. El señor del palatinado ha reunido sus fuerzas sin que se le haya pedido, ha escrito para ofrecer todo su apoyo militar y ha enviado a su hijo mayor a servir en nuestro ejército como un gesto personal. Las décadas de ceremonias honradas, las levas gestionadas con justicia, las disputas mediadas con paciencia... el señor del palatinado no ha olvidado nada de ello. Él lo llama servicio. Nosotros podemos llamarlo como queramos, pero es una de las cosas más nobles que un súbdito haya ofrecido jamás a la Corona."
 cc_bonds.94.a: "Nos sentimos honrados por esta lealtad. El palatinado está con nosotros."
 cc_bonds.94.b: "El servicio del señor es bienvenido, y primero liquidamos la vieja deuda."

 # === cc_bonds.95 — The Palatinate Declares Armed Neutrality ===
 cc_bonds.95.title: "El Palatinado declara la neutralidad armada"
 cc_bonds.95.desc: "El señor de [bond_subj.GetName] ha enviado una declaración formal. No se une a la revolución. Tampoco se une a nosotros. Ha declarado que el palatinado se encuentra en un estado de 'neutralidad armada', una frase que significa, en la práctica, que sus fuerzas defenderán su territorio y ningún otro, que no responderá a los llamados a las armas y que tiene la intención de esperar y ver cómo se resuelve la revolución antes de asumir cualquier otro compromiso. Las décadas de negligencia, de peticiones ignoradas, de ceremonias omitidas y disputas juzgadas en su contra, han producido esto: un señor al que simplemente ha dejado de importarle si la Corona sobrevive."
 cc_bonds.95.a: "Aceptar la declaración. La neutralidad es mejor que la rebelión abierta."
 cc_bonds.95.b: "No toleraremos esto. El palatinado ahora responde ante nosotros."

 # === cc_bonds.96 — The March Holds the Frontier ===
 cc_bonds.96.title: "La marca sostiene la frontera"
 cc_bonds.96.desc: "La era revolucionaria ha traído inestabilidad a muchas fronteras, y [bond_subj.GetName] ha defendido cada centímetro de las nuestras. El señor de la marca no se ha limitado a defender la frontera; lo ha hecho de una manera que hace quedar bien a la Corona: rápido, capaz y actuando claramente en nuestro nombre. Sus cartas son breves y profesionales. No pide reconocimiento. Simplemente hace lo que hace un señor de marca leal. Las ceremonias que honramos, los botines que compartimos, la guarnición que financiamos... todo ello construyó una cultura militar que ahora nos sirve cuando más la necesitamos."
 cc_bonds.96.a: "El señor de la marca ha servido bien a la Corona. Reconocemos su lealtad."
 cc_bonds.96.b: "El pupilo que trajimos a la corte ha regresado para liderar las fuerzas de su padre. No podríamos haber esperado más."

 # === cc_bonds.97 — The March Lord Raises His Own Banner ===
 cc_bonds.97.title: "El señor de la marca levanta su propio estandarte"
 cc_bonds.97.desc: "El señor de la marca de [bond_subj.GetName] ha levantado su propio estandarte. Esto no es una revuelta campesina ni un panfleto revolucionario; se trata de un comandante militar con soldados entrenados, conocimiento del terreno fronterizo y años de agravios acumulados que no tomamos lo suficientemente en serio. La guarnición a la que denegamos fondos, los botines que nos quedamos, la ceremonia que omitimos... el señor de la marca llevó su propio registro. Ha decidido que la deuda se pague ahora con una moneda diferente. No está pidiendo nada. Nos está diciendo cuánto ha costado la relación."
 cc_bonds.97.a: "Enviar un enviado con términos. Pagaremos lo que deberíamos haber pagado hace años."
 cc_bonds.97.b: "Es un vasallo en rebelión. Lo trataremos como tal."

 # === cc_bonds.98 — The Dependency Stands True ===
 cc_bonds.98.title: "La Dependencia Permanece Leal"
 cc_bonds.98.desc: "Entre todos los alarmantes despachos de la era revolucionaria, llega una nota que suena diferente. La casa gobernante de [bond_subj.GetName] ha escrito no para solicitar nada, ni para negociar, ni para advertirnos de disturbios, sino simplemente para reafirmar su lealtad. La carta tiene un tono personal. Recuerda las visitas, las ceremonias, los momentos en que la Corona trató a su casa como familia en lugar de como un estado cliente. Las cortes vecinas lo han notado. Nuestra reputación de construir vínculos duraderos en lugar de extraer una obediencia a corto plazo habla por sí sola en este momento."
 cc_bonds.98.a: "Así es como luce una relación duradera. Estamos agradecidos."

 # === cc_bonds.99 — The Dependency Looks Elsewhere ===
 cc_bonds.99.title: "La Dependencia Mira hacia Otro Lugar"
 cc_bonds.99.desc: "Ha llegado una carta de la casa gobernante de [bond_subj.GetName]. Es cortés, comedida y devastadora. No están declarando la independencia. No se están uniendo a ninguna coalición revolucionaria. Simplemente —de forma silenciosa y formal— están explorando qué otros acuerdos podrían estar disponibles para ellos. Han identificado a una potencia vecina que ha expresado interés en ofrecer protección. Aún no se han comprometido con nada. Nos lo están diciendo a nosotros primero. Este puede ser su último acto de lealtad: darnos la oportunidad de responder antes de comenzar formalmente un nuevo capítulo. La ceremonia que omitimos, la invitación que decidimos no enviar, la carta en lugar de la visita... lo recuerdan todo."
 cc_bonds.99.a: "Ofreceremos todo lo que deberíamos haber ofrecido hace años. Por favor, quédense."
 cc_bonds.99.b: "Si han encontrado un acuerdo mejor, no nos interpondremos en su camino."
 cc_bonds.99.c: "Son nuestra dependencia. No tienen derecho a 'explorar acuerdos'."
