l_spanish:
 # ============================================================
 # Balance of Power — coalition congress: parliament, laws & policies
 # ============================================================
 cc_bop_coalition_assembly: "Congreso equilibrador"

 # --- Defence law ---
 cc_bop_defense_law: "Defensa mutua"
 cc_bop_defense_law_desc: "Con qué facilidad la coalición acude al rescate de un miembro atacado por el aspirante a hegemonía."
 cc_bop_no_defense: "Cada Estado por su cuenta"
 cc_bop_no_defense_desc: "Los miembros no son llamados a las guerras defensivas de los demás. La coalición es una alianza solo de nombre."
 cc_bop_possible_defense: "Defensa posible"
 cc_bop_possible_defense_desc: "Los miembros pueden ser llamados a una guerra defensiva de un socio, pero no están obligados a responder."
 cc_bop_mutual_defense: "Defensa mutua"
 cc_bop_mutual_defense_desc: "Los miembros son llamados automáticamente a cada guerra defensiva de sus socios, y el vínculo es lo suficientemente fuerte como para potenciar la solidaridad permanente de la coalición."

 # --- Offence law ---
 cc_bop_offense_law: "Doctrina Estratégica"
 cc_bop_offense_law_desc: "Si la coalición puede atacar primero, preventivamente, contra el aspirante."
 cc_bop_no_offense: "Postura defensiva"
 cc_bop_no_offense_desc: "La coalición solo lucha cuando es atacada. No sancionará una guerra provocada por ella misma."
 cc_bop_preemptive_doctrine: "Doctrina preventiva"
 cc_bop_preemptive_doctrine_desc: "Los miembros pueden ser llamados a una guerra ofensiva de un socio contra el aspirante: la base política para el ataque preventivo."

 # --- Congress powers law ---
 cc_bop_congress_powers_law: "Poderes del Congreso"
 cc_bop_congress_powers_law_desc: "Si el congreso se ha votado a sí mismo como el aparato permanente para la acción colectiva."
 cc_bop_congress_dormant: "Un concierto laxo"
 cc_bop_congress_dormant_desc: "El congreso se reúne solo para hablar. No posee poderes permanentes propios."
 cc_bop_congress_empowered: "Un congreso empoderado"
 cc_bop_congress_empowered_desc: "El congreso ejerce poderes permanentes, desbloqueando las medidas estratégicas globales de la coalición y la solidaridad potenciada de sus miembros."

 # --- Coup law ---
 cc_bop_coup_law: "El Golpe de Gracia"
 cc_bop_coup_law_desc: "Si la coalición posee un mandato permanente para asestar el golpe decisivo que reduzca el tamaño de un aspirante derrotado."
 cc_bop_coup_restrained: "Restricción"
 cc_bop_coup_restrained_desc: "La coalición no buscará la ruina del aspirante. Incluso ascendente, se mantiene cauta."
 cc_bop_coup_de_grace: "El Golpe de Gracia"
 cc_bop_coup_de_grace_desc: "Un mandato permanente para reducir al pretendiente a hegemonía en una guerra final y decisiva. Es necesario antes de que una coalición ascendente pueda asestar el golpe ganador."

 # --- Per-voter disposition (vote-reasoning tooltip entries) ---
 CC_BOP_VOTE_OPINION_OF_HEGEMON: "Opinión del aspirante a hegemon"
 CC_BOP_VOTE_RIVAL_HEGEMON: "Rivalidad con el aspirante a hegemon"
 CC_BOP_VOTE_KIN_HEGEMON: "Unido al hegemón por matrimonio real"
 CC_BOP_VOTE_BOUGHT: "Influenciado por el oro del hegemón"
 CC_BOP_VOTE_PROXIMITY_BASE: "El coloso se aproxima"
 CC_BOP_VOTE_DISTANCE_FROM_HEGEMON: "Distancia respecto a las fronteras del hegemon"
 CC_BOP_VOTE_GREAT_POWER_CAUTION: "El recelo de una gran potencia ante los compromisos vinculantes"
 CC_BOP_VOTE_SEEKS_PROTECTION: "Una potencia menor busca refugio"
 CC_BOP_VOTE_HAWKISH_COURT: "Una corte belicosa"
 CC_BOP_VOTE_RELUCTANT_COURT: "Una corte reacia y con mano libre"
 DIPLOMATIC_LAW_CATEGORY: "Leyes diplomáticas"

 # ============================================================
 # Special statuses
 # ============================================================
 cc_bop_chief_balancer: "Equilibrador jefe"
 cc_concert_president: "Presidente del Concierto"
 cc_concert_seat: "Miembro del Concierto"

 # ============================================================
 # Coalition — the Settlement law (post-victory)
 # ============================================================
 cc_bop_settlement_law: "El asentamiento"
 cc_bop_settlement_law_desc: "Lo que la coalición decida hacer con su victoria. Si se ha de promulgar el Concierto, la ley debe aprobarse mientras el congreso esté sesionando — y solo fundará una institución duradera si el bloque gana la guerra final."
 cc_bop_settlement_dissolution: "Disolución"
 cc_bop_settlement_dissolution_desc: "La alianza de conveniencia se disuelve una vez alcanzada la paz. Cada potencia sigue su propio camino."
 cc_bop_enact_concert: "Promulgar el Concierto de Europa"
 cc_bop_enact_concert_desc: "Resolución para institucionalizar la paz. Si la coalición gana la guerra final con esto en vigor, los cinco mayores vencedores fundarán un Concierto de Europa permanente para gestionar los asuntos del continente."

 # ============================================================
 # Coalition — parliament actions (collective consensus)
 # ============================================================
 cc_bop_pi_coalition_subsidies: "Subsidios de la coalición"
 cc_bop_pi_coalition_subsidies_desc: "El oro de Pitt: los miembros financian un fondo de guerra común en manos del líder y las potencias menores reciben apoyo para la campaña. Otorga +8 de Resolución y fortalece a los miembros más pequeños."
 cc_bop_pi_no_separate_peace: "Tratado de Chaumont"
 cc_bop_pi_no_separate_peace_desc: "Una promesa solemne de no firmar una paz separada mantiene unida a la coalición. Otorga +12 de Resolución y estabiliza a cada miembro; quien deserte seguirá sufriendo la desgracia del traidor."
 cc_bop_pi_combined_command: "El ejército pragmático"
 cc_bop_pi_combined_command_desc: "Un mando unificado durante la guerra otorga al bloque un peso real en el campo de batalla. Concede +5 de Resolución y una bonificación de combate a cada miembro."
 cc_bop_pi_collective_demarche: "Una gestión conjunta"
 cc_bop_pi_collective_demarche_desc: "Un ultimátum colectivo al aspirante: una reprimenda pública que desplaza el impulso de la contienda hacia la coalición y agriada la posición de cada miembro con el hegemon."
 cc_bop_pi_war_aims: "El tratado de partición"
 cc_bop_pi_war_aims_desc: "Las potencias acuerdan sus objetivos de guerra de antemano. La perspectiva de ganancia une al bloque y templa su resolución para el ajuste de cuentas. Otorga +10 de Resolución y un compromiso duradero para cada miembro."

 # ============================================================
 # Concert of Europe — congress & laws
 # ============================================================
 cc_concert_assembly: "Congreso de las Potencias"

 cc_concert_doctrine_law: "Doctrina guía"
 cc_concert_doctrine_law_desc: "El principio animador del Concierto: el espíritu con el que las potencias gestionan la paz."
 cc_concert_balance_of_power: "Equilibrio de poder"
 cc_concert_balance_of_power_desc: "Evitar que cualquier potencia domine y mantener a las potencias dialogando. El arte de gobierno clásico de la era del gabinete."
 cc_concert_principle_of_intervention: "El principio de intervención"
 cc_concert_principle_of_intervention_desc: "La Santa Alianza y el Protocolo de Troppau: las potencias defienden la legitimidad y se oponen a la revolución, apuntalando los tronos, aunque a costa de fricciones con los liberales y los inquietos."
 cc_concert_liberal_internationalism: "Internacionalismo Liberal"
 cc_concert_liberal_internationalism_desc: "No intervención canningita, mirando hacia un internacionalismo posterior: autodeterminación nacional y libre comercio sobre el antiguo orden dinástico."

 cc_concert_security_law: "Seguridad colectiva"
 cc_concert_security_law_desc: "Hasta qué punto las potencias se vincularán mutuamente para su defensa."
 cc_concert_ad_hoc: "Conciertos según surja la necesidad"
 cc_concert_ad_hoc_desc: "Las potencias se reúnen cuando una crisis lo exige, pero no asumen ninguna obligación permanente entre sí."
 cc_concert_mutual_guarantee: "Garantía mutua"
 cc_concert_mutual_guarantee_desc: "La garantía de la Cuádruple Alianza se ha consolidado en una seguridad colectiva: un ataque contra uno es un ataque contra todos, y ningún miembro puede hacer la guerra a otro sin causa justificada."

 cc_concert_congress_law: "El sistema de congresos"
 cc_concert_congress_law_desc: "Si el Concierto sesiona como un congreso permanente — el aparato para la mediación colectiva."
 cc_concert_dormant: "Congresos ocasionales"
 cc_concert_dormant_desc: "El congreso se reúne solo cuando es convocado. No tiene una sede permanente."
 cc_concert_standing_congress: "Un congreso permanente"
 cc_concert_standing_congress_desc: "Las potencias sesionan de forma permanente y pueden imponer una paz general sobre las disputas de Europa (desbloquea Mediación del Congreso)."

 # ============================================================
 # Concert of Europe — parliament actions
 # ============================================================
 cc_concert_pi_mediate_dispute: "Mediación del Congreso"
 cc_concert_pi_mediate_dispute_desc: "El gran logro del Sistema de Congresos: las potencias imponen una paz general en las guerras de un miembro con agentes externos."
 cc_concert_pi_mediate_dispute_tt: "Paz blanca en todas las guerras de cada miembro contra quienes no pertenezcan al Concierto."
 cc_concert_pi_collective_intervention: "Intervención colectiva"
 cc_concert_pi_collective_intervention_desc: "Una demostración de fuerza coordinada para mantener el orden establecido —más fuerte allí donde las potencias han adoptado el Principio de Intervención. Otorga un mandato de intervención a cada miembro."
 cc_concert_pi_eastern_question: "La Cuestión Oriental"
 cc_concert_pi_eastern_question_desc: "Las potencias gestionan la partición de una esfera en declive. El presidente gana prestigio por dirigir el acuerdo; los miembros afirman sus esferas de influencia."
 cc_concert_pi_admit_power: "Admitir a una Potencia"
 cc_concert_pi_admit_power_desc: "Una potencia emergente es admitida en el directorio: el externo elegible más fuerte ocupa un asiento en la mesa."
 cc_concert_pi_depose_president: "Moción de Censura"
 cc_concert_pi_depose_president_desc: "Los miembros proceden a destituir al presidente actual y a elegir un nuevo presidente entre ellos."

 # ============================================================
 # New vote-reasoning tooltip entries
 # ============================================================
 CC_BOP_LAW_WAR_WEARINESS: "Un conflicto prolongado clama por una paz duradera"
 CC_BOP_HEGEMON_RISING: "El aspirante se vuelve peligroso"
 CC_BOP_RECKONING: "El ajuste de cuentas está al alcance"
 CC_CONCERT_BASE: "Inclinación actual"
 CC_CONCERT_HAVE_BETTER: "Preferimos otro camino"
 CC_CONCERT_KEEP: "El orden establecido debe prevalecer"
 CC_CONCERT_LEGITIMIST: "Un trono valora la legitimidad y el orden"
 CC_CONCERT_LIBERAL_COURT: "Una corte liberal favorece la autodeterminación"
 CC_CONCERT_GREAT_POWER: "El lugar de una gran potencia en la mesa"
 CC_CONCERT_GREAT_POWER_CAUTION: "Una gran potencia recela de las obligaciones vinculantes"
 CC_CONCERT_SEEKS_PROTECTION: "Una potencia menor anhela la garantía"
 CC_CONCERT_INTERVENTIONIST: "El principio de intervención está en vigor"
 CC_CONCERT_OPINION_OF_CHAIR: "Nuestra opinión sobre el presidente actual"
 cc_bop_coalition_seat: "Miembro de la Coalición"
