l_french:

 ########################################################################
 # CASUS BELLI
 ########################################################################

 cb_assert_junior_partnership: "Affirmer un partenariat subordonné"
 cb_assert_junior_partnership_desc: "Notre partenaire d'union a longtemps bénéficié du confort d'un arrangement informel. En tant que puissance senior incontestée de cette union, nous sommes en droit de formaliser cette relation — et de l'imposer si nécessaire."

 cb_assert_crown_dependency: "Affirmer la dépendance à la Couronne"
 cb_assert_crown_dependency_desc: "Notre mariage royal avec ce royaume, combiné à notre position dominante au sein de l'union, nous donne le droit de le formaliser en tant que dépendance de la Couronne. Nous rendrons ce lien permanent."

 ########################################################################
 # PEACE TREATIES
 ########################################################################

 cc_force_junior_partnership: "Formaliser en tant que partenaire subordonné"
 cc_force_junior_partnership_entry: "$cc_force_junior_partnership$"
 cc_force_junior_partnership_entry_short: "$cc_force_junior_partnership$"
 cc_force_junior_partnership_desc: "Le royaume vaincu reconnaîtra formellement notre supériorité, acceptant le statut contraignant de partenaire junior au sein de l'union. Son autonomie en sera réduite en conséquence."

 cc_force_crown_dependency: "Affirmer la dépendance à la Couronne"
 cc_force_crown_dependency_entry: "$cc_force_crown_dependency$"
 cc_force_crown_dependency_entry_short: "$cc_force_crown_dependency$"
 cc_force_crown_dependency_desc: "Le royaume vaincu sera lié à notre couronne en tant que dépendance formelle. Le mariage royal entre nos maisons en fait une conclusion naturelle."

 ########################################################################
 # BIASES / OPINION MODIFIERS
 ########################################################################

 antagonism_cc_force_junior_partnership: "Contraint à un partenariat subordonné"
 antagonism_cc_force_crown_dependency: "Contraint à la dépendance de la Couronne"

 opinion_cc_forced_junior_partnership: "Ressent une formalisation forcée"
 opinion_cc_forced_crown_dependency: "Ressent une dépendance dynastique forcée"
 opinion_cc_bribed_into_partnership: "Reconnaissants pour l'installation généreuse"

 ########################################################################
 # EVENTS — cc_pu.1 (Junior Partner path)
 ########################################################################

 cc_pu.1.title: "Une proposition de formaliser l'union"

 cc_pu.1.desc: "L'union entre nos couronnes a perduré, mais notre relation avec [pu_target.GetName] reste un héritage informel des circonstances. Leur royaume étant considérablement plus petit que le nôtre, nos conseillers s'accordent à dire que le moment est venu de proposer un partenariat formel subordonné — convertissant l'union personnelle en un arrangement dynastique contraignant qui reflète le véritable équilibre des pouvoirs."

 cc_pu.1.a: "Proposer le partenariat formel."
 cc_pu.1.a.tt: "Une proposition diplomatique directe. [pu_target.GetName] acceptera, bien que sa cour puisse estimer que l'arrangement n'était pas entièrement de son choix."

 cc_pu.1.b: "Adoucir l'accord avec un règlement généreux. [150 gold]"
 cc_pu.1.b.tt: "Offrir un règlement financier à la cour de [pu_target.GetName]. La générosité efface tout sentiment de coercition — l'arrangement est accueilli favorablement plutôt que d'être ressenti comme un fardeau."

 cc_pu.1.c: "Dépêcher [cc_pu_minister.GetName] pour négocier."
 cc_pu.1.c.tt: "Confier la transition à notre diplomate le plus expérimenté. Le talent de [cc_pu_minister.GetName] garantit que la proposition soit perçue comme un honneur plutôt que comme une imposition."

 ########################################################################
 # EVENTS — cc_pu.2 (Crown Dependency path)
 ########################################################################

 cc_pu.2.title: "Renforcement du lien dynastique"

 cc_pu.2.desc: "Notre mariage royal avec [pu_target.GetName] offre une opportunité dépassant le cadre d'une union ordinaire. Avec des liens dynastiques et l'appartenance à l'union reliant nos royaumes, nous pourrions proposer de formaliser le statut de [pu_target.GetName] en tant que dépendance de la Couronne — un lien qui honore le sang partagé tout en établissant une préséance claire pour les générations futures."

 cc_pu.2.a: "Proposer formellement la dépendance à la couronne."
 cc_pu.2.a.tt: "Une proposition dynastique directe. [pu_target.GetName] acceptera l'arrangement, bien que sa cour puisse estimer que le changement n'était pas entièrement de son idée."

 cc_pu.2.b: "Accompagnez la proposition d'un cadeau royal. [100 gold]"
 cc_pu.2.b.tt: "Un geste généreux envers la cour de [pu_target.GetName] facilite la transition. Leurs nobles se sentent compensés plutôt que pressés."

 cc_pu.2.c: "Demander à [cc_pu_minister.GetName] de présenter la proposition à la cour."
 cc_pu.2.c.tt: "Un diplomate habile fait en sorte que l'arrangement de dépendance soit ressenti comme un privilège. [pu_target.GetName] gagne autant de prestige grâce à l'association qu'il ne lui en coûte en autonomie."
