l_french:
 # ============================================================
 # Stepping Stone Traits — Tier 0 Entry Points
 # ============================================================
 fumbling_reformist: "Réformiste maladroit"
 fumbling_reformist_desc: "Ce ministre a commencé à travailler sur la réforme administrative, mais son approche est hésitante. Les projets sont révisés, les procédures confuses, et les résultats sont plus encourageants qu'efficaces. Avec du temps et de la persévérance, il s'améliorera."

 tentative_envoy: "Envoyé hésitant"
 tentative_envoy_desc: "Un diplomate qui cherche encore ses marques. L'instinct du ministre pour la négociation est présent, mais la prudence le fait hésiter là où l'audace serait nécessaire. Les cours étrangères le remarquent — bien que pas toujours favorablement."

 green_adjutant: "Adjudant vert"
 green_adjutant_desc: "Récemment affecté aux affaires militaires, ce ministre a plus d'enthousiasme que d'expérience. Ses conseils sont sincères mais mal dégrossis. Les campagnes lui enseigneront ce que les salles de classe ne peuvent pas."

 clumsy_accountant: "Comptable maladroit"
 clumsy_accountant_desc: "Le ministre s'est attelé aux comptes du trésor, et les résultats sont — prometteurs, de la même manière que le sont les premiers brouillons. Les erreurs sont mineures et corrigeables, mais elles s'accumulent. La pratique les rendra exactes."

 # ============================================================
 # Stepping Stone Traits — Chain Endpoints
 # ============================================================
 master_reformer: "Maître réformateur"
 master_reformer_desc: "Forgé par des années de plaidoyer incessant et de revers durement acquis, ce ministre est devenu un architecte du changement durable. Là où d'autres voient des intérêts ancrés, il voit des leviers. Les institutions du royaume plient à sa volonté, et non l'inverse."

 returned_colonial_governor: "Gouverneur colonial revenu"
 returned_colonial_governor_desc: "Ce ministre a passé des années à superviser les possessions lointaines du royaume, naviguant entre les difficultés de la frontière, les ambitions coloniales et la politique complexe des gouverneurs distants. Il revient chez lui transformé — fort d'une expérience qu'aucune éducation curiale ne pourrait fournir."

 # ============================================================
 # Chain A — The Reformer's Path (cc_prog.1–4)
 # ============================================================
 cc_prog.1.title: "Le réformiste se bat avec la loi"
 cc_prog.1.desc: "Le ministre a passé des mois à se débattre avec la réforme administrative, produisant des résultats plus encourageants qu'impressionnants. Les anciens statuts sont un labyrinthe et les progrès sont lents. Mais il apprend."
 cc_prog.1.a: "C'est ainsi que l'expertise se construit — lentement."
 cc_prog.1.b: "La réforme crée de la confusion dans les provinces."

 cc_prog.2.title: "Un réformateur prend forme"
 cc_prog.2.desc: "Après des années d'efforts persistants et de leçons durement apprises, la main hésitante du ministre en matière de réforme administrative a laissé place à quelque chose de plus fiable. Les jours de tâtonnements sont derrière lui."
 cc_prog.2.a: "Nommez-le comme réformateur complet des lois."

 cc_prog.3.title: "Le réformateur législatif s'audacie"
 cc_prog.3.desc: "La vision réformiste du ministre s'est affirmée avec chaque année de service. Ce qui semblait autrefois radical paraît désormais simplement juste. Le royaume peut aller plus loin — et le ministre a l'intention de l'y mener."
 cc_prog.3.a: "Laissons-les poursuivre des réformes progressistes."

 cc_prog.4.title: "L'émergence du Maître Réformateur"
 cc_prog.4.desc: "Après plus d'une décennie de plaidoyer incessant et de luttes institutionnelles, le ministre a maîtrisé l'art de la réforme. Il remodèle les administrations là où d'autres ne voient que des obstacles, et son héritage s'inscrit déjà dans les codes de loi."
 cc_prog.4.a: "Le royaume honore son maître réformateur."

 # ============================================================
 # Chain C — The Diplomat's Ascent (cc_prog.10–12)
 # ============================================================
 cc_prog.10.title: "L'envoyé hésitant tâte le terrain"
 cc_prog.10.desc: "Les premières incursions du ministre dans l'art de gouverner sont prudentes — il tâte le terrain avant de s'engager dans une position. Les cours étrangères remarquent autant son soin que son hésitation."
 cc_prog.10.a: "Un engagement préliminaire prudent mais réussi."
 cc_prog.10.b: "Un faux pas diplomatique, rapidement rattrapé."

 cc_prog.11.title: "L'envoyé trouve sa voix"
 cc_prog.11.desc: "À force de fréquenter les cours étrangères, le tact diplomatique du ministre est devenu confiant et assuré. Ce qui nécessitait autrefois un calcul prudent coule désormais naturellement. Ils ont trouvé leur voix."
 cc_prog.11.a: "Nommez-les l'envoyé tactique du royaume."
 cc_prog.11.b: "Leur affectation à l'étranger les a façonnés — faites-en notre attaché."

 cc_prog.12.title: "L'envoyé maîtrise l'art de gouverner"
 cc_prog.12.desc: "Une longue carrière de négociations prudentes, de rivalités gérées et de relations cultivées a aiguisé le jugement du ministre. Ils lisent une pièce comme un général lit un champ de bataille — et agissent en conséquence."
 cc_prog.12.a: "Le royaume gagne un homme d'État magistral."

 # ============================================================
 # Chain D — The Military Hardening (cc_prog.20–22)
 # ============================================================
 cc_prog.20.title: "L'Adjudant Vert sur le Terrain"
 cc_prog.20.desc: "Le ministre a examiné les rapports de campagne et observé la disposition des troupes — apprenant l'art de la guerre en partant de zéro. Les progrès sont mesurés, mais ils sont réels."
 cc_prog.20.a: "Un baptême du feu : les campagnes leur enseignent rapidement."
 cc_prog.20.b: "Ils étudient les campagnes des grands commandants."

 cc_prog.21.title: "L'adjudant gagne ses étoiles"
 cc_prog.21.desc: "Après des années d'études assidues et d'observations sur le terrain, les connaissances de l'adjudant en affaires militaires se sont cristallisées en une véritable compréhension stratégique. Il n'apprend plus — il conseille."
 cc_prog.21.a: "Le nommer conseiller tactique à plein temps."

 cc_prog.22.title: "Le conseiller tactique choisit sa voie"
 cc_prog.22.desc: "Le conseiller tactique a atteint un stade où toute croissance supplémentaire exige un choix de spécialisation. Bâtira-t-il les armées permanentes du royaume, maîtrisera-t-il l'art de l'offensive, ou consacrera-t-il ses dons à une défense solide ?"
 cc_prog.22.a: "Bâtir l'armée régulière — la discipline avant tout."
 cc_prog.22.b: "Maîtrisez l'offensive — frappez rapidement et avec décision."
 cc_prog.22.c: "Fortifier le royaume — garder ce que nous avons, ne rien perdre."

 # ============================================================
 # Chain F — The Fiscal Path (cc_prog.30–32)
 # ============================================================
 cc_prog.30.title: "Le comptable maladroit revoit les registres"
 cc_prog.30.desc: "Le ministre a procédé au rapprochement des comptes du trésor — relevant de petites erreurs et acquérant lentement une compréhension des finances du royaume. Le processus est occasionnellement pénible, mais toujours instructif."
 cc_prog.30.a: "Une erreur comptable a été découverte en faveur du trésor — le royaume en prend note."
 cc_prog.30.b: "Un petit oubli embarrasse le ministre, mais celui-ci en tire des leçons."

 cc_prog.31.title: "Le comptable prouve sa valeur"
 cc_prog.31.desc: "Grâce à un examen minutieux des comptes et à une culture attentive des administrateurs subordonnés, le ministre est passé du statut de nouveau venu hésitant à celui d'intendant fiable des finances du royaume."
 cc_prog.31.a: "Les nommer intendant loyal du trésor."

 cc_prog.32.title: "Le fidèle intendant trace la voie"
 cc_prog.32.desc: "Maîtrisant fermement les finances du royaume, le ministre se trouve à la croisée des chemins. Il peut cultiver la prospérité de manière large — en encourageant la croissance dans toutes les provinces — ou imposer une discipline plus stricte au fonctionnement du trésor."
 cc_prog.32.a: "Cultiver la prospérité à travers le royaume."
 cc_prog.32.b: "Imposez une discipline fiscale et faites respecter l'autorité du trésor."

 # ============================================================
 # Chain E — The Colonial Pioneer (cc_prog.40)
 # ============================================================
 cc_prog.40.title: "Le retour du gouverneur"
 cc_prog.40.desc: "Après avoir supervisé pendant des années les possessions coloniales lointaines du royaume — naviguant entre les privations de la frontière, les ambitions locales et la politique complexe des gouverneurs lointains — le ministre est rentré chez lui. Il ne revient pas tel qu'il était parti."
 cc_prog.40.a: "Accueillons le gouverneur chez lui. Le royaume en est enrichi."
