 # ============================================================
 desc_clumsy_accountant: "Les registres finissent par s'équilibrer, mais jamais dès la première tentative. Chaque compte domestique que ce conseiller touche coûte plus cher à tenir qu'il ne le devrait, et la différence est discrètement comblée par le trésor."
 desc_fumbling_reformist: "Un véritable appétit pour la réforme et aucun instinct pour la rédaction d'un statut. Leurs propositions parviennent à la chambre à moitié formées et en ressortent pire, et la loi est plus lente et plus coûteuse pour chacune d'entre elles."
 desc_green_adjutant: "Compétent, volontaire et totalement non testé. Le travail d'état-major est correct mais arrive en retard, et les régiments sous ses ordres mettent plus de temps à accomplir ce qu'un vétéran aurait déjà terminé."
 desc_master_reformer: "Connaît assez bien la forme du recueil des lois pour le modifier sans le briser. Les lois sont adoptées plus rapidement, les écoles se développent et le royaume prend goût à faire les choses d'une manière nouvelle."
 desc_returned_colonial_governor: "A gouverné loin de la capitale et est revenu en sachant ce que cela coûte. Les entreprises coloniales sous sa surveillance sont mieux dotées en hommes et mieux cartographiées, et la cour a gagné un diplomate qu'elle n'avait pas."
 desc_tentative_envoy: "Correct, prudent et réticent à forcer le passage. Les cours étrangères les trouvent agréables et insignifiants, et se permettent davantage de libertés avec nous qu'auparavant."
