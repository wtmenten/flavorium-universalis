 cc_bop_fear_of_hegemony: "Craint notre ambition hégémonique"
 cc_bop_coalition_solidarity_opinion: "Solidarité de la coalition"
 cc_bop_concert_betrayal: "A trahi le Concert"
 cc_bop_bought_neutrality_opinion: "Achat de notre neutralité"
 cc_bop_grateful_for_support: "Reconnaissants pour notre soutien"
 cc_bop_coerced_resentment: "Ressent notre coercition"

 # ============================================================
 # CUSTOM PANEL STRINGS
 # ============================================================
 CC_BOP_EQUILIBRIUM_HEADER: "L'équilibre"
 CC_BOP_EQUILIBRIUM_DESC: "50 % représente l'équilibre parfait. À mesure que la part du bloc dominant grimpe vers 65 % et au-delà, l'équilibre approche de son point de rupture et un hégémon peut émerger. Le cercle montre la force relative des trois camps — le bloc prépondérant, la coalition d'équilibrage et les puissances non alignées."
 CC_BOP_SHARE_SUBLABEL: "Prépondérance"
 CC_BOP_PRE_LEADER_LABEL: "Hégémon aspirant"
 CC_BOP_COA_LEADER_LABEL: "Équilibreur en chef"
 CC_BOP_PRE_TT: "Le bloc prépondérant — l'hégémon aspirant et les puissances rassemblées derrière lui. Sa part de la force combinée des trois camps."
 CC_BOP_COA_TT: "La Coalition d'équilibrage — les puissances unies pour refuser à tout État unique la maîtrise du continent. Sa part par rapport à la force combinée des trois camps."
 CC_BOP_NEU_TT: "Les non-alignés — des puissances éligibles qui se tiennent à l'écart du grand jeu. Leur poids combiné peut encore faire pencher la balance s'ils sont attirés dans l'un ou l'autre camp."
 CC_BOP_TENSION_TT: "La part de prépondérance varie de 0 à 100, où 50 représente l'équilibre. Lorsque la part du bloc dominant dépasse 50, la tension monte, et au-delà de 65, l'équilibre approche du point de rupture — un hégémon pourrait émerger."
 CC_BOP_PREPONDERANCE_PANEL_HEADER: "Le bloc prépondérant"
 CC_BOP_COALITION_PANEL_HEADER: "La Coalition d'équilibrage"
 CC_BOP_OVERVIEW_HEADER: "Le Grand Jeu"
 CC_BOP_OVERVIEW_DESC: "Deux camps se disputent le destin de l'Europe et du Proche-Orient. Le Bloc Prépondérant se rassemble derrière la puissance la plus forte alors qu'elle aspire à la prééminence ; la Coalition d'Équilibrage se forme pour s'y opposer. Maintenez l'équilibre — par la diplomatie, les subventions, les menaces ou l'or — et la paix du continent perdurera. Laissez-le se briser, et un nouvel ordre naîtra à sa place."

 # ============================================================
 # EVENTS
 # ============================================================
 cc_balance_of_power.1.title: "Un nouvel équilibre"
 cc_balance_of_power.1.desc: "Les chancelleries d'Europe et du Proche-Orient sont devenues sophistiquées dans le calcul du pouvoir. Les princes ne cherchent plus la conquête aveuglément ; ils pèsent, mesurent et combinent désormais, afin qu'aucune couronne unique ne puisse surpasser les autres. Un nouvel âge de la diplomatie se lève — l'âge de l'équilibre des puissances."
 cc_balance_of_power.1.a: "Nous jouerons le jeu."

 cc_balance_of_power.2.title: "La puissance aspirante"
 cc_balance_of_power.2.desc: "Notre force surpasse désormais celle de tout rival. Les cours du continent nous observent avec envie et crainte, et elles murmurent déjà l'idée de coalitions pour nous encercler. La voie vers la prééminence est ouverte — mais chaque pas accompli rapproche les autres pour s'unir contre nous."
 cc_balance_of_power.2.a: "Qu'ils nous craignent. L'Europe pliera sous notre volonté."
 cc_balance_of_power.2.b: "Nous recherchons la prééminence, et non la domination — pour l'instant."

 cc_balance_of_power.3.title: "La puissance indispensable"
 cc_balance_of_power.3.desc: "Nous sommes assez forts pour compter, mais pas assez pour effrayer. Cela fait de nous le pivot naturel du continent : le poids qui, placé sur le plateau le plus léger, rétablit l'équilibre. Les petites cours se tournent vers nous pour organiser leur défense contre l'hégémon aspirant."
 cc_balance_of_power.3.a: "Nous serons l'équilibre de l'Europe."
 cc_balance_of_power.3.b: "Laissez les autres porter ce fardeau."

 cc_balance_of_power.10.title: "Choisir son camp"
 cc_balance_of_power.10.desc: "Des envoyés des deux camps s'agglutinent dans nos antichambres. La puissance aspirante offre son amitié — et nous avertit du coût d'un refus. La coalition offre la solidarité — et la sécurité du nombre. Notre cour ne peut rester distante éternellement ; le moment du choix est venu."
 cc_balance_of_power.10.a: "Rejoindre la coalition d'équilibrage."
 cc_balance_of_power.10.b: "Rejoindre le bloc prépondérant."
 cc_balance_of_power.10.c: "Gardons nos mains libres — rester neutre."

 cc_balance_of_power.20.title: "Pression et persuasion"
 cc_balance_of_power.20.desc: "Une cour mineure hésite à se rallier à nous. Nos ministres conseillent qu'il existe plusieurs façons de soumettre un prince hésitant — le poing de fer ou la bourse ouverte. L'un ou l'autre conviendra, bien que chacun laisse son propre résidu de ressentiment ou de dépendance."
 cc_balance_of_power.20.a: "Menacez-les pour les intégrer à notre bloc."
 cc_balance_of_power.20.b: "Acheter leur neutralité avec de l'or."
 cc_balance_of_power.20.c: "Les laisser tranquilles — pour l'instant."

 cc_balance_of_power.30.title: "Crainte de l'hégémon"
 cc_balance_of_power.30.desc: "Des rapports nous parviennent sur les ambitions de la puissance dominante, chacune plus alarmante que la précédente. Nos partenaires de coalition se tournent vers nous : donnerons-nous voix à l'effroi commun, ou garderons-nous le silence pour éviter de provoquer le colosse ?"
 cc_balance_of_power.30.a: "Dénoncer ouvertement l'hégémon aspirant."
 cc_balance_of_power.30.b: "Garder le silence et observer."

 cc_balance_of_power.40.title: "Rétablir l'équilibre"
 cc_balance_of_power.40.desc: "En tant qu'équilibreur, les moyens de soutenir le plateau le plus léger sont entre nos mains. L'or peut raffermir un partenaire vacillant ; une diplomatie patiente peut rallier un neutre à notre cause. Chaque choix consomme quelque chose — du trésor ou des efforts — pour empêcher l'équilibre de basculer."
 cc_balance_of_power.40.a: "Subventionner un partenaire de coalition."
 cc_balance_of_power.40.b: "Attirez une puissance neutre dans la coalition."
 cc_balance_of_power.40.c: "Ne bougez pas et conservez vos forces."

 cc_balance_of_power.50.title: "Un congrès des puissances"
 cc_balance_of_power.50.desc: "Les envoyés de la coalition se réunissent à notre invitation. Autour de la table siègent les puissances qui souhaitent garder le continent libre — et chacune attend nos directives. Un trésor de guerre commun, un resserrement des rangs ou de simples discussions : le Congrès sera ce que nous en ferons."
 cc_balance_of_power.50.a: "Établir un trésor de guerre collectif."
 cc_balance_of_power.50.b: "Résolution de contenir l'hégémon — serrer les rangs."
 cc_balance_of_power.50.c: "Lever la séance sans accord."

 cc_balance_of_power.60.title: "L'équilibre vacille"
 cc_balance_of_power.60.desc: "La balance penche dangereusement. Le bloc de la puissance dominante s'accroît tandis que le nôtre s'effrite. Si nous n'agissons pas dès maintenant pour rallier chaque cour hésitante, l'équilibre que nous avons peiné à préserver volera en éclats, et avec lui l'indépendance du continent."
 cc_balance_of_power.60.a: "Rassemblez toutes les cours contre l'hégémonie imminente."
 cc_balance_of_power.60.b: "Il se peut que nous soyons déjà trop tard."

 cc_balance_of_power.70.title: "Maître de l'Europe"
 cc_balance_of_power.70.desc: "Les coalitions se sont brisées sur nous comme des vagues sur un roc. Aucune combinaison de puissances ne peut désormais entraver notre volonté. Un nouveau Charlemagne, un nouveau César — l'histoire retiendra qu'en cet âge, l'équilibre de l'Europe était à notre merci."
 cc_balance_of_power.70.a: "Le continent nous appartient."

 cc_balance_of_power.71.title: "L'Hégémon Triomphant"
 cc_balance_of_power.71.desc: "Malgré toutes les alliances et tous les congrès, nous n'avons pu retenir le colosse. L'équilibre est rompu, et une puissance unique domine désormais le continent. Nos envoyés sont reçus avec une courtoisie froide dans une Europe qui a appris à s'incliner."
 cc_balance_of_power.71.a: "Nous n'oublierons pas cette humiliation."

 cc_balance_of_power.72.title: "Le déluge venu de l'Est"
 cc_balance_of_power.72.desc: "L'ancien ordre occidental, malgré tous ses équilibres minutieux, n'a pu concevoir la tempête qui s'accumulait à l'est. Désormais, nos armées affluent à travers ses frontières, et les chancelleries qui se croyaient les arbitres du monde se battent pour survivre."
 cc_balance_of_power.72.a: "L'avenir nous appartient."

 cc_balance_of_power.73.title: "L'ancien ordre s'effondre"
 cc_balance_of_power.73.desc: "L'équilibre minutieux des rois n'a plus rien valu une fois que le peuple s'est soulevé. Les trônes vacillent, les frontières se dissolvent et la diplomatie des cabinets cède la place à la fureur de la révolution. Le monde de l'équilibre des puissances a disparu, et un âge nouveau et terrible commence."
 cc_balance_of_power.73.a: "Rien ne sera plus comme avant."

 cc_balance_of_power.74.title: "Le Concert de l'Europe"
 cc_balance_of_power.74.desc: "Contre toute attente, l'équilibre a tenu. Par le biais de congrès et de compromis, de subventions et de retenue, les puissances ont appris à gérer leurs rivalités plutôt qu'à s'y soumettre. Ce qui avait commencé comme un équilibre précaire est devenu un concert durable — un ordre capable de maintenir la paix pendant des générations."
 cc_balance_of_power.74.a: "Laissez le concert perdurer."

 cc_balance_of_power.70.b: "Placez une couronne sur la tête d'un rival humilié."

 cc_balance_of_power.41.title: "La Bataille des Nations"
 cc_balance_of_power.41.desc: "Les armées de la coalition ont convergé sur le champ de bataille. Jamais autant d'étendards n'ont flotté ensemble contre le colosse. Nos généraux nous disent que l'heure est venue : engageons chaque bataillon et la tentative d'hégémonie pourrait s'effondrer ici, dans le sang et la fumée — ou ménageons nos forces et laissons l'ennemi s'étioler dans une guerre plus longue."
 cc_balance_of_power.41.a: "Misez tout sur un engagement général."
 cc_balance_of_power.41.b: "Harceler et retarder — préserver nos forces."

 cc_balance_of_power.42.title: "Terre brûlée"
 cc_balance_of_power.42.desc: "Les armées de l'hégémon marchent vers notre cœur du territoire, vastes et confiantes. Nous ne pouvons pas leur tenir tête en bataille rangée — mais la terre elle-même peut devenir une arme. Brûlez les greniers, empoisonnez les puits et reculez devant eux dans le froid et la distance, jusqu'à ce que leur grande armée meure de faim parmi les cendres."
 cc_balance_of_power.42.a: "Brûler les terres devant soi et battre en retraite."
 cc_balance_of_power.42.b: "Tenez bon et défendez nos foyers."

 cc_balance_of_power.43.title: "L'ulcère sanglant"
 cc_balance_of_power.43.desc: "Un peuple entier s'est soulevé contre notre occupation — non pas en bataille rangée, mais par des embuscades et des assassinats, mille petites blessures qui ne se referment jamais. Nos armées tiennent les villes et commandent les routes le jour, mais saignent dans les collines la nuit. Cette plaie ouverte nous épuise tandis que le reste du continent observe et prend courage."
 cc_balance_of_power.43.a: "Envoyer des troupes en masse pour écraser la révolte."
 cc_balance_of_power.43.b: "Garnisonnez les villes et endurez les pertes."

 cc_balance_of_power.44.title: "Le bloc continental"
 cc_balance_of_power.44.desc: "Nous ne pouvons atteindre nos principaux rivaux par la seule force des armes — mais nous pouvons fermer les marchés du continent à leurs marchands. Que tout port sous notre influence refuse leurs marchandises ; que leur commerce s'étiole et que leurs maisons de banque s'effondrent. Un blocus de tout le continent est une arme jamais maniée à une telle échelle — et il entravera notre propre commerce tout autant que le leur."
 cc_balance_of_power.44.a: "Proclamons le blocus — étranglons leur commerce."
 cc_balance_of_power.44.b: "Maintenir les routes maritimes ouvertes — nous profitons davantage du commerce."

 cc_balance_of_power.45.title: "Levée en Masse"
 cc_balance_of_power.45.desc: "La lutte a dépassé les armées de cabinet d'autrefois. Nos ministres proposent une mesure sans précédent : appeler la nation entière aux armes — chaque homme capable devient soldat, chaque atelier une manufacture de guerre. Cela invoquerait des armées innombrables, mais placerait également des mousquets entre les mains du peuple et briserait à jamais les liens de l'ancien ordre."
 cc_balance_of_power.45.a: "Appeler la nation entière aux armes."
 cc_balance_of_power.45.b: "Faites confiance à l'armée professionnelle."

 cc_balance_of_power.46.title: "Une paix séparée"
 cc_balance_of_power.46.desc: "Les envoyés de l'hégémon viennent nous voir en secret, avec des paroles douces et des termes généreux. Pourquoi saigner pour une coalition qui pourrait encore échouer, demandent-ils, alors qu'un arrangement pourrait épargner notre peuple et même enrichir notre maison ? Nos partenaires y verraient une trahison — mais les fardeaux de la lutte sont lourds, et le colosse semble inarrêtable."
 cc_balance_of_power.46.a: "S'entendre avec l'hégémon."
 cc_balance_of_power.46.b: "Tenir bon — notre place est au sein de la coalition."

 cc_balance_of_power.47.title: "Un mariage d'État"
 cc_balance_of_power.47.desc: "Notre prééminence est telle que les cours mineures recherchent nos faveurs, et le lien le plus sûr entre les trônes a toujours été le lit nuptial. Une union dynastique lierait une puissance vacillante à notre maison — ou, en allant plus loin, nous pourrions placer l'un de nos parents sur son trône et régner comme un royaume satellite dans tout sauf le nom."
 cc_balance_of_power.47.a: "Les lier à notre maison."
 cc_balance_of_power.47.b: "Installez-les en tant que royaume satellite."
 cc_balance_of_power.47.c: "Une simple courtoisie — portraits et banalités."

 cc_balance_of_power.75.title: "Le concert vacille"
 cc_balance_of_power.75.desc: "Pendant une génération, le concert a tenu, et les chancelleries se sont félicitées d'avoir dompté les ambitions des princes. Mais aucun ordre ne dure éternellement. Une puissance a trahi sa foi et a recherché à nouveau la prééminence ; les anciens congrès s'estompent, les garanties sonnent creux, et le calcul prudent de l'équilibre recommence à zéro."
 cc_balance_of_power.75.a: "La paix ne pouvait pas durer éternellement."

 # ============================================================
 # ACTION EVENTS (80-92)
 # ============================================================
 cc_balance_of_power.80.title: "Une demande d'adhésion"
 cc_balance_of_power.80.desc: "Un envoyé de [cc_bop_petitioner.GetName] nous attend avec une proposition : leur cour lierait son sort au nôtre et marcherait sous notre étendard. Une épée supplémentaire est toujours la bienvenue — pourtant, chaque client que nous rassemblons nous lie davantage à leurs querelles autant que les nôtres aux leurs."
 cc_balance_of_power.80.a: "Les admettre dans notre bloc."
 cc_balance_of_power.80.b: "Nous n'avons pas besoin d'eux."

 cc_balance_of_power.81.title: "Une demande d'adhésion"
 cc_balance_of_power.81.desc: "Un envoyé de [cc_bop_petitioner.GetName] sollicite une audience : craignant l'hégémon en devenir, leur cour rejoindrait la coalition et ajouterait son poids à la cause de l'équilibre. Le nombre est la force de la coalition — bien que chaque nouveau partenaire soit une voix de plus à satisfaire à la table du conseil."
 cc_balance_of_power.81.a: "Accueillons-les au sein de la coalition."
 cc_balance_of_power.81.b: "Nous n'avons pas besoin d'eux."

 cc_balance_of_power.91.title: "Notre pétition est acceptée"
 cc_balance_of_power.91.desc: "Une nouvelle nous vient du chef du bloc : notre pétition est acceptée et notre cour est admise en leur compagnie. Nous ne sommes plus seuls dans le grand jeu."
 cc_balance_of_power.91.a: "Qu'il en soit ainsi — nous sommes désormais engagés."

 cc_balance_of_power.92.title: "Notre pétition est refusée"
 cc_balance_of_power.92.desc: "Le chef du bloc a repoussé notre ouverture avec une courtoisie froide. Il ne nous reste plus qu'à tracer notre propre chemin dans ce concours — et à nous souvenir de cet affront."
 cc_balance_of_power.92.a: "Nous nous en souviendrons."

 cc_balance_of_power.93.title: "Le congrès est convoqué"
 cc_balance_of_power.93.desc: "À notre appel, les puissances de la coalition se réunissent en congrès permanent. Ce qui n'était qu'une alliance de circonstance informelle dispose désormais d'une salle pour délibérer, d'une table pour voter et des moyens de s'unir autour d'un objectif commun. Le travail d'équilibrage face au colosse peut désormais être accompli de concert."
 cc_balance_of_power.93.a: "Que le congrès siège."

 cc_balance_of_power.94.title: "Retourner au sein de la famille européenne"
 cc_balance_of_power.94.desc: "Une génération s'est écoulée depuis notre défaite. Les blessures du grand règlement ont suffisamment guéri pour que les puissances, conscientes qu'aucun arrangement ne dure tant qu'une grande nation est tenue en exil, tendent la main. Nous sommes invités à prendre place au Concert de l'Europe — non plus comme un paria, mais une fois de plus comme un partenaire dans la gestion de la paix sur le continent."
 cc_balance_of_power.94.a: "Nous reprenons notre place légitime."

 cc_balance_of_power.82.title: "Neutralité armée"
 cc_balance_of_power.82.desc: "Plutôt que d'être entraînés dans les querelles des grandes puissances, notre cour déclare sa neutralité armée : amicaux envers tous, redevables envers personne, nos ports et nos frontières sont ouverts au commerce honnête et fermés aux sergents de recrutement de l'un ou l'autre bloc. L'or étranger coule librement pour nous maintenir ainsi."
 cc_balance_of_power.82.a: "Nos mains restent libres."

 cc_balance_of_power.83.title: "Jouant sur les deux tableaux"
 cc_balance_of_power.83.desc: "Nos diplomates sont passés maîtres dans l'art du mot discret et de l'allusion opportune. En penchant, très légèrement, vers le camp le plus faible, nous maintenons l'équilibre des forces — et nous nous assurons que les deux parties paient généreusement pour notre bonne volonté continue."
 cc_balance_of_power.83.a: "Qu'ils cherchent tous deux à nous courtiser."

 cc_balance_of_power.84.title: "S'appuyer sur les non-alignés"
 cc_balance_of_power.84.desc: "Forts de la confiance née de notre ascension croissante, nos envoyés pressent les cours hésitantes du continent. Un mot sur le sort de ceux qui s'opposent à nous, un rappel des armées sous notre commandement — et l'équilibre bascule en notre faveur sans qu'un seul coup de canon ne soit tiré."
 cc_balance_of_power.84.a: "Ils apprendront à nous craindre."

 cc_balance_of_power.85.title: "Le bloc continental"
 cc_balance_of_power.85.desc: "Nous proclamons les marchés du continent fermés au commerce de nos rivaux. Qu'aucun port sous notre influence n'admette leurs marchandises ; que leurs comptoirs s'effondrent et que leurs marchands s'indignent. Le commerce de la coalition dépérit sous le poids de notre ambition."
 cc_balance_of_power.85.a: "Étrangler leur commerce."

 cc_balance_of_power.86.title: "Consolidation de l'hégémonie"
 cc_balance_of_power.86.desc: "Le moment est venu de récolter les fruits de notre ambition. Les subventions sont versées, les garnisons postées, les accords dynastiques conclus — et une centaine de petites cours s'alignent derrière nous. L'équilibre bascule vers notre maîtrise, et le bloc en sort renforcé."
 cc_balance_of_power.86.a: "Le continent plie sous notre volonté."

 cc_balance_of_power.87.title: "Subvention des Alliés"
 cc_balance_of_power.87.desc: "Les membres mineurs de la coalition ne peuvent égaler seuls les finances de l'hégémon — nous ouvrons donc les nôtres. L'or coule pour renforcer leurs levées et stabiliser leur résolution, afin qu'aucun partenaire n'ait à traiter avec l'ennemi par manque de moyens."
 cc_balance_of_power.87.a: "Qu'aucun allié ne manque de rien."

 cc_balance_of_power.88.title: "Commandement suprême assumé"
 cc_balance_of_power.88.desc: "Nous descendons nous-mêmes sur le champ de bataille, nos propres bannières en tête de l'armée alliée. Les puissances mineures s'alignent derrière une volonté unique, et notre prestige donne à la coalition la vigueur qui lui manquait. D'une seule main dirigeant la guerre, l'équilibre est ramené vers la stabilité."
 cc_balance_of_power.88.a: "Le commandement est nôtre."

 cc_balance_of_power.89.title: "Une révolution diplomatique"
 cc_balance_of_power.89.desc: "D'un seul trait, notre cabinet renverse la diplomatie d'une génération — un renversement des alliances qui laisse soudainement le prétendant dépourvu d'amis et la coalition gonflée d'une force nouvelle. L'équilibre bascule décisément en faveur du plus grand nombre."
 cc_balance_of_power.89.a: "La donne est redistribuée."

 cc_balance_of_power.90.title: "Le blocus naval"
 cc_balance_of_power.90.desc: "Si l'hégémon ferme ses terres à notre commerce, nous fermerons la mer au sien. Nos flottes balaient les accès et bloquent les grands ports ; les navires marchands du bloc prépondérant pourrissent à l'ancre tandis que le commerce de ses rivaux s'infiltre. La guerre économique frappe des deux côtés — mais qu'il en soit ainsi."
 cc_balance_of_power.90.a: "Bloquer leurs côtes."

 # --- Betrayal & the reversal of alliances ---
 cc_balance_of_power.100.title: "Un renversement d'alliances"
 cc_balance_of_power.100.desc: "Notre position dans ce bloc est devenue intolérable — sa fortune décline, son chef nous prend pour acquis, et d'autre part, le camp adverse laisse entendre que notre amitié serait richement récompensée. Changer de camp maintenant serait la pire des trahisons aux yeux de nos alliés actuels — et le coup d'État le plus sûr aux yeux de la postérité. Tout l'équilibre du continent pourrait basculer selon notre réponse."
 cc_balance_of_power.100.a: "Inverser nos alliances — passer dans le camp adverse."
 cc_balance_of_power.100.b: "Nous restons fidèles. Notre place est aux côtés de nos alliés."

 cc_balance_of_power.101.title: "Une trahison des plus viles"
 cc_balance_of_power.101.desc: "La nouvelle nous parvient que [bop_defector.GetName] a abandonné notre cause pour rejoindre l'ennemi — les alliances ont été inversées du jour au lendemain, nos conseils trahis, et l'équilibre a basculé contre nous par un seul acte de perfidie. Nos partenaires restants attendent de voir comment nous encaissons le coup."
 cc_balance_of_power.101.a: "Une telle trahison ne sera pas oubliée."

 cc_balance_of_power.103.title: "Parachever la trahison"
 cc_balance_of_power.103.desc: "La paix est signée, nos régiments sont retirés et reformés, et notre nouveau protecteur attend maintenant de nous que nous honorions notre défection. Nos anciens alliés — [bop_old_target.GetName] en tête — se tiennent exposés devant nous. Nous pouvons nous jeter sur eux comme nos nouveaux amis s'y attendent, ou jouer un jeu encore plus profond et ne répondre qu'à nous-mêmes."
 cc_balance_of_power.103.a: "Prendre les armes contre nos anciens alliés."
 cc_balance_of_power.103.b: "Un double jeu — nous gardons nos propres conseils."

 cc_balance_of_power.102.title: "Une trahison achetée"
 cc_balance_of_power.102.desc: "Nos coffres sont pleins et nos maîtres espions s'activent. Un membre mécontent du camp ennemi — [bop_treason_target.GetName] — a laissé entendre qu'une incitation appropriée pourrait le détacher complètement de ses alliés. L'or et l'intrigue pourraient transformer la force d'un rival en la nôtre, bien que de tels arrangements laissent une tache dont les princes se souviennent longtemps."
 cc_balance_of_power.102.a: "Acheter leur trahison."
 cc_balance_of_power.102.b: "De telles intrigues sont indignes de nous."

 # --- Coalition victory: the chief balancer's reward ---
 cc_balance_of_power.76.title: "L'architecte de l'équilibre"
 cc_balance_of_power.76.desc: "L'hégémon aspirant a été stoppé, et l'équilibre que nous nous sommes efforcés de préserver est désormais institutionnalisé sous la forme d'un concert durable. De toutes les puissances qui se sont alliées contre le colosse, c'est notre main qui a guidé la coalition, notre or et notre diplomatie qui l'ont maintenue unie. L'Europe se tourne vers nous comme jamais auparavant — et la question est de savoir quoi faire de cette prééminence. Allons-nous couronner notre œuvre en tant que garantat fiable de la paix, ou transformer la maîtrise que nous avons acquise sur la coalition en nos propres ambitions ?"
 cc_balance_of_power.76.a: "Nous sommes le garant de la paix en Europe."
 cc_balance_of_power.76.b: "Que le continent suive maintenant notre exemple."

 # --- The coalition takes up arms ---
 cc_balance_of_power.110.title: "L'Heure de la Décision"
 cc_balance_of_power.110.desc: "On ne peut plus ignorer les rapports : l'aspirant hégémon est au seuil de la maîtrise, et chaque mois de retard voit une autre cour tomber dans son orbite. Nos congrès et nos subventions n'ont pas suffi. Si l'équilibre doit être sauvé, ce doit être maintenant — par l'épée. Nos généraux conseillent que la coalition, marchant d'un seul pas, puisse encore briser le colosse avant qu'il ne devienne incontrôlable. Mais frapper le premier, c'est tout miser sur le champ de bataille."
 cc_balance_of_power.110.a: "Frapper maintenant, avant que l'équilibre ne soit définitivement rompu."
 cc_balance_of_power.110.b: "Pas encore — nous n'osons pas affronter le colosse sans préparation."

 cc_balance_of_power.111.title: "Honorer l'Union"
 cc_balance_of_power.111.desc: "Les armées de l'hégémon s'abattent sur [bop_victim.GetName], notre partenaire dans la coalition, et appellent même à présent à l'aide que nous avions promise lors de la formation de l'union. Marcher pour leur défense, c'est attirer tout le poids du colosse sur nous — mais les abandonner, c'est voir la coalition s'effilocher fil après fil, chaque partenaire étant laissé seul pour être dévoré. La crédibilité de toute l'alliance repose sur notre réponse."
 cc_balance_of_power.111.a: "Honorez l'union — marchez à leur défense."
 cc_balance_of_power.111.b: "Nous n'osons provoquer le colosse — ils doivent se débrouiller seuls."

 # ============================================================
 # GENERIC ACTIONS — names & descriptions
 # ============================================================
 cc_bop_petition_preponderance: "Pétitionner le Bloc Prépondérant"
 cc_bop_petition_preponderance_desc: "Demander à l'hégémon aspirant d'admettre notre cour au Bloc prépondérant. Le chef décidera s'il nous accepte. Disponible pour les puissances engagées et non alignées. Ne peut être répété avant 4 ans."
 cc_bop_petition_coalition: "Pétitionner la Coalition d'Équilibrage"
 cc_bop_petition_coalition_desc: "Demander au principal équilibreur d'admettre notre cour à la Coalition d'équilibrage. Le chef décidera s'il nous accepte. Disponible pour les puissances engagées et non alignées. Ne peut être répété avant 4 ans."
 cc_bop_proclaim_neutrality: "Proclamer la neutralité armée"
 cc_bop_proclaim_neutrality_desc: "Déclarer notre cour neutre dans le grand jeu, attirant l'or étranger pour nous maintenir ainsi. Nécessite un ministre du cabinet affecté à la tâche $cc_duty_free_hands$. Ne peut être répété avant 6 ans."
 cc_bop_play_both_sides: "Jouer sur les deux tableaux"
 cc_bop_play_both_sides_desc: "S'orienter discrètement vers le bloc le plus faible pour maintenir l'équilibre du concours — et faire payer les deux camps pour notre bonne volonté. Nécessite un ministre du cabinet en mission diplomatique ($cc_duty_diplomatic_mission$ ou corps diplomatique). Ne peut être répété avant 5 ans."
 cc_bop_io_intimidate: "Intimider les non-alignés"
 cc_bop_io_intimidate_desc: "Dépensez l'Ambition du bloc pour faire pression sur les cours hésitantes du continent et rétablir l'équilibre. Nécessite 25 d'Ambition (en dépense 20). Ne peut être répété avant 4 ans."
 cc_bop_io_continental_system: "Proclamer le Blocus continental"
 cc_bop_io_continental_system_desc: "Dépensez l'Ambition du bloc pour fermer les marchés du continent à la coalition, bloquant leur commerce. Nécessite 40 d'Ambition (en consomme 30) et une Part de Prépondérance d'au moins 55 %. Ne peut être répété avant 5 ans."
 cc_bop_io_consolidate_hegemony: "Consolider l'hégémonie"
 cc_bop_io_consolidate_hegemony_desc: "Une poussée finale : dépensez une grande quantité d'Ambition pour faire pencher la balance radicalement vers la maîtrise et enhardir l'ensemble du bloc. Nécessite 70 d'Ambition (en consomme 50). Ne peut être répété avant 6 ans."
 cc_bop_io_subsidize_allies: "Subventionner les Alliés"
 cc_bop_io_subsidize_allies_desc: "Dépensez la Détermination de la coalition pour endurcir ses membres mineurs face à l'hégémon. Nécessite 25 de Détermination (en dépense 20). Ne peut être répété avant 4 ans."
 cc_bop_io_naval_blockade: "Ordonner un blocus naval"
 cc_bop_io_naval_blockade_desc: "La réponse de la coalition au Système Continental : dépenser de la Détermination pour bloquer les côtes du bloc prépondérant et étouffer son commerce. Une mesure réactive — nécessite 35 de Détermination (en consomme 25) et une Part de Prépondérance d'au moins 55 %. Ne peut être répétée avant 5 ans."
 cc_bop_io_convene_the_congress: "Convoquer le Congrès"
 cc_bop_io_convene_the_congress_desc: "Convoquer le congrès dormant en session, ouvrant ainsi le Congrès d'Équilibrage permanent afin que le bloc puisse voter des lois et déposer des motions parlementaires. Un acte structurel — nécessite au moins 3 membres et 20 de Résolution (mobilise la cause pour +5)."
 cc_bop_io_assume_supreme_command: "Assumer le commandement suprême"
 cc_bop_io_assume_supreme_command_desc: "Descendre personnellement sur le terrain : mettre le prestige du régulateur au service de l'effort allié et rétablir l'équilibre. Un coup unilatéral — nécessite 40 de Résolution (en dépense 30) et une Part de Prépondérance d'au moins 55 %. Ne peut être répété avant 4 ans."
 cc_bop_io_diplomatic_revolution: "Orchestrer une révolution diplomatique"
 cc_bop_io_diplomatic_revolution_desc: "Un renversement des alliances : le cabinet du médiateur orchestre un réalignement spectaculaire, faisant basculer l'équilibre décisivment en faveur du plus grand nombre. Un aboutissement unilatéral — nécessite 70 de Résolution (en dépense 50). Ne peut être répété avant 6 ans."
 cc_bop_io_leave_bloc: "Quitter le bloc"
 cc_bop_io_leave_bloc_desc: "Retirer notre cour de son bloc. Nous serons marqués comme défecteurs et le prestige de notre ancien bloc en souffrira. Disponible pour les membres n'étant pas leaders. Ne peut être répété avant 3 ans."

 # ai_will_do factor descriptions
 CC_BOP_FRIENDLY_LEADER: "La puissance dominante nous regarde avec bienveillance"
 CC_BOP_BANDWAGON: "Les forts deviennent plus forts — mieux vaut s'allier à eux"
 CC_BOP_BEHIND: "Nous prenons du retard et devons exploiter notre avantage"
 CC_BOP_GREAT_POWER: "Une grande puissance a sa place à la table"
 CC_BOP_NEAR_HEGEMON: "L'hégémon aspirant plane à nos portes"

 # ============================================================
 # PANEL — IO shortcut
 # ============================================================
 CC_BOP_OPEN_IO_TT: "Ouvrir la vue d'organisation de ce bloc, où se trouvent les actions et le trésor de son chef."

 # ============================================================
 # GAME RULE
 # ============================================================
 cc_balance_of_power_rule: "L'équilibre des puissances"
 cc_balance_of_power_rule_desc: "Contrôle si la situation Équilibre des puissances européen peut se déclencher."
 cc_balance_of_power_on: "Activé"
 cc_balance_of_power_on_desc: "La situation de l'équilibre des puissances surviendra dès qu'une grande puissance adoptera la doctrine de l'équilibre des puissances, ou dès l'ouverture de l'ère révolutionnaire."
 cc_balance_of_power_off: "Désactivé"
 cc_balance_of_power_off_desc: "La situation de l'équilibre des puissances ne se déclenchera jamais."

 # ============================================================
 # ADVANCE / REFORMS / PRIVILEGE
 # ============================================================
 cc_balance_of_power_advance: "Doctrine de l'équilibre des puissances"
 cc_balance_of_power_advance_desc: "L'art de gouverner mûrit pour devenir une science de l'équilibre : alliances formées et rompues, subsides et garanties, le tout tendu vers l'unique but d'empêcher tout rival de dominer le continent. La première grande puissance à adopter cette doctrine inaugure l'ère de l'équilibre européen des puissances. Débloque les réformes $cc_balancer_doctrine_reform$ et $cc_raison_detat_reform$ ainsi que le privilège $ep_noble_diplomatic_corps$."
 cc_balancer_doctrine_reform: "Doctrine de l'équilibrateur"
 cc_balancer_doctrine_reform_desc: "Notre diplomatie est organisée autour du maintien de l'équilibre, nous valant une réputation et une portée diplomatique permettant d'assembler des coalitions tout en atténuant l'antagonisme que provoquent nos manœuvres."
 cc_raison_detat_reform: "Raison d'État"
 cc_raison_detat_reform_desc: "La politique est régie par le calcul froid des intérêts de l'État plutôt que par le sentiment dynastique ou la loyauté confessionnelle, conférant à notre art du gouvernement flexibilité, prestige et résilience lors de luttes prolongées."
 ep_noble_diplomatic_corps: "Corps diplomatique noble"
 ep_noble_diplomatic_corps_desc: "La haute noblesse finance et gère un service diplomatique professionnel, animant les ambassades d'Europe et étendant la portée et la réputation diplomatiques de la couronne."

 # ============================================================
 # NEW END REASONS
 # ============================================================
 cc_bop_end_coalition: "L'équilibre a tenu — la coalition a remis l'hégémon aspirant à sa place."
 cc_bop_end_stagnation: "Le moment de l'aspirant est passé — dépassé et éclipsé, ses ambitions sont tombées dans l'oubli."

 # ============================================================
 # THE RECKONING — ticker panel
 # ============================================================
 CC_BOP_RECKONING_HEADER: "Le règlement de comptes"
 CC_BOP_HEGEMONY_TICKER_LABEL: "Chemin vers l'hégémonie"
 CC_BOP_HEGEMONY_TICKER_TT: "Chaque mois où l'hégémon aspirant détient une part prépondérante de 65 ou plus, ce compteur augmente ; lorsque le bloc chute en dessous, il redescend. À 60 mois, l'équilibre est prêt à rompre — mais seule une guerre finale peut le trancher. La coalition est forcée de mener un dernier combat ; s'ils l'emportent, la victoire de l'hégémon est annulée."
 CC_BOP_FINAL_WAR_LABEL: "#R Règlement de comptes final — la coalition tente un dernier acte de résistance.#!"
 CC_BOP_FINAL_WAR_TT: "Le compteur est plein. La situation ne s'achèvera que lorsqu'une dernière guerre entre la coalition et l'hégémon aspirant sera tranchée. Si l'hégémon domine toujours quand les canons se tairont, l'équilibre est définitivement rompu ; si la coalition le freine, l'ambition est contrée et la lutte continue."
 CC_BOP_COALITION_TICKER_LABEL: "Chemin vers le confinement"
 CC_BOP_COALITION_TICKER_TT: "Chaque mois où la coalition d'équilibrage maintient la part prépondérante de l'aspirant à 35 ou moins, ce compteur augmente. À 60 mois, la coalition est prête à porter le coup fatal pour remettre l'aspirant à sa place — à condition que son congrès ait voté le coup de grâce."
 CC_BOP_COALITION_WAR_LABEL: "#R Le coup de grâce — la coalition s'apprête à terrasser le prétendant.#!"
 CC_BOP_STAGNATION_TICKER_LABEL: "Éclipse de l'aspirant"
 CC_BOP_STAGNATION_TICKER_TT: "Tandis que l'hégémon aspirant stagne dans l'impasse et se fait dépasser par un rival surgi dans son ombre, ce compteur augmente. À 60 mois, l'équilibre se dissout simplement — aucun vainqueur décisif, le moment de l'aspirant est perdu."

 # ============================================================
 # RECKONING / DESPERATION / WAR-TOOL EVENTS
 # ============================================================
 cc_balance_of_power.77.title: "L'aspirant est humilié"
 cc_balance_of_power.77.desc: "C'est fait. Le long labeur de la coalition — les subventions, les congrès, le sang versé dans une douzaine de campagnes — a enfin porté ses fruits. La puissance qui aspirait à la maîtrise du continent a été brisée par l'union de ses rivaux et ramenée au rang de grande puissance ordinaire. L'équilibre perdure, justifié, et notre nom avec lui."
 cc_balance_of_power.77.a: "L'Europe respire à nouveau."
 cc_balance_of_power.78.title: "Un moment perdu"
 cc_balance_of_power.78.desc: "Le moment est passé. Nous avons tendu la main vers la maîtrise de l'Europe pour ne saisir que du vent ; pendant que nous hésitions et tergiversions, d'autres ont grandi, et désormais une puissance née dans notre propre ombre nous éclipse. La coalition n'a pas besoin de porter un coup — notre tentative s'est simplement évaporée, et l'équilibre se dissout sans nous en son centre."
 cc_balance_of_power.78.a: "Ce qui aurait pu être."
 cc_balance_of_power.112.title: "L'heure des comptes"
 cc_balance_of_power.112.desc_hegemony: "La balance a penché autant qu'elle pouvait le supporter. L'hégémon aspirant se tient au seuil de la maîtrise, et les cours d'Europe savent que la question ne peut plus être différée. La coalition doit s'imposer maintenant, dans une dernière guerre — car si le colosse l'emporte, il n'y aura pas de seconde chance pour l'endiguer."
 cc_balance_of_power.112.desc_coalition: "La coalition d'équilibrage a pris l'ascendant, et le moment est venu de régler l'affaire une fois pour toutes. Mandat du congrès en main, les puissances s'apprêtent à remettre l'hégémon potentiel à sa place dans une guerre finale et décisive."
 cc_balance_of_power.112.a: "Nous en sommes donc arrivés là."
 cc_balance_of_power.120.title: "Coffres trop vides"
 cc_balance_of_power.120.desc: "Nos envoyés ont porté la convocation à la cour de notre allié — et en sont revenus sans réponse. Le prix pour entraîner une puissance si grande dans notre guerre dépasse ce que notre trésorerie ou la patience du bloc peuvent supporter actuellement. Nous devons mettre nos pièces de côté et nous tourner vers des épées plus modestes, ou attendre."
 cc_balance_of_power.120.a: "Nous ne pouvons alors pas nous les permettre."
 cc_balance_of_power.121.title: "Un trésor de guerre constitué"
 cc_balance_of_power.121.desc: "L'or a été discrètement réparti entre les cours réticentes de notre bloc — pensions promises, dettes effacées, mains graissées. La prochaine fois que nous les appellerons aux armes, l'appel tombera sur des oreilles bien plus attentives, et pour une fraction du coût habituel."
 cc_balance_of_power.121.a: "Laissons les subventions faire leur œuvre."
 cc_balance_of_power.122.title: "La Grande Guerre"
 cc_balance_of_power.122.desc: "Nous n'attendrons pas que nos rivaux soient disposés. Tout le poids du bloc est rassemblé, le casus belli proclamé et les armées mises en marche contre la coalition d'équilibre. Que l'affaire se décide selon nos termes, dans une guerre de notre choix."
 cc_balance_of_power.122.a: "En avant — pour la maîtrise."
 cc_balance_of_power.130.title: "Mesures désespérées"
 cc_balance_of_power.130.desc: "L'ombre de l'aspirant s'allonge sur le continent, et les instruments ordinaires de l'art du gouvernement ne suffisent plus. Le congrès, désormais doté de pouvoirs permanents, nous impose des mesures d'exception. L'équilibre doit être rétabli — quel qu'en soit le prix."
 cc_balance_of_power.130.a: "Acheter une épée étrangère pour la guerre."
 cc_balance_of_power.130.b: "Lancer une mobilisation générale à l'échelle du bloc."
 cc_balance_of_power.130.c: "Ne pas intervenir — le coût est trop élevé."
 cc_balance_of_power.131.title: "L'ultime recours"
 cc_balance_of_power.131.desc: "Le colosse est sur nous. Il n'y aura plus de diplomatie habile, plus de congrès pour délibérer — seulement la question de savoir comment nous allons tenir tête. Notre peuple se tourne vers nous, et nous devons répondre par le fer."
 cc_balance_of_power.131.a: "Brûler les ponts — la terre brûlée devant eux."
 cc_balance_of_power.131.b: "Levez une grande levée — chaque main aux armes."

 # ============================================================
 # NEW PREPONDERANT WAR-TOOL ACTIONS
 # ============================================================
 cc_bop_io_call_to_arms: "Appel aux armes"
 cc_bop_io_call_to_arms_desc: "Entraîner un membre de notre bloc dans notre guerre contre la coalition. Le coût en or varie selon l'assiette fiscale de l'allié — et double pour chaque allié déjà appelé dans cette guerre — donc en pratique, un ou deux seulement peuvent être financés. Nécessite 20 d'Ambition. Un trésor de guerre permanent réduit la facture de moitié."
 cc_bop_io_war_chest: "Constituer un trésor de guerre"
 cc_bop_io_war_chest_desc: "Distribuez des subventions aux cours réticentes de notre bloc à l'avance, réduisant de moitié le coût de notre prochain Appel aux Armes. Nécessite 30 d'Ambition (consomme 30) et une somme d'or. Ne peut être répété avant 3 ans."
 cc_bop_io_grand_war: "Grande Guerre contre la Coalition"
 cc_bop_io_grand_war_desc: "Un coup de grâce : frappez le premier. Déclarez notre propre guerre au principal équilibreur et mobilisez tout le bloc prépondérant, faisant pencher la balance fortement en notre faveur. Nécessite 70 d'Ambition (en consomme 60). Ne peut être répété avant 6 ans."

 # ============================================================
 # AI REASON STRINGS (shown in action / vote tooltips)
 # ============================================================
 CC_BOP_OVEREXTENDED: "Notre bloc est déjà trop étendu"
