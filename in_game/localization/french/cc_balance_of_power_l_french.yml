l_french:
 # ============================================================
 # SITUATION NAME / DESCRIPTION / HINT
 # ============================================================
 cc_balance_of_power: "L'équilibre des puissances"
 cc_balance_of_power_desc: "À travers l'Europe et le Proche-Orient, les grandes puissances s'observent avec méfiance. Lorsqu'un État aspire à la prééminence, les autres s'unissent pour le lui refuser — le Bloc Prépondérant aspirant face à la Coalition d'Équilibrage. Tant qu'aucun ne l'emporte, l'équilibre persiste ; s'il venait à se rompre, un nouveau maître du continent pourrait émerger, l'Est pourrait déborder vers l'Ouest, ou une révolution pourrait balayer entièrement l'ancien ordre."
 hint_cc_balance_of_power: "L'équilibre des puissances est une situation de puissance majeure à deux pôles. La puissance éligible la plus forte dirige le Bloc prépondérant ; la puissance la plus forte qui la redoute dirige la Coalition d'équilibrage. La Part de prépondérance (0-100, 50 = équilibre) mesure à quel point le bloc dominant est devenu hégémonique. Des cours peuvent être sollicitées entre les blocs par le biais de la parenté, de la foi, de la peur, des menaces ou de l'or ; la coalition peut subventionner ses membres les plus faibles, courtiser les neutres et convoquer un Congrès pour resserrer les rangs. La situation prend fin lorsque l'équilibre se rompt — par l'hégémonie, un déluge oriental ou une révolution — ou s'il est préservé sous la forme d'un Concert européen durable."

 # ============================================================
 # MAP LEGEND & TOOLTIPS
 # ============================================================
 CC_BOP_PREPONDERANCE_LEGEND: "Bloc prépondérant"
 CC_BOP_COALITION_LEGEND: "Coalition d'équilibrage"
 CC_BOP_NEUTRAL_LEGEND: "Puissance non alignée"
 cc_bop_preponderance_member_tt: "Cette terre appartient à un membre du Bloc prépondérant."
 cc_bop_coalition_member_tt: "Cette terre appartient à un membre de la Coalition d'Équilibrage."
 cc_bop_neutral_tt: "Cette terre appartient à une puissance non alignée observant l'équilibre depuis la sidelines."

 # ============================================================
 # CABINET-MINISTER & WARTIME CONDITION TOOLTIPS (situation / IO actions)
 # ============================================================
 cc_bop_needs_free_hands_minister_tt: "Un ministre du cabinet doit être affecté à la tâche #Y $cc_duty_free_hands$#! — un homme d'État gardant nos options ouvertes."
 cc_bop_needs_diplomat_minister_tt: "Un ministre du cabinet doit être en poste diplomatique — soit pour la mission #Y $cc_duty_diplomatic_mission$#! soit au sein du #Y corps diplomatique#! — pour exploiter les canaux secrets."
 cc_bop_cannot_leave_at_war_tt: "Nous devons être #R en paix#! — un bloc resserre ses rangs en temps de guerre, et aucun membre ne peut déserter ses alliés alors qu'il est sous les armes."

 # ============================================================
 # IO Currencies
 # ============================================================

 cc_bop_ambition: "Ambition"
 cc_bop_ambition_desc: "Une mesure de la force prépondérante et de l'empressement. Dépensée par l'aspirant hégémon."

 cc_bop_resolve: "Résolution"
 cc_bop_resolve_desc: "Une mesure de la cohésion et de l'endurance de la coalition. Dépensée par le chef de la coalition."

 # ============================================================
 # END REASONS
 # ============================================================
 cc_bop_end_hegemony: "L'équilibre est rompu — une puissance a maîtrisé le continent."
 cc_bop_end_deluge: "Une puissance orientale a surgi vers l'ouest, renversant l'ancien ordre."
 cc_bop_end_revolution: "La révolution a brisé l'équilibre fragile des rois."
 cc_bop_end_concert: "L'équilibre a perduré et a été institutionnalisé sous la forme d'un Concert européen."

 # ============================================================
 # INTERNATIONAL ORGANIZATIONS
 # ============================================================
 cc_bop_preponderance: "Bloc prépondérant"
 cc_bop_coalition: "Coalition d'équilibrage"
 cc_bop_concert: "Concert de l'Europe"
 io_opinion_cc_bop_preponderance: "Membre allié du bloc prépondérant"
 io_opinion_cc_bop_coalition: "Membre allié de la coalition d'équilibre"
 io_opinion_cc_bop_concert: "Membre allié du Concert de l'Europe"

 # IO variable display
 CC_BOP_AMBITION_FORMAT: "$VAL$"
 CC_BOP_RESOLVE_FORMAT: "$VAL$"
 CC_BOP_AMBITION_NATURAL: "Élan d'ambition"
 CC_BOP_AMBITION_LEADER_STRENGTH: "Force de la puissance dominante"
 CC_BOP_RESOLVE_NATURAL: "Objectif commun"
 CC_BOP_RESOLVE_NUMBERS: "Le poids du nombre"
 CC_BOP_RESOLVE_COMMON_THREAT: "Un ennemi commun"

 # ai_desire_to_join factor descriptions
 CC_BOP_NOT_ENGAGED: "Nous nous tenons à l'écart du grand jeu"
 CC_BOP_ROYAL_MARRIAGE: "Liés par un mariage royal"
 CC_BOP_SHARED_RELIGION: "Liés par une foi commune"
 CC_BOP_SHARED_CULTURE: "Liés par une culture commune"
 CC_BOP_OVERLORD: "Suivre notre suzerain"
 CC_BOP_RIVALRY: "Une vieille rivalité l'interdit"
 CC_BOP_LEADER_RELATIONS: "Nos relations avec la puissance dominante"
 CC_BOP_BOUGHT_NEUTRALITY: "L'or étranger conseille la neutralité"
 CC_BOP_FEAR_OF_HEGEMON: "Crainte de l'hégémon aspirant"
 CC_BOP_WAR_URGENCY: "En guerre — nous avons besoin d'alliés"
 CC_BOP_MEMBER_COMMITMENT: "Nous avons lié notre sort à ce bloc"
 CC_BOP_NEUTRALIST_PULL: "L'or étranger nous tente vers la neutralité"
 CC_BOP_NEUTRALIST_COUNSEL: "Nos ministres conseillent de garder nos mains libres"
 CC_BOP_BLOC_FALTERING: "Notre bloc vacille visiblement"
 CC_BOP_CAUSE_LOST: "La cause semble presque perdue"
 CC_BOP_RESENT_LEADER: "Nous nous impatientons sous la domination de la puissance dirigeante"
 # Generic AI-weight descs referenced by the coalition IO (unlocalized in vanilla)
