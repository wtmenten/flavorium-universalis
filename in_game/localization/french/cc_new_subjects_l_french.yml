l_french:
 # ============================================================
 # SUBJECT TYPES
 # ============================================================
 LEAD_provincial_governorate: "Couronne"
 AM_provincial_governorate: "Gouvernement provincial"
 CANCEL_provincial_governorateTITLE: "Dissoudre le gouvernorat provincial"
 CANCEL_provincial_governorate_DESC: "Révoquer la charte du gouvernorat, mettant fin à l'administration nommée par la Couronne et remettant la région sous contrôle direct."

 LEAD_tax_farm: "Couronne"
 AM_tax_farm: "Ferme fiscale"
 CANCEL_tax_farmTITLE: "Mettre fin à l'accord de ferme fiscale"
 CANCEL_tax_farm_DESC: "Mettre fin au contrat de fermage fiscal, rétablissant la collecte directe et mettant fin à la concession du seigneur sur ces revenus."

 LEAD_military_march: "Suzerain"
 AM_military_march: "Marche militaire"
 CANCEL_military_marchTITLE: "Révocation de la charte de marche"
 CANCEL_military_march_DESC: "Révoquer la charte de la marche, dépouillant le seigneur de la marche de son autorité militaire offensive. La frontière sera moins agressive — et moins imprévisible."

 provincial_governorate: "Gouvernement provincial"
 provincial_governorate_desc: "Une région administrative à haute autonomie gouvernée par un magnat nommé par la Couronne. Le gouvernorat gère ses propres affaires internes et défend nos frontières — mais les ambitions du Gouverneur ne s'alignent pas toujours sur les nôtres."
 provincial_governorate_upgrade_tt: "Le gouvernorat provincial peut être élevé au rang de palatinat après un délai suffisant."

 tax_farm: "Ferme fiscale"
 tax_farm_desc: "Un arrangement d'extraction exploiteur dans lequel un seigneur puissant gère la collecte des revenus en échange d'une partie des produits. Extrêmement rentable à court terme, profondément instable à long terme. Les populations taxées finiront par demander un soulagement."
 tax_farm_upgrade_tt: ""

 military_march: "Marche militaire"
 military_march_desc: "Un vassal frontalier offensif doté d'une charte militaire spéciale pour projeter sa puissance au-delà de nos frontières. Le Seigneur de Marche est formidable, loyal (quand les nobles sont satisfaits), et occasionnellement impossible à contrôler. Ils pilleront nos voisins, que nous le sanctionnions ou non."
 military_march_upgrade_tt: ""

 # ============================================================
 # ADVANCES
 # ============================================================
 late_governorate_advance: "Gouvernance provinciale"
 late_governorate_advance_desc: "Un système formalisé de gouvernorats nommés par la Couronne permet au royaume d'étendre sa portée administrative sur des régions lointaines sans annexion directe. Débloque le type de sujet Gouvernorat Provincial, le privilège d'état Charte du Gouvernorat et la Réforme du Gouvernorat."

 tax_farming_advance: "Fermage fiscal"
 tax_farming_advance_desc: "Confier la collecte des revenus à des seigneurs locaux puissants, moyennant finance. Débloque le type de sujet Ferme fiscale, le privilège d'état Charte fiscale et la Réforme de l'affermage."

 military_march_advance: "Marches militaires"
 military_march_advance_desc: "Désigner des territoires frontaliers comme marches militaires crée des zones tampons offensives qui étendent notre puissance à la frontière. Débloque le type de sujet Marche Militaire, le privilège d'état Charte de la Marche et la Réforme de la Charte de la Marche."

 # ============================================================
 # GOVERNMENT REFORMS — STANDARD
 # ============================================================
 cc_governorate_reform: "Système de gouvernorats"
 cc_governorate_reform_desc: "Formalise le système de gouvernorats provinciaux nommés par la Couronne, améliorant la capacité administrative à travers le royaume."

 cc_tax_farming_reform: "Contrats de fermage fiscal"
 cc_tax_farming_reform_desc: "Systématise la pratique de l'affermage de la collecte des impôts à des seigneurs puissants, réduisant les frais bureaucratiques en échange d'une efficacité locale."

 cc_march_charter_reform: "Charte de Marche"
 cc_march_charter_reform_desc: "Délivrer des chartes formelles aux territoires frontaliers pour les désigner comme marches militaires, créant un réseau de zones tampons offensives le long des frontières les plus contestées du royaume."

 # ============================================================
 # GOVERNMENT REFORMS — LEGENDARY
 # ============================================================
 cc_philosophers_court_reform: "La cour du philosophe"
 cc_philosophers_court_reform_desc: "La cour la plus savante du monde. La recherche s'accélère, les institutions se propagent et la réputation intellectuelle du royaume attire des talents venus du monde entier."

 cc_grand_bazaar_reform: "Le Grand Bazar"
 cc_grand_bazaar_reform_desc: "Un réseau commercial et diplomatique cosmopolite formalisé comme principe de gouvernance. Les centres commerciaux prospèrent, la capacité diplomatique s'étend et notre réputation dans le monde islamique devient un atout stratégique."

 cc_iron_hegemony_reform: "L'hégémonie de fer"
 cc_iron_hegemony_reform_desc: "La dominance militaire est formalisée comme principe constitutionnel. Toutes les armes du service militaire sont subventionnées par l'État ; les états nobles sont liés à la machine militaire ; les voisins du royaume adaptent leur comportement en conséquence."

 cc_parliamentary_compromise_reform: "Compromis parlementaire"
 cc_parliamentary_compromise_reform_desc: "Un accord formel entre la couronne et la législature qui rend le parlement simultanément plus efficace et plus légitime."

 cc_mandate_bureaucracy_reform: "Mandat de Bureaucratie"
 cc_mandate_bureaucracy_reform_desc: "La mise en œuvre de l'idéal bureaucratique confucéen : une gouvernance méritocratique, des relations appropriées et le postulat que l'État existe pour servir l'ordre moral. Disponible pour les royaumes d'Asie de l'Est et du Sud-Est."

 cc_peoples_assembly_reform: "Assemblée du Peuple"
 cc_peoples_assembly_reform_desc: "À l'ère des révolutions, un gouvernement qui commande véritablement le consentement populaire. L'agitation diminue ; l'efficacité législative augmente ; l'histoire en prend note."

 # ============================================================
 # ESTATE PRIVILEGES
 # ============================================================
 ep_nobles_governorate_charter: "Charte du gouvernorat"
 ep_nobles_governorate_charter_desc: "La noblesse reçoit l'autorité formelle d'administrer des gouvernorats provinciaux au nom de la Couronne, en échange de contributions au développement et d'une loyauté continue."

 ep_nobles_march_charter: "Charte de Marche"
 ep_nobles_march_charter_desc: "La noblesse reçoit l'autorité formelle d'établir des marches militaires le long de la frontière — puissantes, offensives et parfois impossibles à contrôler pleinement."

 ep_nobles_diplomatic_court: "Cour diplomatique"
 ep_nobles_diplomatic_court_desc: "La noblesse finance et organise une cour diplomatique formelle qui rehausse la réputation du royaume dans le monde islamique, projetant puissance et prestige à parts égales."

 ep_burghers_tax_charter: "Charte fiscale"
 ep_burghers_tax_charter_desc: "Les états marchands reçoivent l'autorité formelle d'administrer la collecte des impôts dans des régions désignées, réduisant les coûts bureaucratiques en échange d'une commission commerciale sur les revenus."

 ep_burghers_parliamentary_charter: "Charte parlementaire"
 ep_burghers_parliamentary_charter_desc: "Les bourgeois reçoivent une charte parlementaire formelle qui codifie leurs droits législatifs, augmentant simultanément le soutien parlementaire et l'influence politique commerciale."

 # ============================================================
 # SUBJECT DRAWBACK MODIFIERS
 # ============================================================
 cc_subject_autonomy_pressure: "Pression sur l'autonomie"
 cc_subject_autonomy_pressure_desc: "La population du sujet est agitée et demande une plus grande autonomie. Des mouvements rebelles s'organisent."

 cc_subject_tax_relief: "Allégement fiscal"
 cc_subject_tax_relief_desc: "La réduction de la pression d'extraction a calmé la population du sujet. L'agitation diminue et la légitimité se rétablit lentement."

 # ============================================================
 # LEGEND MODIFIER
 # ============================================================
 cc_legend_holy_empire: "Empire saint"
 cc_legend_holy_empire_desc: "Le royaume a atteint le statut d'Empire Saint — une entité sacrée dans laquelle l'autorité spirituelle et temporelle se renforcent mutuellement. L'influence religieuse s'étend, la conversion s'accélère et le pouvoir politique du clergé atteint son apogée."

