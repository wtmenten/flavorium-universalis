 # ============================================================
 # Modifier Display Names (Pillar 01)
 # ============================================================
 STATIC_MODIFIER_NAME_court_tension: "Tension à la cour"
 STATIC_MODIFIER_DESC_court_tension: "Deux membres ou plus du cabinet représentent des positions irréconciliables. Une paralysie politique s'est installée — le prestige s'effrite, la réputation diplomatique en pâtit et chaque décision coûte plus cher."

 STATIC_MODIFIER_NAME_cc_cabal_compact: "Pacte du cabinet"
 STATIC_MODIFIER_DESC_cc_cabal_compact: "Deux ministres alliés ont formalisé leur relation de travail. Le cabinet fonctionne plus harmonieusement, et l'autorité partagée réduit les frictions de gouvernance."

 STATIC_MODIFIER_NAME_cc_faction_purge_fallout: "Retombées factionnelles"
 STATIC_MODIFIER_DESC_cc_faction_purge_fallout: "Le renvoi d'un ministre n'est pas resté sans réponse. Le réseau du ministre purgé riposte discrètement — le prestige s'érode et les contacts diplomatiques se refroidissent."

 # ============================================================
 # Character Interaction — Dismiss Rival Minister
 # ============================================================
 dismiss_rival_minister: "Congédier le ministre"
 dismiss_rival_minister_desc: "La cour se fracture autour d'une rivalité de factions. Congédier l'un des ministres résoudra le conflit immédiat — au prix du prestige et, si le ministre est lié à un domaine, des relations avec les domaines."
 choose_minister_to_dismiss: "Choisissez un ministre à renvoyer"
