l_french:
 # ============================================================
 # Pillar 01 — Court Rivalry & Cabinet Intrigue
 # ============================================================

 # --- cc_rival.1 — The Minister's Complaint ---
 cc_rival.1.title: "La plainte du ministre"
 cc_rival.1.desc: "La tension entre [rival_a.GetName] et [rival_b.GetName] a abouti à une rupture ouverte. Tous deux ont désormais adressé des représentations formelles à la couronne, chacun exigeant que l'autre soit écarté ou blâmé. La cour observe."

 cc_rival.1.a: "S'allier à [rival_a.GetName]."
 cc_rival.1.a.tooltip: "[rival_b.GetName] reçoit le message clair que [rival_b.GetHerHis] position dans cette cour est conditionnée par la retenue. Le camouflet ne sera pas oublié — mais la tension s'apaise."

 cc_rival.1.b: "S'allier à [rival_b.GetName]."
 cc_rival.1.b.tooltip: "[rival_a.GetName] est remis à [rival_a.GetHerHis] place. La cour reçoit le signal ; une faction se refroidit tandis que l'autre couve une blessure."

 cc_rival.1.c: "Négociez une réconciliation entre eux."
 cc_rival.1.c.tooltip: "Un exercice coûteux et épuisant de patience royale. Les deux ministres quittent la salle du trône satisfaits — pour l'instant. Le score de rivalité diminue, et la bonne volonté est achetée au prix de pièces et de prestige."

 cc_rival.1.d: "Exploiter la tension — ouvrir leur correspondance."
 cc_rival.1.d.tooltip: "Que les maîtres espions de la cour ouvrent ce qui a été scellé. S'il y a des complots, mieux vaut le savoir. S'il n'y a rien — au moins l'un d'eux se demandera ce que vous avez trouvé."

 # --- cc_rival.2 — A Letter Unsealed ---
 cc_rival.2.title: "Une lettre scellée"
 cc_rival.2.desc: "La correspondance de [rival_b.GetName] a été discrètement examinée. Ce qui a été trouvé n'est pas treasonneux — mais c'est préjudiciable. Des communications privées avec les opposants de [rival_a.GetName] ; des engagements pris sans l'approbation royale ; des faveurs promises au nom de la couronne. La lettre est maintenant devant vous."

 cc_rival.2.a: "Utilisez-le pour purger [rival_b.GetName] du cabinet."
 cc_rival.2.a.tooltip: "La lettre devient un prétexte formel. [rival_b.GetName] est confronté à la situation, le prestige pâtit du spectacle d'un renvoi public, et le réseau de [rival_b.GetHerHis] nourrira silencieusement de la rancœur envers la couronne pendant des années."

 cc_rival.2.b: "Le transmettre à [rival_a.GetName] comme moyen de pression."
 cc_rival.2.b.tooltip: "La lettre parvient au rival. [rival_a.GetName] s'en servira comme munition — et le conflit entre factions s'intensifiera avant de se résoudre. Vous gagnez du prestige grâce à la gratitude de [rival_a.GetHerHis], mais la guerre entre eux ne fait que commencer."

 cc_rival.2.c: "Réprimer — brûler la lettre."
 cc_rival.2.c.tooltip: "Le choix le plus sage est parfois d'en savoir moins. Le score de rivalité baisse légèrement, et personne ne saura exactement ce qui a été lu — excepté vous."

 # --- cc_rival.3 — The Faction Hardens ---
 cc_rival.3.title: "La faction se durcit"
 cc_rival.3.desc: "[rival_a.GetName] a utilisé les renseignements avec efficacité. La cour est désormais ouvertement divisée. Les partisans de [rival_b.GetName] ont commencé à former un bloc — dîners discrets, correspondance partagée, positions coordonnées sur chaque question. Ce qui n'était qu'une rivalité personnelle est devenu une confrontation factionnelle."

 cc_rival.3.a: "Réprimer la faction."
 cc_rival.3.a.tooltip: "Une intervention coûteuse et visible. Le réseau de [rival_b.GetName] est démantelé ; la cour sait que la couronne ne tolérera pas d'opposition ouverte. Le prestige s'effrite, la stabilité s'effiloche et les survivants de la faction se dispersent — mais ils s'en souviendront."

 cc_rival.3.b: "Laisser la faction s'épuiser d'elle-même."
 cc_rival.3.b.tooltip: "Vous ne faites rien et laissez les factions s'affronter. La tension persistera pendant des années, la stabilité en pâtira et la cour deviendra plus fractieuse — mais aucun sang ne sera versé et personne ne se fera l'ennemi de la couronne."

 cc_rival.3.c: "Élever publiquement la faction de [rival_a.GetName]."
 cc_rival.3.c.tooltip: "Une déclaration formelle de préférence. [rival_a.GetName] reçoit l'endossement de la couronne : un gain de compétence et une loyauté renouvelée. La faction de [rival_b.GetName] se dissout dans l'embarras. Le coût en prestige est réel — mais la résolution l'est tout autant."

 # --- cc_rival.4 — The Scorned Counselor ---
 cc_rival.4.title: "Le conseiller méprisé"
 cc_rival.4.desc: "[scorned_counselor.GetName] n'est pas parti discrètement. Congédié du cabinet mais toujours présent à la cour, [scorned_counselor.GetHeShe] a passé les mois écoulés à cultiver des alliés, à rouvrir de vieux griefs et à faire des suggestions soigneusement formulées suggérant que la couronne est devenue erratique. Les murmures deviennent audibles."

 cc_rival.4.a: "Exiler [scorned_counselor.GetName] du royaume."
 cc_rival.4.a.tooltip: "Un acte décisif et visible. Le conseiller est escorté jusqu'à la frontière ; la cour comprend que la patience de la couronne a ses limites. Le prestige pâtit du spectacle, mais la menace est entièrement écartée."

 cc_rival.4.b: "Proposer un règlement privé — de l'argent contre le silence."
 cc_rival.4.b.tooltip: "Un marché pragmatique. [scorned_counselor.GetName] reçoit assez de pièces pour prendre une retraite confortable ailleurs à la cour, et en retour, [scorned_counselor.GetHeShe] met fin à sa campagne de murmures. C'est coûteux, et cela crée un précédent — mais le problème est résolu."

 cc_rival.4.c: "Ignorez les grognements — cela ne mènera à rien."
 cc_rival.4.c.tooltip: "Une erreur de calcul. Laisser un ex-ministre rancunier agir à la cour sans contrôle est une invitation au factionnalisme. La tension s'accumule, et d'autres commencent à se demander si la couronne est attentive."

 # --- cc_cabal.1 — The Alliance Forms ---
 cc_cabal.1.title: "Une alliance à la cour"
 cc_cabal.1.desc: "Il a été remarqué que [cabal_a.GetName] et [cabal_b.GetName] ont développé une relation de travail remarquable. Ils se deferrent l'un à l'autre en conseil, partagent des renseignements à travers leurs portefeuilles et présentent une position unifiée sur presque toutes les questions importantes. Qu'il s'agisse d'amitié, de calcul ou d'un mélange des deux — la cour a commencé à parler d'eux comme d'un duo."

 cc_cabal.1.a: "Formaliser leur alliance — les laisser travailler comme un pacte."
 cc_cabal.1.a.tooltip: "Une chose rare : deux ministres dont les ambitions sont alignées. Formaliser le pacte signale votre confiance et fait de leur coopération une politique officielle. Une proposition de réforme conjointe suivra."

 cc_cabal.1.b: "Qu'ils collaborent de manière informelle."
 cc_cabal.1.b.tooltip: "Aucune sanction formelle, mais aucune objection non plus. Le lien entre eux s'approfondit sans devenir une institution de la cour. Plus simple, et plus sûr."

 cc_cabal.1.c: "Décourager le partenariat."
 cc_cabal.1.c.tooltip: "La coordination explicite de deux ministres puissants représente un risque politique. Un mot discret du trône précise que le cabinet ne doit pas devenir une faction. Les deux ministres sont légèrement refroidis."

 # --- cc_cabal.2 — The Joint Reform Proposal ---
 cc_cabal.2.title: "La proposition de réforme conjointe"
 cc_cabal.2.desc: "[cabal_a.GetName] et [cabal_b.GetName] ont présenté une proposition conjointe formelle à la couronne — une réforme coordonnée s'appuyant sur leurs domaines d'expertise respectifs. Le document est approfondi, politiquement astucieux, et est presque certainement le produit de plusieurs mois de préparation privée. Il n'attend plus que l'approbation royale."

 cc_cabal.2.a: "Approuver la proposition commune."
 cc_cabal.2.a.tooltip: "Le pacte est ratifié. Les deux ministres reçoivent une reconnaissance formelle de leur autorité combinée. L'efficacité du cabinet s'améliore, la stabilité augmente légèrement, et la cabale devient une caractéristique institutionnelle de la cour."

 cc_cabal.2.b: "Refuser — la couronne ne doit pas céder cette initiative."
 cc_cabal.2.b.tooltip: "Un rejet froid. La proposition est mise au placard. Les deux ministres ont clairement compris le message — et aucun des deux n'en est entièrement satisfait."

 # --- cc_cabal.3 — The Informal Cabal Stirs ---
 cc_cabal.3.title: "La cabale informelle s'agite"
 cc_cabal.3.desc: "Le partenariat entre [cabal_a.GetName] et [cabal_b.GetName] n'a jamais été formalisé. Aucun pacte n'a été signé, aucun poids officiel n'a été donné à leurs actions communes. Mais la cour l'a remarqué. Dans le climat actuel de tension, leur coordination discrète commence à ressembler à quelque chose de plus délibéré — et tous deux ont demandé une audience privée pour discuter de la question directement.\n\nIls veulent quelque chose. Qu'il s'agisse de formaliser leur arrangement, de canaliser leurs énergies ou simplement d'être vus en train d'accomplir quelque chose d'important — la question est de savoir si nous leur donnons une structure dans laquelle travailler, ou si nous démantelons le partenariat avant qu'il ne devienne une faction."

 cc_cabal.3.a: "Formaliser le partenariat. Leur accorder un pacte de travail."
 cc_cabal.3.a.tooltip: "Un Pacte de Cabinet plus court que la formalisation complète — cinq ans plutôt que dix. Les deux ministres deviennent plus compétents. Le partenariat a désormais une structure officielle."

 cc_cabal.3.b: "Exploiter leur coordination — laissez [cabal_a.GetName] mener une initiative commune."
 cc_cabal.3.b.tooltip: "[cabal_a.GetName] mène l'initiative et s'enrichit de cette expérience. Aucun pacte n'est conclu, mais le partenariat trouve un exutoire productif."

 cc_cabal.3.c: "S'attaquer directement à l'arrangement. Dissoudre le lien informel."
 cc_cabal.3.c.tooltip: "Les deux ministres reçoivent le message. Leur partenariat prend fin — et leur ressentiment commence."

