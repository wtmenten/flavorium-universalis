l_french:
 # ============================================================
 # FAMILY A — CAPITAL DEVELOPMENT-GATED TRAITS
 # ============================================================

 # Tier 1: Prosperity & Urbanization
 urban_planner: "Urbaniste"
 desc_urban_planner: "Ce conseiller a un œil exercé pour l'aménagement efficace des villes et du commerce. Sous sa direction, les nouvelles constructions progressent rapidement et à moindre coût, et le tissu urbain du royaume se densifie d'année en année."

 prosperity_herald: "Héraut de la prospérité"
 desc_prosperity_herald: "Ce conseiller apporte les bonnes nouvelles d'un royaume florissant. Là où la richesse s'accumule, le talent suit — et ce ministre a transformé la prospérité de notre capitale en un aimant pour les conseillers ambitieux venus de tout le pays."
 prosperity_herald_die_desc: "[CHARACTER.GetName] est parti(e). Les portes ouvertes qu'[CHARACTER.GetSheHe] a maintenues entre notre cour et les esprits les plus brillants du royaume seront plus difficiles à garder sans [CHARACTER.GetHerHim]."

 merchant_syndic: "Syndic marchand"
 desc_merchant_syndic: "Vétéran des comptoirs et des guildes marchandes, ce conseiller sait comment traduire la richesse urbaine en capital politique. La classe marchande s'élève avec la ville, et ce ministre s'assure que cette ascension profite à la couronne."
 merchant_syndic_die_desc: "[CHARACTER.GetName] est parti(e). Les ponts qu'[CHARACTER.GetSheHe] a jetés entre la comptabilité et le trône prendront du temps à être reconstruits."

 # Tier 2: Cultural & Intellectual Flourishing
 grand_architect: "Grand Architecte"
 desc_grand_architect: "Là où d'autres conseillers voient des statistiques, ce ministre voit des horizons urbains. Une grande capitale attire les savants, les artistes et les réformateurs — et personne ne comprend mieux les conditions matérielles d'un tel épanouissement que ce remarquable conseiller."
 grand_architect_die_desc: "[CHARACTER.GetName] est décédé(e). Les monuments qu'[CHARACTER.GetSheHe] a fait ériger survivront à toute pierre — ce sont les villes qu'[CHARACTER.GetSheHe] a aidé à bâtir."

 arts_patron: "Mécène des arts"
 desc_arts_patron: "Généreux mécène de peintres, de poètes et de musiciens, ce conseiller comprend que le patronage culturel est également un pouvoir politique. L'excellence artistique embellit la réputation de la couronne et ouvre les esprits à de nouvelles idées."
 arts_patron_die_desc: "[CHARACTER.GetName] est décédé(e). Chaque artiste que [CHARACTER.GetSheHe] a soutenu se souviendra de la main qui l'a nourri — et ainsi, à travers leurs œuvres, la postérité s'en souviendra également."

 learned_courtier: "Courtisan érudit"
 desc_learned_courtier: "Formé à la philosophie naturelle, au droit et aux lettres, ce conseiller a transformé la cour en un centre d'apprentissage. Les savants se rassemblent autour de lui, des institutions s'enracinent et l'alphabétisation se répand à partir de la capitale."
 learned_courtier_die_desc: "[CHARACTER.GetName] n'est plus. Les séminaires que [CHARACTER.GetSheHe] animait ont pris fin, mais les esprits que [CHARACTER.GetSheHe] a façonnés perpétueront ce savoir."

 reform_minded_counselor: "Conseiller partisan des réformes"
 desc_reform_minded_counselor: "La prospérité a tendance à desserrer l'emprise des vieilles structures, et ce conseiller le sait bien. Champion d'une réforme mesurée, il a rendu la cour plus réceptive aux changements institutionnels sans provoquer de révolution."
 reform_minded_counselor_die_desc: "[CHARACTER.GetName] est décédé(e). Les réformes qu'[CHARACTER.GetSheHe] a discrètement mûries étaient l'œuvre d'une vie — et comme toutes ces œuvres, leur sort repose désormais entre d'autres mains."

 # Tier 3: Transformative / Enlightenment Ideas
 master_urbanist: "Maître urbaniste"
 desc_master_urbanist: "Ce conseiller voit la ville comme un laboratoire de l'épanouissement humain. De l'urbanisme à la politique culturelle en passant par le financement scientifique, il a transformé notre capitale en un moteur de progrès que les cours rivales ne peuvent qu'envier."
 master_urbanist_die_desc: "[CHARACTER.GetName] est décédé(e). La ville que [CHARACTER.GetSheHe] a aidé à façonner sera [CHARACTER.GetHerHis] plus grand monument — et elle survivra à tous les rois."

 enlightenment_herald: "Héraut des Lumières"
 desc_enlightenment_herald: "Ce conseiller est arrivé porteur de nouvelles idées : que la raison, plutôt que la révélation, est le guide approprié pour la gouvernance ; que le savoir doit être testé, et non simplement reçu ; que les institutions peuvent être améliorées. Il a rendu ces idées contagieuses."
 enlightenment_herald_die_desc: "[CHARACTER.GetName] a quitté ce monde, mais les idées qu'[CHARACTER.GetSheHe] a propagées ne sont pas si faciles à enterrer. Elles vivent dans les pamphlets, dans les conférences et dans l'esprit de ceux qu'[CHARACTER.GetSheHe] a enseignés."

 progressive_rationalist: "Rationaliste progressiste"
 desc_progressive_rationalist: "Champion de la raison, de l'alphabétisation et de la méthode scientifique, ce conseiller a systématiquement remis en question la superstition partout où il l'a trouvée. Sous son influence, la cour est devenue plus réceptive aux preuves qu'à l'autorité."
 progressive_rationalist_die_desc: "[CHARACTER.GetName] est mort(e). Les ennemis de la raison s'en réjouiront, mais ils découvriront que le monde est obstinément différent de ce qu'il était avant [CHARACTER.GetHerHim]."

 revolutionary_herald: "Héraut révolutionnaire"
 desc_revolutionary_herald: "Ce conseiller est arrivé avec des idées qui rendent l'ancien ordre nerveux : que le peuple a des droits ; qu'un gouvernement légitime requiert le consentement ; que l'organisation actuelle du pouvoir n'est pas éternelle. Il conseille la réforme — et si la réforme est refusée, l'histoire conseillera autre chose."
 revolutionary_herald_die_desc: "[CHARACTER.GetName] est décédé(e). Les idées que [CHARACTER.GetSheHe] portait étaient déjà trop vastes pour être conservées par [CHARACTER.GetHerHis] seule — elles appartiennent désormais à l'époque."

 # ============================================================
 # FAMILY B — SOCIETAL VALUE-GATED TRAITS
 # ============================================================

 # Axis 1: traditionalist_vs_innovative
 innovative_counselor: "Conseiller innovateur"
 desc_innovative_counselor: "Le changement n'est pas une menace pour ce conseiller — c'est le moteur du progrès. Il a fait de notre cour un lieu où les nouvelles idées sont testées plutôt que supprimées, et les institutions en sortent renforcées."
 innovative_counselor_die_desc: "[CHARACTER.GetName] est décédé(e). L'esprit d'enquête insatiable qu'[CHARACTER.GetSheHe] a cultivé ne trouvera pas facilement un autre champion."

 traditionalist_guardian: "Gardien traditionaliste"
 desc_traditionalist_guardian: "Les anciennes méthodes nous ont bien servis, et ce conseiller a l'intention de les maintenir. Défenseur infatigable des coutumes et de la hiérarchie, il a renforcé les liens entre la couronne et ses piliers de soutien traditionnels."
 traditionalist_guardian_die_desc: "[CHARACTER.GetName] est décédé(e). Les traditions qu'[CHARACTER.GetSheHe] a défendues persisteront — mais l'œil vigilant qui veillait sur elles a disparu."

 # Axis 2: absolutism_vs_liberalism
 royal_absolutist: "Absolutiste royal"
 desc_royal_absolutist: "Le pouvoir doit être concentré pour être utile — ce conseiller n'en a jamais douté. Sous ses conseils, la machine de l'autorité royale est devenue plus efficace et les coûts d'absorption de nouveaux territoires ont diminué."
 royal_absolutist_die_desc: "[CHARACTER.GetName] est mort(e). L'architecture du pouvoir centralisé qu'[CHARACTER.GetSheHe] a bâtie restera, mais ceux qui s'en lassent y verront une opportunité."

 liberal_reformer: "Réformateur libéral"
 desc_liberal_reformer: "Ce conseiller estime qu'un royaume gouverné avec le consentement de son peuple est plus fort qu'un royaume gouverné par la peur. Il a ouvert davantage de canaux de communication entre la couronne et ses sujets, et le résultat est un pays moins susceptible de se fracturer."
 liberal_reformer_die_desc: "[CHARACTER.GetName] est décédé(e). Les accords que [CHARACTER.GetSheHe] a négociés entre la couronne et les communes seront mis à l'épreuve maintenant que le médiateur est parti."

 # Axis 3: centralization_vs_decentralization
 efficiency_administrator: "Administrateur de l'efficacité"
 desc_efficiency_administrator: "Le gaspillage est l'ennemi de ce conseiller. Il a audité chaque processus bureaucratique, supprimé chaque redondance et rationalisé la machine gouvernementale jusqu'à ce qu'elle fonctionne avec une économie remarquable."
 efficiency_administrator_die_desc: "[CHARACTER.GetName] est décédé(e). La machine bien huilée qu'[CHARACTER.GetSheHe] a construite fonctionnera encore un certain temps seule — mais les machines ont besoin de maintenance."

 regional_magnate: "Magnat régional"
 desc_regional_magnate: "Des régions fortes font un royaume fort — du moins, c'est ce que soutient ce conseiller. Ils ont su cultiver les grands seigneurs des provinces et s'assurer que le pouvoir local collabore avec le centre plutôt que de s'y opposer."
 regional_magnate_die_desc: "[CHARACTER.GetName] n'est plus là. Le réseau de loyautés régionales que [CHARACTER.GetSheHe] entretenait nécessitera désormais des soins attentifs, maintenant que [CHARACTER.GetHerHis] main ne tient plus la barre."

 # Axis 4: spiritualist_vs_humanist
 mystical_patriarch: "Patriarche mystique"
 desc_mystical_patriarch: "La foi est le fondement de la vision du monde de ce conseiller, et il a apporté cette conviction dans tous les domaines de la gouvernance. Le clergé est plus influent, les fidèles plus fermes et le royaume plus résistant aux idées hétérodoxes."
 mystical_patriarch_die_desc: "[CHARACTER.GetName] a quitté ce monde. La piété que [CHARACTER.GetSheHe] incarnait était une forme de gouvernance — et sa perte se fera sentir dans des sphères qu'aucun bilan comptable ne peut mesurer."

 humanist_philosopher: "Philosophe humaniste"
 desc_humanist_philosopher: "Ce conseiller estime que c'est la raison humaine, et non le décret divin, qui doit guider le royaume. La tolérance s'est accrue sous son influence, tout comme l'alphabétisation et la volonté de remettre en question les savoirs établis."
 humanist_philosopher_die_desc: "[CHARACTER.GetName] est décédé(e). Les arguments que [CHARACTER.GetSheHe] a gagnés — pour la tolérance, pour la recherche, pour la dignité de l'esprit humain — seront à nouveau débattus. Espérons que le verdict tienne."

 # Axis 5: aristocracy_vs_plutocracy
 noble_champion: "Champion noble"
 desc_noble_champion: "Lignée et service — tels sont les deux piliers du credo de ce conseiller. Défenseur infatigable de la noblesse, il a veillé à ce que les grandes maisons demeurent l'épine dorsale de notre ordre militaire et politique."
 noble_champion_die_desc: "[CHARACTER.GetName] est décédé(e). Les maisons nobles qu'[CHARACTER.GetSheHe] a soutenues porteront le deuil bruyamment — et dans leur douleur, elles se rappelleront ce qu'elles doivent à la couronne."

 merchant_prince: "Prince marchand"
 desc_merchant_prince: "Ce conseiller n'a jamais confondu la vieille fortune et la bonne fortune. Champion des classes commerçantes, il a ouvert de nouveaux canaux commerciaux, cultivé les états marchands et transformé la richesse en influence."
 merchant_prince_die_desc: "[CHARACTER.GetName] est parti(e). Les réseaux commerciaux qu'[CHARACTER.GetSheHe] a tissés persisteront — les routes commerciales ne pleurent pas leurs architectes."

 # Axis 6: serfdom_vs_free_subjects
 serf_overseer: "Surveillant des serfs"
 desc_serf_overseer: "L'ordre dépend de la hiérarchie, et la hiérarchie dépend du fait que chacun connaisse sa place. Ce conseiller a veillé à ce que le système de travail rural fonctionne avec une efficacité maximale — la noblesse est satisfaite, même si la paysannerie ne l'est pas."
 serf_overseer_die_desc: "[CHARACTER.GetName] est décédé(e). Le système qu'[CHARACTER.GetSheHe] maintenait n'était pas populaire, mais il était productif. Ce qui arrivera ensuite dépendra de qui occupera [CHARACTER.GetHerHis] place."

 emancipation_minister: "Ministre de l'émancipation"
 desc_emancipation_minister: "Une marée montante soulève tous les bateaux — ce conseiller a dédié sa carrière à desserrer les liens qui attachent la paysannerie à la terre. L'alphabétisation grimpe, la mobilité augmente et le potentiel humain du royaume commence à s'épanouir."
 emancipation_minister_die_desc: "[CHARACTER.GetName] nous a quittés. Les libertés que [CHARACTER.GetSheHe] défendait sont rarement abandonnées sans combat — c'est là, du moins, l'héritage de [CHARACTER.GetHerHis]."

 # Axis 7: mysticism_vs_jurisprudence
 mystical_counselor: "Conseiller mystique"
 desc_mystical_counselor: "Le sacré et le politique ne sont pas séparés pour ce conseiller. Il a tissé la légitimité religieuse dans la trame de la gouvernance, donnant aux actions du royaume une autorité spirituelle que les puissances étrangères traitent avec prudence."
 mystical_counselor_die_desc: "[CHARACTER.GetName] n'est plus. Le poids spirituel que [CHARACTER.GetSheHe] apportait à nos décisions sera difficile à remplacer par de simples arguments."

 legal_scholar: "Juriste"
 desc_legal_scholar: "La loi, correctement codifiée et appliquée avec constance, est l'outil le plus puissant de la civilisation — du moins, c'est ce qu'affirme ce conseiller. Sous son influence, la gouvernance est devenue plus systématique, plus prévisible et plus difficile à détourner."
 legal_scholar_die_desc: "[CHARACTER.GetName] est décédé(e). L'édifice juridique que [CHARACTER.GetSheHe] a construit pourrait survivre à tous les ministres qui suivront — c'était l'intention."

 # Axis 8: mercantilism_vs_free_trade
 mercantilist_official: "Fonctionnaire mercantiliste"
 desc_mercantilist_official: "Le commerce est un pouvoir, et le pouvoir doit être dirigé par l'État — ce conseiller n'en a jamais douté. Sous sa surveillance, la portée commerciale de la couronne s'est étendue et les intérêts concurrents ont été fermement placés sous la supervision royale."

 free_market_advocate: "Défenseur du Marché Libre"
 desc_free_market_advocate: "Supprimer les barrières et regarder le commerce s'épanouir — cet conseiller a avancé cet argument devant chaque sceptique de la cour, et les résultats sont indiscutables. Les guildes de marchands l'adorent."
 free_market_advocate_die_desc: "[CHARACTER.GetName] est décédé(e). Les marchands qu'[CHARACTER.GetSheHe] a libérés n'érigeront pas de statues, mais ils se souviendront de ce nom en calculant leurs profits."

 # Axis 9: capital_economy_vs_traditional_economy
 capitalist_minister: "Ministre capitaliste"
 desc_capitalist_minister: "Investissement, accumulation et réinvestissement — ce conseiller comprend la logique du capital comme peu d'autres. Sous sa direction, l'économie du royaume a commencé à se développer selon une logique interne nouvelle et productive."
 capitalist_minister_die_desc: "[CHARACTER.GetName] est parti(e). La machine économique qu'[CHARACTER.GetSheHe] a mise en mouvement ne s'arrêtera pas — le capital a désormais sa propre dynamique."

 estate_guardian: "Gardien des États"
 desc_estate_guardian: "Les anciennes manières d'organiser la richesse et le travail se sont révélées durables pour de bonnes raisons, et ce conseiller ne voit aucune sagesse à les abandonner pour des théories non éprouvées. Les grands domaines prospèrent, les ordres traditionnels sont satisfaits et le royaume est stable."
 estate_guardian_die_desc: "[CHARACTER.GetName] est décédé(e). L'ordre traditionnel qu'[CHARACTER.GetSheHe] a préservé fera bientôt face à ses contestataires — et il y fera face sans [CHARACTER.GetHerHis] soutien."

 # Axis 10: individualism_vs_communalism
 free_spirit_counselor: "Conseiller à l'Esprit Libre"
 desc_free_spirit_counselor: "Chaque grande réussite commence par une seule personne qui a pensé différemment — ce conseiller a bâti sa politique autour de cette conviction. Le talent individuel est cultivé, le mécénat artistique fleurit et la bureaucratie s'assouplit légèrement pour s'adapter au génie."
 free_spirit_counselor_die_desc: "[CHARACTER.GetName] est décédé(e). Les esprits singuliers qu'[CHARACTER.GetSheHe] a encouragés vont se disperser, et certains ne trouveront pas d'autre protecteur."

 community_steward: "Intendant communautaire"
 desc_community_steward: "Un royaume n'est pas constitué de ses dirigeants mais de son peuple — ce conseiller a gouverné selon ce principe. Les liens communautaires sont plus forts, les populations locales plus mobiles et plus prospères, et le peuple est davantage investi dans la réussite du royaume."
 community_steward_die_desc: "[CHARACTER.GetName] est parti(e). Les communautés qu'[CHARACTER.GetSheHe] a entretenues n'étaient pas le genre d'accomplissement qui mérite un portrait au palais — mais elles pourraient s'avérer plus durables."

 # Axis 11: quality_vs_quantity
 elite_trainer: "Entraîneur d'élite"
 desc_elite_trainer: "Moins de soldats, mais de meilleurs soldats — ce conseiller a misé sa réputation sur ce principe. L'armée qui émerge de ses réformes est plus petite, plus coûteuse et d'une efficacité dévastatrice."
 elite_trainer_die_desc: "[CHARACTER.GetName] est décédé(e). Les officiers qu'[CHARACTER.GetSheHe] a formés perpétueront [CHARACTER.GetHerHis] méthodes — la discipline, après tout, s'auto-propage."

 mass_levy_commander: "Commandant de la levée en masse"
 desc_mass_levy_commander: "Le nombre fait gagner les batailles, et le nombre est une chose que nous possédons. Ce conseiller a transformé la main-d'œuvre du royaume en un atout stratégique, maintenant les coûts de recrutement bas et les rangs perpétuellement pleins."
 mass_levy_commander_die_desc: "[CHARACTER.GetName] est décédé(e). Les hommes qu'[CHARACTER.GetSheHe] a formés et exercés se souviendront de la voix qui les a appelés sous les drapeaux, même si l'histoire ne retient pas son nom."

 # Axis 12: offensive_vs_defensive
 offensive_strategist: "Stratège offensif"
 desc_offensive_strategist: "L'attaque est la meilleure défense — et ce conseiller a organisé notre planification militaire en conséquence. Chaque ressource est orientée vers la projection de la force vers l'extérieur, maintenant l'ennemi trop occupé par ses propres problèmes pour menacer les nôtres."
 offensive_strategist_die_desc: "[CHARACTER.GetName] est décédé(e). La doctrine que [CHARACTER.GetSheHe] a écrite survivra à [CHARACTER.GetHerHim] dans les manuels — bien que les manuels ne puissent pas s'adapter aux circonstances changeantes comme [CHARACTER.GetSheHe] savait le faire."

 defensive_commander: "Commandant défensif"
 desc_defensive_commander: "Les forts tiennent un terrain que les armées ne peuvent tenir. Ce conseiller a investi massivement dans l'infrastructure défensive du royaume, garantissant que tout agresseur fasse face à une campagne d'usure épuisante plutôt qu'à une guerre de mouvement rapide."
 defensive_commander_die_desc: "[CHARACTER.GetName] est décédé(e). Les murs qu'[CHARACTER.GetSheHe] a bâtis survivront à [CHARACTER.GetHerHim] pendant des siècles — et c'était précisément le plan."

 # Axis 13: belligerent_vs_conciliatory
 hawk_minister: "Ministre belliqueux"
 desc_hawk_minister: "Ce conseiller pense que la force impose le respect et que la faiblesse invite à l'agression. Sous ses conseils, nous avons exploité nos avantages avec plus de vigueur et exigé davantage de nos ennemis vaincus — même si cela a rendu certains voisins méfiants."
 hawk_minister_die_desc: "[CHARACTER.GetName] est décédé(e). Les ennemis que [CHARACTER.GetSheHe] s'est faits ne seront pas en deuil. Mais il en va de même pour les commandants dont [CHARACTER.GetSheHe] a nourri les ambitions."

 peacemaker_counselor: "Conseiller Pacificateur"
 desc_peacemaker_counselor: "Toute guerre coûte plus cher que ses partisans ne l'admettent, et ce conseiller a passé sa carrière à le démontrer. Sous son influence, l'antagonisme a diminué, les canaux diplomatiques sont restés ouverts et nos voisins sont devenus moins enclins à s'unir contre nous."

 # Axis 14: outward_vs_inward
 expansionist_advisor: "Conseiller expansionniste"
 desc_expansionist_advisor: "La carte comporte des espaces vides qui ne demandent qu'à être comblés — du moins, c'est ce que croit ce conseiller. Sous sa direction, nos ambitions coloniales et exploratoires sont devenues plus précises et mieux dotées."
 expansionist_advisor_die_desc: "[CHARACTER.GetName] est décédé(e). Les horizons vers lesquels [CHARACTER.GetSheHe] nous a guidés sont toujours là. Que nous les atteignions ou non ne dépend désormais que de nous."

 consolidation_minister: "Ministre de la consolidation"
 desc_consolidation_minister: "Le royaume que nous possédons mérite d'être perfectionné avant que nous n'en cherchions davantage. Ce conseiller a concentré nos énergies vers l'intérieur — en développant ce que nous détenons, en intégrant ce que nous avons conquis et en réformant ce qui doit l'être."
 consolidation_minister_die_desc: "[CHARACTER.GetName] est parti(e). Le travail intérieur qu'[CHARACTER.GetSheHe] a soutenu sera toujours moins prestigieux que la conquête — et toujours plus nécessaire."

 # Axis 15: land_vs_naval
 continental_marshal: "Maréchal continental"
 desc_continental_marshal: "La terre est l'endroit où les guerres se gagnent et les empires se bâtissent — ce conseiller ne l'a jamais douté. L'armée est l'instrument de notre pouvoir, et ils l'ont affûtée en conséquence."
 continental_marshal_die_desc: "[CHARACTER.GetName] est décédé(e). Les régiments qu'[CHARACTER.GetSheHe] a exercés et les forts qu'[CHARACTER.GetSheHe] a commandés porteront [CHARACTER.GetHerHis] nom dans les ordres de bataille bien après [CHARACTER.GetHerHis] mort."

 admiral_counselor: "Conseiller amiral"
 desc_admiral_counselor: "La mer est la grande autoroute du monde, et quiconque la commande commande tout ce qui y circule. Ce conseiller a orienté notre pensée stratégique vers la mer — et les résultats se sont fait sentir tant dans nos revenus commerciaux que dans notre registre naval."
 admiral_counselor_die_desc: "[CHARACTER.GetName] est décédé(e). La mer ne pleure pas — mais les marins qu'[CHARACTER.GetSheHe] a formés raconteront des histoires sur [CHARACTER.GetHerHim] dans chaque port."

 # Axis 16: latinization_vs_hellenization
 roman_administrator: "Administrateur romain"
 desc_roman_administrator: "L'ordre, la loi et le latin : tels sont les outils de l'empire. Ce conseiller a mis la tradition administrative romaine au service de notre gouvernance, rendant l'annexion moins coûteuse et la réforme plus systématique."
 roman_administrator_die_desc: "[CHARACTER.GetName] est décédé(e). L'héritage administratif que [CHARACTER.GetSheHe] a bâti suit la tradition romaine : il survivra à son bâtisseur."

 hellenistic_scholar: "Érudit hellénistique"
 desc_hellenistic_scholar: "La tradition grecque perdure — dans la philosophie, dans la science, dans la culture de l'esprit d'analyse. Ce conseiller a fait de notre cour un centre de cette tradition, et l'alphabétisation ainsi que l'influence culturelle en ont progressé en conséquence."
 hellenistic_scholar_die_desc: "[CHARACTER.GetName] est décédé(e). À [CHARACTER.GetHerHis] manière, [CHARACTER.GetSheHe] a ajouté un nouveau chapitre à un livre très long."

 # Axis 17: sinicized_vs_unsinicized
 confucian_mandarin: "Mandarin confucéen"
 desc_confucian_mandarin: "Les rois-sages ont bâti la civilisation sur le fondement de relations appropriées et d'une gouvernance méritocratique. Ce conseiller a apporté ces principes à notre cour, améliorant l'administration et accélérant l'assimilation des nouveaux peuples au sein du royaume."
 confucian_mandarin_die_desc: "[CHARACTER.GetName] est décédé(e). L'idéal confucéen que [CHARACTER.GetSheHe] incarnait — la gouvernance comme vocation morale — sera plus difficile à trouver dans la cour qui suivra."

 steppe_warlord_advisor: "Conseiller seigneur de guerre des steppes"
 desc_steppe_warlord_advisor: "La steppe ne produit pas d'administrateurs — elle produit des commandants. Ce conseiller apporte à notre armée la doctrine de cavalerie impitoyable du monde nomade, et nos ennemis ont appris à la craindre."
 steppe_warlord_advisor_die_desc: "[CHARACTER.GetName] est décédé(e). Les commandants que [CHARACTER.GetSheHe] a formés perpétueront [CHARACTER.GetHerHis] férocité. La steppe n'oublie pas ses leçons."

 # ============================================================
 # FAMILY C — REGIONAL / RELIGIOUS TRAITS
 # ============================================================

 # Religion-group diplomats
 christian_diplomat: "Diplomate chrétien"
 desc_christian_diplomat: "Au sein de la communauté des nations chrétiennes, ce conseiller se déplace avec une aisance inhabituelle. La foi partagée est une monnaie diplomatique, et il l'a dépensée judicieusement — réduisant l'antagonisme, ouvrant des portes et apportant de la légitimité à nos relations étrangères."
 christian_diplomat_die_desc: "[CHARACTER.GetName] est décédé(e). Le réseau de connexions chrétiennes qu'[CHARACTER.GetSheHe] entretenait s'effilochera sans [CHARACTER.GetHerHis] attention constante."

 caliphate_diplomat: "Diplomate du califat"
 desc_caliphate_diplomat: "Imprégné des traditions de gouvernance islamique et des relations interétatiques, ce conseiller a conféré à notre position diplomatique dans le monde musulman un prestige que la seule puissance militaire ne peut acheter. Les connexions qu'il entretient s'étendent aussi bien aux cours qu'aux routes commerciales."
 caliphate_diplomat_die_desc: "[CHARACTER.GetName] est décédé(e). La réputation qu'[CHARACTER.GetSheHe] a bâtie subsistera, mais les réputations demandent un entretien."

 brahmin_counselor: "Conseiller Brahmin"
 desc_brahmin_counselor: "Savoir, rituel et gestion de l'autorité sacrée — ce conseiller maîtrise ces trois aspects. Sous sa direction, l'état ecclésiastique est devenu un instrument de gouvernance plus efficace, et les besoins spirituels de la population ont été plus étroitement intégrés à la structure administrative de la couronne."
 brahmin_counselor_die_desc: "[CHARACTER.GetName] est décédé(e). L'autorité spirituelle qu'[CHARACTER.GetSheHe] a cultivée en notre nom prendra des années à être reconstruite."

 dharma_minister: "Ministre du Dharma"
 desc_dharma_minister: "Ce conseiller a fondé ses conseils sur le concept de la conduite juste — tant dans la gouvernance que dans la vie personnelle. Le résultat est une cour qui aborde ses décisions avec un soin inhabituel, et une réputation d'équité qui a rendu le royaume plus facile à gouverner."
 dharma_minister_die_desc: "[CHARACTER.GetName] est parti(e). L'exemple qu'[CHARACTER.GetSheHe] a donné valait plus que n'importe quelle politique qu'[CHARACTER.GetSheHe] a mise en œuvre. C'est le type d'héritage le plus difficile à préserver."

 # Sub-continent specialists
 renaissance_patron: "Mécène de la Renaissance"
 desc_renaissance_patron: "Les arts sont florissants, et ce conseiller en est largement responsable. Mécène généreux et discernant pour les peintres, sculpteurs et écrivains, il a fait de notre cour une destination pour les esprits créatifs les plus brillants de l'époque."

 griot_diplomat: "Diplomate griot"
 desc_griot_diplomat: "La mémoire, l'histoire et la parole sont les fondements de la tradition diplomatique dans cette partie du monde — et ce conseiller maîtrise ces trois aspects. Il circule entre les cours avec l'aisance de celui qui porte le passé dans sa voix."
 griot_diplomat_die_desc: "[CHARACTER.GetName] est décédé(e). Quand un griot meurt, c'est une bibliothèque qui brûle. L'histoire orale que [CHARACTER.GetSheHe] portait sera racontée différemment par ceux qui viendront après."

 steppe_strategos: "Stratège des steppes"
 desc_steppe_strategos: "Ce conseiller est né pour la selle et pour la logique rapide et brutale de la guerre des steppes. Sous ses conseils, notre cavalerie a atteint un nouveau niveau d'efficacité — et nos ennemis ont appris à respecter la vue de nos éclaireurs à l'horizon."
 steppe_strategos_die_desc: "[CHARACTER.GetName] est décédé(e). La doctrine de cavalerie que [CHARACTER.GetSheHe] a rapportée des steppes survivra à [CHARACTER.GetHerHim] dans les manuels d'instruction — mais ceux qui ont chevauché avec [CHARACTER.GetHerHim] disent que les manuels oublient l'essentiel."

 mughal_administrator: "Administrateur moghol"
 desc_mughal_administrator: "Maître de la tradition administrative sophistiquée qui a rendu les grands empires multiethniques gouvernables, ce conseiller a apporté ces méthodes à notre propre gouvernance — accélérant l'assimilation, réduisant les coûts d'intégration et rendant le fonctionnement de la cour plus fluide."
 mughal_administrator_die_desc: "[CHARACTER.GetName] est parti(e). L'héritage administratif qu'[CHARACTER.GetSheHe] a bâti s'appuie sur des siècles de sagesse accumulée. Il ne sera pas oublié."

 maritime_champion: "Champion Maritime"
 desc_maritime_champion: "Les ports et les routes maritimes sont les artères du pouvoir pour tout royaume côtier, et ce conseiller s'est assuré que les nôtres soient prospères. Les États marchands fleurissent, le port est en pleine effervescence et l'influence maritime de la couronne croît à chaque saison de navigation."
 maritime_champion_die_desc: "[CHARACTER.GetName] est décédé(e). La marée monte et descend sans se soucier des capitaines de port qui ont cartographié son comportement — mais ces capitaines manquent tout de même."

 ecumenical_patriarch_advisor: "Conseiller du Patriarche œcuménique"
 desc_ecumenical_patriarch_advisor: "Ce conseiller porte toute l'autorité de la tradition orthodoxe — sa liturgie, sa théologie et sa revendication ancienne d'être le véritable héritier de l'idéal impérial chrétien. Sous son influence, le clergé est un instrument de gouvernance plus puissant."
 ecumenical_patriarch_advisor_die_desc: "[CHARACTER.GetName] a quitté ce monde. L'Église comblera le siège — elle l'a toujours fait — mais la sagesse particulière qu'[CHARACTER.GetSheHe] apportait à la gouvernance n'est pas facilement remplacée par le cérémonial."

 new_world_pioneer: "Pionnier du Nouveau Monde"
 desc_new_world_pioneer: "Ce conseiller est arrivé avec l'instinct de l'explorateur et le pragmatisme du colonisateur. Sous sa direction, notre présence dans les nouvelles terres est devenue plus systématique et plus rentable."
 new_world_pioneer_die_desc: "[CHARACTER.GetName] est décédé(e). La frontière que [CHARACTER.GetSheHe] a aidé à ouvrir ne portera aucun monument en [CHARACTER.GetHerHim] mémoire — les pionniers reçoivent rarement des monuments. Ils laissent place à ce qui vient après."

 # ============================================================
 # FAMILY D — MILITARY COST SPECIALISTS
 # ============================================================

 # Age 2-4 Early Tier
 infantry_drillmaster: "Maître d'instruction de l'infanterie"
 desc_infantry_drillmaster: "Ce vétéran a passé sa carrière à transformer des levées brutes en soldats disciplinés. Sous sa surveillance, l'infanterie coûte moins cher à lever et performe mieux sur le terrain."
 infantry_drillmaster_die_desc: "[CHARACTER.GetName] est décédé(e). Les sergents qu'[CHARACTER.GetSheHe] a formés transmettront [CHARACTER.GetHerHis] méthodes à travers les rangs pendant une génération."

 scout_captain: "Capitaine éclaireur"
 desc_scout_captain: "Rapide, silencieux et toujours en avance sur la force principale — ce conseiller a fait de l'éclaireur de cavalerie un art. La cavalerie légère est moins coûteuse et mieux utilisée sous sa doctrine."
 scout_captain_die_desc: "[CHARACTER.GetName] est décédé(e). Les cavaliers qu'[CHARACTER.GetSheHe] a entraînés continueront de monter — mais moins d'entre eux s'engageront sur les routes les plus dangereuses sans [CHARACTER.GetHerHim] pour les guider."

 military_engineer: "Ingénieur militaire"
 desc_military_engineer: "Le siège est une science, et ce conseiller y a apporté sa rigueur. La construction d'artillerie et d'équipement d'infanterie lourde coûte moins cher sous sa supervision, et les résultats parlent d'eux-mêmes devant les murs des fortifications ennemies."
 military_engineer_die_desc: "[CHARACTER.GetName] est décédé(e). Les manuels de siège qu'[CHARACTER.GetSheHe] a écrits seront utilisés bien après que l'auteur soit oublié — c'est là l'immortalité de l'ingénieur."

 # Age 5-6 Strong Tier
 commissariat_officer: "Officier du commissariat"
 desc_commissariat_officer: "Une armée qui ne peut se nourrir ni s'équiper ne peut pas combattre. Ce conseiller a résolu le défi logistique qui brise les campagnes mineures, garantissant que notre infanterie est toujours correctement ravitaillée — et que la noblesse bénéficie des contrats."
 commissariat_officer_die_desc: "[CHARACTER.GetName] est décédé(e). Les chaînes d'approvisionnement qu'[CHARACTER.GetSheHe] a établies continueront de fonctionner — le véritable test viendra lorsqu'elles seront forcées d'improviser sans [CHARACTER.GetHerHim]."

 cavalry_marshal: "Maréchal de cavalerie"
 desc_cavalry_marshal: "Les meilleurs cavaliers du royaume se tournent vers ce conseiller pour leur doctrine, leurs normes d'équipement et leur identité professionnelle. La cavalerie sous son commandement coûte moitié moins cher et est deux fois plus redoutable."

 siege_engineer: "Ingénieur de siège"
 desc_siege_engineer: "Les murs tombent et les forts capitulent lorsque ce conseiller est sur le terrain. Maître de la doctrine d'artillerie et de la construction de sièges, il a rendu nos opérations offensives nettement plus efficaces — et a rendu nos propres fortifications beaucoup plus difficiles à percer."
 siege_engineer_die_desc: "[CHARACTER.GetName] est décédé(e). Les fortifications que [CHARACTER.GetSheHe] a conçues resteront [CHARACTER.GetHerHis] mémorial — bien que [CHARACTER.GetSheHe] préférerait probablement qu'elles soient améliorées plutôt que préservées."

 supreme_commander: "Commandant suprême"
 desc_supreme_commander: "Toutes les branches de l'armée ont été touchées par la main réformatrice de ce conseiller. Les nobles le lui reconnaissent, l'intendance également, et l'infanterie, la cavalerie et l'artillerie coûtent toutes moins cher car il a rationalisé tout l'appareil de guerre."
 supreme_commander_die_desc: "[CHARACTER.GetName] est décédé(e). L'armée que [CHARACTER.GetSheHe] a bâtie est notre héritage. Espérons que nous en soyons dignes."

 # ============================================================
 # FAMILY E — PARLIAMENTARY / DIPLOMATIC SPECIALISTS
 # ============================================================

 parliamentary_broker: "Intermédiaire parlementaire"
 desc_parliamentary_broker: "Le Parlement est un instrument complexe, et ce conseiller le manie comme un virtuose. Sous sa direction, le soutien législatif est devenu nettement plus fiable — et le seuil de soutien pour les votes les plus difficiles a baissé."
 parliamentary_broker_die_desc: "[CHARACTER.GetName] est décédé(e). Les relations parlementaires qu'[CHARACTER.GetSheHe] a cultivées survivront à [CHARACTER.GetHerHim] — mais ces relations étaient personnelles, et les relations personnelles meurent avec leurs propriétaires."

 diplomatic_attache: "Attaché diplomatique"
 desc_diplomatic_attache: "C'est dans les petits caractères des accords internationaux que les empires se bâtissent ou s'effondrent, et ce conseiller en est un maître. Les coûts d'annexion sont réduits grâce à ses négociations minutieuses, et notre portée diplomatique s'en trouve accrue."
 diplomatic_attache_die_desc: "[CHARACTER.GetName] est décédé(e). Les traités qu'[CHARACTER.GetSheHe] a rédigés resteront contraignants — les traités survivent à leurs auteurs, ce qui est précisément le but recherché."

 grand_chancellor: "Grand Chancelier"
 desc_grand_chancellor: "Ce conseiller ne se contente pas de mener la diplomatie ; il dirige la politique étrangère. Tout l'appareil de notre engagement international a été remodelé sous sa supervision : la capacité, la réputation, l'annexion et le statut parlementaire se sont tous améliorés."
 grand_chancellor_die_desc: "[CHARACTER.GetName] est décédé(e). L'édifice diplomatique que [CHARACTER.GetSheHe] a construit était le monument d'une vie entière de travail patient et calculateur. Ses fondations tiendront — espérons que ses étages supérieurs ne nécessitent pas [CHARACTER.GetHerHis] génie particulier pour être maintenus."

 # ============================================================
 # FAMILY F — ACTION-FORGED TRAITS
 # ============================================================

 seasoned_integrator: "Intégrateur chevronné"
 desc_seasoned_integrator: "Les années passées à superviser l'absorption de nouveaux territoires ont donné à ce ministre une maîtrise hors du commun de l'intégration — tant pour sa machinerie administrative que pour ses conditions diplomatiques préalables. L'intégration s'accélère et les coûts d'annexion diminuent sous sa direction."
 seasoned_integrator_die_desc: "[CHARACTER.GetName] est décédé(e). Les cadres d'intégration que [CHARACTER.GetSheHe] a établis continueront de fonctionner — les bureaucraties, comme les rivières, trouvent leur propre niveau."

 frontier_administrator: "Administrateur Frontalier"
 desc_frontier_administrator: "Ce ministre a fait de la frontière son habitat naturel — cartographiant de nouveaux territoires, résolvant les différends entre colons et populations locales, et transformant des revendications lointaines en colonies fonctionnelles. La colonisation s'accélère et les migrants viennent plus volontiers."
 frontier_administrator_die_desc: "[CHARACTER.GetName] est décédé(e). Les postes frontaliers que [CHARACTER.GetSheHe] a établis sont permanents — la connaissance de leur construction était le seul privilège de [CHARACTER.GetHerHis]."

 development_patron: "Mécène du développement"
 desc_development_patron: "Sous les soins de ce ministre, la capitale s'est développée avec une rapidité inhabituelle, et les méthodes appliquées ont été discrètement étendues à l'ensemble du royaume. Le développement croît plus rapidement et les bâtiments coûtent moins cher partout où ils portent leur attention."
 development_patron_die_desc: "[CHARACTER.GetName] est décédé(e). La croissance qu'[CHARACTER.GetSheHe] a encouragée n'était pas accidentelle — c'était le produit d'une approche systématique qui devra désormais être reconstruite à partir de ses principes fondamentaux."

 espionage_director: "Directeur de l'espionnage"
 desc_espionage_director: "L'ombre et le silence sont les outils de ce ministre. Sous sa supervision, nos réseaux de renseignement sont devenus plus étendus et plus fiables, et notre réputation diplomatique a discrètement bénéficié de ce que nous savons — et de ce que les autres craignent que nous sachions."
 espionage_director_die_desc: "[CHARACTER.GetName] est décédé(e). Les réseaux qu'[CHARACTER.GetSheHe] dirigeait nécessiteront une reconstruction minutieuse — le renseignement, contrairement à la plupart des formes de savoir, meurt avec ses gardiens."

 treasury_enforcer: "Exécuteur du Trésor"
 desc_treasury_enforcer: "Ce ministre a examiné avec une précision chirurgicale chaque ligne des dépenses de la couronne. Les frais de la cour ont diminué, le cabinet est devenu plus efficace, et personne à la cour ne s'aventure à engager des dépenses inutiles tant qu'il occupe son poste."

 retired_legend: "Légende retraitée"
 desc_retired_legend: "Ce ministre a transmis le flambeau de son œuvre majeure à des mains plus jeunes — et ce faisant, est devenu quelque chose de plus rare qu'un conseiller actif : une institution vivante. Sa présence continue à la cour apporte un poids de sagesse accumulée qui rend son remplacement impensable, même s'il se retire des tâches les plus exigeantes."

 # ============================================================
 # ACTION-FORGED TRAIT EVENTS (cc_cond.30-34)
 # ============================================================

 cc_cond.30.title: "Le spécialiste de l'intégration"
 cc_cond.30.desc: "[minister.GetName] a dirigé l'intégration de nouveaux territoires avec une compétence inhabituelle. La machinerie administrative et diplomatique impliquée est complexe — et [minister.GetSheHe] en a maîtrisé les deux aspects. Quelle reconnaissance formelle la couronne souhaite-t-elle accorder ?"
 cc_cond.30.a: "Nommez [minister.GetName] comme notre Intégrateur Expérimenté — que sa maîtrise devienne un atout durable."
 cc_cond.30.b: "Reconnaître le travail efficace de [minister.GetName] sans promotion formelle."

 cc_cond.31.title: "Le stratège colonial"
 cc_cond.31.desc: "[minister.GetName] a été à la pointe de notre expansion frontalière — non seulement en l'administrant, mais en façonnant sa direction. Les colons viennent plus volontiers et nos expéditions progressent plus vite lorsque [minister.GetSheHe] est impliqué. Quel rôle leur donnons-nous ?"
 cc_cond.31.a: "Nommez [minister.GetName] comme notre Administrateur des Frontières — formalisez ce qu'il est déjà."
 cc_cond.31.b: "Féliciter [minister.GetName] pour son travail aux frontières sans lui donner de titre formel."

 cc_cond.32.title: "Le commissaire au développement"
 cc_cond.32.desc: "[minister.GetName] a supervisé un programme de développement soutenu dans notre capitale en pleine croissance, et les résultats sont visibles dans la pierre et le bois à travers la ville. Comment allons-nous reconnaître ce qu'iel a bâti ?"
 cc_cond.32.a: "Nommez [minister.GetName] comme Patron du Développement — que ses méthodes soient appliquées à travers le royaume."
 cc_cond.32.b: "Reconnaissez le travail de [minister.GetName] sans nomination formelle."

 cc_cond.33.title: "Le manipulateur de l'ombre"
 cc_cond.33.desc: "[minister.GetName] a dirigé une opération de contre-espionnage discrète mais remarquablement efficace. Nos ennemis constatent que leurs informations sont étrangement peu fiables, et notre réputation diplomatique a bénéficié de capacités que nulle cour étrangère ne peut tout à fait expliquer. Comment procédons-nous ?"
 cc_cond.33.a: "Formaliser le rôle de [minister.GetName] en tant que Directeur de l'Espionnage — laissons le réseau d'ombres s'étendre."
 cc_cond.33.b: "Laisser [minister.GetName] poursuivre son travail sans titre formel."

 cc_cond.34.title: "L'inspecteur du Trésor"
 cc_cond.34.desc: "[minister.GetName] a terminé un examen exhaustif des dépenses de la couronne — et le rapport est une lecture inconfortable pour tout le monde, à l'exception du trésor. Les chiffres suggèrent que des économies substantielles sont possibles. Que devons-nous faire des conclusions de [minister.GetHerHis] ?"
 cc_cond.34.a: "Nommez [minister.GetName] en tant qu'exécuteur du Trésor — faites que son audit de [minister.GetHerHis] devienne une politique."
 cc_cond.34.b: "Mettez en œuvre certaines des recommandations de [minister.GetName] sans nomination formelle."

 # ============================================================
 # LEGENDARY TRAITS
 # ============================================================

 philosopher_king: "Philosophe-Roi"
 desc_philosopher_king: "Ce souverain allie une réelle puissance intellectuelle à l'autorité politique. Le résultat est une cour où les idées ont du poids et où les arts et les sciences s'épanouissent."
 philosopher_king_die_desc: "[CHARACTER.GetName] est décédé(e). L'histoire s'interrogera pour savoir si [CHARACTER.GetSheHe] était véritablement ce que son titre prétendait. Les livres que [CHARACTER.GetSheHe] a écrits et les institutions que [CHARACTER.GetSheHe] a fondées plaideront en [CHARACTER.GetHerHis] faveur."

 grand_vizier_legendary: "Grand Vizir"
 desc_grand_vizier_legendary: "Il y a des ministres, et puis il y a ceci. La réputation du Grand Vizir précède chaque contact diplomatique, son réseau s'étend sur le monde connu, et les puissances étrangères traitent ses paroles comme une politique contraignante. Il a rendu notre royaume plus redoutable que ne pourraient le faire ses seules armées."
 grand_vizier_legendary_die_desc: "[CHARACTER.GetName] est décédé(e). Le monde se réorganisera en l'absence de [CHARACTER.GetHerHis] influence — et certaines de ces réorganisations ne seront pas à notre avantage."

 tribune_of_the_people: "Tribune du Peuple"
 desc_tribune_of_the_people: "Ce conseiller est véritablement populaire auprès du peuple et utilise cette popularité pour gouverner : en facilitant le passage des lois au parlement, en supprimant les troubles et en faisant en sorte que les états se sentent écoutés."
 tribune_of_the_people_die_desc: "[CHARACTER.GetName] est décédé(e). Le peuple fera preuve d'un deuil visible et bruyant, ce qui constitue en soi un message politique pour ceux qui détiennent désormais le pouvoir."

 urban_planner_die_desc: "[CHARACTER.GetName] est décédé(e). Les plans que [CHARACTER.GetSheHe] a laissés continueront de façonner nos villes bien après que [CHARACTER.GetHerHis] main se soit immobilisée."
 mercantilist_official_die_desc: "[CHARACTER.GetName] s'en est allé(e). L'appareil commercial que [CHARACTER.GetSheHe] a construit continuera de fonctionner — bien que sans [CHARACTER.GetHerHis] main sur la commande, il puisse dériver."
 peacemaker_counselor_die_desc: "[CHARACTER.GetName] n'est plus là. Les accords tacites que [CHARACTER.GetSheHe] entretenait avec nos voisins n'ont jamais été écrits — ils ne vivaient que dans [CHARACTER.GetHerHis] relations. C'est là la tragédie du pacificateur."
 renaissance_patron_die_desc: "[CHARACTER.GetName] est décédé. Les artistes que [CHARACTER.GetSheHe] protégeait dédicaceront leurs prochaines œuvres à [CHARACTER.GetHerHis] mémoire — et ce faisant, s'assureront que [CHARACTER.GetHerHis] nom survive au siècle."
 cavalry_marshal_die_desc: "[CHARACTER.GetName] est décédé(e). Chaque officier de cavalerie de cette armée a appris quelque chose de [CHARACTER.GetHerHim], même ceux qui n'ont jamais servi directement sous le commandement de [CHARACTER.GetHerHis]."
 treasury_enforcer_die_desc: "[CHARACTER.GetName] s'en est allé(e). La discipline que [CHARACTER.GetSheHe] a imposée n'était pas populaire, mais elle était productive. Le trésor remarquera l'absence avant les ministres."
 retired_legend_die_desc: "[CHARACTER.GetName] est décédé(e). Cette personne a pris sa retraite au sommet de son pouvoir et a choisi de passer ses dernières années comme mentor plutôt que comme monument. C'est là, à sa manière, la chose la plus remarquable qu'elle ait accomplie."
