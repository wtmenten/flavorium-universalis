l_french:
 # The bureau system: the Order/Magnates axis, the thread, the steward duty, the privileges and
 # the two reforms.
 #
 # VOICE. The court speaking, not the manual. Numbers and thresholds live in the modifier
 # descriptions and the trigger tooltips, which is where a player goes looking for them; the
 # event bodies describe what is happening in the realm.

 # ---- The societal value ----
 cc_order_vs_cc_magnates: "L'ordre et les magnats"
 cc_order_focus: "Ordre"
 cc_magnates_focus: "Magnats"

 MODIFIER_TYPE_NAME_monthly_towards_cc_order: "Progrès mensuel vers l'Ordre"
 MODIFIER_TYPE_DESC_monthly_towards_cc_order: "Ceci influence l'évolution vers la [societal_value|e] de l'[ShowSocietyDirectionName('cc_order')]."
 MODIFIER_TYPE_NAME_monthly_towards_cc_magnates: "Progrès mensuel vers les Magnats"
 MODIFIER_TYPE_DESC_monthly_towards_cc_magnates: "Ceci influence l'évolution vers la [societal_value|e] des [ShowSocietyDirectionName('cc_magnates')]."

 # Shown in a bureaucracy's negative modifier tooltip, where the extra entrenchment factor is
 # applied. See zzz_cc_vanilla_bureau_overrides.txt for why the malus side is scaled twice.
 CC_BUREAU_ENTRENCHMENT_SCALE: "Enracinement"

 # ---- The cabinet duty ----
 cc_duty_bureau_steward: "Intendant d'un bureau"
 cc_duty_bureau_steward_desc: "Placez un ministre à la tête d'un bureau et laissez-le y vivre.\n\nIl apprend ce que cela coûte, ce que personne à la cour n'a jamais pris la peine de découvrir, et en un an, il le gère pour moins que ce que le trésor avait budgétisé. Il est également, d'ici là, le seul homme à comprendre son fonctionnement."
 cc_duty_bureau_steward_select: "Quel bureau ?"

 # ---- .1  A new bureau ----
 cc_bureau.1.title: "L'Établissement"
 cc_bureau.1.desc: "Le mandat est signé et les locaux sont trouvés. Il ne reste plus que la partie que personne n'écrit : qui y siège.\n\nIl ne manque pas de candidats. Ce qui manque, ce sont des candidats capables d'effectuer le travail et n'ayant aucune raison d'être reconnaissants envers quiconque, et la cour n'a jamais produit plus d'une poignée de ces personnes à la fois dans son histoire."
 cc_bureau.1.desc_venal: "Le mandat est signé, et trois familles distinctes ont déjà écrit pour s'enquérir des nominations. Deux d'entre elles ont joint des chiffres.\n\nCe n'est pas de la corruption telle que quiconque ici comprendrait le mot. C'est simplement ainsi que les postes sont pourvus depuis une génération maintenant, et les hommes qui écrivent seraient sincèrement perplexes de voir cela qualifié autrement."
 cc_bureau.1.a: "Des clercs salariés. Ils devront leur poste au poste lui-même."
 cc_bureau.1.b: "Les fils cadets des grandes maisons."
 cc_bureau.1.c: "Vendez les nominations. Le trésor a besoin d'argent."

 # ---- .10  A bureau is dissolved ----
 cc_bureau.10.title: "Le Bureau Liquidé"
 cc_bureau.10.desc: "Le bureau est fermé et la question est de savoir ce qu'il advient de quarante hommes qui y ont passé leur vie professionnelle.\n\nCe ne sont pas des hommes importants. Plusieurs d'entre eux sont les seules personnes vivantes à savoir comment une tâche particulière est accomplie, et aucun d'eux n'a été interrogé sur la nature de cette tâche."
 cc_bureau.10.desc_sold: "Le bureau est fermé, et les hommes qui y travaillaient avaient payé pour leur place.\n\nPersonne à la cour n'a été capable de donner une réponse claire quant à savoir si cet argent doit être remboursé. Les clercs ont leur propre avis, ils l'ont soigneusement consigné par écrit, et l'un d'eux est allé consulter un avocat."
 cc_bureau.10.a: "Trouvez-leur des places ailleurs."
 cc_bureau.10.b: "Remerciez-les et laissez-les partir."
 cc_bureau.10.c: "Faites un exemple du pire d'entre eux."

 # ---- .20  The offices find their own income ----
 cc_bureau.20.title: "Les Arriérés"
 cc_bureau.20.desc: "Les bureaux n'ont pas été payés intégralement depuis un certain temps. Ils n'ont pas cessé de travailler, ce que le trésor a discrètement interprété comme la preuve que le salaire n'avait jamais été l'essentiel.\n\nC'est pourtant l'essentiel. Ce qui s'est produit à la place est l'apparition d'une taxe : petite, informelle, et prélevée au moment où le pétitionnaire a le plus besoin que la chose soit faite. Personne ne l'a fixée et tout le monde en connaît le tarif."
 cc_bureau.20.a: "Payez les arriérés. Tous."
 cc_bureau.20.b: "Ils ont trouvé leurs propres revenus. Laissez faire."
 cc_bureau.20.c: "Moins de postes, mais mieux rémunérés."

 # ---- .21  The fees are the custom ----
 cc_bureau.21.title: "L'Usage du Bureau"
 cc_bureau.21.desc: "Douze ans, et la taxe n'est plus informelle. Elle a un tarif, le tarif est écrit sur un tableau, et un clerc vous l'expliquera poliment avant même que vous n'ayez fini de poser votre question.\n\nLes hommes qui la perçoivent ont bâti leur vie dessus. Ils ont acheté des maisons grâce à elle et marié leurs filles grâce à elle, et ils vous diront sans gêne qu'ils sont payés ainsi parce que la couronne a choisi de ne pas les payer autrement. Ils ont raison."
 cc_bureau.21.a: "Abolissez-le. Quel qu'en soit le coût."
 cc_bureau.21.b: "Taxez-le. La couronne peut bien prendre sa part."
 cc_bureau.21.c: "Ne dites rien et laissez les choses en l'état."

 # ---- .30  The clerks against the great houses ----
 cc_bureau.30.title: "Une question de préséance"
 cc_bureau.30.desc: "Un sous-secrétaire a opposé un refus à un duc.\n\nLe refus était justifié. Les documents n'étaient pas en règle, l'homme l'a dit, et il l'a dit devant tout le monde. Ce que le duc veut désormais, ce ne sont plus les documents ; ce que le duc veut, c'est établir qu'un homme de cette condition ne dicte rien à un homme de la sienne.\n\nLa moitié de la cour s'en amuse énormément et l'autre moitié a compris ce qui est réellement en jeu."
 cc_bureau.30.a: "La nomination est maintenue. Tout comme le refus."
 cc_bureau.30.b: "Le duc a droit à sa courtoisie."
 cc_bureau.30.c: "La couronne ne tranche pas les litiges entre ses serviteurs."

 # ---- .40  Entrenched and unfunded ----
 cc_bureau.40.title: "Le Fief"
 cc_bureau.40.desc: "Le bureau n'a pas reçu de financement adéquat depuis vingt ans et ne l'a jamais demandé, ce qui aurait dû être un signal d'alarme.\n\nIl est entièrement solvable. Il l'est parce qu'il est devenu l'affaire privée de la famille qui le dirige, tirant ses revenus de dispositions dont personne à la cour n'a vu les termes, et il a rempli sa fonction sans faille tout au long de cette période. C'est ce qui rend la situation difficile. Il n'y a rien à reprocher, si ce n'est l'existence même du système."
 cc_bureau.40.a: "Financez-le correctement et reprenez-le en main."
 cc_bureau.40.b: "Divisez-le en morceaux assez petits pour être manipulés."
 cc_bureau.40.c: "Vendez-leur l'office purement et simplement. Légalement."

 # ---- .50  Entrenched and funded ----
 cc_bureau.50.title: "Un pilier de l'État"
 cc_bureau.50.desc: "Le bureau a quarante ans, est correctement rémunéré et a survécu à trois des hommes qui l'ont fondé sans que personne ne remarque de différence dans son rendement.\n\nCette dernière partie est la réussite. Il a cessé de dépendre de qui y travaille. Un clerc décédé l'hiver dernier a laissé des instructions permanentes si complètes que l'homme qui l'a remplacé n'a eu besoin d'aucune instruction, et le bureau a simplement continué.\n\nLa couronne a construit quelque chose qui survivra à l'attention de la couronne. Il ne reste plus qu'à décider quelle marge de manœuvre lui laisser."
 cc_bureau.50.a: "Laissez-le rédiger sa propre procédure."
 cc_bureau.50.b: "Amenez son dirigeant au conseil."
 cc_bureau.50.c: "Faites tourner les officiers avant que l'un d'eux ne s'enracine."

 # ---- .60  A funding cut ----
 cc_bureau.60.title: "La Réduction est Annoncée"
 cc_bureau.60.desc: "L'estimation a été réduite et quelqu'un doit les en informer.\n\nLe chef du bureau a reçu la nouvelle debout, a remercié le messager et a posé une seule question : si la réduction devait être permanente. On lui a répondu que c'était pour l'année. Il a déclaré que c'était ce qu'on lui avait dit la dernière fois, et il est retourné à son bureau.\n\nIl ne démissionnera pas et ne protestera pas. Ce qu'il fera, c'est cesser de refuser les petites faveurs qu'il refuse depuis onze ans, et personne au palais n'en entendra parler."
 cc_bureau.60.a: "Dites-leur franchement. Il n'y a pas d'argent cette année."
 cc_bureau.60.b: "Réduisez les effectifs, pas la solde."
 cc_bureau.60.c: "Trouvez-le ailleurs."

 # ---- .61  What the cut cost ----
 cc_bureau.61.title: "Le coût"
 cc_bureau.61.desc: "Dix ans plus tard, l'office existe toujours et répond toujours aux lettres.\n\nCe qu'il ne fait plus, c'est y répondre de la même manière quel que soit l'expéditeur. Il n'y eut pas de décision. Personne n'a été soudoyé au sens où une cour pourrait agir. C'est simplement qu'un homme qui n'a pas été payé correctement depuis une décennie développe le sentiment de savoir quels correspondants valent la peine, et chaque homme dans ce bâtiment a développé le même sentiment à peu près au même moment.\n\nLa couronne voit son travail accompli. Mais elle arrive en seconde."
 cc_bureau.61.a: "Reconstruisez-le. Peu importe le prix."
 cc_bureau.61.b: "C'est moins cher qu'avant. Laissez tel quel."

 # ---- Thread modifiers ----
 STATIC_MODIFIER_NAME_cc_bureau_career_clerks: "Un service salarié"
 STATIC_MODIFIER_DESC_cc_bureau_career_clerks: "Des hommes qui doivent leur poste au poste lui-même. Lents, sans prestige, et la situation s'aggrave chaque année où personne n'intervient."
 STATIC_MODIFIER_NAME_cc_bureau_offices_are_property: "Les offices sont des propriétés"
 STATIC_MODIFIER_DESC_cc_bureau_offices_are_property: "Les postes sont hérités et vendus comme une évidence, sans que personne ne l'ait décrété. La couronne continue de percevoir les taxes. Elle ne décide plus qui sert."
 STATIC_MODIFIER_NAME_cc_bureau_paid_in_full: "Les Arriérés Apurés"
 STATIC_MODIFIER_DESC_cc_bureau_paid_in_full: "Vingt-cinq ans de clercs payés à temps, ce qui est la chose la plus coûteuse à acquérir dans tout ce processus et la seule capable d'annuler le reste."
 STATIC_MODIFIER_NAME_cc_bureau_fees_became_custom: "Les Honoraires sont Devenus l'Usage"
 STATIC_MODIFIER_DESC_cc_bureau_fees_became_custom: "Un bureau qui vit de ses propres taxes répond à celui qui les paie, et le tarif est affiché sur un tableau près de la porte."
 STATIC_MODIFIER_NAME_cc_bureau_retrenched: "L'Établissement Réduit"
 STATIC_MODIFIER_DESC_cc_bureau_retrenched: "Moins de postes, toujours salariés, toujours rattachés à la couronne. Une administration réduite reste une administration."
 STATIC_MODIFIER_NAME_cc_bureau_office_farmed_out: "Le Bureau Fermé à l'Encan"
 STATIC_MODIFIER_DESC_cc_bureau_office_farmed_out: "Le poste appartient désormais à quelqu'un d'autre et la couronne perçoit un loyer sur sa propre administration. C'est rentable. Mais cela prend également toute une vie pour revenir en arrière."
 STATIC_MODIFIER_NAME_cc_bureau_crown_backed_clerks: "La Couronne a Soutenu ses Clercs"
 STATIC_MODIFIER_DESC_cc_bureau_crown_backed_clerks: "Dit une fois, en public, devant un duc. Chaque sous-secrétaire du royaume a été au courant dans le mois."
 STATIC_MODIFIER_NAME_cc_bureau_standing_procedure: "Procédure permanente"
 STATIC_MODIFIER_DESC_cc_bureau_standing_procedure: "Le bureau a consigné par écrit ses procédures et ne dépend donc plus des personnes qui les exécutent actuellement. C'est là toute la définition d'une institution."
 STATIC_MODIFIER_NAME_cc_bureau_head_in_council: "Le Secrétaire du Conseil"
 STATIC_MODIFIER_DESC_cc_bureau_head_in_council: "Le bureau a désormais son mot à dire. La couronne a un rival qu'elle peut au moins identifier, ce qui est préférable."
 STATIC_MODIFIER_NAME_cc_bureau_rotated_officers: "Rotation des officiers"
 STATIC_MODIFIER_DESC_cc_bureau_rotated_officers: "Personne ne reste assez longtemps pour bâtir quoi que ce soit, ce qui est le but, mais aussi le coût."

 # ---- Estate privileges ----
 ep_noble_offices_by_right: "Les Bureaux nous Reviennent de Droit"
 ep_noble_offices_by_right_desc: "Les postes reviennent aux familles et les familles les paient, ainsi les dépenses du trésor diminuent l'année où ceci est accordé et chaque année suivante.\n\nCe qui diminue avec elles, c'est la capacité de la couronne à choisir qui sert. C'est un coût que personne ne remarque jusqu'à ce qu'il devienne crucial pour la première fois."
 ep_burgher_examined_service: "Service par examen"
 ep_burgher_examined_service_desc: "Postes pourvus par quiconque réussit les examens, d'où qu'il vienne. Cela produit une administration meilleure que toute autre méthode essayée, et c'est lent, coûteux et détesté par toutes les familles ayant un nom à protéger."
 ep_clergy_keepers_of_record: "Gardiens des Registres"
 ep_clergy_keepers_of_record_desc: "Avant les archives, il y avait les monastères, et pendant plusieurs siècles, c'était la même chose. Le clergé tient les registres, la couronne économise ainsi les frais de conservation.\n\nLe prix à payer est que l'Église sait désormais précisément ce que possède la couronne."
 ep_peasant_relief_from_fees: "Allégement des taxes"
 ep_peasant_relief_from_fees_desc: "Les charges informelles cessent, par proclamation, et l'on annonce aux bureaux qu'ils seront désormais payés convenablement.\n\nLa couronne vient d'accepter de prendre en charge un coût qu'elle avait discrètement transféré à des personnes incapables de le refuser. Cela coûte plus cher que prévu."

 # ---- Government reforms ----
 cc_venal_offices_reform: "Les Offices Vénaux"
 cc_venal_offices_reform_desc: "Les offices deviennent légalement des propriétés : achetés, vendus, hérités et taxés par la couronne à chaque transfert.\n\nLa France a fonctionné ainsi pendant deux siècles et cela a marché, au sens étroit où cela a permis de lever des fonds de manière fiable et sans contestation. Ce que cela ne pouvait pas faire, c'était de produire une administration qui rende des comptes à quiconque."
 cc_salaried_establishment_reform: "L'Établissement Salarié"
 cc_salaried_establishment_reform_desc: "Les postes sont salariés, nommés et tenus au bon vouloir de la couronne.\n\nTout État ayant perduré a fini par en arriver là, et la plupart y sont arrivés après avoir essayé l'autre méthode et passé un siècle à le regretter. C'est coûteux, de la même manière que les remparts sont coûteux."
