l_french:
 cc_legend.1.title: "La cour du philosophe"
 cc_legend.1.desc: "La convergence d'un souverain éclairé, d'un cabinet entièrement dévoué à l'administration et au savoir, et de la richesse matérielle d'une grande capitale a produit ce que les philosophes rêvaient mais voyaient rarement : une cour où la gouvernance et la sagesse ne font qu'un. Des savants étrangers arrivent chaque semaine. Nos institutions croissent plus vite que nos rivaux ne peuvent l'expliquer. L'Histoire en prend note."
 cc_legend.1.a: "Établir la Cour des Philosophes"
 cc_legend.1.a.tt: "Débloque la réforme gouvernementale de la Cour des Philosophes. Accorde au souverain le trait légendaire Roi Philosophe."
 cc_legend.1.b: "Honorer l'accomplissement par une célébration"

 cc_legend.2.title: "Le Saint Empire"
 cc_legend.2.desc: "À une époque où la foi et le pouvoir luttent pour la primauté, nous avons accompli ce que peu ont pu faire : une cour où l'autorité sacrée et le pouvoir politique se renforcent plutôt que de se saper mutuellement. Le clergé tient le royaume, le royaume tient la foi, et ensemble ils détiennent quelque chose qui ressemble, pour qui sait voir, à un empire saint reconstitué."
 cc_legend.2.a: "Proclamer le Saint Empire"
 cc_legend.2.a.tt: "Accorde le privilège de l'Empire Saint à l'ordre du clergé. Applique un modificateur permanent d'Empire Saint au royaume."
 cc_legend.2.b: "Un moment de prière et de gratitude"

 cc_legend.3.title: "Le Grand Bazar"
 cc_legend.3.desc: "La grande tradition de commerce cosmopolite du monde islamique a trouvé son expression dans notre royaume. Notre ministre gère un réseau diplomatique qui s'étend à travers le dar al-Islam et au-delà ; nos sujets commerciaux opèrent dans des ports que nos rivaux n'ont jamais vus ; notre Grand Chancelier a fait de notre réputation un atout commercial. Le Grand Bazar n'est pas un lieu — c'est une manière de faire des affaires que le monde imitera."
 cc_legend.3.a: "Ouvrir le Grand Bazar"
 cc_legend.3.a.tt: "Débloque la réforme gouvernementale du Grand Bazar. Accorde au membre du cabinet Grand Chancelier le trait légendaire Grand Vizir."
 cc_legend.3.b: "Honorer l'accomplissement par une cérémonie"

 cc_legend.4.title: "L'hégémon de fer"
 cc_legend.4.desc: "La combinaison d'un souverain à la volonté de fer, d'un commandant militaire suprême, d'un réseau de spécialistes militaires et d'une marche militaire projetant notre puissance au-delà de nos frontières a produit ce que peu de royaumes atteignent : l'hégémonie. Pas seulement la prépondérance, mais le genre de dominance qui façonne le comportement des voisins avant même qu'un seul soldat ne marche. Nous avons bâti l'Hégémon de Fer."
 cc_legend.4.a: "Formaliser l'Hégémonie de Fer"
 cc_legend.4.a.tt: "Débloque la réforme gouvernementale de l'Hégémonie de Fer."
 cc_legend.4.b: "L'avantage militaire est une récompense suffisante"

 cc_legend.5.title: "Le tribun du peuple"
 cc_legend.5.desc: "À l'ère des révolutions, alors que l'ancien ordre s'effondre et que le nouveau peine à naître, nous avons accompli ce que les réformateurs ont toujours promis sans jamais le livrer : un royaume où le peuple consent véritablement à être gouverné. Chaque ordre est satisfait. Le Parlement fonctionne. Notre ministre parle au nom du peuple — et le peuple, étonnamment, le croit. L'histoire appellera cela le moment où un Tribun du Peuple est apparu."
 cc_legend.5.a: "Proclamer le Tribun du peuple"
 cc_legend.5.a.tt: "Débloque la réforme gouvernementale de l'Assemblée du Peuple. Accorde au membre du cabinet Courtier Parlementaire le trait légendaire Tribun du Peuple."
 cc_legend.5.b: "Laissez le Tribun du Peuple s'exprimer"

 cc_legend.8.title: "L'ère des explorations"
 cc_legend.8.desc: "Les étoiles ont été cartographiées. Les vents ont été nommés. Les côtes qui marquaient autrefois la limite du monde connu sont désormais les points de départ d'un commerce régulier. Ce royaume n'a pas seulement participé à l'ère des explorations — il a aidé à la définir. Un ministre, plus que tout autre, incarne cet accomplissement. Ses voyages seront étudiés pendant des générations."
 cc_legend.8.a: "Marquez l'occasion — le navigateur légendaire a gagné son titre."
 cc_legend.8.a.tt: "Accorde le trait Navigateur Légendaire au ministre de l'exploration. Applique un modificateur permanent d'Âge des Découvertes au royaume. Débloque la réforme gouvernementale Guilde des Explorateurs."
 cc_legend.8.b: "L'accomplissement parle de lui-même — laissons-le rester une question de commerce, et non de légende."
