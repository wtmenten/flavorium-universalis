l_french:

 # Advance

 cc_frontier_administration_advance: "Administration Frontalière"
 cc_frontier_administration_advance_desc: "Plutôt que d'attendre que les routes et les villes atteignent les marches, la couronne installe des gouverneurs nobles résidents directement dans l'intérieur non colonisé, liant les zones frontalières à la capitale par la loyauté là où elle ne peut encore les lier par la pierre. Débloque le bâtiment $cc_lesser_local_governor$ et les privilèges d'état frontaliers, et accorde un gouverneur frontalier supplémentaire. Particulièrement prisé par les royaumes s'étendant à travers la steppe, les montagnes et l'intérieur profond."

 # Building

 cc_lesser_local_governor: "Gouverneur de Frontière"
 cc_lesser_local_governor_desc: "Un administrateur noble résident établi dans une province frontalière non développée. Contrairement à un gouverneur local complet, il n'a pas besoin de route vers la capitale et peut être situé en zone rurale — mais il doit rester relié à la capitale par voie terrestre (directement ou via des sujets) et projette moins de proximité. Tiré d'un petit groupe dédié. Nécessite l'avancée $cc_frontier_administration_advance$."
 cc_lesser_local_governor_tt: "Le nombre de gouverneurs de frontière construits doit être inférieur à la limite de gouverneurs de frontière du royaume"
 cc_lesser_local_governor_maintenance: "Entretien du Gouverneur de Frontière"

 # Estate Privileges

 ep_frontier_governance: "Gouvernance Frontalière"
 ep_frontier_governance_desc: "La haute noblesse prend personnellement en charge les marches.\n\nAccorde un Gouvernement de Frontière supplémentaire (+1 au pool des gouverneurs de frontière).\n\nChaque année, chaque emplacement possédé dans la province d'un $cc_lesser_local_governor$ et ses provinces voisines gagnent le modificateur $cc_frontier_control_buff$ : +5% de Contrôle Maximum et +0,2% de Contrôle Mensuel. Le bonus est renouvelé annuellement et disparaît sous deux ans si le gouverneur ou ce privilège est perdu.\n\nNécessite l'avancée $cc_frontier_administration_advance$."
 ep_frontier_missions: "Missions Frontalières"
 ep_frontier_missions_desc: "Le clergé diffuse la foi d'État dans les zones frontalières.\n\nChaque année, chaque emplacement possédé dans la province d'un $cc_lesser_local_governor$ et ses provinces voisines gagnent le modificateur $cc_frontier_conversion_buff$ : +25% de vitesse de conversion de la population. Le bonus est renouvelé annuellement et disparaît sous deux ans si le gouverneur ou ce privilège est perdu.\n\nNécessite l'avancée $cc_frontier_administration_advance$."
 ep_frontier_markets: "Marchés Frontaliers"
 ep_frontier_markets_desc: "Des marchés bourgeois sous charte se regroupent autour du siège du gouverneur, attirant le commerce à travers les marches.\n\nChaque année, chaque emplacement possédé dans la province d'un $cc_lesser_local_governor$ et dans ses provinces voisines gagne le modificateur $cc_frontier_market_buff$ : +1% d'Accès au marché et +5% de Puissance du centre commercial. Le bonus est renouvelé annuellement et disparaît sous deux ans si le gouverneur ou ce privilège est perdu.\n\nNécessite l'avancée $cc_frontier_administration_advance$."
 ep_frontier_settlement: "Colonisation Frontalière"
 ep_frontier_settlement_desc: "Les colons et les propriétaires libres sont attirés par la frontière protégée.\n\nChaque année, chaque lieu possédé dans la province d'un $cc_lesser_local_governor$ et ses provinces voisines gagne le modificateur $cc_frontier_growth_buff$ : +5 % d'Attraction migratoire et +0,1 % de Vitesse de promotion de la population. Le bonus est renouvelé annuellement et s'estompe en deux ans si le gouverneur ou ce privilège est perdu.\n\nNécessite l'avancée $cc_frontier_administration_advance$."

 # Area buff modifiers (static location modifiers applied by the yearly frontier pulse).
 # Plain keys back the $...$ references in the privilege descriptions above;
 # STATIC_MODIFIER_NAME_/DESC_ drive the modifier's on-location tooltip.

 cc_frontier_control_buff: "Gouvernance Frontalière"
 STATIC_MODIFIER_NAME_cc_frontier_control_buff: "Gouvernance Frontalière"
 STATIC_MODIFIER_DESC_cc_frontier_control_buff: "Le gouverneur frontalier résident et son escorte noble renforcent l'emprise de la couronne sur les marches environnantes."
 cc_frontier_market_buff: "Marchés Frontaliers"
 STATIC_MODIFIER_NAME_cc_frontier_market_buff: "Marchés Frontaliers"
 STATIC_MODIFIER_DESC_cc_frontier_market_buff: "Les marchés bourgeois sous charte autour du gouverneur de frontière attirent le commerce à travers les zones frontalières."
 cc_frontier_growth_buff: "Colonisation Frontalière"
 STATIC_MODIFIER_NAME_cc_frontier_growth_buff: "Colonisation Frontalière"
 STATIC_MODIFIER_DESC_cc_frontier_growth_buff: "Les colons sont attirés par les terres protégées autour du gouverneur de la frontière."
 cc_frontier_conversion_buff: "Missions Frontalières"
 STATIC_MODIFIER_NAME_cc_frontier_conversion_buff: "Missions Frontalières"
 STATIC_MODIFIER_DESC_cc_frontier_conversion_buff: "Les membres du clergé dépêchés depuis le siège du gouverneur de frontière prêchent la foi d'État dans toutes les marches environnantes."

 MODIFIER_TYPE_NAME_cc_num_frontier_governors: "Comte Gouverneur de Frontière"
 MODIFIER_TYPE_DESC_cc_num_frontier_governors: "Gouverneurs locaux mineurs qui ne nécessitent pas de connexion routière ou de ville et peuvent être spécialisés via des privilèges d'estates."
