 # ============================================================
 # LEGACY EVENTS (cc_legacy namespace)
 # ============================================================

 cc_legacy.1.title: "Un mentor planifie sa succession"
 cc_legacy.1.a: "Laissez [cc_legacy_elder.GetName] transmettre les fruits de son expérience à un ministre plus jeune."
 cc_legacy.1.a.tt: "Le ministre âgé transfère son trait principal de cabinet à un jeune courtisan, gagne le trait Légende Retraitée et se retire des tâches les plus exigeantes. La variable de suivi numérique est définie pour le moment où il finira par mourir."
 cc_legacy.1.b: "Encourager [cc_legacy_elder.GetName] à consacrer ses dernières années à former les compétences d'un successeur."
 cc_legacy.1.b.tt: "Le ministre âgé forme personnellement un jeune courtisan, lui apportant un bonus de compétence significatif. L'aîné conserve son trait mais investit dans la génération suivante."
 cc_legacy.1.c: "Ce n'est pas le moment. Laissons [cc_legacy_elder.GetName] continuer ainsi."

 cc_legacy.3.title: "Le dernier cadeau de l'aîné"
 cc_legacy.3.desc: "[cc_legacy_minister.GetName] est décédé. Il a passé ses dernières années comme Légende Retraitée — une institution vivante, un mentor plutôt qu'un ministre actif — et n'a pas perdu son temps. L'ensemble de ce qu'il a bâti a été laissé en dépôt. La question est maintenant de savoir comment nous recevrons cet héritage."
 cc_legacy.3.a: "Accepter l'héritage de [cc_legacy_minister.GetName] — qu'il devienne une caractéristique permanente de ce royaume."
 cc_legacy.3.a.tt: "Applique un modificateur de pays permanent basé sur l'ancienne spécialisation du cabinet de l'aîné. Aucun coût."
 cc_legacy.3.b: "Consacrer l'héritage par une cérémonie et un fonds de dotation approprié."
 cc_legacy.3.b.tt: "Coûte 15× le revenu mensuel. Applique une version améliorée et consacrée du modificateur d'héritage — permanemment."

 cc_legacy.2.title: "Une légende s'en va"
 cc_legacy.2.desc: "[cc_legacy_minister.GetName] était plus qu'un ministre. La cour qu'il a servie, les institutions qu'il a façonnées, les décisions qu'il a influencées — tout cela lui survivra. Ce que nous choisirons de faire de sa mémoire déterminera si la légende devient une force vivante dans ce royaume, ou simplement un nom sur une plaque."
 cc_legacy.2.a: "Établir un mémorial durable — laissez la légende devenir partie intégrante de l'identité permanente du royaume."
 cc_legacy.2.a.tt: "Applique un modificateur de pays faible mais permanent en l'honneur de ce ministre légendaire."
 cc_legacy.2.b: "Consacrer l'héritage par une cérémonie appropriée et un fonds de dotation."
 cc_legacy.2.b.tt: "Coûte 25× le revenu mensuel. Applique une version améliorée et consacrée du modificateur d'héritage — permanemment."
 cc_legacy.1.desc: "[cc_legacy_elder.GetName] a servi cette cour pendant plus d'une décennie, et les années commencent à peser. Un ministre de son rang ne prend pas simplement sa retraite — il laisse un vide dans l'institution, et ce vide doit être comblé délibérément ou abandonné au hasard. [cc_legacy_elder.GetName] a demandé une audience. Cette personne souhaite discuter de l'avenir."
