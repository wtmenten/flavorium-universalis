l_french:
 # === cc_bonds.1 — Monitor ===
 cc_bonds.1.title: "Liens en formation"
 cc_bonds.1.desc: "Des liens entre nous et notre vassal sont en train de se former."
 # === cc_bonds.100 — The Young Heir ===
 cc_bonds.100.title: "Le jeune héritier"
 cc_bonds.100.desc: "Une dépêche de [bond_subj.GetName] contient un détail que nous n'avions pas anticipé : le souverain actuel a un jeune héritier, peut-être âgé de huit ou dix ans, qui est déjà préparé aux responsabilités qu'il héritera un jour. Il y a du temps, et il y a une question. Quel type de relation souhaitons-nous avoir avec l'homme que cet enfant deviendra ? Les choix que nous faisons maintenant façonneront sa compréhension de ce que signifie la Couronne — si nous sommes des protecteurs, des partenaires ou des suzerains distants que l'on peut attendre patiemment."
 cc_bonds.100.a: "Inviter l'héritier à notre cour. Il grandira en comprenant qui nous sommes."
 cc_bonds.100.b: "Envoyer des tuteurs et des cadeaux généreux à sa cour d'origine. La bonne volonté plantée tôt s'enracine profondément."
 cc_bonds.100.c: "Cela ne nous concerne pas. La succession dans [bond_subj.GetName] est leur affaire."

 # === cc_bonds.101 — The Heir Comes of Age ===
 cc_bonds.101.title: "L'Héritier Atteint sa Majorité"
 cc_bonds.101.desc_court: "Le jeune héritier de [bond_subj.GetName] est devenu un jeune homme poli et capable — éduqué à notre cour, maîtrisant la langue de notre noblesse et à l'aise à notre table. Il nous est loyal d'une manière presque réflexe. Ce avec quoi il est moins à l'aise, notent nos courtisans, est l'idée de rentrer chez lui. Sa patrie est désormais pour lui un concept abstrait ; la cour est la réalité. Il est à la croisée des chemins, et nous le sommes aussi."
 cc_bonds.101.desc_gifted: "L'héritier de [bond_subj.GetName] a atteint l'âge adulte dans sa patrie, bien instruit et — selon tout indice — bien disposé envers la Couronne. Les tuteurs que nous lui avons envoyés ont laissé leur marque. Il parle du suzerain de son père avec une chaleur sincère, ce qui n'est pas chose que l'on puisse simplement acheter. C'est un homme libre, enraciné dans son propre territoire, mais les fondations ont été bien posées."
 cc_bonds.101.desc_ignored: "L'héritier de [bond_subj.GetName] a atteint l'âge adulte sans aucun lien particulier avec notre cour. Il est capable, indépendant d'esprit et — d'après les rapports de nos envoyés — légèrement froid dans son attitude envers la Couronne. Il a tissé ses propres relations, cultivé ses propres contacts et formé sa propre vision de ce que signifie pour lui la relation de vassalité. Ces opinions ne sont pas hostiles. Elles sont simplement distantes."
 cc_bonds.101.a_keep: "Gardez-le à la cour encore un peu. Il y a encore des choses qu'il devrait apprendre ici."
 cc_bonds.101.a_send: "Le renvoyer chez lui avec les honneurs et un arrangement matrimonial. Il est prêt."
 cc_bonds.101.b_invite: "L'inviter à la cour dès maintenant. Formaliser ce que les tuteurs ont commencé."
 cc_bonds.101.b_gift: "Lui envoyer un titre de propriété dans notre royaume. Un geste tangible de partenariat."
 cc_bonds.101.c_gift: "Faire des ouvertures — envoyer des cadeaux somptueux. Il n'est pas trop tard pour construire quelque chose."
 cc_bonds.101.c_ignore: "C'est l'héritier d'un État vassal. Nous n'avons pas besoin de le courtiser."
 cc_bonds.101.c_interfere: "Les liens qu'il tisse localement nous inquiètent. Nous allons les perturber."

 # === cc_bonds.102 — The Old Lord's Passing ===
 cc_bonds.102.title: "Le décès du vieux seigneur"
 cc_bonds.102.desc_loyal: "L'ancien seigneur de [bond_subj.GetName] est décédé, et son héritier — le jeune homme que nous connaissions à notre cour, ou celui qui a grandi avec des souvenirs affectueux de notre générosité — a pris sa place. Son premier acte en tant que dirigeant est une lettre à la Couronne. Le ton est personnel. Il rappelle des bontés spécifiques. Il renouvelle son serment sans qu'on lui demande, dans un langage qui dépasse la formule. Il ne simule pas la loyauté. Il est sincère. Nous voyons, pleinement, ce que ces choix initiaux ont produit."
 cc_bonds.102.desc_neutral: "L'ancien seigneur de [bond_subj.GetName] est décédé. Son héritier a envoyé un renouvellement formel du serment — correct à tous égards, professionnel dans le ton, et totalement dénué de chaleur. Il remplit ses obligations. Il a été élevé pour comprendre quelles sont ces obligations. S'il y a autre chose derrière elles, il est impossible de le dire à partir d'une lettre soigneusement rédigée."
 cc_bonds.102.desc_hostile: "L'ancien seigneur de [bond_subj.GetName] est décédé. Son héritier n'a pas encore envoyé le renouvellement coutumier du serment. Une semaine passe. Puis deux. Nos secrétaires commencent à rédiger un rappel. Le nouveau seigneur n'est pas en rébellion — rien n'a été déclaré, rien répudié. Il nous fait simplement attendre, dans le langage le plus ancien du mécontentement féodal : le silence pointed."
 cc_bonds.102.a_reward: "Lui accorder un titre honorifique. Sa loyauté mérite une reconnaissance formelle."
 cc_bonds.102.a_acknowledge: "Nous accueillons son renouvellement avec chaleur. La relation commence sous les meilleurs auspices."
 cc_bonds.102.b_push: "Cette transition est une opportunité. Nous demanderons une concession."
 cc_bonds.102.b_accept: "Le renouvellement est accepté. La relation se poursuit selon les termes existants."
 cc_bonds.102.c_demand: "Il prêtera serment dès maintenant. Nous n'attendrons pas."
 cc_bonds.102.c_envoy: "Envoyer un envoyé avec des cadeaux. Commencer la relation sur de bonnes bases, même tardivement."
