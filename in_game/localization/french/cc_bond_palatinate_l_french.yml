l_french:
 # === cc_bonds.30 — The Palatinate Lord's First Homage ===
 cc_bonds.30.title: "Le premier hommage du seigneur du Palatinat"
 cc_bonds.30.desc: "Le seigneur de [bond_subj.GetName] attend la confirmation de sa position dans le cadre du nouvel arrangement. La question qui se pose à nous est d'ordre cérémoniel : recevrons-nous son serment lors d'une cérémonie publique formelle annonçant au monde la nature de notre relation, ou traiterons-nous l'affaire avec la discrétion feutrée du protocole privé ? Le choix semble administratif. Il ne l'est pas."
 cc_bonds.30.a: "Une cérémonie grandiose. Que toute la cour soit témoin de sa féodalité."
 cc_bonds.30.b: "Un serment privé. Les formalités sont observées, sans mise en scène."
 cc_bonds.30.c: "Passons totalement sur la cérémonie. Nous savons où se situent ses loyautés."

 # === cc_bonds.31 — Noble Marriage Alliance ===
 cc_bonds.31.title: "Alliance matrimoniale noble"
 cc_bonds.31.desc: "Le seigneur palatin a soulevé la question d'un mariage entre sa maison et la nôtre — ou au minimum entre un membre de sa famille et un partenaire approprié dans nos cercles de cour. Le lien serait visible, dynastique et contraignant de la manière dont seul le sang peut lier. La façon dont nous percevons cela, comme une opportunité ou une complication, révèle notre vision de la relation."
 cc_bonds.31.a: "Organiser le mariage. Les dynasties se construisent par la famille."
 cc_bonds.31.b: "Refuser. Le moment n'est pas opportun."
 cc_bonds.31.c: "Le seigneur peut régler les affaires de sa propre famille."

 # === cc_bonds.32 — Military Service Demand ===
 cc_bonds.32.title: "Demande de service militaire"
 cc_bonds.32.desc: "Nous avons besoin de forces supplémentaires, et le palatinat de [bond_subj.GetName] commande un corps substantiel de nobles formés et de leurs suites. Le seigneur a toujours rempli ses obligations, mais la question est de savoir comment nous formulons la demande — comme un ordre, comme une offre, ou comme quelque chose que nous lui demandons tout court. Il remarquera la différence."
 cc_bonds.32.a: "Convoquer l'intégralité de la levée noble. Le service est dû."
 cc_bonds.32.b: "Demander un service volontaire et fournir une compensation."
 cc_bonds.32.c: "Exemptez le palatinat de cette levée. Leur sécurité importe également."

 # === cc_bonds.33 — Palatinate Church Appointment ===
 cc_bonds.33.title: "Nomination ecclésiastique du Palatinat"
 cc_bonds.33.desc: "L'évêché au sein de [bond_subj.GetName] est vacant. Le seigneur a déjà effectué des démarches informelles concernant son candidat préféré — un homme de rang local et dont la loyauté envers le palatinat est manifeste. Nos propres conseillers ecclésiastiques ont un autre nom en tête : un loyaliste de la couronne dont la nomination étendrait notre influence dans la vie spirituelle du palatinat. Le choix ne passera pas inaperçu pour l'une ou l'autre des parties."
 cc_bonds.33.a: "La Couronne nomme l'évêque. C'est notre prérogative."
 cc_bonds.33.b: "Que le seigneur nomme. C'est son diocèse."
 cc_bonds.33.c: "Un processus d'approbation conjoint. Les deux parties ont leur mot à dire."

 # === cc_bonds.34 — The Border Dispute ===
 cc_bonds.34.title: "Le différend frontalier"
 cc_bonds.34.desc: "Le seigneur de [bond_subj.GetName] écrit avec une frustration évidente. Une maison noble voisine a déplacé des bornes frontalières et conteste des droits de pâturage le long de la limite orientale du palatinat. Il demande notre soutien — une lettre formelle, une déclaration légale, un signe que la Couronne appuie sa revendication. La maison voisine a également des relations à la cour. Aucun résultat n'est sans coût."
 cc_bonds.34.a: "Soutenir pleinement le seigneur. Écrire la lettre. Faire la déclaration."
 cc_bonds.34.b: "Exiger que les deux parties règlent le litige par un arbitrage formel."
 cc_bonds.34.c: "Ne pas s'en mêler. Les disputes locales se règlent d'elles-mêmes."

 # === cc_bonds.35 — The Palatinate Asks for Tax Relief ===
 cc_bonds.35.title: "Le Palatinat demande un allégement fiscal"
 cc_bonds.35.desc: "Une saison de récolte difficile et plusieurs années d'obligations militaires ont mis à rude épreuve le palatinat de [bond_subj.GetName]. Le seigneur écrit avec une dignité prudente — sans supplier, mais en demandant clairement — une réduction temporaire de la charge fiscale que ses nobles sont censés supporter. La demande est raisonnable à tous égards. C'est le précédent qu'elle crée qui inquiète nos conseillers."
 cc_bonds.35.a: "Accorder l'aide. Ils ont servi fidèlement et le méritent."
 cc_bonds.35.b: "Rejeter la demande. Les obligations ne peuvent être renégociées selon les circonstances."
 cc_bonds.35.c: "Proposer une réduction temporaire modeste."

 # === cc_bonds.36 — The Old Lord Dies ===
 cc_bonds.36.title: "Le vieux seigneur meurt"
 cc_bonds.36.desc: "Le seigneur palatin de [bond_subj.GetName] est décédé. Il a servi longtemps et sans incident majeur, et son héritier — que nous connaissons et qui a été préparé par son père — est prêt à recevoir le titre. La succession est procéduralement simple. Ce qui ne l'est pas, c'est le règlement financier : le domaine palatin est substantiel, et la manière dont nous aborderons la transition fixera les termes de la première impression du nouveau seigneur sur la Couronne."
 cc_bonds.36.a: "Confirmer l'héritier avec grâce et renoncer à tous les droits de succession."
 cc_bonds.36.b: "Exiger l'intégralité de la taxe sur les successions avant de confirmer la succession."
 cc_bonds.36.c: "Profitons de l'interrègne pour revoir l'organisation du palatinat."
