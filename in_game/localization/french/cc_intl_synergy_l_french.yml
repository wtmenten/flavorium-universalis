l_french:
 # ============================================================
 # CROSS-COUNTRY SYNERGY EVENTS (cc_intl namespace)
 # ============================================================

 # -------- STATIC MODIFIER NAMES --------
 STATIC_MODIFIER_NAME_cc_intl_scholar_influx: "Afflux de savants"
 STATIC_MODIFIER_NAME_cc_intl_military_exchange: "Échange militaire"
 STATIC_MODIFIER_NAME_cc_intl_trade_compact: "Accord commercial"
 STATIC_MODIFIER_NAME_cc_intl_steppe_alliance: "Alliance des steppes"
 STATIC_MODIFIER_NAME_cc_intl_pilgrimage_network: "Réseau de Pèlerinages"
 STATIC_MODIFIER_NAME_cc_intl_religious_solidarity: "Solidarité religieuse"
 STATIC_MODIFIER_NAME_cc_intl_shadow_operations: "Opérations de l'ombre"
 STATIC_MODIFIER_NAME_cc_intl_diplomatic_compact: "Accord diplomatique"
 STATIC_MODIFIER_NAME_cc_intl_intellectual_rivalry: "Rivalité intellectuelle"

 # -------- GROUP A: INTELLECTUAL & SCHOLARLY --------

 cc_intl.1.title: "L'échange du philosophe"
 cc_intl.1.desc: "Une nouvelle nous parvient de [target_nation.GetName] : leur cour a produit des ministres d'une distinction intellectuelle inhabituelle. [minister.GetName] correspond avec eux depuis des mois. Les lettres ont été remarquables — et l'opportunité qu'elles représentent pourrait l'être encore plus."
 cc_intl.1.a: "Proposer un échange savant formel — les deux cours en bénéficient."
 cc_intl.1.b: "Inviter leurs savants ici. Laisser le talent affluer vers nous."
 cc_intl.1.c: "Notre cour garde ses propres secrets."

 cc_intl.2.title: "Savants en exil"
 cc_intl.2.desc: "La guerre qui engloutit [war_nation.GetName] a créé un flux de réfugiés — parmi lesquels des savants, des médecins et des administrateurs d'un talent considérable. Ils franchissent nos frontières n'ayant pour tout bagage que leur savoir. [minister.GetName] pense que nous devrions les accueillir."
 cc_intl.2.a: "Ouvrir la cour aux exilés. Leurs connaissances sont un gain pour nous."
 cc_intl.2.b: "Payons des mercenaires pour tenir la populace à l'écart."
 cc_intl.2.c: "Ce n'est pas notre guerre, et ce ne sont pas nos savants."

 cc_intl.3.title: "Le philosophe rival"
 cc_intl.3.desc: "La cour de [rival_court.GetName] s'est proclamée comme le principal centre du savoir dans le monde connu. Cette affirmation n'est pas sans fondement — mais elle n'est pas non plus incontestée. Nos propres accomplissements intellectuels sont considérables. Comment y répondre ?"
 cc_intl.3.a: "Que la rivalité aiguise les deux cours. La compétition fait progresser le savoir."
 cc_intl.3.b: "Contestez directement leur prééminence. Nous ne céderons pas le titre."
 cc_intl.3.c: "Proposer une académie commune. Ensemble, nous surpasserons ce que chacun pourrait accomplir seul."

 # -------- GROUP B: MILITARY COOPERATION --------

 cc_intl.4.title: "La doctrine du Maréchal"
 cc_intl.4.desc: "[military_minister.GetName] a suivi la guerre de [military_ally.GetName] avec un intérêt professionnel. Les campagnes ont révélé des faiblesses — et notre propre doctrine a quelque chose à offrir en retour. Il y a là une opportunité : partager les connaissances, profiter de l'expertise ou simplement observer."
 cc_intl.4.a: "Partageons librement notre doctrine. De bons alliés combattent mieux."
 cc_intl.4.b: "Demander leurs vétérans en échange. Des soldats expérimentés valent de l'or."
 cc_intl.4.c: "Vendre l'expertise. Leur or est aussi précieux que leur gratitude."

 cc_intl.5.title: "Migration nomade"
 cc_intl.5.desc: "Les seigneurs tribaux de [steppe_neighbor.GetName] sont agités. [minister.GetName] — qui comprend l'esprit de la steppe mieux que quiconque à cette cour — pense que nous sommes à la croisée des chemins : alliance, suzeraineté ou transaction. Chaque voie a son prix et sa récompense."
 cc_intl.5.a: "Forger une alliance. Leur cavalerie et notre administration — une combinaison redoutable."
 cc_intl.5.b: "Exiger un tribut. Les forts prennent ; les faibles donnent."
 cc_intl.5.c: "Engager leur cavalerie directement. C'est une question d'affaires, pas de politique."

 # -------- GROUP C: RELIGIOUS & FAITH NETWORKS --------

 cc_intl.6.title: "La solidarité du Califat"
 cc_intl.6.desc: "Notre chancelier a reçu une délégation de [muslim_partner.GetName] portant un message de fraternité. Le monde islamique n'est pas un seul empire — c'est une seule civilisation. Il existe des moyens de renforcer le tissu conjonctif de cette civilisation qui profiteraient à tous ceux qui partagent la foi."
 cc_intl.6.a: "Solidarité islamique. Nos destins sont liés par bien plus que des traités."
 cc_intl.6.b: "Un pacte de réseau commercial. La plus grande force de la dar al-Islam est son commerce."
 cc_intl.6.c: "Convoquer un sommet théologique. Les savants doivent s'exprimer."

 cc_intl.7.title: "Solidarité protestante"
 cc_intl.7.desc: "La Réforme a créé des alliances étranges et des ennemis plus étranges encore. [protestant_partner.GetName] partage notre confession, fait face à des pressions similaires et nous a contactés via le réseau de nos ministres. La question est de savoir quelle solidarité nous souhaitons manifester — et à quel prix."
 cc_intl.7.a: "Déclarer ouvertement notre fraternité. Nous nous tenons ensemble devant Dieu et devant Rome."
 cc_intl.7.b: "Un échange savant. La plus grande arme de la Réforme est l'argument, non les armes."
 cc_intl.7.c: "Reconnaissez le lien discrètement. La discrétion est l'essentiel de la politique confessionnelle."

 cc_intl.8.title: "Le pèlerinage sacré"
 cc_intl.8.desc: "Les sites sacrés attirent des pèlerins du monde entier, y compris de [pilgrimage_partner.GetName]. Notre ministre — dont l'autorité spirituelle s'étend au-delà de la salle du conseil — estime que la couronne devrait jouer un rôle actif dans l'accueil, l'orientation et l'exploitation de ce flux de fidèles voyageurs."
 cc_intl.8.a: "Organisez le grand pèlerinage. Que cette cour devienne un centre sacré."
 cc_intl.8.b: "Envoyer plutôt des émissaires spirituels à leur cour."
 cc_intl.8.c: "Agir en tant qu'arbitre spirituel entre nos cours — la foi comme diplomatie."

 # -------- GROUP D: TRADE & DIPLOMATIC --------

 cc_intl.9.title: "Le Pacte du Marchand"
 cc_intl.9.desc: "La communauté marchande de [trade_partner.GetName] a établi le contact avec la nôtre. Notre ministre y voit une opportunité : les routes commerciales que nous contrôlons chacun se chevauchent de manières plus complémentaires que concurrentes. Un pacte maintenant pourrait définir le commerce dans cette région pour une génération."
 cc_intl.9.a: "Une entreprise commerciale commune. Les deux cours prospèrent ; aucune ne domine."
 cc_intl.9.b: "Négocier des droits exclusifs. Nos marchands prennent la position de tête."
 cc_intl.9.c: "Étudiez leurs pratiques en silence. La connaissance est une forme de commerce en soi."

 cc_intl.10.title: "L'influence du Grand Chancelier"
 cc_intl.10.desc: "La cour de [junior_state.GetName] est plus petite, plus faible et — selon notre chancelier — perméable à la persuasion. La question est de savoir quelle forme doit prendre cette persuasion : le patronage, l'extraction ou une démonstration de force."
 cc_intl.10.a: "Accorder un patronage diplomatique. Ils entrent volontairement dans notre orbite."
 cc_intl.10.b: "Établir un arrangement tributaire. Le pouvoir a ses privilèges."
 cc_intl.10.c: "Faire une démonstration de force. Qu'ils voient ce que coûte la résistance."

 # -------- GROUP E: ESPIONAGE & SHADOW PLAY --------

 cc_intl.11.title: "La cour fantôme tend la main"
 cc_intl.11.desc: "[minister.GetName] observe [shadow_target.GetName] depuis un certain temps. L'hostilité là-bas n'est pas accidentelle — elle est cultivée, peut-être par ceux qui craignent ce que nous représentons. Notre conseiller de l'ombre pense que le moment est venu d'agir : recueillir des renseignements, débaucher leurs talents ou fabriquer le prétexte dont nous avons besoin."
 cc_intl.11.a: "Mettez en place l'opération de renseignement. Apprenez à les connaître avant qu'ils ne nous connaissent."
 cc_intl.11.b: "Recruter leurs nobles mécontents. Leur perte est notre gain."
 cc_intl.11.c: "Provoquer un incident diplomatique. Nous obtiendrons notre justification."

 # -------- GROUP F: RULER-TO-RULER --------

 cc_intl.12.title: "La mission confucéenne"
 cc_intl.12.desc: "La cour de [tributary_state.GetName] a été observée par notre ministre confucéen, et le constat est le suivant : elle est plus petite, elle est voisine, et elle se trouve dans l'orbite de la tradition céleste. La manière dont nous l'aborderons définira la nature de cette relation — patronage, culture ou autorité."
 cc_intl.12.a: "Proposer des relations tributaires. La hiérarchie céleste demande la reconnaissance, non la soumission."
 cc_intl.12.b: "Envoyer une mission culturelle. La pratique administrative confucéenne est notre plus grande exportation."
 cc_intl.12.c: "Affirmer la suprématie céleste. Notre culture s'étend ; leur résistance est notée."
