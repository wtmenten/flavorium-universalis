l_french:
 # ============================================================
 # War Council Events (Pillar 04)
 # ============================================================

 # --- cc_wc.1 — The Council of War ---
 cc_wc.1.title: "Le Conseil de guerre"
 cc_wc.1.desc: "[minister.GetName] convoque le conseil autour des cartes de campagne. [minister.GetHerHis|c] évaluation de la situation militaire façonne les options qui sont présentées au trône."

 cc_wc.1.a: "Poursuivons l'offensive — saisissons l'occasion."
 cc_wc.1.a.tooltip: "Le plaidoyer de [minister.GetName] en faveur de campagnes agressives encourage l'armée. Le moral grimpe, mais l'extension stratégique excessive risque d'entraîner une instabilité politique à l'intérieur du pays."

 cc_wc.1.b: "Conseillez la patience — laissez l'ennemi s'épuiser."
 cc_wc.1.b.tooltip: "La doctrine de défense patiente du ministre s'impose. Les colonnes ennemies souffriront grandement sur notre territoire, et le coût d'entretien de nos forts diminue."

 cc_wc.1.c: "Ne jurer aucune paix avant la victoire totale."
 cc_wc.1.c.tooltip: "L'exigence de conditions inconditionnelles par les partisans de la ligne dure rallie la cour. Le prestige augmente, et les ministres sont tenus de mener la guerre jusqu'à son terme."

 cc_wc.1.d: "Les conseils du ministre stabilisent la campagne."
 cc_wc.1.d.tooltip: "Les conseils professionnels avisés de [minister.GetName] empêchent le conseil de prendre des décisions précipitées. L'expérience s'accroît à chaque campagne planifiée."

 # --- cc_wc.2 — Financing the War ---
 cc_wc.2.title: "Financer la guerre"
 cc_wc.2.desc: "Le trésor est sous tension. [minister.GetName] a été convoqué pour présenter une solution — ou du moins un compte rendu franc de la gravité réelle de la situation."

 cc_wc.2.a: "Pressez la population — extrayez ce qui est nécessaire."
 cc_wc.2.a.tooltip: "La poigne administrative du ministre force des revenus supplémentaires du royaume. Le ressentiment paysan augmente et la stabilité s'effrite sous la pression."

 cc_wc.2.b: "Négocier des prêts de guerre — l'or maintenant, les intérêts plus tard."
 cc_wc.2.b.tooltip: "Le ministre négocie des financements à court terme auprès des maisons marchandes et des prêteurs d'argent. Le trésor gonfle, mais l'inflation est le compagnon inévitable de l'or emprunté."

 cc_wc.2.c: "Surmontez la pénurie — réduisez les dépenses et endurez."
 cc_wc.2.c.tooltip: "Aucune solution élégante ne se présente. Le royaume se serre la ceinture, mais le moral à la cour souffre de cette faiblesse visible."

 # --- cc_wc.3 — The General's Request ---
 cc_wc.3.title: "La requête du général"
 cc_wc.3.desc: "[minister.GetName] a soumis une demande formelle au conseil : la campagne nécessite plus de ressources si elle doit réussir. La couronne doit décider si l'armée ou le trésor prime."

 cc_wc.3.a: "Accorder les ressources — laisser l'armée faire son travail."
 cc_wc.3.a.tooltip: "Renforts, fournitures et fonds affluent vers le front. Le moral de l'armée grimpe, et la confiance de [minister.GetName] envers la couronne est rétablie."

 cc_wc.3.b: "Refuser — le trésor ne peut le supporter."
 cc_wc.3.b.tooltip: "[minister.GetName] reçoit le refus avec un mépris mal dissimulé. [minister.GetHerHis|c] opinion sur l'engagement de la couronne dans la guerre est durablement diminuée."

 # --- cc_wc.10 — Standing Army Reform ---
 cc_wc.10.title: "La proposition d'armée permanente"
 cc_wc.10.desc: "La guerre étant terminée et les leçons du champ de bataille encore fraîches dans l'esprit de [minister.GetName], le ministre a rédigé une proposition formelle : remplacer le système de levée féodale par une armée professionnelle permanente financée par la couronne. La noblesse n'accueillera pas ce changement avec enthousiasme."

 cc_wc.10.a: "Mettre en œuvre la réforme de l'armée permanente."
 cc_wc.10.a.tooltip: "Une force permanente est établie — entraînée, entretenue et fidèle à la seule couronne. La discipline et les effectifs s'améliorent considérablement, mais la noblesse perd en prestige et en autorité de levée."

 cc_wc.10.b: "Refuser — la noblesse ne le permettrait pas."
 cc_wc.10.b.tooltip: "La proposition est mise au placard. La fenêtre de réforme passe sans conséquence."

 # --- cc_wc.11 — Supply Reform ---
 cc_wc.11.title: "La proposition de réforme des approvisionnements"

 cc_wc.11.a: "Financer la réforme du commissariat."
 cc_wc.11.a.tooltip: "Un commissariat approprié est établi. Les colonnes de ravitaillement suivent désormais le rythme de l'armée, et les pertes dues à l'attrition chutent radicalement dans toutes les campagnes."

 cc_wc.11.b: "Le coût est trop élevé — décliner."
 cc_wc.11.b.tooltip: "La proposition est trop coûteuse compte tenu des conditions actuelles. La fenêtre de réforme se referme."

 # --- cc_wc.12 — Fortification Doctrine ---
 cc_wc.12.title: "La doctrine de fortification"
 cc_wc.12.desc: "Ayant étudié l'art du siège ennemi tout au long de la campagne, [minister.GetName] propose une révision complète de la politique de fortification : standardisation des bastions, rotations régulières des garnisons et calendrier de maintenance unifié. Cela coûtera cher au trésor, mais les ennemis trouveront notre territoire bien plus coûteux à traverser."

 cc_wc.12.a: "Investir dans la nouvelle doctrine de fortification."
 cc_wc.12.a.tooltip: "Nos forts sont reconstruits et rationalisés. Les coûts d'entretien diminuent selon le nouveau calendrier, et les armées hostiles marchant sur notre territoire saigneront à chaque lieue."

 cc_wc.12.b: "Trop cher — refuser la proposition."
 cc_wc.12.b.tooltip: "La réforme est reportée. La fenêtre de cinq ans pour la réforme post-guerre se referme."

 # --- cc_wc.20 — Outdated General Resolution ---
 cc_wc.20.title: "Une décision du conseil sur le vieux général"
 cc_wc.20.desc: "Le conseil a soulevé ce que beaucoup murmurent depuis des mois : les tactiques de [minister.GetName] appartiennent à une époque révolue. La campagne a exposé le fossé entre [minister.GetHerHis] méthodes et le champ de bataille moderne. Les ministres proposent une retraite formelle et digne — mais cela ne passera pas inaperçu."

 cc_wc.20.a: "Mettre [minister.GetName] à la retraite avec honneur."
 cc_wc.20.a.tooltip: "Le conseil met formellement le général à la retraite. Le coût en prestige lié au retrait d'un vétéran est réel, mais le cabinet se libère d'une voix obsolète."

 cc_wc.20.b: "Laissez [minister.GetName] mener la campagne jusqu'à son terme."
 cc_wc.20.b.tooltip: "Le vieux soldat connaît assez bien ces champs de bataille. La déférence du conseil lui vaut un modeste prestige — il y a de la dignité dans la loyauté."

 # ============================================================
 # War Council Modifier Names
 # ============================================================
 cc_wc_offensive_surge: "Poussée offensive"
 cc_wc_offensive_surge_desc: "Le conseil de guerre a approuvé une campagne offensive agressive. Le moral et la récupération des armées sont augmentés pendant toute la durée de l'offensive."

 cc_wc_defensive_posture: "Posture défensive"
 cc_wc_defensive_posture_desc: "Le conseil de guerre préconise la patience. Les armées hostiles subissent une forte attrition en traversant notre territoire, et l'entretien des fortifications est réduit."

 cc_standing_army_reform: "Réforme de l'armée permanente"
 cc_standing_army_reform_desc: "Une force professionnelle permanente a remplacé l'ancien système de levée. La discipline est plus stricte et les réserves de main-d'œuvre ont augmenté."

 cc_supply_reform: "Réforme des approvisionnements"
 cc_supply_reform_desc: "Un commissariat réformé permet de ravitailler l'armée en campagne. L'attrition des troupes est substantiellement réduite."

 cc_fortification_doctrine: "Doctrine de fortification"
 cc_fortification_doctrine_desc: "La standardisation des plans de bastions et des rotations de garnisons rend nos fortifications plus efficaces et notre territoire plus coûteux à envahir."

 cc_wc_general_defied: "Général insubordonné"

 # --- cc_wc.50 — The Hawk's Reckoning ---
 cc_wc.50.title: "Le Règlement de Comptes du Faucon"

 cc_wc.50.a: "La paix était nécessaire. [minister.GetName] l'acceptera — ou trouvera un autre poste."
 cc_wc.50.a.tooltip: "Prestige issu d'un gouvernement ferme. [minister.GetName] ne l'accepte pas avec grâce — [minister.GetSheHe] s'en souviendra pendant un certain temps."

 cc_wc.50.b: "Reconnaissez la difficulté. Honorez le service et l'engagement de [minister.GetHerHis]."
 cc_wc.50.b.tooltip: "Un coût modeste en prestige. [minister.GetName] reçoit une reconnaissance et en devient plus capable. La tension s'apaise sans résolution nette."

 cc_wc.50.c: "Promettre la prochaine campagne. S'y engager devant le conseil."
 cc_wc.50.c.tooltip: "Une promesse publique que la prochaine guerre sera menée jusqu'à son terme. Coût en prestige — mais le modificateur de Poussée Offensive reflète un engagement martial renouvelé et sincère, et [minister.GetName] est satisfait."

 # --- cc_wc.51 — The General's Resentment ---
 cc_wc.51.title: "Le ressentiment du général"
 cc_wc.51.desc: "Le grief de [minister.GetName] a eu des mois pour se cristalliser. Les ressources que [minister.GetSheHe] a demandées avant la campagne ont été refusées, et [minister.GetSheHe] a maintenant eu le temps d'en compter le coût — en vies, en terrains perdus, dans un registre personnel qui ne s'équilibre pas. [minister.GetSheHe] n'a pas déposé de plainte formelle. [minister.GetSheHe] a fait pire : être parfaitement correcte, précisément obéissante et froide d'une manière que tout le cabinet a remarquée.\n\nCela ne peut durer sans devenir quelque chose de plus grave."

 cc_wc.51.a: "Compenser [minister.GetName]. De l'or et une reconnaissance formelle que le refus était une erreur."
 cc_wc.51.a.tooltip: "Un règlement matériel — [minister.GetName] reçoit de l'or et de la reconnaissance. Les comptes sont soldés et [minister.GetSheHe] grandit grâce à cette résolution."

 cc_wc.51.b: "Accorder à [minister.GetName] un honneur symbolique devant le conseil."
 cc_wc.51.b.tooltip: "Un coût modeste en prestige pour une reconnaissance publique. Les relations s'améliorent légèrement, mais la friction sous-jacente est notée plutôt que résolue."

 cc_wc.51.c: "Congédier [minister.GetName]. Un général rancunier au sein du cabinet est un handicap."
 cc_wc.51.c.tooltip: "Coût de stabilité pour la perturbation. [minister.GetName] s'en va en emportant [minister.GetHerHis] grief — et pourrait trouver des moyens de l'exprimer en dehors du cabinet."

 cc_wc.51.d: "Ignorez cela. Les ministres servent au bon vouloir de la Couronne, et non l'inverse."
 cc_wc.11.desc: "[minister.GetName] a présenté un audit détaillé des échecs logistiques de la dernière campagne. [minister.GetHerHis|c] proposition pour un commissariat réformé éliminerait le gaspillage et l'attrition qui ont coûté si cher à l'armée — mais l'investissement initial est substantiel."
 cc_wc.50.desc: "[minister.GetName] n'élève pas [minister.GetHerHis] voix. [minister.GetSheHe] n'en a pas besoin. L'engagement a été pris dans cette même chambre — qu'il n'y aurait pas de paix avant la victoire totale. Les mots étaient là pour être acceptés ou refusés, et nous les avons acceptés. Maintenant, la dépêche rapportant les conditions de la paix est arrivée, et [minister.GetName] la lit avec une expression qui dit tout ce que [minister.GetSheHe] ne dira pas à haute voix.\n\nLa façon dont nous répondrons dans l'heure qui suit déterminera si ce ministère survit à la fin de la guerre."
 cc_wc.51.d.tooltip: "[minister.GetName] interprète correctement le silence. [minister.GetHerHis] conformité devient un ressentiment formel — le cabinet remarquera dans quelle direction les choses ont évolué."
