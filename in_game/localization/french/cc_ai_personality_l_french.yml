l_french:

 # ---------------------------------------------------------------------------
 # Drift Events
 # ---------------------------------------------------------------------------

 cc_personality.1.title: "Les vents de la guerre"
 cc_personality.1.desc: "Avec nos armées sur le terrain et l'odeur de la fumée portée par le vent, le conseil s'affronte sur la manière de tirer profit de notre avantage — s'il faut frapper plus fort ou préserver nos acquis."

 cc_personality.1.a: "Poursuivons l'attaque — ne faites aucune merci."
 cc_personality.1.b: "Maintenir nos positions — ne pas trop s'étendre."

 cc_personality.2.title: "Ambitions impériales"
 cc_personality.2.desc: "En temps de paix et au sommet de notre puissance, les grands ministres d'État débattent de la voie à suivre. Devons-nous tendre la main pour saisir ce que nous pouvons, ou observer et attendre le moment opportun ?"

 cc_personality.2.a: "Étendre nos frontières et notre influence."
 cc_personality.2.b: "Patience — exploitez les faiblesses des autres lorsqu'elles se présentent."

 cc_personality.3.title: "Le temps de la prudence"
 cc_personality.3.desc: "Notre prestige est diminué et nos rivaux nous surveillent attentivement. Le conseil exhorte la couronne à agir avec prudence — mais à quel point ?"

 cc_personality.3.a: "Fortifier notre position contre toutes les menaces."
 cc_personality.3.b: "Une diplomatie prudente avant tout — évitez la provocation."

 cc_personality.4.title: "Commerce et Diplomatie"
 cc_personality.4.desc: "Notre trésor est plein et nos marchands prospèrent. La question posée au conseil est de savoir s'il faut utiliser cette richesse pour forger des amitiés ou pour profiter discrètement de ceux qui nous entourent."

 cc_personality.4.a: "Établissez des alliances et de la bonne volonté — l'or achète des amis."
 cc_personality.4.b: "Laissez les autres voir notre richesse comme une opportunité — guettez les ouvertures."

 cc_personality.5.title: "Une question de stratégie"
 cc_personality.5.desc: "La cour délibère sur l'orientation stratégique du royaume. Les anciennes certitudes se sont effacées ; une nouvelle approche doit être choisie."

 cc_personality.5.aggressive: "Nous devons dominer — frapper avant que les autres ne nous frappent."
 cc_personality.5.expansionist: "Étendre notre influence — les frontières ne sont permanentes qu'à la mesure de notre volonté."
 cc_personality.5.defensive: "Préserver nos acquis — la force réside dans l'endurance."
 cc_personality.5.cautious: "Une diplomatie prudente et un risque mesuré — ne jamais surestimer ses forces."
 cc_personality.5.opportunistic: "Observez l'échiquier, agissez quand les autres trébuchent."
 cc_personality.5.isolationist: "Tournons-nous vers l'intérieur — notre force réside dans nos propres terres."
 cc_personality.5.friendly: "Alliances et bonne volonté — un État apprécié est un État en sécurité."

 # ---------------------------------------------------------------------------
 # Ottoman Inflection Events
 # ---------------------------------------------------------------------------

 cc_personality.10.title: "Le sultan conquérant"
 cc_personality.10.desc: "L'empire est au sommet de sa puissance. Notre grand sultan a brisé l'Égypte mamelouke, humilié les Perses et planté le croissant sur les Balkans. Le monde tremble devant nous. Maintenant — comment tirer profit de notre avantage ?"

 cc_personality.10.a: "Il n'y a pas de paix — seulement la conquête. En avant, toujours en avant."
 cc_personality.10.b: "Nos frontières sont vastes. Nous devons nous étendre avec discipline, et non avec fureur."

 cc_personality.11.title: "La longue stagnation"
 cc_personality.11.desc: "L'époque des conquêtes éclair est derrière nous. Nos frontières sont défendues par de grandes forteresses mais sont rarement repoussées. Les Janissaires se querellent, les vizirs complotent et le trésor s'épuise. Nous devons choisir notre posture dans un monde plus difficile."

 cc_personality.11.a: "Défendre ce que nous détenons — l'empire est trop vaste pour être risqué dans une guerre téméraire."
 cc_personality.11.b: "La prudence avant tout — maintenez par la diplomatie ce que nous ne pouvons gagner par la force."

 # ---------------------------------------------------------------------------
 # France / England Inflection Events
 # ---------------------------------------------------------------------------

 cc_personality.20.title: "Le Roi-Soleil s'élève"
 cc_personality.20.desc: "L'ère d'une nouvelle époque s'ouvre. Le roi ordonne que la France domine l'Europe — par la diplomatie là où c'est possible, par la guerre là où c'est nécessaire. La cour de Versailles rayonne d'une confiance absolue. La France est destinée à l'hégémonie. Seule la méthode reste à définir."

 cc_personality.20.a: "La guerre est l'instrument des rois. Nous imposerons notre volonté."
 cc_personality.20.b: "L'hégémonie par la finesse — faire en sorte que les autres nous craignent sans provoquer de coalition."

 cc_personality.21.title: "L'Empire maritime de Britannia"
 cc_personality.21.desc: "L'ère du comptoir commercial cède la place à l'ère de l'empire. Notre marine commande les mers et nos colonies s'étendent sur des continents. La question est de savoir si la Grande-Bretagne doit simplement commercer — ou régner."

 cc_personality.21.a: "Gouverner, et pas seulement commercer. Nous projetterons notre puissance partout où flotte notre drapeau."
 cc_personality.21.b: "Un empire maritime tire le meilleur parti de la flexibilité — exploitez, ne vous surengagez pas."

 # ---------------------------------------------------------------------------
 # Muscovy Inflection Event
 # ---------------------------------------------------------------------------

 cc_personality.30.title: "Le tsar terrible"
 cc_personality.30.desc: "Le nouveau tsar gouverne autant par la peur que par la loi. Son oprichnina purge ses rivaux, ses armées frappent à l'est et à l'ouest sans merci. La Russie sera grande — par le sang s'il le faut. Les boyards tremblent. La question est de savoir jusqu'où cette fureur nous mènera."

 cc_personality.30.a: "Pas de merci. La Russie progresse par la seule force de sa volonté."
 cc_personality.30.b: "S'étendre délibérément — nous n'avons pas besoin de détruire ce que nous pouvons simplement prendre."

 # ---------------------------------------------------------------------------
 # Castile Inflection Event
 # ---------------------------------------------------------------------------

 cc_personality.40.title: "L'empire du Nouveau Monde"
 cc_personality.40.desc: "L'or afflue des Amériques. Nos conquistadors ont revendiqué la moitié d'un monde au nom de la couronne et de la foi. Nous nous tenons au centre d'un empire mondial comme l'histoire n'en a jamais vu. La question est de savoir comment nous utiliserons ce pouvoir."

 cc_personality.40.a: "Croisade et conquête — le monde s'inclinera devant la foi et la couronne."
 cc_personality.40.b: "Bâtissez un empire durable — développez-vous avec ordre, et pas seulement par le feu."

 # ---------------------------------------------------------------------------
 # Sweden Inflection Event
 # ---------------------------------------------------------------------------

 # ---------------------------------------------------------------------------
 # Four-Yearly Deep Analysis Events (60-65)
 # ---------------------------------------------------------------------------

 cc_personality.60.title: "Le royaume épuisé"
 cc_personality.60.desc: "Nos armées marchent depuis des années et le peuple est las. L'épuisement de guerre ronge chaque recoin du royaume — les levées sont épuisées, le trésor à bout, et les nobles murmurent qu'est venue une ère sans repos. Le conseil doit décider de la manière dont nous ferons face au monde désormais."

 cc_personality.60.a: "Défendre ce que nous avons — plus d'aventures coûteuses."
 cc_personality.60.b: "Une diplomatie prudente avant tout — nous ne pouvons pas nous permettre une autre guerre."

 cc_personality.61.title: "Ambition du vainqueur"
 cc_personality.61.desc: "Nos armées ont connu bien des guerres, pourtant elles restent fortes — nos ennemis se sont effondrés devant nous à maintes reprises. Le peuple regarde la couronne avec fierté, les soldats avec détermination. C'est le moment où se bâtissent les empires. Que faisons-nous de ce pouvoir ?"

 cc_personality.61.a: "Nous dominons. Frappons fort, frappons les premiers, et ne laissons aucun doute sur notre suprématie."
 cc_personality.61.b: "S'étendre avec détermination — revendiquer ce qui nous revient, frontière après frontière."

 cc_personality.62.title: "Encerclé de toutes parts"
 cc_personality.62.desc: "Les grandes puissances nous regardent avec convoitise. Des États rivaux ont soulevé leurs nobles contre nous, ont murmuré des paroles de coalition et ont testé nos frontières. Le conseil débat de la manière de survivre dans un monde qui semble se refermer sur nous."

 cc_personality.62.a: "Tout fortifier — nous rendre trop coûteux à attaquer."
 cc_personality.62.b: "Tournons-nous vers l'intérieur — laissons les grandes puissances se quereller entre elles."
 cc_personality.62.c: "Naviguez avec prudence — maintenez chaque ennemi potentiel dans l'incertitude quant à nos intentions."

 cc_personality.63.title: "Un royaume en plein tumulte"
 cc_personality.63.desc: "Les sujets grognent, la loyauté vacille et notre prestige mondial diminue. Le royaume n'est pas brisé, mais il est sous tension — et un faux pas maintenant pourrait transformer le mécontentement en rébellion. Le conseil recommande la prudence avant tout."

 cc_personality.63.a: "Une gouvernance prudente et réfléchie — rétablissez la confiance avant de rechercher la gloire."
 cc_personality.63.b: "Renforcer nos défenses — s'assurer que notre emprise sur le royaume ne puisse être brisée."

 cc_personality.64.title: "L'opportunité impériale"
 cc_personality.64.desc: "Nous nous trouvons à un moment rare : une grande puissance en paix, notre trésor plein, nos rivaux affaiblis. Le monde est à nous de le façonner — si nous choisissons de nous en emparer. La cour débat avec excitation du chemin qui s'offre à nous."

 cc_personality.64.a: "Étendre notre portée — cette richesse et cette force doivent se traduire par une domination durable."
 cc_personality.64.b: "C'est notre moment — frappons avant que nos rivaux ne s'unissent contre nous."
 cc_personality.64.c: "Rester flexible — exploiter les opportunités au fur et à mesure plutôt que de s'engager dans une direction unique."

 cc_personality.65.title: "La voie du Marchand"
 cc_personality.65.desc: "Nos coffres débordent et nos marchands prospèrent dans les ports du monde entier. Nous avons évité les guerres ruineuses qui ont saigné nos voisins à blanc. La question posée au conseil est de savoir quoi faire de cette prospérité — et quel type de puissance nous souhaitons être."

 cc_personality.65.a: "La richesse est un levier — utilisez-la pour exploiter les vulnérabilités d'autrui."
 cc_personality.65.b: "Investir dans la bonne volonté — les alliés et les amis sont le rempart le plus sûr de la prospérité."

 cc_personality.50.title: "Le Grand Règlement de Comptes du Nord"
 cc_personality.50.desc: "L'ère de la gloire impériale suédoise est terminée. La Grande Guerre du Nord a brisé notre empire baltique, et la Russie se tient désormais là où la Suède dominait autrefois. Nous devons reconstruire — mais sous quelle forme ? Fortifions-nous et endurons-nous, ou traçons-nous un chemin plus prudent ?"

 cc_personality.50.a: "La Suède perdure. Nous défendons ce qui reste et reconstruisons avec force."
 cc_personality.50.b: "L'ère de l'ambition est passée. La prudence et la circonspection doivent désormais nous guider."
