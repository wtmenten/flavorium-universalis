l_french:
 # ============================================================
 # Cabinet Experience — service record interaction
 #
 # Saved scopes are referenced WITHOUT the scope: prefix, matching
 # [cc_engage_subject.GetName] in cc_subject_bonds_l_english.yml. Writing
 # [scope:cc_xp_subject.GetName] here parses but resolves to nothing in game.
 # ============================================================
 # NOTE ON KEYS. A character interaction needs more than <name> and <name>_desc:
 #   <name>_desc_specific  the description once a target IS selected, and the one the
 #                         engine complains about by name if it is missing
 #   <name>_act            the verb shown on the confirm button, conventionally "$<name>$"
 #   <name>_past           the message headline after it resolves (needs message = yes)
 #   <name>_act_past       the message body after it resolves
 # Interaction loc uses [SCOPE.sCharacter('recipient')], NOT the bare saved-scope form
 # that event loc uses. See promote_to_head_of_cabinet in the vanilla localisation.
 cc_xp_inspect_service_record: "Lire le dossier de service"
 cc_xp_inspect_service_record_desc: "Demandez aux clercs d'apporter tout ce que les archives de la couronne contiennent sur l'un de vos ministres : ce qu'ils ont accompli, ce dans quoi ils excellent et le chemin qu'il leur reste à parcourir."
 cc_xp_inspect_service_record_desc_specific: "Les clercs vont sortir le dossier de [SCOPE.sCharacter('recipient').GetName]."
 cc_xp_inspect_service_record_act: "$cc_xp_inspect_service_record$"
 cc_xp_inspect_service_record_past: "Dossier de service lu"
 cc_xp_inspect_service_record_act_past: "La couronne a examiné le dossier de [SCOPE.sCharacter('recipient').GetName]."
 cc_xp_choose_minister: "Le dossier de qui ?"

 # ============================================================
 # Cabinet Experience — service record readout (cc_xp.1)
 # ============================================================
 cc_xp.1.title: "L'état des services"
 cc_xp.1.desc: "Les clercs tiennent un dossier sur [cc_xp_subject.GetName], comme ils en tiennent un sur chaque officier de la couronne. C'est une lecture plus aride que les ragots de la cour, mais bien plus fiable.\n\n#Y ANCIENNETÉ#!\nNiveau [cc_xp_subject.MakeScope.GetVariable('cc_level').GetValue|0] sur 10, avec [cc_xp_subject.MakeScope.GetVariable('cc_xp_total').GetValue|0] d'expérience. Le niveau suivant est atteint à [cc_xp_subject.MakeScope.GetVariable('cc_xp_next').GetValue|0].\n\n#Y SPÉCIALISATION#!\nAdministration : [cc_xp_subject.MakeScope.GetVariable('cc_xp_adm').GetValue|0], rang [cc_xp_subject.MakeScope.GetVariable('cc_tier_adm').GetValue|0] sur 3\nDiplomatie : [cc_xp_subject.MakeScope.GetVariable('cc_xp_dip').GetValue|0], rang [cc_xp_subject.MakeScope.GetVariable('cc_tier_dip').GetValue|0] sur 3\nGuerre : [cc_xp_subject.MakeScope.GetVariable('cc_xp_mil').GetValue|0], rang [cc_xp_subject.MakeScope.GetVariable('cc_tier_mil').GetValue|0] sur 3\nLes rangs sont atteints à 150, 500 et 1200 d'expérience dans cette voie uniquement.\n\n#Y SERVICE#!\nCe dont le dossier est réellement composé. Chaque entrée correspond à un devoir mené à son terme.\nCampagnes et commandements : [cc_xp_subject.MakeScope.GetVariable('cc_tf_war').GetValue|0]\nRéformes et administration : [cc_xp_subject.MakeScope.GetVariable('cc_tf_reform').GetValue|0]\nEntreprises coloniales : [cc_xp_subject.MakeScope.GetVariable('cc_tf_colonial').GetValue|0]\nQuestions de foi : [cc_xp_subject.MakeScope.GetVariable('cc_tf_faith').GetValue|0]\nCommerce et revenus : [cc_xp_subject.MakeScope.GetVariable('cc_tf_trade').GetValue|0]\n\n#Y STATUT ACTUEL#!\n[SelectLocalization(cc_xp_subject.MakeScope.GetVariable('cc_protege').IsSet, 'CC_XP_REC_PROTEGE', 'CC_XP_REC_NOT_PROTEGE')]\n[SelectLocalization(cc_xp_subject.MakeScope.GetVariable('cc_xp_mentor_track').IsSet, 'CC_XP_REC_MENTORED', 'CC_XP_REC_NOT_MENTORED')]\n[SelectLocalization(cc_xp_subject.MakeScope.GetVariable('cc_xp_school').IsSet, 'CC_XP_REC_SCHOOLED', 'CC_XP_REC_NOT_SCHOOLED')]\n[SelectLocalization(cc_xp_subject.MakeScope.GetVariable('cc_xp_is_patron').IsSet, 'CC_XP_REC_PATRON', 'CC_XP_REC_NOT_PATRON')]\n[SelectLocalization(cc_xp_subject.MakeScope.GetVariable('cc_xp_seconded').IsSet, 'CC_XP_REC_ABROAD', 'CC_XP_REC_HOME')]\n\nL'ancienneté est ce qu'un ministre a vécu. La spécialisation est ce qu'il a réellement appris à faire, et c'est la spécialisation qui détermine quels traits sont à sa portée."
 cc_xp.1.a: "Fermer le dossier."

 # ============================================================
 # Cabinet Experience — ladder advancement (cc_xp.10)
 # ============================================================
 cc_xp.10.title: "Un ministre s'affirme"
 cc_xp.10.desc: "Il n'y a pas de cérémonie pour cela et aucune annonce, mais tout le monde à la cour peut le voir. [cc_xp_subject.GetName] a cessé d'être quelqu'un qui occupe un poste pour devenir quelqu'un autour duquel le poste est construit. Le travail qui leur prenait autrefois une saison prend désormais une quinzaine de jours, et les clercs ont discrètement cessé de le vérifier.\n\nL'expérience a porté [cc_xp_subject.GetName] à l'étape suivante de sa carrière. Leur nouveau rang figure à leur dossier, et sur leur fiche au cabinet."
 cc_xp.10.a: "La compétence devrait être sa propre récompense. C'est rarement le cas."

 # ============================================================
 # Cabinet Experience — court examination (cc_xp.11)
 # ============================================================
 cc_xp.11.title: "La Cour passe un examen"
 cc_xp.11.desc: "[cc_xp_examiner.GetName] a présidé, ce qui était le choix prudent et également le bon. Les questions avaient été fixées à l'avance et scellées, les réponses lues, et un bon nombre de réputations ont été discrètement entachées au cours d'un seul après-midi.\n\nLe résultat que personne n'avait prédit fut [cc_xp_subject.GetName], qui a répondu aux questions les plus difficiles sans notes, avant de s'excuser d'avoir pris autant de temps. Tous ceux qui ont passé l'examen en ont tiré un enseignement. [cc_xp_subject.GetName] en a tiré bien plus.\n\nLes bourgeois sont ravis que l'avancement puisse se gagner dans une pièce à porte close. La noblesse l'est moins, pour la même raison."
 cc_xp.11.a: "Notez le nom. Nous en aurons à nouveau besoin."

 # ============================================================
 # Cabinet Experience — training interactions
 # ============================================================
 cc_xp_train_adm: "Envoyer à la Chancellerie"
 cc_xp_train_adm_desc: "Détachez-les auprès des greffiers principaux pendant un semestre : statuts, précédents, revenus et la patience particulière requise pour lire un grand livre que quelqu'un d'autre a truqué. Ils seront absents pendant toute la durée, et l'expérience les accompagnera à leur retour. Un ministre qui n'a pas encore de carrière s'en verra proposer une à son retour, à moins que l'affectation ne se passe mal."
 cc_xp_train_adm_desc_specific: "[SCOPE.sCharacter('recipient').GetName] partira pour la chancellerie et reviendra dans environ six mois avec de l'expérience administrative."
 cc_xp_train_adm_act: "$cc_xp_train_adm$"
 cc_xp_train_adm_past: "Parti pour la Chancellerie"
 cc_xp_train_adm_act_past: "[SCOPE.sCharacter('recipient').GetName] s'est rendu à la chancellerie et ne sera pas disponible pendant six mois."
 cc_xp_train_dip: "Envoyer en tournée diplomatique"
 cc_xp_train_dip_desc: "Une année sur la route : toutes les cours qui comptent, transportant des lettres sans importance pour qu'ils puissent observer comment les plus importantes sont livrées. Le plus long des trois affectations, car c'est celle qui implique de se déplacer réellement. Un ministre qui n'a pas encore de carrière s'en verra proposer une à son retour, à moins que l'affectation ne se passe mal."
 cc_xp_train_dip_desc_specific: "[SCOPE.sCharacter('recipient').GetName] partira pour un circuit d'ambassades et reviendra dans environ un an avec de l'expérience diplomatique."
 cc_xp_train_dip_act: "$cc_xp_train_dip$"
 cc_xp_train_dip_past: "Parti pour le circuit des ambassades"
 cc_xp_train_dip_act_past: "[SCOPE.sCharacter('recipient').GetName] a entamé son circuit diplomatique et sera à l'étranger pendant un an."
 cc_xp_train_mil: "Envoyer à l'École d'État-Major"
 cc_xp_train_mil_desc: "Trois trimestres de cartes, de tableaux d'approvisionnement et de la compagnie d'officiers ayant réellement perdu une bataille et acceptant de le dire. Ils ne vous seront d'aucune utilité à la cour avant la fin du cours. Un ministre qui n'a pas encore de carrière s'en verra proposer une à son retour, à moins que l'affectation ne se passe mal."
 cc_xp_train_mil_desc_specific: "[SCOPE.sCharacter('recipient').GetName] se rendra à l'école d'état-major et reviendra dans environ neuf mois avec de l'expérience militaire."
 cc_xp_train_mil_act: "$cc_xp_train_mil$"
 cc_xp_train_mil_past: "Parti pour l'École d'État-Major"
 cc_xp_train_mil_act_past: "[SCOPE.sCharacter('recipient').GetName] s'est présenté à l'école d'état-major et y restera neuf mois."
 cc_xp_choose_trainee: "Qui doit être envoyé ?"

 # ============================================================
 # Cabinet Experience — proteges and mentorship
 # ============================================================
 cc_xp_sponsor_protege: "Prendre un protégé"
 cc_xp_sponsor_protege_desc: "Intéressez-vous à quelqu'un en dehors du cabinet : payez son entretien, ouvrez les bonnes portes et préparez un successeur avant d'en avoir besoin. La cour propose les quatre candidats les plus accomplis et vous choisissez parmi eux. Les protégés acquièrent lentement de l'expérience par eux-mêmes, mais peuvent être formés et mentorés comme tout autre ministre. Trois à la fois. La noblesse n'apprécie pas que la couronne s'intéresse à des gens qu'elle n'a pas recommandés."
 cc_xp_choose_protege: "Qui a attiré votre attention ?"
 cc_xp_release_protege: "Libérer un protégé"
 cc_xp_release_protege_desc: "Retirez l'intérêt de la couronne et libérez la place pour quelqu'un d'autre. Rien de ce qu'ils ont appris ne leur est retiré ; si vous les nommez plus tard, ou les reprenez en service, tout figure toujours au dossier."
 cc_xp_release_protege_desc_specific: "[SCOPE.sCharacter('recipient').GetName] cessera d'être un protégé de la couronne. Rien de ce qu'il a appris ne lui sera retiré."
 cc_xp_release_protege_act: "$cc_xp_release_protege$"
 cc_xp_release_protege_past: "Patronage terminé"
 cc_xp_release_protege_act_past: "[SCOPE.sCharacter('recipient').GetName] n'est plus un protégé de la couronne."
 cc_xp_choose_released_protege: "Dont le patronage prend fin ?"
 cc_xp_assign_mentor: "Assigner un mentor"
 cc_xp_assign_mentor_desc: "Mettez le temps d'un ministre senior à la disposition d'un junior pendant une décennie. L'élève gagne chaque année de l'expérience dans le domaine où son mentor est le plus fort, ce qui permet d'orienter une carrière plutôt que de simplement l'accélérer. Ce qui a été enseigné survit à l'enseignant."
 cc_xp_assign_mentor_desc_specific: "[SCOPE.sCharacter('recipient').GetName] prendra un cadet sous son aile pour la prochaine décennie et lui enseignera ce qu'il maîtrise le mieux. Vous choisissez qui."
 cc_xp_assign_mentor_act: "$cc_xp_assign_mentor$"
 cc_xp_assign_mentor_past: "Un mentorat commence"
 cc_xp_assign_mentor_act_past: "[SCOPE.sCharacter('recipient').GetName] a pris un élève."
 cc_xp_choose_mentor: "Qui enseigne ?"
 cc_xp_choose_student: "Qui apprend ?"

 # ============================================================
 # Cabinet Experience — court examination
 # ============================================================
 cc_xp_court_examination: "Organiser un examen de cour"
 cc_xp_court_examination_desc: "Commander un examen formel de toute la cour : questions scellées, réponses lues à haute voix, et réputations tranchées en un après-midi. Cela prend un demi-an pour être organisé. Tous ceux qui y participent gagnent de l'expérience, et l'un d'entre eux s'en sortira manifestement mieux que prévu. Coûteux, et ne doit pas être répété avant une décennie."
 cc_xp_court_examination_desc_specific: "[SCOPE.sCharacter('recipient').GetName] passera les six prochains mois à organiser un examen formel de l'ensemble de la cour, et y présidera."
 cc_xp_court_examination_act: "$cc_xp_court_examination$"
 cc_xp_court_examination_past: "Un examen commandé"
 cc_xp_court_examination_act_past: "[SCOPE.sCharacter('recipient').GetName] a commencé à préparer les questions. La cour siégera dans six mois."
 cc_xp_choose_examiner: "Qui préside ?"

 # ============================================================
 # Cabinet Experience — modifiers
 # ============================================================
 STATIC_MODIFIER_NAME_cc_xp_service_record: "Ministre expérimenté"
 STATIC_MODIFIER_DESC_cc_xp_service_record: "Les années de fonction ont appris à ce ministre où se trouvent les leviers et quels clercs répondent réellement à leurs lettres. L'effet s'accroît avec chaque niveau d'ancienneté."

 # ============================================================
 # Cabinet Experience — returns from a posting (cc_xp.30-32)
 #
 # Line breaks inside a value must be the two-character escape backslash-n.
 # A real newline in the .yml truncates the value at that point.
 # ============================================================
 cc_xp.30.title: "De retour de la Chancellerie"
 cc_xp.30.desc: "[cc_xp_subject.GetName] revient après six mois parmi les greffiers principaux avec un air légèrement hanté, ce qui est la réaction normale après avoir lu l'intégralité des comptes du royaume.\n\nIls ont rapporté une liste. Plusieurs éléments n'ont été remis en question par personne depuis trente ans, et au moins deux d'entre eux seront embarrassants. Voilà à quoi ressemble la compétence au début : elle crée plus de travail avant d'en réduire."
 cc_xp.30.a: "Lire la liste."

 cc_xp.31.title: "De retour du Circuit"
 cc_xp.31.desc: "Une année dans les cours d'autrui a changé [cc_xp_subject.GetName]. Ils sont partis avec des lettres sans importance, et ont passé leur temps à observer comment les lettres importantes étaient remises, qui était dans la pièce lors de la remise, et qui y était ostensiblement absent.\n\nIls ont désormais des opinions sur des ambassadeurs en qui nous avons confiance depuis une décennie. Certaines de ces opinions sont dérangeantes. Toutes sont précises."
 cc_xp.31.a: "La précision a plus de valeur que la tactique."

 cc_xp.32.title: "De retour de l'École d'État-Major"
 cc_xp.32.desc: "[cc_xp_subject.GetName] revient après neuf mois de cartes, de tableaux d'approvisionnement et de compagnie d'officiers ayant perdu des batailles et acceptant de le dire haut et fort.\n\nIls parlent désormais de routes, de dépôts, et de la distance qu'un homme peut parcourir avant de cesser d'être un soldat pour devenir un problème. C'est nettement moins exaltant que leur façon de parler avant leur départ, et nettement plus utile."
 cc_xp.32.a: "La gloire découle de la logistique."
 # ============================================================
 # Cabinet Experience — posting outcomes (phase 5)
 #
 # Each return event has three descs: good / poor / ordinary. The ordinary one
 # already exists above; these are the tails.
 # ============================================================
 cc_xp.30.desc.good: "[cc_xp_subject.GetName] est revenu prématurément de la chancellerie, ce que les greffiers principaux affirmaient être impossible, avant d'en produire la raison : une réconciliation de trois districts fiscaux que personne n'avait réussi à réconcilier depuis le règne précédent.\n\nIls ne s'en vantent pas. C'est d'une certaine manière pire. Quoi qu'ils aient été envoyés apprendre, ils semblent l'avoir appris et avoir continué bien au-delà."
 cc_xp.30.desc.poor: "La chancellerie a été polie à ce sujet. [cc_xp_subject.GetName] y a assisté, a pris des notes et est revenu avec une compréhension fonctionnelle du système d'archivage, et très peu d'autre chose.\n\nUne partie de cela est due au poste : six mois parmi des hommes qui ont passé trente ans à garder leurs propres procédures ne constituent pas six mois d'enseignement. Une autre partie n'est pas due au poste. L'argent est dépensé dans les deux cas."
 cc_xp.31.desc.good: "[cc_xp_subject.GetName] était censé porter des lettres. Quelque part vers la troisième cour, ils ont cessé d'être la personne qui les portait pour devenir la personne à qui elles étaient adressées, et personne ne peut dire précisément quand cela est arrivé.\n\nIls sont revenus avec leur propre correspondance, trois invitations permanentes et un sens très clair de lequel de nos alliés nous ment."
 cc_xp.31.desc.poor: "Une année à l'étranger, et [cc_xp_subject.GetName] est revenu avec des impressions plutôt que des renseignements. Les cours étaient splendides. La nourriture était étrange. Tout le monde a été très aimable.\n\nCe n'est pas qu'ils n'ont rien appris. C'est que ce qu'ils ont appris aurait tenu confortablement dans une saison, et nous en avons payé quatre."
 cc_xp.32.desc.good: "L'école d'état-major ne distribue pas de distinctions, au motif que la guerre n'en distribue pas non plus. Elle a fait une exception concernant le problème de ravitaillement de [cc_xp_subject.GetName], qui avait été posé comme exercice et résolu d'une manière que les instructeurs n'avaient pas envisagée.\n\nIls sont revenus avec la solution écrite, et avec les noms de quatre officiers qui ont discuté avec eux à ce sujet et ont perdu."
 cc_xp.32.desc.poor: "[cc_xp_subject.GetName] a terminé le cursus. Le rapport des instructeurs est un chef-d'œuvre d'art pour ne rien dire de méchant avec beaucoup de mots.\n\nIls savent désormais lire un tableau d'approvisionnement, ce qui est plus que ce qu'ils savaient auparavant. Ils ne savent pas encore en regarder un et savoir ce qui ne va pas, ce qui est la partie essentielle."
 
 # ============================================================
 # Cabinet Experience — weariness at the top (cc_xp.40)
 # ============================================================
 cc_xp.40.title: "Les longs services d'un bon serviteur"
 cc_xp.40.desc: "[cc_xp_subject.GetName] a servi cette couronne pendant plus de vingt ans et est, selon tous les critères que la cour sait appliquer, au sommet de ses pouvoirs. Le travail est toujours fait. C'est simplement qu'il prend plus de temps qu'auparavant, et qu'il est vérifié plus souvent, et il y a une fatigue particulière dans ces vérifications.\n\nPersonne n'a rien dit. Personne ne le fera. La question est de savoir si la couronne s'en apercevra avant que l'erreur ne survienne."
 cc_xp.40.a: "Envoyez-les dans leurs domaines pendant un an. Nous nous débrouillerons."
 cc_xp.40.b: "Il n'y a personne d'autre. Ils restent au bureau."
 
 # ============================================================
 # Cabinet Experience — institutional memory (cc_xp.41)
 # ============================================================
 cc_xp.41.title: "Ce qu'il reste derrière"
 cc_xp.41.desc: "Une carrière d'une telle longueur ne s'achève pas avec la mort de l'homme. [cc_xp_departed.GetName] a laissé derrière lui un système de classement que la moitié de la chancellerie n'a jamais remis en question, un réseau de contacts qui écrivent désormais à quiconque occupe le poste, et une manière de faire les choses qui n'a jamais été consignée par écrit et qui est suivie à la lettre.\n\n[cc_xp_subject.GetName] a travaillé à leurs côtés assez longtemps pour en avoir absorbé une bonne partie, mostly sans s'en rendre compte. Ce n'est pas la même chose que de l'avoir mérité. Mais ce n'est pas rien non plus."
 cc_xp.41.a: "Les institutions se souviennent. Imparfaitement, mais elles se souviennent."
 
 # ============================================================
 # Cabinet Experience — rivalry of equals (cc_xp.42)
 # ============================================================
 cc_xp.42.title: "Deux gouttes d'eau"
 cc_xp.42.desc: "[cc_xp_subject.GetName] et [cc_xp_rival.GetName] sont tous deux très doués pour la même chose, ce qui pose problème. Il n'y a qu'une seule place de prestige disponible dans ce domaine à cette cour, et deux personnes qualifiées pour l'occuper.\n\nCela ne s'est pas transformé en hostilité ouverte. C'est devenu quelque chose de plus fastidieux : un travail doublon, des mémorandums écrits pour être lus par un tiers, et l'habitude de découvrir des problèmes dans les propositions de l'autre un peu trop tard pour les corriger discrètement.\n\nLa couronne peut régler l'affaire, ou s'en désintéresser."
 cc_xp.42.a: "Soutenir [cc_xp_subject.GetName]. L'autre devra faire avec."
 cc_xp.42.b: "Laissez-les s'affronter. La rivalité aiguise les esprits, jusqu'à un certain point."
 cc_xp.42.c: "Assignez-leur le même problème et faites-les signer conjointement. (Prestige)"
 
 # ============================================================
 # Cabinet Experience — phase 5 modifiers
 # ============================================================
 STATIC_MODIFIER_NAME_cc_xp_weary: "Usé"
 STATIC_MODIFIER_DESC_cc_xp_weary: "Deux décennies au sommet de leur profession, sans aucun repos accordé. Toujours les meilleurs dans la pièce, et pourtant plus tout à fait ce qu'ils étaient."
 STATIC_MODIFIER_NAME_cc_xp_professional_rival: "Rival professionnel"
 STATIC_MODIFIER_DESC_cc_xp_professional_rival: "Partager une spécialité avec quelqu'un d'aussi accompli, et consacrer discrètement ses efforts au partage plutôt qu'à la spécialité elle-même."
 cc_xp_sponsor_artist: "Parrainer un artiste"
 cc_xp_sponsor_artist_desc: "Engagez le nom et l'argent d'un ministre pour soutenir un artiste pendant une génération. La couronne gagne un léger flux de prestige tant que l'arrangement dure, et le ministre gagne de l'expérience diplomatique : le mécénat est un travail de réputation, mené autour des tables de dîner. Un artiste par ministre."
 cc_xp_sponsor_artist_desc_specific: "[SCOPE.sCharacter('recipient').GetName] sera placé sous le mécénat de la couronne, et la couronne gagnera du prestige tant que cet arrangement durera. Vous choisissez quel ministre y appose son nom."
 cc_xp_sponsor_artist_act: "$cc_xp_sponsor_artist$"
 cc_xp_sponsor_artist_past: "Un mécénat commence"
 cc_xp_sponsor_artist_act_past: "[SCOPE.sCharacter('recipient').GetName] travaille désormais sous le mécénat de la cour."
 cc_xp_choose_patron: "Qui prête son nom ?"
 cc_xp_choose_artist: "L'œuvre de qui ?"
 cc_xp_sell_art_discreetly: "Vendre une œuvre discrètement"
 cc_xp_sell_art_discreetly_desc: "Demandez à un ministre d'organiser une vente discrète à l'étranger. Aucune contrepartie n'est nommée, aucune offre n'est refusée, et le prix est donc inférieur à ce qu'une négociation ouverte rapporterait. Les quatre pièces les plus précieuses dont la collection pourrait convenablement se séparer sont proposées ; la noblesse remarque quel mur se vide."
 cc_xp_choose_broker: "Qui l'organise ?"
 cc_xp_choose_work: "Quelle œuvre ?"
 cc_xp_no_sellable_work: "Il n'y a rien dans la collection qui puisse être vendu convenablement."
 cc_xp_sell_art_move_tt: "L'œuvre quitte le royaume pour un acheteur à l'étranger."
 cc_xp_found_institution: "Institution trouvée"
 cc_xp_found_institution_desc_specific: "[SCOPE.sCharacter('recipient').GetName] fondera une école enseignant sa propre discipline. Elle lui survivra."
 cc_xp_found_institution_act: "$cc_xp_found_institution$"
 cc_xp_found_institution_past: "Une institution fondée"
 cc_xp_found_institution_act_past: "L'école de [SCOPE.sCharacter('recipient').GetName] ouvre ses portes. Elle lui survivra."
 cc_xp_choose_founder: "Qui la fonde ?"
 cc_xp_choose_student_school: "Qui s'inscrit ?"
 cc_xp_choose_school_by_member: "Sous quelle école ?"
 cc_xp_host_soiree: "Organiser une soirée"
 cc_xp_host_soiree_desc_specific: "[SCOPE.sCharacter('recipient').GetName] organisera une soirée à la cour dans quelques semaines."
 cc_xp_host_soiree_act: "$cc_xp_host_soiree$"
 cc_xp_host_soiree_past: "Une soirée organisée"
 cc_xp_host_soiree_act_past: "[SCOPE.sCharacter('recipient').GetName] a commencé à rédiger les invitations."
 cc_xp_choose_host: "Qui accueille ?"
 cc_xp.50.title: "La soirée"
 cc_xp.50.a: "Une soirée pour la noblesse. Ne ménagez rien."
 cc_xp.50.b: "Marchands, érudits et clergé. Une assemblée utile."
 cc_xp.50.c: "Un souper de travail. Douze chaises, pas de musiciens."
 cc_xp.51.title: "Après la fête"
 cc_xp.51.desc: "Ce que la soirée a produit."
 cc_xp.52.title: "Une convergence d'esprits"
 cc_xp.52.a: "Asseyez-les à nouveau ensemble."
 cc_xp.53.title: "Une indiscrétion"
 cc_xp.53.a: "Achetez le silence. Discrètement, et auprès de plusieurs personnes."
 cc_xp.53.b: "Laissez-les parler. Cela passera."
 cc_xp.54.title: "Un talent découvert"
 cc_xp.54.a: "Acceptez-les. On peut en faire quelque chose."
 cc_xp.54.b: "Notez le nom et ne faites rien."
 cc_xp.55.title: "Une délégation, à mi-canapé"
 cc_xp.55.a: "Écoutez-les, et réglez l'affaire ici."
 cc_xp.55.b: "Souriez, et passez à la pièce suivante."
 cc_xp_second_to_subject: "Second d'une cour sujet"
 cc_xp_second_to_subject_desc_specific: "[SCOPE.sCharacter('recipient').GetName] s'établira à la cour d'un sujet pour quelques années. Vous choisissez quelle cour."
 cc_xp_second_to_subject_act: "$cc_xp_second_to_subject$"
 cc_xp_second_to_subject_past: "Un résident nommé"
 cc_xp_second_to_subject_act_past: "[SCOPE.sCharacter('recipient').GetName] est parti et s'en ira pour quelques années."
 cc_xp_choose_envoy: "Qui est affecté ?"
 cc_xp_choose_subject_court: "À quelle cour ?"
 cc_xp_recall_envoy: "Rappeler un résident"
 cc_xp_recall_envoy_desc: "Mettez fin prématurément à une affectation et ramenez le ministre chez lui. Quelle que soit la relation établie, elle demeure : un lien est l'enregistrement de ce qui s'est passé, pas un modificateur que l'on loue."
 cc_xp_recall_envoy_desc_specific: "[SCOPE.sCharacter('recipient').GetName] sera rappelé de son poste et retournera au cabinet."
 cc_xp_recall_envoy_act: "$cc_xp_recall_envoy$"
 cc_xp_recall_envoy_past: "Un résident rappelé"
 cc_xp_recall_envoy_act_past: "[SCOPE.sCharacter('recipient').GetName] est sur le chemin du retour."
 cc_xp_choose_recalled: "Qui rentre chez soi ?"
 cc_xp.60.title: "L'envoyé écrit"
 cc_xp.60.a: "Agissez. Qu'ils voient que nous lisons ce qu'ils nous envoient."
 cc_xp.60.b: "Classez le dossier. Notre homme en apprend davantage en restant discret."
 cc_xp.61.title: "L'envoyé outrepasse ses droits"
 cc_xp.61.a: "Soutenez-les. L'homme de la couronne est l'homme de la couronne."
 cc_xp.61.b: "S'excuser. Publiquement, et longuement."
 cc_xp.62.title: "Une faveur demandée"
 cc_xp.62.a: "Accordez-la. La bonne volonté achetée à bas prix est rare."
 cc_xp.62.b: "Laissez notre homme expliquer, aimablement, pourquoi non."
 cc_xp_found_institution_desc: "Établissez un courant de pensée permanent sous la direction d'un ministre senior, dont la propre discipline devient celle de l'école. Toute personne inscrite par la suite progresse dans cette discipline chaque année, qu'elle soit en fonction ou non.\n\nUn royaume peut en posséder trois au maximum : le premier nécessite une université dans la capitale, le second l'avancée des Ordres Érudits, et le troisième l'Administration Éclairée. Ils sont conçus pour être espacés d'un siècle."
 cc_xp_host_soiree_desc: "Demandez à un ministre d'ouvrir la saison avec une soirée à la cour. Cela permet de louer la salle ; le coût réel de la soirée, ainsi que les invités, seront décidés le soir même.\n\nIl se passe toujours quelque chose lors de ces événements. La nature de cet événement dépendra du montant dépensé."
 cc_xp.50.desc: "La salle est louée, les invitations sont parties, et [cc_xp_host.GetName] se tient au milieu de la pièce en posant une question dont la réponse a un coût : pour qui cette soirée est-elle réellement organisée?\n\nLes grandes familles s'attendent à être invitées. Les maisons de commerce et les universitaires seraient flattés de l'être, et s'en souviendraient longtemps. Et il y a une troisième option que personne n'appréciera : limiter la liste des invités aux personnes dont la couronne a réellement besoin."
 cc_xp.52.desc: "[cc_xp_subject.GetName] et [cc_xp_other.GetName] ont été placés côte à côte par hasard et discutaient encore quand les musiciens ont rangé leurs instruments.\n\nQuoi qu'ils aient trouvé l'un chez l'autre, cela a survécu au lendemain. Ils ont été vus ensemble deux fois depuis, et tous deux en sont ressortis plus efficaces."
 cc_xp.53.desc: "On ne sait pas combien [cc_xp_subject.GetName] avait bu, et cela importe peu désormais. Ce qui importe, c'est que cela a été dit dans une pièce où se trouvaient quarante personnes, et qu'au moins six d'entre elles ont parfaitement compris ce qui venait d'être admis.\n\nL'histoire est déjà lancée. On peut l'acheter, ou la laisser courir jusqu'à ce qu'elle s'éteigne en une saison, ce qui est l'option la moins coûteuse et la plus humiliante."
 cc_xp.54.desc: "[cc_xp_subject.GetName] fréquente la cour depuis des années, sans occuper de fonction ni attirer l'attention, et a passé une heure ce soir à expliquer quelque chose à un ministre qui n'avait jamais pensé qu'il y avait quoi que ce soit à expliquer.\n\nPersonne ne les a jamais vraiment regardés. C'est désormais une décision, et non plus un oubli."
 cc_xp.55.desc.nobles: "Trois des grandes familles ont réussi à se tenir ensemble près de la porte, ce qui, dans ce genre d'événement, n'est jamais un hasard. Elles ont un grief concernant la préséance, et elles ont choisi la soirée où un refus serait le plus voyant.\n\nElles se contenteront d'argent, comme elles le font habituellement."
 cc_xp.55.desc.burghers: "Les maisons de commerce ont envoyé leur homme le plus raisonnable, ce qui prouve que la demande n'est pas raisonnable. Il attend que la pièce soit à moitié vide, complimente le vin, et explique ce que les guildes souhaiteraient.\n\nCela aurait un certain coût. Ce serait également mémorable."
 cc_xp.55.desc.clergy: "L'évêque tourne autour de nous depuis une heure, et finit par intercepter la couronne entre deux conversations. Il est question d'une fondation, et de savoir qui la finance.\n\nIl est tout à fait prêt à essuyer un refus. Il préférerait simplement ne pas en subir un."
 cc_xp_second_to_subject_desc: "Affectez un ministre auprès de l'un de vos sujets en tant que résident. Il quitte votre cabinet pendant des années, progresse considérablement durant son séjour, et la relation qu'il tisse influence le lien avec ce sujet chaque année.\n\nLe type de lien dépend de la personne envoyée. Un administrateur approfondit la relation politique, un diplomate la relation personnelle, un soldat la relation militaire."
 cc_xp.60.desc: "La dépêche de [cc_xp_subject_court.GetName] s'étend sur onze pages, ce qui témoigne soit d'une grande rigueur, soit d'une grande solitude. Enfoui au milieu se trouve un élément utile : qui, à cette cour, est réellement écouté, et qui se contente de parler le premier.\n\nOn peut agir en conséquence, ce qui sera remarqué, ou classer le dossier, ce qui ne le sera pas."
 cc_xp.61.desc: "Notre résident à [cc_xp_subject_court.GetName] a donné une instruction. Pas une suggestion, pas une requête transmise au nom de la couronne : une instruction, à un ministre d'une cour qui n'est pas la nôtre, devant témoins.\n\nIls avaient probablement raison. Ce n'est pas là le problème. Le problème est que tout le monde sait désormais exactement comment la couronne les considère, et attend de voir si nous l'affirmons haut et fort."
 cc_xp.62.desc: "Il a fallu trois ans d'hospitalité à [cc_xp_subject_court.GetName] pour en arriver là, ce qui suggère que leur démarche est sérieuse. La demande nous est parvenue via notre propre résident, avec tact, lors d'un dîner, comme on le fait lorsque le refus doit rester possible.\n\nIls veulent de l'argent. Ils ont été corrects dans leur demande."
 cc_xp_enroll_in_school: "S'inscrire dans une école"
 cc_xp_enroll_in_school_desc: "Placez un ministre ou un protégé dans une école existante. Ils acquièrent la discipline de cette école chaque année suivante.\n\nC'est là l'utilité d'un protégé : les années passées à assimiler une discipline en attendant un poste signifient qu'ils arrivent au cabinet déjà lancés sur les échelons, plutôt que de partir de zéro."
 cc_xp_enroll_in_school_desc_specific: "[SCOPE.sCharacter('recipient').GetName] rejoindra l'une des écoles du royaume et acquerra sa discipline chaque année suivante. Vous choisissez laquelle."
 cc_xp_enroll_in_school_act: "$cc_xp_enroll_in_school$"
