 cc_xp_none_school: "Il n'existe aucune école dans laquelle s'inscrire."
 cc_xp_none_minister: "@trigger_no! Il n'y a personne à la cour avec un dossier à lire."
 cc_xp_studio_visit: "Visiter l'Atelier"
 cc_xp_studio_visit_desc: "Rendre visite à un artiste à l'œuvre et décider de la réaction de la couronne face à ce qu'elle y découvre."
 cc_xp_studio_visit_concept: "[cabinet|e]"
 cc_xp_choose_studio: "Quel artiste ?"
 cc_xp_tt_needs_studio: "Nécessite un artiste à la cour qui n'a pas été visité au cours des trois dernières années"
 cc_xp_none_studio: "@trigger_no! Aucun artiste à la cour n'est disponible pour une visite."
 cc_xp.70.title: "L'Atelier"
 cc_xp.70.desc.working: "[cc_xp_artist.GetName] travaille à votre arrivée et continue de travailler un moment avant de remarquer votre présence. L'œuvre est assez avancée pour qu'on puisse voir ce qu'elle sera, mais pas assez pour être certain qu'elle sera réussie.\n\nLa couronne peut payer ce dont l'œuvre a réellement besoin, ou elle peut faire comprendre que la cour s'attend à voir le travail terminé."
 cc_xp.70.desc.idle: "[cc_xp_artist.GetName] n'a rien sur le chevalet. Il y a des croquis, des justifications et un long décompte du coût des matériaux de la dernière commande.\n\nUn artiste à la cour sans travail en cours est un artiste que la cour paie pour réfléchir."
 cc_xp.70.a: "Payez tout ce dont l'œuvre a besoin."
 cc_xp.70.b: "Faire comprendre que la cour s'attend à ce que ce soit terminé."
 cc_xp.70.c: "Fixez-leur un sujet aux frais de la couronne."
 cc_xp.70.d: "Regarder, ne rien dire et partir."
 cc_xp.71.title: "Le Dévoilement"
 cc_xp.71.desc.unfinished: "La date a été fixée il y a des mois et la salle a été préparée. L'œuvre, elle, ne l'est pas.\n\n[cc_xp_artist.GetName] ne s'en presse pas, et explique longuement que l'alternative aurait été une peinture moins réussie."
 cc_xp.71.desc.finished: "C'est fait, l'œuvre est accrochée, et la cour défile devant elle.\n\nPeu importe ce que [cc_xp_artist.GetName] a été payé, l'objet appartient désormais au royaume."
 cc_xp.71.a: "Laissez-leur le temps nécessaire."
 cc_xp.71.b: "Présentez-le à la cour."
 cc_xp.80.title: "Un élève pour [cc_xp_mentor.GetName]"
 cc_xp.80.desc: "[cc_xp_mentor.GetName] a accepté de prendre quelqu'un sous son aile. Ce n'est pas une mince affaire de le demander à un ministre qui a un département à diriger, et l'offre ne restera pas ouverte indéfiniment.\n\nLa personne choisie passera la décennie suivante à apprendre le métier de [cc_xp_mentor.GetSheHe], et progressera dans la discipline de [cc_xp_mentor.GetHisHer] plutôt que dans la sienne."
 cc_xp.80.a: "[cc_xp_pupil_1.GetName]"
 cc_xp.80.b: "[cc_xp_pupil_2.GetName]"
 cc_xp.80.c: "[cc_xp_pupil_3.GetName]"
 cc_xp.80.d: "[cc_xp_pupil_4.GetName]"
 cc_xp.81.title: "Un poste pour [cc_xp_envoy.GetName]"
 cc_xp.81.desc: "[cc_xp_envoy.GetName] doit être envoyé en tant que résident. La maison est engagée, les dépenses sont convenues, et il ne reste plus qu'à dire où.\n\nUn résident part pour des années. Ce qu'il construit pendant ce temps modifie la dimension du lien que sa propre discipline touche ; ainsi, un administrateur, un diplomate et un soldat représentent trois postes véritablement différents."
 cc_xp.81.a: "La cour de [cc_xp_court_1.GetName]"
 cc_xp.81.b: "La cour de [cc_xp_court_2.GetName]"
 cc_xp.81.c: "La cour de [cc_xp_court_3.GetName]"
 cc_xp.81.d: "La cour de [cc_xp_court_4.GetName]"
 cc_xp.82.title: "Une place pour [cc_xp_school_student.GetName]"
 cc_xp.82.desc: "Les frais sont payés et la lettre de recommandation est écrite. Il ne manque plus qu'une adresse.\n\nUn membre d'une école progresse chaque année dans la discipline de cette école, qu'il soit en fonction ou non."
 cc_xp.82.a: "L'école fondée par [Player.MakeScope.GetVariable('cc_xp_school_1_founder').GetCharacter.GetName]"
 cc_xp.82.b: "L'école fondée par [Player.MakeScope.GetVariable('cc_xp_school_2_founder').GetCharacter.GetName]"
 cc_xp.82.c: "L'école fondée par [Player.MakeScope.GetVariable('cc_xp_school_3_founder').GetCharacter.GetName]"
 cc_xp.83.title: "Un mécène pour [cc_xp_artist.GetName]"
 cc_xp.83.desc: "La couronne a décidé que [cc_xp_artist.GetName] mérite d'être conservé. Le mécénat ne dépend pas seulement de l'argent de la couronne : elle souhaite qu'un nom y soit associé, et ce nom doit appartenir à quelqu'un ayant un rang suffisant à la cour pour que cela ait une importance.\n\nQuiconque sera choisi passera les vingt-cinq prochaines années à être présenté comme la personne qui a découvert [cc_xp_artist.GetName], et en sera d'autant meilleur diplomate."
 cc_xp.83.a: "[cc_xp_patron_1.GetName]"
 cc_xp.83.b: "[cc_xp_patron_2.GetName]"
 cc_xp.83.c: "[cc_xp_patron_3.GetName]"
 cc_xp.83.d: "[cc_xp_patron_4.GetName]"
 cc_xp.84.title: "Une vente discrète"
 cc_xp.84.desc: "Il y a un acheteur, et cet acheteur ne pose pas de questions, pas plus que quiconque tant que les choses sont faites correctement.\n\nLes pièces les plus précieuses dont la collection pourrait raisonnablement se séparer sont listées ci-dessous, avec leur valeur estimée. Une vente discrète rapporte moins qu'une vente ouverte, et le prix d'une pièce dépend de sa qualité ainsi que du prestige de la culture qui l'a produite. La cour remarquera quel mur devient vide."
 cc_xp.84.a: "[cc_xp_work_1.GetName], par [cc_xp_work_1.GetCreatorName] : [cc_xp_work_1.GetQualityName] ([cc_xp_work_1.GetQuality|Y]%)"
 cc_xp.84.b: "[cc_xp_work_2.GetName], par [cc_xp_work_2.GetCreatorName] : [cc_xp_work_2.GetQualityName] ([cc_xp_work_2.GetQuality|Y]%)"
 cc_xp.84.c: "[cc_xp_work_3.GetName], par [cc_xp_work_3.GetCreatorName] : [cc_xp_work_3.GetQualityName] ([cc_xp_work_3.GetQuality|Y]%)"
 cc_xp.84.d: "[cc_xp_work_4.GetName], par [cc_xp_work_4.GetCreatorName] : [cc_xp_work_4.GetQualityName] ([cc_xp_work_4.GetQuality|Y]%)"
 cc_xp.84.e: "Ne rien vendre."
 cc_xp.85.title: "À surveiller"
 cc_xp.85.desc: "La couronne dispose de fonds et d'attention à consacrer à quelqu'un qui n'occupe pas encore de fonction. La cour a son avis sur l'identité de cette personne, et la noblesse a son avis sur le fait que la couronne ait un avis.\n\nUn protégé accumule lentement de l'expérience en attendant, peut être envoyé en formation et peut se voir attribuer un mentor. L'objectif est d'avoir un successeur prêt avant qu'un poste ne se libère."
 cc_xp.85.a: "[cc_xp_cand_1.GetName]"
 cc_xp.85.b: "[cc_xp_cand_2.GetName]"
 cc_xp.85.c: "[cc_xp_cand_3.GetName]"
 cc_xp.85.d: "[cc_xp_cand_4.GetName]"
 cc_xp_tt_needs_free_university: "Une université n'accueillant pas encore d'école"
 cc_xp_studio_visit_desc_specific: "La couronne sollicite [SCOPE.sCharacter('recipient').GetName] et décide quoi faire de ce qui se trouve sur le chevalet."
 cc_xp_studio_visit_act: "$cc_xp_studio_visit$"
 cc_xp_studio_visit_past: "Un studio visité"
 cc_xp_studio_visit_act_past: "La couronne a sollicité [SCOPE.sCharacter('recipient').GetName]."
 cc_xp.90.title: "Une carrière pour [cc_xp_subject.GetName]"
 cc_xp.90.desc: "[cc_xp_subject.GetName] revient de la chancellerie avec des aptitudes, mais aucun poste où les employer. Les commis principaux ont des avis sur l'endroit où [cc_xp_subject.GetSheHe] serait le plus utile, tout comme tous ceux qui en ont entendu parler.\n\nCe qui est décidé maintenant est une carrière, et non une compétence. Il ou elle commencera au bas de l'échelle et montera à mesure qu'il ou elle acquerra l'expérience administrative nécessaire."
 cc_xp.90.a: "La Voie du Réformateur. Affectez-le au recueil des lois."
 cc_xp.90.b: "Le Trésor. Affectez-le aux comptes."
 cc_xp.90.c: "La Voie du Savant. Laissez-le lire."
 cc_xp.90.d: "Le Bâtisseur. Envoyez-le inspecter la capitale."
 cc_xp.90.e: "Le Juriste. Affectez-le aux tribunaux."
 cc_xp.90.f: "L'Intégrateur. Confiez-lui les nouvelles provinces."
 cc_xp.91.title: "Une carrière pour [cc_xp_subject.GetName]"
 cc_xp.91.desc: "[cc_xp_subject.GetName] revient de son circuit d'ambassades en sachant quels ambassadeurs valent la peine d'être écoutés et lesquels sont simplement bien habillés. C'est un début, mais ce n'est pas encore un poste.\n\nCe qui est décidé maintenant est une carrière, et non une compétence. Il ou elle commencera au bas de l'échelle et montera à mesure qu'il ou elle acquerra l'expérience diplomatique nécessaire."
 cc_xp.91.a: "L'Ascension du Diplomate. Confiez-lui une légation."
 cc_xp.91.b: "La Main Coloniale. Envoyez-le vers les stations lointaines."
 cc_xp.91.c: "La Voie du Marchand. Rattaché-le à la maison de commerce."
 cc_xp.91.d: "Le Navigateur. Mettez-le à bord d'un navire."
 cc_xp.91.e: "L'Ombre. Ne notez pas ce qu'il fait."
 cc_xp.92.title: "Une carrière pour [cc_xp_subject.GetName]"
 cc_xp.92.desc: "[cc_xp_subject.GetName] revient de l'école d'état-major avec des opinions, la plupart empruntées et une ou deux qui sont les [cc_xp_subject.GetHisHer] propres. L'armée a de la place pour [cc_xp_subject.GetHimHer] à plusieurs endroits et une forte préférence pour décider lequel.\n\nCe qui est décidé maintenant est une carrière, et non une compétence. Il ou elle commencera au bas de l'échelle et montera à mesure qu'il ou elle acquerra l'expérience militaire nécessaire."
 cc_xp.92.a: "Le Durcissement Militaire. Rattaché-le à un état-major de campagne."
 cc_xp.92.b: "Le Maître d'Instruction. Confiez-lui un terrain de parade."
 cc_xp.92.c: "L'Ingénieur. Confiez-lui les fortifications."
 cc_xp.92.d: "La Cavalerie. Confiez-lui le dépôt de remonte."
 cc_xp.90.g: "Aucun de ces choix ne convient. Laissons cela pour l'instant."
