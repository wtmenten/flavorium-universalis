 cc_xp_none_protege: "Il n'y a personne à la cour à recruter : tout le monde est ministre, protégé ou souverain."
 cc_xp_none_released_protege: "@trigger_no! La couronne ne parraine aucun protégé."
 cc_xp_none_mentor: "@trigger_no! Aucun ministre ne possède à la fois l'ancienneté et la discipline nécessaires pour enseigner."
 cc_xp_none_pupil: "Personne à la cour n'est libre pour se voir attribuer un mentor."
 cc_xp_none_host: "@trigger_no! Aucun ministre n'est assez ancien pour tenir une soirée, ou ceux qui le sont sont absents."
 cc_xp_none_envoy: "@trigger_no! Aucun ministre n'a de discipline à pratiquer à l'étranger et n'est libre de toute autre obligation."
 cc_xp_none_subject_court: "Aucune cour sujet n'est suivie, ou chacune héberge déjà un résident."
 cc_xp_none_recalled: "@trigger_no! Aucun ministre n'est affecté à l'étranger."
 cc_xp_none_trainee: "@trigger_no! Personne n'est libre d'être envoyé à l'étranger pour être instruit."
 cc_xp_none_patron: "Aucun ministre n'est assez ancien pour parrainer un artiste."
 cc_xp_none_artist: "@trigger_no! Aucun artiste à la cour n'est sans mécène."
 cc_xp_none_broker: "Aucun ministre à la cour n'est libre pour organiser cela."
