 # === cc_bonds.110 — A Merchant Seeks Passage ===
 cc_bonds.110.title: "Un marchand cherche un passage"
 cc_bonds.110.desc: "Un marchand de [bond_subj.GetName] a attiré notre attention. Sa proposition est simple : il souhaite établir une route commerciale passant par notre territoire — nos ports, nos routes, nos accords de licence. Il n'est pas encore assez riche pour être dangereux, ni assez pauvre pour être désespéré. Il a du talent, de l'ambition et un plan. Ce dont il a besoin, c'est d'une permission. Ce que nous devons décider, c'est quel type de permission nous accordons, et ce que nous attendons en retour. Les hommes comme lui ont tendance à devenir plus importants que prévu."
 cc_bonds.110.a: "Lui accorder le plein droit de passage et un monopole commercial. Qu'il s'enrichisse et reste loyal."
 cc_bonds.110.b: "Accorder les droits de passage. Il peut commercer librement, mais sans monopole."
 cc_bonds.110.c: "Refuser la requête. Nous ne sommes pas là pour enrichir des marchands étrangers."

 # === cc_bonds.111 — The Merchant's Expansion ===
 cc_bonds.111.title: "L'expansion du Marchand"
 cc_bonds.111.desc_patronized: "Le marchand de [bond_subj.GetName] est devenu, au cours des années écoulées, un homme très riche — et par richesse, nous entendons le genre qui remodèle l'économie d'un territoire. Il emploie des centaines de personnes. Ses navires relient les ports d'ici jusqu'à la frontière coloniale. Son crédit est bon dans la moitié du monde connu. Le monopole que nous avons accordé a fait exactement ce que font les monopoles : il a concentré le capital efficacement, et ce capital a été bâti sur notre patronage. Désormais, il s'efforce d'étendre son réseau davantage — atteignant les ports et territoires de [bond_secondary.GetName], ainsi que des marchands qui ne nous rendent pas de comptes. La question est de savoir comment répondre à un homme qui a dépassé ses origines."
 cc_bonds.111.desc_allowed: "Le marchand de [bond_subj.GetName] a prospéré modestement au fil des ans — une maison de commerce solide, une petite flotte, un nom respectable. Il n'est pas la force commerciale dominante dans son territoire, mais il est notable, et il se souvient que nous lui avons accordé passage alors que nous n'y étions pas tenus. Désormais, il s'étend davantage, atteignant les ports coloniaux et les marchés étrangers de [bond_secondary.GetName]. Il est, dans le langage du commerce, bien disposé à notre égard. Le fait que nous restions bien disposés envers lui dépendra de la part de cette expansion que nous souhaitons contrôler."
 cc_bonds.111.desc_denied: "Le marchand que nous avons éconduit a, selon tous les rapports, trouvé une autre route. Il a établi ses connexions à travers le territoire d'un rival, s'est enrichi modérément sans notre aide, et s'étend désormais encore plus loin — vers les marchés coloniaux et les ports étrangers de [bond_secondary.GetName] que notre influence ne touche pas. Il n'a exprimé aucun ressentiment. Il n'a pas non plus exprimé de gratitude. Il a simplement contourné nos obstacles, comme le font les marchands. Il demande maintenant, dans le langage indirect du commerce, si nous souhaitons modifier les termes de cet arrangement."
 cc_bonds.111.a_back: "Financer l'expansion de son entreprise. Un marchand bien soutenu est un marchand qui se souvient de qui l'a soutenu."
 cc_bonds.111.b_observe: "Laissez-le étendre son influence indépendamment. Nous évaluerons le résultat."
 cc_bonds.111.c_discourage: "Décourager cette expansion. Il devient plus puissant qu'il ne nous est utile."

 # === cc_bonds.112 — Fortune and Tempest ===
 cc_bonds.112.title: "Fortune et Tempête"
 cc_bonds.112.desc_piracy: "Des pirates ont frappé les principales routes commerciales du marchand. Deux de ses navires sont perdus ou endommagés ; un troisième a rebroussé chemin vers le port. Son réseau n'est pas brisé, mais il s'essouffle, et l'interruption lui a coûté sa crédibilité auprès de partenaires qui surveillaient sa capacité à maintenir l'approvisionnement. Il nous a envoyé un message pour savoir si nous pouvions aider à sécuriser les routes. Il présente cela comme un intérêt mutuel, ce qui est le cas — si les routes s'effondrent, le commerce s'effondre également."
 cc_bonds.112.desc_rival: "Une maison marchande concurrente a émergé du même réseau colonial, soutenue par des intérêts qui ne sont pas les nôtres. Ils ont cassé les prix du marchand sur deux marchandises, débauché deux de ses capitaines de navires sous contrat et font des approches auprès de ports qui lui étaient auparavant fidèles. Le marchand n'a pas paniqué, mais les renseignements que nous recevons suggèrent que la situation se détériore plus rapidement qu'il ne veut bien l'admettre."
 cc_bonds.112.desc_succession: "Le marchand vieillit. Il n'a pas d'héritier évident — un fils est à l'étranger, un autre est au monastère, et la fille aînée a déjà formé une alliance avec une maison de commerce que nous considérons comme un rival. La question de savoir qui contrôlera l'entreprise familiale après sa mort est désormais une question politique brûlante, et la réponse façonnera les loyautés futures du réseau. Nous ne sommes pas sans influence ici, si nous choisissons de l'exercer."
 cc_bonds.112.desc_drought: "Une sécheresse prolongée a frappé les principaux marchés dont dépend le réseau du marchand. Les mauvaises récoltes signifient une réduction des marchandises à expédier, des revenus réduits pour les territoires et une capacité réduite à payer les dettes. Le marchand est solvable, tout juste, mais ses partenaires dans les régions touchées ne le sont pas. Si plusieurs d'entre eux font faillite simultanément, le réseau se contractera brusquement et la reprise prendra des années."
 cc_bonds.112.desc_blockade: "Un différend naval — pas notre guerre, mais dangereusement proche — a conduit à un blocus de facto du port le plus productif du marchand. Les navires attendent au mouillage. Les contrats sont en défaut. Le marchand a épuisé ses canaux diplomatiques et demande maintenant notre intervention, formelle ou non, pour briser l'impasse avant que les pertes ne deviennent permanentes."
 cc_bonds.112.a_1_escort: "Financer une flotte d'escorte pour ses principales routes commerciales. Nous protégeons ce qui nous importe."
 cc_bonds.112.b_1_demand: "Il est responsable de la sécurité de ses propres routes. C'est le prix de l'indépendance."
 cc_bonds.112.a_2_buyout: "Rachetez les intérêts de la maison rivale. Nettoyez le terrain."
 cc_bonds.112.b_2_let: "Laissez la concurrence commerciale se résoudre d'elle-même. Nous ne prenons pas parti dans les querelles de marchands."
 cc_bonds.112.a_3_heir: "Soutenez discrètement l'héritier dont les loyautés s'alignent sur les nôtres."
 cc_bonds.112.b_3_neutral: "La succession d'un marchand n'est pas de notre ressort."
 cc_bonds.112.a_4_relief: "Accorder un crédit d'urgence à ses partenaires clés. Le réseau doit survivre à la saison."
 cc_bonds.112.b_4_reduce: "Réduire les attentes pour cette année. La sécheresse passera."
 cc_bonds.112.a_5_pressure: "Exercez une pression diplomatique pour lever le blocus. Notre nom a du poids ici."
 cc_bonds.112.b_5_wait: "Accepter le délai. Ces choses finissent toujours par se résoudre."

 # === cc_bonds.113 — The Merchant's Legacy ===
 cc_bonds.113.title: "L'héritage du Marchand"
 cc_bonds.113.desc_flourish: "La maison de commerce a prospéré. Ce qui n'était au départ qu'un seul marchand cherchant des droits de passage est devenu une dynastie : plusieurs ports, une flotte, des lignes de crédit s'étendant sur les marchés coloniaux et une réputation désormais indissociable du réseau que nous avons aidé à bâtir. Le patriarche de la famille, s'adressant à l'assemblée annuelle de sa maison, a décrit la Couronne comme « le fondement sur lequel notre fortune a été bâtie ». L'histoire entre nous a été productive. La question est maintenant de savoir comment la formaliser."
 cc_bonds.113.desc_modest: "La maison de commerce s'en est raisonnablement sortie — ce n'est pas la dynastie qu'elle aurait pu être, mais c'est une institution commerciale stable et crédible avec un rayonnement réel sur plusieurs ports. Les enfants du marchand connaissent notre histoire avec leur père. Ils ne sont ni idéalistes, ni rancuniers à ce sujet. Comme tous les marchands, ils calculent à quoi pourrait ressembler le prochain arrangement et s'il est dans leur intérêt de l'accepter."
 cc_bonds.113.desc_collapse: "Le marchand est mort. Sa maison n'est pas une dynastie — c'est un ensemble de dettes, de contrats contestés et de loyautés fragmentées. Le réseau qui aurait pu exister ne s'est jamais concrétisé. Ses enfants se partagent ce qui reste, et des rivaux s'empressent de combler le vide. Nous assistons à l'effondrement de quelque chose qui, avec des choix différents à des moments différents, aurait pu être un actif commercial durable."
 cc_bonds.113.a_charter: "Accorder à la maison une charte commerciale formelle. Rendre le partenariat officiel et durable."
 cc_bonds.113.b_accept: "Acceptez l'héritage en l'état. Aucun arrangement formel — mais les canaux restent ouverts."
 cc_bonds.113.c_decline: "La maison doit se tenir seule. Ce qui a été construit entre nous a touché à sa fin."

 # === Scripted relation display ===
 cc_merchant_trade_boost: "Réseau commercial marchand"
 cc_merchant_trade_boost_desc: "Un réseau commercial établi via la dynastie marchande canalise une partie du trafic commercial vers les marchés de ce suzerain."

 # === cc_bonds.115 — hidden cleanup event ===
 cc_bonds.115.title: "Le mandat du Marchand expire"
 cc_bonds.115.a: "La présence du marchand s'estompe."
