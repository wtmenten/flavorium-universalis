l_french:
 # ============================================================
 # NEGATIVE TRAITS
 # ============================================================

 stagnant_counselor: "Conseiller stagnant"
 desc_stagnant_counselor: "Ce ministre est resté trop longtemps à son poste sans être remis en question. Ses méthodes se sont sclérosées, son enthousiasme a faibli et son expertise a perdu de sa pertinence. Il reste compétent — mais tout juste."
 stagnant_counselor_die_desc: "[CHARACTER.GetName] est décédé(e). L'histoire ne jugera pas sévèrement sa carrière — seulement le dernier chapitre."

 war_profiteer: "Profiteur de guerre"
 desc_war_profiteer: "Ce ministre a appris à voir le conflit comme une opportunité. Ses conseils orientent chaque règlement diplomatique vers son propre enrichissement, et le royaume subit les séquelles plus lentes et plus coûteuses de guerres qui se sont terminées plus mal qu'elles n'auraient dû."
 war_profiteer_die_desc: "[CHARACTER.GetName] est décédé(e). Le décompte de sa fortune personnelle et le dividende de la paix du royaume ne s'équilibreront jamais tout à fait."

 court_schemer: "Intrigant de cour"
 desc_court_schemer: "L'intrigue a remplacé la loyauté dans la pratique du gouvernement de ce ministre. Ils sapent les rivaux au sein de la cour, fracturent les coalitions législatives et traitent chaque nomination comme un coup dans un jeu dont l'issue n'en vaut pas la peine."
 court_schemer_die_desc: "[CHARACTER.GetName] est décédé(e). Les réseaux qu'ils ont bâtis — les dettes, les faveurs, les secrets — se dissolvent avec eux. C'est peut-être une chance."

 inefficient_bureaucrat: "Bureaucrate inefficace"
 desc_inefficient_bureaucrat: "Ce ministre a dépassé les limites de sa compétence. Un âge plus jeune aurait pu le polir pour en faire quelqu'un d'utile ; l'époque actuelle a simplement exposé la faiblesse de son développement depuis ses débuts."
 inefficient_bureaucrat_die_desc: "[CHARACTER.GetName] est décédé(e). Son successeur trouvera le bureau mieux ordonné que le travail."

 corrupted_official: "Officiel corrompu"
 desc_corrupted_official: "La richesse qui passait par les mains de ce ministre a été redirigée. Une part de la prospérité du royaume remplit leurs poches, et le privilège qu'ils protègent est le leur. Les ordres sont satisfaits — et ils ont raison de l'être."
 corrupted_official_die_desc: "[CHARACTER.GetName] est décédé(e). Les auditeurs seront occupés."

 zealous_fanatic: "Fanatique zélé"
 desc_zealous_fanatic: "La foi du ministre s'est transformée en quelque chose de plus dur et de plus étroit qu'une simple conviction. Le doute est supprimé, la différence est persécutée et la raison cède devant le zèle. L'église peut prospérer ; la vie intellectuelle du royaume, non."
 zealous_fanatic_die_desc: "[CHARACTER.GetName] est décédé(e). Les cendres de ce que [CHARACTER.GetSheHe] a brûlé refroidiront lentement."

 outdated_general: "Général obsolète"
 desc_outdated_general: "Ce ministre a appris sa doctrine militaire à une autre époque et a refusé de la mettre à jour. Ses méthodes coûtent plus cher qu'elles ne le devraient et produisent moins que ce que l'ennemi attend, ce qui est la pire combinaison en temps de guerre."
 outdated_general_die_desc: "[CHARACTER.GetName] est décédé(e). L'armée que [CHARACTER.GetSheHe] a entraînée pour la dernière guerre devra apprendre à mener la prochaine."

 cynical_courtier: "Courtisan cynique"
 desc_cynical_courtier: "Trop d'années à voir l'idéalisme se transformer en compromis ont laissé ce ministre incapable de défendre quoi que ce soit avec sincérité. Les états voient clair dans ses gestes vides et répondent de la même manière."
 cynical_courtier_die_desc: "[CHARACTER.GetName] est décédé(e). En fin de compte, même le cynisme nécessite quelqu'un pour l'exercer."

 reckless_expander: "Expansionniste téméraire"
 desc_reckless_expander: "Ce ministre voit chaque frontière comme une invitation et chaque risque comme un coût que quelqu'un d'autre paiera. L'antagonisme généré par notre expansion et les entreprises coloniales qui se sont effondrées sous sa direction prendront des années à être réparées."
 reckless_expander_die_desc: "[CHARACTER.GetName] est décédé(e). Les frontières que [CHARACTER.GetSheHe] a repoussées sont toujours contestées."

 # ============================================================
 # NEGATIVE TRAIT GRANT EVENTS (cc_neg namespace)
 # ============================================================

 cc_neg.1.title: "Un ministre qui stagne"
 cc_neg.1.desc: "[minister.GetName] a servi fidèlement — peut-être trop fidèlement, et depuis trop longtemps. La cour murmure que [minister.GetSheHe] se répète ses propres conseils. Les idées nouvelles arrivent sur son bureau et en repartent inchangées. Il est encore temps d'intervenir[minister.GetHerHis][minister.GetHerHis]."
 cc_neg.1.a: "Leur assigner un nouveau projet exigeant — pour les bousculer."
 cc_neg.1.b: "Libérer [minister.GetHerHim] de ses fonctions avec gratitude."
 cc_neg.1.c: "Laissez la stagnation s'installer. Leur expérience a encore de la valeur."

 cc_neg.2.title: "Un ministre habitué à la guerre"
 cc_neg.2.a: "Enquêter sur les transactions financières du ministre."
 cc_neg.2.b: "Avertissez-les en privé. Ce comportement doit cesser."
 cc_neg.2.c: "Ne rien dire pour l'instant."

 cc_neg.3.title: "Faction en gestation"
 cc_neg.3.desc: "Deux ministres aux convictions opposées sont à la cour depuis assez longtemps pour que leur désaccord se cristallise en faction. [minister.GetName] montre des signes de préférence pour l'intrigue plutôt que pour la gouvernance. La cour commence à choisir son camp."
 cc_neg.3.a: "Impliquez [minister.GetHerHim] directement — confiez-lui une tâche qui nécessite de la coopération."
 cc_neg.3.b: "Laissez [minister.GetHerHim] cultiver sa faction. Mieux vaut connaître son réseau."
 cc_neg.3.c: "Congédier [minister.GetHerHim] avant que la situation ne s'aggrave."

 cc_neg.4.title: "Un ministre aux rendements décroissants"
 cc_neg.4.a: "Donnez à [minister.GetHerHim] l'occasion de prouver sa pertinence."
 cc_neg.4.b: "Laissez la bureaucratie trouver son propre équilibre."
 cc_neg.4.c: "Mettre [minister.GetHerHim] à la retraite — nous avons besoin de quelqu'un de plus vif."

 cc_neg.5.title: "L'odeur de la corruption"
 cc_neg.5.desc: "Alors que les richesses s'accumulent à la cour et que les états s'engraissent, [minister.GetName] a trouvé une opportunité. Les comptes sont techniquement équilibrés — mais l'équilibre semble avoir été conçu pour bénéficier à quelqu'un d'autre qu'à la couronne."
 cc_neg.5.a: "Confronter [minister.GetHerHim] aux preuves — exiger des réformes."
 cc_neg.5.b: "L'accepter. Les états sont satisfaits ; laissons-les le rester."
 cc_neg.5.c: "Congédier [minister.GetHerHim] sans cérémonie."

 cc_neg.6.title: "Un vieux soldat hors de son temps"
 cc_neg.6.desc: "[minister.GetName] a servi brillamment dans une autre ère. Mais les armées de cet âge exigent une réflexion différente — des formations différentes, une logistique différente, une doctrine différente. [minister.GetSheHe] refuse de les apprendre. L'armée en paie le prix."
 cc_neg.6.a: "Rendre obligatoire la participation à un nouveau programme de formation."
 cc_neg.6.b: "Honorer les services de [minister.GetHerHis] et laisser [minister.GetHerHim] terminer sa tâche à sa manière."
 cc_neg.6.c: "Les remplacer par quelqu'un de la génération actuelle."

 cc_neg.7.title: "Une cour devenue cynique"
 cc_neg.7.desc: "Nous avons laissé passer trop d'opportunités, décliné trop de bons choix. [minister.GetName] l'a remarqué. La sincérité a disparu des conseils de [minister.GetHerHis], remplacée par une compétence ironique que les États ne trouvent plus inspirante."
 cc_neg.7.a: "Donnez à [minister.GetHerHim] un motif d'espérer — choisissez la voie de l'ambition cette fois-ci."
 cc_neg.7.b: "Le cynisme force les conseillers à être honnêtes."
 cc_neg.7.c: "Laissez [minister.GetHerHim] partir."

 cc_neg.8.title: "Ambition sans prudence"
 cc_neg.8.desc: "[minister.GetName] nous a vus combattre et échouer, s'étendre et reculer, et en a tiré la mauvaise leçon : que nous n'avons pas été assez audacieux. Ses conseils poussent désormais vers l'acquisition à tout prix, et l'antagonisme ainsi que les échecs coloniaux qui s'ensuivent ne sont pas de sa responsabilité."
 cc_neg.8.a: "Réorienter l'énergie de [minister.GetHerHis] — idées audacieuses, exécution prudente."
 cc_neg.8.b: "Des conseils audacieux ont leur utilité."
 cc_neg.8.c: "Décharger [minister.GetHerHim] de [minister.GetHerHis] poste."

 # ============================================================
 # NEGATIVE TRAIT REHABILITATION EVENTS (cc_neg.11-19)
 # ============================================================

 cc_neg.11.title: "Le conseiller trouve un nouveau but"
 cc_neg.11.desc: "La capitale s'est étendue. De nouvelles constructions, une richesse nouvelle, de nouveaux défis — et [minister.GetName] s'est retrouvé(e) face à une cour qui ne tolère plus les réponses faciles. Quelque chose a changé dans ses conseillers[minister.GetHerHim][minister.GetHerHis]."
 cc_neg.11.a: "Financer un programme formel de renouveau — mettre l'expérience de [minister.GetHerHis] à profit."
 cc_neg.11.b: "Permettre à [minister.GetHerHim] de prendre une retraite honorable, son héritage intact."

 cc_neg.12.title: "La paix change un ministre"
 cc_neg.12.a: "Reconnaissez le changement. Leur expérience est à nouveau un atout."

 cc_neg.13.title: "L'intrigant cède au devoir"
 cc_neg.13.desc: "[minister.GetName] s'est vu confier une tâche d'intégration exigeante — une tâche qui nécessitait de travailler avec les ministres mêmes que [minister.GetSheHe] avait sapés. À un moment donné, la création de factions est devenue fastidieuse et la tâche elle-même est devenue intéressante."
 cc_neg.13.a: "La cour en sort renforcée."

 cc_neg.14.title: "L'efficacité revient au cabinet"
 cc_neg.14.desc: "Le cabinet fonctionne à nouveau correctement, et [minister.GetName] y a contribué. Entouré de systèmes fonctionnels, il a trouvé un moyen d'apporter sa contribution plutôt que d'obstruer. L'inertie bureaucratique s'est dissipée."
 cc_neg.14.a: "Reconnaître l'amélioration — c'est le ministre dont nous avions besoin."

 cc_neg.15.title: "Corruption éliminée"
 cc_neg.15.desc: "Le problème de l'accumulation des richesses étant résolu et les comptes ouverts à un examen rigoureux, [minister.GetName] n'a plus d'endroit où cacher les divergences. L'enrichissement des états a pris fin. Discrètement, la corruption y a mis fin également."
 cc_neg.15.a: "Notez le changement. Nous surveillerons de plus près."

 cc_neg.16.title: "Le doute revient chez le zélote"
 cc_neg.16.desc: "Un ministre incapable de tolérer les hérétiques a été placé dans une cour où la tolérance était le prix de la paix. Cela lui a coûté quelque chose — mais ce qui a été perdu semble avoir été remplacé par quelque chose de plus ancien et de plus utile : la nuance."
 cc_neg.16.a: "Souhaitons le retour de [rehabilitated_minister.GetHerHim] au sein du conseil complet."
 cc_neg.16.b: "Engager un conseiller théologique privé pour accélérer la réforme de [rehabilitated_minister.GetHerHis]."

 cc_neg.17.title: "Un général qui a appris de nouvelles ruses"
 cc_neg.17.desc: "Le progrès militaire a dépassé l'ancienne doctrine, et [minister.GetName] — enfin — a suivi le rythme. Ses conseils sur la composition de l'armée et la planification des campagnes ne sont plus un handicap. L'armée l'a remarqué."
 cc_neg.17.a: "Leur restaurer la pleine autorité militaire."

 cc_neg.18.title: "La légende change tout"
 cc_neg.18.desc: "Quelque chose de remarquable s'est produit à la cour, et [minister.GetName] y a assisté. Le cynisme qui s'était installé dans [minister.GetHerHis] attitude a fait place à quelque chose que [minister.GetSheHe] avait oublié être possible : la conviction."
 cc_neg.18.a: "Laissez [minister.GetHerHim] parler. La cour écoutera."

 cc_neg.19.title: "Un expansionniste téméraire trouve une nouvelle direction"
 cc_neg.19.desc: "Des années de paix et d'antagonismes diminués ont laissé à [minister.GetName] le temps de réfléchir à la véritable utilité d'un conseil audacieux. La réponse à laquelle [minister.GetSheHe] est parvenu(e) est plus mesurée que ses conseils passés — mais reste ambitieuse."
 cc_neg.19.a: "Leur énergie est désormais un atout — une expansion régulière, et non téméraire."
 cc_neg.19.b: "Réorienter totalement cette énergie — laisser [minister.GetHerHim] devenir un provocateur."

 # ============================================================
 # Follow-Up Events (cc_neg.100–103)
 # ============================================================

 cc_neg.100.title: "Le nouveau projet du ministre"
 cc_neg.100.desc: "Quelques mois après que [minister.GetName] a reçu un nouvel objectif, la nouvelle arrive de ce que [minister.GetSheHe] a accompli — ou manqué d'accomplir. L'investissement a porté ses fruits d'une manière ou d'une autre. Que cette forme soit bienvenue est une autre question."
 cc_neg.100.a: "Qu'est-il advenu de l'initiative du ministre ?"

 cc_neg.101.title: "Le ministre réaffecté rend compte"
 cc_neg.101.desc: "[minister.GetName] s'est vu confier une tâche exigeante pour canaliser [minister.GetHerHis] ambitions. Plusieurs mois ont passé. Les résultats sont tombés — et ils révèlent si cette nouvelle affectation a réellement changé quoi que ce soit."
 cc_neg.101.a: "Notez le résultat."

 cc_neg.102.title: "Les suites du pot-de-vin"
 cc_neg.102.desc: "Le paiement a été effectué. L'arrangement a été compris. Ce qui restait à éclaircir était de savoir si [minister.GetName] l'honorerait — ou s'il se contenterait d'empocher l'or en considérant la transaction comme un premier versement. Les mois écoulés ont apporté une réponse."
 cc_neg.102.a: "Rendez compte de ce qui s'est passé."

 cc_neg.103.title: "L'ombre du conseiller congédié"
 cc_neg.103.desc: "Le renvoi d'un conseiller expansionniste passe rarement inaperçu. Les cours observent ces choses. Certains interprètent la retenue comme de la sagesse ; d'autres y voient une vulnérabilité. Des échos nous sont revenus sur la manière dont la décision a été accueillie."
 cc_neg.103.a: "Cela a donc été remarqué."
 cc_neg.2.desc: "Notre trésor a été plein, et [minister.GetName] a été à la cour lors de chaque campagne de la dernière décennie. Un schéma se dessine dans les conseils de [minister.GetHerHis] : les accords que [minister.GetSheHe] recommande sont toujours un peu moins favorables que notre position ne le justifierait. L'avantage semble profiter à quelqu'un d'autre."
 cc_neg.4.desc: "L'âge a avancé, mais [minister.GetName] non. [minister.GetHerHis] méthodes étaient autrefois adéquates. Désormais, elles sont simplement prudentes, et la prudence est un autre mot pour désigner la lenteur. L'efficacité du cabinet en pâtit silencieusement."
 cc_neg.12.desc: "Des années de paix ont tendance à rappeler aux ministres à quoi sert réellement la gouvernance. [minister.GetName] a passé cette période de calme dans une réflexion sincère. La voix du profit dans le conseil de [minister.GetHerHis] s'est tue."
