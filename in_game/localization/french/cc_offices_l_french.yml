 # GENERATED FILE. Do not edit by hand. python tools/generate_offices.py

 cc_office.1.title: "Une place à la cour"
 cc_office.1.desc: "La maison a des postes à pourvoir, et un ministre qui pourrait en occuper un. Quelle fonction convient à [Character.GetName] ?"
 cc_office.1.none: "Aucun poste approprié n'est vacant."
 cc_office.2.title: "Une charge se transmet"
 cc_office.2.desc: "Ce que faisait la fonction est désormais accompli d'une autre manière, et le poste est supprimé. Son titulaire retourne au service ordinaire."
 cc_office.2.a: "Ainsi s'achèvent les fonctions."

 # Appointment interaction (cc_office_appoint.txt)
 cc_office_appoint_to_household: "Nommer à la Maison"
 cc_office_appoint_to_household_desc: "Nommez un ministre à un poste à la cour. Les postes disponibles dépendent des connaissances du royaume : une avancée ouvre un bureau, et une suivante peut le refermer. Un ministre n'occupe qu'un seul poste à la fois, et la maison en supporte 6."
 cc_office_appoint_to_household_desc_specific: "[SCOPE.sCharacter('recipient').GetName] se verra proposer les postes pour lesquels sa formation le prédispose."
 cc_office_appoint_to_household_act: "$cc_office_appoint_to_household$"
 cc_office_appoint_to_household_past: "Nommé à la Maison"
 cc_office_appoint_to_household_act_past: "[SCOPE.sCharacter('recipient').GetName] a reçu un poste à la cour."
 cc_office_choose_appointee: "Qui doit être promu ?"
 cc_office_none_appointee: "@trigger_no! Aucun ministre n'est à la fois formé et libre de tout poste."
 cc_office_appoint_tt: "La fonction apporte son bénéfice tant qu'ils la détiennent, proportionnellement à leur ancienneté."
 cc_office_appoint_advance_tt: "Les postes sont ouverts par des avancées. Poursuivre les recherches ouvrira de nouveaux postes."
 cc_office_appoint_obsolete_tt: "Une promotion peut également fermer un bureau. Son titulaire est libéré et le poste n'est pas remplacé."

 # Household tab (cc_office_household.gui)
 CC_OFFICE_TAB_HOUSEHOLD: "Maison"
 CC_OFFICE_FILLED_LABEL: "Postes pourvus"
 CC_OFFICE_HELD_HEADER: "En fonction"
 CC_OFFICE_OPEN_HEADER: "Poste vacant"
 CC_OFFICE_SENIORITY: "ancienneté"
 CC_OFFICE_TAB_NOTE: "La recherche d'une avancée peut ouvrir un poste à la cour, et une avancée ultérieure peut en fermer un. Un ministre n'occupe qu'un seul poste à la fois, et la maison en supporte 6 au total. Nommez quelqu'un depuis la carte d'un poste ouvert, ou depuis le menu d'interaction du ministre lui-même."

 # Seneschal [core]
 cc_office_seneschal: "Sénéchal"
 cc_office_seneschal_desc: "Gère la maison et les terres du seigneur. Remplacé dès lors que les archives écrites de la chancellerie font de ce bureau un poste clérical."
