 cc_office.10.title: "Les comptes de la Maison"
 cc_office.10.desc: "Ils ont examiné les comptes de la maison. De l'argent s'échappe des cuisines et des écuries depuis des années, et ceux qui le prennent sont bien connectés."
 cc_office.10.a: "Cessez cela, peu importe qui cela offense."
 cc_office.10.b: "Discrètement, et sans nommer personne."
 cc_office.10.c: "Les laisser réorganiser la maison."
 cc_office.11.title: "Une querelle de préséance"
 cc_office.11.desc: "Ils sont en désaccord avec les grandes familles sur l'ordre de préséance à la cour, et les deux parties attendent que la couronne tranche."
 cc_office.11.a: "Soutenir l'officier."
 cc_office.11.b: "Soutenir les familles."
 cc_office.11.c: "Leurs longs services règlent la question."
 cc_office.12.title: "Un sermon à la cour"
 cc_office.12.desc: "Ils ont prêché devant toute la cour, et le sermon est répété dans toutes les églises de la capitale."
 cc_office.12.a: "Le faire imprimer."
 cc_office.12.b: "Un bon sermon. Rien de plus."
 cc_office.12.c: "Le faire prêcher à travers le royaume."
 cc_office.13.title: "Une question de conscience"
 cc_office.13.desc: "Ils ont refusé d'approuver une décision de la couronne, et le disent ouvertement."
 cc_office.13.a: "Infirmer leurs décisions."
 cc_office.13.b: "Céder."
 cc_office.13.c: "Ils ont mérité d'être entendus."
 cc_office.14.title: "Accumulation de pétitions"
 cc_office.14.desc: "Les pétitions adressées à la couronne s'accumulent dans leur bureau plus vite qu'elles ne peuvent être lues."
 cc_office.14.a: "Blanchissez-les, peu importe le temps que cela prendra."
 cc_office.14.b: "Les laisser attendre."
 cc_office.14.c: "Leur faire réformer la procédure."
 cc_office.15.title: "Une inspection des bureaux"
 cc_office.15.desc: "Ils veulent inspecter chaque bureau sous leurs ordres, et les clercs sont au courant."
 cc_office.15.a: "Tout inspecter."
 cc_office.15.b: "Un avertissement suffira."
 cc_office.15.c: "Faites-leur confiance pour savoir où chercher."
 cc_office.16.title: "Un festival à la cour"
 cc_office.16.desc: "Ils proposent un festival à l'ancienne manière, avec de la musique, des pièces de théâtre et beaucoup de nourriture."
 cc_office.16.a: "Ne ménagez pas vos dépenses."
 cc_office.16.b: "Rester modeste."
 cc_office.16.c: "Les laisser s'organiser."
 cc_office.17.title: "Une mode étrangère"
 cc_office.17.desc: "Ils ont adopté une mode venue de l'étranger, et la moitié de la cour a suivi. L'autre moitié est offensée."
 cc_office.17.a: "Adoptez-la à la cour."
 cc_office.17.b: "L'interdire."
 cc_office.17.c: "Ils savent ce qui durera."
 cc_office.18.title: "Nouvelles de la frontière"
 cc_office.18.desc: "Ils apportent des nouvelles des provinces frontalières : agitation, mauvaises récoltes et fonctionnaires que personne n'a contrôlés depuis des années."
 cc_office.18.a: "Agissez dès maintenant."
 cc_office.18.b: "Classer pour plus tard."
 cc_office.18.c: "Envoyez-les s'en occuper."
 cc_office.19.title: "Les notables provinciaux"
 cc_office.19.desc: "Ils ont amené à la cour une délégation de notables provinciaux qui souhaitent être entendus."
 cc_office.19.a: "Recevez-les avec honneur."
 cc_office.19.b: "Renvoyez-les chez eux."
 cc_office.19.c: "Ils connaissent ces gens."
