l_french:

 ########################
 # AGE-SPECIFIC TRAIT NAMES & DESCRIPTIONS
 ########################

 eastern_pragmatist: "Pragmatique de l'Est"
 desc_eastern_pragmatist: "Nourri par les traditions intellectuelles de l'Orient, ce conseiller applique une culture d'administration savante vieille de plusieurs siècles aux défis de l'époque. Les institutions se propagent plus efficacement, et le développement s'effectue à un coût mesuré."
 eastern_pragmatist_die_desc: "Une voix mesurée a quitté la cour. L'érudition et la discipline administrative qu'ils ont défendues laissent un héritage plus discret que beaucoup — et peut-être plus durable."

 sufi_scholar: "Érudit soufi"
 desc_sufi_scholar: "Imprégnée des traditions mystiques et rationnelles du savoir islamique, cette conseillère fait le pont entre doctrine et recherche. Le travail missionnaire est affiné, les hérétiques sont écoutés avec plus de patience et l'alphabétisation progresse discrètement."
 sufi_scholar_die_desc: "Les cercles de savoir que ce ministre a maintenus ne seront pas facilement remplacés."

 cautious_merchant: "Marchand prudent"
 desc_cautious_merchant: "Marchand par instinct, ce conseiller voit les paris coloniaux avec suspicion — les rendements sont trop lents, les risques trop grands. Le commerce fleurit sous sa direction, mais les expéditions perdent un défenseur discret."
 cautious_merchant_die_desc: "Les registres tenus à jour par cette main méticuleuse survivent à la main elle-même d'une génération entière."

 reformist_theologian: "Théologien réformiste"
 desc_reformist_theologian: "Les bouleversements religieux de l'époque ont dépassé les frontières de la chrétienté. Ce conseiller, façonné par les courants de renouveau doctrinal au sein de sa propre tradition, mène la conversion avec le zèle d'un réformateur et la précision d'un érudit."
 reformist_theologian_die_desc: "Les débats internes suscités par ce ministre se poursuivront sans lui."

 orthodox_defender: "Défenseur de la Foi"
 desc_orthodox_defender: "Dans un monde de doctrines mouvantes, ce conseiller s'accroche aux enseignements établis. L'hérésie ne doit pas être tolérée — la croyance correcte doit être défendue, quelles que soient les exigences de l'époque."
 orthodox_defender_die_desc: "Les traditions que ce ministre a défendues subsistent — du moins pour l'instant."

 crown_theologian: "Théologien de la Couronne"
 desc_crown_theologian: "Ce conseiller navigue sur le terrain délicat entre l'Église et la Couronne. En gardant le clergé satisfait et les prérogatives du roi intactes, il préserve un équilibre que ni l'un ni l'autre ne soutiennent pleinement — mais avec lequel les deux peuvent composer."
 crown_theologian_die_desc: "L'équilibre fragile maintenu entre la cour et le clergé sera durement mis à l'épreuve maintenant que ce ministre est parti."

 renaissance_humanist: "Humaniste de la Renaissance"
 desc_renaissance_humanist: "Façonné par l'épanouissement des arts et du savoir, ce conseiller prône le libre échange des idées. Il accélère la propagation des nouvelles institutions et encourage l'alphabétisation partout où il sert."
 renaissance_humanist_die_desc: "[CHARACTER.GetName] est décédé(e). Les bibliothèques que [CHARACTER.GetSheHe] a fondées et les érudits que [CHARACTER.GetSheHe] a guidés perpétueront [CHARACTER.GetHerHis] héritage."

 age_of_discovery_pioneer: "Pionnier de la Découverte"
 desc_age_of_discovery_pioneer: "Forgé à l'Âge des Découvertes, ce conseiller brûle de l'esprit d'exploration. La vitesse des expéditions augmente, et les entreprises coloniales attirent davantage d'âmes volontaires."
 age_of_discovery_pioneer_die_desc: "[CHARACTER.GetName] est parti(e), et les rivages inexplorés qu'[CHARACTER.GetSheHe] a cartographiés restent le témoignage d'une âme agitée."

 age_of_discovery_skeptic: "Sceptique des mers"
 desc_age_of_discovery_skeptic: "Ce conseiller prône la prudence — les routes maritimes sont traîtresses, les retours incertains. Les expéditions menées sous son ombre avancent avec plus d'hésitation."
 age_of_discovery_skeptic_die_desc: "[CHARACTER.GetName] est parti(e). Peut-être [CHARACTER.GetSheHe] avait-il/elle raison d'être prudent(e)."

 reformation_preacher: "Prêcheur de la Réforme"
 desc_reformation_preacher: "Façonné par les grands bouleversements religieux de l'époque, ce conseiller prêche la tolérance comme voie vers la paix. Les hérétiques trouvent une oreille plus attentive à la cour, et les efforts de conversion sont redynamisés."
 reformation_preacher_die_desc: "[CHARACTER.GetName] est décédé(e), et les voix modérées que [CHARACTER.GetSheHe] défendait s'estompent peu à peu."

 reformation_inquisitor: "Inquisiteur de la Réforme"
 desc_reformation_inquisitor: "Produit des guerres de confession, ce conseiller considère la différence de foi comme une menace existentielle. La tolérance envers les hérétiques et les païens souffre sous ses conseils."

 absolute_administrator: "Administrateur absolu"
 desc_absolute_administrator: "Formé à la doctrine de l'autorité souveraine, ce conseiller resserre l'emprise de la couronne sur les affaires locales. Le contrôle se propage plus facilement, mais les états s'impatientent face à la centralisation."
 absolute_administrator_die_desc: "[CHARACTER.GetName] est décédé(e). La machine de contrôle que [CHARACTER.GetSheHe] a bâtie survivra à [CHARACTER.GetHerHim]."

 noble_patron: "Patron noble"
 desc_noble_patron: "Ce conseiller sait que la bonne volonté de la noblesse vaut plus que le simple or. La noblesse prospère sous sa gestion attentive, bien que l'enrichissement des grandes maisons soit discrètement découragé."
 noble_patron_die_desc: "[CHARACTER.GetName] est parti(e), et la noblesse qu'[CHARACTER.GetSheHe] a cultivée mettra un certain temps à se trouver un nouveau protecteur."

 parliamentarian: "Parlementaire"
 desc_parliamentarian: "Opérateur habile dans les couloirs du parlement, ce conseiller bâtit de larges coalitions et soutire des votes aux membres réticents — bien que la révocation des privilèges nobiliaires devienne plus coûteuse lorsqu'ils ont l'ascendant."

 privilege_reformer: "Réformateur du privilège"
 desc_privilege_reformer: "Ce conseiller estime que l'autorité souveraine ne doit pas être entravée par des prérogatives d'estates obsolètes. Révoquer les privilèges devient moins coûteux, bien que les nobles déplorent chaque étape."
 privilege_reformer_die_desc: "[CHARACTER.GetName] est parti(e), et les États poussent un discret soupir de soulagement."

 revolutionary_agitator: "Agitateur révolutionnaire"
 desc_revolutionary_agitator: "Emporté par les courants de la révolution, la rhétorique de ce conseiller enflamme autant qu'elle inspire. Les factions rebelles trouvent un terrain fertile partout où [CHARACTER.GetSheHe] occupe un poste."
 revolutionary_agitator_die_desc: "[CHARACTER.GetName] est décédé(e). Reste à savoir si les feux qu'[CHARACTER.GetSheHe] a allumés s'éteindront ou se propageront."

 counterrevolutionary: "Contre-révolutionnaire"
 desc_counterrevolutionary: "Ce conseiller voit la révolution comme une catastrophe à éviter à tout prix — y compris au prix de la satisfaction des états mêmes dont la couronne a besoin pour coopérer. Révoquer les privilèges devient plus difficile à mesure qu'il enracine les intérêts réactionnaires."
 counterrevolutionary_die_desc: "[CHARACTER.GetName] est décédé(e). L'ordre qu'[CHARACTER.GetSheHe] s'est efforcé(e) de préserver pourrait ne pas survivre longtemps après [CHARACTER.GetHerHim]."

 privilege_champion: "Champion du privilège"
 desc_privilege_champion: "À l'ère des révolutions, ce conseiller lutte pour réduire les charges de la couronne en supprimant les prérogatives des ordres. Il est moins coûteux de les révoquer, mais la prospérité en pâtit alors que la confiance institutionnelle vacille."
 privilege_champion_die_desc: "[CHARACTER.GetName] est parti(e), et les privilèges qu'[CHARACTER.GetSheHe] a lutté pour abolir pourraient trouver de nouveaux défenseurs."

 ########################
 # COUNTRY MODIFIERS
 ########################

 cc_cabinet_ministerial_investment: "Investissement ministériel"
 cc_cabinet_ministerial_investment_desc: "Un membre du cabinet a dirigé des fonds publics vers des améliorations durables du rang diplomatique et de la prospérité nationale."

 cc_cabinet_revoke_difficulty: "Résistance des États"
 cc_cabinet_revoke_difficulty_desc: "Des États enhardis rendent la révocation de leurs privilèges plus difficile pour la couronne."

 cc_cabinet_parliamentary_guidance: "Orientation parlementaire"
 cc_cabinet_parliamentary_guidance_desc: "Une main parlementaire experte au sein du cabinet améliore l'influence de la couronne sur la chambre."

 cc_cabinet_diplomatic_influence: "Influence diplomatique"
 cc_cabinet_diplomatic_influence_desc: "La diplomatie active d'un membre du cabinet a réduit l'antagonisme que nos voisins dirigent vers nous."

 cc_cabinet_provincial_flourishing: "Essor provincial"
 cc_cabinet_provincial_flourishing_desc: "L'attention d'un ministre a revitalisé la prospérité de cette province."

 cc_cabinet_pop_conversion: "Campagne de conversion ministérielle"
 cc_cabinet_pop_conversion_desc: "Un membre du cabinet promeut activement la conversion religieuse à travers le royaume."

 cc_cabinet_cultural_outreach: "Rayonnement culturel"
 cc_cabinet_cultural_outreach_desc: "Un ministre favorise les échanges culturels et l'alphabétisation dans cette province."

 ########################
 # TRAIT EVENT LOCALIZATION (cc_traits namespace)
 ########################

 # cc_traits.1 — Integration Trait Grant
 cc_traits.1.title: "Début des travaux d'intégration"
 cc_traits.1.desc: "Notre ministre [minister.GetName], chargé de superviser les efforts d'intégration, a trouvé son rythme. Son approche reflète ses capacités et laissera une marque durable sur la manière dont le travail est conduit."
 cc_traits.1.e: "Reconsidérons la situation"

 # ========================
 # NEW AGE TRAITS (cc_traits.30-39)
 # ========================

 dogmatic_zealot: "Zélote dogmatique"
 desc_dogmatic_zealot: "Les feux des bouleversements religieux n'ont pas ouvert l'esprit de ce ministre — ils l'ont scellé. Défenseur rigide de la doctrine orthodoxe, il a rendu notre cour moins tolérante envers la dissidence et plus dépendante de la bonne volonté du clergé."
 dogmatic_zealot_die_desc: "[CHARACTER.GetName] est parti(e). Peu regretteront les certitudes rigides qu'[CHARACTER.GetSheHe] a imposées — bien que le clergé puisse le faire."

 empiricist_counselor: "Conseiller empiriste"
 desc_empiricist_counselor: "Façonné par les nouvelles méthodes d'observation et d'expérimentation, ce ministre applique une approche empirique rigoureuse à la gouvernance. Sous son influence, la recherche s'accélère et l'expansion d'une administration alphabétisée s'étend discrètement."
 empiricist_counselor_die_desc: "[CHARACTER.GetName] est décédé(e). Les habitudes d'enquête minutieuse que [CHARACTER.GetSheHe] a instaurées persisteront plus longtemps que n'importe quelle découverte spécifique que [CHARACTER.GetSheHe] a faite."

 civic_chancellor: "Chancelier civil"
 desc_civic_chancellor: "Là où d'autres ministres voient des villes, ce conseiller voit des systèmes de gouvernance qui ne demandent qu'à être optimisés. Sa maîtrise de la réforme urbaine a réduit le coût de la construction et a fait du cabinet un instrument plus efficace de la volonté de la couronne."
 civic_chancellor_die_desc: "[CHARACTER.GetName] est parti(e). La machine civique qu'[CHARACTER.GetSheHe] a réglée continuera de tourner — mais les machines ont besoin de mécaniciens."

 chief_cartographer: "Cartographe en chef"
 desc_chief_cartographer: "Les espaces blancs sur une carte ne sont pas de l'ignorance — ils sont une opportunité. Ce ministre a transformé nos ambitions exploratoires en une entreprise systématique, accélérant les expéditions et attirant de nouveaux colons vers la frontière."
 chief_cartographer_die_desc: "[CHARACTER.GetName] est décédé(e). Les cartes qu'[CHARACTER.GetSheHe] a commandées et corrigées guideront nos navires bien après que la main du cartographe se soit immobilisée."

 trade_consortium_minister: "Ministre du consortium commercial"
 desc_trade_consortium_minister: "Le commerce est le système nerveux de l'empire, et ce ministre comprend chaque nœud du réseau. Les centres commerciaux prospèrent sous sa direction, et la capacité diplomatique croît à chaque nouvelle relation mercantile qu'il cultive."
 trade_consortium_minister_die_desc: "[CHARACTER.GetName] est décédé(e). Les relations commerciales qu'[CHARACTER.GetSheHe] a entretenues persisteront — les marchands sont fidèles au profit, pas aux ministres."

 peace_commissioner: "Commissaire à la Paix"
 desc_peace_commissioner: "Ce ministre a fait de la tolérance un instrument géopolitique. En réduisant les frictions entre confessions, il a diminué l'antagonisme que nos voisins dirigent vers nous et a gagné une marge de manœuvre qu'un conflit ouvert aurait compromise."
 peace_commissioner_die_desc: "[CHARACTER.GetName] est décédé(e). Les tolérances fragiles que [CHARACTER.GetSheHe] maintenait seront maintenant mises à l'épreuve. Espérons que le précédent tienne."

 theological_statesman: "Homme d'État théologue"
 desc_theological_statesman: "Pour ce ministre, la foi et la gouvernance ne sont pas des domaines distincts — elles font partie du même projet. En alignant les intérêts cléricaux sur l'agenda législatif de la couronne, ils ont rendu le parlement plus docile et le clergé plus investi dans la réussite du royaume."
 theological_statesman_die_desc: "[CHARACTER.GetName] est décédé(e). L'équilibre délicat que [CHARACTER.GetSheHe] maintenait entre l'Église et le Parlement demandera un talent hors du commun pour être préservé."

 standing_army_advocate: "Défenseur d'une armée permanente"
 desc_standing_army_advocate: "L'ère de la levée temporaire est terminée — ce ministre a fait de la doctrine de l'armée permanente le fondement durable de notre puissance militaire. La discipline s'est améliorée, les coûts de fortification ont baissé et la noblesse a trouvé un nouvel argument pour justifier son caractère indispensable."
 standing_army_advocate_die_desc: "[CHARACTER.GetName] est décédé(e). La culture militaire professionnelle qu'[CHARACTER.GetSheHe] a défendue survivra à [CHARACTER.GetHerHim] — les armées permanentes, comme toutes les institutions, acquièrent leur propre inertie."

 tax_inspector_general: "Inspecteur général des impôts"
 desc_tax_inspector_general: "Aucune pièce n'est oubliée et aucune exemption ne passe inaperçue tant que ce ministre occupe son poste. Les dépenses de la cour ont chuté, l'efficacité du cabinet a augmenté et le trésor a appris à craindre ses audits."
 tax_inspector_general_die_desc: "[CHARACTER.GetName] est décédé(e). Les registres que [CHARACTER.GetSheHe] tenait dans un ordre si impeccable seront les premières victimes d'un successeur moins diligent."

 national_reformer: "Réformateur national"
 desc_national_reformer: "À l'ère des révolutions, ce ministre a trouvé une voie médiane : la réforme systématique par le processus parlementaire. Les changements gouvernementaux coûteux deviennent plus abordables, et la base de soutien du parlement s'accroît là où ils travaillent."
 national_reformer_die_desc: "[CHARACTER.GetName] est décédé(e). Les réformes qu'[CHARACTER.GetSheHe] a fait adopter par le parlement sont permanentes — la tradition de réforme qu'[CHARACTER.GetSheHe] a établie ne l'est pas."

 industrial_visionary: "Visionnaire industriel"
 desc_industrial_visionary: "Ce ministre a entrevu l'avenir dans une presse à imprimer et un fourneau. L'application de nouvelles méthodes mécaniques à la construction et à la production a réduit les coûts de construction et accéléré le rythme de croissance de notre royaume."
 industrial_visionary_die_desc: "[CHARACTER.GetName] est décédé(e). Les machines qu'[CHARACTER.GetSheHe] a commandées fonctionneront sans [CHARACTER.GetHerHim] — c'était d'ailleurs tout l'objectif."

 # ========================
 # AGE TRAIT EVENTS (cc_traits.30-39)
 # ========================

 cc_traits.30.title: "La méthode de l'empiriste"
 cc_traits.30.desc: "[minister.GetName] a expérimenté les nouvelles méthodes d'enquête systématique — observation, hypothèse, vérification. Les résultats ont été remarqués. Comment devons-nous orienter cet esprit méthodique ?"
 cc_traits.30.a: "Nommez [minister.GetName] comme [ShowTraitName('empiricist_counselor')] — que les nouvelles méthodes guident notre gouvernance."
 cc_traits.30.b: "Encourager l'enquête de [minister.GetName] sans nomination formelle."

 cc_traits.31.title: "Le réformateur urbain"
 cc_traits.31.desc: "[minister.GetName] a passé un temps considérable dans les ateliers et les salles du conseil de la capitale, répertoriant les inefficacités et proposant des améliorations. Les États bourgeois ont remarqué ces efforts. Comment devons-nous répondre ?"
 cc_traits.31.a: "Formaliser le rôle de [minister.GetName] en tant que [ShowTraitName('civic_chancellor')] — laissons-les systématiser ce qu'ils ont commencé."
 cc_traits.31.b: "Soutenir le travail de [minister.GetName] sans nomination formelle."

 cc_traits.32.title: "La commission du cartographe"
 cc_traits.32.desc: "[minister.GetName] a travaillé en étroite collaboration avec nos explorateurs et navigateurs, transformant leurs observations en cartes systématiques. Le travail est impressionnant. Comment allons-nous l'orienter ?"
 cc_traits.32.a: "Nommer [minister.GetName] comme notre [ShowTraitName('chief_cartographer')] — que les cartes guident nos ambitions."
 cc_traits.32.b: "Laissez [minister.GetName] continuer sans nomination formelle — accorder [ShowTraitName('age_of_discovery_skeptic')]."

 cc_traits.33.title: "Le Grand Tour du Marchand"
 cc_traits.33.desc: "[minister.GetName] est revenu d'une étude approfondie de nos routes commerciales et des territoires sujets, avec plein de propositions pour consolider notre position commerciale. La communauté marchande est enthousiaste. Quelle est notre réponse ?"
 cc_traits.33.a: "Nommez [minister.GetName] comme [ShowTraitName('trade_consortium_minister')] — que le commerce devienne un instrument diplomatique."
 cc_traits.33.b: "Soutenir le travail commercial de [minister.GetName] sans nomination formelle."

 cc_traits.34.title: "Le gambit du pacificateur"
 cc_traits.34.desc: "[minister.GetName] a approché nos voisins avec une proposition visant à réduire les tensions religieuses — un risque calculé dans une époque divisée. Certains à la cour applaudissent l'initiative ; d'autres y voient une faiblesse. Comment répondons-nous ?"
 cc_traits.34.a: "Approuver les efforts de paix de [minister.GetName] — le nommer comme notre [ShowTraitName('peace_commissioner')]."
 cc_traits.34.b: "Rejeter la proposition — la tolérance est une concession à l'hérésie — octroyer [ShowTraitName('dogmatic_zealot')]."
 cc_traits.34.c: "Laissez [minister.GetName] continuer discrètement, sans nomination formelle."

 cc_traits.35.title: "L'homme d'État théologien"
 cc_traits.35.desc: "[minister.GetName] a jeté des ponts entre le clergé et la chambre parlementaire — un projet délicat qui semble porter ses fruits. Comment devons-nous reconnaître formellement cet accomplissement ?"
 cc_traits.35.a: "Nommer [minister.GetName] en tant que notre [ShowTraitName('theological_statesman')] — pour que la foi et la gouvernance ne forment plus qu'un seul projet."
 cc_traits.35.b: "Attribuez à [minister.GetName] le titre formel de [ShowTraitName('crown_theologian')]."
 cc_traits.35.c: "Féliciter [minister.GetName] pour son travail sans promotion formelle."

 cc_traits.36.title: "Le défenseur de l'armée permanente"
 cc_traits.36.desc: "[minister.GetName] a passé des années à plaider pour la transition vers une armée professionnelle permanente — et a récemment produit une proposition complète sur la manière d'y parvenir. Les nobles sont sceptiques mais à l'écoute. Comment procéder ?"
 cc_traits.36.a: "Approuver la proposition de [minister.GetName] — le nommer comme notre [ShowTraitName('standing_army_advocate')]."
 cc_traits.36.b: "Soutenir le concept sans nomination formelle."

 cc_traits.37.title: "L'inspecteur des impôts"
 cc_traits.37.desc: "[minister.GetName] a mené un audit approfondi des dépenses de la couronne et a produit un ensemble de recommandations sobering. La cour est mal à l'aise, mais les chiffres ne mentent pas. Comment répondons-nous ?"
 cc_traits.37.a: "Nommez [minister.GetName] comme [ShowTraitName('tax_inspector_general')] — que chaque pièce soit comptée."
 cc_traits.37.b: "Adopter certaines des recommandations de [minister.GetName] sans nomination formelle."

 cc_traits.38.title: "Le ministre national"
 cc_traits.38.desc: "[minister.GetName] a élaboré un programme de réforme complet pour le système parlementaire — une proposition qui pourrait changer le fonctionnement de la gouvernance pour des générations. La chambre observe."
 cc_traits.38.a: "Nommer [minister.GetName] comme notre [ShowTraitName('national_reformer')] — que le parlement devienne un instrument de changement durable."
 cc_traits.38.b: "Adopter des parties du programme de [minister.GetName] sans promotion formelle."

 cc_traits.39.title: "Le visionnaire industriel"
 cc_traits.39.desc: "[minister.GetName] est revenu d'une inspection des ateliers de la capitale les yeux brillants. De nouvelles méthodes de production, de nouveaux matériaux, de nouvelles possibilités — et une proposition détaillée pour les mettre à l'échelle. Les États bourgeois sont intrigués."
 cc_traits.39.a: "Nommer [minister.GetName] comme notre [ShowTraitName('industrial_visionary')] — que les nouvelles méthodes transforment le royaume."
 cc_traits.39.b: "Soutenir l'initiative sans nomination formelle."

 # cc_traits.10 — Renaissance-era intellectual trait spawn (culturally branched)
 cc_traits.10.title: "Un savant de l'époque"
 cc_traits.10.desc: "[minister.GetName] a été façonné par les grands courants intellectuels de cette ère. La forme que prend le savoir peut différer selon la tradition, mais le potentiel pour le mettre au service de l'État reste le même."
 cc_traits.10.a: "Un développement 반joué — que le nouveau savoir guide leur travail — accorde [ShowTraitName('renaissance_humanist')]."
 cc_traits.10.b: "Embrasser une voie de sagesse pratique et d'art gouvernemental — accorder [ShowTraitName('eastern_pragmatist')]."
 cc_traits.10.c: "La voie de l'érudition et de la contemplation leur convient — accorder [ShowTraitName('sufi_scholar')]."
 cc_traits.10.d: "Encourager [minister.GetName] à continuer d'observer — le royaume pourrait en bénéficier avec le temps."

 # cc_traits.11 — Discovery Pioneer / Skeptic / Cautious Merchant
 cc_traits.11.title: "Forger de nouveaux horizons"
 cc_traits.11.desc: "L'ère des explorations a laissé sa marque sur [minister.GetName]. Comment allons-nous orienter sa relation avec la mer [minister.GetHerHis]?"
 cc_traits.11.a: "Encourager l'exploration audacieuse — accorder [ShowTraitName('age_of_discovery_pioneer')]."
 cc_traits.11.b: "Conseillez la prudence et la retenue — accorde [ShowTraitName('age_of_discovery_skeptic')]."
 cc_traits.11.c: "Orientez leur énergie vers le commerce et non vers des rivages lointains — accordez [ShowTraitName('cautious_merchant')]."
 cc_traits.11.d: "L'envoyer aux chantiers navals !"

 # cc_traits.12 — Reformation / Religious Upheaval traits (culturally branched)
 cc_traits.12.title: "Voix de la réforme"
 cc_traits.12.desc: "Les feux du changement religieux ont mis à l'épreuve la foi de [minister.GetName]. Que cette épreuve ait ouvert son esprit ou renforcé ses convictions, c'est à nous de le guider[minister.GetHerHis][minister.GetHerHis]."
 cc_traits.12.a: "Favoriser la tolérance et le dialogue — accorder [ShowTraitName('reformation_preacher')]."
 cc_traits.12.b: "Maintenir la foi contre les déviances — accorder [ShowTraitName('reformation_inquisitor')]."
 cc_traits.12.c: "Encourager le renouveau doctrinal au sein de notre tradition — accorder [ShowTraitName('reformist_theologian')]."
 cc_traits.12.d: "Les enseignements établis doivent être défendus coûte que coûte — accorde [ShowTraitName('orthodox_defender')]."
 cc_traits.12.e: "[minister.GetName] refuse de s'impliquer dans tout cela — accorder [ShowTraitName('dogmatic_zealot')]."

 # cc_traits.13 — Absolutism traits
 cc_traits.13.title: "La gouvernance à l'ère des rois"
 cc_traits.13.a: "Mettre l'accent sur le contrôle central — accorder [ShowTraitName('absolute_administrator')]."
 cc_traits.13.b: "Cultiver la bonne volonté des nobles — accorder [ShowTraitName('noble_patron')]."
 cc_traits.13.c: "Travailler avec le parlement — octroyer [ShowTraitName('parliamentarian')]."
 cc_traits.13.d: "Réformer la structure des privilèges — accorder [ShowTraitName('privilege_reformer')]."
 cc_traits.13.e: "Que le théologien de la couronne navigue entre l'Église et l'État — accorder [ShowTraitName('crown_theologian')]."

 # cc_traits.14 — Revolutions traits
 cc_traits.14.title: "L'esprit de révolution"
 cc_traits.14.desc: "L'ère révolutionnaire a atteint [minister.GetName]. Que [minister.GetSheHe] surfe sur sa vague, s'y oppose ou tente de l'exploiter pour la couronne façonnera la suite des événements."
 cc_traits.14.a: "Laissez l'esprit révolutionnaire s'exprimer — accorder [ShowTraitName('revolutionary_agitator')]."
 cc_traits.14.b: "Restez ferme pour l'ordre et la hiérarchie — accorde [ShowTraitName('counterrevolutionary')]."
 cc_traits.14.c: "Profitons de l'occasion pour dépouiller les États de leurs anciens privilèges — octroyer [ShowTraitName('privilege_champion')]."

 # cc_traits.20 — Ruler Teaches
 cc_traits.20.title: "Le [Root.GetRulerTitle] offre sa sagesse"
 cc_traits.20.desc: "Notre souverain a remarqué le potentiel de [student.GetName]. Avec les bons conseils, [student.GetSheHe] pourrait devenir un ministre d'une réelle distinction. Quelles connaissances la Couronne doit-elle partager ?"
 cc_traits.20.a: "Enseigner à [student.GetName] les disciplines de la guerre et du commandement — octroyer [ShowTraitName('tactical_advisor')]."
 cc_traits.20.b: "Partager les arts du savoir et de la législation — accorder [ShowTraitName('learned_counselor')]."
 cc_traits.20.c: "Impartissez la sagesse de la loyauté et de la diplomatie — accordez [ShowTraitName('loyal_steward')]."
 cc_traits.20.d: "Une autre fois."

 # cc_traits.21 — Peer Learning
 cc_traits.21.title: "Un jeune ministre enthousiaste"
 cc_traits.21.desc: "[learner.GetName] a du temps devant [learner.GetHerHis] et un esprit vif prêt à être façonné. Quel chemin devrions-nous [learner.GetHerHim] encourager à suivre ?"
 cc_traits.21.a: "Encourager l'étude savante et l'apprentissage — accorder [ShowTraitName('learned_counselor')]."
 cc_traits.21.b: "Orienter [learner.GetHerHim] vers la doctrine militaire — accorder [ShowTraitName('tactical_advisor')]."
 cc_traits.21.c: "Guider [learner.GetHerHim] en diplomatie et en art du gouvernement — accorder [ShowTraitName('loyal_steward')]."

 ########################
 # CABINET EVENT LOCALIZATION (cc_cabinet namespace)
 ########################

 # cc_cabinet.1 — The Minister Seeks Counsel
 cc_cabinet.1.title: "Le Ministre sollicite un avis"
 cc_cabinet.1.desc: "[minister.GetName] a demandé une audience. Les conseils du ministre ont été judicieux, et peut-être qu'un mot d'encouragement — ou une tâche — lui ferait du bien. Que lui proposons-nous ?"
 cc_cabinet.1.a: "Reconnaissez les travaux érudits de [minister.GetHerHis] — accordez [ShowTraitName('learned_counselor')]."
 cc_cabinet.1.b: "Reconnaissez les services de [minister.GetHerHis] envers le royaume — accordez [ShowTraitName('loyal_steward')]."
 cc_cabinet.1.c: "Reconnaissez le talent militaire de [minister.GetHerHis] — accordez [ShowTraitName('tactical_advisor')]."
 cc_cabinet.1.d: "Les renvoyer à leurs fonctions."

 # cc_cabinet.2 — A Request for Funds
 cc_cabinet.2.title: "Une demande de fonds"
 cc_cabinet.2.a: "Accordez-le. Laissez-les s'en charger."
 cc_cabinet.2.b: "Accordez-le, avec un contrôleur pour surveiller les comptes."

 # cc_cabinet.3 — Funds follow-up
 cc_cabinet.3.title: "L'arrivée des comptes"

 # cc_cabinet.4 — Parliamentary Affairs (Age of Absolutism)
 cc_cabinet.4.title: "Le Ministre conseille sur les affaires parlementaires"
 cc_cabinet.4.desc: "[minister.GetName] a passé un temps considérable à étudier le fonctionnement du parlement et pense qu'il y a une occasion de renforcer la main de la couronne au sein de la chambre. Quelle voie allons-nous emprunter ?"
 cc_cabinet.4.a: "Travailler plus activement avec la chambre."
 cc_cabinet.4.b: "[minister.GetName] devrait poursuivre cela personnellement — accorder [ShowTraitName('parliamentarian')]."
 cc_cabinet.4.c: "Qu'ils gèrent cela comme bon leur semble."

 # cc_cabinet.10 — Courting the Estates
 cc_cabinet.10.title: "Courtiser les États"
 cc_cabinet.10.a: "Favoriser la noblesse au détriment des marchands."
 cc_cabinet.10.b: "Favoriser les marchands au détriment de la noblesse."
 cc_cabinet.10.c: "Répandez largement la bonne volonté — au prix du trésor."
 cc_cabinet.10.d: "Laisser les états à leur propre guise."

 # cc_cabinet.11 — Estate Grievances
 cc_cabinet.11.title: "Griefs des États"
 cc_cabinet.11.desc: "[minister.GetName] rapporte que les États ont des griefs qui commencent à s'envenimer. Si on ne s'en occupe pas, leur mécontentement pourrait devenir un problème. Que devons-nous faire ?"
 cc_cabinet.11.a: "Dépensez l'or et arrangez les choses."
 cc_cabinet.11.b: "Ignorez les plaintes — nous ne rendons de comptes à personne."

 # cc_cabinet.12 — Revolutionary Sentiments
 cc_cabinet.12.title: "Sentiments révolutionnaires à la cour"
 cc_cabinet.12.desc: "[minister.GetName] est revenu des provinces avec des récits de sentiments révolutionnaires parmi le peuple. L'époque exige une réponse. Allons-nous suivre le courant ou nous y opposer ?"
 cc_cabinet.12.a: "Embrasser l'énergie du changement — accorder [ShowTraitName('revolutionary_agitator')]."
 cc_cabinet.12.b: "Réprimer ces idées dangereuses."
 cc_cabinet.12.c: "Cela ne nous regarde pas."

 # cc_cabinet.13 — Minister's Ambitions (Age of Absolutism)
 cc_cabinet.13.title: "Les ambitions du Ministre"
 cc_cabinet.13.desc: "[minister.GetName] est devenu ambitieux en cet âge de consolidation. Iel a présenté deux voies à la couronne — l'une vers la réforme, l'autre vers un contrôle plus strict. Nous devons décider."
 cc_cabinet.13.a: "Soutenir la volonté de réformer les privilèges des ordres — accorder [ShowTraitName('privilege_reformer')]."
 cc_cabinet.13.b: "Centraliser le contrôle — les États s'adapteront — accorde [ShowTraitName('absolute_administrator')]."
 cc_cabinet.13.c: "Ni l'un ni l'autre. Maintenir le cap actuel."

 # cc_cabinet.20 — Diplomatic Overtures
 cc_cabinet.20.title: "Ouvertures diplomatiques"
 cc_cabinet.20.desc: "[minister.GetName] a cultivé des liens avec [neighbor_country.GetName]. Il y a là une opportunité — devons-nous l'utiliser pour instaurer une bonne volonté, ou pour réduire discrètement les tensions qui pèsent sur notre réputation ?"
 cc_cabinet.20.a: "Formaliser notre amitié avec [neighbor_country.GetName]."
 cc_cabinet.20.b: "Justifier une action agressive."
 cc_cabinet.20.c: "Ne pas toucher à cette affaire."

 # cc_cabinet.21 — Border Tensions
 cc_cabinet.21.title: "Tensions frontalières"
 cc_cabinet.21.desc: "[minister.GetName] signale des tensions latentes le long de la frontière avec [neighbor_country.GetName]. Cela pourrait être une occasion d'établir une domination — ou une crise à désamorcer discrètement."
 cc_cabinet.21.a: "Utilisons cette tension pour s'affirmer."
 cc_cabinet.21.b: "Dépêcher [minister.GetName] pour apaiser discrètement les tensions."

 # cc_cabinet.22 — Overseas Contacts
 cc_cabinet.22.title: "Contacts d'outre-mer"
 cc_cabinet.22.desc: "L'ère des explorations a ouvert des canaux de contact qui auraient semblé impossibles il y a une génération. [minister.GetName] est au centre de plusieurs de ces relations. Comment allons-nous les encourager ?"
 cc_cabinet.22.a: "Laissez [minister.GetName] ouvrir la voie — l'exploration est l'avenir — accorder [ShowTraitName('age_of_discovery_pioneer')]."
 cc_cabinet.22.b: "Utilisons ces contacts pour améliorer notre position diplomatique."
 cc_cabinet.22.c: "Se concentrer sur les priorités existantes."

 # cc_cabinet.23 — Religious Tensions Abroad
 cc_cabinet.23.title: "Tensions religieuses à l'étranger"
 cc_cabinet.23.desc: "La Réforme a fracturé la foi de nos voisins autant que la nôtre. [minister.GetName] a l'opportunité d'utiliser les divisions religieuses de [neighbor_country.GetName] à notre avantage — ou de tendre une main par-delà le fossé."
 cc_cabinet.23.a: "Chercher un terrain d'entente avec [neighbor_country.GetName]."
 cc_cabinet.23.b: "Exploiter les tensions à notre avantage."
 cc_cabinet.23.c: "Cela ne nous concerne pas."

 # cc_cabinet.30 — Provincial Investment
 cc_cabinet.30.title: "Investissement provincial"
 cc_cabinet.30.desc: "Le travail de [minister.GetName] dans les provinces a attiré l'attention des notables locaux. Avec un investissement modeste, la couronne pourrait accélérer le développement — ou canaliser cette énergie vers une prospérité durable."
 cc_cabinet.30.a: "Investir dans le développement direct."
 cc_cabinet.30.b: "Encourager un épanouissement à long terme."
 cc_cabinet.30.c: "Laisser [minister.GetName] à [minister.GetHerHis] propre ressort."

 # cc_cabinet.31 — Cultural Affairs
 cc_cabinet.31.title: "Affaires culturelles"
 cc_cabinet.31.desc: "[minister.GetName] a été en contact avec les communautés locales de [target_province.GetName]. Il y a là une opportunité — de favoriser les échanges culturels et l'alphabétisation, ou d'accélérer la conversion religieuse."
 cc_cabinet.31.a: "Encourager l'intégration culturelle et l'apprentissage."
 cc_cabinet.31.b: "Se concentrer sur les efforts de conversion."
 cc_cabinet.31.c: "Laisser la province à ses propres affaires."

 # cc_cabinet.32 — Confessional Province Work
 cc_cabinet.32.title: "Un ministre de la foi"
 cc_cabinet.32.desc: "La Réforme a fait de chaque province un terrain de lutte confessionnelle. [minister.GetName] a un choix à faire — et nous aussi. Devons-nous poursuivre la compréhension ou l'orthodoxie ?"
 cc_cabinet.32.a: "Poursuivez une conversion active — accordez [ShowTraitName('reformation_preacher')]."
 cc_cabinet.32.b: "Maintenir la foi avec une résolution ferme — accorder [ShowTraitName('reformation_inquisitor')]."
 cc_cabinet.32.c: "La foi est une affaire privée."

 # cc_cabinet.33 — Administrative Reform
 cc_cabinet.33.title: "Réforme administrative"
 cc_cabinet.33.desc: "L'époque exige une gouvernance efficace. [minister.GetName] a proposé des réformes qui renforceraient le contrôle administratif à [target_province.GetName]. La couronne peut investir davantage ou laisser le ministre s'occuper de son travail."
 cc_cabinet.33.a: "Impliquez personnellement [minister.GetName] dans l'effort de réforme — accordez [ShowTraitName('absolute_administrator')]."
 cc_cabinet.33.b: "Investissez directement dans le développement provincial."
 cc_cabinet.33.c: "Laissez [minister.GetName] agir à [minister.GetHerHis] propre discrétion."



 # ============================================================
 # cc_traits.110 — A Scholar's Work (follow-up to cc_traits.10)
 # ============================================================

 cc_traits.110.title: "L'œuvre d'un savant"
 cc_traits.110.desc: "Quelques mois après que [minister.GetName] a embrassé l'esprit de cet âge du savoir, la nouvelle arrive de son premier ouvrage significatif. Les savants, les architectes et les courtisans l'ont remarqué — certains avec admiration, d'autres avec suspicion."
 cc_traits.110.a: "Présenter leurs travaux à la cour."

 cc_master_balancer: "Maître de l'équilibre"
 desc_cc_master_balancer: "Cet homme d'État a fait de l'équilibre de l'Europe l'œuvre de sa vie. Courtisé par toutes les chancelleries et craint par aucune, il nous gagne une réputation à l'étranger et atténue l'antagonisme que nos manœuvres provoqueraient autrement."
 cc_master_balancer_die_desc: "[CHARACTER.GetName] est décédé(e). Peu de mains étaient aussi habiles à maintenir l'équilibre ; nous devons espérer qu'un successeur digne de ce nom puisse être trouvé avant que le grand jeu ne se retourne contre nous."
 reformation_inquisitor_die_desc: "[CHARACTER.GetName] n'est plus là. Peu de gens ont pleuré [CHARACTER.GetHerHim] ; encore moins pleureront la disparition de [CHARACTER.GetHerHis] certitudes rigides."
 parliamentarian_die_desc: "[CHARACTER.GetName] est décédé(e). Quiconque occupera [CHARACTER.GetHerHis] siège aura du mal à égaler [CHARACTER.GetHerHis] maîtrise de la chambre."
 cc_traits.1.a: "Laisser [minister.GetName] agir en tant que [ShowTraitName('iron_integrator')]."
 cc_traits.1.b: "Laisser [minister.GetName] agir en tant que [ShowTraitName('master_integrator')]."
 cc_traits.1.c: "Laisser [minister.GetName] agir en tant que [ShowTraitName('able_integrator')]."
 cc_traits.1.d: "Laisser [minister.GetName] agir en tant que [ShowTraitName('fumbling_integrator')]."
 cc_traits.13.desc: "[minister.GetName] a été façonné(e) par les exigences d'une époque où l'autorité souveraine doit être consolidée. La manière dont [minister.GetSheHe] exerce cette conviction définira [minister.GetHerHis] héritage."
 cc_cabinet.10.desc: "Les relations de [minister.GetName] avec les grands domaines sont devenues considérables. Cette personne a désormais l'influence nécessaire pour modifier l'équilibre des pouvoirs entre les maisons nobles — mais chaque gain pour un domaine signifie une perte pour un autre."
 cc_cabinet.2.desc_survey: "[minister.GetName] souhaite que les registres soient refaits.\n\nL'évaluation en vigueur a été faite par des gens qui sont morts, sur des terres qui ont changé de mains, à des valeurs que personne n'a revisitées de mémoire d'homme. La moitié du royaume paie sur la base d'un chiffre erroné et [minister.GetSheHe] est honnête quant au fait que la correction s'opérera dans les deux sens.\n\nLes arpenteurs devront être payés, escortés, puis défendus par la suite."
 cc_cabinet.2.desc_academy: "[minister.GetName] propose une académie, dotée convenablement, avec des chaires rémunérées suffisamment pour retenir ceux qui les occupent.\n\nL'argument est que le royaume envoie actuellement ses fils prometteurs étudier à l'étranger et ne récupère que ceux qui choisissent de revenir. L'argument opposé est qu'un bâtiment rempli de savants produit, à court terme, un bâtiment rempli de savants.\n\n[minister.GetSheHe] concède le second point et demande tout de même les fonds."
 cc_cabinet.2.desc_muster: "[minister.GetName] a comparé les registres de mobilisation avec les registres paroissiaux, et les deux ne concordent pas.\n\nDes hommes sont listés alors qu'ils sont morts. Des villages sont taxés pour une levée qu'ils n'ont pas pu effectuer depuis vingt ans. D'autres paient une fois et demie ce qu'ils doivent parce que personne n'a révisé le chiffre depuis qu'il était avantageux de ne pas le faire.\n\nLe corriger signifie l'affectation de clercs dans chaque district pendant un an, et cela signifie dire à plusieurs hommes puissants que leur contribution a été recalculée."
 cc_cabinet.2.desc_dockyard: "[minister.GetName] s'est rendu aux chantiers et est revenu avec une liste.\n\nLes rampes de lancement sont solides. Presque tout le reste ne l'est pas : le cordage est vieux, le bois seasoned s'est épuisé il y a deux ans et a été remplacé par du bois vert, et les charpentiers de marine qui maîtrisaient le métier ont orienté leurs fils vers d'autres professions car il n'y avait plus de travail.\n\nOn peut encore construire des navires. [minister.GetSheHe] prend soin de préciser seulement qu'ils peuvent encore être construits."
 cc_cabinet.2.desc_embassy: "[minister.GetName] souhaite une ambassade, dotée d'un personnel permanent, dans une capitale importante.\n\nL'arrangement actuel consiste en un envoyé dépêché lorsqu'il y a quelque chose à dire, qui arrive trois mois après que cela ait été nécessaire et repart avant que la réponse n'arrive. Toutes les personnes d'importance ont cessé de procéder ainsi, et le royaume est la dernière cour à être informée des décisions après qu'elles aient été prises.\n\nLe coût représente un bâtiment, une maison et un homme de rang disposé à vivre à l'étranger pendant des années."
 cc_cabinet.2.c: "Laissez [minister.GetName] lever les fonds à titre privé."
 cc_cabinet.2.d: "Refusez. Le trésor a d'autres besoins."
 cc_cabinet.3.desc_exceptional: "Le travail est terminé et le résultat est meilleur que ce qui avait été demandé.\n\n[minister.GetName] a dépensé moins que l'estimation, ce que personne ne fait jamais, puis a utilisé la différence pour les parties qu'[minister.GetSheHe] avait initialement proposé de laisser de côté. Le résultat est déjà copié par ceux qui s'opposaient à son financement.\n\nLe trésor a audité les chiffres deux fois, partant du principe qu'il y avait forcément une erreur. Il n'y en a aucune."
 cc_cabinet.3.desc_good: "Le travail est terminé et a été fait correctement.\n\nIl a pris du retard, comme c'est souvent le cas, et il y a eu une dispute sur le dernier quart du budget qui a pris plus de temps à régler que le travail lui-même. Ce qui avait été promis est arrivé, cela fonctionne, et les utilisateurs ont cessé de se plaindre de la version qu'elle remplace.\n\n[minister.GetName] a soumis les comptes sans qu'on les lui demande."
 cc_cabinet.3.desc_ordinary: "Le travail est terminé.\n\nCela a coûté ce que cela a coûté, cela fait ce qu'il était censé faire, et ce sera discrètement utile tant que quelqu'un pensera à l'entretenir. Rien de tout cela ne sera consigné ailleurs que dans le grand livre.\n\n[minister.GetName] semble s'être attendu à plus de gratitude."
 cc_cabinet.3.desc_poor: "Le travail n'est pas terminé et ne le sera pas.\n\nIl n'y a pas eu de vol. Il y avait un propriétaire terrien qui refusait l'accès, une saison météorologique mal tombée, un fournisseur qui a accepté une meilleure offre, et un concept qui s'est avéré dépendre de quelque chose que le royaume ne peut fabriquer. Chacun de ces éléments était surmontable. Ensemble, ils ne l'étaient pas.\n\nCe qui pouvait être vendu a été vendu. [minister.GetName] a proposé d'expliquer, et il n'y a pas grand-chose à expliquer."
 cc_cabinet.3.desc_disaster: "L'argent a disparu et il n'y a rien pour le justifier.\n\nLes comptes soumis par [minister.GetName] ne sont pas seulement optimistes, ils sont fabriqués : des travaux facturés qui n'ont jamais commencé, des fournisseurs partageant une adresse avec la famille de [minister.GetHerHis] femme, une main-d'œuvre qui n'a existé que sur le papier pendant onze mois. Le clerc qui l'a remarqué a remonté l'information via la hiérarchie plutôt qu'au bureau concerné, ce qui est la seule raison pour laquelle l'affaire arrive sur cette table.\n\nOn peut engager des poursuites, ce qui revient à dire haut et fort que la couronne a été volée par son propre ministre. On peut aussi régler l'affaire discrètement, et combler le trou comme on comble les trous."
 cc_cabinet.3.a_exceptional: "C'est à cela que sert le trésor."
 cc_cabinet.3.a_good: "De l'argent bien dépensé."
 cc_cabinet.3.a_ordinary: "C'est donc terminé, et nous passons à autre chose."
 cc_cabinet.3.a_poor: "Récupérez ce qui peut l'être."
 cc_cabinet.3.a_disaster_prosecute: "Poursuivez. Que la cour voie justice être rendue."
 cc_cabinet.3.a_disaster_bury: "Enterrez l'affaire. Couvrez le trou laissé par la Monnaie."
