 # ============================================================
 # Cabinet Experience — the court ledger panel
 #
 # Panel: in_game/gui/panels/situation/cc_cabinet_court.gui
 # Situation: in_game/common/situations/cc_cabinet_court.txt
 # ============================================================

 # The situation's own name, shown on the header icon.
 cc_cabinet_court: "La Cour"
 cc_cabinet_court_desc: "Un registre permanent de ceux qui servent la couronne, de ce qu'ils ont appris et du chemin qu'il reste à chacun d'eux à parcourir."

 CC_XP_COURT_HEADER: "La Cour"
 CC_XP_COURT_DESC: "Chaque ministre et chaque protégé parrainé, avec ce qu'ils sont devenus jusqu'à présent.\n\nL'#Y Ancienneté#! est le niveau à côté de chaque nom, de 1 à 10. Elle provient de l'expérience totale acquise dans les trois branches et reflète le parcours de la personne. Elle détermine son rang à la cour.\n\nLa #Y Spécialisation#! est le palier affiché pour chaque branche, de 0 à 3. Elle provient de l'expérience propre à cette branche et détermine les traits accessibles. Un ministre peut être très ancien tout en restant un soldat de palier 0.\n\nL'expérience provient des fonctions occupées, des années de service, des guerres, des lois et des mariages menés par le royaume, ainsi que de tout investissement consenti pour leur formation."

 CC_XP_SECTION_CABINET: "MINISTRES EN FONCTIONS"
 CC_XP_SECTION_PROTEGES: "PROTÉGÉS"
 CC_XP_NO_PROTEGES: "Personne n'est actuellement formé. Prenez un protégé via les interactions avec un personnage pour avoir un successeur prêt avant qu'un poste ne se libère."

 CC_XP_LEVEL_LABEL: "niveau"
 CC_XP_LEVEL_MAX: "Au sommet de leur carrière."
 CC_XP_SENIORITY_TT: "Progression vers le niveau d'ancienneté suivant. Le niveau est acquis grâce à l'expérience totale accumulée dans les trois domaines, et accorde un bonus croissant à l'efficacité du travail de cette personne."

 CC_XP_COL_ADM: "ADM"
 CC_XP_COL_DIP: "DIP"
 CC_XP_COL_MIL: "MIL"
 CC_XP_TRACK_ADM_TT: "Expérience administrative, et le niveau atteint. Provient des fonctions administratives, des lois mises en œuvre et du temps passé à la chancellerie. Niveau 1 à 150, niveau 2 à 500, niveau 3 à 1200."
 CC_XP_TRACK_DIP_TT: "Expérience diplomatique, et le niveau atteint. Provient des fonctions diplomatiques, des mariages royaux et du circuit des ambassades. Niveau 1 à 150, niveau 2 à 500, niveau 3 à 1200."
 CC_XP_TRACK_MIL_TT: "Expérience militaire, et le niveau atteint. Provient des fonctions militaires, des guerres gagnées et de l'école d'état-major. Niveau 1 à 150, niveau 2 à 500, niveau 3 à 1200."

 CC_XP_STATUS_AWAY: "absent"
 CC_XP_STATUS_AWAY_TT: "Actuellement en poste, ou en train d'organiser un examen de cour. Ils ne peuvent être envoyés ailleurs ni se voir attribuer un élève avant leur retour."
 CC_XP_STATUS_MENTORED: "mentoré"
 CC_XP_STATUS_MENTORED_TT: "Être instruit par un ministre senior, et gagner chaque année de l'expérience dans le domaine où ce mentor est le plus fort."

 # ============================================================
 # Cabinet Experience — cabinet card badge
 # (in_game/gui/shared/cc_xp_cabinet_card.gui)
 # ============================================================
 CC_XP_CARD_LVL: "niv"
 CC_XP_CARD_LEVEL_TT: "Ancienneté, de 1 à 10. Acquise grâce à l'expérience totale accumulée dans les trois domaines, elle accorde un bonus croissant à l'efficacité du travail de ce ministre. Ouvrez le panneau de la Cour pour consulter le dossier complet."
 CC_XP_TAB_PATRONAGE: "Mécénat"
 CC_XP_TAB_SCHOOLS: "Écoles"
 CC_XP_WORKS_LABEL: "Œuvres dans le royaume"
 CC_XP_ARTISTS_LABEL: "Artistes vivants"
 CC_XP_NO_ARTISTS: "Aucun artiste ne travaille dans le royaume. Les artistes apparaissent via le système de culture ; un ministre peut ensuite être désigné pour en parrainer un."
 CC_XP_HAS_PATRON: "parrainé"
 CC_XP_HAS_PATRON_TT: "Un ministre a apporté son nom et son argent à cet artiste. La couronne gagne du prestige tant que l'arrangement dure, et le ministre gagne de l'expérience diplomatique."
 CC_XP_WORKS_BY_TT: "Œuvres achevées par cet artiste."
 CC_XP_NO_SCHOOLS: "Aucune institution n'a été fondée. Construisez une université dans votre capitale, puis demandez à un ministre senior de fonder une école relevant de sa propre discipline."
 CC_XP_SCHOOL_FOUNDED_BY: "fondé par"
 CC_XP_SCHOOL_TEACHES: "enseigne"
 CC_XP_SCHOOL_FOUNDER_DEAD: "(fondateur décédé)"
 CC_XP_SCHOOL_FOUNDER_DEAD_TT: "Le fondateur est mort et l'école continue sans lui. C'est là la différence entre une institution et une réputation."
 CC_XP_SCHOOLS_DESC: "Un courant de pensée est une institution permanente : il enseigne la discipline de son fondateur à tous les inscrits, qu'ils soient en fonction ou non, et continue d'enseigner après la mort du fondateur.\n\nUn royaume peut en posséder trois au maximum. Le premier nécessite une université dans la capitale, le second l'avancée des Ordres Érudits, et le troisième l'Administration Éclairée."
 CC_XP_BTN_SELL_WORK: "Vendre une œuvre"
 CC_XP_BTN_SPONSOR: "Parrainer un artiste"
 CC_XP_BTN_FOUND: "Fonder une institution"
 CC_XP_BTN_ENROL: "Inscrire"
 CC_XP_ARTISTS_HEADER: "ARTISTES DU ROYAUME"
 CC_XP_SCHOOLS_HEADER: "INSTITUTIONS"
 CC_XP_SLOT_OPEN: "Une institution peut être fondée"
 CC_XP_SLOT_LOCKED: "Pas encore débloqué"
 CC_XP_SLOT_REQ_1: "Nécessite une université dans la capitale."
 CC_XP_SLOT_REQ_2: "Nécessite l'avancée Ordres érudits."
 CC_XP_SLOT_REQ_3: "Nécessite l'avancée Administration éclairée."
 CC_XP_BTN_SOIREE: "Organiser une soirée"
 CC_XP_BTN_EXAM: "Examen de la cour"
 CC_XP_BTN_PROTEGE: "Prendre un protégé"
 CC_XP_BTN_MENTOR: "Assigner un mentor"
 CC_XP_BTN_SECOND: "Détacher auprès d'un sujet"
 CC_XP_BTN_RECALL: "Rappeler un résident"
 cc_xp_legend_court: "Notre royaume"
 cc_xp_legend_school: "Le siège de l'une de nos écoles"
 cc_xp_legend_resident: "La cour d'un sujet hébergeant notre résident"
