l_french:
 # ============================================================
 # Cabinet Duty Actions
 # ============================================================
 cc_duty_free_hands: "Mains Libres"
 cc_duty_free_hands_desc: "Le ministre s'occupe de tout ce dont la cour a besoin — disponible pour les audiences, les pétitions et toute la gamme des tâches oisives de la cour. Tous les systèmes d'événements du cabinet restent actifs à leur taux de base."
 cc_duty_free_hands_action: "Mains Libres"
 cc_duty_free_hands_active: "Mains Libres"

 cc_duty_war_council: "Conseil de guerre"
 cc_duty_war_council_desc: "Le ministre est officiellement chargé de la conduite de la guerre — conseillant sur les campagnes, gérant la logistique et maintenant la volonté de combattre. Les événements du Conseil de Guerre se déclenchent plus fréquemment tant que ce devoir est assigné. Prend fin automatiquement lors de la signature de la paix."
 cc_duty_war_council_action: "Conseil de guerre"
 cc_duty_war_council_active: "Conseiller le Conseil de Guerre"

 cc_duty_diplomatic_mission: "Mission diplomatique"
 cc_duty_diplomatic_mission_desc: "Le ministre est affecté à une cour étrangère, établissant des relations et faisant progresser les intérêts du royaume à l'étranger. Les événements de synergie internationale avec la cour cible deviennent plus fréquents."
 cc_duty_diplomatic_mission_action: "Mission diplomatique"
 cc_duty_diplomatic_mission_active: "En mission diplomatique"
 cc_duty_diplomatic_mission_select_target: "Sélectionnez la cour où affecter ce ministre :"

 cc_duty_domestic_reform: "Réforme intérieure"
 cc_duty_domestic_reform_desc: "Le ministre se consacre à la gouvernance interne — rédigeant des lois, restructurant la bureaucratie et faisant avancer des propositions de réforme. Les événements de progression de traits d'étape se déclenchent deux fois plus vite que la normale."
 cc_duty_domestic_reform_action: "Réforme intérieure"
 cc_duty_domestic_reform_active: "Rédaction des réformes"

 cc_duty_scholarly_inquiry: "Enquête savante"
 cc_duty_scholarly_inquiry_desc: "Le ministre correspond avec des savants, encourage l'apprentissage et mène des recherches empiriques. La chaîne d'événements de la Cour du Savant devient plus active tant que cette fonction est occupée."
 cc_duty_scholarly_inquiry_action: "Enquête savante"
 cc_duty_scholarly_inquiry_active: "Poursuite de recherches savantes"

 cc_duty_colonial_posting: "Affectation coloniale"
 cc_duty_colonial_posting_desc: "Le ministre est affecté outre-mer pour gérer un sujet colonial — une compagnie à charte, une nation coloniale ou un gouvernorat provincial. Les événements de gouvernance coloniale se déclenchent régulièrement, et le ministre peut revenir avec une expérience des frontières durement acquise."
 cc_duty_colonial_posting_action: "Affectation coloniale"
 cc_duty_colonial_posting_active: "Affecté outre-mer"
 cc_duty_colonial_posting_select_colony: "Sélectionnez le sujet colonial où affecter ce ministre :"

 cc_duty_religious_oversight: "Supervision religieuse"
 cc_duty_religious_oversight_desc: "Le ministre supervise les affaires confessionnelles — gérant la conformité religieuse, les relations interconfessionnelles et la politique théologique à la cour. Les événements de Réforme et de tension religieuse deviennent plus actifs."
 cc_duty_religious_oversight_action: "Supervision religieuse"
 cc_duty_religious_oversight_active: "Supervision des affaires confessionnelles"

 # ============================================================
 # Cabinet Composition Auto-Modifiers
 # ============================================================
 warlord_court: "Cour du seigneur de guerre"
 warlord_court_desc: "Le conseil parle d'une seule voix martiale. Deux spécialistes militaires ou plus dominent le cabinet, apportant discipline et résolution — mais les autres intérêts du royaume sont négligés."

 merchant_republic_spirit: "Esprit de la Maison de Comptage"
 merchant_republic_spirit_desc: "Le commerce et la finance gouvernent la réflexion du cabinet. Les réseaux commerciaux prospèrent, mais les ambitions militaires du royaume sont discrètement privées d'hommes."

 enlightened_court: "Cour éclairée"
 enlightened_court_desc: "Les empiristes et les rationalistes ont trouvé place à la cour. Le savoir progresse et le coût de l'administration diminue — bien que le prestige martial ne soit plus ce qu'il était."

 court_paralysis: "Paralysie de la cour"
 court_paralysis_desc: "Des factions opposées au sein du cabinet sont arrivées dans une impasse. Chaque décision est contestée, chaque réforme retardée — pourtant, la tension pourrait encore produire un compromis inattendu."

 entrenched_court: "Cour enracinée"
 entrenched_court_desc: "Le cabinet est entièrement composé de vétérans de longue date. Leur profonde connaissance des usages du royaume apporte de la stabilité, mais les idées neuves se font rares."

 balanced_court: "Cour équilibrée"
 balanced_court_desc: "Aucune faction ne domine, aucune idéologie ne divise. Le cabinet se maintient dans un équilibre étudié — le prestige s'accumule pour le royaume, et la parole du souverain est sa propre réponse."
 AUTO_MODIFIER_NAME_warlord_court: "Deux soldats ou plus au sein du cabinet"
 AUTO_MODIFIER_NAME_merchant_republic_spirit: "Deux hommes de commerce ou plus au sein du cabinet"
 AUTO_MODIFIER_NAME_enlightened_court: "Deux empiristes ou plus au sein du cabinet"
 AUTO_MODIFIER_NAME_court_paralysis: "Deux ministres aux convictions opposées"
 AUTO_MODIFIER_NAME_entrenched_court: "Chaque ministre est un vétéran de longue date"
 AUTO_MODIFIER_NAME_balanced_court: "Aucune faction ni aucune querelle au sein du cabinet"
 AUTO_MODIFIER_NAME_nobles_court_captured: "Deux membres de la noblesse ou plus au sein du cabinet"
 AUTO_MODIFIER_NAME_burghers_court_captured: "Deux bourgeois ou plus au sein du cabinet"
 AUTO_MODIFIER_NAME_clergy_court_captured: "Deux membres du clergé ou plus au sein du cabinet"
