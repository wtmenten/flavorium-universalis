l_french:
 # === cc_bonds.90 — A Loyal Colony in Turbulent Times ===
 cc_bonds.90.title: "Une colonie loyale en des temps turbulents"
 cc_bonds.90.desc: "L'ère des révolutions est arrivée, et les colonies du monde s'agitent. Mais [bond_subj.GetName] ne s'agite pas — elle reste stable. Des décennies de gouvernance partagée, d'investissement économique et de partenariat politique ont produit quelque chose qu'aucune proclamation ne pourrait fabriquer : une population coloniale qui voit son avenir au sein de l'empire plutôt qu'en dehors. La direction coloniale ne s'est pas contentée de s'abstenir de rejoindre les courants révolutionnaires — elle a activement travaillé pour en tenir sa population à l'écart. Voilà à quoi ressemble une génération de bons choix."
 cc_bonds.90.a: "Reconnaître formellement la loyauté de [bond_subj.GetName]. Élever son rang au sein de l'empire."
 cc_bonds.90.b: "Lever des troupes d'urgence tant que nous avons leur bonne volonté. La révolution n'est pas terminée."
 cc_bonds.90.c: "Les inviter au Conseil Impérial."

 # === cc_bonds.91 — The Colony Finds Its Voice ===
 cc_bonds.91.title: "La colonie trouve sa voix"
 cc_bonds.91.desc: "L'ère des révolutions est arrivée, et [bond_subj.GetName] n'a pas attendu qu'on lui dise de quel côté se ranger. La direction coloniale — ou ce qu'il en reste de fidèle envers nous — rapporte que des pamphlets révolutionnaires circulent ouvertement, que les réunions publiques deviennent des manifestations et que l'humeur est passée du grief à la conviction. Cela n'est pas apparu du jour au lendemain. Le registre de l'extraction, des pétitions refusées, des gouverneurs qui ont taxé et pris sans jamais rien rendre — il a été tenu, et l'heure des comptes a sonné."
 cc_bonds.91.a: "Rétablir l'ordre. Montrez clairement qui gouverne cette colonie."
 cc_bonds.91.b: "Nous cédons. Tout ce que nous aurions dû faire il y a des années, nous le faisons maintenant."

 # === cc_bonds.92 — The Governor Stands With the Crown ===
 cc_bonds.92.title: "Le gouverneur soutient la Couronne"
 cc_bonds.92.desc: "Le moment révolutionnaire qui a secoué d'autres provinces trouve [bond_subj.GetName] remarquablement calme. Le gouverneur ne s'est pas contenté de maintenir l'ordre — il a activement rallié l'administration locale à la loyauté envers la Couronne, supprimé l'agitation avant qu'elle ne s'enracine et nous a écrit pour nous assurer de la stabilité de sa province. L'infrastructure que nous avons financée, les cadres juridiques que nous avons bâtis ensemble, les administrateurs que nous avons traités comme des partenaires plutôt que comme des instruments — tout cela rapporte aujourd'hui des dividendes, au moment où cela compte le plus."
 cc_bonds.92.a: "Le gouverneur a servi avec distinction. Nous le ferons savoir publiquement."

 # === cc_bonds.93 — The Province Remembers ===
 cc_bonds.93.title: "La province se souvient"
 cc_bonds.93.desc: "L'ère révolutionnaire a atteint [bond_subj.GetName], et la province l'attendait. Les dépêches du gouverneur sont devenues plus courtes, ses réponses plus lentes. Le dernier rapport décrivait la situation comme « gérable » — le mot bureaucratique pour une situation qui ne l'est pas. Des décennies d'extraction, des gouverneurs récompensés pour la collecte plutôt que pour la gouvernance, des lois locales ignorées pour commodité administrative — la province n'a rien oublié. Elle attendait simplement le bon moment pour le dire."
 cc_bonds.93.a: "Nous paierons ce qui est nécessaire pour conserver cette province. Quel qu'en soit le prix."
 cc_bonds.93.b: "La situation est ce qu'elle est. Nous devons gérer au mieux."

 # === cc_bonds.94 — The Palatinate Answers the Call ===
 cc_bonds.94.title: "Le Palatinat répond à l'appel"
 cc_bonds.94.desc: "L'ère des révolutions apporte un test de loyauté, et [bond_subj.GetName] y a répondu dans les termes les plus clairs possibles. Le seigneur du palatinat a rassemblé ses forces sans qu'on lui demande, a écrit pour offrir son plein soutien militaire et a envoyé son fils aîné servir dans notre armée en guise de geste personnel. Les décennies de cérémonies honorées, de levées gérées équitablement, de querelles médiées avec patience — le seigneur du palatinat n'a rien oublié. Il appelle cela un service. Nous pouvons l'appeler comme nous voulons, mais c'est l'une des plus belles choses qu'un sujet ait jamais offertes à la Couronne."
 cc_bonds.94.a: "Nous sommes honorés par cette loyauté. Le palatinat se tient à nos côtés."
 cc_bonds.94.b: "Les services du seigneur sont les bienvenus — et nous réglons d'abord l'ancienne dette."

 # === cc_bonds.95 — The Palatinate Declares Armed Neutrality ===
 cc_bonds.95.title: "Le Palatinat déclare sa neutralité armée"
 cc_bonds.95.desc: "Le seigneur de [bond_subj.GetName] a envoyé une déclaration formelle. Il ne rejoint pas la révolution. Il ne nous rejoint pas non plus. Il a déclaré le palatinat en état de « neutralité armée » — une phrase qui signifie, en pratique, que ses forces défendront son territoire et aucun autre, qu'il ne répondra pas aux appels aux armes, et qu'il a l'intention d'attendre de voir comment la révolution se résout avant de prendre tout engagement supplémentaire. Les décennies de négligence, de pétitions ignorées, de cérémonies annulées et de querelles tranchées contre lui ont produit cela : un seigneur qui a simplement cessé de se soucier de la survie de la Couronne."
 cc_bonds.95.a: "Accepter la déclaration. La neutralité vaut mieux qu'une rébellion ouverte."
 cc_bonds.95.b: "Nous ne tolérerons pas cela. Le palatinat nous répond désormais."

 # === cc_bonds.96 — The March Holds the Frontier ===
 cc_bonds.96.title: "La Marche tient la frontière"
 cc_bonds.96.desc: "L'ère révolutionnaire a apporté l'instabilité à de nombreuses frontières, et [bond_subj.GetName] a tenu chaque pouce des nôtres. Le seigneur des marches ne s'est pas contenté de défendre la frontière — il l'a fait d'une manière qui honore la Couronne : avec rapidité, compétence et en agissant clairement en notre nom. Ses lettres sont brèves et professionnelles. Il ne demande pas de reconnaissance. Il fait simplement ce que fait un seigneur des marches loyal. Les cérémonies que nous avons honorées, les butins que nous avons partagés, la garnison que nous avons financée — tout cela a forgé une culture militaire qui nous sert aujourd'hui, alors que nous en avons le plus besoin."
 cc_bonds.96.a: "Le seigneur de marche a bien servi la Couronne. Nous reconnaissons sa loyauté."
 cc_bonds.96.b: "Le pupille que nous avions amené à la cour est retourné diriger les forces de son père. Nous n'aurions pu espérer mieux."

 # === cc_bonds.97 — The March Lord Raises His Own Banner ===
 cc_bonds.97.title: "Le Seigneur de la Marche lève sa propre bannière"
 cc_bonds.97.desc: "Le seigneur de marche de [bond_subj.GetName] a levé sa propre bannière. Il ne s'agit pas d'une révolte paysanne ou d'un pamphlet révolutionnaire — c'est un commandant militaire avec des soldats entraînés, une connaissance du terrain frontalier et des années de griefs accumulés que nous n'avons pas pris assez au sérieux. La garnison dont nous avons refusé le financement, les butins que nous avons gardés, la cérémonie que nous avons annulée — le seigneur de marche a tenu son propre registre. Il a décidé que la dette se paie désormais avec une autre monnaie. Il ne demande rien. Il nous indique le coût de notre relation."
 cc_bonds.97.a: "Envoyer un envoyé avec des conditions. Nous paierons ce que nous aurions dû payer il y a des années."
 cc_bonds.97.b: "C'est un vassal en révolte. Nous le traiterons en conséquence."

 # === cc_bonds.98 — The Dependency Stands True ===
 cc_bonds.98.title: "La dépendance reste fidèle"
 cc_bonds.98.desc: "Parmi toutes les dépêches alarmantes de l'ère révolutionnaire, une note arrive avec un ton différent. La maison régnante de [bond_subj.GetName] a écrit non pas pour demander quoi que ce soit, ni pour négocier, ni pour nous avertir d'un soulèvement — mais simplement pour réaffirmer sa loyauté. La lettre est d'un ton personnel. Elle rappelle les visites, les cérémonies, les moments où la Couronne a traité leur maison comme une famille plutôt que comme un État client. Les cours voisines l'ont remarqué. Notre réputation à bâtir des liens durables plutôt qu'à exiger une obéissance à court terme parle d'elle-même en cet instant."
 cc_bonds.98.a: "C'est à cela que ressemble une relation durable. Nous en sommes reconnaissants."

 # === cc_bonds.99 — The Dependency Looks Elsewhere ===
 cc_bonds.99.title: "La dépendance regarde ailleurs"
 cc_bonds.99.desc: "Une lettre est arrivée de la maison régnante de [bond_subj.GetName]. Elle est courtoise, mesurée et dévastatrice. Ils ne déclarent pas leur indépendance. Ils ne rejoignent aucune coalition révolutionnaire. Ils explorent simplement — calmement, formellement — quels autres arrangements pourraient leur être proposés. Ils ont identifié une puissance voisine qui a exprimé son intérêt pour leur offrir sa protection. Ils ne se sont encore engagés à rien. Ils nous en informent d'abord. Ce sera peut-être leur dernier acte de loyauté : nous donner la chance de répondre avant qu'ils n'entament formellement un nouveau chapitre. La cérémonie que nous avons ignorée, l'invitation que nous avons refusé d'envoyer, la lettre à la place de la visite — ils s'en souviennent tous."
 cc_bonds.99.a: "Nous offrirons tout ce que nous aurions dû offrir il y a des années. S'il vous plaît — restez."
 cc_bonds.99.b: "S'ils ont trouvé un meilleur arrangement, nous ne nous dresserons pas sur leur chemin."
 cc_bonds.99.c: "Ils sont notre dépendance. Ils ne peuvent pas « explorer des arrangements »."
