l_french:
 # === cc_bonds.90 — A Loyal Colony in Turbulent Times ===
 cc_bonds.90.title: "Une colonie loyale en des temps turbulents"
 cc_bonds.90.desc: "L'ère des révolutions est arrivée et les colonies du monde s'agitent. Pas [bond_subj.GetName]. Des décennies de gouvernance partagée et d'investissements économiques ont produit une population coloniale qui voit son avenir à l'intérieur de l'empire plutôt qu'à l'extérieur, et une direction coloniale qui a passé l'année à dissuader son peuple de suivre les pamphlets. Ce n'est pas de la chance. C'est le résultat des comptes."
 cc_bonds.90.a: "Reconnaissez formellement leur loyauté, et faites en sorte que toutes les autres colonies le sachent."
 cc_bonds.90.b: "Lancez des levées d'urgence tant que nous bénéficions de leur bonne volonté."
 cc_bonds.90.c: "Les inviter au Conseil Impérial."

 # === cc_bonds.91 — The Colony Finds Its Voice ===
 cc_bonds.91.title: "La colonie trouve sa voix"
 cc_bonds.91.desc: "[bond_subj.GetName] n'a pas attendu qu'on lui dise de quel côté elle se range. Des pamphlets révolutionnaires circulent ouvertement, les réunions publiques sont devenues des manifestations et l'humeur est passée du grief à la conviction. Le registre de l'extraction, des pétitions ignorées et des gouverneurs qui ont taxé et pris sans jamais rien donner a été tenu avec soin. L'heure des comptes a sonné."
 cc_bonds.91.a: "Rétablir l'ordre. Montrez clairement qui gouverne cette colonie."
 cc_bonds.91.b: "Concéder tout ce que nous aurions dû concéder il y a des années."

 # === cc_bonds.92 — The Governor Stands With the Crown ===
 cc_bonds.92.title: "Le gouverneur soutient la Couronne"
 cc_bonds.92.desc: "Le moment révolutionnaire qui a secoué d'autres provinces trouve [bond_subj.GetName] calme. Le gouverneur ne s'est pas contenté de maintenir l'ordre ; il a rallié l'administration locale à la couronne, a supprimé l'agitation avant qu'elle ne s'enracine et a écrit pour expliquer comment il a procédé plutôt que pour demander des honneurs. L'infrastructure que nous avons financée et les administrateurs que nous avons traités comme des partenaires rapportent aujourd'hui des dividendes, au moment où cela compte."
 cc_bonds.92.a: "Féliciter publiquement le gouverneur."

 # === cc_bonds.93 — The Province Remembers ===
 cc_bonds.93.title: "La province se souvient"
 cc_bonds.93.desc: "L'ère révolutionnaire a atteint [bond_subj.GetName], et la province l'attendait. Les dépêches du gouverneur sont devenues plus courtes et ses réponses plus lentes. La dernière décrivait la situation comme gérable, ce qui est le mot bureaucratique pour une situation qui ne l'est pas. Des décennies d'extraction, de gouverneurs récompensés pour la collecte plutôt que pour la gouvernance, de lois locales ignorées pour des raisons de commodité administrative : rien de tout cela n'a été oublié."
 cc_bonds.93.a: "Payez ce qui est nécessaire pour conserver cette province. Quel qu'en soit le prix."
 cc_bonds.93.b: "Maintenez-la avec la garnison. Le consentement n'est plus l'instrument disponible."

 # === cc_bonds.94 — The Palatinate Answers the Call ===
 cc_bonds.94.title: "Le Palatinat répond à l'appel"
 cc_bonds.94.desc: "L'ère des révolutions met les loyautés à l'épreuve, et [bond_subj.GetName] y a répondu sans ambiguïté. Le seigneur du palatinat a mobilisé ses troupes sans qu'on lui demande, a écrit pour offrir son plein soutien militaire et a envoyé son fils aîné servir dans notre armée en guise de geste personnel. Les cérémonies honorées, les levées gérées équitablement, les querelles médiées avec patience : il n'a rien oublié non plus."
 cc_bonds.94.a: "Nous sommes honorés. Le palatinat se tient à nos côtés."
 cc_bonds.94.b: "Réglez d'abord la vieille dette, puis descendez ensemble sur le champ de bataille."

 # === cc_bonds.95 — The Palatinate Declares Armed Neutrality ===
 cc_bonds.95.title: "Le Palatinat déclare sa neutralité armée"
 cc_bonds.95.desc: "Le seigneur de [bond_subj.GetName] a envoyé une déclaration formelle. Il ne rejoint pas la révolution. Il ne nous rejoint pas non plus. Le palatinat est dans un état de neutralité armée, ce qui signifie en pratique que ses forces défendront son territoire et aucun autre, qu'il ne répondra pas aux appels aux armes, et qu'il a l'intention de voir comment l'époque se résout avant de s'engager davantage. Des décennies de pétitions ignorées et de cérémonies annulées ont produit un seigneur qui a cessé de se soucier de la survie de la couronne."
 cc_bonds.95.a: "Accepter la déclaration. La neutralité vaut mieux qu'une révolte ouverte."
 cc_bonds.95.b: "Racheter le seigneur. Quel que soit le montant des arriérés, payez-les."

 # === cc_bonds.96 — The March Holds the Frontier ===
 cc_bonds.96.title: "La Marche tient la frontière"
 cc_bonds.96.desc: "L'ère révolutionnaire a déstabilisé de nombreuses frontières et [bond_subj.GetName] a tenu chaque pouce de la nôtre. Le seigneur des marches a défendu la frontière d'une manière qui donne à la couronne l'air compétente : rapide, capable et agissant clairement en notre nom. Ses lettres sont brèves et professionnelles. Il ne demande pas de reconnaissance. Les cérémonies honorées, les butins partagés, la garnison financée, tout cela a construit une culture militaire qui nous sert aujourd'hui."
 cc_bonds.96.a: "Le seigneur de marche a bien servi la couronne. Dites-le."
 cc_bonds.96.b: "Placer le pupille sous notre propre commandement. Il a dépassé le stade de la frontière."

 # === cc_bonds.97 — The March Lord Raises His Own Banner ===
 cc_bonds.97.title: "Le Seigneur de la Marche lève sa propre bannière"
 cc_bonds.97.desc: "Le seigneur de marche de [bond_subj.GetName] a levé sa propre bannière. Ce n'est pas une révolte paysanne ou un pamphlet. C'est un commandant militaire avec des soldats entraînés, une connaissance intime de la frontière et des années de griefs accumulés que nous n'avons pas pris au sérieux. La garnison refusée, les butins conservés, la cérémonie annulée : il a tenu son propre registre, et il a décidé que la dette est désormais payable dans une autre devise."
 cc_bonds.97.a: "Envoyez un émissaire avec des conditions. Payez ce que nous aurions dû payer il y a des années."
 cc_bonds.97.b: "C'est un sujet en révolte. Traitez-le comme tel."

 # === cc_bonds.98 — The Dependency Stands True ===
 cc_bonds.98.title: "La dépendance reste fidèle"
 cc_bonds.98.desc: "Parmi les dépêches alarmantes de l'ère révolutionnaire, une note se distingue. La maison régnante de [bond_subj.GetName] a écrit non pas pour demander quoi que ce soit, ni pour négocier, ni pour nous avertir d'une agitation, mais pour réaffirmer sa loyauté. La lettre est personnelle. Elle rappelle les visites et les cérémonies, les moments où la couronne a traité leur maison comme une famille plutôt que comme un client. Les cours voisines l'ont remarqué."
 cc_bonds.98.a: "Répondre de la même manière. C'est ainsi que se construit une relation durable."

 # === cc_bonds.99 — The Dependency Looks Elsewhere ===
 cc_bonds.99.title: "La dépendance regarde ailleurs"
 cc_bonds.99.desc: "Une lettre est arrivée de la maison régnante de [bond_subj.GetName]. Elle est courtoise, mesurée et dévastatrice. Ils ne déclarent pas leur indépendance et ne rejoignent aucune coalition révolutionnaire. Ils explorent calmement et formellement quels autres arrangements pourraient être possibles. Ils ont identifié une puissance voisine qui a manifesté son intérêt. Ils nous en informent d'abord, ce qui est peut-être leur dernier acte de loyauté."
 cc_bonds.99.a: "Offrez tout ce que nous aurions dû offrir il y a des années. Demandez-leur de rester."
 cc_bonds.99.b: "S'ils ont trouvé un meilleur arrangement, ne vous mettez pas en travers de leur chemin."
 cc_bonds.99.c: "Ils sont notre dépendance. Ils ne peuvent pas explorer d'arrangements."
 cc_bonds.90.desc.deep: "L'ère des révolutions est arrivée et les colonies du monde s'agitent. À [bond_subj.GetName], l'assemblée coloniale a adopté une résolution de loyauté sans qu'on lui en demande une, et la milice a été mise à notre disposition plutôt que d'être gardée sur place. Leur gouverneur écrit qu'il ne s'attend pas à des problèmes, et avance des raisons plutôt que des assurances. Une relation aussi profonde vaut actuellement plus à la couronne qu'une flotte."
 cc_bonds.90.desc.voice: "L'ère des révolutions est arrivée, et à [bond_subj.GetName], le débat a lieu dans la salle d'assemblée que nous avons charteé plutôt que dans la rue. Les délégués débattent longuement et publiquement de la loyauté, de l'imposition et de la représentation, et ils le font en tant que membres de l'empire plutôt qu'en tant que critiques. Pour chaque plainte que hurlent les révolutionnaires ailleurs, cette colonie dispose d'un canal formel. C'est grâce à ce canal que nous lisons un compte rendu au lieu d'une liste de pertes."
 cc_bonds.91.desc.deep: "[bond_subj.GetName] ne discute plus avec nous. L'assemblée coloniale, telle qu'elle était, s'est dissoute et s'est reconstituée sous un nom différent, accompagnée d'une déclaration. Des compagnies de milice s'exercent en plein jour. Nos officiers de douane ont été escortés jusqu'aux docks avec leurs papiers et leur dignité intacts, ce qui est d'une certaine manière pire. Ils ne demandent pas réparation. Ils décrivent ce qui va se passer ensuite."
 cc_bonds.91.desc.scholar: "Les pamphlets qui circulent à [bond_subj.GetName] ne sont pas importés. Ils sont écrits sur place, et ils sont bien écrits, par le savant que nous avons décidé, il y a une génération, qu'il était plus sûr de réduire au silence que de répondre. La suppression n'a pas mis fin à l'argument ; elle a supprimé notre camp de celui-ci. Les imprimeurs coloniaux ne peuvent pas suivre la demande, et les manifestations devant la résidence du gouverneur nous citent nos propres chartes."
 cc_bonds.91.desc.faith: "Le moment révolutionnaire a atteint [bond_subj.GetName] et le clergé le dirige. La conversion que nous avons imposée a été acceptée en public et déplorée en privé tant que le ressentiment était tout ce qui restait. Les anciens rites sont réapparus la même semaine que les nouveaux pamphlets, et les deux sont prêchés depuis les mêmes chaires. La foi et le grief se sont trouvés, et aucun des deux n'est désormais négociable."
 cc_bonds.91.c: "Libérez-les, avant que la dispute ne traverse l'océan."
 cc_bonds.92.desc.deep: "[bond_subj.GetName] est plus calme cette année qu'il ne l'a été depuis une décennie. Le gouverneur a fait plus que tenir sa province : il nous a envoyé une méthode de travail, testée localement, pour maintenir la loyauté d'une population à une époque qui récompense le contraire. Ses fonctionnaires sont compétents, ses comptes sont honnêtes, et ses lettres donnent l'impression que la révolution était un événement météorologique pour lequel il s'était préparé. Nous pourrions en utiliser vingt comme lui."
 cc_bonds.92.desc.council: "Le conseil provincial que nous avons instauré a passé l'année à faire ce pour quoi servent les conseils. Il a entendu les griefs qui provoquent des émeutes ailleurs, en a débattu longuement et a produit des recommandations plutôt que des exigences. Le gouverneur les transmet avec son approbation. [bond_subj.GetName] n'est pas calme parce qu'elle est satisfaite ; elle est calme parce qu'elle a un endroit où déposer son mécontentement."
 cc_bonds.92.b: "Envoyez ses administrateurs dans nos propres provinces. Nous avons besoin de ses connaissances."
 cc_bonds.93.desc.deep: "Le gouverneur de [bond_subj.GetName] a cessé d'écrire. Ce qui nous parvient à la place est une pétition, signée par des noms que nous n'employons pas, énumérant chaque statut que nous avons imposé malgré l'objection locale, avec la date et l'objection enregistrées à côté. Ce n'est pas une menace. C'est un acte d'accusation, et il est exact. La province conserve ce document depuis un siècle et a décidé que le moment était venu de le déposer."
 cc_bonds.93.desc.faith: "La province a profité du moment révolutionnaire pour répondre à une question plus ancienne. La conversion que nous avons ordonnée est annulée dans les faits plus rapidement que nous ne pouvons l'enregistrer, et les hommes qui dirigent ce retour en arrière sont les mêmes que nous avions nommés pour l'imposer. [bond_subj.GetName] ne rejette pas l'autorité de la couronne en général. Elle rejette l'unique usage qu'on en a fait et que personne là-bas n'a jamais accepté."
 cc_bonds.93.c: "La situation est ce qu'elle est. Nous faisons au mieux."
 cc_bonds.94.desc.deep: "Le seigneur de [bond_subj.GetName] est arrivé à la cour en personne, ce dont il n'était pas tenu, à la tête d'une colonne qu'il a levée à ses propres frais, ce dont il n'était certainement pas tenu. Il s'est placé lui-même et sa maison sous notre commandement pour la durée du conflit et n'a rien demandé par écrit. À une époque où les grandes puissances perdent leurs capitales face à leurs propres citoyens, un seigneur palatin se comporte comme si les vieilles obligations signifiaient encore ce qu'elles disent."
 cc_bonds.94.desc.interregnum: "Le palatinat a mobilisé, et la lettre du seigneur est chaleureuse, et il y a une seconde lettre pliée à l'intérieur de la première. Elle concerne l'interrègne : les mois où la succession était contestée, quand sa maison a demandé à la couronne d'arbitrer et que la couronne n'a pas répondu à temps. Rien n'a été dit après. Il n'en dit pas beaucoup non plus maintenant. Il note simplement que l'affaire n'a jamais été réglée, et qu'il mobilise malgré tout."
 cc_bonds.94.c: "Demander son meilleur chevalier. Nous avons une guerre à mener et personne pour la diriger."
 cc_bonds.95.desc.deep: "La déclaration de [bond_subj.GetName] fait trois phrases et a été copiée dans toutes les cours voisines avant de nous parvenir. Le palatinat se défendra. Il reconnaîtra le gouvernement qui contrôlera notre capitale à la fin de tout ceci. Il considère ses obligations comme remplies. Le seigneur ne s'est pas rebellé, ce qui constituerait au moins une relation. Il nous a simplement rayés entièrement de ses calculs."
 cc_bonds.95.desc.fort: "La déclaration du seigneur mentionne la forteresse une fois, au passage, comme le lieu d'où il dirigera sa neutralité. Il n'a pas besoin d'en dire plus. Nous avons refusé le financement, les murs ont été érigés quand même avec ses propres deniers, et la garnison répond à sa maison depuis lors. Nous avons construit le grief et il a construit la forteresse, et maintenant les deux sont le même objet."
 cc_bonds.95.c: "Le palatinat nous répond. Il répondra maintenant."
 cc_bonds.96.desc.deep: "[bond_subj.GetName] a passé l'année à accomplir quelque chose de plus difficile que de tenir la frontière. Il a tenu la frontière alors que l'intérieur brûlait, a absorbé deux vagues de réfugiés provenant de provinces que nous ne pouvions protéger, et a repoussé l'attaque d'un voisin qui pensait que nos troubles étaient une opportunité. La dépêche du seigneur de la marche à ce sujet compte quatre lignes. Trois d'entre elles concernent le ravitaillement."
 cc_bonds.96.desc.fort: "La frontière a tenu, et la forteresse que nous avons financée en est la raison. Le rapport du seigneur de marche est largement une liste de ce que les murs ont rendu inutile : des engagements non livrés, des villages non évacués, un siège qui s'est terminé quand l'assiégeant a compté les canons et est rentré chez lui. L'argent dépensé il y a des décennies en pierre s'est avéré être les soldats les moins chers que nous ayons jamais achetés."
 cc_bonds.96.desc.ward: "Le jeune homme que nous avons élevé à la cour est rentré chez lui pour commander les forces de son père, et la frontière n'a jamais été mieux tenue. Il connaît notre état-major, notre système d'approvisionnement et nos attentes, car il a grandi parmi eux, et il connaît le terrain car il y est né. Ce qui a commencé comme un arrangement d'otages a produit la seule chose qu'aucun traité ne peut offrir : un commandant de frontière qui est sincèrement nôtre et sincèrement le leur à la fois."
 cc_bonds.97.desc.deep: "La marche est passée entièrement. Pas une faction, pas une succession contestée : le seigneur, ses officiers, ses levées et ses forteresses, en un seul mouvement, à une date qu'il a manifestement choisie à l'avance. Nos garnisons de frontière l'ont appris quand leurs colonnes de relève ne sont pas arrivées. Il a passé une génération à apprendre comment nous menons campagne, et il est sur le point de le démontrer."
 cc_bonds.97.desc.fort: "La bannière a été hissée au-dessus de la forteresse, et c'est le détail qui importe. Nous avions refusé de financer ces murs ; le seigneur du marquisat les a bâtis quand même et n'en a plus jamais parlé. Désormais, la position la plus forte de notre frontière est tenue contre nous par l'homme qui l'a payée, et chaque argument que nous pourrions avancer sur les obligations se heurte à un grand livre de comptes que nous préférerions ne pas entendre lire à haute voix."
 cc_bonds.97.desc.ward: "Le seigneur de marche qui a levé sa bannière contre nous est le garçon que nous avons amené à la cour. Nous lui avons enseigné notre drill, notre travail d'état-major et nos tableaux de ravitaillement, et nous lui avons enseigné en même temps à quel point le service de sa famille était peu valorisé. Il nous a remerciés pour la première éducation en la mettant à profit. Les officiers qui lui font face maintenant se sont entraînés à ses côtés."
 cc_bonds.97.c: "S'en libérer. Laissons l'époque s'en charger, et qu'elle le fasse loin d'ici."
 cc_bonds.98.desc.deep: "La maison régnante de [bond_subj.GetName] a fait quelque chose qu'aucun traité ne l'obligeait à faire. Ils ont écrit aux cours qui les sondaient et leur ont dit, dans un langage qu'ils ont pris soin de rendre citable, que la question ne se posait pas. La lettre nous est parvenue après, presque comme une réflexion secondaire, et concerne principalement un baptême. La moitié de l'Europe sait maintenant quelle est la valeur de notre parole, parce que quelqu'un d'autre l'a dite pour nous."
 cc_bonds.98.b: "Leur demander de parler en notre nom dans les cours qui nous observent."
 cc_bonds.99.desc.deep: "La lettre de [bond_subj.GetName] n'est plus exploratoire. Des conditions ont été discutées, un projet existe, et une date a été mentionnée. Ils nous ont envoyé un résumé par courtoisie. En le lisant, la chose frappante est la faible proportion qui nous concerne : nous sommes l'arrangement remplacé, décrit au passé, par des gens qui ont cessé d'attendre quoi que ce soit de nous il y a quelque temps et ont enfin trouvé un autre endroit où l'attendre."
