 # ============================================================
 # Bond Chain E Memory Follow-Up Events
 # ============================================================

 # === cc_bonds.202 — Faith Under the Surface ===
 cc_bonds.202.title: "La foi sous la surface"
 cc_bonds.202.desc: "La conversion de [bond_subj.GetName] à la foi de la Couronne a eu lieu alors que les relations culturelles entre nous étaient déjà extrêmement tendues. Le clergé l'a certifiée ; les cérémonies ont été accomplies ; les registres officiels sont exacts. Mais les rapports qui nous parviennent décrivent désormais quelque chose que les registres ne mentionnent pas : des objets de dévotion cachés derrière des étals de marché, des rituels observés dans des caves, un clergé de l'ancienne foi qui ne s'est pas dispersé, mais s'est tu.\n\nLa conversion, semble-t-il, n'a pas été aussi profonde qu'on nous l'a dit. La question est de savoir jusqu'où nous sommes prêts à aller pour l'achever — et ce que cet achèvement coûtera."

 cc_bonds.202.a: "Purgez les fidèles cachés. La conversion doit devenir réalité."
 cc_bonds.202.a.tooltip: "Une inquisition vigoureuse génère une influence religieuse — mais les coûts politiques et militaires sont réels. Le désir de liberté augmente car la répression clarifie la nature réelle de la conversion."

 cc_bonds.202.b: "Laissons la pratique se poursuivre discrètement. Nous ne voyons rien ; nous n'entendons rien."
 cc_bonds.202.b.tooltip: "La relation culturelle se détériore davantage — une pratique tolérée sans acceptation formelle érode le lien. Le marqueur de religion forcée persiste ; cette situation pourrait ressurgir."

 cc_bonds.202.c: "Formaliser une tolérance limitée. L'ancienne foi peut être pratiquée en privé."
 cc_bonds.202.c.tooltip: "Un coût réel en influence religieuse — mais la dimension culturelle s'en remet, et la stabilité s'améliore car le sujet bénéficie d'une concession significative de la part de la Couronne. La mémoire est effacée."
