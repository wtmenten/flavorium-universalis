l_french:
 # ============================================================
 # cc_cond.1 — Capital Development Trait Event
 # ============================================================
 cc_cond.1.title: "Un ministre prometteur"
 cc_cond.1.desc: "[minister.GetName] s'est distingué(e) par l'administration de notre capitale en pleine croissance. La prospérité de [country.GetCapitalName] semble avoir aiguisé son esprit. Comment allons-nous orienter ses talents [minister.GetHerHim]?"
 cc_cond.1.a: "Nommez [minister.GetName] comme [ShowTraitName('master_urbanist')]."
 cc_cond.1.b: "Former [minister.GetName] pour devenir un [ShowTraitName('enlightenment_herald')]."
 cc_cond.1.c: "Développer [minister.GetName] en tant que [ShowTraitName('progressive_rationalist')]."
 cc_cond.1.d: "Soutenir [minister.GetName] en tant que [ShowTraitName('revolutionary_herald')]."
 cc_cond.1.e: "Développer [minister.GetName] en tant que [ShowTraitName('grand_architect')]."
 cc_cond.1.f: "Former [minister.GetName] pour devenir un [ShowTraitName('arts_patron')]."
 cc_cond.1.g: "Nommer [minister.GetName] comme [ShowTraitName('learned_courtier')]."
 cc_cond.1.h: "Développer [minister.GetName] en tant que [ShowTraitName('reform_minded_counselor')]."
 cc_cond.1.i: "Nommer [minister.GetName] en tant que [ShowTraitName('urban_planner')]."
 cc_cond.1.j: "Soutenir [minister.GetName] en tant que [ShowTraitName('prosperity_herald')]."
 cc_cond.1.k: "Nommez [minister.GetName] comme [ShowTraitName('merchant_syndic')]."
 cc_cond.1.dismiss: "La croissance de la capitale parlera d'elle-même."

 # ============================================================
 # cc_cond.3 — Military Specialist (Ages 1–4, mil > 33)
 # ============================================================
 cc_cond.3.title: "Un esprit militaire émerge"
 cc_cond.3.desc: "[minister.GetName] s'est révélé être un administrateur militaire capable. Sa maîtrise de la logistique, de la tactique et de l'organisation le distingue des autres à la cour. Avec une orientation appropriée, ce talent peut être utilisé à des fins précises."
 cc_cond.3.a: "Nommer [minister.GetName] en tant que [ShowTraitName('infantry_drillmaster')]."
 cc_cond.3.b: "Développer [minister.GetName] en tant que [ShowTraitName('scout_captain')]."
 cc_cond.3.c: "Former [minister.GetName] pour devenir un [ShowTraitName('military_engineer')]."
 cc_cond.3.dismiss: "Aucune direction n'est nécessaire pour le moment."

 # ============================================================
 # cc_cond.4 — Regional / Cultural / Religious Specialist
 # ============================================================
 cc_cond.4.title: "Un conseiller du monde"
 cc_cond.4.desc: "[minister.GetName] a fait preuve d'une profondeur de connaissances inhabituelle concernant les coutumes, les religions et les peuples qui nous entourent. Son expertise pourrait être davantage développée pour servir des objectifs spécifiques."
 cc_cond.4.christian: "Guider [minister.GetName] en tant que [ShowTraitName('christian_diplomat')]."
 cc_cond.4.orthodox: "Développer [minister.GetName] en tant que [ShowTraitName('ecumenical_patriarch_advisor')]."
 cc_cond.4.muslim: "Nommer [minister.GetName] en tant que [ShowTraitName('caliphate_diplomat')]."
 cc_cond.4.dharmic: "Former [minister.GetName] pour devenir un [ShowTraitName('brahmin_counselor')]."
 cc_cond.4.buddhist: "Guider [minister.GetName] en tant que [ShowTraitName('dharma_minister')]."
 cc_cond.4.western_europe: "Façonner [minister.GetName] en tant que [ShowTraitName('renaissance_patron')]."
 cc_cond.4.africa: "Développer [minister.GetName] en tant que [ShowTraitName('griot_diplomat')]."
 cc_cond.4.central_asia: "Former [minister.GetName] pour devenir un [ShowTraitName('steppe_strategos')]."
 cc_cond.4.south_asia: "Guider [minister.GetName] en tant que [ShowTraitName('mughal_administrator')]."
 cc_cond.4.new_world: "Nommer [minister.GetName] en tant que [ShowTraitName('new_world_pioneer')]."
 cc_cond.4.maritime: "Façonner [minister.GetName] en tant que [ShowTraitName('maritime_champion')]."
 cc_cond.4.dismiss: "Leur expertise trouvera son propre chemin."

 # ============================================================
 # cc_cond.5 — Parliamentary / Diplomatic Specialist
 # ============================================================
 cc_cond.5.title: "Un diplomate au talent rare"
 cc_cond.5.desc: "[minister.GetName] a navigué dans les cours et les assemblées de ce royaume avec une grâce inhabituelle. Ses instincts diplomatiques sont aiguisés. Comment allons-nous les développer ?"
 cc_cond.5.a: "Former [minister.GetName] pour devenir un [ShowTraitName('parliamentary_broker')]."
 cc_cond.5.b: "Nommez [minister.GetName] comme [ShowTraitName('diplomatic_attache')]."
 cc_cond.5.c: "Nommer [minister.GetName] en tant que [ShowTraitName('grand_chancellor')]."
 cc_cond.5.dismiss: "Leurs compétences se développeront naturellement."

 # ============================================================
 # cc_cond.6 — Advanced Military Specialist (Ages 5–6, mil > 66)
 # ============================================================
 cc_cond.6.title: "Un esprit militaire chevronné"
 cc_cond.6.desc: "[minister.GetName] est un commandant chevronné dont les instincts ont été forgés par des décennies de campagne. Ce n'est pas quelqu'un à gaspiller dans la routine administrative. Comment allons-nous exploiter ses dons ?"
 cc_cond.6.a: "Nommer [minister.GetName] comme [ShowTraitName('commissariat_officer')]."
 cc_cond.6.b: "Nommez [minister.GetName] comme [ShowTraitName('cavalry_marshal')]."
 cc_cond.6.c: "Développer [minister.GetName] en tant que [ShowTraitName('siege_engineer')]."
 cc_cond.6.d: "Nommer [minister.GetName] en tant que [ShowTraitName('supreme_commander')]."
 cc_cond.6.dismiss: "Leurs dons n'ont plus besoin d'être façonnés."

 # ============================================================
 # cc_cond.20 — Intellectual / Religious Cluster
 # ============================================================
 cc_cond.20.title: "Un conseiller façonné par son époque"
 cc_cond.20.desc: "[minister.GetName] a été formé par le climat intellectuel et spirituel de ce royaume. Leurs convictions sont profondes. Quel chemin capture le mieux leur nature ?"
 cc_cond.20.innovative: "Développer [minister.GetName] en tant que [ShowTraitName('innovative_counselor')]."
 cc_cond.20.traditionalist: "Façonner [minister.GetName] en tant que [ShowTraitName('traditionalist_guardian')]."
 cc_cond.20.spiritualist: "Former [minister.GetName] pour devenir un [ShowTraitName('mystical_patriarch')]."
 cc_cond.20.humanist: "Guider [minister.GetName] en tant que [ShowTraitName('humanist_philosopher')]."
 cc_cond.20.mysticism: "Développer [minister.GetName] en tant que [ShowTraitName('mystical_counselor')]."
 cc_cond.20.jurisprudence: "Nommer [minister.GetName] en tant que [ShowTraitName('legal_scholar')]."
 cc_cond.20.dismiss: "Leur nature se manifestera avec le temps."

 # ============================================================
 # cc_cond.21 — Social Order Cluster
 # ============================================================
 cc_cond.21.title: "Un conseiller de l'ordre social"
 cc_cond.21.desc: "La réflexion de [minister.GetName] sur l'organisation de la société a été affinée par le climat politique actuel. Leurs convictions sont claires. Comment devons-nous les orienter ?"
 cc_cond.21.absolutist: "Former [minister.GetName] pour devenir un [ShowTraitName('royal_absolutist')]."
 cc_cond.21.liberal: "Guider [minister.GetName] en tant que [ShowTraitName('liberal_reformer')]."
 cc_cond.21.centralized: "Développer [minister.GetName] en tant que [ShowTraitName('efficiency_administrator')]."
 cc_cond.21.decentralized: "Façonner [minister.GetName] en tant que [ShowTraitName('regional_magnate')]."
 cc_cond.21.serfdom: "Nommez [minister.GetName] comme [ShowTraitName('serf_overseer')]."
 cc_cond.21.free_subjects: "Nommer [minister.GetName] en tant que [ShowTraitName('emancipation_minister')]."
 cc_cond.21.individualism: "Développer [minister.GetName] en tant que [ShowTraitName('free_spirit_counselor')]."
 cc_cond.21.communalism: "Guider [minister.GetName] en tant que [ShowTraitName('community_steward')]."
 cc_cond.21.dismiss: "Leur vision sociale s'exprimera ailleurs."

 # ============================================================
 # cc_cond.22 — Military Doctrine Cluster
 # ============================================================
 cc_cond.22.title: "Une philosophie militaire prend forme"
 cc_cond.22.desc: "[minister.GetName] a assimilé les leçons militaires de l'histoire récente de ce royaume. Leurs convictions doctrinales sont désormais claires. Comment devons-nous les développer ?"
 cc_cond.22.quantity: "Nommer [minister.GetName] en tant que [ShowTraitName('mass_levy_commander')]."
 cc_cond.22.offensive: "Former [minister.GetName] pour devenir un [ShowTraitName('offensive_strategist')]."
 cc_cond.22.defensive: "Guider [minister.GetName] en tant que [ShowTraitName('defensive_commander')]."
 cc_cond.22.land: "Développer [minister.GetName] en tant que [ShowTraitName('continental_marshal')]."
 cc_cond.22.belligerent: "Former [minister.GetName] pour devenir un [ShowTraitName('hawk_minister')]."
 cc_cond.22.conciliatory: "Guider [minister.GetName] en tant que [ShowTraitName('peacemaker_counselor')]."
 cc_cond.22.dismiss: "Laissez la doctrine suivre son propre cours."

 # ============================================================
 # cc_cond.23 — Economic Doctrine Cluster
 # ============================================================
 cc_cond.23.title: "L'émergence d'une philosophie économique"
 cc_cond.23.desc: "Les convictions économiques de [minister.GetName] se sont cristallisées. Les marchés, les domaines et les débats du royaume ont façonné sa pensée pour en faire quelque chose de tranchant et d'utile. Comment allons-nous l'employer ?"
 cc_cond.23.aristocracy: "Former [minister.GetName] pour devenir un [ShowTraitName('noble_champion')]."
 cc_cond.23.plutocracy: "Façonner [minister.GetName] en tant que [ShowTraitName('merchant_prince')]."
 cc_cond.23.mercantilism: "Développer [minister.GetName] en tant que [ShowTraitName('mercantilist_official')]."
 cc_cond.23.free_trade: "Guider [minister.GetName] en tant que [ShowTraitName('free_market_advocate')]."
 cc_cond.23.capital_economy: "Nommer [minister.GetName] en tant que [ShowTraitName('capitalist_minister')]."
 cc_cond.23.dismiss: "La pensée économique se développera d'elle-même."

 # ============================================================
 # cc_cond.24 — Expansion / Cultural Identity Cluster
 # ============================================================
 cc_cond.24.title: "Une vision de l'identité du royaume"
 cc_cond.24.desc: "[minister.GetName] a développé de fortes convictions sur l'orientation culturelle du royaume et sa place dans le monde. Sa perspective reflète l'influence de cette époque. Comment allons-nous l'orienter ?"
 cc_cond.24.inward: "Former [minister.GetName] pour devenir un [ShowTraitName('consolidation_minister')]."
 cc_cond.24.latinized: "Guider [minister.GetName] en tant que [ShowTraitName('roman_administrator')]."
 cc_cond.24.hellenized: "Développer [minister.GetName] en tant que [ShowTraitName('hellenistic_scholar')]."
 cc_cond.24.sinicized: "Façonner [minister.GetName] en tant que [ShowTraitName('confucian_mandarin')]."
 cc_cond.24.unsinicized: "Nommer [minister.GetName] en tant que [ShowTraitName('steppe_warlord_advisor')]."
 cc_cond.24.dismiss: "L'identité culturelle parlera d'elle-même."

 # ============================================================
 # cc_cond.101 — Urban Ambitions Take Shape (follow-up to cc_cond.1 Tier 1)
 # ============================================================

 cc_cond.101.title: "Les ambitions urbaines prennent forme"
 cc_cond.101.desc: "[minister.GetName] travaille depuis que la couronne a reconnu ses dons pour la gouvernance urbaine. La capitale en a ressenti les effets — pour le meilleur ou pour le pire, selon la façon dont le projet a évolué."
 cc_cond.101.a: "Rapporter le résultat à la couronne."
 cc_cond.22.quality: "Façonner [minister.GetName] comme un [ShowTraitName('elite_trainer')]."
 cc_cond.22.naval: "Façonner [minister.GetName] comme un [ShowTraitName('admiral_counselor')]."
 cc_cond.23.traditional_economy: "Façonner [minister.GetName] comme un [ShowTraitName('estate_guardian')]."
 cc_cond.24.outward: "Façonner [minister.GetName] comme un [ShowTraitName('expansionist_advisor')]."
