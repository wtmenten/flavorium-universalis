l_french:
 # ============================================================
 # Provincial Governorate Events
 # ============================================================

 cc.gov.1.title: "Les ambitions du gouverneur"
 cc.gov.1.desc: "Les rapports de [governor.GetName] parlent d'une cour agitée — des promesses faites aux fonctionnaires locaux, des attentes accrues, et un appareil gouvernemental qui commence à s'imaginer bien plus indépendant que nous ne l'avions prévu."
 cc.gov.1.a: "Payer les dettes de la cour du gouverneur."
 cc.gov.1.b: "Réprimer fermement les ambitions."
 cc.gov.1.c: "Ignorez cela pour l'instant."

 cc.gov.2.title: "Le gouverneur lorgne sur ses voisins"
 cc.gov.2.desc: "[governor.GetName] a envoyé un mémorandum soulignant la faiblesse militaire de [target_neighbor.GetName] le long de notre frontière. Le gouverneur suggère explicitement : voici une opportunité."
 cc.gov.2.a: "Sanctionner une expansion limitée."
 cc.gov.2.b: "Interdire tout aventurisme de ce genre."

 # ============================================================
 # Tax Farm Events
 # ============================================================

 cc.tax.1.title: "La révolte de la ferme fiscale"
 cc.tax.1.desc: "Une nouvelle nous parvient de [tax_lord.GetName] : les collecteurs ont poussé trop fort, et les locaux ont réagi. Il y a des troubles dans les rues et des incendies dans les entrepôts. Quelque chose doit être fait."
 cc.tax.1.a: "Faciliter l'extraction — accorder un certain soulagement."
 cc.tax.1.b: "Tenir bon. L'ordre sera rétabli."

 cc.tax.2.title: "Collecteurs d'impôts et voisins"
 cc.tax.2.desc: "Les voisins de [tax_lord.GetName] ont déposé une plainte formelle. Nos collecteurs d'impôts, affirment-ils, ont opéré au-delà de la frontière — saisissant des marchandises, interrogeant des marchands et traitant le territoire étranger comme le leur."
 cc.tax.2.a: "Compenser les voisins et limiter les collecteurs."
 cc.tax.2.b: "Les collecteurs étaient dans leur droit."

 # ============================================================
 # Military March Events
 # ============================================================

 cc.march.1.title: "Le raid du Seigneur de la Marche"
 cc.march.1.desc: "Notre seigneur de marche [march_lord.GetName] a lancé un raid contre [raided_neighbor.GetName] — opportuniste, profitable et totalement sans notre autorisation. Un rapport complet nous a été remis. Nous devons maintenant décider de la manière d'y répondre."
 cc.march.1.a: "Sanctionner le raid. Qu'ils gardent le butin."
 cc.march.1.b: "Contenir le seigneur de la marche. Cela n'est pas permis."

 cc.march.2.title: "Tentative d'indépendance du Seigneur de Marche"
 cc.march.2.desc: "La noblesse devenant impatiente, [march_lord.GetName] a choisi ce moment pour tester notre détermination. Les agents du seigneur de marche sont dans la capitale, évoquant des griefs, de vieilles dettes et l'indépendance dont jouissaient autrefois leurs ancêtres."
 cc.march.2.a: "Les soudoyer — accorder de l'or et des concessions nobiliaires."
 cc.march.2.b: "Convertir la marche en protectorat."

 cc.march.3.title: "Le Seigneur de Marche menace ses voisins"
 cc.march.3.desc: "[march_lord.GetName] a rassemblé des troupes à la frontière avec [threatened_neighbor.GetName] et formule des exigences que nous n'avons jamais autorisées. Le voisin se tourne vers nous pour obtenir des directives — ou une retenue."
 cc.march.3.a: "Soutenir l'agression du seigneur de marche."
 cc.march.3.b: "Dénoncer la conduite du seigneur de la marche."
 cc.march.3.c: "Médiatiser le litige."

 cc.march.charter.1.title: "Une marche militaire établie"
 cc.march.charter.1.desc: "Par le privilège de nos nobles, une marche militaire a été formellement établie. Son seigneur se tient prêt à servir d'épée du royaume à la frontière — en échange de l'autonomie que son rôle exige."
 cc.march.charter.1.a: "Qu'elle soit donc chartée."
 cc.march.charter.1.a.tt: "Accorde une satisfaction accrue à l'ordre de la noblesse du seigneur de la marche."

 # ============================================================
 # Subject Lobbying Events (cc.201-203)
 # ============================================================

 cc.company.lobby.1.title: "La pétition de la compagnie à charte"
 cc.company.lobby.1.desc: "Des agents de [company.GetName] sont arrivés à la cour avec une pétition formelle : ils souhaitent des protections accrues pour leurs routes commerciales, un statut juridique dans les ports contestés et un signal clair de la couronne indiquant que leur expansion est sanctionnée. Les autres sujets observent notre réaction."
 cc.company.lobby.1.a: "Accorder les protections commerciales qu'ils recherchent."
 cc.company.lobby.1.b: "Financer directement l'expansion de leurs opérations."
 cc.company.lobby.1.c: "Rejeter la pétition. La couronne ne renégocie pas les chartes sur demande."

 cc.march.lobby.1.title: "Les exigences du Seigneur de la Marche"
 cc.march.lobby.1.desc: "[march_lord.GetName] a envoyé un envoyé avec un message clair : la marche a identifié une faiblesse à la frontière avec [expansion_target.GetName], et le seigneur de la marche a l'intention d'en profiter. Ils demandent — formellement, cette fois — la bénédiction de la couronne."
 cc.march.lobby.1.a: "Accorder l'autorisation — les laisser s'étendre."
 cc.march.lobby.1.b: "Subventionnez plutôt les fortifications frontalières — l'expansion sans la guerre."
 cc.march.lobby.1.c: "Rejeter la demande — la couronne choisit ses guerres."

 cc.subject.rivalry.1.title: "Une rivalité entre sujets"
 cc.subject.rivalry.1.desc: "[company_rival.GetName] et [march_rival.GetName] sont en litige. Les détails varient selon la personne à qui l'on s'adresse : revendications concurrentes sur une route commerciale, escarmouche frontalière, insulte lors d'une conférence. Ce qui n'est pas contesté, c'est que les deux sujets attendent désormais que la couronne prenne parti."
 cc.subject.rivalry.1.a: "S'allier à [company_rival.GetName]."
 cc.subject.rivalry.1.b: "S'allier à [march_rival.GetName]."
 cc.subject.rivalry.1.c: "Médiatiser le litige — indemnisez les deux parties."

 # ============================================================
 # Shadow Network Events (cc.140–cc.143)
 # ============================================================

 cc.shadow.intel.1.title: "Renseignements depuis l'ombre"
 cc.shadow.intel.1.desc: "[shadow_agent.GetName] a remis un rapport crypté. Nos agents au sein de [intel_target.GetName] ont identifié un élément exploitable — une faiblesse, une ouverture, un secret mal gardé. La manière dont nous utilisons cet avantage nous appartient."
 cc.shadow.intel.1.a: "Utilisons-le diplomatiquement — faisons pression sur [intel_target.GetName]."
 cc.shadow.intel.1.b: "Partager les renseignements avec un allié."
 cc.shadow.intel.1.c: "Récompenser la diligence du réseau."

 cc.shadow.conflict.1.title: "États fantoches en conflit"
 cc.shadow.conflict.1.desc: "Deux de nos réseaux secrets se sont croisés. [shadow_a.GetName] et [shadow_b.GetName] se disputent les mêmes contacts, les mêmes routes, les mêmes recoins invisibles du monde. Sans intervention, les frictions ne feront que croître."
 cc.shadow.conflict.1.a: "Arbitrer — séparer leurs sphères."
 cc.shadow.conflict.1.b: "Que les forts dominent."
 cc.shadow.conflict.1.c: "Nous avons un moyen de pression, extorquons le plus faible."
 cc.shadow.conflict.1.d: "Utilisez le conflit pour en tirer profit des deux parties."

 cc.shadow.legit.1.title: "Un État fantôme cherche sa légitimité"
 cc.shadow.legit.1.desc: "[petitioner.GetName] opère dans l'ombre depuis assez longtemps. Leurs agents à la cour parlent d'une reconnaissance formelle, de traités énoncés clairement plutôt qu'implicitement, d'une place à la table plutôt qu'en dessous. L'appel a du poids. La décision nous appartient."
 cc.shadow.legit.1.a: "Les élever à un arrangement de puppet officiel."
 cc.shadow.legit.1.b: "Récompenser leur loyauté — sans reconnaissance formelle."
 cc.shadow.legit.1.c: "Rejeter la pétition. Le secret est leur raison d'être."
 cc.shadow.legit.1.d: "Rédiger un cadre d'autonomie reconnue. [our_statesman.GetName] peut s'en charger."

 cc.shadow.dark.1.title: "Le réseau devient silencieux"
 cc.shadow.dark.1.desc: "Les rapports de [dark_agent.GetName] ont cessé. Plus de messages, plus de correspondance codée, plus de confirmation murmurée que le réseau est toujours opérationnel. Notre bureau de la cour occulte ne peut plus confirmer si nos agents sont loyaux, compromis ou simplement en attente."
 cc.shadow.dark.1.a: "Envoyer des agents pour rétablir le contact."
 cc.shadow.dark.1.b: "Attendons. Le réseau refaira surface — ou pas."

 # ============================================================
 # Client State / Puppet State Events (cc.150–cc.152)
 # ============================================================

 cc.client.1.title: "L'État client fait valoir son autonomie"
 cc.client.1.desc: "[client.GetName] a commencé à agir indépendamment dans le différend en cours avec [dispute_neighbor.GetName] — prenant des engagements, envoyant des signaux et se positionnant d'une manière qui suggère qu'il ne se considère plus lié par notre politique étrangère. Qu'il s'agisse d'ambition ou de négligence, cela exige une réponse."
 cc.client.1.a: "Les brider — ce n'est pas à eux de déclencher cette guerre."
 cc.client.1.b: "Laissez-les agir — leur initiative pourrait s'avérer utile."

 cc.puppet.1.title: "Les fils de la marionnette"
 cc.puppet.1.desc: "Des envoyés de [puppet.GetName] sont arrivés à la cour avec une requête familière. Ils ont servi fidèlement, combattu quand on le leur a demandé et payé ce qu'ils devaient. Désormais, ils souhaitent siéger au conseil — non pour gouverner, mais pour être vus. Les fils sont toujours là ; ils veulent simplement qu'ils ressemblent à une robe."
 cc.puppet.1.a: "Accorder une reconnaissance symbolique."
 cc.puppet.1.b: "Rejeter fermement la demande."
 cc.puppet.1.c: "Acheter leur silence."

 cc.client.puppet.1.title: "État client et marionnette en conflit"
 cc.client.puppet.1.desc: "La nouvelle nous parvient que [the_client.GetName] a ouvert des négociations secrètes avec [the_puppet.GetName] — entièrement sans notre connaissance ni sanction. Ce qu'ils ont discuté est flou, mais le fait qu'ils aient parlé sans nous en informer est précisément le genre de dérive que nous ne pouvons laisser devenir une habitude."
 cc.client.puppet.1.a: "Interdire tout contact direct — toutes les communications passeront par nous."
 cc.client.puppet.1.b: "Autoriser le contact — la coopération entre nos sujets ne représente aucune menace."
 cc.client.puppet.1.c: "Médiatiser le contact formellement."

 # Elite Enclave / Palatinate events are localised in cc_subjects_l_english.yml

 # ============================================================
 # Associated Republic Events (cc.170–cc.171)
 # ============================================================

 cc.republic.1.title: "L'échange savant de la République"
 cc.republic.1.desc: "Des délégués de [republic.GetName] ont proposé un programme d'échange formel : leurs savants dans nos académies, nos ministres dans leurs conseils, et un flux constant d'ouvrages imprimés entre les deux cours. Ils présentent cela comme un enrichissement mutuel. Cela pourrait également être bien plus."
 cc.republic.1.a: "Financer formellement le programme."
 cc.republic.1.b: "Absorber un savant républicain dans notre cabinet."
 cc.republic.1.c: "Décliner la proposition."

 cc.republic.2.title: "Dissidence républicaine"
 cc.republic.2.desc: "La correspondance en provenance de [republic.GetName] décrit une inquiétude croissante parmi la classe bourgeoise. Nos politiques — sur le commerce, l'imposition et le traitement des intérêts marchands — ont généré des frictions que le conseil de la république ne peut plus absorber en silence. Ils nous demandent de nous adapter. Leur ton suggère qu'ils s'attendent à ce que nous refusions."
 cc.republic.2.a: "Faire des concessions — ajuster les politiques."
 cc.republic.2.b: "Ignorez la dissension — le confort républicain n'est pas notre mandat."

 # ============================================================
 # Crown Dependency / Protectorate Events (cc.180–cc.181)
 # ============================================================

 cc.crowndep.1.title: "La dépendance de la Couronne cherche des faveurs"
 cc.crowndep.1.desc: "[dependency.GetName] a invoqué le lien de l'allégeance royale — formellement, par les voies appropriées, avec toutes les courtoisies d'usage. Ils demandent un soutien dans une affaire en cours et ont clairement indiqué qu'ils s'attendent à ce que la couronne se souvienne que la loyauté est réciproque."
 cc.crowndep.1.a: "Accéder à leur requête — le lien l'exige."
 cc.crowndep.1.b: "Envoyer de l'or — l'aide pratique prime sur la cérémonie."
 cc.crowndep.1.c: "Refuser — la couronne ne peut répondre à toutes les pétitions."

 cc.protectorate.1.title: "Difficultés de croissance du protectorat"
 cc.protectorate.1.desc: "[ward.GetName] est en difficulté. Les rapports décrivent des finances tendues, des tensions internes et l'insidieuse progression d'une instabilité qui, si elle n'est pas contrée, deviendra une crise. Ils ont demandé du soutien — sans bruit, sans dramaturgie, mais la requête est claire. Le fait que nous le fournissions, et comment, façonnera ce que deviendra ce protectorat."
 cc.protectorate.1.a: "Fournir un soutien stabilisateur — alléger leurs fardeaux."
 cc.protectorate.1.b: "Envoyer de l'or pour soutenir leurs finances."
 cc.protectorate.1.c: "Les convertir en État client — formaliser notre engagement."
