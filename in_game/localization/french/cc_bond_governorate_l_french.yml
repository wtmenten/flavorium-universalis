l_french:
 # === cc_bonds.20 — The Governor's First Annual Report ===
 cc_bonds.20.title: "Le premier rapport annuel du gouverneur"
 cc_bonds.20.desc: "Le gouverneur de [bond_subj.GetName] a soumis son premier compte rendu annuel complet des affaires de la province. Les chiffres des revenus sont inclus, accompagnés d'une évaluation de l'administration locale, des travaux publics et de la disposition de la population. Il attend des instructions sur la manière dont la Cour souhaite aborder la gouvernance actuelle — soit avec des objectifs fermes et une surveillance étroite, soit avec une certaine latitude selon les conditions locales."
 cc_bonds.20.a: "Fixez des objectifs de revenus stricts. La province doit verser sa part entière."
 cc_bonds.20.b: "Autoriser une administration flexible. Les résultats importent plus que la méthode."
 cc_bonds.20.c: "Établir un conseil de surveillance. La gouvernance doit être transparente."

 # === cc_bonds.21 — Provincial Road and Market ===
 cc_bonds.21.title: "Route et marché provinciaux"
 cc_bonds.21.desc: "Le gouverneur de [bond_subj.GetName] soumet une proposition : une nouvelle route commerciale reliant l'intérieur de la province à la côte, ainsi qu'un marché supervisé pour rationaliser le commerce local. Le projet prendrait plusieurs années à achever et nécessite des capitaux. Les bénéfices économiques sont réels — la question est de savoir qui en supportera le coût."
 cc_bonds.21.a: "Que la province finance cela sur ses revenus locaux."
 cc_bonds.21.b: "La Couronne fournira le capital."
 cc_bonds.21.c: "Mettre la proposition en attente. Nous avons des préoccupations plus pressantes."

 # === cc_bonds.22 — The Governor's Military Levy ===
 cc_bonds.22.title: "La levée militaire du gouverneur"
 cc_bonds.22.desc: "Le gouverneur de [bond_subj.GetName] a été chargé d'évaluer la capacité militaire de la province. Son rapport est franc : les hommes sont là, mais leur conscription perturberait les travaux agricoles à une saison critique, et la province a ses propres problèmes de sécurité. Il peut lever les troupes si on lui en donne l'ordre. Il demande si c'est véritablement ce que nous souhaitons."
 cc_bonds.22.a: "Effectuez la levée complète. La province doit répondre à l'appel de la Couronne."
 cc_bonds.22.b: "Proposer un service volontaire avec compensation. Épargner les réticents."
 cc_bonds.22.c: "Ne pas lever de troupes dans cette province pour le moment."

 # === cc_bonds.23 — Governor's Son Seeks Appointment ===
 cc_bonds.23.title: "Le fils du gouverneur sollicite une nomination"
 cc_bonds.23.desc: "La nouvelle nous parvient que le gouverneur de [bond_subj.GetName] a un fils d'un âge approprié pour une nomination à la cour — bien éduqué, bien introduit dans les cercles provinciaux, et clairement le choix de son père pour progresser. La demande n'est pas explicite, mais elle est sans équivoque. Que nous voyions cela comme une opportunité ou une imposition dépend de la manière dont nous abordons la relation avec la province."
 cc_bonds.23.a: "Trouver au jeune homme un poste approprié à la cour."
 cc_bonds.23.b: "Les nominations se font au mérite. Qu'il postule par les voies officielles."
 cc_bonds.23.c: "Ignorez la requête implicite."

 # === cc_bonds.24 — Provincial Legal Customs Conflict ===
 cc_bonds.24.title: "Conflit de coutumes juridiques provinciales"
 cc_bonds.24.desc: "Les cours provinciales de [bond_subj.GetName] fonctionnent selon un ensemble de coutumes locales qui précèdent l'administration de la Couronne de plusieurs générations. Les juristes de la Couronne soutiennent que cette incohérence mine l'autorité légale et complique l'administration. Les dirigeants provinciaux rétorquent que leurs coutumes sont légitimes, fonctionnelles et profondément ancrées dans la vie locale. Un conflit sur une affaire d'héritage contestée a forcé la question."
 cc_bonds.24.a: "Standardisez la loi royale dans toute la province. Une seule loi pour tous."
 cc_bonds.24.b: "Codifier un système hybride. Préserver ce qui fonctionne, intégrer ce qui est nécessaire."
 cc_bonds.24.c: "Reconnaître formellement les coutumes locales. Leur loi leur appartient."

 # === cc_bonds.25 — The Governor Petitions for Permanence ===
 cc_bonds.25.title: "Le gouverneur demande la permanence de son poste"
 cc_bonds.25.desc: "L'actuel gouverneur de [bond_subj.GetName] a effectué deux mandats complets et arrive à la fin du troisième. Sa pétition arrive avec un soutien considérable — des nobles provinciaux, du clergé local, des marchands qui se sont habitués à son administration. Il demande à être confirmé comme gouverneur héréditaire, afin que sa famille détienne la charge à perpétuité. La demande est flatteuse. Elle est également lourde de conséquences."
 cc_bonds.25.a: "Accorder le gouvernorat héréditaire. Ses services l'ont mérité."
 cc_bonds.25.b: "Maintenir le système de rotation de la couronne. Pas de charges héréditaires."
 cc_bonds.25.c: "Prolonger considérablement son mandat actuel. Un compromis."

 # === cc_bonds.26 — Corruption Reports ===
 cc_bonds.26.title: "Rapports sur la corruption"
 cc_bonds.26.desc: "Des rapports confidentiels nous sont parvenus suggérant que certains fonctionnaires de [bond_subj.GetName] ont complété leurs salaires par des moyens irréguliers — contrats gonflés, détournement de recettes fiscales, licences préférentielles. Les montants ne sont pas ruineux, et le gouverneur lui-même est soit ignorant, soit délibérément tenu à l'écart. Mais la perte est réelle, et notre réponse créera un précédent."
 cc_bonds.26.a: "Ignorez les rapports. Un certain degré de corruption est le prix de l'administration."
 cc_bonds.26.b: "Commander un audit complet. Les responsables seront tenus pour comptables."
 cc_bonds.26.c: "Envoyer un cadeau privé au gouverneur. Encourager la discrétion."

 # === cc_bonds.201 — The Council Delivers Its Report ===
 cc_bonds.201.title: "Le conseil remet son rapport"
 cc_bonds.201.desc: "Le conseil de surveillance que nous avons établi à [bond_subj.GetName] a terminé son travail. Le rapport est approfondi — peut-être plus qu'on ne l'espérait lors de la création du conseil. Il documente les lacunes administratives, estime le coût de leur correction et conclut par une série de recommandations allant de réformes procédurales aux dépenses d'infrastructure. Le conseil a fait exactement ce que nous lui avions demandé. La question est de savoir quoi faire de la réponse.\n\nLes recommandations ne sont pas bon marché. Elles ne sont pas politiquement neutres. Et le conseil observe pour voir si son travail a eu une quelconque importance."

 cc_bonds.201.a: "Acceptez les recommandations. Financez les réformes identifiées par le conseil."
 cc_bonds.201.a.tooltip: "Le travail du conseil est honoré. Un véritable investissement dans l'administration provinciale — l'économie et la politique s'améliorent toutes deux, et la province est gouvernée plus efficacement."

 cc_bonds.201.b: "Outrepasser le conseil. Prendre les gains économiques, ignorer les réformes structurelles."
 cc_bonds.201.b.tooltip: "L'extraction à court terme est réelle — des gains économiques sans coût. La stabilité politique décline alors que les conclusions du conseil sont écartées. Les lacunes administratives subsistent."

 cc_bonds.201.c: "Formaliser le conseil en tant qu'institution permanente de gouvernance provinciale."
 cc_bonds.201.c.tooltip: "L'investissement le plus important — mais l'économie et la politique y gagnent toutes deux substantiellement, et la province envoie une expression formelle de bonne volonté à la Couronne. Le conseil fait partie intégrante de la structure provinciale de façon permanente."
