 # ============================================================
 # Colonial Consolidation & Border Friction — Pillar 07
 # ============================================================

 # --- Section D: Border Friction ---

 cc_colonial.20.title: "La querelle frontalière"
 cc_colonial.20.desc: "Des nouvelles nous parviennent du Nouveau Monde concernant des troubles le long d'une frontière non délimitée. [colony_a.GetName] et son voisin [colony_b.GetName] — peuples d'origine [colony_a_culture.GetName] et autre, s'appréciant peu — revendiquent tous deux la même étendue de terre non arpentée. Les arpenteurs échangent des insultes, les colons échangent des coups, et chaque gouverneur écrit pour exiger que la Couronne prenne parti."
 cc_colonial.20.a: "Tracer la ligne en faveur de [colony_a.GetName]. Le siège le plus fort doit tenir le terrain."
 cc_colonial.20.b: "Laissez les colons régler cela entre eux. La Couronne a mieux à faire."
 cc_colonial.20.c: "Dépêcher immédiatement un arpenteur royal, avant que le sang ne coule."

 cc_colonial.21.title: "Raids sur la ligne"
 cc_colonial.21.desc: "La querelle a dégénéré en raids ouverts. Des granges brûlent des deux côtés de la frontière contestée, et les gouverneurs de [colony_a.GetName] et [colony_b.GetName] parlent désormais l'un de l'autre comme d'ennemis plutôt que de voisins. Si la Couronne n'agit pas, les colonies pourraient prendre les choses entièrement en main."
 cc_colonial.21.a: "Envoyer des troupes de la Couronne pour policer la frontière et mettre fin aux raids."
 cc_colonial.21.b: "Soutenir la revendication de [colony_a.GetName] par la force. Que l'affaire soit tranchée."
 cc_colonial.21.c: "C'est une querelle dans un pays lointain. Laissons-les saigner."

 cc_colonial.22.title: "L'arbitrage de la Couronne"
 cc_colonial.22.desc: "Les commissaires royaux ont parcouru les terres contestées, consulté les chartes et tracé une frontière que [colony_a.GetName] et [colony_b.GetName] pourraient accepter. Un règlement contraignant n'attend plus que le sceau de la Couronne."
 cc_colonial.22.a: "Ratifier la frontière équitable. Laissons les deux colonies prospérer derrière une ligne établie."
 cc_colonial.22.b: "Confier à notre ministre le plus capable la négociation d'un accord généreux qui ne laisse personne insatisfait."

 # --- Section E: Consolidation / Viceroyalty ---

 cc_colonial.30.title: "Une pétition pour une gouvernance unifiée"
 cc_colonial.30.desc: "Deux de nos colonies ont fusionné. [colony_a.GetName] et la plus petite [colony_b.GetName] — toutes deux peuplées de colons [colony_a_culture.GetName], partageant routes, paroisses et marchés — sont désormais soumises à des administrations distinctes et redondantes. Leurs gouverneurs pétitionnent conjointement la Couronne pour rationaliser l'organisation avant que le double emploi des bureaux ne vide les coffres du trésor."
 cc_colonial.30.a: "Unissez-les en une seule vice-royauté. [colony_b.GetName] sera intégrée à [colony_a.GetName]."
 cc_colonial.30.b: "Les lier sous un conseil commun, mais laisser chacun conserver son siège."
 cc_colonial.30.c: "Laisser l'arrangement en l'état. Le changement apporte ses propres problèmes."

 cc_colonial.31.title: "L'Acte d'Union des colonies"
 cc_colonial.31.desc: "C'est fait. Le territoire, les revenus et les institutions de [colony_b.GetName] sont intégrés à [colony_a.GetName], que la Couronne érige en siège vice-royal gouvernant l'ensemble du royaume consolidé. Une nouvelle vice-royauté prend place parmi les joyaux de l'empire."
 cc_colonial.31.a: "Inaugurez la vice-royauté avec tout le cérémonial requis."

 cc_colonial.32.title: "Sièges jumeaux préservés"
 cc_colonial.32.desc: "Plutôt que de dissoudre une colonie fière dans sa voisine, la Couronne lie [colony_a.GetName] et [colony_b.GetName] sous un conseil de coordination commun. Elles mettront en commun leurs cours, leurs routes et leurs défenses, tout en conservant chacune son propre gouverneur et son sceau."
 cc_colonial.32.a: "Formaliser le conseil partagé. Laissons la coopération accomplir l'œuvre de l'union."

 cc_colonial.33.title: "La première cour du vice-roi"
 cc_colonial.33.desc: "La nouvelle vice-royauté de [colony_a.GetName] convoque sa première cour, et tous les regards se tournent vers la question de savoir qui siégera à sa tête. Le choix donnera le ton du gouvernement vice-royal pour une génération."
 cc_colonial.33.a: "Nommez un loyaliste de la couronne de confiance. Le contrôle importe plus que la bonne volonté."
 cc_colonial.33.b: "Nommez un créole respecté. Un siège satisfait est un siège prospère."

 # --- Section F: Labor & Demographics ---

 cc_colonial.40.title: "La question du travail"
 cc_colonial.40.desc: "[colony_a.GetName] a dépassé les arrangements provisoires de sa fondation. Ses plantations et ses mines réclament des bras, et la manière dont ces bras seront trouvés façonnera la colonie — et la conscience de la Couronne — pour des générations. Les planteurs, les missions et les maisons de commerce proposent chacun une réponse différente."
 cc_colonial.40.a: "Enraciner l'encomienda. La terre sera travaillée, quel qu'en soit le coût."
 cc_colonial.40.b: "Octroyer des chartes pour des plantations marchandes. Laissez les bourgeois gérer une économie de cultures de rente."
 cc_colonial.40.c: "Fonder des missions et encourager l'installation libre. Bâtir une colonie dévote et soudée."

 cc_colonial.41.title: "La mission et la plantation"
 cc_colonial.41.desc: "À la frontière de [colony_a.GetName], les missions qui abritent les convertis et les planteurs qui convoitent leur main-d'œuvre sont entrés en conflit ouvert. Les frères demandent la protection de leur troupeau ; les planteurs réclament les bras que, selon eux, la Couronne leur avait promis. On ne peut satisfaire les deux parties."
 cc_colonial.41.a: "S'allier aux missions. Protégez les convertis et laissez les planteurs rouspéter."
 cc_colonial.41.b: "S'allier aux planteurs. La richesse doit couler, peu importe ce que disent les frères."

 cc_colonial.42.title: "Griefs créoles"
 cc_colonial.42.desc_default: "Une génération d'élites nées dans les colonies a atteint l'âge adulte à [colony_a.GetName], et elles s'impatientent sous le règne de nommés de la métropole qui arrivent sans rien connaître de la terre et repartent sans avoir grand-chose appris. Elles demandent des fonctions, de la reconnaissance, une voix dans leur propre gouvernance."
 cc_colonial.42.desc_coerced: "Une génération d'élites nées dans les colonies a atteint l'âge adulte à [colony_a.GetName] — et elles se sont enrichies grâce à une économie de travail forcé qu'elles s'estiment désormais en droit de commander. Elles déplorent les nommés de la métropole placés sur elles et l'ingérence lointaine de la Couronne dans une société qu'elles seules comprennent. Elles demandent, avec une pointe de menace, des fonctions et une voix propre."
 cc_colonial.42.a: "Ouvrir des bureaux à l'élite créole. Une concession maintenant évite une révolte plus tard."
 cc_colonial.42.b: "Réaffirmer le contrôle métropolitain. Les colonies sont gouvernées depuis la capitale."

 cc_colonial.43.title: "Un bilan démographique"
 cc_colonial.43.desc: "Des décennies d'un ordre colonial rigide ont laissé leur marque sur [colony_a.GetName] : une société stratifiée par la naissance et le travail, ses divisions inscrites dans sa population même. L'heure des comptes que la Couronne a longtemps différée est arrivée, et s'y attaquer ne sera pas gratuit."
 cc_colonial.43.a: "Investir dans la réconciliation et l'intégration, quel qu'en soit le coût."
 cc_colonial.43.b: "Accepter la société divisée telle qu'elle est. L'empreinte perdurera."
