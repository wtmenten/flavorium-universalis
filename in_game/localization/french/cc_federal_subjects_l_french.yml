l_french:

 # ============================================================
 # SUBJECT TYPE UI KEYS — Imperial Federalization
 # ============================================================

 imperial_council_member: "Membre du Conseil impérial"
 LEAD_imperial_council_member: "Suzerain fédéral"
 AM_imperial_council_member: "Membre du Conseil impérial"
 CANCEL_imperial_council_memberTITLE: "Dissoudre l'appartenance au conseil"
 CANCEL_imperial_council_member_DESC: "Retirer l'invitation au Conseil Impérial, mettant fin à la relation consultative et rendant sa pleine indépendance à l'ancien membre."

 equal_federal_member: "Membre fédéral"
 LEAD_equal_federal_member: "Parlement fédéral"
 AM_equal_federal_member: "Membre fédéral"
 CANCEL_equal_federal_memberTITLE: "Dissoudre l'appartenance fédérale"
 CANCEL_equal_federal_member_DESC: "Dissoudre le pacte fédéral, rompant ainsi le partenariat législatif et militaire. Le royaume membre n'oubliera pas que la promesse d'égalité a été révoquée."

 lesser_federal_member: "Membre associé"
 LEAD_lesser_federal_member: "Parlement fédéral"
 AM_lesser_federal_member: "Membre associé"
 CANCEL_lesser_federal_memberTITLE: "Retirer le statut d'associé"
 CANCEL_lesser_federal_member_DESC: "Mettre fin à l'accord d'adhésion associée, rendant au royaume son statut antérieur. Les ressentiments nés d'un traitement de seconde zone ne se dissipent pas si facilement."

 false_federal_member: "Détenteur de la charte fédérale"
 LEAD_false_federal_member: "Autorité de la Charte"
 AM_false_federal_member: "Détenteur de la Charte"
 CANCEL_false_federal_memberTITLE: "Révocation de la charte fédérale"
 CANCEL_false_federal_member_DESC: "Révoquer la charte fédérale, mettant fin à l'arrangement. Les populations auxquelles on avait promis une adhésion égale et qui n'ont reçu que l'extraction ne seront pas enclines à la gratitude."

 # Upgrade tooltip strings
 federal_member_upgrade_tt: "Ce membre a été récemment admis au Conseil — le mécanisme constitutionnel pour une mise à niveau fédérale complète est encore en cours d'établissement."
 lesser_federal_member_upgrade_tt: "Ce membre a été récemment admis au Conseil — le mécanisme constitutionnel pour une mise à niveau fédérale complète est encore en cours d'établissement."

 # ============================================================
 # ADVANCES — Imperial Federalization
 # ============================================================

 colonial_assembly_advance: "Assemblées coloniales"
 colonial_assembly_advance_desc: "Établir des assemblées représentatives dans nos territoires coloniaux, donnant aux dirigeants locaux une voix formelle dans la gouvernance impériale. La première étape vers une relation plus durable avec les colonies."

 federal_constitution_advance: "Constitution fédérale"
 federal_constitution_advance_desc: "Rédiger un cadre constitutionnel pour une fédération impériale, accordant un statut législatif aux assemblées coloniales au sein d'un parlement fédéral plus large. Ouvre la voie à l'adhésion au conseil impérial et à l'union fédérale complète."

 imperial_trade_compact_advance: "Compact commercial impérial"
 imperial_trade_compact_advance_desc: "Formaliser une zone de commerce préférentiel à l'échelle de l'empire, liant les colonies à la métropole par des intérêts commerciaux partagés. Le langage du partenariat occulte celui du profit."

 false_federal_charter_advance: "Charte fédérale"
 false_federal_charter_advance_desc: "Délivrer des chartes fédérales aux territoires coloniaux et clients existants. Ces documents promettent les droits de membre tout en préservant les mécanismes d'extraction. Une fédération de nom ; un empire de fait."

