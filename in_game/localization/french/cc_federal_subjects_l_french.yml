 # ============================================================
 # CABINET TRAIT — Federal Architect
 # ============================================================

 federal_architect: "Architecte fédéral"
 desc_federal_architect: "Façonné par les défis de gouverner un empire par le consentement plutôt que par la contrainte, ce conseiller a dédié sa carrière à la théorie et à la pratique de la gouvernance fédérale. Il comprend comment maintenir l'unité d'un empire diversifié — comment accorder suffisamment d'autonomie pour que les sujets se sentent investis, tout en maintenant une intégration suffisante pour que le tout soit supérieur à la somme des parties."
 federal_architect_die_desc: "Le travail minutieux de construction fédérale qu'ils ont maintenu nécessitera de nombreuses mains pour se poursuivre. Une partie de ce qu'ils ont bâti perdurera. Le reste dépendra entièrement de celui qui viendra après eux."

 # cc_traits.40 event text
 cc_traits.40.title: "Un architecte de l'ordre fédéral"
 cc_traits.40.a: "Oui. Nommez [minister.GetName] comme [ShowTraitName('federal_architect')] et commandez les travaux."
 cc_traits.40.b: "L'empire est maintenu par l'autorité, non par des constitutions. Pas encore."

 # ============================================================
 # MODIFIER NAMES — Imperial Federalization
 # ============================================================

 STATIC_MODIFIER_NAME_cc_federal_union_solidarity: "Solidarité de l'union fédérale"
 STATIC_MODIFIER_DESC_cc_federal_union_solidarity: "Un membre fédéral a affirmé son engagement envers l'union en un moment de crise. Cette démonstration de loyauté partagée renforce la position de l'empire."

 STATIC_MODIFIER_NAME_cc_false_federation_exposed: "Tromperie mise à nu"
 STATIC_MODIFIER_DESC_cc_false_federation_exposed: "Le fossé entre les promesses de l'appartenance fédérale et sa réalité est devenu indéniable. La crédibilité de l'empire en tant que partenaire — sous le regard de ce territoire et d'autres — a été endommagée."

 STATIC_MODIFIER_NAME_cc_synergy_federal_compact: "Pacte fédéral"
 STATIC_MODIFIER_DESC_cc_synergy_federal_compact: "Le parlement fédéral a été formalisé par un pacte constitutionnel — un cadre commun qui donne aux membres un véritable intérêt dans la gouvernance de l'empire."
 OFFER_lesser_federal_member_TOOLTIP_HEADER_NO_TARGET: "Offrir une adhésion fédérale associée à un [country|e]"
 OFFER_false_federal_member_TOOLTIP_HEADER_NO_TARGET: "Délivrer une charte fédérale à un [country|e]"
 cc_traits.40.desc: "[minister.GetName] a passé sa carrière à regarder l'empire lutter pour maintenir ses divers territoires unis — les colonies qui en demandent plus, les dépendances qui s'offusquent de moins, les clients qui prennent chaque concession comme une invitation pour la demande suivante. Là où la plupart des conseillers voient un problème d'autorité, [minister.GetName] voit un problème de conception. Cette personne a élaboré quelque chose : un cadre pour gouverner par le consentement plutôt que par la coercition, pour construire des structures fédérales durables parce qu'elles sont véritablement partagées. Elle demande si la cour est prête à réfléchir sérieusement à l'avenir de l'empire."
