l_french:
 # === cc_bonds.150 — The Client Regime Holds ===
 cc_bonds.150.title: "Le régime client tient bon"
 cc_bonds.150.desc: "Les gouvernements clients sont la première chose qu'une époque comme celle-ci balaie, et [bond_subj.GetName] n'a pas été balayé. Les hommes que nous avons installés sont toujours à leurs postes, signent toujours notre correspondance et peuvent, apparemment, toujours marcher dans leur propre capitale. Quoi que nous ayons fait durant les décennies d'administration tranquille, cela a produit un régime doté de sa propre base électorale plutôt qu'une garnison et une liste de paie."
 cc_bonds.150.desc.deep: "Le gouvernement de [bond_subj.GetName] a survécu à une année qui a balayé trois de ses voisins, et il l'a fait sans nous demander de troupes. Ses ministres sont allés plaider la cause de cet arrangement en public, et suffisamment de gens ont trouvé l'argument convaincant. Un État client capable de se défendre politiquement n'est plus vraiment un État client. C'est un allié qui se trouve nous devoir de l'argent."
 cc_bonds.150.a: "Ne rien changer. L'arrangement fonctionne."
 cc_bonds.150.b: "Donnez-lui un cadre formel. Elle n'a plus besoin de notre garnison."

 # === cc_bonds.151 — The Client Regime Falls ===
 cc_bonds.151.title: "Le régime client s'effondre"
 cc_bonds.151.desc: "Le gouvernement de [bond_subj.GetName] a perdu le contrôle de sa propre capitale. Nos ministres nous font rapport depuis une maison de campagne à l'extérieur de la ville, ce qui est une façon diplomatique de dire qu'ils l'ont quittée. Le régime que nous avons installé n'a jamais acquis de base électorale au-delà des bureaux que nous avons payés, et dans une année où de telles choses comptent, le manque à gagner est devenu l'essentiel de l'histoire."
 cc_bonds.151.desc.deep: "Il n'y a plus de gouvernement à [bond_subj.GetName] qui nous réponde. Le ministère a été dissous par une foule, notre résident a reçu un sauf-conduit vers la frontière, et les hommes qui publient désormais des proclamations citent les termes de notre propre traité de protectorat comme preuve de ce qu'on leur a fait. On ne négocie pas avec nous. On nous utilise comme argument."
 cc_bonds.151.desc.scholar: "Les hommes qui gouvernent aujourd'hui [bond_subj.GetName] sont les élèves du savant que nous avions réduit au silence. Il n'a pas vécu assez longtemps pour voir cela, ce que mentionnent plusieurs des proclamations. Supprimer l'argument il y a des décennies ne l'a pas réglé ; cela a seulement garanti que lorsque l'argument gagnerait enfin, il gagnerait avec notre nom attaché au mauvais côté."
 cc_bonds.151.a: "Soutenez-la à nouveau. Peu importe le coût actuel."
 cc_bonds.151.b: "Installez-en un nouveau. Cette fois avec une garnison pour le soutenir."
 cc_bonds.151.c: "Désavouer l'arrangement. Cela n'a jamais valu la crédibilité accordée."

 # === cc_bonds.152 — The Council Seat Proves Its Worth ===
 cc_bonds.152.title: "Le siège au conseil prouve sa valeur"
 cc_bonds.152.desc: "Lorsque nous avons fait entrer [bond_subj.GetName] au Conseil Impérial, c'était un geste, et les gestes ne coûtent rien. Cela a cessé d'en être un. Leur délégué a passé cette session à défendre notre position auprès de membres qui hésitaient, au motif que c'est désormais aussi leur position. Un siège à une table s'avère être une chose durable à donner à quelqu'un."
 cc_bonds.152.desc.deep: "Le délégué de [bond_subj.GetName] a fait plus durant cette session que de voter avec nous. Il a maintenu la cohésion du conseil pendant un mois où celui-ci aurait pu facilement se dissoudre, a servi d'intermédiaire entre deux membres qui refusaient de nous parler directement, et a présenté l'ensemble de l'affaire comme le conseil se gouvernant lui-même plutôt que la couronne gouvernant le conseil. Ce qui est exactement ce que nous voulions qu'il devienne, et que nous n'attendions pas entièrement."
 cc_bonds.152.a: "Laissez le conseil porter le règlement. C'est à cela qu'il sert."
 cc_bonds.152.b: "Élevez-les au rang de partenaire fédéral complet. Ils ont mérité le reste."

 # === cc_bonds.153 — The Council Seat Was Never Enough ===
 cc_bonds.153.title: "Le siège au conseil n'a jamais suffi"
 cc_bonds.153.desc: "Le délégué de [bond_subj.GetName] a exposé, lors d'une session que nous ne pouvions ajourner, exactement ce que vaut le siège au conseil. Il peut parler, et il a parlé, et rien n'est sorti de tout cela. Il ne demande pas plus de temps de parole. Il demande à quoi sert ce siège, et la réponse honnête est une réponse que nous préférerions ne pas donner publiquement."
 cc_bonds.153.desc.deep: "La délégation de [bond_subj.GetName] s'est retirée du conseil et a publié ses motifs. Le document est calme et énumère chaque motion qu'ils ont présentée sur quarante ans, avec le vote et le résultat à côté. Le schéma n'est pas flatteur. Ils ont fait preuve de plus de bonne foi envers l'institution que nous ne l'avons fait, et ils ont cessé d'en faire devant tous les autres membres."
 cc_bonds.153.a: "Élargissez ce siège en un véritable partage du pouvoir."
 cc_bonds.153.b: "Rappelez-leur ce qu'était ce siège : une courtoisie, pas un droit."

 # === cc_bonds.154 — One Nation, Two Languages ===
 cc_bonds.154.title: "Une Nation, Deux Langues"
 cc_bonds.154.desc: "[bond_subj.GetName] est venue à nous en parlant une autre langue et en priant différemment, et nous n'avons jamais résolu cela. À une époque où l'identité est l'argument principal de tous, ce point non résolu s'est avéré être un atout. On ne demande pas à leur peuple de choisir entre ce qu'ils sont et ce que nous sommes, alors ils ne choisissent pas. Les révolutionnaires d'ailleurs trouvent cette province difficile à investir."
 cc_bonds.154.desc.deep: "L'accord à [bond_subj.GetName] a tenu si complètement qu'il a commencé à fonctionner à l'envers. Leurs tribunaux fonctionnent dans deux langues et personne ne le remarque. Leur noblesse envoie ses fils dans nos académies et nous envoyons les nôtres chez eux. Lorsque les pamphlets révolutionnaires sont arrivés promettant une nation pour chaque peuple, l'argument a échoué, car la question de savoir à qui appartient cette nation a été tranchée ici il y a deux générations d'une manière qui a satisfait tout le monde."
 cc_bonds.154.desc.scholar: "Le savant que nous avons parrainé a produit l'œuvre qui a rendu cela possible : un corpus de travaux dans leur langue qui traite l'union comme son propre sujet plutôt que comme une imposition. Leurs écoles l'enseignent. Les nôtres ont commencé à le faire. Lorsque les pamphlets sont arrivés demandant si un peuple peut appartenir à un empire sans cesser d'être un peuple, [bond_subj.GetName] possédait déjà une bibliothèque entière de réponses."
 cc_bonds.154.a: "Laissez les choses en l'état. Cela fonctionne parce que personne n'a légiféré à ce sujet."
 cc_bonds.154.b: "Inscrivez-le dans la loi, et laissez les nobles se plaindre."

 # === cc_bonds.155 — The Old Language Comes Back ===
 cc_bonds.155.title: "Le retour de l'ancienne langue"
 cc_bonds.155.desc: "Les statuts d'assimilation ont été appliqués à [bond_subj.GetName] aussi longtemps que cela a été possible, et cette année, cela a cessé de l'être. L'ancienne langue est revenue dans les tribunaux, les écoles et les imprimeries, et elle est revenue avec colère. Ce que nous avons supprimé n'a pas disparu ; cela a attendu, et s'est enrichi d'un sentiment d'injustice."
 cc_bonds.155.desc.deep: "[bond_subj.GetName] a abrogé nos statuts sans nous consulter, ce qui n'est pas un pouvoir dont il dispose. La signalétique, la liturgie, les registres de la cour et les programmes scolaires sont tous revenus en arrière en l'espace d'une saison, et la rapidité de l'opération indique que l'appareil nécessaire au renversement avait été assemblé depuis longtemps et tenu prêt. L'ère révolutionnaire n'a pas créé cela. Elle a seulement supprimé la dernière raison d'attendre."
 cc_bonds.155.desc.faith: "Les anciens rites et l'ancienne langue sont revenus ensemble à [bond_subj.GetName], ce qui était la seule façon dont ils pouvaient revenir. La conversion que nous avons ordonnée a été obéie mais jamais acceptée, et le clergé qui l'a administrée est celui qui l'annule maintenant, avec les registres pour prouver qu'ils n'y ont jamais cru non plus. La foi et la langue sont ici un seul et même grief, et nous l'avons créé d'un seul trait."
 cc_bonds.155.desc.scholar: "Le renouveau à [bond_subj.GetName] est mené par la presse que le savant supprimé avait fondée et que nous avons laissé fonctionner en pensant qu'elle était inoffensive. Elle a imprimé des dictionnaires et des grammaires pendant quarante ans. À une époque où la langue est devenue une question politique, quarante ans de philologie tranquille s'avèrent être la chose la plus efficace que quiconque ait jamais accomplie dans cette province."
 cc_bonds.155.a: "Abrogez les statuts. Ils n'ont jamais valu le prix qu'ils ont coûté."
 cc_bonds.155.b: "L'appliquer plus fermement. La loi est la loi."

