 # Estate Privileges

 ep_noble_admiralty_commission: "Commission de l'Amirauté"
 ep_noble_admiralty_commission_desc: "La couronne formalise le commandement naval sous patronage noble, accordant à la haute noblesse la surveillance de l'administration de la flotte en échange d'une capacité portuaire accrue. Nécessite une monarchie et l'avancée de la Charte Navale."

 # Advance

 naval_administration_advance: "Administration navale"
 naval_administration_advance_desc: "L'État établit un conseil d'amirauté permanent pour superviser les stations navales lointaines, étendant le contrôle royal sur les mers. Nécessite l'avancée $naval_charter_advance$. Débloque la réforme de l'Administration Navale."

 # Government Reform

 cc_naval_administration_reform: "Administration navale"
 cc_naval_administration_reform_desc: "L'établissement d'un conseil d'amirauté permanent étend l'autorité royale sur les stations navales lointaines, permettant la création d'un gouverneur naval supplémentaire et réduisant le coût d'entretien des ports isolés."

 # Building

 naval_academy: "Académie navale"
 naval_academy_desc: "Une institution dédiée à la formation des officiers et au perfectionnement de la doctrine navale. Augmente le nombre de marins locaux, réduit l'attrition de la flotte au port et — si elle est établie dans la capitale — améliore le moral, la tradition et la taille prévue de la marine à travers le royaume. Nécessite l'avancée $naval_charter_advance$. Peut être construite dans toute ville ou mégalopole dotée d'un port."
 naval_academy_maintenance: "Fournitures de l'académie navale"
