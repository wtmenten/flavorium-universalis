l_french:
 ########################################
 # cc_hus.1 — The Pope Calls for Aid
 ########################################
 cc.hus.1.title: "Avec un seul petit prêt de notre père..."
 cc.hus.1.desc: "La guerre a éclaté entre Rome et la Bohême. [current_pope.GetName] a levé sa bannière contre l'hérésie hussite, appelant tous les princes catholiques fidèles à répondre. L'issue de cette lutte façonnera l'âme de la chrétienté — et notre réponse sera mémorisée tant à Rome qu'à Prague."
 cc.hus.1.a: "Nous nous tenons aux côtés du Saint-Père. Nos armes sont les Siennes."
 cc.hus.1.b: "Acceptez les pièces papales et retirez-vous de cette guerre."
 cc.hus.1.c: "Nous ne nous laisserons pas acheter. Notre cause demeure."
 cc.hus.1.d: "Se lancer dans la croisade. Rejoindre la guerre du Pape contre l'hérésie."
 cc.hus.1.e: "Ce n'est pas notre guerre. Laissons Rome mener ses propres batailles."
