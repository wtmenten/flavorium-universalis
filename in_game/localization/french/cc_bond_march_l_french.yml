l_french:
 # === cc_bonds.60 — The March Lord's Formal Investiture ===
 cc_bonds.60.title: "L'investiture du Seigneur de la Marche"
 cc_bonds.60.desc: "Le nouveau seigneur de [bond_subj.GetName] est prêt à recevoir son investiture formelle. Parmi les seigneurs de frontière, la cérémonie n'est pas une simple tradition — c'est le langage du statut, de l'obligation et de la confiance. Une grande cérémonie nous coûterait du prestige et de l'or que nous pourrions dépenser ailleurs. Une cérémonie modeste remplirait le même objectif juridique pour une fraction du coût. La maison du seigneur de marche a observé la manière dont nous répondons à cette question."
 cc_bonds.60.a: "Organiser une cérémonie grandiose avec tous les privilèges nobiliaires. Ce seigneur le mérite."
 cc_bonds.60.b: "Organiser une investiture standard. Correcte, digne et proportionnée."
 cc_bonds.60.c: "Une cérémonie minimale suffira. La loi exige le serment, pas le faste."

 # === cc_bonds.61 — Sharing the War Spoils ===
 cc_bonds.61.title: "Partage du butin de guerre"
 cc_bonds.61.desc: "Nos forces et les soldats du seigneur de marche ont combattu ensemble lors de la récente campagne, et maintenant vient l'heure des comptes. Les forces de la marche ont subi des pertes, ont garnisonné des terrains difficiles et ont ancré notre flanc. La part du butin qu'ils recevront dépend, strictement parlant, de notre décision. Ils le savent. Ils observent attentivement pour voir si nous nous souvenons de leur contribution, ou s'ils seront remerciés par des mots et compensés par rien."
 cc_bonds.61.a: "Accordez-leur une part généreuse. Ils l'ont méritée, et bien plus encore."
 cc_bonds.61.b: "Partager le butin selon l'arrangement standard."
 cc_bonds.61.c: "La majeure partie du butin appartient à la Couronne. C'est l'arrangement convenu."

 # === cc_bonds.62 — March Lord Requests Garrison Funding ===
 cc_bonds.62.title: "Demande de financement de la garnison"
 cc_bonds.62.desc: "Une dépêche de [bond_subj.GetName] expose clairement la situation : les fortifications frontalières se détériorent, la garnison est en sous-effectif et le seigneur de marche n'a pas de revenus suffisants pour régler les deux problèmes simultanément. Il demande un financement de la Couronne. La marche existe pour défendre notre frontière, ce qui nous profite autant qu'à lui. Le fait que nous choisissions de reconnaître cet intérêt commun dans notre allocation — ou de traiter cela comme son seul problème — sera mémorisé par chaque officier à son service."
 cc_bonds.62.a: "Financer entièrement la garnison. La frontière est notre responsabilité commune."
 cc_bonds.62.b: "Fournir un financement partiel. Nous partageons les coûts, ils assument le reste."
 cc_bonds.62.c: "La frontière est sous son commandement. Il doit la financer lui-même."

 # === cc_bonds.63 — The March Lord's Feud ===
 cc_bonds.63.title: "La querelle du Seigneur de la Marche"
 cc_bonds.63.desc: "Le seigneur de marche de [bond_subj.GetName] s'est embroilé dans un litige amer avec une maison noble voisine — une revendication frontalière qui a dégénéré en affaire d'honneur. Les deux parties ont fait appel à notre cour. La maison voisine a des liens plus profonds au sein de la noblesse, un meilleur statut juridique sur la question frontalière et plus d'amis dans la capitale. Le seigneur de marche possède autre chose : il est le nôtre, et il observe pour voir si cela a une importance."
 cc_bonds.63.a: "Soutenir le seigneur de marche. Quels que soient les arguments juridiques, c'est notre homme."
 cc_bonds.63.b: "Médiatiser entre les parties. Trouvez une résolution que les deux puissent accepter."
 cc_bonds.63.c: "La loi parle d'elle-même. Nous tranchons en faveur de la maison voisine."

 # === cc_bonds.64 — Frontier Administration Rights ===
 cc_bonds.64.title: "Droits d'Administration Frontalière"
 cc_bonds.64.desc: "Le seigneur de marche de [bond_subj.GetName] a soumis une pétition formelle : la population frontalière est depuis longtemps gouvernée par des arrangements ad hoc qui laissent planer de nombreuses questions juridiques. Il propose que la Couronne accorde formellement à la marche l'autorité judiciaire sur son propre territoire — le droit de trancher les litiges, d'appliquer les contrats et de lever des pénalités locales. Notre conseiller juridique note qu'une telle autorité, une fois accordée, est difficile à reprendre. Notre conseiller militaire note qu'un seigneur ayant une pleine autorité administrative sur son territoire est bien plus facile à gouverner que celui qui doit justifier chaque décision auprès de la capitale."
 cc_bonds.64.a: "Accorder l'autorité judiciaire complète à la marche. La frontière a besoin d'une gouvernance claire."
 cc_bonds.64.b: "Conserver les droits judiciaires de la Couronne sur la marche. L'autorité reste la nôtre."
 cc_bonds.64.c: "Établir une cour frontalière commune. Nous gouvernons ensemble."

 # === cc_bonds.65 — Campaign Alongside the March Lord ===
 cc_bonds.65.title: "Mener campagne aux côtés du Seigneur des Marches"
 cc_bonds.65.desc: "La campagne actuelle offre une opportunité inhabituelle. Le seigneur de marche de [bond_subj.GetName] est engagé sur une frontière que nos forces approchent également. Nous pourrions unir nos efforts et combattre personnellement à ses côtés — ou envoyer un général royal à notre place — ou le laisser opérer son théâtre d'opérations indépendamment. La quatrième option, soulevée par nos officiers de logistique, est de rediriger entièrement ses forces vers notre front principal. Ils nous seraient très utiles là-bas. Ce qu'ils penseraient de cette réaffectation est une autre question."
 cc_bonds.65.a: "Je commanderai personnellement aux côtés du seigneur de marche."
 cc_bonds.65.b: "Envoyer un général royal. La coordination importe ; la présence est facultative."
 cc_bonds.65.c: "Que le seigneur de la marche gère son théâtre d'opérations indépendamment. Il est celui qui le connaît le mieux."
 cc_bonds.65.d: "Réaffecter les forces des marches à notre front principal où elles sont nécessaires."

 # === cc_bonds.66 — The March Lord's Heir ===
 cc_bonds.66.title: "L'héritier du Seigneur de la Marche"
 cc_bonds.66.desc: "Le seigneur de marche de [bond_subj.GetName] a un héritier d'un âge approprié. Une décision doit être prise. Nous pourrions inviter le jeune héritier à notre cour — pour qu'il apprenne nos coutumes, tisse des liens avec notre noblesse et grandisse en comprenant que la Couronne est son protecteur naturel. Le seigneur de marche sait ce que cela signifie : son fils grandirait autant sous notre influence que sous la sienne. Alternativement, nous pourrions organiser un mariage avantageux qui renforcerait la position de la famille sans obliger l'héritier à quitter son foyer. Ou nous pourrions laisser le seigneur de marche gérer la question en temps voulu."
 cc_bonds.66.a: "Inviter l'héritier à notre cour en tant que pupille. Il apprendra à servir la Couronne."
 cc_bonds.66.b: "Organiser un mariage prestigieux pour l'héritier."
 cc_bonds.66.c: "C'est une affaire privée pour la maison du seigneur de marche."
