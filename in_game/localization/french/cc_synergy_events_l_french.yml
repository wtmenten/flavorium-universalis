l_french:
 # ============================================================
 # TYPE A — RULER + CABINET SYNERGY
 # ============================================================
 cc_synergy.1.title: "Le fer et le sang"
 cc_synergy.1.desc: "La discipline de fer de notre souverain et l'expertise de notre commandant militaire ont créé quelque chose de remarquable au sein des conseils de guerre. Tous deux ont développé une doctrine commune qui redéfinit la manière dont nous levons et déployons nos forces."
 cc_synergy.1.a: "Établir la nouvelle doctrine militaire"
 cc_synergy.1.b: "Promouvoir le commandant"
 cc_synergy.1.c: "Le royaume a d'autres priorités"

 cc_synergy.2.title: "Une cour des lettres"
 cc_synergy.2.desc: "La profondeur intellectuelle de notre souverain et les ambitions artistiques de notre ministre ont attiré une attention inhabituelle à travers le royaume. Lettres, savants et artistes sont attirés par notre cour, et la capitale devient plus qu'un simple siège du pouvoir — elle devient un centre culturel."
 cc_synergy.2.a: "Établir la Cour du Savoir"
 cc_synergy.2.b: "Approfondir le programme culturel"
 cc_synergy.2.c: "Reconnaissez les progrès accomplis"

 cc_synergy.20.title: "La cour s'étoffe"
 cc_synergy.20.desc: "Le programme culturel que nous avons établi a porté ses fruits. Les érudits débattent dans nos couloirs ; les artistes se disputent le patronage. Ce n'est plus seulement une cour — c'est une civilisation."
 cc_synergy.20.a: "Laissez-le s'épanouir"

 cc_synergy.3.title: "Le réseau du Califat"
 cc_synergy.3.desc: "La maîtrise de l'art du gouvernement par notre souverain et les profondes connexions de notre ministre au sein du monde islamique se sont conjuguées pour produire un résultat extraordinaire : un appareil diplomatique qui s'étend aux cours des fidèles et commande un respect véritable."
 cc_synergy.3.a: "Formaliser la cour diplomatique"
 cc_synergy.3.b: "Acceptez la reconnaissance qu'elle apporte"

 cc_synergy.4.title: "Tradition et Parlement"
 cc_synergy.4.desc: "Un partenariat improbable a émergé entre les instincts parlementaires de notre souverain et le profond respect de notre ministre pour les institutions traditionnelles. Le résultat est un parlement que les anciens ordres peuvent accepter — et un processus de réforme que les nouvelles forces peuvent supporter."
 cc_synergy.4.a: "Cultiver l'harmonie parlementaire"
 cc_synergy.4.b: "Reconnaissez les contributions des deux parties"

 cc_synergy.5.title: "L'esprit réformateur"
 cc_synergy.5.desc: "Les convictions progressistes de notre souverain et la profondeur philosophique de notre ministre ont ensemble créé quelque chose d'insolite dans cette cour : un véritable programme intellectuel de réforme. Les institutions du royaume ne sont pas simplement ajustées — elles sont réimaginées."
 cc_synergy.5.a: "Financer le saut institutionnel"
 cc_synergy.5.b: "Les idées sont prêtes — commencer la transition formelle"
 cc_synergy.5.b.tt: "Débloque la réforme de la Cour des Philosophes lorsque les conditions sont remplies"

 cc_synergy.6.title: "La synthèse soufie"
 cc_synergy.6.desc: "La profondeur spirituelle de notre souverain et la maîtrise de la diplomatie islamique par notre ministre ont produit une synthèse remarquable : une cour où la sagesse soufie rencontre le calcul politique, et où l'autorité mystique renforce le pouvoir diplomatique."
 cc_synergy.6.a: "Cultiver la tradition soufie"
 cc_synergy.6.b: "Accroître l'autorité formelle du ministre"

 cc_synergy.7.title: "Le Mandat du Ciel approché"
 cc_synergy.7.desc: "La compréhension pragmatique de la gouvernance orientale par notre souverain et la maîtrise de l'administration confucéenne par notre ministre commencent à aboutir à quelque chose de remarquable : une cour qui ne gouverne pas seulement par la force, mais par la légitimité issue d'un ordre approprié."
 cc_synergy.7.a: "Le Mandat du Savoir — cultivez-le"
 cc_synergy.7.b: "Formaliser la tradition bureaucratique"
 cc_synergy.7.b.tt: "Débloque la réforme de la Bureaucratie du Mandat lorsque les conditions sont remplies"

 cc_synergy.8.title: "La Grande Entreprise"
 cc_synergy.8.desc: "L'ambition insatiable de notre souverain et l'expertise coloniale de notre ministre se sont rencontrées — et ce qu'ils planifient ensemble est plus vaste que tout ce qu'ils auraient pu tenter seuls. Les entreprises d'outre-mer sont sur le point de changer de nature et d'échelle."
 cc_synergy.8.a: "Lancer le syndicat colonial"
 cc_synergy.8.b: "Canaliser l'énergie vers des gains immédiats"

 cc_synergy.9.title: "L'émergence de l'hégémonie de fer"
 cc_synergy.9.desc: "La combinaison de la discipline implacable de notre souverain, du génie militaire de notre commandant suprême et de la marche militaire à notre frontière a attiré l'attention de toutes les cours voisines. Nous ne sommes pas seulement puissants — nous sommes dominants d'une manière qui change tous les calculs."
 cc_synergy.9.a: "Formaliser l'Hégémonie de Fer"
 cc_synergy.9.b: "Profitons maintenant de l'avantage militaire"

 cc_synergy.91.title: "L'hégémonie de fer débloquée"
 cc_synergy.91.desc: "Les conditions d'une Hégémonie de Fer sont réunies. L'appareil militaire, le seigneur de la marche et les États nobles sont tous alignés. Le moment est venu de formaliser notre dominance."
 cc_synergy.91.a: "Délivrer la Charte de fer"
 cc_synergy.91.a.tt: "Débloque la réforme gouvernementale de l'Hégémonie de Fer"

 cc_synergy.10.title: "Tribune du Peuple"
 cc_synergy.10.desc: "En cette ère révolutionnaire, les instincts progressistes de notre souverain et la maîtrise du parlement par notre ministre ont convergé vers quelque chose de jamais vu auparavant : un gouvernement véritablement populaire, qui commande l'affection des ordres comme du peuple commun."
 cc_synergy.10.a: "Le tribun du peuple est arrivé"
 cc_synergy.10.b: "Canaliser l'énergie populaire via le parlement"

 # ============================================================
 # TYPE B — CABINET + CABINET SYNERGY
 # ============================================================
 cc_synergy.11.title: "Dialogue entre l'Est et l'Ouest"
 cc_synergy.11.desc: "Notre ministre innovateur et notre érudit confucéen ont entamé un échange intellectuel extraordinaire. La tension entre leurs traditions s'avère plus productive que prévu — leur rivalité génère des idées."
 cc_synergy.11.a: "Soutenir la rivalité intellectuelle"
 cc_synergy.11.b: "La capitale devrait refléter cet épanouissement"

 cc_synergy.12.title: "La lame du commerce"
 cc_synergy.12.desc: "Le commerce et l'acier ont trouvé leur alliance dans notre cour. Notre ministre du commerce et notre commandant noble ont réalisé que leurs intérêts, correctement alignés, se renforcent mutuellement : le commerce ouvre les routes que les armées protègent, et les armées protègent la richesse que le commerce génère."
 cc_synergy.12.a: "Formaliser l'accord de la Lame Commerciale"
 cc_synergy.12.b: "Reconnaissez les contributions des deux états"

 cc_synergy.13.title: "Réforme par le Parlement"
 cc_synergy.13.desc: "Notre ministre innovateur et notre intermédiaire parlementaire ont trouvé leur projet commun : non seulement une réforme, et non seulement une gestion parlementaire, mais la transformation du parlement lui-même en un vecteur de changement progressiste."
 cc_synergy.13.a: "Débloquer la réforme du Compromis Parlementaire"
 cc_synergy.13.a.tt: "Débloque la réforme gouvernementale du Compromis Parlementaire"
 cc_synergy.13.b: "Cultiver l'harmonie parlementaire pour le moment"

 cc_synergy.14.title: "Intégration et développement"
 cc_synergy.14.desc: "Le ministre chargé d'intégrer nos nouveaux territoires et le ministre chargé du développement de nos provinces ont comparé leurs notes — et ont découvert que leur travail est plus complémentaire que concurrentiel. Ensemble, ils proposent une approche qui accélérerait les deux processus."
 cc_synergy.14.a: "Financer la poussée d'intégration"
 cc_synergy.14.b: "La capitale en bénéficie directement"

 cc_synergy.15.title: "Tissu et calice"
 cc_synergy.15.desc: "Notre ministre du clergé et notre ministre du commerce sont parvenus à une entente inattendue au parlement. Le sacré et le commercial, convenablement réconciliés, ne sont pas ennemis — et leur alliance permet au parlement de fonctionner plus fluidement que quiconque ne l'aurait imaginé."
 cc_synergy.15.a: "Célébrer le concordat"
 cc_synergy.15.b: "L'arrangement parle de lui-même"

 cc_synergy.16.title: "Le conseil de guerre"
 cc_synergy.16.desc: "Notre commandant de cavalerie et notre ingénieur de siège se sont étroitement consultés, et ce qu'ils ont produit ensemble dépasse la somme de leurs parties. Ils proposent une doctrine unifiée pour la campagne actuelle qui rendrait nos forces considérablement plus efficaces."
 cc_synergy.16.a: "Mettez en œuvre la doctrine du Conseil des seigneurs de guerre"
 cc_synergy.16.b: "Tirer un avantage tactique immédiat"

 cc_synergy.17.title: "Le Grand Réseau"
 cc_synergy.17.desc: "L'expertise diplomatique de nos ministres seniors a atteint une masse critique. Ensemble, ils ne se contentent pas de mener la politique étrangère — ils construisent une architecture de relations qu'il faudra des décennies pour démanteler."
 cc_synergy.17.a: "Développer le réseau diplomatique"
 cc_synergy.17.b: "Exploitons le réseau pour une négociation ciblée"

 cc_synergy.18.title: "La cour des Lumières"
 cc_synergy.18.desc: "La convergence de la philosophie humaniste et d'une administration innovante au sein de notre cour a produit quelque chose de rare : un cabinet où les idées sont testées plutôt qu'affirmées, où la réforme découle de la raison plutôt que de l'intérêt. Les cours étrangères commencent à le remarquer."
 cc_synergy.18.a: "La cour des Lumières s'épanouira"
 cc_synergy.18.b: "L'heure de la Cour des Philosophes est venue"
 cc_synergy.18.b.tt: "Débloque la réforme gouvernementale de la Cour des Philosophes"

 # ============================================================
 # TYPE C — CABINET + ACTIVE CONTENT SYNERGY
 # ============================================================
 cc_synergy.21.title: "Le réseau d'ombres éveillé"
 cc_synergy.21.desc: "La maîtrise diplomatique du monde islamique de notre ministre a été combinée à l'autorité formelle de notre cour diplomatique — et le résultat dépasse la diplomatie ordinaire. Un réseau d'influence rayonne désormais depuis notre capitale, que les puissances étrangères peinent à contrer."
 cc_synergy.21.a: "Activer le Réseau de l'Ombre"
 cc_synergy.21.b: "Approfondir les liens avec le Califat"

 cc_synergy.22.title: "Le bras académique du Mandat"
 cc_synergy.22.desc: "Notre mandarin confucéen et le concordat savant ont trouvé leur synthèse : une vision de la gouvernance où l'apprentissage et l'administration ne sont pas des vocations distinctes, mais un appel unique. La cour devient quelque chose que les anciens auraient reconnu."
 cc_synergy.22.a: "Mandat d'Apprentissage — le laisser s'épanouir"
 cc_synergy.22.b: "La capitale devrait en bénéficier directement"

 cc_synergy.23.title: "Le pacte parlementaire"
 cc_synergy.23.desc: "Le courtier parlementaire et la Réforme du Compromis Parlementaire ont atteint leur destination logique : une charte formelle entre les états marchands et le parlement qui rend le processus législatif simultanément plus efficace et plus légitime."
 cc_synergy.23.a: "Accorder la Charte Parlementaire aux bourgeois"
 cc_synergy.23.b: "Cultiver l'harmonie parlementaire à la place"

 cc_synergy.24.title: "La Marche et le commissaire"
 cc_synergy.24.desc: "La combinaison de notre administrateur militaire, de la Charte de Marche et de la marche militaire active a créé quelque chose que les nobles comme les généraux reconnaissent comme exceptionnel. La marche n'est pas seulement un État tampon — c'est une projection de notre puissance militaire, et la cour possède l'expertise pour l'utiliser comme telle."
 cc_synergy.24.a: "L'hégémonie de fer est à portée de main"
 cc_synergy.24.b: "Améliorer l'expertise du ministre en matière de siège"

 cc_synergy.25.title: "Le pacte de gouvernance"
 cc_synergy.25.desc: "L'administrateur efficace et la Réforme du Gouvernorat se sont trouvés — et le gouvernorat provincial fonctionne mieux que quiconque ne l'aurait espéré. Ce qui a commencé comme un arrangement administratif devient un modèle sur la façon de gouverner un vaste royaume sans perdre sa cohérence."
 cc_synergy.25.a: "Le pacte de gouvernance — le formaliser"
 cc_synergy.25.b: "Un dividende plus court mais immédiat"
 cc_synergy.25.b.tt: "Accorde un modificateur de courte durée et réduit les coûts de suppression de la bureaucratie"

 cc_synergy.26.title: "Le pacte maritime"
 cc_synergy.26.desc: "L'expertise maritime de notre ministre et la puissance commerciale de nos compagnies à charte ont atteint un alignement productif. Les bourgeois investissent, les marins naviguent, et le résultat est un réseau commercial qui commence à définir la place de notre royaume dans le monde."
 cc_synergy.26.a: "Le syndicat colonial arrive à maturité"
 cc_synergy.26.b: "Saisir les gains commerciaux immédiats"
