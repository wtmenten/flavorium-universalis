l_french:
 # ============================================================
 # Cabinet Events Localization
 # cc_cabinet.1–52
 # ============================================================


 # cc_cabinet.5 — The Minister Responds to Refusal
 cc_cabinet.5.title: "Le Ministre répond au refus"
 cc_cabinet.5.desc: "Le ministre que nous avons refusé a eu des mois pour réfléchir à la décision. Maintenant, les conséquences arrivent."
 cc_cabinet.5.a: "Le ministre s'est retiré dans une distance maussue. Son manque de coopération rend les révocations plus difficiles. (−prestige, revoke cost +)"
 cc_cabinet.5.b: "Le ministre a trouvé d'autres moyens de s'enrichir. Le trésor en a discrètement souffert. (−gold)"
 cc_cabinet.5.c: "Le ministre s'est tourné vers les états nobles, gagnant leur faveur contre les intérêts de la Couronne. (Noble satisfaction +, Burgher satisfaction −)"

 # cc_cabinet.50 — The Snubbed Estate Retaliates
 cc_cabinet.50.title: "L'état snobé n'a pas oublié"
 cc_cabinet.50.desc: "La nouvelle nous parvient que l'état écarté lors de nos récents arrangements curiaux a couvé son grief avec beaucoup de soin. On nous rappelle que la patience et le ressentiment se ressemblent souvent, jusqu'au jour où ils divergent."
 cc_cabinet.50.a: "Offrir une conciliation."
 cc_cabinet.50.b: "Laissons-les bouillonner."

 # cc_cabinet.52 — The Minister's Idle Influence (standard)
 cc_cabinet.52.title: "L'influence oisive du ministre"
 cc_cabinet.52.desc: "Les mois sans surveillance du ministre ont discrètement façonné le royaume. Les détails font surface maintenant, trop tard pour être modifiés mais assez clairs pour être pris en compte."
 cc_cabinet.52.a: "Leurs connexions procurent un gain modeste."
 cc_cabinet.52.b: "Leur conduite discrète a gagné l'approbation d'un domaine."
 cc_cabinet.52.c: "Leurs entreprises ne mènent à rien."
 cc_cabinet.52.d: "Leurs transactions non autorisées ont offensé les mauvaises personnes."

 # cc_cabinet.53 — The Minister's Subtle Gambit (skilled / diplomatic minister)
 cc_cabinet.53.title: "Le gambit subtil du ministre"
 cc_cabinet.53.desc: "Un ministre doté d'un talent diplomatique notable reste rarement inactif. Des contacts ont été approfondis, des faveurs échangées et des arrangements conclus sans votre connaissance directe. Les résultats arrivent maintenant, et le ministre a laissé sa marque."
 cc_cabinet.53.a: "Leurs connexions commerciales génèrent un profit."
 cc_cabinet.53.b: "Ils ont ouvert des portes auprès d'une puissance voisine."
 cc_cabinet.53.c: "Leur travail discret étend notre portée diplomatique."
 cc_cabinet.53.d: "Ils ont surestimé leur main, et le pari s'est retourné contre eux."

 # cc_cabinet.54 — Idle Hands in Troubled Times (restless estates)
 cc_cabinet.54.title: "Mains oisives en temps troublés"
 cc_cabinet.54.desc: "Vous avez laissé au ministre une marge de manœuvre précisément au moment où les domaines devenaient agités. Que ce soit par ruse ou par négligence, le ministre s'est retrouvé empêtré dans les tensions, et ses choix atteignent désormais la couronne."
 cc_cabinet.54.a: "Ils apaisent discrètement le domaine agité."
 cc_cabinet.54.b: "Ils tournent l'agitation à l'avantage de la couronne."
 cc_cabinet.54.c: "Leur ingérence attise davantage les tensions."
