l_french:
 # ============================================================
 # Cabinet Events Localization
 # cc_cabinet.1–52
 # ============================================================


 # cc_cabinet.5 — The Minister Responds to Refusal
 cc_cabinet.5.title: "Le Ministre répond au refus"
 cc_cabinet.5.desc: "Le ministre que nous avons refusé a eu des mois pour réfléchir à la décision. Maintenant, les conséquences arrivent."
 cc_cabinet.5.a: "Le ministre s'est retiré dans une distance maussue. Son manque de coopération rend les révocations plus difficiles. (−prestige, revoke cost +)"
 cc_cabinet.5.b: "Le ministre a trouvé d'autres moyens de s'enrichir. Le trésor en a discrètement souffert. (−gold)"
 cc_cabinet.5.c: "Le ministre s'est tourné vers les états nobles, gagnant leur faveur contre les intérêts de la Couronne. (Noble satisfaction +, Burgher satisfaction −)"

 # cc_cabinet.50 — The Snubbed Estate Retaliates
 cc_cabinet.50.title: "L'état snobé n'a pas oublié"
 cc_cabinet.50.desc: "La nouvelle nous parvient que l'état écarté lors de nos récents arrangements curiaux a couvé son grief avec beaucoup de soin. On nous rappelle que la patience et le ressentiment se ressemblent souvent, jusqu'au jour où ils divergent."
 cc_cabinet.50.a: "Proposer une conciliation. (−3× revenus)"
 cc_cabinet.50.b: "Laissons-les bouillonner."

 # cc_cabinet.52 — The Minister's Idle Influence (standard)
 cc_cabinet.52.title: "L'influence oisive du ministre"
 cc_cabinet.52.desc: "Les mois passés sans supervision ont discrètement façonné le royaume. Les détails font surface maintenant — trop tard pour les changer, mais assez clairs pour en rendre compte."
 cc_cabinet.52.a: "Les relations du ministre procurent une manne modeste. (+2× monthly income)"
 cc_cabinet.52.b: "La conduite discrète du ministre a gagné l'approbation tacite d'un État. (Satisfaction des États +)"
 cc_cabinet.52.c: "Les entreprises du ministre n'apportent presque rien de valeur. (−2× revenus mensuels)"
 cc_cabinet.52.d: "Les transactions non autorisées du ministre ont froissé les mauvaises personnes. (Satisfaction des États −)"

 # cc_cabinet.53 — The Minister's Subtle Gambit (skilled / diplomatic minister)
 cc_cabinet.53.title: "Le gambit subtil du ministre"
 cc_cabinet.53.desc: "Un ministre doté d'un talent diplomatique notable reste rarement inactif. Des contacts ont été approfondis, des faveurs échangées et des arrangements conclus sans votre connaissance directe. Les résultats arrivent maintenant — le ministre a laissé sa marque."
 cc_cabinet.53.a: "Les connexions commerciales du ministre deviennent rentables. (+3× revenus mensuels, +prestige)"
 cc_cabinet.53.b: "Le ministre a ouvert des portes diplomatiques avec une puissance voisine. (+mutual opinion, +prestige)"
 cc_cabinet.53.c: "Le travail subtil du ministre étend discrètement notre portée diplomatique. (Modificateur d'influence, 8 ans)"
 cc_cabinet.53.d: "Le ministre a surestimé son avantage — le pari a échoué. (−prestige, nobles satisfaction −)"

 # cc_cabinet.54 — Idle Hands in Troubled Times (restless estates)
 cc_cabinet.54.title: "Mains oisives en temps troublés"
 cc_cabinet.54.desc: "Vous avez laissé au ministre une marge de manœuvre précisément au moment où les États devenaient agités. Par ruse ou par négligence, le ministre s'est retrouvé empêtré dans les tensions latentes — ses choix ont désormais des répercussions sur la couronne."
 cc_cabinet.54.a: "Le ministre apaise discrètement l'état mécontent. (Estate satisfaction +, +prestige)"
 cc_cabinet.54.b: "Le ministre tourne l'agitation à l'avantage de la couronne. (+3× monthly income, investment modifier)"
 cc_cabinet.54.c: "L'ingérence du ministre attise davantage les tensions. (Satisfaction des États −, −prestige)"
