 # ============================================================
 # PROTECTORATE / HOLY PROTECTORATE EVOLUTION EVENTS (cc.220–cc.226)
 # ============================================================

 # cc.220 — A Ward No Longer
 cc.ward_no_longer.title: "N'est plus un pupille"
 cc.ward_no_longer.desc.holy: "[ward.GetName] s'est longtemps tenu sous le manteau de notre protection sacrée — un protégé de la foi, gardé et guidé à travers des décennies d'objectifs partagés. Mais le monde a changé, et notre lien aussi. Leur envoyé arrive non pas avec un besoin, mais avec une confiance tranquille.\n\n« Nous sommes reconnaissants pour tout ce que vous nous avez donné », disent-ils, « mais nous sommes prêts à nous tenir à vos côtés plutôt qu'à vos pieds. »"
 cc.ward_no_longer.desc.prot: "[ward.GetName] s'est longtemps appuyé sur notre protection informelle — un arrangement confortable qui a servi les deux parties durant des périodes plus calmes. Mais les années ont passé, et quelque chose a changé. Leur envoyé arrive non pas comme un suppliant, mais comme un égal.\n\n« L'arrangement nous a bien servis », disent-ils, « mais il est peut-être temps de reconnaître ce que nous sommes réellement devenus. »"
 cc.ward_no_longer.a: "Saluons la transition. Ils l'ont méritée."
 cc.ward_no_longer.a_cruel: "Les absorber par décret. Ils nous servent, et non l'inverse."
 cc.ward_no_longer.a_zealot: "Remplissez l'obligation sacrée. La charge sainte est abandonnée."
 cc.ward_no_longer.a_master: "Une transition magistrale — notre ministre s'assure que la cérémonie soit exceptionnelle."
 cc.ward_no_longer.a_integration: "Un avenir intégré — notre ministre établit le cadre d'un partenariat durable."
 cc.ward_no_longer.b: "Le moment n'est pas encore venu. Laissons la relation s'approfondir davantage."
 cc.ward_no_longer.c: "Refuser. L'arrangement actuel nous sert encore."
 cc.ward_no_longer.c_demand_release: "Accepter la demande. Les libérer."
 cc.ward_no_longer.c_demand_refuse: "Refuser absolument. Nous ne nous laisserons pas dicter notre conduite."
 cc.ward_no_longer.d_honor: "Les libérer avec tous les honneurs. Que l'histoire s'en souvienne."
 cc.ward_no_longer.d_embarrass: "Les libérer. L'arrangement est terminé."

 # cc.221 — An Emboldened Ward
 cc.emboldened_ward.title: "Un pupille enhardi"
 cc.emboldened_ward.desc: "La nouvelle arrive que [ward.GetName] a outrepassé ses droits. Leurs fonctionnaires se sont engagés dans un échange hostile avec [rival.GetName] — accusations, exigences et provocations qui ont laissé la cour du voisin furieuse.\n\nL'affaire nous revient. [rival.GetName] ne l'oubliera pas. La manière dont nous répondrons définira notre réputation et la nature de notre protection."
 cc.emboldened_ward.a: "Dépêcher des envoyés. Nous allons régler cela discrètement."
 cc.emboldened_ward.a_master: "Une médiation magistrale — notre ministre transforme l'incident en une démonstration de notre autorité calme."
 cc.emboldened_ward.a_peace: "Une résolution discrète — notre conseiller trouve un terrain d'entente avant que l'affaire ne s'envenime."
 cc.emboldened_ward.b: "Restez ferme. Nous soutenons pleinement notre protégé."
 cc.emboldened_ward.c: "Reculer. Ce n'est pas notre combat."

 # cc.222 — The Rival Makes Their Move
 cc.rival_moves.title: "Le rival passe à l'action"
 cc.rival_moves.desc: "[rival.GetName] a perdu patience. Plutôt que d'accepter l'affront, ils ont déclaré la guerre à [ward.GetName]. Notre protégé est attaqué, et le monde regarde.\n\nNous les avons soutenus. Nous devons décider ce que ce soutien vaut réellement."
 cc.rival_moves.b1: "Nous combattons. Déclarons la guerre à [rival.GetName] pour défendre notre protégé."
 cc.rival_moves.b1_force: "Démonstration de force. Notre armée fera un exemple de cette agression."
 cc.rival_moves.b1_sacred: "Devoir sacré. Nous nous joignons à eux en tant que défenseurs de la foi."
 cc.rival_moves.b2: "Nous ne pouvons nous engager dans cette guerre. Abandonnons le protectorat."

 # cc.223 — Ward Abandoned to Their Fate
 cc.ward_abandoned.title: "Pupille abandonné à son sort"
 cc.ward_abandoned.desc: "[rival.GetName] a déclaré la guerre à [ward.GetName]. Nous avons reculé, et le monde l'a remarqué. Notre protectorat fait face à cela seul.\n\nLa nouvelle se répandra."
 cc.ward_abandoned.a: "Une journée difficile. Espérons que les conséquences soient limitées."

 # cc.224 — The Ward's Own Ambitions
 cc.ward_ambitions.title: "Les propres ambitions du pupille"
 cc.ward_ambitions.desc: "[ward.GetName] est devenu une puissance significative. Leur domaine s'est étendu, leur trésor est plein et leur peuple a développé une fierté qui ne cadre plus tout à fait avec l'ancien arrangement informel.\n\nLeur envoyé arrive — non pas avec des requêtes, mais avec des exigences. Ils veulent une relation définie. Selon leurs termes."
 cc.ward_ambitions.a: "Leur accorder le statut d'État client. Reconnaître leur croissance."
 cc.ward_ambitions.b: "Proposer plutôt un statut de vassal. Ils auront une définition, mais selon nos conditions."
 cc.ward_ambitions.b_minister: "Un arrangement subtil — notre ministre s'assure qu'ils perçoivent le lien plus étroit comme une récompense."
 cc.ward_ambitions.c: "Refuser la requête. Ils sont sous notre tutelle, et cela suffit."
 cc.ward_ambitions.c_war: "On leur a trop souvent opposé un refus. Désormais, ils prennent leur liberté par la force."

 # cc.225 — The Faith Grows Cold
 cc.faith_cold.title: "La foi s'essouffle"
 cc.faith_cold.desc: "Une lettre arrive de [ward.GetName]. Le ton est formel, mais le message est sans équivoque — le lien spirituel qui nous unit s'est distendu. Notre négligence envers nos devoirs religieux n'est pas passée inaperçue.\n\n« Nous sommes venus à vous avec foi », dit la lettre. « Nous demandons maintenant à être libérés, pour trouver notre propre voie. »"
 cc.faith_cold.a: "Les libérer. Leur foi mérite une meilleure gestion que celle que nous avons offerte."
 cc.faith_cold.b: "Renouveler notre engagement. Nous ne laisserons pas le lien s'étioler."
 cc.faith_cold.c: "Refuser. L'arrangement se poursuit."
 cc.faith_cold.c_zealot: "Le devoir sacré ne peut être abandonné. Nous tenons bon."
 cc.faith_cold.e: "Une résolution diplomatique — notre ministre trouve des termes qui satisfont sans exiger de sacrifice."
 cc.faith_cold.c_war: "On leur a trop souvent refusé. Le lien se brise dans le feu."

 # cc.226 — Patron of the Faith
 cc.patron_faith.title: "Patron de la Foi"
 cc.patron_faith.desc: "La nouvelle s'est répandue dans les cours de la chrétienté et au-delà — notre intendance de [ward_a.GetName] et [ward_b.GetName] n'est pas passée inaperçue. Détenir non pas un, mais deux pupilles sacrés, maintenir la foi des peuples protégés à travers les tourmentes de ce siècle, est une chose qui témoigne d'une volonté et d'un pouvoir.\n\nOn nous appelle le Patron de la Foi."
 cc.patron_faith.a: "Accepter le titre. Nous sommes ce qu'ils disent que nous sommes."
 cc.patron_faith.a_zealot: "Champion de la Foi. Nous sommes plus qu'un protecteur — nous en sommes l'épée."
 cc.patron_faith.b: "Rester humble. Le travail importe plus que le titre."
 cc.patron_faith.c: "Utilisons cette reconnaissance avec sagesse. Le prestige est une monnaie en soi."

