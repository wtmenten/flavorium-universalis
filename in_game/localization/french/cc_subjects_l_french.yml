l_french:


 # ============================================================
 # SUBJECT TYPE UI KEYS (LEAD_/AM_/CANCEL_)
 # ============================================================
 junior_partner: "Partenaire junior"
 LEAD_junior_partner: "Gouverneur principal"
 AM_junior_partner: "Partenaire junior"
 CANCEL_junior_partnerTITLE: "Dissoudre l'union royale"
 CANCEL_junior_partner_DESC: "Mettre fin à l'union royale, rompant le lien dynastique entre nos cours et rétablissant la pleine indépendance du royaume partenaire."

 LEAD_lesser_partner: "Gouverneur principal"
 AM_lesser_partner: "Partenaire mineur"
 CANCEL_lesser_partnerTITLE: "Dissoudre le partenariat mineur"
 CANCEL_lesser_partner_DESC: "Dissoudre le partenariat mineur, rendant au royaume partenaire sa politique étrangère indépendante. L'intégration économique profonde des cinquante dernières années ne peut être facilement annulée."

 LEAD_shadow_state: "Patron de l'ombre"
 AM_shadow_state: "État fantoche"
 CANCEL_shadow_stateTITLE: "Retirer la suzeraineté occulte"
 CANCEL_shadow_state_DESC: "Rompéz discrètement la suzeraineté secrète, libérant l'État fantôme de ses obligations conventionnelles et mettant fin à notre influence informelle sur leurs affaires."

 LEAD_puppet_state: "Suzerain"
 AM_puppet_state: "État vassal"
 CANCEL_puppet_stateTITLE: "Libérer l'État fantoche"
 CANCEL_puppet_state_DESC: "Accorder l'indépendance à l'État fantoche, en retirant la supervision administrative directe. Le royaume reprend le contrôle de sa propre politique étrangère."

 LEAD_elite_enclave: "Patron"
 AM_elite_enclave: "Enclave d'élite"
 CANCEL_elite_enclaveTITLE: "Révocations de la charte d'enclave"
 CANCEL_elite_enclave_DESC: "Révoquer la charte de l'enclave culturelle, mettant fin à l'autonomie formelle et à l'arrangement de patronage noble. Les maisons nobles n'oublieront pas cet affront."

 LEAD_palatinate: "Suzerain"
 AM_palatinate: "Palatinat"
 CANCEL_palatinateTITLE: "Dissoudre le palatinat"
 CANCEL_palatinate_DESC: "Dissoudre le palatinat, dépouillant le comte palatin de son autorité souveraine et mettant fin à l'un des partenariats culturels les plus prestigieux de notre royaume."

 LEAD_associated_republic: "Patron"
 AM_associated_republic: "République associée"
 CANCEL_associated_republicTITLE: "Mettre fin à l'association républicaine"
 CANCEL_associated_republic_DESC: "Se retirer de l'accord de patronage, mettant fin à l'échange savant et à l'association formelle avec la république."

 LEAD_chartered_company: "Couronne octroyante"
 AM_chartered_company: "Compagnie à charte"
 CANCEL_chartered_companyTITLE: "Révocation de la charte commerciale"
 CANCEL_chartered_company_DESC: "Révoquer la charte commerciale royale, dissolvant le statut juridique de la compagnie en tant que bras de la couronne. Les États marchands s'y opposeront vigoureusement."

 LEAD_artists_commune: "Patron"
 AM_artists_commune: "Commune d'artistes"
 CANCEL_artists_communeTITLE: "Dissoudre la commune des artistes"
 CANCEL_artists_commune_DESC: "Retirer la charte de la commune, mettant fin à l'arrangement de patronage formel et dispersant les artistes qui s'étaient rassemblés sous notre protection."

 LEAD_scientific_college: "Patron"
 AM_scientific_college: "Collège scientifique"
 CANCEL_scientific_collegeTITLE: "Dissoudre le concordat savant"
 CANCEL_scientific_college_DESC: "Mettre fin au concordat savant, rompant la relation formelle entre notre couronne et la confrérie des lettrés. Il faudra des années pour reconstruire les liens de recherche."

 LEAD_naval_administration: "Couronne"
 AM_naval_administration: "Administration navale"
 CANCEL_naval_administrationTITLE: "Révocation de la charte navale"
 CANCEL_naval_administration_DESC: "Révoquer la charte navale, mettant fin au statut administratif semi-indépendant de la ville portuaire. Les contributions des marins à notre flotte cesseront."

 LEAD_protectorate: "Protecteur"
 AM_protectorate: "Protectorat"
 CANCEL_protectorateTITLE: "Mettre fin au protectorat"
 CANCEL_protectorate_DESC: "Retirer notre protection formelle, laissant le protectorat gérer sa propre sécurité. La projection de puissance et la réputation diplomatique que nous avons acquises s'estomperont."

 LEAD_crown_dependency: "Couronne"
 AM_crown_dependency: "Dépendance de la Couronne"
 CANCEL_crown_dependencyTITLE: "Libérer la dépendance de la Couronne"
 CANCEL_crown_dependency_DESC: "Mettre fin à l'arrangement de gouvernance dynastique, rompant le règne familial partagé et libérant la dépendance pour qu'elle gère ses propres affaires."

 LEAD_holy_protectorate: "Protecteur saint"
 AM_holy_protectorate: "Protectorat saint"
 CANCEL_holy_protectorateTITLE: "Retirer la protection sainte"
 CANCEL_holy_protectorate_DESC: "Retirer notre patronage spirituel, libérant l'État coreligionnaire de son statut protégé. Notre position parmi les fidèles souffrira de cet abandon."

 # ============================================================
 # SUBJECT TYPE DESCRIPTIONS
 # ============================================================
 junior_partner_desc: "Un $junior_partner$ conserve son propre souverain et mène une politique étrangère indépendante, tout en reconnaissant la prééminence de son suzerain. Les deux royaumes bénéficient d'une propagation plus rapide des institutions et d'un renforcement mutuel de la légitimité. La création d'un $junior_partner$ nécessite l'avancée $royal_union_network_advance$ et un fief existant pouvant être amélioré."
 junior_partner_tt: "Impossible d'améliorer pour le moment — la relation actuelle avec le sujet doit se stabiliser avant qu'un nouvel arrangement puisse être proposé."

 lesser_partner: "Partenaire mineur"
 lesser_partner_desc: "Un $lesser_partner$ est l'évolution d'un $junior_partner$ après cinquante ans de dynastie partagée. La politique étrangère indépendante du royaume est restreinte, mais l'intégration économique s'approfondit — le tribut augmente considérablement tandis que les deux cours deviennent plus stables et légitimes."
 lesser_partner_upgrade_tt: "Impossible d'améliorer pour le moment — le lien d'union nécessite cinquante ans de maturation pour devenir un Partenariat mineur."

 shadow_state: "État fantoche"
 shadow_state_desc: "Un $shadow_state$ est formellement indépendant, lié uniquement par un traité secret et des arrangements discrets. Le suzerain exerce son influence sans annexion, gagnant en projection de puissance tandis que le sujet bénéficie de stabilité et de légitimité. Cette relation ne peut être établie que par traité avec une nation indépendante existante. Nécessite l'avancée $shadow_diplomacy_advance$."

 cc_force_shadow_state: "Exiger une suzeraineté occulte"
 cc_force_shadow_state_entry: "Exiger une suzeraineté occulte"
 cc_force_shadow_state_entry_short: "Exiger une suzeraineté occulte"
 cc_force_shadow_state_desc: "Contraindre la nation vaincue à accepter une suzeraineté secrète — reconnaissant votre domination par un traité secret plutôt que par une subjugation publique. La relation projettera votre puissance sans tout l'antagonisme d'une conquête pure et simple. Nécessite l'avancée Diplomatie de l'ombre."

 client_state: "État client"
 client_state_desc: "Un $client_state$ est une nation placée dans l'orbite d'une puissance plus forte par traité ou via des provinces libérées. Elle conserve sa propre politique étrangère mais verse un tribut modeste et peut éventuellement être élevée au rang de $puppet_state$. Nécessite l'avancée $client_state_advance$."

 puppet_state: "État vassal"
 puppet_state_desc: "Un $puppet_state$ est une nation autrefois indépendante placée sous la supervision administrative complète de son suzerain. Sa politique étrangère est contrôlée, son trésor dirigé et ses armées mobilisées à volonté. Les sujets de type $shadow_state$ et $client_state$ peuvent être élevés à ce statut après cinquante ans. Nécessite l'avancée $puppet_state_advance$."
 puppet_state_upgrade_tt: "Impossible d'améliorer pour le moment — l'assujettissement actuel est trop récent pour permettre une consolidation supplémentaire du contrôle."

 elite_enclave: "Enclave d'élite"
 elite_enclave_desc: "Une $elite_enclave$ est un domaine culturellement apparenté auquel l'autonomie a été accordée en reconnaissance de son héritage noble. Elle ne participe pas aux guerres, mais confère un prestige culturel remarquable — augmentant l'influence culturelle, la tradition culturelle et la satisfaction de l'état noble. Limité à un seul sujet de ce type. Nécessite l'avancée $noble_patronage_advance$ et le privilège d'état Droits de l'enclave noble."

 palatinate: "Palatinat"
 palatinate_desc: "Un $palatinate$ est une $elite_enclave$ devenue une puissance semi-souveraine. Le comte palatin peut désormais déclarer la guerre, lever des troupes et rejoindre des campagnes. Les bénéfices culturels et de prestige pour le suzerain sont considérables. Ne peut être créé qu'en améliorant une $elite_enclave$ après vingt ans. Nécessite l'avancée $palatinate_advance$."
 palatinate_upgrade_tt: "Impossible d'améliorer pour le moment — l'enclave doit mûrir pendant vingt ans avant d'être élevée au rang de Palatinat."

 associated_republic: "République associée"
 associated_republic_desc: "Une $associated_republic$ est un État républicain indépendant sous patronage formel. Les deux parties conservent leur indépendance politique, mais le sujet s'en remet à son patron lors des guerres défensives, et les deux bénéficient d'un échange savant qui accélère la recherche. Le sujet doit avoir un type de gouvernement républicain. Nécessite l'avancée $republican_patronage_advance$."

 chartered_company: "Compagnie à charte"
 chartered_company_desc: "Une $chartered_company$ est une société commerciale à charte royale opérant dans des terres lointaines pour le compte de son suzerain. Elle verse un tribut élevé en or, en main-d'œuvre et en marins, tout en augmentant la puissance du centre commercial et la vitesse de recherche. Les sujets doivent se trouver sur un sous-continent différent de celui de la capitale du suzerain. Nécessite l'avancée $chartered_company_advance$, la réforme du Système de charte coloniale et une bureaucratie active du Bureau royal du commerce."

 artists_commune: "Commune d'artistes"
 artists_commune_desc: "Une $artists_commune$ est une communauté autogérée de peintres, sculpteurs et artisans dont les œuvres contribuent à la gloire de leur mécène. Bien qu'elle ne rapporte que peu d'or, elle offre des dividendes spectaculaires en influence culturelle et en vitesse de recherche. Elle doit partager le groupe culturel du suzerain, est limitée à une seule province, et un seul exemplaire peut exister. Nécessite l'avancée $artistic_patronage_advance$."

 scientific_college: "Collège scientifique"
 scientific_college_desc: "Un $scientific_college$ est une institution savante d'une entité politique gouvernée religieusement, libre de poursuivre le savoir pour le compte de son patron. Ses bénéfices — propagation plus rapide des institutions, réduction des coûts d'adoption, meilleure résistance aux maladies — profitent aux deux parties. Le sujet doit être une théocratie, et un seul peut exister. Nécessite l'avancée $scholarly_orders_advance$ et le privilège d'état du clergé de la Confrérie savante."

 naval_administration: "Administration navale"
 naval_administration_desc: "Une $naval_administration$ est une ville portuaire dotée d'une semi-indépendance pour gérer la logistique maritime de la flotte de son patron. Elle verse une proportion exceptionnellement élevée de marins, en plus de l'or et de la main-d'œuvre. Elle doit partager le groupe culturel du suzerain, et une seule peut exister. Nécessite l'avancée $naval_charter_advance$ et le privilège d'état bourgeois de la Charte navale."

 protectorate: "Protectorat"
 protectorate_desc: "Un $protectorate$ est un État voisin plus faible sous la protection d'une puissance plus forte sans assujettissement formel. Il ne verse aucun tribut et mène ses propres guerres, mais reconnaît la supériorité du patron. Le suzerain gagne en projection de puissance et en réputation diplomatique, et prive ses rivaux de ce territoire. Nécessite l'avancée $protectorate_rights_advance$."

 crown_dependency: "Dépendance de la Couronne"
 crown_dependency_desc: "Une $crown_dependency$ est un royaume lié à son suzerain par des liens dynastiques partagés, où la même famille régnante gouverne les deux cours sans union personnelle formelle. La dépendance verse un tribut considérable et rejoint les guerres de son patron, tandis que les deux parties bénéficient d'un prestige et d'une légitimité accrus. Nécessite l'avancée $dynastic_governance_advance$ et une famille régnante commune."

 holy_protectorate: "Protectorat saint"
 holy_protectorate_desc: "Un $holy_protectorate$ est un État coreligionnaire placé sous le patronage spirituel d'une puissance plus importante. Il ne verse aucun tribut en or mais apporte au suzerain de l'influence religieuse, de la projection de puissance et du prestige. Les deux parties rejoignent toujours les guerres défensives de l'autre. Le sujet doit partager le groupe religieux du suzerain. Nécessite l'avancée $holy_patronage_advance$."


 royal_union_network_advance: "Réseau d'union royal"
 royal_union_network_advance_desc: "Les unions personnelles ne doivent pas être de simples héritages passifs. En cultivant un réseau de liens dynastiques et d'institutions partagées, l'union peut devenir un instrument politique vivant. Débloque les types de sujets $junior_partner$ et $lesser_partner$."

 shadow_diplomacy_advance: "Diplomatie de l'ombre"
 shadow_diplomacy_advance_desc: "Toute l'influence ne s'affiche pas. Par des traités secrets et le placement discret d'agents de confiance, un monarque peut lier un État voisin à ses intérêts sans qu'une seule armée ne bouge. Débloque le type de sujet $shadow_state$ et le privilège d'état noble Réseau d'ombre."

 artistic_patronage_advance: "Mécénat artistique"
 artistic_patronage_advance_desc: "Commander de grandes œuvres d'art, c'est laisser sa marque dans le temps lui-même. Un souverain qui ouvre son trésor aux peintres, aux poètes et aux architectes accumule un capital culturel qui survit à toute campagne militaire. Débloque le type de sujet $artists_commune$ et le privilège d'état noble Patronage des Arts."

 noble_patronage_advance: "Patronage noble"
 noble_patronage_advance_desc: "Un souverain sage reconnaît que la haute noblesse, si on lui accorde une autonomie honorifique, rendra la loyauté plutôt que le ressentiment. La reconnaissance formelle des enclaves nobles transforme des rivaux potentiels en champions culturels. Débloque le type de sujet $elite_enclave$ et le privilège d'état Droits des Enclaves Nobles."

 republican_patronage_advance: "Patronage républicain"
 republican_patronage_advance_desc: "Les républiques possèdent un génie pratique que les monarchies feraient bien de cultiver. Par un patronage formel, un roi peut s'assurer la production intellectuelle d'une république libre sans menacer son identité. Débloque le type de sujet $associated_republic$."

 dynastic_governance_advance: "Gouvernance dynastique"
 dynastic_governance_advance_desc: "Le réseau de mariages royaux liant les cours européennes n'a pas vocation à rester purement cérémoniel. Avec une conception minutieuse, une dynastie commune peut devenir le cadre d'une véritable coordination politique. Débloque le type de sujet $crown_dependency$."

 client_state_advance: "Diplomatie des États clients"
 client_state_advance_desc: "En offrant sa protection en échange d'un tribut, une grande puissance peut étendre son influence sur les territoires voisins sans les frais d'une conquête pure et simple. Les relations de clientélisme sont le moteur de l'expansion hégémonique. Débloque le type de sujet $client_state$."

 naval_charter_advance: "Charte navale"
 naval_charter_advance_desc: "Une grande flotte nécessite non seulement des navires mais aussi des infrastructures : des docks, des réseaux de ravitaillement et une expertise marchande. L'octroi d'un statut administratif spécial à un port stratégique garantit que ces besoins soient toujours satisfaits. Débloque le type de sujet $naval_administration$ et le privilège d'état bourgeois de la Charte Navale."

 protectorate_rights_advance: "Droits du protectorat"
 protectorate_rights_advance_desc: "Le droit des gens permet à une puissance forte de se déclarer protectrice d'un voisin plus faible, lui offrant un bouclier sans exiger de soumission formelle. De tels arrangements sont moins coûteux à établir que le vassalage. Débloque le type de sujet $protectorate$."

 scholarly_orders_advance: "Ordres savants"
 scholarly_orders_advance_desc: "Les grands ordres religieux ont longtemps été les gardiens du savoir. En formalisant la relation entre la couronne et le cloître, un souverain peut exploiter les connaissances accumulées par l'Église. Débloque le type de sujet $scientific_college$ et le privilège d'état du clergé Fraternité Érudite."

 palatinate_advance: "Système du Palatinat"
 palatinate_advance_desc: "Les enclaves nobles les plus élevées peuvent être reconnues comme des palatinats, des territoires souverains au sein d'un souverain dont les comtes exercent une autorité quasi royale. Une telle reconnaissance renforce le lien culturel et militaire entre le palatinat et son suzerain. Débloque l'amélioration $palatinate$ pour les sujets de type $elite_enclave$."

 holy_patronage_advance: "Patronage saint"
 holy_patronage_advance_desc: "La foi est un lien plus fort que tout traité. Un souverain qui se place comme le gardien de voisins coreligionnaires s'assure non seulement d'alliés, mais aussi d'un flux de prestige spirituel émanant de chaque communion partagée. Débloque le type de sujet $holy_protectorate$."

 puppet_state_advance: "Administration de l'État vassal"
 puppet_state_advance_desc: "L'influence occulte doit finir par céder la place à une administration directe. Avec des mécanismes bureaucratiques appropriés, un suzerain peut transformer un client faiblement lié ou un état fantoche en une marionnette dont les affaires sont dirigées depuis la capitale du suzerain. Débloque l'amélioration $puppet_state$ pour les sujets $shadow_state$ et $client_state$."

 chartered_company_advance: "Compagnies commerciales à charte"
 chartered_company_advance_desc: "Les classes marchandes ont fait preuve d'une capacité inégalée à organiser le commerce à l'échelle mondiale. En délivrant des chartes royales, une couronne peut diriger cette énergie vers des continents lointains, assurant ainsi tributs et commerce. Débloque le type de sujet $chartered_company$, le privilège d'état bourgeois Charte commerciale royale et la réforme Système de charte coloniale."


 ep_noble_elite_enclave: "Droits d'enclave noble"
 ep_noble_elite_enclave_desc: "La couronne reconnaît formellement le droit de la haute noblesse d'une culture apparentée à gouverner des enclaves comme des domaines auto-administrés, transformant le ressentiment noble en prestige culturel pour la dynastie."

 ep_noble_patronage_arts: "Mécénat Artistique"
 ep_noble_patronage_arts_desc: "La noblesse assume un rôle formel de mécène pour les peintres, sculpteurs et poètes, associant son prestige à l'épanouissement culturel du royaume."

 ep_noble_shadow_network: "Réseau de l'ombre"
 ep_noble_shadow_network_desc: "La haute noblesse établit un réseau clandestin d'informateurs et d'intermédiaires dans les États voisins, projetant la puissance du royaume par procuration plutôt que par des armées."

 ep_clergy_scholarly_college: "Fraternité savante"
 ep_clergy_scholarly_college_desc: "Le clergé établit une confrérie formelle dédiée à la préservation et à l'avancement du savoir, accordant aux érudits des ordres religieux une liberté académique en échange de contributions intellectuelles bénéficiant au royaume."

 ep_burgher_naval_charter: "Charte navale"
 ep_burgher_naval_charter_desc: "La classe marchande assume la responsabilité formelle de l'approvisionnement et de l'administration des infrastructures navales du royaume, en échange de privilèges spéciaux sur des villes portuaires désignées."

 ep_burgher_royal_charter: "Charte royale du commerce"
 ep_burgher_royal_charter_desc: "La couronne accorde aux domaines marchands le droit d'organiser des corporations commerciales sous charte royale, permettant des opérations commerciales dans des terres lointaines sous la protection de l'autorité de la couronne."


 cc_shadow_court_bureau: "Cour de l'ombre"
 cc_shadow_court_bureau_desc: "Une institution clandestine par laquelle sont gérés les intérêts diplomatiques secrets du royaume — des agents placés dans les cours étrangères, des communications maintenues avec des États de l'ombre et une influence bâtie loin des registres publics. La Cour des Ombres amplifie la projection de puissance et la réputation diplomatique, mais la négligence engendre l'agitation parmi les états nobles."

 cc_royal_trading_bureau: "Bureau royal du commerce"
 cc_royal_trading_bureau_desc: "Un organisme gouvernemental formel supervisant les entreprises commerciales à charte du royaume à l'étranger. Le Bureau coordonne les licences, la résolution des litiges et le flux de biens tributaires vers la couronne. Lorsqu'il est bien entretenu, il génère des revenus fiscaux significatifs et étend la capacité maritime."

 cc_scholarly_concordat: "Concordat savant"
 cc_scholarly_concordat_desc: "Un accord formel entre la couronne et le clergé établissant les conditions dans lesquelles les institutions savantes peuvent fonctionner — recherches menées, institutions adoptées et connaissances médicales appliquées au profit du royaume. Produit une croissance institutionnelle plus rapide et une résistance aux maladies lorsqu'il est correctement financé."

 cc_colonial_charter_reform: "Système de chartes coloniales"
 cc_colonial_charter_reform_desc: "La couronne établit un cadre juridique formel pour l'émission de chartes royales aux entreprises commerciales opérant dans des terres lointaines, leur accordant une autorité militaire et commerciale en échange d'un tribut et de leur loyauté. Cette réforme permet la création de sujets sous forme de compagnies à charte."

 cc_internalized_scholarship: "Érudition intériorisée"
 cc_internalized_scholarship_desc: "Plutôt que d'établir un collège externe, le royaume a orienté son propre clergé vers des recherches savantes plus approfondies."

 cc_scholarly_exchange_modifier: "Échange savant"
 cc_scholarly_exchange_modifier_desc: "Un échange formel de connaissances entre le royaume et son Collège Scientifique enrichit les deux parties grâce aux progrès de l'apprentissage et de la médecine."

 cc_thriving_port_modifier: "Port naval prospère"
 cc_thriving_port_modifier_desc: "L'investissement dans les installations de l'Administration Navale a permis d'étendre les infrastructures maritimes, augmentant ainsi la capacité de marins du royaume."

 cc_holy_league_modifier: "Ligue sainte"
 cc_holy_league_modifier_desc: "L'établissement formel d'une Ligue Sainte entre le royaume et son protectorat coreligionnaire a généré une vague d'enthousiasme religieux et de prestige."

 cc_scholastic_disputation: "Disputation scolastique"
 cc_scholastic_disputation_desc: "Une dispute théologique célèbre à notre Collège Scientifique a aiguisé les esprits à travers le royaume, faisant progresser le savoir et favorisant la tolérance envers les échanges d'un débat raisonné."
 cc_theological_condemnation: "Condamnation théologique"
 cc_theological_condemnation_desc: "Une doctrine audacieuse avancée par notre collège a été condamnée. Le climat de suspicion qui en a résulté a refroidi la recherche, érodé l'autorité de l'Église et engendré l'intolérance dans tout le royaume."
 cc_reformed_scholarship: "Érudition réformée"
 cc_reformed_scholarship_desc: "Notre académie réformée se place à l'avant-garde de la théologie scolastique, attirant des savants de toute la chrétienté et accélérant la diffusion du savoir et des nouvelles institutions."


 cc.shadow.1.title: "Murmures dans la Cour"
 cc.shadow.1.desc: "Des rumeurs circulent parmi la haute noblesse concernant des arrangements clandestins avec les cours voisines. Nos nobles les plus fidèles parlent d'un réseau déjà à moitié formé — des agents infiltrés dans les conseils étrangers, une correspondance circulant par des canaux secrets, une influence s'étendant là où nos armées ne peuvent marcher.\n\n« Donnez-lui votre bénédiction, mon seigneur », insistent-ils, « et nous jetterons notre ombre sur leurs domaines. »"
 cc.shadow.1.a: "Formaliser le réseau d'ombre."
 cc.shadow.1.b: "Refuser. De tels arrangements invitent au scandale."

 cc.shadow.2.title: "Le réseau prend forme"
 cc.shadow.2.desc: "Le réseau d'ombre a prouvé sa valeur. Nos nobles proposent désormais de formaliser cet arrangement en une institution permanente — une Cour d'Ombre qui opère aux marges de la diplomatie officielle.\n\nLes bénéfices seraient considérables. Les coûts seraient supportés par d'autres."
 cc.shadow.2.a: "Établir le Bureau de la Cour des Ombres."
 cc.shadow.2.b: "Laisser le réseau informel — le déni plausible a son utilité."

 cc.shadow.bureau.1.title: "Une marionnette proposée"
 cc.shadow.bureau.1.desc: "Notre Cour de l'Ombre a identifié une opportunité. Grâce à des pressions discrètes, des crises de succession orchestrées et le retrait silencieux de mécènes concurrents, l'un de nos États de l'ombre est devenu entièrement dépendant de notre bonne volonté. Le Bureau propose de formaliser cette dépendance.\n\nLa cible ne résistera pas. Elle n'a personne d'autre vers qui se tourner."
 cc.shadow.bureau.1.a: "Formaliser l'accord de vassalité."
 cc.shadow.bureau.1.b: "Maintenir la relation occulte — la discrétion est toujours préférable."

 cc.clergy.college.1.title: "Les savants cherchent un foyer"
 cc.clergy.college.1.desc: "La nouvelle nous parvient d'un rassemblement de membres du clergé érudits — astronomes, médecins, philosophes naturels — qui ont dépassé les capacités des institutions à leur disposition. Ils cherchent un foyer où le savoir puisse s'épanouir, libéré des obligations paroissiales.\n\nLe clergé a inspecté notre royaume et propose plusieurs sièges parmi notre peuple où un collège théocratique autonome pourrait être doté — lié à notre royaume, mais libre de poursuivre la connaissance comme les frères le jugent bon. Un siège plus modeste se verrait accorder des droits urbains pour les loger convenablement.\n\nLequel allons-nous doter ?"
 cc.clergy.college.1.opt1: "Doter le collège de [college_loc_1.GetName]."
 cc.clergy.college.1.opt2: "Doter le collège de [college_loc_2.GetName]."
 cc.clergy.college.1.opt3: "Doter le collège de [college_loc_3.GetName]."
 cc.clergy.college.1.b: "Encourager les savants à rester au sein de nos propres institutions."

 cc.clergy.college.2.title: "La confrérie des savants"
 cc.clergy.college.2.desc: "Le collège savant s'est établi et sa réputation grandit déjà. En reconnaissance du mécénat qui l'a rendu possible, les frères ont proposé de partager leurs découvertes avec notre cour — un échange formel qui promet d'accélérer considérablement notre développement intellectuel."
 cc.clergy.college.2.a: "Acceptez formellement l'échange savant."
 cc.clergy.college.2.b: "Les remercier pour l'offre mais décliner tout arrangement formel."

 cc.college.1.title: "La Grande Disputation"
 cc.college.1.desc: "Les maîtres de notre Collège Scientifique ont organisé une grande dispute — un concours formel de théologie et de philosophie naturelle qui a attiré des hommes savants de toutes les contrées. Les salles résonnent d'arguments sur la nature des cieux, de l'âme et de la lecture appropriée des écritures.\n\nUn tel rassemblement pourrait donner lieu à un traité copié pendant des générations — mais seulement si la couronne est prête à financer le travail des savants."
 cc.college.1.a: "Parrainez généreusement la dispute."
 cc.college.1.b: "Laissez les collèges débattre à leurs propres frais."

 cc.college.2.title: "Une doctrine remise en question"
 cc.college.2.desc: "Un brillant jeune érudit du collège a avancé une nouvelle doctrine audacieuse — une doctrine qui concilie la philosophie ancienne et la vérité révélée d'une manière jamais tentée auparavant. Pour certains, c'est une intuition profonde ; pour d'autres, une hérésie dangereuse.\n\nLe collège se tourne vers nous. Soutenons-nous cette doctrine devant le monde savant, ou la supprimons-nous avant qu'elle ne se propage ?"
 cc.college.2.a: "Défendre la doctrine."
 cc.college.2.b: "Réprimer et réaffirmer l'orthodoxie."

 cc.college.3.title: "La synthèse savante"
 cc.college.3.desc: "Des années d'études patientes au collège ont produit une grande synthèse — un corps de connaissances unifié reliant la théologie, la médecine et les sciences naturelles. Les frères demandent comment nous souhaitons que ce savoir soit utilisé.\n\nDoit-il être diffusé librement, propageant de nouvelles institutions à travers le royaume et au-delà — ou rester au sein de l'église, tel un trésor pour le cloître ?"
 cc.college.3.a: "Disséminer largement la synthèse."
 cc.college.3.b: "Gardez cela au sein de l'église."

 cc.college.4.title: "L'Académie réformée"
 cc.college.4.desc: "Notre collège est devenu un centre célébré de l'érudition réformée. Là où les scolastiques de l'ancienne église dominaient autrefois, nos théologiens dirigent désormais les disputations de la chrétienté, mariant une méthode rigoureuse aux convictions de la Réforme.\n\nLes savants affluent à nos portes. Avec la faveur de la couronne, l'académie pourrait devenir un phare pour tout le monde protestant."
 cc.college.4.a: "Adopter l'académie réformée."
 cc.college.4.b: "Le doter généreusement à partir du trésor."

 cc.arts.1.title: "La Pétition des Maîtres de Guilde"
 cc.arts.1.desc: "Les maîtres des guildes de nos plus grandes villes se sont présentés à la cour avec une pétition inhabituelle. Ils parlent d'un district entièrement dédié aux arts — exempté des taxes ordinaires des guildes, gouverné par son propre conseil et consacré à la production d'œuvres qui porteront le nom de notre dynastie pendant des siècles. Ils ont cité plusieurs de nos propres villes, riches en artisans, où une telle commune pourrait prospérer.\n\n« Accordez-nous une charte », dit leur porte-parole, « et nous rendrons votre nom éternel. »"
 cc.arts.1.opt1: "Octroyer la charte de la commune à [commune_loc_1.GetName]."
 cc.arts.1.opt2: "Octroyer la charte de la commune à [commune_loc_2.GetName]."
 cc.arts.1.opt3: "Octroyer la charte de la commune à [commune_loc_3.GetName]."
 cc.arts.1.b: "Pas maintenant. Gardons les maîtres de guilde entre nos murs pour l'instant."
 cc.arts.1.b.tt: "Ne pas octroyer de commune pour l'instant. Le privilège demeure ; le choix pourra vous être proposé plus tard."

 cc.arts.2.title: "Une ville de culture"
 cc.arts.2.desc: "La Commune des artistes s'est établie et les premières œuvres produites sous sa bannière ont suscité une admiration considérable. Les maîtres de guilde proposent un investissement inaugural — des fonds pour construire des studios appropriés, des ateliers et une bibliothèque digne de l'entreprise.\n\n« Le rendement dépassera de loin la mise », promettent-ils."
 cc.arts.2.a: "Investir dans les installations de la commune."
 cc.arts.2.b: "Qu'ils se développent à leur propre rythme."

 cc.naval.1.title: "La pétition de l'Amirauté"
 cc.naval.1.desc: "Nos États marchands ont soumis une pétition formelle. Ils soutiennent que les ambitions navales croissantes du royaume nécessitent une administration portuaire dédiée, et ils ont une ville candidate en tête. En échange d'une charte de semi-indépendance, ils promettent un flux constant de marins formés pour notre flotte."
 cc.naval.1.a: "Accorder la charte navale. Établir l'Administration Navale."
 cc.naval.1.b: "Décliner pour le moment. L'arrangement nécessite plus de réflexion."

 cc.naval.2.title: "Le port prospère"
 cc.naval.2.desc: "L'administration navale a fait ses preuves. Les navires sont bien ravitaillés, les équipages sont formés et l'afflux de marins vers notre flotte a été constant. Les administrateurs proposent désormais une expansion : une nouvelle cale sèche, des entrepôts agrandis et des terrains d'entraînement améliorés.\n\n« L'investissement sera rentabilisé en dix ans », insiste le capitaine de port."
 cc.naval.2.a: "Financer l'expansion."
 cc.naval.2.b: "Les installations actuelles sont suffisantes."

 cc.holy.1.title: "Des coreligionnaires cherchent refuge"
 cc.holy.1.desc: "Une nouvelle nous parvient par un messager essoufflé : un État voisin de notre foi, affaibli par des luttes internes et pressé par des voisins hostiles, sollicite notre protection. Leur clergé écrit sur un ton désespéré, invoquant notre foi commune et le devoir des forts de protéger les faibles.\n\nLes avantages stratégiques ne sont pas négligeables. Le prestige spirituel ne l'est pas non plus."
 cc.holy.1.a: "Offrir notre protection. Les prendre sous protectorat saint."
 cc.holy.1.b: "Nous ne pouvons nous engager dans des complications étrangères pour le moment."

 cc.111.title: "Le protectorat revendique les fruits de la guerre sainte"
 cc.111.desc: "Nos armées reviennent de la guerre sainte, et avec elles arrive une pétition de [ward.GetName]. Leur clergé s'exprime en termes mesurés mais sans équivoque : la guerre a été menée au nom de la foi partagée, et les territoires conquis près de leurs frontières sont, à leurs yeux, le fruit légitime de cette lutte. Ils n'ont pas exigé — pas encore. Mais l'attente pèse dans la salle comme une épée dégainée.\n\nCéder la terre, c'est honorer le lien. La garder, c'est tester la solidité de ce lien."
 cc.111.a: "Octroyer à [ward.GetName] les territoires conquis près de leurs frontières. La foi s'intensifie lorsque les fidèles possèdent ce qu'ils défendent."
 cc.111.b: "Ces terres ont été conquises par nos armées et resteront les nôtres. Notre protectorat acceptera la victoire — et notre jugement."

 cc.noble.enclave.1.title: "Un siège pour la noblesse"
 cc.noble.enclave.1.desc: "Maintenant que les droits d'enclave noble ont été accordés, la haute noblesse nous presse de reconnaître l'un de nos domaines urbains comme une enclave autonome — un siège au patrimoine ancestral où les grandes maisons peuvent gouverner les leurs. Leurs intendants ont inspecté notre royaume et proposent plusieurs candidats dignes parmi les villes de notre peuple.\n\nQuel siège allons-nous élever en enclave noble — ou allons-nous encore les faire patienter ?"
 cc.noble.enclave.1.opt1: "Établir l'enclave à [enclave_loc_1.GetName]."
 cc.noble.enclave.1.opt2: "Établir l'enclave à [enclave_loc_2.GetName]."
 cc.noble.enclave.1.opt3: "Établir l'enclave à [enclave_loc_3.GetName]."
 cc.noble.enclave.1.b: "Pas encore. La noblesse peut attendre notre bon vouloir."
 cc.noble.enclave.1.b.tt: "Ne fonder aucune enclave pour le moment. Le privilège demeure ; le choix pourra vous être proposé à nouveau."

 cc.burgher.charter.1.title: "La charte royale scellée"
 cc.burgher.charter.1.desc: "Les états marchands ont reçu la charte royale avec célébration et cérémonie. Des agents sont déjà dépêchés vers des continents lointains, les investissements affluent et les premiers rapports sur les comptoirs lointains commencent à arriver à la cour. Les bourgeois considèrent cela comme une nouvelle ère de partenariat commercial avec la couronne."
 cc.burgher.charter.1.a: "Un arrangement profitable pour toutes les parties."
 cc.burgher.charter.1.a.tt: "Permet la création de sujets de type Compagnie à charte sur des sous-continents lointains."

 # ============================================================
 # MILITARY ACADEMY — Subject type, advance, privilege
 # ============================================================
 military_academy: "Académie militaire"
 LEAD_military_academy: "Patron"
 AM_military_academy: "Académie militaire"
 CANCEL_military_academyTITLE: "Dissoudre l'académie militaire"
 CANCEL_military_academy_DESC: "Retirer la charte de l'académie, dispersant le corps des officiers et mettant fin à l'arrangement de formation formelle. La tradition militaire du royaume souffrira de cette perte."

 military_academy_desc: "Une $military_academy$ est une institution noble dédiée à la formation formelle d'officiers issus de la culture du suzerain. Elle ne participe à aucune guerre mais fournit un flux constant de commandants disciplinés, améliorant l'efficacité militaire globale du royaume. Limitée à une seule province, et une seule peut exister. Nécessite l'avancée $military_academy_advance$ et le privilège d'état noble de la Charte de l'académie militaire."

 military_academy_advance: "Académie militaire"
 military_academy_advance_desc: "L'apprentissage informel des chevaliers et des capitaines a laissé place à l'étude organisée de la stratégie, de la logistique et de l'art de la guerre. En établissant une académie formelle au sein d'une enclave noble, la couronne transforme l'énergie militaire de la haute noblesse en excellence institutionnelle. Débloque le type de sujet $military_academy$ et le privilège d'état noble Charte de l'Académie Militaire."

 ep_nobles_academy_charter: "Charte de l'académie militaire"
 ep_nobles_academy_charter_desc: "Les nobles assument formellement la responsabilité de doter et de superviser une académie militaire dédiée, formant des officiers issus de la culture du royaume à l'art de la guerre en échange de la reconnaissance de leur héritage martial."

 crown_dependency_conversion_tt: "Aucune dépendance de la Couronne n'a été organisée au cours des 25 dernières années"

 # ============================================================
 # MILITARY ACADEMY EVENTS (cc.190–cc.193)
 # ============================================================
 cc.academy.0.title: "La charte de l'Académie a été accordée"
 cc.academy.0.desc: "Nos États nobles ont accueilli la charte de l'Académie Militaire avec un grand enthousiasme. Les meilleurs descendants de familles chevaleresques se rassemblent déjà dans la province désignée, impatients de démontrer que l'ère de la guerre indisciplinée est révolue. L'instruction formalisée en tactique, logistique et art du commandement commence immédiatement."
 cc.academy.0.a: "Un début prometteur."

 cc.academy.1.title: "Revue du corps des officiers"
 cc.academy.1.desc: "L'académie a préparé sa dernière promotion pour l'inspection royale. Les jeunes officiers se tiennent en formation précise — commandants de cavalerie, capitaines d'infanterie, ingénieurs de siège — et leur porte-parole s'avance avec une pétition. Ils ont prouvé leur discipline ; ils souhaitent désormais prouver leur valeur au service d'une cause concrète.\n\n« Accordez-nous une province à défendre, mon seigneur, et nous en ferons une forteresse. »"
 cc.academy.1.a: "Promettre des récompenses territoriales aux officiers les plus distingués."
 cc.academy.1.b: "Honorez la revue, mais sans prendre d'engagements."

 cc.academy.2.title: "Exercices militaires"
 cc.academy.2.desc: "Le commandant de l'académie demande la permission d'effectuer des manœuvres à grande échelle — des formations d'infanterie s'exerçant les unes contre les autres sur un terrain simulé, la cavalerie pratiquant des charges coordonnées et les ingénieurs d'artillerie calculant des trajectoires. Le coût des munitions, du fourrage et des fortifications de campagne n'est pas négligeable.\n\nLe bénéfice pour la cohésion et le moral de notre armée pourrait être considérable."
 cc.academy.2.a: "Financer l'intégralité des exercices."
 cc.academy.2.b: "Observez les exercices sans les parrainer."

 cc.academy.3.title: "Murmures à la Cour"
 cc.academy.3.desc: "Des rumeurs inquiétantes sont venues à nos oreilles : certains officiers nobles de l'académie se réuniraient en privé, leurs conversations étant prudentes et leurs regards calculateurs. Certains disent qu'ils discutent des listes de promotion ; d'autres soupçonnent des ambitions plus grandioses.\n\nUne enquête confidentielle pourrait clarifier les choses — ou nous exposer à des accusations de méfiance envers la classe même que nous avons cultivée."
 cc.academy.3.a: "Enquêtez discrètement sur les rumeurs."
 cc.academy.3.b: "Ignorer les rumeurs. On ne fait pas confiance sans prendre de risques."

 # ============================================================
 # ELITE ENCLAVE EVENTS (cc.160, cc.162, cc.163, cc.164, cc.194)
 # ============================================================
 cc.enclave.court.title: "Les nobles se disputent les postes à la cour"
 cc.enclave.court.desc: "L'enclave est devenue un centre de vie sociale noble, et avec elle est venue une concurrence féroce pour les postes limités que notre cour peut offrir — officiers de maison, chambellans, maîtres de cérémonie. La haute noblesse réclame des nominations, sachant bien qu'un poste à la cour lie une famille noble à la couronne bien plus que n'importe quel serment seul.\n\nNous pouvons utiliser cet appétit."
 cc.enclave.court.a: "Accorder des postes à la cour aux principales familles nobles."
 cc.enclave.court.c: "Affectez-les à un grand rassemblement de cavalerie — qu'ils entraînent les chevaux du royaume."
 cc.enclave.court.b: "Maintenir les postes sous nomination royale directe — éviter la capture de notre cour par la noblesse."

 cc.enclave.patronage.title: "Le mécénat culturel du seigneur de l'enclave"
 cc.enclave.patronage.desc: "Les maîtres de l'enclave se sont lancés dans une œuvre ambitieuse — une grande salle, un cycle de fresques, une bibliothèque capable de rivaliser avec n'importe laquelle du royaume — et ils sont venus nous demander notre patronage. La noblesse de l'enclave s'enorgueillit de sa culture autant que de son lignage, et une main généreuse ici sera longtemps mémorisée.\n\nOu nous pourrions simplement attirer les meilleurs de leurs talents vers notre propre capitale."
 cc.enclave.patronage.a: "Financer les travaux. Que la gloire de l'enclave rejaillisse sur la couronne."
 cc.enclave.patronage.b: "Convoquez plutôt leurs meilleurs éléments à notre capitale. Leurs dons appartiennent au centre."

 cc.enclave.tournament.title: "Le Grand Tournoi"
 cc.enclave.tournament.desc: "L'enclave propose d'organiser un grand tournoi — un rassemblement de la noblesse montée du royaume pour tester la lance et le sabre, pour honorer la couronne, et pour régler dans un combat amical l'éternelle question de savoir laquelle des grandes maisons aligne les meilleurs chevaliers. Un tel spectacle perfectionne la cavalerie qui fait la fierté de notre noblesse, et un véritable champion pourrait en émerger pour mener nos armées.\n\nLe coût des prix et des pavillons ne serait pas minime."
 cc.enclave.tournament.a: "Organisez-la avec splendeur. Que nos chevaliers prouvent leur valeur — et nous trouvent un champion."
 cc.enclave.tournament.b: "Refuser. Nous n'avons pas de pièces à dépenser en apparat noble."

 cc.enclave.feud.title: "Une querelle noble"
 cc.enclave.feud.desc: "Deux des maisons dirigeantes de l'enclave sont tombées dans une querelle amère. Ce qui n'était au départ qu'un différend sur la préséance et le mariage s'est transformé en hostilité ouverte, les serviteurs se battant dans les rues et chaque camp nous appelant à prendre parti. Laissée à couver, une telle querelle peut empoisonner la loyauté de toute la noblesse ; gérée avec finesse, c'est l'occasion de jouer les arbitres et de lier les deux maisons à notre jugement.\n\nNous pourrions intervenir — ou les laisser s'épuiser."
 cc.enclave.feud.a: "Médiatiser le litige. Dépensez le nécessaire pour négocier une paix durable."
 cc.enclave.feud.b: "Qu'ils règlent cela entre eux. L'honneur trouvera son propre équilibre."

 cc.enclave.established.title: "L'enclave est établie"
 cc.enclave.established.desc: "Pour la première fois, un domaine de culture partagée et d'héritage ancien se gouverne lui-même en tant qu'enclave reconnue sous notre protection — son conseil est installé, ses traditions sécurisées, sa loyauté jurée. La haute noblesse observe avec une satisfaction tranquille, et le royaume gagne un joyau de culture et de prestige.\n\nComment marquerons-nous l'occasion ?"
 cc.enclave.established.a: "Une investiture grandiose — queé aucune dépense ne soit épargnée pour honorer la nouvelle enclave."
 cc.enclave.established.b: "Une reconnaissance discrète — la dignité n'a pas besoin d'extravagance."

 # ============================================================
 # HOLY PROTECTORATE EVENTS (cc.195–cc.196)
 # ============================================================
 cc.holy_prot.1.title: "La foi menacée"
 cc.holy_prot.1.desc: "Notre protectorat sacré [ward.getName] est en danger. Des puissances voisines — hostiles à la foi commune qui nous unit — ont pressé ses frontières, harcelé son clergé et attisé l'hérésie parmi sa population. Nos frères nous écrivent en termes urgents, invoquant notre promesse de protection.\n\nAgir est coûteux. Les abandonner serait être perçu comme un protecteur sans foi."
 cc.holy_prot.1.a: "Dépêcher des forces et des ressources pour défendre nos coreligionnaires."
 cc.holy_prot.1.b: "Offrir des prières et une censure diplomatique, mais aucun engagement matériel."
 cc.holy_prot.1.c: "Le temps de la défense est révolu. Lancez une guerre sainte contre [threat.GetName]."

 cc.holy_prot.frontier.title: "Voix par-delà la frontière"
 cc.holy_prot.frontier.desc: "Les frontières de notre protectorat saint [ward.GetName] sont animées par le mouvement de la foi. Les voisins coreligionnaires nous regardent avec un espoir prudent, tandis que les seigneurs d'autres croyances observent depuis l'autre côté de la frontière avec une méfiance qui pourrait se transformer en hostilité — ou s'adoucir pour devenir un accommodement.\n\nLa manière dont nous gérons ces relations frontalières façonnera le climat spirituel de toute la région."
 cc.holy_prot.frontier.a: "Dépêcher des envoyés auprès de nos voisins coreligionnaires. Qu'ils sachent qu'ils ne sont pas seuls dans leur foi."
 cc.holy_prot.frontier.b: "Ouvrir la frontière au discours religieux. La compréhension peut bâtir ce que la foi seule ne peut accomplir."
 cc.holy_prot.frontier.c: "Fortifier la frontière des fidèles. Les voisins païens doivent savoir où nous en sommes."
 cc.holy_prot.frontier.d: "Ce sont là des affaires frontalières propres au protégé. Qu'il gère ses voisins."

 # ============================================================
 # HOLY PROTECTORATE PERIODIC EVENTS (cc.229–cc.231)
 # ============================================================
 cc.holy_prot.papacy.title: "Le Saint-Siège Prend Note"
 cc.holy_prot.papacy.desc: "La nouvelle est parvenue à Rome. Les représentants du Pape ont fait part de sa connaissance de notre protectorat sacré sur [ward.GetName] — un arrangement qui témoigne de notre piété et de notre engagement envers la foi. Le Saint-Siège n'est pas inactif dans son attention, et nous pouvons façonner ce qui en découlera.\n\nC'est un moment de diplomatie pastorale. Ce que nous en ferons définira notre relation avec l'autorité suprême de l'Église."
 cc.holy_prot.papacy.a: "Invoquer la protection papale pour notre pupille. Que le Saint-Siège les protège formellement."
 cc.holy_prot.papacy.b: "Demander l'envoi d'un légat du pape — un clerc érudit de Rome pour servir dans nos terres."
 cc.holy_prot.papacy.c: "Acceptez la reconnaissance avec gratitude. L'attention du Pape est en soi une bénédiction."

 cc.holy_prot.shepherd.title: "Un berger pour le troupeau"
 cc.holy_prot.shepherd.desc: "Notre protectorat sacré [ward.GetName] a besoin de conseils spirituels ou martiaux. Qu'il s'agisse d'une question de foi nécessitant des mains fermes pour l'entretenir, ou d'une défense des frontières exigeant un commandement expérimenté, le besoin est réel.\n\nNous sommes bien positionnés pour aider — ou pour en profiter. Le choix dépendra de ce que nous valorisons le plus."
 cc.holy_prot.shepherd.a: "Dépêcher notre conseiller savant pour guider le clergé du pupille. La foi vaut bien ce sacrifice."
 cc.holy_prot.shepherd.b: "Réaffecter le commandant du district pour servir dans nos campagnes. Leurs talents sont gaspillés là-bas."
 cc.holy_prot.shepherd.c: "Financer la formation d'un nouveau théologien pour le pupille. Notre trésor peut le supporter."
 cc.holy_prot.shepherd.d: "La vie spirituelle du pupille lui appartient. Nous n'interviendrons pas."

 cc.holy_prot.preacher.title: "Le prédicateur errant"
 cc.holy_prot.preacher.desc: "Un prédicateur charismatique est apparu dans les territoires de notre protectorat sacré [ward.GetName], attirant des foules immenses avec des sermons d'une ferveur inhabituelle. Il parle de renouveau, de l'expansion de la foi, d'un appel divin à l'action auquel la piété ordinaire est devenue trop confortable pour répondre.\n\nSes paroles agitent la population. Que ce feu brûle pour le meilleur ou pour le pire dépendra en grande partie des conseils que nous lui donnerons."
 cc.holy_prot.preacher.a: "Soutenir le prédicateur et l'envoyer en mission. Que son zèle s'étende au-delà des frontières du district."
 cc.holy_prot.preacher.b: "Orienter les fidèles du prédicateur vers notre propre mission frontalière. Leur énergie nous sera utile."
 cc.holy_prot.preacher.c: "Amener le prédicateur devant les autorités ecclésiastiques pour jugement. L'orthodoxie doit être préservée."
 cc.holy_prot.preacher.d: "Ignorez l'affaire. La ferveur populaire monte et redescend sans notre intervention."

 # ============================================================
 # ARTISTS' COMMUNE EVENTS (cc.197–cc.199)
 # ============================================================
 cc.artists.1.title: "La commande du Maestro"
 cc.artists.1.desc: "Un artiste renommé de la commune a proposé une commande d'une ambition extraordinaire : un cycle d'œuvres qui définira l'héritage culturel de notre dynastie pour des générations. Les matériaux seuls coûteraient une fortune, et le projet occuperait les meilleurs talents de la commune pendant des années.\n\n« Cela en vaudra la peine », promet-il, avec la confiance sereine de ceux qui dépensent l'argent des autres."
 cc.artists.1.a: "Financer la commission. Qu'ils créent quelque chose d'immortel."
 cc.artists.1.b: "Refuser. La commune peut trouver des protecteurs entre ses propres murs."

 cc.artists.2.title: "Rivalité artistique"
 cc.artists.2.desc: "Deux écoles de pensée artistique rivales ont émergé au sein de la commune, chacune prétendant représenter la véritable direction de notre mécénat. Les classicistes privilégient l'élégance étudiée ; les naturalistes exigent une représentation brute de la vie telle qu'elle est. Chaque école produit des chefs-d'œuvre. Chaque école méprise l'autre.\n\nIls nous ont soumis le litige."
 cc.artists.2.a: "Choisissez une école favorite. L'autre devra s'adapter ou partir."
 cc.artists.2.b: "Laissez la compétition suivre son cours. Les grands travaux naissent de grandes rivalités."

 cc.artists.3.title: "Exportation culturelle"
 cc.artists.3.desc: "La nouvelle de notre Commune des Artistes s'est répandue au-delà de nos frontières. Une cour étrangère a exprimé son admiration pour ses œuvres et a demandé si des exemples pouvaient être acquis ou exposés à l'étranger.\n\nLa commune est divisée : certains y voient une occasion pour le prestige du royaume de voyager plus loin que nos armées ne pourraient le porter. D'autres craignent que ce qui quitte nos frontières n'enrichisse nos rivaux autant que nous-mêmes."
 cc.artists.3.a: "Encourager l'exportation. Notre culture doit se propager librement."
 cc.artists.3.b: "Gardez les œuvres les plus fines à la maison. Le prestige culturel est une ressource à thésauriser."

 # ============================================================
 # PALATINATE EVENTS (cc.161, cc.165, cc.210, cc.211, cc.213, cc.214, cc.215)
 # ============================================================
 cc.palatinate.recognition.title: "Le Palatinat exige la reconnaissance"
 cc.palatinate.recognition.desc: "Le comte palatin a envoyé une délégation formelle. Le message est courtois mais sans équivoque : ayant servi de partenaire culturel le plus prestigieux de notre royaume pendant des années, le palatinat attend une reconnaissance formelle de son rang dynastique — la reconnaissance que la lignée du comte n'est pas simplement une maison subordonnée, mais une maison qui partage la dignité de notre dynastie.\n\nAccorder cela, c'est les lier plus étroitement. Refuser, c'est leur rappeler le gouffre qui nous sépare."
 cc.palatinate.recognition.a: "Accorder une reconnaissance dynastique formelle. Que leur dignité soit reconnue."
 cc.palatinate.recognition.b: "Refuser. La reconnaissance implique des obligations que nous ne sommes pas prêts à assumer."
 cc.palatinate.recognition.c: "Ne pouvons-nous pas trouver un terrain d'entente ?"

 cc.palatinate.dynastic.title: "Une question de dynastie"
 cc.palatinate.dynastic.desc: "Le comte palatin sollicite un lien encore plus profond — un mariage au sein de notre maison, un écartellement d'armes, une place pour sa lignée aux confins de la succession. L'accorder, c'est tisser le palatinat durablement dans la dignité de notre dynastie, un lien de prestige et de légitimité qui survivra à tout règne. Refuser, c'est blesser une maison fière et puissante.\n\nLe comte attend notre réponse, et il ne l'attend pas avec patience."
 cc.palatinate.dynastic.a: "Accorder le lien dynastique. Que son sang se mêle à l'honneur de notre maison."
 cc.palatinate.dynastic.b: "Refuser. La dignité de notre dynastie n'est pas un privilège à partager."

 cc.palatinate.tournament.title: "Le tournoi du Palatinat"
 cc.palatinate.tournament.desc: "Le comte palatin a annoncé un grand tournoi — des chevaliers de tout le royaume et d'ailleurs sont invités à concourir en notre nom, les meilleurs artisans sont chargés de décorer les pavillons, et des festins seront évoqués pendant une génération. Le comte engage ses propres chevaliers domestiques, et d'un tel tournoi pourrait émerger un commandant sans égal. Il sollicite notre présence personnelle ainsi qu'une contribution au fonds des prix.\n\nUn tel spectacle forge un prestige qui survit à n'importe quelle bataille."
 cc.palatinate.tournament.a: "Assister au tournoi et le sponsoriser généreusement."
 cc.palatinate.tournament.b: "Envoyer une délégation pour représenter la couronne."

 cc.palatinate.levy.title: "Le Palatinat répond à l'appel"
 cc.palatinate.levy.desc: "Le comte palatin propose de lever ses bannières — la levée noble complète du palatinate, des escadrons de cavalerie lourde menés par des hommes qui connaissent la selle depuis l'enfance. C'est une démonstration de loyauté formidable, et la cavalerie qu'il peut déployer renforcerait n'importe laquelle de nos armées. Pourtant, faire appel à ses gens, c'est reconnaître l'étendue de son autonomie, et le comte s'attendra à ce que ses services soient mémorisés.\n\nOu nous pourrions laisser ses chevaliers chez eux, et garder la laisse courte."
 cc.palatinate.levy.a: "Mobiliser la cavalerie noble. Que les chevaux du royaume partent à la guerre."
 cc.palatinate.levy.b: "Épargnez ses serviteurs. Nous respectons l'autonomie du comte — et gagnons sa bienveillance."

 cc.palatinate.overreach.title: "Le comte palatin outrepasse ses droits"
 cc.palatinate.overreach.desc: "On nous rapporte que le comte palatin se présente comme un prince en tout sauf nominalement — frappant sa propre monnaie, tenant une cour qui singe la nôtre, recevant des envoyés étrangers comme s'il était un souverain. C'est le danger permanent du palatinat : un honneur si grand qu'il engendre l'ambition. Certains à la cour nous pressent de le tolérer, car son prestige rejaillit sur la couronne ; d'autres exigent qu'on lui rappelle, fermement, sa place.\n\nLaissées sans contrôle, de telles prétentions sont connues pour aboutir à une guerre ouverte."
 cc.palatinate.overreach.a: "Laissez libre cours à ses prétentions. Sa grandeur est la nôtre."
 cc.palatinate.overreach.b: "Le brider. Il se rappellera qui est le maître ici."
 cc.palatinate.overreach.c: "Fermons les yeux. Laissons les choses suivre leur cours."

 cc.palatinate.neighbor.title: "Le Palatinat provoque un voisin"
 cc.palatinate.neighbor.desc: "Le comte palatin a outrepassé ses frontières avec [provoked_neighbor.GetName] — pillant leurs marches, abritant leurs hors-la-loi et proclamant d'anciennes revendications familiales sur des terres au-delà de la frontière. Leurs envoyés arrivent furieux, exigeant que nous contenions notre vassal. Mais le comte est impénitent : il soutient que l'honneur du royaume est en jeu, et qu'avec notre soutien, il pourrait les humilier totalement.\n\nUn palatinat trop puissant a tendance à faire de ses querelles les nôtres."
 cc.palatinate.neighbor.a: "Soutenir le comte. Que sa querelle avec [provoked_neighbor.GetName] devienne notre guerre."
 cc.palatinate.neighbor.b: "Le contenir. Nous ne nous laisserons pas entraîner dans une querelle frontalière."
 cc.palatinate.neighbor.c: "L'acheter. Rediriger ses énergies avant qu'elles ne nous coûtent une guerre."

 cc.palatinate.elevated.title: "L'élévation du Palatinat"
 cc.palatinate.elevated.desc: "Pour la première fois, une enclave de notre royaume a été élevée au rang de palatinat — son comte s'est vu accorder une autorité quasi royale, le droit de lever des troupes, de tenir sa propre cour et de partir à la guerre sous sa propre bannière. C'est l'honneur le plus élevé qu'un domaine noble puisse détenir, et son prestige rejaillit sur toute la dynastie. Le comte s'agenouille pour recevoir son élévation ; c'est à nous de décider avec quel éclat nous marquerons l'événement.\n\nUne cérémonie magnifique annoncerait au monde entier la dignité de notre maison."
 cc.palatinate.elevated.a: "Une élévation magnifique — et que le comte déploie ses meilleurs chevaliers en notre honneur."
 cc.palatinate.elevated.b: "Une cérémonie digne et modeste. L'honneur parle de lui-même."

 # ============================================================
 # PROTECTORATE MARCH UPGRADE EVENT (cc.212)
 # ============================================================
 cc.protectorate.march.1.title: "Un protectorat propose une allégeance formelle"
 cc.protectorate.march.1.desc: "L'envoyé du protectorat arrive avec une proposition inattendue. Au fil d'années d'intérêts partagés, la protection informelle que nous avons étendue s'est transformée en quelque chose de plus profond — un véritable alignement d'intérêts et d'identité. Leurs dirigeants proposent maintenant de transformer entièrement la relation.\n\n« Accordez-nous le statut de marche militaire », disent-ils, « et nous garderons votre frontière au prix de nos vies. »"
 cc.protectorate.march.1.a: "Acceptez. Formalisez-les en tant que Marche militaire."
 cc.protectorate.march.1.b: "Refuser. L'arrangement actuel nous sert assez bien."

 # ============================================================
 # NEW MODIFIER NAMES
 # ============================================================
 cc_academy_exercises: "Exercices militaires de l'Académie"
 cc_academy_exercises_desc: "Une série d'exercices militaires rigoureux financés par la couronne a affûté la discipline et le moral de nos forces combattantes."

 cc_court_intrigue_scandal: "Scandale d'intrigue à la cour"
 cc_court_intrigue_scandal_desc: "Une enquête sur des rumeurs à l'académie s'est mal passée — des accusations d'irrégularité ont entaché la réputation de la couronne auprès des états nobles."

 cc_enclave_court_favour: "Faveur de la noblesse à la cour"
 cc_enclave_court_favour_desc: "L'octroi de postes à la cour aux familles dirigeantes de l'enclave noble a satisfait leurs ambitions tout en les rapprochant de l'orbite de la couronne."

 cc_palatinate_tournament: "Tournoi du Palatinat"
 cc_palatinate_tournament_desc: "Un magnifique tournoi organisé sous le patronage du comte palatin et de la couronne a renforcé le prestige dynastique et l'influence culturelle à travers le royaume."

 STATIC_MODIFIER_NAME_cc_holy_protectorate_defense: "Défense sainte"
 cc_holy_protectorate_defense: "Défense sainte"
 cc_holy_protectorate_defense_desc: "La défense du protectorat sacré contre les pressions religieuses par nos forces a revigoré le moral de nos soldats et assuré la gratitude de nos coreligionnaires."
 STATIC_MODIFIER_NAME_cc_holy_prot_spiritual_neglect: "Protecteur sans foi"
 cc_holy_prot_spiritual_neglect: "Protecteur sans foi"
 cc_holy_prot_spiritual_neglect_desc: "La nouvelle s'est répandue que nous n'avons offert que des prières lorsque notre protectorat sacré a appelé à l'aide matérielle. Les fidèles questionnent notre engagement et notre autorité spirituelle s'amenuise."
 STATIC_MODIFIER_NAME_cc_holy_prot_frontier_accord: "Accord Frontalier"
 cc_holy_prot_frontier_accord: "Accord Frontalier"
 cc_holy_prot_frontier_accord_desc: "Notre volonté de dialoguer au-delà des clivages religieux au nom de notre protectorat sacré nous a valu une réputation d'homme d'État mesuré auprès des puissances voisines."
 STATIC_MODIFIER_NAME_cc_holy_prot_border_faith: "Frontière des Fidèles"
 cc_holy_prot_border_faith: "Frontière des Fidèles"
 cc_holy_prot_border_faith_desc: "La posture ferme du suzerain envers les voisins païens a renforcé les garnisons frontalières du protectorat et revigoré la foi de ses soldats."
 STATIC_MODIFIER_NAME_cc_holy_prot_papal_mandate: "Mandat papal"
 cc_holy_prot_papal_mandate: "Mandat papal"
 cc_holy_prot_papal_mandate_desc: "Le Saint-Siège a formellement reconnu le statut de cet État sous l'autorité spirituelle de son protecteur. La bénédiction du Pape a renforcé la détermination du protégé et ouvert de nouvelles âmes à la foi."
 STATIC_MODIFIER_NAME_cc_holy_prot_sponsored_scholar: "Érudit parrainé"
 cc_holy_prot_sponsored_scholar: "Érudit parrainé"
 cc_holy_prot_sponsored_scholar_desc: "Un théologien érudit, envoyé ou financé par le suzerain, a établi une école d'instruction religieuse au sein du protectorat, accélérant la conversion et insufflant une vigueur nouvelle au clergé."
 STATIC_MODIFIER_NAME_cc_holy_prot_zealous_mission: "Mission zélée"
 cc_holy_prot_zealous_mission: "Mission zélée"
 cc_holy_prot_zealous_mission_desc: "Le prédicateur errant, soutenu par le suzerain, est parti en mission au-delà des frontières du protectorat — ses sermons attirant de nouvelles âmes à la foi et apportant un prestige spirituel au territoire du protégé."

