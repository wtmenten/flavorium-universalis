 STATIC_MODIFIER_NAME_cc_diplomatic_scramble: "Course diplomatique"
 cc_diplomatic_scramble: "Course diplomatique"
 cc_diplomatic_scramble_desc: "Un incident diplomatique embarrassant a nécessité une réaction précipitée — notre réputation en a temporairement souffert alors que nous nous efforcions d'en limiter les conséquences."

 STATIC_MODIFIER_NAME_cc_righteous_intervention: "Intervention juste"
 cc_righteous_intervention: "Intervention juste"
 cc_righteous_intervention_desc: "Nos forces sont intervenues avec décision pour défendre notre protectorat. Cet acte de protection a galvanisé la discipline et le moral à travers l'armée."

 STATIC_MODIFIER_NAME_cc_smooth_integration: "Intégration harmonieuse"
 cc_smooth_integration: "Intégration harmonieuse"
 cc_smooth_integration_desc: "Une transition exceptionnellement bien gérée du protectorat au vassal a laissé le nouveau protégé avec un sentiment de partenariat plutôt que de contrainte."

 STATIC_MODIFIER_NAME_cc_magnanimous_overlord: "Suzerain magnanime"
 cc_magnanimous_overlord: "Suzerain magnanime"
 cc_magnanimous_overlord_desc: "Notre volonté de reconnaître la croissance du protégé et de lui accorder une plus grande indépendance a renforcé notre réputation de puissance juste et avant-gardiste."

 STATIC_MODIFIER_NAME_cc_patron_of_faith: "Patron de la Foi"
 cc_patron_of_faith: "Patron de la Foi"
 cc_patron_of_faith_desc: "Reconnus par les coreligionnaires comme protecteurs des fidèles, notre influence spirituelle et notre autorité en matière de religion ont considérablement augmenté."

 STATIC_MODIFIER_NAME_cc_faith_renewed: "Foi renouvelée"
 cc_faith_renewed: "Foi renouvelée"
 cc_faith_renewed_desc: "Un réengagement public envers notre protectégé sacré a revigoré notre position religieuse et a redonné du sens au lien spirituel."

 STATIC_MODIFIER_NAME_cc_recognized_partner: "Partenaire reconnu"
 cc_recognized_partner: "Partenaire reconnu"
 cc_recognized_partner_desc: "Un accord négocié par notre ministre a donné à ce vassal un sentiment de véritable partenariat — sa loyauté est ancrée dans la gratitude, et non seulement dans l'obligation."

 STATIC_MODIFIER_NAME_cc_forced_subjection: "Assujettissement forcé"
 cc_forced_subjection: "Assujettissement forcé"
 cc_forced_subjection_desc: "La transition vers le vassalage a été imposée plutôt qu'offerte. Un ressentiment couve sous la surface."

 STATIC_MODIFIER_NAME_cc_faithless_overlord_repute: "Suzerain sans foi"
 cc_faithless_overlord_repute: "Suzerain sans foi"
 cc_faithless_overlord_repute_desc: "Nous avons abandonné ceux qui comptaient sur notre protection. Cette réputation a des conséquences."

 STATIC_MODIFIER_NAME_cc_gracious_release: "Libération gracieuse"
 cc_gracious_release: "Libération gracieuse"
 cc_gracious_release_desc: "La libération digne d'un protégé a renforcé notre réputation d'homme d'État plutôt que de tyran de la dépendance."

 STATIC_MODIFIER_NAME_cc_sacred_defense: "Défense sacrée"
 cc_sacred_defense: "Défense sacrée"
 cc_sacred_defense_desc: "Notre défense d'un protectorat sacré au nom de la foi a approfondi notre influence religieuse et galvanisé les fidèles."

 STATIC_MODIFIER_NAME_cc_champion_of_faith: "Champion de la Foi"
 cc_champion_of_faith: "Champion de la Foi"
 cc_champion_of_faith_desc: "En acceptant le titre de Champion de la Foi dans son sens le plus plein, nous nous sommes engagés à défendre nos coreligionnaires avec nos armes autant qu'avec nos prières."

 STATIC_MODIFIER_NAME_cc_zealous_refusal: "Refus zélé"
 cc_zealous_refusal: "Refus zélé"
 cc_zealous_refusal_desc: "Notre refus public de libérer notre protégé sacré au motif d'une obligation sacrée a galvanisé notre position religieuse, même s'il a tendu les relations."

 STATIC_MODIFIER_NAME_cc_papal_patron: "Patron de la Foi (Papal)"
 cc_papal_patron: "Patron de la Foi (Papal)"
 cc_papal_patron_desc: "Le Saint-Père a formellement reconnu notre intendance sur les fidèles. L'approbation de Rome a du poids auprès des puissances catholiques à travers l'Europe."

 STATIC_MODIFIER_NAME_cc_faith_rift_tension: "Tensions liées au schisme religieux"
 cc_faith_rift_tension: "Tensions liées au schisme religieux"
 cc_faith_rift_tension_desc: "Le pacte spirituel qui liait autrefois cet arrangement s'est effiloché. Le protégé devient agité sous l'autorité d'un suzerain dont la foi ne reflète plus la sienne."

 # ============================================================
 # cc.220 — A Ward No Longer (Catholic flavor additions)
 # ============================================================
 cc.ward_no_longer.a.tt_papal: "Le Pape notera la dissolution de cet arrangement sacré avec déception."

 # ============================================================
 # cc.225 — The Faith Grows Cold (new Catholic option)
 # ============================================================
 cc.faith_cold.d_papal: "Solliciter une médiation papale"
 cc.faith_cold.d_papal.tt: "Le Saint-Père envoie un légat qui renouvelle le lien spirituel entre nous et notre protégé. Nous dépensons un peu de capital politique à Rome, mais l'arrangement est préservé."

 # ============================================================
 # cc.226 — Patron of the Faith (new Catholic option)
 # ============================================================
 cc.patron_faith.a_papal: "Accepter la reconnaissance papale"
 cc.patron_faith.a_papal.tt: "Le Saint-Père approuve formellement notre rôle de Protecteur de la Foi. Cette reconnaissance a du poids auprès de toutes les puissances catholiques. Nos protégés trouvent du réconfort dans la bénédiction de Rome."

 # ============================================================
 # cc.227 — A Rift in the Sacred Bond
 # ============================================================
 cc.faith_rift.title: "Une rupture du lien sacré"
 cc.faith_rift.desc: "[ward.GetName] ne partage plus notre foi. Le pacte sacré qui définissait notre arrangement de protectorat repose sur un fondement spirituel qui s'est effondré. Que ce soit nous qui nous soyons détournés des anciennes voies ou eux qui aient cherché un nouveau chemin, la contradiction ne peut être ignorée indéfiniment."

 cc.faith_rift.a: "Exiger que [ward.GetName] revienne à la vraie foi"
 cc.faith_rift.a.tt: "Nous précisons que cet arrangement requiert une foi commune. Le pupille ne prendra pas cela à la légère."
 cc.faith_rift.a_zealot: "Les exigences de la foi ne permettent aucun compromis"
 cc.faith_rift.a_zealot.tt: "Un zélateur ne tolère aucune déviation spirituelle. Nous adressons l'ultimatum avec tout le poids de notre conviction."
 cc.faith_rift.b: "Libérer [ward.GetName] — le pacte sacré a touché à sa fin"
 cc.faith_rift.b.tt: "Mieux vaut reconnaître la vérité franchement que de perpétuer un arrangement vide."
 cc.faith_rift.c: "Maintenir l'arrangement malgré le rift"
 cc.faith_rift.c.tt: "L'utilité politique l'emporte pour l'instant sur la pureté spirituelle. Le pupille n'oubliera pas cette contradiction."
 cc.faith_rift.c_master: "Négocier une exception formelle"
 cc.faith_rift.c_master.tt: "Notre ministre trouve un arrangement permettant de sauver la face. Le protégé accepte, pour l'instant, bien que la tension demeure."
 cc.faith_rift.d_papal: "Soumettre l'affaire au Saint-Père"
 cc.faith_rift.d_papal.tt: "Nous consultons Rome plutôt que d'agir unilatéralement. Le Pape est ravi d'être impliqué et exerce une pression spirituelle sur le protégé pour qu'il se reconvertisse."

 # ============================================================
 # cc.228 — The Ward Seeks Their Own Path
 # ============================================================
 cc.faith_rift_escalate.title: "Le pupille cherche sa propre voie"
 cc.faith_rift_escalate.desc: "[ward.GetName] s'est longtemps impatienté face à l'ultimatum de reconversion. La loyauté étant à son point le plus bas, ils exigent désormais ouvertement l'indépendance — citant la rupture du pacte spirituel comme motif pour dissoudre l'arrangement. Le faux-semblant d'un pacte sacré ne peut plus être maintenu."

 cc.faith_rift_escalate.a: "Accorder l'indépendance à [ward.GetName]"
 cc.faith_rift_escalate.a.tt: "Acceptez l'inévitable. Libérez-les avant qu'ils ne s'en emparent par la force."
 cc.faith_rift_escalate.b: "Nous ne céderons pas ce qui nous appartient"
 cc.faith_rift_escalate.b.tt: "Refuser absolument. Le protectorat déclare son indépendance et entre en guerre. S'ils sont catholiques et que nous ne le sommes pas, Rome pourrait bien prendre leur parti."

 # ============================================================
 # New bias localization
 # ============================================================
 cc_papal_patron_recognition: "Approbation papale"
 cc_papal_patron_recognition_desc: "Le Saint-Père a formellement reconnu ce souverain comme un Protecteur de la Foi — une reconnaissance prestigieuse qui a du poids dans les cours catholiques."

 cc_papal_mediation_called: "Faveur papale dépensée"
 cc_papal_mediation_called_desc: "Nous avons appelé Rome à arbitrer une crise avec notre pupille sacré. Le Pape est heureux d'aider, mais une telle bonne volonté n'est pas infinie."

 # ============================================================
 # CROSS-REALM SUBJECT INTERACTIONS (cc.236 college, cc.240 commune)
 # ============================================================
 cc.college.exchange.title: "Une correspondance de savants"
 cc.college.exchange.desc: "La nouvelle nous parvient que les maîtres de notre Collège Scientifique ont entamé une correspondance avec leurs homologues de [cc_rival_overlord.GetName] — un collège étranger de renommée comparable. Lettres, traités et rumeurs de découvertes contestées font la navette à travers la frontière.\n\nUn tel contact entre maisons savantes peut mûrir en un échange fructueux qui honore les deux couronnes — ou s'envenimer en une rivalité jalouse, où des maîtres sont débauchés et des réputations contestées. Comment devons-nous guider nos savants ?"
 cc.college.exchange.a: "Favoriser les échanges — parrainer une dispute commune."
 cc.college.exchange.b: "Pressons-les pour éclipser [cc_rival_overlord.GetName] et débaucher ses maîtres."
 cc.college.exchange.c: "Rester à l'écart — laissons les savants correspondre comme bon leur semble."

 cc.commune.exchange.title: "Une confluence d'artistes"
 cc.commune.exchange.desc: "Notre Commune des Artistes est tombée dans l'orbite d'une commune sœur à [cc_rival_overlord.GetName], dont les peintres et sculpteurs sont évoqués avec une admiration égale. Des apprentis voyagent entre les deux ; les mécènes des deux camps surveillent la comparaison avec attention.\n\nUne exposition commune pourrait couronner les deux écoles de gloire — ou nous pourrions opposer nos maîtres aux leurs, en débauchant leurs meilleurs talents au prix d'une amère inimitié. Quelle est notre volonté ?"
 cc.commune.exchange.a: "Organisez une exposition commune célébrant les deux écoles."
 cc.commune.exchange.b: "Opposons nos maîtres aux leurs — attirons leurs talents."
 cc.commune.exchange.c: "Rester à l'écart — laissons les artistes s'organiser entre eux."

 cc.annex.resist.title: "Résistance à l'intégration"
 cc.annex.resist.desc: "Notre tentative d'absorber ce royaume purement et simplement s'est heurtée à une résistance discrète mais opiniâtre. Leurs conseils tergiversent, leurs notables se refroidissent et les liens de loyauté qu'exige l'intégration refusent de s'établir. Nous pouvons renoncer et les laisser conserver leur statut distinct, ou insister — à un certain prix — pour forcer l'union."
 cc.annex.resist.a: "Respecter leur autonomie — laisser l'intégration de côté pour le moment."
 cc.annex.resist.b: "Racheter les récalcitrants — dépenser de l'or pour forcer l'intégration."
 cc.annex.resist.c: "S'appuyer sur le poids dynastique — dépenser du prestige pour forcer l'intégration."

