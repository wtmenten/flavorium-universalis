l_french:
 # ============================================================
 # FEUDAL COURT TRAITS (Age 1)
 # ============================================================

 seneschal: "Sénéchal"
 desc_seneschal: "Le sénéchal est la main droite du seigneur — gardien de la maison, gestionnaire du domaine et administrateur de tout ce dont la couronne a besoin pour fonctionner. Sous sa gestion prudente, les dépenses de la cour sont réduites et la bonne volonté des nobles est cultivée."
 seneschal_die_desc: "[CHARACTER.GetName] est décédé(e). Les comptes domestiques devront être audités avant que l'on puisse savoir avec certitude ce qui a été tenu en ordre et ce qui a été gardé secret."

 court_chaplain: "Aumônier de cour"
 desc_court_chaplain: "Le confesseur et conseiller spirituel de la cour, toujours aux côtés du souverain. Le clergé se tourne vers lui pour obtenir des conseils et du patronage ; la cour le consulte pour l'onction de Dieu. Son influence ne s'arrête pas à la fin des réunions du cabinet."
 court_chaplain_die_desc: "[CHARACTER.GetName] est décédé(e). Les bougies seront allumées et les prières dites — et un nouveau confesseur sera trouvé. Mais l'intimité du conseil spirituel prend des années à se reconstruire."

 marshal_of_the_court: "Maréchal de la Cour"
 desc_marshal_of_the_court: "Le commandant de la suite militaire domestique, le Maréchal, s'assure que la cavalerie du seigneur est bien montée, bien entraînée et prête à monter. Sous son commandement, les forces montées coûtent moins cher à lever et sont plus performantes sur le terrain."
 marshal_of_the_court_die_desc: "[CHARACTER.GetName] est décédé(e). Les formations de cavalerie que [CHARACTER.GetSheHe] a exercées garderont leur discipline pour une saison. Après cela, quelqu'un d'autre devra reprendre l'étendard."

 master_of_coin: "Maître de la Monnaie"
 desc_master_of_coin: "Le gestionnaire du trésor de la cour féodale — souvent un marchand italien, toujours un comptable rigoureux. Le Maître de la Monnaie oriente le flux du commerce à l'avantage de la couronne et maintient la guilde des marchands bien disposée envers les projets du souverain."
 master_of_coin_die_desc: "[CHARACTER.GetName] est décédé(e). Les registres que [CHARACTER.GetSheHe] tenait sont méticuleux. Quant à savoir si [CHARACTER.GetHerHis] successeur peut les lire, c'est une autre question."

 herald_of_arms: "Héraut d'armes"
 desc_herald_of_arms: "Le héraut est la voix de la cour dans le monde au-delà de ses murs — portant des messages entre princes, gérant le protocole et maintenant la fiction délicate selon laquelle la diplomatie est supérieure aux intérêts. Sous sa direction, la réputation diplomatique du royaume est soigneusement entretenue."
 herald_of_arms_die_desc: "[CHARACTER.GetName] est décédé(e). Les liens que [CHARACTER.GetSheHe] a entretenus pendant des années de correspondance minutieuse ne survivront pas sans attention. Quelqu'un doit reprendre la correspondance."

 court_astrologer: "Astrologue de cour"
 desc_court_astrologer: "L'astrologue se tient à l'intersection du savoir et de l'autorité spirituelle — consulté pour les dates favorables, les présages significatifs et les questions d'importance céleste. Son influence sur le climat intellectuel de la cour est discrète mais persistante."
 court_astrologer_die_desc: "[CHARACTER.GetName] est décédé(e). Les cartes et les calculs que [CHARACTER.GetSheHe] a laissés seront étudiés pendant des années — bien qu'ils soient interprétés, comme toujours, selon les besoins de celui qui les lit."

 # ============================================================
 # FEUDAL COURT EVENTS (cc_feudal namespace)
 # ============================================================

 cc_feudal.1.title: "Un serviteur de la cour trouve sa vocation"
 cc_feudal.1.desc: "Un ministre à la cour a commencé à se distinguer dans un domaine particulier. Ses instincts et ses aptitudes deviennent clairs. Nous pouvons souhaiter reconnaître — et orienter — son rôle émergent."
 cc_feudal.1.a: "Nommez-le comme [ShowTraitName('seneschal')] — laissez-le gérer la maison."
 cc_feudal.1.b: "Confiez-leur des fonctions pastorales — faites d'eux un [ShowTraitName('court_chaplain')]."
 cc_feudal.1.c: "Confiez-leur le commandement de la cavalerie de la cour — [ShowTraitName('marshal_of_the_court')]."
 cc_feudal.1.d: "Les affecter au trésor — [ShowTraitName('master_of_coin')]."
 cc_feudal.1.e: "Les envoyer en tant que notre [ShowTraitName('herald_of_arms')] — la voix de la cour auprès des cours lointaines."
 cc_feudal.1.f: "Qu'ils étudient les cieux — [ShowTraitName('court_astrologer')]."

 cc_feudal.10.title: "L'ancienne cour s'efface"
 cc_feudal.10.desc: "L'ère de la cour féodale s'achève. Les nouveaux savoirs, le nouveau commerce et les nouvelles attentes ont commencé à remodeler les exigences de la gouvernance. Un ministre de la vieille école se trouve à la croisée des chemins : s'adapter à la nouvelle ère ou s'en tenir à ce qu'il connaît."
 cc_feudal.10.a: "Qu'ils adoptent les nouveaux savoirs — un nouveau rôle pour une ère nouvelle."
 cc_feudal.10.b: "Ils serviront comme ils ont toujours servi — mais la cour ne les attendra pas."

 cc_feudal.2.title: "Festin ou jeûne ?"
 cc_feudal.2.desc: "Le trésor étant plein et les récoltes abondantes, les nobles sont fébriles d'impatience. Un grand banquet a été proposé — une occasion de générosité et d'apparat. Le trésor ne souffrirait pas si nous refusions, mais la bonne volonté des nobles pourrait en pâtir."
 cc_feudal.2.a: "Ouvrir les cuisines et les caves à vin — la cour festoyera."
 cc_feudal.2.b: "Le royaume a de meilleurs usages pour cet or — nous jeûnons."

 cc_feudal.3.title: "Le confesseur du Roi"
 cc_feudal.3.desc: "L'aumônier de la cour a sollicité une audience privée. Il parle de devoir, de foi, du poids spirituel des décisions de la couronne — et, avec une délicatesse prudente, de la guerre à venir. Laisserons-nous la foi guider notre main, ou tracerons-nous notre propre voie ?"
 cc_feudal.3.a: "Suivre le conseil de l'aumônier — laisser la foi s'exprimer ici."
 cc_feudal.3.b: "Les remercier pour leurs prières et garder ses propres conseils."

 cc_feudal.4.title: "Le recensement fiscal"
 cc_feudal.4.desc: "Le maître des finances a proposé un recensement formel de nos revenus provinciaux — un décompte précis de ce que le royaume produit réellement et de ce qu'il paie réellement. Cela coûterait un peu d'or pour être mené correctement, mais les résultats seraient précis."
 cc_feudal.4.a: "Financer l'étude — des comptes précis valent le coût."
 cc_feudal.4.b: "Investir les fonds dans la capitale plutôt que dans la comptabilité."

 cc_feudal.5.title: "Tournoi de la Cour"
 cc_feudal.5.desc: "Le maréchal de la cour a proposé un tournoi — trois jours de joutes, de festins et d'apparat. Les nobles sont enthousiastes ; le trésor moins. Un tournoi renforce la loyauté et le moral, mais il n'est pas bon marché."
 cc_feudal.5.a: "Organiser le tournoi — laissez la cour montrer ses couleurs."
 cc_feudal.5.b: "Canaliser l'énergie du tournoi vers un véritable entraînement militaire."

 cc_feudal.6.title: "Un étranger érudit cherche un emploi"
 cc_feudal.6.desc: "Un érudit d'une cour lointaine est arrivé en quête d'emploi. Son savoir est authentique, même si ses méthodes sont méconnues. Une cour prudente pourrait décliner ; une cour ouverte pourrait découvrir qu'il apporte quelque chose qui nous manquait."
 cc_feudal.6.a: "Nommez l'étranger [foreigner.GetName] — le savoir n'a pas de frontières. (Les nobles ne sont pas satisfaits, mais le savant rejoint notre cour.)"
 cc_feudal.6.b: "Organisez un échange savant entre l'étranger et notre aumônier de cour. Le savoir partagé est un savoir multiplié."
 cc_feudal.6.c: "Refuser — la cour n'a pas besoin de nouveautés étrangères."

 cc_feudal.7.title: "L'appel à la guerre sainte"
 cc_feudal.7.desc: "Le haut clergé de la cour s'est levé dans la salle du trône pour faire une déclaration : la foi exige une action. Un royaume voisin d'une religion différente se trouve à notre frontière, et les soldats de Dieu ne doivent pas rester oisifs. La cour retient son souffle."
 cc_feudal.7.a: "Répondez à l'appel — laissez les armées de la foi marcher."
 cc_feudal.7.b: "Autoriser la préparation spirituelle — nous serons prêts, mais nous choisirons le moment."
 cc_feudal.7.c: "La couronne ne rend compte qu'à Dieu et à la raison. Ce n'est pas notre guerre."
