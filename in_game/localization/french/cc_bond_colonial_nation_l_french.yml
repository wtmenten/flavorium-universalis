l_french:
 # === cc_bonds.10 — The Colony's First Harvest ===
 cc_bonds.10.title: "La première récolte de la colonie"
 cc_bonds.10.desc: "Des rapports nous parviennent de [bond_subj.GetName] : la première saison complète d'administration coloniale coordonnée s'est achevée. Les colons ont produit un surplus, des routes commerciales s'établissent, et le gouverneur demande des directives sur la manière dont la Cour souhaite procéder pour les arrangements fiscaux. L'opportunité devant nous est claire — tout comme les choix qu'elle impose."
 cc_bonds.10.a: "Maximisez l'extraction. La colonie existe pour servir la Couronne."
 cc_bonds.10.b: "Investir dans les infrastructures. Une colonie prospère est plus rentable à long terme."
 cc_bonds.10.c: "Ne prendre aucun arrangement spécifique. Les laisser s'organiser comme bon leur semble."

 # === cc_bonds.11 — Colonial Conscription ===
 cc_bonds.11.title: "Conscription coloniale"
 cc_bonds.11.desc: "Nos forces sont dispersées, et les territoires coloniaux de [bond_subj.GetName] représentent un réservoir d'hommes valides. Le gouverneur a été interrogé sur la faisabilité de lever des troupes parmi la population coloniale. Sa réponse est prudente — les colons sont d'abord des colons, ensuite des soldats — mais il attend nos instructions."
 cc_bonds.11.a: "Recruter dans la levée coloniale. Nous avons besoin d'hommes."
 cc_bonds.11.b: "Engager des mercenaires à la place. Épargner les colons."
 cc_bonds.11.c: "Refuser de lever des troupes supplémentaires pour le moment."

 # === cc_bonds.12 — The Governor Reports Unrest ===
 cc_bonds.12.title: "Le gouverneur signale des troubles"
 cc_bonds.12.desc: "Une dépêche de [bond_subj.GetName] arrive avec la mention urgent. Le gouverneur écrit d'un mécontentement croissant parmi la population coloniale — des griefs sur la fiscalité, des plaintes concernant des fonctionnaires de la Cour outrepassant leurs mandats, et dans un district, un rassemblement qui ne s'est dispersé qu'à l'arrivée d'hommes armés. Il demande des directives. La situation n'est pas encore hors de contrôle, mais elle nécessite une réponse."
 cc_bonds.12.a: "Envoyer des troupes pour réprimer l'agitation. Faire un exemple."
 cc_bonds.12.b: "Enquêter sur les collecteurs d'impôts. Réformer ce qui doit l'être."
 cc_bonds.12.c: "Remplacer le gouverneur. Une nouvelle main rétablira l'ordre."
 cc_bonds.12.d: "Envoyer des cadeaux et des promesses. Gagner du temps."

 # === cc_bonds.13 — Colonial Trade Monopoly Dispute ===
 cc_bonds.13.title: "Litige sur le monopole commercial colonial"
 cc_bonds.13.desc: "Les guildes marchandes locales ont soumis une pétition demandant des droits commerciaux exclusifs avec [bond_subj.GetName]. Elles soutiennent que cela rationaliserait le commerce colonial et augmenterait les revenus de la Couronne grâce à des paiements de taxes fiables. Le gouverneur colonial a discrètement soulevé des objections — ses colons commercent librement avec les ports voisins et considèrent un monopole comme une spoliation. La décision nous revient."
 cc_bonds.13.a: "Accorder le monopole. Un commerce structuré profite à tous."
 cc_bonds.13.b: "Rejeter la pétition. Les circuits commerciaux de la colonie fonctionnent."
 cc_bonds.13.c: "Permettre à la colonie de fixer ses propres conditions commerciales. Laissez-les prospérer librement."

 # === cc_bonds.14 — The Colony Seeks a Voice ===
 cc_bonds.14.title: "La colonie cherche une voix"
 cc_bonds.14.desc: "Une délégation de [bond_subj.GetName] a parcouru un long chemin. Leur pétition est mesurée mais claire : la colonie a grandi, son peuple a bâti quelque chose de durable, et ils estiment avoir mérité d'avoir leur mot à dire sur les décisions qui régissent leur vie. Ils ne demandent pas l'indépendance. Ils demandent à être entendus. La cour observe notre réaction."
 cc_bonds.14.a: "Accorder une représentation formelle. Ils l'ont méritée."
 cc_bonds.14.b: "Offrir une reconnaissance symbolique. Un rôle consultatif, sans caractère contraignant."
 cc_bonds.14.c: "Rejeter la pétition. La Couronne parle pour tous ses territoires."

 # === cc_bonds.15 — Cultural Assimilation Pressure ===
 cc_bonds.15.title: "Pression d'assimilation culturelle"
 cc_bonds.15.desc: "Le territoire colonial de [bond_subj.GetName] a développé une identité locale distincte — ses propres festivals, ses propres tournures de phrases, ses propres jours de saints. Certains conseillers soutiennent que cet éloignement de la culture de la Couronne invite à une future déloyauté et devrait être corrigé par des mesures politiques. D'autres conseillent que tenter de remodeler les colons à notre image engendrera précisément le ressentiment que nous redoutons. Le choix nous appartient."
 cc_bonds.15.a: "Poussez pour l'intégration culturelle. Une Couronne, un peuple."
 cc_bonds.15.b: "Soutenir les coutumes locales. Leur identité fait d'eux ce qu'ils sont."
 cc_bonds.15.c: "Ne prendre aucune position sur la question."

 # === cc_bonds.16 — Colonial Militia Incident ===
 cc_bonds.16.title: "Incident impliquant la milice coloniale"
 cc_bonds.16.desc: "Un groupe armé s'est formé à [bond_subj.GetName] — des colons qui ont pris sur eux de patrouiller dans leurs propres districts, de régler leurs propres litiges et, dans plusieurs cas, de résister physiquement aux agents fiscaux de la Couronne. Le gouverneur les appelle une milice. D'autres les appellent quelque chose de pire. Quel que soit leur nom, ils représentent une résistance organisée, et l'administration coloniale ne peut fonctionner en leur présence."
 cc_bonds.16.a: "Identifiez les meneurs et faites d'eux un exemple."
 cc_bonds.16.b: "Négocier. Comprendre leurs griefs avant d'agir."
 cc_bonds.16.c: "Ordonner la dissolution immédiate de la milice."

 # === cc_bonds.200 — The Colonial Congress Convenes ===
 cc_bonds.200.title: "Le Congrès colonial se réunit"
 cc_bonds.200.desc: "La représentation que nous avons accordée à [bond_subj.GetName] il y a quelques années a dépassé le cadre cérémoniel de ses débuts. Les colons se sont organisés. Ils ont élu des délégués, rédigé un programme et convoqué un congrès avec un ordre du jour formel. Leurs demandes ne sont pas révolutionnaires — des améliorations de l'administration coloniale, des protocoles commerciaux plus clairs, un rôle consultatif dans les décisions qui les affectent directement. Mais l'appareil qu'ils ont construit pour présenter ces demandes est une nouveauté. Nous leur avons donné une voix. Ils s'en sont servis pour bâtir une chambre.\n\nLa question qui se pose à nous maintenant est de savoir si nous honorons ce que cette voix est devenue — ou si nous la corrigeons."

 cc_bonds.200.a: "Ratifier une Charte Coloniale. Ce qu'ils ont bâti mérite une reconnaissance formelle."
 cc_bonds.200.a.tooltip: "Le congrès devient une institution formelle dotée d'une légitimité durable. Le modificateur d'Ère de Légitimité Coloniale est prolongé. Gains politiques et culturels ; coût en prestige pour céder l'initiative."

 cc_bonds.200.b: "Reconnaissez le congrès sans nous y lier."
 cc_bonds.200.b.tooltip: "Le congrès est reconnu mais pas formalisé. Le pouvoir politique progresse modestement. Le souvenir de la voice_granted persiste — cette situation pourrait encore évoluer."

 cc_bonds.200.c: "Le congrès dépasse son mandat. Réduisons la représentation que nous avons accordée."
 cc_bonds.200.c.tooltip: "La chambre est dissoute avant qu'elle ne devienne un précédent. Pol et cul tombent tous deux ; le désir de liberté s'élève. La mémoire de voice_granted est effacée — l'expérience est terminée."
