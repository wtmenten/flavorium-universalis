l_french:
 # === cc_bonds.50 — The Royal Visit ===
 cc_bonds.50.title: "La visite royale"
 cc_bonds.50.desc: "Nous avons été informés que [bond_subj.GetName] s'est préparé pour une réception officielle — son peuple attend un geste de la Couronne. La maison régnante de la dépendance a laissé entendre, par des canaux diplomatiques, qu'une visite personnelle serait mémorable pour des générations. Un envoyé royal serait approprié. Une lettre formelle remplirait techniquement l'obligation. La différence est considérable."
 cc_bonds.50.a: "Faire le voyage personnellement. C'est important."
 cc_bonds.50.b: "Envoyer un envoyé royal avec le cérémonial approprié."
 cc_bonds.50.c: "Une lettre formelle fera l'affaire."

 # === cc_bonds.51 — Dependency Trade Preferences ===
 cc_bonds.51.title: "Préférences commerciales du dépendant"
 cc_bonds.51.desc: "Nos conseillers commerciaux ont attiré notre attention sur le fait que les arrangements commerciaux actuels avec [bond_subj.GetName] ne sont pas formellement définis — ils se sont développés organiquement et fonctionnent raisonnablement bien, mais ils laissent des décisions de revenus importantes en suspens. Trois options ont été élaborées. La plus profitable pour la Couronne est aussi la plus pesante pour la dépendance."
 cc_bonds.51.a: "Établir des conditions commerciales favorables pour la dépendance."
 cc_bonds.51.b: "Formaliser des termes égaux. Bénéfice mutuel, statut égal."
 cc_bonds.51.c: "Établir des conditions qui maximisent les revenus de la Couronne."

 # === cc_bonds.52 — Royal Family Ceremony ===
 cc_bonds.52.title: "Cérémonie de la famille royale"
 cc_bonds.52.desc: "Une occasion royale importante est en préparation — un anniversaire de couronnement, un baptême, un mariage ou un banquet d'État. La famille régnante de [bond_subj.GetName] a envoyé une demande discrète concernant le rôle qu'elle est censée tenir. Elle a assisté à toutes les occasions de ce genre dont on ait mémoire. Qu'ils apparaissent de manière proéminente, marginale ou pas du tout envoie un signal clair sur la façon dont nous percevons la relation."
 cc_bonds.52.a: "Incluez leur délégation de manière proéminente. Ils sont les membres de la famille en tout sauf nominalement."
 cc_bonds.52.b: "Lancer une invitation symbolique. Ils sont les bienvenus, à leur place."
 cc_bonds.52.c: "L'occasion est une affaire interne à la Couronne. Aucune invitation n'est lancée."

 # === cc_bonds.53 — Dependency Faces External Threat ===
 cc_bonds.53.title: "Le dépendant fait face à une menace externe"
 cc_bonds.53.desc: "Une dépêche de [bond_subj.GetName] apporte des nouvelles alarmantes. Une puissance voisine — ayant des ambitions territoriales de longue date dans la région — a déplacé des forces vers les frontières de la dépendance. Les propres forces de la dépendance sont limitées. Leur lettre évite de supplier, mais le message est clair : ils comptent sur nous et observent notre réaction."
 cc_bonds.53.a: "Envoyer nos forces immédiatement. Ils sont sous notre protection."
 cc_bonds.53.b: "Financer et renforcer leurs défenses sans intervention directe."
 cc_bonds.53.c: "Ils doivent gérer cela eux-mêmes. Nous avons nos propres préoccupations."

 # === cc_bonds.54 — The Dependency's Cultural Festival ===
 cc_bonds.54.title: "Le festival culturel de la dépendance"
 cc_bonds.54.desc: "Un festival culturel majeur approche à [bond_subj.GetName] — une célébration qui, selon leur tradition, marque la continuité de l'identité et de l'histoire de leur peuple. La maison régnante a envoyé une invitation. Le festival est une opportunité : être vu comme partageant leur héritage, être vu comme le respectant à distance, ou être vu comme trop occupé pour y assister."
 cc_bonds.54.a: "Parrainez généreusement le festival. Nous célébrons à leurs côtés."
 cc_bonds.54.b: "Y assister en personne sans s'approprier l'événement."
 cc_bonds.54.c: "Envoyer une lettre de félicitations et de regrets."
 cc_bonds.54.d: "Nous n'avons rien à apporter à leurs affaires locales."

 # === cc_bonds.55 — The Dependency Wants Voice in Succession ===
 cc_bonds.55.title: "La dépendance veut avoir son mot à dire sur la succession"
 cc_bonds.55.desc: "La maison régnante de [bond_subj.GetName] a soumis une pétition formelle. Ils souhaitent être consultés pour tout arrangement de succession qui les affecterait matériellement — non pas pour choisir, soulignent-ils, mais pour être entendus. Leur argument repose sur la continuité et l'intérêt mutuel. Nos conseillers sont divisés. Certains y voient une demande tout à fait raisonnable de la part d'un partenaire loyal. D'autres y voient un précédent qui, une fois établi, ne pourra être facilement annulé."
 cc_bonds.55.a: "Accorder des droits de consultation. Leur voix compte pour les questions qui les concernent."
 cc_bonds.55.b: "Proposer un rôle de conseiller. Ils pourront être entendus, bien que la décision nous revienne."
 cc_bonds.55.c: "Refuser. La succession est une prérogative de la Couronne, et non un sujet de consultation."
