l_french:
 # ============================================================
 # Balance of Power — coalition congress: parliament, laws & policies
 # ============================================================
 cc_bop_coalition_assembly: "Congrès d'équilibrage"

 # --- Defence law ---
 cc_bop_defense_law: "Défense mutuelle"
 cc_bop_defense_law_desc: "Avec quelle facilité la coalition se rallie à un membre attaqué par l'hégémon aspirant."
 cc_bop_no_defense: "Chaque État pour soi"
 cc_bop_no_defense_desc: "Les membres ne sont pas appelés aux guerres défensives les uns des autres. La coalition n'est une alliance que de nom."
 cc_bop_possible_defense: "Défense possible"
 cc_bop_possible_defense_desc: "Les membres peuvent être appelés à la guerre défensive d'un partenaire, mais ne sont pas tenus d'y répondre."
 cc_bop_mutual_defense: "Défense mutuelle"
 cc_bop_mutual_defense_desc: "Les membres sont automatiquement appelés à chaque guerre défensive de leurs partenaires, et le lien est assez fort pour renforcer la solidarité permanente de la coalition."

 # --- Offence law ---
 cc_bop_offense_law: "Doctrine stratégique"
 cc_bop_offense_law_desc: "Si la coalition peut frapper la première, de manière préemptive, contre l'aspirant."
 cc_bop_no_offense: "Posture défensive"
 cc_bop_no_offense_desc: "La coalition ne combat que lorsqu'elle est attaquée. Elle ne lancera pas une guerre de sa propre initiative."
 cc_bop_preemptive_doctrine: "Doctrine préemptive"
 cc_bop_preemptive_doctrine_desc: "Les membres peuvent être appelés à participer à la guerre offensive d'un partenaire contre l'aspirant — la base politique de la frappe préventive."

 # --- Congress powers law ---
 cc_bop_congress_powers_law: "Pouvoirs du Congrès"
 cc_bop_congress_powers_law_desc: "Si le congrès s'est voté l'appareil permanent pour l'action collective."
 cc_bop_congress_dormant: "Un concert lâche"
 cc_bop_congress_dormant_desc: "Le congrès ne se réunit que pour discuter. Il ne possède aucun pouvoir permanent propre."
 cc_bop_congress_empowered: "Un congrès responsabilisé"
 cc_bop_congress_empowered_desc: "Le congrès dispose de pouvoirs permanents — débloquant les mesures stratégiques globales de la coalition et la solidarité renforcée de ses membres."

 # --- Coup law ---
 cc_bop_coup_law: "Le coup de grâce"
 cc_bop_coup_law_desc: "Si la coalition détient un mandat permanent pour porter le coup décisif, visant à réduire à néant un aspirant vaincu."
 cc_bop_coup_restrained: "Contention"
 cc_bop_coup_restrained_desc: "La coalition ne cherchera pas la ruine du prétendant. Même ascendant, elle s'abstient d'agir."
 cc_bop_coup_de_grace: "Le coup de grâce"
 cc_bop_coup_de_grace_desc: "Un mandat permanent pour ramener le futur hégémon à sa juste taille lors d'une guerre finale et décisive. Requis avant qu'une coalition ascendante ne puisse porter le coup gagnant."

 # --- Per-voter disposition (vote-reasoning tooltip entries) ---
 CC_BOP_VOTE_OPINION_OF_HEGEMON: "Opinion de l'hégémon aspirant"
 CC_BOP_VOTE_RIVAL_HEGEMON: "Rivalité avec l'hégémon aspirant"
 CC_BOP_VOTE_KIN_HEGEMON: "Lié à l'hégémon par un mariage royal"
 CC_BOP_VOTE_BOUGHT: "Influencé par l'or de l'hégémon"
 CC_BOP_VOTE_PROXIMITY_BASE: "Le colosse approche"
 CC_BOP_VOTE_DISTANCE_FROM_HEGEMON: "Distance par rapport aux frontières de l'hégémon"
 CC_BOP_VOTE_GREAT_POWER_CAUTION: "La méfiance d'une grande puissance envers les engagements contraignants"
 CC_BOP_VOTE_SEEKS_PROTECTION: "Une puissance mineure cherche refuge"
 CC_BOP_VOTE_HAWKISH_COURT: "Une cour belliqueuse"
 CC_BOP_VOTE_RELUCTANT_COURT: "Une cour réticente, laissant libre cours"
 DIPLOMATIC_LAW_CATEGORY: "Lois diplomatiques"

 # ============================================================
 # Special statuses
 # ============================================================
 cc_bop_chief_balancer: "Équilibreur en chef"
 cc_concert_president: "Président du Concert"
 cc_concert_seat: "Membre du Concert"

 # ============================================================
 # Coalition — the Settlement law (post-victory)
 # ============================================================
 cc_bop_settlement_law: "L'établissement"
 cc_bop_settlement_law_desc: "Ce que la coalition décide de faire de sa victoire. Si le Concert doit être instauré, la loi doit être adoptée pendant que le congrès siège — et il ne deviendra une institution durable que si le bloc remporte la guerre finale."
 cc_bop_settlement_dissolution: "Dissolution"
 cc_bop_settlement_dissolution_desc: "L'alliance de circonstance se disperse une fois la paix acquise. Chaque puissance reprend sa route."
 cc_bop_enact_concert: "Instaurer le Concert de l'Europe"
 cc_bop_enact_concert_desc: "Résolution d'institutionnaliser la paix. Si la coalition remporte la guerre finale alors que cette mesure est en vigueur, les cinq plus grands vainqueurs fonderont un Concert européen permanent pour gérer les affaires du continent."

 # ============================================================
 # Coalition — parliament actions (collective consensus)
 # ============================================================
 cc_bop_pi_coalition_subsidies: "Subventions de la coalition"
 cc_bop_pi_coalition_subsidies_desc: "L'or de Pitt : les membres financent un trésor de guerre commun entre les mains du chef et les puissances mineures sont soutenues pour la campagne. Accorde +8 de Résolution et renforce les membres les plus petits."
 cc_bop_pi_no_separate_peace: "Traité de Chaumont"
 cc_bop_pi_no_separate_peace_desc: "Un engagement solennel de ne conclure aucune paix séparée lie la coalition. Accorde +12 de Résolution et stabilise chaque membre ; un déserteur subit toujours la disgrâce du défecteur."
 cc_bop_pi_combined_command: "L'armée pragmatique"
 cc_bop_pi_combined_command_desc: "Un commandement unifié pour la durée de la guerre donne au bloc tout entier un poids réel sur le terrain. Accorde +5 de Résolution et un bonus de combat à chaque membre."
 cc_bop_pi_collective_demarche: "Une démarche commune"
 cc_bop_pi_collective_demarche_desc: "Un ultimatum collectif adressé au prétendant — un reproche public qui déplace l'élan du concours vers la coalition et dégrade la position de chaque membre auprès de l'hégémon."
 cc_bop_pi_war_aims: "Le traité de partition"
 cc_bop_pi_war_aims_desc: "Les puissances s'accordent sur leurs objectifs de guerre à l'avance. La perspective de gain lie le bloc et renforce sa détermination pour le règlement des comptes. Accorde +10 de Résolution et un engagement durable à chaque membre."

 # ============================================================
 # Concert of Europe — congress & laws
 # ============================================================
 cc_concert_assembly: "Congrès des Puissances"

 cc_concert_doctrine_law: "Doctrine directrice"
 cc_concert_doctrine_law_desc: "Le principe animateur du Concert — l'esprit dans lequel les puissances gèrent la paix."
 cc_concert_balance_of_power: "Équilibre des puissances"
 cc_concert_balance_of_power_desc: "Empêcher toute puissance de dominer et maintenir le dialogue entre les puissances. L'art classique de l'État à l'époque des cabinets."
 cc_concert_principle_of_intervention: "Le principe d'intervention"
 cc_concert_principle_of_intervention_desc: "La Sainte Alliance et le Protocole de Troppau : les puissances se dressent pour la légitimité et contre la révolution, soutenant les trônes — au prix de frictions avec les libéraux et les agités."
 cc_concert_liberal_internationalism: "Internationalisme libéral"
 cc_concert_liberal_internationalism_desc: "Non-intervention canningite, tournée vers un internationalisme ultérieur : l'autodétermination nationale et le libre commerce plutôt que l'ancien ordre dynastique."

 cc_concert_security_law: "Sécurité collective"
 cc_concert_security_law_desc: "À quel point les puissances se lieront les unes aux autres pour leur défense."
 cc_concert_ad_hoc: "Concerts selon les besoins"
 cc_concert_ad_hoc_desc: "Les puissances se réunissent lorsqu'une crise le demande, mais ne contractent aucune obligation permanente les unes envers les autres."
 cc_concert_mutual_guarantee: "Garantie mutuelle"
 cc_concert_mutual_guarantee_desc: "La garantie de la Quadruple Alliance s'est transformée en sécurité collective : une attaque contre l'un est une attaque contre tous, et aucun membre ne peut faire la guerre à un autre sans cause juste."

 cc_concert_congress_law: "Le système des congrès"
 cc_concert_congress_law_desc: "Si le Concert siège en tant que congrès permanent — l'appareil de médiation collective."
 cc_concert_dormant: "Congrès occasionnels"
 cc_concert_dormant_desc: "Le congrès ne se réunit que lorsqu'il y est convoqué. Il n'a pas de siège permanent."
 cc_concert_standing_congress: "Un congrès permanent"
 cc_concert_standing_congress_desc: "Les puissances siègent de façon permanente et peuvent imposer une paix générale sur les querelles de l'Europe (débloque la Médiation du Congrès)."

 # ============================================================
 # Concert of Europe — parliament actions
 # ============================================================
 cc_concert_pi_mediate_dispute: "Médiation du Congrès"
 cc_concert_pi_mediate_dispute_desc: "La grande réussite du Système du Congrès : les puissances imposent une paix générale lors des guerres d'un membre contre des tiers."
 cc_concert_pi_mediate_dispute_tt: "Paix blanche pour toutes les guerres de chaque membre contre des non-membres du Concert."
 cc_concert_pi_collective_intervention: "Intervention collective"
 cc_concert_pi_collective_intervention_desc: "Une démonstration de force coordonnée pour maintenir l'ordre établi — plus forte là où les puissances ont adopté le Principe d'Intervention. Accorde un mandat d'intervention à chaque membre."
 cc_concert_pi_eastern_question: "La question d'Orient"
 cc_concert_pi_eastern_question_desc: "Les puissances gèrent le partage d'une sphère en déclin. Le président gagne du prestige pour avoir orchestré le règlement ; les membres affirment leurs sphères d'influence."
 cc_concert_pi_admit_power: "Admettre une Puissance"
 cc_concert_pi_admit_power_desc: "Une puissance montante est admise au directoire — l'outsider éligible le plus fort prend place à la table."
 cc_concert_pi_depose_president: "Motion de censure"
 cc_concert_pi_depose_president_desc: "Les membres votent pour destituer le président en exercice et élire un nouveau président parmi eux."

 # ============================================================
 # New vote-reasoning tooltip entries
 # ============================================================
 CC_BOP_LAW_WAR_WEARINESS: "Un long conflit appelle une paix durable"
 CC_BOP_HEGEMON_RISING: "L'aspirant devient dangereux"
 CC_BOP_RECKONING: "L'heure des comptes a sonné"
 CC_CONCERT_BASE: "Inclinaison actuelle"
 CC_CONCERT_HAVE_BETTER: "Nous préférons une autre voie"
 CC_CONCERT_KEEP: "L'ordre établi doit perdurer"
 CC_CONCERT_LEGITIMIST: "Un trône valorise la légitimité et l'ordre"
 CC_CONCERT_LIBERAL_COURT: "Une cour libérale favorise l'autodétermination"
 CC_CONCERT_GREAT_POWER: "La place d'une grande puissance à la table"
 CC_CONCERT_GREAT_POWER_CAUTION: "Une grande puissance se méfie des obligations contraignantes"
 CC_CONCERT_SEEKS_PROTECTION: "Une puissance mineure convoite la garantie"
 CC_CONCERT_INTERVENTIONIST: "Le principe d'intervention est en vigueur"
 CC_CONCERT_OPINION_OF_CHAIR: "Notre opinion sur le président en exercice"
 cc_bop_coalition_seat: "Membre de la Coalition"
