l_french:
 # ============================================================
 # Cabinet Experience: school seats, kinds and curricula
 # ============================================================

 # Notifications (events/cc_xp_school_events.txt)
 cc_xp_school.1.title: "L'école déménage"
 cc_xp_school.1.desc: "L'école fondée par [cc_xp_school_founder.GetName] ne peut plus maintenir son siège à [cc_xp_school_old_seat.GetName]. Ses maîtres, ses livres et ses étudiants ont rejoint l'université de [cc_xp_school_new_seat.GetName], où l'enseignement se poursuit."
 cc_xp_school.1.a: "Laissez-la s'installer."
 cc_xp_school.2.title: "Une école en exil"
 cc_xp_school.2.desc: "L'école fondée par [cc_xp_school_founder.GetName] a perdu son siège à [cc_xp_school_old_seat.GetName], et aucune autre université du royaume n'est libre pour l'accueillir.\n\nSes membres continuent d'étudier et de progresser dans sa discipline. Tant qu'une université n'est pas libre, l'école n'a pas de siège : ses bonus de siège et ses actions sont suspendus. Elle y retournera d'elle-même dès qu'une place se libérera."
 cc_xp_school.2.a: "Nous lui trouverons un foyer."
 cc_xp_school.3.title: "L'école revient"
 cc_xp_school.3.desc: "L'école fondée par [cc_xp_school_founder.GetName] a retrouvé un siège, à l'université de [cc_xp_school_new_seat.GetName]. Ses bonus de siège et ses actions reprennent."
 cc_xp_school.3.a: "Bon retour parmi nous."

 # Kind of institution, from the seat's religion (cc_xp_school_N_kind)
 CC_XP_SCHOOL_KIND_1: "Studium"
 CC_XP_SCHOOL_KIND_2: "Académie"
 CC_XP_SCHOOL_KIND_3: "Madrasa"
 CC_XP_SCHOOL_KIND_4: "Shuyuan"
 CC_XP_SCHOOL_KIND_5: "Vihara"
 CC_XP_SCHOOL_KIND_6: "Gurukula"
 CC_XP_SCHOOL_KIND_7: "Yeshiva"
 CC_XP_SCHOOL_KIND_8: "École"

 # Curriculum (cc_xp_school_N_curriculum)
 CC_XP_CURRICULUM_1: "Droit"
 CC_XP_CURRICULUM_2: "Théologie"
 CC_XP_CURRICULUM_3: "Philosophie naturelle"
 CC_XP_CURRICULUM_4: "Lettres"
 CC_XP_CURRICULUM_5: "Science militaire"

 # Curriculum tooltips
 CC_XP_CURRICULUM_1_TT: "Droit. Un programme administratif. Au siège : contrôle maximum plus élevé et moins d'agitation. À l'échelle du royaume : croissance du contrôle plus rapide, et la société évolue vers la Jurisprudence.\n\nLes bonus sont proportionnels à la qualité de l'école. Le royaume ne gagne le bonus national de chaque programme qu'une seule fois, quel que soit le nombre d'écoles qui l'enseignent."
 CC_XP_CURRICULUM_2_TT: "Théologie. Un programme administratif. Au siège : conversion plus rapide des hérétiques et moins d'agitation. À l'échelle du royaume : influence religieuse et tolérance de la foi d'État, et la société évolue vers le Spiritualisme.\n\nLes bonus sont proportionnels à la qualité de l'école. Le royaume ne gagne le bonus national de chaque programme qu'une seule fois, quel que soit le nombre d'écoles qui l'enseignent."
 CC_XP_CURRICULUM_3_TT: "Philosophie Naturelle. Un programme administratif. Au siège : taux d'alphabétisation maximum plus élevé. À l'échelle du royaume : recherche plus rapide, et la société évolue vers l'Innovation.\n\nLes bonus sont proportionnels à la qualité de l'école. Le royaume ne gagne le bonus national de chaque programme qu'une seule fois, quel que soit le nombre d'écoles qui l'enseignent."
 CC_XP_CURRICULUM_4_TT: "Lettres. Un programme diplomatique. Au siège : influence culturelle. À l'échelle du royaume : prestige mensuel et portée diplomatique, et la société évolue vers l'Humanisme.\n\nLes bonus sont proportionnels à la qualité de l'école. Le royaume ne gagne le bonus national de chaque programme qu'une seule fois, quel que soit le nombre d'écoles qui l'enseignent."
 CC_XP_CURRICULUM_5_TT: "Science Militaire. Un programme militaire. Au siège : croissance du contrôle plus rapide. À l'échelle du royaume : moral terrestre et tradition de l'armée, et la société évolue vers la Qualité.\n\nLes bonus sont proportionnels à la qualité de l'école. Le royaume ne gagne le bonus national de chaque programme qu'une seule fois, quel que soit le nombre d'écoles qui l'enseignent."

 # ---- Schools tab ----
 CC_XP_SCHOOLS_FOUNDED_LABEL: "Écoles"
 CC_XP_SCHOOLS_FOUNDED_TT: "Écoles fondées, sur le nombre que ce royaume peut détenir."
 CC_XP_SCHOOLS_MEMBERS_LABEL: "Membres"
 CC_XP_SCHOOL_OF: "de"
 CC_XP_SCHOOL_IN_EXILE: "#R En exil#!"
 CC_XP_SCHOOL_IN_EXILE_TT: "Cette école a perdu son siège et aucune autre université du royaume n'est libre. Ses membres gagnent toujours de l'expérience, mais ses bonus de siège et ses projets sont suspendus. Elle revient d'elle-même dès qu'une université est libre."
 CC_XP_SCHOOL_TRACK_TT: "La discipline enseignée par cette école. Chaque membre y gagne de l'expérience chaque année."
 CC_XP_SCHOOL_FOUNDER_LABEL: "Fondateur"
 CC_XP_SCHOOL_RECTOR_LABEL: "Recteur"
 CC_XP_SCHOOL_NO_RECTOR: "Pas de Recteur"
 CC_XP_SCHOOL_RECTOR_TT: "Attribuez à un ministre la fonction de #Y Recteur#! dans l'écran du cabinet et choisissez le siège de cette école. Pendant son mandat, les membres gagnent le double d'expérience, les projets surviennent tous les 2 ans au lieu de 3, le programme peut être modifié après 5 ans au lieu de 10, et le siège gagne de la croissance d'institution et de l'alphabétisation."
 CC_XP_SCHOOL_MEMBERS_LABEL: "Membres"
 CC_XP_SCHOOL_MEMBERS_TT: "Membres actifs de cette école, par rapport à sa capacité. Chacun gagne de l'expérience dans sa discipline chaque année : une fois et demie pour un membre partageant la culture du siège, et le double sous l'autorité d'un Recteur.\n\nUne fois par an, deux chances pour qu'une personne du royaume s'inscrive de son propre chef, tant qu'il reste de la place. La chance augmente avec la renommée et la qualité, et diminue à mesure que l'école se remplit. Ceux qui ont plus d'aptitude dans la discipline, une culture primaire ou acceptée, la religion d'État ou la culture du siège sont plus susceptibles de venir, et les protégés plus encore. Les membres ne faisant pas partie du cabinet obtiennent leur diplôme après 8 ans, ce qui libère leur place. La couronne peut toujours inscrire quelqu'un manuellement, au-delà de la capacité et de la barre d'admission."
 CC_XP_SCHOOL_CURRICULUM_LABEL: "Programme"

 # Buttons
 CC_XP_SCHOOL_BTN_ENDOW: "Doter"
 CC_XP_SCHOOL_BTN_CHAIRS: "Chaires royales"
 CC_XP_SCHOOL_BTN_SCHOLARS: "Savants"
 CC_XP_SCHOOL_BTN_DISPUTATION: "Disputation"
 CC_XP_SCHOOL_BTN_CURRICULUM: "Programme"

 # Actions (aliased per school by cc_xp_school_actions_l_english.yml)
 cc_xp_school_endow: "Doter la bibliothèque"
 cc_xp_school_endow_desc: "Financer des livres, des instruments et un bâtiment pour cette école. Progrès de la recherche immédiat, et alphabétisation accrue au siège pendant dix ans.\n\nUne école ne s'engage que dans un projet à la fois : elle a ensuite besoin de 3 ans (2 sous un Recteur) avant le suivant."
 cc_xp_school_chairs: "Chaires royales"
 cc_xp_school_chairs_desc: "Financer des chaires professorales salariées pour un mandat. Chaque membre de cette école gagne de l'expérience dans sa discipline. Les protégés en gagnent plus que les ministres, car l'école est tout ce qu'ils ont.\n\nUne école ne s'engage que dans un projet à la fois : elle a ensuite besoin de 3 ans (2 sous un Recteur) avant le suivant."
 cc_xp_school_scholars: "Inviter des savants étrangers"
 cc_xp_school_scholars_desc: "Utiliser le nom de la cour pour attirer des savants de l'étranger. Le siège progresse vers chaque institution que le royaume connaît et dont le siège manque, et développe les institutions plus rapidement pendant dix ans.\n\nUne école ne s'attelle qu'à un projet à la fois : elle a ensuite besoin de 3 ans (2 sous un Recteur) avant le suivant."
 cc_xp_school_disputation: "Tenir une Disputation"
 cc_xp_school_disputation_desc: "Organiser un débat public sur une question du programme de l'école. La cour décide de l'issue.\n\nUne école ne s'engage que dans un projet à la fois : elle a ensuite besoin de 3 ans (2 sous un Recteur) avant le suivant."
 cc_xp_school_curriculum: "Changer le programme"
 cc_xp_school_curriculum_desc: "Choisissez ce que cette école enseigne. Chaque programme donne un bonus au siège et un autre à travers le royaume, et détermine les disputations qu'elle organise. Une fois modifié, il ne peut plus être changé pendant 10 ans (5 sous un Recteur)."

 # Action gates
 cc_xp_tt_school_exists: "Cette école a été fondée"
 cc_xp_tt_school_not_exiled: "Cette école a un siège (elle n'est pas en exil)"
 cc_xp_tt_school_not_busy: "Cette école n'a aucun projet en cours"
 cc_xp_tt_school_has_members: "Cette école a au moins un membre vivant"
 cc_xp_tt_school_curriculum_settled: "Cette école n'a pas modifié son programme récemment"

 # ---- Rector duty ----
 cc_duty_rector: "Recteur"
 cc_duty_rector_desc: "Le ministre prend la direction de l'une des écoles du royaume. Ses membres gagnent le double d'expérience, ses projets et les changements de programme surviennent plus rapidement, et son siège développe les institutions et l'alphabétisation plus vite."
 cc_duty_rector_action: "Recteur"
 cc_duty_rector_active: "Sert en tant que Recteur"
 cc_duty_rector_select_school: "Quelle école ?"
 cc_duty_rector_no_school: "@trigger_no! Le royaume ne possède aucune école installée sans Recteur."

 # ---- Disputations ----
 cc_xp_school.11.title: "Une dispute sur le droit"
 cc_xp_school.11.desc: "Les maîtres de [cc_xp_school_new_seat.GetName] ont débattu pendant une semaine d'une seule question : là où la coutume et le statut royal divergent, lequel une cour doit-elle suivre ? La salle était pleine chaque jour. Les deux parties veulent maintenant que la couronne dise qui a gagné."
 cc_xp_school.11.a: "Statut. La loi de la couronne s'impose."
 cc_xp_school.11.b: "Personnalisé. L'ancienne loi du pays demeure."
 cc_xp_school.11.c: "Publier les deux arguments et laisser les cours les lire."
 cc_xp_school.12.title: "Une question de doctrine"
 cc_xp_school.12.desc: "Une dispute à [cc_xp_school_new_seat.GetName] a été plus loin que prévu. Un jeune maître a défendu une lecture des écritures que le clergé juge dangereuse, et les étudiants ont pris son parti. Les évêques ont écrit à la couronne."
 cc_xp_school.12.a: "Maintenir l'enseignement reçu."
 cc_xp_school.12.b: "Laissez-les argumenter. C'est à cela que sert l'école."
 cc_xp_school.12.c: "Référer la question au clergé."
 cc_xp_school.13.title: "Une expérience devant la cour"
 cc_xp_school.13.desc: "Les maîtres de [cc_xp_school_new_seat.GetName] ont présenté une expérience à la cour : un résultat que les anciennes autorités jugeaient impossible, répété trois fois devant témoins. Les bourgeois veulent savoir quelle est sa valeur. Le clergé veut savoir ce qu'il signifie."
 cc_xp_school.13.a: "Payer pour des essais supplémentaires."
 cc_xp_school.13.b: "Assez. Mettez fin aux démonstrations."
 cc_xp_school.13.c: "Demander aux étudiants de le répéter jusqu'à ce qu'ils le comprennent."
 cc_xp_school.14.title: "Un concours de lettres"
 cc_xp_school.14.desc: "L'école de [cc_xp_school_new_seat.GetName] a organisé un concours public de poésie et d'éloquence. Les textes gagnants sont déjà copiés et circulent dans la cour."
 cc_xp_school.14.a: "Couronnez le vainqueur devant la cour."
 cc_xp_school.14.b: "Imprimer les entrées."
 cc_xp_school.14.c: "Envoyer des copies aux cours étrangères."
 cc_xp_school.15.title: "Une dispute sur la guerre"
 cc_xp_school.15.desc: "Les maîtres de [cc_xp_school_new_seat.GetName] ont terminé un traité sur le drill et l'ordre de bataille, et l'ont soutenu face à deux capitaines vétérans. Les capitaines ont perdu. La noblesse, qui officie dans l'armée, n'a pas apprécié d'entendre cela."
 cc_xp_school.15.a: "Adopter le nouveau drill."
 cc_xp_school.15.b: "Le garder dans la salle de cours pour l'instant."
 cc_xp_school.15.c: "Envoyer les maîtres enseigner dans les garnisons."

 # ---- Change curriculum ----
 cc_xp_school.20.title: "Que doit enseigner l'école ?"
 cc_xp_school.20.desc: "Les maîtres de l'école de [cc_xp_school_new_seat.GetName] attendent la décision de la couronne concernant leur programme. Une école enseigne dans sa discipline, cinq programmes s'offrent donc à elle. Le choix détermine ce qu'ils enseignent, ce que le siège et le royaume en retirent, et sur quelles questions ils débattreont pendant des années."
 cc_xp_school.20.a: "Droit"
 cc_xp_school.20.b: "Théologie"
 cc_xp_school.20.c: "Philosophie naturelle"
 cc_xp_school.20.d: "Lettres"
 cc_xp_school.20.e: "Science militaire"
 cc_xp_school.20.f: "Conserver le programme actuel."
 cc_xp_school.20.g: "Médecine"
 cc_xp_school.20.h: "Navigation"

 # ---- Renown and quality ----
 CC_XP_SCHOOL_RENOWN_LABEL: "Renommée"
 CC_XP_SCHOOL_QUALITY_LABEL: "Qualité"
 CC_XP_SCHOOL_RENOWN_TIER_1: "Local"
 CC_XP_SCHOOL_RENOWN_TIER_2: "Régional"
 CC_XP_SCHOOL_RENOWN_TIER_3: "Célèbre"
 CC_XP_SCHOOL_RENOWN_TIER_4: "Illustre"
 CC_XP_SCHOOL_QUALITY_TIER_1: "Pauvre"
 CC_XP_SCHOOL_QUALITY_TIER_2: "Adéquat"
 CC_XP_SCHOOL_QUALITY_TIER_3: "Bon"
 CC_XP_SCHOOL_QUALITY_TIER_4: "Excellent"
 CC_XP_SCHOOL_RENOWN_TT_HEAD: "#T Renommée#!\nMesure la notoriété de l'école. Chaque année, elle progresse de 8 % vers sa cible (et chute de 15 % si elle la dépasse), s'stabilisant ainsi autour de sa cible plutôt que de croître indéfiniment. Chaque trimestre ne compte qu'en fonction de l'ancienneté de l'école : 20 % à la fondation, et la totalité après 100 ans."
 CC_XP_SCHOOL_RENOWN_TT_FOOT: "Divisée par deux en exil, et nulle si l'école n'a pas de membres. Les événements et les projets augmentent directement la renommée ; cet effet s'estompe pour revenir vers la cible au cours des années suivantes.\n\nLa renommée détermine le prestige du royaume et l'influence culturelle issue de ses écoles, augmente la capacité de l'école et la chance que des gens s'y inscrivent de leur propre chef, et attire des érudits (à partir de 40), des étudiants étrangers (à partir de 30) et des artistes (à partir de 50)."
 CC_XP_SCHOOL_QUALITY_TT_HEAD: "#T Qualité#!\nLa qualité de l'enseignement. Chaque année, elle progresse de 20 % vers sa cible, laquelle est la somme de :"
 CC_XP_SCHOOL_QUALITY_TT_FOOT: "10 à plat en exil, et 0 lorsque l'école n'a aucun membre. Les Dotations et les Chaires Royales augmentent la qualité directement.\n\nLa qualité module les bonus de sièges et de programme de l'école ainsi que l'expérience annuelle de ses membres. Échelle actuelle :"
 CC_XP_SCHOOL_TT_TEACHING: "Enseignement (trois dixièmes de la qualité, jusqu'à 30) :"
 CC_XP_SCHOOL_TT_TARGET: "Cible :"
 CC_XP_SCHOOL_TT_FUNDING: "Financement (Budget culturel) :"
 CC_XP_SCHOOL_TT_RECTOR: "Recteur (5, plus l'ancienneté, plus un dixième de leur compétence dans la discipline) :"
 CC_XP_SCHOOL_TT_STABLE: "Programme établi :"
 CC_XP_SCHOOL_STANDING_PREFIX: "Rang"
 CC_XP_SCHOOL_STANDING_TT: "Position de l'école dans le classement mondial des universités selon sa renommée. Chaque lieu étranger possédant une université est évalué une fois par an selon les mêmes critères que la renommée (le rang et le prestige de son royaume, le développement de son siège et l'alphabétisation de ses nobles et bourgeois) plus 15 pour son enseignement, en tant que fondation pleinement établie. Ceci correspond au nombre de centres dépassant la renommée de cette école, plus un."
 CC_XP_SCHOOL_FOUNDED_PREFIX: "Fondé"
 CC_XP_SCHOOL_FOUNDER_TT: "Le ministre qui a fondé cette école et a choisi sa discipline."
 CC_XP_SCHOOLS_RIVAL_LABEL: "Université principale sur notre continent :"
 CC_XP_SCHOOLS_RIVAL_TT: "L'université étrangère la plus éminente sur le continent de notre capitale, et son score. Recalculé chaque année. Une école dont la renommée est inférieure de plus de 10 points peut lui perdre des maîtres et des étudiants. Le rang sur chaque fiche d'école reste parmi toutes les universités du monde."

 # Funding
 CC_XP_SCHOOL_FUNDING_LABEL: "Financement"
 CC_XP_SCHOOL_FUNDING_CULTURE: "Budget culturel à #Y [Player.MakeScope.GetVariable('cc_xp_school_culture_pos').GetValue|%0]#!"
 CC_XP_SCHOOL_FUNDING_CUSTOMARY: "Allocation coutumière"
 CC_XP_SCHOOL_FUNDING_CUSTOMARY_TT: "Ce royaume ne peut pas encore investir dans la culture. En attendant, ses écoles vivent d'une allocation coutumière qui fixe la qualité à 35 et ne coûte rien."
 CC_XP_SCHOOL_FUNDING_TT: "Les écoles sont financées par le budget #Y Culture#! du royaume. Plus le curseur de Culture est élevé, plus la qualité à laquelle chaque école se stabilise est haute (20 avec un curseur vide, 45 à moitié, 70 au maximum), et plus elle coûte cher : jusqu'à 5 % des revenus mensuels du commerce et des impôts par école dotée d'un siège, modulé par le curseur. Avant que le royaume ne puisse investir dans la culture, les écoles vivent d'une allocation coutumière qui stabilise la qualité à 35 et ne coûte rien. Rien n'est payé lorsqu'une école est en exil ou n'a aucun membre."
 CC_XP_SCHOOL_PER_MONTH: "par mois"

 # Option gates
 cc_xp_tt_school_quality_40: "La qualité de l'école est d'au moins 40"
 cc_xp_tt_school_quality_50: "La qualité de l'école est d'au moins 50"
 cc_xp_tt_school_quality_60: "La qualité de l'école est d'au moins 60"
 cc_xp_tt_school_coastal: "Le siège de l'école est sur la côte"

 # New curricula
 CC_XP_CURRICULUM_6: "Médecine"
 CC_XP_CURRICULUM_7: "Navigation"
 CC_XP_CURRICULUM_6_TT: "Médecine. Un programme administratif. Au siège : résistance aux maladies et croissance démographique. À l'échelle du royaume : résistance aux maladies, et la société évolue vers l'Humanisme. Nécessite une qualité de 50 pour être adopté.\n\nLes bonus sont proportionnels à la qualité de l'école. Le royaume ne gagne le bonus national de chaque programme qu'une seule fois, quel que soit le nombre d'écoles qui l'enseignent."
 CC_XP_CURRICULUM_7_TT: "Navigation. Un programme militaire. Au siège : construction navale plus rapide et plus de marins. À l'échelle du royaume : portée navale et tradition de la marine, et la société évolue vers le Naval. Nécessite un siège côtier pour être adopté.\n\nLes bonus sont proportionnels à la qualité de l'école. Le royaume ne gagne le bonus national de chaque programme qu'une seule fois, quel que soit le nombre d'écoles qui l'enseignent."

 # Fourth disputation options (quality 60)
 cc_xp_school.11.d: "Demander aux maîtres de rédiger un code qui tranche la question."
 cc_xp_school.12.d: "Réunissez les maîtres et les évêques."
 cc_xp_school.13.d: "Annoncez le résultat aux savants de toutes les cours."
 cc_xp_school.14.d: "Fonder une imprimerie à l'école."
 cc_xp_school.15.d: "Laissez les maîtres rédiger le manuel d'instruction du royaume."
 cc_xp_school.16.title: "Une dispute sur les médecins"
 cc_xp_school.16.desc: "Les médecins de [cc_xp_school_new_seat.GetName] se sont divisés. Un groupe enseigne selon les autorités anciennes ; l'autre a étudié les corps de criminels exécutés et affirme que les autorités ont tort. Les deux ont demandé à la couronne de trancher."
 cc_xp_school.16.a: "Financer un hôpital où les deux peuvent être testés."
 cc_xp_school.16.b: "Suivez les autorités anciennes."
 cc_xp_school.16.c: "Laissez les étudiants étudier les morts."
 cc_xp_school.16.d: "Publier les conclusions."
 cc_xp_school.17.title: "Cartes et Étoiles"
 cc_xp_school.17.desc: "Les maîtres de [cc_xp_school_new_seat.GetName] ont terminé un nouvel ensemble de tables pour déterminer la position d'un navire en mer. Les marchands veulent qu'elles soient réservées à leurs propres capitaines. Les maîtres veulent les faire imprimer."
 cc_xp_school.17.a: "Commandez-leur de nouvelles cartes."
 cc_xp_school.17.b: "Envoyer les maîtres en mer avec la flotte."
 cc_xp_school.17.c: "Réserver les tables à nos propres capitaines."
 cc_xp_school.17.d: "Imprimer les tableaux pour que tous puissent les utiliser."

 # ---- Renown events ----
 cc_xp_school.30.title: "Un érudit prometteur"
 cc_xp_school.30.desc: "L'école de [cc_xp_school_new_seat.GetName] a attiré un jeune érudit d'un réel talent, [cc_xp_school_scholar.GetName], venu pour le nom de l'école. Les maîtres pensent qu'ils pourraient en faire quelque chose."
 cc_xp_school.30.a: "Les prendre sous la protection de la couronne en tant que protégés."
 cc_xp_school.30.b: "Leur donner une place à la cour et à l'école."
 cc_xp_school.30.c: "Nous n'avons pas de place pour eux."
 cc_xp_school.31.title: "Un étudiant étranger"
 cc_xp_school.31.desc: "Une famille de rang à l'étranger a envoyé son héritier étudier à [cc_xp_school_new_seat.GetName]. Le nom de l'école leur est parvenu avant tout ambassadeur des nôtres."
 cc_xp_school.31.a: "Facturez les frais complets."
 cc_xp_school.31.b: "Renoncer aux frais par courtoisie."
 cc_xp_school.31.c: "Leur donner les meilleurs maîtres dont nous disposons."
 cc_xp_school.32.title: "Un artiste attiré par l'école"
 cc_xp_school.32.desc: "[cc_xp_school_artist.GetName], un artiste dont la réputation grandit, est venu à [cc_xp_school_new_seat.GetName] pour travailler parmi ses savants, et demande si la couronne a une place pour eux."
 cc_xp_school.32.a: "Leur offrir une place à la cour."
 cc_xp_school.32.b: "Nous manquons de place pour eux."
 cc_xp_school.40.title: "Un maître courtisé"
 cc_xp_school.40.desc: "L'un des meilleurs maîtres de [cc_xp_school_new_seat.GetName] s'est vu proposer une chaire à [cc_xp_school_rival.GetName], dont l'université éclipse désormais la nôtre. L'offre est généreuse."
 cc_xp_school.40.a: "S'aligner sur l'offre."
 cc_xp_school.40.b: "Leur rappeler ce qu'ils doivent à la couronne."
 cc_xp_school.40.c: "Laissez-les partir."
 cc_xp_school.41.title: "Les étudiants partent"
 cc_xp_school.41.desc: "Les étudiants qui seraient venus à [cc_xp_school_new_seat.GetName] se rendent plutôt à [cc_xp_school_rival.GetName]. Ses maîtres sont mieux connus, et les fils de nos propres marchands figurent parmi ceux qui partent."
 cc_xp_school.41.a: "Financer des bourses pour les garder ici."
 cc_xp_school.41.b: "Interdire les études à l'étranger."
 cc_xp_school.41.c: "Laissez-les partir."
 cc_xp_school.42.title: "Première parmi les universités"
 cc_xp_school.42.desc: "Aucune université dans le monde connu n'est plus mentionnée que l'école de [cc_xp_school_new_seat.GetName]. Les savants qui allaient autrefois ailleurs viennent désormais ici, et les cours étrangères sollicitent ses maîtres nommément."
 cc_xp_school.42.a: "Organiser un congrès de savants."
 cc_xp_school.42.b: "Célébrez-le à la cour."
 cc_xp_school_tt_curriculum_switch: "Les bonus du programme actuel de l'école prennent fin, et ceux du nouveau programme s'appliquent à son siège et à travers le royaume."
 cc_xp_school_while_seated: "tant que l'école a son siège ici"
 cc_xp_school_while_taught: "tant que l'une de nos écoles enseigne ce programme"
 cc_xp_school_while_renowned: "tant que nos écoles conservent leur renommée"
 STATIC_MODIFIER_NAME_cc_xp_school_seat_law: "Siège d'une école de droit"
 STATIC_MODIFIER_DESC_cc_xp_school_seat_law: "L'école ici forme des avocats et des clercs, et la ville est gouvernée par des gens qui y ont appris leur métier."
 STATIC_MODIFIER_NAME_cc_xp_school_seat_theology: "Siège d'une école de théologie"
 STATIC_MODIFIER_DESC_cc_xp_school_seat_theology: "L'école ici forme des prédicateurs et des confesseurs, et ses sermons atteignent toute la ville."
 STATIC_MODIFIER_NAME_cc_xp_school_seat_natural_philosophy: "Siège d'une école de philosophie naturelle"
 STATIC_MODIFIER_DESC_cc_xp_school_seat_natural_philosophy: "L'école ici enseigne la lecture, la mesure et le calcul à quiconque peut payer, et beaucoup le peuvent."
 STATIC_MODIFIER_NAME_cc_xp_school_seat_letters: "Siège d'une école des lettres"
 STATIC_MODIFIER_DESC_cc_xp_school_seat_letters: "Poètes, orateurs et copistes se rassemblent autour de l'école d'ici, et leurs écrits circulent."
 STATIC_MODIFIER_NAME_cc_xp_school_seat_military_science: "Siège d'une école des sciences militaires"
 STATIC_MODIFIER_DESC_cc_xp_school_seat_military_science: "Les officiers formés à l'école d'ici maintiennent l'ordre dans le pays environnant."
 STATIC_MODIFIER_NAME_cc_xp_school_seat_medicine: "Siège d'une école de médecine"
 STATIC_MODIFIER_DESC_cc_xp_school_seat_medicine: "Les médecins de l'école locale soignent la ville, et moins d'habitants meurent de causes traitables."
 STATIC_MODIFIER_NAME_cc_xp_school_seat_navigation: "Siège d'une école de navigation"
 STATIC_MODIFIER_DESC_cc_xp_school_seat_navigation: "Les charpentiers de marine et les pilotes apprennent leur métier à l'école locale."
 STATIC_MODIFIER_NAME_cc_xp_school_realm_law: "Formé au droit"
 STATIC_MODIFIER_DESC_cc_xp_school_realm_law: "Les fonctionnaires du royaume sont formés dans sa propre école de droit."
 STATIC_MODIFIER_NAME_cc_xp_school_realm_theology: "Formé en théologie"
 STATIC_MODIFIER_DESC_cc_xp_school_realm_theology: "Le clergé du royaume est formé dans sa propre école de théologie."
 STATIC_MODIFIER_NAME_cc_xp_school_realm_natural_philosophy: "Formé à la philosophie naturelle"
 STATIC_MODIFIER_DESC_cc_xp_school_realm_natural_philosophy: "L'école de philosophie naturelle du royaume apporte de nouvelles connaissances à la cour."
 STATIC_MODIFIER_NAME_cc_xp_school_realm_letters: "Formé aux lettres"
 STATIC_MODIFIER_DESC_cc_xp_school_realm_letters: "L'école de lettres du royaume rend sa cour admirée à l'étranger, et sa correspondance voyage plus loin."
 STATIC_MODIFIER_NAME_cc_xp_school_realm_military_science: "Formé aux sciences militaires"
 STATIC_MODIFIER_DESC_cc_xp_school_realm_military_science: "Les officiers du royaume sont formés dans sa propre école des sciences militaires."
 STATIC_MODIFIER_NAME_cc_xp_school_realm_medicine: "Formé à la médecine"
 STATIC_MODIFIER_DESC_cc_xp_school_realm_medicine: "Les médecins formés à l'école de médecine du royaume exercent à travers tout le pays."
 STATIC_MODIFIER_NAME_cc_xp_school_realm_navigation: "Formé à la navigation"
 STATIC_MODIFIER_DESC_cc_xp_school_realm_navigation: "Les pilotes du royaume sont formés dans sa propre école de navigation."
 STATIC_MODIFIER_NAME_cc_xp_school_kind_studium: "Studium"
 STATIC_MODIFIER_DESC_cc_xp_school_kind_studium: "Un studium de l'Église occidentale est établi ici."
 STATIC_MODIFIER_NAME_cc_xp_school_kind_academy: "Académie"
 STATIC_MODIFIER_DESC_cc_xp_school_kind_academy: "Une académie de la tradition orientale est établie ici."
 STATIC_MODIFIER_NAME_cc_xp_school_kind_madrasa: "Madrasa"
 STATIC_MODIFIER_DESC_cc_xp_school_kind_madrasa: "Une madrasa est établie ici."
 STATIC_MODIFIER_NAME_cc_xp_school_kind_shuyuan: "Shuyuan"
 STATIC_MODIFIER_DESC_cc_xp_school_kind_shuyuan: "Un shuyuan, une académie de la tradition est-asiatique, est établi ici."
 STATIC_MODIFIER_NAME_cc_xp_school_kind_vihara: "Vihara"
 STATIC_MODIFIER_DESC_cc_xp_school_kind_vihara: "Une école monastique est établie ici."
 STATIC_MODIFIER_NAME_cc_xp_school_kind_gurukula: "Gurukula"
 STATIC_MODIFIER_DESC_cc_xp_school_kind_gurukula: "Un gurukula est établi ici."
 STATIC_MODIFIER_NAME_cc_xp_school_kind_yeshiva: "Yeshiva"
 STATIC_MODIFIER_DESC_cc_xp_school_kind_yeshiva: "Une yeshiva est établie ici."
 STATIC_MODIFIER_NAME_cc_xp_school_kind_school: "Siège d'une école"
 STATIC_MODIFIER_DESC_cc_xp_school_kind_school: "L'une des écoles du royaume est établie ici."
 STATIC_MODIFIER_NAME_cc_xp_school_library: "Bibliothèque dotée"
 STATIC_MODIFIER_DESC_cc_xp_school_library: "La couronne a financé des livres, des instruments et un bâtiment pour l'école locale."
 STATIC_MODIFIER_NAME_cc_xp_school_scholars: "Érudits étrangers"
 STATIC_MODIFIER_DESC_cc_xp_school_scholars: "Des érudits venus de l'étranger sont venus enseigner à l'école d'ici, apportant avec eux de nouvelles idées."
 STATIC_MODIFIER_NAME_cc_xp_school_drill: "L'exercice de l'école"
 STATIC_MODIFIER_DESC_cc_xp_school_drill: "L'armée s'exerce selon un manuel écrit à l'école des sciences militaires du royaume."
 STATIC_MODIFIER_NAME_cc_xp_school_statute: "Le statut prime la coutume"
 STATIC_MODIFIER_DESC_cc_xp_school_statute: "Les tribunaux suivent le statut royal là où celui-ci et la coutume divergent, comme l'ont soutenu les juristes de l'école."
 STATIC_MODIFIER_NAME_cc_xp_school_renown: "Écoles renommées"
 STATIC_MODIFIER_DESC_cc_xp_school_renown: "Les écoles du royaume sont connues à l'étranger, et leur réputation rejaillit sur la cour. Varie selon la renommée de l'école la plus prestigieuse du royaume."
 CC_XP_SCHOOL_DORMANT: "#R Dormant#!"
 CC_XP_SCHOOL_DORMANT_TT: "Cette école n'a plus de membres actifs. Personne n'y enseigne et personne ne porte son nom, elle ne vieillit donc plus, ne coûte rien, et sa renommée et sa qualité s'estompent un peu chaque année. Elle se réveille dès que quelqu'un y est à nouveau inscrit, par la couronne ou de son propre chef."
 cc_xp_school.50.title: "Un traité sur les revenus"
 cc_xp_school.50.desc: "Les maîtres de [cc_xp_school_new_seat.GetName] ont terminé un traité sur la manière dont la couronne perçoit ses revenus, avec des tableaux montrant où l'argent est perdu en chemin vers le trésor. Plusieurs de ces pertes mènent à des maisons nobles."
 cc_xp_school.50.a: "Adopter la nouvelle comptabilité."
 cc_xp_school.50.b: "Enseignez-le dans l'amphithéâtre, et laissez le trésor tranquille."
 cc_xp_school.50.c: "Partagez-le avec les guildes, qui tiennent des registres plus rigoureux que nous."
 cc_xp_school.50.d: "Nommons les maîtres auditeurs du trésor."
 cc_xp_school.51.title: "Un concours d'orateurs"
 cc_xp_school.51.desc: "Un envoyé de passage a défié les maîtres de [cc_xp_school_new_seat.GetName] de s'opposer à lui publiquement. Leur meilleur orateur a parlé pendant une heure sans notes, et l'envoyé est parti avant la fin."
 cc_xp_school.51.a: "Envoyons notre champion avec la prochaine ambassade."
 cc_xp_school.51.b: "Réserver cette compétence à notre propre chancellerie."
 cc_xp_school.51.c: "Demander aux étudiants de soutenir les deux points de vue pour chaque question."
 cc_xp_school.51.d: "Imprimons les oraisons pour que chaque cour puisse les lire."
 cc_xp_school.52.title: "Une grammaire d'une langue lointaine"
 cc_xp_school.52.desc: "Les maîtres de [cc_xp_school_new_seat.GetName] ont achevé une grammaire et un dictionnaire d'une langue que peu de gens à la cour ont jamais entendue. Ils disent que cela ouvre une porte. Ils ne sont pas tombés d'accord sur laquelle."
 cc_xp_school.52.a: "Formez des interprètes pour la cour."
 cc_xp_school.52.b: "Le donner aux marchands qui y commercent."
 cc_xp_school.52.c: "Le donner à ceux qui y porteraient la foi."
 cc_xp_school.52.d: "Imprimons-le, et que chaque érudit puisse en tirer profit."
 cc_xp_school.53.title: "L'Arithmétique du Marchand"
 cc_xp_school.53.desc: "Les maîtres de [cc_xp_school_new_seat.GetName] ont commencé à enseigner la comptabilité en partie double, comme le font les grandes maisons de commerce. Ces dernières préféreraient que cela reste leur secret."
 cc_xp_school.53.a: "Exigeons-le de chaque facteur royal et fermier d'impôts."
 cc_xp_school.53.b: "Laissons les maisons de commerce garder leur secret."
 cc_xp_school.53.c: "Enseignez-le à tout étudiant capable de le suivre jusqu'au bout."
 cc_xp_school.53.d: "Demander aux maîtres de donner également des cours sur le change et la monnaie."
 cc_xp_school.54.title: "La Chronique du Royaume"
 cc_xp_school.54.desc: "Les maîtres de [cc_xp_school_new_seat.GetName] ont écrit une histoire du royaume depuis sa fondation. Elle est érudite, elle est lisible, et par endroits, elle est cruelle envers les ancêtres de personnes présentes à la cour."
 cc_xp_school.54.a: "Le faire réviser pour honorer la dynastie."
 cc_xp_school.54.b: "Laissons le texte en l'état."
 cc_xp_school.54.c: "Utilisez-le pour trancher les litiges de généalogie noble."
 cc_xp_school.54.d: "Faisons-en l'histoire officielle du royaume."
 cc_xp_school.55.title: "Des bastions sur papier"
 cc_xp_school.55.desc: "Les maîtres de [cc_xp_school_new_seat.GetName] ont dessiné un nouveau type de forteresse : des murs bas et angulaires qu'aucun canon ne peut briser et que chaque pièce peut couvrir. Sur le papier, elle est invulnérable. Sur le papier, elle est également très coûteuse."
 cc_xp_school.55.a: "Rebatissons les murs du siège selon le nouveau plan."
 cc_xp_school.55.b: "Envoyez les maîtres inspecter les forts de la frontière."
 cc_xp_school.55.c: "Les vieux murs nous ont assez bien servis."
 cc_xp_school.55.d: "Publions le traité sur la fortification."
 cc_xp_school.56.title: "Essais à la Fonderie"
 cc_xp_school.56.desc: "Les maîtres de [cc_xp_school_new_seat.GetName] ont testé de nouvelles proportions pour les canons à la fonderie. Le dernier canon a éclaté au troisième tir, emportant un hangar avec lui. Les maîtres affirment que cela prouve qu'ils touchent au but."
 cc_xp_school.56.a: "Financer davantage d'essais."
 cc_xp_school.56.b: "Donner les formules aux fondeurs de canons."
 cc_xp_school.56.c: "Arrêtez les essais avant que quelqu'un ne soit tué."
 cc_xp_school.56.d: "Demander aux maîtres d'écrire le manuel des artilleurs."
 cc_xp_school.57.title: "Le Problème du Ravitaillement"
 cc_xp_school.57.desc: "Les maîtres de [cc_xp_school_new_seat.GetName] ont étudié pourquoi notre dernière campagne a perdu plus d'hommes à cause de la faim qu'à cause de l'ennemi. Leur réponse est les magasins : du grain stocké à l'avance le long des routes que l'armée empruntera, et acheté dans la campagne avant d'en avoir besoin."
 cc_xp_school.57.a: "Construire les magasins."
 cc_xp_school.57.b: "Formez les quartiers-maîtres à l'école."
 cc_xp_school.57.c: "Laissons l'approvisionnement aux entrepreneurs, comme auparavant."
 cc_xp_school.57.d: "Demander aux maîtres de planifier le ravitaillement de la prochaine campagne."
 CC_XP_CURRICULUM_8: "Finances publiques"
 CC_XP_CURRICULUM_8_TT: "Finances Publiques. Un programme administratif. Au siège : efficacité de production. À l'échelle du royaume : efficacité des revenus fiscaux, et la société évolue vers la Centralisation.\n\nLes bonus sont proportionnels à la qualité de l'école. Le royaume ne gagne le bonus national de chaque programme qu'une seule fois, quel que soit le nombre d'écoles qui l'enseignent."
 CC_XP_CURRICULUM_9: "Rhétorique"
 CC_XP_CURRICULUM_9_TT: "Rhétorique. Un programme diplomatique. Au siège : moins d'agitation. À l'échelle du royaume : réputation diplomatique et effet accru de l'amélioration des relations, et la société évolue vers la Conciliation.\n\nLes bonus sont proportionnels à la qualité de l'école. Le royaume ne gagne le bonus national de chaque programme qu'une seule fois, quel que soit le nombre d'écoles qui l'enseignent."
 CC_XP_CURRICULUM_10: "Langues"
 CC_XP_CURRICULUM_10_TT: "Langues. Un programme diplomatique. Au siège : influence culturelle. À l'échelle du royaume : assimilation plus rapide et tolérance envers les païens, et la société évolue vers l'Ouverture.\n\nLes bonus sont proportionnels à la qualité de l'école. Le royaume ne gagne le bonus national de chaque programme qu'une seule fois, quel que soit le nombre d'écoles qui l'enseignent."
 CC_XP_CURRICULUM_11: "Commerce"
 CC_XP_CURRICULUM_11_TT: "Commerce. Un programme diplomatique. Au siège : accès au marché. À l'échelle du royaume : efficacité du commerce terrestre et maritime, et la société évolue vers le Libre-échange.\n\nLes bonus sont proportionnels à la qualité de l'école. Le royaume ne gagne le bonus national de chaque programme qu'une seule fois, quel que soit le nombre d'écoles qui l'enseignent."
 CC_XP_CURRICULUM_12: "Histoire et Généalogie"
 CC_XP_CURRICULUM_12_TT: "Histoire et Généalogie. Un programme diplomatique. Au siège : tradition culturelle. À l'échelle du royaume : légitimité mensuelle, et la société évolue vers le Traditionalisme.\n\nLes bonus sont proportionnels à la qualité de l'école. Le royaume ne gagne le bonus national de chaque programme qu'une seule fois, quel que soit le nombre d'écoles qui l'enseignent."
 CC_XP_CURRICULUM_13: "Fortification"
 CC_XP_CURRICULUM_13_TT: "Fortification. Un programme militaire. Au siège : garnisons plus nombreuses et entretien des forts moins coûteux. À l'échelle du royaume : entretien des forts moins coûteux, et la société évolue vers le Défensif.\n\nLes bonus sont proportionnels à la qualité de l'école. Le royaume ne gagne le bonus national de chaque programme qu'une seule fois, quel que soit le nombre d'écoles qui l'enseignent."
 CC_XP_CURRICULUM_14: "Artillerie"
 CC_XP_CURRICULUM_14_TT: "Artillerie. Un programme militaire. Au siège : efficacité de production, grâce à ses fonderies. À l'échelle du royaume : puissance d'artillerie, et la société évolue vers l'Offensif. Nécessite l'Âge des Découvertes pour être adopté.\n\nLes bonus sont proportionnels à la qualité de l'école. Le royaume ne gagne le bonus national de chaque programme qu'une seule fois, quel que soit le nombre d'écoles qui l'enseignent."
 CC_XP_CURRICULUM_15: "Logistique"
 CC_XP_CURRICULUM_15_TT: "Logistique. Un programme militaire. Au siège : capacité alimentaire. À l'échelle du royaume : limite d'approvisionnement plus élevée et moins d'attrition terrestre, et la société évolue vers la Quantité.\n\nLes bonus sont proportionnels à la qualité de l'école. Le royaume ne gagne le bonus national de chaque programme qu'une seule fois, quel que soit le nombre d'écoles qui l'enseignent."
