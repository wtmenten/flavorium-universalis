 CC_XP_SCHOOL_TT_MATURITY: "Établie (évolue chaque trimestre) :"
 STATIC_MODIFIER_NAME_cc_xp_school_seat_public_finance: "Siège d'une école de finances publiques"
 STATIC_MODIFIER_DESC_cc_xp_school_seat_public_finance: "Les commis formés à l'école d'ici tiennent les comptes des ateliers de la ville, et moins d'entre eux font faillite."
 STATIC_MODIFIER_NAME_cc_xp_school_realm_public_finance: "Instruit en finances publiques"
 STATIC_MODIFIER_DESC_cc_xp_school_realm_public_finance: "Les agents fiscaux du royaume sont formés à sa propre école de finances publiques."
 STATIC_MODIFIER_NAME_cc_xp_school_seat_rhetoric: "Siège d'une école de rhétorique"
 STATIC_MODIFIER_DESC_cc_xp_school_seat_rhetoric: "Les orateurs de l'école d'ici plaident les griefs de la ville à l'hôtel de ville plutôt que dans la rue."
 STATIC_MODIFIER_NAME_cc_xp_school_realm_rhetoric: "Instruit en rhétorique"
 STATIC_MODIFIER_DESC_cc_xp_school_realm_rhetoric: "Les envoyés du royaume sont formés dans sa propre école de rhétorique."
 STATIC_MODIFIER_NAME_cc_xp_school_seat_languages: "Siège d'une école de langues"
 STATIC_MODIFIER_DESC_cc_xp_school_seat_languages: "Traducteurs et voyageurs se rassemblent à l'école d'ici, et la langue de la ville rayonne au-delà du royaume."
 STATIC_MODIFIER_NAME_cc_xp_school_realm_languages: "Instruit en langues"
 STATIC_MODIFIER_DESC_cc_xp_school_realm_languages: "Les interprètes formés à l'école de langues du royaume servent ses cours, ses envoyés et ses provinces."
 STATIC_MODIFIER_NAME_cc_xp_school_seat_commerce: "Siège d'une école de commerce"
 STATIC_MODIFIER_DESC_cc_xp_school_seat_commerce: "L'école d'ici enseigne le calcul et le change aux marchands de la ville, et son marché attire le commerce."
 STATIC_MODIFIER_NAME_cc_xp_school_realm_commerce: "Instruit en commerce"
 STATIC_MODIFIER_DESC_cc_xp_school_realm_commerce: "Les facteurs et marchands du royaume sont formés dans sa propre école de commerce."
 STATIC_MODIFIER_NAME_cc_xp_school_seat_history: "Siège d'une école d'histoire et de généalogie"
 STATIC_MODIFIER_DESC_cc_xp_school_seat_history: "Les chroniqueurs de l'école d'ici conservent les archives et les coutumes de la ville."
 STATIC_MODIFIER_NAME_cc_xp_school_realm_history: "Instruit en histoire et généalogie"
 STATIC_MODIFIER_DESC_cc_xp_school_realm_history: "La propre école d'histoire du royaume tient ses archives et la généalogie de sa maison régnante."
 STATIC_MODIFIER_NAME_cc_xp_school_seat_fortification: "Siège d'une école de fortification"
 STATIC_MODIFIER_DESC_cc_xp_school_seat_fortification: "Les ingénieurs formés à l'école d'ici veillent à ce que les murs de la ville soient gardés et entretenus."
 STATIC_MODIFIER_NAME_cc_xp_school_realm_fortification: "Instruit en fortification"
 STATIC_MODIFIER_DESC_cc_xp_school_realm_fortification: "Les forts du royaume sont entretenus par des ingénieurs formés à sa propre école de fortification."
 STATIC_MODIFIER_NAME_cc_xp_school_seat_gunnery: "Siège d'une école d'artillerie"
 STATIC_MODIFIER_DESC_cc_xp_school_seat_gunnery: "Des fondeurs de canons travaillent aux côtés de l'école d'ici, et les fonderies de la ville en prospèrent."
 STATIC_MODIFIER_NAME_cc_xp_school_realm_gunnery: "Instruit en artillerie"
 STATIC_MODIFIER_DESC_cc_xp_school_realm_gunnery: "Les canonniers du royaume sont formés à sa propre école d'artillerie."
 STATIC_MODIFIER_NAME_cc_xp_school_seat_logistics: "Siège d'une école de logistique"
 STATIC_MODIFIER_DESC_cc_xp_school_seat_logistics: "Les quartiers-maîtres formés à l'école d'ici veillent à ce que les greniers de la ville restent pleins."
 STATIC_MODIFIER_NAME_cc_xp_school_realm_logistics: "Instruit en logistique"
 STATIC_MODIFIER_DESC_cc_xp_school_realm_logistics: "Les quartiers-maîtres du royaume sont formés à sa propre école de logistique."
 CC_XP_SCHOOL_ADMISSION_LABEL: "Admission"
 CC_XP_SCHOOL_ADMISSION_1: "Faible"
 CC_XP_SCHOOL_ADMISSION_2: "Moyen"
 CC_XP_SCHOOL_ADMISSION_3: "Élevé"
 CC_XP_SCHOOL_ADMISSION_1_TT: "Toute personne du royaume peut s'inscrire de son propre chef. L'école devient nombreuse, et l'aptitude moyenne de ses membres, et donc sa qualité, est modeste. Chaque membre ajoute un bonus à l'échelle du royaume pour la discipline de l'école."
 CC_XP_SCHOOL_ADMISSION_2_TT: "Seuls ceux ayant une aptitude de 40 ou plus dans la discipline s'inscrivent de leur propre chef. L'aptitude est la compétence dans la discipline plus 3 pour chaque niveau d'ancienneté au-dessus du premier."
 CC_XP_SCHOOL_ADMISSION_3_TT: "Seuls ceux ayant une aptitude de 60 ou plus dans la discipline s'inscrivent de leur propre chef. L'école reste petite, et l'aptitude moyenne élevée de ses membres augmente la qualité, ce qui renforce le programme d'études. L'aptitude est la compétence dans la discipline plus 3 pour chaque niveau d'ancienneté au-dessus du premier."
 cc_xp_tt_school_admission_settled: "Cette école n'a pas changé ses conditions d'admission au cours des 5 dernières années"
 cc_xp_school_tt_admission_to_1: "L'admission devient #Y Faible#! : toute personne du royaume peut s'inscrire de son propre chef."
 cc_xp_school_tt_admission_to_2: "L'admission devient #Y Moyenne#! : seuls ceux ayant une aptitude de 40 ou plus dans la discipline s'inscrivent de leur propre chef."
 cc_xp_school_tt_admission_to_3: "L'admission devient #Y Élevée#! : seuls ceux ayant une aptitude de 60 ou plus dans la discipline s'inscrivent de leur propre chef."
 cc_xp_school_tt_admission_keeps: "Les membres actuels restent, quelle que soit leur aptitude."
