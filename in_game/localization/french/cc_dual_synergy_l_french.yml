l_french:
 # ============================================================
 # DUAL-LAYER SYNERGY EVENTS (cc_dual namespace)
 # Cabinet × Religious_Figure pair events
 # ============================================================

 cc_dual.1.title: "Le guerrier mystique"
 cc_dual.1.a: "C'est un commandant comme on n'en voit pas d'autres. Que sa dualité devienne notre force."
 cc_dual.1.b: "La conversion des territoires conquis est l'endroit où leur énergie spirituelle est le mieux employée."

 cc_dual.2.title: "Le diplomate sacré"
 cc_dual.2.desc: "Dans la tradition byzantine, le sacré et le diplomatique n'ont jamais été séparés — les robes du patriarche et le sceau du chancelier partageaient la même antichambre. [minister.GetName] a ravivé cette synthèse : son autorité religieuse et sa capacité diplomatique parlent d'une seule voix, et les cours qu'il visite ont appris à écouter."
 cc_dual.2.a: "C'est l'art de gouverner tel qu'il était pratiqué autrefois. Laissons-le opérer."
 cc_dual.2.b: "Déployez-les là où la conversion et la diplomatie sont les plus nécessaires."

 cc_dual.3.title: "Le théologien rationnel"
 cc_dual.3.desc: "[minister.GetName] refuse de choisir entre la raison et la foi. Les grands philosophes islamiques l'ont refusé. Les scolastiques aussi. [minister.GetHerHim] le fait également : un esprit formé à l'enquête des Lumières appliqué aux questions de doctrine. Les institutions que ce ministre crée sont plus fortes car elles embrassent les deux traditions."
 cc_dual.3.a: "Cette synthèse est exactement ce dont l'époque a besoin. Laissons-les travailler."
 cc_dual.3.b: "Leur clarté philosophique a révélé quelque chose de plus vaste — les fondements d'une cour de philosophes."
 cc_dual.3.b.tt: "Débloque la réforme gouvernementale de la Cour des Philosophes."

 cc_dual.4.title: "Le Parlement protestant"
 cc_dual.4.a: "Que leur foi réformée renforce les fondements du parlement."
 cc_dual.4.b: "La satisfaction du clergé est le besoin le plus immédiat — orientez-y leur énergie."

 cc_dual.5.title: "Mandat du Ciel"
 cc_dual.5.desc: "Le savant confucéen qui possède également des dons prophétiques est une figure que la tradition classique respectait et craignait. [minister.GetName] possède les deux : la discipline méritocratique de la culture des examens et l'autorité oraculaire qui impose le silence aux cours lorsqu'il s'exprime. Le mandat du ciel, dit-on, revient à ceux qui savent lire ses dimensions administrative et mystique."
 cc_dual.5.a: "C'est la synthèse confucéenne — le savoir et la bénédiction du ciel réunis."
 cc_dual.5.b: "Leurs dons pointent vers quelque chose de plus grand — les fondations du Royaume Central."
 cc_dual.5.b.tt: "Débloque le chemin vers la quête légendaire du Royaume Central."

 cc_dual.6.title: "La loi et la lettre"
 cc_dual.6.desc: "La plupart des cours font de l'administrateur pragmatique et du juriste scripturaire des rivaux. [minister.GetName] a refusé cette rivalité. Son administration efficace est fondée sur une lecture du droit sacré comme source originelle d'une bonne gouvernance. La réforme, pour lui, n'est pas un départ de la tradition — c'est un retour à celle-ci."
 cc_dual.6.a: "La loi et les écritures ensemble constituent un fondement plus stable que l'une ou l'autre seule."
 cc_dual.6.b: "Leur investissement ministériel parle de lui-même."

 cc_dual.7.title: "L'épée réticente"
 cc_dual.7.a: "Un général qui préfère la paix reste un général. Laissez-le travailler."
 cc_dual.7.b: "Leur désir de paix doit être canalisé vers la diplomatie."

 cc_dual.8.title: "Le trésorier pieux"
 cc_dual.8.desc: "Le defterdar gère les finances de l'empire ; l'ascète cherche à s'en détacher. [minister.GetName] a concilié cette tension en traitant la gestion financière comme une discipline spirituelle : le gaspillage est un péché, l'efficacité est une vertu, et le clergé peut être satisfait précisément parce que ce ministre refuse de s'enrichir aux dépens de la foi."
 cc_dual.8.a: "Discipline financière et conviction spirituelle réunies — le royaume en bénéficie."
 cc_dual.8.b: "La satisfaction du clergé et un investissement ministériel modeste en sont les fruits concrets."

 cc_dual.9.title: "Le chevalier de Dieu"
 cc_dual.9.desc: "Dans l'idéal chevaleresque, le martial et le spirituel n'étaient pas contradictoires — ils étaient la même vertu exprimée dans des registres différents. [minister.GetName] a incarné cet idéal : un champion noble qui est également l'aumônier de la cour, dont le bras armé et l'autorité pastorale parlent le même langage de service sacré."
 cc_dual.9.a: "L'idéal chevaleresque est vivant en ce ministre. Qu'il inspire la noblesse."
 cc_dual.9.b: "Leurs dons spirituels seront mieux orientés vers le clergé et la foi."

 cc_dual.10.title: "Une crise de foi"
 cc_dual.10.desc: "[minister.GetName] se trouve dans une position impossible : l'autorité du Grand Inquisiteur exige la suppression précisément des questionnements réformistes que la théologie réformiste de [minister.GetHerHis] soutient. La contradiction est devenue visible. La cour observe pour voir quelle conviction l'emportera."
 cc_dual.10.a: "Réprimer le doute — le rôle de l'Inquisiteur exige de la certitude."
 cc_dual.10.b: "Laissons la contradiction se résoudre — les deux convictions s'effacent devant quelque chose de plus grand."
 cc_dual.10.b.tt: "Le ministre perd ses deux traits. Un Théologien de la Cour synthétiseur émerge."
 cc_dual.10.c: "Congédier [minister.GetHerHim] avant que le conflit ne s'étende."
 cc_dual.1.desc: "[minister.GetName] est une contradiction que l'époque a rendue possible : un commandant de cavalerie d'un talent véritable dont la pratique soufie a approfondi plutôt que divisé [minister.GetHerHis] compréhension de la guerre. La lame et la prière sont, entre [minister.GetHerHis] mains, les expressions d'une même discipline."
 cc_dual.4.desc: "La Réforme a redessiné simultanément la carte de la foi et de la gouvernance. [minister.GetName] se trouve à cette intersection : un opérateur parlementaire dont la théologie réformiste confère à [minister.GetHerHis] travail législatif un sérieux moral qui manque à la politique purement transactionnelle. La chambre l'a remarqué."
 cc_dual.7.desc: "[minister.GetName] est un commandant défensif qui préférerait ne pas l'être. Sa pratique d'ermite — ou son tempérament de tel — a donné à ses conseils militaires une qualité inhabituelle : elle conçoit d'excellentes fortifications parce qu'elle souhaite sincèrement qu'elles n'aient jamais à être utilisées. L'épuisement causé par la guerre l'inquiète plus que la plupart des gens."
