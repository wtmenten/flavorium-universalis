l_french:
 # === cc_bonds.40 — The Puppet Requests an Ambassador ===
 cc_bonds.40.title: "La marionnette demande un ambassadeur"
 cc_bonds.40.desc: "Le gouvernement de [bond_subj.GetName] a soumis une demande formelle pour obtenir une représentation diplomatique permanente à notre cour. Leur raisonnement est mesuré : en tant qu'État étroitement lié à nos intérêts, ils estiment mériter d'avoir voix au chapitre dans les décisions qui les affectent. C'est une demande raisonnable. C'est aussi le premier test de la nature de la relation que nous entendons instaurer."
 cc_bonds.40.a: "Établir une mission diplomatique complète. Ils méritent une représentation appropriée."
 cc_bonds.40.b: "Nommer un représentant limité. Une représentation, mais sans statut complet."
 cc_bonds.40.c: "Rejeter la demande. Notre relation ne nécessite aucune ambassade formelle."

 # === cc_bonds.41 — Puppet Economic Integration ===
 cc_bonds.41.title: "Intégration économique du vassal"
 cc_bonds.41.desc: "Nos conseillers ont produit un mémorandum sur la relation économique entre notre royaume et [bond_subj.GetName]. Trois options sont présentées. Un système monétaire unifié simplifierait considérablement la fiscalité et la comptabilité commerciale — mais le mémorandum note, en termes prudents, que la transition serait « administrativement éprouvante pour les populations locales ». Les autres options impliquent moins de perturbations et moins de contrôle."
 cc_bonds.41.a: "Imposez un système monétaire unifié. Rationalisez la relation."
 cc_bonds.41.b: "Maintenir des systèmes monétaires parallèles. Intégration sans imposition."
 cc_bonds.41.c: "Établir des accords commerciaux conjoints. Bénéfice mutuel, conditions mutuelles."

 # === cc_bonds.42 — The Puppet's Internal Faction ===
 cc_bonds.42.title: "La faction interne de la marionnette"
 cc_bonds.42.desc: "Les rapports de renseignement de [bond_subj.GetName] décrivent une division interne significative. Une faction est globalement favorable à nos intérêts ; l'autre bénéficie d'un soutien populaire plus important. Soutenir la faction pro-Couronne étendrait notre influence sur les affaires intérieures du pantin — mais l'ingérence secrète comporte des risques. Une découverte serait coûteuse politiquement. D'un autre côté, la faction populaire pourrait ne pas rester amicale."
 cc_bonds.42.a: "Soutenir secrètement la faction pro-couronne."
 cc_bonds.42.b: "Soutenir la faction populaire. Une marionnette stable nous sera plus utile."
 cc_bonds.42.c: "Ne pas s'en mêler. Les affaires internes leur appartiennent."

 # === cc_bonds.43 — Directing Puppet Foreign Policy ===
 cc_bonds.43.title: "Direction de la politique étrangère du vassal"
 cc_bonds.43.desc: "L'État fantoche de [bond_subj.GetName] a formé une alliance diplomatique qui complique notre propre position étrangère. Nous avons besoin qu'ils y mettent fin. La question est de savoir comment nous délivrons ce message — comme un ordre, comme une exigence assortie de conditions, ou par une consultation qui aboutit au même résultat tout en leur laissant le sentiment d'avoir été entendus."
 cc_bonds.43.a: "Leur ordonner de rompre l'alliance immédiatement."
 cc_bonds.43.b: "Exiger la rupture avec certaines conditions attachées."
 cc_bonds.43.c: "Consultez-les d'abord. Parvenez ensemble au même résultat."

 # === cc_bonds.44 — Puppet Succession Crisis ===
 cc_bonds.44.title: "Crise de succession du vassal"
 cc_bonds.44.desc: "La maison régnante de [bond_subj.GetName] s'est fracturée. Deux prétendants se disputent la succession — l'un est notre candidat préféré, l'autre bénéficie d'un soutien populaire plus large au sein de l'État fantoche. Notre candidat préféré ne peut gagner sans nous. Nous pouvons imposer le résultat que nous souhaitons. La question est de savoir si l'imposer est le bon choix."
 cc_bonds.44.a: "Installez notre candidat préféré par la force. Sécurisez la succession."
 cc_bonds.44.b: "Soutenir l'héritier populaire. Laissons le peuple de la marionnette choisir."
 cc_bonds.44.c: "Négociez un processus supervisé. Un compromis que les deux parties peuvent accepter."

 # === cc_bonds.45 — Puppet Requests Military Expansion ===
 cc_bonds.45.title: "Le vassal demande une expansion militaire"
 cc_bonds.45.desc: "Le gouvernement de [bond_subj.GetName] a soumis une proposition visant à accroître ses forces permanentes. Ils invoquent des préoccupations liées à la sécurité des frontières et soutiennent qu'une armée plus forte fait d'eux un partenaire plus précieux pour nous. Ils n'ont pas tort — mais un vassal plus fort est aussi un vassal plus indépendant. La proposition inclut une demande d'assistance financière."
 cc_bonds.45.a: "Approuver l'expansion et fournir le financement."
 cc_bonds.45.b: "Approuver l'expansion. Ils peuvent la financer eux-mêmes."
 cc_bonds.45.c: "Rejeter la demande. Leurs forces actuelles sont suffisantes."

 # === cc_bonds.46 — The Loyal Puppet's Request ===
 cc_bonds.46.title: "La requête de la marionnette loyale"
 cc_bonds.46.desc: "Le gouvernement de [bond_subj.GetName] a envoyé une lettre personnelle — pas une pétition formelle, ni un mémorandum diplomatique, mais une lettre. Ils y décrivent leur engagement continu envers notre relation, mentionnent plusieurs sacrifices récents consentis en notre nom, et demandent quelque chose en retour. La requête est modeste. Ce qui importe est de savoir si nous choisissons d'y répondre favorablement."
 cc_bonds.46.a: "Accédez généreusement à la requête. La loyauté mérite d'être reconnue."
 cc_bonds.46.b: "Profitons de ce moment de bonne volonté pour demander quelque chose en retour."
