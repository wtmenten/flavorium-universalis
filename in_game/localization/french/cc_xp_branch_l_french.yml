l_french:
 # ============================================================
 # Cabinet Experience — ladder branch points
 #
 # One entry per event in in_game/events/cc_xp_branch_events.txt (generated).
 # Each fires when a minister has earned a rung that offers two destinations.
 # Option text uses [ShowTraitName('x')] so the player can hover the actual trait
 # and read its real modifiers instead of trusting this copy to restate them.
 #
 # Saved scopes drop the scope: prefix in loc. See docs/scripting-gotchas.md.
 # ============================================================

 # --- cc_xp.20  fiscal: loyal_steward -> prosperity_planner | treasury_enforcer
 cc_xp.20.title: "Le registre de l'intendant"
 cc_xp.20.desc: "[cc_xp_subject.GetName] a tenu les livres de la couronne assez longtemps pour savoir où va réellement l'argent, et a commencé à le dire tout haut. Il y a une proposition sur la table, et une tout autre derrière elle.\n\nLa première est de dépenser : placer le surplus là où il rapportera le triple, et accepter un certain gaspillage comme prix de la croissance. La seconde est de colmater les fuites. [cc_xp_subject.GetName] peut nommer chaque bureau qui coûte plus qu'il ne rapporte, et souhaiterait l'autorisation de le dire publiquement."
 cc_xp.20.a: "Investissez. Laissez-les construire. ([ShowTraitName('prosperity_planner')])"
 cc_xp.20.b: "Audit. Laissez-les couper. ([ShowTraitName('treasury_enforcer')])"

 # --- cc_xp.21  learning: progressive_rationalist -> enlightenment_herald | humanist_philosopher
 cc_xp.21.title: "Une question d'audience"
 cc_xp.21.desc: "[cc_xp_subject.GetName] a dépassé les lectures qui l'ont formé, et la cour l'a remarqué. Reste maintenant la question de savoir quoi en faire.\n\nIls pourraient porter l'argument vers l'extérieur : pamphlets, correspondance, le travail patient de convaincre des gens qui n'ont pas demandé à être convaincus. Ou ils pourraient se tourner vers l'intérieur, vers la tâche plus lente et moins populaire de tout mettre au clair avant même de s'exprimer."
 cc_xp.21.a: "Laissez-les prêcher. ([ShowTraitName('enlightenment_herald')])"
 cc_xp.21.b: "Laissez-les réfléchir. ([ShowTraitName('humanist_philosopher')])"

 # --- cc_xp.22  law: efficiency_administrator -> estate_guardian | regional_magnate
 cc_xp.22.title: "Où l'autorité devrait siéger"
 cc_xp.22.desc: "[cc_xp_subject.GetName] a passé des années à faire fonctionner les rouages du royaume, et en est arrivé à une conclusion sur qui devrait actionner la manivelle.\n\nUne réponse est les états : anciens, lents et durables, avec des obligations réciproques. L'autre est les provinces : les grands seigneurs locaux qui détiennent déjà le terrain et n'ont besoin que de la bénédiction de la couronne pour le détenir formellement. Les deux sont synonymes de stabilité. Mais ce n'est pas la même stabilité."
 cc_xp.22.a: "Les états conservent leurs droits. ([ShowTraitName('estate_guardian')])"
 cc_xp.22.b: "Les provinces conservent leurs seigneurs. ([ShowTraitName('regional_magnate')])"

 # --- cc_xp.23  integration: seasoned_integrator -> master_integrator | iron_integrator
 cc_xp.23.title: "Le rythme d'incorporation"
 cc_xp.23.desc: "Intégrer correctement de nouvelles terres au royaume est un travail lent, et [cc_xp_subject.GetName] en a assez fait pour que son opinion sur la vitesse à laquelle cela devrait être fait soit prise en compte.\n\nFait avec patience, cela tient : des hommes locaux dans des bureaux locaux, les anciennes coutumes maintenues là où elles ne coûtent rien. Fait rapidement, cela tient aussi, pendant un temps, et le royaume est entier bien plus tôt. [cc_xp_subject.GetName] est prêt à le faire de l'une ou l'autre manière et aimerait savoir laquelle."
 cc_xp.23.a: "Patiemment. Ce qui est joint correctement reste joint. ([ShowTraitName('master_integrator')])"
 cc_xp.23.b: "Rapidement. Nous n'avons pas une génération à perdre. ([ShowTraitName('iron_integrator')])"

 # --- cc_xp.24  envoy: tentative_envoy -> tactful_envoy | diplomatic_attache
 cc_xp.24.title: "L'envoyé trouve ses marques"
 cc_xp.24.desc: "L'hésitation a disparu. [cc_xp_subject.GetName] a assisté à suffisamment de négociations pour cesser de s'excuser d'être dans la pièce, et deux diplomates très différents apparaissent dans ce qu'il en reste.\n\nL'un travaille la salle : lit l'ambiance, sait quand ne rien dire, et laisse chaque cour un peu mieux disposée qu'elle ne l'était. L'autre travaille le document, là où les concessions sont réellement enfouies, et a développé un appétit inquiétant pour les clauses."
 cc_xp.24.a: "Envoyez-les à la table des négociations. ([ShowTraitName('tactful_envoy')])"
 cc_xp.24.b: "Envoyez-les aux archives. ([ShowTraitName('diplomatic_attache')])"

 # --- cc_xp.25  trade: merchant_syndic -> mercantilist_official | free_market_advocate
 cc_xp.25.title: "À qui appartient le commerce"
 cc_xp.25.desc: "[cc_xp_subject.GetName] a gravi les échelons via les maisons de commerce et n'a jamais totalement cessé de penser comme un marchand, ce qui est précisément pourquoi l'argument qu'ils avancent aujourd'hui a du poids.\n\nSoit le commerce est un instrument de la couronne, devant être affrété, dirigé et taxé là où il sera le plus utile, soit c'est une chose qui croît mieux quand la couronne le laisse faire et se contente d'une part plus petite d'une somme plus importante."
 cc_xp.25.a: "Le commerce sert la couronne. ([ShowTraitName('mercantilist_official')])"
 cc_xp.25.b: "Le commerce se sert lui-même, et nous avec. ([ShowTraitName('free_market_advocate')])"

 # --- cc_xp.26  command: tactical_advisor -> offensive_strategist | defensive_commander
 cc_xp.26.title: "Une doctrine pour l'armée"
 cc_xp.26.desc: "[cc_xp_subject.GetName] a cessé de simplement relayer les opinions des généraux pour commencer à avoir les siennes. L'état-major a été prié de se préparer pour la prochaine guerre ; la question est de savoir pour quelle guerre ils doivent se préparer.\n\nUn plan suppose que nous choisissions le moment et frappions les premiers. L'autre suppose que nous n'aurons pas le choix, et dépense la même somme en murs, en dépôts et dans la tâche ingrate de ne pas perdre."
 cc_xp.26.a: "Nous frapperons les premiers. ([ShowTraitName('offensive_strategist')])"
 cc_xp.26.b: "Nous ne nous laisserons pas surprendre. ([ShowTraitName('defensive_commander')])"

 # --- cc_xp.27  command: offensive_strategist -> supreme_commander | continental_marshal
 cc_xp.27.title: "La portée d'une réputation"
 cc_xp.27.desc: "La doctrine offensive a été justifiée assez souvent pour que [cc_xp_subject.GetName] ne plaide plus en sa faveur, mais se contente de l'appliquer. Ce qui est décidé maintenant, c'est l'étendue du pouvoir qu'on lui accorde.\n\nIls pourraient être placés à la tête de tout l'appareil militaire, toutes branches confondues, avec l'autorité nécessaire pour réformer ce qu'ils trouvent. Ou ils pourraient rester là où ils ont été indéniablement excellents, avec l'armée de campagne et les ressources pour en faire la meilleure au monde."
 cc_xp.27.a: "Donnez-leur tout. ([ShowTraitName('supreme_commander')])"
 cc_xp.27.b: "Donnez-leur l'armée. ([ShowTraitName('continental_marshal')])"

 # --- cc_xp.28  command: defensive_commander -> supreme_commander | continental_marshal
 cc_xp.28.title: "La récompense pour ne pas avoir perdu"
 cc_xp.28.desc: "Il est difficile de prouver la valeur d'une guerre qui n'a pas eu lieu, mais les forts que [cc_xp_subject.GetName] a bâtis tiennent bon et les frontières qu'ils gardaient sont calmes. La cour a conclu à contrecœur que ce n'était pas de la chance.\n\nIls peuvent être promus à la tête de l'ensemble de l'appareil militaire, avec le mandat d'appliquer la même rigueur partout. Ou on peut leur confier l'armée de campagne elle-même, selon la théorie qu'un commandant qui comprend le terrain est gaspillé derrière un bureau."
 cc_xp.28.a: "Élevez-les au-dessus de tout. ([ShowTraitName('supreme_commander')])"
 cc_xp.28.b: "Donnez-leur l'armée. ([ShowTraitName('continental_marshal')])"
