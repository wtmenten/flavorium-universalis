 # Elite enclave / palatinate modifiers
 STATIC_MODIFIER_NAME_cc_enclave_court_favour: "Faveur de la noblesse à la cour"
 STATIC_MODIFIER_DESC_cc_enclave_court_favour: "Les familles dirigeantes de l'enclave ont été honorées de postes à la cour, liant leur loyauté à la couronne."
 STATIC_MODIFIER_NAME_cc_palatinate_tournament: "Tournoi du Palatinat"
 STATIC_MODIFIER_DESC_cc_palatinate_tournament: "Le grand tournoi du comte palatin a propagé la renommée du royaume aux quatre vents."
 STATIC_MODIFIER_NAME_cc_enclave_grand_tournament: "Grand Tournoi"
 STATIC_MODIFIER_DESC_cc_enclave_grand_tournament: "Un grand tournoi de la noblesse montée a perfectionné la cavalerie du royaume et poli le prestige de la couronne."
 STATIC_MODIFIER_NAME_cc_noble_levy_call: "Levée noble"
 STATIC_MODIFIER_DESC_cc_noble_levy_call: "La cavalerie noble a répondu à l'appel aux armes — des escadrons de cavaliers cuirassés, entraînés et enthousiastes, chevauchent sous notre bannière."
 STATIC_MODIFIER_NAME_cc_palatinate_dynastic_prestige: "Lien dynastique"
 STATIC_MODIFIER_DESC_cc_palatinate_dynastic_prestige: "La lignée du palatin s'est entrelacée à la dignité de notre dynastie, apportant prestige et légitimité à l'ensemble de la maison."
 STATIC_MODIFIER_NAME_cc_noble_feud: "Querelle noble"
 STATIC_MODIFIER_DESC_cc_noble_feud: "Une querelle amère entre la haute noblesse s'envenime sans contrôle, entamant le prestige, effritant la discipline et aigrisant les états."

 STATIC_MODIFIER_NAME_cc_fra_lowlands_ambition: "Ambition des Pays-Bas"
 STATIC_MODIFIER_NAME_cc_tur_no_colonization: "Désintérêt ottoman pour la colonisation"
 STATIC_MODIFIER_NAME_cc_mam_foreign_rule: "Caste militaire étrangère"
 STATIC_MODIFIER_NAME_cc_mam_military_strain: "Fragilité militaire"
 STATIC_MODIFIER_NAME_cc_ai_personality_guard: "Délai de changement de personnalité de l'IA"

 # Hundred Years War modifiers
 STATIC_MODIFIER_NAME_cc_fra_hyw_feudal_strain: "Tension de guerre féodale"
 STATIC_MODIFIER_DESC_cc_fra_hyw_feudal_strain: "La longue guerre contre l'Angleterre a ancré la domination noble sur les levées françaises et a mis à mal la loyauté des états, s'étiolant sur un siècle de conflit."
 STATIC_MODIFIER_NAME_cc_fra_hyw_war_defeat: "L'ombre de la défaite"
 STATIC_MODIFIER_DESC_cc_fra_hyw_war_defeat: "Une défaite récente a enhardi la noblesse, augmenté la lassitude de la guerre et rendu la conscription des paysans plus difficile. S'accumule avec d'autres défaites."
 STATIC_MODIFIER_NAME_cc_fra_hyw_war_victory: "Confiance du vainqueur"
 STATIC_MODIFIER_DESC_cc_fra_hyw_war_victory: "Une victoire récente a remonté le moral et enhardi le recrutement des paysans. Compense partiellement les défaites accumulées."
 STATIC_MODIFIER_NAME_cc_fra_hyw_noble_sacrifice: "Sacrifice noble"
 STATIC_MODIFIER_DESC_cc_fra_hyw_noble_sacrifice: "Le roi a exigé que la noblesse fournisse des levées supplémentaires suite à la défaite. Ils s'y plient — mais au prix de leur bonne volonté."
 STATIC_MODIFIER_NAME_cc_eng_hyw_martial_tradition: "Tradition martiale anglaise"
 STATIC_MODIFIER_DESC_cc_eng_hyw_martial_tradition: "La culture noble anglaise et la tradition du longbow donnent au royaume un avantage martial au début de la guerre de Cent Ans, lequel s'estompera sur un siècle."
 STATIC_MODIFIER_NAME_cc_eng_hyw_ascendancy: "Ascendant anglais"
 STATIC_MODIFIER_DESC_cc_eng_hyw_ascendancy: "Une victoire récente a confirmé la suprématie martiale anglaise, boostant les levées nobiliaires, les effectifs et le moral."
 STATIC_MODIFIER_NAME_cc_eng_hyw_setback: "Revers anglais"
 STATIC_MODIFIER_DESC_cc_eng_hyw_setback: "Une défaite a sapé la confiance anglaise, réduisant les effectifs, le moral et la satisfaction de la noblesse."
 STATIC_MODIFIER_NAME_cc_fra_appanage_purge_resentment: "Ressentiment lié à l'apanage"
 STATIC_MODIFIER_DESC_cc_fra_appanage_purge_resentment: "Le remplacement forcé de la maison régnante a laissé des blessures profondes. Les levées nobiliaires sont réduites et la satisfaction des domaines reste faible."
 STATIC_MODIFIER_NAME_cc_fra_purge_noble_unease: "Inquiétude noble"
 STATIC_MODIFIER_DESC_cc_fra_purge_noble_unease: "La démonstration de force de Paris contre un apanage a perturbé la noblesse dans son ensemble. Les États observent attentivement."

 STATIC_MODIFIER_NAME_cc_colonial_legitimacy_era: "Âge de la Légitimité Coloniale"
 STATIC_MODIFIER_DESC_cc_colonial_legitimacy_era: "L'octroi d'une représentation formelle à une colonie a trouvé un écho dans tout le monde occidental — attirant les colons, améliorant la loyauté des sujets et donnant à la Couronne une réputation de gouvernance mesurée."
 STATIC_MODIFIER_NAME_cc_colonial_supremecy_era: "Âge de la Suprématie Coloniale"
 STATIC_MODIFIER_DESC_cc_colonial_supremecy_era: "Pourquoi accorder une représentation à des créatures aussi pathétiques."

