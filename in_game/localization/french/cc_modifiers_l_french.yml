 MODIFIER_TYPE_NAME_cc_shadow_court_bureau_impact_modifier: "Efficacité de la Cour de l'ombre"
 MODIFIER_TYPE_DESC_cc_shadow_court_bureau_impact_modifier: "Modifie l'efficacité de la bureaucratie de la Cour des Ombres, ajustant sa projection de puissance et ses bonus diplomatiques."

 MODIFIER_TYPE_NAME_cc_royal_trading_bureau_impact_modifier: "Efficacité du bureau royal du commerce"
 MODIFIER_TYPE_DESC_cc_royal_trading_bureau_impact_modifier: "Modifie l'efficacité du Bureau commercial royal, ajustant ses revenus fiscaux et ses bonus de capacité maritime."

 MODIFIER_TYPE_NAME_cc_scholarly_concordat_impact_modifier: "Efficacité du concordat savant"
 MODIFIER_TYPE_DESC_cc_scholarly_concordat_impact_modifier: "Modifie l'efficacité du Concordat savant, ajustant sa vitesse de recherche et ses bonus de croissance institutionnelle."

 MODIFIER_TYPE_DESC_monthly_towards_pru_hre: "Dérive mensuelle vers l'interprétation prussienne des principes constitutionnels du Saint Empire romain germanique."
 MODIFIER_TYPE_DESC_monthly_towards_pru_empire: "Dérive mensuelle vers l'établissement d'un empire de style prussien par le biais d'une réforme constitutionnelle."

 # ============================================================
 # SUBJECT BOND MODIFIERS — Colonial Nation (cc_bonds.12, cc_bonds.14)
 # ============================================================

 STATIC_MODIFIER_NAME_cc_governor_unrest_reform: "Réforme fiscale coloniale"
 STATIC_MODIFIER_DESC_cc_governor_unrest_reform: "Les enquêteurs dépêchés pour éradiquer la corruption dans l'appareil fiscal colonial ont perturbé les flux de revenus existants. Les revenus de frappe et les recettes fiscales en pâtissent à court terme le temps que les réformes s'installent."

 STATIC_MODIFIER_NAME_cc_governor_unrest_appeasement: "Agitation coloniale — Apaisée"
 STATIC_MODIFIER_DESC_cc_governor_unrest_appeasement: "Des promesses et des cadeaux ont acheté un calme temporaire dans la colonie, mais les griefs sous-jacents s'enveniment. Le sentiment rebelle continue de croître."

 STATIC_MODIFIER_NAME_cc_colonial_representative_strain: "Organes de représentation coloniaux"
 STATIC_MODIFIER_DESC_cc_colonial_representative_strain: "L'établissement d'institutions représentatives formelles pour la colonie nécessite de naviguer entre des traditions juridiques concurrentes et d'étendre la capacité administrative. Les processus législatifs ralentissent et les coûts bureaucratiques augmentent tandis que les nouveaux organes trouvent leurs marques."

 # ============================================================
 # OPINION MODIFIER NAMES — Colonial Bond
 # ============================================================

 cc_overlord_unrest_response: "Gouverneur remplacé sans motif"

 # ============================================================
 # Colonial Consolidation & Border Friction
 # ============================================================

 STATIC_MODIFIER_NAME_cc_col_viceroyalty: "Siège vice-royal"
 STATIC_MODIFIER_DESC_cc_col_viceroyalty: "Élevé au rang de vice-royauté gouvernant un domaine colonial consolidé, ce siège attire colons, commerce et prestige."
 STATIC_MODIFIER_NAME_cc_col_unified_administration: "Administration coloniale unifiée"
 STATIC_MODIFIER_DESC_cc_col_unified_administration: "La fusion de deux gouvernements coloniaux overlapping a rationalisé la domination d'outre-mer de la Couronne."
 STATIC_MODIFIER_NAME_cc_col_colonial_coordination: "Coordination coloniale"
 STATIC_MODIFIER_DESC_cc_col_colonial_coordination: "Un conseil de coordination commun permet aux colonies voisines de coopérer sans renoncer à leurs sièges respectifs."
 STATIC_MODIFIER_NAME_cc_col_frontier_tension: "Frontière contestée"
 STATIC_MODIFIER_DESC_cc_col_frontier_tension: "Une querelle frontalière non résolue sape la prospérité et attise l'agitation le long de la ligne coloniale."
 STATIC_MODIFIER_NAME_cc_col_settled_frontier: "Frontière colonisée"
 STATIC_MODIFIER_DESC_cc_col_settled_frontier: "Une frontière arpentée et reconnue a apporté le calme et la confiance à la colonie."
 STATIC_MODIFIER_NAME_cc_col_coerced_labor_regime: "Régime de travail forcé"
 STATIC_MODIFIER_DESC_cc_col_coerced_labor_regime: "Un système ancré de travail forcé enrichit la colonie au prix d'un coût durable pour sa cohésion."

 STATIC_MODIFIER_NAME_cc_col_plantation_economy: "Économie de plantation"
 STATIC_MODIFIER_DESC_cc_col_plantation_economy: "Les plantations de cultures commerciales stimulent la production, bien que le travail qu'elles exigent engendre un mécontentement local."
 STATIC_MODIFIER_NAME_cc_col_encomienda_labor: "Travail d'Encomienda"
 STATIC_MODIFIER_DESC_cc_col_encomienda_labor: "Le travail forcé des indigènes augmente les revenus de la colonie tout en opprimant sa population."
 STATIC_MODIFIER_NAME_cc_col_mission_district: "District des missions"
 STATIC_MODIFIER_DESC_cc_col_mission_district: "Un établissement axé sur la conversion qui pacifie la frontière et stabilise la colonie."

 # ============================================================
 # BALANCE OF POWER
 # ============================================================
 STATIC_MODIFIER_NAME_cc_bop_defector: "Défecteur de bloc"
 STATIC_MODIFIER_DESC_cc_bop_defector: "Ayant abandonné son alignement, cette cour est considérée comme infidèle par les chancelleries d'Europe."
 STATIC_MODIFIER_NAME_cc_bop_coalition_partner: "Nouveau partenaire de coalition"
 STATIC_MODIFIER_DESC_cc_bop_coalition_partner: "Fraîchement inscrit à la coalition d'équilibrage, porté par la promesse d'un objectif commun."
 STATIC_MODIFIER_NAME_cc_bop_ascendant_confidence: "Confiance ascendante"
 STATIC_MODIFIER_DESC_cc_bop_ascendant_confidence: "L'élan s'accentue derrière l'hégémon aspirant et tous ceux qui marchent à ses côtés."
 STATIC_MODIFIER_NAME_cc_bop_coalition_solidarity: "Solidarité de la coalition"
 STATIC_MODIFIER_DESC_cc_bop_coalition_solidarity: "Une coalition unie reste résolue face à toute tentative de domination du continent."
 STATIC_MODIFIER_NAME_cc_bop_coalition_wavering: "Coalition vacillante"
 STATIC_MODIFIER_DESC_cc_bop_coalition_wavering: "Le doute et la discorde se propagent au sein d'une coalition qui perd ses moyens."
 STATIC_MODIFIER_NAME_cc_bop_bought_ally: "Subventions étrangères"
 STATIC_MODIFIER_DESC_cc_bop_bought_ally: "L'or étranger remplit le trésor et apporte avec lui des conseils de neutralité et d'apaisement."
 STATIC_MODIFIER_NAME_cc_bop_hegemonic_overstretch: "Surextension hégémonique"
 STATIC_MODIFIER_DESC_cc_bop_hegemonic_overstretch: "La quête de la dominance a épuisé nos armées et exacerbé les craintes de tous nos voisins."
 STATIC_MODIFIER_NAME_cc_bop_subsidized: "Subventions de la coalition"
 STATIC_MODIFIER_DESC_cc_bop_subsidized: "Les caisses de guerre ouvertes par la coalition renforcent notre puissance face à la puissance prépondérante."
 STATIC_MODIFIER_NAME_cc_bop_subsidy_strain: "Pression sur le trésor de guerre"
 STATIC_MODIFIER_DESC_cc_bop_subsidy_strain: "Le financement de la coalition a vidé nos coffres — le trésor s'épuise, la monnaie se dévalue et notre propre cour doit se serrer la ceinture."
 STATIC_MODIFIER_NAME_cc_bop_war_footing: "En état de guerre"
 STATIC_MODIFIER_DESC_cc_bop_war_footing: "Emportées par le grand conflit, nos armées fourragent librement à travers le théâtre d'opérations et marchent sans crainte du manque."
 STATIC_MODIFIER_NAME_cc_bop_balancer_prestige: "Équilibrateur de l'Europe"
 STATIC_MODIFIER_DESC_cc_bop_balancer_prestige: "Reconnu comme l'arbitre indispensable dont le poids décide de l'équilibre du continent."
 STATIC_MODIFIER_NAME_cc_bop_master_of_europe: "Maître de l'Europe"
 STATIC_MODIFIER_DESC_cc_bop_master_of_europe: "L'équilibre est rompu et nous dominons le continent — un nouveau Charlemagne, un nouveau César."
 STATIC_MODIFIER_NAME_cc_bop_humbled_power: "Puissance humiliée"
 STATIC_MODIFIER_DESC_cc_bop_humbled_power: "Nous avons échoué à arrêter l'hégémon, et le souvenir de cet échec accompagne nos envoyés dans toutes les cours."
 STATIC_MODIFIER_NAME_cc_bop_scourge_of_the_west: "Fléau de l'Ouest"
 STATIC_MODIFIER_DESC_cc_bop_scourge_of_the_west: "L'ancien ordre occidental n'a pu nous retenir ; nos armées affluent à travers ses frontières."
 STATIC_MODIFIER_NAME_cc_bop_western_bulwark: "Rempart occidental"
 STATIC_MODIFIER_DESC_cc_bop_western_bulwark: "Malmené mais pas brisé, l'ouest se prépare à endurer et à reconstruire."
 STATIC_MODIFIER_NAME_cc_bop_concert_of_europe: "Concert de l'Europe"
 STATIC_MODIFIER_DESC_cc_bop_concert_of_europe: "Un ordre diplomatique durable, soutenu par des congrès et la volonté commune de maintenir la paix."
 STATIC_MODIFIER_NAME_cc_bop_revolutionary_upheaval: "Bouleversement révolutionnaire"
 STATIC_MODIFIER_DESC_cc_bop_revolutionary_upheaval: "L'ancien ordre est balayé alors que la révolution brise l'équilibre fragile des rois."
 STATIC_MODIFIER_NAME_cc_bop_scorched_earth: "Enlisés dans une terre brûlée"
 STATIC_MODIFIER_DESC_cc_bop_scorched_earth: "L'ennemi brûle le pays devant nous ; nos colonnes s'affament et s'amenuisent dans un désert qu'ils ont eux-mêmes créé."
 STATIC_MODIFIER_NAME_cc_bop_continental_blockade: "Blocus continental"
 STATIC_MODIFIER_DESC_cc_bop_continental_blockade: "Le décret de l'hégémon exclut nos marchands des marchés du continent, étranglant le commerce et nourrissant le mécontentement."
 STATIC_MODIFIER_NAME_cc_bop_levee_en_masse: "La nation en armes"
 STATIC_MODIFIER_DESC_cc_bop_levee_en_masse: "Un peuple entier mobilisé — main-d'œuvre et ardeur en abondance, bien que la levée mette à rude épreuve les liens de l'ancien ordre."
 STATIC_MODIFIER_NAME_cc_bop_arbiter_of_europe: "Arbitre de l'Europe"
 STATIC_MODIFIER_DESC_cc_bop_arbiter_of_europe: "Nous avons maintenu la coalition et avons tenu en échec le prétendant au titre de maître du continent. Désormais, l'Europe nous voit comme le garant fiable de sa paix — notre parole a du poids dans toutes les chancelleries, et nos marchands prospèrent sous l'ordre que nous maintenons."
 STATIC_MODIFIER_NAME_cc_bop_aspiring_hegemon: "L'hégémon aspirant"
 STATIC_MODIFIER_DESC_cc_bop_aspiring_hegemon: "Après avoir maîtrisé la coalition qui a humilié un hégémon potentiel, nous avons appris comment un tel bloc se construit — et se brise. Les armées et l'ambition qui ont sauvé l'équilibre se tournent désormais vers notre propre prééminence."
 STATIC_MODIFIER_NAME_cc_bop_vindicated_balancer: "L'équilibriste justifié"
 STATIC_MODIFIER_DESC_cc_bop_vindicated_balancer: "Nous avons tenu la balance de l'Europe et, lorsqu'une puissance a trop abusé de son pouvoir, nous l'avons terrassée. La foi de la coalition n'était pas mal placée, et le continent se souvient de qui l'a libéré."
 STATIC_MODIFIER_NAME_cc_bop_cut_down_to_size: "Remettre à sa place"
 STATIC_MODIFIER_DESC_cc_bop_cut_down_to_size: "Nous avons aspiré à la maîtrise et avons été brisés par l'union de nos rivaux. Renvoyés au rang de puissances ordinaires, nos armées décimées et notre nom terni, nous devons reconstruire sur des bases plus modestes."
 STATIC_MODIFIER_NAME_cc_bop_faded_ambition: "Ambition déclinante"
 STATIC_MODIFIER_DESC_cc_bop_faded_ambition: "Notre moment est venu et reparti. Nous n'avons jamais porté le coup décisif et, pendant que nous hésitions, le monde a continué d'avancer sans nous."
 STATIC_MODIFIER_NAME_cc_bop_risen_in_shadow: "Surgi dans l'ombre"
 STATIC_MODIFIER_DESC_cc_bop_risen_in_shadow: "Tandis que l'aspirant s'épuisait à chercher une maîtrise qu'il n'a jamais saisie, nous avons grandi discrètement dans son ombre — et nous lui avons survécu."
 STATIC_MODIFIER_NAME_cc_bop_coalition_solidarity_empowered: "Solidarité renforcée"
 STATIC_MODIFIER_DESC_cc_bop_coalition_solidarity_empowered: "Une coalition qui s'est dotée de véritables moyens d'action — défense mutuelle et pouvoirs permanents — lie bien plus solidement que n'importe quelle alliance sur papier."
 STATIC_MODIFIER_NAME_cc_bop_war_subsidies: "Caisse de guerre"
 STATIC_MODIFIER_DESC_cc_bop_war_subsidies: "Des subventions dispersées à l'avance parmi des alliés réticents sont prêtes à réduire de moitié le coût de notre prochain appel aux armes."
 STATIC_MODIFIER_NAME_cc_bop_dragged_to_war: "entraîné dans la guerre"
 STATIC_MODIFIER_DESC_cc_bop_dragged_to_war: "Entraînés dans une guerre que nous n'avons pas choisie, nos soldats marchent avec amertume et nos coffres saignent pour l'ambition d'un autre."

 # --- Coalition parliament actions ---
 STATIC_MODIFIER_NAME_cc_bop_chaumont_pledge: "Traité de Chaumont"
 STATIC_MODIFIER_DESC_cc_bop_chaumont_pledge: "Liée par l'engagement solennel de ne conclure aucune paix séparée, la coalition reste ferme et continue de combattre comme un seul homme."
 STATIC_MODIFIER_NAME_cc_bop_combined_command: "L'armée pragmatique"
 STATIC_MODIFIER_DESC_cc_bop_combined_command: "Un commandement allié unifié transforme une coalition d'armées en un instrument de guerre unique."
 STATIC_MODIFIER_NAME_cc_bop_war_aims_committed: "Objectifs de guerre convenus"
 STATIC_MODIFIER_DESC_cc_bop_war_aims_committed: "Le butin de la victoire étant déjà réparti, chaque cour a intérêt à mener la guerre jusqu'au bout."

 # --- Concert of Europe ---
 STATIC_MODIFIER_NAME_cc_concert_member: "Siège au Concert"
 STATIC_MODIFIER_DESC_cc_concert_member: "Une place parmi les grandes puissances qui gouvernent la paix de l'Europe donne un poids réel à notre diplomatie."
 STATIC_MODIFIER_NAME_cc_concert_intervention_mandate: "Mandat d'Intervention"
 STATIC_MODIFIER_DESC_cc_concert_intervention_mandate: "Agissant avec la sanction du Concert, nous maintenons l'ordre établi d'une main libre et ferme."
 STATIC_MODIFIER_NAME_cc_concert_sphere_of_influence: "Sphère d'influence"
 STATIC_MODIFIER_DESC_cc_concert_sphere_of_influence: "Les puissances ont reconnu notre sphère — une récolte tranquille de commerce et de prestige découle de l'accord."

 # --- Concert parliament participation (modifier types) ---
 MODIFIER_TYPE_NAME_cc_concert_president_can_participate_in_parliament: "Président du Congrès"
 MODIFIER_TYPE_DESC_cc_concert_president_can_participate_in_parliament: "Le président du Concert siège et vote au Congrès des Puissances."
 MODIFIER_TYPE_NAME_cc_concert_seat_can_participate_in_parliament: "Membre du Congrès"
 MODIFIER_TYPE_DESC_cc_concert_seat_can_participate_in_parliament: "Un membre du Concert siège et vote au Congrès des Puissances."

 MODIFIER_TYPE_NAME_cc_bop_chief_balancer_can_participate_in_parliament: "Équilibreur en chef au Congrès"
 MODIFIER_TYPE_DESC_cc_bop_chief_balancer_can_participate_in_parliament: "L'Équilibreur en chef dépose des motions et vote au Congrès de la Coalition, son vote étant pondéré par sa base économique et son statut de grande puissance."
 MODIFIER_TYPE_NAME_cc_bop_coalition_seat_can_participate_in_parliament: "Membre du Congrès"
 MODIFIER_TYPE_DESC_cc_bop_coalition_seat_can_participate_in_parliament: "Un membre de la Coalition vote au Congrès, son vote étant pondéré par sa base économique et son statut de grande puissance."
 STATIC_MODIFIER_NAME_cc_bop_hegemons_client: "Client de l'hégémon"
 STATIC_MODIFIER_DESC_cc_bop_hegemons_client: "Nous nous sommes rangés du côté du vainqueur. Aucun voisin n'ose faire valoir une revendication contre nous, et une cour qui n'a pas besoin d'acheter sa sécurité peut se permettre de dépenser dans d'autres domaines."
 STATIC_MODIFIER_NAME_cc_bop_unaligned_broker: "La main libre"
 STATIC_MODIFIER_DESC_cc_bop_unaligned_broker: "Nous avons été reçus par les deux pôles sans prêter serment à aucun d'eux. Une chancellerie qui ne doit rien est une chancellerie que toutes les cours continueront de recevoir."
 STATIC_MODIFIER_NAME_cc_minister_slighted: "Offensé"
 STATIC_MODIFIER_DESC_cc_minister_slighted: "La couronne a tranché contre eux et ils ne l'ont pas oublié. Ils servent, correctement, mais sans plus."
 STATIC_MODIFIER_NAME_cc_minister_favoured: "Favorisé"
 STATIC_MODIFIER_DESC_cc_minister_favoured: "La couronne a pris leur parti devant toute la cour. Ils ont l'intention de prouver que c'était la bonne décision."
 STATIC_MODIFIER_NAME_cc_minister_reconciled: "Réconcilié"
 STATIC_MODIFIER_DESC_cc_minister_reconciled: "La querelle a été réglée par la main même de la couronne. Une cour qui fait confiance à son arbitre fonctionne plus sereinement."
 STATIC_MODIFIER_NAME_cc_minister_cabal_bond: "Lien de cabale"
 STATIC_MODIFIER_DESC_cc_minister_cabal_bond: "Un pacte avec un collègue ministre, formellement conclu. Efficaces ensemble, et plus difficiles à monter les uns contre les autres."
 STATIC_MODIFIER_NAME_cc_minister_defied_modifier: "Défié"
 STATIC_MODIFIER_DESC_cc_minister_defied_modifier: "Leur demande a été catégoriquement refusée. Le général obéit, et se souvient de qui l'a contré."
 STATIC_MODIFIER_NAME_cc_aor_counter_revolutionary_crown: "La couronne qui a tenu"
 STATIC_MODIFIER_DESC_cc_aor_counter_revolutionary_crown: "Nos sujets sont restés à nos côtés durant l'année qui a anéanti d'autres empires, et chaque cour et chaque domaine en a pris note."
 STATIC_MODIFIER_NAME_cc_aor_martial_law: "Loi martiale"
 STATIC_MODIFIER_DESC_cc_aor_martial_law: "La province est tenue par sa garnison plutôt que par le consentement de ses habitants. L'ordre n'est pas en question ; c'est la bonne volonté qui l'est."
 STATIC_MODIFIER_NAME_cc_aor_settled_grievance: "Grief réglé"
 STATIC_MODIFIER_DESC_cc_aor_settled_grievance: "Les concessions sont arrivées tard et ont coûté plus cher qu'elles n'auraient coûté autrefois, mais elles ont été faites et elles ont été crues."
 STATIC_MODIFIER_NAME_cc_aor_orderly_separation: "Une séparation ordonnée"
 STATIC_MODIFIER_DESC_cc_aor_orderly_separation: "La séparation a été gérée plutôt que combattue. Cela nous a coûté notre prestige mais nous a épargné une guerre."
 STATIC_MODIFIER_NAME_cc_aor_dependency_advocacy: "Soutenu à l'étranger"
 STATIC_MODIFIER_DESC_cc_aor_dependency_advocacy: "Une maison loyale se porte garante de notre parole dans des cours où nos propres envoyés ne seraient pas crus."
 STATIC_MODIFIER_NAME_cc_aor_frontier_war_effort: "Une guerre frontalière"
 STATIC_MODIFIER_DESC_cc_aor_frontier_war_effort: "Nous écartons un commandant qui a appris son métier à notre service et qui connaît le terrain mieux que nous."
