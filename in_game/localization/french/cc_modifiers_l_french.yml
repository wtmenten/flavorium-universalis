 STATIC_MODIFIER_NAME_cc_burgher_resentment: "Ressentiment des bourgeois"
 STATIC_MODIFIER_DESC_cc_burgher_resentment: "L'état marchand nourrit un grief — les connexions commerciales et les agendas commerciaux sont discrètement sapés."
 STATIC_MODIFIER_NAME_cc_noble_resentment: "Ressentiment noble"
 STATIC_MODIFIER_DESC_cc_noble_resentment: "L'état noble n'a pas oublié l'affront. La coopération militaire et l'enthousiasme pour l'agenda en souffrent en conséquence."

