 STATIC_MODIFIER_NAME_cc_synergy_diplomatic_leverage: "Levier diplomatique"
 STATIC_MODIFIER_DESC_cc_synergy_diplomatic_leverage: "Une application ciblée du réseau diplomatique — solliciter des contacts pour obtenir des avantages de négociation concrets au cours de la prochaine décennie."

 # Temporary age-event modifiers
 STATIC_MODIFIER_NAME_cc_temp_renaissance_observation: "Observation du savant"
 STATIC_MODIFIER_DESC_cc_temp_renaissance_observation: "L'étude méthodique des nouveaux savoirs par un ministre a produit une amélioration modeste mais mesurable de la recherche institutionnelle et de l'alphabétisation."

 # Legacy Track C — Elder's Final Gift modifiers (base + consecrated, 11 pairs)
 STATIC_MODIFIER_NAME_cc_legacy_elder_grand_chancellor: "Héritage du grand chancelier"
 STATIC_MODIFIER_DESC_cc_legacy_elder_grand_chancellor: "Les décennies de diplomatie patiente du Grand Chancelier se traduisent par une augmentation permanente de notre portée diplomatique, de notre réputation et de notre capacité."
 STATIC_MODIFIER_NAME_cc_legacy_elder_grand_chancellor_consecrated: "Héritage consacré du Grand Chancelier"
 STATIC_MODIFIER_DESC_cc_legacy_elder_grand_chancellor_consecrated: "Une solennelle cérémonie de consécration a élevé l'héritage du Grand Chancelier au rang de caractéristique déterminante de l'identité de la politique étrangère de ce royaume."

 STATIC_MODIFIER_NAME_cc_legacy_elder_cavalry_marshal: "Héritage du maréchal de cavalerie"
 STATIC_MODIFIER_DESC_cc_legacy_elder_cavalry_marshal: "La doctrine de guerre mobile du Maréchal perdure à travers la réduction des coûts de cavalerie, une discipline accrue et une tradition d'offensives audacieuses."
 STATIC_MODIFIER_NAME_cc_legacy_elder_cavalry_marshal_consecrated: "Héritage consacré du Maréchal de la Cavalerie"
 STATIC_MODIFIER_DESC_cc_legacy_elder_cavalry_marshal_consecrated: "La mémoire du Maréchal a été élevée au rang d'idéal martial — un multiplicateur de force permanent pour chaque commandant servant sous notre bannière."

 STATIC_MODIFIER_NAME_cc_legacy_elder_supreme_commander: "Héritage du commandant suprême"
 STATIC_MODIFIER_DESC_cc_legacy_elder_supreme_commander: "Les réformes systématiques de notre appareil militaire menées par le commandant suprême perdurent — coûts réduits, meilleure discipline et chaîne de commandement rationalisée."
 STATIC_MODIFIER_NAME_cc_legacy_elder_supreme_commander_consecrated: "Héritage consacré du commandant suprême"
 STATIC_MODIFIER_DESC_cc_legacy_elder_supreme_commander_consecrated: "L'héritage du commandant suprême a été durablement consacré comme tradition militaire — chaque régiment s'entraîne selon les normes qu'il a établies."

 STATIC_MODIFIER_NAME_cc_legacy_elder_learned_courtier: "Héritage du courtisan érudit"
 STATIC_MODIFIER_DESC_cc_legacy_elder_learned_courtier: "L'amour du savoir du courtisan érudit perdure à travers l'amélioration de la recherche institutionnelle et une culture durable de l'alphabétisation à la cour."
 STATIC_MODIFIER_NAME_cc_legacy_elder_learned_courtier_consecrated: "Héritage consacré du Courtisan érudit"
 STATIC_MODIFIER_DESC_cc_legacy_elder_learned_courtier_consecrated: "La mémoire du courtisan érudit est devenue un idéal fondateur de notre culture intellectuelle — les institutions y croissent aussi naturellement que les arbres."

 STATIC_MODIFIER_NAME_cc_legacy_elder_enlightenment_herald: "Héritage du héraut des Lumières"
 STATIC_MODIFIER_DESC_cc_legacy_elder_enlightenment_herald: "Le défi lancé par le héraut à la superstition et aux idées reçues a laissé une marque permanente — l'alphabétisation progresse et les réformes sont accueillies avec moins de résistance."
 STATIC_MODIFIER_NAME_cc_legacy_elder_enlightenment_herald_consecrated: "Héritage consacré du Héraut des Lumières"
 STATIC_MODIFIER_DESC_cc_legacy_elder_enlightenment_herald_consecrated: "Les idées du héraut des Lumières ont été consacrées dans la philosophie fondatrice de ce royaume — la raison y gouverne autant que la tradition."

 STATIC_MODIFIER_NAME_cc_legacy_elder_master_urbanist: "Héritage du maître urbaniste"
 STATIC_MODIFIER_DESC_cc_legacy_elder_master_urbanist: "La vision du Maître Urbaniste, percevant la ville comme moteur de progrès, perdure à travers la réduction des coûts de construction et l'accélération du développement."
 STATIC_MODIFIER_NAME_cc_legacy_elder_master_urbanist_consecrated: "Héritage consacré du maître urbaniste"
 STATIC_MODIFIER_DESC_cc_legacy_elder_master_urbanist_consecrated: "L'héritage du Maître Urbaniste a été consacré comme doctrine civique — nos villes sont construites et gouvernées selon la norme établie par [CHARACTER.GetSheHe]."

 STATIC_MODIFIER_NAME_cc_legacy_elder_progressive_rationalist: "Héritage du rationaliste progressiste"
 STATIC_MODIFIER_DESC_cc_legacy_elder_progressive_rationalist: "Le démantèlement systématique des superstitions par le rationaliste a laissé un héritage permanent de recherche accélérée et de réceptivité institutionnelle."
 STATIC_MODIFIER_NAME_cc_legacy_elder_progressive_rationalist_consecrated: "Héritage consacré du rationaliste progressiste"
 STATIC_MODIFIER_DESC_cc_legacy_elder_progressive_rationalist_consecrated: "La philosophie du rationaliste progressiste est devenue fondamentale — ce royaume progresse par instinct institutionnel, et non par décret royal."

 STATIC_MODIFIER_NAME_cc_legacy_elder_confucian_mandarin: "Héritage du mandarin confucéen"
 STATIC_MODIFIER_DESC_cc_legacy_elder_confucian_mandarin: "Le dévouement du Mandarin à une gouvernance méritocratique et à des relations appropriées se traduit par un gain permanent d'efficacité du cabinet et de vitesse d'assimilation."
 STATIC_MODIFIER_NAME_cc_legacy_elder_confucian_mandarin_consecrated: "Héritage consacré du Mandarin confucéen"
 STATIC_MODIFIER_DESC_cc_legacy_elder_confucian_mandarin_consecrated: "Les principes du mandarin confucéen ont été consacrés dans l'âme administrative de ce royaume — la gouvernance comme vocation morale."

 STATIC_MODIFIER_NAME_cc_legacy_elder_caliphate_diplomat: "Héritage du diplomate du califat"
 STATIC_MODIFIER_DESC_cc_legacy_elder_caliphate_diplomat: "La maîtrise des relations interétatiques du diplomate du Califat perdure sous la forme d'une portée diplomatique accrue, d'un antagonisme réduit et de connexions commerciales renforcées."
 STATIC_MODIFIER_NAME_cc_legacy_elder_caliphate_diplomat_consecrated: "Héritage consacré du Diplomate du Califat"
 STATIC_MODIFIER_DESC_cc_legacy_elder_caliphate_diplomat_consecrated: "L'héritage du diplomate du Califat a été consacré comme une tradition diplomatique — les cours étrangères comprennent ce que représente notre bannière."

 STATIC_MODIFIER_NAME_cc_legacy_elder_seneschal: "Héritage du sénéchal"
 STATIC_MODIFIER_DESC_cc_legacy_elder_seneschal: "Toute une vie passée par le sénéchal à gérer les grandes maisons perdure sous la forme de coûts de cour réduits et d'une amélioration permanente de l'efficacité administrative."
 STATIC_MODIFIER_NAME_cc_legacy_elder_seneschal_consecrated: "Héritage consacré du sénéchal"
 STATIC_MODIFIER_DESC_cc_legacy_elder_seneschal_consecrated: "La maîtrise de la gestion de cour du sénéchal a été consacrée en doctrine institutionnelle — chaque trésorerie et chaque maison suit un standard qu'il a établi."

 STATIC_MODIFIER_NAME_cc_legacy_elder_marshal_of_the_court: "Héritage du maréchal de la cour"
 STATIC_MODIFIER_DESC_cc_legacy_elder_marshal_of_the_court: "La double maîtrise du cérémonial et du commandement du Maréchal subsiste sous forme de relations améliorées avec la noblesse, d'une meilleure discipline militaire et d'une cour plus prestigieuse."
 STATIC_MODIFIER_NAME_cc_legacy_elder_marshal_of_the_court_consecrated: "Héritage consacré du Maréchal de la Cour"
 STATIC_MODIFIER_DESC_cc_legacy_elder_marshal_of_the_court_consecrated: "La mémoire du Maréchal de la Cour a été durablement tissée dans la trame de notre culture curiale — la discipline et la cérémonie comme expression unique du pouvoir souverain."

