l_french:
 # === cc_bonds.2 — A Colonial Horizon ===
 cc_bonds.2.title: "Un horizon colonial"
 cc_bonds.2.desc: "La nouvelle a atteint toutes les cours du monde : [bond_subj.GetName] est devenue la première nation coloniale de cette ère — un établissement permanent outre-mer, gouverné à distance, soutenu par la volonté de [bond_subj.GetOverlord.GetName]. C'est un seuil franchi. Le monde est plus vaste qu'hier."
 cc_bonds.2.a: "Un accomplissement remarquable. Que la cour sache que nous sommes fiers."
 cc_bonds.2.b: "Notez l'évolution et continuez."

 # === cc_bonds.3 — The First March ===
 cc_bonds.3.title: "La première marche"
 cc_bonds.3.desc: "L'institution de la marche a été établie pour la première fois depuis la mémoire des hommes : [bond_subj.GetName] a été élevé au rang de zone tampon fortifiée sous la bannière de [bond_subj.GetOverlord.GetName]. Là où les frontières sont contestées et les pillards audacieux, un seigneur de marche se dresse entre la civilisation et la frontière."
 cc_bonds.3.a: "La frontière tiendra. Nous honorons ceux qui la gardent."
 cc_bonds.3.b: "Un arrangement pratique. Qu'il en soit acté."

 # === cc_bonds.4 — A Formal Compact ===
 cc_bonds.4.title: "Un pacte formel"
 cc_bonds.4.desc: "Le premier pacte formel de ce genre a été établi : [bond_subj.GetName] entre dans une relation structurée avec [bond_subj.GetOverlord.GetName] — ni simple allié, ni province conquise, mais quelque chose de plus délibéré. La question de la gouvernance de telles relations commence à devenir cruciale."
 cc_bonds.4.a: "Un nouveau chapitre dans l'art de gouverner. Nous en sommes satisfaits."
 cc_bonds.4.b: "Documenter et procéder."

 # === cc_bonds.5 — Word from the Provinces ===
 cc_bonds.5.title: "Nouvelles des Provinces"
 cc_bonds.5.desc.thriving: "Les dernières dépêches de [bond_subj.GetName] font état d'une saison prospère. Le commerce circule librement, la récolte a été généreuse et le peuple semble satisfait de ses arrangements actuels. Notre lien avec le sujet semble porter ses fruits."
 cc_bonds.5.desc.strained: "Des rapports inquiétants sont parvenus à la capitale. Les marchands parlent d'exactions injustes, les fonctionnaires notent un ressentiment croissant parmi la population de [bond_subj.GetNameWithNoTooltip]. La relation, bien que nous préférions ne pas l'examiner de près, ne semble pas tout à fait saine."
 cc_bonds.5.desc.neutral: "Des dépêches routinières arrivent de [bond_subj.GetNameWithNoTooltip]. L'administration se poursuit comme prévu, aucun incident notable n'est signalé. La relation avec [bond_subj.GetNameWithNoTooltip] continue comme elle l'a toujours été."
 cc_bonds.5.a: "Répondre avec une attention personnelle."
 cc_bonds.5.b: "Classer avec les autres rapports."

 # === cc_bonds.6 — The Diplomat's Report ===
 cc_bonds.6.title: "Le rapport du diplomate"
 cc_bonds.6.desc.content: "Notre envoyé revient de [bond_subj.GetName] avec un compte rendu encourageant. Les colons semblent prospérer, le commerce est actif et le gouverneur parle chaleureusement des arrangements de la Couronne. On sent nettement que la relation est mutuellement bénéfique."
 cc_bonds.6.desc.discontent: "Le rapport de notre diplomate concernant [bond_subj.GetNameWithNoTooltip] est pénible à lire. Le fardeau fiscal est un grief récurrent, les restrictions commerciales sont déplorées, et l'on raconte dans les tavernes que la Couronne prend plus qu'elle ne donne."
 cc_bonds.6.desc.neutral: "Le rapport du diplomate en provenance de [bond_subj.GetNameWithNoTooltip] est banal. Le commerce se poursuit, l'administration fonctionne et il n'y a aucune préoccupation urgente à porter à notre attention."
 cc_bonds.6.a: "Envoyer une recommandation personnelle au gouverneur."
 cc_bonds.6.b: "Accusez réception."

 # === cc_bonds.7 — Rumors at Court ===
 cc_bonds.7.title: "Rumeurs à la Cour"
 cc_bonds.7.desc.loyal: "Les visiteurs de [bond_subj.GetName] parlent avec fierté de la fidélité de leur seigneur envers la Couronne. La maison du noble porte un toast au suzerain à chaque festin, et on dit que ses soldats s'entraînent en pensant à nous. Peu importe les murmures de la cour, celui-ci semble sincèrement lié à notre cause."
 cc_bonds.7.desc.restless: "La cour est saturée de rumeurs. Des voyageurs venant de [bond_subj.GetNameWithNoTooltip] parlent d'un seigneur qui s'éloigne, dont les toasts à la Couronne sont devenus superficiels, et dont la maison conspire discrètement sur ce qui nous attend. Cela peut ne rien signifier. Ou peut-être le contraire."
 cc_bonds.7.desc.neutral: "Les ragots de la cour parviennent occasionnellement aux oreilles du seigneur de la marche. Rien d'alarmant — les plaintes habituelles sur les taxes et les obligations, mêlées aux vantardises coutumières sur les prouesses martiales. La relation semble sans particularité."
 cc_bonds.7.a: "Envoyer une lettre personnelle d'estime."
 cc_bonds.7.b: "Ignorer les commérages."

 # === cc_bonds.8 — A Letter from the Dependency ===
 cc_bonds.8.title: "Une lettre de [bond_subj.GetNameWithNoTooltip]"
 cc_bonds.8.desc.warm: "Une lettre arrive de [bond_subj.GetName] portant toutes les marques d'une chaleur sincère. La maison régnante parle d'efforts communs, de gratitude pour les attentions de la Couronne, de leur fierté quant à ce lien. Elle ressemble moins à une correspondance formelle qu'à une lettre familiale."
 cc_bonds.8.desc.cold: "Une lettre formelle arrive de [bond_subj.GetNameWithNoTooltip]. Les courtoisies d'usage sont observées, les sceaux correctement apposés, mais la chaleur fait défaut. Entre les lignes d'une formulation prudente se trouve la distance froide d'une relation que l'on a laissé s'étioler."
 cc_bonds.8.desc.formal: "La correspondance saisonnière arrive de [bond_subj.GetNameWithNoTooltip] — correcte, bien rédigée et totalement insignifiante. La maison régnante respecte ses obligations. La relation est intacte, bien que peu chaleureuse."
 cc_bonds.8.a: "Répondre avec chaleur humaine."
 cc_bonds.8.b: "Envoyer un accusé de réception standard."

 # === cc_bonds.9 — The Governor's Annual Dispatch ===
 cc_bonds.9.title: "La dépêche annuelle du gouverneur"
 cc_bonds.9.desc.harmonious: "Le rapport annuel du gouverneur de [bond_subj.GetName] présente un tableau encourageant. Les revenus sont sains, l'administration est fluide et la population locale semble s'être accommodée de l'autorité de la Cour sans friction. La dépêche décrit une province qui fonctionne bien selon les arrangements actuels."
 cc_bonds.9.desc.troubled: "Le rapport annuel du gouverneur soulève plusieurs inquiétudes. La collecte des revenus a rencontré des résistances, les fonctionnaires locaux ne coopèrent pas et certains passages semblent presque délibérément vagues. La province n'est pas en révolte ouverte, mais elle ne semble pas non plus satisfaite."
 cc_bonds.9.desc.routine: "La dépêche annuelle du gouverneur arrive comme prévu. Les chiffres des revenus sont adéquats, les affaires administratives sont en ordre et aucune préoccupation particulière n'est signalée. [bond_subj.GetNameWithNoTooltip] continue de fonctionner selon ses habitudes."
 cc_bonds.9.a: "Envoyer des félicitations au gouverneur."
 cc_bonds.9.b: "Classer pour examen."
