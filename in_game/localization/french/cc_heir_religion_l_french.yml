l_french:
 cc_request_heir_religion_group: "Requête pour la loi sur la religion de l'héritier"
 dip_cc_request_heir_religion_group: "Requête pour la loi sur la religion de l'héritier"
 dip_cc_request_heir_religion_group_CATEGORY: "CATEGORY_FRIENDLY_ACTIONS"
 cc_request_heir_religion_group_desc: "Demander à un partenaire de mariage royal d'une autre foi au sein de notre [religion_group|e] de modifier sa [ShowLawName('heir_religion_law')] pour [ShowPolicyName('heir_same_religion_group')], afin que les héritiers de notre foi puissent hériter de son trône."
 cc_request_heir_religion_group_act: "Demander à [SCOPE.sCountry('recipient').GetName] de modifier sa [ShowLawName('heir_religion_law')]."
 cc_request_heir_religion_group_effect_text: "[SCOPE.sCountry('actor').GetName] demande à [SCOPE.sCountry('recipient').GetName] d'adopter [ShowPolicyName('heir_same_religion_group')]."
 cc_request_heir_religion_group_effect_text_past: "[SCOPE.sCountry('actor').GetName] a demandé à [SCOPE.sCountry('recipient').GetName] d'adopter [ShowPolicyName('heir_same_religion_group')]."
 PROPOSE_cc_request_heir_religion_group: "Demander à $RECIPIENT$ de modifier sa [ShowLawName('heir_religion_law')] pour [ShowPolicyName('heir_same_religion_group')]?\n\n$INFO$"
 cc_request_heir_religion_group_reject_effect_text: "$generic_reject_request_effect_string$"
 cc_request_heir_religion_group_reject_effect_text_past: "$generic_reject_request_effect_string_past$"
 INCOMING_OFFER_TITLE_cc_request_heir_religion_group: "Requête sur la religion de l'héritier"
 INCOMING_OFFER_cc_request_heir_religion_group: "$ACTOR$ nous demande de modifier notre [ShowLawName('heir_religion_law')] pour [ShowPolicyName('heir_same_religion_group')].\n\n$INFO$"
 cc_hrl_request_tt: "[SCOPE.sCountry('recipient').GetName] décidera s'il souhaite modifier sa [ShowLawName('heir_religion_law')] de [ShowPolicyName('heir_same_religion')] à [ShowPolicyName('heir_same_religion_group')]. Ils peuvent accepter, refuser, ou accepter seulement si nous effectuons le même changement.\nIls sont plus susceptibles d'accepter s'ils ont une bonne [opinion|e] de nous et nous font confiance, et si nous avons une [diplomatic_reputation|e] et un [prestige|e] élevés, si nous sommes une [great_power|e], ou si nous possédons la culture dominante. Un refus diminue notre [opinion|e] à leur égard."
 cc_hrl_has_same_religion_policy_tt: "Leur [ShowLawName('heir_religion_law')] est [ShowPolicyName('heir_same_religion')]"
 cc_hrl_policy_not_locked_tt: "Leur [ShowLawName('heir_religion_law')] n'est pas verrouillée"
 cc_hrl_group_policy_available_tt: "[ShowPolicyName('heir_same_religion_group')] est disponible pour eux"
 cc_hrl_not_recently_asked_tt: "Personne ne leur a demandé de modifier cette loi au cours des 10 dernières années"

 opinion_cc_hrl_request_granted: "Loi sur la religion de l'héritier modifiée à notre demande"
 opinion_cc_hrl_request_refused: "A refusé notre requête sur la religion de l'héritier"
 opinion_cc_hrl_reciprocal_pact: "Accord mutuel sur la religion de l'héritier"

 cc_hrl.1.title: "Une requête de [cc_hrl_requester.GetName]"
 cc_hrl.1.desc: "Les envoyés de [cc_hrl_requester.GetName], liés à nous par un mariage royal, demandent que nous ouvrions notre succession aux héritiers de la foi [cc_hrl_requester.GetReligion.GetName]. Notre loi exige actuellement un héritier de notre propre religion. Puisque les deux fois partagent un groupe religieux, ils nous demandent de n'exiger que cela. Notre clergé n'accueillera pas favorablement ce changement, mais cela renforcerait les liens entre les deux cours."
 cc_hrl.1.a: "Accepter le changement."
 cc_hrl.1.b: "Notre succession n'est pas de leur ressort."
 cc_hrl.1.c: "Seulement s'ils font de même."
 cc_hrl.1.c.tt: "[cc_hrl_requester.GetName] sera invité à modifier sa propre [ShowLawName('heir_religion_law')] pour [ShowPolicyName('heir_same_religion_group')]. S'ils acceptent, les deux pays la modifieront ensemble."

 cc_hrl.2.title: "[cc_hrl_partner.GetName] Accepter"
 cc_hrl.2.desc: "[cc_hrl_partner.GetName] a modifié sa [ShowLawName('heir_religion_law')] pour [ShowPolicyName('heir_same_religion_group')]. Un héritier de notre foi peut désormais hériter de leur trône."
 cc_hrl.2.a: "Bien."

 cc_hrl.3.title: "[cc_hrl_partner.GetName] Refuser"
 cc_hrl.3.desc: "[cc_hrl_partner.GetName] a refusé notre demande. Leur trône reste fermé aux héritiers qui ne partagent pas leur religion."
 cc_hrl.3.a: "Qu'il en soit ainsi."

 cc_hrl.4.title: "[cc_hrl_partner.GetName] Demander la même chose"
 cc_hrl.4.desc: "[cc_hrl_partner.GetName] modifiera sa [ShowLawName('heir_religion_law')] pour [ShowPolicyName('heir_same_religion_group')], mais seulement si nous modifions la nôtre également. Notre clergé et notre cour résisteront à l'ouverture de notre propre succession aux héritiers de la foi [cc_hrl_partner.GetReligion.GetName], et l'imposer aura un coût."
 cc_hrl.4.a: "C'est convenu. Les deux couronnes modifieront la loi."
 cc_hrl.4.b: "Nous n'ouvrirons pas notre propre succession."

 cc_hrl.5.title: "Accord avec [cc_hrl_requester.GetName]"
 cc_hrl.5.desc: "[cc_hrl_requester.GetName] a accepté nos conditions. Les deux pays utilisent désormais [ShowPolicyName('heir_same_religion_group')], et un héritier de l'une ou l'autre foi peut hériter de l'un ou l'autre trône."
 cc_hrl.5.a: "Bien."

 cc_hrl.6.title: "[cc_hrl_requester.GetName] Décliner"
 cc_hrl.6.desc: "[cc_hrl_requester.GetName] ne modifierait pas sa propre [ShowLawName('heir_religion_law')]. Notre loi reste telle qu'elle était."
 cc_hrl.6.a: "Alors rien ne change."
