l_french:

 # ========================
 # SITUATION
 # ========================
 cc_invasion_mexico: "Invasion du Mexique"
 cc_invasion_mexico_desc: "Les puissances coloniales venues de rivages lointains ont atteint le cœur de la Mésoamérique. Les grands empires aztèque, maya et leurs alliés font face à une menace existentielle. Les peuples autochtones sauront-ils s'unir contre les envahisseurs, ou l'ère des conquêtes condamnera-t-elle ces anciennes civilisations à jamais ?"

 # ========================
 # GAME RULE
 # ========================
 cc_invasion_mexico_rule: "Invasion du Mexique"
 cc_invasion_mexico_rule_desc: "Contrôle si la situation Invasion du Mexique peut se déclencher, ajoutant des événements d'ambiance, des casus belli personnalisés et des actions dans le panneau de situation pour les puissances coloniales et indigènes."
 cc_invasion_mexico_on: "Activé (Historique)"
 cc_invasion_mexico_on_desc: "La situation « Invasion du Mexique » se déclenchera lorsque les conditions de déclenchement seront remplies."
 cc_invasion_mexico_off: "Désactivé"
 cc_invasion_mexico_off_desc: "La situation « Invasion du Mexique » ne se déclenchera jamais."

 # ========================
 # HINT
 # ========================
 hint_cc_invasion_mexico: "La situation « Invasion du Mexique » représente la conquête espagnole de la MésoAmérique. Les puissances coloniales peuvent obtenir des casus belli spéciaux contre les nations indigènes et commander des expéditions depuis le panneau de situation. Les puissances indigènes peuvent s'unir au sein de la Confédération mésoaméricaine pour leur défense mutuelle, ou offrir un tribut pour prévenir l'agression. La situation prend fin lorsque toutes les puissances indigènes indépendantes sont subjuguées, ou lorsque l'année 1600 est atteinte."

 # ========================
 # EVENT 1 — Announcement
 # ========================
 cc_invasion_mexico.1.title: "L'ère des conquêtes commence"
 cc_invasion_mexico.1.desc_native: "La nouvelle se répand rapidement dans nos terres : des navires étrangers ont accosté et d'étranges soldats marchent vers l'intérieur des terres. Ces envahisseurs ne viennent pas comme commerçants mais comme conquérants, portant l'acier et le feu. La manière dont nous répondons maintenant pourrait déterminer le sort de notre civilisation."
 cc_invasion_mexico.1.desc_colonial: "Nos explorateurs ont atteint les grands empires continentaux du Nouveau Monde. Des cités d'or et d'argent sont à notre portée. Les peuples indigènes sont nombreux et belliqueux, mais ils sont divisés — et nous sommes déterminés. L'ère des conquêtes a commencé."
 cc_invasion_mexico.1.a: "Nous saurons saisir ce moment."

 # ========================
 # EVENTS 2–4 — Federation Requests
 # ========================
 cc_invasion_mexico.2.title: "L'Empire à la croisée des chemins"
 cc_invasion_mexico.2.desc: "Des hommes étranges munis d'armes tonnantes ont débarqué — et parlent déjà de revendiquer nos terres. Des émissaires arrivent en proposant une grande confédération des peuples autochtones. Mais nos seigneurs se demandent si cet empire doit s'incliner devant une alliance, ou si nos propres murs et guerriers suffisent à contrer cette menace."
 cc_invasion_mexico.2.a: "Nous forgerons et dirigerons cette alliance."
 cc_invasion_mexico.2.b: "L'empire ne tient que par sa propre force."

 cc_invasion_mexico.3.title: "Vieilles rivalités, nouvelles menaces"
 cc_invasion_mexico.3.desc: "Des émissaires arrivent pour proposer une confédération des peuples de cette terre. Pendant des générations, nous nous sommes tenus à l'écart — et parfois contre — ceux qui nous font aujourd'hui cette offre. Pourtant, les soldats étrangers ne font pas de distinction entre nous lorsqu'ils marchent. Peut-être que les vieilles rancunes importent moins que la survie."
 cc_invasion_mexico.3.a: "Mettons de côté les vieilles rivalités. Nous nous joignons."
 cc_invasion_mexico.3.b: "Nous ne faisons confiance à aucune alliance bâtie par nos anciens rivaux."

 cc_invasion_mexico.4.title: "Le conseil délibère"
 cc_invasion_mexico.4.desc: "Nos chefs de guerre et nos prêtres se sont réunis. Des émissaires apportent des termes généreux — protection mutuelle, ressources partagées, front uni. Mais nos anciens se souviennent de la dernière fois où nous avons confié notre destin à une puissance supérieure. Le conseil est divisé entre ceux qui voient la sécurité dans le nombre et ceux qui conseillent que notre destin est entre nos propres mains."
 cc_invasion_mexico.4.a: "Les chiffres parlent d'eux-mêmes. Nous nous joignons à eux."
 cc_invasion_mexico.4.b: "Notre destin est entre nos mains."

 # ========================
 # EVENT 5 — Defensive Preparation
 # ========================
 cc_invasion_mexico.5.title: "Soldats étrangers à la frontière"
 cc_invasion_mexico.5.desc: "Les éclaireurs rapportent que des soldats coloniaux se sont emparés de terres à la lisière de notre territoire. Leurs armes sont étranges et leur nombre augmente. Nous devons décider comment répondre à cette menace avant qu'elle ne frappe à notre porte."
 cc_invasion_mexico.5.a: "Renforcer nos fortifications et rassembler nos guerriers."
 cc_invasion_mexico.5.b: "Chercher la sécurité dans l'alliance — rejoindre la Confédération."

 # ========================
 # EVENTS 10–12 — Monthly Confederate Events
 # ========================
 cc_invasion_mexico.10.title: "La confédération tient bon"
 cc_invasion_mexico.10.desc: "Malgré la pression de l'invasion, les liens de notre confédération restent forts. Les marchandises, les guerriers et les messages circulent entre nos peuples. Ensemble, nous sommes quelque chose que les colonisateurs n'ont pas encore affronté."
 cc_invasion_mexico.10.a: "Notre unité est notre plus grande arme."

 cc_invasion_mexico.11.title: "Tensions au sein de la confédération"
 cc_invasion_mexico.11.desc: "Le poids de la confédération devient pesant. Des chefs rivaux se disputent l'autorité, et certains de nos sujets se demandent si cette alliance sert réellement nos intérêts. La menace coloniale n'a pas disparu, mais l'ancienne ambition non plus."
 cc_invasion_mexico.11.a: "Nous supportons les frictions. L'unité doit primer."
 cc_invasion_mexico.11.b: "Cette confédération ne mérite pas notre soumission. Nous nous retirons."

 cc_invasion_mexico.12.title: "Les colonisateurs exigent un tribut"
 cc_invasion_mexico.12.desc: "Des émissaires de la puissance coloniale voisine arrivent avec un message sans équivoque : envoyez un tribut, ou subissez les conséquences. Notre trésor est à sec, mais notre fierté l'est tout autant. Comment allons-nous répondre ?"
 cc_invasion_mexico.12.a: "Payer le tribut. Cela nous fera gagner du temps."
 cc_invasion_mexico.12.b: "Nous ne nous soumettrons pas à l'extorsion."

 # ========================
 # EVENT 20 — Colonial Neighbor Interaction
 # ========================
 cc_invasion_mexico.20.title: "La frontière indigène"
 cc_invasion_mexico.20.desc: "Nos forces partagent désormais une frontière avec l'un des grands empires indigènes de Mésoamérique. Ils nous observent depuis l'autre côté de la frontière. Comment devons-nous les aborder ?"
 cc_invasion_mexico.20.a: "Envoyer un envoyé porteur de cadeaux — laisser la diplomatie ouvrir la voie."
 cc_invasion_mexico.20.b: "Établir une revendication sur leurs terres. La conquête suivra quand nous serons prêts."

 # ========================
 # EVENT 21 — Native Response to Colonial Envoy
 # ========================
 cc_invasion_mexico.21.title: "Le retour de l'envoyé"
 cc_invasion_mexico.21.desc_default: "Notre mission diplomatique est revenue de la cour indigène. Ils y ont été reçus avec curiosité — et prudence. Les bases de futures relations ont été posées."
 cc_invasion_mexico.21.desc_conf: "Notre envoyé a été accueilli à la frontière par une garde confédérée et escorté sous haute surveillance jusqu'à la cour du souverain. Notre diplomatie a fait certaine impression, mais l'ombre de la confédération est longue."
 cc_invasion_mexico.21.a: "Un début prometteur."

 # ========================
 # EVENT 25 — Commission Expedition (Monthly)
 # ========================
 cc_invasion_mexico.25.title: "Rapports de l'Intérieur"
 cc_invasion_mexico.25.desc: "Nos agents sont revenus de reconnaissance à l'intérieur des terres. De vastes cités, des entrepôts d'or et de nourriture, et une population mûre pour l'assujettissement — tout cela est à notre portée. Devons-nous commander une expédition formelle pour faire valoir nos droits ?"
 cc_invasion_mexico.25.a: "Commander l'expédition immédiatement."
 cc_invasion_mexico.25.b: "Le moment n'est pas encore venu."

 # ========================
 # EVENT 26 — Protectorate Offer Response
 # ========================
 cc_invasion_mexico.26.title: "L'offre du colonisateur"
 cc_invasion_mexico.26.desc: "Un puissant dirigeant colonial a envoyé des envoyés avec une proposition remarquable : plutôt que de faire face à la conquête, nous pourrions accepter un statut de protectorat — conservant nos coutumes, nos dirigeants et nos terres sous leur suzeraineté nominale. C'est une coupe amère. Mais la survie vaut-elle ce prix ?"
 cc_invasion_mexico.26.a: "Nous acceptons. La survie de notre peuple doit passer en priorité."
 cc_invasion_mexico.26.b: "Nous refusons. Mieux vaut tomber au combat que de s'incliner."

 # ========================
 # EVENT 30 — Expedition Departs
 # ========================
 cc_invasion_mexico.30.title: "L'expédition s'ébranle"
 cc_invasion_mexico.30.desc: "Les capitaines et les soldats ont été rassemblés, les provisions chargées et les bannières levées. L'expédition vers le cœur de la Mésoamérique part en grande pompe et avec de hautes attentes. La gloire — et le pillage — nous attendent."
 cc_invasion_mexico.30.a: "Si Dieu le veut, ils reviendront victorieux."

 # ========================
 # EVENTS 35–36 — End Events
 # ========================
 cc_invasion_mexico.35.title: "L'ère des conquêtes s'achève"
 cc_invasion_mexico.35.desc_free: "L'ère des grandes invasions est terminée, pourtant notre peuple perdure. Nous avons survécu là où d'autres sont tombés. Quoi qu'il arrive ensuite, notre civilisation a prouvé sa résilience."
 cc_invasion_mexico.35.desc_subject: "L'ère des conquêtes a touché à sa fin. Nos terres ne nous appartiennent plus, et notre peuple doit apprendre à vivre sous un ciel étranger. L'ancien monde a disparu. Un nouveau — douloureux, incertain — commence."
 cc_invasion_mexico.35.a: "Nous endurons."

 cc_invasion_mexico.36.title: "La conquête de la Mésoamérique"
 cc_invasion_mexico.36.desc_conqueror: "Les grands empires autochtones de Mésoamérique ont été brisés. Leurs peuples servent désormais sous notre bannière, et leurs richesses affluent vers nos trésors. L'histoire retiendra que ce fut l'époque où le Nouveau Monde devint le nôtre."
 cc_invasion_mexico.36.desc_observer: "La lutte pour la Mésoamérique a touché à sa fin. D'autres se sont emparés de ses richesses, mais l'opulence et l'exemple de la conquête résonneront à travers le monde colonial pendant des générations."
 cc_invasion_mexico.36.a: "Une nouvelle ère commence."

 # ========================
 # CASUS BELLI
 # ========================
 cc_seize_mexico_native: "Conquête coloniale"
 cc_seize_mexico_native_PROV: "Conquête coloniale (province)"
 cc_seize_mexico_native_desc: "Selon la doctrine de la découverte, cette puissance coloniale revendique le droit d'assujettir les peuples autochtones de Mésoamérique. Aucun antagonisme n'est engendré — cette conquête est considérée comme juste par le droit colonial."

 cc_seize_mexico_colonial: "Revendications coloniales concurrentes"
 cc_seize_mexico_colonial_PROV: "Revendications coloniales concurrentes (Province)"
 cc_seize_mexico_colonial_desc: "Deux puissances coloniales se disputent la domination du même coin du Nouveau Monde. Aucun antagonisme n'est engendré, bien que le coût de l'imposition d'un rapport de vassalité soit plus élevé compte tenu des revendications concurrentes du rival."

 # ========================
 # GENERIC ACTIONS
 # ========================
 ccim_call_confederation: "Appel à la confédération"
 ccim_call_confederation_desc: "Rassemblez les peuples autochtones de Mésoamérique en une confédération défensive. Crée la Confédération mésoaméricaine IO si elle n'existe pas, ou s'y joint. Les voisins autochtones alliés seront invités à se joindre. Coûte du prestige. Ne peut être répété pendant 10 ans."
 ccim_call_confederation_create_tt: "Crée la Confédération mésoaméricaine en tant que leader fondateur, ou la rejoint si elle existe déjà."

 ccim_offer_tribute: "Offrir un tribut"
 ccim_offer_tribute_desc: "Envoyer de l'or à une puissance coloniale voisine en échange d'une amélioration des relations et d'un répit temporaire face à l'agression. Supprime tout casus belli que cette puissance détient contre nous. Ne peut être répété pendant 5 ans."

 ccim_commission_expedition: "Commander une expédition"
 ccim_commission_expedition_desc: "Dépensez de l'or pour envoyer une expédition en territoire indigène, accordant un casus belli contre une nation indigène choisie pendant 8 ans. Ne peut être répété avant 5 ans."

 ccim_negotiate_protectorate: "Négocier un protectorat"
 ccim_negotiate_protectorate_desc: "Proposez des conditions de vassalité à une puissance indigène. Le dirigeant indigène recevra un événement et pourra accepter ou refuser. Nécessite des relations non hostiles. Ne peut être répété avant 8 ans."

 # ========================
 # SITUATION PANEL UI
 # ========================
 CCIM_CONFEDERATION_PANEL_HEADER: "Confédération mésoaméricaine"
 CCIM_SITUATION_OVERVIEW_HEADER: "La lutte pour la Mésoamérique"
 CCIM_SITUATION_OVERVIEW_DESC: "Les puissances coloniales s'enfoncent dans la Mésoamérique depuis les côtes. Les nations autochtones peuvent s'unir au sein de la Confédération ou rechercher des accords de tribut. Utilisez la carte de situation pour voir quelles terres sont détenues par chaque camp. Les puissances coloniales peuvent commander des expéditions et négocier des protectorats ; les puissances autochtones peuvent appeler à la confédération ou offrir un tribut."

 # Map legend
 CCIM_CONFEDERATION_LEGEND: "Confédération mésoaméricaine"
 CCIM_NATIVE_UNAFFILIATED_LEGEND: "État indigène indépendant"

 # Map tooltips
 ccim_confederation_member_tt: "Cette terre appartient à un membre de la Confédération mésoaméricaine."
 ccim_native_unaffiliated_tt: "Cette terre appartient à un État indigène indépendant."
 ccim_colonial_power_tt: "Cette terre est contrôlée par une puissance coloniale."

 # Situation explanation tooltip (appears on event 1 option)
 ccim_situation_explanation_tt: "La situation « Invasion du Mexique » est désormais active. Les puissances indigènes peuvent former une Confédération mésoaméricaine et offrir un tribut depuis le panneau de situation. Les puissances coloniales peuvent commander des expéditions et négocier des protectorats."

 # No confederation exists tooltip
 ccim_no_confederation_exists_tt: "La Confédération mésoaméricaine n'a pas encore été formée. Une puissance indigène majeure doit d'abord en faire la demande."

 # Generic action error tooltips
 ccim_offer_tribute_no_target_tt: "Aucune puissance coloniale valide pour offrir un tribut n'a été sélectionnée."
 ccim_commission_expedition_no_target_tt: "Aucune cible indigène valide n'a été sélectionnée pour l'expédition."
 ccim_negotiate_protectorate_no_target_tt: "Aucune puissance indigène valide n'a été sélectionnée pour les négociations de protectorat."

 # Biases (opinion modifiers)
 opinion_ccim_tribute_received: "Tribut reçu"
 opinion_ccim_diplomatic_approach: "Ouverture diplomatique"
 opinion_ccim_tribute_paid: "Tribut payé"

 # Event target selection UI
 ccim_choose_tribute_target: "Choisissez une puissance coloniale à qui envoyer un tribut"
 ccim_choose_expedition_target: "Choisissez une nation indigène comme cible"
 ccim_choose_protectorate_target: "Choisissez une nation indigène à approcher"

 # IO opinion modifier (required by the IO engine)
 io_opinion_cc_mesoamerican_confederation: "Membre allié de la confédération"

 # Country modifiers
 STATIC_MODIFIER_NAME_ccim_defensive_preparations: "Préparatifs défensifs"
 ccim_defensive_preparations: "Préparatifs défensifs"
 ccim_defensive_preparations_desc: "Nos armées sont rassemblées et nos frontières fortifiées dans l'attente d'une agression coloniale."
 STATIC_MODIFIER_NAME_ccim_confederation_solidarity: "Solidarité de la confédération"
 ccim_confederation_solidarity: "Solidarité de la confédération"
 ccim_confederation_solidarity_desc: "Les liens de la Confédération mésoaméricaine renforcent notre détermination et aiguisent nos guerriers."
 STATIC_MODIFIER_NAME_ccim_expedition_morale: "Moral de l'expédition"
 ccim_expedition_morale: "Moral de l'expédition"
 ccim_expedition_morale_desc: "Une expédition fraîchement commissionnée s'élance, pleine de détermination et d'ambition."
 STATIC_MODIFIER_NAME_ccim_contested_claims: "Revendications coloniales contestées"
 ccim_contested_claims: "Revendications coloniales contestées"
 ccim_contested_claims_desc: "Deux puissances coloniales se disputent le même coin du Nouveau Monde, rendant la subjugation plus coûteuse que d'habitude."
 STATIC_MODIFIER_NAME_ccim_divine_blessing: "Bénédiction des Dieux"
 ccim_divine_blessing: "Bénédiction des Dieux"
 ccim_divine_blessing_desc: "Les cérémonies sacrées ont remué le cœur des guerriers. Les dieux de nos ancêtres marchent avec nous."
 STATIC_MODIFIER_NAME_ccim_sacred_fortifications: "Sites sacrés fortifiés"
 ccim_sacred_fortifications: "Sites sacrés fortifiés"
 ccim_sacred_fortifications_desc: "Nos lieux les plus saints ont été renforcés. Leurs murs ralentiront tout envahisseur qui oserait s'en approcher."
 STATIC_MODIFIER_NAME_ccim_native_weakness: "Conseil divisé"
 ccim_native_weakness: "Conseil divisé"
 ccim_native_weakness_desc: "Les pots-de-vin et les promesses ont semé la discorde parmi les factions nobles. Les ordres du souverain sonnent creux."
 STATIC_MODIFIER_NAME_ccim_tribute_windfall: "Manne du tribut"
 ccim_tribute_windfall: "Manne du tribut"
 ccim_tribute_windfall_desc: "L'or extrait de nos possessions mésoaméricaines afflue vers le trésor, enrichissant la campagne."
 STATIC_MODIFIER_NAME_ccim_refugee_influx: "Guerriers réfugiés"
 ccim_refugee_influx: "Guerriers réfugiés"
 ccim_refugee_influx_desc: "Des survivants des peuples voisins tombés ont gonflé nos rangs de guerriers valides assoiffés de vengeance."

 # Opinion modifiers (new)
 opinion_ccim_bribed_noble: "Faction noble corrompue"

 # ========================
 # NEW GENERIC ACTIONS
 # ========================
 ccim_fortify_sacred_sites: "Fortifier les sites sacrés"
 ccim_fortify_sacred_sites_desc: "Commander le renforcement de vos sites sacrés et de vos places fortes frontalières. Accorde un modificateur de fortification défensive et bénit tous les membres de la Confédération d'une protection divine. Coûte 60 d'or. Ne peut être répété avant 8 ans."

 ccim_seek_tribal_alliance: "Solliciter une alliance tribale"
 ccim_seek_tribal_alliance_desc: "Envoyer des émissaires à une nation indigène indépendante voisine pour les inciter à rejoindre la Confédération mésoaméricaine. Ils examineront l'offre et pourraient l'accepter. Nécessite l'appartenance à la Confédération. Ne peut être répété pendant 10 ans."

 ccim_extract_tribute: "Extraire un tribut"
 ccim_extract_tribute_desc: "Exiger des paiements de tributs de vos territoires mésoaméricains. Gagnez de l'or pour chaque emplacement possédé dans la région et appliquez une brève aubaine de revenus. Ne peut être répété avant 8 ans."

 ccim_bribe_noble_faction: "Corrompre la faction noble"
 ccim_bribe_noble_faction_desc: "Dépensez de l'or pour semer la division interne parmi la noblesse d'une puissance indigène. La cible subit un modificateur d'affaiblissement pendant 4 ans. Coûte 80 d'or. Ne peut être répété avant 10 ans."

 # Action target choice UI
 ccim_choose_bribe_target: "Choisissez une nation indigène à soudoyer"

 # Action error tooltip
 ccim_bribe_noble_faction_no_target_tt: "Aucune cible indigène valide n'a été sélectionnée pour le pot-de-vin."

 # ========================
 # EVENTS 40–43 (Native)
 # ========================
 cc_invasion_mexico.40.title: "Le Grand Prêtre Exhorte à l'Action"
 cc_invasion_mexico.40.desc: "Le grand prêtre a convoqué nos chefs dans l'enceinte sacrée. Les dieux, déclare-t-il, ont parlé : le moment d'agir est venu. Des cérémonies sacrées, des sacrifices et des rituels de protection fortifieront nos guerriers et appelleront la faveur divine sur notre cause. Répondrons-nous à l'appel des anciennes coutumes ?"
 cc_invasion_mexico.40.a: "Honorer les anciens rites. Les dieux guideront nos guerriers."
 cc_invasion_mexico.40.b: "Nos guerriers ont besoin d'acier et d'entraînement, pas de cérémonies."

 cc_invasion_mexico.41.title: "Signes dans la fumée sacrée"
 cc_invasion_mexico.41.desc: "Les cérémonies sont terminées. Les prêtres ont interprété la fumée de copal, le vol des oiseaux et les motifs dans la cendre. Ils parlent d'un signe — non pas de défaite, mais d'endurance. Que ce soit en alliance ou dans un défi solitaire, notre peuple a été renforcé par les rites."
 cc_invasion_mexico.41.a: "Un présage favorable — les dieux sont avec nous !"
 cc_invasion_mexico.41.b: "Signes sombres. Les prêtres nous pressent de nous préparer au pire."

 cc_invasion_mexico.42.title: "Réfugiés de terres tombées"
 cc_invasion_mexico.42.desc: "Une colonne déguenillée de survivants arrive à nos portes — des hommes, des femmes et des guerriers d'un peuple voisin dont les terres ont été saisies par les envahisseurs. Ils n'apportent rien d'autre que leur vie et ce qu'ils savent des tactiques des étrangers. Comment allons-nous les recevoir ?"
 cc_invasion_mexico.42.a: "Les accueillir. Leurs guerriers combattent aux côtés des nôtres."
 cc_invasion_mexico.42.b: "Interrogez-les pour obtenir des renseignements sur les méthodes des envahisseurs."

 cc_invasion_mexico.43.title: "Une offre de fraternité"
 cc_invasion_mexico.43.desc: "Des envoyés de la Confédération mésoaméricaine sont arrivés porteurs de cadeaux et d'un message solennel : unis, les peuples de cette terre peuvent inverser la tendance de la conquête. Divisés, nous tomberons un à un. L'offre de rejoindre la Confédération est devant nous."
 cc_invasion_mexico.43.a: "Nous acceptons. Nos peuples resteront unis."
 cc_invasion_mexico.43.b: "Nous trouverons notre propre voie. Nous les remercions pour l'offre."

 # ========================
 # EVENTS 50–52 (Colonial)
 # ========================
 cc_invasion_mexico.50.title: "Un capitaine audacieux s'avance"
 cc_invasion_mexico.50.desc: "Un capitaine chevronné — endurci par les combats, ambitieux et avide de gloire — s'est porté volontaire pour mener une expédition de reconnaissance au cœur des terres indigènes. Les risques sont réels : le terrain est inconnu et les indigènes sont vigilants. Mais les renseignements obtenus pourraient être décisifs. Commandons-nous son expédition ?"
 cc_invasion_mexico.50.a: "Commander son expédition."
 cc_invasion_mexico.50.b: "Le moment n'est pas opportun. Nous attendons."

 cc_invasion_mexico.51.title: "Le rapport du capitaine"
 cc_invasion_mexico.51.desc_success: "Le capitaine est revenu ! Son expédition a pénétré profondément dans l'intérieur des terres, cartographiant les cols, les sources d'eau et la disposition des forces indigènes. Il rapporte des renseignements détaillés et des récits de cités qui n'attendent qu'à être revendiquées. Un casus belli a été préparé contre la puissance indigène la plus proche."
 cc_invasion_mexico.51.desc_failure: "Le capitaine est revenu — mais tout juste. Son expédition a rencontré une résistance farouche et a été contrainte de battre en retraite après de lourdes pertes. Les hommes sont ébranlés, le trésor allégé, et le capitaine lui-même soigne ses blessures. Une leçon coûteuse sur les dangers de l'excès de confiance."
 cc_invasion_mexico.51.a_success: "Excellent travail. Préparez la campagne."
 cc_invasion_mexico.51.b_failure: "Un revers douloureux. Nous devons nous regrouper."

 cc_invasion_mexico.52.title: "La fièvre de l'or s'empare du camp"
 cc_invasion_mexico.52.desc: "La nouvelle s'est répandue parmi nos soldats : les indigènes cacheraient d'immenses quantités d'or dans leurs temples et leurs entrepôts. La discipline s'effrite alors que les hommes chuchotent des fortunes à s'emparer. Nous devons décider comment gérer l'agitation croissante dans les rangs."
 cc_invasion_mexico.52.a: "Leur promettre une part du butin. L'avidité peut être une arme."
 cc_invasion_mexico.52.b: "Maintenir une discipline stricte. L'ordre gagne les campagnes, pas l'avidité."

