 cc_mesoamerican_confederation: "Confédération mésoaméricaine"
 # ========================
 # IO UNITY MODIFIERS
 # ========================
 STATIC_MODIFIER_NAME_ccim_high_unity_bonus: "Force confédérée"
 ccim_high_unity_bonus: "Force confédérée"
 ccim_high_unity_bonus_desc: "La Confédération mésoaméricaine parle d'une seule voix. Nos guerriers tirent leur confiance du lien inébranlable entre nos peuples."
 STATIC_MODIFIER_NAME_ccim_low_unity_penalty: "Fractures de la confédération"
 ccim_low_unity_penalty: "Fractures de la confédération"
 ccim_low_unity_penalty_desc: "Les tensions au sein de la confédération sapent le moral et affaiblissent le recrutement. L'unité doit être rétablie avant que les envahisseurs n'exploitent nos divisions."
 STATIC_MODIFIER_NAME_ccim_newly_joined_bonus: "Nouveau membre de la confédération"
 ccim_newly_joined_bonus: "Nouveau membre de la confédération"
 ccim_newly_joined_bonus_desc: "Un sentiment renouvelé de détermination suit notre entrée dans la Confédération mésoaméricaine. Nos guerriers sont encouragés et leur moral augmente."
 STATIC_MODIFIER_NAME_ccim_confederation_betrayer: "Abandon de la confédération"
 ccim_confederation_betrayer: "Abandon de la confédération"
 ccim_confederation_betrayer_desc: "Nous avons abandonné la Confédération mésoaméricaine à l'heure où elle en avait le plus besoin. Nos guerriers sont démoralisés et notre réputation auprès des peuples autochtones est entachée."
 STATIC_MODIFIER_NAME_ccim_war_council_boost: "Décret du conseil de guerre"
 ccim_war_council_boost: "Décret du conseil de guerre"
 ccim_war_council_boost_desc: "Le conseil de guerre de la confédération a publié un décret de mobilisation totale. Chaque État membre engage ses guerriers pour une cause commune."

 # ========================
 # IO LEADER ACTIONS
 # ========================
 ccim_io_war_council: "Convoquer le conseil de guerre"
 ccim_io_war_council_desc: "Convoquez le conseil de guerre et promulguez un décret de mobilisation totale. Tous les membres de la confédération reçoivent un bonus de moral militaire et de levées. Nécessite d'être en guerre. Coûte 15 d'Unité de Confédération. Ne peut être répété avant 5 ans."

 ccim_io_tribute_levy: "Lever un tribut de confédération"
 ccim_io_tribute_levy_desc: "Invoquer le droit de lever un tribut. Chaque membre qui n'est pas le chef verse 20 d'or au trésor de guerre du chef. L'extraction du tribut pèse sur la bonne volonté des membres. Coûte 10 d'Unité de Confédération. Ne peut être utilisé en temps de guerre. Ne peut être répété avant 8 ans."

 ccim_io_send_envoys: "Envoyer des envoyés de la Confédération"
 ccim_io_send_envoys_desc: "Dépêcher des envoyés avec des cadeaux et une invitation formelle à une puissance indigène indépendante voisine. S'ils acceptent, ils rejoindront la Confédération mésoaméricaine. Coûte 50 d'or et 10 d'unité de la Confédération. Ne peut être répété avant 3 ans."

 ccim_io_strike_invaders: "Frapper les envahisseurs"
 ccim_io_strike_invaders_desc: "Délivrer le mandat de guerre de la confédération contre une puissance coloniale voisine. Si un casus belli est déjà détenu contre la cible, la guerre est déclarée immédiatement et tous les membres reçoivent un bonus de combat. Sinon, le casus belli est accordé pour une utilisation ultérieure. Gagne 20 d'unité de confédération. Ne peut être répété avant 10 ans."

 ccim_io_absorb_tribe: "Absorber une tribu voisine"
 ccim_io_absorb_tribe_desc: "Utilisez l'autorité de la confédération pour absorber diplomatiquement une nation indigène indépendante voisine, annexant ses terres au domaine du chef. Coûte 25 d'Unité de Confédération. Ne peut être répété pendant 15 ans."

 # Action target choice UI
 ccim_choose_envoy_target: "Choisissez une nation indigène à inviter"
 ccim_choose_strike_target: "Choisissez une puissance coloniale à frapper"
 ccim_choose_absorb_target: "Choisissez une tribu voisine à absorber"

 # CB
 cc_repel_invaders: "Expulser les envahisseurs"
 cc_repel_invaders_desc: "La Confédération mésoaméricaine a émis un mandat pour expulser les forces coloniales des terres sacrées de Mésoamérique."

 # ========================
 # EVENTS 60–63 (IO Confederation)
 # ========================
 cc_invasion_mexico.60.title: "Le conseil de la confédération délibère"
 cc_invasion_mexico.60.desc: "La saison a tourné, et les chefs de la confédération se sont réunis. En tant que chef suprême, tous les regards se tournent vers vous : sur quoi la confédération doit-elle concentrer son énergie dans les mois à venir ? Vers la guerre et la préparation, ou vers le renforcement des liens entre nos peuples ?"
 cc_invasion_mexico.60.a: "Concentrer nos efforts sur la préparation militaire — les envahisseurs n'attendront pas."
 cc_invasion_mexico.60.b: "Investir dans les liens entre nos peuples. L'unité est notre meilleure arme. [Root.GetTreasuryCost(40)|Y]"
 cc_invasion_mexico.60.c: "Envoyer des envoyés aux peuples voisins — étendre la portée de la confédération."

 cc_invasion_mexico.61.title: "La confédération se fracture"
 cc_invasion_mexico.61.desc: "Des dépêches inquiétantes nous parviennent de toute la confédération. Les différends sur les ressources, l'autorité et les obligations ont éclaté. Certains États membres envisagent de se retirer. La confédération qui servait de rempart contre la conquête pourrait s'effondrer de l'intérieur si nous n'agissons pas."
 cc_invasion_mexico.61.a: "Convoquer un conseil d'urgence. Unir les peuples — quel qu'en soit le prix. [Root.GetTreasuryCost(60)|Y]"
 cc_invasion_mexico.61.b: "Laissons les tensions suivre leur cours. On ne peut forcer l'unité véritable."

 cc_invasion_mexico.62.title: "Le Grand Prêtre Bénit la Confédération"
 cc_invasion_mexico.62.desc: "Le grand prêtre a convoqué les chefs de la confédération dans l'enceinte sacrée pour une cérémonie d'unité et de faveur divine. Les tambours battent, l'encens emplit l'air et les prêtres lisent les augures pour l'ensemble de la confédération. Que nous honorions pleinement la cérémonie ou que nous la reportions pour des raisons pratiques, ce moment exige une réponse."
 cc_invasion_mexico.62.a: "Honorer la cérémonie dans toute sa splendeur. Les dieux de tous nos peuples nous béniront."
 cc_invasion_mexico.62.b: "Lui transmettre nos salutations, mais nos guerriers ont besoin d'action, pas de prières."

 cc_invasion_mexico.63.title: "Envoyés de la Confédération mésoaméricaine"
 cc_invasion_mexico.63.desc: "Une délégation arrive avec des présents de jade, de plumes et de grains — ainsi qu'une invitation formelle. La Confédération mésoaméricaine nous offre une place parmi ses États membres : défense commune, aide mutuelle et protection d'un front indigène uni contre les envahisseurs étrangers pressant depuis la côte. C'est une offre qui mérite d'être soigneusement pesée."
 cc_invasion_mexico.63.a: "Nous acceptons l'invitation. Notre peuple se tiendra aux côtés de la confédération."
 cc_invasion_mexico.63.b: "Nous déclinons. Notre chemin, c'est à nous de le choisir."

 # ========================
 # EVENT 64 — The Fall of Our Neighbors (fear cascade)
 # ========================
 cc_invasion_mexico.64.title: "La chute de nos voisins"
 cc_invasion_mexico.64.desc: "Un peuple voisin a été assujetti par les envahisseurs. Leurs guerriers vaincus, leurs chefs humiliés, leurs terres réparties entre des seigneurs étrangers. Les émissaires de la confédération présentent leur cas avec une urgence renouvelée : « Vous avez vu ce qui arrive à ceux qui restent seuls. Notre offre ne restera pas ouverte éternellement. »"
 cc_invasion_mexico.64.a: "Leur destin a décidé pour nous. Nous rejoignons la confédération."
 cc_invasion_mexico.64.b: "Nous négocierons nos propres conditions avec les envahisseurs."

 # ========================
 # EVENT 70 — The Hour of Conquest (Colonial War Push)
 # ========================
 cc_invasion_mexico.70.title: "L'Heure de la Conquête"
 cc_invasion_mexico.70.desc: "Nos commandants insistent avec une vigueur croissante : nous détenons un casus belli, nos forces sont rassemblées, et les puissances indigènes s'enforcent chaque saison que nous tardons. La fenêtre d'opportunité est ouverte — mais les fenêtres ne restent pas ouvertes éternellement."
 cc_invasion_mexico.70.a: "Donnez l'ordre. Commencez la campagne."
 cc_invasion_mexico.70.b: "Nous devons d'abord consolider notre position."

 # Situation end reason descriptions
 ccim_end_year_limit: "L'ère des conquêtes est passée — l'année 1600 a été atteinte."
 ccim_end_natives_subjugated: "Toutes les puissances indigènes indépendantes de Mésoamérique ont été subjuguées ou détruites."
