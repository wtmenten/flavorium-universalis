 # Wealth Hoarding Events

 cc_wealth.1.title: "Sauver les apparences"
 cc_wealth.1.desc: "Notre trésor a gonflé au-delà de tout besoin pratique. La cour s'impatiente — les nobles bavardent sur notre avarice, et les puissances mineures observent notre immobilité avec curiosité. Les apparences doivent être sauvées, d'une manière ou d'une autre."
 cc_wealth.1.a: "Organisez les grandes cérémonies."
 cc_wealth.1.b: "Notre argent a des usages plus utiles que le spectacle."

 cc_wealth.2.title: "Une fête somptueuse"
 cc_wealth.2.desc: "Nos ministres ont proposé une célébration extraordinaire — un rassemblement de cours, un festival du royaume. Cela coûterait une somme considérable, mais le prestige gagné pourrait bien valoir la dépense."
 cc_wealth.2.a: "Ne ménagez pas vos dépenses. Qu'ils s'émerveillent."
 cc_wealth.2.b: "Une soirée tranquille suffira."

 cc_wealth.3.title: "La noblesse exige des constructions"
 cc_wealth.3.desc: "La haute noblesse s'est imprimée d'impatience. Notre trésorerie, disent-ils, devrait être orientée vers des œuvres tangibles — des fortifications, des complexes manoriaux, des institutions qui cimentent le pouvoir noble. Ils sont venus avec un prix."
 cc_wealth.3.a: "Financer la construction."
 cc_wealth.3.b: "Notre trésor nous appartient en propre."

 cc_wealth.5.title: "Les marchands exigent des investissements"
 cc_wealth.5.desc: "La classe bourgeoise s'est impatientée. Notre trésor accumulé, soutiennent-ils, devrait être utilisé pour étendre les infrastructures commerciales. Ils ont présenté une proposition — et un prix."
 cc_wealth.5.a: "Financer l'expansion."
 cc_wealth.5.b: "Leurs ambitions ne sont pas notre obligation."

 cc_wealth.6.title: "Le clergé exige des œuvres sacrées"
 cc_wealth.6.desc: "Le clergé a noté l'ampleur de notre trésor avec une inquiétude spirituelle. La richesse thésaurisée n'apporte aucune bénédiction, disent-ils — seules les œuvres dédiées au divin peuvent justifier une telle accumulation. Ils ont fixé un prix."
 cc_wealth.6.a: "Financer les œuvres sacrées."
 cc_wealth.6.b: "Le trésor n'est pas une dîme."

 cc_wealth.4.title: "Une arrivée ambitieuse"
 cc_wealth.4.desc: "La nouvelle de la prospérité de notre royaume s'est répandue. Une figure capable — érudit, soldat ou homme d'État — est arrivée à la cour en cherchant un emploi. Leurs services ont un prix, mais un talent de ce genre ne se présente que rarement deux fois."
 cc_wealth.4.a: "Accueillons-les. Payons le prix."
 cc_wealth.4.b: "Nous en avons assez à la cour."

