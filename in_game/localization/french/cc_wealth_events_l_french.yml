 cc_wealth_corruption_5: "Richesse concentrée (V)"
 cc_wealth_corruption_5_desc: "Lorsque la couronne thésaurise, les États le remarquent. Des arrangements parasitaires enrichissent discrètement la noblesse et le clergé aux dépens de la légitimité royale."
 cc_wealth.7.title: "Une démolition profitable"
 cc_wealth.7.desc: "L'un des États a proposé un arrangement particulier. En échange d'une somme importante provenant du trésor, ils supprimeront l'une de leurs propres structures domaniales — rendant la terre disponible pour d'autres usages et levant des capitaux immédiats. C'est une offre inhabituelle, mais l'or est bien réel."
 cc_wealth.7.a: "Acceptez leurs conditions."
 cc_wealth.7.b: "Refuser. L'arrangement ne nous convient pas."

 cc_wealth.8.title: "Une proposition d'investissement bourgeois"
 cc_wealth.8.desc: "La classe marchande a identifié un emplacement urbain prospère prêt pour l'expansion. Ils sont prêts à financer les travaux préparatoires — préparation des fondations, déblaiement des terrains, coordination de la construction — en échange d'une part du trésor proportionnelle à la richesse du lieu."
 cc_wealth.8.a: "Acceptez. Financez l'expansion."
 cc_wealth.8.b: "Décliner pour le moment."

 cc_wealth_urban_construction: "Expansion urbaine bourgeoise"
 cc_wealth_urban_construction_desc: "Les bourgeois ont préparé cet emplacement pour un développement accéléré, fournissant trois emplacements de bâtiments supplémentaires pendant dix ans."
 STATIC_MODIFIER_NAME_cc_wealth_urban_construction: "Expansion urbaine bourgeoise"
