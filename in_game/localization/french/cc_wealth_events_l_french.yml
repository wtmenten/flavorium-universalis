 # Wealth Corruption Modifier Names

 cc_wealth_corruption_1: "Richesse concentrée (I)"
 cc_wealth_corruption_1_desc: "Lorsque la couronne thésaurise, les États le remarquent. Des arrangements parasitaires enrichissent discrètement la noblesse et le clergé aux dépens de la légitimité royale."
 cc_wealth_corruption_2: "Richesse concentrée (II)"
 cc_wealth_corruption_2_desc: "Lorsque la couronne thésaurise, les États le remarquent. Des arrangements parasitaires enrichissent discrètement la noblesse et le clergé aux dépens de la légitimité royale."
