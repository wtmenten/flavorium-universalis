l_french:

 # ============================================================
 # AoR FEDERAL BOND EVENTS — cc_bonds.140–145
 # ============================================================

 # === cc_bonds.140 — The Federal Member Stands with the Union ===
 cc_bonds.140.title: "Le membre fédéral soutient l'Union"
 cc_bonds.140.desc: "L'ère des révolutions est arrivée et chaque lien de loyauté est mis à l'épreuve. [bond_subj.GetName] a réussi l'épreuve avec une clarté qui ne nécessite aucune interprétation. Leur parlement a renouvelé le pacte fédéral, leurs dirigeants se sont exprimés publiquement en faveur de l'union et leur population, à un moment où il aurait été facile de détourner le regard, ne l'a pas fait. Des années de traitement égalitaire et de consultations sincères ont produit ce qu'aucun administrateur ne peut fabriquer."
 cc_bonds.140.a: "Célébrez cela publiquement. L'empire est bâti sur des relations comme celle-ci."
 cc_bonds.140.b: "Formaliser l'accord. Que le parlement fédéral, et non la couronne, maintienne l'union."

 # === cc_bonds.141 — The Federal Member Demands Equal Rights ===
 cc_bonds.141.title: "Le membre fédéral exige l'égalité des droits"
 cc_bonds.141.desc: "L'ère des révolutions a atteint [bond_subj.GetName], et leur parlement a rédigé un document tranchant : une demande formelle de représentation égale et de statut égal au sein du pacte fédéral, entendue au sens concret et non simplement sur le papier. Le document est calme dans le ton et dévastateur dans son contenu. Il énumère les décisions où leur représentation a été ignorée et les moments où « fédéral » s'est avéré signifier « sujet à révision ». Ils ne menacent pas d'indépendance. Ils demandent si la fédération est réelle."
 cc_bonds.141.a: "C'est réel. Accordez-leur la pleine représentation à laquelle ils ont droit."
 cc_bonds.141.b: "La demande est notée. La réponse est non."

 # === cc_bonds.142 — The Associate Member Submits Its Petition ===
 cc_bonds.142.title: "Le membre associé soumet sa pétition"
 cc_bonds.142.desc: "La direction de [bond_subj.GetName] a soumis une pétition formelle. Ce n'est pas une exigence, car ils sont trop prudents pour cela, mais c'est ce qui s'en rapproche le plus. Ils demandent avec une délicatesse considérable si les conditions d'une pleine adhésion fédérale pourraient désormais être envisagées, et ils soulignent leurs contributions économiques, leur soutien militaire et leurs années de coopération malgré les limites du statut d'associé. Ils demandent parce qu'ils l'ont mérité et soupçonnent que la cour pourrait être d'accord."
 cc_bonds.142.a: "Approuver la pétition. Les élever au rang de membre fédéral à part entière."
 cc_bonds.142.b: "En prendre acte. Honorer la demande avec de l'or et une promesse d'examen."
 cc_bonds.142.c: "Écarter la demande. Ils sont un membre associé, et cela suffit."

 # === cc_bonds.143 — The False Federation Unravels ===
 cc_bonds.143.title: "La fausse fédération s'effondre"
 cc_bonds.143.desc: "Quelqu'un a fait les comptes. Les dépêches de [bond_subj.GetName] indiquent clairement que le bilan est terminé et que les chiffres ne sont pas favorables. La charte promettait un statut égal et une gouvernance partagée ; les années qui ont suivi n'ont apporté qu'une extraction massive et des décisions imposées sans consultation, dans un arrangement qui, à l'examen, ressemble à la relation coloniale qu'il était censé remplacer. Les pamphlets qui circulent dans leur capitale ont cessé de soutenir que l'indépendance est souhaitable pour affirmer qu'elle est nécessaire."
 cc_bonds.143.a: "Mettre fin aux faux-semblants. Convertir la charte en administration directe."
 cc_bonds.143.b: "Acheter le silence. Payer le prix nécessaire pour stabiliser la situation."
 cc_bonds.143.c: "Rendez la charte réelle plutôt que de défendre le mensonge."

 # === cc_bonds.144 — The Colony Asserts Its Place ===
 cc_bonds.144.title: "La colonie affirme sa place"
 cc_bonds.144.desc: "Le message venant de [bond_subj.GetName] n'est ni une pétition ni une exigence, mais quelque chose de plus difficile à recevoir : une déclaration. La direction coloniale écrit qu'elle a observé les courants révolutionnaires balayer le monde et qu'elle n'en a pas peur, car elle croit détenir quelque chose que ces courants ne peuvent offrir, construit sur des décennies d'honnêteté et de gouvernance partagée. Ils aimeraient que cette relation soit formalisée, en tant que partenaires plutôt qu'en tant que sujets. Ils croient que le moment est venu et que l'empire en sera plus fort."
 cc_bonds.144.a: "Accueillez-les comme des partenaires fédéraux de plein droit. L'union en sera plus forte."
 cc_bonds.144.b: "Offrez un statut de membre associé. Une étape concrète, même si ce n'est pas celle qu'ils ont demandée."
 cc_bonds.144.c: "Invitez-les au Conseil Impérial comme première étape."
 cc_bonds.144.d: "Refuser. L'arrangement actuel nous sert adéquatement."

 # === cc_bonds.145 — The Client Seeks Cover ===
 cc_bonds.145.title: "Le client cherche un abri"
 cc_bonds.145.desc: "La direction de [bond_subj.GetName] a envoyé une communication privée. Ils ont observé l'Âge des Révolutions et ont identifié quelque chose que la rhétorique révolutionnaire ne peut leur offrir : la stabilité sous un cadre impérial reconnu. Ce qu'ils veulent, c'est la légitimité, celle qui vient du fait d'être un partenaire nommé dans un arrangement constitutionnel plutôt qu'un client informel dont le statut repose sur la bonne volonté du gouvernement actuel. Ils demandent à être intégrés. La question est de savoir quel genre d'intégration nous proposons."
 cc_bonds.145.a: "Les intégrer au Conseil Impérial. Un véritable arrangement constitutionnel."
 cc_bonds.145.b: "Offrez-leur une charte fédérale. Le partenariat qu'ils souhaitent, mais selon nos conditions."
 cc_bonds.145.c: "Maintenir l'arrangement actuel. Il n'est pas nécessaire de formaliser quoi que ce soit."

 # ============================================================
 # SYNERGY EVENTS — cc_synergy.27–28
 # ============================================================

 # === cc_synergy.27 — National Reformer + Federal Architect ===
 cc_synergy.27.title: "Un parlement pour l'Empire"
 cc_synergy.27.desc: "Deux des esprits les plus influents de la cour se sont entretenus. [minister_a.GetName], qui a passé sa carrière à repenser l'architecture interne de l'État, et [minister_b.GetName], qui a consacré la sienne à maintenir les divers territoires de l'empire dans une relation productive — ils ont trouvé un projet commun. Ils proposent la formalisation d'un parlement fédéral : un organe doté d'un véritable statut législatif, représentant les territoires membres proportionnellement à leurs contributions, avec une autorité réelle sur les questions communes de défense, de commerce et de droit. Ils demandent si la Couronne est prête à gouverner un empire par la loi plutôt que par la volonté."
 cc_synergy.27.a: "Oui. Commandez le Pacte Fédéral et convoquez le parlement."
 cc_synergy.27.b: "Un premier pas plus modeste. Formalisons l'harmonie parlementaire et voyons ce qui s'ensuit."

 # === cc_synergy.28 — Federal Architect + False Federal Member ===
 cc_synergy.28.title: "L'architecte lit la charte"
 cc_synergy.28.a: "Concrétiser les choses. Convertir la charte en une adhésion fédérale complète."
 cc_synergy.28.b: "Réforme partielle. Élevez-les au rang de membres associés — une amélioration réelle."
 cc_synergy.28.c: "L'arrangement est profitable. Laissons-le tel quel."
 cc_synergy.28.desc: "[minister.GetName] a passé du temps à examiner l'arrangement de la charte avec [bond_subj.GetName], et son évaluation est inconfortable. Le document, lu attentivement, est une charte fédérale de nom et un pacte colonial en pratique. Le parlement des membres n'a aucune autorité contraignante. La représentation est consultative. L'arrangement économique coule dans une seule direction. Elle ne dit pas cela pour embarrasser la cour. Elle le dit parce qu'elle croit que l'arrangement est un handicap : quand la population de [bond_subj.GetName] comprendra pleinement ce qu'on lui a donné au lieu de ce qu'on lui a promis, la réaction sera pire que si la tromperie n'avait jamais eu lieu. La question est de savoir si la cour veut corriger cela tant que le faire est encore un choix."
 cc_bonds.140.desc.deep: "Le parlement de [bond_subj.GetName] a fait plus que renouveler le pacte. Il a voté l'envoi de ses propres régiments pour garnisonner des provinces qui ne sont pas les siennes, au motif que l'union est un seul pays ou qu'elle n'est rien. Le débat était public, le vote n'était pas serré, et la transcription a été réimprimée dans trois autres capitales fédérales. Ils ne nous défendent pas. Ils défendent quelque chose qu'ils considèrent en partie comme leur."
 cc_bonds.141.desc.deep: "Le parlement de [bond_subj.GetName] a répondu à sa propre question. Il a adopté une résolution déclarant le pacte fédéral nul pour non-exécution, a cité quarante ans de précédents, et s'est ajourné. Leurs délégués sont rentrés chez eux. Aucune troupe n'a bougé et aucune déclaration n'a été publiée, ce qui, d'une certaine manière, rend la chose pire : ils ne se sont pas rebellés contre l'union, ils ont décrété qu'elle n'existait pas."
 cc_bonds.141.desc.scholar: "La demande de [bond_subj.GetName] n'est pas écrite dans le langage des pétitions. Elle est écrite dans le langage du savant que nous avons supprimé il y a une génération, et dont les arguments sur le consentement et le pacte étaient assez dangereux pour être réduits au silence, mais apparemment pas assez pour recevoir une réponse. Leur parlement a adopté son cadre intégralement. Nous avions la chance de débattre avec un seul homme. Nous débattons maintenant avec une législature qui l'a mémorisé."
 cc_bonds.141.c: "Dissoudre l'union plutôt que de se battre pour un mot."
 cc_bonds.142.desc.deep: "La pétition de [bond_subj.GetName] arrive avec une annexe que personne n'a demandée : une comparaison de leurs contributions par rapport à celles de deux membres de plein droit, sur soixante ans, sources à l'appui. Le dossier est irréfutable et ils le savent. Ils ont également pris soin de le soumettre en privé plutôt que de le publier, ce qui est l'élément le plus persuasif du document."
 cc_bonds.143.desc.deep: "La charte de [bond_subj.GetName] a été lue à haute voix dans leur assemblée, clause par clause, suivie après chacune d'elles du compte rendu correspondant de ce qui s'est réellement passé. Cela a pris deux jours. Une transcription circule déjà dans chaque capitale ayant jamais signé quoi que ce soit avec nous. La fédération ne s'effiloche pas. Elle a été publiquement démontée par des gens qui tenaient des registres plus rigoureux que nous."
 cc_bonds.143.d: "Laissez la situation évoluer. Nous avons déjà géré des crises auparavant."
 cc_bonds.144.desc.deep: "L'assemblée coloniale de [bond_subj.GetName] a voté pour la fédération et a envoyé le résultat avec une délégation plutôt qu'un coursier. Leur argument est qu'ils ont fonctionné comme un partenaire pendant deux générations et qu'ils préféreraient que la paperasse rattrape la réalité. Ils ont également précisé, avec courtoisie, qu'ils ont envisagé l'alternative et l'ont rejetée sur le fond plutôt que par manque d'opportunité."
 cc_bonds.144.desc.voice: "L'assemblée que nous avons charteé il y a des décennies a voté, et elle a voté pour la fédération. Ce vote est l'argument même : ils demandent de formaliser quelque chose qu'ils pratiquent depuis le jour où nous leur avons donné une salle pour le faire. Toutes les autres colonies du monde découvrent cette année ce qui arrive quand il n'y a aucun endroit pour tenir le débat. Celle-ci l'a tenu, et est arrivée à une conclusion acceptable pour nous."
 cc_bonds.145.desc.deep: "La communication de [bond_subj.GetName] est inhabituellement directe pour un État client. Ils affirment clairement avoir été approchés par deux autres puissances cette année, et ils préféreraient rester. Ils nous demandent de leur donner une raison qui survivra au prochain changement de gouvernement dans notre capitale. Une charte conviendrait. La bonne volonté, notent-ils, ne suffit plus."
