l_french:

 # ============================================================
 # AoR FEDERAL BOND EVENTS — cc_bonds.140–145
 # ============================================================

 # === cc_bonds.140 — The Federal Member Stands with the Union ===
 cc_bonds.140.title: "Le membre fédéral soutient l'Union"
 cc_bonds.140.desc: "L'ère des révolutions est arrivée, et le test de chaque lien de loyauté l'a accompagnée. [bond_subj.GetName] a passé ce test avec une clarté qui ne nécessite aucune interprétation. Leur parlement a formellement renouvelé le pacte fédéral, leurs dirigeants se sont exprimés publiquement en faveur de l'union, et leur population — dans un moment politique où il aurait été facile de fermer les yeux — ne l'a pas fait. Les années de traitement égal, de consultation sincère, de gouvernance partagée plutôt que d'autorité imposée, ont produit ce qu'aucun administrateur colonial ne peut fabriquer : un peuple qui a décidé, de son propre chef, que cette union mérite d'être défendue."
 cc_bonds.140.a: "Célébrez cela publiquement. L'empire est bâti sur des relations comme celle-ci."
 cc_bonds.140.b: "Formaliser le lien — étendre leur représentation au parlement fédéral."

 # === cc_bonds.141 — The Federal Member Demands Equal Rights ===
 cc_bonds.141.title: "Le membre fédéral exige l'égalité des droits"
 cc_bonds.141.desc: "L'ère des révolutions a atteint [bond_subj.GetName], et leur parlement a rédigé un document incisif : une demande formelle de représentation égale, de droits égaux et d'un statut égal au sein du pacte fédéral — non pas l'égalité sur le papier qui leur avait été promise, mais l'égalité concrète qu'ils n'ont pas reçue. Le document est calme dans le ton et dévastateur dans le contenu. Il énumère, avec précision, les décisions où leur représentation a été ignorée, les lois où leurs intérêts ont été écartés, les moments où le mot « fédéral » s'est avéré signifier « soumis à révision ». Ils ne menacent pas d'indépendance. Ils demandent si la fédération est réelle."
 cc_bonds.141.a: "C'est réel. Accordez-leur la pleine représentation à laquelle ils ont droit."
 cc_bonds.141.b: "La demande est notée. La réponse est non."

 # === cc_bonds.142 — The Associate Member Submits Its Petition ===
 cc_bonds.142.title: "Le membre associé soumet sa pétition"
 cc_bonds.142.desc: "La direction de [bond_subj.GetName] a soumis une pétition formelle. Ce n'est pas une exigence — ils sont trop prudents pour cela — mais c'est ce qui s'en rapproche le plus. Ils demandent, avec une délicatesse diplomatique considérable, si les conditions d'une adhésion fédérale complète pourraient désormais être envisagées. Ils mettent en avant leurs contributions économiques, leur soutien militaire et leurs années de coopération malgré les limitations du statut d'associé. Ils ne demandent pas l'égalité par sentiment de droit, mais parce qu'ils l'ont méritée et croient, prudemment, que la cour pourrait être d'accord."
 cc_bonds.142.a: "Approuver la pétition. Les élever au rang de membre fédéral à part entière."
 cc_bonds.142.b: "Prenez acte de la pétition — honorez-la par de l'or et une promesse d'examen."
 cc_bonds.142.c: "Rejeter la pétition. Ils sont membres associés, et cela suffit."

 # === cc_bonds.143 — The False Federation Unravels ===
 cc_bonds.143.title: "La fausse fédération s'effondre"
 cc_bonds.143.desc: "Quelqu'un a fait les comptes. Les dépêches de [bond_subj.GetName] indiquent clairement que le bilan a été établi, et les chiffres ne sont pas favorables. La charte fédérale promettait un statut égal, une gouvernance partagée et un partenariat sincère. Les années écoulées n'ont apporté qu'une extraction massive, des décisions administratives imposées sans consultation et un arrangement politique qui, à l'examen, ressemble davantage à la relation coloniale qu'il était censé remplacer. La direction de [bond_subj.GetName] n'est pas encore en révolte ouverte. Mais les pamphlets révolutionnaires qui circulent dans la capitale ont cessé de soutenir que l'indépendance est souhaitable. Ils commencent à soutenir qu'elle est nécessaire."
 cc_bonds.143.a: "Mettre fin aux faux-semblants. Convertir la charte en administration directe."
 cc_bonds.143.b: "Acheter le silence. Payer le prix nécessaire pour stabiliser la situation."
 cc_bonds.143.c: "Laissez les événements se dérouler. Nous avons déjà géré des crises auparavant."

 # === cc_bonds.144 — The Colony Asserts Its Place ===
 cc_bonds.144.title: "La colonie affirme sa place"
 cc_bonds.144.desc: "Le message de [bond_subj.GetName] n'est ni une pétition, ni une exigence — c'est quelque chose de plus difficile à recevoir : un constat. Les dirigeants coloniaux ont écrit pour dire, avec une assurance considérable, qu'ils ont observé les courants révolutionnaires qui balaient le monde, et qu'ils n'en ont pas peur. Ils n'ont pas peur car ils croient posséder quelque chose que ces courants ne peuvent offrir : une relation authentique avec la métropole impériale, bâtie sur des décennies de transactions honnêtes, de gouvernance partagée et d'investissements mutuels. Ils écrivent pour dire qu'ils souhaiteraient que cette relation soit formalisée — non pas comme des sujets, mais comme des partenaires. Ils estiment que le moment est venu pour un arrangement fédéral, et ils croient que l'empire en sera renforcé."
 cc_bonds.144.a: "Accueillons-les comme partenaires fédéraux à part entière. L'union en sort renforcée."
 cc_bonds.144.b: "Proposer un statut de membre associé — une étape concrète, même si elle n'est pas complète comme ils l'ont demandé."
 cc_bonds.144.c: "Les inviter au Conseil Impérial dans un premier temps."
 cc_bonds.144.d: "Refuser. L'arrangement actuel nous sert adéquatement."

 # === cc_bonds.145 — The Client Seeks Cover ===
 cc_bonds.145.title: "Le client cherche un abri"
 cc_bonds.145.desc: "La direction de [bond_subj.GetName] a envoyé une communication privée. Ils ont observé l'Âge des Révolutions et ont identifié quelque chose que la rhétorique révolutionnaire ne peut leur offrir : la stabilité au sein d'un cadre impérial reconnu. Ce qu'ils recherchent, c'est la légitimité — celle qui découle du fait d'être un partenaire nommé dans un arrangement constitutionnel plus vaste, plutôt qu'un client informel dont le statut dépend entièrement de la bonne volonté du gouvernement actuel. En résumé, ils demandent à être intégrés. La question est de savoir quel type d'intégration nous leur proposons."
 cc_bonds.145.a: "Intégrez-les au Conseil Impérial — un véritable arrangement constitutionnel."
 cc_bonds.145.b: "Leur offrir une charte fédérale — le partenariat qu'ils souhaitent, mais selon nos conditions."
 cc_bonds.145.c: "Maintenir l'arrangement actuel. Il n'est pas nécessaire de formaliser quoi que ce soit."

 # ============================================================
 # SYNERGY EVENTS — cc_synergy.27–28
 # ============================================================

 # === cc_synergy.27 — National Reformer + Federal Architect ===
 cc_synergy.27.title: "Un parlement pour l'Empire"
 cc_synergy.27.desc: "Deux des esprits les plus influents de la cour se sont entretenus. [minister_a.GetName], qui a passé sa carrière à repenser l'architecture interne de l'État, et [minister_b.GetName], qui a consacré la sienne à maintenir les divers territoires de l'empire dans une relation productive — ils ont trouvé un projet commun. Ils proposent la formalisation d'un parlement fédéral : un organe doté d'un véritable statut législatif, représentant les territoires membres proportionnellement à leurs contributions, avec une autorité réelle sur les questions communes de défense, de commerce et de droit. Ils demandent si la Couronne est prête à gouverner un empire par la loi plutôt que par la volonté."
 cc_synergy.27.a: "Oui. Commandez le Pacte Fédéral et convoquez le parlement."
 cc_synergy.27.b: "Un premier pas plus modeste. Formalisons l'harmonie parlementaire et voyons ce qui s'ensuit."

 # === cc_synergy.28 — Federal Architect + False Federal Member ===
 cc_synergy.28.title: "L'architecte lit la charte"
 cc_synergy.28.a: "Concrétiser les choses. Convertir la charte en une adhésion fédérale complète."
 cc_synergy.28.b: "Réforme partielle. Élevez-les au rang de membres associés — une amélioration réelle."
 cc_synergy.28.c: "L'arrangement est profitable. Laissons-le tel quel."
 cc_synergy.28.desc: "[minister.GetName] a passé du temps à examiner l'arrangement de la charte avec [bond_subj.GetName], et son évaluation est inconfortable. Le document, lu attentivement, est une charte fédérale de nom et un pacte colonial en pratique. Le parlement des membres n'a aucune autorité contraignante. La représentation est consultative. L'arrangement économique coule dans une seule direction. Elle ne dit pas cela pour embarrasser la cour. Elle le dit parce qu'elle croit que l'arrangement est un handicap : quand la population de [bond_subj.GetName] comprendra pleinement ce qu'on lui a donné au lieu de ce qu'on lui a promis, la réaction sera pire que si la tromperie n'avait jamais eu lieu. La question est de savoir si la cour veut corriger cela tant que le faire est encore un choix."
