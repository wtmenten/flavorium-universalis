l_french:
 # ============================================================
 # Colonial Divan Events — Pillar 07
 # ============================================================

 # ============================================================
 # Section A — Colonial Posting Events (cc_posting namespace)
 # ============================================================

 # --- cc_posting.1 — The Governor's Dispatch ---
 cc_posting.1.title: "La dépêche du gouverneur"
 cc_posting.1.desc: "Une lettre scellée est arrivée de la part de [minister.GetName], envoyée d'outre-mer où [minister.GetHerHis|c] gouverne [colony.GetName]. Son compte rendu de la situation dans la colonie est mesuré et professionnel — mais la couronne doit maintenant décider comment répondre aux besoins que [minister.GetHeShe] décrit."

 cc_posting.1.a: "Investir dans l'avenir de la colonie."
 cc_posting.1.a.tooltip: "L'argent s'écoule vers [colony.GetName]. L'investissement accélérera la prospérité coloniale et améliorera les relations économiques — un pari à long terme sur l'expansion de l'empire."

 cc_posting.1.b: "La dépêche est satisfaisante — accusez-en réception."
 cc_posting.1.b.tooltip: "Les rapports minutieux de [minister.GetName] témoignent de la qualité de son service. Un mot de reconnaissance royale affutera son acuité diplomatique[minister.GetHerHis][minister.GetHerHis]."

 cc_posting.1.c: "Exiger que la colonie envoie davantage de tributs immédiatement."
 cc_posting.1.c.tooltip: "Les besoins de l'empire sont prioritaires. Les revenus rentrent à la maison — mais les administrateurs coloniaux déploreront l'extraction, et le lien avec [colony.GetName] s'effritera."

 # --- cc_posting.2 — Corruption in the Colony ---
 cc_posting.2.title: "Corruption dans la colonie"
 cc_posting.2.desc: "[minister.GetName] a découvert un schéma d'irrégularités financières parmi les fonctionnaires coloniaux de [colony.GetName]. Des fonds destinés aux infrastructures ont été détournés ; les comptes ne sont pas équilibrés. [minister.GetHeShe] écrit pour obtenir des directives."

 cc_posting.2.a: "L'éradiquer — renvoyer les fonctionnaires corrompus."
 cc_posting.2.a.tooltip: "Une réponse ferme rétablit l'ordre. Un [minister.GetName] possédant une expertise administrative transformera la crise en réforme ; sans cela, le nettoyage coûtera tout de même au trésor."

 cc_posting.2.b: "Prendre une commission personnelle et fermer les yeux."
 cc_posting.2.b.tooltip: "La corruption est discrètement partagée plutôt qu'éliminée. L'or revient à la couronne — mais les finances de la colonie se détériorent davantage, et le caractère de [minister.GetName] pourrait être durablement marqué par ce choix."

 cc_posting.2.c: "Rapporter les faits — ne pas interférer."
 cc_posting.2.c.tooltip: "Un rapport formel est déposé et rien n'est fait. L'inaction coûte du prestige et trouble la cour, mais au moins, aucun dommage supplémentaire n'est infligé."

 # --- cc_posting.3 — A Native Uprising ---
 cc_posting.3.title: "Un soulèvement indigène"
 cc_posting.3.desc: "Les communautés autochtones du territoire entourant [colony.GetName] se sont soulevées en une résistance armée. [minister.GetName] écrit avec une demande urgente : la couronne doit décider de la manière de répondre avant que la situation ne s'aggrave davantage."

 cc_posting.3.a: "Envoyer des forces coloniales — réprimer l'insurrection."
 cc_posting.3.a.tooltip: "Les troupes sont dépêchées. L'insurrection est brisée par la force, mais la relation de la population coloniale avec la couronne est durablement marquée — et la levée d'hommes se fait sentir dans la métropole."

 cc_posting.3.b: "Négocier un règlement."
 cc_posting.3.b.tooltip: "L'or et les concessions achètent une paix fragile. La solution diplomatique coûte au trésor mais rapporte du prestige — et [minister.GetName] s'impose comme un négociateur plus habile."

 cc_posting.3.c: "S'engager dans une pacification militaire totale."
 cc_posting.3.c.tooltip: "Une campagne militaire complète est lancée pour mettre fin définitivement à la résistance. Le coût en hommes et en stabilité est sévère, mais [minister.GetName] est endurci par l'expérience."

 # --- cc_posting.4 — Fever in the Colony ---
 cc_posting.4.title: "Fièvre dans la colonie"
 cc_posting.4.desc: "Une lettre arrive apportant des nouvelles lugubres : la fièvre tropicale a frappé la colonie où [minister.GetName] est en poste. [minister.GetHeShe] est malade, le personnel est décimé et l'administration coloniale est presque à l'arrêt. [minister.GetName] attend la décision de la couronne."

 cc_posting.4.a: "Ordonner à [minister.GetName] de surmonter sa maladie."
 cc_posting.4.a.tooltip: "[minister.GetName] reste à son poste malgré la fièvre. Son dévouement suscite l'admiration royale, mais la maladie pèse sur ses capacités administratives et diplomatiques[minister.GetHerHis|c][minister.GetHerHis]."

 cc_posting.4.b: "Ordonner du repos et une charge de travail réduite."
 cc_posting.4.b.tooltip: "[minister.GetName] est déchargé des tâches les plus lourdes jusqu'à son rétablissement. L'administration coloniale vacille et la stabilité en pâtit — mais le ministre est épargné par le pire."

 # ============================================================
 # Section B — Charter Company Events (cc_colonial namespace)
 # ============================================================

 # --- cc_colonial.1 — The Company's Accounts ---
 cc_colonial.1.title: "Les comptes de la compagnie"
 cc_colonial.1.desc: "[minister.GetName] a passé les derniers mois à étudier minutieusement les registres de [colony.GetName]. [minister.GetHeShe] présente maintenant les comptes au conseil. Le tableau est complexe : profits, passifs et quelques chiffres qui ne concordent pas tout à fait."

 cc_colonial.1.a: "Approuver l'intégralité des retours."
 cc_colonial.1.a.tooltip: "Les connexions marchandes de [minister.GetName] ont transformé les comptes en une véritable aubaine. La compagnie rapporte l'intégralité de ses profits à la couronne — une somme considérable."

 cc_colonial.1.b: "Ordonner d'abord un audit approfondi."
 cc_colonial.1.b.tooltip: "L'inspection méthodique de [minister.GetName] intercepte les irrégularités avant qu'elles ne deviennent des scandales. L'audit produit un rendement moindre mais impeccablement propre — et la diligence du ministre est remarquée à la cour."

 cc_colonial.1.c: "Effectuer un examen standard."
 cc_colonial.1.c.tooltip: "Les comptes sont revus sans incident. La diligence du conseil dans la surveillance des affaires de la compagnie lui vaut un modeste prestige — une reconnaissance discrète d'une gouvernance saine."

 # --- cc_colonial.2 — A Monopoly Dispute ---
 cc_colonial.2.title: "Un litige de monopole"
 cc_colonial.2.desc: "[minister.GetName] a présenté au conseil une pétition formelle : l'état bourgeois demande l'extension des droits commerciaux pour la compagnie à charte de [colony.GetName]. Les nobles s'y opposent — bruyamment — affirmant que cela nuirait à leurs propres intérêts commerciaux. Le souverain doit décider qui l'emporte."

 cc_colonial.2.a: "Accorder un monopole commercial à la compagnie."
 cc_colonial.2.a.tooltip: "La compagnie à charte se voit accorder des droits exclusifs sur les flux commerciaux de [colony.GetName]. Une partie des revenus marchands est détournée vers la Couronne pour les quinze à vingt-cinq prochaines années. L'état bourgeois est satisfait ; la noblesse est discrètement furieuse."

 cc_colonial.2.b: "Restreindre l'expansion proposée."
 cc_colonial.2.b.tooltip: "Les états nobles l'emportent. Leurs intérêts commerciaux sont protégés et le prestige de la couronne est rehaussé par cette preuve de retenue royale — mais l'état bourgeois n'oubliera pas l'affront."

 cc_colonial.2.c: "Médiatiser un compromis royal."
 cc_colonial.2.c.tooltip: "[minister.GetName] propose une voie médiane. Les deux états reçoivent des concessions modestes, l'or circule par les canaux commerciaux, et la réputation du ministre en tant que négociateur habile s'accroît."

 # --- cc_colonial.3 — The Governor's Letter ---
 cc_colonial.3.title: "La lettre du gouverneur"
 cc_colonial.3.desc: "Une lettre formelle est arrivée de [minister.GetName], nommé gouverneur à [colony.GetName]. [minister.GetHeShe] écrit avec une demande claire : l'administration coloniale nécessite un soutien supplémentaire de la couronne. La forme que prendra ce soutien appartient à la couronne."

 cc_colonial.3.a: "Envoyer des renforts de troupes."
 cc_colonial.3.a.tooltip: "Des soldats sont dépêchés à [colony.GetName]. La relation militaire entre la couronne et la colonie se renforce — et [minister.GetName] acquiert une expérience de commandement directe."

 cc_colonial.3.b: "Envoyer un soutien financier."
 cc_colonial.3.b.tooltip: "L'or de la Couronne coule vers le trésor de [colony.GetName]. Les fondations économiques de la colonie sont renforcées, et [minister.GetName] démontre la compétence administrative requise pour ce poste."

 cc_colonial.3.c: "Décliner la requête — la couronne ne peut se permettre d'y consacrer des ressources."
 cc_colonial.3.c.tooltip: "La demande du gouverneur est rejetée. Le prestige de [minister.GetName] à la cour diminue en raison du manque visible de confiance royale, et l'administration coloniale devient plus méfiante quant aux intentions de la couronne."

 # ============================================================
 # Section C — Decolonization Crisis (cc_colonial namespace)
 # ============================================================

 # --- cc_colonial.10 — The Colonial Petition ---
 cc_colonial.10.title: "La pétition coloniale"
 cc_colonial.10.desc: "[minister.GetName] a déposé une pétition formelle devant le conseil au nom de [colony.GetName] : la population coloniale demande une plus grande autonomie. La rhétorique révolutionnaire du ministre a galvanisé le mouvement. La réponse de la couronne définira la relation de l'empire avec ses territoires d'outre-mer pour une génération."

 cc_colonial.10.a: "Accorder une plus grande autonomie — entamer les négociations."
 cc_colonial.10.a.tooltip: "La couronne reconnaît la légitimité de la pétition. La stabilité est sacrifiée au profit de l'art politique — la relation politique avec [colony.GetName] s'améliore, et des arrangements formels suivront."

 cc_colonial.10.b: "Rejeter purement et simplement la pétition."
 cc_colonial.10.b.tooltip: "La couronne refuse de négocier avec les agitateurs coloniaux. Le prestige est maintenu — mais la réaction de [minister.GetName] à ce rejet est imprévisible, et la situation politique à [colony.GetName] reste volatile."

 cc_colonial.10.c: "Renvoyer [minister.GetName] du cabinet."
 cc_colonial.10.c.tooltip: "L'influence de l'agitateur est coupée à la source. [minister.GetName] est limogé, la pétition perd son champion à la cour et la crise est maîtrisée — mais la réputation de tolérance de la couronne en pâtit."

 # --- cc_colonial.11 — The Defection ---
 cc_colonial.11.title: "La défection"
 cc_colonial.11.desc: "La nouvelle parvient au palais que [minister.GetName] a disparu de la cour. Des rapports provenant de [colony.GetName] confirment le pire : le ministre a rejoint le mouvement d'indépendance coloniale, apportant les connaissances de la cour et des relations royales à la cause de l'indépendance. Les dommages doivent être contenus."

 cc_colonial.11.a: "Laissez partir [minister.GetName] — limitez les dégâts."
 cc_colonial.11.a.tooltip: "La défection est un coup porté au prestige de la couronne. Les relations diplomatiques s'effritent à travers l'empire alors que le départ du ministre signale une vulnérabilité — mais la cause coloniale gagne un élan qu'il faudra des années pour inverser."

 cc_colonial.11.b: "Dépêcher des agents pour arrêter [minister.GetName] avant qu'il ou elle ne franchisse la frontière."
 cc_colonial.11.b.tooltip: "Le ministre est capturé avant d'atteindre la colonie. La défection est évitée — mais la réponse brutale déstabilise la cour et ravage la relation politique avec [colony.GetName]."

 # --- cc_colonial.12 — The Compromise ---
 cc_colonial.12.title: "Le compromis"
 cc_colonial.12.desc: "Quelques mois après la promesse de la couronne d'accorder une plus grande autonomie, les arrangements formels doivent maintenant être consignés par écrit. La direction coloniale de [colony.GetName] attend l'engagement de la couronne — ou son retrait de cet engagement."

 cc_colonial.12.a: "Formaliser le pacte d'autonomie."
 cc_colonial.12.a.tooltip: "La couronne tient parole. [colony.GetName] reçoit une reconnaissance formelle de son autonomie élargie. La colonie prospère sous ce nouvel arrangement, et les liens politiques et culturels avec la métropole sont renforcés plutôt que rompus."

 cc_colonial.12.b: "Retirer l'offre — la couronne ne peut pas tant céder."
 cc_colonial.12.b.tooltip: "La promesse est rompue. Le prestige s'effondre alors que la direction coloniale réalise que l'engagement était vide — et la relation politique avec [colony.GetName] subit un coup dont elle pourrait ne pas se remettre."

 # ============================================================
 # Colonial Divan Modifier Names
 # ============================================================
 STATIC_MODIFIER_NAME_cc_col_colonial_investment: "Investissement colonial"
 cc_col_colonial_investment: "Investissement colonial"
 cc_col_colonial_investment_desc: "Les ressources de la Couronne ont été canalisées vers le développement de cette colonie. La prospérité croît et l'efficacité commerciale s'améliore grâce à l'investissement direct du gouvernement impérial."

 STATIC_MODIFIER_NAME_cc_col_colonial_autonomy: "Pacte d'autonomie coloniale"
 cc_col_colonial_autonomy: "Pacte d'autonomie coloniale"
 cc_col_colonial_autonomy_desc: "Cette colonie a reçu une reconnaissance formelle de l'extension de son autonomie. La prospérité et l'activité commerciale fleurissent sous cet arrangement — et la relation avec la métropole n'en est que plus forte."

 STATIC_MODIFIER_NAME_cc_col_defection_fallout: "Séquelles d'une défection coloniale"
 cc_col_defection_fallout: "Séquelles d'une défection coloniale"
 cc_col_defection_fallout_desc: "La défection d'un ministre du cabinet vers le mouvement d'indépendance coloniale a nui au prestige de la couronne. La loyauté des sujets est ébranlée et la réputation diplomatique en pâtit à travers l'empire."



# Colonial buildings

 colonial_migration_center: "Centre de migration"
 colonial_migration_center_desc: "Un bureau colonial pour l'enregistrement des nouveaux arrivants, l'attribution des foyers et l'orientation des colons vers les terres et les emplois disponibles."
 colonial_migration_center_maintenance: "Entretien du centre de migration"
 colonial_migration_center_maintenance_desc: "Les centres de migration nécessitent des registres, des livres, du tissu, des pièces et des outils pour organiser les arrivées et les concessions d'établissement."
