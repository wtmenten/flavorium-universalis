l_french:
 # ============================================================
 # SITUATION NAME / DESCRIPTION
 # ============================================================
 cc_subject_bonds: "Registre des relations avec les sujets"
 cc_subject_bonds_desc: "Un état permanent des relations de la Couronne avec ses sujets, dimension par dimension. Chaque lien est mesuré selon cinq axes — économique, militaire, politique, culturel et personnel — allant du ressentiment ouvert (-5) à la loyauté dévouée (+5)."
 cc_subject_bonds_end: "La Couronne ne détient plus aucun sujet lié par un contrat."

 # ============================================================
 # PANEL HEADER
 # ============================================================
 CC_BOND_LEDGER_HEADER: "Liens de vassalité"
 CC_BOND_LEDGER_DESC: "Votre lien avec chaque sujet est suivi selon cinq dimensions, chacune allant de -5 (hostile) à +5 (dévoué). Survolez une valeur pour voir ce qui l'influence. Utilisez les actions sous chaque sujet pour entretenir la relation directement, moyennant un coût et un temps de recharge.\n\nChaque lien conserve à la fois un score récent et une mémoire à vie : toutes les quelques générations, le score actuel est intégré dans une moyenne à long terme et s'efface partiellement. Utilisez le commutateur de vue pour passer de l'un à l'autre."

 # ============================================================
 # VIEW TOGGLE + ESTABLISHMENT DATE
 # ============================================================
 CC_BOND_VIEW_STM: "Récent"
 CC_BOND_VIEW_LTM: "À vie"
 CC_BOND_VIEW_TOGGLE: "Changer de vue"
 CC_BOND_VIEW_TT: "Basculez entre le lien #Y Récent#! (le score actuel, -5..+5) et le lien #Y À vie#! (la moyenne à long terme résultant de chaque cycle de mémoire). La mémoire à vie est ce qui façonne le plus le comportement d'un sujet lorsque vient l'ère des révolutions."
 CC_BOND_EST_SEP: "· est."

 # ============================================================
 # COLUMN LABELS
 # ============================================================
 CC_BOND_COL_SUBJECT: "Sujet"
 CC_BOND_COL_ECO: "Éco"
 CC_BOND_COL_MIL: "Mil"
 CC_BOND_COL_POL: "Pol"
 CC_BOND_COL_CUL: "Cul"
 CC_BOND_COL_PER: "Par"

 # ============================================================
 # DIMENSION TOOLTIPS — what raises and lowers each bond
 # ============================================================
 CC_BOND_DIM_ECO_TT: "Lien économique — commerce, équité fiscale et prospérité partagée.\n\nAugmenté par : les bâtiments royaux dans les terres du sujet, la croissance des provinces, le partage des institutions et la garantie de son trésor.\nDiminué par : la négligence, la perte de provinces, l'extraction lourde et le fait que le sujet vous dépasse dans les institutions que vous n'avez pas."
 CC_BOND_DIM_MIL_TT: "Lien militaire — obligations de guerre, loyauté martiale et volonté de combattre.\n\nAugmenté par : la retenue dans les appels aux armes, le fait de venir au secours du sujet lorsqu'on le demande et les revues militaires conjointes.\nDiminué par : les appels fréquents ou offensifs à la guerre, le refus d'aider le sujet et le cumul de guerres injustes."
 CC_BOND_DIM_POL_TT: "Lien politique — gouvernance, autonomie et intégration politique.\n\nAugmenté par : le respect du statut du sujet, l'octroi de chartes de privilèges et une administration stable.\nDiminué par : la trahison, un gouvernement autoritaire et des antécédents d'actes de déloyauté ou de trahison."
 CC_BOND_DIM_CUL_TT: "Lien culturel — acceptation culturelle, harmonie religieuse et identité.\n\nAugmenté par : laisser le sujet conserver son caractère distinct, des liens favorables avec la foi et les institutions, et le mécénat de ses festivals.\nDiminué par : conversion forcée de la culture ou de la foi, et frictions culturelles."
 CC_BOND_DIM_PER_TT: "Lien personnel — la chaleur entre les deux cours et les dirigeants.\n\nAugmenté par : l'attention personnelle, l'acceptation des appels à l'aide, ainsi que les gestes dynastiques et diplomatiques.\nDiminué par : le rejet des appels du sujet, l'exigence de tributs, les réprimandes sévères et un abandon prolongé."

 # ============================================================
 # ENGAGE ACTION BUTTONS + TOOLTIPS
 # ============================================================
 CC_BOND_ACT_ECO: "Souscrire"
 CC_BOND_ACT_ECO_TT: "Garantir le Trésor Local\nDes pièces de la Couronne — proportionnelles à vos revenus et à la valeur du sujet — soutiennent les finances du sujet pendant une décennie.\n\n#G Le sujet gagne :#! un crédit moins cher (#G Intérêts bancaires -1%#!) et une frappe plus riche (#G Revenus de frappe +10%#!) pendant 10 ans.\nLien économique +1 (max +5). Temps de recharge de 2 ans partagé avec les autres actions pour ce sujet."
 CC_BOND_ACT_MIL: "Réviser"
 CC_BOND_ACT_MIL_TT: "Organiser une revue militaire conjointe\nEntraînez les deux armées ensemble, à un coût proportionnel à vos moyens.\n\n#G Vous et le sujet gagnez tous deux :#! un entretien réduit (#G Efficacité de l'entretien de l'armée et de la marine +10%#!) pendant 10 ans.\nLien militaire +1 (max +5). Temps de recharge de 2 ans."
 CC_BOND_ACT_POL: "Charte"
 CC_BOND_ACT_POL_TT: "Octroyer une Charte de Privilèges (coûte du prestige)\nAffirmer formellement les libertés et le statut du sujet.\n\n#G Le sujet gagne :#! des libertés commerciales (#G Efficacité des exportations et importations +10 %#!) et #G Loyauté envers le suzerain +10#! pendant 10 ans.\n#R Vous concédez :#! une partie de ses revenus (#R Revenus du sujet -5 %#!) pendant 10 ans.\nLien politique +1 (max +5). Temps de recharge de 2 ans."
 CC_BOND_ACT_CUL: "Festival"
 CC_BOND_ACT_CUL_TT: "Parrainer un festival culturel\nOrganisez un grand festival célébrant le personnage du sujet, à un coût proportionnel à vos moyens.\n\n#G En tant qu'hôte, vous gagnez :#! #G Influence culturelle +2#!, #G Réputation diplomatique +1#! et #G Prestige mensuel +0,05#! pendant 10 ans.\nLien culturel +1 (max +5). Temps de recharge de 2 ans."
 CC_BOND_ACT_PER: "Envoyé"
 CC_BOND_ACT_PER_TT: "Envoyer un envoyé personnel (gain de prestige)\nPlacer un émissaire de confiance à la cour du sujet, avec des cadeaux proportionnels à vos moyens.\n\n#G Le sujet gagne :#! #G Loyauté envers le suzerain +15#! pendant 10 ans, et s'approche de votre Couronne (#G +20 d'opinion#!).\nLien personnel +1 (max +5). Temps de recharge de 2 ans."
 CC_BOND_ACT_TRIBUTE: "Tribut"
 CC_BOND_ACT_TRIBUTE_TT: "Exiger un tribut\nPresser le sujet pour obtenir des pièces — une somme tirée de ses propres coffres. Rentable, mais mal vécu.\n\nLien personnel -1 (min -5). Temps de recharge de 2 ans."
 CC_BOND_ACT_REPRIMAND: "Réprimande"
 CC_BOND_ACT_REPRIMAND_TT: "Adresser une réprimande sévère\nUn reproche glacial qui force le sujet à l'obéissance mais refroidit les relations.\n\nLien politique +1 / Lien personnel -1. Temps de recharge de 2 ans."

 # ============================================================
 # ENGAGE EVENTS (cc_bonds.300-306)
 # ============================================================
 cc_bonds.300.t: "Garantir le Trésor"
 cc_bonds.300.d: "Des nouvelles nous viennent de [cc_engage_subject.GetName] concernant des coffres vides — le commerce stagne, la récolte est maigre et les registres fiscaux sont à bout de souffle. En garantissant leurs finances, la Couronne peut leur obtenir un crédit moins cher et une monnaie plus forte, tout en leur rappelant quelle générosité les soutient."
 cc_bonds.300.a: "Ouvrir le trésor (pièces de la Couronne). Le sujet bénéficie de prêts moins coûteux et d'un meilleur frappage pendant une décennie ; Lien économique +1."
 cc_bonds.300.b: "Ils s'en sortiront seuls."

 cc_bonds.301.t: "Une revue militaire conjointe"
 cc_bonds.301.d: "Les capitaines de [cc_engage_subject.GetName] proposent une grande revue des armes tenue en commun avec notre propre armée — les bannières défilant ensemble, les exercices effectués épaule contre épaule. Une telle discipline partagée lie les soldats à une cause commune et affine la logistique des deux armées."
 cc_bonds.301.a: "Organiser la revue (pièce de la Couronne). Les deux royaumes bénéficient d'un entretien réduit de l'armée et de la marine pendant une décennie ; Lien militaire +1."
 cc_bonds.301.b: "Nous n'avons pas de temps pour les parades."

 cc_bonds.302.t: "Une charte de privilèges"
 cc_bonds.302.d: "Les notables de [cc_engage_subject.GetName] demandent une charte formelle affirmant leurs libertés commerciales et leur rang au sein de notre domaine. L'accorder revient à céder une partie des revenus que nous tirons d'eux, mais cela flatte leur orgueil et les lie plus étroitement à la Couronne."
 cc_bonds.302.a: "Accorder la charte (coûte du prestige). Le sujet gagne des libertés commerciales et de la loyauté, mais nous renonçons à une partie de ses revenus pendant une décennie ; Lien politique +1."
 cc_bonds.302.b: "Leurs privilèges sont suffisants en l'état."

 cc_bonds.303.t: "Un festival culturel"
 cc_bonds.303.d: "Les artistes et comédiens de [cc_engage_subject.GetName] sollicitent notre mécénat pour un grand festival en l'honneur de leur caractère distinct — musique, spectacles et festins sous le nom de la Couronne. Accueillir une telle splendeur accroît notre propre renommée dans les cours du monde entier."
 cc_bonds.303.a: "Financer le festival (Pièce de la Couronne). En tant qu'hôte, la Couronne gagne de l'influence culturelle, de la réputation et du prestige pendant une décennie ; Lien culturel +1."
 cc_bonds.303.b: "Qu'ils célèbrent à leurs propres frais."

 cc_bonds.304.t: "Un envoyé personnel"
 cc_bonds.304.d: "Cela fait trop longtemps que nous ne nous sommes pas rendus personnellement à la cour de [cc_engage_subject.GetName]. Un émissaire de confiance stationné sous notre propre sceau, accompagné de petits cadeaux, les maintiendrait fermement dans l'orbite de la Couronne et réchaufferait leur regard envers notre maison."
 cc_bonds.304.a: "Envoyer l'envoyé (pièces de la Couronne ; gagne du prestige). Le sujet devient plus loyal et s'ouvre à nous pour une décennie ; Lien personnel +1."
 cc_bonds.304.b: "Une reconnaissance formelle suffira."

 cc_bonds.305.t: "Exiger un tribut"
 cc_bonds.305.d: "Notre trésor est dans le besoin, et [cc_engage_subject.GetName] n'est pas sans moyens. Nous pourrions exiger un tribut extraordinaire — profitable, certainement, bien qu'ils n'oublieront pas de sitôt cette imposition."
 cc_bonds.305.a: "Exiger le tribut (pièces tirées de leurs coffres). Lien personnel -1."
 cc_bonds.305.b: "Nous ne nous abaisserons pas à les pressurer."

 cc_bonds.306.t: "Une réprimande sévère"
 cc_bonds.306.d: "La conduite de [cc_engage_subject.GetName] est devenue capricieuse. Un reproche froid et public leur rappellerait leur place et renforcerait leur obéissance — bien que de tels mots laissent un froid persistant entre les cours."
 cc_bonds.306.a: "Délivrer la réprimande. Lien politique +1, Lien personnel -1."
 cc_bonds.306.b: "Ignorons cela pour l'instant."

 # ============================================================
 # ENGAGE-ACTION MODIFIERS (granted by cc_bonds.300-304)
 # ============================================================
 STATIC_MODIFIER_NAME_cc_bond_underwritten: "Souscription de la Couronne"
 STATIC_MODIFIER_DESC_cc_bond_underwritten: "Le suzerain soutient notre trésorerie, facilitant notre crédit et enrichissant notre monnaie."
 STATIC_MODIFIER_NAME_cc_bond_drilled: "Revue militaire conjointe"
 STATIC_MODIFIER_DESC_cc_bond_drilled: "L'entraînement commun avec nos hôtes a perfectionné la logistique et réduit l'entretien de nos forces."
 STATIC_MODIFIER_NAME_cc_bond_chartered: "Charte de Privilèges"
 STATIC_MODIFIER_DESC_cc_bond_chartered: "Une charte royale affirme nos libertés commerciales et notre rang, nous liant par la loyauté à la Couronne."
 STATIC_MODIFIER_NAME_cc_bond_charter_granted: "Charte concédée"
 STATIC_MODIFIER_DESC_cc_bond_charter_granted: "Les libertés accordées à un sujet par charte coûtent à la Couronne une partie des revenus qu'elle en tire."
 STATIC_MODIFIER_NAME_cc_bond_festival_host: "Mécène du festival"
 STATIC_MODIFIER_DESC_cc_bond_festival_host: "L'organisation d'un festival célèbre a magnifié l'influence culturelle et la renommée de la Couronne."
 STATIC_MODIFIER_NAME_cc_bond_envoy_received: "Envoyé résident de la Couronne"
 STATIC_MODIFIER_DESC_cc_bond_envoy_received: "Un émissaire de confiance du suzerain maintient notre cour fermement dans l'orbite de la Couronne."

 # ============================================================
 # ENGAGE-ACTION OPINION BIAS
 # ============================================================
 cc_bond_envoy_warmth: "Honoré par un envoyé personnel"
 cc_bond_legend_overlord: "Notre royaume"
 cc_bond_legend_weak: "Un sujet que nous avons négligé"
 cc_bond_legend_strong: "Un sujet que nous avons gardé proche"
