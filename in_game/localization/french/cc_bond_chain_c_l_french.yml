l_french:
 # === cc_bonds.120 — The Fort Needs Repair ===
 cc_bonds.120.title: "Le fort nécessite des réparations"
 cc_bonds.120.desc: "Un rapport est arrivé de [bond_subj.GetName] indiquant que la forteresse clé protégeant leur territoire s'est considérablement détériorée — murs fissurés, porte qui fuit, garnison insuffisante. Les revenus du sujet ne suffisent pas à couvrir à la fois les fortifications et l'administration régulière. Ils demandent si la Couronne pourrait contribuer aux réparations. Le fort n'est pas le nôtre, strictement parlant. Mais la frontière qu'il garde ne l'est pas non plus — elle est autant la nôtre que la leur."
 cc_bonds.120.a: "Financer les réparations complètes. Nous partageons la frontière ; nous partageons les coûts."
 cc_bonds.120.b: "Financer des réparations partielles. Nous contribuons à la mesure de nos moyens."
 cc_bonds.120.c: "Ils doivent le financer eux-mêmes. La frontière est sous leurs ordres."
 cc_bonds.120.d: "Classer le rapport. Nous nous en occuperons quand les circonstances le permettront."

 # === cc_bonds.121 — The Fort Is Tested ===
 cc_bonds.121.title: "Le fort est mis à l'épreuve"
 cc_bonds.121.desc_funded: "Une puissance voisine, s'attendant manifestement à ce que la frontière soit aussi perméable qu'il y a dix ans, a envoyé des forces pour sonder le territoire de [bond_subj.GetName]. Elles ont rencontré quelque chose d'inattendu : une forteresse entièrement réparée, une garnison bien approvisionnée et un seigneur qui avait reçu les ressources nécessaires pour faire son travail correctement. L'incursion a été repoussée. Le rapport est classé sous « défense réussie ». Il ne reste plus qu'à savoir à qui revient le mérite."
 cc_bonds.121.desc_partial: "Une puissance voisine a testé les frontières de [bond_subj.GetName]. La forteresse a tenu — de justesse. Le commandant de la garnison a décrit l'engagement en des termes qui montrent à quel point cela a été serré. Avec un financement complet, le résultat aurait été décisif ; avec un demi-financement, c'était presque un échec. La frontière est sûre. La conversation sur ce que cette « sécurité » coûtera la prochaine fois ne l'est pas."
 cc_bonds.121.desc_failed: "Une puissance voisine a franchi la frontière de [bond_subj.GetName]. La forteresse — sous-effectif, murs partiellement effondrés, garnison travaillant avec des fournitures inadéquates — n'a pu tenir. L'occupation fut brève ; le voisin a été expulsé avec l'aide de la Couronne. Mais le territoire a été occupé. La population a été touchée. La forteresse qui aurait pu l'empêcher est en ruines, comme elle l'est depuis que le rapport a été déposé. Comme elle l'est depuis que nous avons décidé de ne pas agir suite à ce rapport."
 cc_bonds.121.a_credit: "Préciser que c'est l'investissement de la Couronne qui a rendu cette défense possible."
 cc_bonds.121.a_subject_credit: "Le mérite revient au seigneur et à sa garnison. Nous le déclarons publiquement."
 cc_bonds.121.b_reinforce: "Envoyer immédiatement des renforts et des fournitures d'urgence."
 cc_bonds.121.b_blame: "Le résultat partiel reflète l'insuffisance de la préparation du sujet."
 cc_bonds.121.c_lead: "Nous dirigerons personnellement la récupération. Nous leur devons bien cela."
 cc_bonds.121.c_supplies: "Envoyer des fournitures et des pièces. La Couronne contribuera à la reconstruction."

 # === cc_bonds.122 — Who Commands the Fort? ===
 cc_bonds.122.title: "Qui commande le fort ?"
 cc_bonds.122.desc: "La forteresse de [bond_subj.GetName] a été reconstruite, renforcée et reaffectée. Elle constitue désormais l'une des positions défensives les plus efficaces de notre frontière. La restauration soulève une question inévitable : qui la commande ? L'arrangement actuel est informel — le seigneur vassal dirige la garnison par coutume plutôt que par autorité formelle. Formaliser la structure de commandement revient à choisir si cette autorité revient à la Couronne ou au seigneur qui a vécu dans le fort pendant une génération."
 cc_bonds.122.desc_positive: "La forteresse de [bond_subj.GetName] a été reconstruite et reaffectée. Elle est solide. La garnison du seigneur vassal — les mêmes personnes qui l'ont défendue lors de l'épreuve, et que la Couronne a publiquement louées — en est la raison d'être. La question de l'autorité de commandement formelle arrive déjà chargée. En leur attribuant le mérite de la défense, nous n'avons pas seulement été généreux. Nous avons créé un précédent qu'ils n'ont pas oublié."
 cc_bonds.122.desc_bitter: "La forteresse de [bond_subj.GetName] a été reconstruite. Elle tient aujourd'hui parce que la Couronne a payé pour restaurer ce qu'elle avait précédemment refusé d'entretenir — un détail que le seigneur vassal n'a jamais mentionné directement, mais qu'il ne nous a jamais permis d'oublier. Les arrangements de commandement sont restés informels depuis la reconstruction. Chaque saison de silence du vassal est un rappel implicite de ce que l'arrangement informel lui coûte."
 cc_bonds.122.a: "Nommez un officier de la Couronne pour commander. Nous ne pouvons laisser un atout stratégique à des arrangements informels."
 cc_bonds.122.b: "Accorder formellement l'autorité de commandement du fort au seigneur vassal. Il l'a mérité."
 cc_bonds.122.c: "Établir un accord de commandement conjoint. Le fort nous appartient à tous les deux."
 cc_bonds.122.d: "Formaliser le commandement sous l'autorité du seigneur sujet. La décision a été tranchée lorsque nous leur avons laissé le mérite."
 cc_bonds.122.d.tooltip: "La bonne volonté issue de la reconnaissance publique porte ses fruits ici. Le seigneur vassal reçoit l'autorité de commandement formelle avec des gains politiques, personnels et militaires importants — et du prestige pour la Couronne."
 cc_bonds.122.e_repair: "Reconnaissez l'échec passé. Indemnisez le seigneur avant de régler le commandement."
 cc_bonds.122.e_repair.tooltip: "Un règlement matériel et symbolique. Le paiement n'efface pas la rupture — mais il permet d'aborder la question du commandement sur de meilleures bases. La politique et le prestige s'améliorent."
 cc_bonds.122.e_ignore: "Réglez la question du commandement comme si l'histoire n'existait pas."
 cc_bonds.122.e_ignore.tooltip: "Le seigneur vassal tire ses propres conclusions du silence. Per et pol tombent tous deux — la question du commandement est tranchée, mais pas celle de la relation."
