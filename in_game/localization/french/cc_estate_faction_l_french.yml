l_french:
 # ============================================================
 # Pillar 02 — Estate-Aligned Cabinet Factions
 # ============================================================

 # --- Estate Faction Traits (Family G) ---
 noble_champion_of_court: "Champion noble de la Cour"
 noble_champion_of_court_desc: "Ce ministre est la voix sans équivoque de l'état noble au sein du cabinet. Les titres, les privilèges et les prérogatives militaires sont la langue que [character.GetHeShe] parle — et les états le savent."

 merchant_of_the_crown: "Marchand de la Couronne"
 merchant_of_the_crown_desc: "Issu des comptoirs, ce ministre apporte le raisonnement commercial de l'état bourgeois dans chaque conseil. Les routes commerciales sont une politique ; le profit est un art du gouvernement."

 court_prelate: "Prélat de cour"
 court_prelate_desc: "Ce ministre cumule deux fonctions : un siège au cabinet et le poids de la foi. Le clergé voit en [character.GetHimHer] son champion au sein du cercle restreint de la couronne."

 tribune_of_the_commons: "Tribune du Commun"
 tribune_of_the_commons_desc: "Peu de ministres de ce genre existent — et encore moins survivent à l'indifférence de la cour. Celui-ci y parvient. [character.GetHeShe|c] écoute les pétitions paysannes que d'autres ignorent et les traduit en politiques qui préviennent les rébellions plutôt que de les réprimer."

 steppe_voice: "Voix de la steppe"
 steppe_voice_desc: "Ce ministre arpente la cour et la plaine avec la même aisance. [character.GetHeShe|c] assure la médiation entre les attentes de l'état tribal et les exigences d'un gouvernement sédentaire — un équilibre précaire, mais nécessaire."

 dhimmi_advocate: "Défenseur des Dhimmi"
 dhimmi_advocate_desc: "Là où d'autres voient une base fiscale, ce ministre voit un électorat. La communauté dhimmi a trouvé une voix au sein du cabinet — et le royaume en est, du moins marginalement, plus stable."

 cossack_hetman_liaison: "Liaison du Hetman cosaque"
 cossack_hetman_liaison_desc: "Le hetman fait confiance à ce ministre pour représenter les intérêts cosaques là où le hetman ne peut se rendre. [character.GetHeShe|c] porte les exigences de la steppe et la fierté des cosaques dans des salles de conseil qui, autrement, ne les entendraient jamais."

 # --- cc_fac.1 — The Nobles Demand ---
 cc_fac.1.title: "Les nobles exigent"
 cc_fac.1.desc: "Avec [noble_minister.GetName] et un second ministre aligné sur la noblesse désormais fermement établis au sein du cabinet, l'état noble a commencé à agir comme si la cour lui appartenait. Le délégué formel des états a présenté une demande — formulée comme une pétition, mais tout le monde sait de quoi il s'agit : un privilège, une concession ou une réforme qui consolidera le pouvoir noble pour une génération."

 cc_fac.1.a: "Accorder le privilège — les nobles sont trop puissants pour qu'on leur refuse."
 cc_fac.1.a.tooltip: "Les nobles sont satisfaits et le cabinet approuve la décision avec soulagement. Le trésor en supporte le coût. La composition de la cour évolue exactement comme le pouvoir des états nobles se concentre — et les ministres s'en assurent."

 cc_fac.1.b: "Refuser — la couronne ne gouverne pas par le consentement des nobles."
 cc_fac.1.b.tooltip: "Un rejet catégorique. L'état noble est offensé ; [noble_minister.GetName] est visiblement embarrassé par la réprimande. La cour saisit le signal — tout comme chaque maison noble du royaume."

 cc_fac.1.c: "Proposer une concession partielle pour préserver la paix."
 cc_fac.1.c.tooltip: "Un compromis qui ne satisfait personne complètement et n'offense personne fatalement. Les états reçoivent un geste modeste ; la couronne conserve sa prérogative ; le trésor paie une petite somme pour la paix."

 # --- cc_fac.2 — The Merchant Compact ---
 cc_fac.2.title: "Le pacte marchand"
 cc_fac.2.desc: "Les ministres alignés sur les bourgeois ont travaillé discrètement. [merchant_minister.GetName] présente le résultat : un accord commercial formel, parrainé par les réseaux marchands de l'état et structuré pour enrichir la couronne. L'accord est juridiquement solide, politiquement pratique et — selon les nobles qui ont lu les petites lignes — profondément humiliant pour quiconque n'est pas marchand."

 cc_fac.2.a: "Adopter le pacte — la puissance commerciale est la seule puissance réelle."
 cc_fac.2.a.tooltip: "Le trésor s'accroît considérablement. L'état bourgeois est ravi. L'état noble, dont les levées et les revenus fiscaux fonciers sont discrètement sapés par cet arrangement, nourrit un ressentiment silencieux."

 cc_fac.2.b: "Rejeter le pacte — la couronne ne doit pas gouverner par l'intermédiaire des marchands."
 cc_fac.2.b.tooltip: "Le rejet est digne mais clair. [merchant_minister.GetName] le reçoit en silence et l'archive. L'état est mécontent — et la confiance du ministre envers la couronne a diminué."

 cc_fac.2.c: "Accepter une version réduite de l'accord."
 cc_fac.2.c.tooltip: "Un pacte limité : l'or afflue, et avec lui une certaine pression inflationniste. Les bourgeois appellent cela un début. Les nobles appellent cela la première étape. Les deux ont probablement raison."

 # --- cc_fac.3 — The Prelates Move ---
 cc_fac.3.title: "Les prélats s'activent"
 cc_fac.3.desc: "[clergy_minister.GetName] a convoqué un conseil privé des voix cléricales du cabinet. Il en résulte un document de position formel : la cour doit être vue comme celle qui impose la conformité confessionnelle au sein des institutions du royaume. Les ministres ne parlent pas d'hérésie — ils parlent de « cohérence administrative ». Mais les états, les hérétiques et les cours étrangères comprennent tous ce qui est réellement proposé."

 cc_fac.3.a: "Soutenir le clergé — l'unité confessionnelle renforce le royaume."
 cc_fac.3.a.tooltip: "Le clergé est satisfait ; l'appareil de conversion reçoit un mandat formel. Le prestige augmente légèrement avec la piété visible du royaume. Les marchands bourgeois aux réseaux de foi mixte commencent à se relocaliser discrètement."

 cc_fac.3.b: "S'opposer à la mesure — la couronne gouverne tous les domaines également."
 cc_fac.3.b.tooltip: "Un refus ferme : la couronne ne sera pas l'instrument d'une imposition confessionnelle. Le clergé est mécontent ; la stabilité s'affermit ; [clergy_minister.GetName] est furieux en privé."

 cc_fac.3.c: "Compromis — donner plus d'influence au clergé sans application formelle."
 cc_fac.3.c.tooltip: "Le clergé reçoit une autorité d'agenda accrue sur les questions religieuses relevant des compétences du cabinet. Ce n'est pas tout ce qu'ils voulaient — mais assez pour appeler cela une concession."

 # ============================================================
 # Modifier Display Names (Pillar 02 — Auto-Modifiers)
 # ============================================================
 MODIFIER_NAME_nobles_court_captured: "Les nobles dominent le cabinet"
 MODIFIER_DESC_nobles_court_captured: "Deux ministres ou plus alignés sur la noblesse ont fait du cabinet un outil de l'état noble. Le prestige revient à leurs protecteurs ; les agendas commerciaux et cléricaux sont systématiquement dépriorisés."

 MODIFIER_NAME_burghers_court_captured: "Les bourgeois dominent le cabinet"
 MODIFIER_DESC_burghers_court_captured: "Deux ministres ou plus alignés sur la bourgeoisie ont transformé le cabinet en moteur commercial. L'efficacité commerciale augmente ; les intérêts militaires et cléricaux sont discrètement ignorés."

 MODIFIER_NAME_clergy_court_captured: "Le clergé domine le cabinet"
 MODIFIER_DESC_clergy_court_captured: "Deux ministres ou plus alignés sur le clergé ont fait en sorte que le cabinet parle d'une seule voix confessionnelle. L'influence religieuse augmente ; la tolérance envers l'hétérodoxie s'effondre."

 # ============================================================
 # Static Modifier Names (Pillar 02 — Country Modifiers)
 # ============================================================
 STATIC_MODIFIER_NAME_cc_nobles_court_captured: "Capture de noble"
 STATIC_MODIFIER_DESC_cc_nobles_court_captured: "L'état noble contrôle le cabinet. Le prestige et le pouvoir de l'agenda noble augmentent ; les intérêts commerciaux et cléricaux en pâtissent."

 STATIC_MODIFIER_NAME_cc_burghers_court_captured: "Capture des bourgeois"
 STATIC_MODIFIER_DESC_cc_burghers_court_captured: "L'état marchand contrôle le cabinet. L'efficacité commerciale augmente ; les intérêts nobles et cléricaux en pâtissent."

 STATIC_MODIFIER_NAME_cc_clergy_court_captured: "Capture du clergé"
 STATIC_MODIFIER_DESC_cc_clergy_court_captured: "Le clergé contrôle le cabinet. L'influence religieuse augmente ; la tolérance diminue ; les intérêts commerciaux en pâtissent."
 desc_cossack_hetman_liaison: "Parle pour le hetman à notre cour et pour notre cour au hetman, et jouit de la confiance des deux parties. La noblesse écoute, tout comme les cavaliers."
 desc_court_prelate: "Un ecclésiastique qui a un siège à la table et aucune intention de le céder. La foi s'exprime avec notre voix à l'étranger, et le clergé s'en exprime davantage chez nous."
 desc_dhimmi_advocate: "Soutient que les sujets d'autres confessions sont d'abord des sujets, et le fait depuis si longtemps que les gens ont cessé de s'y opposer. En conséquence, les cours étrangères nous trouvent plus faciles à gérer."
 desc_merchant_of_the_crown: "Un homme d'affaires qui a occupé une fonction sans jamais cesser d'être un homme d'affaires. Nos marchandises se vendent mieux, et les bourgeois ont trouvé une voix à la cour."
 desc_noble_champion_of_court: "L'homme de la noblesse au cabinet, et fier de l'être. La couronne gagne en prestige par cette association et la noblesse gagne tout le reste."
 desc_steppe_voice: "Connaît les prairies et les hommes qui s'y trouvent, et peut mobiliser les deux. La cavalerie légère ride plus loin et l'armée est plus stable grâce à elle."
 desc_tribune_of_the_commons: "Parle pour les gens dont on parle habituellement. Les griefs atteignent le cabinet avant d'atteindre la rue, et le royaume est plus calme qu'il ne devrait l'être."
