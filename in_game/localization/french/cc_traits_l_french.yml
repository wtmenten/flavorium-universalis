l_french:
 learned_counselor: "Conseiller érudit"
 desc_learned_counselor: "Ce membre du cabinet a consacré sa vie aux études et aux lettres. Sous sa direction, l'alphabétisation se répand dans tout le royaume, car il veille à ce que l'éducation soit prise au sérieux à tous les niveaux de la gouvernance."
 learned_counselor_die_desc: "[CHARACTER.GetName] a quitté ce monde, et les bibliothèques que [CHARACTER.GetSheHe] a remplies resteront [CHARACTER.GetHerHis] héritage bien après que l'encre de ces pages se soit effacée."
 law_reformer: "Réformateur législatif"
 desc_law_reformer: "Un esprit juridique vif et un appétit pour la réforme ont rendu ce conseiller inestimable pour rationaliser le processus législatif. Les statuts contradictoires et les coutumes archaïques tombent sous sa plume minutieuse."
 law_reformer_die_desc: "[CHARACTER.GetName] est décédé(e), et bien des avocats déplorent la perte de l'esprit juridique le plus vif contre lequel ils aient jamais plaidé."
 loyal_steward: "Intendant loyal"
 desc_loyal_steward: "Peu de choses soudent un empire comme la confiance. Ce conseiller a cultivé des relations personnelles profondes avec les dirigeants de nos domaines vassaux, leur rappelant que la loyauté est réciproque."
 loyal_steward_die_desc: "[CHARACTER.GetName] est parti(e), et le fil de confiance qu'[CHARACTER.GetSheHe] a tissé entre nous et nos sujets s'est un peu aminci."
 tactical_advisor: "Conseiller tactique"
 desc_tactical_advisor: "Vétéran décoré et expert en art guerrier, ce conseiller traduit l'expérience acquise sur le champ de bataille en une doctrine qui aiguise le tranchant de chaque régiment à notre service."
 tactical_advisor_die_desc: "[CHARACTER.GetName] s'est tu(e). Les manuels qu'[CHARACTER.GetSheHe] a écrits survivront à [CHARACTER.GetHerHim], mais un maître des tactiques vivant vaut dix volumes imprimés."
 ecumenist: "Œcuméniste"
 desc_ecumenist: "Élevé parmi différentes confessions ou simplement doté de la patience d'un philosophe, ce conseiller voit l'humanité commune là où d'autres voient l'hérésie. Les minorités religieuses s'en sortent mieux lorsque leurs conseils façonnent la politique."
 ecumenist_die_desc: "[CHARACTER.GetName] a quitté ce monde. Les ponts silencieux que [CHARACTER.GetSheHe] a bâtis entre les confessions pourraient survivre au souvenir de celui ou celle qui les a construits."
 colonial_planner: "Planificateur colonial"
 desc_colonial_planner: "Cartes, vents alizés et rêves de colons — ce conseiller vit et respire l'expansion coloniale. Sous sa direction, les flux migratoires vers les frontières de nos ambitions outre-mer sont plus efficaces."
 colonial_planner_die_desc: "[CHARACTER.GetName] est décédé, et certains caps sans nom sur une côte inexplorée ne porteront jamais [CHARACTER.GetHerHis] nom."
 prosperity_planner: "Planificateur de la prospérité"
 desc_prosperity_planner: "Ce conseiller a l'instinct nécessaire pour identifier et cultiver les conditions qui permettent aux communautés de prospérer. La prospérité n'arrive pas par hasard — elle est planifiée, et personne ne la planifie mieux que lui."
 iron_disciplinarian: "Disciplinaire de fer"
 desc_iron_disciplinarian: "Ce conseiller gouverne par l'ordre, la hiérarchie et l'obéissance. Le royaume fonctionne efficacement sous sa surveillance, mais la discipline est pesante. La noblesse s'agace et les cours étrangères murmurent que c'est une tyrannie."
 iron_disciplinarian_die_desc: "[CHARACTER.GetName] est mort(e). La machine qu'[CHARACTER.GetSheHe] a construite continue de tourner, mais les ingénieurs qui craignaient [CHARACTER.GetHerHim] commencent déjà à desserrer les boulons."
 shadow_counselor: "Conseiller de l'ombre"
 desc_shadow_counselor: "Ce conseiller travaille via des informateurs et un levier discret plutôt que par les canaux officiels. Les puissances étrangères négocient avec prudence, sachant que cette personne écoute. Mais aucun domaine ne fait confiance à un manipulateur, et les diplomates gardent leurs distances."
 shadow_counselor_die_desc: "[CHARACTER.GetName] est mort(e) — du moins, c'est ce qu'affirment les rapports officiels. Ceux qui [CHARACTER.GetHerHim] connaissaient bien réservent leur jugement."
 progressive_reformist: "Réformiste progressiste"
 desc_progressive_reformist: "Ce conseiller est convaincu que les anciennes méthodes doivent céder la place aux nouvelles. L'alphabétisation progresse, les lois se modernisent et l'impulsion innovatrice se répand, mais chaque réforme est aussi une perturbation qui ébranle l'ordre ancien."
 progressive_reformist_die_desc: "[CHARACTER.GetName] est décédé(e) alors que la moitié des réformes étaient encore inachevées. Que cela soit une tragédie ou une chance dépend de celui à qui vous posez la question."
 war_hawk: "Faucon de guerre"
 desc_war_hawk: "Ce conseiller a soif de guerre. Sous son influence, l'excellence militaire atteint de nouveaux sommets, tout comme l'appétit pour le conflit. Les ennemis prennent note d'un royaume qui ne connaît pas le repos, et des coalitions se forment contre lui."
 war_hawk_die_desc: "[CHARACTER.GetName] est décédé(e), et les officiers que [CHARACTER.GetSheHe] a entraînés expirent lentement pour la première fois depuis des années."
 zealous_inquisitor: "Inquisiteur zélé"
 desc_zealous_inquisitor: "Un feu brûle dans l'âme de ce conseiller, et il consume le doute, l'hérésie et l'hésitation avec une faim égale. Dans un royaume d'une seule foi, c'est un don. Dans un royaume aux multiples foi, c'est une catastrophe annoncée."
 zealous_inquisitor_die_desc: "[CHARACTER.GetName] a rejoint ses créateurs et devra désormais répondre à quelques questions difficiles sur [CHARACTER.GetHerHis] propre compte."
 fumbling_integrator: "Intégrateur maladroit"
 desc_fumbling_integrator: "Ce conseiller part d'une bonne intention mais est tout simplement dépassé par les événements. Papiers mal classés, édits mal formulés et délégations laissées à l'attente — sous sa gestion, l'incorporation de nouvelles terres dans le royaume progresse à un rythme pénible."
 fumbling_integrator_die_desc: "[CHARACTER.GetName] est décédé(e). Il a fallu une semaine à trois départements pour confirmer les documents administratifs."
 able_integrator: "Intégrateur capable"
 desc_able_integrator: "Administrateur capable et polyvalent, ce conseiller gère avec une compétence discrète les affaires complexes de l'intégration de nouveaux territoires. Pas un génie, mais quelqu'un de fiable — et la fiabilité a souvent plus de valeur."
 able_integrator_die_desc: "[CHARACTER.GetName] est décédé(e). Les dossiers sont en ordre, les transitions planifiées, et le travail — comme toujours — se poursuivra."
 master_integrator: "Maître de l'intégration"
 desc_master_integrator: "Ce conseiller est très compétent dans les domaines administratif, militaire et diplomatique. Entre ses mains, l'incorporation de nouvelles terres s'effectue rapidement et sans heurts."
 master_integrator_die_desc: "[CHARACTER.GetName] est décédé(e), et les successeurs de trois départements découvrent précisément tout ce qu'une seule personne avait accompli."
 iron_integrator: "Intégrateur de fer"
 desc_iron_integrator: "L'intégration est normalement un art lent et prudent. Ce conseiller la traite comme une campagne de conquête — rapide, implacable et totale. Le royaume se cohésione avec une rapidité inhabituelle, mais les sujets intégrés se sentent rarement consultés, et les États font part de leur mécontentement."
 iron_integrator_die_desc: "[CHARACTER.GetName] est décédé(e). Les provinces qu'ils ont absorbées sont calmes, pour l'instant."
 provocateur: "Provocateur"
 desc_provocateur: "S'aventurant dans les relations étrangères avec la grâce d'un boulet de canon, ce conseiller réussit l'exploit remarquable d'antagoniser des voisins qui n'avaient aucun grief particulier contre nous auparavant."
 provocateur_die_desc: "[CHARACTER.GetName] est décédé(e). Plusieurs ambassadeurs ont envoyé des fleurs. Le sentiment est sincère."
 tactful_envoy: "Envoyé tactueux"
 desc_tactful_envoy: "Diplomate comprenant que le silence est une arme et que le timing est primordial, ce conseiller gomme les aspérités de nos relations étrangères sans grands gestes ni promesses que nous ne pourrions tenir."
 master_statesman: "Maître homme d'État"
 desc_master_statesman: "Ce conseiller est un négociateur habile capable de laisser les cours rivales satisfaites même lorsqu'elles ont concédé. Sous sa direction, le ressentiment que d'autres nations pourraient éprouver à notre égard a tendance à s'estomper."
 dove_of_court: "Colombe de la Cour"
 desc_dove_of_court: "Ce conseiller a élevé l'art de ne pas se faire d'ennemis au rang de philosophie de gouvernement. L'antagonisme étranger s'estompe, les réputations s'améliorent — mais une certaine mollesse s'installe également dans nos conseils, une préférence croissante pour le compromis plutôt que pour l'avantage, que des rivaux plus tranchants ne manqueront pas d'exploiter."
 timid_landlubber: "Terre-à-terre timide"
 desc_timid_landlubber: "Ce conseiller regarde une carte maritime et n'y voit que des façons de se noyer. Chaque expédition nécessite plus de rassurance que les navires ne nécessitent de provisions, et le rythme de notre exploration en témoigne."
 timid_landlubber_die_desc: "[CHARACTER.GetName] est décédé(e), n'ayant jamais mis un pied sur un bateau et en étant fier/fière."
 capable_explorer: "Explorateur capable"
 desc_capable_explorer: "Main compétente et fiable pour soutenir les expéditions, ce conseiller s'assure que les navires partent à l'heure, que les provisions sont adéquates et que les dépêches reviennent rapidement. Pas un visionnaire, mais l'exploration prospère autant grâce à une administration compétente qu'à des capitaines audacieux."
 capable_explorer_die_desc: "[CHARACTER.GetName] est décédé(e). Ses registres étaient impeccables et les flottes qu'il/elle a approvisionnées sont toujours en mer[CHARACTER.GetHerHis][CHARACTER.GetSheHe]."
 legendary_navigator: "Navigateur légendaire"
 desc_legendary_navigator: "Ce conseiller semble comprendre la mer comme d'autres comprennent leur langue maternelle. Sous sa direction, nos explorateurs trouvent des vents favorables là où d'autres trouvent des tempêtes, et les frontières du monde connu reculent d'année en année."
 legendary_navigator_die_desc: "[CHARACTER.GetName] est décédé(e), et les cartographes se disputent déjà sur le nom à donner aux sites que [CHARACTER.GetSheHe] a aidé à découvrir."
 restless_pioneer: "Pionnier inquiet"
 desc_restless_pioneer: "Ce conseiller ne peut regarder un espace vide sur une carte sans vouloir le combler. L'exploration s'accélère et les colons affluent vers de nouvelles terres — mais l'ambition coloniale n'est jamais discrète, et les puissances mondiales commencent à nous observer d'un œil méfiant."
 restless_pioneer_die_desc: "[CHARACTER.GetName] est mort(e) quelque part aux confins du monde connu, ce qui est exactement là où [CHARACTER.GetSheHe] aurait voulu être."
 prosperity_planner_die_desc: "[CHARACTER.GetName] s'en est allé(e). Les champs qu'elle a aidé à cultiver fleuriront encore, mais une main guide a quitté la charrue."
 tactful_envoy_die_desc: "[CHARACTER.GetName] est décédé(e). [CHARACTER.GetHerHis] absence se fera sentir dans une douzaine de petites courtoisies que nous ne savons plus pratiquer."
 master_statesman_die_desc: "[CHARACTER.GetName] est décédé(e), et les cours étrangères qui l'admiraient envoient des lettres de sincères condoléances à [CHARACTER.GetHerHim]."
 dove_of_court_die_desc: "[CHARACTER.GetName] est décédé. Le royaume que [CHARACTER.GetSheHe] laisse derrière elle est apprécié et peut-être trop habitué au confort."
