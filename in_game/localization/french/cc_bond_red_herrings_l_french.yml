l_french:
 # ===== RED HERRING EVENTS — cc_bonds.70–89 =====
 # False positives fire after secretly bad choices. False negatives after good ones.

 # === cc_bonds.70 — False Positive (generic — works for colony and march) ===
 cc_bonds.70.title: "Gratitude de la frontière"
 cc_bonds.70.desc: "Une dépêche arrive rapportant que les arrangements récents ont été accueillis avec une chaleur surprenante. L'administration locale semble fonctionner sans accroc, et plusieurs personnalités notables ont exprimé leur satisfaction quant à la manière dont les choses ont été gérées. Les rapports sont élogieux — peut-être même de façon inattendue."
 cc_bonds.70.a: "Bien. Ces arrangements servent tout le monde."

 # === cc_bonds.71 — False Positive (spoils / extraction) ===
 cc_bonds.71.title: "Aucune plainte signalée"
 cc_bonds.71.desc: "Nos envoyés sont revenus de [bond_subj.GetName] avec un rapport sans relief. La distribution des revenus récents a été acceptée sans protestation formelle. Aucune pétition n'a été déposée ; aucun grief n'a été soulevé par les voies officielles. L'affaire semble close."
 cc_bonds.71.a: "Comme il se doit."

 # === cc_bonds.72 — False Positive (dismissal / replacement) ===
 cc_bonds.72.title: "Stabilité rétablie"
 cc_bonds.72.desc: "Les rapports de [bond_subj.GetName] suggèrent que les mesures récentes ont eu l'effet escompté. Quelles que soient les tensions existantes, elles semblent s'être dissipées, et les observateurs décrivent la situation comme calme et ordonnée. La décision semble avoir été la bonne."
 cc_bonds.72.a: "L'affaire est donc réglée."

 # === cc_bonds.73 — False Positive (refusal / reassignment) ===
 cc_bonds.73.title: "Une lettre de coopération"
 cc_bonds.73.desc: "Un message étonnamment gracieux est arrivé de [bond_subj.GetName]. La maison régnante reconnaît la décision de la Couronne, n'exprime aucun ressentiment et réaffirme son engagement envers l'arrangement. Le ton est chaleureux. La dépêche ne contient aucun sous-entendu que nos secrétaires puissent détecter."
 cc_bonds.73.a: "Une réponse satisfaisante."

 # === cc_bonds.74 — False Positive (colonial militia disbandment) ===
 cc_bonds.74.title: "Ordre totalement rétabli"
 cc_bonds.74.desc: "L'administration coloniale a déposé un rapport complet sur les suites de la répression de la milice. L'ordre a été rétabli dans toute la colonie ; aucun autre incident n'a été enregistré ; la population semble être revenue à ses activités ordinaires. Le gouverneur loue l'action décisive de la Couronne."
 cc_bonds.74.a: "La situation est parfaitement maîtrisée."

 # === cc_bonds.75 — False Negative (flexible administration — the good choice) ===
 cc_bonds.75.title: "Inquiétudes à la cour"
 cc_bonds.75.desc: "Plusieurs de nos conseillers les plus traditionnels ont exprimé des réserves discrètes quant aux arrangements administratifs flexibles accordés à [bond_subj.GetName]. Un mémorandum, circulé au sein du conseil, suggère qu'une indulgence administrative est difficile à revenir en arrière une fois établie. La préoccupation est notée. Qu'elle reflète la réalité ou une anxiété conservatrice est moins clair."
 cc_bonds.75.a: "C'est noté. Nous surveillerons la situation."

 # === cc_bonds.76 — False Negative (no levy — the good choice) ===
 cc_bonds.76.title: "Murmures de sujets enhardis"
 cc_bonds.76.desc: "La rumeur veut que la décision de ne pas lever de troupes dans [bond_subj.GetName] ait été interprétée par certains observateurs comme une faiblesse. Un rapport — on nous dit qu'il est marginal — suggère que le gouverneur a commencé à « tester les limites de ce que la Couronne exigera ». Nos secrétaires ne peuvent le confirmer. Il s'agit peut-être simplement des commérages habituels de la cour."
 cc_bonds.76.a: "Spéculation. Nous maintenons notre décision."

 # === cc_bonds.77 — False Positive (merit appointment — the worse choice) ===
 cc_bonds.77.title: "La nomination est bien accueillie"
 cc_bonds.77.desc: "Notre nomination au mérite au poste provincial a été louée dans plusieurs dépêches comme un modèle de bonne gouvernance. Le nommé a fait une première impression favorable sur les administrateurs locaux. La maison du gouverneur n'a soulevé aucune objection formelle. La nomination semble avoir satisfait toutes les parties."
 cc_bonds.77.a: "Le mérite parle de lui-même."

 # === cc_bonds.78 — False Negative (preserve local customs — the good choice) ===
 cc_bonds.78.title: "Les nobles questionnent la clémence"
 cc_bonds.78.desc: "Plusieurs voix influentes de l'état noble ont remis en question la décision de la Couronne de préserver les coutumes locales à [bond_subj.GetName]. Leur argument repose sur un principe administratif : l'incohérence affaiblit l'autorité de la loi royale. La critique est formelle et courtoise, mais incisive. Il nous appartient de déterminer s'il s'agit d'une préoccupation substantielle ou de la friction prévisible de toute réforme."
 cc_bonds.78.a: "Les nobles expriment leur opinion. Nous avons fait notre choix."

 # === cc_bonds.79 — False Positive (waive palatinate ceremony) ===
 cc_bonds.79.title: "Le Seigneur fait ses preuves"
 cc_bonds.79.desc: "Quelles que soient les réserves que le seigneur du palatinat a pu avoir concernant l'investiture simplifiée, il ne les a pas laissées paraître. Depuis, au cours des mois écoulés, il a géré plusieurs affaires locales difficiles avec efficacité et loyauté. Notre envoyé le décrit comme « entièrement dévoué à ses fonctions ». Si le manque de cérémonie a laissé une trace, elle n'est pas visible de l'extérieur."
 cc_bonds.79.a: "Bien. Le fond importe plus que la forme."

 # === cc_bonds.80 — False Negative (palatinate levy exemption — the good choice) ===
 cc_bonds.80.title: "Rumeurs d'un Palatinat enhardi"
 cc_bonds.80.desc: "La nouvelle nous est parvenue — par des canaux informels — que la décision d'exempter [bond_subj.GetName] de la récente levée a été interprétée comme une hésitation. Un courtisan suggère que le seigneur du palatinat a été « enhardi ». La source n'est pas entièrement fiable et l'affirmation n'a pas été corroborée, mais c'est le genre de rumeur qui persiste si nous ne l'abordons pas."
 cc_bonds.80.a: "Nous verrons comment le seigneur se conduit."

 # === cc_bonds.81 — False Positive (ignore palatinate border dispute) ===
 cc_bonds.81.title: "Le différend se résout discrètement"
 cc_bonds.81.desc: "Nos secrétaires ont transmis une brève note : le différend frontalier impliquant [bond_subj.GetName] semble s'être apaisé sans intervention de la Couronne. Les parties sont parvenues à un arrangement informel. Notre neutralité n'a, apparemment, créé aucune difficulté visible."
 cc_bonds.81.a: "Comme nous nous y attendions."

 # === cc_bonds.82 — False Negative (temporary tax relief — the sensible choice) ===
 cc_bonds.82.title: "Le Seigneur en demande davantage"
 cc_bonds.82.desc: "Le seigneur palatin a envoyé une communication de suivi. Bien qu'il ait exprimé sa gratitude pour le soulagement temporaire dans sa réponse initiale, il demande maintenant s'il est possible de prolonger l'arrangement. La demande est formulée avec soin, mais son sens est clair : il a pris le geste comme une invitation à négocier. Nos conseillers sont divisés pour savoir s'il s'agit d'opportunisme ou d'une attente raisonnable."
 cc_bonds.82.a: "Nous répondrons en temps voulu."

 # === cc_bonds.83 — False Positive (refuse puppet ambassador) ===
 cc_bonds.83.title: "La marionnette accepte l'arrangement"
 cc_bonds.83.desc: "Le gouvernement de [bond_subj.GetName] a pris acte de notre décision concernant la demande d'ambassade. Leur réponse est formelle et mesurée — aucune protestation, aucune déclaration publique, aucun retrait de coopération sur les dossiers en cours. Apparemment, ils ont accepté l'arrangement et sont passés à autre chose."
 cc_bonds.83.a: "Colonisé."

 # === cc_bonds.84 — False Positive (ignore puppet faction dispute) ===
 cc_bonds.84.title: "Les tensions au sein de la faction s'apaisent"
 cc_bonds.84.desc: "Les rapports de [bond_subj.GetName] indiquent que le conflit entre factions internes s'est considérablement apaisé ces derniers mois. Aucune faction n'a émergé comme dominante, mais la situation ne s'est pas non plus aggravée. Les observateurs décrivent la situation politique comme « stable ». Notre neutralité semble avoir évité d'enflammer l'un ou l'autre camp."
 cc_bonds.84.a: "Parfois, la retenue est la politique la plus sage."

 # === cc_bonds.85 — False Positive (forbid puppet military expansion) ===
 cc_bonds.85.title: "La directive est acceptée"
 cc_bonds.85.desc: "Le gouvernement de [bond_subj.GetName] a formellement pris acte de la décision de la Couronne concernant l'expansion militaire. Leur réponse est coopérative ; ils n'expriment aucun désaccord public et n'ont fait aucun effort visible pour rechercher des arrangements alternatifs. L'affaire semble close de leur côté."
 cc_bonds.85.a: "Ils ont compris le message."

 # === cc_bonds.86 — False Positive (send formal letter instead of visiting) ===
 cc_bonds.86.title: "Une réponse chaleureuse"
 cc_bonds.86.desc: "Notre lettre à [bond_subj.GetName] a été reçue et actée. La maison régnante a répondu avec une courtoisie gracieuse, remerciant la Couronne de son attention et exprimant que le geste était apprécié. La réponse s'étend sur trois pages et ne pourrait être plus cordiale. Il est difficile de dire, à la lecture d'une lettre, si cette cordialité est sincère ou diplomatique."
 cc_bonds.86.a: "Les formalités sont remplies."

 # === cc_bonds.87 — False Positive (exclude dependency from royal ceremony) ===
 cc_bonds.87.title: "Une lettre de félicitations"
 cc_bonds.87.desc: "La maison régnante de [bond_subj.GetName] a envoyé une lettre de félicitations réfléchie pour la récente occasion royale. Ils ne mentionnent pas leur absence. La lettre est chaleureuse et inclut un cadeau. Notre chambellan note que le cadeau est quelque peu plus modeste que les années précédentes — mais n'offre aucune interprétation."
 cc_bonds.87.a: "L'événement a été un succès."

 # === cc_bonds.88 — False Negative (dependency mobilizes on their own) ===
 cc_bonds.88.title: "La dépendance se mobilise"
 cc_bonds.88.desc: "Les rapports de [bond_subj.GetName] décrivent une mobilisation locale impressionnante en réponse à la menace frontalière. La maison régnante a levé des troupes, renforcé ses positions frontalières et repoussé l'incursion initiale sans notre intervention directe. Les observateurs y voient une démonstration de résilience. Ce qu'ils n'évoquent pas — du moins pas dans les dépêches que nous recevons — c'est leur ressenti face à l'idée d'avoir dû gérer cela seuls."
 cc_bonds.88.a: "Ils s'en sont sortis. Bien."

 # === cc_bonds.89 — False Positive (refuse dependency succession consultation) ===
 cc_bonds.89.title: "La prérogative acceptée"
 cc_bonds.89.desc: "La maison régnante de [bond_subj.GetName] a pris acte de notre décision concernant la question de la consultation sur la succession. Leur réponse formelle affirme la prérogative de la Couronne en ces matières et retire la pétition sans autre commentaire. Rien dans le langage ne suggère du ressentiment. Nos secrétaires décrivent le ton comme étant « tout à fait approprié »."
 cc_bonds.89.a: "Comme il se doit. La succession n'est pas de leur ressort."
