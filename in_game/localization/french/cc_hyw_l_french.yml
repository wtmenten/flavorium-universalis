l_french:
 ########################################
 # cc_hyw.1 — The Auld Alliance
 ########################################
 cc_hyw.1.title: "L'Auld Alliance"
 cc_hyw.1.desc: "Alors que l'Angleterre masse ses forces et fait valoir ses droits sur le trône de France, nos alliés traditionnels d'Écosse observent avec anxiété depuis l'autre côté de la Manche. Si la France formalise son engagement envers l'indépendance de l'Écosse, nous bloquons le flanc nord de l'Angleterre — mais nous risquons d'attirer la colère royale de Londres."
 cc_hyw.1.a: "Garantir l'indépendance de l'Écosse."
 cc_hyw.1.b: "Promettre un soutien informel, sans engagement officiel."
 cc_hyw.1.c: "La France mène ses propres batailles. L'Écosse doit se débrouiller seule."

 ########################################
 # cc_hyw.10 — Victory Over England
 ########################################
 cc_hyw.10.title: "Victoire sur l'Angleterre"
 cc_hyw.10.desc: "Les Anglais ont été repoussés. Nos armées ont prouvé leur valeur, et la fleur de lys flotte fièrement. Comment utiliserons-nous ce moment de triomphe ?"
 cc_hyw.10.a: "Que le royaume se réjouisse. Renouvelons notre lien avec l'Écosse."
 cc_hyw.10.b: "Profitons de notre avantage. Les sujets de l'Angleterre en France pourraient être influencés."

 ########################################
 # cc_hyw.11 — Defeat Darkens the Kingdom
 ########################################
 cc_hyw.11.title: "La défaite assombrit le Royaume"
 cc_hyw.11.desc: "La guerre n'a pas tourné comme espéré. Nos armées ont été repoussées et la noblesse s'impatiente. L'ombre portée de la défaite s'étend sur le royaume."
 cc_hyw.11.a: "Se regrouper et endurer. La France a survécu à pire."
 cc_hyw.11.b: "Exiger des sacrifices de la part des nobles. Ils fourniront les levées dont nous avons besoin — moyennant finance."

 ########################################
 # cc_hyw.12 — War Breaks Out in the West
 ########################################
 cc_hyw.12.title: "La guerre éclate à l'Ouest"
 cc_hyw.12.desc: "La nouvelle nous parvient que [GetCountryName(scope:actor)] a déclaré la guerre à [GetCountryName(scope:recipient)]. Les grandes puissances de la chrétienté occidentale sont une fois de plus à s'entre-déchirer. Comment devons-nous répondre ?"
 cc_hyw.12.a: "Proposer de servir de médiateur entre les parties."
 cc_hyw.12.b: "Exprimer notre soutien à [GetCountryName(scope:actor)]."
 cc_hyw.12.c: "Soutenez [GetCountryName(scope:recipient)]."
 cc_hyw.12.d: "Cela ne nous regarde pas."

 ########################################
 # cc_hyw.13 — Victory in the West
 ########################################
 cc_hyw.13.title: "Victoire à l'Ouest"
 cc_hyw.13.desc: "Nos armées ont triomphé. Un autre ennemi a été repoussé du sol français. Le royaume s'en sort renforcé, et la noblesse célèbre dans les salles de Paris."
 cc_hyw.13.a: "Que les nobles festoyent. La France est victorieuse."
 cc_hyw.13.b: "Profitons de l'avantage avant que notre ennemi ne puisse s'en remettre."

 ########################################
 # cc_hyw.20 — Our Suzerain Falters
 ########################################
 cc_hyw.20.title: "Notre suzerain vacille"
 cc_hyw.20.desc: "La France a subi une défaite, et Paris semble loin. La noblesse murmure. De l'autre côté de la Manche, les Anglais font des promesses et adressent des salutations chaleureuses. Le moment est peut-être venu de reconsidérer où se situent nos véritables intérêts."
 cc_hyw.20.a: "Solliciter le soutien de l'Angleterre."
 cc_hyw.20.b: "Exiger une plus grande autonomie de la couronne française."
 cc_hyw.20.c: "Rester fidèle. Notre destin est lié à celui de la France."

 ########################################
 # cc_hyw.21 — A Vassal Reaches Toward England
 ########################################
 cc_hyw.21.title: "Un vassal se tourne vers l'Angleterre"
 cc_hyw.21.desc: "[wavering_subject.GetName] a été en contact avec les Anglais — cherchant des assurances, peut-être, ou quelque chose de plus. La couronne ne peut se permettre de paraître faible. Comment répondons-nous à cet acte de défi ?"
 cc_hyw.21.a: "Punissez la déloyauté. L'autorité de la couronne ne sera pas remise en question."
 cc_hyw.21.b: "Apaisez-les avec de l'or. La loyauté peut s'acheter."
 cc_hyw.21.c: "Laissez-les partir. Nous ne pouvons pas nous permettre cette distraction pour le moment."

 ########################################
 # cc_hyw.22 — Our Suzerain England Falters
 ########################################
 cc_hyw.22.title: "L'Angleterre a été vaincue"
 cc_hyw.22.desc: "Les armées anglaises ont été repoussées, et le roi lutte pour maintenir son emprise sur ses territoires continentaux. Les Français font des avances. Il est peut-être temps de reconsidérer notre position."
 cc_hyw.22.a: "Solliciter la protection française."
 cc_hyw.22.b: "Exiger plus d'autonomie de la couronne anglaise."
 cc_hyw.22.c: "Tenir bon. L'Angleterre s'en remettra."

 ########################################
 # cc_hyw.23 — An English Vassal Demands Concessions
 ########################################
 cc_hyw.23.title: "Un vassal exige des concessions"
 cc_hyw.23.desc: "[eng_wavering_subject.GetName] a pris courage suite à notre défaite. Ils exigent des concessions, et le murmure de la France se fait entendre. L'Angleterre ne peut se permettre de paraître faible devant ses sujets continentaux."
 cc_hyw.23.a: "Affirmer l'autorité anglaise. Aucune concession ne sera faite."
 cc_hyw.23.b: "Les soudoyer. Un vassal loyal vaut bien quelques pièces."
 cc_hyw.23.c: "Les libérer. Ils causent plus d'ennuis qu'ils n'en valent la peine."

 ########################################
 # cc_hyw.30 — The Lowlands Question
 ########################################
 cc_hyw.30.title: "La question des Pays-Bas"
 cc_hyw.30.desc: "[lowlands_subject.GetName] envoie des envoyés à [GetName] porteurs d'une demande ferme : les provinces néerlandaises acquises lors de notre récente victoire leur appartiennent de droit, par proximité, culture et intérêt prolongé. Refuser leur demande risque de compromettre la loyauté d'un vassal vital — mais l'accepter revient à céder un point d'appui riche dans le nord."
 cc_hyw.30.a: "Octroyer les provinces des basses terres à [lowlands_subject.GetName]."
 cc_hyw.30.b: "Refuser. Qu'ils cherchent un autre maître."
 cc_hyw.30.c: "Rejeter la revendication. Ils sont liés à nous — ils n'oseraient pas partir."

 ########################################
 # cc_hyw.31 — A Duchy Without a Lord
 ########################################
 cc_hyw.31.title: "Un duché sans seigneur"
 cc_hyw.31.desc: "Nos armées ont sécurisé des terres dans les Pays-Bas, pourtant aucun seigneur ne les gouverne en notre nom. Les bourgeois néerlandais regardent avec méfiance l'autorité étrangère. Nous pourrions y établir un duché vassal loyal et gagner la bienveillance de la région — ou conserver ces riches provinces pour la couronne et accepter l'agitation qui s'ensuivra."
 cc_hyw.31.a: "Établir un duché vassal néerlandais pour gouverner ces terres."
 cc_hyw.31.b: "Ces terres appartiennent à la couronne. Nous les gouvernerons directement."

 ########################################
 # Bias display names
 ########################################
 cc_hyw_lowlands_land_refused: "Revendication sur les Pays-Bas rejetée"
 cc_hyw_lowlands_hre_displeasure: "Mécontentement face à la politique des basses terres"
 cc_hyw_dutch_nations_anger: "Colère face au refus d'un vassal néerlandais"

 ########################################
 # Country Interaction: Replace the Appanage Ruler
 ########################################
 cc_hyw_replace_appanage_ruler: "Remplacer le détenteur de l'apanage"
 cc_hyw_replace_appanage_ruler_desc: "Affirmer l'autorité royale en imposant un changement de dirigeant à un apanage déloyal. L'intervention réduira considérablement le désir d'autonomie de l'apanage, mais déstabilisera la noblesse française et propagera l'agitation parmi les autres apanages."
 cc_hyw_replace_appanage_ruler_trigger_desc: "La couronne de France réaffirme son autorité sur [recipient.GetName], en installant une maison plus loyale à la tête de l'apanage."
