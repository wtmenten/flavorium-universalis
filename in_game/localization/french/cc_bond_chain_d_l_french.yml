l_french:
 # === cc_bonds.130 — A Brilliant Student ===
 cc_bonds.130.title: "Un étudiant brillant"
 cc_bonds.130.desc: "Un érudit d'un talent remarquable a émergé de [bond_subj.GetName] — un jeune esprit dont l'intérêt semble être la philosophie, la gouvernance et l'histoire des peuples. Selon sa réputation et les quelques courts ouvrages déjà en circulation, c'est quelqu'un dont les idées compteront. La question que nous nous posons est : quel genre d'idées, et au service de qui ? Livré à lui-même, il écrira tout ce que sa patrie produit. Amené à notre cour, il écrira ce que notre cour façonne. Mis au travail comme propagandiste, il écrira ce dont nous avons besoin — et tout le monde le saura."
 cc_bonds.130.a: "Amenez-le à notre cour. Qu'il apprenne le fonctionnement de l'empire de l'intérieur."
 cc_bonds.130.b: "Financer ses études dans sa patrie et le laisser publier librement. Qu'il soit ce qu'il est."
 cc_bonds.130.c: "Lui proposer un emploi. Son talent doit servir les intérêts de la Couronne."
 cc_bonds.130.d: "C'est un érudit dans un État vassal. Nous n'avons pas besoin de nous en mêler."

 # === cc_bonds.131 — The Scholar's First Work ===
 cc_bonds.131.title: "Le premier ouvrage du savant"
 cc_bonds.131.desc_court: "Le savant de [bond_subj.GetName] a achevé un ouvrage majeur — poli, assuré et profondément façonné par ses années passées à notre cour. L'argument central présente l'histoire du sujet comme une préparation à l'empire dont il fait désormais partie : leurs traditions comme précurseurs de nos institutions, leurs accomplissements comme tributs à un récit culturel plus vaste. C'est, à l'instar de toute historiographie impériale bien conçue, à la fois flatteur et légèrement inconfortable à lire."
 cc_bonds.131.desc_home: "Le savant de [bond_subj.GetName] a publié un ouvrage majeur, et ce n'est pas ce que nous aurions prédit. C'est un récit méticuleux et magnifiquement écrit de l'histoire culturelle du sujet — sa langue, ses traditions, son héritage philosophique distinct. Il n'attaque pas la relation de suzeraineté. Il ne préconise rien. Il insiste simplement, avec une élégance considérable, sur le fait qu'il y a ici quelque chose qui mérite d'être décrit, et que la description constitue son propre argument."
 cc_bonds.131.desc_prop: "Le propagandiste de [bond_subj.GetName] a produit son œuvre dans les délais. Elle soutient, comme nous l'avons demandé, que le partenariat [overlord.GetNameWithNoTooltip]-[bond_subj.GetNameWithNoTooltip] est fondé sur un bénéfice mutuel, que la gouvernance de [overlord.GetName] a enrichi [bond_subj.GetNameWithNoTooltip], et que le peuple [bond_subj_culture.GetName] partage un destin commun. L'œuvre a été distribuée. Elle a été lue. Parmi les rares personnes instruites de [bond_subj.GetNameWithNoTooltip], elle a été discutée principalement sur le ton que l'on utilise pour parler de quelque chose que l'on trouve légèrement embarrassant."
 cc_bonds.131.desc_free: "Le savant de [bond_subj.GetName] — celui que nous n'avons ni parrainé ni recruté — a publié un ouvrage qui a circulé au-delà du territoire. Le ton est ambivalent : il ne célèbre pas la relation de suzeraineté, mais ne la condamne pas non plus. Il décrit ce qui est. Son effet, là où il a été lu, est modeste : une légère impression positive de la culture intellectuelle du sujet, et rien de plus."
 cc_bonds.131.a_use: "Utilisez-le comme texte officiel. Distribuez-le via les canaux de la Couronne."
 cc_bonds.131.a_standalone: "Laissez l'œuvre se suffire à elle-même. Un tel travail gagne davantage en respect sans l'intervention de la Couronne."
 cc_bonds.131.b_sponsor: "Parrainez un volume complémentaire qui situe cet ouvrage dans l'histoire plus large de l'empire."
 cc_bonds.131.b_allow: "Laissez-le tel quel. C'est leur histoire, et elle ne menace pas la nôtre."
 cc_bonds.131.b_suppress: "Réprimer. Ce genre d'affirmation culturelle a des conséquences."
 cc_bonds.131.c_more: "En commander davantage. Le travail produit les résultats escomptés."
 cc_bonds.131.c_distance: "Détacher la Couronne de ceci. Ce travail ne nous a pas été utile."
 cc_bonds.131.d_note: "C'est noté. Le sujet produit des esprits intéressants."

 # === cc_bonds.132 — The Scholar's Legacy ===
 cc_bonds.132.title: "L'héritage du savant"
 cc_bonds.132.desc_aligned: "Le savant de [bond_subj.GetName] est décédé, comme meurent les savants, ayant produit plus qu'il ne l'avait prévu. Ses idées ont imprégné la classe instruite du territoire pendant une génération. Ce qui est remarquable, de notre point de vue, c'est la manière dont elles ont été reçues : comme l'œuvre de quelqu'un qui comprenait la raison d'être de l'empire et a choisi d'y appartenir. Ses élèves le citent pour défendre la relation de suzeraineté. Il est devenu, à titre posthume, l'un des arguments les plus persuasifs en faveur de la loyauté que le territoire ait jamais produits."
 cc_bonds.132.desc_contested: "Le savant de [bond_subj.GetName] est décédé, laissant derrière lui des écrits qui lui survivront de plusieurs générations. Un courant de pensée existe désormais dans le territoire, partant de son postulat : que la culture du sujet est distincte, cohérente et mérite d'être préservée. Cela joue dans les deux sens. Les étudiants qui croient également en l'empire soutiennent que les deux sont compatibles — que l'on peut être profondément soi-même tout en étant loyal. Ceux qui ne croient pas en l'empire trouvent dans ces mêmes textes leur justification la plus éloquente."
 cc_bonds.132.desc_suppressed: "Le savant que nous avons supprimé est mort depuis des années, et son œuvre est aujourd'hui plus largement lue qu'elle ne l'était lorsque nous l'avons interdite. Des copies clandestines circulent. Des étudiants les recopient à la main. Les idées que nous jugions trop dangereuses pour être autorisées sont devenues, précisément à cause de ce jugement, les idées les plus passionnantes du territoire. La suppression n'a pas mis fin au débat. Elle a offert au débat un martyr."
 cc_bonds.132.desc_default: "Une génération s'est écoulée depuis que le savant de [bond_subj.GetName] a produit l'œuvre avec laquelle nous avons interagi — ou choisi de ne pas interagir. Le paysage intellectuel du territoire a évolué d'une manière qu'il est difficile d'attribuer à une cause unique. La contribution du savant, quelle qu'elle ait été, a été absorbée dans la culture générale et n'est plus séparable de celle-ci."
 cc_bonds.132.a: "Son héritage sert fidèlement l'empire. Nous allons le reconnaître formellement."
 cc_bonds.132.b_embrace: "Leur identité culturelle et leur loyauté envers nous ne sont pas contradictoires. Acceptez les deux."
 cc_bonds.132.b_neutral: "Les idées ont pris racine. Nous les laisserons croître comme elles le souhaitent."
 cc_bonds.132.c: "La répression a produit l'inverse de ce que nous souhaitions."
 cc_bonds.132.d: "Le chapitre du savant est clos."

 cc_bonds.132.desc_counter: "Le savant a passé les dernières décennies de [scholar_char.GetHerHis] carrière à travailler dans des circonstances qui n'ont jamais été résolues proprement. Employé comme propagandiste, puis traité avec distance politique lorsque le travail est devenu trop transparent — la situation a produit quelque chose que la Courn'avait pas prévu. En refusant d'approuver pleinement ce que [scholar_char.GetSheHe] avait écrit, nous lui avons laissé la possibilité d'être autre chose que de la propagande. C'est ainsi que l'œuvre fut lue. Le territoire ne se souvient pas de [scholar_char.GetName] comme d'un employé de la cour, mais comme d'une figure complexe et intègre. L'héritage est plus nuancé — et plus durable — qu'un travail commandé ne l'aurait été."

 cc_bonds.132.e: "Reconnaissez la distance principled du savant. Cela a rendu le travail de [scholar_char.GetHerHis] honnête."
 cc_bonds.132.e.tooltip: "La décision du suzerain de se distancier de la propagande a donné au travail du savant une authenticité qu'une glorification commandée n'aurait pu atteindre. Le cul et le per s'améliorent tous deux, et une chronique durable est créée."

 # === Works of art created by the brilliant scholar chain ===
 cc_scholar_early_notes: "Premières notes d'une cour lointaine"
 cc_scholar_early_notes_desc: "Une collection d'observations et de réflexions produites durant la période formative d'une carrière universitaire remarquable."

 cc_scholar_imperial_chronicle: "Une chronique impériale"
 cc_scholar_imperial_chronicle_desc: "Un récit historique majeur présentant le passé du sujet comme une préparation à l'empire auquel il appartient désormais — érudit, ambitieux et soigneusement situé."

 cc_scholar_homeland_chronicle: "Une chronique de la patrie"
 cc_scholar_homeland_chronicle_desc: "Un compte rendu méticuleux de l'histoire culturelle, des traditions et de l'héritage philosophique distinct du territoire sujet — insistant, avec une élégance considérable, sur le fait qu'il y a ici quelque chose qui mérite d'être préservé."

 cc_scholar_propaganda_work: "Un traité sur le destin commun"
 cc_scholar_propaganda_work_desc: "Un ouvrage commandé soutenant que le partenariat suzerain-sujet est fondé sur un bénéfice mutuel et un avenir commun. Lu avec un scepticisme poli dans le territoire qu'il décrit."

 cc_scholar_legacy_work: "L'héritage du savant"
 cc_scholar_legacy_work_desc: "L'œuvre culminante d'une carrière distinguée — une synthèse qui a déjà commencé à façonner la vie intellectuelle d'une génération."

 cc_scholar_forbidden_work: "Le traité supprimé"
 cc_scholar_forbidden_work_desc: "Un ouvrage ayant circulé en copies clandestines longtemps après son interdiction formelle. La suppression lui a donné un martyre qu'il n'aurait pu acquérir seul."
