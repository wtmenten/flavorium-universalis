l_english:
 # ============================================================
 # SITUATION NAME / DESCRIPTION / HINT
 # ============================================================
 cc_balance_of_power: "The Balance of Power"
 cc_balance_of_power_desc: "Across Europe and the Near-East the great powers eye one another warily. As one state reaches for pre-eminence, the others draw together to deny it — the aspiring Preponderant Bloc against the Balancing Coalition. So long as neither prevails, the equilibrium holds; should it break, a new master of the continent may emerge, the east may pour westward, or revolution may sweep the old order away entirely."
 hint_cc_balance_of_power: "The Balance of Power is a two-pole great-power situation. The strongest eligible power leads the Preponderant Bloc; the strongest power that fears it leads the Balancing Coalition. The Preponderance Share (0-100, 50 = equilibrium) measures how dominant the leading bloc has become. Courts may be drawn between the blocs by kinship, faith, fear, threats or gold; the coalition can subsidise weaker members, court neutrals, and convene a Congress to close ranks. The situation ends when the balance breaks — through hegemony, an eastern deluge, or revolution — or is preserved as a lasting Concert of Europe."

 # ============================================================
 # MAP LEGEND & TOOLTIPS
 # ============================================================
 CC_BOP_PREPONDERANCE_LEGEND: "Preponderant Bloc"
 CC_BOP_COALITION_LEGEND: "Balancing Coalition"
 CC_BOP_NEUTRAL_LEGEND: "Unaligned Power"
 cc_bop_preponderance_member_tt: "This land belongs to a member of the Preponderant Bloc."
 cc_bop_coalition_member_tt: "This land belongs to a member of the Balancing Coalition."
 cc_bop_neutral_tt: "This land belongs to an unaligned power watching the balance from the sidelines."

 # ============================================================
 # CABINET-MINISTER & WARTIME CONDITION TOOLTIPS (situation / IO actions)
 # ============================================================
 cc_bop_needs_free_hands_minister_tt: "A cabinet minister must be assigned to the #Y $cc_duty_free_hands$#! duty — a statesman keeping our options open."
 cc_bop_needs_diplomat_minister_tt: "A cabinet minister must be on a diplomatic posting — the #Y $cc_duty_diplomatic_mission$#! duty or the #Y diplomatic corps#! — to work the back channels."
 cc_bop_cannot_leave_at_war_tt: "We must be #R at peace#! — a bloc closes ranks in wartime, and no member may desert its allies while under arms."

 # ============================================================
 # IO Currencies
 # ============================================================

 cc_bop_ambition: "Ambition"
 cc_bop_ambition_desc: "A measure of preponderant strength and eagerness. Spent by the hegemon aspirant"

 cc_bop_resolve: "Resolve"
 cc_bop_resolve_desc: "A measure of coalition cohesion and endurance. Spent by the coalition leader."

 # ============================================================
 # END REASONS
 # ============================================================
 cc_bop_end_hegemony: "The balance has broken — one power has mastered the continent."
 cc_bop_end_deluge: "An eastern power has surged westward, overwhelming the old order."
 cc_bop_end_revolution: "Revolution has shattered the careful equilibrium of kings."
 cc_bop_end_concert: "The equilibrium has endured and been institutionalised as a Concert of Europe."

 # ============================================================
 # INTERNATIONAL ORGANIZATIONS
 # ============================================================
 cc_bop_preponderance: "Preponderant Bloc"
 cc_bop_coalition: "Balancing Coalition"
 cc_bop_concert: "Concert of Europe"
 io_opinion_cc_bop_preponderance: "Fellow Member of the Preponderant Bloc"
 io_opinion_cc_bop_coalition: "Fellow Member of the Balancing Coalition"
 io_opinion_cc_bop_concert: "Fellow Member of the Concert of Europe"

 # IO variable display
 CC_BOP_AMBITION_FORMAT: "$VAL$"
 CC_BOP_RESOLVE_FORMAT: "$VAL$"
 CC_BOP_AMBITION_NATURAL: "Momentum of Ambition"
 CC_BOP_AMBITION_LEADER_STRENGTH: "Strength of the Leading Power"
 CC_BOP_RESOLVE_NATURAL: "Shared Purpose"
 CC_BOP_RESOLVE_NUMBERS: "Weight of Numbers"
 CC_BOP_RESOLVE_COMMON_THREAT: "A Common Enemy"

 # ai_desire_to_join factor descriptions
 CC_BOP_NOT_ENGAGED: "We hold ourselves apart from the great game"
 CC_BOP_ROYAL_MARRIAGE: "Bound by a royal marriage"
 CC_BOP_SHARED_RELIGION: "Bound by a common faith"
 CC_BOP_SHARED_CULTURE: "Bound by a common culture"
 CC_BOP_OVERLORD: "Following our overlord"
 CC_BOP_RIVALRY: "Old rivalry forbids it"
 CC_BOP_LEADER_RELATIONS: "Our relations with the leading power"
 CC_BOP_BOUGHT_NEUTRALITY: "Foreign gold counsels neutrality"
 CC_BOP_FEAR_OF_HEGEMON: "Fear of the aspiring hegemon"
 CC_BOP_WAR_URGENCY: "At war — we need allies"
 CC_BOP_MEMBER_COMMITMENT: "We have cast our lot with this bloc"
 CC_BOP_NEUTRALIST_PULL: "Foreign gold tempts us toward neutrality"
 CC_BOP_NEUTRALIST_COUNSEL: "Our ministers counsel keeping our hands free"
 CC_BOP_BLOC_FALTERING: "Our bloc is visibly faltering"
 CC_BOP_CAUSE_LOST: "The cause looks all but lost"
 CC_BOP_RESENT_LEADER: "We chafe under the leading power"
 # Generic AI-weight descs referenced by the coalition IO (unlocalized in vanilla)
 BASE_VALUE: "Base inclination"
 WE_WANT_THE_ORGANIZATION_TO_GROW: "We wish to see the coalition grow"

 # ============================================================
 # OPINION MODIFIERS (biases)
 # ============================================================
 cc_bop_fear_of_hegemony: "Fears Our Bid for Hegemony"
 cc_bop_coalition_solidarity_opinion: "Coalition Solidarity"
 cc_bop_concert_betrayal: "Betrayed the Concert"
 cc_bop_bought_neutrality_opinion: "Bought Our Neutrality"
 cc_bop_grateful_for_support: "Grateful for Our Support"
 cc_bop_coerced_resentment: "Resents Our Coercion"

 # ============================================================
 # CUSTOM PANEL STRINGS
 # ============================================================
 CC_BOP_EQUILIBRIUM_HEADER: "The Equilibrium"
 CC_BOP_EQUILIBRIUM_DESC: "50% is perfect equilibrium. As the leading bloc's share climbs toward 65% and beyond, the balance nears breaking point and a hegemon may emerge. The circle shows the relative strength of the three camps — the preponderant bloc, the balancing coalition, and the unaligned powers."
 CC_BOP_SHARE_SUBLABEL: "Preponderance"
 CC_BOP_PRE_LEADER_LABEL: "Aspiring Hegemon"
 CC_BOP_COA_LEADER_LABEL: "Chief Balancer"
 CC_BOP_PRE_TT: "The Preponderant Bloc — the aspiring hegemon and the powers gathered behind it. Its share of the three camps' combined strength."
 CC_BOP_COA_TT: "The Balancing Coalition — the powers banded together to deny any single state mastery of the continent. Its share of the three camps' combined strength."
 CC_BOP_NEU_TT: "The Unaligned — eligible powers holding themselves apart from the great game. Their combined weight can still tip the balance if drawn into either camp."
 CC_BOP_TENSION_TT: "The Preponderance Share runs from 0 to 100, where 50 is equilibrium. As the leading bloc's share passes 50 the tension rises, and beyond 65 the balance nears breaking point — a hegemon may emerge."
 CC_BOP_PREPONDERANCE_PANEL_HEADER: "The Preponderant Bloc"
 CC_BOP_COALITION_PANEL_HEADER: "The Balancing Coalition"
 CC_BOP_OVERVIEW_HEADER: "The Great Game"
 CC_BOP_OVERVIEW_DESC: "Two camps contend for the destiny of Europe and the Near-East. The Preponderant Bloc gathers behind the strongest power as it reaches for pre-eminence; the Balancing Coalition forms to deny it. Keep the equilibrium — through diplomacy, subsidy, threat or gold — and the peace of the continent endures. Let it break, and a new order is born in its place."

 # ============================================================
 # EVENTS
 # ============================================================
 cc_balance_of_power.1.title: "A New Equilibrium"
 cc_balance_of_power.1.desc: "The chancelleries of Europe and the Near-East have grown sophisticated in the calculus of power. No longer do princes seek conquest blindly; now they weigh, measure, and combine, so that no single crown may overtop the rest. A new age of diplomacy dawns — the age of the balance of power."
 cc_balance_of_power.1.a: "We shall play the game."

 cc_balance_of_power.2.title: "The Aspiring Power"
 cc_balance_of_power.2.desc: "Our strength now overtops that of any rival. The courts of the continent watch us with envy and dread, and already they whisper of coalitions to hem us in. The road to pre-eminence lies open — but every step along it draws the others closer together against us."
 cc_balance_of_power.2.a: "Let them fear us. Europe will bend to our will."
 cc_balance_of_power.2.b: "We seek pre-eminence, not dominion — for now."

 cc_balance_of_power.3.title: "The Indispensable Power"
 cc_balance_of_power.3.desc: "We are strong enough to matter, yet not so strong as to frighten. That makes us the natural fulcrum of the continent: the weight that, thrown onto the lighter scale, restores the balance. The smaller courts look to us to organise their defence against the aspiring hegemon."
 cc_balance_of_power.3.a: "We shall be the balance of Europe."
 cc_balance_of_power.3.b: "Let others carry this burden."

 cc_balance_of_power.10.title: "Choosing Sides"
 cc_balance_of_power.10.desc: "Envoys from both camps crowd our antechambers. The aspiring power offers friendship — and warns of the cost of refusal. The coalition offers solidarity — and the safety of numbers. Our court cannot stay aloof forever; the moment to choose has come."
 cc_balance_of_power.10.a: "Join the Balancing Coalition."
 cc_balance_of_power.10.b: "Join the Preponderant Bloc."
 cc_balance_of_power.10.c: "Keep our hands free — remain neutral."

 cc_balance_of_power.20.title: "Pressure and Persuasion"
 cc_balance_of_power.20.desc: "A lesser court hesitates to fall in behind us. Our ministers counsel that there are several ways to bring a wavering prince to heel — the mailed fist, or the open purse. Either will serve, though each leaves its own residue of resentment or dependence."
 cc_balance_of_power.20.a: "Threaten them into our bloc."
 cc_balance_of_power.20.b: "Buy their neutrality with gold."
 cc_balance_of_power.20.c: "Leave them be — for now."

 cc_balance_of_power.30.title: "Fear of the Hegemon"
 cc_balance_of_power.30.desc: "Reports reach us of the leading power's ambitions, each more alarming than the last. Our coalition partners look to us: will we give voice to the common dread, or keep our counsel and avoid provoking the colossus?"
 cc_balance_of_power.30.a: "Denounce the aspiring hegemon openly."
 cc_balance_of_power.30.b: "Hold our tongue and watch."

 cc_balance_of_power.40.title: "Redressing the Balance"
 cc_balance_of_power.40.desc: "As balancer, the means to shore up the lighter scale lie in our hands. Gold can stiffen a faltering partner; patient diplomacy can win a neutral to our cause. Each choice spends something — treasure or effort — to keep the equilibrium from tipping."
 cc_balance_of_power.40.a: "Subsidise a coalition partner."
 cc_balance_of_power.40.b: "Court a neutral power into the coalition."
 cc_balance_of_power.40.c: "Stand pat and conserve our strength."

 cc_balance_of_power.50.title: "A Congress of Powers"
 cc_balance_of_power.50.desc: "The coalition's envoys convene at our invitation. Around the table sit the powers who would keep the continent free — and each looks to us for direction. A common war-chest, a closing of ranks, or mere talk: the Congress will be what we make of it."
 cc_balance_of_power.50.a: "Establish a collective war-chest."
 cc_balance_of_power.50.b: "Resolve to contain the hegemon — close ranks."
 cc_balance_of_power.50.c: "Adjourn without agreement."

 cc_balance_of_power.60.title: "The Balance Teeters"
 cc_balance_of_power.60.desc: "The scales tip dangerously. The leading power's bloc swells while ours frays at the edges. If we do not act now to rally every wavering court, the equilibrium we have laboured to preserve will shatter, and with it the independence of the continent."
 cc_balance_of_power.60.a: "Rally every court against the looming hegemony."
 cc_balance_of_power.60.b: "We may already be too late."

 cc_balance_of_power.69.title: "The Free Hand"
 cc_balance_of_power.69.desc: "[bop_new_master.GetName] has mastered the continent, and the courts that swore to it now discover what their loyalty bought them. We swore nothing. We took audiences from both sides, promised little to either, and are the only chancellery in Europe that owes no explanation to anyone. Envoys who cannot be trusted by their friends are still worth receiving; envoys who were never anyone's are worth more."
 cc_balance_of_power.69.a: "We kept our hands free."
 cc_balance_of_power.70.title: "Master of Europe"
 cc_balance_of_power.70.desc: "The coalitions have broken upon us like waves upon a rock. No combination of powers can now restrain our will. A new Charlemagne, a new Caesar — history will record that in this age, the balance of Europe was ours to command."
 cc_balance_of_power.70.a: "The continent is ours."

 cc_balance_of_power.71.title: "The Hegemon Triumphant"
 cc_balance_of_power.71.desc: "Despite every alliance and every congress, we could not hold the colossus back. The balance is broken, and a single power now bestrides the continent. Our envoys are received with cold courtesy in a Europe that has learned to bow."
 cc_balance_of_power.71.a: "We shall not forget this humiliation."

 cc_balance_of_power.72.title: "The Deluge from the East"
 cc_balance_of_power.72.desc: "The old western order, for all its careful balances, could not comprehend the storm gathering in the east. Now our armies pour across its frontiers, and the chancelleries that thought themselves the arbiters of the world scramble to survive."
 cc_balance_of_power.72.a: "The future belongs to us."

 cc_balance_of_power.73.title: "The Old Order Falls"
 cc_balance_of_power.73.desc: "The careful equilibrium of kings counted for nothing once the people rose. Thrones totter, borders dissolve, and the diplomacy of cabinets gives way to the fury of revolution. The world of the balance of power is gone, and a new and terrible age begins."
 cc_balance_of_power.73.a: "Nothing will be as it was."

 cc_balance_of_power.74.title: "The Concert of Europe"
 cc_balance_of_power.74.desc: "Against the odds, the equilibrium has held. Through congress and compromise, subsidy and restraint, the powers have learned to manage their rivalries rather than be ruled by them. What began as a wary balance has matured into a lasting concert — an order that may keep the peace for generations."
 cc_balance_of_power.74.a: "Let the concert endure."

 cc_balance_of_power.70.b: "Set a crown upon a humbled rival."

 cc_balance_of_power.41.title: "The Battle of the Nations"
 cc_balance_of_power.41.desc: "The hosts of the coalition have converged upon the field. Never have so many standards flown together against the colossus. Our generals tell us the hour has come: throw in every battalion and the bid for hegemony may break here, in blood and smoke — or husband our strength and let the enemy wither in a longer war."
 cc_balance_of_power.41.a: "Stake everything on a general engagement."
 cc_balance_of_power.41.b: "Harry and delay — conserve our strength."

 cc_balance_of_power.42.title: "Scorched Earth"
 cc_balance_of_power.42.desc: "The hegemon's armies march upon our heartland, vast and confident. We cannot match them in open battle — but the land itself can be made a weapon. Burn the granaries, poison the wells, and fall back before them into the cold and the distance, until their great host starves amid the ashes."
 cc_balance_of_power.42.a: "Burn the land before them and retreat."
 cc_balance_of_power.42.b: "Stand and defend our homes."

 cc_balance_of_power.43.title: "The Bleeding Ulcer"
 cc_balance_of_power.43.desc: "A whole people has risen against our occupation — not in pitched battle, but in ambush and assassination, a thousand small wounds that never close. Our armies hold the cities and command the roads by day, yet bleed in the hills by night. This running sore drains us while the rest of the continent watches and takes heart."
 cc_balance_of_power.43.a: "Pour in troops to crush the revolt."
 cc_balance_of_power.43.b: "Garrison the towns and endure the bleeding."

 cc_balance_of_power.44.title: "The Continental System"
 cc_balance_of_power.44.desc: "We cannot reach our chief rivals by force of arms alone — but we can close the markets of the continent against their merchants. Let no port under our sway admit their goods; let their commerce wither and their counting-houses fail. A blockade of the whole continent is a weapon never before wielded on such a scale — and it will bind our own trade as surely as theirs."
 cc_balance_of_power.44.a: "Proclaim the blockade — strangle their commerce."
 cc_balance_of_power.44.b: "Keep the sea-lanes open — we profit more by trade."

 cc_balance_of_power.45.title: "Levée en Masse"
 cc_balance_of_power.45.desc: "The struggle has outgrown the cabinet armies of old. Our ministers propose a measure without precedent: to summon the whole nation to arms — every able man a soldier, every workshop a manufactory of war. It would conjure armies beyond counting, but it would also place muskets in the hands of the people and loosen the bonds of the old order forever."
 cc_balance_of_power.45.a: "Call the whole nation to arms."
 cc_balance_of_power.45.b: "Trust the professional army."

 cc_balance_of_power.46.title: "A Separate Peace"
 cc_balance_of_power.46.desc: "The hegemon's envoys come to us in secret, with soft words and generous terms. Why bleed for a coalition that may yet fail, they ask, when an accommodation could spare our people and even enrich our house? Our partners would name it betrayal — but the burdens of the struggle weigh heavy, and the colossus seems unstoppable."
 cc_balance_of_power.46.a: "Come to terms with the hegemon."
 cc_balance_of_power.46.b: "Hold firm — our place is with the coalition."

 cc_balance_of_power.47.title: "A Marriage of State"
 cc_balance_of_power.47.desc: "Our pre-eminence is now such that lesser courts seek our favour, and the surest bond between thrones has ever been the marriage bed. A dynastic union would tie a wavering power to our house — or, pressed further, we might set one of our own kin upon its throne and rule it as a satellite kingdom in all but name."
 cc_balance_of_power.47.a: "Bind them to our house."
 cc_balance_of_power.47.b: "Install them as a satellite kingdom."
 cc_balance_of_power.47.c: "A courtesy only — portraits and pleasantries."

 cc_balance_of_power.75.title: "The Concert Falters"
 cc_balance_of_power.75.desc: "For a generation the concert held, and the chancelleries congratulated themselves on having tamed the ambitions of princes. But no order endures forever. A power has broken faith and reached again for pre-eminence; the old congresses fall silent, the guarantees ring hollow, and the wary calculus of the balance begins anew."
 cc_balance_of_power.75.a: "The peace could not last forever."

 # ============================================================
 # ACTION EVENTS (80-92)
 # ============================================================
 cc_balance_of_power.80.title: "A Petition to Join"
 cc_balance_of_power.80.desc: "An envoy of [cc_bop_petitioner.GetName] waits upon us with a proposal: their court would throw in its lot with our bloc and march beneath our standard. Another sword is always welcome — yet every client we gather binds us tighter to their quarrels as much as ours to theirs."
 cc_balance_of_power.80.a: "Admit them to our bloc."
 cc_balance_of_power.80.b: "We have no need of them."

 cc_balance_of_power.81.title: "A Petition to Join"
 cc_balance_of_power.81.desc: "An envoy of [cc_bop_petitioner.GetName] seeks an audience: fearful of the aspiring hegemon, their court would join the coalition and add its weight to the cause of the balance. Numbers are the coalition's strength — though each new partner is one more voice to satisfy at the council table."
 cc_balance_of_power.81.a: "Welcome them to the coalition."
 cc_balance_of_power.81.b: "We have no need of them."

 cc_balance_of_power.91.title: "Our Petition is Answered"
 cc_balance_of_power.91.desc: "Word comes from the bloc's leader: our petition is accepted, and our court is admitted to their company. We are no longer alone in the great game."
 cc_balance_of_power.91.a: "So be it — we are committed now."

 cc_balance_of_power.92.title: "Our Petition is Refused"
 cc_balance_of_power.92.desc: "The bloc's leader has rebuffed our overture with cold courtesy. We are left to make our own way in the contest — and to remember the slight."
 cc_balance_of_power.92.a: "We shall remember this."

 cc_balance_of_power.93.title: "The Congress is Convened"
 cc_balance_of_power.93.desc: "On our summons the powers of the coalition gather in standing congress. What was a loose alliance of convenience now has a hall in which to deliberate, a table at which to vote, and the means to bind itself to common purpose. The work of balancing the colossus may now be done in concert."
 cc_balance_of_power.93.a: "Let the congress sit."

 cc_balance_of_power.94.title: "Return to the European Family"
 cc_balance_of_power.94.desc: "A generation has passed since our defeat. The wounds of the great reckoning have healed enough that the powers, mindful that no settlement endures while a great nation is held in exile, extend their hand. We are invited to take our seat in the Concert of Europe — no longer the outcast, but once more a partner in the management of the continent's peace."
 cc_balance_of_power.94.a: "We resume our rightful place."

 cc_balance_of_power.82.title: "Armed Neutrality"
 cc_balance_of_power.82.desc: "Rather than be dragged into the quarrels of greater powers, our court declares for armed neutrality: friendly to all, beholden to none, our ports and frontiers open to honest trade and closed to the recruiting sergeants of either bloc. Foreign gold flows freely to keep us so."
 cc_balance_of_power.82.a: "Our hands remain free."

 cc_balance_of_power.83.title: "Playing Both Sides"
 cc_balance_of_power.83.desc: "Our diplomats are masters of the discreet word and the timely hint. By leaning, ever so slightly, toward whichever camp is the weaker, we keep the contest finely balanced — and ensure that both sides pay handsomely for our continued goodwill."
 cc_balance_of_power.83.a: "Let them both court us."

 cc_balance_of_power.84.title: "Leaning on the Unaligned"
 cc_balance_of_power.84.desc: "With the confidence of our growing ascendancy, our envoys press the wavering courts of the continent. A word about the fate of those who stand against us, a reminder of the armies at our command — and the balance shifts our way without a shot fired."
 cc_balance_of_power.84.a: "They will learn to fear us."

 cc_balance_of_power.85.title: "The Continental System"
 cc_balance_of_power.85.desc: "We proclaim the markets of the continent closed to our rivals' commerce. Let no port under our sway admit their goods; let their counting-houses fail and their merchants clamour. The coalition's trade withers under the weight of our ambition."
 cc_balance_of_power.85.a: "Strangle their commerce."

 cc_balance_of_power.86.title: "Consolidating Hegemony"
 cc_balance_of_power.86.desc: "The moment has come to gather the fruits of our ambition. Subsidies are paid, garrisons posted, dynastic bargains struck — and a hundred small courts fall into line behind us. The balance lurches toward our mastery, and the bloc stands taller for it."
 cc_balance_of_power.86.a: "The continent bends to our will."

 cc_balance_of_power.87.title: "Subsidising the Allies"
 cc_balance_of_power.87.desc: "The coalition's lesser members cannot match the hegemon's purse alone — so we open ours. Gold flows to harden their levies and steady their resolve, that no partner need treat with the enemy for want of coin."
 cc_balance_of_power.87.a: "Let no ally stand in want."

 cc_balance_of_power.88.title: "Supreme Command Assumed"
 cc_balance_of_power.88.desc: "We take the field in person, our own banners at the head of the allied host. The lesser powers fall in behind a single will, and our prestige lends the coalition a spine it lacked. With one hand directing the war, the balance is dragged back toward equilibrium."
 cc_balance_of_power.88.a: "The command is ours."

 cc_balance_of_power.89.title: "A Diplomatic Revolution"
 cc_balance_of_power.89.desc: "In a stroke our cabinet overturns the diplomacy of a generation — a renversement des alliances that leaves the aspirant suddenly bereft of friends and the coalition swollen with new strength. The balance swings decisively back toward the many."
 cc_balance_of_power.89.a: "The game is remade."

 cc_balance_of_power.90.title: "The Naval Blockade"
 cc_balance_of_power.90.desc: "If the hegemon would close the land to our commerce, we shall close the sea to theirs. Our fleets sweep the approaches and bar the great ports; the preponderant bloc's merchantmen rot at anchor while its rivals' trade slips through. Economic warfare cuts both ways — but so be it."
 cc_balance_of_power.90.a: "Blockade their coasts."

 # --- Betrayal & the reversal of alliances ---
 cc_balance_of_power.100.title: "A Reversal of Alliances"
 cc_balance_of_power.100.desc: "Our position in this bloc has grown intolerable — its fortunes wane, its leader presumes upon us, and across the lines the other camp lets it be known that our friendship would be richly rewarded. To cross over now would be the blackest treachery in the eyes of our present allies — and the surest stroke of statecraft in the eyes of posterity. The whole balance of the continent may turn upon our answer."
 cc_balance_of_power.100.a: "Reverse our alliances — cross to the other camp."
 cc_balance_of_power.100.b: "We keep faith. Our place is with our allies."

 cc_balance_of_power.101.title: "A Betrayal Most Foul"
 cc_balance_of_power.101.desc: "Word arrives that [bop_defector.GetName] has abandoned our cause and gone over to the enemy — alliances reversed overnight, our councils betrayed, the balance tipped against us by a single act of perfidy. Our remaining partners watch to see how we bear the blow."
 cc_balance_of_power.101.a: "Such treachery will not be forgotten."

 cc_balance_of_power.103.title: "Complete the Betrayal"
 cc_balance_of_power.103.desc: "The peace is signed, our regiments are drawn back and re-formed, and our new patron now looks to us to make good on our defection. Our former allies — [bop_old_target.GetName] foremost among them — stand exposed before us. We may fall upon them as our new friends expect, or play a deeper game still and answer to no one but ourselves."
 cc_balance_of_power.103.a: "Take up arms against our former allies."
 cc_balance_of_power.103.b: "A double game — we keep our own counsel."

 cc_balance_of_power.102.title: "A Purchased Treason"
 cc_balance_of_power.102.desc: "Our coffers are full and our spymasters busy. A discontented member of the enemy camp — [bop_treason_target.GetName] — has let it be understood that the right inducement might detach them from their allies altogether. Gold and intrigue could turn a rival's strength into our own, though such dealings leave a stain that princes long remember."
 cc_balance_of_power.102.a: "Buy their treason."
 cc_balance_of_power.102.b: "Such intrigues are beneath us."

 # --- Coalition victory: the chief balancer's reward ---
 cc_balance_of_power.76.title: "The Architect of the Balance"
 cc_balance_of_power.76.desc: "The aspiring hegemon has been denied, and the equilibrium we laboured to preserve now stands institutionalised as a lasting concert. Of all the powers that banded together against the colossus, it was our hand that guided the coalition, our gold and our diplomacy that held it together. Europe looks to us now as never before — and the question is what we shall make of that pre-eminence. Shall we crown our work as the trusted guarantor of the peace, or turn the mastery we won over the coalition into ambitions of our own?"
 cc_balance_of_power.76.a: "We are the guarantor of Europe's peace."
 cc_balance_of_power.76.b: "Now let the continent follow our lead."

 # --- The coalition takes up arms ---
 cc_balance_of_power.110.title: "The Hour of Decision"
 cc_balance_of_power.110.desc: "The reports can no longer be wished away: the aspiring hegemon stands at the very threshold of mastery, and every month of delay sees another court fall into its orbit. Our congresses and subsidies have not sufficed. If the balance is to be saved at all, it must be saved now — by the sword. Our generals counsel that the coalition, marching as one, may yet break the colossus before it grows beyond all checking. But to strike first is to stake everything on the field."
 cc_balance_of_power.110.a: "Strike now, before the balance breaks for good."
 cc_balance_of_power.110.b: "Not yet — we dare not face the colossus unprepared."

 cc_balance_of_power.111.title: "Honour the Union"
 cc_balance_of_power.111.desc: "The hegemon's armies have fallen upon [bop_victim.GetName], our partner in the coalition, and even now they cry out for the aid we pledged when the union was formed. To march to their defence is to bring the full weight of the colossus down upon ourselves — yet to abandon them is to see the coalition unravel thread by thread, each partner left to be devoured alone. The credibility of the whole alliance rests upon our answer."
 cc_balance_of_power.111.a: "Honour the union — march to their defence."
 cc_balance_of_power.111.b: "We dare not provoke the colossus — they must shift for themselves."

 # ============================================================
 # GENERIC ACTIONS — names & descriptions
 # ============================================================
 cc_bop_petition_preponderance: "Petition the Preponderant Bloc"
 cc_bop_petition_preponderance_desc: "Ask the aspiring hegemon to admit our court to the Preponderant Bloc. The leader will decide whether to accept us. Available to engaged, unaligned powers. Cannot be repeated for 4 years."
 cc_bop_petition_coalition: "Petition the Balancing Coalition"
 cc_bop_petition_coalition_desc: "Ask the chief balancer to admit our court to the Balancing Coalition. The leader will decide whether to accept us. Available to engaged, unaligned powers. Cannot be repeated for 4 years."
 cc_bop_proclaim_neutrality: "Proclaim Armed Neutrality"
 cc_bop_proclaim_neutrality_desc: "Declare our court neutral in the great game, drawing foreign gold to keep us so. Requires a cabinet minister assigned to the $cc_duty_free_hands$ duty. Cannot be repeated for 6 years."
 cc_bop_play_both_sides: "Play Both Sides"
 cc_bop_play_both_sides_desc: "Lean discreetly toward the weaker bloc to keep the contest balanced — and make both camps pay for our goodwill. Requires a cabinet minister on a diplomatic posting ($cc_duty_diplomatic_mission$ or the diplomatic corps). Cannot be repeated for 5 years."
 cc_bop_io_intimidate: "Intimidate the Unaligned"
 cc_bop_io_intimidate_desc: "Spend the bloc's Ambition to lean on the wavering courts of the continent and press the balance upward. Requires 25 Ambition (spends 20). Cannot be repeated for 4 years."
 cc_bop_io_continental_system: "Proclaim the Continental System"
 cc_bop_io_continental_system_desc: "Spend the bloc's Ambition to close the continent's markets to the coalition, blockading their commerce. Requires 40 Ambition (spends 30) and a Preponderance Share of at least 55%. Cannot be repeated for 5 years."
 cc_bop_io_consolidate_hegemony: "Consolidate Hegemony"
 cc_bop_io_consolidate_hegemony_desc: "A capstone push: spend a great store of Ambition to swing the balance hard toward mastery and embolden the whole bloc. Requires 70 Ambition (spends 50). Cannot be repeated for 6 years."
 cc_bop_io_subsidize_allies: "Subsidise the Allies"
 cc_bop_io_subsidize_allies_desc: "Spend the coalition's Resolve to harden its lesser members against the hegemon. Requires 25 Resolve (spends 20). Cannot be repeated for 4 years."
 cc_bop_io_naval_blockade: "Order a Naval Blockade"
 cc_bop_io_naval_blockade_desc: "The coalition's answer to the Continental System: spend Resolve to blockade the preponderant bloc's coasts and choke their trade. A reactive measure — requires 35 Resolve (spends 25) and a Preponderance Share of at least 55%. Cannot be repeated for 5 years."
 cc_bop_io_convene_the_congress: "Convene the Congress"
 cc_bop_io_convene_the_congress_desc: "Call the dormant congress into session, opening the standing Balancing Congress so the bloc may vote on laws and table parliament motions. A structural act — requires at least 3 members and 20 Resolve (rallies the cause for +5)."
 cc_bop_io_assume_supreme_command: "Assume Supreme Command"
 cc_bop_io_assume_supreme_command_desc: "Take the field in person: lend the balancer's own prestige to the allied effort and drag the balance back toward equilibrium. A unilateral stroke — requires 40 Resolve (spends 30) and a Preponderance Share of at least 55%. Cannot be repeated for 4 years."
 cc_bop_io_diplomatic_revolution: "Engineer a Diplomatic Revolution"
 cc_bop_io_diplomatic_revolution_desc: "A renversement des alliances: the balancer's own cabinet engineers a dramatic realignment, swinging the balance decisively back toward the many. A unilateral capstone — requires 70 Resolve (spends 50). Cannot be repeated for 6 years."
 cc_bop_io_leave_bloc: "Leave the Bloc"
 cc_bop_io_leave_bloc_desc: "Withdraw our court from its bloc. We will be branded a defector and our former bloc's standing will suffer. Available to non-leader members. Cannot be repeated for 3 years."

 # ai_will_do factor descriptions
 CC_BOP_FRIENDLY_LEADER: "The leading power looks on us kindly"
 CC_BOP_BANDWAGON: "The strong grow stronger — best to join them"
 CC_BOP_BEHIND: "We are falling behind and must press our advantage"
 CC_BOP_GREAT_POWER: "A great power has a place at the table"
 CC_BOP_NEAR_HEGEMON: "The aspiring hegemon looms on our doorstep"

 # ============================================================
 # PANEL — IO shortcut
 # ============================================================
 CC_BOP_OPEN_IO_TT: "Open this bloc's organisation view, where its leader's actions and treasury are found."

 # ============================================================
 # GAME RULE
 # ============================================================
 cc_balance_of_power_rule: "The Balance of Power"
 cc_balance_of_power_rule_desc: "Controls whether the European Balance of Power situation can fire."
 cc_balance_of_power_on: "Enabled"
 cc_balance_of_power_on_desc: "The Balance of Power situation will arise once a great power adopts the balance-of-power doctrine, or once the revolutionary era opens."
 cc_balance_of_power_off: "Disabled"
 cc_balance_of_power_off_desc: "The Balance of Power situation will never fire."

 # ============================================================
 # ADVANCE / REFORMS / PRIVILEGE
 # ============================================================
 cc_balance_of_power_advance: "Balance of Power Doctrine"
 cc_balance_of_power_advance_desc: "The art of statecraft matures into a science of equilibrium: alliances assembled and dissolved, subsidies and guarantees, all turned to the single end of preventing any rival from dominating the continent. The first great power to embrace this doctrine ushers in the age of the European balance of power. Unlocks the $cc_balancer_doctrine_reform$ and $cc_raison_detat_reform$ reforms and the $ep_noble_diplomatic_corps$ privilege."
 cc_balancer_doctrine_reform: "Balancer's Doctrine"
 cc_balancer_doctrine_reform_desc: "Our diplomacy is organised around the maintenance of equilibrium, winning us reputation and the diplomatic reach to assemble coalitions while blunting the antagonism our maneuvering provokes."
 cc_raison_detat_reform: "Raison d'État"
 cc_raison_detat_reform_desc: "Policy is governed by the cold calculus of state interest rather than dynastic sentiment or confessional loyalty, lending our statecraft flexibility, prestige, and resilience in protracted struggles."
 ep_noble_diplomatic_corps: "Noble Diplomatic Corps"
 ep_noble_diplomatic_corps_desc: "The high nobility staff and finance a professional diplomatic service, manning the embassies of Europe and extending the crown's diplomatic reach and reputation."

 # ============================================================
 # NEW END REASONS
 # ============================================================
 cc_bop_end_coalition: "The balance held — the coalition cut the aspiring hegemon down to size."
 cc_bop_end_stagnation: "The aspirant's moment passed — overtaken and eclipsed, its bid faded into irrelevance."

 # ============================================================
 # THE RECKONING — ticker panel
 # ============================================================
 CC_BOP_RECKONING_HEADER: "The Reckoning"
 CC_BOP_HEGEMONY_TICKER_LABEL: "Road to Hegemony"
 CC_BOP_HEGEMONY_TICKER_TT: "Each month the aspiring hegemon holds a preponderance share of 65 or more, this counter rises; when the bloc slips below it falls again. At 60 months the balance is primed to break — but only a final war can settle it. The coalition is forced to make one last stand; should they prevail, the hegemon's victory is denied."
 CC_BOP_FINAL_WAR_LABEL: "#R Final Reckoning — the coalition makes its last stand.#!"
 CC_BOP_FINAL_WAR_TT: "The counter is full. The situation will not end until one last war between the coalition and the aspiring hegemon is decided. If the hegemon still dominates when the guns fall silent, the balance breaks for good; if the coalition blunts it, the bid is denied and the contest goes on."
 CC_BOP_COALITION_TICKER_LABEL: "Road to Containment"
 CC_BOP_COALITION_TICKER_TT: "Each month the balancing coalition holds the aspirant's preponderance share to 35 or below, this counter rises. At 60 months the coalition is primed to deliver the cut-down-to-size blow — provided its congress has voted itself the coup-de-grâce."
 CC_BOP_COALITION_WAR_LABEL: "#R The coup-de-grâce — the coalition moves to cut the aspirant down.#!"
 CC_BOP_STAGNATION_TICKER_LABEL: "Eclipse of the Aspirant"
 CC_BOP_STAGNATION_TICKER_TT: "While the aspiring hegemon stalls in the middle ground and is outgrown by a rival risen in its shadow, this counter rises. At 60 months the balance simply dissolves — no decisive winner, the aspirant's moment lost."

 # ============================================================
 # RECKONING / DESPERATION / WAR-TOOL EVENTS
 # ============================================================
 cc_balance_of_power.77.title: "The Aspirant Humbled"
 cc_balance_of_power.77.desc: "It is done. The coalition's long labour — the subsidies, the congresses, the blood spent in a dozen campaigns — has borne fruit at last. The power that reached for mastery of the continent has been broken upon the union of its rivals and cut back to the rank of an ordinary great power. The equilibrium endures, vindicated, and our name with it."
 cc_balance_of_power.77.a: "Europe breathes again."
 cc_balance_of_power.78.title: "A Moment Lost"
 cc_balance_of_power.78.desc: "The moment has passed. We reached for the mastery of Europe and grasped only air; while we hesitated and stalled, others grew, and now a power risen in our very shadow overshadows us. The coalition need strike no blow — our bid has simply faded, and the balance dissolves without us at its centre."
 cc_balance_of_power.78.a: "What might have been."

 cc_balance_of_power.79.title: "Under the New Master"
 cc_balance_of_power.79.desc: "We backed [bop_new_master.GetName] and [bop_new_master.GetName] has won. The rewards are real and immediate: no neighbour now dares press a claim against a friend of the hegemon, and a court that need not buy its safety can afford to spend on other things. The rewards are also, we are quietly aware, entirely conditional."
 cc_balance_of_power.79.a: "A comfortable place in the new order."
 cc_balance_of_power.112.title: "The Final Reckoning"
 cc_balance_of_power.112.desc_hegemony: "The scales have tipped as far as they can bear. The aspiring hegemon stands on the threshold of mastery, and the courts of Europe know that the question can no longer be deferred. The coalition must make its stand now, in one last war — for if the colossus prevails, there will be no second chance to check it."
 cc_balance_of_power.112.desc_coalition: "The balancing coalition has grown ascendant, and the moment has come to settle the matter for good. With the congress's mandate in hand, the powers move to cut the would-be hegemon down to size in a final, decisive war."
 cc_balance_of_power.112.a: "So it comes to this."
 cc_balance_of_power.120.title: "Coffers Too Bare"
 cc_balance_of_power.120.desc: "Our envoys carried the summons to our ally's court — and returned with it unanswered. The price of dragging so great a power into our war is beyond what our treasury or the bloc's patience can presently bear. We must lay our coin aside and look to smaller swords, or wait."
 cc_balance_of_power.120.a: "Then we cannot afford them."
 cc_balance_of_power.121.title: "A War Chest Laid"
 cc_balance_of_power.121.desc: "Gold has been scattered quietly among the reluctant courts of our bloc — pensions promised, debts forgiven, palms greased. When next we call them to arms, the summons will fall on far more willing ears, and at a fraction of the usual cost."
 cc_balance_of_power.121.a: "Let the subsidies do their work."
 cc_balance_of_power.122.title: "The Grand War"
 cc_balance_of_power.122.desc: "We will not wait upon our rivals' convenience. The whole weight of the bloc is gathered, the casus belli proclaimed, and the armies set in motion against the balancing coalition. Let the matter be decided on our terms, in a war of our choosing."
 cc_balance_of_power.122.a: "Forward — for mastery."
 cc_balance_of_power.130.title: "Desperate Measures"
 cc_balance_of_power.130.desc: "The aspirant's shadow lengthens across the continent, and the ordinary instruments of statecraft no longer suffice. The congress, now armed with standing powers, presses extreme expedients upon us. The balance must be redressed — whatever the cost."
 cc_balance_of_power.130.a: "Buy a foreign sword into the war."
 cc_balance_of_power.130.b: "Call a general mobilisation across the bloc."
 cc_balance_of_power.130.c: "Stay our hand — the cost is too dear."
 cc_balance_of_power.131.title: "The Last Ditch"
 cc_balance_of_power.131.desc: "The colossus is upon us. There will be no clever diplomacy now, no congress to deliberate — only the question of how we make our stand. Our people look to us, and we must answer with iron."
 cc_balance_of_power.131.a: "Burn the bridges — scorched earth before them."
 cc_balance_of_power.131.b: "Raise a grand levy — every hand to arms."

 # ============================================================
 # NEW PREPONDERANT WAR-TOOL ACTIONS
 # ============================================================
 cc_bop_io_call_to_arms: "Call to Arms"
 cc_bop_io_call_to_arms_desc: "Drag a member of our bloc into our war against the coalition. The cost in gold scales with the ally's tax base — and doubles with each ally already called in this war — so in practice only one or two can ever be afforded. Requires 20 Ambition. A standing war chest halves the bill."
 cc_bop_io_war_chest: "Lay a War Chest"
 cc_bop_io_war_chest_desc: "Scatter subsidies among the reluctant courts of our bloc in advance, halving the cost of our next Call to Arms. Requires 30 Ambition (spends 30) and a sum of gold. Cannot be repeated for 3 years."
 cc_bop_io_grand_war: "Grand War on the Coalition"
 cc_bop_io_grand_war_desc: "A capstone: strike first. Declare our own war on the chief balancer and bring the whole preponderant bloc to bear, swinging the balance hard in our favour. Requires 70 Ambition (spends 60). Cannot be repeated for 6 years."

