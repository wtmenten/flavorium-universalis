l_english:
 # === cc_bonds.50 — The Royal Visit ===
 cc_bonds.50.title: 0 "The Royal Visit"
 cc_bonds.50.desc: 0 "We have received notice that [bond_subj.GetName] has prepared for an official reception — their people are expecting some gesture from the Crown. The dependency's ruling house has hinted, through diplomatic channels, that a personal visit would be remembered for generations. A royal envoy would be appropriate. A formal letter would technically fulfill the obligation. The difference is considerable."
 cc_bonds.50.a: 0 "Make the journey personally. This matters."
 cc_bonds.50.b: 0 "Send a royal envoy with proper ceremony."
 cc_bonds.50.c: 0 "A formal letter will serve the purpose."

 # === cc_bonds.51 — Dependency Trade Preferences ===
 cc_bonds.51.title: 0 "Dependency Trade Preferences"
 cc_bonds.51.desc: 0 "Our trade advisors have brought to our attention that the current commercial arrangements with [bond_subj.GetName] are not formally defined — they have developed organically and work reasonably well, but they leave significant revenue decisions unmade. Three options have been drafted. The most profitable for the Crown is also the most burdensome for the dependency."
 cc_bonds.51.a: 0 "Establish favorable trade terms for the dependency."
 cc_bonds.51.b: 0 "Formalize equal terms. Mutual benefit, equal standing."
 cc_bonds.51.c: 0 "Establish terms that maximize Crown revenue."

 # === cc_bonds.52 — Royal Family Ceremony ===
 cc_bonds.52.title: 0 "Royal Family Ceremony"
 cc_bonds.52.desc: 0 "A significant royal occasion is being planned — a coronation anniversary, a christening, a marriage, or a state feast. The ruling family of [bond_subj.GetName] has extended a quiet inquiry about their expected role. They have attended every such occasion in memory. Whether they appear prominently, marginally, or not at all sends a clear signal about how we view the relationship."
 cc_bonds.52.a: 0 "Include their delegation prominently. They are family in all but name."
 cc_bonds.52.b: 0 "Extend a token invitation. They are welcome, in their place."
 cc_bonds.52.c: 0 "The occasion is an internal Crown matter. No invitation extended."

 # === cc_bonds.53 — Dependency Faces External Threat ===
 cc_bonds.53.title: 0 "Dependency Faces External Threat"
 cc_bonds.53.desc: 0 "A dispatch from [bond_subj.GetName] brings alarming news. A neighboring power — one with long-standing territorial ambitions in the region — has been moving forces toward the dependency's borders. The dependency's own forces are limited. Their letter is careful not to plead, but the message is clear: they are looking to us, and they are watching how we respond."
 cc_bonds.53.a: 0 "Send our forces immediately. They are under our protection."
 cc_bonds.53.b: 0 "Fund and reinforce their defenses without direct intervention."
 cc_bonds.53.c: 0 "They must handle this themselves. We have our own concerns."

 # === cc_bonds.54 — The Dependency's Cultural Festival ===
 cc_bonds.54.title: 0 "The Dependency's Cultural Festival"
 cc_bonds.54.desc: 0 "A major cultural festival is approaching in [bond_subj.GetName] — a celebration that, in their tradition, marks the continuity of their people's identity and history. The ruling house has extended an invitation. The festival is an opportunity: to be seen as sharing in their heritage, to be seen as respectful of it from a distance, or to be seen as too busy to attend."
 cc_bonds.54.a: 0 "Sponsor the festival generously. We celebrate alongside them."
 cc_bonds.54.b: 0 "Attend in person without taking over the occasion."
 cc_bonds.54.c: 0 "Send a letter of congratulation and regrets."
 cc_bonds.54.d: 0 "We have nothing to contribute to their local affairs."

 # === cc_bonds.55 — The Dependency Wants Voice in Succession ===
 cc_bonds.55.title: 0 "The Dependency Wants Voice in Succession"
 cc_bonds.55.desc: 0 "The ruling house of [bond_subj.GetName] has submitted a formal petition. They wish to be consulted in any succession arrangements that would materially affect them — not to choose, they emphasize, but to be heard. Their argument is one of continuity and mutual interest. Our advisors are divided. Some see this as an entirely reasonable request from a loyal partner. Others see a precedent that, once established, cannot easily be rescinded."
 cc_bonds.55.a: 0 "Grant consultation rights. Their voice matters in matters affecting them."
 cc_bonds.55.b: 0 "Offer an advisory role. They may be heard, though the decision rests with us."
 cc_bonds.55.c: 0 "Decline. Succession is a Crown prerogative, not a matter for consultation."
