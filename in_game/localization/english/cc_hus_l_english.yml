l_english:
 ########################################
 # cc_hus.1 — The Pope Calls for Aid
 ########################################
 cc.hus.1.title: "With Just One Small Loan from Our Father..."
 cc.hus.1.desc: "War has erupted between Rome and Bohemia. [current_pope.GetName] has raised his banner against the Hussite heresy, calling upon all faithful Catholic princes to answer. The outcome of this struggle will shape the soul of Christendom — and our response will be remembered in Rome and Prague alike."
 cc.hus.1.a: "We stand with the Holy Father. Our arms are His."
 cc.hus.1.b: "Accept the papal coin and withdraw from this war."
 cc.hus.1.c: "We will not be bought. Our cause stands."
 cc.hus.1.d: "Take up the crusade. Join the Pope's war against heresy."
 cc.hus.1.e: "This is not our war. Let Rome fight its own battles."
