l_english:

 # ---------------------------------------------------------------------------
 # Drift Events
 # ---------------------------------------------------------------------------

 cc_personality.1.title: "The Winds of War"
 cc_personality.1.desc: "With our armies in the field and the smell of smoke on the wind, the council argues over how to press our advantage — whether to strike harder or conserve what we have."

 cc_personality.1.a: "Press the attack — show no mercy."
 cc_personality.1.b: "Hold our ground — do not overextend."

 cc_personality.2.title: "Imperial Ambitions"
 cc_personality.2.desc: "At peace and at the height of our strength, the great ministers of state debate the road ahead. Do we reach out to seize what we can, or watch and wait for the right moment?"

 cc_personality.2.a: "Extend our borders and our influence."
 cc_personality.2.b: "Patience — exploit others' weaknesses when they arise."

 cc_personality.3.title: "A Time for Caution"
 cc_personality.3.desc: "Our prestige is diminished and our rivals watch us carefully. The council urges the crown to tread carefully — but how carefully?"

 cc_personality.3.a: "Fortify our position against all threats."
 cc_personality.3.b: "Careful diplomacy above all — avoid provocation."

 cc_personality.4.title: "Trade and Diplomacy"
 cc_personality.4.desc: "Our treasury is full and our merchants flourish. The question before the council is whether to use this wealth to forge friendships or to quietly take advantage of those around us."

 cc_personality.4.a: "Build alliances and goodwill — gold buys friends."
 cc_personality.4.b: "Let others see our wealth as opportunity — watch for openings."

 cc_personality.5.title: "A Question of Strategy"
 cc_personality.5.desc: "The court deliberates on the realm's strategic direction. Old certainties have faded; a new approach must be chosen."

 cc_personality.5.aggressive: "We must dominate — strike before others strike us."
 cc_personality.5.expansionist: "Expand our reach — borders are only as permanent as our will."
 cc_personality.5.defensive: "Hold what we have — strength lies in endurance."
 cc_personality.5.cautious: "Careful diplomacy and measured risk — never overreach."
 cc_personality.5.opportunistic: "Watch the board, move when others stumble."
 cc_personality.5.isolationist: "Turn inward — our strength lies in our own lands."
 cc_personality.5.friendly: "Alliances and goodwill — a well-liked state is a safe one."

 # ---------------------------------------------------------------------------
 # Ottoman Inflection Events
 # ---------------------------------------------------------------------------

 cc_personality.10.title: "The Conquering Sultan"
 cc_personality.10.desc: "The empire stands at the height of its power. Our great sultan has broken Mamluk Egypt, humbled the Persians, and planted the crescent over the Balkans. The world trembles before us. Now — how do we press our advantage?"

 cc_personality.10.a: "There is no peace — only conquest. Forward, always forward."
 cc_personality.10.b: "Our borders are vast. We must expand with discipline, not fury."

 cc_personality.11.title: "The Long Stagnation"
 cc_personality.11.desc: "The days of lightning conquest are behind us. Our frontiers are defended by great fortresses but seldom pushed further. The Janissaries quarrel, the viziers scheme, and the treasury strains. We must choose our posture in a more difficult world."

 cc_personality.11.a: "Defend what we hold — the empire is too great to risk in reckless war."
 cc_personality.11.b: "Caution above all — maintain through diplomacy what we cannot win by force."

 # ---------------------------------------------------------------------------
 # France / England Inflection Events
 # ---------------------------------------------------------------------------

 cc_personality.20.title: "The Sun King Rises"
 cc_personality.20.desc: "The reign of a new era opens. The king commands that France shall dominate Europe — through diplomacy where possible, through war where necessary. The court at Versailles radiates absolute confidence. France is destined for hegemony. The question is only the method."

 cc_personality.20.a: "War is the instrument of kings. We shall impose our will."
 cc_personality.20.b: "Hegemony through finesse — let others fear us without provoking a coalition."

 cc_personality.21.title: "Britannia's Maritime Empire"
 cc_personality.21.desc: "The age of the trading post gives way to the age of empire. Our navy commands the seas and our colonies stretch across continents. The question is whether Britain shall simply trade — or rule."

 cc_personality.21.a: "Rule, not merely trade. We shall project power wherever our flag flies."
 cc_personality.21.b: "A maritime empire profits most from flexibility — exploit, don't overcommit."

 # ---------------------------------------------------------------------------
 # Muscovy Inflection Event
 # ---------------------------------------------------------------------------

 cc_personality.30.title: "The Terrible Tsar"
 cc_personality.30.desc: "The new tsar rules through fear as much as through law. His oprichnina purges rivals, his armies strike east and west without mercy. Russia shall be great — by blood if necessary. The boyars tremble. The question is how far this fury will carry us."

 cc_personality.30.a: "No mercy. Russia advances through absolute force of will."
 cc_personality.30.b: "Expand deliberately — we need not destroy what we can simply take."

 # ---------------------------------------------------------------------------
 # Castile Inflection Event
 # ---------------------------------------------------------------------------

 cc_personality.40.title: "The New World Empire"
 cc_personality.40.desc: "Gold pours in from the Americas. Our conquistadors have claimed half a world in the name of the crown and the faith. We stand at the center of a global empire unlike anything history has seen. The question is how we shall use this power."

 cc_personality.40.a: "Crusade and conquest — the world shall bow to the faith and the crown."
 cc_personality.40.b: "Build an enduring empire — expand with order, not just fire."

 # ---------------------------------------------------------------------------
 # Sweden Inflection Event
 # ---------------------------------------------------------------------------

 # ---------------------------------------------------------------------------
 # Four-Yearly Deep Analysis Events (60-65)
 # ---------------------------------------------------------------------------

 cc_personality.60.title: "The Exhausted Kingdom"
 cc_personality.60.desc: "Our armies have marched for years and the people are weary. War exhaustion gnaws at every corner of the realm — the levies are depleted, the treasury strained, and the nobles murmur of an age without rest. The council must decide how we face the world going forward."

 cc_personality.60.a: "Defend what we have — no more costly adventures."
 cc_personality.60.b: "Careful diplomacy above all — we cannot afford another war."

 cc_personality.61.title: "Victor's Ambition"
 cc_personality.61.desc: "Our armies have seen much war, yet they remain strong — our enemies have crumbled before us time and again. The people look to the crown with pride, the soldiers with readiness. This is the moment that empires are made. What do we do with this power?"

 cc_personality.61.a: "We dominate. Strike hard, strike first, leave no question of our supremacy."
 cc_personality.61.b: "Expand with purpose — claim what is ours, border by border."

 cc_personality.62.title: "Surrounded on All Sides"
 cc_personality.62.desc: "The great powers look at us with hungry eyes. Rival states have stirred their nobles against us, whispered of coalitions, and tested our borders. The council debates how to survive in a world that seems to be closing in."

 cc_personality.62.a: "Fortify everything — make ourselves too costly to attack."
 cc_personality.62.b: "Turn inward — let the great powers quarrel amongst themselves."
 cc_personality.62.c: "Navigate carefully — keep every potential enemy uncertain of our intentions."

 cc_personality.63.title: "A Kingdom in Turmoil"
 cc_personality.63.desc: "Subjects grumble, loyalty wavers, and our standing in the world is diminished. The realm is not broken, but it is strained — and a misstep now could turn discontent into rebellion. The council advises prudence above all else."

 cc_personality.63.a: "Careful, deliberate governance — restore trust before seeking glory."
 cc_personality.63.b: "Strengthen our defenses — make sure our grip on the realm cannot be broken."

 cc_personality.64.title: "The Imperial Opportunity"
 cc_personality.64.desc: "We stand at a rare moment: a great power at peace, our treasury full, our rivals weakened. The world is ours to shape — if we choose to reach for it. The court debates with excitement the path before us."

 cc_personality.64.a: "Extend our reach — this wealth and strength must translate into lasting dominion."
 cc_personality.64.b: "This is our moment — strike before rivals consolidate against us."
 cc_personality.64.c: "Stay fluid — exploit opportunities as they arise rather than committing to one direction."

 cc_personality.65.title: "The Merchant's Way"
 cc_personality.65.desc: "Our coffers overflow and our merchants thrive in ports across the world. We have avoided the ruinous wars that have bled our neighbours dry. The question before the council is what to do with this prosperity — and what kind of power we wish to be."

 cc_personality.65.a: "Wealth is leverage — use it to exploit others' vulnerabilities."
 cc_personality.65.b: "Invest in goodwill — allies and friends are the surest safeguard of prosperity."

 cc_personality.50.title: "The Great Northern Reckoning"
 cc_personality.50.desc: "The era of Swedish imperial glory is over. The Great Northern War has shattered our Baltic empire, and Russia now stands where Sweden once dominated. We must rebuild — but in what form? Do we fortify and endure, or do we chart a more cautious course?"

 cc_personality.50.a: "Sweden endures. We defend what remains and rebuild from strength."
 cc_personality.50.b: "The age of ambition has passed. Caution and prudence must guide us now."
