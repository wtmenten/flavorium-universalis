l_english:
 # ============================================================
 # Cabinet Events Localization
 # cc_cabinet.1–52
 # ============================================================


 # cc_cabinet.5 — The Minister Responds to Refusal
 cc_cabinet.5.title: "The Minister Responds to Refusal"
 cc_cabinet.5.desc: "The minister we refused has had months to sit with the decision. Now the consequences arrive."
 cc_cabinet.5.a: "The minister has withdrawn into sullen distance. Their uncooperativeness makes revocations harder. (−prestige, revoke cost +)"
 cc_cabinet.5.b: "The minister found other ways to enrich themselves. The treasury has quietly suffered. (−gold)"
 cc_cabinet.5.c: "The minister turned to the noble estates, winning their ear against the Crown's interests. (Noble satisfaction +, Burgher satisfaction −)"

 # cc_cabinet.50 — The Snubbed Estate Retaliates
 cc_cabinet.50.title: "The Snubbed Estate Has Not Forgotten"
 cc_cabinet.50.desc: "Word reaches us that the estate passed over in our recent courtly arrangements has been nursing its grievance rather carefully. We are reminded that patience and resentment often look the same until they don't."
 cc_cabinet.50.a: "Offer a conciliation. (−3× income)"
 cc_cabinet.50.b: "Let them seethe."

 # cc_cabinet.52 — The Minister's Idle Influence (standard)
 cc_cabinet.52.title: "The Minister's Idle Influence"
 cc_cabinet.52.desc: "The minister's unsupervised months have quietly shaped the realm. The details surface now — too late to change, but clear enough to account for."
 cc_cabinet.52.a: "The minister's connections yield a modest windfall. (+2× monthly income)"
 cc_cabinet.52.b: "The minister's quiet conduct has won an estate's quiet approval. (Estate satisfaction +)"
 cc_cabinet.52.c: "The minister's ventures amount to little of value. (−2× monthly income)"
 cc_cabinet.52.d: "The minister's unsanctioned dealings have ruffled the wrong feathers. (Estate satisfaction −)"

 # cc_cabinet.53 — The Minister's Subtle Gambit (skilled / diplomatic minister)
 cc_cabinet.53.title: "The Minister's Subtle Gambit"
 cc_cabinet.53.desc: "A minister of notable diplomatic talent rarely idles quietly. Contacts were deepened, favors exchanged, and arrangements made without your direct knowledge. The results arrive now — the minister has left their mark."
 cc_cabinet.53.a: "The minister's trade connections turn a profit. (+3× monthly income, +prestige)"
 cc_cabinet.53.b: "The minister has opened diplomatic doors with a neighboring power. (+mutual opinion, +prestige)"
 cc_cabinet.53.c: "The minister's subtle work quietly expands our diplomatic reach. (Influence modifier, 8 years)"
 cc_cabinet.53.d: "The minister overplayed their hand — the gambit has backfired. (−prestige, nobles satisfaction −)"

 # cc_cabinet.54 — Idle Hands in Troubled Times (restless estates)
 cc_cabinet.54.title: "Idle Hands in Troubled Times"
 cc_cabinet.54.desc: "You gave the minister room to maneuver at precisely the moment the estates grew restless. Whether through cunning or negligence, the minister has become entangled in the simmering tensions — their choices now ripple out to the crown."
 cc_cabinet.54.a: "The minister quietly soothes the restless estate. (Estate satisfaction +, +prestige)"
 cc_cabinet.54.b: "The minister turns the unrest to the crown's advantage. (+3× monthly income, investment modifier)"
 cc_cabinet.54.c: "The minister's meddling inflames the tensions further. (Estate satisfaction −, −prestige)"
