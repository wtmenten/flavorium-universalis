l_english:
 # ============================================================
 # Colonial Divan Events — Pillar 07
 # ============================================================

 # ============================================================
 # Section A — Colonial Posting Events (cc_posting namespace)
 # ============================================================

 # --- cc_posting.1 — The Governor's Dispatch ---
 cc_posting.1.title: "The Governor's Dispatch"
 cc_posting.1.desc: "A sealed letter has arrived from [scope:minister.GetName], posted overseas to govern [scope:colony.GetName]. [scope:minister.GetHerHis.Cap] account of conditions in the colony is measured and professional — but the crown must now decide how to respond to the needs [scope:minister.GetHeShe] describes."

 cc_posting.1.a: "Invest in the colony's future."
 cc_posting.1.a.tooltip: "Coin flows out to [scope:colony.GetName]. The investment will accelerate colonial prosperity and improve the economic relationship — a long-term wager on the empire's expansion."

 cc_posting.1.b: "The dispatch is satisfactory — acknowledge it."
 cc_posting.1.b.tooltip: "[scope:minister.GetName]'s careful reporting speaks well of [scope:minister.GetHerHis] service. A word of royal recognition will sharpen [scope:minister.GetHerHis] diplomatic acuity."

 cc_posting.1.c: "Demand the colony send more tribute at once."
 cc_posting.1.c.tooltip: "The empire's needs take precedence. Revenue flows home — but the colonial administrators will resent the extraction, and the bond with [scope:colony.GetName] will fray."

 # --- cc_posting.2 — Corruption in the Colony ---
 cc_posting.2.title: "Corruption in the Colony"
 cc_posting.2.desc: "[scope:minister.GetName] has uncovered a pattern of financial irregularities among the colonial officials of [scope:colony.GetName]. Funds meant for infrastructure have been diverted; the accounts do not balance. [scope:minister.GetHeShe] writes for guidance."

 cc_posting.2.a: "Root it out — remove the corrupt officials."
 cc_posting.2.a.tooltip: "A firm response restores order. An [scope:minister.GetName] with administrative expertise will transform the crisis into a reform; without it, the cleanup still costs the treasury."

 cc_posting.2.b: "Extract a personal cut and look the other way."
 cc_posting.2.b.tooltip: "The corruption is quietly shared rather than eliminated. Gold flows back to the crown — but the colony's finances deteriorate further, and [scope:minister.GetName]'s character may be permanently marked by the choice."

 cc_posting.2.c: "Report the facts — do not interfere."
 cc_posting.2.c.tooltip: "A formal account is filed and nothing is done. The inaction costs prestige and unsettles the court, but at least no further harm is inflicted."

 # --- cc_posting.3 — A Native Uprising ---
 cc_posting.3.title: "A Native Uprising"
 cc_posting.3.desc: "Communities indigenous to the territory around [scope:colony.GetName] have risen in armed resistance. [scope:minister.GetName] writes with an urgent request: the crown must decide how to respond before the situation escalates further."

 cc_posting.3.a: "Send colonial forces — suppress the uprising."
 cc_posting.3.a.tooltip: "Troops are dispatched. The uprising is broken by force, but the colonial population's relationship with the crown is permanently scarred — and the levy of men is felt at home."

 cc_posting.3.b: "Negotiate a settlement."
 cc_posting.3.b.tooltip: "Gold and concession purchase an uneasy peace. The diplomatic solution costs the treasury but earns prestige — and [scope:minister.GetName] emerges as a more skilled negotiator."

 cc_posting.3.c: "Commit to full military pacification."
 cc_posting.3.c.tooltip: "A comprehensive military campaign is launched to end resistance permanently. The manpower and stability cost is severe, but [scope:minister.GetName] is hardened by the experience."

 # --- cc_posting.4 — Fever in the Colony ---
 cc_posting.4.title: "Fever in the Colony"
 cc_posting.4.desc: "A letter arrives bearing grim news: tropical fever has swept through the settlement where [scope:minister.GetName] is posted. [scope:minister.GetHeShe] is ill, the staff are depleted, and the colonial administration has ground nearly to a halt. [scope:minister.GetName] awaits the crown's decision."

 cc_posting.4.a: "Order [scope:minister.GetName] to push through the illness."
 cc_posting.4.a.tooltip: "[scope:minister.GetName] remains at post despite the fever. [scope:minister.GetHerHis.Cap] dedication earns royal admiration — but the illness exacts a toll on [scope:minister.GetHerHis] administrative and diplomatic capabilities."

 cc_posting.4.b: "Order rest and a reduced workload."
 cc_posting.4.b.tooltip: "[scope:minister.GetName] is relieved of the heaviest duties until recovery. Colonial administration stumbles, and stability suffers — but the minister is spared the worst."

 # ============================================================
 # Section B — Charter Company Events (cc_colonial namespace)
 # ============================================================

 # --- cc_colonial.1 — The Company's Accounts ---
 cc_colonial.1.title: "The Company's Accounts"
 cc_colonial.1.desc: "[scope:minister.GetName] has spent the past months poring over the ledgers of [scope:colony.GetName]. [scope:minister.GetHeShe] now presents the accounts to the council. The picture is complex — profits, liabilities, and a few figures that do not quite add up."

 cc_colonial.1.a: "Approve the returns in full."
 cc_colonial.1.a.tooltip: "[scope:minister.GetName]'s merchant connections have turned the accounts into a windfall. The company reports its full profits to the crown — a considerable sum."

 cc_colonial.1.b: "Order a thorough audit first."
 cc_colonial.1.b.tooltip: "[scope:minister.GetName]'s methodical inspection catches irregularities before they become scandals. The audit yields a smaller but impeccably clean return — and the minister's diligence is noted at court."

 cc_colonial.1.c: "Conduct a standard review."
 cc_colonial.1.c.tooltip: "The accounts are reviewed without drama. The council's diligence in overseeing the company's affairs earns modest prestige — a quiet endorsement of sound governance."

 # --- cc_colonial.2 — A Monopoly Dispute ---
 cc_colonial.2.title: "A Monopoly Dispute"
 cc_colonial.2.desc: "[scope:minister.GetName] has placed before the council a formal petition: the burgher estate seeks expanded trading rights for [scope:colony.GetName]'s chartered company. The nobles object — loudly — that this would undercut their own commercial interests. The ruler must decide who prevails."

 cc_colonial.2.a: "Expand the company's trading rights."
 cc_colonial.2.a.tooltip: "The chartered company receives broader latitude to trade. Gold flows in through the burgher network, the merchant community is delighted — and the nobility's resentment will take time to fade."

 cc_colonial.2.b: "Restrict the proposed expansion."
 cc_colonial.2.b.tooltip: "The noble estates prevail. Their commercial interests are protected, and the crown's prestige is burnished by the show of royal restraint — but the burgher estate will not forget the slight."

 cc_colonial.2.c: "Mediate a crown compromise."
 cc_colonial.2.c.tooltip: "[scope:minister.GetName] brokers a middle path. Both estates receive modest concessions, gold flows through commercial channels, and the minister's reputation as a skilled negotiator grows."

 # --- cc_colonial.3 — The Governor's Letter ---
 cc_colonial.3.title: "The Governor's Letter"
 cc_colonial.3.desc: "A formal letter has arrived from [scope:minister.GetName], posted to [scope:colony.GetName] as governor. [scope:minister.GetHeShe] writes with a clear request: the colonial administration requires additional support from the crown. The form that support takes is the crown's to decide."

 cc_colonial.3.a: "Send troop reinforcements."
 cc_colonial.3.a.tooltip: "Soldiers are dispatched to [scope:colony.GetName]. The military relationship between crown and colony strengthens — and [scope:minister.GetName] gains firsthand command experience."

 cc_colonial.3.b: "Send financial support."
 cc_colonial.3.b.tooltip: "Crown gold flows to [scope:colony.GetName]'s treasury. The economic foundations of the colony are strengthened, and [scope:minister.GetName] demonstrates the administrative competence the posting requires."

 cc_colonial.3.c: "Decline the request — the crown cannot spare the resources."
 cc_colonial.3.c.tooltip: "The governor's request is turned down. [scope:minister.GetName]'s standing at court is diminished by the visible lack of royal confidence, and the colonial administration grows more suspicious of crown intentions."

 # ============================================================
 # Section C — Decolonization Crisis (cc_colonial namespace)
 # ============================================================

 # --- cc_colonial.10 — The Colonial Petition ---
 cc_colonial.10.title: "The Colonial Petition"
 cc_colonial.10.desc: "[scope:minister.GetName] has laid a formal petition before the council on behalf of [scope:colony.GetName]: the colonial population demands greater self-governance. The minister's revolutionary rhetoric has galvanised the movement. How the crown responds will define the empire's relationship with its overseas territories for a generation."

 cc_colonial.10.a: "Grant greater autonomy — begin negotiations."
 cc_colonial.10.a.tooltip: "The crown acknowledges the petition's legitimacy. Stability is sacrificed for statesmanship — the political relationship with [scope:colony.GetName] improves, and formal arrangements will follow."

 cc_colonial.10.b: "Reject the petition outright."
 cc_colonial.10.b.tooltip: "The crown refuses to negotiate with colonial agitators. Prestige is maintained — but [scope:minister.GetName]'s response to this rejection is unpredictable, and the political situation in [scope:colony.GetName] remains volatile."

 cc_colonial.10.c: "Remove [scope:minister.GetName] from the cabinet."
 cc_colonial.10.c.tooltip: "The agitator's influence is cut off at the source. [scope:minister.GetName] is dismissed, the petition loses its court champion, and the crisis is contained — but the crown's reputation for tolerance suffers."

 # --- cc_colonial.11 — The Defection ---
 cc_colonial.11.title: "The Defection"
 cc_colonial.11.desc: "Word reaches the palace that [scope:minister.GetName] has vanished from court. Reports from [scope:colony.GetName] confirm the worst: the minister has joined the colonial independence movement, bringing court knowledge and royal connections to the independence cause. The damage must be contained."

 cc_colonial.11.a: "Let [scope:minister.GetName] go — contain the fallout."
 cc_colonial.11.a.tooltip: "The defection is a blow to the crown's prestige. Diplomatic relationships fray across the empire as the minister's departure signals vulnerability — but the colonial cause gains momentum it will take years to reverse."

 cc_colonial.11.b: "Dispatch agents to arrest [scope:minister.GetName] before they cross the border."
 cc_colonial.11.b.tooltip: "The minister is seized before reaching the colony. The defection is averted — but the heavy-handed response destabilises the court and devastates the political relationship with [scope:colony.GetName]."

 # --- cc_colonial.12 — The Compromise ---
 cc_colonial.12.title: "The Compromise"
 cc_colonial.12.desc: "Months after the crown's pledge to grant greater autonomy, the formal arrangements must now be set down in writing. The colonial leadership of [scope:colony.GetName] waits for the crown's commitment — or its retreat from that commitment."

 cc_colonial.12.a: "Formalise the autonomy compact."
 cc_colonial.12.a.tooltip: "The crown keeps its word. [scope:colony.GetName] receives formal recognition of its expanded autonomy. The colony flourishes under the new arrangement, and the political and cultural bonds with the mother country are strengthened rather than severed."

 cc_colonial.12.b: "Rescind the offer — the crown cannot yield so much."
 cc_colonial.12.b.tooltip: "The promise is broken. Prestige collapses as the colonial leadership realises the pledge was hollow — and the political relationship with [scope:colony.GetName] suffers a blow from which it may not recover."

 # ============================================================
 # Colonial Divan Modifier Names
 # ============================================================
 cc_col_colonial_investment: "Colonial Investment"
 cc_col_colonial_investment_desc: "Crown resources have been channelled into this colony's development. Prosperity grows and commercial efficiency improves under the direct investment of the imperial government."

 cc_col_colonial_autonomy: "Colonial Autonomy Compact"
 cc_col_colonial_autonomy_desc: "This colony has been granted formal recognition of its expanded self-governance. Prosperity and commercial activity flourish under the arrangement — and the relationship with the mother country is the stronger for it."

 cc_col_defection_fallout: "Colonial Defection Fallout"
 cc_col_defection_fallout_desc: "The defection of a cabinet minister to the colonial independence movement has damaged the crown's standing. Subject loyalty is shaken and diplomatic reputation suffers across the empire."



# Colonial buildings

 colonial_migration_center: "Migration Center"
 colonial_migration_center_desc: "A colonial office for registering new arrivals, assigning households, and directing settlers toward available land and work."
 colonial_migration_center_maintenance: "Migration Center Maintenance"
 colonial_migration_center_maintenance_desc: "Migration centers require records, books, cloth, coin, and tools to organize arrivals and settlement grants."