l_english:

 # Estate Privileges

 ep_noble_admiralty_commission: "Admiralty Commission"
 ep_noble_admiralty_commission_desc: "The crown formalizes naval command under noble patronage, granting the high nobility oversight of fleet administration in exchange for expanded port capacity. Requires a monarchy and the Naval Charter advance."

 # Advance

 naval_administration_advance: "Naval Administration"
 naval_administration_advance_desc: "The state establishes a permanent admiralty board to oversee distant naval stations, extending royal control over the seas. Requires the $naval_charter_advance$ advance. Unlocks the Naval Administration reform."

 # Government Reform

 cc_naval_administration_reform: "Naval Administration"
 cc_naval_administration_reform_desc: "The establishment of a permanent admiralty board extends royal authority over distant naval stations, enabling an additional naval governorship and reducing the cost of maintaining far-flung ports."

 # Building

 naval_academy: "Naval Academy"
 naval_academy_desc: "A dedicated institution for the training of officers and the refinement of naval doctrine. Increases local sailors, reduces fleet attrition in port, and — if established in the capital — improves the navy's morale, tradition, and expected size across the realm. Requires the $naval_charter_advance$ advance. Can be built in any city or megaopolis with a port."
