l_english:
 learned_counselor: "Learned Counselor"
 desc_learned_counselor: "This cabinet member has devoted a lifetime to scholarship and letters. Under their guidance, literacy spreads throughout the realm as they ensure that education is taken seriously at every level of governance."
 learned_counselor_die_desc: "[CHARACTER.GetName] has passed from this world, and the libraries [CHARACTER.GetSheHe] filled will stand as [CHARACTER.GetHerHis] legacy long after the ink on these pages fades."
 law_reformer: "Law Reformer"
 desc_law_reformer: "A sharp legal mind and an appetite for reform have made this advisor invaluable in streamlining the legislative process. Contradictory statutes and archaic customs fall before their careful pen."
 law_reformer_die_desc: "[CHARACTER.GetName] has died, and many a lawyer mourns the loss of the keenest legal mind they ever argued against."
 loyal_steward: "Loyal Steward"
 desc_loyal_steward: "Few things hold an empire together like trust. This advisor has cultivated deep personal relationships with the rulers of our subject realms, reminding them that loyalty flows both ways."
 loyal_steward_die_desc: "[CHARACTER.GetName] is gone, and the thread of trust [CHARACTER.GetSheHe] wove between us and our subjects has grown a little thinner."
 tactical_advisor: "Tactical Advisor"
 desc_tactical_advisor: "A decorated veteran and student of warfare, this advisor translates hard-won battlefield experience into doctrine that sharpens the edge of every regiment in our service."
 tactical_advisor_die_desc: "[CHARACTER.GetName] has fallen silent. The manuals [CHARACTER.GetSheHe] wrote will outlast [CHARACTER.GetHerHim], but a living master of tactics is worth ten printed volumes."
 ecumenist: "Ecumenist"
 desc_ecumenist: "Raised among different faiths or simply blessed with a philosopher's patience, this advisor sees shared humanity where others see heresy. Religious minorities fare better when their counsel shapes policy."
 ecumenist_die_desc: "[CHARACTER.GetName] has departed this life. The quiet bridges [CHARACTER.GetSheHe] built between faiths may outlast the memory of who built them."
 colonial_planner: "Colonial Planner"
 desc_colonial_planner: "Maps, trade winds, and the dreams of settlers — this advisor lives and breathes colonial expansion. Under their direction, migration flows more efficiently to the frontiers of our overseas ambitions."
 colonial_planner_die_desc: "[CHARACTER.GetName] has died, and some unnamed cape on an uncharted coast shall never bear [CHARACTER.GetHerHis] name."
 prosperity_planner: "Prosperity Planner"
 desc_prosperity_planner: "This advisor has an instinct for identifying and cultivating the conditions that allow communities to thrive. Prosperity does not simply happen — it is planned, and no one plans it better."
 prosperity_planner_die_desc: "[CHARACTER.GetName] has passed. The fields they helped tend will still bloom, but a guiding hand is gone from the plow."
 iron_disciplinarian: "Iron Disciplinarian"
 desc_iron_disciplinarian: "This advisor governs through order, hierarchy, and obedience. The realm runs efficiently under their watch, but the discipline grates. The nobility bristles, and foreign courts whisper of tyranny."
 iron_disciplinarian_die_desc: "[CHARACTER.GetName] is dead. The machine [CHARACTER.GetSheHe] built grinds on, but the engineers who feared [CHARACTER.GetHerHim] are already loosening the bolts."
 shadow_counselor: "Shadow Counselor"
 desc_shadow_counselor: "This advisor works through informants and quiet leverage rather than official channels. Foreign powers negotiate carefully, knowing this one is listening. But no estate trusts a manipulator, and diplomats keep their distance."
 shadow_counselor_die_desc: "[CHARACTER.GetName] has died — or so the official reports claim. Those who knew [CHARACTER.GetHerHim] well are reserving judgement."
 progressive_reformist: "Progressive Reformist"
 desc_progressive_reformist: "This advisor is convinced the old ways must give way to the new. Literacy climbs, laws modernize, and the innovative impulse spreads, but every reform is also a disruption that unsettles the old order."
 progressive_reformist_die_desc: "[CHARACTER.GetName] has died with half the reforms still unfinished. Whether that is tragedy or mercy depends on who you ask."
 war_hawk: "War Hawk"
 desc_war_hawk: "This advisor is eager for war. Under their influence, military excellence reaches new heights, and so does the appetite for conflict. Enemies take note of a realm that cannot rest, and coalitions form against it."
 war_hawk_die_desc: "[CHARACTER.GetName] has died, and the officers [CHARACTER.GetSheHe] drilled breathe out slowly for the first time in years."
 zealous_inquisitor: "Zealous Inquisitor"
 desc_zealous_inquisitor: "A fire burns in the soul of this advisor, and it consumes doubt, heresy, and hesitation with equal hunger. In a realm of one faith, this is a gift. In a realm of many, it is a catastrophe waiting to be scheduled."
 zealous_inquisitor_die_desc: "[CHARACTER.GetName] has met their maker and will now have to answer some difficult questions of [CHARACTER.GetHerHis] own."
 fumbling_integrator: "Fumbling Integrator"
 desc_fumbling_integrator: "This advisor means well and is simply slow. Paperwork is filed twice, edicts are reworded until nobody can misread them, and delegations wait. New lands come into the realm at a crawl under their care, and they come in settled: what has been surveyed this thoroughly is harder to argue with later."
 fumbling_integrator_die_desc: "[CHARACTER.GetName] has died. It took three departments a week to confirm the paperwork."
 able_integrator: "Able Integrator"
 desc_able_integrator: "A capable and well-rounded administrator, this advisor manages the complex business of integrating new territories with quiet competence. Not brilliant, but reliable — and reliability is often worth more."
 able_integrator_die_desc: "[CHARACTER.GetName] has died. The files are in order, the transitions scheduled, and the work — as always — will carry on."
 master_integrator: "Master Integrator"
 desc_master_integrator: "This advisor is highly capable across administrative, military, and diplomatic affairs. In their hands, the incorporation of new lands proceeds quickly and smoothly."
 master_integrator_die_desc: "[CHARACTER.GetName] has died, and successors across three departments are discovering exactly how much one person had been doing."
 iron_integrator: "Iron Integrator"
 desc_iron_integrator: "Integration is normally a slow and cautious art. This advisor treats it as a campaign of conquest — swift, relentless, and total. The realm coheres with unusual speed, but the subjects being integrated rarely feel consulted, and the estates make their displeasure known."
 iron_integrator_die_desc: "[CHARACTER.GetName] has died. The provinces they absorbed are quiet, for now."
 provocateur: "Provocateur"
 desc_provocateur: "Blundering through foreign relations with the grace of a cannonball, this advisor manages the remarkable feat of antagonizing neighbors who had no particular quarrel with us before."
 provocateur_die_desc: "[CHARACTER.GetName] has died. Several ambassadors have sent flowers. The sentiment is genuine."
 tactful_envoy: "Tactful Envoy"
 desc_tactful_envoy: "A diplomat who understands that silence is a weapon and timing is everything, this advisor smooths the rough edges of our foreign relations without grand gestures or promises we cannot keep."
 tactful_envoy_die_desc: "[CHARACTER.GetName] has died. [CHARACTER.GetHerHis] absence will be felt in a dozen small courtesies that we no longer know how to perform."
 master_statesman: "Master Statesman"
 desc_master_statesman: "This advisor is a skilled negotiator who can leave rival courts satisfied even when they have conceded. Under their guidance, the resentment other nations might direct at us tends to fade."
 master_statesman_die_desc: "[CHARACTER.GetName] has died, and foreign courts that admired [CHARACTER.GetHerHim] are sending letters of genuine condolence."
 dove_of_court: "Dove of Court"
 desc_dove_of_court: "This advisor has elevated the art of not making enemies into a governing philosophy. Foreign antagonism fades, reputations improve — but so too does a certain softness in our councils, a growing preference for accommodation over advantage that sharper rivals will be quick to exploit."
 dove_of_court_die_desc: "[CHARACTER.GetName] has died. The realm [CHARACTER.GetSheHe] leaves behind is well-liked and perhaps too accustomed to comfort."
 timid_landlubber: "Timid Landlubber"
 desc_timid_landlubber: "This advisor looks at a map of the sea and sees only ways to drown. Every expedition requires more reassurance than the ships require provisions, and the pace of our exploration reflects it."
 timid_landlubber_die_desc: "[CHARACTER.GetName] has died, having never once set foot on a boat and proud of it."
 capable_explorer: "Capable Explorer"
 desc_capable_explorer: "A competent and reliable hand at supporting expeditions, this advisor ensures that ships leave on time, supplies are adequate, and dispatches return promptly. Not a visionary, but exploration thrives on competent administration as much as bold captains."
 capable_explorer_die_desc: "[CHARACTER.GetName] has died. [CHARACTER.GetHerHis] ledgers were impeccable and the fleets [CHARACTER.GetSheHe] supplied are still at sea."
 legendary_navigator: "Legendary Navigator"
 desc_legendary_navigator: "This advisor seems to understand the sea the way others understand their mother tongue. Under their direction, our explorers find favorable winds where others find storms, and the frontiers of the known world shrink with every passing year."
 legendary_navigator_die_desc: "[CHARACTER.GetName] has died, and the cartographers are already arguing about what to name the features [CHARACTER.GetSheHe] helped discover."
 restless_pioneer: "Restless Pioneer"
 desc_restless_pioneer: "This advisor cannot look at a blank space on a map without wanting to fill it. Exploration accelerates and settlers pour into new lands — but colonial ambition is never quiet, and the powers of the world are beginning to watch us with wary eyes."
 restless_pioneer_die_desc: "[CHARACTER.GetName] has died somewhere at the edge of the known world, which is exactly where [CHARACTER.GetSheHe] would have wanted."
