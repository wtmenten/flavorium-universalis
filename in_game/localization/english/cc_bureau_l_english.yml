l_english:
 # The bureau system: the Order/Magnates axis, the thread, the steward duty, the privileges and
 # the two reforms.
 #
 # VOICE. The court speaking, not the manual. Numbers and thresholds live in the modifier
 # descriptions and the trigger tooltips, which is where a player goes looking for them; the
 # event bodies describe what is happening in the realm.

 # ---- The societal value ----
 cc_order_vs_cc_magnates: "Order and the Magnates"
 cc_order_focus: "Order"
 cc_magnates_focus: "Magnates"

 MODIFIER_TYPE_NAME_monthly_towards_cc_order: "Monthly Progress toward Order"
 MODIFIER_TYPE_DESC_monthly_towards_cc_order: "This impacts the change towards the [ShowSocietyDirectionName('cc_order')] [societal_value|e]."
 MODIFIER_TYPE_NAME_monthly_towards_cc_magnates: "Monthly Progress toward the Magnates"
 MODIFIER_TYPE_DESC_monthly_towards_cc_magnates: "This impacts the change towards the [ShowSocietyDirectionName('cc_magnates')] [societal_value|e]."

 # Shown in a bureaucracy's negative modifier tooltip, where the extra entrenchment factor is
 # applied. See zzz_cc_vanilla_bureau_overrides.txt for why the malus side is scaled twice.
 CC_BUREAU_ENTRENCHMENT_SCALE: "Entrenchment"

 # ---- The cabinet duty ----
 cc_duty_bureau_steward: "Steward of a Bureau"
 cc_duty_bureau_steward_desc: "Put a minister in charge of one office and let him live in it.\n\nHe learns what it costs, which nobody at court has ever troubled to find out, and within a year he is running it for less than the treasury had budgeted. He is also, by then, the only man who understands it."
 cc_duty_bureau_steward_select: "Which office?"

 # ---- .1  A new bureau ----
 cc_bureau.1.title: "The Establishment"
 cc_bureau.1.desc: "The warrant is signed and the rooms are found. What remains is the part nobody writes down: who sits in them.\n\nThere is no shortage of candidates. There is a shortage of candidates who can do the work and have no reason to be grateful to anybody, and the court has never in its history produced more than a handful of those at once."
 cc_bureau.1.desc_venal: "The warrant is signed, and three separate families have already written to enquire about the appointments. Two of them enclosed figures.\n\nThis is not corruption as anyone here understands the word. It is simply how posts have been filled for a generation now, and the men writing would be genuinely puzzled to hear it called anything else."
 cc_bureau.1.a: "Salaried clerks. They will owe the post to the post."
 cc_bureau.1.b: "The younger sons of the great houses."
 cc_bureau.1.c: "Sell the appointments. The treasury needs the money."

 # ---- .10  A bureau is dissolved ----
 cc_bureau.10.title: "The Office Wound Up"
 cc_bureau.10.desc: "The office is closed and the question is what becomes of forty men who have spent their working lives in it.\n\nThey are not important men. Several of them are the only people alive who know how a particular thing is done, and none of them has been asked which particular thing."
 cc_bureau.10.desc_sold: "The office is closed, and the men in it paid for their places.\n\nNobody at court has been able to give a clear answer as to whether that money is owed back. The clerks have their own view, they have written it down carefully, and one of them has been to see a lawyer."
 cc_bureau.10.a: "Find them places elsewhere."
 cc_bureau.10.b: "Thank them and let them go."
 cc_bureau.10.c: "Make an example of the worst of them."

 # ---- .20  The offices find their own income ----
 cc_bureau.20.title: "The Arrears"
 cc_bureau.20.desc: "The offices have not been paid in full for some time. They have not stopped working, which the treasury has quietly taken as evidence that the pay was never the point.\n\nIt is the point. What has happened instead is that a fee has appeared: small, informal, and charged at the moment a petitioner most wants the thing done. Nobody set it and everybody knows the rate."
 cc_bureau.20.a: "Pay the arrears. All of them."
 cc_bureau.20.b: "They have found their own income. Leave it."
 cc_bureau.20.c: "Fewer posts, properly paid."

 # ---- .21  The fees are the custom ----
 cc_bureau.21.title: "The Custom of the Office"
 cc_bureau.21.desc: "Twelve years, and the fee is no longer informal. It has a rate, the rate is written on a board, and a clerk will explain it to you politely before you have finished asking.\n\nThe men who charge it have built their lives on it. They have bought houses on the strength of it and married daughters on the strength of it, and they will tell you without embarrassment that they are paid this way because the crown chose not to pay them another way. They are right."
 cc_bureau.21.a: "Abolish it. However much it costs."
 cc_bureau.21.b: "Tax it. The crown may as well have its share."
 cc_bureau.21.c: "Say nothing and let it stand."

 # ---- .30  The clerks against the great houses ----
 cc_bureau.30.title: "A Question of Precedence"
 cc_bureau.30.desc: "An under-secretary has refused a duke.\n\nThe refusal was correct. The paperwork was not in order, the man said so, and he said it in front of people. What the duke wants is not the paperwork any more; what the duke wants is to establish that a man of that description does not tell a man of his description anything.\n\nHalf the court is enjoying this enormously and the other half has understood what is actually being decided."
 cc_bureau.30.a: "The appointment stands. So does the refusal."
 cc_bureau.30.b: "The duke is owed his courtesy."
 cc_bureau.30.c: "The crown does not adjudicate between servants."

 # ---- .40  Entrenched and unfunded ----
 cc_bureau.40.title: "The Fiefdom"
 cc_bureau.40.desc: "The office has not had proper funding in twenty years and has never once asked for it, which should have been the warning.\n\nIt is entirely solvent. It is solvent because it has become the private concern of the family that runs it, drawing its income from arrangements no one at court has seen the terms of, and it has been performing its function faultlessly throughout. That is what makes it difficult. There is nothing to complain of except the fact of it."
 cc_bureau.40.a: "Fund it properly and take it back."
 cc_bureau.40.b: "Break it into pieces small enough to hold."
 cc_bureau.40.c: "Sell them the office outright. In law."

 # ---- .50  Entrenched and funded ----
 cc_bureau.50.title: "A Pillar of the State"
 cc_bureau.50.desc: "The office is forty years old, properly paid, and has outlived three of the men who founded it without anyone noticing a difference in its output.\n\nThat last part is the achievement. It has stopped depending on who works there. A clerk who died last winter left a set of standing instructions so complete that the man who replaced him needed no instruction at all, and the office simply carried on.\n\nThe crown has built something that will outlast the crown's attention. What remains is deciding how much rope to give it."
 cc_bureau.50.a: "Let it write its own procedure."
 cc_bureau.50.b: "Bring its head into the council."
 cc_bureau.50.c: "Rotate the officers before any of them takes root."

 # ---- .60  A funding cut ----
 cc_bureau.60.title: "The Cut Is Announced"
 cc_bureau.60.desc: "The estimate was reduced and somebody has to tell them.\n\nThe head of the office received the news standing, thanked the messenger, and asked one question: whether the reduction was expected to be permanent. He was told it was for the year. He said that was what he had been told the last time, and went back to his desk.\n\nHe will not resign and he will not protest. What he will do is stop refusing the small favours he has been refusing for eleven years, and nobody in the palace will hear a thing about it."
 cc_bureau.60.a: "Tell them plainly. There is no money this year."
 cc_bureau.60.b: "Cut the establishment, not the pay."
 cc_bureau.60.c: "Find it somewhere else."

 # ---- .61  What the cut cost ----
 cc_bureau.61.title: "What It Cost"
 cc_bureau.61.desc: "Ten years on, the office still exists and still answers letters.\n\nWhat it no longer does is answer them the same way regardless of who is asking. There was no decision. Nobody was bribed in any sense a court could act on. It is simply that a man who has not been paid properly in a decade develops a sense of which correspondents are worth the trouble, and every man in that building developed the same one at about the same time.\n\nThe crown gets its work done. It gets it done second."
 cc_bureau.61.a: "Rebuild it. Whatever it takes."
 cc_bureau.61.b: "It is cheaper than it was. Leave it."

 # ---- Thread modifiers ----
 STATIC_MODIFIER_NAME_cc_bureau_career_clerks: "A Salaried Service"
 STATIC_MODIFIER_DESC_cc_bureau_career_clerks: "Men who owe the post to the post. Slow, unglamorous, and it compounds every year nobody interferes with it."
 STATIC_MODIFIER_NAME_cc_bureau_offices_are_property: "Offices Are Property"
 STATIC_MODIFIER_DESC_cc_bureau_offices_are_property: "Posts are inherited and sold as a matter of course, and nobody decreed it. The crown still collects. It no longer decides who serves."
 STATIC_MODIFIER_NAME_cc_bureau_paid_in_full: "The Arrears Cleared"
 STATIC_MODIFIER_DESC_cc_bureau_paid_in_full: "Twenty-five years of clerks paid on time, which is the most expensive thing in this thread to buy and the only one that undoes the rest."
 STATIC_MODIFIER_NAME_cc_bureau_fees_became_custom: "The Fees Became the Custom"
 STATIC_MODIFIER_DESC_cc_bureau_fees_became_custom: "An office living off its own charges answers to whoever pays them, and the rate is on a board by the door."
 STATIC_MODIFIER_NAME_cc_bureau_retrenched: "The Establishment Reduced"
 STATIC_MODIFIER_DESC_cc_bureau_retrenched: "Fewer posts, still salaried, still the crown's. A smaller administration is still an administration."
 STATIC_MODIFIER_NAME_cc_bureau_office_farmed_out: "The Office Farmed Out"
 STATIC_MODIFIER_DESC_cc_bureau_office_farmed_out: "The post belongs to somebody else now and the crown collects rent on its own administration. It pays. It also takes a lifetime to undo."
 STATIC_MODIFIER_NAME_cc_bureau_crown_backed_clerks: "The Crown Backed Its Clerks"
 STATIC_MODIFIER_DESC_cc_bureau_crown_backed_clerks: "Said once, in public, in front of a duke. Every under-secretary in the realm heard about it within the month."
 STATIC_MODIFIER_NAME_cc_bureau_standing_procedure: "Standing Procedure"
 STATIC_MODIFIER_DESC_cc_bureau_standing_procedure: "The office has written down how it does things and has therefore stopped depending on the people currently doing them. That is the whole definition of an institution."
 STATIC_MODIFIER_NAME_cc_bureau_head_in_council: "The Secretary in Council"
 STATIC_MODIFIER_DESC_cc_bureau_head_in_council: "The office has a voice at the table. The crown has a rival it can at least see, which is the better kind."
 STATIC_MODIFIER_NAME_cc_bureau_rotated_officers: "Officers Rotated"
 STATIC_MODIFIER_DESC_cc_bureau_rotated_officers: "Nobody stays long enough to build anything, which is the point, and also the cost."

 # ---- Estate privileges ----
 ep_noble_offices_by_right: "The Offices Are Ours by Right"
 ep_noble_offices_by_right_desc: "The posts go to the families and the families pay for them, so the treasury's outlay falls the year this is granted and every year after.\n\nWhat falls with it is the crown's ability to choose who serves. That is not a cost anybody notices until the first time it matters."
 ep_burgher_examined_service: "Service by Examination"
 ep_burgher_examined_service_desc: "Posts filled by whoever passes, from wherever they come from. It produces a better administration than any other method anyone has tried, and it is slow, expensive and detested by every family with a name to protect."
 ep_clergy_keepers_of_record: "Keepers of the Record"
 ep_clergy_keepers_of_record_desc: "Before there were archives there were monasteries, and for several centuries those were the same thing. The clergy keep the rolls, the crown saves the cost of keeping them.\n\nThe price is that the church now knows precisely what the crown owns."
 ep_peasant_relief_from_fees: "Relief from the Fees"
 ep_peasant_relief_from_fees_desc: "The informal charges stop, by proclamation, and the offices are told they will be paid properly instead.\n\nThe crown has just agreed to meet a cost it had been quietly passing on to people with no way to refuse it. It is more expensive than anyone expected."

 # ---- Government reforms ----
 cc_venal_offices_reform: "The Venal Offices"
 cc_venal_offices_reform_desc: "Offices become property in law: bought, sold, inherited, and taxed by the crown on every transfer.\n\nFrance ran this way for two centuries and it worked, in the narrow sense that it raised money reliably and without argument. What it could not do was produce an administration that answered to anybody."
 cc_salaried_establishment_reform: "The Salaried Establishment"
 cc_salaried_establishment_reform_desc: "Posts are salaried, appointed, and held at the crown's pleasure.\n\nEvery state that lasted arrived here eventually, and most of them arrived after trying the other thing first and spending a century regretting it. It is expensive in the way that walls are expensive."
