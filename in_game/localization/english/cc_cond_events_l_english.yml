l_english:
 # ============================================================
 # cc_cond.1 — Capital Development Trait Event
 # ============================================================
 cc_cond.1.title: "A Minister Shows Promise"
 cc_cond.1.desc: "[scope:minister.GetName] has distinguished [scope:minister.GetHerHimself] through the administration of our growing capital. The prosperity of [ROOT.GetCapitalName] seems to have sharpened their mind. How shall we direct their talents?"
 cc_cond.1.a: "Appoint [scope:minister.GetName] as Master Urbanist."
 cc_cond.1.b: "Cultivate [scope:minister.GetName] as an Enlightenment Herald."
 cc_cond.1.c: "Develop [scope:minister.GetName] as a Progressive Rationalist."
 cc_cond.1.d: "Embrace [scope:minister.GetName] as a Revolutionary Herald."
 cc_cond.1.e: "Develop [scope:minister.GetName] as Grand Architect."
 cc_cond.1.f: "Cultivate [scope:minister.GetName] as an Arts Patron."
 cc_cond.1.g: "Make [scope:minister.GetName] a Learned Courtier."
 cc_cond.1.h: "Develop [scope:minister.GetName] as Reform-Minded Counselor."
 cc_cond.1.i: "Direct [scope:minister.GetName] as Urban Planner."
 cc_cond.1.j: "Encourage [scope:minister.GetName] as Prosperity Herald."
 cc_cond.1.k: "Appoint [scope:minister.GetName] as Merchant Syndic."
 cc_cond.1.dismiss: "The capital's growth will speak for itself."

 # ============================================================
 # cc_cond.3 — Military Specialist (Ages 1–4, mil > 33)
 # ============================================================
 cc_cond.3.title: "A Military Mind Emerges"
 cc_cond.3.desc: "[scope:minister.GetName] has proven a capable military administrator. Their grasp of logistics, tactics, and organization distinguishes them from others at court. With proper direction, this talent can be put to specific use."
 cc_cond.3.a: "Direct [scope:minister.GetName] as an Infantry Drillmaster."
 cc_cond.3.b: "Develop [scope:minister.GetName] as a Scout Captain."
 cc_cond.3.c: "Cultivate [scope:minister.GetName] as a Military Engineer."
 cc_cond.3.dismiss: "No direction needed now."

 # ============================================================
 # cc_cond.4 — Regional / Cultural / Religious Specialist
 # ============================================================
 cc_cond.4.title: "A Counselor of the World"
 cc_cond.4.desc: "[scope:minister.GetName] has shown an unusual depth of knowledge when it comes to the customs, religions, and peoples around us. Their expertise could be developed further to serve specific ends."
 cc_cond.4.christian: "Guide [scope:minister.GetName] as a Christian Diplomat."
 cc_cond.4.orthodox: "Develop [scope:minister.GetName] as an Ecumenical Patriarch Advisor."
 cc_cond.4.muslim: "Direct [scope:minister.GetName] as a Caliphate Diplomat."
 cc_cond.4.dharmic: "Cultivate [scope:minister.GetName] as a Brahmin Counselor."
 cc_cond.4.buddhist: "Guide [scope:minister.GetName] as a Dharma Minister."
 cc_cond.4.western_europe: "Shape [scope:minister.GetName] as a Renaissance Patron."
 cc_cond.4.africa: "Develop [scope:minister.GetName] as a Griot Diplomat."
 cc_cond.4.central_asia: "Cultivate [scope:minister.GetName] as a Steppe Strategos."
 cc_cond.4.south_asia: "Guide [scope:minister.GetName] as a Mughal Administrator."
 cc_cond.4.new_world: "Direct [scope:minister.GetName] as a New World Pioneer."
 cc_cond.4.maritime: "Shape [scope:minister.GetName] as a Maritime Champion."
 cc_cond.4.dismiss: "Their expertise will find its own path."

 # ============================================================
 # cc_cond.5 — Parliamentary / Diplomatic Specialist
 # ============================================================
 cc_cond.5.title: "A Diplomat of Rare Skill"
 cc_cond.5.desc: "[scope:minister.GetName] has navigated the courts and assemblies of this realm with unusual grace. Their diplomatic instincts are sharp. How shall we develop them?"
 cc_cond.5.a: "Cultivate [scope:minister.GetName] as a Parliamentary Broker."
 cc_cond.5.b: "Appoint [scope:minister.GetName] as Diplomatic Attaché."
 cc_cond.5.c: "Elevate [scope:minister.GetName] as Grand Chancellor."
 cc_cond.5.dismiss: "Their skills will develop naturally."

 # ============================================================
 # cc_cond.6 — Advanced Military Specialist (Ages 5–6, mil > 66)
 # ============================================================
 cc_cond.6.title: "A Veteran Military Mind"
 cc_cond.6.desc: "[scope:minister.GetName] is a seasoned commander whose instincts have been forged in decades of campaigning. This is not someone to waste on administrative routine. How shall we channel their gifts?"
 cc_cond.6.a: "Make [scope:minister.GetName] a Commissariat Officer."
 cc_cond.6.b: "Appoint [scope:minister.GetName] as Cavalry Marshal."
 cc_cond.6.c: "Develop [scope:minister.GetName] as a Siege Engineer."
 cc_cond.6.d: "Elevate [scope:minister.GetName] as Supreme Commander."
 cc_cond.6.dismiss: "Their gifts need no further shaping."

 # ============================================================
 # cc_cond.20 — Intellectual / Religious Cluster
 # ============================================================
 cc_cond.20.title: "A Counselor Shaped by the Age"
 cc_cond.20.desc: "[scope:minister.GetName] has been formed by the intellectual and spiritual climate of this realm. Their convictions run deep. Which path best captures their nature?"
 cc_cond.20.innovative: "Develop [scope:minister.GetName] as an Innovative Counselor."
 cc_cond.20.traditionalist: "Shape [scope:minister.GetName] as a Traditionalist Guardian."
 cc_cond.20.spiritualist: "Cultivate [scope:minister.GetName] as a Mystical Patriarch."
 cc_cond.20.humanist: "Guide [scope:minister.GetName] as a Humanist Philosopher."
 cc_cond.20.mysticism: "Develop [scope:minister.GetName] as a Mystical Counselor."
 cc_cond.20.jurisprudence: "Direct [scope:minister.GetName] as a Legal Scholar."
 cc_cond.20.dismiss: "Their nature will manifest in time."

 # ============================================================
