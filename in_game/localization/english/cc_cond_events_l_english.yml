l_english:
 # ============================================================
 # cc_cond.1 — Capital Development Trait Event
 # ============================================================
 cc_cond.1.title: "A Minister Shows Promise"
 cc_cond.1.desc: "[minister.GetName] has distinguished [minister.GetHerHim]self through the administration of our growing capital. The prosperity of [country.GetCapital.GetName] seems to have sharpened their mind. How shall we direct their talents?"
 cc_cond.1.a: "Appoint [minister.GetName] as [ShowTraitName('master_urbanist')]."
 cc_cond.1.b: "Cultivate [minister.GetName] as an [ShowTraitName('enlightenment_herald')]."
 cc_cond.1.c: "Develop [minister.GetName] as a [ShowTraitName('progressive_rationalist')]."
 cc_cond.1.d: "Embrace [minister.GetName] as a [ShowTraitName('revolutionary_herald')]."
 cc_cond.1.e: "Develop [minister.GetName] as [ShowTraitName('grand_architect')]."
 cc_cond.1.f: "Cultivate [minister.GetName] as an [ShowTraitName('arts_patron')]."
 cc_cond.1.g: "Make [minister.GetName] a [ShowTraitName('learned_courtier')]."
 cc_cond.1.h: "Develop [minister.GetName] as [ShowTraitName('reform_minded_counselor')]."
 cc_cond.1.i: "Direct [minister.GetName] as [ShowTraitName('urban_planner')]."
 cc_cond.1.j: "Encourage [minister.GetName] as [ShowTraitName('prosperity_herald')]."
 cc_cond.1.k: "Appoint [minister.GetName] as [ShowTraitName('merchant_syndic')]."
 cc_cond.1.dismiss: "The capital's growth will speak for itself."

 # ============================================================
 # cc_cond.3 — Military Specialist (Ages 1–4, mil > 33)
 # ============================================================
 cc_cond.3.title: "A Military Mind Emerges"
 cc_cond.3.desc: "[minister.GetName] has proven a capable military administrator. Their grasp of logistics, tactics, and organization distinguishes them from others at court. With proper direction, this talent can be put to specific use."
 cc_cond.3.a: "Direct [minister.GetName] as an [ShowTraitName('infantry_drillmaster')]."
 cc_cond.3.b: "Develop [minister.GetName] as a [ShowTraitName('scout_captain')]."
 cc_cond.3.c: "Cultivate [minister.GetName] as a [ShowTraitName('military_engineer')]."
 cc_cond.3.dismiss: "No direction needed now."

 # ============================================================
 # cc_cond.4 — Regional / Cultural / Religious Specialist
 # ============================================================
 cc_cond.4.title: "A Counselor of the World"
 cc_cond.4.desc: "[minister.GetName] has shown an unusual depth of knowledge when it comes to the customs, religions, and peoples around us. Their expertise could be developed further to serve specific ends."
 cc_cond.4.christian: "Guide [minister.GetName] as a [ShowTraitName('christian_diplomat')]."
 cc_cond.4.orthodox: "Develop [minister.GetName] as an [ShowTraitName('ecumenical_patriarch_advisor')]."
 cc_cond.4.muslim: "Direct [minister.GetName] as a [ShowTraitName('caliphate_diplomat')]."
 cc_cond.4.dharmic: "Cultivate [minister.GetName] as a [ShowTraitName('brahmin_counselor')]."
 cc_cond.4.buddhist: "Guide [minister.GetName] as a [ShowTraitName('dharma_minister')]."
 cc_cond.4.western_europe: "Shape [minister.GetName] as a [ShowTraitName('renaissance_patron')]."
 cc_cond.4.africa: "Develop [minister.GetName] as a [ShowTraitName('griot_diplomat')]."
 cc_cond.4.central_asia: "Cultivate [minister.GetName] as a [ShowTraitName('steppe_strategos')]."
 cc_cond.4.south_asia: "Guide [minister.GetName] as a [ShowTraitName('mughal_administrator')]."
 cc_cond.4.new_world: "Direct [minister.GetName] as a [ShowTraitName('new_world_pioneer')]."
 cc_cond.4.maritime: "Shape [minister.GetName] as a [ShowTraitName('maritime_champion')]."
 cc_cond.4.dismiss: "Their expertise will find its own path."

 # ============================================================
 # cc_cond.5 — Parliamentary / Diplomatic Specialist
 # ============================================================
 cc_cond.5.title: "A Diplomat of Rare Skill"
 cc_cond.5.desc: "[minister.GetName] has navigated the courts and assemblies of this realm with unusual grace. Their diplomatic instincts are sharp. How shall we develop them?"
 cc_cond.5.a: "Cultivate [minister.GetName] as a [ShowTraitName('parliamentary_broker')]."
 cc_cond.5.b: "Appoint [minister.GetName] as [ShowTraitName('diplomatic_attache')]."
 cc_cond.5.c: "Elevate [minister.GetName] as [ShowTraitName('grand_chancellor')]."
 cc_cond.5.dismiss: "Their skills will develop naturally."

 # ============================================================
 # cc_cond.6 — Advanced Military Specialist (Ages 5–6, mil > 66)
 # ============================================================
 cc_cond.6.title: "A Veteran Military Mind"
 cc_cond.6.desc: "[minister.GetName] is a seasoned commander whose instincts have been forged in decades of campaigning. This is not someone to waste on administrative routine. How shall we channel their gifts?"
 cc_cond.6.a: "Make [minister.GetName] a [ShowTraitName('commissariat_officer')]."
 cc_cond.6.b: "Appoint [minister.GetName] as [ShowTraitName('cavalry_marshal')]."
 cc_cond.6.c: "Develop [minister.GetName] as a [ShowTraitName('siege_engineer')]."
 cc_cond.6.d: "Elevate [minister.GetName] as [ShowTraitName('supreme_commander')]."
 cc_cond.6.dismiss: "Their gifts need no further shaping."

 # ============================================================
 # cc_cond.20 — Intellectual / Religious Cluster
 # ============================================================
 cc_cond.20.title: "A Counselor Shaped by the Age"
 cc_cond.20.desc: "[minister.GetName] has been formed by the intellectual and spiritual climate of this realm. Their convictions run deep. Which path best captures their nature?"
 cc_cond.20.innovative: "Develop [minister.GetName] as an [ShowTraitName('innovative_counselor')]."
 cc_cond.20.traditionalist: "Shape [minister.GetName] as a [ShowTraitName('traditionalist_guardian')]."
 cc_cond.20.spiritualist: "Cultivate [minister.GetName] as a [ShowTraitName('mystical_patriarch')]."
 cc_cond.20.humanist: "Guide [minister.GetName] as a [ShowTraitName('humanist_philosopher')]."
 cc_cond.20.mysticism: "Develop [minister.GetName] as a [ShowTraitName('mystical_counselor')]."
 cc_cond.20.jurisprudence: "Direct [minister.GetName] as a [ShowTraitName('legal_scholar')]."
 cc_cond.20.dismiss: "Their nature will manifest in time."
 cc_cond_dismiss_tt: "No trait and no experience. The minister is passed over for five months, and this cluster of questions is not raised again for twelve years."
 cc_cond_dismiss_short_tt: "No trait and no experience. The minister is passed over for five months."

 # ============================================================
 # cc_cond.21 — Social Order Cluster
 # ============================================================
 cc_cond.21.title: "A Counselor of the Social Order"
 cc_cond.21.desc: "[minister.GetName]'s thinking on the organization of society has been sharpened by the current political climate. Their beliefs are clear. How shall we direct them?"
 cc_cond.21.absolutist: "Cultivate [minister.GetName] as a [ShowTraitName('royal_absolutist')]."
 cc_cond.21.liberal: "Guide [minister.GetName] as a [ShowTraitName('liberal_reformer')]."
 cc_cond.21.centralized: "Develop [minister.GetName] as an [ShowTraitName('efficiency_administrator')]."
 cc_cond.21.decentralized: "Shape [minister.GetName] as a [ShowTraitName('regional_magnate')]."
 cc_cond.21.serfdom: "Appoint [minister.GetName] as [ShowTraitName('serf_overseer')]."
 cc_cond.21.free_subjects: "Elevate [minister.GetName] as [ShowTraitName('emancipation_minister')]."
 cc_cond.21.individualism: "Develop [minister.GetName] as [ShowTraitName('free_spirit_counselor')]."
 cc_cond.21.communalism: "Guide [minister.GetName] as a [ShowTraitName('community_steward')]."
 cc_cond.21.dismiss: "Their social vision will find expression elsewhere."

 # ============================================================
 # cc_cond.22 — Military Doctrine Cluster
 # ============================================================
 cc_cond.22.title: "A Military Philosophy Takes Form"
 cc_cond.22.desc: "[minister.GetName] has absorbed the military lessons of this realm's recent history. Their doctrinal convictions are now clear. How shall we develop them?"
 cc_cond.22.quality: "Shape [minister.GetName] as an [ShowTraitName('elite_trainer')]."
 cc_cond.22.quantity: "Direct [minister.GetName] as a [ShowTraitName('mass_levy_commander')]."
 cc_cond.22.offensive: "Cultivate [minister.GetName] as an [ShowTraitName('offensive_strategist')]."
 cc_cond.22.defensive: "Guide [minister.GetName] as a [ShowTraitName('defensive_commander')]."
 cc_cond.22.land: "Develop [minister.GetName] as a [ShowTraitName('continental_marshal')]."
 cc_cond.22.naval: "Shape [minister.GetName] as an [ShowTraitName('admiral_counselor')]."
 cc_cond.22.opt_belligerent: "Cultivate [minister.GetName] as a [ShowTraitName('hawk_minister')]."
 cc_cond.22.conciliatory: "Guide [minister.GetName] as a [ShowTraitName('peacemaker_counselor')]."
 cc_cond.22.dismiss: "Let doctrine take its own course."

 # ============================================================
 # cc_cond.23 — Economic Doctrine Cluster
 # ============================================================
 cc_cond.23.title: "An Economic Philosophy Emerges"
 cc_cond.23.desc: "[minister.GetName]'s economic convictions have crystallized. The markets, the estates, and the debates of the realm have shaped their thinking into something sharp and usable. How shall we deploy it?"
 cc_cond.23.aristocracy: "Cultivate [minister.GetName] as a [ShowTraitName('noble_champion')]."
 cc_cond.23.plutocracy: "Shape [minister.GetName] as a [ShowTraitName('merchant_prince')]."
 cc_cond.23.mercantilism: "Develop [minister.GetName] as a [ShowTraitName('mercantilist_official')]."
 cc_cond.23.free_trade: "Guide [minister.GetName] as a [ShowTraitName('free_market_advocate')]."
 cc_cond.23.capital_economy: "Direct [minister.GetName] as a [ShowTraitName('capitalist_minister')]."
 cc_cond.23.traditional_economy: "Shape [minister.GetName] as an [ShowTraitName('estate_guardian')]."
 cc_cond.23.dismiss: "Economic thinking will develop on its own."

 # ============================================================
 # cc_cond.24 — Expansion / Cultural Identity Cluster
 # ============================================================
 cc_cond.24.title: "A Vision of the Realm's Identity"
 cc_cond.24.desc: "[minister.GetName] has developed strong convictions about the realm's cultural direction and place in the world. Their perspective reflects the pull of this age. How shall we direct it?"
 cc_cond.24.outward: "Shape [minister.GetName] as an [ShowTraitName('expansionist_advisor')]."
 cc_cond.24.inward: "Cultivate [minister.GetName] as a [ShowTraitName('consolidation_minister')]."
 cc_cond.24.latinized: "Guide [minister.GetName] as a [ShowTraitName('roman_administrator')]."
 cc_cond.24.hellenized: "Develop [minister.GetName] as a [ShowTraitName('hellenistic_scholar')]."
 cc_cond.24.sinicized: "Shape [minister.GetName] as a [ShowTraitName('confucian_mandarin')]."
 cc_cond.24.unsinicized: "Direct [minister.GetName] as a [ShowTraitName('steppe_warlord_advisor')]."
 cc_cond.24.dismiss: "Cultural identity will speak for itself."

 # ============================================================
 # cc_cond.101 — Urban Ambitions Take Shape (follow-up to cc_cond.1 Tier 1)
 # ============================================================

 cc_cond.101.title: "Urban Ambitions Take Shape"
 cc_cond.101.desc: "[minister.GetName] has been at work since the crown recognized their gifts for urban governance. The capital has felt the effects — whether for better or worse depends on how the project unfolded."
 cc_cond.101.a: "Report the outcome to the crown."
