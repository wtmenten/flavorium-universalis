l_english:
 # === cc_bonds.20 — The Governor's First Annual Report ===
 cc_bonds.20.title: 0 "The Governor's First Annual Report"
 cc_bonds.20.desc: 0 "The governor of [bond_subj.GetName] has submitted his first full annual account of the province's affairs. Revenue figures are included alongside an assessment of local administration, public works, and the disposition of the population. He awaits instruction on how the Crown wishes to approach ongoing governance — whether with firm targets and close oversight, or with some latitude for local conditions."
 cc_bonds.20.a: 0 "Set strict revenue targets. The province must contribute its full share."
 cc_bonds.20.b: 0 "Allow flexible administration. Results matter more than method."
 cc_bonds.20.c: 0 "Establish an oversight council. Governance should be transparent."

 # === cc_bonds.21 — Provincial Road and Market ===
 cc_bonds.21.title: 0 "Provincial Road and Market"
 cc_bonds.21.desc: 0 "The governor of [bond_subj.GetName] submits a proposal: a new market road connecting the provincial interior to the coast, and a supervised market to rationalize local trade. The project would take several years to complete and requires capital. The economic benefits are real — the question is who bears the cost."
 cc_bonds.21.a: 0 "Let the province fund it from local revenues."
 cc_bonds.21.b: 0 "The Crown will provide the capital."
 cc_bonds.21.c: 0 "Table the proposal. We have more pressing concerns."

 # === cc_bonds.22 — The Governor's Military Levy ===
 cc_bonds.22.title: 0 "The Governor's Military Levy"
 cc_bonds.22.desc: 0 "The governor of [bond_subj.GetName] has been asked to assess the province's military capacity. His report is candid: the men are there, but conscripting them will disrupt agricultural labor at a critical season, and the province has its own security concerns. He can raise the troops if ordered. He is asking whether that is truly what we want."
 cc_bonds.22.a: 0 "Raise the full levy. The province must answer the Crown's call."
 cc_bonds.22.b: 0 "Offer voluntary service with compensation. Spare the unwilling."
 cc_bonds.22.c: 0 "Do not raise troops from this province at this time."

 # === cc_bonds.23 — Governor's Son Seeks Appointment ===
 cc_bonds.23.title: 0 "Governor's Son Seeks Appointment"
 cc_bonds.23.desc: 0 "Word reaches us that the governor of [bond_subj.GetName] has a son of suitable age for a court appointment — well-educated, well-connected within provincial circles, and clearly his father's choice for advancement. The request is not explicit, but it is unmistakable. Whether we view this as an opportunity or an imposition depends on how we approach the relationship with the province."
 cc_bonds.23.a: 0 "Find the young man a suitable position at court."
 cc_bonds.23.b: 0 "Appointments are made on merit. Let him apply through proper channels."
 cc_bonds.23.c: 0 "Ignore the implicit request."

 # === cc_bonds.24 — Provincial Legal Customs Conflict ===
 cc_bonds.24.title: 0 "Provincial Legal Customs Conflict"
 cc_bonds.24.desc: 0 "The provincial courts of [bond_subj.GetName] operate under a body of local custom that predates Crown administration by several generations. Crown lawyers argue this inconsistency undermines legal authority and complicates administration. Provincial leaders counter that their customs are legitimate, functional, and deeply embedded in local life. A conflict over a disputed inheritance case has forced the question."
 cc_bonds.24.a: 0 "Standardize crown law across the province. One law for all."
 cc_bonds.24.b: 0 "Codify a hybrid system. Preserve what functions, integrate what must."
 cc_bonds.24.c: 0 "Formally recognize local customs. Their law is their own."

 # === cc_bonds.25 — The Governor Petitions for Permanence ===
 cc_bonds.25.title: 0 "The Governor Petitions for Permanence"
 cc_bonds.25.desc: 0 "The current governor of [bond_subj.GetName] has served two full terms and is nearing the end of his third. His petition arrives with considerable support — from provincial nobles, from local clergy, from merchants who have grown comfortable with his administration. He asks to be confirmed as hereditary governor, his family to hold the office in perpetuity. The request is flattering. It is also consequential."
 cc_bonds.25.a: 0 "Grant the hereditary governorship. His service has earned it."
 cc_bonds.25.b: 0 "Maintain the crown rotation system. No hereditary offices."
 cc_bonds.25.c: 0 "Extend his current term considerably. A compromise."

 # === cc_bonds.26 — Corruption Reports ===
 cc_bonds.26.title: 0 "Corruption Reports"
 cc_bonds.26.desc: 0 "Confidential reports have reached us suggesting that certain officials in [bond_subj.GetName] have been supplementing their salaries through irregular means — inflated contracts, diverted tax receipts, preferential licensing. The amounts are not ruinous, and the governor himself is either unaware or deliberately uninformed. But the drain is real, and our response will set a precedent."
 cc_bonds.26.a: 0 "Ignore the reports. A degree of corruption is the cost of administration."
 cc_bonds.26.b: 0 "Commission a full audit. Those responsible will be held accountable."
 cc_bonds.26.c: 0 "Send a private gift to the governor. Encourage discretion."
