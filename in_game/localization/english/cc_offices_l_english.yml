 cc_office.10.title: "The Household Accounts"
 cc_office.10.desc: "They have been through the household accounts. Money has been leaking out of the kitchens and stables for years, and the people taking it are well connected."
 cc_office.10.a: "Stop it, whoever it offends."
 cc_office.10.b: "Quietly, and without names."
 cc_office.10.c: "Let them reorganise the household."
 cc_office.11.title: "A Quarrel over Precedence"
 cc_office.11.desc: "They are at odds with the great families over who walks first at court, and both sides expect the crown to settle it."
 cc_office.11.a: "Back the officer."
 cc_office.11.b: "Back the families."
 cc_office.11.c: "Their long service settles it."
 cc_office.12.title: "A Sermon at Court"
 cc_office.12.desc: "They preached before the whole court, and the sermon is being repeated in every church in the capital."
 cc_office.12.a: "Have it printed."
 cc_office.12.b: "A good sermon. Nothing more."
 cc_office.12.c: "Have them preach it across the realm."
 cc_office.13.title: "A Matter of Conscience"
 cc_office.13.desc: "They have refused to endorse a decision of the crown, and say so openly."
 cc_office.13.a: "Overrule them."
 cc_office.13.b: "Give way."
 cc_office.13.c: "They have earned a hearing."
 cc_office.14.title: "Petitions Pile Up"
 cc_office.14.desc: "Petitions to the crown are piling up in their office faster than they can be read."
 cc_office.14.a: "Clear them, however long it takes."
 cc_office.14.b: "Let them wait."
 cc_office.14.c: "Have them reform the procedure."
 cc_office.15.title: "An Inspection of the Offices"
 cc_office.15.desc: "They want to inspect every office under them, and the clerks have heard."
 cc_office.15.a: "Inspect them all."
 cc_office.15.b: "A warning will do."
 cc_office.15.c: "Trust them to know where to look."
 cc_office.16.title: "A Festival at Court"
 cc_office.16.desc: "They propose a festival in the old manner, with music, plays and a great deal of food."
 cc_office.16.a: "Spare no expense."
 cc_office.16.b: "Keep it modest."
 cc_office.16.c: "Let them arrange it."
 cc_office.17.title: "A Foreign Fashion"
 cc_office.17.desc: "They have taken up a fashion from abroad, and half the court has followed. The other half is offended."
 cc_office.17.a: "Adopt it at court."
 cc_office.17.b: "Forbid it."
 cc_office.17.c: "They know what will last."
 cc_office.18.title: "News from the Frontier"
 cc_office.18.desc: "They bring news from the frontier provinces: unrest, bad harvests, and officials nobody has checked on in years."
 cc_office.18.a: "Act on it now."
 cc_office.18.b: "File it for later."
 cc_office.18.c: "Send them to deal with it."
 cc_office.19.title: "The Provincial Notables"
 cc_office.19.desc: "They have brought a delegation of provincial notables to court, who want to be heard."
 cc_office.19.a: "Receive them with honour."
 cc_office.19.b: "Send them home."
 cc_office.19.c: "They know these people."
