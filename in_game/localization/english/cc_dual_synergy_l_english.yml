l_english:
 # ============================================================
 # DUAL-LAYER SYNERGY EVENTS (cc_dual namespace)
 # Cabinet × Religious_Figure pair events
 # ============================================================

 cc_dual.1.title: "The Warrior Mystic"
 cc_dual.1.desc: "[minister.GetName] is a contradiction that the age has made possible: a cavalry commander of genuine skill whose Sufi practice has deepened rather than divided [minister.GetHerHis] understanding of war. The blade and the prayer are, in [minister.GetHerHis] hands, expressions of the same discipline."
 cc_dual.1.a: "This is a commander like no other. Let their duality become our strength."
 cc_dual.1.b: "The conversion of conquered territory is where their spiritual energy is best directed."

 cc_dual.2.title: "The Sacred Diplomat"
 cc_dual.2.desc: "In the Byzantine tradition, the sacred and the diplomatic were never separate — the patriarch's robes and the chancellor's seal shared the same anteroom. [minister.GetName] has revived that synthesis: their religious authority and diplomatic capacity speak with one voice, and the courts they visit have learned to listen."
 cc_dual.2.a: "This is statecraft as it was once practiced. Let it work."
 cc_dual.2.b: "Deploy them where conversion and diplomacy are most needed."

 cc_dual.3.title: "The Rational Theologian"
 cc_dual.3.desc: "[minister.GetName] refuses the choice between reason and faith. The great Islamic philosophers refused it. So did the Scholastics. So does [minister.GetHerHim]: a mind trained in Enlightenment inquiry applied to questions of doctrine. The institutions this minister creates are stronger for holding both traditions."
 cc_dual.3.a: "This synthesis is exactly what the age needs. Let them work."
 cc_dual.3.b: "Their philosophical clarity has revealed something larger — the foundations of a philosopher's court."
 cc_dual.3.b.tt: "Unlocks the Philosopher's Court government reform."

 cc_dual.4.title: "The Protestant Parliament"
 cc_dual.4.desc: "The Reformation redrew the map of faith and governance simultaneously. [minister.GetName] stands at that intersection: a parliamentary operator whose reformist theology gives [minister.GetHerHis] legislative work a moral seriousness that purely transactional politics lacks. The chamber has noticed."
 cc_dual.4.a: "Let their reformed faith strengthen the parliament's foundations."
 cc_dual.4.b: "The clergy's satisfaction is the more immediate need — direct their energy there."

 cc_dual.5.title: "Heaven's Mandate"
 cc_dual.5.desc: "The Confucian scholar who also carries prophetic gifts is a figure the classical tradition respected and feared. [minister.GetName] has both: the meritocratic discipline of examination culture and the oracular authority that makes courts quieter when they speak. The mandate of heaven, they say, passes to those who can read both its administrative and its mystical dimensions."
 cc_dual.5.a: "This is the Confucian synthesis — learning and heaven's blessing together."
 cc_dual.5.b: "Their gifts point toward something greater — the foundations of the Middle Kingdom."
 cc_dual.5.b.tt: "Unlocks the path to the Middle Kingdom legend quest."

 cc_dual.6.title: "The Law and the Letter"
 cc_dual.6.desc: "Most courts make the practical administrator and the scriptural jurist into rivals. [minister.GetName] has refused that rivalry. Their efficient administration is grounded in a reading of sacred law as the original source of good governance. Reform, for them, is not departure from tradition — it is return to it."
 cc_dual.6.a: "Law and scripture together are a more stable foundation than either alone."
 cc_dual.6.b: "Their ministerial investment speaks for itself."

 cc_dual.7.title: "The Reluctant Sword"
 cc_dual.7.desc: "[minister.GetName] is a defensive commander who would rather not be. Their practice as a hermit — or their temperament as one — has given their military counsel an unusual quality: they design fortifications excellently because they genuinely wish they would never have to be used. War exhaustion troubles them more than most."
 cc_dual.7.a: "A general who prefers peace is still a general. Let them work."
 cc_dual.7.b: "Their desire for peace should be channeled into diplomacy."

 cc_dual.8.title: "The Pious Treasurer"
 cc_dual.8.desc: "The defterdar manages the empire's finances; the ascetic seeks to detach from them. [minister.GetName] has made peace with this tension by treating financial management as a spiritual discipline: waste is sin, efficiency is virtue, and the clergy can be satisfied precisely because this minister refuses to enrich themselves at the faith's expense."
 cc_dual.8.a: "Financial discipline and spiritual conviction together — the realm benefits."
 cc_dual.8.b: "The clergy's satisfaction and a modest ministerial investment are the practical fruits."

 cc_dual.9.title: "The Knight of God"
 cc_dual.9.desc: "In the chivalric ideal, the martial and the spiritual were not contradictions — they were the same virtue expressed in different registers. [minister.GetName] has lived this ideal: a noble champion who is also the court chaplain, whose sword-arm and pastoral authority speak the same language of sacred service."
 cc_dual.9.a: "The chivalric ideal is alive in this minister. Let it inspire the nobility."
 cc_dual.9.b: "Their spiritual gifts are better directed toward the clergy and the faith."

 cc_dual.10.title: "A Crisis of Faith"
 cc_dual.10.desc: "[minister.GetName] has arrived at an impossible position: the Grand Inquisitor's authority requires the suppression of precisely the reformist questioning that [minister.GetHerHis] reformist theology endorses. The contradiction has become visible. The court watches to see which conviction wins."
 cc_dual.10.a: "Suppress the doubt — the Inquisitor's role demands certainty."
 cc_dual.10.b: "Let the contradiction resolve — both convictions yield to something larger."
 cc_dual.10.b.tt: "The minister loses both traits. A synthesizing Crown Theologian emerges."
 cc_dual.10.c: "Dismiss [minister.GetHerHim] before the conflict spreads."
