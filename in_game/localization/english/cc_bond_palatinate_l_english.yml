l_english:
 # === cc_bonds.30 — The Palatinate Lord's First Homage ===
 cc_bonds.30.title: "The Palatinate Lord's First Homage"
 cc_bonds.30.desc: "The lord of [bond_subj.GetName] awaits confirmation of his position under the new arrangement. The question before us is one of ceremony: will we receive his oath in a formal public setting that announces to the world the nature of our relationship, or handle matters with the quiet discretion of private protocol? The choice seems administrative. It is not."
 cc_bonds.30.a: "A grand ceremony. Let all the court witness his fealty."
 cc_bonds.30.b: "A private oath. Formalities observed, without the theater."
 cc_bonds.30.c: "Waive the ceremony entirely. We know where his loyalties lie."

 # === cc_bonds.31 — Noble Marriage Alliance ===
 cc_bonds.31.title: "Noble Marriage Alliance"
 cc_bonds.31.desc: "The palatinate lord has raised the question of a marriage between his house and ours — or at minimum between a member of his family and a suitable partner in our court circles. The connection would be visible, dynastic, and binding in the way only blood can bind. Whether we view this as an opportunity or a complication reveals something about how we see the relationship."
 cc_bonds.31.a: "Arrange the marriage. Dynasties are built through family."
 cc_bonds.31.b: "Decline. The time is not right."
 cc_bonds.31.c: "The lord may arrange his own family's affairs."

 # === cc_bonds.32 — Military Service Demand ===
 cc_bonds.32.title: "Military Service Demand"
 cc_bonds.32.desc: "We are in need of additional forces, and the palatinate of [bond_subj.GetName] commands a substantial body of trained nobles and their retinues. The lord has always fulfilled his obligations, but the question is how we approach the request — as an order, as an offer, or as something we ask of him at all. He will notice the difference."
 cc_bonds.32.a: "Call the full noble levy. Service is owed."
 cc_bonds.32.b: "Request voluntary service and provide compensation."
 cc_bonds.32.c: "Exempt the palatinate from this levy. Their security matters too."

 # === cc_bonds.33 — Palatinate Church Appointment ===
 cc_bonds.33.title: "Palatinate Church Appointment"
 cc_bonds.33.desc: "The bishopric within [bond_subj.GetName] falls vacant. The lord has already made informal inquiries about his preferred candidate — a man of local standing and clear palatinate loyalties. Our own ecclesiastical advisors have a different name in mind: a crown loyalist whose appointment would extend our influence into the palatinate's spiritual life. The choice will not go unnoticed by either side."
 cc_bonds.33.a: "The Crown appoints the bishop. This is our prerogative."
 cc_bonds.33.b: "Let the lord nominate. This is his diocese."
 cc_bonds.33.c: "A joint approval process. Both parties have a say."

 # === cc_bonds.34 — The Border Dispute ===
 cc_bonds.34.title: "The Border Dispute"
 cc_bonds.34.desc: "The lord of [bond_subj.GetName] writes in evident frustration. A neighboring noble house has moved boundary markers and disputed grazing rights along the palatinate's eastern edge. He asks for our backing — a formal letter, a legal declaration, some signal that the Crown stands behind his claim. The neighboring house also has connections at court. Neither outcome is without cost."
 cc_bonds.34.a: "Back the lord fully. Write the letter. Make the declaration."
 cc_bonds.34.b: "Require both parties to settle through formal arbitration."
 cc_bonds.34.c: "Stay out of it. Local disputes resolve themselves."

 # === cc_bonds.35 — The Palatinate Asks for Tax Relief ===
 cc_bonds.35.title: "The Palatinate Asks for Tax Relief"
 cc_bonds.35.desc: "A difficult harvest season and several years of military obligations have strained the palatinate of [bond_subj.GetName]. The lord writes with careful dignity — not pleading, but clearly asking — for a temporary reduction in the tax burden his nobles are expected to carry. The request is reasonable by any measure. The precedent it sets is what concerns our advisors."
 cc_bonds.35.a: "Grant the relief. They have served faithfully and deserve it."
 cc_bonds.35.b: "Deny the request. Obligations cannot be renegotiated by circumstance."
 cc_bonds.35.c: "Offer a modest temporary reduction."

 # === cc_bonds.36 — The Old Lord Dies ===
 cc_bonds.36.title: "The Old Lord Dies"
 cc_bonds.36.desc: "The palatinate lord of [bond_subj.GetName] has died. He served long and without significant incident, and his heir — known to us, prepared by his father — is ready to receive the title. The succession is procedurally straightforward. What is not straightforward is the financial settlement: the palatinate estate is substantial, and the question of how we approach the transition will set the terms of the new lord's first impression of the Crown."
 cc_bonds.36.a: "Confirm the heir graciously and waive all succession duties."
 cc_bonds.36.b: "Demand the full inheritance tax before confirming the succession."
 cc_bonds.36.c: "Use the interregnum to review the palatinate's arrangement."
