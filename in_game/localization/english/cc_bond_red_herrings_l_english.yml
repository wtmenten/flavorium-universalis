l_english:
 # ===== RED HERRING EVENTS — cc_bonds.70–89 =====
 # False positives fire after secretly bad choices. False negatives after good ones.

 # === cc_bonds.70 — False Positive (generic — works for colony and march) ===
 cc_bonds.70.title: "Gratitude from the Frontier"
 cc_bonds.70.desc: "A dispatch arrives reporting that the recent arrangements have been received with surprising warmth. The local administration appears to be functioning smoothly, and several figures of note have expressed satisfaction with how matters have been handled. The reports are glowing — perhaps even unexpectedly so."
 cc_bonds.70.a: "Good. These arrangements serve everyone well."

 # === cc_bonds.71 — False Positive (spoils / extraction) ===
 cc_bonds.71.title: "No Complaints Reported"
 cc_bonds.71.desc: "Our envoys have returned from [bond_subj.GetName] with an unremarkable report. The distribution of recent proceeds has been accepted without formal protest. No petitions have been filed; no grievances have been raised through official channels. The matter appears to be closed."
 cc_bonds.71.a: "As it should be."

 # === cc_bonds.72 — False Positive (dismissal / replacement) ===
 cc_bonds.72.title: "Stability Restored"
 cc_bonds.72.desc: "Reports from [bond_subj.GetName] suggest that the recent measures have had the desired effect. Whatever tensions existed have apparently dissipated, and observers describe the situation as calm and orderly. The decision appears to have been the right one."
 cc_bonds.72.a: "The matter is settled, then."

 # === cc_bonds.73 — False Positive (refusal / reassignment) ===
 cc_bonds.73.title: "A Letter of Cooperation"
 cc_bonds.73.desc: "An unexpectedly gracious message has arrived from [bond_subj.GetName]. The ruling house acknowledges the Crown's decision, expresses no resentment, and reaffirms their commitment to the arrangement. The tone is warm. The dispatch contains no subtext that our secretaries can detect."
 cc_bonds.73.a: "A pleasing response."

 # === cc_bonds.74 — False Positive (colonial militia disbandment) ===
 cc_bonds.74.title: "Order Fully Restored"
 cc_bonds.74.desc: "The colonial administration has filed a comprehensive report on the aftermath of the militia suppression. Order has been restored throughout the colony; no further incidents have been recorded; the population appears to have returned to ordinary affairs. The governor praises the Crown's decisive action."
 cc_bonds.74.a: "The situation is well in hand."

 # === cc_bonds.75 — False Negative (flexible administration — the good choice) ===
 cc_bonds.75.title: "Concerns at Court"
 cc_bonds.75.desc: "Several of our more traditional advisors have expressed quiet reservations about the flexible administrative arrangements extended to [bond_subj.GetName]. One memorandum, circulated among the council, suggests that leniency in administration is difficult to walk back once established. The concern is noted. Whether it reflects reality or conservative anxiety is less clear."
 cc_bonds.75.a: "Noted. We will watch the situation."

 # === cc_bonds.76 — False Negative (no levy — the good choice) ===
 cc_bonds.76.title: "Murmurs of Emboldened Subjects"
 cc_bonds.76.desc: "Rumor has it that the decision not to levy troops from [bond_subj.GetName] has been interpreted by some observers as weakness. One report — we are told it is not widely held — suggests that the governor has begun to 'test the limits of what the Crown will demand.' Our secretaries cannot confirm this. It may simply be the usual court gossip."
 cc_bonds.76.a: "Speculation. We stand by our decision."

 # === cc_bonds.77 — False Positive (merit appointment — the worse choice) ===
 cc_bonds.77.title: "The Appointment Is Well Received"
 cc_bonds.77.desc: "Our merit-based appointment to the provincial post has been praised in several dispatches as a model of good governance. The appointee has made a favorable first impression on local administrators. The governor's household has not raised any formal objections. The appointment appears to have satisfied all parties."
 cc_bonds.77.a: "Merit speaks for itself."

 # === cc_bonds.78 — False Negative (preserve local customs — the good choice) ===
 cc_bonds.78.title: "Nobles Question the Leniency"
 cc_bonds.78.desc: "Several prominent voices in the noble estate have questioned the Crown's decision to preserve local customs in [bond_subj.GetName]. Their argument is one of administrative principle: inconsistency weakens the authority of Crown law. The criticism is formal and courteous but pointed. We are left to determine whether this is a substantive concern or the predictable friction of any reform."
 cc_bonds.78.a: "The nobles voice their opinion. We have made our choice."

 # === cc_bonds.79 — False Positive (waive palatinate ceremony) ===
 cc_bonds.79.title: "The Lord Proves Himself"
 cc_bonds.79.desc: "Whatever reservations the palatinate lord may have had about the simplified investiture, he has not let them show. In the months since, he has handled several difficult local matters with efficiency and loyalty. Our envoy reports him as 'entirely engaged in his duties.' If the lack of ceremony left any mark, it is not visible from the outside."
 cc_bonds.79.a: "Good. Substance matters more than ceremony."

 # === cc_bonds.80 — False Negative (palatinate levy exemption — the good choice) ===
 cc_bonds.80.title: "Rumors of an Emboldened Palatinate"
 cc_bonds.80.desc: "Word has reached us — through informal channels — that the decision to exempt [bond_subj.GetName] from the recent levy has been interpreted as hesitation. One courtier suggests the palatinate lord has been 'emboldened.' The source is not entirely reliable, and the claim has not been corroborated, but it is the sort of rumor that lingers if we do not address it."
 cc_bonds.80.a: "We will see how the lord conducts himself."

 # === cc_bonds.81 — False Positive (ignore palatinate border dispute) ===
 cc_bonds.81.title: "The Dispute Resolves Quietly"
 cc_bonds.81.desc: "Our secretaries have filed a brief note: the boundary dispute involving [bond_subj.GetName] appears to have subsided without Crown intervention. The parties have reached some informal accommodation. Our neutrality has not, apparently, created any visible difficulty."
 cc_bonds.81.a: "As we expected."

 # === cc_bonds.82 — False Negative (temporary tax relief — the sensible choice) ===
 cc_bonds.82.title: "The Lord Asks for More"
 cc_bonds.82.desc: "The palatinate lord has sent a follow-up communication. While he expressed gratitude for the temporary relief in his initial response, he now asks whether there is any possibility of extending the arrangement. The request is framed carefully, but its meaning is plain: he has taken the gesture as an invitation to negotiate. Our advisors are divided on whether this is opportunism or reasonable expectation."
 cc_bonds.82.a: "We will respond in due course."

 # === cc_bonds.83 — False Positive (refuse puppet ambassador) ===
 cc_bonds.83.title: "The Puppet Accepts the Arrangement"
 cc_bonds.83.desc: "The government of [bond_subj.GetName] has acknowledged our decision regarding the embassy request. Their response is formal and measured — no protest, no public statement, no withdrawal of cooperation on any active matter. To all appearances, they have accepted the arrangement and moved on."
 cc_bonds.83.a: "Settled."

 # === cc_bonds.84 — False Positive (ignore puppet faction dispute) ===
 cc_bonds.84.title: "The Faction Tension Eases"
 cc_bonds.84.desc: "Reports from [bond_subj.GetName] indicate that the internal faction dispute has quieted considerably over recent months. No single faction has emerged dominant, but neither has the situation escalated. Observers describe the political situation as 'stable.' Our neutrality appears to have avoided inflaming either side."
 cc_bonds.84.a: "Sometimes restraint is the wisest policy."

 # === cc_bonds.85 — False Positive (forbid puppet military expansion) ===
 cc_bonds.85.title: "The Directive Is Accepted"
 cc_bonds.85.desc: "The government of [bond_subj.GetName] has formally acknowledged the Crown's decision on military expansion. Their reply is cooperative in tone; they express no public disagreement and have made no visible effort to pursue alternative arrangements. The matter appears closed on their end."
 cc_bonds.85.a: "They understood the message."

 # === cc_bonds.86 — False Positive (send formal letter instead of visiting) ===
 cc_bonds.86.title: "A Warm Reply"
 cc_bonds.86.desc: "Our letter to [bond_subj.GetName] has been received and acknowledged. The ruling house has responded with gracious courtesy, thanking the Crown for its attention to the occasion and expressing that the gesture was appreciated. The reply runs to three pages and could not be more cordial. Whether the cordiality is genuine or diplomatic is difficult to say from a letter."
 cc_bonds.86.a: "The formalities are satisfied."

 # === cc_bonds.87 — False Positive (exclude dependency from royal ceremony) ===
 cc_bonds.87.title: "A Letter of Congratulation"
 cc_bonds.87.desc: "The ruling house of [bond_subj.GetName] has sent a thoughtful letter of congratulation for the recent royal occasion. They do not mention their absence. The letter is warm in its language and includes a gift. Our chamberlain notes that the gift is somewhat more modest than in previous years — but offers no interpretation."
 cc_bonds.87.a: "The occasion was a success."

 # === cc_bonds.88 — False Negative (dependency mobilizes on their own) ===
 cc_bonds.88.title: "The Dependency Mobilizes"
 cc_bonds.88.desc: "Reports from [bond_subj.GetName] describe an impressive local mobilization in response to the border threat. The ruling house has levied forces, reinforced their frontier positions, and repelled the initial incursion without our direct involvement. Observers are describing it as a demonstration of resilience. What they are not discussing — at least not in the dispatches we receive — is how they felt about handling it alone."
 cc_bonds.88.a: "They managed. Good."

 # === cc_bonds.89 — False Positive (refuse dependency succession consultation) ===
 cc_bonds.89.title: "The Prerogative Accepted"
 cc_bonds.89.desc: "The ruling house of [bond_subj.GetName] has acknowledged our decision on the succession consultation question. Their formal reply affirms the Crown's prerogative in these matters and withdraws the petition without further comment. There is nothing in the language to suggest resentment. Our secretaries describe the tone as 'entirely proper.'"
 cc_bonds.89.a: "As it should be. Succession is not their concern."
