 # ============================================================
 # CABINET TRAIT — Federal Architect
 # ============================================================

 federal_architect: "Federal Architect"
 desc_federal_architect: "Shaped by the challenges of governing an empire through consent rather than compulsion, this advisor has dedicated their career to the theory and practice of federal governance. They understand how to hold a diverse empire together — how to grant enough autonomy that subjects feel invested, while maintaining enough integration that the whole is greater than its parts."
 federal_architect_die_desc: "The careful work of federal construction they maintained will need many hands to continue. Some of what they built will last. Some will depend entirely on who comes next."

 # cc_traits.40 event text
 cc_traits.40.title: "An Architect of the Federal Order"
 cc_traits.40.desc: "[minister.GetName] has spent their career watching the empire struggle to hold its diverse territories together — the colonies that demand more, the dependencies that resent less, the clients who take every concession as an invitation for the next demand. Where most advisors see this as a problem of authority, [minister.GetName] sees it as a problem of design. They have been drafting something: a framework for governing through consent rather than coercion, for building federal structures that are durable because they are genuinely shared. They are asking if the court is ready to think seriously about the empire's future."
 cc_traits.40.a: "Yes. Appoint [minister.GetName] as [ShowTraitName('federal_architect')] and commission the work."
 cc_traits.40.b: "The empire is held together by authority, not constitutions. Not yet."

 # ============================================================
 # MODIFIER NAMES — Imperial Federalization
 # ============================================================

 STATIC_MODIFIER_NAME_cc_federal_union_solidarity: "Federal Union Solidarity"
 STATIC_MODIFIER_DESC_cc_federal_union_solidarity: "A federal member has affirmed their commitment to the union at a moment of crisis. The demonstration of shared loyalty strengthens the empire's standing."

 STATIC_MODIFIER_NAME_cc_false_federation_exposed: "Exposed Deception"
 STATIC_MODIFIER_DESC_cc_false_federation_exposed: "The gap between the promises of federal membership and its reality has become undeniable. The empire's credibility as a partner — with this territory and others watching — has been damaged."

 STATIC_MODIFIER_NAME_cc_synergy_federal_compact: "Federal Compact"
 STATIC_MODIFIER_DESC_cc_synergy_federal_compact: "The federal parliament has been formalized through a constitutional compact — a shared framework that gives members a genuine stake in the empire's governance."
