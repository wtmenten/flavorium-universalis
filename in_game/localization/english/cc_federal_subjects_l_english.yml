 # ============================================================
 # SUBJECT TYPE UI KEYS — Imperial Federalization
 # ============================================================

 imperial_council_member: "Imperial Council Member"
 LEAD_imperial_council_member: "Federal Overlord"
 AM_imperial_council_member: "Imperial Council Member"
 CANCEL_imperial_council_memberTITLE: "Dissolve Council Membership"
 CANCEL_imperial_council_member_DESC: "Withdraw the invitation to the Imperial Council, ending the advisory relationship and returning full independence to the former member."

 equal_federal_member: "Federal Member"
 LEAD_equal_federal_member: "Federal Parliament"
 AM_equal_federal_member: "Federal Member"
 CANCEL_equal_federal_memberTITLE: "Dissolve Federal Membership"
 CANCEL_equal_federal_member_DESC: "Dissolve the federal compact, severing the legislative and military partnership. The member realm will not forget that the promise of equality was rescinded."

 lesser_federal_member: "Associate Member"
 LEAD_lesser_federal_member: "Federal Parliament"
 AM_lesser_federal_member: "Associate Member"
 CANCEL_lesser_federal_memberTITLE: "Withdraw Associate Status"
 CANCEL_lesser_federal_member_DESC: "End the associate membership arrangement, returning the realm to its prior status. The resentments built by second-class treatment are not so easily dissolved."

 false_federal_member: "Federal Charter Holder"
 LEAD_false_federal_member: "Charter Authority"
 AM_false_federal_member: "Charter Holder"
 CANCEL_false_federal_memberTITLE: "Revoke Federal Charter"
 CANCEL_false_federal_member_DESC: "Revoke the federal charter, ending the arrangement. The populations who were promised equal membership and received extraction instead will not be inclined toward gratitude."

 # Upgrade tooltip strings
 federal_member_upgrade_tt: "This member was recently admitted to the Council — the constitutional machinery for a full federal upgrade is still being established."
 lesser_federal_member_upgrade_tt: "This member was recently admitted to the Council — the constitutional machinery for a full federal upgrade is still being established."

 # ============================================================
 # ADVANCES — Imperial Federalization
 # ============================================================

 colonial_assembly_advance: "Colonial Assemblies"
 colonial_assembly_advance_desc: "Establish representative assemblies in our colonial territories, giving local leadership a formal voice in imperial governance. The first step toward a more durable relationship with the colonies."

 federal_constitution_advance: "Federal Constitution"
 federal_constitution_advance_desc: "Draft a constitutional framework for imperial federation, granting colonial assemblies legislative standing within a broader federal parliament. Opens the path to imperial council membership and full federal union."

 imperial_trade_compact_advance: "Imperial Trade Compact"
 imperial_trade_compact_advance_desc: "Formalize an empire-wide preferential trade zone, binding the colonies to the metropole through shared commercial interest. The language of partnership obscures the language of profit."

 false_federal_charter_advance: "Federal Charter"
 false_federal_charter_advance_desc: "Issue federal charters to existing colonial and client territories — documents that promise the rights of membership while preserving the mechanics of extraction. The federation in name; an empire in fact."

 # ============================================================
 # CABINET TRAIT — Federal Architect
 # ============================================================

 federal_architect: "Federal Architect"
 desc_federal_architect: "Shaped by the challenges of governing an empire through consent rather than compulsion, this advisor has dedicated their career to the theory and practice of federal governance. They understand how to hold a diverse empire together — how to grant enough autonomy that subjects feel invested, while maintaining enough integration that the whole is greater than its parts."
 federal_architect_die_desc: "The careful work of federal construction they maintained will need many hands to continue. Some of what they built will last. Some will depend entirely on who comes next."

 # cc_traits.40 event text
 cc_traits.40.title: 0 "An Architect of the Federal Order"
 cc_traits.40.desc: 0 "[minister.GetName] has spent their career watching the empire struggle to hold its diverse territories together — the colonies that demand more, the dependencies that resent less, the clients who take every concession as an invitation for the next demand. Where most advisors see this as a problem of authority, [minister.GetName] sees it as a problem of design. They have been drafting something: a framework for governing through consent rather than coercion, for building federal structures that are durable because they are genuinely shared. They are asking if the court is ready to think seriously about the empire's future."
 cc_traits.40.a: 0 "Yes. Appoint [minister.GetName] as Federal Architect and commission the work."
 cc_traits.40.b: 0 "The empire is held together by authority, not constitutions. Not yet."

 # ============================================================
 # MODIFIER NAMES — Imperial Federalization
 # ============================================================

 STATIC_MODIFIER_NAME_cc_federal_union_solidarity: "Federal Union Solidarity"
 STATIC_MODIFIER_DESC_cc_federal_union_solidarity: "A federal member has affirmed their commitment to the union at a moment of crisis. The demonstration of shared loyalty strengthens the empire's standing."

 STATIC_MODIFIER_NAME_cc_false_federation_exposed: "Exposed Deception"
 STATIC_MODIFIER_DESC_cc_false_federation_exposed: "The gap between the promises of federal membership and its reality has become undeniable. The empire's credibility as a partner — with this territory and others watching — has been damaged."

 STATIC_MODIFIER_NAME_cc_synergy_federal_compact: "Federal Compact"
 STATIC_MODIFIER_DESC_cc_synergy_federal_compact: "The federal parliament has been formalized through a constitutional compact — a shared framework that gives members a genuine stake in the empire's governance."
