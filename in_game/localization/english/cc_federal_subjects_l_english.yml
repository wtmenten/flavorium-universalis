 # ============================================================
 # ADVANCES — Imperial Federalization
 # ============================================================

 colonial_assembly_advance: "Colonial Assemblies"
 colonial_assembly_advance_desc: "Establish representative assemblies in our colonial territories, giving local leadership a formal voice in imperial governance. The first step toward a more durable relationship with the colonies."

 federal_constitution_advance: "Federal Constitution"
 federal_constitution_advance_desc: "Draft a constitutional framework for imperial federation, granting colonial assemblies legislative standing within a broader federal parliament. Opens the path to imperial council membership and full federal union."

 imperial_trade_compact_advance: "Imperial Trade Compact"
 imperial_trade_compact_advance_desc: "Formalize an empire-wide preferential trade zone, binding the colonies to the metropole through shared commercial interest. The language of partnership obscures the language of profit."

 false_federal_charter_advance: "Federal Charter"
 false_federal_charter_advance_desc: "Issue federal charters to existing colonial and client territories. These documents promise the rights of membership while preserving the mechanics of extraction. A federation in name; an empire in fact."

