 cc_xp_tt_needs_pupil: "Requires a junior minister, a protege, or a courtier of the crown estate"

 # ============================================================
 # Cabinet Experience — empty selector messages
 #
 # A select_trigger with no ENABLED candidate disables the interaction on its own,
 # entirely outside the allow block, and says nothing unless none_available_msg_key
 # names a string. That silence is what made several court buttons grey out with a
 # tooltip containing nothing but a title and a price.
 # ============================================================
 cc_xp_none_presider: "@trigger_no! No minister is senior enough to preside, or the ones who are are away."
 cc_xp_none_protege: "There is nobody at court to take on: everyone is a minister, a protege, or the ruler."
 cc_xp_none_released_protege: "@trigger_no! The crown sponsors no proteges."
 cc_xp_none_mentor: "@trigger_no! No minister has both the seniority and the discipline to teach."
 cc_xp_none_pupil: "Nobody at court is free to be given a mentor."
 cc_xp_none_host: "@trigger_no! No minister is senior enough to carry an evening, or the ones who are are away."
 cc_xp_none_envoy: "@trigger_no! No minister has a discipline to practice abroad and nothing else claiming them."
 cc_xp_none_subject_court: "No subject court is being tracked, or each already houses a resident."
 cc_xp_none_recalled: "@trigger_no! No minister is posted abroad."
 cc_xp_none_trainee: "@trigger_no! Nobody is free to be sent away to be taught."
 cc_xp_none_patron: "No minister is senior enough to put their name behind an artist."
 cc_xp_none_artist: "@trigger_no! No artist at court is without a patron."
 cc_xp_none_broker: "No minister at court is free to arrange it."
 cc_xp_none_founder: "@trigger_no! No minister has the seniority and the discipline to define a school."
 cc_xp_none_school_student: "@trigger_no! Nobody at court is eligible to be enrolled."
 cc_xp_none_school: "No school exists to enroll into."
 cc_xp_none_minister: "@trigger_no! There is nobody at court with a file to read."

 # ============================================================
 # Cabinet Experience - the studio visit (cc_xp.70, cc_xp.71)
 # ============================================================
 cc_xp_studio_visit: "Visit the Studio"
 cc_xp_studio_visit_desc: "Call on an artist at work and decide what the crown will do about what it finds."
 cc_xp_studio_visit_concept: "[cabinet|e]"
 cc_xp_studio_visit_desc_specific: "The crown calls on [SCOPE.sCharacter('recipient').GetName] and decides what to do about whatever is on the easel."
 cc_xp_studio_visit_act: "$cc_xp_studio_visit$"
 cc_xp_studio_visit_past: "A Studio Visited"
 cc_xp_studio_visit_act_past: "The crown has called on [SCOPE.sCharacter('recipient').GetName]."
 cc_xp_choose_studio: "Which artist?"
 cc_xp_tt_needs_studio: "Requires an artist at court who has not been visited in the last three years"
 cc_xp_none_studio: "@trigger_no! No artist at court is available for a visit."

 cc_xp.70.title: "The Studio"
 cc_xp.70.desc.working: "[cc_xp_artist.GetName] is working when you arrive, and goes on working for a while before acknowledging that you are there. The piece is far enough along to see what it will be and not far enough along to be sure it will be good.\n\nThe crown can pay for what the work actually needs, or it can be made clear that the court expects to see the thing finished."
 cc_xp.70.desc.idle: "[cc_xp_artist.GetName] has nothing on the easel. There are sketches, and reasons, and a long account of what the last commission cost in materials.\n\nAn artist at court with no work in hand is an artist the court is paying to think."
 cc_xp.70.a: "Pay for whatever the work needs."
 cc_xp.70.b: "Make it clear the court expects it finished."
 cc_xp.70.c: "Set them a subject at the crown's expense."
 cc_xp.70.d: "Look, say nothing, and leave."

 cc_xp.71.title: "The Unveiling"
 cc_xp.71.desc.unfinished: "The date was set months ago and the room has been made ready. The work is not.\n\n[cc_xp_artist.GetName] is unhurried about it, and explains at some length that the alternative was a worse painting."
 cc_xp.71.desc.finished: "It is done, and it is hung, and the court files past it.\n\nWhatever [cc_xp_artist.GetName] was paid, the thing itself now belongs to the realm."
 cc_xp.71.a: "Let them take the time."
 cc_xp.71.b: "Show it to the court."

 # ============================================================
 # Cabinet Experience - the second choice (cc_xp.80 - cc_xp.85)
 #
 # Each of these is the half of an action that a panel button cannot ask for. The
 # option names are the candidates themselves, gathered by ordered_x in the event.
 # ============================================================
 cc_xp.80.title: "A Pupil for [cc_xp_mentor.GetName]"
 cc_xp.80.desc: "[cc_xp_mentor.GetName] has agreed to take someone on. It is not a small thing to ask of a minister with a department to run, and the offer will not stand open indefinitely.\n\nWhoever is chosen will spend the next decade learning [cc_xp_mentor.GetSheHe] trade, and will grow in [cc_xp_mentor.GetHisHer] discipline rather than their own."
 cc_xp.80.a: "[cc_xp_pupil_1.GetName]"
 cc_xp.80.b: "[cc_xp_pupil_2.GetName]"
 cc_xp.80.c: "[cc_xp_pupil_3.GetName]"
 cc_xp.80.d: "[cc_xp_pupil_4.GetName]"
 cc_xp.81.title: "A Posting for [cc_xp_envoy.GetName]"
 cc_xp.81.desc: "[cc_xp_envoy.GetName] is to be sent out as a resident. The household is engaged, the expenses are agreed, and all that remains is to say where.\n\nA resident is gone for years. What they build in that time moves the dimension of the bond their own discipline touches, so an administrator, a diplomat and a soldier are three genuinely different postings."
 cc_xp.81.a: "The court of [cc_xp_court_1.GetName]"
 cc_xp.81.b: "The court of [cc_xp_court_2.GetName]"
 cc_xp.81.c: "The court of [cc_xp_court_3.GetName]"
 cc_xp.81.d: "The court of [cc_xp_court_4.GetName]"
 cc_xp.82.title: "A Place for [cc_xp_school_student.GetName]"
 cc_xp.82.desc: "The fees are paid and the letter of introduction is written. It wants only an address on it.\n\nA member of a school gains in that school's discipline every year, in office or out of it."
 cc_xp.82.a: "The school founded by [Player.MakeScope.GetVariable('cc_xp_school_1_founder').GetCharacter.GetName]"
 cc_xp.82.b: "The school founded by [Player.MakeScope.GetVariable('cc_xp_school_2_founder').GetCharacter.GetName]"
 cc_xp.82.c: "The school founded by [Player.MakeScope.GetVariable('cc_xp_school_3_founder').GetCharacter.GetName]"
 cc_xp.83.title: "A Patron for [cc_xp_artist.GetName]"
 cc_xp.83.desc: "The crown has decided that [cc_xp_artist.GetName] is worth keeping. Patronage is not the crown's money alone, though: it wants a name on it, and the name has to belong to someone with enough standing at court that it means something.\n\nWhoever it is will spend the next twenty-five years being introduced as the person who found [cc_xp_artist.GetName], and will be the better diplomat for it."
 cc_xp.83.a: "[cc_xp_patron_1.GetName]"
 cc_xp.83.b: "[cc_xp_patron_2.GetName]"
 cc_xp.83.c: "[cc_xp_patron_3.GetName]"
 cc_xp.83.d: "[cc_xp_patron_4.GetName]"
 cc_xp.84.title: "A Quiet Sale"
 cc_xp.84.desc: "There is a buyer, and the buyer is not asking questions, and neither is anyone else so long as it is done properly.\n\nThe most valuable pieces the collection could decently part with are below, with what each is reckoned to be worth. A quiet sale fetches less than an open one, and what a piece fetches turns on how good it is and on how far the name of the culture that produced it carries. The court will notice which wall goes bare."
 cc_xp.84.a: "[cc_xp_work_1.GetName], by [cc_xp_work_1.GetCreatorName]: [cc_xp_work_1.GetQualityName] ([cc_xp_work_1.GetQuality|Y]%)"
 cc_xp.84.b: "[cc_xp_work_2.GetName], by [cc_xp_work_2.GetCreatorName]: [cc_xp_work_2.GetQualityName] ([cc_xp_work_2.GetQuality|Y]%)"
 cc_xp.84.c: "[cc_xp_work_3.GetName], by [cc_xp_work_3.GetCreatorName]: [cc_xp_work_3.GetQualityName] ([cc_xp_work_3.GetQuality|Y]%)"
 cc_xp.84.d: "[cc_xp_work_4.GetName], by [cc_xp_work_4.GetCreatorName]: [cc_xp_work_4.GetQualityName] ([cc_xp_work_4.GetQuality|Y]%)"
 cc_xp.84.e: "Sell nothing."
 cc_xp.85.title: "Worth Watching"
 cc_xp.85.desc: "The crown has money and attention to spend on somebody who does not yet hold an office. The court has opinions about who that should be, and the nobility has opinions about the crown having opinions.\n\nA protege accumulates experience slowly while they wait, can be sent to be trained, and can be given a mentor. The point is to have a successor ready before a seat opens."
 cc_xp.85.a: "[cc_xp_cand_1.GetName]"
 cc_xp.85.b: "[cc_xp_cand_2.GetName]"
 cc_xp.85.c: "[cc_xp_cand_3.GetName]"
 cc_xp.85.d: "[cc_xp_cand_4.GetName]"

 # ============================================================
 # Cabinet Experience - choosing a career (cc_xp.90 - cc_xp.92)
 #
 # Opened from the training return events when the minister who came back holds no
 # ladder trait. The option names are the careers; each grants that ladder's rung-0
 # trait, which is usually a modest one. The climb is what the experience buys.
 #
 # Each opening shows a rotating subset of the track's careers, so these strings are
 # written to stand alone rather than to be read as a complete list.
 # ============================================================
 cc_xp.90.title: "A Career for [cc_xp_subject.GetName]"
 cc_xp.90.desc: "[cc_xp_subject.GetName] has come back from the chancery with an aptitude and no post to put it to. The senior clerks have views on where [cc_xp_subject.GetSheHe] would be most use, and so does everyone else who has heard about it.\n\nWhat is decided now is a career, not a competence. They will start at the bottom of it and climb as they earn the administrative experience to do so."
 cc_xp.90.a: "The Reformer's Path. Put them to the statute book."
 cc_xp.90.b: "The Treasury. Put them to the accounts."
 cc_xp.90.c: "The Scholar's Path. Let them read."
 cc_xp.90.d: "The Builder. Send them to survey the capital."
 cc_xp.90.e: "The Jurist. Put them to the courts."
 cc_xp.90.f: "The Integrator. Give them the new provinces."
 cc_xp.90.g: "None of these suit. Leave it for now."

 cc_xp.91.title: "A Career for [cc_xp_subject.GetName]"
 cc_xp.91.desc: "[cc_xp_subject.GetName] has come back from the embassy circuit knowing which ambassadors are worth talking to and which are merely well dressed. That is a beginning, and it is not yet a position.\n\nWhat is decided now is a career, not a competence. They will start at the bottom of it and climb as they earn the diplomatic experience to do so."
 cc_xp.91.a: "The Diplomat's Ascent. Give them a legation."
 cc_xp.91.b: "The Colonial Hand. Send them to the far stations."
 cc_xp.91.c: "The Merchant's Road. Attach them to the trade house."
 cc_xp.91.d: "The Navigator. Put them aboard something."
 cc_xp.91.e: "The Shadow. Do not write down what they do."
 cc_xp.91.f: "None of these suit. Leave it for now."

 cc_xp.92.title: "A Career for [cc_xp_subject.GetName]"
 cc_xp.92.desc: "[cc_xp_subject.GetName] is back from the staff college with opinions, most of them borrowed and one or two of them [cc_xp_subject.GetHisHer] own. The army has room for [cc_xp_subject.GetHimHer] in several places and a strong preference for deciding which.\n\nWhat is decided now is a career, not a competence. They will start at the bottom of it and climb as they earn the military experience to do so."
 cc_xp.92.a: "The Military Hardening. Attach them to a field staff."
 cc_xp.92.b: "The Drillmaster. Give them a parade ground."
 cc_xp.92.c: "The Engineer. Give them the fortifications."
 cc_xp.92.d: "The Horse. Give them the remount depot."
 cc_xp.92.e: "None of these suit. Leave it for now."
