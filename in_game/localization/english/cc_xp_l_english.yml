l_english:
 # ============================================================
 # Cabinet Experience — service record interaction
 #
 # Saved scopes are referenced WITHOUT the scope: prefix, matching
 # [cc_engage_subject.GetName] in cc_subject_bonds_l_english.yml. Writing
 # [scope:cc_xp_subject.GetName] here parses but resolves to nothing in game.
 # ============================================================
 # NOTE ON KEYS. A character interaction needs more than <name> and <name>_desc:
 #   <name>_desc_specific  the description once a target IS selected, and the one the
 #                         engine complains about by name if it is missing
 #   <name>_act            the verb shown on the confirm button, conventionally "$<name>$"
 #   <name>_past           the message headline after it resolves (needs message = yes)
 #   <name>_act_past       the message body after it resolves
 # Interaction loc uses [SCOPE.sCharacter('recipient')], NOT the bare saved-scope form
 # that event loc uses. See promote_to_head_of_cabinet in the vanilla localisation.
 cc_xp_inspect_service_record: "Read the Service Record"
 cc_xp_inspect_service_record_desc: "Have the clerks bring up everything the crown's files hold on one of your ministers: what they have done, what they have become good at, and how far they still have to go."
 cc_xp_inspect_service_record_desc_specific: "The clerks will bring up the file on [SCOPE.sCharacter('recipient').GetName]."
 cc_xp_inspect_service_record_act: "$cc_xp_inspect_service_record$"
 cc_xp_inspect_service_record_past: "Service Record Read"
 cc_xp_inspect_service_record_act_past: "The crown has reviewed the record of [SCOPE.sCharacter('recipient').GetName]."
 cc_xp_choose_minister: "Whose record?"

 # ============================================================
 # Cabinet Experience — service record readout (cc_xp.1)
 # ============================================================
 cc_xp.1.title: "The Service Record"
 cc_xp.1.desc: "The clerks keep a file on [cc_xp_subject.GetName], as they keep one on every officer of the crown. It is drier reading than the court gossip, and rather more reliable.\n\n#Y SENIORITY#!\nLevel [cc_xp_subject.MakeScope.GetVariable('cc_level').GetValue|0] of 10, on [cc_xp_subject.MakeScope.GetVariable('cc_xp_total').GetValue|0] experience. The next level comes at [cc_xp_subject.MakeScope.GetVariable('cc_xp_next').GetValue|0].\n\n#Y SPECIALISATION#!\nAdministration: [cc_xp_subject.MakeScope.GetVariable('cc_xp_adm').GetValue|0], tier [cc_xp_subject.MakeScope.GetVariable('cc_tier_adm').GetValue|0] of 3\nDiplomacy: [cc_xp_subject.MakeScope.GetVariable('cc_xp_dip').GetValue|0], tier [cc_xp_subject.MakeScope.GetVariable('cc_tier_dip').GetValue|0] of 3\nWarfare: [cc_xp_subject.MakeScope.GetVariable('cc_xp_mil').GetValue|0], tier [cc_xp_subject.MakeScope.GetVariable('cc_tier_mil').GetValue|0] of 3\nTiers are reached at 150, 500 and 1200 experience in that track alone.\n\n#Y SERVICE#!\nWhat the record is actually made of. Each entry is one duty carried to its end.\nCampaigns and commands: [cc_xp_subject.MakeScope.GetVariable('cc_tf_war').GetValue|0]\nReforms and administration: [cc_xp_subject.MakeScope.GetVariable('cc_tf_reform').GetValue|0]\nColonial ventures: [cc_xp_subject.MakeScope.GetVariable('cc_tf_colonial').GetValue|0]\nMatters of faith: [cc_xp_subject.MakeScope.GetVariable('cc_tf_faith').GetValue|0]\nTrade and revenue: [cc_xp_subject.MakeScope.GetVariable('cc_tf_trade').GetValue|0]\n\n#Y PRESENT STANDING#!\n[SelectLocalization(cc_xp_subject.MakeScope.GetVariable('cc_protege').IsSet, 'CC_XP_REC_PROTEGE', 'CC_XP_REC_NOT_PROTEGE')]\n[SelectLocalization(cc_xp_subject.MakeScope.GetVariable('cc_xp_mentor_track').IsSet, 'CC_XP_REC_MENTORED', 'CC_XP_REC_NOT_MENTORED')]\n[SelectLocalization(cc_xp_subject.MakeScope.GetVariable('cc_xp_school').IsSet, 'CC_XP_REC_SCHOOLED', 'CC_XP_REC_NOT_SCHOOLED')]\n[SelectLocalization(cc_xp_subject.MakeScope.GetVariable('cc_xp_is_patron').IsSet, 'CC_XP_REC_PATRON', 'CC_XP_REC_NOT_PATRON')]\n[SelectLocalization(cc_xp_subject.MakeScope.GetVariable('cc_xp_seconded').IsSet, 'CC_XP_REC_ABROAD', 'CC_XP_REC_HOME')]\n\nSeniority is what a minister has lived through. Specialization is what they have actually learned to do, and it is specialization that decides which traits are within their reach."
 cc_xp.1.a: "Close the file."

 # Lines chosen by SelectLocalization from the subject's variables. Localisation has no
 # has_variable guard, so every branch is written out and the engine picks one; this is
 # the same shape vanilla uses for intel fog in main_menu/localization/english.
 CC_XP_REC_PROTEGE: "Sponsored by the crown as a protege, not yet holding office."
 CC_XP_REC_NOT_PROTEGE: "Not a protege of the crown."
 CC_XP_REC_MENTORED: "Studying under a senior minister, and gaining in that minister's discipline each year."
 CC_XP_REC_NOT_MENTORED: "Has no mentor."
 CC_XP_REC_SCHOOLED: "A member of one of the realm's schools."
 CC_XP_REC_NOT_SCHOOLED: "Belongs to no school."
 CC_XP_REC_PATRON: "Patron to an artist at court."
 CC_XP_REC_NOT_PATRON: "Sponsors no artist."
 CC_XP_REC_ABROAD: "Posted as a resident at a subject court, and away from the cabinet's other business."
 CC_XP_REC_HOME: "At court and available."

 # ============================================================
 # Cabinet Experience — ladder advancement (cc_xp.10)
 # ============================================================
 cc_xp.10.title: "A Minister Comes Into Their Own"
 cc_xp.10.desc: "There is no ceremony for this and no announcement, but everyone at court can tell. [cc_xp_subject.GetName] has stopped being someone who holds an office and started being someone the office is built around. The work that used to take them a season now takes a fortnight, and the clerks have quietly stopped checking it.\n\nExperience has carried [cc_xp_subject.GetName] to the next step of their career. Their new standing is on their record, and on their card in the cabinet."
 cc_xp.10.a: "Competence should be its own reward. It rarely is."

 # ============================================================
 # Cabinet Experience — court examination (cc_xp.11)
 # ============================================================
 cc_xp.11.title: "The Court Sits an Examination"
 cc_xp.11.desc: "[cc_xp_examiner.GetName] presided, which was the safe choice and also the correct one. The questions were set in advance and sealed, the answers read out, and a good deal of quiet reputational damage was done over the course of a single afternoon.\n\nThe result nobody predicted was [cc_xp_subject.GetName], who answered the hardest of it without notes and then apologised for taking so long. Everyone who sat the examination learned something from it. [cc_xp_subject.GetName] learned rather more.\n\nThe burghers are delighted that advancement can be earned in a room with a locked door. The nobility is less delighted, for the same reason."
 cc_xp.11.a: "Note the name. We will want it again."

 # ============================================================
 # Cabinet Experience — training interactions
 # ============================================================
 cc_xp_train_adm: "Send to the Chancery"
 cc_xp_train_adm_desc: "Second them to the senior clerks for half a year: statute, precedent, revenue, and the particular patience required to read a ledger someone else has cooked. They will be away while it lasts, and the experience arrives with them when they return. A minister who has no career yet will be offered one on their return, unless the posting goes badly."
 cc_xp_train_adm_desc_specific: "[SCOPE.sCharacter('recipient').GetName] will leave for the chancery, and return in about six months with administrative experience."
 cc_xp_train_adm_act: "$cc_xp_train_adm$"
 cc_xp_train_adm_past: "Departed for the Chancery"
 cc_xp_train_adm_act_past: "[SCOPE.sCharacter('recipient').GetName] has gone to the chancery and will not be available for six months."
 cc_xp_train_dip: "Send on the Embassy Circuit"
 cc_xp_train_dip_desc: "A year on the road: every court that matters, carrying letters of no importance so they can watch how the important ones are delivered. The longest of the three postings, because it is the one that involves actually going somewhere. A minister who has no career yet will be offered one on their return, unless the posting goes badly."
 cc_xp_train_dip_desc_specific: "[SCOPE.sCharacter('recipient').GetName] will depart on the embassy circuit, and return in about a year with diplomatic experience."
 cc_xp_train_dip_act: "$cc_xp_train_dip$"
 cc_xp_train_dip_past: "Departed on the Embassy Circuit"
 cc_xp_train_dip_act_past: "[SCOPE.sCharacter('recipient').GetName] has set out on the embassy circuit and will be abroad for a year."
 cc_xp_train_mil: "Send to the Staff College"
 cc_xp_train_mil_desc: "Three quarters of a year of maps, supply tables, and the company of officers who have actually lost a battle and will say so. They are no use to you at court until the course ends. A minister who has no career yet will be offered one on their return, unless the posting goes badly."
 cc_xp_train_mil_desc_specific: "[SCOPE.sCharacter('recipient').GetName] will report to the staff college, and return in about nine months with military experience."
 cc_xp_train_mil_act: "$cc_xp_train_mil$"
 cc_xp_train_mil_past: "Departed for the Staff College"
 cc_xp_train_mil_act_past: "[SCOPE.sCharacter('recipient').GetName] has reported to the staff college and will be there nine months."
 cc_xp_choose_trainee: "Who is to be sent?"

 # ============================================================
 # Cabinet Experience — proteges and mentorship
 # ============================================================
 cc_xp_sponsor_protege: "Take On a Protege"
 cc_xp_sponsor_protege_desc: "Take an interest in someone outside the cabinet: pay for their keep, open the right doors, and have a successor ready before you need one. The court puts forward the four most accomplished candidates and you choose among them. Proteges gain experience slowly on their own, but can be trained and mentored like any minister. Three at a time. The nobility does not care for the crown noticing people it has not vouched for."
 cc_xp_choose_protege: "Who has caught your eye?"
 cc_xp_release_protege: "Release a Protege"
 cc_xp_release_protege_desc: "Withdraw the crown's interest and free the place for someone else. Nothing they have learned is taken away from them; if you appoint them later, or take them up again, it is all still on the record."
 cc_xp_release_protege_desc_specific: "[SCOPE.sCharacter('recipient').GetName] will cease to be a protege of the crown. Nothing they have learned is taken from them."
 cc_xp_release_protege_act: "$cc_xp_release_protege$"
 cc_xp_release_protege_past: "Patronage Ended"
 cc_xp_release_protege_act_past: "[SCOPE.sCharacter('recipient').GetName] is no longer a protege of the crown."
 cc_xp_choose_released_protege: "Whose patronage ends?"
 cc_xp_assign_mentor: "Assign a Mentor"
 cc_xp_assign_mentor_desc: "Put a senior minister's time at a junior's disposal for a decade. The student gains experience each year in whatever their mentor is strongest at, so this steers a career rather than merely hurrying it. What was taught outlasts the teacher."
 cc_xp_assign_mentor_desc_specific: "[SCOPE.sCharacter('recipient').GetName] will take a junior in hand for the next decade and teach them what they know best. You choose who."
 cc_xp_assign_mentor_act: "$cc_xp_assign_mentor$"
 cc_xp_assign_mentor_past: "A Mentorship Begins"
 cc_xp_assign_mentor_act_past: "[SCOPE.sCharacter('recipient').GetName] has taken a pupil."
 cc_xp_choose_mentor: "Who teaches?"
 cc_xp_choose_student: "Who learns?"

 # ============================================================
 # Cabinet Experience — court examination
 # ============================================================
 cc_xp_court_examination: "Hold a Court Examination"
 cc_xp_court_examination_desc: "Commission a formal examination of the whole court: sealed questions, answers read aloud, and reputations settled in an afternoon. It takes half a year to arrange. Everyone who sits it gains experience, and one of them will do conspicuously better than expected. Expensive, and not to be repeated within a decade."
 cc_xp_court_examination_desc_specific: "[SCOPE.sCharacter('recipient').GetName] will spend the next six months arranging a formal examination of the whole court, and will preside over it."
 cc_xp_court_examination_act: "$cc_xp_court_examination$"
 cc_xp_court_examination_past: "An Examination Commissioned"
 cc_xp_court_examination_act_past: "[SCOPE.sCharacter('recipient').GetName] has begun setting the questions. The court will sit in half a year."
 cc_xp_choose_examiner: "Who presides?"

 # ============================================================
 # Cabinet Experience — modifiers
 # ============================================================
 STATIC_MODIFIER_NAME_cc_xp_service_record: "Experienced Minister"
 STATIC_MODIFIER_DESC_cc_xp_service_record: "Years in office have taught this minister where the levers are and which clerks actually answer their letters. The effect grows with every level of seniority."

 # ============================================================
 # Cabinet Experience — returns from a posting (cc_xp.30-32)
 #
 # Line breaks inside a value must be the two-character escape backslash-n.
 # A real newline in the .yml truncates the value at that point.
 # ============================================================
 cc_xp.30.title: "Back from the Chancery"
 cc_xp.30.desc: "[cc_xp_subject.GetName] has come back from six months among the senior clerks looking faintly haunted, which is the correct reaction to having read the realm's accounts in full.\n\nThey have brought back a list. Several items on it are things nobody has questioned in thirty years, and at least two of them will be awkward. This is what competence looks like early on: it makes more work before it makes less."
 cc_xp.30.a: "Read the list."

 cc_xp.31.title: "Back from the Circuit"
 cc_xp.31.desc: "A year of other people's courts has changed [cc_xp_subject.GetName]. They left carrying letters of no importance, and spent the time watching how the important ones were delivered, who was in the room when they were, and who was pointedly not.\n\nThey have opinions now about ambassadors we have trusted for a decade. Some of those opinions are uncomfortable. All of them are specific."
 cc_xp.31.a: "Specificity is worth more than tact."

 cc_xp.32.title: "Back from the Staff College"
 cc_xp.32.desc: "[cc_xp_subject.GetName] has returned from nine months of maps, supply tables, and the company of officers who have lost battles and are willing to say so out loud.\n\nThey talk about roads now, and depots, and how far a man can march before he stops being a soldier and becomes a problem. It is markedly less stirring than the way they talked before they went, and markedly more useful."
 cc_xp.32.a: "Glory is downstream of supply."
 # ============================================================
 # Cabinet Experience — posting outcomes (phase 5)
 #
 # Each return event has three descs: good / poor / ordinary. The ordinary one
 # already exists above; these are the tails.
 # ============================================================
 cc_xp.30.desc.good: "[cc_xp_subject.GetName] came back from the chancery early, which the senior clerks insisted was not possible, and then produced the reason: a reconciliation of three revenue districts that nobody had managed to reconcile since the last reign.\n\nThey are not smug about it. That is somehow worse. Whatever they were sent to learn, they appear to have learned it and then kept going."
 cc_xp.30.desc.poor: "The chancery was polite about it. [cc_xp_subject.GetName] attended, took notes, and returned with a working understanding of the filing system and very little else.\n\nSome of that is the posting: half a year among men who have spent thirty years guarding their own procedures is not half a year of teaching. Some of it is not the posting. The money is spent either way."
 cc_xp.31.desc.good: "[cc_xp_subject.GetName] was supposed to carry letters. Somewhere around the third court they stopped being the person who carried them and became the person the letters were addressed to, and nobody can say precisely when it happened.\n\nThey have come home with correspondence of their own, three standing invitations, and a very clear sense of which of our allies is lying to us."
 cc_xp.31.desc.poor: "A year abroad, and [cc_xp_subject.GetName] has returned with impressions rather than intelligence. The courts were splendid. The food was strange. Everyone was very kind.\n\nIt is not that they learned nothing. It is that what they learned would have fitted comfortably into a season, and we paid for four."
 cc_xp.32.desc.good: "The staff college does not hand out distinctions, on the grounds that war does not either. It made an exception in the matter of [cc_xp_subject.GetName]'s supply problem, which was set as an exercise and solved in a way the instructors had not considered.\n\nThey have come back with the solution written out, and with the names of four officers who argued with them about it and lost."
 cc_xp.32.desc.poor: "[cc_xp_subject.GetName] has completed the course. The instructors' report is a masterpiece of saying nothing unkind at length.\n\nThey can read a supply table now, which is more than they could before. They cannot yet look at one and know what is wrong with it, which is the part that matters."
 
 # ============================================================
 # Cabinet Experience — weariness at the top (cc_xp.40)
 # ============================================================
 cc_xp.40.title: "The Long Service of a Good Servant"
 cc_xp.40.desc: "[cc_xp_subject.GetName] has served this crown for more than twenty years and is, by any measure the court knows how to apply, at the height of their powers. The work still gets done. It is simply taking longer than it used to, and being checked more often, and there is a particular tiredness about the checking.\n\nNobody has said anything. Nobody is going to. The question is whether the crown notices before the mistake does."
 cc_xp.40.a: "Send them to their estates for a year. We will manage."
 cc_xp.40.b: "There is no one else. They stay at the desk."
 
 # ============================================================
 # Cabinet Experience — institutional memory (cc_xp.41)
 # ============================================================
 cc_xp.41.title: "What Is Left Behind"
 cc_xp.41.desc: "A career of that length does not end when the man does. [cc_xp_departed.GetName] left behind a filing system that half the chancery has never questioned, a set of contacts who now write to whoever holds the office, and a way of doing things that was never written down anywhere and is followed exactly.\n\n[cc_xp_subject.GetName] worked beside them long enough to have absorbed a good deal of it, mostly without noticing. It is not the same as having earned it. It is not nothing, either."
 cc_xp.41.a: "Institutions remember. Imperfectly, but they remember."
 
 # ============================================================
 # Cabinet Experience — rivalry of equals (cc_xp.42)
 # ============================================================
 cc_xp.42.title: "Two of a Kind"
 cc_xp.42.desc: "[cc_xp_subject.GetName] and [cc_xp_rival.GetName] are both very good at the same thing, which is the problem. There is one reputation available in this field at this court, and there are two people qualified to hold it.\n\nIt has not turned to open hostility. It has turned to something more tedious: duplicated work, memoranda written to be read by a third party, and a habit of discovering problems in each other's proposals slightly too late to fix them quietly.\n\nThe crown can settle it, or decline to."
 cc_xp.42.a: "Back [cc_xp_subject.GetName]. The other will have to live with it."
 cc_xp.42.b: "Let them compete. Rivalry sharpens people, up to a point."
 cc_xp.42.c: "Put them on the same problem and make them sign it jointly. (Prestige)"
 
 # ============================================================
 # Cabinet Experience — phase 5 modifiers
 # ============================================================
 STATIC_MODIFIER_NAME_cc_xp_weary: "Worn Down"
 STATIC_MODIFIER_DESC_cc_xp_weary: "Two decades at the top of their profession, and no rest offered. Still the best in the room, and no longer quite what they were."
 STATIC_MODIFIER_NAME_cc_xp_professional_rival: "Professional Rival"
 STATIC_MODIFIER_DESC_cc_xp_professional_rival: "Sharing a speciality with someone equally accomplished, and quietly spending effort on the sharing rather than the speciality."

 # ============================================================
 # Cabinet Experience — patronage of the arts (phase 7)
 # ============================================================
 cc_xp_sponsor_artist: "Sponsor an Artist"
 cc_xp_sponsor_artist_desc: "Put a minister's name and money behind an artist for a generation. The crown gains a slow trickle of prestige while the arrangement lasts, and the minister gains diplomatic experience: patronage is reputation work, conducted at dinner tables. One artist per minister."
 cc_xp_sponsor_artist_desc_specific: "[SCOPE.sCharacter('recipient').GetName] will be taken into the crown's patronage, and the crown will gain prestige for as long as the arrangement lasts. You choose which minister puts their name to it."
 cc_xp_sponsor_artist_act: "$cc_xp_sponsor_artist$"
 cc_xp_sponsor_artist_past: "A Patronage Begins"
 cc_xp_sponsor_artist_act_past: "[SCOPE.sCharacter('recipient').GetName] now works under the patronage of the court."
 cc_xp_choose_patron: "Who lends their name?"
 cc_xp_choose_artist: "Whose work?"

 cc_xp_sell_art_discreetly: "Sell a Work Discreetly"
 cc_xp_sell_art_discreetly_desc: "Have a minister arrange a quiet sale abroad. No counterparty is named, no offer is refused, and the price is accordingly below what an open negotiation would fetch. The four most valuable pieces the collection could decently part with are offered; the nobility notices which wall goes bare."
 cc_xp_choose_broker: "Who arranges it?"
 cc_xp_choose_work: "Which work?"
 cc_xp_no_sellable_work: "There is nothing in the collection that could decently be sold."
 cc_xp_sell_art_move_tt: "The work leaves the realm for a buyer abroad."

 # ============================================================
 # Cabinet Experience — schools of thought (phase 7)
 # ============================================================
 cc_xp_found_institution: "Found an Institution"
 cc_xp_found_institution_desc: "Establish a standing school of thought under a senior minister, whose own discipline becomes the school's. Everyone enrolled thereafter grows in that discipline every year, in office or not.\n\nA realm may hold three at most: the first requires a university in the capital, the second the Scholarly Orders advance, and the third Enlightened Administration. They are a century apart by design."
 cc_xp_found_institution_desc_specific: "[SCOPE.sCharacter('recipient').GetName] will found a school teaching their own discipline. It will outlast them."
 cc_xp_found_institution_act: "$cc_xp_found_institution$"
 cc_xp_found_institution_past: "An Institution Founded"
 cc_xp_found_institution_act_past: "The school of [SCOPE.sCharacter('recipient').GetName] opens its doors. It will outlast them."
 cc_xp_choose_founder: "Who founds it?"

 cc_xp_enroll_in_school: "Enroll in a School"
 cc_xp_enroll_in_school_desc: "Place a minister or protege in an existing school. They gain that school's discipline every year thereafter.\n\nThis is what a protege is for: years spent absorbing a discipline while waiting for a seat mean they arrive in the cabinet already pointed at its ladders, rather than starting from nothing."
 cc_xp_enroll_in_school_desc_specific: "[SCOPE.sCharacter('recipient').GetName] will join one of the realm's schools and gain its discipline every year thereafter. You choose which."
 cc_xp_enroll_in_school_act: "$cc_xp_enroll_in_school$"
 cc_xp_enroll_in_school_past: "A Student Enrolled"
 cc_xp_enroll_in_school_act_past: "[SCOPE.sCharacter('recipient').GetName] has been enrolled."
 cc_xp_choose_student_school: "Who enrols?"
 cc_xp_choose_school_by_member: "Under whose school?"

 # ============================================================
 # Cabinet Experience — court soirees (phase 7)
 # ============================================================
 cc_xp_host_soiree: "Host a Soiree"
 cc_xp_host_soiree_desc: "Have a minister open the season with an evening at court. This hires the hall; what the evening actually costs, and whom it is for, is decided on the night.\n\nSomething always happens at these things. What kind of something depends on how much you spent."
 cc_xp_host_soiree_desc_specific: "[SCOPE.sCharacter('recipient').GetName] will host an evening at court some weeks from now."
 cc_xp_host_soiree_act: "$cc_xp_host_soiree$"
 cc_xp_host_soiree_past: "An Evening Arranged"
 cc_xp_host_soiree_act_past: "[SCOPE.sCharacter('recipient').GetName] has begun writing the invitations."
 cc_xp_choose_host: "Who hosts?"

 cc_xp.50.title: "The Evening"
 cc_xp.50.desc: "The hall is hired, the invitations are out, and [cc_xp_host.GetName] is standing in the middle of it asking a question that costs money to answer: who is this evening actually for?\n\nThe great families expect to be asked. The merchant houses and the university men would be flattered to be, and would remember it longer. And there is a third option nobody will enjoy, which is to keep the guest list to people the crown actually needs something from."
 cc_xp.50.a: "A night for the nobility. Spare nothing."
 cc_xp.50.b: "Merchants, scholars and clergy. A useful room."
 cc_xp.50.c: "A working supper. Twelve chairs, no musicians."

 cc_xp.51.title: "After the Party"
 cc_xp.51.desc: "What the evening produced."

 cc_xp.52.title: "A Match of Minds"
 cc_xp.52.desc: "[cc_xp_subject.GetName] and [cc_xp_other.GetName] were seated together by accident and were still talking when the musicians packed up.\n\nWhatever they found in each other, it has survived contact with the next morning. They have been seen together twice since, and both of them are working better for it."
 cc_xp.52.a: "Seat them together again."

 cc_xp.53.title: "An Indiscretion"
 cc_xp.53.desc: "It is not clear how much [cc_xp_subject.GetName] had drunk, and it hardly matters now. What matters is that it was said in a room with forty people in it, and that at least six of them understood exactly what was being admitted to.\n\nThe story is already moving. It can be bought, or it can be allowed to run and be dead in a season, which is the cheaper option and the more humiliating one."
 cc_xp.53.a: "Buy the silence. Quietly, and from several people."
 cc_xp.53.b: "Let them talk. It will pass."

 cc_xp.54.title: "A Talent Discovered"
 cc_xp.54.desc: "[cc_xp_subject.GetName] has been about the court for years, holding no office and drawing no attention, and spent an hour this evening explaining something to a minister who had not previously thought there was anything to explain.\n\nNobody has ever looked at them properly. That is now a decision rather than an oversight."
 cc_xp.54.a: "Take them up. They can be made into something."
 cc_xp.54.b: "Note the name and do nothing."

 cc_xp.55.title: "A Delegation, Mid-Canape"
 cc_xp.55.desc.nobles: "Three of the great families have contrived to be standing together near the door, which at this sort of event is never an accident. They have a grievance about precedence, and they have chosen the one evening where refusing them would be conspicuous.\n\nThey will settle for money, as they usually do."
 cc_xp.55.desc.burghers: "The merchant houses have sent their most reasonable man, which is how you know the request is not reasonable. He waits until the room is half empty, compliments the wine, and explains what the guilds would like.\n\nIt would cost something. It would also be remembered."
 cc_xp.55.desc.clergy: "The bishop has been circling for an hour, and finally catches the crown between one conversation and the next. There is a matter of a foundation, and of who pays for it.\n\nHe is entirely willing to be refused. He would simply prefer not to be."
 cc_xp.55.a: "Hear them out, and settle it here."
 cc_xp.55.b: "Smile, and move to the next room."

 # ============================================================
 # Cabinet Experience — secondment to a subject court (phase 7)
 # ============================================================
 cc_xp_second_to_subject: "Second to a Subject Court"
 cc_xp_second_to_subject_desc: "Post a minister to one of your subjects as a resident. They are gone from your cabinet for years, they grow considerably while they are there, and the relationship they build moves that subject's bond every year.\n\nWhich bond depends on who you send. An administrator deepens the political relationship, a diplomat the personal one, a soldier the military one."
 cc_xp_second_to_subject_desc_specific: "[SCOPE.sCharacter('recipient').GetName] will take up residence at a subject court for some years. You choose which court."
 cc_xp_second_to_subject_act: "$cc_xp_second_to_subject$"
 cc_xp_second_to_subject_past: "A Resident Appointed"
 cc_xp_second_to_subject_act_past: "[SCOPE.sCharacter('recipient').GetName] has departed and will be some years about it."
 cc_xp_choose_envoy: "Who is posted?"
 cc_xp_choose_subject_court: "To which court?"

 cc_xp_recall_envoy: "Recall a Resident"
 cc_xp_recall_envoy_desc: "End a posting early and bring the minister home. Whatever the relationship built stays built: a bond is a record of what happened, not a modifier you are renting."
 cc_xp_recall_envoy_desc_specific: "[SCOPE.sCharacter('recipient').GetName] will be recalled from their posting and return to the cabinet."
 cc_xp_recall_envoy_act: "$cc_xp_recall_envoy$"
 cc_xp_recall_envoy_past: "A Resident Recalled"
 cc_xp_recall_envoy_act_past: "[SCOPE.sCharacter('recipient').GetName] is on their way home."
 cc_xp_choose_recalled: "Who comes home?"

 cc_xp.60.title: "The Envoy Writes"
 cc_xp.60.desc: "The dispatch from [cc_xp_subject_court.GetName] runs to eleven pages, which is either thoroughness or loneliness. Buried in the middle of it is something useful: who at that court is actually listened to, and who merely speaks first.\n\nIt can be acted on, which will be noticed, or filed, which will not."
 cc_xp.60.a: "Act on it. Let them see we read what they send."
 cc_xp.60.b: "File it. Our man learns more by staying quiet."

 cc_xp.61.title: "The Envoy Oversteps"
 cc_xp.61.desc: "Our resident at [cc_xp_subject_court.GetName] has issued an instruction. Not a suggestion, not a request conveyed on the crown's behalf: an instruction, to a minister of a court that is not ours, in front of people.\n\nThey were probably right. That is not the difficulty. The difficulty is that everyone there now knows exactly how the crown regards them, and is waiting to see whether we say so out loud."
 cc_xp.61.a: "Back them. The crown's man is the crown's man."
 cc_xp.61.b: "Apologize. Publicly, and at some length."

 cc_xp.62.title: "A Favor Asked"
 cc_xp.62.desc: "It has taken [cc_xp_subject_court.GetName] three years of hospitality to work up to this, which suggests they mean it. The request came through our own resident, carefully, over dinner, in the way these things are done when refusal has to remain possible.\n\nThey want money. They have been decent about the asking."
 cc_xp.62.a: "Grant it. Goodwill bought this cheaply is rare."
 cc_xp.62.b: "Have our man explain, kindly, why not."

 # ============================================================
 # Cabinet Experience — requirement tooltips
 #
 # These replace the engine's own attempt to describe a var: comparison. Without them a
 # disabled button shows a missing-loc placeholder (character_var_greater_or_equal and
 # friends) instead of telling the player what is actually needed.
 # ============================================================
 # cc_xp_level_at_least builds its tooltip key from the LEVEL it is passed, so a level
 # with no key here fails PostValidate and the whole trigger is rejected at load. All ten
 # are present rather than only the ones in use today, because adding a call with a new
 # level would otherwise break a trigger somewhere else entirely.
 cc_xp_tt_level_1: "Must be a minister of at least seniority 1"
 cc_xp_tt_level_2: "Must be a minister of at least seniority 2"
 cc_xp_tt_level_3: "Must be a minister of at least seniority 3"
 cc_xp_tt_level_4: "Must be a minister of at least seniority 4"
 cc_xp_tt_level_5: "Must be a minister of at least seniority 5"
 cc_xp_tt_level_6: "Must be a minister of at least seniority 6"
 cc_xp_tt_level_7: "Must be a minister of at least seniority 7"
 cc_xp_tt_level_8: "Must be a minister of at least seniority 8"
 cc_xp_tt_level_9: "Must be a minister of at least seniority 9"
 cc_xp_tt_level_10: "Must be a minister of at least seniority 10"
 # Taking on a protege. Every path states its outcome, including the noble one, which
 # spends nothing and refunds nothing and so would otherwise render as a blank tooltip.
 cc_xp_protege_tt_taken: "Enters the crown's care as a protege, gaining experience each year and eligible for training, mentorship and a school"
 cc_xp_protege_tt_noble: "Of the nobility, who take no offence at one of their own being advanced"
 cc_xp_protege_tt_outsider: "Not of the nobility, who resent the crown taking an interest in someone they did not vouch for"
 cc_xp_protege_tt_burghers: "Of the burghers, whose house funds the whole cost of advancing them"
 cc_xp_protege_tt_peasants: "Of the peasantry, whose community covers half the cost between them"
 cc_xp_protege_tt_clergy: "Of the clergy, and the church repays the crown in standing rather than coin"
 cc_xp_protege_tt_clergy_none: "Of the clergy, though our faith keeps no measure of influence for the church to repay us in"

 cc_xp_tt_tier_1: "Must have reached tier 1 in the relevant discipline"
 cc_xp_tt_tier_2: "Must have reached tier 2 in the relevant discipline"
 cc_xp_tt_tier_3: "Must have reached tier 3 in the relevant discipline"
 cc_xp_tt_track_0: "Has no discipline yet"
 cc_xp_tt_track_1: "Their discipline is administration"
 cc_xp_tt_track_2: "Their discipline is diplomacy"
 cc_xp_tt_track_3: "Their discipline is warfare"
 cc_xp_tt_institution_room: "The realm has room for another institution"
 cc_xp_tt_needs_free_university: "A university not already seating a school"

