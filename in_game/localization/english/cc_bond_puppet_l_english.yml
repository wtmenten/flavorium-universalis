l_english:
 # === cc_bonds.40 — The Puppet Requests an Ambassador ===
 cc_bonds.40.title: "The Puppet Requests an Ambassador"
 cc_bonds.40.desc: "The government of [bond_subj.GetName] has submitted a formal request for permanent diplomatic representation at our court. Their reasoning is measured: as a state bound closely to our interests, they believe they deserve a voice in the decisions that affect them. It is a reasonable request. It is also the first test of what kind of relationship we intend to have."
 cc_bonds.40.a: "Establish a full diplomatic mission. They deserve proper representation."
 cc_bonds.40.b: "Assign a limited representative. Representation, but not full standing."
 cc_bonds.40.c: "Deny the request. Our relationship requires no formal embassy."

 # === cc_bonds.41 — Puppet Economic Integration ===
 cc_bonds.41.title: "Puppet Economic Integration"
 cc_bonds.41.desc: "Our advisors have produced a memorandum on the economic relationship between our realm and [bond_subj.GetName]. Three options are presented. A unified currency system would simplify taxation and trade accounting considerably — but the memorandum notes, in cautious language, that the transition would be 'administratively challenging for local populations.' The other options involve less disruption and less control."
 cc_bonds.41.a: "Impose a unified currency system. Rationalize the relationship."
 cc_bonds.41.b: "Maintain parallel monetary systems. Integration without imposition."
 cc_bonds.41.c: "Establish joint trade agreements. Mutual benefit, mutual terms."

 # === cc_bonds.42 — The Puppet's Internal Faction ===
 cc_bonds.42.title: "The Puppet's Internal Faction"
 cc_bonds.42.desc: "Intelligence reports from [bond_subj.GetName] describe a significant internal division. One faction is broadly friendly to our interests; the other commands more popular support. Backing the pro-Crown faction would extend our influence into the puppet's domestic affairs — but covert interference carries risks. Discovery would be politically costly. Then again, the popular faction may not stay friendly."
 cc_bonds.42.a: "Covertly support the pro-Crown faction."
 cc_bonds.42.b: "Support the popular faction. A stable puppet serves us better."
 cc_bonds.42.c: "Stay out of it. Internal affairs are theirs to manage."

 # === cc_bonds.43 — Directing Puppet Foreign Policy ===
 cc_bonds.43.title: "Directing Puppet Foreign Policy"
 cc_bonds.43.desc: "The puppet state of [bond_subj.GetName] has formed a diplomatic alliance that complicates our own foreign position. We need them to end it. The question is how we deliver that message — as a command, as a requirement with conditions, or through consultation that arrives at the same outcome while leaving them feeling heard."
 cc_bonds.43.a: "Order them to break the alliance immediately."
 cc_bonds.43.b: "Require the break with certain conditions attached."
 cc_bonds.43.c: "Consult them first. Reach the same outcome together."

 # === cc_bonds.44 — Puppet Succession Crisis ===
 cc_bonds.44.title: "Puppet Succession Crisis"
 cc_bonds.44.desc: "The ruling house of [bond_subj.GetName] has fractured. Two claimants are contesting the succession — one is our preferred candidate, the other commands broader popular support within the puppet state. Our preferred candidate cannot win without us. We can force the outcome we want. The question is whether forcing it is the right choice."
 cc_bonds.44.a: "Install our preferred candidate by force. Secure the succession."
 cc_bonds.44.b: "Support the popular heir. Let the puppet's people choose."
 cc_bonds.44.c: "Broker a supervised process. A compromise that both sides can accept."

 # === cc_bonds.45 — Puppet Requests Military Expansion ===
 cc_bonds.45.title: "Puppet Requests Military Expansion"
 cc_bonds.45.desc: "The government of [bond_subj.GetName] has submitted a proposal for expanding their standing forces. They cite border security concerns and argue that a stronger military makes them a more valuable partner to us. They are not wrong — but a stronger puppet is also a more independent one. The proposal includes a request for financial assistance."
 cc_bonds.45.a: "Approve the expansion and provide the funding."
 cc_bonds.45.b: "Approve the expansion. They may fund it themselves."
 cc_bonds.45.c: "Deny the request. Their current forces are sufficient."

 # === cc_bonds.46 — The Loyal Puppet's Request ===
 cc_bonds.46.title: "The Loyal Puppet's Request"
 cc_bonds.46.desc: "The government of [bond_subj.GetName] has sent a personal letter — not a formal petition, not a diplomatic memorandum, but a letter. They describe their continued commitment to the relationship, note several recent sacrifices made on our behalf, and ask for something in return. The request is modest. What matters is whether we choose to honor it."
 cc_bonds.46.a: "Honor the request generously. Loyalty deserves recognition."
 cc_bonds.46.b: "Use this moment of goodwill to ask for something in return."
