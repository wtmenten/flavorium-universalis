 # The player-facing half of every court-event option that used to hand out a
 # ladder rung. The AI half keeps the original wording, which names the trait;
 # this half says what actually happens, which is that the minister gains
 # experience toward it and the ladder grants it when the tier is earned.
 #
 # DELIBERATELY SCOPE-FREE. One key is shared by every event that offers the
 # same rung, and those events do not agree on what the character is called:
