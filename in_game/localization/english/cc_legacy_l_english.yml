 # ============================================================
 # LEGACY EVENTS (cc_legacy namespace)
 # ============================================================

 cc_legacy.1.title: "A Mentor's Last Gift"
 cc_legacy.1.desc: "[scope:cc_legacy_minister.GetName] has departed this world — a minister whose long service shaped the court in ways that will take years to fully understand. Among those who watched them most closely is one figure in particular: a young minister whose own career has been marked by [scope:cc_legacy_minister.GetHerHis] example. What will [scope:cc_legacy_minister.GetName] leave behind?"
 cc_legacy.1.a: "Let the mentor's cabinet expertise pass to the protege."
 cc_legacy.1.a.tt: "A young minister in your court inherits the deceased minister's primary cabinet trait."
 cc_legacy.1.b: "The mentor's spiritual conviction was [scope:cc_legacy_minister.GetHerHis] deepest gift. Let it be inherited."
 cc_legacy.1.b.tt: "A young minister inherits the deceased minister's religious_figure trait — it will be always active alongside their cabinet role."
 cc_legacy.1.c: "The court will honor the memory — but each minister must find their own path."

 cc_legacy.2.title: "A Legend Departs"
 cc_legacy.2.desc: "[scope:cc_legacy_minister.GetName] was more than a minister. The court they served, the institutions they shaped, the decisions they influenced — these things will outlast them. What we choose to do with their memory will determine whether the legend becomes a living force in this realm, or merely a name on a plaque."
 cc_legacy.2.a: "Establish a lasting memorial — let the legend become part of the realm's permanent identity."
 cc_legacy.2.a.tt: "Applies a small but permanent country modifier in honor of this legendary minister."
 cc_legacy.2.b: "Consecrate the legacy with a proper ceremony and founding fund."
 cc_legacy.2.b.tt: "Costs 25× monthly income. Applies an enhanced, consecrated version of the legacy modifier — permanently."
