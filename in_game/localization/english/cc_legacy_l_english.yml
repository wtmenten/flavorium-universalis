 # ============================================================
 # LEGACY EVENTS (cc_legacy namespace)
 # ============================================================

 cc_legacy.1.title: "A Mentor Plans Their Succession"
 cc_legacy.1.desc: "[cc_legacy_elder.GetName] has served this court for more than a decade, and the years are beginning to tell. A minister of their stature does not simply retire — they leave a shape in the institution, and that shape must be filled deliberately or abandoned to chance. [cc_legacy_elder.GetName] has requested an audience. They wish to discuss the future."
 cc_legacy.1.a: "Let [cc_legacy_elder.GetName] transfer the fruits of their experience to a younger minister."
 cc_legacy.1.a.tt: "The elder minister transfers their primary cabinet trait to a young courtier, gains the Retired Legend trait, and steps back from the most demanding work. The numeric tracking variable is set for when they eventually die."
 cc_legacy.1.b: "Encourage [cc_legacy_elder.GetName] to invest their remaining years in grooming a successor's skills."
 cc_legacy.1.b.tt: "The elder minister personally trains a young courtier, granting a significant skill boost. The elder retains their trait but invests in the next generation."
 cc_legacy.1.c: "This is not the moment. Let [cc_legacy_elder.GetName] continue as they are."

 cc_legacy.3.title: "The Elder's Final Gift"
 cc_legacy.3.desc: "[cc_legacy_minister.GetName] has died. They spent their final years as a Retired Legend — a living institution, a mentor rather than an active minister — and they did not waste that time. The shape of everything they built has been left in trust. The question now is how we receive that inheritance."
 cc_legacy.3.a: "Accept [cc_legacy_minister.GetName]'s legacy — let it become a permanent feature of this realm."
 cc_legacy.3.a.tt: "Applies a permanent country modifier themed to the elder's former cabinet specialization. No cost."
 cc_legacy.3.b: "Consecrate the legacy with ceremony and a proper founding fund."
 cc_legacy.3.b.tt: "Costs 15× monthly income. Applies an enhanced, consecrated version of the legacy modifier — permanently."

 cc_legacy.2.title: "A Legend Departs"
 cc_legacy.2.desc: "[cc_legacy_minister.GetName] was more than a minister. The court they served, the institutions they shaped, the decisions they influenced — these things will outlast them. What we choose to do with their memory will determine whether the legend becomes a living force in this realm, or merely a name on a plaque."
 cc_legacy.2.a: "Establish a lasting memorial — let the legend become part of the realm's permanent identity."
 cc_legacy.2.a.tt: "Applies a small but permanent country modifier in honor of this legendary minister."
 cc_legacy.2.b: "Consecrate the legacy with a proper ceremony and founding fund."
 cc_legacy.2.b.tt: "Costs 25× monthly income. Applies an enhanced, consecrated version of the legacy modifier — permanently."
