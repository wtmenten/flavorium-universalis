l_english:
 # === cc_bonds.110 — A Merchant Seeks Passage ===
 cc_bonds.110.title: 0 "A Merchant Seeks Passage"
 cc_bonds.110.desc: 0 "A merchant from [bond_subj.GetName] has come to our attention. His proposal is straightforward: he wishes to establish a trade route that passes through our territory — our ports, our roads, our licensing arrangements. He is not yet wealthy enough to be dangerous, not yet poor enough to be desperate. He has talent, ambition, and a plan. What he needs is permission. What we need to decide is what kind of permission we give, and what we expect in return. Men like this have a way of becoming larger than anticipated."
 cc_bonds.110.a: 0 "Grant him full passage rights and a trade monopoly. Let him grow large and loyal."
 cc_bonds.110.b: 0 "Grant passage rights. He may trade freely, but no monopoly."
 cc_bonds.110.c: 0 "Deny the request. We are not in the business of making foreign merchants rich."

 # === cc_bonds.111 — The Merchant's Expansion ===
 cc_bonds.111.title: 0 "The Merchant's Expansion"
 cc_bonds.111.desc_patronized: 0 "The merchant from [bond_subj.GetName] has, in the intervening years, become a very wealthy man — and by wealth we mean the kind that reshapes the economy of a territory. He employs hundreds. His ships connect ports from here to the colonial frontier. His credit is good across half the known world. The monopoly we granted did exactly what monopolies do: it concentrated capital efficiently, and that capital was built on our patronage. Now he moves to extend his network further — reaching ports and territories of [bond_secondary.GetName], and merchants who do not answer to us. The question is how we respond to a man who has outgrown his origin."
 cc_bonds.111.desc_allowed: 0 "The merchant from [bond_subj.GetName] has prospered modestly over the years — a solid trading house, a small fleet, a respectable name. He is not the dominant commercial force in his territory, but he is notable, and he remembers that we granted him passage when we did not have to. Now he extends further, reaching toward colonial ports and foreign markets in [bond_secondary.GetName]. He is, in the language of commerce, well-disposed toward us. Whether we remain well-disposed toward him depends on how much of this expansion we wish to control."
 cc_bonds.111.desc_denied: 0 "The merchant we turned away has, by all reports, found another route. He built his connections through rival territory, grew moderately wealthy without our assistance, and is now reaching further still — into colonial markets and foreign ports in [bond_secondary.GetName] that our influence does not touch. He has not expressed resentment. He has not expressed gratitude either. He simply worked around us, as merchants do. He is now asking, in the indirect language of commerce, whether we wish to change the terms of that arrangement."
 cc_bonds.111.a_back: 0 "Fund his expanding venture. A well-backed merchant is a merchant who remembers who backed him."
 cc_bonds.111.b_observe: 0 "Let him extend his reach independently. We will evaluate the outcome."
 cc_bonds.111.c_discourage: 0 "Discourage this expansion. He grows beyond what is useful to us."

 # === cc_bonds.112 — Fortune and Tempest ===
 cc_bonds.112.title: 0 "Fortune and Tempest"
 cc_bonds.112.desc_piracy: 0 "Pirates have struck the merchant's main trade lanes. Two of his ships are lost or damaged; a third turned back to port. His network is not broken, but it is bleeding, and the interruption has cost him credibility with partners who were watching to see if he could maintain supply. He has sent word asking whether we might assist in securing the routes. He frames it as a mutual interest, which it is — if the routes collapse, the trade does too."
 cc_bonds.112.desc_rival: 0 "A competing merchant house has emerged from the same colonial network, backed by interests that are not ours. They have undercut the merchant's prices on two goods, poached two of his contracted ship captains, and are making overtures to ports that were previously loyal to him. The merchant has not panicked, but the intelligence we are receiving suggests the situation is deteriorating faster than he is letting on."
 cc_bonds.112.desc_succession: 0 "The merchant is aging. He has no obvious heir — one son is abroad, one is in a monastery, and the eldest daughter has already formed an alliance with a trading house we consider a rival. The question of who controls the family business after his death is now a live political question, and the answer will shape the network's future loyalties. We are not without influence here, if we choose to exercise it."
 cc_bonds.112.desc_drought: 0 "A prolonged drought has struck the primary markets the merchant's network depends on. Crop failures mean reduced goods to ship, reduced income for the territories, and reduced ability to pay debts. The merchant is solvent, barely, but his partners in the affected regions are not. If several of them fail simultaneously, the network contracts sharply and the recovery will take years."
 cc_bonds.112.desc_blockade: 0 "A naval dispute — not our war, but uncomfortably close — has led to a de facto blockade of the merchant's most productive port. Ships are waiting at anchor. Contracts are in default. The merchant has exhausted his diplomatic channels and is now requesting our intervention, formally or otherwise, to break the impasse before the losses become permanent."
 cc_bonds.112.a_1_escort: 0 "Fund an escort fleet for his main trade routes. We protect what matters to us."
 cc_bonds.112.b_1_demand: 0 "He is responsible for the security of his own routes. That is the cost of independence."
 cc_bonds.112.a_2_buyout: 0 "Purchase the rival house's interests. Clear the field."
 cc_bonds.112.b_2_let: 0 "Let commercial competition resolve itself. We do not take sides in merchants' quarrels."
 cc_bonds.112.a_3_heir: 0 "Quietly back the heir whose loyalties align with ours."
 cc_bonds.112.b_3_neutral: 0 "A merchant's succession is not our business to arrange."
 cc_bonds.112.a_4_relief: 0 "Issue emergency credit to his key partners. The network must survive the season."
 cc_bonds.112.b_4_reduce: 0 "Reduce expectations for this year. The drought will pass."
 cc_bonds.112.a_5_pressure: 0 "Apply diplomatic pressure to clear the blockade. Our name carries weight here."
 cc_bonds.112.b_5_wait: 0 "Accept the delay. These things resolve themselves eventually."

 # === cc_bonds.113 — The Merchant's Legacy ===
 cc_bonds.113.title: 0 "The Merchant's Legacy"
 cc_bonds.113.desc_flourish: 0 "The trading house has flourished. What began as a single merchant seeking passage rights has become a dynasty: multiple ports, a fleet, credit lines stretching across colonial markets, and a reputation that is now inseparable from the network we helped build. The family patriarch, addressing his house's annual gathering, described the Crown as 'the foundation upon which our fortune was built.' The history between us has been productive. The question is how to formalize it."
 cc_bonds.113.desc_modest: 0 "The trading house has done reasonably well — not the dynasty it might have been, but a stable and credible commercial institution with genuine reach across several ports. The merchant's children know our history with their father. They are neither idealists about it nor resentful. They are, in the manner of merchants everywhere, calculating what the next arrangement might look like and whether it benefits them to accept it."
 cc_bonds.113.desc_collapse: 0 "The merchant is dead. His house is not a dynasty — it is a collection of debts, disputed contracts, and fragmented loyalties. The network that might have been never cohered. His children are dividing what remains, and rivals are moving to fill the vacuum. We are left watching the collapse of something that, with different choices at different moments, might have been a durable commercial asset."
 cc_bonds.113.a_charter: 0 "Grant the house a formal trading charter. Make the partnership official and enduring."
 cc_bonds.113.b_accept: 0 "Accept the legacy as it stands. No formal arrangement — but the channels remain open."
 cc_bonds.113.c_decline: 0 "The house must stand on its own. What was built between us has run its course."

 # === Scripted relation display ===
 cc_merchant_trade_boost: 0 "Merchant Trade Network"
 cc_merchant_trade_boost_desc: 0 "A trade network established through the merchant dynasty channels a portion of commercial traffic through this overlord's markets."

 # === cc_bonds.115 — hidden cleanup event ===
 cc_bonds.115.title: 0 "The Merchant's Post Expires"
 cc_bonds.115.a: 0 "The merchant's presence fades."
