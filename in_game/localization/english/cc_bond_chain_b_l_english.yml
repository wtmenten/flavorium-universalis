l_english:
 # === cc_bonds.110 — A Merchant Seeks Passage ===
 cc_bonds.110.title: 0 "A Merchant Seeks Passage"
 cc_bonds.110.desc: 0 "A merchant from [bond_subj.GetName] has come to our attention. His proposal is straightforward: he wishes to establish a trade route that passes through our territory — our ports, our roads, our licensing arrangements. He is not yet wealthy enough to be dangerous, not yet poor enough to be desperate. He has talent, ambition, and a plan. What he needs is permission. What we need to decide is what kind of permission we give, and what we expect in return."
 cc_bonds.110.a: 0 "Grant him full passage rights and a trade monopoly. Let him grow large and loyal."
 cc_bonds.110.b: 0 "Grant passage rights. He may trade freely, but no monopoly."
 cc_bonds.110.c: 0 "Deny the request. We are not in the business of making foreign merchants rich."

 # === cc_bonds.111 — The Merchant's Fortune ===
 cc_bonds.111.title: 0 "The Merchant's Fortune"
 cc_bonds.111.desc_patronized: 0 "The merchant from [bond_subj.GetName] has become, in the intervening years, a very wealthy man — and by wealth we mean the kind that reshapes the economy of a territory. He employs hundreds. His ships connect ports. His credit is good from here to the furthest trading city. The monopoly we granted him did exactly what monopolies do: it concentrated capital efficiently, and all of that capital is, in some meaningful sense, built on our patronage. The question now is what we do with that relationship."
 cc_bonds.111.desc_allowed: 0 "The merchant from [bond_subj.GetName] has prospered modestly over the years — a solid trading house, a respectable reputation, a small fleet. He is not the dominant commercial force in the territory, but he is notable. He remembers that we granted him passage when we did not have to. He has not forgotten it. He is, in the language of commerce, well-disposed."
 cc_bonds.111.desc_denied: 0 "The merchant we turned away has, by our best intelligence, found another route. He routed his trade through a rival power's territory, built his connections there, and grown moderately wealthy without us. He has not expressed resentment — merchants rarely do. But he has not expressed gratitude either. He simply worked around us, as merchants do."
 cc_bonds.111.a_tax: 0 "Formalize a tax arrangement. His success should benefit the Crown."
 cc_bonds.111.a_appoint: 0 "Appoint him to an advisory role. His knowledge is as valuable as his gold."
 cc_bonds.111.a_ignore: 0 "His affairs are his own. We do not need to manage his success."
 cc_bonds.111.b_monopoly: 0 "Offer him the monopoly we held back before. It is not too late."
 cc_bonds.111.b_continue: 0 "Let him continue independently. The arrangement is working."
 cc_bonds.111.c_deal: 0 "Offer a retroactive trade arrangement. Bring him back into our orbit."
 cc_bonds.111.c_ignore: 0 "He found another way. That is commerce. We move on."

 # === cc_bonds.112 — The Merchant Dynasty ===
 cc_bonds.112.title: 0 "The Merchant Dynasty"
 cc_bonds.112.desc_aligned: 0 "The merchant is dead. His children have inherited his business, his reputation, and — it seems — his politics. The trading house of [bond_subj.GetName] is now the territory's primary commercial institution: shipper, banker, employer, and occasional lender to the local government. And because of the choices made a generation ago, it is an institution that considers itself part of our broader commercial network. The family patriarch, addressing his house's annual gathering last autumn, described the Crown as 'the foundation upon which our fortune was built.' This is what good early choices produce."
 cc_bonds.112.desc_hostile: 0 "The merchant is dead. His children have inherited his business, his reputation, and — apparently — a careful record of how the Crown treated their father. The trading house of [bond_subj.GetName] is now the territory's primary commercial institution: shipper, banker, employer, and lender. It is also an institution with deep connections to powers that are not us. They are not hostile in any open sense. But they are not ours, and the revolutionary age is giving them interesting options."
 cc_bonds.112.a_charter: 0 "Grant the trading house a formal charter. Make the partnership official."
 cc_bonds.112.a_accept: 0 "Accept the family's goodwill with gratitude. No formal charter necessary."
 cc_bonds.112.b_accept: 0 "We understand the situation. There is no easy remedy here."
