l_english:
 # ============================================================
 # Cabinet Experience: school seats, kinds and curricula
 # ============================================================

 # Notifications (events/cc_xp_school_events.txt)
 cc_xp_school.1.title: "The School Moves"
 cc_xp_school.1.desc: "The school founded by [cc_xp_school_founder.GetName] can no longer keep its seat at [cc_xp_school_old_seat.GetName]. Its masters, books and students have moved to the university at [cc_xp_school_new_seat.GetName], and teaching goes on there."
 cc_xp_school.1.a: "Let it settle in."
 cc_xp_school.2.title: "A School in Exile"
 cc_xp_school.2.desc: "The school founded by [cc_xp_school_founder.GetName] has lost its seat at [cc_xp_school_old_seat.GetName], and no other university in the realm is free to take it in.\n\nIts members still study and still gain in its discipline. Until a university is free, the school has no seat: its seat bonuses and actions are suspended. It will return on its own as soon as one is."
 cc_xp_school.2.a: "We will find it a home."
 cc_xp_school.3.title: "The School Returns"
 cc_xp_school.3.desc: "The school founded by [cc_xp_school_founder.GetName] has a seat again, at the university in [cc_xp_school_new_seat.GetName]. Its seat bonuses and actions resume."
 cc_xp_school.3.a: "Welcome back."

 # Kind of institution, from the seat's religion (cc_xp_school_N_kind)
 CC_XP_SCHOOL_KIND_1: "Studium"
 CC_XP_SCHOOL_KIND_2: "Academy"
 CC_XP_SCHOOL_KIND_3: "Madrasa"
 CC_XP_SCHOOL_KIND_4: "Shuyuan"
 CC_XP_SCHOOL_KIND_5: "Vihara"
 CC_XP_SCHOOL_KIND_6: "Gurukula"
 CC_XP_SCHOOL_KIND_7: "Yeshiva"
 CC_XP_SCHOOL_KIND_8: "School"

 # Curriculum (cc_xp_school_N_curriculum)
 CC_XP_CURRICULUM_1: "Law"
 CC_XP_CURRICULUM_2: "Theology"
 CC_XP_CURRICULUM_3: "Natural Philosophy"
 CC_XP_CURRICULUM_4: "Letters"
 CC_XP_CURRICULUM_5: "Military Science"

 # Curriculum tooltips
 CC_XP_CURRICULUM_1_TT: "Law. An administrative curriculum. At the seat: higher maximum control and less unrest. Across the realm: faster control growth, and society moves toward Jurisprudence.\n\nBonuses are scaled by the school's quality. The realm gains each curriculum's national bonus once, however many schools teach it."
 CC_XP_CURRICULUM_2_TT: "Theology. An administrative curriculum. At the seat: faster conversion of heretics and less unrest. Across the realm: religious influence and tolerance of the state faith, and society moves toward Spiritualist.\n\nBonuses are scaled by the school's quality. The realm gains each curriculum's national bonus once, however many schools teach it."
 CC_XP_CURRICULUM_3_TT: "Natural Philosophy. An administrative curriculum. At the seat: higher maximum literacy. Across the realm: faster research, and society moves toward Innovative. Requires quality 40 to adopt.\n\nBonuses are scaled by the school's quality. The realm gains each curriculum's national bonus once, however many schools teach it."
 CC_XP_CURRICULUM_4_TT: "Letters. A diplomatic curriculum. At the seat: cultural influence. Across the realm: monthly prestige and diplomatic range, and society moves toward Humanist.\n\nBonuses are scaled by the school's quality. The realm gains each curriculum's national bonus once, however many schools teach it."
 CC_XP_CURRICULUM_5_TT: "Military Science. A military curriculum. At the seat: faster control growth. Across the realm: land morale and army tradition, and society moves toward Quality.\n\nBonuses are scaled by the school's quality. The realm gains each curriculum's national bonus once, however many schools teach it."

 # ---- Schools tab ----
 CC_XP_SCHOOLS_FOUNDED_LABEL: "Schools"
 CC_XP_SCHOOLS_FOUNDED_TT: "Schools founded, out of the number this realm may hold."
 CC_XP_SCHOOLS_MEMBERS_LABEL: "Members"
 CC_XP_SCHOOL_OF: "of"
 CC_XP_SCHOOL_IN_EXILE: "#R In exile#!"
 CC_XP_SCHOOL_IN_EXILE_TT: "This school has lost its seat and no other university in the realm is free. Its members still gain experience, but its seat bonuses and projects are suspended. It returns on its own as soon as a university is free."
 CC_XP_SCHOOL_DORMANT: "#R Dormant#!"
 CC_XP_SCHOOL_DORMANT_TT: "This school has no living members. Nobody teaches there and nobody carries its name, so it no longer ages, costs nothing, and its renown and quality fade a little every year. It wakes as soon as someone is enrolled again."
 CC_XP_SCHOOL_TRACK_TT: "The discipline this school teaches. Every member gains experience in it each year."
 CC_XP_SCHOOL_FOUNDER_LABEL: "Founder"
 CC_XP_SCHOOL_RECTOR_LABEL: "Rector"
 CC_XP_SCHOOL_NO_RECTOR: "No Rector"
 CC_XP_SCHOOL_RECTOR_TT: "Assign a minister the #Y Rector#! duty in the cabinet screen and choose this school's seat. While they serve, members gain double experience, projects come every 2 years instead of 3, the curriculum can be changed after 5 years instead of 10, and the seat gains institution growth and literacy."
 CC_XP_SCHOOL_MEMBERS_LABEL: "Members"
 CC_XP_SCHOOL_MEMBERS_TT: "Living members of this school. Each gains experience in its discipline every year: half again for a member who shares the seat's culture, and double under a Rector."
 CC_XP_SCHOOL_CURRICULUM_LABEL: "Curriculum"

 # Buttons
 CC_XP_SCHOOL_BTN_ENDOW: "Endow"
 CC_XP_SCHOOL_BTN_CHAIRS: "Royal Chairs"
 CC_XP_SCHOOL_BTN_SCHOLARS: "Scholars"
 CC_XP_SCHOOL_BTN_DISPUTATION: "Disputation"
 CC_XP_SCHOOL_BTN_CURRICULUM: "Curriculum"

 # Actions (aliased per school by cc_xp_school_actions_l_english.yml)
 cc_xp_school_endow: "Endow the Library"
 cc_xp_school_endow_desc: "Fund books, instruments and a building for this school. Research progress now, and higher literacy at the seat for ten years.\n\nA school takes on one project at a time: afterwards it needs 3 years (2 under a Rector) before the next."
 cc_xp_school_chairs: "Royal Chairs"
 cc_xp_school_chairs_desc: "Fund salaried professorships for a term. Every member of this school gains experience in its discipline. Proteges gain more than ministers, since the school is all they have.\n\nA school takes on one project at a time: afterwards it needs 3 years (2 under a Rector) before the next."
 cc_xp_school_scholars: "Invite Foreign Scholars"
 cc_xp_school_scholars_desc: "Use the court's name to draw scholars from abroad. The seat makes progress toward every institution the realm knows of and the seat lacks, and grows institutions faster for ten years.\n\nA school takes on one project at a time: afterwards it needs 3 years (2 under a Rector) before the next."
 cc_xp_school_disputation: "Hold a Disputation"
 cc_xp_school_disputation_desc: "Stage a public debate on a question from the school's curriculum. The court decides how it ends.\n\nA school takes on one project at a time: afterwards it needs 3 years (2 under a Rector) before the next."
 cc_xp_school_curriculum: "Change Curriculum"
 cc_xp_school_curriculum_desc: "Choose what this school teaches. Each curriculum gives a bonus at the seat and one across the realm, and decides which disputations it holds. Once changed, it cannot change again for 10 years (5 under a Rector)."

 # Action gates
 cc_xp_tt_school_exists: "This school has been founded"
 cc_xp_tt_school_not_exiled: "This school has a seat (it is not in exile)"
 cc_xp_tt_school_not_busy: "This school has no project under way"
 cc_xp_tt_school_has_members: "This school has at least one living member"
 cc_xp_tt_school_curriculum_settled: "This school has not changed its curriculum recently"

 # ---- Rector duty ----
 cc_duty_rector: "Rector"
 cc_duty_rector_desc: "The minister takes charge of one of the realm's schools. Its members gain double experience, its projects and curriculum changes come sooner, and its seat grows institutions and literacy faster."
 cc_duty_rector_action: "Rector"
 cc_duty_rector_active: "Serving as Rector"
 cc_duty_rector_select_school: "Which school?"
 cc_duty_rector_no_school: "@trigger_no! The realm has no seated school without a Rector."

 # ---- Disputations ----
 cc_xp_school.11.title: "A Disputation on the Law"
 cc_xp_school.11.desc: "The masters at [cc_xp_school_new_seat.GetName] have argued for a week over one question: where custom and royal statute disagree, which should a court follow? The hall was full every day. Both sides now want the crown to say who won."
 cc_xp_school.11.a: "Statute. The crown's law binds."
 cc_xp_school.11.b: "Custom. The old law of the land stands."
 cc_xp_school.11.c: "Publish both arguments and let the courts read them."
 cc_xp_school.12.title: "A Question of Doctrine"
 cc_xp_school.12.desc: "A disputation at [cc_xp_school_new_seat.GetName] has gone further than anyone meant it to. A young master defended a reading of scripture the clergy call dangerous, and the students took his side. The bishops have written to the crown."
 cc_xp_school.12.a: "Uphold the received teaching."
 cc_xp_school.12.b: "Let them argue. That is what the school is for."
 cc_xp_school.12.c: "Refer the question to the clergy."
 cc_xp_school.13.title: "An Experiment Before the Court"
 cc_xp_school.13.desc: "The masters at [cc_xp_school_new_seat.GetName] have shown the court an experiment: a result the old authorities said was impossible, repeated three times in front of witnesses. The burghers want to know what it is worth. The clergy want to know what it means."
 cc_xp_school.13.a: "Pay for further trials."
 cc_xp_school.13.b: "Enough. End the demonstrations."
 cc_xp_school.13.c: "Have the students repeat it until they understand it."
 cc_xp_school.14.title: "A Contest of Letters"
 cc_xp_school.14.desc: "The school at [cc_xp_school_new_seat.GetName] has held a public contest of poetry and oratory. The winning entries are already being copied and passed around the court."
 cc_xp_school.14.a: "Crown the winner before the court."
 cc_xp_school.14.b: "Print the entries."
 cc_xp_school.14.c: "Send copies to foreign courts."
 cc_xp_school.15.title: "A Disputation on War"
 cc_xp_school.15.desc: "The masters at [cc_xp_school_new_seat.GetName] have finished a treatise on drill and the order of battle, and argued it against two veteran captains. The captains lost. The nobility, who officer the army, did not enjoy hearing it."
 cc_xp_school.15.a: "Adopt the new drill."
 cc_xp_school.15.b: "Keep it in the lecture hall for now."
 cc_xp_school.15.c: "Send the masters to teach in the garrisons."

 # ---- Change curriculum ----
 cc_xp_school.20.title: "What Shall the School Teach?"
 cc_xp_school.20.desc: "The masters of the school at [cc_xp_school_new_seat.GetName] await the crown's decision on their curriculum. A school teaches within its discipline, so five curricula are open to it. The choice sets what they teach, what the seat and the realm gain from it, and which questions they argue over for years to come."
 cc_xp_school.20.a: "Law"
 cc_xp_school.20.b: "Theology"
 cc_xp_school.20.c: "Natural Philosophy"
 cc_xp_school.20.d: "Letters"
 cc_xp_school.20.e: "Military Science"
 cc_xp_school.20.f: "Keep the present curriculum."
 cc_xp_school.20.g: "Medicine"
 cc_xp_school.20.h: "Navigation"

 # ---- Renown and quality ----
 CC_XP_SCHOOL_RENOWN_LABEL: "Renown"
 CC_XP_SCHOOL_QUALITY_LABEL: "Quality"
 CC_XP_SCHOOL_RENOWN_TIER_1: "Local"
 CC_XP_SCHOOL_RENOWN_TIER_2: "Regional"
 CC_XP_SCHOOL_RENOWN_TIER_3: "Famous"
 CC_XP_SCHOOL_RENOWN_TIER_4: "Illustrious"
 CC_XP_SCHOOL_QUALITY_TIER_1: "Poor"
 CC_XP_SCHOOL_QUALITY_TIER_2: "Adequate"
 CC_XP_SCHOOL_QUALITY_TIER_3: "Good"
 CC_XP_SCHOOL_QUALITY_TIER_4: "Excellent"
 CC_XP_SCHOOL_RENOWN_TT_HEAD: "#T Renown#!\nHow widely the school is known. It takes about a century to build: each year it rises 8% of the way toward its target (and falls 15% if above it). The seat, realm and teaching terms count only as far as the school is established, which is fully at 100 years."
 CC_XP_SCHOOL_RENOWN_TT_FOOT: "Halved while in exile, and 0 while the school has no members. Events and projects push renown directly; the push fades back toward the target over the following years.\n\nRenown sets the realm's prestige and cultural influence from its schools, and draws scholars (from 40), foreign students (from 30) and artists (from 50)."
 CC_XP_SCHOOL_QUALITY_TT_HEAD: "#T Quality#!\nHow good the teaching is. Each year it moves 20% of the way toward its target, which is the sum of:"
 CC_XP_SCHOOL_QUALITY_TT_FOOT: "10 flat while in exile, and 0 while the school has no members. Endow and Royal Chairs raise quality directly.\n\nQuality scales the school's seat and curriculum bonuses and its members' yearly experience. Current scale:"
 CC_XP_SCHOOL_TT_AGE: "Age:"
 CC_XP_SCHOOL_TT_MATURITY: "Established (scales the next three):"
 CC_XP_SCHOOL_TT_SEAT: "Seat (development, literacy, capital):"
 CC_XP_SCHOOL_TT_REALM: "Realm (prestige, rank, great power):"
 CC_XP_SCHOOL_TT_TEACHING: "Teaching (a fifth of quality):"
 CC_XP_SCHOOL_TT_TARGET: "Target:"
 CC_XP_SCHOOL_TT_FUNDING: "Funding (Culture budget):"
 CC_XP_SCHOOL_TT_RECTOR: "Rector (10 plus their seniority):"
 CC_XP_SCHOOL_TT_STABLE: "Settled curriculum:"
 CC_XP_SCHOOL_TT_SENIORS: "Senior members (3 each, up to 15):"
 CC_XP_SCHOOL_STANDING_PREFIX: "Rank"
 CC_XP_SCHOOL_STANDING_TT: "Where this school's renown places it among the world's universities. Every foreign location with a university is scored once a year on its seat and its realm, plus 15 as an established foundation. This is one more than the number that score above this school's renown."
 CC_XP_SCHOOL_FOUNDED_PREFIX: "Founded"
 CC_XP_SCHOOL_FOUNDER_TT: "The minister who founded this school and chose its discipline."
 CC_XP_SCHOOLS_RIVAL_LABEL: "Leading foreign university:"
 CC_XP_SCHOOLS_RIVAL_TT: "The most prominent university outside the realm, and its score. Rescored every year. A school whose renown is more than 10 behind it may lose masters and students to it."

 # Funding
 CC_XP_SCHOOL_FUNDING_LABEL: "Funding"
 CC_XP_SCHOOL_FUNDING_CULTURE: "Culture budget at #Y [Player.MakeScope.GetVariable('cc_xp_school_culture_pos').GetValue|%0]#!"
 CC_XP_SCHOOL_FUNDING_CUSTOMARY: "Customary allowance"
 CC_XP_SCHOOL_FUNDING_CUSTOMARY_TT: "This realm cannot yet invest in culture. Until it can, its schools live on a customary allowance that settles quality at 35 and costs nothing."
 CC_XP_SCHOOL_FUNDING_TT: "Schools are paid for out of the realm's #Y Culture#! budget. The higher the Culture slider, the higher the quality each school settles at (20 at an empty slider, 45 at half, 70 at full), and the more it costs: up to 5% of monthly trade and tax income per seated school, scaled by the slider. Before the realm can invest in culture, schools live on a customary allowance that settles quality at 35 and costs nothing. Nothing is paid while a school is in exile or has no members."
 CC_XP_SCHOOL_PER_MONTH: " a month"

 # Option gates
 cc_xp_tt_school_quality_40: "The school's quality is at least 40"
 cc_xp_tt_school_quality_50: "The school's quality is at least 50"
 cc_xp_tt_school_quality_60: "The school's quality is at least 60"
 cc_xp_tt_school_coastal: "The school's seat is on the coast"

 # New curricula
 CC_XP_CURRICULUM_6: "Medicine"
 CC_XP_CURRICULUM_7: "Navigation"
 CC_XP_CURRICULUM_6_TT: "Medicine. An administrative curriculum. At the seat: disease resistance and population growth. Across the realm: disease resistance, and society moves toward Humanist. Requires quality 50 to adopt.\n\nBonuses are scaled by the school's quality. The realm gains each curriculum's national bonus once, however many schools teach it."
 CC_XP_CURRICULUM_7_TT: "Navigation. A military curriculum. At the seat: faster shipbuilding and more sailors. Across the realm: naval range and navy tradition, and society moves toward Naval. Requires a coastal seat to adopt.\n\nBonuses are scaled by the school's quality. The realm gains each curriculum's national bonus once, however many schools teach it."

 # Fourth disputation options (quality 60)
 cc_xp_school.11.d: "Have the masters draft a code that settles the question."
 cc_xp_school.12.d: "Convene the masters and the bishops together."
 cc_xp_school.13.d: "Announce the result to the learned of every court."
 cc_xp_school.14.d: "Found a press at the school."
 cc_xp_school.15.d: "Let the masters write the realm's drill manual."
 cc_xp_school.16.title: "A Dispute over the Physicians"
 cc_xp_school.16.desc: "The physicians at [cc_xp_school_new_seat.GetName] have split. One party teaches from the ancient authorities; the other has been studying the bodies of executed criminals and says the authorities are wrong. Both have asked the crown to settle it."
 cc_xp_school.16.a: "Fund a hospital where both can be tested."
 cc_xp_school.16.b: "Follow the ancient authorities."
 cc_xp_school.16.c: "Let the students study the dead."
 cc_xp_school.16.d: "Publish the findings."
 cc_xp_school.17.title: "Charts and Stars"
 cc_xp_school.17.desc: "The masters at [cc_xp_school_new_seat.GetName] have finished a new set of tables for finding a ship's position at sea. The merchants want them kept for their own captains. The masters want them printed."
 cc_xp_school.17.a: "Commission new charts from them."
 cc_xp_school.17.b: "Send the masters to sea with the fleet."
 cc_xp_school.17.c: "Keep the tables for our own captains."
 cc_xp_school.17.d: "Print the tables for all to use."

 # ---- Renown events ----
 cc_xp_school.30.title: "A Promising Scholar"
 cc_xp_school.30.desc: "The school at [cc_xp_school_new_seat.GetName] has drawn a young scholar of real ability, [cc_xp_school_scholar.GetName], who came because of the school's name. The masters think they could be made into something."
 cc_xp_school.30.a: "Take them into the crown's care as a protege."
 cc_xp_school.30.b: "Give them a place at court and in the school."
 cc_xp_school.30.c: "We have no place for them."
 cc_xp_school.31.title: "A Foreign Student"
 cc_xp_school.31.desc: "A family of standing abroad has sent its heir to study at [cc_xp_school_new_seat.GetName]. The school's name reached them before any ambassador of ours did."
 cc_xp_school.31.a: "Charge the full fees."
 cc_xp_school.31.b: "Waive the fees as a courtesy."
 cc_xp_school.31.c: "Give them the best masters we have."
 cc_xp_school.32.title: "An Artist Drawn to the School"
 cc_xp_school.32.desc: "[cc_xp_school_artist.GetName], an artist with a growing reputation, has come to [cc_xp_school_new_seat.GetName] to work among its scholars, and asks whether the crown has a place for them."
 cc_xp_school.32.a: "Offer them a place at court."
 cc_xp_school.32.b: "We have no room for them."
 cc_xp_school.40.title: "A Master Is Courted"
 cc_xp_school.40.desc: "One of the best masters at [cc_xp_school_new_seat.GetName] has been offered a chair at [cc_xp_school_rival.GetName], whose university now outshines ours. The offer is generous."
 cc_xp_school.40.a: "Match the offer."
 cc_xp_school.40.b: "Remind them what they owe the crown."
 cc_xp_school.40.c: "Let them go."
 cc_xp_school.41.title: "Students Leave"
 cc_xp_school.41.desc: "Students who would have come to [cc_xp_school_new_seat.GetName] are going to [cc_xp_school_rival.GetName] instead. Its masters are better known, and the sons of our own merchants are among those leaving."
 cc_xp_school.41.a: "Fund scholarships to keep them here."
 cc_xp_school.41.b: "Forbid study abroad."
 cc_xp_school.41.c: "Let them go."
 cc_xp_school.42.title: "First Among Universities"
 cc_xp_school.42.desc: "No university in the known world is spoken of more than the school at [cc_xp_school_new_seat.GetName]. Scholars who once went elsewhere now come here, and foreign courts ask for its masters by name."
 cc_xp_school.42.a: "Host a congress of scholars."
 cc_xp_school.42.b: "Celebrate it at court."

 # ---- Housekeeping and durations ----
 cc_xp_school_tt_curriculum_switch: "The school's present curriculum bonuses end, and the new curriculum's apply at its seat and across the realm."
 cc_xp_school_while_seated: "as long as the school is seated here"
 cc_xp_school_while_taught: "as long as one of our schools teaches this curriculum"
 cc_xp_school_while_renowned: "as long as our schools keep their renown"

 # ---- Static modifiers ----
 STATIC_MODIFIER_NAME_cc_xp_school_seat_law: "Seat of a School of Law"
 STATIC_MODIFIER_DESC_cc_xp_school_seat_law: "The school here trains lawyers and clerks, and the town is governed by people who learned their trade in it."
 STATIC_MODIFIER_NAME_cc_xp_school_seat_theology: "Seat of a School of Theology"
 STATIC_MODIFIER_DESC_cc_xp_school_seat_theology: "The school here trains preachers and confessors, and its sermons reach the whole town."
 STATIC_MODIFIER_NAME_cc_xp_school_seat_natural_philosophy: "Seat of a School of Natural Philosophy"
 STATIC_MODIFIER_DESC_cc_xp_school_seat_natural_philosophy: "The school here teaches reading, measuring and reckoning to anyone who can pay, and many can."
 STATIC_MODIFIER_NAME_cc_xp_school_seat_letters: "Seat of a School of Letters"
 STATIC_MODIFIER_DESC_cc_xp_school_seat_letters: "Poets, orators and copyists gather around the school here, and what they write travels."
 STATIC_MODIFIER_NAME_cc_xp_school_seat_military_science: "Seat of a School of Military Science"
 STATIC_MODIFIER_DESC_cc_xp_school_seat_military_science: "Officers trained at the school here keep the surrounding country in order."
 STATIC_MODIFIER_NAME_cc_xp_school_seat_medicine: "Seat of a School of Medicine"
 STATIC_MODIFIER_DESC_cc_xp_school_seat_medicine: "The physicians of the school here treat the town, and fewer of its people die of what can be treated."
 STATIC_MODIFIER_NAME_cc_xp_school_seat_navigation: "Seat of a School of Navigation"
 STATIC_MODIFIER_DESC_cc_xp_school_seat_navigation: "Shipwrights and pilots learn their trade at the school here."
 STATIC_MODIFIER_NAME_cc_xp_school_realm_law: "Schooled in Law"
 STATIC_MODIFIER_DESC_cc_xp_school_realm_law: "The realm's officials are trained at its own school of law."
 STATIC_MODIFIER_NAME_cc_xp_school_realm_theology: "Schooled in Theology"
 STATIC_MODIFIER_DESC_cc_xp_school_realm_theology: "The realm's clergy are trained at its own school of theology."
 STATIC_MODIFIER_NAME_cc_xp_school_realm_natural_philosophy: "Schooled in Natural Philosophy"
 STATIC_MODIFIER_DESC_cc_xp_school_realm_natural_philosophy: "The realm's own school of natural philosophy feeds new knowledge to the court."
 STATIC_MODIFIER_NAME_cc_xp_school_realm_letters: "Schooled in Letters"
 STATIC_MODIFIER_DESC_cc_xp_school_realm_letters: "The realm's school of letters makes its court admired abroad, and its correspondence reaches further."
 STATIC_MODIFIER_NAME_cc_xp_school_realm_military_science: "Schooled in Military Science"
 STATIC_MODIFIER_DESC_cc_xp_school_realm_military_science: "The realm's officers are trained at its own school of military science."
 STATIC_MODIFIER_NAME_cc_xp_school_realm_medicine: "Schooled in Medicine"
 STATIC_MODIFIER_DESC_cc_xp_school_realm_medicine: "Physicians trained at the realm's school of medicine practise across the country."
 STATIC_MODIFIER_NAME_cc_xp_school_realm_navigation: "Schooled in Navigation"
 STATIC_MODIFIER_DESC_cc_xp_school_realm_navigation: "The realm's pilots are trained at its own school of navigation."
 STATIC_MODIFIER_NAME_cc_xp_school_seat_public_finance: "Seat of a School of Public Finance"
 STATIC_MODIFIER_DESC_cc_xp_school_seat_public_finance: "Clerks trained at the school here keep the accounts of the town's workshops, and fewer of them fail."
 STATIC_MODIFIER_NAME_cc_xp_school_realm_public_finance: "Schooled in Public Finance"
 STATIC_MODIFIER_DESC_cc_xp_school_realm_public_finance: "The realm's tax officials are trained at its own school of public finance."
 STATIC_MODIFIER_NAME_cc_xp_school_seat_rhetoric: "Seat of a School of Rhetoric"
 STATIC_MODIFIER_DESC_cc_xp_school_seat_rhetoric: "The orators of the school here argue the town's grievances in the hall rather than the street."
 STATIC_MODIFIER_NAME_cc_xp_school_realm_rhetoric: "Schooled in Rhetoric"
 STATIC_MODIFIER_DESC_cc_xp_school_realm_rhetoric: "The realm's envoys are trained at its own school of rhetoric."
 STATIC_MODIFIER_NAME_cc_xp_school_seat_languages: "Seat of a School of Languages"
 STATIC_MODIFIER_DESC_cc_xp_school_seat_languages: "Translators and travellers gather at the school here, and the town's speech carries beyond the realm."
 STATIC_MODIFIER_NAME_cc_xp_school_realm_languages: "Schooled in Languages"
 STATIC_MODIFIER_DESC_cc_xp_school_realm_languages: "Interpreters trained at the realm's school of languages serve its courts, its envoys and its provinces."
 STATIC_MODIFIER_NAME_cc_xp_school_seat_commerce: "Seat of a School of Commerce"
 STATIC_MODIFIER_DESC_cc_xp_school_seat_commerce: "The school here teaches reckoning and exchange to the town's merchants, and its market draws trade."
 STATIC_MODIFIER_NAME_cc_xp_school_realm_commerce: "Schooled in Commerce"
 STATIC_MODIFIER_DESC_cc_xp_school_realm_commerce: "The realm's factors and merchants are trained at its own school of commerce."
 STATIC_MODIFIER_NAME_cc_xp_school_seat_history: "Seat of a School of History and Genealogy"
 STATIC_MODIFIER_DESC_cc_xp_school_seat_history: "The chroniclers of the school here keep the records and customs of the town."
 STATIC_MODIFIER_NAME_cc_xp_school_realm_history: "Schooled in History and Genealogy"
 STATIC_MODIFIER_DESC_cc_xp_school_realm_history: "The realm's own school of history keeps its records and the descent of its ruling house."
 STATIC_MODIFIER_NAME_cc_xp_school_seat_fortification: "Seat of a School of Fortification"
 STATIC_MODIFIER_DESC_cc_xp_school_seat_fortification: "Engineers trained at the school here keep the town's walls manned and in repair."
 STATIC_MODIFIER_NAME_cc_xp_school_realm_fortification: "Schooled in Fortification"
 STATIC_MODIFIER_DESC_cc_xp_school_realm_fortification: "The realm's forts are kept by engineers trained at its own school of fortification."
 STATIC_MODIFIER_NAME_cc_xp_school_seat_gunnery: "Seat of a School of Gunnery"
 STATIC_MODIFIER_DESC_cc_xp_school_seat_gunnery: "Gun founders work alongside the school here, and the town's foundries prosper from it."
 STATIC_MODIFIER_NAME_cc_xp_school_realm_gunnery: "Schooled in Gunnery"
 STATIC_MODIFIER_DESC_cc_xp_school_realm_gunnery: "The realm's gunners are trained at its own school of gunnery."
 STATIC_MODIFIER_NAME_cc_xp_school_seat_logistics: "Seat of a School of Logistics"
 STATIC_MODIFIER_DESC_cc_xp_school_seat_logistics: "Quartermasters trained at the school here keep the town's granaries full."
 STATIC_MODIFIER_NAME_cc_xp_school_realm_logistics: "Schooled in Logistics"
 STATIC_MODIFIER_DESC_cc_xp_school_realm_logistics: "The realm's quartermasters are trained at its own school of logistics."
 STATIC_MODIFIER_NAME_cc_xp_school_kind_studium: "Studium"
 STATIC_MODIFIER_DESC_cc_xp_school_kind_studium: "A studium of the Western church is seated here."
 STATIC_MODIFIER_NAME_cc_xp_school_kind_academy: "Academy"
 STATIC_MODIFIER_DESC_cc_xp_school_kind_academy: "An academy in the Eastern tradition is seated here."
 STATIC_MODIFIER_NAME_cc_xp_school_kind_madrasa: "Madrasa"
 STATIC_MODIFIER_DESC_cc_xp_school_kind_madrasa: "A madrasa is seated here."
 STATIC_MODIFIER_NAME_cc_xp_school_kind_shuyuan: "Shuyuan"
 STATIC_MODIFIER_DESC_cc_xp_school_kind_shuyuan: "A shuyuan, an academy in the East Asian tradition, is seated here."
 STATIC_MODIFIER_NAME_cc_xp_school_kind_vihara: "Vihara"
 STATIC_MODIFIER_DESC_cc_xp_school_kind_vihara: "A monastic school is seated here."
 STATIC_MODIFIER_NAME_cc_xp_school_kind_gurukula: "Gurukula"
 STATIC_MODIFIER_DESC_cc_xp_school_kind_gurukula: "A gurukula is seated here."
 STATIC_MODIFIER_NAME_cc_xp_school_kind_yeshiva: "Yeshiva"
 STATIC_MODIFIER_DESC_cc_xp_school_kind_yeshiva: "A yeshiva is seated here."
 STATIC_MODIFIER_NAME_cc_xp_school_kind_school: "Seat of a School"
 STATIC_MODIFIER_DESC_cc_xp_school_kind_school: "One of the realm's schools is seated here."
 STATIC_MODIFIER_NAME_cc_xp_school_library: "Endowed Library"
 STATIC_MODIFIER_DESC_cc_xp_school_library: "The crown has paid for books, instruments and a building for the school here."
 STATIC_MODIFIER_NAME_cc_xp_school_scholars: "Foreign Scholars"
 STATIC_MODIFIER_DESC_cc_xp_school_scholars: "Scholars from abroad have come to teach at the school here, and bring new ideas with them."
 STATIC_MODIFIER_NAME_cc_xp_school_drill: "The School's Drill"
 STATIC_MODIFIER_DESC_cc_xp_school_drill: "The army drills to a manual written at the realm's school of military science."
 STATIC_MODIFIER_NAME_cc_xp_school_statute: "Statute over Custom"
 STATIC_MODIFIER_DESC_cc_xp_school_statute: "The courts follow royal statute where it and custom disagree, as the school's lawyers argued."
 STATIC_MODIFIER_NAME_cc_xp_school_renown: "Renowned Schools"
 STATIC_MODIFIER_DESC_cc_xp_school_renown: "The realm's schools are known abroad, and their reputation is the court's. Scales with the renown of the realm's most renowned school."

 # ---- Disputations for curricula 8-15 (cc_xp_school.50-57) ----
 cc_xp_school.50.title: "A Treatise on the Revenue"
 cc_xp_school.50.desc: "The masters at [cc_xp_school_new_seat.GetName] have finished a treatise on how the crown collects its revenue, with tables showing where the money is lost on its way to the treasury. Several of the losses lead to noble houses."
 cc_xp_school.50.a: "Adopt the new accounts."
 cc_xp_school.50.b: "Teach it in the lecture hall, and leave the treasury alone."
 cc_xp_school.50.c: "Share it with the guilds, who keep better books than we do."
 cc_xp_school.50.d: "Make the masters auditors of the treasury."
 cc_xp_school.51.title: "A Contest of Orators"
 cc_xp_school.51.desc: "A visiting envoy challenged the masters at [cc_xp_school_new_seat.GetName] to argue against him in public. Their best orator spoke for an hour without notes, and the envoy left before the end."
 cc_xp_school.51.a: "Send our champion with the next embassy."
 cc_xp_school.51.b: "Keep that skill for our own chancery."
 cc_xp_school.51.c: "Have the students argue both sides of every question."
 cc_xp_school.51.d: "Print the orations for every court to read."
 cc_xp_school.52.title: "A Grammar of a Distant Tongue"
 cc_xp_school.52.desc: "The masters at [cc_xp_school_new_seat.GetName] have completed a grammar and a dictionary of a language few at court have ever heard spoken. They say it opens a door. They have not agreed whose door."
 cc_xp_school.52.a: "Train interpreters for the court."
 cc_xp_school.52.b: "Give it to the merchants who trade there."
 cc_xp_school.52.c: "Give it to those who would carry the faith there."
 cc_xp_school.52.d: "Print it, and let every scholar learn from it."
 cc_xp_school.53.title: "The Merchant's Arithmetic"
 cc_xp_school.53.desc: "The masters at [cc_xp_school_new_seat.GetName] have begun teaching the keeping of accounts by double entry, the way the great trading houses do it. The houses would prefer that it remain their secret."
 cc_xp_school.53.a: "Require it of every royal factor and tax farmer."
 cc_xp_school.53.b: "Let the trading houses keep their secret."
 cc_xp_school.53.c: "Teach it to every student who will sit through it."
 cc_xp_school.53.d: "Have the masters lecture on exchange and coinage as well."
 cc_xp_school.54.title: "The Chronicle of the Realm"
 cc_xp_school.54.desc: "The masters at [cc_xp_school_new_seat.GetName] have written a history of the realm from its founding. It is learned, it is readable, and in places it is unkind to the ancestors of people who sit at court."
 cc_xp_school.54.a: "Have it revised to honour the dynasty."
 cc_xp_school.54.b: "Let it stand as written."
 cc_xp_school.54.c: "Use it to settle the noble pedigrees in dispute."
 cc_xp_school.54.d: "Make it the realm's official history."
 cc_xp_school.55.title: "Bastions on Paper"
 cc_xp_school.55.desc: "The masters at [cc_xp_school_new_seat.GetName] have drawn a new kind of fortress: low, angled walls that no cannon can breach and every gun can cover. On paper it is invulnerable. On paper it is also very expensive."
 cc_xp_school.55.a: "Rebuild the walls of the seat to the new design."
 cc_xp_school.55.b: "Send the masters to inspect the frontier forts."
 cc_xp_school.55.c: "The old walls have served us well enough."
 cc_xp_school.55.d: "Publish the treatise on fortification."
 cc_xp_school.56.title: "Trials at the Foundry"
 cc_xp_school.56.desc: "The masters at [cc_xp_school_new_seat.GetName] have been testing new proportions for cannon at the foundry. The last gun burst on its third firing and took a shed with it. The masters say this proves they are close."
 cc_xp_school.56.a: "Fund more trials."
 cc_xp_school.56.b: "Give the formulas to the gun founders."
 cc_xp_school.56.c: "Stop the trials before someone is killed."
 cc_xp_school.56.d: "Have the masters write the gunners' manual."
 cc_xp_school.57.title: "The Victualling Problem"
 cc_xp_school.57.desc: "The masters at [cc_xp_school_new_seat.GetName] have studied why our last campaign lost more men to hunger than to the enemy. Their answer is magazines: grain stored in advance along the roads the army will take, and bought from the countryside before it is needed."
 cc_xp_school.57.a: "Build the magazines."
 cc_xp_school.57.b: "Train the quartermasters at the school."
 cc_xp_school.57.c: "Leave supply to the contractors, as before."
 cc_xp_school.57.d: "Have the masters plan the supply of the next campaign."
 CC_XP_CURRICULUM_8: "Public Finance"
 CC_XP_CURRICULUM_8_TT: "Public Finance. An administrative curriculum. At the seat: production efficiency. Across the realm: tax income efficiency, and society moves toward Centralization.\n\nBonuses are scaled by the school's quality. The realm gains each curriculum's national bonus once, however many schools teach it."
 CC_XP_CURRICULUM_9: "Rhetoric"
 CC_XP_CURRICULUM_9_TT: "Rhetoric. A diplomatic curriculum. At the seat: less unrest. Across the realm: diplomatic reputation and a stronger effect from improving relations, and society moves toward Conciliatory.\n\nBonuses are scaled by the school's quality. The realm gains each curriculum's national bonus once, however many schools teach it."
 CC_XP_CURRICULUM_10: "Languages"
 CC_XP_CURRICULUM_10_TT: "Languages. A diplomatic curriculum. At the seat: cultural influence. Across the realm: faster assimilation and tolerance of heathens, and society moves toward Outward.\n\nBonuses are scaled by the school's quality. The realm gains each curriculum's national bonus once, however many schools teach it."
 CC_XP_CURRICULUM_11: "Commerce"
 CC_XP_CURRICULUM_11_TT: "Commerce. A diplomatic curriculum. At the seat: market access. Across the realm: land and sea trade efficiency, and society moves toward Free Trade.\n\nBonuses are scaled by the school's quality. The realm gains each curriculum's national bonus once, however many schools teach it."
 CC_XP_CURRICULUM_12: "History and Genealogy"
 CC_XP_CURRICULUM_12_TT: "History and Genealogy. A diplomatic curriculum. At the seat: cultural tradition. Across the realm: monthly legitimacy, and society moves toward Traditionalist.\n\nBonuses are scaled by the school's quality. The realm gains each curriculum's national bonus once, however many schools teach it."
 CC_XP_CURRICULUM_13: "Fortification"
 CC_XP_CURRICULUM_13_TT: "Fortification. A military curriculum. At the seat: larger garrisons and cheaper fort upkeep. Across the realm: cheaper fort upkeep, and society moves toward Defensive.\n\nBonuses are scaled by the school's quality. The realm gains each curriculum's national bonus once, however many schools teach it."
 CC_XP_CURRICULUM_14: "Gunnery"
 CC_XP_CURRICULUM_14_TT: "Gunnery. A military curriculum. At the seat: production efficiency, from its foundries. Across the realm: artillery power, and society moves toward Offensive. Requires the Age of Discovery to adopt.\n\nBonuses are scaled by the school's quality. The realm gains each curriculum's national bonus once, however many schools teach it."
 CC_XP_CURRICULUM_15: "Logistics"
 CC_XP_CURRICULUM_15_TT: "Logistics. A military curriculum. At the seat: food capacity. Across the realm: higher supply limit and less land attrition, and society moves toward Quantity.\n\nBonuses are scaled by the school's quality. The realm gains each curriculum's national bonus once, however many schools teach it."
