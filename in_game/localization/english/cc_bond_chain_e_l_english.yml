 # === cc_bonds.202 — Faith Under the Surface ===
 cc_bonds.202.title: "Faith Under the Surface"
 cc_bonds.202.desc: "The conversion of [bond_subj.GetName] to the faith of the Crown happened when the cultural relationship between us was already at its most strained. The clergy certified it; the ceremonies were conducted; the official record is correct. But reports reaching us now describe something the official record does not account for: devotional objects concealed behind market stalls, rituals observed in basements, a clergy of the old faith that has not dispersed so much as gone quiet.\n\nThe conversion, it appears, did not reach as far as we were told. The question is how far we are willing to go to complete it — and what completing it will cost."

 cc_bonds.202.a: "Purge the hidden faithful. The conversion must be made real."
 cc_bonds.202.a.tooltip: "A vigorous inquisition yields religious influence — but the political and military costs are real. Liberty desire rises as the crackdown makes clear what the conversion always was."

 cc_bonds.202.b: "Let the practice continue quietly. We see nothing; we hear nothing."
 cc_bonds.202.b.tooltip: "The cultural relationship deteriorates further — tolerated practice without formal acceptance erodes the bond. The forced-religion flag persists; this situation may resurface."

 cc_bonds.202.c: "Formalize limited tolerance. The old faith may be practiced privately."
 cc_bonds.202.c.tooltip: "A real cost in religious influence — but the cultural dimension recovers, and pol improves as the subject experiences a meaningful concession from the Crown. The memory is cleared."
