 # ============================================================
 # Modifier Display Names (Pillar 01)
 # ============================================================
 STATIC_MODIFIER_NAME_court_tension: "Court Tension"
 STATIC_MODIFIER_DESC_court_tension: "Two or more cabinet members represent irreconcilable positions. Political paralysis has set in — prestige bleeds, diplomatic reputation suffers, and every decision costs more."

 STATIC_MODIFIER_NAME_cc_cabal_compact: "Cabinet Compact"
 STATIC_MODIFIER_DESC_cc_cabal_compact: "Two allied ministers have formalised their working relationship. The cabinet functions more smoothly, and shared authority reduces the friction of governance."

 STATIC_MODIFIER_NAME_cc_faction_purge_fallout: "Factional Fallout"
 STATIC_MODIFIER_DESC_cc_faction_purge_fallout: "A minister's dismissal has not gone unanswered. The network of the purged minister is quietly retaliating — prestige erodes and diplomatic contacts grow cool."

 # ============================================================
 # Character Interaction — Dismiss Rival Minister
 # ============================================================
 dismiss_rival_minister: "Dismiss Minister"
 dismiss_rival_minister_desc: "The court is fracturing around a factional rivalry. Dismissing one of the ministers will resolve the immediate conflict — at a cost to prestige and, if the minister is estate-aligned, to estate relations."
 choose_minister_to_dismiss: "Choose a minister to dismiss"
