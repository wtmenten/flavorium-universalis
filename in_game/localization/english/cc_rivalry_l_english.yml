l_english:
 # ============================================================
 # Pillar 01 — Court Rivalry & Cabinet Intrigue
 # ============================================================

 # --- cc_rival.1 — The Minister's Complaint ---
 cc_rival.1.title: "The Minister's Complaint"
 cc_rival.1.desc: "The tension between [scope:rival_a.GetName] and [scope:rival_b.GetName] has reached an open rupture. Both have now made formal representations to the crown, each demanding that the other be removed or rebuked. The court watches."

 cc_rival.1.a: "Side with [scope:rival_a.GetName]."
 cc_rival.1.a.tooltip: "[scope:rival_b.GetName] receives the clear message that [scope:rival_b.GetHerHis] position in this court is conditional on restraint. The snub will not be forgotten — but the tension breaks."

 cc_rival.1.b: "Side with [scope:rival_b.GetName]."
 cc_rival.1.b.tooltip: "[scope:rival_a.GetName] is put in [scope:rival_a.GetHerHis] place. The court reads the signal; one faction cools while the other nurses a wound."

 cc_rival.1.c: "Broker a reconciliation between them."
 cc_rival.1.c.tooltip: "An expensive and exhausting exercise in royal patience. Both ministers leave the throne room satisfied — for now. The rivalry score drops, and goodwill is purchased at the cost of coin and prestige."

 cc_rival.1.d: "Exploit the tension — open their correspondence."
 cc_rival.1.d.tooltip: "Let the court's spymasters open what has been sealed. If there is scheming, better to know. If there is nothing — at least one of them will wonder what you found."

 # --- cc_rival.2 — A Letter Unsealed ---
 cc_rival.2.title: "A Letter Unsealed"
 cc_rival.2.desc: "The correspondence of [scope:rival_b.GetName] has been quietly reviewed. What was found is not treasonous — but it is damaging. Private communications with [scope:rival_a.GetName]'s opponents; commitments made without royal approval; favours promised in the crown's name. The letter sits before you now."

 cc_rival.2.a: "Use it to purge [scope:rival_b.GetName] from the cabinet."
 cc_rival.2.a.tooltip: "The letter becomes a formal pretext. [scope:rival_b.GetName] is confronted, prestige suffers from the spectacle of an open dismissal, and [scope:rival_b.GetHerHis] network will quietly resent the crown for years."

 cc_rival.2.b: "Pass it to [scope:rival_a.GetName] as leverage."
 cc_rival.2.b.tooltip: "The letter finds its way to the rival. [scope:rival_a.GetName] will use it as ammunition — and the factional conflict will intensify before it resolves. You gain prestige from [scope:rival_a.GetHerHis] gratitude, but the war between them has only begun."

 cc_rival.2.c: "Suppress it — burn the letter."
 cc_rival.2.c.tooltip: "The wisest choice is sometimes to know less. The rivalry score falls slightly, and no one will know exactly what was read — except you."

 # --- cc_rival.3 — The Faction Hardens ---
 cc_rival.3.title: "The Faction Hardens"
 cc_rival.3.desc: "[scope:rival_a.GetName] has wielded the intelligence effectively. The court is now openly divided. [scope:rival_b.GetName]'s supporters have begun forming a bloc — quiet dinners, shared correspondence, coordinated positions on every issue. What began as personal rivalry has become a factional confrontation."

 cc_rival.3.a: "Crack down on the faction."
 cc_rival.3.a.tooltip: "A costly and visible intervention. [scope:rival_b.GetName]'s network is broken up; the court knows the crown will not tolerate open opposition. Prestige bleeds, stability frays, and the faction's survivors scatter — but they will remember."

 cc_rival.3.b: "Allow the faction to exhaust itself."
 cc_rival.3.b.tooltip: "You do nothing and let the factions fight. The tension will endure for years, stability will suffer, and the court will grow more fractious — but no blood is shed and no one is made an enemy of the crown."

 cc_rival.3.c: "Elevate [scope:rival_a.GetName]'s faction publicly."
 cc_rival.3.c.tooltip: "A formal declaration of preference. [scope:rival_a.GetName] receives the crown's endorsement: a gain in skill, and renewed loyalty. [scope:rival_b.GetName]'s faction dissolves in embarrassment. The prestige cost is real — but so is the resolution."

 # --- cc_cabal.1 — The Alliance Forms ---
 cc_cabal.1.title: "An Alliance at Court"
 cc_cabal.1.desc: "It has been noticed that [scope:cabal_a.GetName] and [scope:cabal_b.GetName] have developed a remarkable working relationship. They defer to each other in council, share intelligence across their portfolios, and present a unified position on nearly every significant matter. Whether this is friendship, calculation, or something in between — the court has begun to speak of them as a pair."

 cc_cabal.1.a: "Formalize their alliance — let them work as a compact."
 cc_cabal.1.a.tooltip: "A rare thing: two ministers whose ambitions are aligned. Formalizing the compact signals your confidence and makes their cooperation official policy. A joint reform proposal will follow."

 cc_cabal.1.b: "Let them collaborate informally."
 cc_cabal.1.b.tooltip: "No formal sanction, but no objection either. The bond between them deepens without becoming a court institution. Simpler, and safer."

 cc_cabal.1.c: "Discourage the partnership."
 cc_cabal.1.c.tooltip: "Two powerful ministers in explicit coordination is a political risk. A discreet word from the throne makes clear that the cabinet is not to become a faction. Both ministers are slightly cooled."

 # --- cc_cabal.2 — The Joint Reform Proposal ---
 cc_cabal.2.title: "The Joint Reform Proposal"
 cc_cabal.2.desc: "[scope:cabal_a.GetName] and [scope:cabal_b.GetName] have presented a formal joint proposal to the crown — a coordinated reform drawing on both their areas of expertise. The document is thorough, politically astute, and almost certainly the product of many months of private preparation. It only waits on royal approval."

 cc_cabal.2.a: "Approve the joint proposal."
 cc_cabal.2.a.tooltip: "The compact is ratified. Both ministers receive a formal acknowledgement of their combined authority. Cabinet efficiency improves, stability edges upward, and the cabal becomes an institutional feature of the court."

 cc_cabal.2.b: "Decline — the crown should not cede this initiative."
 cc_cabal.2.b.tooltip: "A cold rejection. The proposal is shelved. Both ministers understood the message clearly — and neither is entirely pleased."

