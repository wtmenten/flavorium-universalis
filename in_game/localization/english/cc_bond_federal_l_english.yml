l_english:

 # ============================================================
 # AoR FEDERAL BOND EVENTS - cc_bonds.140-145 and coverage
 # ============================================================

 # === cc_bonds.140 - The Federal Member Stands with the Union ===
 cc_bonds.140.title: "The Federal Member Stands with the Union"
 cc_bonds.140.desc: "The Age of Revolutions has arrived and every bond of loyalty is being tested. [bond_subj.GetName] has passed with a clarity that needs no interpretation. Their parliament has renewed the federal compact, their leadership has spoken for the union in public, and their population, in a moment when looking the other way would have been easy, has not. Years of equal treatment and genuine consultation have produced what no administrator can manufacture."
 cc_bonds.140.desc.deep: "The parliament of [bond_subj.GetName] has done more than renew the compact. It has voted to send its own regiments to garrison provinces that are not theirs, on the argument that the union is one country or it is nothing. The debate was public, the vote was not close, and the transcript has been reprinted in three other federal capitals. They are not defending us. They are defending something they consider partly theirs."
 cc_bonds.140.a: "Celebrate this publicly. The empire is built on relationships like this one."
 cc_bonds.140.b: "Formalize it. Let the federal parliament, not the crown, hold the union together."

 # === cc_bonds.141 - The Federal Member Demands Equal Rights ===
 cc_bonds.141.title: "The Federal Member Demands Equal Rights"
 cc_bonds.141.desc: "The Age of Revolutions has reached [bond_subj.GetName], and their parliament has drafted something pointed: a formal demand for equal representation and equal standing within the federal compact, meaning the substantive kind rather than the paper kind. The document is calm in tone and devastating in content. It lists the decisions in which their representation was overridden and the moments when federal turned out to mean subject to review. They are not threatening independence. They are asking whether the federation is real."
 cc_bonds.141.desc.deep: "The parliament of [bond_subj.GetName] has answered its own question. It has passed a resolution declaring the federal compact void for non-performance, cited forty years of precedent, and adjourned. Their delegates have gone home. No troops have moved and no declaration has been issued, which somehow makes it worse: they have not rebelled against the union, they have ruled that it does not exist."
 cc_bonds.141.desc.scholar: "The demand from [bond_subj.GetName] is not written in the language of petitions. It is written in the language of the scholar we suppressed a generation ago, whose arguments about consent and compact were dangerous enough to silence and apparently not dangerous enough to answer. Their parliament has adopted his framework wholesale. We had the chance to argue with one man. We are now arguing with a legislature that has memorized him."
 cc_bonds.141.a: "It is real. Grant the full representation they are owed."
 cc_bonds.141.b: "The demand is noted. The answer is no."
 cc_bonds.141.c: "Dissolve the union rather than fight over the word."

 # === cc_bonds.142 - The Associate Member Submits Its Petition ===
 cc_bonds.142.title: "The Associate Member Submits Its Petition"
 cc_bonds.142.desc: "The leadership of [bond_subj.GetName] has submitted a formal petition. It is not a demand, since they are too careful for that, but it is as close as they were willing to come. They ask with considerable delicacy whether the grounds for full federal membership might now be considered, and they point to their economic contributions, their military support and their years of cooperation despite the limits of associate status. They are asking because they have earned it and suspect the court may agree."
 cc_bonds.142.desc.deep: "The petition from [bond_subj.GetName] arrives with an appendix nobody asked for: a comparison of their contributions against those of two full members, over sixty years, with sources. The case is unanswerable and they know it. They have also taken care to submit it privately rather than publish it, which is the most persuasive thing in the document."
 cc_bonds.142.a: "Approve the petition. Elevate them to full federal membership."
 cc_bonds.142.b: "Acknowledge it. Honor the request with gold and a promise of review."
 cc_bonds.142.c: "Dismiss it. They are an associate member, and that is sufficient."

 # === cc_bonds.143 - The False Federation Unravels ===
 cc_bonds.143.title: "The False Federation Unravels"
 cc_bonds.143.desc: "Someone has been counting. The dispatches from [bond_subj.GetName] make clear the accounting is finished and the figures are not favorable. The charter promised equal standing and shared governance; the years since delivered extraction at scale and decisions imposed without consultation, in an arrangement that looks on examination like the colonial relationship it was meant to replace. The pamphlets circulating in their capital have stopped arguing that independence is desirable and started arguing that it is necessary."
 cc_bonds.143.desc.deep: "The charter of [bond_subj.GetName] has been read aloud in their assembly, clause by clause, with the corresponding record of what actually happened read after each one. It took two days. A transcript is already circulating in every capital that has ever signed anything with us. The federation is not unravelling. It has been publicly disassembled by people who kept better records than we did."
 cc_bonds.143.a: "End the pretense. Convert the charter into direct administration."
 cc_bonds.143.b: "Buy silence. Pay what is necessary to stabilize the situation."
 cc_bonds.143.c: "Make the charter real rather than defend the lie."
 cc_bonds.143.d: "Let it unfold. We have managed crises before."

 # === cc_bonds.144 - The Colony Asserts Its Place ===
 cc_bonds.144.title: "The Colony Asserts Its Place"
 cc_bonds.144.desc: "The word from [bond_subj.GetName] is neither a petition nor a demand but something harder to receive: a statement. The colonial leadership writes that they have watched the revolutionary currents sweeping the world and are not afraid of them, because they believe they hold something those currents cannot offer, built over decades of honest dealing and shared governance. They would like that relationship formalized, as partners rather than subjects. They believe the time has come and the empire will be stronger for it."
 cc_bonds.144.desc.deep: "The colonial assembly of [bond_subj.GetName] has voted for federation and sent the result with a delegation rather than a courier. Their case is that they have functioned as a partner for two generations and would prefer the paperwork to catch up. They have also made clear, courteously, that they have considered the alternative and rejected it on merit rather than for lack of opportunity."
 cc_bonds.144.desc.voice: "The assembly we chartered decades ago has voted, and it has voted for federation. That vote is the whole argument: they are asking to formalize something they have been practising since the day we gave them a hall to practise it in. Every other colony in the world is discovering this year what happens when there is nowhere to hold the debate. This one has held it, and reached a conclusion we can live with."
 cc_bonds.144.a: "Welcome them as full federal partners. The union is stronger for this."
 cc_bonds.144.b: "Offer associate membership. A genuine step, if not the one they asked for."
 cc_bonds.144.c: "Invite them into the Imperial Council as a first step."
 cc_bonds.144.d: "Decline. The current arrangement serves us adequately."

 # === cc_bonds.145 - The Client Seeks Cover ===
 cc_bonds.145.title: "The Client Seeks Cover"
 cc_bonds.145.desc: "The leadership of [bond_subj.GetName] has sent a private communication. They have been watching the Age of Revolutions and have identified something the revolutionary rhetoric cannot offer them: stability under a recognized imperial framework. What they want is legitimacy, the kind that comes from being a named partner in a constitutional arrangement rather than an informal client whose status rests on the goodwill of the present government. They are asking to be brought inside. The question is what kind of inside we are offering."
 cc_bonds.145.desc.deep: "The communication from [bond_subj.GetName] is unusually direct for a client state. They have had approaches from two other powers this year, they say so plainly, and they would rather stay. They are asking us to give them a reason that will survive the next change of government in our capital. A charter would do. Goodwill, they note, has not been doing."
 cc_bonds.145.a: "Bring them into the Imperial Council. A genuine constitutional arrangement."
 cc_bonds.145.b: "Offer them a federal charter. The partnership they want, on our terms."
 cc_bonds.145.c: "Maintain the current arrangement. There is no need to formalize anything."


 # ============================================================
 # SYNERGY EVENTS — cc_synergy.27–28
 # ============================================================

 # === cc_synergy.27 — National Reformer + Federal Architect ===
 cc_synergy.27.title: "A Parliament for the Empire"
 cc_synergy.27.desc: "Two of the most consequential minds in court have been talking to each other. [minister_a.GetName], who has spent their career redesigning the internal architecture of the state, and [minister_b.GetName], who has spent theirs holding the empire's diverse territories in productive relationship — they have found a shared project. They are proposing the formalization of a federal parliament: a body with genuine legislative standing, representing the member territories in proportion to their contributions, with real authority over shared matters of defense, trade, and law. They are asking whether the Crown is ready to govern an empire through law rather than through will."
 cc_synergy.27.a: "Yes. Commission the Federal Compact and convene the parliament."
 cc_synergy.27.b: "A smaller step first. Formalize parliamentary harmony and see what follows."

 # === cc_synergy.28 — Federal Architect + False Federal Member ===
 cc_synergy.28.title: "The Architect Reads the Charter"
 cc_synergy.28.desc: "[minister.GetName] has spent time reviewing the charter arrangement with [bond_subj.GetName], and their assessment is uncomfortable. The document, read closely, is a federal charter in name and a colonial compact in practice. The member's parliament has no binding authority. The representation is advisory. The economic arrangement flows in one direction. They are not saying this to embarrass the court. They are saying it because they believe the arrangement is a liability: when the population of [bond_subj.GetName] fully understands what they were given instead of what they were promised, the reaction will be worse than if the deception had never occurred. The question is whether the court wants to fix this while fixing it is still a choice."
 cc_synergy.28.a: "Make it real. Convert the charter to full federal membership."
 cc_synergy.28.b: "Partial reform. Elevate them to associate membership — a genuine improvement."
 cc_synergy.28.c: "The arrangement is profitable. Leave it as it is."
