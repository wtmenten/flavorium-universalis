l_english:

 # ============================================================
 # AoR FEDERAL BOND EVENTS — cc_bonds.140–145
 # ============================================================

 # === cc_bonds.140 — The Federal Member Stands with the Union ===
 cc_bonds.140.title: 0 "The Federal Member Stands with the Union"
 cc_bonds.140.desc: 0 "The Age of Revolutions has arrived, and the test of every bond of loyalty has come with it. [bond_subj.GetName] has passed this test with a clarity that needs no interpretation. Their parliament has formally renewed the federal compact, their leadership has spoken publicly in favor of the union, and their population — in a political moment when it would have been easy to look the other way — has not. The years of equal treatment, of genuine consultation, of shared governance rather than imposed authority, have produced what no colonial administrator can manufacture: a people who have decided, of their own accord, that this union is worth defending."
 cc_bonds.140.a: 0 "Celebrate this publicly. The empire is built on relationships like this one."
 cc_bonds.140.b: 0 "Formalize the bond — expand their representation in the federal parliament."

 # === cc_bonds.141 — The Federal Member Demands Equal Rights ===
 cc_bonds.141.title: 0 "The Federal Member Demands Equal Rights"
 cc_bonds.141.desc: 0 "The Age of Revolutions has reached [bond_subj.GetName], and their parliament has drafted something pointed: a formal demand for equal representation, equal rights, and equal standing within the federal compact — not the paper equality they were promised, but the substantive equality they have not received. The document is calm in tone and devastating in content. It lists, chapter and verse, the decisions in which their representation was overridden, the laws in which their interests were set aside, the moments when the word 'federal' turned out to mean 'subject to review.' They are not threatening independence. They are asking whether the federation is real."
 cc_bonds.141.a: 0 "It is real. Grant the full representation they are owed."
 cc_bonds.141.b: 0 "The demand is noted. The answer is no."

 # === cc_bonds.142 — The Associate Member Submits Its Petition ===
 cc_bonds.142.title: 0 "The Associate Member Submits Its Petition"
 cc_bonds.142.desc: 0 "The leadership of [bond_subj.GetName] has submitted a formal petition. It is not a demand — they are too careful for that — but it is as close to one as they have been willing to produce. They are asking, with considerable diplomatic delicacy, whether the grounds for full federal membership might now be considered. They point to their economic contributions, their military support, their years of cooperation despite the limitations of associate status. They are not asking to be equal because they feel entitled. They are asking because they have earned it and believe, cautiously, that the court may agree."
 cc_bonds.142.a: 0 "Approve the petition. Elevate them to full federal membership."
 cc_bonds.142.b: 0 "Acknowledge the petition — honor it with gold and a promise of review."
 cc_bonds.142.c: 0 "Dismiss the petition. They are an associate member, and that is sufficient."

 # === cc_bonds.143 — The False Federation Unravels ===
 cc_bonds.143.title: 0 "The False Federation Unravels"
 cc_bonds.143.desc: 0 "Someone has been counting. The dispatches from [bond_subj.GetName] make clear that the accounting has been completed, and the figures are not favorable. The federal charter promised equal standing, shared governance, and genuine partnership. The years since have delivered extraction at scale, administrative decisions imposed without consultation, and a governing arrangement that looks, on examination, rather more like the colonial relationship it was supposed to replace. The leadership of [bond_subj.GetName] is not yet in open revolt. But the revolutionary pamphlets circulating in the capital have stopped arguing that independence is desirable. They have started arguing that it is necessary."
 cc_bonds.143.a: 0 "End the pretense. Convert the charter into direct administration."
 cc_bonds.143.b: 0 "Buy silence. Pay what is necessary to stabilize the situation."
 cc_bonds.143.c: 0 "Let it unfold. We have managed crises before."

 # === cc_bonds.144 — The Colony Asserts Its Place ===
 cc_bonds.144.title: 0 "The Colony Asserts Its Place"
 cc_bonds.144.desc: 0 "The word from [bond_subj.GetName] is not a petition and not a demand — it is something more difficult to receive: a statement. The colonial leadership has written to say, with considerable confidence, that they have been watching the revolutionary currents sweeping the world, and they are not afraid of them. They are not afraid because they believe they have something those currents cannot offer: a genuine relationship with the imperial metropole, built over decades of honest dealing, shared governance, and mutual investment. They are writing to say that they would like that relationship formalized — not as subjects, but as partners. They believe the time for a federal arrangement has come, and they believe the empire will be stronger for it."
 cc_bonds.144.a: 0 "Welcome them as full federal partners. The union is stronger for this moment."
 cc_bonds.144.b: 0 "Offer associate membership — a genuine step, if not the full one they asked for."
 cc_bonds.144.c: 0 "Invite them into the Imperial Council as the first step."
 cc_bonds.144.d: 0 "Decline. The current arrangement serves us adequately."

 # === cc_bonds.145 — The Client Seeks Cover ===
 cc_bonds.145.title: 0 "The Client Seeks Cover"
 cc_bonds.145.desc: 0 "The leadership of [bond_subj.GetName] has sent a private communication. They have been watching the Age of Revolutions, and they have identified something the revolutionary rhetoric cannot offer them: stability under a recognized imperial framework. What they want is legitimacy — the kind that comes from being a named partner in a larger constitutional arrangement, rather than an informal client whose status depends entirely on the present government's goodwill. They are, in short, asking to be brought inside. The question is what kind of inside we are offering."
 cc_bonds.145.a: 0 "Bring them into the Imperial Council — a genuine constitutional arrangement."
 cc_bonds.145.b: 0 "Offer them a federal charter — the partnership they want, on our terms."
 cc_bonds.145.c: 0 "Maintain the current arrangement. There is no need to formalize anything."

 # ============================================================
 # SYNERGY EVENTS — cc_synergy.27–28
 # ============================================================

 # === cc_synergy.27 — National Reformer + Federal Architect ===
 cc_synergy.27.title: 0 "A Parliament for the Empire"
 cc_synergy.27.desc: 0 "Two of the most consequential minds in court have been talking to each other. [minister_a.GetName], who has spent their career redesigning the internal architecture of the state, and [minister_b.GetName], who has spent theirs holding the empire's diverse territories in productive relationship — they have found a shared project. They are proposing the formalization of a federal parliament: a body with genuine legislative standing, representing the member territories in proportion to their contributions, with real authority over shared matters of defense, trade, and law. They are asking whether the Crown is ready to govern an empire through law rather than through will."
 cc_synergy.27.a: 0 "Yes. Commission the Federal Compact and convene the parliament."
 cc_synergy.27.b: 0 "A smaller step first. Formalize parliamentary harmony and see what follows."

 # === cc_synergy.28 — Federal Architect + False Federal Member ===
 cc_synergy.28.title: 0 "The Architect Reads the Charter"
 cc_synergy.28.desc: 0 "[minister.GetName] has spent time reviewing the charter arrangement with [bond_subj.GetName], and their assessment is uncomfortable. The document, read closely, is a federal charter in name and a colonial compact in practice. The member's parliament has no binding authority. The representation is advisory. The economic arrangement flows in one direction. They are not saying this to embarrass the court. They are saying it because they believe the arrangement is a liability: when the population of [bond_subj.GetName] fully understands what they were given instead of what they were promised, the reaction will be worse than if the deception had never occurred. The question is whether the court wants to fix this while fixing it is still a choice."
 cc_synergy.28.a: 0 "Make it real. Convert the charter to full federal membership."
 cc_synergy.28.b: 0 "Partial reform. Elevate them to associate membership — a genuine improvement."
 cc_synergy.28.c: 0 "The arrangement is profitable. Leave it as it is."
