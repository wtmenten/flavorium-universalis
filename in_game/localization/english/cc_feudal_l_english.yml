l_english:
 # ============================================================
 # FEUDAL COURT TRAITS (Age 1)
 # ============================================================

 seneschal: "Seneschal"
 desc_seneschal: "The seneschal is the lord's right hand — keeper of the household, manager of the estate, and administrator of everything the crown requires to function. Under their careful management, court spending is reduced and noble goodwill is cultivated."
 seneschal_die_desc: "[CHARACTER.GetName] has died. The household accounts will need to be audited before anyone can be sure what was kept in order and what was kept hidden."

 court_chaplain: "Court Chaplain"
 desc_court_chaplain: "The confessor and spiritual advisor of the court, always at the ruler's side. The clergy looks to them for guidance and patronage; the court looks to them for the sanction of God. Their influence does not cease when the cabinet meeting ends."
 court_chaplain_die_desc: "[CHARACTER.GetName] has died. The candles will be lit and the prayers said — and a new confessor will be found. But the intimacy of spiritual counsel takes years to rebuild."

 marshal_of_the_court: "Marshal of the Court"
 desc_marshal_of_the_court: "The commander of the household military retinue, the Marshal ensures that the lord's cavalry is well-horsed, well-drilled, and ready to ride. Under their command, mounted forces cost less to raise and perform better in the field."
 marshal_of_the_court_die_desc: "[CHARACTER.GetName] has died. The cavalry formations [CHARACTER.GetSheHe] drilled will hold their discipline for a season. After that, someone else must take up the standard."

 master_of_coin: "Master of Coin"
 desc_master_of_coin: "The treasury manager of the feudal court — often an Italian merchant, always a careful accountant. The Master of Coin turns the flow of trade to the crown's advantage and keeps the merchants' guild well-disposed to the ruler's projects."
 master_of_coin_die_desc: "[CHARACTER.GetName] has died. The ledgers [CHARACTER.GetSheHe] maintained are meticulous. Whether [CHARACTER.GetHerHis] successor can read them is another question."

 herald_of_arms: "Herald of Arms"
 desc_herald_of_arms: "The herald is the voice of the court in the world beyond its walls — carrying messages between princes, managing protocol, and maintaining the delicate fiction that diplomacy is above interests. Under their guidance, the realm's diplomatic reputation is carefully tended."
 herald_of_arms_die_desc: "[CHARACTER.GetName] has died. The connections [CHARACTER.GetSheHe] maintained through years of careful correspondence will not survive unattended. Someone must take up the correspondence."

 court_astrologer: "Court Astrologer"
 desc_court_astrologer: "The astrologer stands at the intersection of learning and spiritual authority — consulted for favorable dates, significant omens, and matters of celestial import. Their influence over the court's intellectual climate is quiet but persistent."
 court_astrologer_die_desc: "[CHARACTER.GetName] has died. The charts and calculations [CHARACTER.GetSheHe] left behind will be studied for years — though interpreted, as always, to suit whoever is reading them."

 # ============================================================
 # FEUDAL COURT EVENTS (cc_feudal namespace)
 # ============================================================

 cc_feudal.1.title: "A Servant of the Court Finds Their Calling"
 cc_feudal.1.desc: "A minister at court has begun to distinguish themselves in a particular domain. Their instincts and aptitudes are becoming clear. We may wish to recognize — and direct — their emerging role."
 cc_feudal.1.a: "Appoint them as Seneschal — let them manage the household."
 cc_feudal.1.b: "Give them pastoral duties — make them Court Chaplain."
 cc_feudal.1.c: "Put them in command of the household cavalry — Marshal of the Court."
 cc_feudal.1.d: "Assign them to the treasury — Master of Coin."
 cc_feudal.1.e: "Send them as our herald — voice of the court to distant courts."
 cc_feudal.1.f: "Let them study the heavens — Court Astrologer."

 cc_feudal.10.title: "The Old Court Gives Way"
 cc_feudal.10.desc: "The age of the feudal court is ending. New learning, new trade, and new expectations have begun to reshape what governance requires. A minister of the old school stands at a crossroads: adapt to the new age, or hold to what they know."
 cc_feudal.10.a: "Let them embrace the new learning — a new role for a new era."
 cc_feudal.10.b: "They will serve as they have always served — but the court will not wait for them."

 cc_feudal.2.title: "Feast or Fast?"
 cc_feudal.2.desc: "With the treasury full and the harvest plentiful, the nobles are restless with expectation. A great feast has been proposed — an occasion for generosity and display. The treasury would not suffer if we declined, but the nobles' goodwill might."
 cc_feudal.2.a: "Open the kitchens and the wine cellars — the court shall feast."
 cc_feudal.2.b: "The realm has better uses for that gold — we fast."

 cc_feudal.3.title: "The King's Confessor"
 cc_feudal.3.desc: "The court chaplain has sought a private audience. They speak of duty, of faith, of the spiritual weight of the crown's decisions — and, with careful delicacy, of the coming war. Shall we let faith guide our hand, or chart our own course?"
 cc_feudal.3.a: "Heed the chaplain's counsel — let faith have its say in this."
 cc_feudal.3.b: "Thank them for their prayers and keep one's own counsel."

 cc_feudal.4.title: "The Tax Survey"
 cc_feudal.4.desc: "The master of coin has proposed a formal survey of our provincial revenues — a careful accounting of what the realm actually produces and what it actually pays. It would cost some gold to conduct properly, but the results would be precise."
 cc_feudal.4.a: "Fund the survey — accurate accounts are worth the cost."
 cc_feudal.4.b: "Invest the funds in the capital rather than in accounting."

 cc_feudal.5.title: "Tournament of the Court"
 cc_feudal.5.desc: "The marshal of the court has proposed a tournament — three days of jousting, feasting, and display. The nobles are enthusiastic; the treasury less so. A tournament builds loyalty and morale, but it does not come cheap."
 cc_feudal.5.a: "Hold the tournament — let the court show its colors."
 cc_feudal.5.b: "Channel the tournament's energy into actual military training instead."

 cc_feudal.6.title: "A Learned Foreigner Seeks Service"
 cc_feudal.6.desc: "A scholar from a distant court has arrived seeking employment. Their learning is genuine if their methods unfamiliar. A cautious court might decline; an open one might find they bring something we lacked."
 cc_feudal.6.a: "Appoint the foreigner — learning has no borders."
 cc_feudal.6.b: "Host a scholarly exchange between the foreigner and our court chaplain. Knowledge shared is knowledge multiplied."
 cc_feudal.6.c: "Decline — the court is not in need of foreign novelties."

 cc_feudal.7.title: "The Call to Holy War"
 cc_feudal.7.desc: "The court's senior clergy has risen in the throne room and delivered a declaration: the faith demands action. A neighboring realm of different religion sits on our border, and God's soldiers must not be idle. The court holds its breath."
 cc_feudal.7.a: "Answer the call — let the armies of faith march."
 cc_feudal.7.b: "Authorize spiritual preparation — we shall be ready, but we choose the moment."
 cc_feudal.7.c: "The crown answers to God and to reason. This is not our war."
