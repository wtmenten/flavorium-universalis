l_english:
 # ============================================================
 # TYPE A — RULER + CABINET SYNERGY
 # ============================================================
 cc_synergy.1.title: "Iron and Blood"
 cc_synergy.1.desc: "Our ruler's iron discipline and our military commander's expertise have created something remarkable in the war councils. The two have developed a shared doctrine that is reshaping how we raise and deploy our forces."
 cc_synergy.1.a: "Commission the new military doctrine"
 cc_synergy.1.b: "Elevate the commander"
 cc_synergy.1.c: "The realm has other priorities"

 cc_synergy.2.title: "A Court of Letters"
 cc_synergy.2.desc: "The scholarly depth of our ruler and the artistic ambitions of our minister have attracted unusual attention from across the realm. Letters, scholars, and artists are drawn to our court, and the capital is becoming something more than a seat of power — it is becoming a seat of culture."
 cc_synergy.2.a: "Establish the Court of Learning"
 cc_synergy.2.b: "Deepen the cultural program"
 cc_synergy.2.c: "Acknowledge the progress made"

 cc_synergy.20.title: "The Court Deepens"
 cc_synergy.20.desc: "The cultural program we established has taken root. Scholars debate in our corridors; artists compete for patronage. This is no longer merely a court — it is a civilization."
 cc_synergy.20.a: "Let it flourish"

 cc_synergy.3.title: "The Caliphate's Network"
 cc_synergy.3.desc: "Our ruler's mastery of statecraft and our minister's deep connections within the Islamic world have combined to produce something extraordinary: a diplomatic apparatus that spans the courts of the faithful and commands genuine respect."
 cc_synergy.3.a: "Formalize the diplomatic court"
 cc_synergy.3.b: "Accept the recognition it brings"

 cc_synergy.4.title: "Tradition and Parliament"
 cc_synergy.4.desc: "An unlikely partnership has emerged between our ruler's parliamentary instincts and our minister's deep respect for traditional institutions. The result is a parliament that the old orders can accept — and a reform process that the new forces can live with."
 cc_synergy.4.a: "Cultivate the parliamentary harmony"
 cc_synergy.4.b: "Acknowledge both sides' contributions"

 cc_synergy.5.title: "The Reforming Mind"
 cc_synergy.5.desc: "Our ruler's progressive convictions and our minister's philosophical depth have together created something unusual in this court: a genuine intellectual program for reform. The institutions of the realm are not merely being adjusted — they are being reimagined."
 cc_synergy.5.a: "Fund the institutional leap"
 cc_synergy.5.b: "The ideas are ready — begin the formal transition"
 cc_synergy.5.b.tt: "Unlocks the Philosopher's Court reform when conditions are met"

 cc_synergy.6.title: "The Sufi Synthesis"
 cc_synergy.6.desc: "Our ruler's spiritual depth and our minister's mastery of Islamic diplomacy have produced a remarkable synthesis: a court where Sufi wisdom meets political calculation, where mystical authority reinforces diplomatic power."
 cc_synergy.6.a: "Cultivate the Sufi tradition"
 cc_synergy.6.b: "Elevate the minister's formal authority"

 cc_synergy.7.title: "The Mandate of Heaven Approached"
 cc_synergy.7.desc: "Our ruler's pragmatic understanding of Eastern governance and our minister's mastery of Confucian administration have begun to approach something remarkable: a court that governs not merely by force but by the legitimacy that comes from proper order."
 cc_synergy.7.a: "The Mandate of Learning — cultivate it"
 cc_synergy.7.b: "Formalize the bureaucratic tradition"
 cc_synergy.7.b.tt: "Unlocks the Mandate Bureaucracy reform when conditions are met"

 cc_synergy.8.title: "The Great Venture"
 cc_synergy.8.desc: "Our ruler's restless ambition and our minister's colonial expertise have found each other — and what they are planning together is larger than either could have attempted alone. The overseas ventures are about to change in character and scale."
 cc_synergy.8.a: "Launch the Colonial Syndicate"
 cc_synergy.8.b: "Channel the energy into immediate gains"

 cc_synergy.9.title: "The Iron Hegemony Emerges"
 cc_synergy.9.desc: "The combination of our ruler's relentless discipline, our supreme commander's military genius, and the military march on our border has attracted the attention of every neighboring court. We are not merely powerful — we are dominant in a way that changes calculations."
 cc_synergy.9.a: "Formalize the Iron Hegemony"
 cc_synergy.9.b: "Press the military advantage now"

 cc_synergy.91.title: "The Iron Hegemony Unlocked"
 cc_synergy.91.desc: "The conditions for an Iron Hegemony have been met. The military apparatus, the march lord, and the noble estates are all aligned. The moment to formalize our dominance has arrived."
 cc_synergy.91.a: "Issue the Iron Charter"
 cc_synergy.91.a.tt: "Unlocks the Iron Hegemony government reform"

 cc_synergy.10.title: "Tribune of the People"
 cc_synergy.10.desc: "In this revolutionary age, our ruler's progressive instincts and our minister's mastery of the parliament have converged on something that has not been seen before: a government that is genuinely popular, that commands the affection of the estates and the common people alike."
 cc_synergy.10.a: "The People's Tribune has arrived"
 cc_synergy.10.b: "Channel the popular energy through parliament"

 # ============================================================
 # TYPE B — CABINET + CABINET SYNERGY
 # ============================================================
 cc_synergy.11.title: "East and West in Dialogue"
 cc_synergy.11.desc: "Our innovative minister and our Confucian scholar have begun an extraordinary intellectual exchange. The tension between their traditions is proving more productive than either expected — their rivalry is generating ideas."
 cc_synergy.11.a: "Support the Scholarly Rivalry"
 cc_synergy.11.b: "The capital should reflect this flowering"

 cc_synergy.12.title: "The Trade Blade"
 cc_synergy.12.desc: "Commerce and steel have found their alliance in our court. Our merchant minister and our noble commander have realized that their interests, properly aligned, are mutually reinforcing — trade opens the roads that armies protect, and armies protect the wealth that trade generates."
 cc_synergy.12.a: "Formalize the Trade Blade arrangement"
 cc_synergy.12.b: "Acknowledge both estates' contributions"

 cc_synergy.13.title: "Reform Through Parliament"
 cc_synergy.13.desc: "Our innovative minister and our parliamentary broker have found their shared project: not just reform, and not just parliamentary management, but the transformation of parliament itself into a vehicle for progressive change."
 cc_synergy.13.a: "Unlock the Parliamentary Compromise Reform"
 cc_synergy.13.a.tt: "Unlocks the Parliamentary Compromise government reform"
 cc_synergy.13.b: "Cultivate parliamentary harmony for now"

 cc_synergy.14.title: "Integration and Development"
 cc_synergy.14.desc: "The minister integrating our new territories and the minister developing our provinces have compared notes — and discovered that their work is more complementary than competitive. Together, they are proposing an approach that would accelerate both processes."
 cc_synergy.14.a: "Fund the Integration Surge"
 cc_synergy.14.b: "The capital benefits directly"

 cc_synergy.15.title: "Cloth and Chalice"
 cc_synergy.15.desc: "Our clergy minister and our merchant minister have reached an unexpected understanding in parliament. The sacred and the commercial, properly reconciled, are not enemies — and their alliance is making parliament function more smoothly than anyone expected."
 cc_synergy.15.a: "Celebrate the concordat"
 cc_synergy.15.b: "The arrangement speaks for itself"

 cc_synergy.16.title: "The War Council"
 cc_synergy.16.desc: "Our cavalry commander and our siege engineer have been consulting closely, and what they have produced together goes beyond the sum of its parts. They are proposing a unified doctrine for the current campaign that would make our forces dramatically more effective."
 cc_synergy.16.a: "Implement the Warlords' Council doctrine"
 cc_synergy.16.b: "Take immediate tactical advantage"

 cc_synergy.17.title: "The Grand Network"
 cc_synergy.17.desc: "The diplomatic expertise of our senior ministers has reached a critical mass. Together, they are not merely conducting foreign policy — they are constructing an architecture of relationships that will take decades to dismantle."
 cc_synergy.17.a: "Build the Diplomatic Network"
 cc_synergy.17.b: "Consolidate the network's foundations"

 cc_synergy.18.title: "The Enlightened Court"
 cc_synergy.18.desc: "The convergence of humanist philosophy and innovative administration in our court has produced something rare: a cabinet where ideas are tested rather than asserted, where reform flows from reason rather than interest. Foreign courts are beginning to notice."
 cc_synergy.18.a: "The Enlightened Court shall flourish"
 cc_synergy.18.b: "The time for the Philosopher's Court has come"
 cc_synergy.18.b.tt: "Unlocks the Philosopher's Court government reform"

 # ============================================================
 # TYPE C — CABINET + ACTIVE CONTENT SYNERGY
 # ============================================================
 cc_synergy.21.title: "The Shadow Network Awakened"
 cc_synergy.21.desc: "Our minister's diplomatic mastery of the Islamic world has been combined with the formal authority of our diplomatic court — and the result is something that goes beyond ordinary diplomacy. A network of influence now radiates from our capital that foreign powers struggle to counter."
 cc_synergy.21.a: "Activate the Shadow Network"
 cc_synergy.21.b: "Deepen the Caliphate connections"

 cc_synergy.22.title: "The Mandate's Academic Arm"
 cc_synergy.22.desc: "Our Confucian mandarin and the scholarly concordat have found their synthesis: a vision of governance in which learning and administration are not separate vocations but a single calling. The court is becoming something that the ancients would have recognized."
 cc_synergy.22.a: "Mandate of Learning — let it flourish"
 cc_synergy.22.b: "The capital should benefit directly"

 cc_synergy.23.title: "The Parliamentary Compact"
 cc_synergy.23.desc: "The parliamentary broker and the Parliamentary Compromise Reform have reached their logical destination: a formal charter between the merchant estates and the parliament that makes the legislative process more efficient and more legitimate simultaneously."
 cc_synergy.23.a: "Grant the Parliamentary Charter to the burghers"
 cc_synergy.23.b: "Cultivate parliamentary harmony instead"

 cc_synergy.24.title: "The March and the Commissary"
 cc_synergy.24.desc: "The combination of our military administrator, the March Charter, and the active military march has created something that the nobles and the generals both recognize as exceptional. The march is not merely a buffer state — it is a projection of our military power, and the court has the expertise to use it as such."
 cc_synergy.24.a: "The Iron Hegemony is within reach"
 cc_synergy.24.b: "Elevate the minister's siege expertise"

 cc_synergy.25.title: "The Governing Compact"
 cc_synergy.25.desc: "The efficient administrator and the Governorate Reform have found each other — and the provincial governorate is functioning better than anyone expected. What began as an administrative arrangement is becoming a model for how to govern a large realm without losing coherence."
 cc_synergy.25.a: "The Governing Compact — formalize it"
 cc_synergy.25.b: "A shorter but immediate dividend"
 cc_synergy.25.b.tt: "Grants a shorter modifier and reduces bureaucracy removal costs"

 cc_synergy.26.title: "The Maritime Compact"
 cc_synergy.26.desc: "The maritime expertise of our minister and the commercial power of our chartered companies have reached a productive alignment. The burghers are investing, the sailors are sailing, and the result is a commercial network that is beginning to define our realm's place in the world."
 cc_synergy.26.a: "The Colonial Syndicate matures"
 cc_synergy.26.b: "Take the immediate commercial gains"
