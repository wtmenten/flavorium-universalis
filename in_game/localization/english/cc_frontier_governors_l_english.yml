l_english:

 # Advance

 cc_frontier_administration_advance: "Frontier Administration"
 cc_frontier_administration_advance_desc: "Rather than wait for roads and cities to reach the marches, the crown plants resident noble governors directly in the unsettled interior, binding the borderlands to the capital by loyalty where it cannot yet bind them by stone. Unlocks the $cc_lesser_local_governor$ building and the frontier estate privileges, and grants an additional frontier governorship. Especially valued by realms expanding across the steppe, the mountains, and the deep interior."

 # Building

 cc_lesser_local_governor: "Frontier Governor"
 cc_lesser_local_governor_desc: "A resident noble administrator established in an undeveloped frontier province. Unlike a full local governor, it needs no road to the capital and may sit in rural land — but it must remain connected to the capital by land (directly or through subjects) and projects less proximity. Drawn from a small dedicated pool. Requires the $cc_frontier_administration_advance$ advance."
 cc_lesser_local_governor_tt: "Frontier governors built must be fewer than the realm's frontier governor allowance"
 cc_lesser_local_governor_maintenance: "Frontier Governor Upkeep"

 # Estate Privileges

 ep_frontier_governance: "Frontier Governance"
 ep_frontier_governance_desc: "The high nobility take charge of the marches in person.\n\nGrants an additional Frontier Governorship (+1 to the frontier governor pool).\n\nEach year, every owned location in a $cc_lesser_local_governor$'s province and its neighboring provinces gains the $cc_frontier_control_buff$ modifier: +5% Maximum Control and +0.2% Monthly Control. The bonus refreshes yearly and fades within two years if the governor or this privilege is lost.\n\nRequires the $cc_frontier_administration_advance$ advance."
 ep_frontier_missions: "Frontier Missions"
 ep_frontier_missions_desc: "The clergy carry the state faith into the borderlands.\n\nEach year, every owned location in a $cc_lesser_local_governor$'s province and its neighboring provinces gains the $cc_frontier_conversion_buff$ modifier: +25% Pop Conversion Speed. The bonus refreshes yearly and fades within two years if the governor or this privilege is lost.\n\nRequires the $cc_frontier_administration_advance$ advance."
 ep_frontier_markets: "Frontier Markets"
 ep_frontier_markets_desc: "Chartered burgher markets cluster around the governor's seat, drawing trade through the marches.\n\nEach year, every owned location in a $cc_lesser_local_governor$'s province and its neighboring provinces gains the $cc_frontier_market_buff$ modifier: +1% Market Access and +5% Trade Center Power. The bonus refreshes yearly and fades within two years if the governor or this privilege is lost.\n\nRequires the $cc_frontier_administration_advance$ advance."
 ep_frontier_settlement: "Frontier Settlement"
 ep_frontier_settlement_desc: "Settlers and freeholders are drawn to the protected frontier.\n\nEach year, every owned location in a $cc_lesser_local_governor$'s province and its neighboring provinces gains the $cc_frontier_growth_buff$ modifier: +5% Migration Attraction and +0.1% Pop Promotion Speed. The bonus refreshes yearly and fades within two years if the governor or this privilege is lost.\n\nRequires the $cc_frontier_administration_advance$ advance."

 # Area buff modifiers (static location modifiers applied by the yearly frontier pulse).
 # Plain keys back the $...$ references in the privilege descriptions above;
 # STATIC_MODIFIER_NAME_/DESC_ drive the modifier's on-location tooltip.

 cc_frontier_control_buff: "Frontier Governance"
 STATIC_MODIFIER_NAME_cc_frontier_control_buff: "Frontier Governance"
 STATIC_MODIFIER_DESC_cc_frontier_control_buff: "The resident frontier governor and the noble retinue tighten the crown's grip on the surrounding marches."
 cc_frontier_market_buff: "Frontier Markets"
 STATIC_MODIFIER_NAME_cc_frontier_market_buff: "Frontier Markets"
 STATIC_MODIFIER_DESC_cc_frontier_market_buff: "Chartered burgher markets around the frontier governor draw trade through the borderlands."
 cc_frontier_growth_buff: "Frontier Settlement"
 STATIC_MODIFIER_NAME_cc_frontier_growth_buff: "Frontier Settlement"
 STATIC_MODIFIER_DESC_cc_frontier_growth_buff: "Settlers are drawn to the protected lands around the frontier governor."
 cc_frontier_conversion_buff: "Frontier Missions"
 STATIC_MODIFIER_NAME_cc_frontier_conversion_buff: "Frontier Missions"
 STATIC_MODIFIER_DESC_cc_frontier_conversion_buff: "Clergy dispatched from the frontier governor's seat preach the state faith throughout the surrounding marches."

 MODIFIER_TYPE_NAME_cc_num_frontier_governors: "Frontier Govenor Count"
 MODIFIER_TYPE_DESC_cc_num_frontier_governors: "Lesser Local Govenors which do not require a road connection or city and can be specialized with estate privileges."