l_english:
 # === cc_bonds.130 — A Brilliant Student ===
 cc_bonds.130.title: "A Brilliant Student"
 cc_bonds.130.desc: "A scholar of remarkable talent has emerged from [bond_subj.GetName] — a young mind whose focus seems to be philosophy, governance, and the history of peoples. By reputation, by the handful of short works already circulating, this is someone whose ideas will matter. The question we face is: what kind of ideas, and in service of whom? Left to his own devices, he will write whatever his homeland produces. Brought to our court, he will write what our court shapes. Put to work as a propagandist, he will write what we need — and everyone will know it."
 cc_bonds.130.a: "Bring him to our court. Let him learn the empire from inside it."
 cc_bonds.130.b: "Fund his education in his homeland and let him publish freely. Let him be what he is."
 cc_bonds.130.c: "Offer him employment. His talent should serve the Crown's purposes."
 cc_bonds.130.d: "He is a scholar in a subject state. We need not involve ourselves."

 # === cc_bonds.131 — The Scholar's First Work ===
 cc_bonds.131.title: "The Scholar's First Work"
 cc_bonds.131.desc_court: "The scholar from [bond_subj.GetName] has completed a major work — polished, confident, and thoroughly shaped by his years at our court. The central argument is one that frames the subject's history as preparation for the empire it is now part of: their traditions as precursors to our institutions, their achievements as tributaries to the broader cultural story. It is, in the way of all well-crafted imperial historiography, both flattering and slightly uncomfortable to read."
 cc_bonds.131.desc_home: "The scholar from [bond_subj.GetName] has published a landmark work, and it is not what we might have predicted. It is a meticulous, beautifully written account of the subject's cultural history — its language, its traditions, its distinct philosophical heritage. It does not attack the overlord relationship. It does not advocate for anything. It simply insists, with considerable elegance, that there is something here worth describing, and that the description is its own argument."
 cc_bonds.131.desc_prop: "The propagandist from [bond_subj.GetName] has produced his work on schedule. It argues, as we asked, that the [overlord.GetNameWithNoTooltip]-[bond_subj.GetNameWithNoTooltip] partnership is built on mutual benefit, that [overlord.GetName]'s governance has enriched [bond_subj.GetNameWithNoTooltip], and that the [bond_subj_culture.GetName] people share a common destiny. The work has been distributed. It has been read. Among the educated few in [bond_subj.GetNameWithNoTooltip], it has been discussed mostly in the tone one uses when discussing something one finds slightly embarrassing."
 cc_bonds.131.desc_free: "The scholar from [bond_subj.GetName] — the one we neither sponsored nor recruited — has published a work that has circulated beyond the territory. It is ambivalent in tone: neither celebrating the overlord relationship nor condemning it. It describes what is. Its effect, where it has been read, is modest: a small positive impression of the subject's intellectual culture, and nothing more."
 cc_bonds.131.a_use: "Use it as an official text. Distribute it through Crown channels."
 cc_bonds.131.a_standalone: "Let it stand on its own. A work like this earns more respect without the Crown's hand on it."
 cc_bonds.131.b_sponsor: "Sponsor a companion volume that situates this work within the empire's broader story."
 cc_bonds.131.b_allow: "Let it stand. This is their story, and it does not threaten ours."
 cc_bonds.131.b_suppress: "Suppress it. This kind of cultural assertiveness has consequences."
 cc_bonds.131.c_more: "Commission more. The work is doing what it was designed to do."
 cc_bonds.131.c_distance: "Distance the Crown from this. The work has not served us well."
 cc_bonds.131.d_note: "Noted. The subject produces interesting minds."

 # === cc_bonds.132 — The Scholar's Legacy ===
 cc_bonds.132.title: "The Scholar's Legacy"
 cc_bonds.132.desc_aligned: "The scholar from [bond_subj.GetName] has died, as scholars do, having produced more than he intended. His ideas have permeated the territory's educated class for a generation. What is remarkable, from our vantage point, is how they have been received: as the work of someone who understood what the empire was for, and chose to belong to it. His students quote him in defense of the overlord relationship. He has become, posthumously, one of the most persuasive arguments for loyalty that the territory has ever produced."
 cc_bonds.132.desc_contested: "The scholar from [bond_subj.GetName] has died having written things that will outlast him by generations. A school of thought now exists in the territory that begins from his premise: that the subject's culture is distinct, coherent, and worth preserving. This cuts both ways. Those students who also believe in the empire argue that the two things are compatible — that you can be deeply yourself and also loyal. Those who do not believe in the empire find in the same texts their most eloquent justification."
 cc_bonds.132.desc_suppressed: "The scholar we suppressed has been dead for years, and his work is more widely read now than it was when we banned it. Underground copies circulate. Students copy them by hand. The ideas that we judged too dangerous to allow have become, precisely because of the judgment, the most exciting ideas in the territory. The suppression did not end the argument. It gave the argument a martyrdom."
 cc_bonds.132.desc_default: "A generation has passed since the scholar from [bond_subj.GetName] produced the work we engaged with — or chose not to engage with. The intellectual landscape of the territory has shifted in ways that are difficult to attribute to any single cause. The scholar's contribution, whatever it was, has been absorbed into the general culture and is no longer separable from it."
 cc_bonds.132.a: "His legacy serves the empire well. We will acknowledge it formally."
 cc_bonds.132.b_embrace: "Their cultural identity and their loyalty to us are not contradictions. Embrace both."
 cc_bonds.132.b_neutral: "The ideas have taken root. We will let them grow as they will."
 cc_bonds.132.c: "The suppression has produced the opposite of what we intended."
 cc_bonds.132.d: "The scholar's chapter is closed."

 # === Works of art created by the brilliant scholar chain ===
 cc_scholar_early_notes: "Early Notes from a Distant Court"
 cc_scholar_early_notes_desc: "A collection of observations and reflections produced in the formative period of a remarkable scholarly career."

 cc_scholar_imperial_chronicle: "An Imperial Chronicle"
 cc_scholar_imperial_chronicle_desc: "A landmark historical account framing the subject's past as preparation for the empire it now belongs to — learned, ambitious, and carefully situated."

 cc_scholar_homeland_chronicle: "A Chronicle of the Homeland"
 cc_scholar_homeland_chronicle_desc: "A meticulous account of the subject territory's cultural history, traditions, and distinct philosophical heritage — insisting, with considerable elegance, that there is something here worth preserving."

 cc_scholar_propaganda_work: "A Treatise on Shared Destiny"
 cc_scholar_propaganda_work_desc: "A commissioned work arguing that the overlord-subject partnership is built on mutual benefit and a common future. Read with polite skepticism in the territory it describes."

 cc_scholar_legacy_work: "The Scholar's Legacy"
 cc_scholar_legacy_work_desc: "The capstone work of a distinguished career — a synthesis that has already begun shaping the intellectual life of a generation."

 cc_scholar_forbidden_work: "The Suppressed Treatise"
 cc_scholar_forbidden_work_desc: "A work circulated in underground copies long after its formal banning. The suppression gave it a martyrdom it could not have earned on its own."
