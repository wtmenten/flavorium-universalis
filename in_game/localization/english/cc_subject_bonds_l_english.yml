l_english:
 # ============================================================
 # SITUATION NAME / DESCRIPTION
 # ============================================================
 cc_subject_bonds: "Subject Relations Ledger"
 cc_subject_bonds_desc: "A standing account of the Crown's relationships with its subjects, dimension by dimension. Each bond is measured along five lines — economic, military, political, cultural and personal — from open resentment (-5) to devoted loyalty (+5)."
 cc_subject_bonds_end: "The Crown no longer holds any bond-tracked subjects."

 # ============================================================
 # PANEL HEADER
 # ============================================================
 CC_BOND_LEDGER_HEADER: "Subject Bonds"
 CC_BOND_LEDGER_DESC: "Your bond with each subject is tracked along five dimensions, each ranging from -5 (hostile) to +5 (devoted). Hover a value to see what shapes it. Use the actions beneath each subject to tend the relationship directly, at a cost and on a cooldown.\n\nEach bond keeps both a recent score and a lifetime memory: every few generations the current score is folded into a long-term average and itself half-forgotten. Use the view toggle to switch between the two."

 # ============================================================
 # VIEW TOGGLE + ESTABLISHMENT DATE
 # ============================================================
 CC_BOND_VIEW_STM: "Recent"
 CC_BOND_VIEW_LTM: "Lifetime"
 CC_BOND_VIEW_TOGGLE: "Switch View"
 CC_BOND_VIEW_TT: "Toggle between the #Y Recent#! bond (the current score, -5..+5) and the #Y Lifetime#! bond (the long-term average folded from every sweep of memory). Lifetime memory is what most shapes how a subject behaves when the age of revolutions comes."
 CC_BOND_EST_SEP: "· est."

 # ============================================================
 # COLUMN LABELS
 # ============================================================
 CC_BOND_COL_SUBJECT: "Subject"
 CC_BOND_COL_ECO: "Eco"
 CC_BOND_COL_MIL: "Mil"
 CC_BOND_COL_POL: "Pol"
 CC_BOND_COL_CUL: "Cul"
 CC_BOND_COL_PER: "Per"

 # ============================================================
 # DIMENSION TOOLTIPS — what raises and lowers each bond
 # ============================================================
 CC_BOND_DIM_ECO_TT: "Economic Bond — trade, taxation fairness and shared prosperity.\n\nRaised by: Crown buildings in the subject's lands, growing provinces, sharing institutions, and underwriting its treasury.\nLowered by: neglect, lost provinces, heavy extraction, and the subject outpacing you in institutions you lack."
 CC_BOND_DIM_MIL_TT: "Military Bond — war obligations, martial loyalty and willingness to fight.\n\nRaised by: restraint in calls to arms, coming to the subject's defence when asked, and joint military reviews.\nLowered by: frequent or offensive war calls, refusing the subject's plea for aid, and a tally of unjust wars."
 CC_BOND_DIM_POL_TT: "Political Bond — governance, autonomy and political integration.\n\nRaised by: respecting the subject's standing, granting charters of privilege, and stable administration.\nLowered by: betrayal, heavy-handed rule, and a record of disloyal or treasonous acts."
 CC_BOND_DIM_CUL_TT: "Cultural Bond — cultural acceptance, religious harmony and identity.\n\nRaised by: letting the subject keep its distinct character, favourable faith and institution ties, and patronising its festivals.\nLowered by: forced conversion of culture or faith, and cultural friction."
 CC_BOND_DIM_PER_TT: "Personal Bond — the warmth between the two courts and rulers.\n\nRaised by: personal attention, honouring pleas for help, and dynastic and diplomatic gestures.\nLowered by: rejecting the subject's calls, demanding tribute, stern reprimands, and prolonged neglect."

 # ============================================================
 # ENGAGE ACTION BUTTONS + TOOLTIPS
 # ============================================================
 CC_BOND_ACT_ECO: "Underwrite"
 CC_BOND_ACT_ECO_TT: "Underwrite the Local Treasury\nCrown coin — scaled to your income and the subject's worth — backs the subject's finances for a decade.\n\n#G The subject gains:#! cheaper credit (#G Bank Interest -1%#!) and a richer mint (#G Minting Income +10%#!) for 10 years.\nEconomic Bond +1 (max +5). 2-year cooldown shared with the other actions for this subject."
 CC_BOND_ACT_MIL: "Review"
 CC_BOND_ACT_MIL_TT: "Hold a Joint Military Review\nDrill the two hosts together, at a cost scaled to your means.\n\n#G Both you and the subject gain:#! lower upkeep (#G Army & Navy Maintenance Efficiency +10%#!) for 10 years.\nMilitary Bond +1 (max +5). 2-year cooldown."
 CC_BOND_ACT_POL: "Charter"
 CC_BOND_ACT_POL_TT: "Confer a Charter of Privileges (costs prestige)\nFormally affirm the subject's liberties and standing.\n\n#G The subject gains:#! trade freedoms (#G Export & Import Efficiency +10%#!) and #G Loyalty to Overlord +10#! for 10 years.\n#R You concede:#! some of its revenue (#R Subject Income -5%#!) for 10 years.\nPolitical Bond +1 (max +5). 2-year cooldown."
 CC_BOND_ACT_CUL: "Festival"
 CC_BOND_ACT_CUL_TT: "Patronize a Cultural Festival\nHost a great festival celebrating the subject's character, at a cost scaled to your means.\n\n#G You gain, as host:#! #G Cultural Influence +2#!, #G Diplomatic Reputation +1#! and #G Monthly Prestige +0.05#! for 10 years.\nCultural Bond +1 (max +5). 2-year cooldown."
 CC_BOND_ACT_PER: "Envoy"
 CC_BOND_ACT_PER_TT: "Dispatch a Personal Envoy (gains prestige)\nStation a trusted emissary at the subject's court, with gifts scaled to your means.\n\n#G The subject gains:#! #G Loyalty to Overlord +15#! for 10 years, and warms toward your Crown (#G +20 opinion#!).\nPersonal Bond +1 (max +5). 2-year cooldown."
 CC_BOND_ACT_TRIBUTE: "Tribute"
 CC_BOND_ACT_TRIBUTE_TT: "Demand Tribute\nSqueeze the subject for coin — a sum drawn from its own coffers. Profitable, but resented.\n\nPersonal Bond -1 (min -5). 2-year cooldown."
 CC_BOND_ACT_REPRIMAND: "Reprimand"
 CC_BOND_ACT_REPRIMAND_TT: "Issue a Stern Reprimand\nA cold rebuke that cows the subject into compliance but chills relations.\n\nPolitical Bond +1 / Personal Bond -1. 2-year cooldown."

 # ============================================================
 # ENGAGE EVENTS (cc_bonds.300-306)
 # ============================================================
 cc_bonds.300.t: "Underwrite the Treasury"
 cc_bonds.300.d: "Word comes from [cc_engage_subject.GetName] of lean coffers — trade slack, the harvest thin, the tax rolls strained. By underwriting their finances the Crown can win them cheaper credit and a richer mint, and remind them whose generosity sustains them."
 cc_bonds.300.a: "Open the treasury (Crown coin). The subject gains cheaper loans and better minting for a decade; Economic Bond +1."
 cc_bonds.300.b: "They will manage on their own."

 cc_bonds.301.t: "A Joint Military Review"
 cc_bonds.301.d: "The captains of [cc_engage_subject.GetName] propose a grand review of arms held in common with our own host — banners paraded together, drills performed shoulder to shoulder. Such shared discipline binds soldiers to a common cause and sharpens the logistics of both armies."
 cc_bonds.301.a: "Hold the review (Crown coin). Both realms enjoy lower army and navy upkeep for a decade; Military Bond +1."
 cc_bonds.301.b: "We have no time for parades."

 cc_bonds.302.t: "A Charter of Privileges"
 cc_bonds.302.d: "The notables of [cc_engage_subject.GetName] petition for a formal charter affirming their trade liberties and standing within our dominion. To grant it concedes some of the revenue we draw from them, but it flatters their pride and binds them closer to the Crown."
 cc_bonds.302.a: "Grant the charter (costs prestige). The subject gains trade freedoms and loyalty, but we forgo some of its revenue, for a decade; Political Bond +1."
 cc_bonds.302.b: "Their privileges are sufficient as they stand."

 cc_bonds.303.t: "A Cultural Festival"
 cc_bonds.303.d: "Artists and players of [cc_engage_subject.GetName] seek our patronage for a great festival in honour of their distinct character — music, pageant and feasting under the Crown's name. To host such splendour magnifies our own renown across the courts of the world."
 cc_bonds.303.a: "Fund the festival (Crown coin). As host the Crown gains cultural influence, reputation and prestige for a decade; Cultural Bond +1."
 cc_bonds.303.b: "Let them celebrate at their own expense."

 cc_bonds.304.t: "A Personal Envoy"
 cc_bonds.304.d: "It has been too long since we attended personally to the court of [cc_engage_subject.GetName]. A trusted emissary stationed under our own seal, with small gifts, would keep them firmly in the Crown's orbit and warm their regard for our house."
 cc_bonds.304.a: "Send the envoy (Crown coin; gains prestige). The subject grows more loyal and warms toward us for a decade; Personal Bond +1."
 cc_bonds.304.b: "A formal acknowledgment will suffice."

 cc_bonds.305.t: "Demand Tribute"
 cc_bonds.305.d: "Our treasury has need, and [cc_engage_subject.GetName] is not without means. We might press them for an extraordinary tribute — profitable, certainly, though they will not soon forget the imposition."
 cc_bonds.305.a: "Demand the tribute (coin from their coffers). Personal Bond -1."
 cc_bonds.305.b: "We will not stoop to squeezing them."

 cc_bonds.306.t: "A Stern Reprimand"
 cc_bonds.306.d: "The conduct of [cc_engage_subject.GetName] has grown wayward. A cold and public rebuke would remind them of their place and stiffen their compliance — though such words leave a chill that lingers between courts."
 cc_bonds.306.a: "Deliver the reprimand. Political Bond +1, Personal Bond -1."
 cc_bonds.306.b: "Overlook it for now."

 # ============================================================
 # ENGAGE-ACTION MODIFIERS (granted by cc_bonds.300-304)
 # ============================================================
 STATIC_MODIFIER_NAME_cc_bond_underwritten: "Crown Underwriting"
 STATIC_MODIFIER_DESC_cc_bond_underwritten: "The overlord is backing our treasury, easing our credit and enriching our mint."
 STATIC_MODIFIER_NAME_cc_bond_drilled: "Joint Military Review"
 STATIC_MODIFIER_DESC_cc_bond_drilled: "Drilling our hosts in common has sharpened logistics and lowered the upkeep of our forces."
 STATIC_MODIFIER_NAME_cc_bond_chartered: "Charter of Privileges"
 STATIC_MODIFIER_DESC_cc_bond_chartered: "A royal charter affirms our trade liberties and our standing, binding us in loyalty to the Crown."
 STATIC_MODIFIER_NAME_cc_bond_charter_granted: "Charter Conceded"
 STATIC_MODIFIER_DESC_cc_bond_charter_granted: "The liberties granted to a subject by charter cost the Crown a measure of the revenue it draws from them."
 STATIC_MODIFIER_NAME_cc_bond_festival_host: "Festival Patron"
 STATIC_MODIFIER_DESC_cc_bond_festival_host: "Hosting a celebrated festival has magnified the Crown's cultural sway and renown."
 STATIC_MODIFIER_NAME_cc_bond_envoy_received: "Resident Crown Envoy"
 STATIC_MODIFIER_DESC_cc_bond_envoy_received: "A trusted emissary of the overlord keeps our court firmly within the Crown's orbit."

 # ============================================================
 # ENGAGE-ACTION OPINION BIAS
 # ============================================================
 cc_bond_envoy_warmth: "Honoured by a Personal Envoy"

