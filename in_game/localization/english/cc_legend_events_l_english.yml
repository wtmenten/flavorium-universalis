l_english:
 cc_legend.1.title: "The Philosopher's Court"
 cc_legend.1.desc: "The convergence of an enlightened ruler, a cabinet devoted entirely to administration and learning, and the material wealth of a great capital has produced something that philosophers dreamed of but rarely witnessed: a court where governance and wisdom are the same thing. Foreign scholars arrive weekly. Our institutions grow faster than our rivals can explain. History is taking note."
 cc_legend.1.a: "Establish the Philosopher's Court"
 cc_legend.1.a.tt: "Unlocks the Philosopher's Court government reform. Grants the ruler the Philosopher King legendary trait."
 cc_legend.1.b: "Honor the achievement with celebration"

 cc_legend.2.title: "The Holy Empire"
 cc_legend.2.desc: "In an age when faith and power struggle for primacy, we have achieved what few could: a court where sacred authority and political power reinforce rather than undermine each other. The clergy holds the realm, the realm holds the faith, and together they hold something that looks, to those with eyes to see it, like a holy empire reconstituted."
 cc_legend.2.a: "Proclaim the Holy Empire"
 cc_legend.2.a.tt: "Grants the Holy Empire privilege to the clergy estate. Applies a permanent Holy Empire modifier to the realm."
 cc_legend.2.b: "A moment for prayer and gratitude"

 cc_legend.3.title: "The Grand Bazaar"
 cc_legend.3.desc: "The Islamic world's great tradition of cosmopolitan commerce has found its expression in our realm. Our minister manages a diplomatic network that spans the dar al-Islam and beyond; our commercial subjects operate in ports that our rivals have never seen; our Grand Chancellor has made our reputation a commercial asset. The Grand Bazaar is not a place — it is a way of doing business that the world will imitate."
 cc_legend.3.a: "Open the Grand Bazaar"
 cc_legend.3.a.tt: "Unlocks the Grand Bazaar government reform. Grants the Grand Chancellor cabinet member the Grand Vizier legendary trait."
 cc_legend.3.b: "Honor the achievement with ceremony"

 cc_legend.4.title: "The Iron Hegemon"
 cc_legend.4.desc: "The combination of an iron-willed ruler, a supreme military commander, a network of military specialists, and a military march that projects our power beyond our borders has produced something that few realms achieve: hegemony. Not merely preponderance, but the kind of dominance that shapes the behavior of neighbors before a single soldier marches. We have built the Iron Hegemon."
 cc_legend.4.a: "Formalize the Iron Hegemony"
 cc_legend.4.a.tt: "Unlocks the Iron Hegemony government reform."
 cc_legend.4.b: "The military advantage is reward enough"

 cc_legend.5.title: "The People's Tribune"
 cc_legend.5.desc: "In the age of revolution, when the old order collapses and the new one struggles to be born, we have achieved what the reformers always promised and rarely delivered: a realm where the people genuinely consent to be governed. Every estate is satisfied. Parliament functions. Our minister speaks for the people — and the people, remarkably, believe it. History will call this the moment a Tribune of the People appeared."
 cc_legend.5.a: "Proclaim the Tribune of the People"
 cc_legend.5.a.tt: "Unlocks the People's Assembly government reform. Grants the Parliamentary Broker cabinet member the Tribune of the People legendary trait."
 cc_legend.5.b: "Let the People's Tribune speak"
