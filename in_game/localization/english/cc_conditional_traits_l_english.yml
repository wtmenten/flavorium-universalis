l_english:
 # ============================================================
 # FAMILY A — CAPITAL DEVELOPMENT-GATED TRAITS
 # ============================================================

 # Tier 1: Prosperity & Urbanization
 urban_planner: "Urban Planner"
 desc_urban_planner: "This advisor has a keen eye for the efficient arrangement of cities and commerce. Under their direction, new construction proceeds swiftly and cheaply, and the urban fabric of the realm grows denser with each passing year."
 urban_planner_die_desc: "[CHARACTER.GetName] has died. The blueprints [CHARACTER.GetSheHe] left behind will continue to shape our cities long after [CHARACTER.GetHerHis] hand has stilled."

 prosperity_herald: "Prosperity Herald"
 desc_prosperity_herald: "This advisor carries the glad tidings of a flourishing realm. Where wealth accumulates, talent follows — and this minister has turned our capital's prosperity into a magnet for ambitious counselors from across the land."
 prosperity_herald_die_desc: "[CHARACTER.GetName] is gone. The open doors [CHARACTER.GetSheHe] maintained between our court and the realm's finest minds will be harder to keep without [CHARACTER.GetHerHim]."

 merchant_syndic: "Merchant Syndic"
 desc_merchant_syndic: "A veteran of counting-houses and trade guilds, this advisor knows how to translate urban wealth into political capital. The merchant class rises with the city, and this minister ensures that rise benefits the crown."
 merchant_syndic_die_desc: "[CHARACTER.GetName] has passed. The bridges [CHARACTER.GetSheHe] built between the counting-house and the throne will take time to rebuild."

 # Tier 2: Cultural & Intellectual Flourishing
 grand_architect: "Grand Architect"
 desc_grand_architect: "Where other advisors see statistics, this minister sees skylines. A great capital draws scholars, artists, and reformers — and no one understands the material conditions for such a flowering better than this remarkable counselor."
 grand_architect_die_desc: "[CHARACTER.GetName] has died. The monuments [CHARACTER.GetSheHe] raised will outlast any stone — they are the cities [CHARACTER.GetSheHe] helped build."

 arts_patron: "Arts Patron"
 desc_arts_patron: "A generous benefactor of painters, poets, and musicians, this advisor understands that cultural patronage is also political power. Artistic excellence burnishes the crown's reputation and opens minds to new ideas."
 arts_patron_die_desc: "[CHARACTER.GetName] has departed. Every artist [CHARACTER.GetSheHe] supported will remember the hand that fed them — and so, in their work, will posterity."

 learned_courtier: "Learned Courtier"
 desc_learned_courtier: "Schooled in natural philosophy, law, and letters, this advisor has turned the court into a center of learning. Scholars cluster around them, institutions take root, and literacy spreads outward from the capital."
 learned_courtier_die_desc: "[CHARACTER.GetName] is gone. The seminars [CHARACTER.GetSheHe] hosted have ended, but the minds [CHARACTER.GetSheHe] shaped will carry that learning forward."

 reform_minded_counselor: "Reform-Minded Counselor"
 desc_reform_minded_counselor: "Prosperity has a way of loosening the grip of old structures, and this advisor knows it well. A champion of measured reform, they have made the court more receptive to institutional change without provoking revolution."
 reform_minded_counselor_die_desc: "[CHARACTER.GetName] has died. The reforms [CHARACTER.GetSheHe] quietly nurtured were the work of a lifetime — and like all such works, their fate now rests with others."

 # Tier 3: Transformative / Enlightenment Ideas
 master_urbanist: "Master Urbanist"
 desc_master_urbanist: "This advisor sees the city as a laboratory for human flourishing. From urban planning to cultural policy to scientific funding, they have transformed our capital into an engine of progress that rival courts can only envy."
 master_urbanist_die_desc: "[CHARACTER.GetName] has died. The city [CHARACTER.GetSheHe] helped shape will be [CHARACTER.GetHerHis] greatest monument — and it will outlast every king."

 enlightenment_herald: "Enlightenment Herald"
 desc_enlightenment_herald: "This advisor arrived carrying new ideas: that reason, rather than revelation, is the proper guide for governance; that knowledge must be tested, not merely received; that institutions can be improved. They have made those ideas contagious."
 enlightenment_herald_die_desc: "[CHARACTER.GetName] has passed from this world, but the ideas [CHARACTER.GetSheHe] spread are not so easily buried. They live in pamphlets, in lectures, and in the minds of those [CHARACTER.GetSheHe] taught."

 progressive_rationalist: "Progressive Rationalist"
 desc_progressive_rationalist: "A champion of reason, literacy, and the scientific method, this advisor has systematically challenged superstition wherever they found it. Under their influence, the court has become more receptive to evidence than to authority."
 progressive_rationalist_die_desc: "[CHARACTER.GetName] is dead. The enemies of reason will celebrate, but they will find the world a stubbornly different place than it was before [CHARACTER.GetHerHim]."

 revolutionary_herald: "Revolutionary Herald"
 desc_revolutionary_herald: "This advisor arrived with ideas that make the old order nervous: that the people have rights; that legitimate rule requires consent; that the present arrangement of power is not eternal. They counsel reform — and if reform is denied, history will counsel something else."
 revolutionary_herald_die_desc: "[CHARACTER.GetName] has died. The ideas [CHARACTER.GetSheHe] carried were already beyond [CHARACTER.GetHerHis] keeping — they belong to the age now."

 # ============================================================
 # FAMILY B — SOCIETAL VALUE-GATED TRAITS
 # ============================================================

 # Axis 1: traditionalist_vs_innovative
 innovative_counselor: "Innovative Counselor"
 desc_innovative_counselor: "Change is not a threat to this advisor — it is the engine of progress. They have made our court a place where new ideas are tested rather than suppressed, and institutions grow stronger for it."
 innovative_counselor_die_desc: "[CHARACTER.GetName] has died. The restless spirit of inquiry [CHARACTER.GetSheHe] cultivated will not easily find another champion."

 traditionalist_guardian: "Traditionalist Guardian"
 desc_traditionalist_guardian: "The old ways have served us well, and this advisor intends to keep them so. A tireless defender of custom and hierarchy, they have strengthened the bonds between the crown and its traditional pillars of support."
 traditionalist_guardian_die_desc: "[CHARACTER.GetName] has passed. The traditions [CHARACTER.GetSheHe] upheld will persist — but a watchful eye over them is gone."

 # Axis 2: absolutism_vs_liberalism
 royal_absolutist: "Royal Absolutist"
 desc_royal_absolutist: "Power must be concentrated to be useful — this advisor has never doubted it. Under their counsel, the machinery of royal authority has grown more efficient and the costs of absorbing new territories have fallen."
 royal_absolutist_die_desc: "[CHARACTER.GetName] is dead. The architecture of centralized power [CHARACTER.GetSheHe] built will stand, but those who chafe under it will find their opportunity."

 liberal_reformer: "Liberal Reformer"
 desc_liberal_reformer: "This advisor believes that a realm governed with the consent of its people is stronger than one governed by fear. They have opened more channels between the crown and its subjects, and the result is a country less likely to fracture."
 liberal_reformer_die_desc: "[CHARACTER.GetName] has died. The agreements [CHARACTER.GetSheHe] brokered between crown and commons will be tested now that the broker is gone."

 # Axis 3: centralization_vs_decentralization
 efficiency_administrator: "Efficiency Administrator"
 desc_efficiency_administrator: "Waste is this advisor's enemy. They have audited every bureaucratic process, cut every redundancy, and streamlined the machinery of government until it runs with remarkable economy."
 efficiency_administrator_die_desc: "[CHARACTER.GetName] has passed. The well-oiled machine [CHARACTER.GetSheHe] built will run a while longer on its own — but machines need maintenance."

 regional_magnate: "Regional Magnate"
 desc_regional_magnate: "Strong regions make a strong realm — or so this advisor argues. They have cultivated the great lords of the provinces and ensured that local power works with the center rather than against it."
 regional_magnate_die_desc: "[CHARACTER.GetName] is gone. The network of regional loyalties [CHARACTER.GetSheHe] maintained will require careful tending now that [CHARACTER.GetHerHis] hand is no longer at the wheel."

 # Axis 4: spiritualist_vs_humanist
 mystical_patriarch: "Mystical Patriarch"
 desc_mystical_patriarch: "Faith is the foundation of this advisor's worldview, and they have brought that conviction to every corner of governance. The clergy is more influential, the faithful more steadfast, and the realm more resistant to heterodox ideas."
 mystical_patriarch_die_desc: "[CHARACTER.GetName] has departed this life. The piety [CHARACTER.GetSheHe] embodied was a kind of governance — and its loss will be felt in quarters that no balance sheet can measure."

 humanist_philosopher: "Humanist Philosopher"
 desc_humanist_philosopher: "This advisor believes that human reason, not divine decree, should guide the realm. Tolerance has grown under their influence, along with literacy and the willingness to question received wisdom."
 humanist_philosopher_die_desc: "[CHARACTER.GetName] has died. The arguments [CHARACTER.GetSheHe] won — for tolerance, for inquiry, for the dignity of the human mind — will be relitigated now. Let us hope the verdict holds."

 # Axis 5: aristocracy_vs_plutocracy
 noble_champion: "Noble Champion"
 desc_noble_champion: "Lineage and service — these are the twin pillars of this advisor's creed. A tireless advocate for the nobility, they have ensured that the great houses remain the backbone of our military and political order."
 noble_champion_die_desc: "[CHARACTER.GetName] has died. The noble houses [CHARACTER.GetSheHe] championed will mourn loudly — and in their mourning, remember what they owe the crown."

 merchant_prince: "Merchant Prince"
 desc_merchant_prince: "This advisor has never confused old money with good money. A champion of the commercial classes, they have opened new trade channels, cultivated the merchant estates, and turned wealth into influence."
 merchant_prince_die_desc: "[CHARACTER.GetName] has passed. The commercial networks [CHARACTER.GetSheHe] spun will persist — trade routes do not mourn their architects."

 # Axis 6: serfdom_vs_free_subjects
 serf_overseer: "Serf Overseer"
 desc_serf_overseer: "Order depends on hierarchy, and hierarchy depends on everyone knowing their place. This advisor has ensured that the rural labor system functions with maximum efficiency — the nobility is pleased, even if the peasantry is not."
 serf_overseer_die_desc: "[CHARACTER.GetName] has died. The system [CHARACTER.GetSheHe] maintained was not popular, but it was productive. What happens next will depend on who fills [CHARACTER.GetHerHis] chair."

 emancipation_minister: "Emancipation Minister"
 desc_emancipation_minister: "A rising tide lifts all boats — this advisor has dedicated their career to loosening the bonds that keep the peasantry bound to the soil. Literacy climbs, mobility increases, and the realm's human potential begins to flower."
 emancipation_minister_die_desc: "[CHARACTER.GetName] has departed. The freedoms [CHARACTER.GetSheHe] championed are rarely surrendered without a fight — that, at least, is [CHARACTER.GetHerHis] legacy."

 # Axis 7: mysticism_vs_jurisprudence
 mystical_counselor: "Mystical Counselor"
 desc_mystical_counselor: "The sacred and the political are not separate to this advisor. They have woven religious legitimacy through the fabric of governance, giving the realm's actions a spiritual authority that foreign powers treat with caution."
 mystical_counselor_die_desc: "[CHARACTER.GetName] is gone. The spiritual weight [CHARACTER.GetSheHe] lent to our decisions will be difficult to replace with mere arguments."

 legal_scholar: "Legal Scholar"
 desc_legal_scholar: "The law, properly codified and consistently applied, is civilization's most powerful tool — or so this advisor argues. Under their influence, governance has become more systematic, more predictable, and harder to abuse."
 legal_scholar_die_desc: "[CHARACTER.GetName] has died. The legal edifice [CHARACTER.GetSheHe] built may outlast every minister who comes after — that was the intention."

 # Axis 8: mercantilism_vs_free_trade
 mercantilist_official: "Mercantilist Official"
 desc_mercantilist_official: "Trade is power, and power must be directed by the state — this advisor has never doubted it. Under their watch, the crown's commercial reach has grown and competing interests have been brought firmly under royal oversight."
 mercantilist_official_die_desc: "[CHARACTER.GetName] has passed. The trade apparatus [CHARACTER.GetSheHe] built will continue running — though without [CHARACTER.GetHerHis] hand on the throttle, it may drift."

 free_market_advocate: "Free Market Advocate"
 desc_free_market_advocate: "Remove the barriers and watch commerce flourish — this advisor has made that argument to every skeptic in the court, and the results have been difficult to argue with. The merchant guilds adore them."
 free_market_advocate_die_desc: "[CHARACTER.GetName] has died. The merchants [CHARACTER.GetSheHe] liberated will erect no statues, but they will remember the name when calculating their profits."

 # Axis 9: capital_economy_vs_traditional_economy
 capitalist_minister: "Capitalist Minister"
 desc_capitalist_minister: "Investment, accumulation, and reinvestment — this advisor understands the logic of capital as few counselors do. Under their guidance, the realm's economy has begun to develop according to a new and productive internal logic."
 capitalist_minister_die_desc: "[CHARACTER.GetName] has passed. The economic machinery [CHARACTER.GetSheHe] set in motion will not stop — capital has its own momentum now."

 estate_guardian: "Estate Guardian"
 desc_estate_guardian: "The old ways of organizing wealth and labor have proven durable for good reasons, and this advisor sees no wisdom in abandoning them for untested theories. The great estates prosper, the traditional orders are content, and the realm is stable."
 estate_guardian_die_desc: "[CHARACTER.GetName] has died. The traditional order [CHARACTER.GetSheHe] preserved will face its challengers soon enough — it will face them without [CHARACTER.GetHerHis] advocacy."

 # Axis 10: individualism_vs_communalism
 free_spirit_counselor: "Free Spirit Counselor"
 desc_free_spirit_counselor: "Every great achievement begins with a single person who thought differently — this advisor has built policy around that conviction. Individual talent is cultivated, artistic patronage flourishes, and the bureaucracy bends slightly to accommodate genius."
 free_spirit_counselor_die_desc: "[CHARACTER.GetName] has died. The singular minds [CHARACTER.GetSheHe] encouraged will scatter, and some will not find another advocate."

 community_steward: "Community Steward"
 desc_community_steward: "A realm is not its rulers but its people — this advisor has governed according to that principle. Community bonds are stronger, local populations more mobile and more prosperous, and the common folk more invested in the realm's success."
 community_steward_die_desc: "[CHARACTER.GetName] is gone. The communities [CHARACTER.GetSheHe] tended were not the kind of achievement that earns portraits in the palace — but they may prove more lasting."

 # Axis 11: quality_vs_quantity
 elite_trainer: "Elite Trainer"
 desc_elite_trainer: "Fewer soldiers, better soldiers — this advisor has staked their reputation on that principle. The army that emerges from their reforms is smaller, more expensive, and devastatingly effective."
 elite_trainer_die_desc: "[CHARACTER.GetName] has died. The officers [CHARACTER.GetSheHe] trained will carry [CHARACTER.GetHerHis] methods forward — discipline, after all, is self-propagating."

 mass_levy_commander: "Mass Levy Commander"
 desc_mass_levy_commander: "Numbers win battles, and numbers are something we have. This advisor has turned the manpower of the realm into a strategic asset, keeping recruitment costs low and the rolls perpetually full."
 mass_levy_commander_die_desc: "[CHARACTER.GetName] has passed. The men [CHARACTER.GetSheHe] raised and drilled will remember the voice that called them to the colors, even if history does not record the name."

 # Axis 12: offensive_vs_defensive
 offensive_strategist: "Offensive Strategist"
 desc_offensive_strategist: "Attack is the best defense — and this advisor has organized our military planning accordingly. Every resource is oriented toward projecting force outward, keeping the enemy too occupied with their own problems to threaten ours."
 offensive_strategist_die_desc: "[CHARACTER.GetName] has died. The doctrine [CHARACTER.GetSheHe] wrote will survive [CHARACTER.GetHerHim] in the manuals — though manuals cannot adapt to changing circumstances the way [CHARACTER.GetSheHe] could."

 defensive_commander: "Defensive Commander"
 desc_defensive_commander: "Forts hold ground that armies cannot. This advisor has invested deeply in the defensive infrastructure of the realm, ensuring that any aggressor faces a grinding campaign of attrition rather than a clean war of movement."
 defensive_commander_die_desc: "[CHARACTER.GetName] has died. The walls [CHARACTER.GetSheHe] built will outlast [CHARACTER.GetHerHim] by centuries — and that was the plan."

 # Axis 13: belligerent_vs_conciliatory
 hawk_minister: "Hawk Minister"
 desc_hawk_minister: "This advisor believes that strength commands respect and weakness invites aggression. Under their counsel, we have pressed our advantages harder and asked more of defeated enemies — even if it has made some neighbors wary."
 hawk_minister_die_desc: "[CHARACTER.GetName] has died. The enemies [CHARACTER.GetSheHe] made will not mourn. But neither will the commanders whose ambitions [CHARACTER.GetSheHe] fed."

 peacemaker_counselor: "Peacemaker Counselor"
 desc_peacemaker_counselor: "Every war costs more than its proponents admit, and this advisor has spent a career demonstrating that point. Under their influence, antagonism has decreased, diplomatic channels have stayed open, and our neighbors have grown less inclined to unite against us."
 peacemaker_counselor_die_desc: "[CHARACTER.GetName] is gone. The quiet agreements [CHARACTER.GetSheHe] maintained with our neighbors were never written down — they lived only in [CHARACTER.GetHerHis] relationships. That is the peacemaker's tragedy."

 # Axis 14: outward_vs_inward
 expansionist_advisor: "Expansionist Advisor"
 desc_expansionist_advisor: "The map has blank spaces that call out to be filled — or so this advisor believes. Under their guidance, our colonial and exploratory ambitions have grown sharper and better resourced."
 expansionist_advisor_die_desc: "[CHARACTER.GetName] has died. The horizons [CHARACTER.GetSheHe] pointed toward are still there. Whether we reach them is now our choice alone."

 consolidation_minister: "Consolidation Minister"
 desc_consolidation_minister: "The realm we have is worth perfecting before we reach for more. This advisor has focused our energies inward — developing what we hold, integrating what we have conquered, reforming what needs reform."
 consolidation_minister_die_desc: "[CHARACTER.GetName] is gone. The interior work [CHARACTER.GetSheHe] championed will always be less glamorous than conquest — and always more necessary."

 # Axis 15: land_vs_naval
 continental_marshal: "Continental Marshal"
 desc_continental_marshal: "Land is where wars are won and empires made — this advisor has never doubted it. The army is the instrument of our power, and they have honed it accordingly."
 continental_marshal_die_desc: "[CHARACTER.GetName] has died. The regiments [CHARACTER.GetSheHe] drilled and the forts [CHARACTER.GetSheHe] commissioned will carry [CHARACTER.GetHerHis] name in battle orders long after [CHARACTER.GetHerHis] death."

 admiral_counselor: "Admiral Counselor"
 desc_admiral_counselor: "The sea is the world's great highway, and whoever commands it commands everything that flows across it. This advisor has oriented our strategic thinking seaward — and the results have been felt in our trade revenues as much as our naval register."
 admiral_counselor_die_desc: "[CHARACTER.GetName] has passed. The sea does not mourn — but the sailors [CHARACTER.GetSheHe] trained will tell stories of [CHARACTER.GetHerHim] in every port."

 # Axis 16: latinization_vs_hellenization
 roman_administrator: "Roman Administrator"
 desc_roman_administrator: "Order, law, and Latin — these are the tools of empire. This advisor has brought the Roman administrative tradition to bear on our governance, making annexation cheaper and reform more systematic."
 roman_administrator_die_desc: "[CHARACTER.GetName] has died. The administrative legacy [CHARACTER.GetSheHe] built follows in the Roman tradition — it will outlast the builder."

 hellenistic_scholar: "Hellenistic Scholar"
 desc_hellenistic_scholar: "The Greek tradition lives — in philosophy, in science, in the cultivation of the inquiring mind. This advisor has made our court a center of that tradition, and literacy and cultural influence have grown accordingly."
 hellenistic_scholar_die_desc: "[CHARACTER.GetName] has passed. In [CHARACTER.GetHerHis] own way, [CHARACTER.GetSheHe] has added another chapter to a very long book."

 # Axis 17: sinicized_vs_unsinicized
 confucian_mandarin: "Confucian Mandarin"
 desc_confucian_mandarin: "The sage-kings built civilization on the foundation of proper relationships and meritocratic governance. This advisor has brought those principles to our court, improving administration and accelerating the assimilation of new peoples into the realm."
 confucian_mandarin_die_desc: "[CHARACTER.GetName] has died. The Confucian ideal [CHARACTER.GetSheHe] embodied — governance as a moral vocation — will be harder to find in the court that follows."

 steppe_warlord_advisor: "Steppe Warlord Advisor"
 desc_steppe_warlord_advisor: "The steppe does not produce administrators — it produces commanders. This advisor brings the ruthless cavalry doctrine of the nomadic world to our military, and our enemies have learned to fear it."
 steppe_warlord_advisor_die_desc: "[CHARACTER.GetName] has died. The commanders [CHARACTER.GetSheHe] trained will carry [CHARACTER.GetHerHis] ferocity forward. The steppe does not forget its lessons."

 # ============================================================
 # FAMILY C — REGIONAL / RELIGIOUS TRAITS
 # ============================================================

 # Religion-group diplomats
 christian_diplomat: "Christian Diplomat"
 desc_christian_diplomat: "Within the community of Christian nations, this advisor moves with uncommon ease. Shared faith is a diplomatic currency, and they have spent it wisely — reducing antagonism, opening doors, and lending legitimacy to our foreign dealings."
 christian_diplomat_die_desc: "[CHARACTER.GetName] has died. The network of Christian connections [CHARACTER.GetSheHe] maintained will fray without [CHARACTER.GetHerHis] constant attention."

 caliphate_diplomat: "Caliphate Diplomat"
 desc_caliphate_diplomat: "Steeped in the traditions of Islamic governance and inter-state relations, this advisor has given our diplomatic standing in the Muslim world a prestige that mere military power cannot buy. The connections they maintain span courts and trade routes alike."
 caliphate_diplomat_die_desc: "[CHARACTER.GetName] has passed. The reputation [CHARACTER.GetSheHe] built will linger, but reputations require tending."

 brahmin_counselor: "Brahmin Counselor"
 desc_brahmin_counselor: "Learning, ritual, and the management of sacred authority — this advisor commands all three. Under their guidance, the priestly estate has become a more effective instrument of governance, and the population's spiritual needs have been woven more tightly into the crown's administrative fabric."
 brahmin_counselor_die_desc: "[CHARACTER.GetName] has died. The spiritual authority [CHARACTER.GetSheHe] cultivated on our behalf will take years to rebuild."

 dharma_minister: "Dharma Minister"
 desc_dharma_minister: "This advisor has built their counsel around the concept of right conduct — in governance as in personal life. The result is a court that approaches its decisions with unusual care, and a reputation for fairness that has made the realm easier to govern."
 dharma_minister_die_desc: "[CHARACTER.GetName] has passed. The example [CHARACTER.GetSheHe] set was worth more than any policy [CHARACTER.GetSheHe] implemented. That is the hardest kind of legacy to preserve."

 # Sub-continent specialists
 renaissance_patron: "Renaissance Patron"
 desc_renaissance_patron: "The arts are flourishing, and this advisor is largely responsible. A generous and discerning patron of painters, sculptors, and writers, they have made our court a destination for the era's finest creative minds."
 renaissance_patron_die_desc: "[CHARACTER.GetName] has died. The artists [CHARACTER.GetSheHe] patronized will dedicate their next works to [CHARACTER.GetHerHis] memory — and in doing so, will ensure [CHARACTER.GetHerHis] name outlasts the century."

 griot_diplomat: "Griot Diplomat"
 desc_griot_diplomat: "Memory, history, and the spoken word are the foundations of diplomatic tradition in this part of the world — and this advisor has mastered all three. They move between courts with the ease of someone who carries the past in their voice."
 griot_diplomat_die_desc: "[CHARACTER.GetName] has died. When a griot dies, a library burns. The oral history [CHARACTER.GetSheHe] carried will be told differently by those who come after."

 steppe_strategos: "Steppe Strategos"
 desc_steppe_strategos: "This advisor was born to the saddle and to the swift, brutal logic of steppe warfare. Under their counsel, our cavalry has reached a new level of efficiency — and our enemies have learned to respect the sight of our outriders on the horizon."
 steppe_strategos_die_desc: "[CHARACTER.GetName] has died. The cavalry doctrine [CHARACTER.GetSheHe] brought from the steppe will survive [CHARACTER.GetHerHim] in the training manuals — but those who rode with [CHARACTER.GetHerHim] say the manuals miss something essential."

 mughal_administrator: "Mughal Administrator"
 desc_mughal_administrator: "A master of the sophisticated administrative tradition that has made large multi-ethnic empires governable, this advisor has brought those methods to our own governance — accelerating assimilation, reducing the costs of integration, and making the court function more smoothly."
 mughal_administrator_die_desc: "[CHARACTER.GetName] has passed. The administrative legacy [CHARACTER.GetSheHe] built draws on centuries of accumulated wisdom. It will not be forgotten."

 maritime_champion: "Maritime Champion"
 desc_maritime_champion: "Ports and shipping lanes are the arteries of power for any coastal realm, and this advisor has ensured that ours are healthy. The merchant estates prosper, the harbor bustles, and the crown's maritime influence grows with every sailing season."
 maritime_champion_die_desc: "[CHARACTER.GetName] has died. The tide comes in and goes out without regard for the harbormasters who charted its behavior — but those harbormasters are still missed."

 ecumenical_patriarch_advisor: "Ecumenical Patriarch Advisor"
 desc_ecumenical_patriarch_advisor: "This counselor carries the full authority of the Orthodox tradition — its liturgy, its theology, and its ancient claim to be the true heir of the Christian imperial ideal. Under their influence, the clergy is a more potent instrument of governance."
 ecumenical_patriarch_advisor_die_desc: "[CHARACTER.GetName] has passed from this world. The Church will fill the seat — it always has — but the particular wisdom [CHARACTER.GetSheHe] brought to governance is not easily replaced by ceremony."

 new_world_pioneer: "New World Pioneer"
 desc_new_world_pioneer: "This advisor arrived carrying the explorer's instinct and the colonist's pragmatism. Under their guidance, our presence in the new lands has grown more systematic and more profitable."
 new_world_pioneer_die_desc: "[CHARACTER.GetName] has died. The frontier [CHARACTER.GetSheHe] helped open will bear no monument to [CHARACTER.GetHerHim] — pioneers rarely get monuments. They get the places that come after."

 # ============================================================
 # FAMILY D — MILITARY COST SPECIALISTS
 # ============================================================

 # Age 2-4 Early Tier
 infantry_drillmaster: "Infantry Drillmaster"
 desc_infantry_drillmaster: "This veteran has spent a career turning raw levies into disciplined soldiers. Under their watch, the infantry costs less to raise and performs better in the field."
 infantry_drillmaster_die_desc: "[CHARACTER.GetName] has died. The sergeants [CHARACTER.GetSheHe] trained will carry [CHARACTER.GetHerHis] methods down through the ranks for a generation."

 scout_captain: "Scout Captain"
 desc_scout_captain: "Swift, silent, and always ahead of the main force — this advisor has turned our cavalry scouting into an art form. Light horse is cheaper and better used under their doctrine."
 scout_captain_die_desc: "[CHARACTER.GetName] has passed. The riders [CHARACTER.GetSheHe] trained will continue riding — but fewer will volunteer for the most dangerous routes without [CHARACTER.GetHerHim] to lead them."

 military_engineer: "Military Engineer"
 desc_military_engineer: "Siege is science, and this advisor has brought science to it. The construction of artillery and heavy infantry equipment costs less under their supervision, and the results speak for themselves at the walls of enemy fortifications."
 military_engineer_die_desc: "[CHARACTER.GetName] has died. The siege manuals [CHARACTER.GetSheHe] wrote will be used long after the author is forgotten — that is the engineer's immortality."

 # Age 5-6 Strong Tier
 commissariat_officer: "Commissariat Officer"
 desc_commissariat_officer: "An army that cannot feed and equip itself cannot fight. This advisor has solved the logistical challenge that breaks lesser campaigns, ensuring that our infantry is always properly provisioned — and that the nobility benefits from the contracts."
 commissariat_officer_die_desc: "[CHARACTER.GetName] has died. The supply chains [CHARACTER.GetSheHe] established will continue running — the real test comes when they are forced to improvise without [CHARACTER.GetHerHim]."

 cavalry_marshal: "Cavalry Marshal"
 desc_cavalry_marshal: "The finest horse soldiers in the realm look to this advisor for their doctrine, their equipment standards, and their sense of professional identity. The cavalry under their command is half the price and twice the danger."
 cavalry_marshal_die_desc: "[CHARACTER.GetName] has died. Every cavalry officer in this army learned something from [CHARACTER.GetHerHim], even those who never served directly under [CHARACTER.GetHerHis] command."

 siege_engineer: "Siege Engineer"
 desc_siege_engineer: "Walls fall and forts surrender when this advisor is in the field. A master of artillery doctrine and siege construction, they have made our offensive operations dramatically more efficient — and made our own fortifications significantly harder to breach."
 siege_engineer_die_desc: "[CHARACTER.GetName] has died. The fortifications [CHARACTER.GetSheHe] designed will stand as [CHARACTER.GetHerHis] memorial — though [CHARACTER.GetSheHe] would probably prefer they be improved rather than preserved."

 supreme_commander: "Supreme Commander"
 desc_supreme_commander: "Every arm of the military has been touched by this advisor's reforming hand. The nobles credit them, the commissariat credits them, and the infantry, cavalry, and artillery all cost less because they have rationalized the entire apparatus of war."
 supreme_commander_die_desc: "[CHARACTER.GetName] has died. The army [CHARACTER.GetSheHe] built is our inheritance. Let us hope we are worthy of it."

 # ============================================================
 # FAMILY E — PARLIAMENTARY / DIPLOMATIC SPECIALISTS
 # ============================================================

 parliamentary_broker: "Parliamentary Broker"
 desc_parliamentary_broker: "Parliament is a complicated instrument, and this advisor plays it like a virtuoso. Under their guidance, legislative support has become dramatically more reliable — and the support threshold for the hardest votes has dropped."
 parliamentary_broker_die_desc: "[CHARACTER.GetName] has died. The parliamentary relationships [CHARACTER.GetSheHe] cultivated will outlast [CHARACTER.GetHerHim] — but the relationships were personal, and personal relationships die with their owners."

 diplomatic_attache: "Diplomatic Attaché"
 desc_diplomatic_attache: "The fine print of international agreements is where empires are built or broken, and this advisor is a master of it. Annexation costs less under their careful negotiation, and our diplomatic reach has grown accordingly."
 diplomatic_attache_die_desc: "[CHARACTER.GetName] has passed. The treaties [CHARACTER.GetSheHe] drafted will still be binding — treaties outlast their authors, which is precisely the point."

 grand_chancellor: "Grand Chancellor"
 desc_grand_chancellor: "There are diplomats, and there are architects of foreign policy — this advisor is the latter. The full apparatus of our international engagement has been reshaped under their supervision: capacity, reputation, annexation, and parliamentary standing have all improved."
 grand_chancellor_die_desc: "[CHARACTER.GetName] has died. The diplomatic edifice [CHARACTER.GetSheHe] constructed was a monument to a lifetime of patient, calculating work. Its foundations will hold — we must hope its upper floors do not require [CHARACTER.GetHerHis] particular genius to maintain."

 # ============================================================
 # LEGENDARY TRAITS
 # ============================================================

 philosopher_king: "Philosopher King"
 desc_philosopher_king: "To be governed by a philosopher-king is the dream of every idealist and the nightmare of every opportunist. This ruler has united genuine intellectual power with political authority — and the result is a court where ideas carry real weight and the arts and sciences flourish."
 philosopher_king_die_desc: "[CHARACTER.GetName] has died. History will argue over whether [CHARACTER.GetSheHe] was truly what the title claimed. The books [CHARACTER.GetSheHe] wrote and the institutions [CHARACTER.GetSheHe] founded will make the argument on [CHARACTER.GetHerHis] behalf."

 grand_vizier_legendary: "Grand Vizier"
 desc_grand_vizier_legendary: "There are ministers, and then there is this. The Grand Vizier's reputation precedes every diplomatic contact, their network spans the known world, and foreign powers treat their words as binding policy. They have made our realm more formidable than its armies alone could."
 grand_vizier_legendary_die_desc: "[CHARACTER.GetName] has died. The world will reorganize itself in the absence of [CHARACTER.GetHerHis] influence — and some of those reorganizations will not be to our advantage."

 tribune_of_the_people: "Tribune of the People"
 desc_tribune_of_the_people: "A cabinet minister beloved by the commons is a rare and powerful thing. This advisor has used that popularity as a governing instrument — smoothing legislation through parliament, suppressing unrest, and making the estates feel heard rather than merely tolerated."
 tribune_of_the_people_die_desc: "[CHARACTER.GetName] has died. The people will mourn visibly and loudly, which is its own kind of political message to those who now hold power."

