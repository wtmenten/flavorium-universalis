 STATIC_MODIFIER_NAME_cc_temp_renaissance_observation: "Scholar's Observation"
 STATIC_MODIFIER_DESC_cc_temp_renaissance_observation: "A minister's methodical study of the new learning has produced a modest but measurable improvement in institutional research and literacy."

 # Legacy Track C — Elder's Final Gift modifiers (base + consecrated, 11 pairs)
 STATIC_MODIFIER_NAME_cc_legacy_elder_grand_chancellor: "Legacy of the Grand Chancellor"
 STATIC_MODIFIER_DESC_cc_legacy_elder_grand_chancellor: "The Grand Chancellor's decades of patient diplomacy endure as a permanent increase in our diplomatic reach, reputation, and capacity."
 STATIC_MODIFIER_NAME_cc_legacy_elder_grand_chancellor_consecrated: "Consecrated Legacy of the Grand Chancellor"
 STATIC_MODIFIER_DESC_cc_legacy_elder_grand_chancellor_consecrated: "A solemn ceremony of consecration has elevated the Grand Chancellor's legacy into a defining feature of this realm's foreign policy identity."

 STATIC_MODIFIER_NAME_cc_legacy_elder_cavalry_marshal: "Legacy of the Cavalry Marshal"
 STATIC_MODIFIER_DESC_cc_legacy_elder_cavalry_marshal: "The Marshal's doctrine of mobile warfare lives on in reduced cavalry costs, stronger discipline, and a tradition of bold offensive action."
 STATIC_MODIFIER_NAME_cc_legacy_elder_cavalry_marshal_consecrated: "Consecrated Legacy of the Cavalry Marshal"
 STATIC_MODIFIER_DESC_cc_legacy_elder_cavalry_marshal_consecrated: "The Marshal's memory has been elevated to a martial ideal — a permanent force multiplier for every commander who rides under our banner."

 STATIC_MODIFIER_NAME_cc_legacy_elder_supreme_commander: "Legacy of the Supreme Commander"
 STATIC_MODIFIER_DESC_cc_legacy_elder_supreme_commander: "The Supreme Commander's systematic reforms of our military apparatus endure — reduced costs, better discipline, and a rationalized chain of command."
 STATIC_MODIFIER_NAME_cc_legacy_elder_supreme_commander_consecrated: "Consecrated Legacy of the Supreme Commander"
 STATIC_MODIFIER_DESC_cc_legacy_elder_supreme_commander_consecrated: "The Supreme Commander's legacy has been permanently enshrined as a military tradition — every regiment drills to a standard they set."

 STATIC_MODIFIER_NAME_cc_legacy_elder_learned_courtier: "Legacy of the Learned Courtier"
 STATIC_MODIFIER_DESC_cc_legacy_elder_learned_courtier: "The Learned Courtier's love of scholarship endures as improved institutional research and a lasting culture of literacy at court."
 STATIC_MODIFIER_NAME_cc_legacy_elder_learned_courtier_consecrated: "Consecrated Legacy of the Learned Courtier"
 STATIC_MODIFIER_DESC_cc_legacy_elder_learned_courtier_consecrated: "The Learned Courtier's memory has become a founding ideal of our intellectual culture — institutions grow here as naturally as trees."

 STATIC_MODIFIER_NAME_cc_legacy_elder_enlightenment_herald: "Legacy of the Enlightenment Herald"
 STATIC_MODIFIER_DESC_cc_legacy_elder_enlightenment_herald: "The Herald's challenge to superstition and received wisdom has left a permanent mark — literacy climbs and reforms arrive with less resistance."
 STATIC_MODIFIER_NAME_cc_legacy_elder_enlightenment_herald_consecrated: "Consecrated Legacy of the Enlightenment Herald"
 STATIC_MODIFIER_DESC_cc_legacy_elder_enlightenment_herald_consecrated: "The Enlightenment Herald's ideas have been consecrated into the founding philosophy of this realm — reason governs here as much as tradition."

 STATIC_MODIFIER_NAME_cc_legacy_elder_master_urbanist: "Legacy of the Master Urbanist"
 STATIC_MODIFIER_DESC_cc_legacy_elder_master_urbanist: "The Master Urbanist's vision of the city as engine of progress endures in reduced construction costs and accelerating development."
 STATIC_MODIFIER_NAME_cc_legacy_elder_master_urbanist_consecrated: "Consecrated Legacy of the Master Urbanist"
 STATIC_MODIFIER_DESC_cc_legacy_elder_master_urbanist_consecrated: "The Master Urbanist's legacy has been enshrined as civic doctrine — our cities are built and governed by the standard [CHARACTER.GetSheHe] set."

 STATIC_MODIFIER_NAME_cc_legacy_elder_progressive_rationalist: "Legacy of the Progressive Rationalist"
 STATIC_MODIFIER_DESC_cc_legacy_elder_progressive_rationalist: "The Rationalist's systematic dismantling of superstition has left a permanent legacy of accelerated research and institutional receptiveness."
 STATIC_MODIFIER_NAME_cc_legacy_elder_progressive_rationalist_consecrated: "Consecrated Legacy of the Progressive Rationalist"
 STATIC_MODIFIER_DESC_cc_legacy_elder_progressive_rationalist_consecrated: "The Progressive Rationalist's philosophy has become foundational — this realm advances as a matter of institutional instinct, not royal decree."

 STATIC_MODIFIER_NAME_cc_legacy_elder_confucian_mandarin: "Legacy of the Confucian Mandarin"
 STATIC_MODIFIER_DESC_cc_legacy_elder_confucian_mandarin: "The Mandarin's devotion to meritocratic governance and proper relationships endures as a permanent gain in cabinet efficiency and assimilation speed."
 STATIC_MODIFIER_NAME_cc_legacy_elder_confucian_mandarin_consecrated: "Consecrated Legacy of the Confucian Mandarin"
 STATIC_MODIFIER_DESC_cc_legacy_elder_confucian_mandarin_consecrated: "The Confucian Mandarin's principles have been consecrated into the administrative soul of this realm — governance as moral vocation."

 STATIC_MODIFIER_NAME_cc_legacy_elder_caliphate_diplomat: "Legacy of the Caliphate Diplomat"
 STATIC_MODIFIER_DESC_cc_legacy_elder_caliphate_diplomat: "The Caliphate Diplomat's mastery of inter-state relations endures as improved diplomatic reach, reduced antagonism, and stronger trade connections."
 STATIC_MODIFIER_NAME_cc_legacy_elder_caliphate_diplomat_consecrated: "Consecrated Legacy of the Caliphate Diplomat"
 STATIC_MODIFIER_DESC_cc_legacy_elder_caliphate_diplomat_consecrated: "The Caliphate Diplomat's legacy has been consecrated as a diplomatic tradition — foreign courts understand what our banner represents."

 STATIC_MODIFIER_NAME_cc_legacy_elder_seneschal: "Legacy of the Seneschal"
 STATIC_MODIFIER_DESC_cc_legacy_elder_seneschal: "The Seneschal's lifetime of managing the great households endures as reduced court costs and a permanent improvement in administrative efficiency."
 STATIC_MODIFIER_NAME_cc_legacy_elder_seneschal_consecrated: "Consecrated Legacy of the Seneschal"
 STATIC_MODIFIER_DESC_cc_legacy_elder_seneschal_consecrated: "The Seneschal's mastery of court management has been consecrated into institutional doctrine — every treasury and household follows a standard they set."

 STATIC_MODIFIER_NAME_cc_legacy_elder_marshal_of_the_court: "Legacy of the Marshal of the Court"
 STATIC_MODIFIER_DESC_cc_legacy_elder_marshal_of_the_court: "The Marshal's dual mastery of ceremony and command endures as improved noble relations, better military discipline, and a more prestigious court."
 STATIC_MODIFIER_NAME_cc_legacy_elder_marshal_of_the_court_consecrated: "Consecrated Legacy of the Marshal of the Court"
 STATIC_MODIFIER_DESC_cc_legacy_elder_marshal_of_the_court_consecrated: "The Marshal of the Court's memory has been permanently woven into the fabric of our court culture — discipline and ceremony as a single expression of sovereign power."

