 cc_overlord_unrest_response: "Governor Replaced Without Cause"

 # ============================================================
 # Colonial Consolidation & Border Friction
 # ============================================================

 STATIC_MODIFIER_NAME_cc_col_viceroyalty: "Vice-Regal Seat"
 STATIC_MODIFIER_DESC_cc_col_viceroyalty: "Elevated to a viceroyalty governing a consolidated colonial realm, this seat draws settlers, trade, and prestige."
 STATIC_MODIFIER_NAME_cc_col_unified_administration: "Unified Colonial Administration"
 STATIC_MODIFIER_DESC_cc_col_unified_administration: "Folding two overlapping colonial governments into one has streamlined the Crown's overseas rule."
 STATIC_MODIFIER_NAME_cc_col_colonial_coordination: "Colonial Coordination"
 STATIC_MODIFIER_DESC_cc_col_colonial_coordination: "A shared coordinating council lets neighbouring colonies cooperate without surrendering their separate seats."
 STATIC_MODIFIER_NAME_cc_col_frontier_tension: "Disputed Frontier"
 STATIC_MODIFIER_DESC_cc_col_frontier_tension: "An unresolved border quarrel saps prosperity and stokes unrest along the colonial line."
 STATIC_MODIFIER_NAME_cc_col_settled_frontier: "Settled Frontier"
 STATIC_MODIFIER_DESC_cc_col_settled_frontier: "A surveyed and recognized frontier has brought calm and confidence to the colony."
 STATIC_MODIFIER_NAME_cc_col_coerced_labor_regime: "Coerced Labor Regime"
 STATIC_MODIFIER_DESC_cc_col_coerced_labor_regime: "An entrenched system of coerced labor enriches the colony at a lasting cost to its cohesion."

 STATIC_MODIFIER_NAME_cc_col_plantation_economy: "Plantation Economy"
 STATIC_MODIFIER_DESC_cc_col_plantation_economy: "Cash-crop plantations drive output, though the labor they demand breeds local discontent."
 STATIC_MODIFIER_NAME_cc_col_encomienda_labor: "Encomienda Labor"
 STATIC_MODIFIER_DESC_cc_col_encomienda_labor: "Coerced native labor swells the colony's revenues while suppressing its population."
 STATIC_MODIFIER_NAME_cc_col_mission_district: "Mission District"
 STATIC_MODIFIER_DESC_cc_col_mission_district: "A conversion-focused settlement that pacifies the frontier and steadies the colony."

 # ============================================================
 # BALANCE OF POWER
 # ============================================================
 STATIC_MODIFIER_NAME_cc_bop_defector: "Bloc Defector"
 STATIC_MODIFIER_DESC_cc_bop_defector: "Having abandoned its alignment, this court is regarded as faithless by the chancelleries of Europe."
 STATIC_MODIFIER_NAME_cc_bop_coalition_partner: "New Coalition Partner"
 STATIC_MODIFIER_DESC_cc_bop_coalition_partner: "Freshly enrolled in the balancing coalition, buoyed by the promise of common purpose."
 STATIC_MODIFIER_NAME_cc_bop_ascendant_confidence: "Ascendant Confidence"
 STATIC_MODIFIER_DESC_cc_bop_ascendant_confidence: "Momentum gathers behind the aspiring hegemon and all who march with it."
 STATIC_MODIFIER_NAME_cc_bop_coalition_solidarity: "Coalition Solidarity"
 STATIC_MODIFIER_DESC_cc_bop_coalition_solidarity: "A united coalition stands resolute against any bid for mastery of the continent."
 STATIC_MODIFIER_NAME_cc_bop_coalition_wavering: "Wavering Coalition"
 STATIC_MODIFIER_DESC_cc_bop_coalition_wavering: "Doubt and discord spread through a coalition losing its nerve."
 STATIC_MODIFIER_NAME_cc_bop_bought_ally: "Foreign Subsidies"
 STATIC_MODIFIER_DESC_cc_bop_bought_ally: "Foreign gold fills the treasury, and with it counsels of neutrality and appeasement."
 STATIC_MODIFIER_NAME_cc_bop_hegemonic_overstretch: "Hegemonic Overstretch"
 STATIC_MODIFIER_DESC_cc_bop_hegemonic_overstretch: "Reaching for dominance has strained our armies and inflamed the fears of every neighbour."
 STATIC_MODIFIER_NAME_cc_bop_subsidized: "Coalition Subsidies"
 STATIC_MODIFIER_DESC_cc_bop_subsidized: "War-chests opened by the coalition shore up our strength against the preponderant power."
 STATIC_MODIFIER_NAME_cc_bop_balancer_prestige: "Balancer of Europe"
 STATIC_MODIFIER_DESC_cc_bop_balancer_prestige: "Recognised as the indispensable arbiter whose weight decides the equilibrium of the continent."
 STATIC_MODIFIER_NAME_cc_bop_master_of_europe: "Master of Europe"
 STATIC_MODIFIER_DESC_cc_bop_master_of_europe: "The balance is broken and we stand astride the continent — a new Charlemagne, a new Caesar."
 STATIC_MODIFIER_NAME_cc_bop_humbled_power: "Humbled Power"
 STATIC_MODIFIER_DESC_cc_bop_humbled_power: "We failed to halt the hegemon, and the memory of that failure follows our envoys into every court."
 STATIC_MODIFIER_NAME_cc_bop_scourge_of_the_west: "Scourge of the West"
 STATIC_MODIFIER_DESC_cc_bop_scourge_of_the_west: "The old western order could not hold us back; our armies pour across its frontiers."
 STATIC_MODIFIER_NAME_cc_bop_western_bulwark: "Western Bulwark"
 STATIC_MODIFIER_DESC_cc_bop_western_bulwark: "Battered but unbroken, the west girds itself to endure and rebuild."
 STATIC_MODIFIER_NAME_cc_bop_concert_of_europe: "Concert of Europe"
 STATIC_MODIFIER_DESC_cc_bop_concert_of_europe: "A durable diplomatic order, sustained by congresses and the shared resolve to keep the peace."
 STATIC_MODIFIER_NAME_cc_bop_revolutionary_upheaval: "Revolutionary Upheaval"
 STATIC_MODIFIER_DESC_cc_bop_revolutionary_upheaval: "The old order is swept away as revolution shatters the careful equilibrium of kings."
 STATIC_MODIFIER_NAME_cc_bop_scorched_earth: "Mired in a Scorched Land"
 STATIC_MODIFIER_DESC_cc_bop_scorched_earth: "The enemy burns the country before us; our columns starve and dwindle in a wasteland of their own making."
 STATIC_MODIFIER_NAME_cc_bop_continental_blockade: "Continental Blockade"
 STATIC_MODIFIER_DESC_cc_bop_continental_blockade: "The hegemon's decree shuts our merchants out of the continent's markets, throttling trade and breeding discontent."
 STATIC_MODIFIER_NAME_cc_bop_levee_en_masse: "The Nation in Arms"
 STATIC_MODIFIER_DESC_cc_bop_levee_en_masse: "A whole people mobilised — manpower and ardour in abundance, though the levy strains the bonds of the old order."
 STATIC_MODIFIER_NAME_cc_bop_arbiter_of_europe: "Arbiter of Europe"
 STATIC_MODIFIER_DESC_cc_bop_arbiter_of_europe: "We held the coalition together and denied the would-be master of the continent. Now Europe looks to us as the trusted guarantor of its peace — our word carries weight in every chancellery, and our merchants prosper under the order we keep."
 STATIC_MODIFIER_NAME_cc_bop_aspiring_hegemon: "The Aspiring Hegemon"
 STATIC_MODIFIER_DESC_cc_bop_aspiring_hegemon: "Having mastered the coalition that humbled one would-be hegemon, we have learned how such a bloc is built — and broken. The armies and the ambition that saved the balance now turn toward a pre-eminence of our own."

