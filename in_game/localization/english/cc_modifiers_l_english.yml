 MODIFIER_TYPE_NAME_cc_royal_trading_bureau_impact_modifier: "Royal Trading Bureau Efficiency"
 MODIFIER_TYPE_DESC_cc_royal_trading_bureau_impact_modifier: "Modifies the effectiveness of the Royal Trading Bureau, scaling its tax revenue and maritime capacity bonuses."

 MODIFIER_TYPE_NAME_cc_scholarly_concordat_impact_modifier: "Scholarly Concordat Efficiency"
 MODIFIER_TYPE_DESC_cc_scholarly_concordat_impact_modifier: "Modifies the effectiveness of the Scholarly Concordat, scaling its research speed and institutional growth bonuses."

 MODIFIER_TYPE_DESC_monthly_towards_pru_hre: "Monthly drift toward the Prussian interpretation of the Holy Roman Empire's constitutional principles."
 MODIFIER_TYPE_DESC_monthly_towards_pru_empire: "Monthly drift toward establishing a Prussian-style empire through constitutional reform."

 # ============================================================
 # SUBJECT BOND MODIFIERS — Colonial Nation (cc_bonds.12, cc_bonds.14)
 # ============================================================

 STATIC_MODIFIER_NAME_cc_governor_unrest_reform: "Colonial Tax Reform"
 STATIC_MODIFIER_DESC_cc_governor_unrest_reform: "Investigators dispatched to root out corruption in the colonial tax apparatus have disrupted existing revenue flows. Minting income and tax receipts suffer in the short term while reforms bed in."

 STATIC_MODIFIER_NAME_cc_governor_unrest_appeasement: "Colonial Unrest — Appeased"
 STATIC_MODIFIER_DESC_cc_governor_unrest_appeasement: "Promises and gifts have bought temporary quiet in the colony, but the underlying grievances fester. Rebel sentiment continues to grow."

 STATIC_MODIFIER_NAME_cc_colonial_representative_strain: "Colonial Representative Bodies"
 STATIC_MODIFIER_DESC_cc_colonial_representative_strain: "Establishing formal representative institutions for the colony requires navigating competing legal traditions and expanding administrative capacity. Legislative processes slow and bureaucratic costs rise while the new bodies find their footing."

