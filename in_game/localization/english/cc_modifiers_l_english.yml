 # Hundred Years War modifiers
 STATIC_MODIFIER_NAME_cc_fra_hyw_feudal_strain: "Feudal War Strain"
 STATIC_MODIFIER_DESC_cc_fra_hyw_feudal_strain: "The long war with England has entrenched noble dominance over French levies and strained the loyalty of the estates, decaying over a century of conflict."
 STATIC_MODIFIER_NAME_cc_fra_hyw_war_defeat: "Defeat's Shadow"
 STATIC_MODIFIER_DESC_cc_fra_hyw_war_defeat: "A recent defeat has emboldened the nobility, increased war-weariness, and made peasant conscription harder. Stacks with further defeats."
 STATIC_MODIFIER_NAME_cc_fra_hyw_war_victory: "Victory's Confidence"
 STATIC_MODIFIER_DESC_cc_fra_hyw_war_victory: "A recent victory has lifted morale and emboldened peasant recruitment. Partially offsets accumulated defeats."
 STATIC_MODIFIER_NAME_cc_fra_hyw_noble_sacrifice: "Noble Sacrifice"
 STATIC_MODIFIER_DESC_cc_fra_hyw_noble_sacrifice: "The king has demanded the nobility provide additional levies in the wake of defeat. They comply — but at the cost of their goodwill."
 STATIC_MODIFIER_NAME_cc_eng_hyw_martial_tradition: "English Martial Tradition"
 STATIC_MODIFIER_DESC_cc_eng_hyw_martial_tradition: "English noble culture and the longbow tradition give the realm a martial edge at the opening of the Hundred Years War, decaying over a century."
 STATIC_MODIFIER_NAME_cc_eng_hyw_ascendancy: "English Ascendancy"
 STATIC_MODIFIER_DESC_cc_eng_hyw_ascendancy: "A recent victory has confirmed English martial supremacy, boosting noble levies, manpower, and morale."
 STATIC_MODIFIER_NAME_cc_eng_hyw_setback: "English Setback"
 STATIC_MODIFIER_DESC_cc_eng_hyw_setback: "A defeat has sapped English confidence, reducing manpower, morale, and noble satisfaction."
 STATIC_MODIFIER_NAME_cc_fra_appanage_purge_resentment: "Appanage Resentment"
 STATIC_MODIFIER_DESC_cc_fra_appanage_purge_resentment: "The forced replacement of the ruling house has left deep wounds. Noble levies are curtailed and estate satisfaction remains depressed."
 STATIC_MODIFIER_NAME_cc_fra_purge_noble_unease: "Noble Unease"
 STATIC_MODIFIER_DESC_cc_fra_purge_noble_unease: "Paris's show of force against an appanage has unsettled the broader nobility. The estates watch closely."

 STATIC_MODIFIER_NAME_cc_colonial_legitimacy_era: "Age of Colonial Legitimacy"
 STATIC_MODIFIER_DESC_cc_colonial_legitimacy_era: "Granting a colony formal representation has echoed across the western world — attracting settlers, improving subject loyalty, and lending the Crown a reputation for measured governance."
 STATIC_MODIFIER_NAME_cc_colonial_supremecy_era: "Age of Colonial Supremecy"
 STATIC_MODIFIER_DESC_cc_colonial_supremecy_era: "Why grant representation to such pathetic things."

