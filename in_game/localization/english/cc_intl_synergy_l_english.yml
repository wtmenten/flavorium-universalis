l_english:
 # ============================================================
 # CROSS-COUNTRY SYNERGY EVENTS (cc_intl namespace)
 # ============================================================

 # -------- STATIC MODIFIER NAMES --------
 STATIC_MODIFIER_NAME_cc_intl_scholar_influx: "Scholar Influx"
 STATIC_MODIFIER_NAME_cc_intl_military_exchange: "Military Exchange"
 STATIC_MODIFIER_NAME_cc_intl_trade_compact: "Trade Compact"
 STATIC_MODIFIER_NAME_cc_intl_steppe_alliance: "Steppe Alliance"
 STATIC_MODIFIER_NAME_cc_intl_pilgrimage_network: "Pilgrimage Network"
 STATIC_MODIFIER_NAME_cc_intl_religious_solidarity: "Religious Solidarity"
 STATIC_MODIFIER_NAME_cc_intl_shadow_operations: "Shadow Operations"
 STATIC_MODIFIER_NAME_cc_intl_diplomatic_compact: "Diplomatic Compact"
 STATIC_MODIFIER_NAME_cc_intl_intellectual_rivalry: "Intellectual Rivalry"

 # -------- GROUP A: INTELLECTUAL & SCHOLARLY --------

 cc_intl.1.title: "The Philosopher's Exchange"
 cc_intl.1.desc: "Word reaches us from [target_nation.GetName]: their court has produced ministers of unusual intellectual distinction. [minister.GetName] has been corresponding with them for months. The letters have been remarkable — and the opportunity they represent may be more remarkable still."
 cc_intl.1.a: "Propose a formal scholarly exchange — both courts benefit."
 cc_intl.1.b: "Invite their scholars here. Let the talent flow to us."
 cc_intl.1.c: "Our court keeps its own counsel."

 cc_intl.2.title: "Scholars in Exile"
 cc_intl.2.desc: "The war engulfing [war_nation.GetName] has created a flood of refugees — among them scholars, physicians, and administrators of considerable talent. They are crossing our borders with nothing but their learning. [minister.GetName] believes we should receive them."
 cc_intl.2.a: "Open the court to the exiles. Their knowledge is our gain."
 cc_intl.2.b: "Let's pay some mercenaries to keep the rabble out."
 cc_intl.2.c: "This is not our war, and these are not our scholars."

 cc_intl.3.title: "The Rival Philosopher"
 cc_intl.3.desc: "The court of [rival_court.GetName] has declared itself the foremost center of learning in the known world. The claim is not without foundation — but it is also not uncontested. Our own intellectual achievements are considerable. How do we respond?"
 cc_intl.3.a: "Let the rivalry sharpen both courts. Competition advances knowledge."
 cc_intl.3.b: "Challenge their preeminence directly. We will not yield the title."
 cc_intl.3.c: "Propose a joint academy. Together we surpass what either achieves alone."

 # -------- GROUP B: MILITARY COOPERATION --------

 cc_intl.4.title: "The Marshal's Doctrine"
 cc_intl.4.desc: "[military_minister.GetName] has been watching [military_ally.GetName]'s war with professional interest. The campaigns have revealed weaknesses — and our own doctrine has something to offer in return. There is an opportunity here: share knowledge, profit from expertise, or simply observe."
 cc_intl.4.a: "Share our doctrine freely. Good allies fight better."
 cc_intl.4.b: "Request their veterans in exchange. Experienced soldiers are worth gold."
 cc_intl.4.c: "Sell the expertise. Their gold is as good as their gratitude."

 cc_intl.5.title: "Nomadic Migration"
 cc_intl.5.desc: "The tribal lords of [steppe_neighbor.GetName] are restless. [minister.GetName] — who understands the steppe mind better than most at this court — believes we stand at a crossroads: alliance, suzerainty, or transaction. Each path has its price and its prize."
 cc_intl.5.a: "Forge an alliance. Their cavalry and our administration — a formidable combination."
 cc_intl.5.b: "Demand tribute. The strong take; the weak give."
 cc_intl.5.c: "Hire their cavalry outright. This is business, not politics."

 # -------- GROUP C: RELIGIOUS & FAITH NETWORKS --------

 cc_intl.6.title: "The Caliphate Solidarity"
 cc_intl.6.desc: "Our chancellor has received a delegation from [muslim_partner.GetName] bearing a message of fraternity. The Islamic world is not one empire — it is one civilization. There are ways to strengthen that civilization's connective tissue that benefit all who share the faith."
 cc_intl.6.a: "Islamic solidarity. Our fates are bound by more than treaty."
 cc_intl.6.b: "A trade network compact. The dar al-Islam's greatest strength is its commerce."
 cc_intl.6.c: "Call a theological summit. The scholars must speak."

 cc_intl.7.title: "Protestant Solidarity"
 cc_intl.7.desc: "The Reformation has made strange bedfellows and stranger enemies. [protestant_partner.GetName] shares our confession, faces similar pressures, and has reached out through our minister's network. The question is how much solidarity we wish to demonstrate — and at what cost."
 cc_intl.7.a: "Declare our brotherhood openly. We stand together before God and before Rome."
 cc_intl.7.b: "A scholarly exchange. The Reformation's greatest weapon is argument, not arms."
 cc_intl.7.c: "Acknowledge the bond quietly. Discretion is the better part of confessional politics."

 cc_intl.8.title: "The Sacred Pilgrimage"
 cc_intl.8.desc: "The sacred sites draw pilgrims from across the world, including from [pilgrimage_partner.GetName]. Our minister — whose spiritual authority extends beyond the cabinet room — believes the crown should take an active role in hosting, directing, and profiting from this flow of faithful travelers."
 cc_intl.8.a: "Host the great pilgrimage. Let this court become a sacred center."
 cc_intl.8.b: "Send spiritual emissaries to their court instead."
 cc_intl.8.c: "Act as spiritual arbiter between our courts — faith as diplomacy."

 # -------- GROUP D: TRADE & DIPLOMATIC --------

 cc_intl.9.title: "The Merchant's Compact"
 cc_intl.9.desc: "[trade_partner.GetName]'s merchant community has established contact with ours. Our minister sees an opportunity: the trade routes we each control overlap in ways that are more complementary than competitive. A compact now could define commerce in this region for a generation."
 cc_intl.9.a: "A joint trade venture. Both courts prosper; neither dominates."
 cc_intl.9.b: "Negotiate exclusive rights. Our merchants take the lead position."
 cc_intl.9.c: "Study their practices quietly. Knowledge is its own form of trade."

 cc_intl.10.title: "The Grand Chancellor's Leverage"
 cc_intl.10.desc: "The court of [junior_state.GetName] is smaller, weaker, and — our chancellor believes — amenable to persuasion. The question is what form that persuasion should take: patronage, extraction, or demonstration of strength."
 cc_intl.10.a: "Extend diplomatic patronage. They enter our orbit willingly."
 cc_intl.10.b: "Extract a tributary arrangement. Power has its privileges."
 cc_intl.10.c: "Make a show of strength. Let them see what resistance costs."

 # -------- GROUP E: ESPIONAGE & SHADOW PLAY --------

 cc_intl.11.title: "The Shadow Court Reaches Out"
 cc_intl.11.desc: "[minister.GetName] has been watching [shadow_target.GetName] for some time. The hostility there is not accidental — it is cultivated, perhaps by those who fear what we represent. Our shadow counselor believes the time has come to act: gather intelligence, poach their talent, or manufacture the pretext we need."
 cc_intl.11.a: "Build the intelligence operation. Know them before they know us."
 cc_intl.11.b: "Recruit their discontented nobles. Their loss is our gain."
 cc_intl.11.c: "Forge a diplomatic incident. We will have our justification."

 # -------- GROUP F: RULER-TO-RULER --------

 cc_intl.12.title: "The Confucian Mission"
 cc_intl.12.desc: "The court of [tributary_state.GetName] has been observed by our Confucian minister, and the observation is this: they are smaller, they are neighboring, and they stand within the orbit of the Celestial tradition. How we approach them will define the character of that relationship — patronage, culture, or authority."
 cc_intl.12.a: "Offer tributary relations. The celestial hierarchy asks for recognition, not submission."
 cc_intl.12.b: "Send a cultural mission. Confucian administrative practice is our greatest export."
 cc_intl.12.c: "Assert celestial supremacy. Our culture expands; their resistance is noted."
