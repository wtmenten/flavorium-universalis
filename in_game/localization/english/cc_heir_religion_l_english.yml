l_english:
 cc_request_heir_religion_group: "Request Heir Religion Law"
 dip_cc_request_heir_religion_group: "Request Heir Religion Law"
 dip_cc_request_heir_religion_group_CATEGORY: "CATEGORY_FRIENDLY_ACTIONS"
 cc_request_heir_religion_group_desc: "Ask a royal-marriage partner of another faith in our [religion_group|e] to change their [ShowLawName('heir_religion_law')] to [ShowPolicyName('heir_same_religion_group')], so that heirs of our faith can inherit their throne."
 cc_request_heir_religion_group_act: "Ask [SCOPE.sCountry('recipient').GetName] to change their [ShowLawName('heir_religion_law')]."
 cc_request_heir_religion_group_effect_text: "[SCOPE.sCountry('actor').GetName] ask [SCOPE.sCountry('recipient').GetName] to adopt [ShowPolicyName('heir_same_religion_group')]."
 cc_request_heir_religion_group_effect_text_past: "[SCOPE.sCountry('actor').GetName] asked [SCOPE.sCountry('recipient').GetName] to adopt [ShowPolicyName('heir_same_religion_group')]."
 PROPOSE_cc_request_heir_religion_group: "Ask $RECIPIENT$ to change their [ShowLawName('heir_religion_law')] to [ShowPolicyName('heir_same_religion_group')]?\n\n$INFO$"
 cc_request_heir_religion_group_reject_effect_text: "$generic_reject_request_effect_string$"
 cc_request_heir_religion_group_reject_effect_text_past: "$generic_reject_request_effect_string_past$"
 INCOMING_OFFER_TITLE_cc_request_heir_religion_group: "Heir Religion Request"
 INCOMING_OFFER_cc_request_heir_religion_group: "$ACTOR$ ask us to change our [ShowLawName('heir_religion_law')] to [ShowPolicyName('heir_same_religion_group')].\n\n$INFO$"
 cc_hrl_request_tt: "[SCOPE.sCountry('recipient').GetName] will decide whether to change their [ShowLawName('heir_religion_law')] from [ShowPolicyName('heir_same_religion')] to [ShowPolicyName('heir_same_religion_group')]. They may agree, refuse, or agree only if we make the same change.\nThey are more likely to agree if they have a good [opinion|e] of us and trust us, and if we have high [diplomatic_reputation|e] and [prestige|e], are a [great_power|e], or have the stronger culture. A refusal lowers our [opinion|e] of them."
 cc_hrl_has_same_religion_policy_tt: "Their [ShowLawName('heir_religion_law')] is [ShowPolicyName('heir_same_religion')]"
 cc_hrl_policy_not_locked_tt: "Their [ShowLawName('heir_religion_law')] is not locked"
 cc_hrl_group_policy_available_tt: "[ShowPolicyName('heir_same_religion_group')] is available to them"
 cc_hrl_not_recently_asked_tt: "No one has asked them to change this law in the last 10 years"

 opinion_cc_hrl_request_granted: "Changed Heir Religion Law at Our Request"
 opinion_cc_hrl_request_refused: "Refused Our Heir Religion Request"
 opinion_cc_hrl_reciprocal_pact: "Mutual Heir Religion Agreement"

 cc_hrl.1.title: "A Request from [cc_hrl_requester.GetName]"
 cc_hrl.1.desc: "Envoys from [cc_hrl_requester.GetName], bound to us by royal marriage, ask that we open our succession to heirs of the [cc_hrl_requester.GetReligion.GetName] faith. Our law currently requires an heir of our own religion. Since both faiths share a religious group, they ask us to require only that. Our clergy will not welcome the change, but it would strengthen ties between the two courts."
 cc_hrl.1.a: "Agree to the change."
 cc_hrl.1.b: "Our succession is not theirs to decide."
 cc_hrl.1.c: "Only if they do the same."
 cc_hrl.1.c.tt: "[cc_hrl_requester.GetName] will be asked to change their own [ShowLawName('heir_religion_law')] to [ShowPolicyName('heir_same_religion_group')]. If they accept, both countries change it together."

 cc_hrl.2.title: "[cc_hrl_partner.GetName] Agree"
 cc_hrl.2.desc: "[cc_hrl_partner.GetName] have changed their [ShowLawName('heir_religion_law')] to [ShowPolicyName('heir_same_religion_group')]. An heir of our faith can now inherit their throne."
 cc_hrl.2.a: "Good."

 cc_hrl.3.title: "[cc_hrl_partner.GetName] Refuse"
 cc_hrl.3.desc: "[cc_hrl_partner.GetName] have refused our request. Their throne remains closed to heirs who do not share their religion."
 cc_hrl.3.a: "So be it."

 cc_hrl.4.title: "[cc_hrl_partner.GetName] Ask for the Same"
 cc_hrl.4.desc: "[cc_hrl_partner.GetName] will change their [ShowLawName('heir_religion_law')] to [ShowPolicyName('heir_same_religion_group')], but only if we change ours as well. Our clergy and court will resist opening our own succession to heirs of the [cc_hrl_partner.GetReligion.GetName] faith, and pushing it through will cost us."
 cc_hrl.4.a: "Agreed. Both crowns will change the law."
 cc_hrl.4.b: "We will not open our own succession."

 cc_hrl.5.title: "Agreement with [cc_hrl_requester.GetName]"
 cc_hrl.5.desc: "[cc_hrl_requester.GetName] accepted our terms. Both countries now use [ShowPolicyName('heir_same_religion_group')], and an heir of either faith can inherit either throne."
 cc_hrl.5.a: "Good."

 cc_hrl.6.title: "[cc_hrl_requester.GetName] Decline"
 cc_hrl.6.desc: "[cc_hrl_requester.GetName] would not change their own [ShowLawName('heir_religion_law')]. Our law stays as it was."
 cc_hrl.6.a: "Then nothing changes."
