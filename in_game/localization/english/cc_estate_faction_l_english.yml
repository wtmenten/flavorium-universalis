l_english:
 # ============================================================
 # Pillar 02 — Estate-Aligned Cabinet Factions
 # ============================================================

 # --- Estate Faction Traits (Family G) ---
 noble_champion_of_court: "Noble Champion of the Court"
 noble_champion_of_court_desc: "This minister is the unambiguous voice of the noble estate within the cabinet. Titles, privileges, and military prerogatives are the language [character.GetHeShe] speaks — and the estates know it."

 merchant_of_the_crown: "Merchant of the Crown"
 merchant_of_the_crown_desc: "Born from the counting-houses, this minister brings the burgher estate's commercial reasoning into every council. Trade routes are policy; profit is statecraft."

 court_prelate: "Court Prelate"
 court_prelate_desc: "This minister wears two offices: a seat in the cabinet and the weight of the faith. The clergy looks to [character.GetHimHer] as their champion within the crown's inner circle."

 tribune_of_the_commons: "Tribune of the Commons"
 tribune_of_the_commons_desc: "Few such ministers exist — fewer still survive the court's indifference. This one does. [character.GetHeShe|c] listens to peasant petitions that others dismiss and translates them into policy that prevents rebellions rather than suppressing them."

 steppe_voice: "Voice of the Steppe"
 steppe_voice_desc: "This minister walks the court and the open plain with equal ease. [character.GetHeShe|c] mediates between the tribal estate's expectations and the demands of a sedentary government — an uneasy balance, but a necessary one."

 dhimmi_advocate: "Dhimmi Advocate"
 dhimmi_advocate_desc: "Where others see a tax base, this minister sees a constituency. The dhimmi community has found a voice inside the cabinet — and the realm is, at least marginally, the more stable for it."

 cossack_hetman_liaison: "Cossack Hetman's Liaison"
 cossack_hetman_liaison_desc: "The hetman trusts this minister to represent cossack interests where the hetman cannot ride. [character.GetHeShe|c] carries the steppe's demands and the cossacks' pride into council rooms that would otherwise never hear them."

 # --- cc_fac.1 — The Nobles Demand ---
 cc_fac.1.title: "The Nobles Demand"
 cc_fac.1.desc: "With [noble_minister.GetName] and a second noble-aligned minister now firmly established within the cabinet, the noble estate has begun to act as if the court belongs to them. The estates' formal delegate has presented a demand — framed as a petition, but everyone knows what it is: a privilege, a concession, or a reform that will consolidate noble power for a generation."

 cc_fac.1.a: "Grant the privilege — the nobles are too powerful to refuse."
 cc_fac.1.a.tooltip: "The nobles are pleased and the cabinet endorses the decision with relief. The treasury bears the cost. The court's composition is working exactly as noble estate power concentrates — and the ministers make sure of it."

 cc_fac.1.b: "Refuse — the crown does not govern by noble consent."
 cc_fac.1.b.tooltip: "A bold rejection. The noble estate is affronted; [noble_minister.GetName] is visibly embarrassed by the rebuke. The court reads the signal — but so does every noble house in the realm."

 cc_fac.1.c: "Offer a partial concession to preserve the peace."
 cc_fac.1.c.tooltip: "A compromise that satisfies no one completely and offends no one fatally. The estates receive a modest gesture; the crown retains its prerogative; the treasury pays a small fee for the peace."

 # --- cc_fac.2 — The Merchant Compact ---
 cc_fac.2.title: "The Merchant Compact"
 cc_fac.2.desc: "The burgher-aligned ministers have been working quietly. [merchant_minister.GetName] presents the result: a formal commercial arrangement, sponsored by the estate's merchant networks and structured to enrich the crown. The deal is legally sound, politically convenient, and — according to the nobles who have read the fine print — thoroughly humiliating to everyone who is not a merchant."

 cc_fac.2.a: "Embrace the compact — commercial power is real power."
 cc_fac.2.a.tooltip: "The treasury gains substantially. The burgher estate is delighted. The noble estate, whose levies and land-tax revenues are quietly undercut by the arrangement, nurses a quiet resentment."

 cc_fac.2.b: "Reject the compact — the crown should not govern through merchants."
 cc_fac.2.b.tooltip: "The rejection is dignified but clear. [merchant_minister.GetName] receives it in silence and files it away. The estate is displeased — and the minister's confidence in the crown has diminished."

 cc_fac.2.c: "Accept a smaller version of the arrangement."
 cc_fac.2.c.tooltip: "A limited compact: gold flows in, some inflationary pressure flows with it. The burghers call it a start. The nobles call it the first step. Both are probably right."

 # --- cc_fac.3 — The Prelates Move ---
 cc_fac.3.title: "The Prelates Move"
 cc_fac.3.desc: "[clergy_minister.GetName] has called a private council of the cabinet's clerical voices. What emerged is a formal position paper: the court must be seen to enforce confessional conformity within the realm's institutions. The ministers do not say heresy — they say 'administrative coherence.' But the estates, the heretics, and the foreign courts all understand what is actually being proposed."

 cc_fac.3.a: "Back the clergy — confessional unity strengthens the realm."
 cc_fac.3.a.tooltip: "The clergy is gratified; the conversion apparatus receives a formal mandate. Prestige edges upward with the realm's visible piety. Burgher traders with mixed-faith networks begin to quietly relocate."

 cc_fac.3.b: "Resist the move — the crown governs all estates equally."
 cc_fac.3.b.tooltip: "A firm refusal that the crown will not be an instrument of confessional enforcement. The clergy is displeased; stability firms; [clergy_minister.GetName] is privately furious."

 cc_fac.3.c: "Compromise — give the clergy more influence without formal enforcement."
 cc_fac.3.c.tooltip: "The clergy receives greater agenda authority over religious matters within the cabinet's remit. Not what they wanted — but enough to call it a concession."

 # ============================================================
 # Modifier Display Names (Pillar 02 — Auto-Modifiers)
 # ============================================================
 MODIFIER_NAME_nobles_court_captured: "Nobles Dominate the Cabinet"
 MODIFIER_DESC_nobles_court_captured: "Two or more noble-aligned ministers have made the cabinet a tool of the noble estate. Prestige accrues to their patrons; commercial and clerical agendas are systematically deprioritized."

 MODIFIER_NAME_burghers_court_captured: "Burghers Dominate the Cabinet"
 MODIFIER_DESC_burghers_court_captured: "Two or more burgher-aligned ministers have turned the cabinet into a commercial engine. Trade efficiency climbs; military and clerical interests are quietly ignored."

 MODIFIER_NAME_clergy_court_captured: "Clergy Dominate the Cabinet"
 MODIFIER_DESC_clergy_court_captured: "Two or more clergy-aligned ministers have made the cabinet speak with one confessional voice. Religious influence rises; tolerance of heterodoxy collapses."

 # ============================================================
 # Static Modifier Names (Pillar 02 — Country Modifiers)
 # ============================================================
 STATIC_MODIFIER_NAME_cc_nobles_court_captured: "Noble Capture"
 STATIC_MODIFIER_DESC_cc_nobles_court_captured: "The noble estate controls the cabinet. Prestige and noble agenda power rise; commercial and clerical interests suffer."

 STATIC_MODIFIER_NAME_cc_burghers_court_captured: "Burgher Capture"
 STATIC_MODIFIER_DESC_cc_burghers_court_captured: "The merchant estate controls the cabinet. Trade efficiency climbs; noble and clerical interests suffer."

 STATIC_MODIFIER_NAME_cc_clergy_court_captured: "Clergy Capture"
 STATIC_MODIFIER_DESC_cc_clergy_court_captured: "The clergy controls the cabinet. Religious influence rises; tolerance falls; commercial interests suffer."
