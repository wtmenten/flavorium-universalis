l_english:
 # === cc_bonds.120 — The Fort Needs Repair ===
 cc_bonds.120.title: "The Fort Needs Repair"
 cc_bonds.120.desc: "A report has come in from [bond_subj.GetName] that the key fortress protecting their territory has deteriorated significantly — cracked walls, a leaking gatehouse, an undermanned garrison. The subject's own revenues are not sufficient to address both the fortifications and the regular administration. They are asking whether the Crown might contribute to the repair. The fort is not ours, strictly speaking. But neither is the border it guards — it is ours as much as theirs."
 cc_bonds.120.a: "Fund full repairs. We share the frontier; we share the cost."
 cc_bonds.120.b: "Fund partial repairs. We contribute what we can."
 cc_bonds.120.c: "They must fund it themselves. The frontier is their command."
 cc_bonds.120.d: "File the report. We will address it when circumstances allow."

 # === cc_bonds.121 — The Fort Is Tested ===
 cc_bonds.121.title: "The Fort Is Tested"
 cc_bonds.121.desc_funded: "A neighboring power, evidently expecting the border to be as permeable as it was a decade ago, has sent forces to probe the territory of [bond_subj.GetName]. They encountered something unexpected: a fully repaired fortress, a well-supplied garrison, and a lord who had been given the resources to do his job properly. The incursion has been repelled. The report is filed under 'successful defense.' What remains is the question of credit."
 cc_bonds.121.desc_partial: "A neighboring power has tested the borders of [bond_subj.GetName]. The fortress held — barely. The garrison's commander described the engagement in terms that made clear how close it had been. With full funding the outcome would have been decisive; with half funding, it was a near thing. The border is secure. The conversation about what 'secure' is going to cost next time is not."
 cc_bonds.121.desc_failed: "A neighboring power has breached the border of [bond_subj.GetName]. The fortress — undermanned, its walls partially collapsed, its garrison working with inadequate supplies — could not hold. The occupation was brief; the neighbor has been expelled with Crown assistance. But the territory was occupied. The population was affected. The fortress that could have prevented it stands in disrepair, as it has since the report was filed. As it has since we decided not to act on the report."
 cc_bonds.121.a_credit: "Make clear that it was Crown investment that made this defense possible."
 cc_bonds.121.a_subject_credit: "The credit belongs to the lord and his garrison. We say so publicly."
 cc_bonds.121.b_reinforce: "Send emergency reinforcements and supplies immediately."
 cc_bonds.121.b_blame: "The partial result reflects the subject's own inadequate preparation."
 cc_bonds.121.c_lead: "We will personally lead the recovery. We owe them that much."
 cc_bonds.121.c_supplies: "Send supplies and coin. The Crown will contribute to reconstruction."

 # === cc_bonds.122 — Who Commands the Fort? ===
 cc_bonds.122.title: "Who Commands the Fort?"
 cc_bonds.122.desc: "The fortress in [bond_subj.GetName] has been rebuilt, reinforced, and restaffed. It now stands as one of the most capable defensive positions on our frontier. There is a question that the restoration has made unavoidable: who commands it? The current arrangement is informal — the subject lord has been running the garrison by custom rather than by formal authority. Formalizing the command structure means choosing whether that authority rests with the Crown or with the lord who has lived with the fort for a generation."
 cc_bonds.122.desc_positive: "The fortress in [bond_subj.GetName] has been rebuilt and restaffed. It stands well. The subject lord's garrison — the same people who defended it when the test came, whom the Crown praised publicly — have made it what it is. The question of formal command authority arrives already weighted. When we gave them the credit for the defense, we were not only being generous. We were setting a precedent that they have not forgotten."
 cc_bonds.122.desc_bitter: "The fortress in [bond_subj.GetName] has been rebuilt. It holds now because the Crown paid to restore what it had earlier declined to maintain — a detail the subject lord has never mentioned directly and has never allowed us to forget. Command arrangements have been informal since the reconstruction. Every season of silence on the subject is an implicit reminder of what the informal arrangement costs them."
 cc_bonds.122.a: "Appoint a Crown officer to command. We cannot leave a strategic asset to informal arrangements."
 cc_bonds.122.b: "Formally grant the subject lord command authority over the fort. He has earned it."
 cc_bonds.122.c: "Establish a joint command arrangement. The fort is ours together."
 cc_bonds.122.d: "Formalize command under the subject lord. The decision was settled when we gave them the credit."
 cc_bonds.122.d.tooltip: "The goodwill from public recognition pays dividends here. The subject lord receives formal command authority with strong pol, per, and mil gains — and prestige for the Crown."
 cc_bonds.122.e_repair: "Acknowledge the old failure. Compensate the lord before settling command."
 cc_bonds.122.e_repair.tooltip: "A material and symbolic settlement. The payment does not undo the breach — but it opens the command question on better footing. Pol and per improve."
 cc_bonds.122.e_ignore: "Settle the command question as if the history did not exist."
 cc_bonds.122.e_ignore.tooltip: "The subject lord draws his own conclusions from the silence. Per and pol both fall — the command question is answered, but not the relationship."
