l_english:
 # ============================================================
 # SUBJECT TYPES
 # ============================================================
 provincial_governorate: "Provincial Governorate"
 provincial_governorate_desc: "A high-autonomy administrative region governed by a Crown-appointed magnate. The governorate manages its own internal affairs and defends our borders — but the Governor's ambitions do not always align with ours."
 provincial_governorate_upgrade_tt: "The Provincial Governorate may be elevated to a Palatinate after sufficient time has passed."

 tax_farm: "Tax Farm"
 tax_farm_desc: "An exploitative extraction arrangement in which a powerful lord manages revenue collection in exchange for a portion of the proceeds. Extremely profitable in the short term, deeply unstable in the long term. The taxed populations will eventually demand relief."
 tax_farm_upgrade_tt: ""

 military_march: "Military March"
 military_march_desc: "An offensive border vassal given special military charter to project power beyond our frontiers. The March Lord is formidable, loyal (when the nobles are pleased), and occasionally impossible to control. They will raid our neighbors whether we sanction it or not."
 military_march_upgrade_tt: ""

 # ============================================================
 # ADVANCES
 # ============================================================
 late_governorate_advance: "Provincial Governance"
 late_governorate_advance_desc: "A formalized system of Crown-appointed governorates allows the realm to extend administrative reach over distant regions without direct annexation. Unlocks the Provincial Governorate subject type, the Governorate Charter estate privilege, and the Governorate Reform."

 tax_farming_advance: "Tax Farming"
 tax_farming_advance_desc: "Contracting the collection of revenues to powerful local lords — at a price. Unlocks the Tax Farm subject type, the Tax Charter estate privilege, and the Tax Farming Reform."

 military_march_advance: "Military Marches"
 military_march_advance_desc: "Designating border territories as military marches creates offensive buffers that extend our power at the frontier. Unlocks the Military March subject type, the March Charter estate privilege, and the March Charter Reform."

 # ============================================================
 # GOVERNMENT REFORMS — STANDARD
 # ============================================================
 cc_governorate_reform: "Governorate System"
 cc_governorate_reform_desc: "Formalizes the system of Crown-appointed provincial governorates, improving administrative capacity across the realm."

 cc_tax_farming_reform: "Tax Farming Contracts"
 cc_tax_farming_reform_desc: "Systematizes the practice of farming out tax collection to powerful lords, reducing bureaucratic overhead in exchange for local efficiency."

 cc_march_charter_reform: "March Charter"
 cc_march_charter_reform_desc: "Issues formal charters to border territories designating them as military marches, creating a network of offensive buffers along the realm's most contested frontiers."

 # ============================================================
 # GOVERNMENT REFORMS — LEGENDARY
 # ============================================================
 cc_philosophers_court_reform: "The Philosopher's Court"
 cc_philosophers_court_reform_desc: "The most learned court in the world. Research accelerates, institutions spread, and the realm's intellectual reputation draws talent from across the known world."

 cc_grand_bazaar_reform: "The Grand Bazaar"
 cc_grand_bazaar_reform_desc: "A cosmopolitan commercial and diplomatic network formalized as a governing principle. Trade centers flourish, diplomatic capacity expands, and our reputation in the Islamic world becomes a strategic asset."

 cc_iron_hegemony_reform: "The Iron Hegemony"
 cc_iron_hegemony_reform_desc: "Military dominance formalized as constitutional principle. All arms of the military are subsidized by the state; the noble estates are bound to the military machine; the realm's neighbors adjust their behavior accordingly."

 cc_parliamentary_compromise_reform: "Parliamentary Compromise"
 cc_parliamentary_compromise_reform_desc: "A formal agreement between the crown and the legislature that makes parliament more effective and more legitimate simultaneously."

 cc_mandate_bureaucracy_reform: "Mandate Bureaucracy"
 cc_mandate_bureaucracy_reform_desc: "The implementation of the Confucian bureaucratic ideal: meritocratic governance, proper relationships, and the assumption that the state exists to serve the moral order. Available to East and Southeast Asian realms."

 cc_peoples_assembly_reform: "People's Assembly"
 cc_peoples_assembly_reform_desc: "In the age of revolution, a government that genuinely commands popular consent. Unrest falls; legislative efficiency rises; history takes note."

 # ============================================================
 # ESTATE PRIVILEGES
 # ============================================================
 ep_nobles_governorate_charter: "Governorate Charter"
 ep_nobles_governorate_charter_desc: "The nobility receives formal authority to administer provincial governorates on the Crown's behalf, in exchange for development contributions and continued loyalty."

 ep_nobles_march_charter: "March Charter"
 ep_nobles_march_charter_desc: "The nobility receives formal authority to establish military marches along the frontier — powerful, offensive, and occasionally impossible to fully control."

 ep_nobles_diplomatic_court: "Diplomatic Court"
 ep_nobles_diplomatic_court_desc: "The nobility funds and hosts a formal diplomatic court that elevates the realm's reputation in the Islamic world, projecting power projection and prestige in equal measure."

 ep_burghers_tax_charter: "Tax Charter"
 ep_burghers_tax_charter_desc: "The merchant estates receive formal authority to administer tax collection in designated regions, reducing bureaucratic costs in exchange for a commercial cut of the revenues."

 ep_burghers_parliamentary_charter: "Parliamentary Charter"
 ep_burghers_parliamentary_charter_desc: "The burghers receive a formal parliamentary charter that codifies their legislative rights, increasing parliamentary support and commercial political influence simultaneously."

 # ============================================================
 # SUBJECT DRAWBACK MODIFIERS
 # ============================================================
 cc_subject_autonomy_pressure: "Autonomy Pressure"
 cc_subject_autonomy_pressure_desc: "The subject's population is restless and demanding greater self-governance. Rebel movements are organizing."

 cc_subject_tax_relief: "Tax Relief"
 cc_subject_tax_relief_desc: "Reduced extraction pressure has calmed the subject's population. Unrest decreases and legitimacy slowly recovers."

 # ============================================================
 # LEGEND MODIFIER
 # ============================================================
 cc_legend_holy_empire: "Holy Empire"
 cc_legend_holy_empire_desc: "The realm has achieved the status of a Holy Empire — a sacred polity in which spiritual and temporal authority reinforce each other. Religious influence flows outward, conversion accelerates, and the clergy's political power reaches its apex."
