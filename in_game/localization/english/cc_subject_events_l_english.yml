l_english:
 # ============================================================
 # Provincial Governorate Events
 # ============================================================

 cc.gov.1.title: "The Governor's Ambitions"
 cc.gov.1.desc: "Reports from [governor.GetName] speak of a restless court — promises made to local officials, expectations raised, and a governing apparatus that begins to imagine itself rather more independent than we had intended."
 cc.gov.1.a: "Pay off the governor's court. (−8× income)"
 cc.gov.1.b: "Suppress the ambitions firmly."
 cc.gov.1.c: "Ignore it for now."

 cc.gov.2.title: "The Governor Eyes the Neighbors"
 cc.gov.2.desc: "[governor.GetName] has sent a memorandum pointing out the military weakness of [target_neighbor.GetName] along our border. The governor makes the suggestion plainly: here is an opportunity."
 cc.gov.2.a: "Sanction a limited expansion."
 cc.gov.2.b: "Forbid any such adventurism."

 # ============================================================
 # Tax Farm Events
 # ============================================================

 cc.tax.1.title: "The Tax Farm Revolt"
 cc.tax.1.desc: "Word reaches us from [tax_lord.GetName]: the collectors have pushed too hard, and the locals have pushed back. There is unrest in the streets and fire in the warehouses. Something must be done."
 cc.tax.1.a: "Ease the extraction — grant some relief. (−6× income)"
 cc.tax.1.b: "Hold firm. Order will be restored."

 cc.tax.2.title: "Tax Collectors and the Neighbors"
 cc.tax.2.desc: "The neighbors of [tax_lord.GetName] have lodged a formal complaint. Our tax collectors, they claim, have been operating across the border — seizing goods, questioning merchants, and treating foreign territory as their own."
 cc.tax.2.a: "Compensate the neighbors and rein in the collectors. (−8× income)"
 cc.tax.2.b: "The collectors were within their rights."

 # ============================================================
 # Military March Events
 # ============================================================

 cc.march.1.title: "The March Lord's Raid"
 cc.march.1.desc: "Our march lord [march_lord.GetName] has launched a raid against [raided_neighbor.GetName] — opportunistic, profitable, and entirely without our authorization. A full report has been delivered. Now we must decide how to respond."
 cc.march.1.a: "Sanction the raid. Let them keep the spoils. (+4× income, +prestige)"
 cc.march.1.b: "Restrain the march lord. This is not permitted."

 cc.march.2.title: "March Lord Independence Bid"
 cc.march.2.desc: "With the nobility growing restless, [march_lord.GetName] has chosen this moment to test our resolve. The march lord's agents are in the capital, speaking of grievances, old debts, and the independence their ancestors once enjoyed."
 cc.march.2.a: "Pay them off — grant gold and noble concessions. (−20× income)"
 cc.march.2.b: "Convert the march to a protectorate."

 cc.march.3.title: "March Lord Threatens the Neighbors"
 cc.march.3.desc: "[march_lord.GetName] has assembled troops on the border with [threatened_neighbor.GetName] and is making demands we never authorized. The neighbor looks to us for guidance — or restraint."
 cc.march.3.a: "Back the march lord's aggression."
 cc.march.3.b: "Denounce the march lord's conduct."
 cc.march.3.c: "Mediate the dispute. (−8× income)"

 cc.march.charter.1.title: "A Military March Established"
 cc.march.charter.1.desc: "By the privilege of our nobles, a military march has been formally chartered. Its lord stands ready to serve as the realm's sword on the frontier — in exchange for the autonomy their role demands."
 cc.march.charter.1.a: "So let it be chartered."
 cc.march.charter.1.a.tt: "Grants the march lord elevated noble estate satisfaction."

 # ============================================================
 # Subject Lobbying Events (cc.201-203)
 # ============================================================

 cc.company.lobby.1.title: "The Chartered Company's Petition"
 cc.company.lobby.1.desc: "Agents of [company.GetName] have arrived at court with a formal petition: they want stronger protections for their trade routes, legal standing in contested ports, and a clear signal from the crown that their expansion is sanctioned. The other subjects are watching to see how we respond."
 cc.company.lobby.1.a: "Grant the trade protections they seek."
 cc.company.lobby.1.b: "Fund an expansion of their operations directly. (−15× income)"
 cc.company.lobby.1.c: "Decline the petition. The crown does not renegotiate charters on demand."

 cc.march.lobby.1.title: "The March Lord's Demands"
 cc.march.lobby.1.desc: "[march_lord.GetName] has sent an envoy with a plain message: the march has identified a weakness on the frontier with [expansion_target.GetName], and the march lord intends to act on it. They are asking — formally, this time — for the crown's blessing."
 cc.march.lobby.1.a: "Grant the authorization — let them expand."
 cc.march.lobby.1.b: "Subsidize border fortifications instead — expansion without war. (−15× income)"
 cc.march.lobby.1.c: "Deny the request — the crown chooses its wars."

 cc.subject.rivalry.1.title: "A Rivalry Among Subjects"
 cc.subject.rivalry.1.desc: "[company_rival.GetName] and [march_rival.GetName] are in dispute. The details differ depending on who you ask — competing claims over a trade route, a border skirmish, an insult at a conference. What is not in dispute is that both subjects now expect the crown to take a side."
 cc.subject.rivalry.1.a: "Side with [company_rival.GetName]."
 cc.subject.rivalry.1.b: "Side with [march_rival.GetName]."
 cc.subject.rivalry.1.c: "Mediate the dispute — compensate both sides. (−25× income)"

 # ============================================================
 # Shadow Network Events (cc.140–cc.143)
 # ============================================================

 cc.shadow.intel.1.title: "Intelligence from the Shadows"
 cc.shadow.intel.1.desc: "[shadow_agent.GetName] has delivered an encrypted report. Our agents within [intel_target.GetName] have identified something actionable — a weakness, an opening, a secret held loosely. How we use this advantage is ours to decide."
 cc.shadow.intel.1.a: "Leverage it diplomatically — press [intel_target.GetName]."
 cc.shadow.intel.1.b: "Share the intelligence with an ally."
 cc.shadow.intel.1.c: "Reward the network's diligence. (−2× income)"

 cc.shadow.conflict.1.title: "Shadow States in Conflict"
 cc.shadow.conflict.1.desc: "Two of our covert networks have stumbled into each other. [shadow_a.GetName] and [shadow_b.GetName] are competing over the same contacts, the same routes, the same unseen corners of the world. Without intervention, the friction will only grow."
 cc.shadow.conflict.1.a: "Arbitrate — separate their spheres. (−4× income)"
 cc.shadow.conflict.1.b: "Let the strong dominate."
 cc.shadow.conflict.1.c: "We have leverage, extort the weaker oner."
 cc.shadow.conflict.1.d: "Use the conflict to extract from the both of them."

 cc.shadow.legit.1.title: "A Shadow State Seeks Legitimacy"
 cc.shadow.legit.1.desc: "[petitioner.GetName] has been operating in the shadows long enough. Their agents at court speak of formal recognition, of treaties stated plainly rather than implied, of a place at the table rather than below it. The appeal carries weight. The decision is ours."
 cc.shadow.legit.1.a: "Elevate them to a formal puppet arrangement."
 cc.shadow.legit.1.b: "Reward their loyalty — without formal recognition. (−6× income)"
 cc.shadow.legit.1.c: "Rebuff the petition. Secrecy is their purpose."
 cc.shadow.legit.1.d: "Draft a framework of recognized autonomy. [our_statesman.GetName] can manage this."

 cc.shadow.dark.1.title: "The Network Goes Silent"
 cc.shadow.dark.1.desc: "The reports from [dark_agent.GetName] have stopped. No messages, no coded correspondence, no whispered confirmation that the network is still operating. Our shadow court bureau can no longer confirm whether our agents are loyal, compromised, or simply waiting."
 cc.shadow.dark.1.a: "Send agents to re-establish contact. (−3× income)"
 cc.shadow.dark.1.b: "Wait. The network will resurface — or it won't."

 # ============================================================
 # Client State / Puppet State Events (cc.150–cc.152)
 # ============================================================

 cc.client.1.title: "The Client State Flexes Its Autonomy"
 cc.client.1.desc: "[client.GetName] has begun acting independently in the ongoing dispute with [dispute_neighbor.GetName] — making commitments, sending signals, and positioning itself in ways that suggest it no longer considers itself bound by our foreign policy. Whether this is ambition or negligence, it demands a response."
 cc.client.1.a: "Rein them in — this is not their war to start. (−3× income)"
 cc.client.1.b: "Let them act — their initiative may prove useful."

 cc.puppet.1.title: "The Puppet's Strings"
 cc.puppet.1.desc: "Envoys from [puppet.GetName] have arrived at court with a familiar request. They have served dutifully, fought when told, and paid what was owed. Now they wish to sit at the council — not to rule, but to be seen. The strings are still there; they merely want them to look like a robe."
 cc.puppet.1.a: "Grant symbolic recognition."
 cc.puppet.1.b: "Deny the request firmly."
 cc.puppet.1.c: "Buy their silence. (−5× income)"

 cc.client.puppet.1.title: "Client State and Puppet at Odds"
 cc.client.puppet.1.desc: "Word reaches us that [the_client.GetName] has opened back-channel negotiations with [the_puppet.GetName] — entirely without our knowledge or sanction. What they discussed is unclear, but the fact that they spoke at all without informing us is precisely the kind of drift we cannot allow to become habit."
 cc.client.puppet.1.a: "Forbid direct contact — all communications pass through us."
 cc.client.puppet.1.b: "Allow the contact — cooperation among our subjects is no threat."
 cc.client.puppet.1.c: "Mediate the contact formally. (−4× income)"

 # ============================================================
 # Elite Enclave / Palatinate Events (cc.160–cc.161)
 # ============================================================

 cc.enclave.1.title: "The Enclave Lord's Cultural Patronage"
 cc.enclave.1.desc: "Reports arrive of something remarkable emerging from [enclave.GetName]. An artist, a manuscript, a school of thought — the enclave's patronage has produced something that courts across the realm are already discussing. The question is whether to nurture it, or to bring it home."
 cc.enclave.1.a: "Fund the cultural project in place. (−4× income)"
 cc.enclave.1.b: "Absorb the talent into the capital."

 cc.palatinate.1.title: "The Palatinate Demands Recognition"
 cc.palatinate.1.desc: "[palatinate_lord.GetName] has forwarded a formal petition to the crown: a request for expanded noble privileges, to be granted in perpetuity, with the full ceremony appropriate to their standing. The palatinate has been loyal. The question is whether that loyalty has a price, and who pays it."
 cc.palatinate.1.a: "Grant the expanded privileges."
 cc.palatinate.1.b: "Refuse — the current arrangement is sufficient."
 cc.palatinate.1.c: "Negotiate a middle path. (−3× income)"

 # ============================================================
 # Associated Republic Events (cc.170–cc.171)
 # ============================================================

 cc.republic.1.title: "The Republic's Scholarly Exchange"
 cc.republic.1.desc: "Delegates from [republic.GetName] have proposed a formal exchange program: their scholars to our academies, our ministers to their councils, and a steady flow of printed works between both courts. They frame it as mutual enrichment. It may also be something more."
 cc.republic.1.a: "Fund the program formally. (−5× income)"
 cc.republic.1.b: "Absorb a republic scholar into our cabinet."
 cc.republic.1.c: "Decline the proposal."

 cc.republic.2.title: "Republican Dissent"
 cc.republic.2.desc: "Correspondence from [republic.GetName] describes a growing unease among the burgher class. Our policies — on trade, on taxation, on the treatment of merchant interests — have generated friction that the republic's council can no longer quietly absorb. They are asking us to adjust. Their tone suggests they expect us to refuse."
 cc.republic.2.a: "Make concessions — adjust the policies. (−4× income)"
 cc.republic.2.b: "Ignore the dissent — republican comfort is not our mandate."

 # ============================================================
 # Crown Dependency / Protectorate Events (cc.180–cc.181)
 # ============================================================

 cc.crowndep.1.title: "The Crown Dependency Seeks Favor"
 cc.crowndep.1.desc: "[dependency.GetName] has invoked the bond of the royal connection — formally, through proper channels, with all the correct courtesies. They are asking for support in an ongoing matter and have made it clear they expect the crown to remember that loyalty flows both ways."
 cc.crowndep.1.a: "Support their request — the bond demands it."
 cc.crowndep.1.b: "Send gold — practical aid over ceremony. (−4× income)"
 cc.crowndep.1.c: "Decline — the crown cannot support every petition."

 cc.protectorate.1.title: "Protectorate Growing Pains"
 cc.protectorate.1.desc: "[ward.GetName] is struggling. The reports describe strained finances, internal tensions, and the quiet creep of instability that unchecked becomes crisis. They have asked for support — not loudly, not dramatically, but the request is plain. Whether we provide it, and how, will shape what this protectorate becomes."
 cc.protectorate.1.a: "Provide stabilizing support — relieve their burdens."
 cc.protectorate.1.b: "Send gold to shore up their finances. (−3× income)"
 cc.protectorate.1.c: "Convert them to a client state — formalize our commitment."
