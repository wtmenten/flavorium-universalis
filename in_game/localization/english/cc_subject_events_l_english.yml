l_english:
 # ============================================================
 # Provincial Governorate Events
 # ============================================================

 cc.gov.1.title: "The Governor's Ambitions"
 cc.gov.1.desc: "Reports from [scope:governor.GetName] speak of a restless court — promises made to local officials, expectations raised, and a governing apparatus that begins to imagine itself rather more independent than we had intended."
 cc.gov.1.a: "Pay off the governor's court. (−100 gold)"
 cc.gov.1.b: "Suppress the ambitions firmly."
 cc.gov.1.c: "Ignore it for now."

 cc.gov.2.title: "The Governor Eyes the Neighbors"
 cc.gov.2.desc: "[scope:governor.GetName] has sent a memorandum pointing out the military weakness of [scope:target_neighbor.GetName] along our border. The governor makes the suggestion plainly: here is an opportunity."
 cc.gov.2.a: "Sanction a limited expansion."
 cc.gov.2.b: "Forbid any such adventurism."

 # ============================================================
 # Tax Farm Events
 # ============================================================

 cc.tax.1.title: "The Tax Farm Revolt"
 cc.tax.1.desc: "Word reaches us from [scope:tax_lord.GetName]: the collectors have pushed too hard, and the locals have pushed back. There is unrest in the streets and fire in the warehouses. Something must be done."
 cc.tax.1.a: "Ease the extraction — grant some relief. (−75 gold)"
 cc.tax.1.b: "Hold firm. Order will be restored."

 cc.tax.2.title: "Tax Collectors and the Neighbors"
 cc.tax.2.desc: "The neighbors of [scope:tax_lord.GetName] have lodged a formal complaint. Our tax collectors, they claim, have been operating across the border — seizing goods, questioning merchants, and treating foreign territory as their own."
 cc.tax.2.a: "Compensate the neighbors and rein in the collectors. (−100 gold)"
 cc.tax.2.b: "The collectors were within their rights."

 # ============================================================
 # Military March Events
 # ============================================================

 cc.march.1.title: "The March Lord's Raid"
 cc.march.1.desc: "Our march lord [scope:march_lord.GetName] has launched a raid against [scope:raided_neighbor.GetName] — opportunistic, profitable, and entirely without our authorization. A full report has been delivered. Now we must decide how to respond."
 cc.march.1.a: "Sanction the raid. Let them keep the spoils. (+50 gold, +prestige)"
 cc.march.1.b: "Restrain the march lord. This is not permitted."

 cc.march.2.title: "March Lord Independence Bid"
 cc.march.2.desc: "With the nobility growing restless, [scope:march_lord.GetName] has chosen this moment to test our resolve. The march lord's agents are in the capital, speaking of grievances, old debts, and the independence their ancestors once enjoyed."
 cc.march.2.a: "Pay them off — grant gold and noble concessions. (−200 gold)"
 cc.march.2.b: "Convert the march to a protectorate."

 cc.march.3.title: "March Lord Threatens the Neighbors"
 cc.march.3.desc: "[scope:march_lord.GetName] has assembled troops on the border with [scope:threatened_neighbor.GetName] and is making demands we never authorized. The neighbor looks to us for guidance — or restraint."
 cc.march.3.a: "Back the march lord's aggression."
 cc.march.3.b: "Denounce the march lord's conduct."
 cc.march.3.c: "Mediate the dispute. (−100 gold)"

 cc.march.charter.1.title: "A Military March Established"
 cc.march.charter.1.desc: "By the privilege of our nobles, a military march has been formally chartered. Its lord stands ready to serve as the realm's sword on the frontier — in exchange for the autonomy their role demands."
 cc.march.charter.1.a: "So let it be chartered."
 cc.march.charter.1.a.tt: "Grants the march lord elevated noble estate satisfaction."
