l_english:
 ########################################
 # cc_hyw.1 — The Auld Alliance
 ########################################
 cc_hyw.1.title: "The Auld Alliance"
 cc_hyw.1.desc: "With England massing forces and pressing its claim upon the French throne, our traditional allies in Scotland watch anxiously from across the Channel. Should France formalize its commitment to Scotland's independence, we bind England's northern flank — but risk drawing royal ire from London."
 cc_hyw.1.a: "Guarantee Scotland's independence."
 cc_hyw.1.b: "Promise informal support, without formal commitment."
 cc_hyw.1.c: "France fights its own battles. Scotland must fend for itself."

 ########################################
 # cc_hyw.10 — Victory Over England
 ########################################
 cc_hyw.10.title: "Victory Over England"
 cc_hyw.10.desc: "The English have been driven back. Our armies have proved their mettle, and the fleur-de-lis flies high. How shall we use this moment of triumph?"
 cc_hyw.10.a: "Let the kingdom rejoice. Renew our bond with Scotland."
 cc_hyw.10.b: "Press our advantage. England's subjects in France may be swayed."

 ########################################
 # cc_hyw.11 — Defeat Darkens the Kingdom
 ########################################
 cc_hyw.11.title: "Defeat Darkens the Kingdom"
 cc_hyw.11.desc: "The war has not gone as hoped. Our armies have been turned back, and the nobility grows restless. The long shadow of defeat falls across the realm."
 cc_hyw.11.a: "Regroup and endure. France has weathered worse."
 cc_hyw.11.b: "Demand sacrifice from the nobles. They will provide the levies we need — at a price."

 ########################################
 # cc_hyw.12 — War Breaks Out in the West
 ########################################
 cc_hyw.12.title: "War Breaks Out in the West"
 cc_hyw.12.desc: "Word arrives that [GetCountryName(scope:actor)] has declared war upon [GetCountryName(scope:recipient)]. The great powers of western Christendom are once again at each other's throats. How shall we respond?"
 cc_hyw.12.a: "Offer to mediate between the parties."
 cc_hyw.12.b: "Express our support for [GetCountryName(scope:actor)]."
 cc_hyw.12.c: "Stand behind [GetCountryName(scope:recipient)]."
 cc_hyw.12.d: "This is none of our concern."

 ########################################
 # cc_hyw.13 — Victory in the West
 ########################################
 cc_hyw.13.title: "Victory in the West"
 cc_hyw.13.desc: "Our armies have prevailed. Another enemy has been turned back from French soil. The kingdom grows stronger, and the nobility celebrates in the halls of Paris."
 cc_hyw.13.a: "Let the nobles feast. France is victorious."
 cc_hyw.13.b: "Press the advantage before our enemy can recover."

 ########################################
 # cc_hyw.20 — Our Suzerain Falters
 ########################################
 cc_hyw.20.title: "Our Suzerain Falters"
 cc_hyw.20.desc: "France has suffered defeat, and Paris seems far away. The nobility murmurs. Across the water, the English make promises and extend warm greetings. The time may have come to reconsider where our true interests lie."
 cc_hyw.20.a: "Reach out to England for support."
 cc_hyw.20.b: "Demand greater autonomy from the French crown."
 cc_hyw.20.c: "Remain loyal. Our fortunes are bound to France."

 ########################################
 # cc_hyw.21 — A Vassal Reaches Toward England
 ########################################
 cc_hyw.21.title: "A Vassal Reaches Toward England"
 cc_hyw.21.desc: "[scope:wavering_subject.GetName] has been in contact with the English — seeking assurances, perhaps, or something more. The crown cannot afford to appear weak. How do we respond to this act of defiance?"
 cc_hyw.21.a: "Punish the disloyalty. The crown's authority will not be questioned."
 cc_hyw.21.b: "Appease them with gold. Loyalty can be purchased."
 cc_hyw.21.c: "Let them go. We cannot afford this distraction now."

 ########################################
 # cc_hyw.22 — Our Suzerain England Falters
 ########################################
 cc_hyw.22.title: "England Has Been Defeated"
 cc_hyw.22.desc: "England's armies have been driven back, and the king struggles to maintain his hold over his continental territories. The French are making overtures. Perhaps it is time to reconsider our position."
 cc_hyw.22.a: "Seek French protection."
 cc_hyw.22.b: "Demand more autonomy from the English crown."
 cc_hyw.22.c: "Hold firm. England will recover."

 ########################################
 # cc_hyw.23 — An English Vassal Demands Concessions
 ########################################
 cc_hyw.23.title: "A Vassal Demands Concessions"
 cc_hyw.23.desc: "[scope:eng_wavering_subject.GetName] has grown bold in the wake of our defeat. They demand concessions, and the whisper of France is in the air. England cannot afford to appear weak before its continental subjects."
 cc_hyw.23.a: "Assert English authority. No concessions will be made."
 cc_hyw.23.b: "Pay them off. A loyal vassal is worth the coin."
 cc_hyw.23.c: "Release them. They are more trouble than they are worth."

 ########################################
 # cc_hyw.30 — The Lowlands Question
 ########################################
 cc_hyw.30.title: "The Lowlands Question"
 cc_hyw.30.desc: "[scope:lowlands_subject.GetName] sends envoys to [GetName] bearing a firm demand: the Netherlandish provinces secured in our recent victory belong to them by right of proximity, culture, and long interest. To deny their claim risks the loyalty of a vital vassal — but to grant it surrenders a rich foothold in the north."
 cc_hyw.30.a: "Grant [scope:lowlands_subject.GetName] the Lowlands provinces."
 cc_hyw.30.b: "Refuse. Let them seek another master."
 cc_hyw.30.c: "Deny the claim. They are bound to us — they dare not leave."

 ########################################
 # cc_hyw.31 — A Duchy Without a Lord
 ########################################
 cc_hyw.31.title: "A Duchy Without a Lord"
 cc_hyw.31.desc: "Our armies have secured lands in the Low Countries, yet no lord governs them in our name. The Netherlandish burghers look warily upon foreign rule. We could establish a loyal vassal duchy here and win goodwill in the region — or hold these rich provinces for the crown and accept the unrest that follows."
 cc_hyw.31.a: "Establish a Dutch vassal duchy to govern these lands."
 cc_hyw.31.b: "These lands belong to the crown. We shall rule them directly."

 ########################################
 # Bias display names
 ########################################
 cc_hyw_lowlands_land_refused: "Lowlands Claim Denied"
 cc_hyw_lowlands_hre_displeasure: "Displeasure at Lowlands Policy"
 cc_hyw_dutch_nations_anger: "Anger at Refused Dutch Vassal"

 ########################################
 # Country Interaction: Replace the Appanage Ruler
 ########################################
 cc_hyw_replace_appanage_ruler: "Replace the Appanage Ruler"
 cc_hyw_replace_appanage_ruler_desc: "Assert royal authority by forcing a change of ruler upon a disloyal appanage. The intervention will reduce the appanage's liberty desire significantly, but will unsettle the French nobility and spread restlessness among the other appanages."
 cc_hyw_replace_appanage_ruler_trigger_desc: "The French crown reasserts its authority over [scope:recipient.GetName], installing a more loyal house at the head of the appanage."
