 # ============================================================
 # PROTECTORATE / HOLY PROTECTORATE EVOLUTION EVENTS (cc.220–cc.226)
 # ============================================================

 # cc.220 — A Ward No Longer
 cc.ward_no_longer.title: "A Ward No Longer"
 cc.ward_no_longer.desc.holy: "[ward.GetName] has long stood under the mantle of our holy protection — a ward of the faith, guarded and guided through decades of shared purpose. But the world has changed, and so has our bond. Their envoy arrives not with need, but with quiet confidence.\n\n'We are grateful for all you have given,' they say, 'but we are ready to stand beside you rather than beneath you.'"
 cc.ward_no_longer.desc.prot: "[ward.GetName] has long relied on our informal protection — a comfortable arrangement that served both parties through calmer times. But the years have passed, and something has shifted. Their envoy arrives not as a suppliant, but as an equal.\n\n'The arrangement has served us well,' they say, 'but perhaps it is time to acknowledge what we have truly become.'"
 cc.ward_no_longer.a: "Welcome the transition. They have earned it."
 cc.ward_no_longer.a_cruel: "Absorb them by decree. They serve us, not the reverse."
 cc.ward_no_longer.a_zealot: "Fulfill the sacred obligation. The holy charge is relinquished."
 cc.ward_no_longer.a_master: "A masterful transition — our minister ensures the ceremony is exceptional."
 cc.ward_no_longer.a_integration: "An integrated future — our minister builds the framework for a lasting partnership."
 cc.ward_no_longer.b: "The time is not yet right. Let the relationship deepen further."
 cc.ward_no_longer.c: "Decline. The current arrangement still serves us."
 cc.ward_no_longer.c_demand_release: "Accept the demand. Release them."
 cc.ward_no_longer.c_demand_refuse: "Refuse absolutely. We will not be dictated to."
 cc.ward_no_longer.d_honor: "Release them with full honors. Let history remember this well."
 cc.ward_no_longer.d_embarrass: "Release them. The arrangement is over."

 # cc.221 — An Emboldened Ward
 cc.emboldened_ward.title: "An Emboldened Ward"
 cc.emboldened_ward.desc: "News arrives that [ward.GetName] has overstepped. Their officials have engaged in a hostile exchange with [rival.GetName] — accusations, demands, provocations that have left the neighbor's court fuming.\n\nThe matter sits in our lap. [rival.GetName] will not forget this. How we respond will define our reputation and the nature of our protection."
 cc.emboldened_ward.a: "Dispatch envoys. We will smooth this over discreetly."
 cc.emboldened_ward.a_master: "A masterful mediation — our minister turns the incident into a demonstration of our calm authority."
 cc.emboldened_ward.a_peace: "A quiet resolution — our counselor finds common ground before the matter escalates."
 cc.emboldened_ward.b: "Stand firm. We back our ward fully."
 cc.emboldened_ward.c: "Step back. This is not our fight."

 # cc.222 — The Rival Makes Their Move
 cc.rival_moves.title: "The Rival Makes Their Move"
 cc.rival_moves.desc: "[rival.GetName] has lost patience. Rather than accept the slight, they have declared war on [ward.GetName]. Our ward is under attack, and the world is watching.\n\nWe backed them. We must decide what that backing is truly worth."
 cc.rival_moves.b1: "We fight. Declare war on [rival.GetName] in defense of our ward."
 cc.rival_moves.b1_force: "Show of force. Our army will make an example of this aggression."
 cc.rival_moves.b1_sacred: "Sacred duty. We join as defenders of the faith."
 cc.rival_moves.b2: "We cannot commit to this war. Abandon the protectorate."

 # cc.223 — Ward Abandoned to Their Fate
 cc.ward_abandoned.title: "Ward Abandoned to Their Fate"
 cc.ward_abandoned.desc: "[rival.GetName] has declared war on [ward.GetName]. We stepped back, and the world has noted it. Our protectorate faces this alone.\n\nWord will spread."
 cc.ward_abandoned.a: "A difficult day. Let us hope the consequences are limited."

 # cc.224 — The Ward's Own Ambitions
 cc.ward_ambitions.title: "The Ward's Own Ambitions"
 cc.ward_ambitions.desc: "[ward.GetName] has grown into a significant power. Their domain has expanded, their treasury is full, and their people have developed a pride that the old informal arrangement no longer quite fits.\n\nTheir envoy arrives — not with requests, but with demands. They want a defined relationship. On their terms."
 cc.ward_ambitions.a: "Grant them client state status. Recognize their growth."
 cc.ward_ambitions.b: "Offer vassal status instead. They will have definition, but on our terms."
 cc.ward_ambitions.b_minister: "A subtle arrangement — our minister ensures they see the tighter bond as reward."
 cc.ward_ambitions.c: "Deny the request. They are our ward, and that is enough."
 cc.ward_ambitions.c_war: "They have been denied too many times. Now they take their freedom by force."

 # cc.225 — The Faith Grows Cold
 cc.faith_cold.title: "The Faith Grows Cold"
 cc.faith_cold.desc: "A letter arrives from [ward.GetName]. The tone is formal, but the message is unmistakable — the spiritual bond between us has grown thin. Our neglect of our religious duties has not gone unnoticed.\n\n'We came to you in faith,' the letter reads. 'We ask now to be released, to find our own path.'"
 cc.faith_cold.a: "Release them. Their faith deserves better stewardship than we have given."
 cc.faith_cold.b: "Renew our commitment. We will not let the bond wither."
 cc.faith_cold.c: "Refuse. The arrangement continues."
 cc.faith_cold.c_zealot: "Sacred duty cannot be abandoned. We hold firm."
 cc.faith_cold.e: "A diplomatic resolution — our minister finds terms that satisfy without requiring sacrifice."
 cc.faith_cold.c_war: "They have been refused too many times. The bond breaks in fire."

 # cc.226 — Patron of the Faith
 cc.patron_faith.title: "Patron of the Faith"
 cc.patron_faith.desc: "Word has spread through the courts of Christendom and beyond — our stewardship of [ward_a.GetName] and [ward_b.GetName] has not gone unnoticed. To hold not one but two holy wards, to maintain the faith of protected peoples through the turmoil of this age, is something that speaks of purpose and power.\n\nThey are calling us Patron of the Faith."
 cc.patron_faith.a: "Embrace the title. We are what they say we are."
 cc.patron_faith.a_zealot: "Champion of the Faith. We are more than a patron — we are its sword."
 cc.patron_faith.b: "Remain humble. The work matters more than the title."
 cc.patron_faith.c: "Use the recognition wisely. Prestige has its own currency."

