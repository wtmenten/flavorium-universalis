 # NEW MODIFIER NAMES
 # ============================================================
 cc_academy_exercises: "Academy Military Exercises"
 cc_academy_exercises_desc: "A round of rigorous military exercises funded by the crown has sharpened the discipline and morale of our fighting forces."

 cc_court_intrigue_scandal: "Court Intrigue Scandal"
 cc_court_intrigue_scandal_desc: "An investigation into whispers at the academy went badly — accusations of impropriety have damaged the crown's reputation among the noble estates."

 cc_enclave_court_favour: "Noble Court Favour"
 cc_enclave_court_favour_desc: "The granting of court positions to the noble enclave's leading families has satisfied their ambitions while drawing them closer to the orbit of the crown."

 cc_palatinate_tournament: "Palatinate Tournament"
 cc_palatinate_tournament_desc: "A magnificent tournament held under the patronage of the count palatine and the crown has boosted dynastic prestige and cultural influence across the realm."

 cc_holy_protectorate_defense: "Holy Defense"
 cc_holy_protectorate_defense_desc: "Our forces' defense of the holy protectorate against religious pressure has reinvigorated our soldiers' morale and secured the gratitude of our coreligionists."

