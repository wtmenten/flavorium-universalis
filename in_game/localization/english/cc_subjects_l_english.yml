 cc_papal_patron_recognition: "Papal Endorsement"
 cc_papal_patron_recognition_desc: "The Holy Father has formally recognized this ruler as a Patron of the Faith — a prestigious acknowledgment that carries weight in Catholic courts."

 cc_papal_mediation_called: "Papal Favor Spent"
 cc_papal_mediation_called_desc: "We called upon Rome to mediate a crisis with our holy ward. The Pope is pleased to help, but such goodwill is not infinite."

