l_english:


 junior_partner: "Junior Partner"
 junior_partner_desc: "A $junior_partner$ retains its own ruler and conducts independent foreign policy, yet acknowledges the preeminence of its overlord. Both realms benefit from faster spread of institutions and mutual legitimacy reinforcement. Creating a $junior_partner$ requires the $royal_union_network_advance$ advance and an existing fiefdom subject to upgrade."
 junior_partner_tt: "Cannot upgrade yet — the current subject relationship must settle before a new arrangement can be offered."

 lesser_partner: "Lesser Partner"
 lesser_partner_desc: "A $lesser_partner$ is the maturation of a $junior_partner$ after fifty years of shared dynasty. The realm's independent foreign policy is curtailed, but economic integration deepens — tribute rises considerably while both courts grow more stable and legitimate."
 lesser_partner_upgrade_tt: "Cannot upgrade yet — the union bond requires fifty years to mature into a Lesser Partnership."

 shadow_state: "Shadow State"
 shadow_state_desc: "A $shadow_state$ is formally independent, bound only by secret treaty and discreet arrangement. The overlord exercises influence without annexation, gaining power projection while the subject enjoys stability and legitimacy. This relationship can only be established through treaty with an existing independent nation. Requires the $shadow_diplomacy_advance$ advance."

 cc_force_shadow_state: "Demand Shadow Suzerainty"
 cc_force_shadow_state_entry: "Demand Shadow Suzerainty"
 cc_force_shadow_state_entry_short: "Demand Shadow Suzerainty"
 cc_force_shadow_state_desc: "Compel the defeated nation to accept a covert suzerainty — acknowledging your dominance through secret treaty rather than public subjugation. The relationship will project your power without the full antagonism of outright conquest. Requires the Shadow Diplomacy advance."

 client_state: "Client State"
 client_state_desc: "A $client_state$ is a nation brought into the orbit of a stronger power through treaty or released provinces. It retains its own foreign policy but pays modest tribute and may eventually be elevated to a $puppet_state$. Requires the $client_state_advance$ advance."

 puppet_state: "Puppet State"
 puppet_state_desc: "A $puppet_state$ is a formerly independent nation brought under full administrative supervision of its overlord. Its foreign policy is controlled, treasury directed, and armies called upon at will. Both $shadow_state$ and $client_state$ subjects may be elevated to this status after fifty years. Requires the $puppet_state_advance$ advance."
 puppet_state_upgrade_tt: "Cannot upgrade yet — the current subjugation is too recent to permit further consolidation of control."

 elite_enclave: "Elite Enclave"
 elite_enclave_desc: "An $elite_enclave$ is a culturally kindred domain granted self-governance in recognition of its noble heritage. It does not participate in wars, yet confers remarkable cultural prestige — boosting cultural influence, cultural tradition, and noble estate satisfaction. Limited to one subject of this type. Requires the $noble_patronage_advance$ advance and the Noble Enclave Rights estate privilege."

 palatinate: "Palatinate"
 palatinate_desc: "A $palatinate$ is an $elite_enclave$ that has grown into a semi-sovereign power — the count palatine may now declare war, call levies, and join campaigns. The cultural and prestige benefits to the overlord are enormous. Can only be created by upgrading an $elite_enclave$ after twenty years. Requires the $palatinate_advance$ advance."
 palatinate_upgrade_tt: "Cannot upgrade yet — the enclave must mature for twenty years before elevation to a Palatinate."

 associated_republic: "Associated Republic"
 associated_republic_desc: "An $associated_republic$ is an independent republican state under formal patronage. Both parties maintain political independence, but the subject defers to its patron in defensive wars, and both benefit from a scholarly exchange that speeds research. The subject must have a republic government type. Requires the $republican_patronage_advance$ advance."

 chartered_company: "Chartered Company"
 chartered_company_desc: "A $chartered_company$ is a royally chartered trading corporation operating in distant lands on behalf of its overlord. It pays high tribute in gold, manpower, and sailors, while boosting trade center power and research speed. Subjects must be on a different sub-continent from the overlord's capital. Requires the $chartered_company_advance$ advance, the Colonial Charter System reform, and an active Royal Trading Bureau bureaucracy."

 artists_commune: "Artists' Commune"
 artists_commune_desc: "An $artists_commune$ is a self-governing community of painters, sculptors, and craftsmen whose works redound to their patron's glory. Contributing little gold, it yields spectacular dividends in cultural influence and research speed. Must share the overlord's culture group, limited to one province, and only one may exist. Requires the $artistic_patronage_advance$ advance."

 scientific_college: "Scientific College"
 scientific_college_desc: "A $scientific_college$ is a scholarly institution of a religiously governed polity, free to pursue learning on behalf of its patron. Its benefits — faster institution spread, reduced embrace costs, improved disease resistance — flow in both directions. The subject must be a theocracy, and only one may exist. Requires the $scholarly_orders_advance$ advance and the Scholarly Brotherhood clergy estate privilege."

 naval_administration: "Naval Administration"
 naval_administration_desc: "A $naval_administration$ is a port town granted semi-independence to manage the maritime logistics of its patron's fleet. It pays an unusually high proportion of its sailors alongside gold and manpower. Must share the overlord's culture group, and only one may exist. Requires the $naval_charter_advance$ advance and the Naval Charter burgher estate privilege."

 protectorate: "Protectorate"
 protectorate_desc: "A $protectorate$ is a weaker neighboring state under the protection of a stronger power without formal subjugation. It pays no tribute and fights its own wars, but acknowledges the patron's seniority. The overlord gains power projection and diplomatic reputation, and denies the territory to rivals. Requires the $protectorate_rights_advance$ advance."

 crown_dependency: "Crown Dependency"
 crown_dependency_desc: "A $crown_dependency$ is a realm bound to its overlord by ties of shared dynasty — the same ruler family governs both courts without a formal personal union. The dependency pays considerable tribute and joins its patron's wars, while both parties benefit from enhanced prestige and legitimacy. Requires the $dynastic_governance_advance$ advance and shared ruler family."

 holy_protectorate: "Holy Protectorate"
 holy_protectorate_desc: "A $holy_protectorate$ is a coreligionist state taken under the spiritual patronage of a larger power. It pays no gold tribute but furnishes the overlord with religious influence, power projection, and prestige. Both parties always join each other's defensive wars. Subject must share the overlord's religion group. Requires the $holy_patronage_advance$ advance."


 royal_union_network_advance: "Royal Union Network"
 royal_union_network_advance_desc: "Personal unions need not be passive inheritances. By cultivating a network of dynastic ties and shared institutions, the union can become a living instrument of policy. Unlocks the $junior_partner$ and $lesser_partner$ subject types."

 shadow_diplomacy_advance: "Shadow Diplomacy"
 shadow_diplomacy_advance_desc: "Not all influence announces itself. Through quiet treaty and discreet placement of trusted agents, a monarch can bind a neighboring state to their interests without a single army moving. Unlocks the $shadow_state$ subject type and the Shadow Network noble estate privilege."

 artistic_patronage_advance: "Artistic Patronage"
 artistic_patronage_advance_desc: "To commission great art is to leave one's mark on time itself. A ruler who opens the treasury to painters, poets, and architects accumulates cultural capital that outlasts any military campaign. Unlocks the $artists_commune$ subject type and the Patronage of the Arts noble estate privilege."

 noble_patronage_advance: "Noble Patronage"
 noble_patronage_advance_desc: "A wise ruler recognizes that the high nobility, given honored autonomy, will return loyalty rather than resentment. The formal recognition of noble enclaves transforms potential rivals into cultural champions. Unlocks the $elite_enclave$ subject type and the Noble Enclave Rights estate privilege."

 republican_patronage_advance: "Republican Patronage"
 republican_patronage_advance_desc: "Republics possess a practical genius that monarchies would do well to cultivate. Through formal patronage, a king may secure the intellectual output of a free republic without threatening its identity. Unlocks the $associated_republic$ subject type."

 dynastic_governance_advance: "Dynastic Governance"
 dynastic_governance_advance_desc: "The web of royal marriages binding European courts together need not remain ceremonial. With careful design, a shared dynasty can become a framework of genuine political coordination. Unlocks the $crown_dependency$ subject type."

 client_state_advance: "Client State Diplomacy"
 client_state_advance_desc: "By offering protection in exchange for tribute, a great power can extend its influence into neighboring territories without the expense of outright conquest. Client relationships are the lifeblood of hegemonic expansion. Unlocks the $client_state$ subject type."

 naval_charter_advance: "Naval Charter"
 naval_charter_advance_desc: "A great fleet requires not only ships but infrastructure: dry docks, provisioning networks, and merchant expertise. Granting a strategic port special administrative status ensures these needs are always met. Unlocks the $naval_administration$ subject type and the Naval Charter burgher estate privilege."

 protectorate_rights_advance: "Protectorate Rights"
 protectorate_rights_advance_desc: "The law of nations permits a stronger power to declare itself the protector of a weaker neighbor, extending a shield without requiring formal subjugation. Such arrangements are cheaper to establish than vassalage. Unlocks the $protectorate$ subject type."

 scholarly_orders_advance: "Scholarly Orders"
 scholarly_orders_advance_desc: "The great religious orders have long been the guardians of learning. By formalizing the relationship between crown and cloister, a ruler can harness the church's accumulated knowledge. Unlocks the $scientific_college$ subject type and the Scholarly Brotherhood clergy estate privilege."

 palatinate_advance: "Palatinate System"
 palatinate_advance_desc: "The most elevated noble enclaves may be recognized as palatinates — sovereign-within-sovereign territories whose counts wield near-regal authority. Such recognition deepens the cultural and military bond between palatinate and overlord. Unlocks the $palatinate$ upgrade for $elite_enclave$ subjects."

 holy_patronage_advance: "Holy Patronage"
 holy_patronage_advance_desc: "Faith is a bond stronger than treaty. A ruler who places themselves as the guardian of coreligionist neighbors secures not only allies but a stream of spiritual prestige that flows from every shared communion. Unlocks the $holy_protectorate$ subject type."

 puppet_state_advance: "Puppet State Administration"
 puppet_state_advance_desc: "Shadow influence must eventually give way to direct administration. With proper bureaucratic mechanisms, an overlord can transform a loosely bound client or shadow state into a puppet whose affairs are directed from the overlord's capital. Unlocks the $puppet_state$ upgrade for $shadow_state$ and $client_state$ subjects."

 chartered_company_advance: "Chartered Trading Companies"
 chartered_company_advance_desc: "The merchant classes have demonstrated an unparalleled capacity for organizing commerce at global scale. By issuing royal charters, a crown can direct this energy toward distant continents, securing tribute and trade. Unlocks the $chartered_company$ subject type, the Royal Trading Charter burgher estate privilege, and the Colonial Charter System reform."


 ep_noble_elite_enclave: "Noble Enclave Rights"
 ep_noble_elite_enclave_desc: "The crown formally recognizes the right of high nobility of kindred culture to govern enclaves as self-administering domains, converting noble resentment into cultural prestige for the dynasty."

 ep_noble_patronage_arts: "Patronage of the Arts"
 ep_noble_patronage_arts_desc: "The nobility takes a formal role as patrons of painters, sculptors, and poets, associating their prestige with the cultural flourishing of the realm."

 ep_noble_shadow_network: "Shadow Network"
 ep_noble_shadow_network_desc: "The high nobility establishes a clandestine web of informants and influence-brokers in neighboring states, projecting the realm's power through proxies rather than armies."

 ep_clergy_scholarly_college: "Scholarly Brotherhood"
 ep_clergy_scholarly_college_desc: "The clergy establishes a formal brotherhood dedicated to the preservation and advancement of learning, granting scholars of religious orders academic freedom in exchange for their intellectual output benefiting the realm."

 ep_burgher_naval_charter: "Naval Charter"
 ep_burgher_naval_charter_desc: "The merchant class takes on formal responsibility for the provisioning and administration of the realm's naval infrastructure, in exchange for special privileges over designated port cities."

 ep_burgher_royal_charter: "Royal Trading Charter"
 ep_burgher_royal_charter_desc: "The crown grants the merchant estates the right to organize royally chartered trading corporations, enabling commercial operations in distant lands under the protection of the crown's authority."


 cc_shadow_court_bureau: "Shadow Court"
 cc_shadow_court_bureau_desc: "A clandestine institution through which the realm's covert diplomatic interests are managed — agents placed in foreign courts, communications maintained with shadow states, and influence built away from the public record. The Shadow Court amplifies power projection and diplomatic reputation, but neglect breeds unrest among the noble estates."

 cc_royal_trading_bureau: "Royal Trading Bureau"
 cc_royal_trading_bureau_desc: "A formal government body overseeing the realm's chartered commercial enterprises abroad. The Bureau coordinates licensing, dispute resolution, and the flow of tributary goods to the crown. When well-maintained, it generates meaningful tax revenue and expands maritime capacity."

 cc_scholarly_concordat: "Scholarly Concordat"
 cc_scholarly_concordat_desc: "A formal agreement between crown and clergy establishing the conditions under which scholarly institutions may operate — research conducted, institutions embraced, and medical knowledge applied on behalf of the realm. Yields faster institutional growth and disease resistance when properly funded."

 cc_colonial_charter_reform: "Colonial Charter System"
 cc_colonial_charter_reform_desc: "The crown establishes a formal legal framework for issuing royal charters to commercial enterprises operating in distant lands, granting them military and commercial authority in exchange for tribute and loyalty. This reform enables the creation of Chartered Company subjects."

 cc_internalized_scholarship: "Internalized Scholarship"
 cc_internalized_scholarship_desc: "Rather than establishing an external college, the realm has directed its own clergy toward greater scholarly pursuits."

 cc_scholarly_exchange_modifier: "Scholarly Exchange"
 cc_scholarly_exchange_modifier_desc: "A formal exchange of knowledge between the realm and its Scientific College enriches both parties with advances in learning and medicine."

 cc_thriving_port_modifier: "Thriving Naval Port"
 cc_thriving_port_modifier_desc: "Investment in the Naval Administration's facilities has yielded expanded maritime infrastructure that boosts the realm's sailor capacity."

 cc_holy_league_modifier: "Holy League"
 cc_holy_league_modifier_desc: "The formal establishment of a Holy League between the realm and its coreligionist protectorate has generated a wave of religious enthusiasm and prestige."


 cc.shadow.1.title: "Whispers in the Court"
 cc.shadow.1.desc: "Rumors circulate among the high nobility of clandestine arrangements with neighboring courts. Our most trusted nobles speak of a network already half-formed — agents embedded in foreign councils, correspondence flowing through backchannels, influence extending where our armies cannot march.\n\n'Give it your blessing, my liege,' they urge, 'and we shall cast our shadow upon their domains.'"
 cc.shadow.1.a: "Formalize the shadow network."
 cc.shadow.1.b: "Decline. Such arrangements invite scandal."

 cc.shadow.2.title: "The Network Takes Shape"
 cc.shadow.2.desc: "The shadow network has proven its worth. Our nobles now propose formalizing the arrangement into a permanent institution — a Shadow Court that operates at the margins of official diplomacy.\n\nThe benefits would be considerable. The costs would be borne by others."
 cc.shadow.2.a: "Establish the Shadow Court Bureau."
 cc.shadow.2.b: "Leave the network informal — plausible deniability has its uses."

 cc.shadow.bureau.1.title: "A Puppet Offered"
 cc.shadow.bureau.1.desc: "Our Shadow Court has identified an opportunity. Through discreet pressure, engineered succession crises, and the quiet withdrawal of competing patrons, one of our shadow states has been made entirely dependent on our goodwill. The Bureau proposes formalizing this dependency.\n\nThe target will not resist. They have no one else to turn to."
 cc.shadow.bureau.1.a: "Formalize the puppet arrangement."
 cc.shadow.bureau.1.b: "Maintain the shadow relationship — discretion is still preferable."

 cc.clergy.college.1.title: "The Scholars Seek a Home"
 cc.clergy.college.1.desc: "Word has reached our court of a congregation of learned clergy — astronomers, physicians, natural philosophers — who have outgrown the institutions available to them. They seek a home where scholarship may flourish free from parish duties.\n\nOur eyes turn to a neighboring theocratic realm whose church libraries are among the finest on the continent."
 cc.clergy.college.1.a: "Negotiate the establishment of a scholarly college with our theocratic neighbor."
 cc.clergy.college.1.a.tt: "Enables creation of a Scientific College subject if a theocratic neighbor agrees."
 cc.clergy.college.1.b: "Encourage the scholars to remain within our own institutions."

 cc.clergy.college.2.title: "The Learned Brotherhood"
 cc.clergy.college.2.desc: "The scholarly college has established itself and its reputation is already growing. In recognition of the patronage that made it possible, the brothers have offered to share their discoveries with our court — a formal exchange that promises to accelerate our intellectual development considerably."
 cc.clergy.college.2.a: "Accept the scholarly exchange formally."
 cc.clergy.college.2.b: "Thank them for the offer but decline formal arrangements."

 cc.arts.1.title: "The Guild Masters Petition"
 cc.arts.1.desc: "The guild masters of our greatest city have presented themselves at court with an unusual petition. They speak of a district devoted entirely to the arts — freed from ordinary guild taxation, governed by their own council, and dedicated to the production of works that will bear our dynasty's name for centuries.\n\n'Grant us a charter,' their spokesman says, 'and we will make your name eternal.'"
 cc.arts.1.a: "Grant the charter. Let them have their commune."
 cc.arts.1.a.tt: "Enables creation of an Artists' Commune subject."
 cc.arts.1.b: "Refuse. Such arrangements set uncomfortable precedents."

 cc.arts.2.title: "A City of Culture"
 cc.arts.2.desc: "The Artists' Commune has established itself and the first works produced under its banner have generated considerable admiration. The guild masters propose an inaugural investment — funds to construct proper studios, workshops, and a library worthy of the enterprise.\n\n'The return will far exceed the outlay,' they promise."
 cc.arts.2.a: "Invest in the commune's facilities."
 cc.arts.2.b: "Let them develop at their own pace."

 cc.naval.1.title: "The Admiralty Petition"
 cc.naval.1.desc: "Our merchant estates have submitted a formal petition. They argue that the realm's growing naval ambitions require a dedicated port administration, and they have a candidate city in mind. In exchange for a charter of semi-independence, they pledge a steady flow of trained sailors to our fleet."
 cc.naval.1.a: "Grant the naval charter. Establish the Naval Administration."
 cc.naval.1.b: "Decline for now. The arrangement requires more consideration."

 cc.naval.2.title: "The Port Thrives"
 cc.naval.2.desc: "The Naval Administration has proven its worth. Ships are well-provisioned, crews are trained, and the flow of sailors to our fleet has been consistent. The administrators now propose an expansion — a new dry dock, expanded warehousing, improved training grounds.\n\n'The investment will repay itself within a decade,' the harbor-master insists."
 cc.naval.2.a: "Fund the expansion."
 cc.naval.2.b: "The current facilities are sufficient."

 cc.holy.1.title: "Coreligionists Seek Shelter"
 cc.holy.1.desc: "Word arrives by breathless messenger: a neighboring state of our own faith, weakened by internal strife and pressed by hostile neighbors, seeks our protection. Their clergy write in tones of desperation, invoking our shared faith and the duty of the strong to shield the weak.\n\nThe strategic advantages are not inconsiderable. Nor is the spiritual prestige."
 cc.holy.1.a: "Offer our protection. Take them as a Holy Protectorate."
 cc.holy.1.b: "We cannot commit to foreign entanglements at this time."

 cc.holy.2.title: "The Faith Protected"
 cc.holy.2.desc: "The Holy Protectorate has stabilized. Our coreligionist neighbor is safe, their clergy grateful, and word of our piety has spread to other courts of our faith. Our bishops speak of formalizing the relationship — publishing the league, so to speak, that all may know our commitment to the defense of the faithful."
 cc.holy.2.a: "Formalize the Holy League. Publish our commitment to the faith."
 cc.holy.2.b: "Keep the arrangement quiet. Discretion serves us better."

 cc.noble.enclave.1.title: "The Enclave Established"
 cc.noble.enclave.1.desc: "Word has gone out among the high nobility: a domain of shared culture and ancient heritage has been recognized as an official enclave under our protection, governed by its own council, its traditions preserved and its loyalty secure. The noble estates regard this as a sign of good faith from the crown."
 cc.noble.enclave.1.a: "A worthy recognition. Let the nobles govern their domain well."
 cc.noble.enclave.1.a.tt: "Enables creation of an Elite Enclave subject for a culturally kindred province."

 cc.burgher.charter.1.title: "The Royal Charter Sealed"
 cc.burgher.charter.1.desc: "The merchant estates have received the royal charter with celebration and ceremony. Agents are already being dispatched to distant continents, investment is flowing, and the first reports of distant trading posts are beginning to arrive at court. The burghers regard this as a new era of commercial partnership with the crown."
 cc.burgher.charter.1.a: "A profitable arrangement for all parties."
 cc.burgher.charter.1.a.tt: "Enables creation of Chartered Company subjects on distant sub-continents."

