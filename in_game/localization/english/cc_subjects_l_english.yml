 cc.ward_no_longer.a.tt_papal: "The Pope will note the dissolution of this sacred arrangement with disappointment."

 # ============================================================
 # cc.225 — The Faith Grows Cold (new Catholic option)
 # ============================================================
 cc.faith_cold.d_papal: "Seek Papal Mediation"
 cc.faith_cold.d_papal.tt: "The Holy Father sends a legate who renews the spiritual bond between us and our ward. We spend some goodwill in Rome, but the arrangement is preserved."

 # ============================================================
 # cc.226 — Patron of the Faith (new Catholic option)
 # ============================================================
 cc.patron_faith.a_papal: "Accept Papal Recognition"
 cc.patron_faith.a_papal.tt: "The Holy Father formally endorses our role as Patron of the Faith. The recognition carries weight with all Catholic powers. Our wards take comfort in Rome's blessing."

 # ============================================================
 # cc.227 — A Rift in the Sacred Bond
 # ============================================================
 cc.faith_rift.title: "A Rift in the Sacred Bond"
 cc.faith_rift.desc: "[ward.GetName] no longer shares our faith. The holy compact that defined our protectorate arrangement rests on a spiritual foundation that has crumbled. Whether it was we who turned from the old ways or they who sought a new path, the contradiction cannot be ignored indefinitely."

 cc.faith_rift.a: "Demand that [ward.GetName] return to the true faith"
 cc.faith_rift.a.tt: "We make clear that the arrangement requires shared faith. The ward will not take this lightly."
 cc.faith_rift.a_zealot: "The demands of faith permit no compromise"
 cc.faith_rift.a_zealot.tt: "A zealot brooks no spiritual deviation. We issue the ultimatum with the full weight of our conviction."
 cc.faith_rift.b: "Release [ward.GetName] — the holy compact has run its course"
 cc.faith_rift.b.tt: "Better to acknowledge the truth cleanly than to perpetuate a hollow arrangement."
 cc.faith_rift.c: "Maintain the arrangement despite the rift"
 cc.faith_rift.c.tt: "Political utility outweighs spiritual purity for now. The ward will not forget this contradiction."
 cc.faith_rift.c_master: "Negotiate a formal exception"
 cc.faith_rift.c_master.tt: "Our minister finds a face-saving arrangement. The ward accepts, for now, though the tension remains."
 cc.faith_rift.d_papal: "Place the matter before the Holy Father"
 cc.faith_rift.d_papal.tt: "We consult Rome rather than act unilaterally. The Pope is pleased to be involved and applies spiritual pressure on the ward to reconvert."

 # ============================================================
 # cc.228 — The Ward Seeks Their Own Path
 # ============================================================
 cc.faith_rift_escalate.title: "The Ward Seeks Their Own Path"
 cc.faith_rift_escalate.desc: "[ward.GetName] has long chafed under the reconversion ultimatum. With loyalty at its lowest ebb, they now openly demand independence — citing the broken spiritual covenant as grounds to dissolve the arrangement. The pretense of a holy compact can no longer be maintained."

 cc.faith_rift_escalate.a: "Grant [ward.GetName] their independence"
 cc.faith_rift_escalate.a.tt: "Accept the inevitable. Release them before they take it by force."
 cc.faith_rift_escalate.b: "We will not release what is ours"
 cc.faith_rift_escalate.b.tt: "Refuse absolutely. The ward declares independence and goes to war. If they are Catholic and we are not, Rome may well take their side."

