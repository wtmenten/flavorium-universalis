l_english:
 # === cc_bonds.150 — The Client Regime Holds ===
 cc_bonds.150.title: "The Client Regime Holds"
 cc_bonds.150.desc: "Client governments are the first thing an age like this removes, and [bond_subj.GetName] has not been removed. The men we installed are still in their offices, still signing our correspondence, and still, apparently, able to walk through their own capital. Whatever we did in the decades of quiet administration, it produced a regime with a constituency of its own rather than a garrison and a payroll."
 cc_bonds.150.desc.deep: "The government of [bond_subj.GetName] has survived a year that removed three of its neighbors, and it did so without asking us for troops. Its ministers went out and made the case for the arrangement in public, and enough people found the case persuasive. A client state that can defend itself politically is no longer really a client state. It is an ally that happens to owe us money."
 cc_bonds.150.a: "Change nothing. The arrangement is working."
 cc_bonds.150.b: "Put it on a formal footing. It no longer needs our garrison."

 # === cc_bonds.151 — The Client Regime Falls ===
 cc_bonds.151.title: "The Client Regime Falls"
 cc_bonds.151.desc: "The government of [bond_subj.GetName] has lost control of its own capital. Our ministers are reporting from a country house outside the city, which is a diplomatic way of saying they have left it. The regime we installed never acquired a constituency beyond the offices we paid for, and in a year that has made such things count, the shortfall has become the whole story."
 cc_bonds.151.desc.deep: "There is no longer a government in [bond_subj.GetName] that answers to us. The ministry has been dissolved by a crowd, our resident has been given safe conduct to the frontier, and the men now issuing proclamations are quoting the terms of our own client treaty as evidence of what was done to them. We are not being negotiated with. We are being used as an argument."
 cc_bonds.151.desc.scholar: "The men now governing [bond_subj.GetName] are the students of the scholar we had silenced. He did not live to see this, which several of the proclamations mention. Suppressing the argument decades ago did not settle it; it only guaranteed that when the argument finally won, it would win with our name attached to the wrong side of it."
 cc_bonds.151.a: "Prop it back up. Whatever that now costs."
 cc_bonds.151.b: "Install a new one. This time with a garrison behind it."
 cc_bonds.151.c: "Disown it. It was never worth the credibility."

 # === cc_bonds.152 — The Council Seat Proves Its Worth ===
 cc_bonds.152.title: "The Council Seat Proves Its Worth"
 cc_bonds.152.desc: "When we brought [bond_subj.GetName] onto the Imperial Council it was a gesture, and gestures are cheap. It has stopped being one. Their delegate has spent this session arguing our position to members who were wavering, on the grounds that it is now also their position. A seat at a table turns out to be a durable thing to have given someone."
 cc_bonds.152.desc.deep: "The delegate from [bond_subj.GetName] has done more this session than vote with us. He has held the council together through a month in which it could easily have dissolved, brokered between two members who would not speak to us directly, and framed the whole business as the council governing itself rather than the crown governing the council. Which is exactly what we wanted it to become, and did not entirely expect."
 cc_bonds.152.a: "Let the council carry the settlement. That is what it is for."
 cc_bonds.152.b: "Raise them to a full federal partner. They have earned the rest of it."

 # === cc_bonds.153 — The Council Seat Was Never Enough ===
 cc_bonds.153.title: "The Council Seat Was Never Enough"
 cc_bonds.153.desc: "The delegate from [bond_subj.GetName] has laid out, in a session we could not adjourn, exactly what the council seat is worth. He can speak, and he has spoken, and nothing has followed from any of it. He is not asking for more time on the floor. He is asking what the seat is for, and the honest answer is one we would rather not give in public."
 cc_bonds.153.desc.deep: "The delegation from [bond_subj.GetName] has withdrawn from the council and published its reasons. The document is calm and enumerates every motion they brought over forty years, with the vote and the outcome beside it. The pattern is not flattering. They gave the institution more good faith than we did, and they have finished doing so in front of every other member."
 cc_bonds.153.a: "Widen the seat into a real share of power."
 cc_bonds.153.b: "Remind them what the seat was: a courtesy, not a right."

 # === cc_bonds.154 — One Nation, Two Languages ===
 cc_bonds.154.title: "One Nation, Two Languages"
 cc_bonds.154.desc: "[bond_subj.GetName] came to us speaking another language and praying differently, and we never resolved that. In an age when identity is the argument everybody is having, the unresolved thing has turned out to be an asset. Their people are not being asked to choose between what they are and what we are, so they are not choosing. The revolutionaries elsewhere are finding this a difficult province to work in."
 cc_bonds.154.desc.deep: "The settlement in [bond_subj.GetName] has held so completely that it has begun to work in reverse. Their courts function in two languages and nobody remarks on it. Their gentry send sons to our academies and ours send sons back. When the revolutionary pamphlets arrived promising a nation for every people, the argument landed badly, because the question of whose nation this is was answered here two generations ago in a way that satisfied everyone."
 cc_bonds.154.desc.scholar: "The scholar we sponsored produced the thing that made this possible: a body of work in their language which treats the union as its own subject rather than as an imposition. Their schools teach it. Ours have started to. When the pamphlets arrived asking whether a people can belong to an empire without ceasing to be a people, [bond_subj.GetName] already had a library's worth of answer."
 cc_bonds.154.a: "Leave it as it stands. It works because nobody legislated it."
 cc_bonds.154.b: "Write it into law, and let the nobles complain."

 # === cc_bonds.155 — The Old Language Comes Back ===
 cc_bonds.155.title: "The Old Language Comes Back"
 cc_bonds.155.desc: "The assimilation statutes were enforced in [bond_subj.GetName] for as long as enforcement was possible, and this is the year it stopped being possible. The old language is back in the courts, the schools and the printing houses, and it has come back angry. What we suppressed did not disappear; it waited, and it acquired a grievance to travel with."
 cc_bonds.155.desc.deep: "[bond_subj.GetName] has repealed our statutes without consulting us, which is not a power it has. Signage, liturgy, court record and school curriculum have all reverted inside a season, and the speed of it says the apparatus for the reversal was assembled long ago and kept ready. The revolutionary age did not create this. It only removed the last reason to keep waiting."
 cc_bonds.155.desc.faith: "The old rites and the old language have returned to [bond_subj.GetName] together, which was always how they would return. The conversion we ordered was obeyed and never accepted, and the clergy who administered it are the ones now unmaking it, with the registers to prove they never believed in it either. Faith and language are one grievance here, and we created it in a single stroke."
 cc_bonds.155.desc.scholar: "The revival in [bond_subj.GetName] is being led from the press the suppressed scholar founded and we allowed to keep operating on the theory that it was harmless. It printed dictionaries and grammars for forty years. In an age that has made language a political question, forty years of quiet philology turns out to have been the most effective thing anyone in that province ever did."
 cc_bonds.155.a: "Repeal the statutes. They were never worth what they cost."
 cc_bonds.155.b: "Enforce them harder. The law is the law."

 # === Rebel name for cc_bonds_aor_spawn_sympathy_revolt ===
 cc_bond_sympathy_rebels: "Sympathisers of the Colonies"
