l_english:

 # ========================
 # SITUATION
 # ========================
 cc_invasion_mexico: "Invasion of Mexico"
 cc_invasion_mexico_desc: "Colonial powers from distant shores have reached the heartland of Mesoamerica. The great empires of the Aztec, Maya, and their kin face an existential threat. Will native peoples forge unity against the invaders, or will the age of conquest claim these ancient civilizations forever?"

 # ========================
 # GAME RULE
 # ========================
 cc_invasion_mexico_rule: "Invasion of Mexico"
 cc_invasion_mexico_rule_desc: "Controls whether the Invasion of Mexico situation can fire, adding flavor events, custom casus belli, and situation-panel actions for both colonial and native powers."
 cc_invasion_mexico_on: "Enabled (Historical)"
 cc_invasion_mexico_on_desc: "The Invasion of Mexico situation will fire when the trigger conditions are met."
 cc_invasion_mexico_off: "Disabled"
 cc_invasion_mexico_off_desc: "The Invasion of Mexico situation will never fire."

 # ========================
 # HINT
 # ========================
 hint_cc_invasion_mexico: "The Invasion of Mexico situation represents the Spanish conquest of Mesoamerica. Colonial powers can gain special casus belli against native nations and commission expeditions from the situation panel. Native powers can unite into the Mesoamerican Confederation for mutual defense, or offer tribute to forestall aggression. The situation ends when all independent native powers are subjugated, or when the year 1600 is reached."

 # ========================
 # EVENT 1 — Announcement
 # ========================
 cc_invasion_mexico.1.title: "The Age of Conquest Begins"
 cc_invasion_mexico.1.desc_native: "Word spreads swiftly through our lands: foreign ships have landed and strange soldiers march inland. These invaders come not as traders but as conquerors, bearing steel and fire. How we respond now may determine the fate of our civilization."
 cc_invasion_mexico.1.desc_colonial: "Our explorers have reached the great mainland empires of the New World. Cities of gold and silver lie within reach. The native peoples are numerous and warlike, but they are divided — and we are determined. The age of conquest has begun."
 cc_invasion_mexico.1.a: "We shall meet this moment."

 # ========================
 # EVENTS 2–4 — Federation Requests
 # ========================
 cc_invasion_mexico.2.title: "The Empire at the Crossroads"
 cc_invasion_mexico.2.desc: "Strange men with thunder-weapons have made landfall — and already speak of claiming our lands as their own. Emissaries arrive proposing a grand confederation of native peoples. But our lords question whether this empire should bow to any alliance, or whether our own walls and warriors are sufficient to meet this threat."
 cc_invasion_mexico.2.a: "We shall forge and lead this alliance."
 cc_invasion_mexico.2.b: "The empire stands by its own strength alone."

 cc_invasion_mexico.3.title: "Old Rivals, New Threats"
 cc_invasion_mexico.3.desc: "Emissaries arrive proposing a confederation of the peoples of this land. For generations we have stood apart from — and at times against — those who now extend this offer. Yet the foreign soldiers do not distinguish between us when they march. Perhaps old grudges matter less than survival."
 cc_invasion_mexico.3.a: "Set aside old rivalries. We join."
 cc_invasion_mexico.3.b: "We trust no alliance built by our old rivals."

 cc_invasion_mexico.4.title: "The Council Deliberates"
 cc_invasion_mexico.4.desc: "Our war chiefs and priests have gathered. Emissaries bring generous terms — mutual protection, shared resources, a united front. But our elders remember the last time we entrusted our fate to a greater power. The council is divided between those who see safety in numbers and those who counsel that our destiny lies in our own hands."
 cc_invasion_mexico.4.a: "The numbers speak for themselves. We join."
 cc_invasion_mexico.4.b: "Our destiny lies in our own hands."

 # ========================
 # EVENT 5 — Defensive Preparation
 # ========================
 cc_invasion_mexico.5.title: "Foreign Soldiers at the Border"
 cc_invasion_mexico.5.desc: "Scouts report that colonial soldiers have seized lands on the edge of our territory. Their weapons are strange and their numbers grow. We must decide how to respond to this threat before it is upon our doorstep."
 cc_invasion_mexico.5.a: "Strengthen our fortifications and marshal our warriors."
 cc_invasion_mexico.5.b: "Seek safety in alliance — join the Confederation."

 # ========================
 # EVENTS 10–12 — Monthly Confederate Events
 # ========================
 cc_invasion_mexico.10.title: "The Confederation Holds"
 cc_invasion_mexico.10.desc: "Despite the pressure of the invasion, the bonds of our confederation remain strong. Goods, warriors, and messages flow between our peoples. Together we are something the colonizers have not yet faced."
 cc_invasion_mexico.10.a: "Our unity is our greatest weapon."

 cc_invasion_mexico.11.title: "Strains Within the Confederation"
 cc_invasion_mexico.11.desc: "The weight of the confederation grows heavy. Rival leaders dispute authority, and some of our people question whether this alliance truly serves our interests. The colonial threat has not disappeared, but neither has the old ambition."
 cc_invasion_mexico.11.a: "We endure the friction. Unity must hold."
 cc_invasion_mexico.11.b: "This confederation is not worth our submission. We withdraw."

 cc_invasion_mexico.12.title: "The Colonizers Demand Tribute"
 cc_invasion_mexico.12.desc: "Emissaries from the neighboring colonial power arrive with an unmistakable message: send tribute, or face consequences. Our treasury is strained, but so too is our pride. How shall we respond?"
 cc_invasion_mexico.12.a: "Pay the tribute. It buys us time."
 cc_invasion_mexico.12.b: "We will not submit to extortion."

 # ========================
 # EVENT 20 — Colonial Neighbor Interaction
 # ========================
 cc_invasion_mexico.20.title: "The Native Frontier"
 cc_invasion_mexico.20.desc: "Our forces now share a border with one of the great native empires of Mesoamerica. They watch us from across the frontier. How shall we approach them?"
 cc_invasion_mexico.20.a: "Send an envoy bearing gifts — let diplomacy light the way."
 cc_invasion_mexico.20.b: "Draw up a claim on their lands. Conquest will follow when we are ready."

 # ========================
 # EVENT 21 — Native Response to Colonial Envoy
 # ========================
 cc_invasion_mexico.21.title: "The Envoy Returns"
 cc_invasion_mexico.21.desc_default: "Our diplomatic mission has returned from the native court. They were received with curiosity — and caution. The groundwork for future dealings has been laid."
 cc_invasion_mexico.21.desc_conf: "Our envoy was met at the border by a confederate guard and escorted under close watch to the ruler's court. Our diplomacy made some impression, but the confederation's shadow is long."
 cc_invasion_mexico.21.a: "A promising beginning."

 # ========================
 # EVENT 25 — Commission Expedition (Monthly)
 # ========================
 cc_invasion_mexico.25.title: "Reports from the Interior"
 cc_invasion_mexico.25.desc: "Our agents have returned from scouting the interior. Vast cities, storehouses of gold and food, and a population ripe for subjugation — all within reach. Shall we commission a formal expedition to press our claim?"
 cc_invasion_mexico.25.a: "Commission the expedition at once. [Root.GetTreasuryCost(75)|Y]"
 cc_invasion_mexico.25.b: "The moment is not yet right."

 # ========================
 # EVENT 26 — Protectorate Offer Response
 # ========================
 cc_invasion_mexico.26.title: "The Colonizer's Offer"
 cc_invasion_mexico.26.desc: "A powerful colonial ruler has dispatched envoys with a remarkable proposal: rather than face conquest, we might accept a protected status — retaining our customs, our rulers, and our lands under their nominal overlordship. It is a bitter cup. But is survival worth the price?"
 cc_invasion_mexico.26.a: "We accept. Survival of our people must come first."
 cc_invasion_mexico.26.b: "We refuse. Better to fall fighting than to bow."

 # ========================
 # EVENT 30 — Expedition Departs
 # ========================
 cc_invasion_mexico.30.title: "The Expedition Sets Forth"
 cc_invasion_mexico.30.desc: "Captains and soldiers have been assembled, supplies loaded, and banners raised. The expedition to the heart of Mesoamerica departs with great ceremony and high expectation. Glory — and plunder — await."
 cc_invasion_mexico.30.a: "God willing, they will return victorious."

 # ========================
 # EVENTS 35–36 — End Events
 # ========================
 cc_invasion_mexico.35.title: "The Age of Conquest Passes"
 cc_invasion_mexico.35.desc_free: "The era of the great invasion has ended, yet our people endure. We have survived where others fell. Whatever comes next, our civilization has proven its resilience."
 cc_invasion_mexico.35.desc_subject: "The age of conquest has run its course. Our lands are no longer our own, and our people must learn to live beneath a foreign sky. The old world is gone. A new one — painful, uncertain — begins."
 cc_invasion_mexico.35.a: "We endure."

 cc_invasion_mexico.36.title: "The Conquest of Mesoamerica"
 cc_invasion_mexico.36.desc_conqueror: "The great native empires of Mesoamerica have been broken. Their peoples now serve under our banner, their wealth flows to our treasuries. History will remember this as the age when the New World was made our own."
 cc_invasion_mexico.36.desc_observer: "The struggle for Mesoamerica has drawn to a close. Others have claimed its riches, but the wealth and example of the conquest will echo across the colonial world for generations."
 cc_invasion_mexico.36.a: "A new era begins."

 # ========================
 # CASUS BELLI
 # ========================
 cc_seize_mexico_native: "Colonial Conquest"
 cc_seize_mexico_native_PROV: "Colonial Conquest (Province)"
 cc_seize_mexico_native_desc: "By the doctrine of discovery, this colonial power claims the right to subjugate the native peoples of Mesoamerica. No antagonism is incurred — this conquest is regarded as righteous by colonial law."

 cc_seize_mexico_colonial: "Competing Colonial Claims"
 cc_seize_mexico_colonial_PROV: "Competing Colonial Claims (Province)"
 cc_seize_mexico_colonial_desc: "Two colonial powers contest dominion over the same corner of the New World. No antagonism is incurred, though the cost of imposing a subject relationship will be higher given the rival's contested claim."

 # ========================
 # GENERIC ACTIONS
 # ========================
 ccim_call_confederation: "Call for Confederation"
 ccim_call_confederation_desc: "Rally the native peoples of Mesoamerica into a defensive confederation. Creates the Mesoamerican Confederation IO if it does not exist, or joins it. Allied native neighbors will be invited to join. Costs prestige. Cannot be repeated for 10 years."
 ccim_call_confederation_create_tt: "Creates the Mesoamerican Confederation as founding leader, or joins if it already exists."

 ccim_offer_tribute: "Offer Tribute"
 ccim_offer_tribute_desc: "Send gold to a neighboring colonial power in exchange for improved relations and a temporary reprieve from aggression. Removes any held casus belli that power holds against us. Cannot be repeated for 5 years."

 ccim_commission_expedition: "Commission Expedition"
 ccim_commission_expedition_desc: "Spend gold to dispatch an expedition into native territory, granting a casus belli against a chosen native nation for 8 years. Cannot be repeated for 5 years."

 ccim_negotiate_protectorate: "Negotiate Protectorate"
 ccim_negotiate_protectorate_desc: "Approach a native power with terms for a subject relationship. The native ruler will receive an event and may accept or refuse. Requires non-hostile relations. Cannot be repeated for 8 years."

 # ========================
 # SITUATION PANEL UI
 # ========================
 CCIM_CONFEDERATION_PANEL_HEADER: "Mesoamerican Confederation"
 CCIM_SITUATION_OVERVIEW_HEADER: "The Struggle for Mesoamerica"
 CCIM_SITUATION_OVERVIEW_DESC: "Colonial powers press into Mesoamerica from the coast. Native nations may unite in the Confederation or seek tribute agreements. Use the situation map to see which lands are held by each side. Colonial powers can Commission Expeditions and Negotiate Protectorates; native powers can Call for Confederation or Offer Tribute."

 # Map legend
 CCIM_CONFEDERATION_LEGEND: "Mesoamerican Confederation"
 CCIM_NATIVE_UNAFFILIATED_LEGEND: "Independent Native State"

 # Map tooltips
 ccim_confederation_member_tt: "This land belongs to a member of the Mesoamerican Confederation."
 ccim_native_unaffiliated_tt: "This land belongs to an independent native state."
 ccim_colonial_power_tt: "This land is controlled by a colonial power."

 # Situation explanation tooltip (appears on event 1 option)
 ccim_situation_explanation_tt: "The Invasion of Mexico situation is now active. Native powers can form a Mesoamerican Confederation and offer tribute from the situation panel. Colonial powers can commission expeditions and negotiate protectorates."

 # No confederation exists tooltip
 ccim_no_confederation_exists_tt: "The Mesoamerican Confederation has not yet been formed. A major native power must call for one first."

 # Generic action error tooltips
 ccim_offer_tribute_no_target_tt: "No valid colonial power to offer tribute to was selected."
 ccim_commission_expedition_no_target_tt: "No valid native target was selected for the expedition."
 ccim_negotiate_protectorate_no_target_tt: "No valid native power was selected for protectorate negotiations."

 # Biases (opinion modifiers)
 opinion_ccim_tribute_received: "Tribute Received"
 opinion_ccim_diplomatic_approach: "Diplomatic Overture"
 opinion_ccim_tribute_paid: "Tribute Paid"

 # Event target selection UI
 ccim_choose_tribute_target: "Choose a colonial power to send tribute to"
 ccim_choose_expedition_target: "Choose a native nation to target"
 ccim_choose_protectorate_target: "Choose a native nation to approach"

 # IO opinion modifier (required by the IO engine)
 io_opinion_cc_mesoamerican_confederation: "Fellow Confederation Member"

 # Country modifiers
 STATIC_MODIFIER_NAME_ccim_defensive_preparations: "Defensive Preparations"
 ccim_defensive_preparations: "Defensive Preparations"
 ccim_defensive_preparations_desc: "Our armies are marshaled and our borders are fortified in expectation of colonial aggression."
 STATIC_MODIFIER_NAME_ccim_confederation_solidarity: "Confederation Solidarity"
 ccim_confederation_solidarity: "Confederation Solidarity"
 ccim_confederation_solidarity_desc: "The bonds of the Mesoamerican Confederation strengthen our resolve and sharpen our warriors."
 STATIC_MODIFIER_NAME_ccim_expedition_morale: "Expedition Morale"
 ccim_expedition_morale: "Expedition Morale"
 ccim_expedition_morale_desc: "A freshly commissioned expedition sets out, full of purpose and ambition."
 STATIC_MODIFIER_NAME_ccim_contested_claims: "Contested Colonial Claims"
 ccim_contested_claims: "Contested Colonial Claims"
 ccim_contested_claims_desc: "Two colonial powers compete for the same corner of the New World, making subjugation costlier than usual."
 STATIC_MODIFIER_NAME_ccim_divine_blessing: "Blessing of the Gods"
 ccim_divine_blessing: "Blessing of the Gods"
 ccim_divine_blessing_desc: "Sacred ceremonies have stirred the warriors' hearts. The gods of our ancestors march with us."
 STATIC_MODIFIER_NAME_ccim_sacred_fortifications: "Fortified Sacred Sites"
 ccim_sacred_fortifications: "Fortified Sacred Sites"
 ccim_sacred_fortifications_desc: "Our holiest places have been reinforced. Their walls will slow any invader who dares approach."
 STATIC_MODIFIER_NAME_ccim_native_weakness: "Divided Counsel"
 ccim_native_weakness: "Divided Counsel"
 ccim_native_weakness_desc: "Bribes and promises have sown discord among the noble factions. The ruler's commands ring hollow."
 STATIC_MODIFIER_NAME_ccim_tribute_windfall: "Tribute Windfall"
 ccim_tribute_windfall: "Tribute Windfall"
 ccim_tribute_windfall_desc: "Gold extracted from our Mesoamerican holdings flows into the treasury, enriching the campaign."
 STATIC_MODIFIER_NAME_ccim_refugee_influx: "Refugee Warriors"
 ccim_refugee_influx: "Refugee Warriors"
 ccim_refugee_influx_desc: "Survivors from fallen neighboring peoples have swelled our ranks with able-bodied warriors hungry for revenge."

 # Opinion modifiers (new)
 opinion_ccim_bribed_noble: "Bribed Noble Faction"

 # ========================
 # NEW GENERIC ACTIONS
 # ========================
 ccim_fortify_sacred_sites: "Fortify Sacred Sites"
 ccim_fortify_sacred_sites_desc: "Commission the reinforcement of your holy sites and border strongholds. Grants a defensive fortification modifier and blesses all Confederation members with divine protection. Costs 60 gold. Cannot be repeated for 8 years."

 ccim_seek_tribal_alliance: "Seek Tribal Alliance"
 ccim_seek_tribal_alliance_desc: "Send emissaries to a neighboring independent native nation urging them to join the Mesoamerican Confederation. They will consider the offer and may accept. Requires membership in the Confederation. Cannot be repeated for 10 years."

 ccim_extract_tribute: "Extract Tribute"
 ccim_extract_tribute_desc: "Demand tribute payments from your Mesoamerican territories. Gain gold for each owned location in the region and apply a brief income windfall. Cannot be repeated for 8 years."

 ccim_bribe_noble_faction: "Bribe Noble Faction"
 ccim_bribe_noble_faction_desc: "Spend gold to sow internal division among a native power's nobility. The target suffers a weakening modifier for 4 years. Costs 80 gold. Cannot be repeated for 10 years."

 # Action target choice UI
 ccim_choose_bribe_target: "Choose a native nation to bribe"

 # Action error tooltip
 ccim_bribe_noble_faction_no_target_tt: "No valid native target was selected for the bribery."

 # ========================
 # EVENTS 40–43 (Native)
 # ========================
 cc_invasion_mexico.40.title: "The High Priest Urges Action"
 cc_invasion_mexico.40.desc: "The high priest has summoned our leaders to the sacred precinct. The gods, he declares, have spoken: the time to act is now. Sacred ceremonies, sacrifices, and rituals of protection will fortify our warriors and call down divine favor upon our cause. Will we heed the call of the old ways?"
 cc_invasion_mexico.40.a: "Honor the old rites. The gods will guide our warriors."
 cc_invasion_mexico.40.b: "Our warriors need steel and training, not ceremony."

 cc_invasion_mexico.41.title: "Signs in the Sacred Smoke"
 cc_invasion_mexico.41.desc: "The ceremonies are complete. The priests read the copal smoke, the flight of birds, the patterns in ash. They speak of a sign — not of defeat, but of endurance. Whether in alliance or in solitary defiance, our people have been strengthened by the rites."
 cc_invasion_mexico.41.a: "A favorable omen — the gods are with us!"
 cc_invasion_mexico.41.b: "Dark signs. The priests urge us to prepare for the worst."

 cc_invasion_mexico.42.title: "Refugees from Fallen Lands"
 cc_invasion_mexico.42.desc: "A ragged column of survivors arrives at our gates — men, women, and warriors from a neighboring people whose lands the invaders have seized. They bring nothing but their lives and what they know of the foreigners' tactics. How shall we receive them?"
 cc_invasion_mexico.42.a: "Take them in. Their warriors will fight alongside ours."
 cc_invasion_mexico.42.b: "Question them for intelligence on the invaders' methods."

 cc_invasion_mexico.43.title: "An Offer of Brotherhood"
 cc_invasion_mexico.43.desc: "Envoys from the Mesoamerican Confederation have arrived bearing gifts and a solemn message: united, the peoples of this land can turn back the tide of conquest. Divided, we will each fall in turn. The offer to join the Confederation stands before us."
 cc_invasion_mexico.43.a: "We accept. Our peoples shall stand together."
 cc_invasion_mexico.43.b: "We will find our own path. We thank them for the offer."

 # ========================
 # EVENTS 50–52 (Colonial)
 # ========================
 cc_invasion_mexico.50.title: "A Bold Captain Steps Forward"
 cc_invasion_mexico.50.desc: "A seasoned captain — battle-hardened, ambitious, and hungry for glory — has volunteered to lead a scouting expedition deep into the native interior. The risks are real: the terrain is unknown and the natives are watchful. But intelligence gained could be decisive. Do we commission his expedition?"
 cc_invasion_mexico.50.a: "Commission his expedition. [Root.GetTreasuryCost(50)|Y]"
 cc_invasion_mexico.50.b: "The timing is not right. We wait."

 cc_invasion_mexico.51.title: "The Captain's Report"
 cc_invasion_mexico.51.desc_success: "The captain has returned! His expedition cut deep into the interior, mapping passes, water sources, and the disposition of native forces. He brings back detailed intelligence and tales of cities waiting to be claimed. A casus belli has been prepared against the nearest native power."
 cc_invasion_mexico.51.desc_failure: "The captain has returned — but barely. His expedition met fierce resistance and was forced to retreat after heavy losses. The men are shaken, the treasury lighter, and the captain himself is nursing wounds. A costly lesson in the dangers of overconfidence."
 cc_invasion_mexico.51.a_success: "Excellent work. Prepare the campaign."
 cc_invasion_mexico.51.b_failure: "A painful setback. We must regroup."

 cc_invasion_mexico.52.title: "Gold Fever Grips the Camp"
 cc_invasion_mexico.52.desc: "Word has spread among our soldiers: the natives hide vast quantities of gold in their temples and storehouses. Discipline is fraying as men whisper of fortunes to be claimed. We must decide how to handle the growing restlessness in the ranks."
 cc_invasion_mexico.52.a: "Promise them a share of the plunder. Greed can be a weapon."
 cc_invasion_mexico.52.b: "Maintain strict discipline. Order wins campaigns, not greed."

 # ========================
 # CONFEDERATION UNITY VARIABLE
 # ========================
 CCIM_UNITY_FORMAT: "$VAL$"
 ccim_confederation_unity: "Confederation Unity"
 ccim_confederation_unity_desc: "A measure of cohesion within the Mesoamerican Confederation (0–100). High unity strengthens all members; low unity weakens them and triggers crisis events."

 # Monthly change tooltip descriptions
 CCIM_UNITY_NATURAL: "Natural Cohesion"
 CCIM_UNITY_MEMBER_SIZE: "Member States"
 CCIM_UNITY_COMMON_THREAT: "Common Enemy"

 # AI desire-to-join and ai_will_do tooltip descriptions
 CCIM_COLONIAL_BORDER: "Colonizers on Our Border"
 CCIM_WAR_URGENCY: "Under Attack — Seeking Allies"
 CCIM_BRIBED_NOBLES: "Nobles Counsel Appeasement"
 CCIM_MEMBER_RELATIONS: "Relations with Confederation Members"
 CCIM_IO_NOT_YET_FORMED: "Confederation Not Yet Formed"


 # ========================
 # IO 
 # ========================
 cc_mesoamerican_confederation: "Mesoamerican Confederation"
 # ========================
 # IO UNITY MODIFIERS
 # ========================
 STATIC_MODIFIER_NAME_ccim_high_unity_bonus: "Confederated Strength"
 ccim_high_unity_bonus: "Confederated Strength"
 ccim_high_unity_bonus_desc: "The Mesoamerican Confederation speaks with one voice. Our warriors draw confidence from the unshakeable bond between our peoples."
 STATIC_MODIFIER_NAME_ccim_low_unity_penalty: "Confederation Fractures"
 ccim_low_unity_penalty: "Confederation Fractures"
 ccim_low_unity_penalty_desc: "Tensions within the confederation undermine morale and weaken recruitment. Unity must be restored before the invaders exploit our divisions."
 STATIC_MODIFIER_NAME_ccim_newly_joined_bonus: "New Confederation Member"
 ccim_newly_joined_bonus: "New Confederation Member"
 ccim_newly_joined_bonus_desc: "A renewed sense of purpose follows our entry into the Mesoamerican Confederation. Our warriors are heartened, and their morale rises."
 STATIC_MODIFIER_NAME_ccim_confederation_betrayer: "Confederation Abandonment"
 ccim_confederation_betrayer: "Confederation Abandonment"
 ccim_confederation_betrayer_desc: "We left the Mesoamerican Confederation in its hour of need. Our warriors are demoralized, and our reputation among the native peoples is diminished."
 STATIC_MODIFIER_NAME_ccim_war_council_boost: "War Council Decree"
 ccim_war_council_boost: "War Council Decree"
 ccim_war_council_boost_desc: "The confederation's war council has issued a decree of total mobilization. Every member state commits their warriors to a common cause."

 # ========================
 # IO LEADER ACTIONS
 # ========================
 ccim_io_war_council: "Call War Council"
 ccim_io_war_council_desc: "Summon the war council and issue a decree of total mobilization. All confederation members receive a military morale and levy boost. Requires being at war. Costs 15 Confederation Unity. Cannot be repeated for 5 years."

 ccim_io_tribute_levy: "Levy Confederation Tribute"
 ccim_io_tribute_levy_desc: "Invoke the right of tribute levy. Each non-leader member pays 20 gold to the leader's war chest. Extracting tribute strains member goodwill. Costs 10 Confederation Unity. Cannot be used while at war. Cannot be repeated for 8 years."

 ccim_io_send_envoys: "Send Confederation Envoys"
 ccim_io_send_envoys_desc: "Dispatch envoys with gifts and a formal invitation to a neighboring independent native power. If they accept, they will join the Mesoamerican Confederation. Costs 50 gold and 10 Confederation Unity. Cannot be repeated for 3 years."

 ccim_io_strike_invaders: "Strike Against the Invaders"
 ccim_io_strike_invaders_desc: "Issue the war mandate of the confederation against a neighboring colonial power. If a casus belli is already held against the target, war is declared immediately and all members receive a combat boost. Otherwise, the casus belli is granted for later use. Gains 20 Confederation Unity. Cannot be repeated for 10 years."

 ccim_io_absorb_tribe: "Absorb a Neighboring Tribe"
 ccim_io_absorb_tribe_desc: "Use the confederation's authority to diplomatically absorb a neighboring independent native nation, annexing their lands into the leader's realm. Costs 25 Confederation Unity. Cannot be repeated for 15 years."

 # Action target choice UI
 ccim_choose_envoy_target: "Choose a native nation to invite"
 ccim_choose_strike_target: "Choose a colonial power to strike"
 ccim_choose_absorb_target: "Choose a neighboring tribe to absorb"

 # CB
 cc_repel_invaders: "Expel the Invaders"
 cc_repel_invaders_desc: "The Mesoamerican Confederation has issued a mandate to expel the colonial forces from the sacred lands of Mesoamerica."

 # ========================
 # EVENTS 60–63 (IO Confederation)
 # ========================
 cc_invasion_mexico.60.title: "The Confederation Council Deliberates"
 cc_invasion_mexico.60.desc: "The season has turned, and the confederation's leaders have gathered. As the paramount chief, all eyes turn to you: Where shall the confederation focus its energy in the months ahead? Toward war and readiness, or toward strengthening the bonds between our peoples?"
 cc_invasion_mexico.60.a: "Focus our efforts on military readiness — the invaders will not wait."
 cc_invasion_mexico.60.b: "Invest in the bonds between our peoples. Unity is our greatest weapon. [Root.GetTreasuryCost(40)|Y]"
 cc_invasion_mexico.60.c: "Send envoys to a neighboring people — expand the confederation's reach."

 cc_invasion_mexico.61.title: "The Confederation is Fracturing"
 cc_invasion_mexico.61.desc: "Troubling dispatches arrive from across the confederation. Disputes over resources, authority, and obligation have boiled over. Some member-states are considering withdrawing. The confederation that stood as a bulwark against conquest may tear itself apart from within unless we act."
 cc_invasion_mexico.61.a: "Convene an emergency council. Bind the peoples together — whatever the cost. [Root.GetTreasuryCost(60)|Y]"
 cc_invasion_mexico.61.b: "Let the tensions run their course. True unity cannot be forced."

 cc_invasion_mexico.62.title: "The High Priest Blesses the Confederation"
 cc_invasion_mexico.62.desc: "The high priest has called the confederation's leaders to the sacred precinct for a ceremony of unity and divine favor. Drums beat, incense fills the air, and priests read the omens for the confederation as a whole. Whether we honor the ceremony fully or defer for practical concerns, this moment demands a response."
 cc_invasion_mexico.62.a: "Honor the ceremony in full. The gods of all our peoples shall bless us."
 cc_invasion_mexico.62.b: "Send our regards, but our warriors need action, not prayer."

 cc_invasion_mexico.63.title: "Envoys from the Mesoamerican Confederation"
 cc_invasion_mexico.63.desc: "A delegation arrives bearing gifts of jade, feathers, and grain — and a formal invitation. The Mesoamerican Confederation offers us a place among its member-states: shared defense, mutual aid, and the protection of a united native front against the foreign invaders pressing from the coast. It is an offer worth weighing carefully."
 cc_invasion_mexico.63.a: "We accept the invitation. Our people will stand with the confederation."
 cc_invasion_mexico.63.b: "We decline. Our path is our own to choose."

 # ========================
 # EVENT 64 — The Fall of Our Neighbors (fear cascade)
 # ========================
 cc_invasion_mexico.64.title: "The Fall of Our Neighbors"
 cc_invasion_mexico.64.desc: "A neighboring people has been subjugated by the invaders. Their warriors defeated, their chiefs humbled, their lands parceled out to foreign lords. The confederation emissaries press their case with renewed urgency: 'You have seen what happens to those who stand alone. Our offer will not remain open forever.'"
 cc_invasion_mexico.64.a: "Their fate has decided us. We join the confederation."
 cc_invasion_mexico.64.b: "We shall negotiate our own terms with the invaders."

 # ========================
 # EVENT 70 — The Hour of Conquest (Colonial War Push)
 # ========================
 cc_invasion_mexico.70.title: "The Hour of Conquest"
 cc_invasion_mexico.70.desc: "Our commanders press their case with mounting insistence: we hold a casus belli, our forces are marshalled, and the native powers grow stronger each season we delay. The window of opportunity is open — but windows do not stay open forever."
 cc_invasion_mexico.70.a: "Give the order. Begin the campaign."
 cc_invasion_mexico.70.b: "We must consolidate our position first."
