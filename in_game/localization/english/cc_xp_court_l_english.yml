 CC_XP_BTN_PROTEGE: "Take On a Protege"
 CC_XP_BTN_MENTOR: "Assign a Mentor"
 CC_XP_BTN_SECOND: "Second to a Subject"
 CC_XP_BTN_RECALL: "Recall a Resident"

