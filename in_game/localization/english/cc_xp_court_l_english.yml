l_english:
 # ============================================================
 # Cabinet Experience — the court ledger panel
 #
 # Panel: in_game/gui/panels/situation/cc_cabinet_court.gui
 # Situation: in_game/common/situations/cc_cabinet_court.txt
 # ============================================================

 # The situation's own name, shown on the header icon.
 cc_cabinet_court: "The Court"
 cc_cabinet_court_desc: "A standing record of who serves the crown, what they have learned, and how far each of them still has to go."

 CC_XP_COURT_HEADER: "The Court"
 CC_XP_COURT_DESC: "Every minister and every sponsored protege, with what they have made of themselves so far.\n\n#Y Seniority#! is the level beside each name, from 1 to 10. It comes from total experience across all three tracks and reflects how much a person has been through. It drives their standing at court.\n\n#Y Specialization#! is the tier shown against each track, from 0 to 3. It comes from that track's own experience and is what decides which traits are within their reach. A minister can be very senior and still be a tier 0 soldier.\n\nExperience comes from the duties they hold, the years they serve, the wars and laws and marriages the realm carries through, and whatever you are willing to spend on training them."

 CC_XP_SECTION_CABINET: "SERVING MINISTERS"
 CC_XP_SECTION_PROTEGES: "PROTEGES"
 CC_XP_NO_PROTEGES: "Nobody is being groomed. Take on a protege from a character's interactions to have a successor ready before a seat opens."

 CC_XP_LEVEL_LABEL: "level"
 CC_XP_LEVEL_MAX: "At the height of their career."
 CC_XP_SENIORITY_TT: "Progress toward the next level of seniority. Level is earned from total experience across all three tracks, and grants a growing bonus to how effectively this person works."

 CC_XP_COL_ADM: "ADM"
 CC_XP_COL_DIP: "DIP"
 CC_XP_COL_MIL: "MIL"
 CC_XP_TRACK_ADM_TT: "Administrative experience, and the tier it has earned. Comes from administrative duties, laws carried through, and time in the chancery. Tier 1 at 150, tier 2 at 500, tier 3 at 1200."
 CC_XP_TRACK_DIP_TT: "Diplomatic experience, and the tier it has earned. Comes from diplomatic duties, royal marriages, and the embassy circuit. Tier 1 at 150, tier 2 at 500, tier 3 at 1200."
 CC_XP_TRACK_MIL_TT: "Military experience, and the tier it has earned. Comes from military duties, wars won, and the staff college. Tier 1 at 150, tier 2 at 500, tier 3 at 1200."

 CC_XP_STATUS_AWAY: "away"
 CC_XP_STATUS_AWAY_TT: "Currently on a posting, or arranging a court examination. They cannot be sent elsewhere or given a pupil until they return."
 CC_XP_STATUS_MENTORED: "mentored"
 CC_XP_STATUS_MENTORED_TT: "Being taught by a senior minister, and gaining experience each year in whatever that mentor is strongest at."

 # ============================================================
 # Cabinet Experience — cabinet card badge
 # (in_game/gui/shared/cc_xp_cabinet_card.gui)
 # ============================================================
 CC_XP_CARD_LVL: "lvl"
 CC_XP_CARD_LEVEL_TT: "Seniority, from 1 to 10. Earned from total experience across all three tracks, and it grants a growing bonus to how effectively this minister works. Open the Court panel for the full record."

 # ============================================================
 # Cabinet Experience — court panel tabs (phase 7)
 # ============================================================
 CC_XP_TAB_PATRONAGE: "Patronage"
 CC_XP_TAB_SCHOOLS: "Schools"

 CC_XP_WORKS_LABEL: "Works in the realm"
 CC_XP_ARTISTS_LABEL: "Living artists"
 CC_XP_NO_ARTISTS: "No artists are working in the realm. Artists appear through the culture system; a minister can then be set to sponsor one."
 CC_XP_HAS_PATRON: "sponsored"
 CC_XP_HAS_PATRON_TT: "A minister has put their name and money behind this artist. The crown gains prestige while the arrangement lasts, and the minister gains diplomatic experience."
 CC_XP_WORKS_BY_TT: "Works completed by this artist."
 CC_XP_SPONSORED_LABEL: "Sponsored"
 CC_XP_SPONSORED_TT: "Artists a minister has sponsored. Updated monthly."
 CC_XP_BTN_OPEN_ARTS: "All Works of Art"
 CC_XP_BTN_OPEN_ARTS_TT: "Open the Works of Art overview, which can sort and filter every work in the world."
 CC_XP_ARTIST_SKILL_TT: "Artist skill. A more skilled artist produces better works."
 CC_XP_ARTIST_PATRON: "Patron: #Y [Character.MakeScope.GetVariable('cc_xp_patron').GetCharacter.GetShortNameWithNoTooltip]#!"
 CC_XP_ARTIST_NO_PATRON: "No patron"
 CC_XP_ARTIST_WORKING: "Working on a [Character.GetArtInProgress.GetName|l]"
 CC_XP_ARTIST_IDLE: "Idle"
 CC_XP_ARTIST_IDLE_TT: "This artist is not working on anything. Commission a work to set them to it."
 CC_XP_ARTIST_STALLED: "Working on a [Character.GetArtInProgress.GetName|l]: #Y no progress#!"
 CC_XP_ARTIST_STALLED_TT: "This piece is not advancing. Until the realm can invest in culture, works of art make no progress at all; after that, a piece begun this month shows progress from next month."
 CC_XP_WORKS_HEADER: "WORKS OF ART IN THE REALM"
 CC_XP_NO_WORKS: "The realm holds no works of art. The list is updated monthly."
 CC_XP_ART_COL_NAME: "Work"
 CC_XP_ART_COL_TYPE: "Type"
 CC_XP_ART_COL_QUALITY: "Quality"
 CC_XP_ART_COL_ARTIST: "Artist"
 CC_XP_ART_COL_LOCATION: "Location"
 CC_XP_ART_TOGGLE_FIXED_TT: "Show or hide works that cannot be sold: priceless works, monuments, palaces, temple towers, regalia and mansions."
 CC_XP_ART_PRICELESS_TT: "Priceless. This work cannot be sold."

 CC_XP_SCHOOLS_DESC: "A school is a standing institution seated at a university. It teaches its founder's discipline to everyone enrolled, in office or not, and keeps teaching after the founder is dead. What its seat makes it (a studium, a madrasa, a shuyuan) and the curriculum it teaches each give a bonus at the seat, and the curriculum one across the realm. Each school has #Y Quality#!, which funding and a Rector buy and which scales its bonuses, and #Y Renown#!, which grows with age, its seat and the realm's standing, and is measured against the great universities abroad.\n\nA realm may hold three at most. The first requires a university in the capital, the second the Scholarly Orders advance, and the third Enlightened Administration."
 CC_XP_NO_SCHOOLS: "No institutions have been founded. Build a university in your capital, then have a senior minister found a school under their own discipline."
 CC_XP_SCHOOL_FOUNDER_DEAD: "(founder deceased)"
 CC_XP_SCHOOL_FOUNDER_DEAD_TT: "The founder is dead and the school continues without them. That is the difference between an institution and a reputation."

