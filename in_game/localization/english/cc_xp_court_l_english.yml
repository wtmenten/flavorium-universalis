 CC_XP_BTN_SELL_WORK: "Sell a Work"
 CC_XP_BTN_SPONSOR: "Sponsor an Artist"
 CC_XP_BTN_FOUND: "Found an Institution"
 CC_XP_BTN_ENROL: "Enroll"
 CC_XP_ARTISTS_HEADER: "ARTISTS IN THE REALM"
 CC_XP_SCHOOLS_HEADER: "INSTITUTIONS"
 CC_XP_SLOT_OPEN: "An institution may be founded"
 CC_XP_SLOT_LOCKED: "Not yet unlocked"
 CC_XP_SLOT_REQ_1: "Requires a university in the capital."
 CC_XP_SLOT_REQ_2: "Requires the Scholarly Orders advance."
 CC_XP_SLOT_REQ_3: "Requires the Enlightened Administration advance."

