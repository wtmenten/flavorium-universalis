 # Trait descriptions. Every one of these traits was grantable with no desc_ key,
 # which renders as an empty tooltip body under the trait name.
 desc_clumsy_accountant: "The ledgers balance eventually, and never on the first attempt. Every household account this advisor touches costs more to keep than it should, and the difference is quietly made up out of the treasury."
 desc_fumbling_reformist: "A genuine appetite for reform and no instinct at all for how a statute is written. Their proposals reach the chamber half-formed and leave it worse, and the law is slower and dearer for every one of them."
 desc_green_adjutant: "Competent, willing, and entirely untested. The staff work is correct and arrives late, and regiments under their orders take longer to do what a veteran would have had done already."
 desc_master_reformer: "Knows the shape of the statute book well enough to change it without breaking it. Laws pass faster, the schools grow, and the realm develops a taste for doing things a new way."
 desc_returned_colonial_governor: "Governed a long way from the capital and came home knowing what that costs. Colonial ventures under their eye are better manned and better charted, and the court gained a diplomat it did not have."
 desc_tentative_envoy: "Correct, careful, and unwilling to press. Foreign courts find them pleasant and forgettable, and take rather more liberties with us than they did before."
