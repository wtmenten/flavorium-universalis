l_english:
 # ============================================================
 # Stepping Stone Traits — Tier 0 Entry Points
 # ============================================================
 fumbling_reformist: "Fumbling Reformist"
 fumbling_reformist_desc: "This minister has begun working on administrative reform, but their touch is uncertain. Drafts are revised, procedures confused, and the results more hopeful than effective. With time and perseverance, they will improve."

 tentative_envoy: "Tentative Envoy"
 tentative_envoy_desc: "A diplomat still finding their footing. The minister's instinct for negotiation is there, but caution makes them hesitate where boldness is needed. Courts abroad take note — though not always favourably."

 green_adjutant: "Green Adjutant"
 green_adjutant_desc: "Newly assigned to military affairs, this minister is long on enthusiasm and short on experience. Their advice is earnest but half-formed. Campaigns will teach them what classrooms cannot."

 clumsy_accountant: "Clumsy Accountant"
 clumsy_accountant_desc: "The minister has been set to the treasury's books, and the results are — promising, in the way that early drafts are promising. Errors are small and correctable, but they add up. Practice will make them exact."

 # ============================================================
 # Stepping Stone Traits — Chain Endpoints
 # ============================================================
 master_reformer: "Master Reformer"
 master_reformer_desc: "Forged through years of relentless advocacy and hard-won setbacks, this minister has become an architect of lasting change. Where others see entrenched interests, they see levers. The realm's institutions bend to their will, not the other way around."

 returned_colonial_governor: "Returned Colonial Governor"
 returned_colonial_governor_desc: "This minister has spent years overseeing the realm's distant holdings, navigating frontier hardship, colonial ambition, and the tangled politics of distant governors. They return home transformed — carrying experience no courtly education could provide."

