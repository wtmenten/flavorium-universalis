l_english:
 # ============================================================
 # Stepping Stone Traits — Tier 0 Entry Points
 # ============================================================
 fumbling_reformist: "Fumbling Reformist"
 fumbling_reformist_desc: "This minister has begun working on administrative reform, but their touch is uncertain. Drafts are revised, procedures confused, and the results more hopeful than effective. With time and perseverance, they will improve."

 tentative_envoy: "Tentative Envoy"
 tentative_envoy_desc: "A diplomat still finding their footing. The minister's instinct for negotiation is there, but caution makes them hesitate where boldness is needed. Courts abroad take note — though not always favourably."

 green_adjutant: "Green Adjutant"
 green_adjutant_desc: "Newly assigned to military affairs, this minister is long on enthusiasm and short on experience. Their advice is earnest but half-formed. Campaigns will teach them what classrooms cannot."

 clumsy_accountant: "Clumsy Accountant"
 clumsy_accountant_desc: "The minister has been set to the treasury's books, and the results are — promising, in the way that early drafts are promising. Errors are small and correctable, but they add up. Practice will make them exact."

 # ============================================================
 # Stepping Stone Traits — Chain Endpoints
 # ============================================================
 master_reformer: "Master Reformer"
 master_reformer_desc: "Forged through years of relentless advocacy and hard-won setbacks, this minister has become an architect of lasting change. Where others see entrenched interests, they see levers. The realm's institutions bend to their will, not the other way around."

 returned_colonial_governor: "Returned Colonial Governor"
 returned_colonial_governor_desc: "This minister has spent years overseeing the realm's distant holdings, navigating frontier hardship, colonial ambition, and the tangled politics of distant governors. They return home transformed — carrying experience no courtly education could provide."

 # ============================================================
 # Chain A — The Reformer's Path (cc_prog.1–4)
 # ============================================================
 cc_prog.1.title: "The Reformist Wrestles with the Law"
 cc_prog.1.desc: "The minister has spent months wrestling with administrative reform, producing results that are more hopeful than impressive. Old statutes are a labyrinth, and progress is slow. But they are learning."
 cc_prog.1.a: "This is how expertise is built — slowly."
 cc_prog.1.b: "The reform creates confusion in the provinces."

 cc_prog.2.title: "A Reformist Takes Shape"
 cc_prog.2.desc: "After years of persistent effort and hard-earned lessons, the minister's uncertain touch with administrative reform has given way to something more dependable. The fumbling days are behind them."
 cc_prog.2.a: "Appoint them as a full law reformer."

 cc_prog.3.title: "The Law Reformer Grows Bold"
 cc_prog.3.desc: "The minister's reformist vision has grown bolder with each year of service. What once felt radical now seems merely correct. The realm can go further — and the minister intends to take it there."
 cc_prog.3.a: "Let them pursue progressive reform."

 cc_prog.4.title: "The Master Reformer Emerges"
 cc_prog.4.desc: "After more than a decade of relentless advocacy and institutional struggle, the minister has mastered the art of reform. They reshape administrations where others see only obstacles, and their legacy is already being written into the law books."
 cc_prog.4.a: "The realm honours its master reformer."

 # ============================================================
 # Chain C — The Diplomat's Ascent (cc_prog.10–12)
 # ============================================================
 cc_prog.10.title: "The Tentative Envoy Tests the Waters"
 cc_prog.10.desc: "The minister's first forays into statecraft are cautious — feeling out the room before committing to a position. Foreign courts notice both their care and their hesitation."
 cc_prog.10.a: "A careful but successful preliminary engagement."
 cc_prog.10.b: "A diplomatic misstep, swiftly recovered."

 cc_prog.11.title: "The Envoy Finds Their Voice"
 cc_prog.11.desc: "Through repeated exposure to the courts of others, the minister's diplomatic touch has grown confident and assured. What once required careful calculation now flows naturally. They have found their voice."
 cc_prog.11.a: "Name them the realm's tactful envoy."
 cc_prog.11.b: "Their posting abroad has shaped them — make them our attaché."

 cc_prog.12.title: "The Envoy Masters Statecraft"
 cc_prog.12.desc: "A long career of careful negotiation, managed rivalries, and cultivated relationships has sharpened the minister's judgement to a fine edge. They read a room the way a general reads a battlefield — and act accordingly."
 cc_prog.12.a: "The realm gains a master statesman."

 # ============================================================
 # Chain D — The Military Hardening (cc_prog.20–22)
 # ============================================================
 cc_prog.20.title: "The Green Adjutant in the Field"
 cc_prog.20.desc: "The minister has been reviewing campaign records and observing troop dispositions — learning the craft of war from the ground up. Progress is measured, but it is real."
 cc_prog.20.a: "A baptism by fire: the campaigns teach them quickly."
 cc_prog.20.b: "They study the campaigns of great commanders."

 cc_prog.21.title: "The Adjutant Earns Their Stars"
 cc_prog.21.desc: "After years of diligent study and field observation, the green adjutant's knowledge of military affairs has crystallised into a genuine strategic understanding. They are no longer learning — they are advising."
 cc_prog.21.a: "Commission them as a full tactical advisor."

 cc_prog.22.title: "The Tactical Advisor Chooses a Path"
 cc_prog.22.desc: "The tactical advisor has reached the point where further growth demands a choice of specialisation. Will they build the realm's standing armies, master the art of the offensive, or turn their gifts to the strong defence?"
 cc_prog.22.a: "Build the standing army — discipline above all."
 cc_prog.22.b: "Master the offensive — strike swiftly and decisively."
 cc_prog.22.c: "Fortify the realm — hold what we have, lose nothing."

 # ============================================================
 # Chain F — The Fiscal Path (cc_prog.30–32)
 # ============================================================
 cc_prog.30.title: "The Clumsy Accountant Revisits the Ledgers"
 cc_prog.30.desc: "The minister has been reconciling the treasury's books — finding small errors and slowly building an understanding of the realm's finances. The process is occasionally painful, but always instructive."
 cc_prog.30.a: "An accounting error found in the treasury's favour — the realm takes note."
 cc_prog.30.b: "A small oversight embarrasses the minister, but they learn from it."

 cc_prog.31.title: "The Accountant Proves Their Worth"
 cc_prog.31.desc: "Through painstaking review of accounts and careful cultivation of subordinate administrators, the minister has transformed from a tentative newcomer into a dependable steward of the realm's finances."
 cc_prog.31.a: "Elevate them to loyal steward of the treasury."

 cc_prog.32.title: "The Loyal Steward Charts a Course"
 cc_prog.32.desc: "With a firm grasp of the realm's finances, the minister stands at a crossroads. They may cultivate prosperity broadly — encouraging growth across the provinces — or impose stricter discipline upon the treasury's workings."
 cc_prog.32.a: "Cultivate prosperity across the realm."
 cc_prog.32.b: "Impose fiscal discipline and enforce the treasury's authority."

 # ============================================================
 # Chain E — The Colonial Pioneer (cc_prog.40)
 # ============================================================
 cc_prog.40.title: "The Governor Returns"
 cc_prog.40.desc: "After years overseeing the realm's distant colonial holdings — navigating frontier hardship, local ambition, and the tangled politics of distant governors — the minister has made their way home. They return not as they left."
 cc_prog.40.a: "Welcome the governor home. The realm is the richer for it."
