l_english:
 # ============================================================
 # War Council Events (Pillar 04)
 # ============================================================

 # --- cc_wc.1 — The Council of War ---
 cc_wc.1.title: "The Council of War"
 cc_wc.1.desc: "[scope:minister.GetName] convenes the council around the campaign maps. [scope:minister.GetHerHis.Cap] assessment of the military situation shapes what options are laid before the throne."

 cc_wc.1.a: "Press the offensive — seize the moment."
 cc_wc.1.a.tooltip: "The [scope:minister.GetName]'s advocacy for aggressive campaigning emboldens the army. Morale surges, but the strategic overextension risks political instability at home."

 cc_wc.1.b: "Counsel patience — let the enemy tire."
 cc_wc.1.b.tooltip: "The minister's doctrine of patient defense takes hold. Enemy columns will suffer badly in our territory, and the cost of maintaining our forts falls."

 cc_wc.1.c: "Pledge no peace short of total victory."
 cc_wc.1.c.tooltip: "The hawk's demand for unconditional terms rallies the court. Prestige accrues, and the ministers are bound to prosecute the war to its conclusion."

 cc_wc.1.d: "The minister's counsel steadies the campaign."
 cc_wc.1.d.tooltip: "Sound professional advice from [scope:minister.GetName] keeps the council from rash decisions. Experience grows with every campaign planned."

 # --- cc_wc.2 — Financing the War ---
 cc_wc.2.title: "Financing the War"
 cc_wc.2.desc: "The treasury is under strain. [scope:minister.GetName] has been summoned to present a solution — or at least a frank account of how dire the situation truly is."

 cc_wc.2.a: "Squeeze the population — extract what is needed."
 cc_wc.2.a.tooltip: "The minister's administrative grip forces additional revenues from the realm. Peasant resentment rises, and stability frays under the pressure."

 cc_wc.2.b: "Negotiate war loans — gold now, interest later."
 cc_wc.2.b.tooltip: "The minister brokers short-term financing from merchant houses and money-lenders. The treasury swells, but inflation is the inevitable companion of borrowed gold."

 cc_wc.2.c: "Weather the shortage — cut expenses and endure."
 cc_wc.2.c.tooltip: "No elegant solution presents itself. The realm tightens its belt, but morale at court suffers from the visible weakness."

 # --- cc_wc.3 — The General's Request ---
 cc_wc.3.title: "The General's Request"
 cc_wc.3.desc: "[scope:minister.GetName] has submitted a formal request to the council: the campaign requires more resources if it is to succeed. The crown must decide whether the army or the treasury comes first."

 cc_wc.3.a: "Grant the resources — let the army do its work."
 cc_wc.3.a.tooltip: "Reinforcements, supplies, and coin flow to the front. The army's morale surges, and [scope:minister.GetName]'s confidence in the crown is restored."

 cc_wc.3.b: "Refuse — the treasury cannot bear it."
 cc_wc.3.b.tooltip: "[scope:minister.GetName] receives the refusal with poorly concealed contempt. [scope:minister.GetHerHis.Cap] opinion of the crown's commitment to the war is permanently diminished."

 # --- cc_wc.10 — Standing Army Reform ---
 cc_wc.10.title: "The Standing Army Proposal"
 cc_wc.10.desc: "With the war concluded and the battlefield lessons fresh in [scope:minister.GetName]'s mind, the minister has drafted a formal proposal: replace the feudal levy system with a professional standing army financed by the crown. The nobles will not welcome the shift."

 cc_wc.10.a: "Enact the standing army reform."
 cc_wc.10.a.tooltip: "A standing force is established — trained, maintained, and loyal to the crown alone. Discipline and manpower improve substantially, but the nobility loses prestige and levy authority."

 cc_wc.10.b: "Decline — the nobility would not permit it."
 cc_wc.10.b.tooltip: "The proposal is shelved. The window for reform passes without consequence."

 # --- cc_wc.11 — Supply Reform ---
 cc_wc.11.title: "The Supply Reform Proposal"
 cc_wc.11.desc: "[scope:minister.GetName] has presented a detailed audit of the last campaign's logistics failures. [scope:minister.GetHerHis.Cap] proposal for a reformed commissariat would eliminate the waste and attrition that cost the army so dearly — but the initial investment is substantial."

 cc_wc.11.a: "Fund the commissariat reform."
 cc_wc.11.a.tooltip: "A proper commissariat is established. Supply columns now keep pace with the army, and wastage from attrition falls sharply across all campaigns."

 cc_wc.11.b: "The cost is too great — decline."
 cc_wc.11.b.tooltip: "The proposal is too expensive given current conditions. The reform window passes."

 # --- cc_wc.12 — Fortification Doctrine ---
 cc_wc.12.title: "The Fortification Doctrine"
 cc_wc.12.desc: "Having studied enemy siegecraft throughout the campaign, [scope:minister.GetName] proposes a comprehensive revision of fortification policy: standardised bastion designs, regular garrison rotations, and a unified maintenance schedule. It will cost the treasury dearly, but enemies will find our territory far more costly to cross."

 cc_wc.12.a: "Invest in the new fortification doctrine."
 cc_wc.12.a.tooltip: "Our forts are rebuilt and rationalised. Maintenance costs fall under the new schedule, and hostile armies marching through our territory will bleed for every league."

 cc_wc.12.b: "Too expensive — decline the proposal."
 cc_wc.12.b.tooltip: "The reform is deferred. The five-year window for post-war reform closes."

 # --- cc_wc.20 — Outdated General Resolution ---
 cc_wc.20.title: "A Council Decision on the Old General"
 cc_wc.20.desc: "The council has raised what many have whispered for months: [scope:minister.GetName]'s tactics belong to an earlier age. The campaign has exposed the gap between [scope:minister.GetHerHis] methods and the modern battlefield. The ministers propose a formal, dignified retirement — but it will not go unnoticed."

 cc_wc.20.a: "Retire [scope:minister.GetName] with honour."
 cc_wc.20.a.tooltip: "The council formally retires the general from active command. The prestige cost of removing a veteran is real, but the cabinet is freed from an outdated voice."

 cc_wc.20.b: "Let [scope:minister.GetName] serve out the campaign."
 cc_wc.20.b.tooltip: "The old soldier knows these particular battlefields well enough. The council's deference earns modest prestige — there is dignity in loyalty."

 # ============================================================
 # War Council Modifier Names
 # ============================================================
 cc_wc_offensive_surge: "Offensive Surge"
 cc_wc_offensive_surge_desc: "The War Council has endorsed an aggressive forward campaign. Army morale and recovery are elevated while the surge lasts."

 cc_wc_defensive_posture: "Defensive Posture"
 cc_wc_defensive_posture_desc: "The War Council counsels patience. Hostile armies suffer heavy attrition crossing our territory, and fortification upkeep is reduced."

 cc_standing_army_reform: "Standing Army Reform"
 cc_standing_army_reform_desc: "A professional standing force has replaced the old levy system. Discipline is tighter and manpower pools have grown."

 cc_supply_reform: "Supply Reform"
 cc_supply_reform_desc: "A reformed commissariat keeps the army supplied on campaign. Troop attrition is substantially reduced."

 cc_fortification_doctrine: "Fortification Doctrine"
 cc_fortification_doctrine_desc: "Standardised bastion designs and garrison rotations make our fortifications more efficient and our territory more costly to invade."

 cc_wc_general_defied: "General Defied"
