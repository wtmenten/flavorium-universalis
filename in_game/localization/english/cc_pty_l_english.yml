 # ---- New actions ----
 cc_pty_election: "Call an Election"
 cc_pty_election_desc: "Dissolve the chamber and count the seats again now, instead of at the next review. Parties that have lost their footing may be replaced. Once every ten years."
 cc_pty_tt_appoint_effect: "The party's leader takes a seat in the cabinet, replacing the least senior minister of another party if no seat is open."
 cc_pty_tt_concede_effect: "The agenda counts as met: this party gains 30 satisfaction and we gain political influence equal to half its seats. Every party opposed to it loses 10."
 cc_pty_tt_election_effect: "The seats are counted again and the parties are reviewed now. We gain 2 political influence for each seat the head of the cabinet's party gains, and lose 1 for each seat it loses."
