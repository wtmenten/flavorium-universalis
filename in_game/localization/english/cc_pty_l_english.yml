 CC_PTY_EXP_HEAD: "Head of the cabinet"
 CC_PTY_EXP_HEAD_TT: "+15 while the head of the cabinet belongs to this party."
 CC_PTY_EXP_RULER: "The ruler"
 CC_PTY_EXP_RULER_TT: "+10 while the ruler belongs to this party."
 CC_PTY_EXP_COMP: "Shape of the cabinet"
 CC_PTY_EXP_COMP_TT: "In a stacked cabinet, +10 for the party that runs it and -10 for every other. In a balanced cabinet, the expectation never falls below -20."
 CC_PTY_TARGET_TT: "What the party expects. Each review moves its satisfaction halfway there, and on the party card the arrow shows which way it is moving. Select the party to see what adds up to it: the first three rows are what this party watches in the realm (hover one to see how to move it), the rest come from the cabinet."
