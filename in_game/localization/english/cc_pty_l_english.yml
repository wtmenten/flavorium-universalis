l_english:
 # Flavorium Universalis - Factions (hand-written keys)
 # Party names, agendas, per-party modifiers and action names are generated into
 # cc_pty_catalogue_l_english.yml by tools/generate_factions.py.

 # ---- Situation ----
 cc_pty_factions: "Factions"
 cc_pty_factions_desc: "The parties of the realm, how much of its power each one holds, and how well each thinks it is being treated."
 cc_pty_legend_lt_low: "Liberal Thought: present"
 cc_pty_legend_lt_mid: "Liberal Thought: 30 or more"
 cc_pty_legend_lt_high: "Liberal Thought: 60 or more"
 cc_pty_map_tt_lt: "Liberal Thought here grows with literacy, the court, the Enlightenment and a liberal society, and falls while the Absolutists lead the realm."

 # ---- Panel ----
 CC_PTY_HEADER: "The Chamber"
 CC_PTY_HEADER_DESC: "Four parties sit in the chamber. Which four depends on the government, the age and the estates, and the line-up is reviewed every fifteen to twenty-five years.\n\n#T Seats#! come from the realm itself: every megalopolis is worth 3, every city 2, every town 1 and every rural settlement a fifth of one, and each location's seats are shared among the estates by their power there. A party takes the seats of its estates. The chamber holds 20 to 84 seats however large the realm, so seats are a share, not a count of locations. Each minister in the cabinet also brings their party 2 appointed seats, up to half the chamber. A party's #T power#! is its share of the seats.\n\n#T Satisfaction#! is reviewed every two to four years and moves halfway toward what the party expects. Each party watches three things of its own, such as the crown's power, army upkeep, taxes on its estate or how far society leans its way, and also counts its ministers. Select a party to see each term. Pleased parties help the realm and their ministers work harder; angry ones do the opposite, more so the more seats they hold.\n\nThe #T Hawks#!, the #T Particularists#! and the #T Liberals#! must be handled: left angry with a fifth of the seats, they escalate to a coup, a rising or an uprising."
 CC_PTY_LABEL_POWER: "Power"
 CC_PTY_LABEL_SATISFACTION: "Satisfaction"
 CC_PTY_LABEL_MEMBERS: "Ministers"
 CC_PTY_LABEL_AGENDA: "Agenda:"
 CC_PTY_LABEL_CABINET: "Cabinet:"
 CC_PTY_LABEL_LIBERAL_THOUGHT: "Liberal Thought"
 CC_PTY_POWER_TT: "This party's share of the combined strength of all four parties. Strength comes from its estates' power, plus 8 for each of its ministers in the cabinet. An attack cuts it by 40% for five years."
 CC_PTY_SAT_TT: "From -100 to 100. Reviewed every two to four years, moving halfway toward what the party expects (the number after the arrow; select the party to see why). A minister of the party being seated or dismissed moves it by 10 at once."
 CC_PTY_MEMBERS_TT: "Ministers in the cabinet who belong to this party."
 CC_PTY_AGENDA_TT: "A party with a quarter of the seats or more sets an agenda every five to twelve years and gives the government six years to meet it. Met: +30 satisfaction, and political influence equal to half the party's seats. Missed: -25."
 CC_PTY_DOMINANT_TT: "#P Leading.#! The strongest party, with 30% power or more. Society moves its way: half as fast under a balanced cabinet, half again as fast if it also runs a stacked cabinet."
 CC_PTY_MOOD_PLEASED_TT: "#P Pleased.#! Satisfaction above 30. The realm gets this party's goodwill modifier, scaled by its power and satisfaction, and its ministers work 5% better."
 CC_PTY_MOOD_CONTENT_TT: "Content. Satisfaction from -20 to 30. No effect either way."
 CC_PTY_MOOD_DISCONTENT_TT: "#N Discontent.#! Satisfaction from -50 to -20. The realm gets this party's discontent modifier, scaled by its power and satisfaction, and its ministers work 10% worse."
 CC_PTY_MOOD_ANGRY_TT: "#N Angry.#! Satisfaction below -50. The realm gets this party's discontent modifier, scaled by its power and satisfaction, and its ministers work 20% worse."
 CC_PTY_ESC_1_TT: "#N Warning.#! This party is angry and holds 20% power or more: one review spent like this. Another brings unrest, and a third the outcome. Raise its satisfaction above -50 or cut its power below 20% to step it back down."
 CC_PTY_ESC_2_TT: "#N Unrest.#! This party is angry and holds 20% power or more, and has been for two reviews. One more and it acts. Raise its satisfaction above -50 or cut its power below 20% to step it back down."
 CC_PTY_COMP_STACKED_TT: "#T Stacked#!, by the party shown. One party holds more than half the cabinet seats. +5% cabinet efficiency and +10% political influence gain, and that party's goodwill and push are stronger. Every other party expects 10 less satisfaction, and the court's rivalry grows."
 CC_PTY_COMP_BALANCED: "Balanced"
 CC_PTY_COMP_BALANCED_TT: "No party holds more than 40% of the seats and at least three are seated. +0.5 monthly political influence, stability is cheaper, bribes and attacks cost 25% less, and no party's satisfaction target falls below -20. Goodwill bonuses are 25% weaker and society moves half as fast."
 CC_PTY_COMP_MIXED: "Mixed"
 CC_PTY_COMP_MIXED_TT: "Neither stacked nor balanced. Fewer than three seats, or no clear pattern."
 CC_PTY_TERMLIMITS: "#T Term limits#!"
 CC_PTY_TERMLIMITS_TT: "While the Reformers or the Liberals lead the realm, a minister who has served ten years leaves office at the next review and cannot return for ten years."
 CC_PTY_LIBERAL_THOUGHT_TT: "The average of Liberal Thought in the capital and the cities, shown on the map by this situation. It grows with literacy, the Enlightenment and a liberal society. At 50 the Liberals form."
 CC_PTY_BTN_BRIBE: "Bribe"
 CC_PTY_BTN_ATTACK: "Attack"
 CC_PTY_BTN_FAVOUR: "Favour"

 # ---- Action requirements ----
 cc_pty_tt_bribe_cooldown: "This party was bribed less than two years ago"
 cc_pty_tt_attack_cooldown: "This party was attacked less than five years ago"
 cc_pty_tt_attack_power: "The party holds at least 10% power"
 cc_pty_tt_favour_cooldown: "This party granted a favour less than five years ago"
 cc_pty_tt_favour_sat: "The party's satisfaction is at least 10"

 # ---- Rebels ----
 cc_pty_regional_rebels: "Provincial League"
 cc_pty_liberal_rebels: "Constitutional Clubs"

 # ---- Disasters ----
 cc_pty_praetorian_coup: "The Officers' Coup"
 cc_pty_praetorian_coup_desc: "The Hawks have run out of patience. Officers have taken the guardrooms, ministers are afraid to go home, and nothing the government orders is carried out until the army agrees to it. It ends when the Hawks are satisfied again, or after five years."
 cc_pty_liberal_uprising: "The Liberal Uprising"
 cc_pty_liberal_uprising_desc: "The liberal clubs are in the streets. They want a constitution, limits on the crown and a say in government, and they will not go home without some of it.\n\nThe uprising has a momentum, shown above, that starts at 60. It rises by 1 a month while nothing is done. It falls once the Liberals' grievance is addressed: their expected satisfaction at 0 or more, a Liberal minister in the cabinet, society at 30 or more toward Liberalism, or term limits in force. Events during the uprising move it further. At 0 the uprising ends. At 100 the crown must grant a constitution or fight a civil war. After five years it ends unresolved."

 # ---- Events ----
 cc_pty.10.title: "New Parties"
 cc_pty.10.desc: "The old alignments have broken up and new ones have formed in their place. The realm's politics are now divided between the [ROOT.GetCountry.Custom('cc_pty_name_1')], the [ROOT.GetCountry.Custom('cc_pty_name_2')], the [ROOT.GetCountry.Custom('cc_pty_name_3')] and the [ROOT.GetCountry.Custom('cc_pty_name_4')].\n\nParties that survived keep their standing. New ones start with none, and ministers whose party has dissolved will find another."
 cc_pty.10.a: "We will learn their names."
 cc_pty.20.title: "An Agenda"
 cc_pty.20.desc: "The leaders of the [ROOT.GetCountry.Custom('cc_pty_event_name')] have sent the government their demands. They want one thing above all:\n\n#T [ROOT.GetCountry.Custom('cc_pty_event_agenda')]#!\n\nThey will give us six years. If it is done, they will remember it. If it is not, they will remember that too."
 cc_pty.20.a: "We will see what can be done."
 cc_pty.20.a.tt: "Meet the agenda within six years for +30 satisfaction with this party. Miss it and lose 25."
 cc_pty.20.b: "The government does not take orders."
 cc_pty.30.title: "Crossing the Floor"
 cc_pty.30.desc: "[cc_pty_defector.GetName] has had enough of the [ROOT.GetCountry.Custom('cc_pty_defect_from_name')]. Its quarrel with the government has become their quarrel, and they have been seen dining with the leaders of the [ROOT.GetCountry.Custom('cc_pty_defect_to_name')]. They have asked whether the government would object."
 cc_pty.30.a: "Let them go where they like."
 cc_pty.30.b: "Remind them who appointed them."
 cc_pty.30.c: "Then they can leave the cabinet as well."
 cc_pty.40.title: "The Officers Move"
 cc_pty.40.desc: "The Hawks have stopped asking. Officers loyal to them have occupied the guardrooms and the arsenals, and their spokesmen have presented the government with terms. Nobody has been harmed yet."
 cc_pty.40.a: "Give the officers what they want."
 cc_pty.40.b: "Arrest the ringleaders."
 cc_pty.41.title: "The Provinces Rise"
 cc_pty.41.desc: "The provincial lords have formed a league against the capital. They want their old rights back, their own judges and their own taxes, and they are raising men to make the point."
 cc_pty.41.a: "The realm will not be divided."
 cc_pty.41.a.tt: "A rebel league takes about a fifth of our provinces, never the capital's, and a civil war begins."
 cc_pty.41.b: "Grant the provinces their rights."
 cc_pty.42.title: "The Clubs Take to the Streets"
 cc_pty.42.desc: "The Liberals' clubs have called their members out. There are crowds in the squares, printed demands on every door and soldiers who are not sure whose side they are on.\n\nNo single answer will send them home. The uprising starts with a momentum of 60 and keeps rising until their grievance is addressed. At 0 it ends; at 100 the crown must grant a constitution or fight."
 cc_pty.42.a: "Concede some reforms."
 cc_pty.42.b: "Close the clubs and arrest the leaders."
 cc_pty.42.c: "Wait and see."
 cc_pty.43.title: "The Subjects Pull Away"
 cc_pty.43.desc: "The Particularists have carried their quarrel with the capital to our subjects, and they have listened. Their courts are slower to answer our letters and quicker to talk to each other."
 cc_pty.43.a: "Let them sulk."
 cc_pty.43.b: "Pay for their goodwill."
 cc_pty.45.title: "The Officers Stand Down"
 cc_pty.45.desc: "The officers have returned to their barracks. Whatever was promised or threatened, the government governs again."
 cc_pty.45.a: "Good."
 cc_pty.46.title: "The Streets Are Quiet"
 cc_pty.46.desc: "The crowds have gone home and the clubs have gone back to arguing among themselves."
 cc_pty.46.a: "Good."
 cc_pty.47.title: "The Crown Must Answer"
 cc_pty.47.desc: "The clubs have outgrown the squares. Their leaders sit as a standing assembly, the guilds collect taxes on their behalf, and the garrison will no longer march against them. They demand a written constitution. The government can grant it, or try to take the cities back by force."
 cc_pty.47.a: "Grant the constitution."
 cc_pty.47.b: "We will not be dictated to."
 cc_pty.47.b.tt: "A rebel faction takes the provinces of our most liberal cities, up to about a sixth of the realm and never the capital's, and a civil war begins."
 cc_pty.48.title: "The Clubs Endure"
 cc_pty.48.desc: "The crowds have thinned and the squares are open again, but nothing was settled. The clubs still meet, their papers still circulate, and the next quarrel with the government will find them ready."
 cc_pty.48.a: "It is quiet, at least."
 cc_pty.50.title: "The Liberals"
 cc_pty.50.desc: "Liberal Thought has spread far enough in our cities that it now has a party of its own. It wants constitutional government, limits on the crown and offices open to merit. It will take a place among the realm's parties at once."
 cc_pty.50.a: "We will have to deal with them."
 cc_pty.60.title: "Term Limits"
 cc_pty.60.desc: "The reformers now lead the realm, and they have had their way: no minister should hold office for life. From now on a minister who has served ten years steps down at the next review, and may not return for ten more."
 cc_pty.60.a: "So be it."
 cc_pty.61.title: "Term Limits Lifted"
 cc_pty.61.desc: "The reformers no longer lead the realm, and the rule that ministers step down after ten years has lapsed."
 cc_pty.61.a: "So be it."
 cc_pty.70.title: "The Pamphlet War"
 cc_pty.70.desc: "The clubs' presses run day and night. Every week brings a new pamphlet on the rights of citizens and the failings of the government, and they are read aloud in every tavern."
 cc_pty.70.a: "Censor the presses."
 cc_pty.70.b: "Answer them in print."
 cc_pty.70.c: "Let them print."
 cc_pty.71.title: "A Petition to the Throne"
 cc_pty.71.desc: "A delegation of respectable citizens has brought a petition to the palace gates, signed by thousands. They ask to present it in person."
 cc_pty.71.a: "Receive the petitioners."
 cc_pty.71.b: "Turn them away."
 cc_pty.72.title: "Soldiers in the Crowd"
 cc_pty.72.desc: "Men of the city garrison, months behind on their pay, have been seen at the clubs' meetings. Their officers report that they may not obey an order to clear the streets."
 cc_pty.72.a: "Pay the garrison's arrears."
 cc_pty.72.b: "Bring in loyal regiments."
 cc_pty.72.c: "Leave them be."
 cc_pty.73.title: "The Shops Close"
 cc_pty.73.desc: "The guilds have closed their shops in support of the clubs. Markets are empty and the customs houses take nothing."
 cc_pty.73.a: "Meet the guilds."
 cc_pty.73.b: "Break the strike."
 cc_pty.74.title: "A Martyr"
 cc_pty.74.desc: "A club speaker arrested last month has died in custody. His funeral drew the largest crowd the city has seen, and his name is now painted on the walls."
 cc_pty.74.a: "Hold a public inquiry."
 cc_pty.74.b: "Blame foreign agitators."
 cc_pty.75.title: "The Moderates Offer Terms"
 cc_pty.75.desc: "The more cautious club leaders have sent word that they would settle for less than a constitution: a voice in taxation and protection from arbitrary arrest. The radicals will call it betrayal, but many would follow the moderates home."
 cc_pty.75.a: "Accept their terms."
 cc_pty.75.b: "Hold out for more."

 # ---- Hand-written modifiers (main_menu/common/static_modifiers/cc_pty_modifiers.txt) ----
 STATIC_MODIFIER_NAME_cc_pty_member_content: "Party Pleased"
 STATIC_MODIFIER_DESC_cc_pty_member_content: "This minister's party is pleased with the government, and the minister works accordingly."
 STATIC_MODIFIER_NAME_cc_pty_member_discontent: "Party Discontent"
 STATIC_MODIFIER_DESC_cc_pty_member_discontent: "This minister's party is unhappy with the government. The minister does what is required and little more."
 STATIC_MODIFIER_NAME_cc_pty_member_angry: "Party Angry"
 STATIC_MODIFIER_DESC_cc_pty_member_angry: "This minister's party is openly hostile to the government, and the minister is expected to show it."
 STATIC_MODIFIER_NAME_cc_pty_comp_stacked: "Stacked Cabinet"
 STATIC_MODIFIER_DESC_cc_pty_comp_stacked: "One party holds more than half the cabinet seats. The cabinet works as one, and the other parties notice."
 STATIC_MODIFIER_NAME_cc_pty_comp_balanced: "Balanced Cabinet"
 STATIC_MODIFIER_DESC_cc_pty_comp_balanced: "No party holds more than 40% of the cabinet seats. Every party has a voice, and none feels shut out."
 STATIC_MODIFIER_NAME_cc_pty_regional_concession: "Provincial Rights"
 STATIC_MODIFIER_NAME_cc_pty_liberal_constitution: "Constitution"
 STATIC_MODIFIER_DESC_cc_pty_liberal_constitution: "The crown granted a constitution to end a liberal uprising. Its powers are limited by law, and the towns have a voice in government."
 STATIC_MODIFIER_DESC_cc_pty_regional_concession: "The provinces were granted their old rights to end a rising, and the capital's writ runs less far for it."

