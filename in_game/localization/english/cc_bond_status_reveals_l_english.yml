l_english:
 # === cc_bonds.2 — A Colonial Horizon ===
 cc_bonds.2.title: "A Colonial Horizon"
 cc_bonds.2.desc: "Word has reached every court in the world: [bond_subj.GetName] has become the first colonial nation of this era — a permanent settlement across the sea, governed at a distance, sustained by the will of [bond_subj.GetOverlord.GetName]. It is a threshold. The world is larger than it was yesterday."
 cc_bonds.2.a: "A remarkable achievement. Let the court know we are proud."
 cc_bonds.2.b: "Note the development and carry on."

 # === cc_bonds.3 — The First March ===
 cc_bonds.3.title: "The First March"
 cc_bonds.3.desc: "The institution of the march has been established for the first time in living memory: [bond_subj.GetName] has been elevated to serve as a fortified buffer under the banner of [bond_subj.GetOverlord.GetName]. Where borders are contested and raiders are bold, a march lord stands between civilization and the frontier."
 cc_bonds.3.a: "The frontier shall hold. We honor those who guard it."
 cc_bonds.3.b: "A practical arrangement. Let it be recorded."

 # === cc_bonds.4 — A Formal Compact ===
 cc_bonds.4.title: "A Formal Compact"
 cc_bonds.4.desc: "The first formal compact of this kind has been established: [bond_subj.GetName] enters a structured relationship with [bond_subj.GetOverlord.GetName] — neither simple ally nor conquered province, but something more deliberate. The question of how such relationships are governed has begun to matter."
 cc_bonds.4.a: "A new chapter in the art of governance. We are pleased."
 cc_bonds.4.b: "Document it and proceed."

 # === cc_bonds.5 — Word from the Provinces ===
 cc_bonds.5.title: "Word from the Provinces"
 cc_bonds.5.desc.thriving: "The latest dispatches from [bond_subj.GetName] speak of a prosperous season. Trade moves freely, the harvest was generous, and the people appear content under their current arrangements. Our bond with the subject seems to be bearing fruit."
 cc_bonds.5.desc.strained: "Unsettling reports have reached the capital. Merchants speak of unfair exactions, officials note growing resentment among [bond_subj.GetNameWithNoTooltip]'s population. The relationship, however much we may prefer not to examine it closely, does not appear entirely sound."
 cc_bonds.5.desc.neutral: "Routine dispatches arrive from [bond_subj.GetNameWithNoTooltip]. Administration proceeds as expected, no remarkable incidents are reported. The relationship with [bond_subj.GetNameWithNoTooltip] continues much as it has."
 cc_bonds.5.a: "Respond with personal attention."
 cc_bonds.5.b: "File it with the other reports."

 # === cc_bonds.6 — The Diplomat's Report ===
 cc_bonds.6.title: "The Diplomat's Report"
 cc_bonds.6.desc.content: "Our envoy returns from [bond_subj.GetName] with an encouraging account. The colonists appear to be thriving, commerce is active, and the governor speaks warmly of the Crown's arrangements. There is a palpable sense that the relationship is mutually beneficial."
 cc_bonds.6.desc.discontent: "Our diplomat's report from [bond_subj.GetNameWithNoTooltip] makes for uncomfortable reading. Tax burdens are a recurring grievance, trade restrictions are resented, and there is talk in taverns that the Crown takes more than it gives."
 cc_bonds.6.desc.neutral: "The diplomat's report from [bond_subj.GetNameWithNoTooltip] is unremarkable. Commerce proceeds, administration functions, and there are no pressing concerns to bring to our attention."
 cc_bonds.6.a: "Send a personal commendation to the governor."
 cc_bonds.6.b: "Acknowledge receipt."

 # === cc_bonds.7 — Rumors at Court ===
 cc_bonds.7.title: "Rumors at Court"
 cc_bonds.7.desc.loyal: "Visitors from [bond_subj.GetName] speak with pride of their lord's fealty to the Crown. The nobleman's household toasts the overlord at every feast, and his soldiers are said to train with us in mind. Whatever the court whispers, this one appears genuinely bound to our cause."
 cc_bonds.7.desc.restless: "The court has grown thick with rumors. Travelers from [bond_subj.GetNameWithNoTooltip] speak of a lord who grows distant, whose toasts to the Crown have become perfunctory, whose household quietly conspires about what lies ahead. It may mean nothing. It may not."
 cc_bonds.7.desc.neutral: "Court gossip occasionally drifts back to the march lord. Nothing alarming — the usual complaints about taxes and obligations, mixed with the usual boasts about martial prowess. The relationship seems unremarkable."
 cc_bonds.7.a: "Send a personal letter of regard."
 cc_bonds.7.b: "Dismiss the gossip."

 # === cc_bonds.8 — A Letter from the Dependency ===
 cc_bonds.8.title: "A Letter from [bond_subj.GetNameWithNoTooltip]"
 cc_bonds.8.desc.warm: "A letter arrives from [bond_subj.GetName] bearing every mark of genuine warmth. The ruling house speaks of shared endeavors, of gratitude for the Crown's attentions, of their pride in the connection. It reads less like formal correspondence than a letter from family."
 cc_bonds.8.desc.cold: "A formal letter arrives from [bond_subj.GetNameWithNoTooltip]. The correct courtesies are observed, the seals properly placed, but the warmth is absent. Between the lines of careful phrasing lies the cool distance of a relationship that has been allowed to drift."
 cc_bonds.8.desc.formal: "Seasonal correspondence arrives from [bond_subj.GetNameWithNoTooltip] — correct, well-composed, and entirely unrevealing. The ruling house maintains its obligations. The relationship is intact, if not warm."
 cc_bonds.8.a: "Reply with personal warmth."
 cc_bonds.8.b: "Send a standard acknowledgment."

 # === cc_bonds.9 — The Governor's Annual Dispatch ===
 cc_bonds.9.title: "The Governor's Annual Dispatch"
 cc_bonds.9.desc.harmonious: "The governor's annual report from [bond_subj.GetName] presents an encouraging picture. Revenue is healthy, administration is smooth, and the local population appears to have accommodated Crown authority without friction. The dispatch speaks of a province that functions well under its current arrangements."
 cc_bonds.9.desc.troubled: "The governor's annual report raises several concerns. Revenue collection has met resistance, local officials are uncooperative, and there are passages that seem almost deliberately vague. The province is not in open revolt, but it does not appear content either."
 cc_bonds.9.desc.routine: "The governor's annual dispatch arrives on schedule. Revenue figures are adequate, administrative matters are in order, and no special concerns are noted. [bond_subj.GetNameWithNoTooltip] continues in its accustomed manner."
 cc_bonds.9.a: "Send commendations to the governor."
 cc_bonds.9.b: "File for review."
