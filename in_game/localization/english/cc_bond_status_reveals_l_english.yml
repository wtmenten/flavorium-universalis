l_english:
 # === cc_bonds.5 — Word from the Provinces ===
 cc_bonds.5.title: 0 "Word from the Provinces"
 cc_bonds.5.desc.thriving: 0 "The latest dispatches from our territories speak of a prosperous season. Trade moves freely, the harvest was generous, and the people appear content under their current arrangements. Our bond with the subject seems to be bearing fruit."
 cc_bonds.5.desc.strained: 0 "Unsettling reports have reached the capital. Merchants speak of unfair exactions, officials note growing resentment among the subject's population. The relationship, however much we may prefer not to examine it closely, does not appear entirely sound."
 cc_bonds.5.desc.neutral: 0 "Routine dispatches arrive from the territories. Administration proceeds as expected, no remarkable incidents are reported. The relationship with our subject continues much as it has."
 cc_bonds.5.a: 0 "Respond with personal attention."
 cc_bonds.5.b: 0 "File it with the other reports."

 # === cc_bonds.6 — The Diplomat's Report ===
 cc_bonds.6.title: 0 "The Diplomat's Report"
 cc_bonds.6.desc.content: 0 "Our envoy returns from the colony with an encouraging account. The colonists appear to be thriving, commerce is active, and the governor speaks warmly of the Crown's arrangements. There is a palpable sense that the relationship is mutually beneficial."
 cc_bonds.6.desc.discontent: 0 "Our diplomat's report from the colonial territories makes for uncomfortable reading. Tax burdens are a recurring grievance, trade restrictions are resented, and there is talk in taverns that the Crown takes more than it gives."
 cc_bonds.6.desc.neutral: 0 "The diplomat's report from the colony is unremarkable. Commerce proceeds, administration functions, and there are no pressing concerns to bring to our attention."
 cc_bonds.6.a: 0 "Send a personal commendation to the governor."
 cc_bonds.6.b: 0 "Acknowledge receipt."

 # === cc_bonds.7 — Rumors at Court ===
 cc_bonds.7.title: 0 "Rumors at Court"
 cc_bonds.7.desc.loyal: 0 "Visitors from the march speak with pride of their lord's fealty to the Crown. The nobleman's household toasts the overlord at every feast, and his soldiers are said to train with us in mind. Whatever the court whispers, this one appears genuinely bound to our cause."
 cc_bonds.7.desc.restless: 0 "The court has grown thick with rumors. Travelers from the march — or palatinate — speak of a lord who grows distant, whose toasts to the Crown have become perfunctory, whose household quietly conspires about what lies ahead. It may mean nothing. It may not."
 cc_bonds.7.desc.neutral: 0 "Court gossip occasionally drifts back to the march lord. Nothing alarming — the usual complaints about taxes and obligations, mixed with the usual boasts about martial prowess. The relationship seems unremarkable."
 cc_bonds.7.a: 0 "Send a personal letter of regard."
 cc_bonds.7.b: 0 "Dismiss the gossip."

 # === cc_bonds.8 — A Letter from the Dependency ===
 cc_bonds.8.title: 0 "A Letter from the Dependency"
 cc_bonds.8.desc.warm: 0 "A letter arrives from the dependency bearing every mark of genuine warmth. The ruling house speaks of shared endeavors, of gratitude for the Crown's attentions, of their pride in the connection. It reads less like formal correspondence than a letter from family."
 cc_bonds.8.desc.cold: 0 "A formal letter arrives from the dependency. The correct courtesies are observed, the seals properly placed, but the warmth is absent. Between the lines of careful phrasing lies the cool distance of a relationship that has been allowed to drift."
 cc_bonds.8.desc.formal: 0 "Seasonal correspondence arrives from the dependency — correct, well-composed, and entirely unrevealing. The ruling house maintains its obligations. The relationship is intact, if not warm."
 cc_bonds.8.a: 0 "Reply with personal warmth."
 cc_bonds.8.b: 0 "Send a standard acknowledgment."

 # === cc_bonds.9 — The Governor's Annual Dispatch ===
 cc_bonds.9.title: 0 "The Governor's Annual Dispatch"
 cc_bonds.9.desc.harmonious: 0 "The governor's annual report presents an encouraging picture. Revenue is healthy, administration is smooth, and the local population appears to have accommodated Crown authority without friction. The dispatch speaks of a province that functions well under its current arrangements."
 cc_bonds.9.desc.troubled: 0 "The governor's annual report raises several concerns. Revenue collection has met resistance, local officials are uncooperative, and there are passages that seem almost deliberately vague. The province is not in open revolt, but it does not appear content either."
 cc_bonds.9.desc.routine: 0 "The governor's annual dispatch arrives on schedule. Revenue figures are adequate, administrative matters are in order, and no special concerns are noted. The province continues in its accustomed manner."
 cc_bonds.9.a: 0 "Send commendations to the governor."
 cc_bonds.9.b: 0 "File for review."
