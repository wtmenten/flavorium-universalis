l_english:
 # === cc_bonds.60 — The March Lord's Formal Investiture ===
 cc_bonds.60.title: 0 "The March Lord's Investiture"
 cc_bonds.60.desc: 0 "The new lord of [scope:bond_subj.GetName] is ready to receive his formal investiture. Among frontier lords, ceremony is not mere tradition — it is the language of status, obligation, and trust. A grand ceremony would cost us prestige and gold we might spend elsewhere. A modest ceremony would accomplish the same legal purpose at a fraction of the cost. The march lord's household has been watching how we answer that question."
 cc_bonds.60.a: 0 "Hold a grand ceremony with full noble privileges. This lord deserves it."
 cc_bonds.60.b: 0 "Hold a standard investiture. Proper, dignified, proportionate."
 cc_bonds.60.c: 0 "A minimal ceremony will do. The law requires the oath, not the pageantry."

 # === cc_bonds.61 — Sharing the War Spoils ===
 cc_bonds.61.title: 0 "Sharing the War Spoils"
 cc_bonds.61.desc: 0 "Our forces and the march lord's soldiers fought together in the recent campaign, and now the accounting begins. The march's forces took casualties, garrisoned difficult terrain, and anchored our flank. What share of the spoils they receive is, strictly speaking, our decision to make. They know this. They are watching closely to see whether we remember what they contributed, or whether they will be thanked with words and compensated with nothing."
 cc_bonds.61.a: 0 "Give them a generous share. They earned it, and more."
 cc_bonds.61.b: 0 "Divide the spoils according to standard arrangement."
 cc_bonds.61.c: 0 "The bulk of the spoils belong to the Crown. That is the arrangement."

 # === cc_bonds.62 — March Lord Requests Garrison Funding ===
 cc_bonds.62.title: 0 "Garrison Funding Request"
 cc_bonds.62.desc: 0 "A dispatch from [scope:bond_subj.GetName] sets out the case plainly: the frontier fortifications are deteriorating, the garrison is understrength, and the march lord does not have sufficient revenue to address both problems simultaneously. He is asking for Crown funding. The march exists to defend our frontier, which benefits us as much as him. Whether we choose to acknowledge that shared interest in our allocation — or treat it as his problem alone — will be remembered by every officer in his service."
 cc_bonds.62.a: 0 "Fund the garrison fully. The frontier is our shared responsibility."
 cc_bonds.62.b: 0 "Provide partial funding. We share the cost, they share the rest."
 cc_bonds.62.c: 0 "The frontier is their command. They must fund it themselves."

 # === cc_bonds.63 — The March Lord's Feud ===
 cc_bonds.63.title: 0 "The March Lord's Feud"
 cc_bonds.63.desc: 0 "The march lord of [scope:bond_subj.GetName] has become embroiled in a bitter dispute with a neighboring noble house — a boundary claim that has escalated into an affair of honor. Both parties have appealed to our court. The neighboring house has deeper connections among the nobility, better legal standing on the boundary question, and more friends in the capital. The march lord has something else: he is ours, and he is watching to see if that matters."
 cc_bonds.63.a: 0 "Back the march lord. Whatever the legal merits, he is our man."
 cc_bonds.63.b: 0 "Mediate between the parties. Find a resolution both can accept."
 cc_bonds.63.c: 0 "The law speaks for itself. We find in favor of the neighboring house."

 # === cc_bonds.64 — Frontier Administration Rights ===
 cc_bonds.64.title: 0 "Frontier Administration Rights"
 cc_bonds.64.desc: 0 "The march lord of [scope:bond_subj.GetName] has submitted a formal petition: the frontier population has long been governed under ad hoc arrangements that leave many legal questions unresolved. He proposes that the Crown formally grant the march judicial authority over its own territory — the right to settle disputes, enforce contracts, and levy local penalties. Our legal counsel notes that such authority, once granted, is difficult to recall. Our military counsel notes that a lord with full administrative authority over his territory is far easier to govern than one who must argue every decision through the capital."
 cc_bonds.64.a: 0 "Grant full judicial authority to the march. The frontier needs clear governance."
 cc_bonds.64.b: 0 "Retain Crown judicial rights over the march. Authority remains with us."
 cc_bonds.64.c: 0 "Establish a joint border court. We govern together."

 # === cc_bonds.65 — Campaign Alongside the March Lord ===
 cc_bonds.65.title: 0 "Campaign Alongside the March Lord"
 cc_bonds.65.desc: 0 "The current campaign offers an unusual opportunity. The march lord of [scope:bond_subj.GetName] is engaged on a frontier that our forces are also approaching. We could combine our efforts and fight alongside him personally — or send a royal general in our place — or leave him to operate his theater independently. The fourth option, which our logistics officers have raised, is to redirect his forces entirely to our main front. They would serve us well there. What they would think of the reassignment is a different question."
 cc_bonds.65.a: 0 "I will command alongside the march lord personally."
 cc_bonds.65.b: 0 "Send a royal general. Coordination matters; presence is optional."
 cc_bonds.65.c: 0 "Let the march lord manage his theater independently. He knows it best."
 cc_bonds.65.d: 0 "Reassign the march forces to our main front where they are needed."

 # === cc_bonds.66 — The March Lord's Heir ===
 cc_bonds.66.title: 0 "The March Lord's Heir"
 cc_bonds.66.desc: 0 "The march lord of [scope:bond_subj.GetName] has an heir of suitable age. There is a decision to be made. We could invite the young heir to our court — to learn our ways, build connections among our nobility, and grow up understanding that the Crown is his natural patron. The march lord knows what this means: his son would grow up as much ours as his. Alternatively, we could arrange a favorable marriage that strengthens the family's position without requiring the heir to leave home. Or we could leave the matter for the march lord to handle in his own time."
 cc_bonds.66.a: 0 "Invite the heir to our court as a ward. He will learn to serve the Crown."
 cc_bonds.66.b: 0 "Arrange a prestigious marriage for the heir."
 cc_bonds.66.c: 0 "This is a private matter for the march lord's household."
