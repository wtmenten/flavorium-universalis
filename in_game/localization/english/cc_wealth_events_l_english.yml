 # Wealth Hoarding Events

 cc_wealth.1.title: "Keeping Up Appearances"
 cc_wealth.1.desc: "Our treasury has swelled beyond all practical need. The court grows restless — nobles gossip about miserliness, and lesser powers eye our immobility with curiosity. Appearances must be maintained, one way or another."
 cc_wealth.1.a: "Host the grand ceremonies."
 cc_wealth.1.b: "Our coin has better uses than spectacle."

 cc_wealth.2.title: "A Lavish Party"
 cc_wealth.2.desc: "Our ministers have proposed an extraordinary celebration — a gathering of courts, a festival of the realm. It would cost a considerable sum, but the prestige gained might well be worth the outlay."
 cc_wealth.2.a: "Spare no expense. Let them marvel."
 cc_wealth.2.b: "A quiet evening will suffice."

 cc_wealth.3.title: "The Nobility Demands Construction"
 cc_wealth.3.desc: "The high nobility has grown restless. Our treasury, they say, should be directed toward tangible works — fortifications, manor complexes, institutions that cement noble power. They have come with a price."
 cc_wealth.3.a: "Fund the construction."
 cc_wealth.3.b: "Our treasury is our own to keep."

 cc_wealth.5.title: "The Merchants Demand Investment"
 cc_wealth.5.desc: "The burgher class has grown impatient. Our hoarded treasury, they argue, should be put to work expanding commercial infrastructure. They have presented a proposal — and a price."
 cc_wealth.5.a: "Fund the expansion."
 cc_wealth.5.b: "Their ambitions are not our obligation."

 cc_wealth.6.title: "The Clergy Demand Sacred Works"
 cc_wealth.6.desc: "The clergy have noted the scale of our treasury with spiritual concern. Wealth hoarded brings no blessing, they say — only works dedicated to the divine can justify such accumulation. They have named a price."
 cc_wealth.6.a: "Fund the sacred works."
 cc_wealth.6.b: "The treasury is not a tithe."

 cc_wealth.4.title: "An Ambitious Arrival"
 cc_wealth.4.desc: "Word of our kingdom'''s prosperity has spread. A capable figure — scholar, soldier, or statesman — has arrived at court seeking employment. Their services come at a price, but talent of this kind seldom passes twice."
 cc_wealth.4.a: "Welcome them. Pay the price."
 cc_wealth.4.b: "We have enough at court."

