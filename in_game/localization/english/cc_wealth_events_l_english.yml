 cc_wealth.7.title: "A Profitable Demolition"
 cc_wealth.7.desc: "One of the estates has proposed a peculiar arrangement. In exchange for a significant sum from the treasury, they will clear one of their own estate structures — making the land available for other uses and raising immediate capital. It is an unusual offer, but the gold is real."
 cc_wealth.7.a: "Accept their terms."
 cc_wealth.7.b: "Decline. The arrangement does not suit us."

 cc_wealth.8.title: "A Burgher Investment Proposal"
 cc_wealth.8.desc: "The merchant class has identified a prosperous urban location ripe for expansion. They are willing to fund the groundwork — preparing foundations, clearing lots, coordinating construction — in exchange for a share of the treasury proportional to the location's wealth."
 cc_wealth.8.a: "Accept. Fund the expansion."
 cc_wealth.8.b: "Decline for now."

 cc_wealth_urban_construction: "Burgher Urban Expansion"
 cc_wealth_urban_construction_desc: "The burghers have prepared this location for accelerated development, providing three additional building slots for ten years."
