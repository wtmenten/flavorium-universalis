l_english:
 # ============================================================
 # Balance of Power — coalition congress: parliament, laws & policies
 # ============================================================
 cc_bop_coalition_assembly: "Balancing Congress"

 # --- Defence law ---
 cc_bop_defense_law: "Mutual Defence"
 cc_bop_defense_law_desc: "How readily the coalition rallies to a member under attack by the aspiring hegemon."
 cc_bop_no_defense: "Every State for Itself"
 cc_bop_no_defense_desc: "Members are not called to one another's defensive wars. The coalition is an alliance in name only."
 cc_bop_possible_defense: "Possible Defence"
 cc_bop_possible_defense_desc: "Members may be called to a partner's defensive war, but need not answer."
 cc_bop_mutual_defense: "Mutual Defence"
 cc_bop_mutual_defense_desc: "Members are automatically called to every partner's defensive war, and the bond is strong enough to empower the coalition's standing solidarity."

 # --- Offence law ---
 cc_bop_offense_law: "Strategic Doctrine"
 cc_bop_offense_law_desc: "Whether the coalition may strike first, pre-emptively, against the aspirant."
 cc_bop_no_offense: "Defensive Posture"
 cc_bop_no_offense_desc: "The coalition fights only when attacked. It will not sanction a war of its own making."
 cc_bop_preemptive_doctrine: "Pre-emptive Doctrine"
 cc_bop_preemptive_doctrine_desc: "Members may be called into a partner's offensive war against the aspirant — the political basis for the pre-emptive strike."

 # --- Congress powers law ---
 cc_bop_congress_powers_law: "Congress Powers"
 cc_bop_congress_powers_law_desc: "Whether the congress has voted itself the standing apparatus for collective action."
 cc_bop_congress_dormant: "A Loose Concert"
 cc_bop_congress_dormant_desc: "The congress meets only to talk. It has no standing powers of its own."
 cc_bop_congress_empowered: "An Empowered Congress"
 cc_bop_congress_empowered_desc: "The congress wields standing powers — unlocking the coalition's grand strategic measures and the empowered solidarity of its members."

 # --- Coup law ---
 cc_bop_coup_law: "The Coup-de-Grâce"
 cc_bop_coup_law_desc: "Whether the coalition holds a standing mandate to deliver the decisive, cut-down-to-size blow against a defeated aspirant."
 cc_bop_coup_restrained: "Restraint"
 cc_bop_coup_restrained_desc: "The coalition will not seek the aspirant's ruin. Even ascendant, it stays its hand."
 cc_bop_coup_de_grace: "The Coup-de-Grâce"
 cc_bop_coup_de_grace_desc: "A standing mandate to cut the would-be hegemon down to size in a final, decisive war. Required before an ascendant coalition can deliver its winning blow."

 # --- Per-voter disposition (vote-reasoning tooltip entries) ---
 CC_BOP_VOTE_OPINION_OF_HEGEMON: "Opinion of the aspiring hegemon"
 CC_BOP_VOTE_RIVAL_HEGEMON: "Rivalry with the aspiring hegemon"
 CC_BOP_VOTE_KIN_HEGEMON: "Bound to the hegemon by royal marriage"
 CC_BOP_VOTE_BOUGHT: "Swayed by the hegemon's gold"
 CC_BOP_VOTE_PROXIMITY_BASE: "The colossus looms near"
 CC_BOP_VOTE_DISTANCE_FROM_HEGEMON: "Distance from the hegemon's borders"
 CC_BOP_VOTE_GREAT_POWER_CAUTION: "A great power's wariness of binding commitments"
 CC_BOP_VOTE_SEEKS_PROTECTION: "A lesser power seeks shelter"
 CC_BOP_VOTE_HAWKISH_COURT: "A hawkish court"
 CC_BOP_VOTE_RELUCTANT_COURT: "A reluctant, free-handed court"
 DIPLOMATIC_LAW_CATEGORY: "Diplomatic Laws"

 # ============================================================
 # Special statuses
 # ============================================================
 cc_bop_chief_balancer: "Chief Balancer"
 cc_bop_coalition_seat: "Member of the Coalition"
 cc_concert_president: "President of the Concert"
 cc_concert_seat: "Member of the Concert"

 # ============================================================
 # Coalition — the Settlement law (post-victory)
 # ============================================================
 cc_bop_settlement_law: "The Settlement"
 cc_bop_settlement_law_desc: "What the coalition resolves to do with its victory. If the Concert is to be enacted, the law must be passed while the congress sits — and it will found a lasting institution only if the bloc wins the final war."
 cc_bop_settlement_dissolution: "Dissolution"
 cc_bop_settlement_dissolution_desc: "The alliance of convenience disperses once the peace is won. Each power goes its own way."
 cc_bop_enact_concert: "Enact the Concert of Europe"
 cc_bop_enact_concert_desc: "Resolve to institutionalise the peace. Should the coalition win the final war with this in force, the five greatest victors will found a standing Concert of Europe to manage the continent's affairs."

 # ============================================================
 # Coalition — parliament actions (collective consensus)
 # ============================================================
 cc_bop_pi_coalition_subsidies: "Coalition Subsidies"
 cc_bop_pi_coalition_subsidies_desc: "Pitt's gold: the members fund a common war chest in the leader's hands and the lesser powers are propped up for the campaign. Grants +8 Resolve and hardens the smaller members."
 cc_bop_pi_no_separate_peace: "Treaty of Chaumont"
 cc_bop_pi_no_separate_peace_desc: "A solemn pledge of no separate peace binds the coalition together. Grants +12 Resolve and steadies every member; a deserter still suffers the defector's disgrace."
 cc_bop_pi_combined_command: "The Pragmatic Army"
 cc_bop_pi_combined_command_desc: "A unified command for the duration of the war lends the whole bloc real weight in the field. Grants +5 Resolve and a fighting bonus to every member."
 cc_bop_pi_collective_demarche: "A Joint Démarche"
 cc_bop_pi_collective_demarche_desc: "A collective ultimatum to the aspirant — a public rebuke that shifts the momentum of the contest toward the coalition and sours every member's standing with the hegemon."
 cc_bop_pi_war_aims: "The Partition Treaty"
 cc_bop_pi_war_aims_desc: "The powers agree their war aims in advance. The prospect of gain binds the bloc and steels its resolve for the reckoning. Grants +10 Resolve and a lasting commitment to every member."

 # ============================================================
 # Concert of Europe — congress & laws
 # ============================================================
 cc_concert_assembly: "Congress of the Powers"

 cc_concert_doctrine_law: "Guiding Doctrine"
 cc_concert_doctrine_law_desc: "The animating principle of the Concert — the spirit in which the powers manage the peace."
 cc_concert_balance_of_power: "Balance of Power"
 cc_concert_balance_of_power_desc: "Keep any one power from dominating, and keep the powers talking. The classic statecraft of the cabinet age."
 cc_concert_principle_of_intervention: "The Principle of Intervention"
 cc_concert_principle_of_intervention_desc: "The Holy Alliance and the Troppau Protocol: the powers stand for legitimacy and against revolution, shoring up the thrones — at the cost of friction with the liberal and the restless."
 cc_concert_liberal_internationalism: "Liberal Internationalism"
 cc_concert_liberal_internationalism_desc: "Canningite non-intervention, looking toward a later internationalism: national self-determination and free commerce over the old dynastic order."

 cc_concert_security_law: "Collective Security"
 cc_concert_security_law_desc: "How far the powers will bind themselves to one another's defence."
 cc_concert_ad_hoc: "Concerts as Need Arises"
 cc_concert_ad_hoc_desc: "The powers gather when a crisis demands it, but undertake no standing obligation to one another."
 cc_concert_mutual_guarantee: "Mutual Guarantee"
 cc_concert_mutual_guarantee_desc: "The Quadruple Alliance's guarantee hardened into collective security: an attack on one is an attack on all, and no member may make war on another without just cause."

 cc_concert_congress_law: "The Congress System"
 cc_concert_congress_law_desc: "Whether the Concert sits as a standing congress — the apparatus for collective mediation."
 cc_concert_dormant: "Occasional Congresses"
 cc_concert_dormant_desc: "The congress meets only when summoned. It has no permanent seat."
 cc_concert_standing_congress: "A Standing Congress"
 cc_concert_standing_congress_desc: "The powers sit in permanence and may impose a general peace on the quarrels of Europe (unlocks Congress Mediation)."

 # ============================================================
 # Concert of Europe — parliament actions
 # ============================================================
 cc_concert_pi_mediate_dispute: "Congress Mediation"
 cc_concert_pi_mediate_dispute_desc: "The great achievement of the Congress System: the powers impose a general peace on a member's wars with outsiders."
 cc_concert_pi_mediate_dispute_tt: "White-peace every member's wars against non-members of the Concert."
 cc_concert_pi_collective_intervention: "Collective Intervention"
 cc_concert_pi_collective_intervention_desc: "A coordinated show of force to uphold the settled order — the stronger where the powers have embraced the Principle of Intervention. Grants every member an intervention mandate."
 cc_concert_pi_eastern_question: "The Eastern Question"
 cc_concert_pi_eastern_question_desc: "The powers manage the partition of a declining sphere. The chair gains prestige for stewarding the settlement; the members affirm their spheres of influence."
 cc_concert_pi_admit_power: "Admit a Power"
 cc_concert_pi_admit_power_desc: "A rising power is admitted to the directorate — the strongest eligible outsider takes a seat at the table."
 cc_concert_pi_depose_president: "Vote of No Confidence"
 cc_concert_pi_depose_president_desc: "The members move to unseat the sitting president and elect a new chair from among themselves."

 # ============================================================
 # New vote-reasoning tooltip entries
 # ============================================================
 CC_BOP_LAW_WAR_WEARINESS: "A long contest cries out for a durable peace"
 CC_BOP_HEGEMON_RISING: "The aspirant grows dangerous"
 CC_BOP_RECKONING: "The reckoning is at hand"
 CC_CONCERT_BASE: "Standing inclination"
 CC_CONCERT_HAVE_BETTER: "We prefer another course"
 CC_CONCERT_KEEP: "The settled order should stand"
 CC_CONCERT_LEGITIMIST: "A throne values legitimacy and order"
 CC_CONCERT_LIBERAL_COURT: "A liberal court favours self-determination"
 CC_CONCERT_GREAT_POWER: "A great power's place at the table"
 CC_CONCERT_GREAT_POWER_CAUTION: "A great power is wary of binding obligations"
 CC_CONCERT_SEEKS_PROTECTION: "A lesser power craves the guarantee"
 CC_CONCERT_INTERVENTIONIST: "The Principle of Intervention is in force"
 CC_CONCERT_OPINION_OF_CHAIR: "Our opinion of the sitting president"