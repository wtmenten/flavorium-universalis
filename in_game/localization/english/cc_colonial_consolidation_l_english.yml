l_english:
 # ============================================================
 # Colonial Consolidation & Border Friction — Pillar 07
 # ============================================================

 # --- Section D: Border Friction ---

 cc_colonial.20.title: "The Frontier Quarrel"
 cc_colonial.20.desc: "Word arrives from the New World of trouble along an unmarked frontier. [colony_a.GetName] and its neighbour [colony_b.GetName] — peoples of [colony_a_culture.GetName] stock and another, with little fondness between them — both lay claim to the same stretch of unsurveyed land. Surveyors trade insults, settlers trade blows, and each governor writes to demand the Crown take their side."
 cc_colonial.20.a: "Draw the line in [colony_a.GetName]'s favour. The stronger seat should hold the ground."
 cc_colonial.20.b: "Let the colonists settle it among themselves. The Crown has better things to do."
 cc_colonial.20.c: "Dispatch a royal surveyor at once, before blood is spilled."

 cc_colonial.21.title: "Raids on the Line"
 cc_colonial.21.desc: "The quarrel has curdled into open raiding. Barns burn on both sides of the disputed frontier, and the governors of [colony_a.GetName] and [colony_b.GetName] now speak of one another as enemies rather than neighbours. If the Crown does not act, the colonies may take matters wholly into their own hands."
 cc_colonial.21.a: "Send Crown troops to police the frontier and end the raiding."
 cc_colonial.21.b: "Back [colony_a.GetName]'s claim by force. Let the matter be decided."
 cc_colonial.21.c: "It is a squabble in a far country. Let them bleed."

 cc_colonial.22.title: "The Crown's Arbitration"
 cc_colonial.22.desc: "Royal commissioners have walked the disputed ground, consulted the charters, and drawn a frontier that both [colony_a.GetName] and [colony_b.GetName] can be made to accept. A binding settlement awaits only the Crown's seal."
 cc_colonial.22.a: "Ratify the fair frontier. Let both colonies prosper behind a settled line."
 cc_colonial.22.b: "Have our most able minister broker a generous accord that leaves no one aggrieved."

 # --- Section E: Consolidation / Viceroyalty ---

 cc_colonial.30.title: "A Petition for Unified Governance"
 cc_colonial.30.desc: "Two of our colonies have grown into one another. [colony_a.GetName] and the smaller [colony_b.GetName] — both of [colony_a_culture.GetName] settlers, sharing roads, parishes, and markets — now labour under separate, overlapping administrations. Their governors jointly petition the Crown to rationalise the arrangement before the duplication of offices bleeds the treasury dry."
 cc_colonial.30.a: "Unite them into a single viceroyalty. [colony_b.GetName] shall be folded into [colony_a.GetName]."
 cc_colonial.30.b: "Bind them under a shared council, but let each keep its own seat."
 cc_colonial.30.c: "Leave the arrangement as it stands. Change brings its own troubles."

 cc_colonial.31.title: "The Act of Union of the Colonies"
 cc_colonial.31.desc: "It is done. The territory, revenues, and institutions of [colony_b.GetName] are folded into [colony_a.GetName], which the Crown raises to a vice-regal seat governing the whole consolidated realm. A new viceroyalty takes its place among the jewels of the empire."
 cc_colonial.31.a: "Inaugurate the viceroyalty with all due ceremony."

 cc_colonial.32.title: "Twin Seats Preserved"
 cc_colonial.32.desc: "Rather than dissolve a proud colony into its neighbour, the Crown binds [colony_a.GetName] and [colony_b.GetName] under a shared coordinating council. They will pool their courts, their roads, and their defences while each keeps its own governor and seal."
 cc_colonial.32.a: "Formalise the shared council. Let cooperation do the work of union."

 cc_colonial.33.title: "The Viceroy's First Court"
 cc_colonial.33.desc: "The new viceroyalty of [colony_a.GetName] convenes its first court, and every eye turns to the question of who shall sit at its head. The choice will set the tone of vice-regal rule for a generation."
 cc_colonial.33.a: "Appoint a trusted crown loyalist. Control matters more than goodwill."
 cc_colonial.33.b: "Appoint a respected creole. A contented seat is a prosperous one."

 # --- Section F: Labor & Demographics ---

 cc_colonial.40.title: "The Question of Labor"
 cc_colonial.40.desc: "[colony_a.GetName] has outgrown the makeshift arrangements of its founding. Its plantations and mines cry out for hands, and the manner in which those hands are found will shape the colony — and the Crown's conscience — for generations. The planters, the missions, and the merchant houses each press a different answer."
 cc_colonial.40.a: "Entrench the encomienda. The land will be worked, whatever the cost."
 cc_colonial.40.b: "Charter merchant plantations. Let the burghers run a cash-crop economy."
 cc_colonial.40.c: "Found missions and encourage free settlement. Build a cohesive, devout colony."

 cc_colonial.41.title: "The Mission and the Plantation"
 cc_colonial.41.desc: "On the frontier of [colony_a.GetName], the missions that shelter converts and the planters who covet their labour have come to open dispute. The friars petition for protection of their flock; the planters petition for the hands they say the Crown promised them. Both cannot be satisfied."
 cc_colonial.41.a: "Side with the missions. Protect the converts, and let the planters grumble."
 cc_colonial.41.b: "Side with the planters. Wealth must flow, whatever the friars say."

 cc_colonial.42.title: "Creole Grievances"
 cc_colonial.42.desc_default: "A generation of colonial-born elites has come of age in [colony_a.GetName], and they chafe under rule by metropolitan appointees who arrive knowing nothing of the land and depart having learned little. They petition for office, for recognition, for a voice in their own governance."
 cc_colonial.42.desc_coerced: "A generation of colonial-born elites has come of age in [colony_a.GetName] — and they have grown rich on a coerced-labour economy they now feel entitled to command. They resent the metropolitan appointees set over them and the Crown's distant interference in a society they alone understand. They petition, with an edge of menace, for office and a voice of their own."
 cc_colonial.42.a: "Open offices to the creole elite. Concession now spares revolt later."
 cc_colonial.42.b: "Reaffirm metropolitan control. The colonies are governed from the capital."

 cc_colonial.43.title: "A Demographic Reckoning"
 cc_colonial.43.desc: "Decades of a hardened colonial order have left their mark on [colony_a.GetName]: a society stratified by birth and labour, its divisions written into its very population. The reckoning the Crown long deferred has arrived, and it will not be cheap to address."
 cc_colonial.43.a: "Invest in reconciliation and integration, whatever the cost."
 cc_colonial.43.b: "Accept the divided society as it is. The imprint will endure."
