l_english:

 ########################
 # AGE-SPECIFIC TRAIT NAMES & DESCRIPTIONS
 ########################

 eastern_pragmatist: "Eastern Pragmatist"
 desc_eastern_pragmatist: "Nurtured by the intellectual traditions of the East, this advisor applies a centuries-old culture of scholarly administration to the challenges of the age. Institutions spread more efficiently, and development comes at a measured cost."
 eastern_pragmatist_die_desc: "A measured voice is gone from court. The scholarship and administrative discipline they championed leaves a quieter legacy than many — and perhaps a more lasting one."

 sufi_scholar: "Sufi Scholar"
 desc_sufi_scholar: "Steeped in the mystical and rational traditions of Islamic learning, this advisor bridges doctrine and inquiry. Missionary work is sharpened, heretics receive a more patient hearing, and literacy quietly grows."
 sufi_scholar_die_desc: "The circles of learning this minister kept alive will not easily be replaced."

 cautious_merchant: "Cautious Merchant"
 desc_cautious_merchant: "A merchant by instinct, this advisor views colonial gambles with suspicion — the returns are too slow, the risks too great. Trade flourishes under their guidance, but expeditions lose a quiet advocate."
 cautious_merchant_die_desc: "The ledgers kept balanced by this careful hand outlast the hand itself by a generation."

 reformist_theologian: "Reformist Theologian"
 desc_reformist_theologian: "The religious upheavals of the age have reached beyond Christendom. This advisor, shaped by currents of doctrinal renewal within their own tradition, drives conversion with a reformer's zeal and a scholar's precision."
 reformist_theologian_die_desc: "The internal debates this minister sparked will continue without them."

 orthodox_defender: "Defender of the Faith"
 desc_orthodox_defender: "In a world of shifting doctrine, this advisor holds fast to the established teachings. Heresy is not to be accommodated — correct belief must be defended, whatever the age demands."
 orthodox_defender_die_desc: "The traditions this minister defended remain — at least for now."

 crown_theologian: "Crown Theologian"
 desc_crown_theologian: "This advisor navigates the delicate ground between the church and the crown. By keeping the clergy satisfied and the king's prerogatives intact, they preserve a balance that neither side fully endorses — but both can live with."
 crown_theologian_die_desc: "The careful balance maintained between court and clergy will be sorely tested now that this minister is gone."

 renaissance_humanist: "Renaissance Humanist"
 desc_renaissance_humanist: "Shaped by the flourishing of arts and learning, this advisor champions the free exchange of ideas. They accelerate the spread of new institutions and nurture literacy wherever they serve."
 renaissance_humanist_die_desc: "[CHARACTER.GetName] has died. The libraries [CHARACTER.GetSheHe] founded and the scholars [CHARACTER.GetSheHe] mentored will carry [CHARACTER.GetHerHis] legacy forward."

 age_of_discovery_pioneer: "Pioneer of Discovery"
 desc_age_of_discovery_pioneer: "Forged in the Age of Discovery, this advisor burns with the spirit of exploration. Expedition speed increases, and colonial ventures attract more willing souls."
 age_of_discovery_pioneer_die_desc: "[CHARACTER.GetName] is gone, and the uncharted shores [CHARACTER.GetSheHe] mapped remain as testament to a restless soul."

 age_of_discovery_skeptic: "Skeptic of the Seas"
 desc_age_of_discovery_skeptic: "This advisor counsels caution — the sea lanes are treacherous, the returns uncertain. Expeditions under their shadow move more hesitantly."
 age_of_discovery_skeptic_die_desc: "[CHARACTER.GetName] has passed. Perhaps [CHARACTER.GetSheHe] was right to be cautious."

 reformation_preacher: "Reformation Preacher"
 desc_reformation_preacher: "Shaped by the great religious upheaval of the age, this advisor preaches tolerance as a path to peace. Heretics find a more sympathetic ear at court, and conversion efforts are invigorated."
 reformation_preacher_die_desc: "[CHARACTER.GetName] has died, and the moderate voices [CHARACTER.GetSheHe] championed fall a little quieter."

 reformation_inquisitor: "Reformation Inquisitor"
 desc_reformation_inquisitor: "A product of the confessional wars, this advisor views difference of faith as existential threat. Tolerance for heretics and heathens suffers under their counsel."
 reformation_inquisitor_die_desc: "[CHARACTER.GetName] is gone. Few mourned [CHARACTER.GetHerHim]; fewer still will mourn the passing of [CHARACTER.GetHerHis] rigid certainties."

 absolute_administrator: "Absolute Administrator"
 desc_absolute_administrator: "Trained in the doctrine of sovereign authority, this advisor tightens the crown's grip on local affairs. Control spreads more readily, but the estates chafe under the centralization."
 absolute_administrator_die_desc: "[CHARACTER.GetName] has died. The machinery of control [CHARACTER.GetSheHe] built will outlast [CHARACTER.GetHerHim]."

 noble_patron: "Noble Patron"
 desc_noble_patron: "This advisor knows that noble goodwill is worth more than mere gold. The nobility thrives under their careful stewardship, though enrichment of the great houses is quietly discouraged."
 noble_patron_die_desc: "[CHARACTER.GetName] is gone, and the nobility [CHARACTER.GetSheHe] cultivated will take some time to find a new patron."

 parliamentarian: "Parliamentarian"
 desc_parliamentarian: "A skilled operator in the halls of parliament, this advisor builds broad coalitions and coaxes votes from reluctant members — though revoking noble privileges grows costlier when they hold sway."
 parliamentarian_die_desc: "[CHARACTER.GetName] has died. Whoever fills [CHARACTER.GetHerHis] seat will struggle to match [CHARACTER.GetHerHis] mastery of the chamber."

 privilege_reformer: "Privilege Reformer"
 desc_privilege_reformer: "This advisor believes sovereign authority must not be hobbled by outdated estate prerogatives. Revoking privileges becomes cheaper, though the nobles resent every step."
 privilege_reformer_die_desc: "[CHARACTER.GetName] is gone, and the estates breathe a quiet sigh of relief."

 revolutionary_agitator: "Revolutionary Agitator"
 desc_revolutionary_agitator: "Swept up in the currents of revolution, this advisor's rhetoric inflames as much as it inspires. Rebel factions find fertile soil wherever [CHARACTER.GetSheHe] holds office."
 revolutionary_agitator_die_desc: "[CHARACTER.GetName] has died. Whether the fires [CHARACTER.GetSheHe] lit will burn out or spread remains to be seen."

 counterrevolutionary: "Counterrevolutionary"
 desc_counterrevolutionary: "This advisor sees revolution as a catastrophe to be prevented at any cost — including the satisfaction of the very estates whose cooperation the crown needs. Revoking privileges becomes harder as they entrench reactionary interests."
 counterrevolutionary_die_desc: "[CHARACTER.GetName] has passed. The order [CHARACTER.GetSheHe] worked to preserve may not long survive [CHARACTER.GetHerHim]."

 privilege_champion: "Privilege Champion"
 desc_privilege_champion: "In an age of revolution, this advisor fights to reduce the burdens on the crown by stripping away estate prerogatives. Cheaper to revoke, but prosperity suffers as institutional confidence wavers."
 privilege_champion_die_desc: "[CHARACTER.GetName] is gone, and the privileges [CHARACTER.GetSheHe] fought to abolish may find new defenders."

 ########################
 # COUNTRY MODIFIERS
 ########################

 cc_cabinet_ministerial_investment: "Ministerial Investment"
 cc_cabinet_ministerial_investment_desc: "A cabinet member has directed public funds toward lasting improvements in diplomatic standing and national prosperity."

 cc_cabinet_revoke_difficulty: "Estate Resistance"
 cc_cabinet_revoke_difficulty_desc: "Emboldened estates are making it harder for the crown to revoke their privileges."

 cc_cabinet_parliamentary_guidance: "Parliamentary Guidance"
 cc_cabinet_parliamentary_guidance_desc: "A skilled parliamentary hand in the cabinet is improving the crown's influence over the chamber."

 cc_cabinet_diplomatic_influence: "Diplomatic Influence"
 cc_cabinet_diplomatic_influence_desc: "Active diplomacy by a cabinet member has reduced the antagonism our neighbors direct toward us."

 cc_cabinet_provincial_flourishing: "Provincial Flourishing"
 cc_cabinet_provincial_flourishing_desc: "A minister's attention has revitalized this province's prosperity."

 cc_cabinet_pop_conversion: "Ministerial Conversion Drive"
 cc_cabinet_pop_conversion_desc: "A cabinet member is actively promoting religious conversion across the realm."

 cc_cabinet_cultural_outreach: "Cultural Outreach"
 cc_cabinet_cultural_outreach_desc: "A minister is fostering cultural exchange and literacy in this province."

 ########################
 # TRAIT EVENT LOCALIZATION (cc_traits namespace)
 ########################

 # cc_traits.1 — Integration Trait Grant
 cc_traits.1.title: "Integration Work Begins"
 cc_traits.1.desc: "Our minister [minister.GetName], assigned to oversee integration efforts has found their stride. Their approach reflects their capabilities and will leave a lasting mark on how the work is conducted."
 cc_traits.1.a: "Let [minister.GetName] proceed as a [ShowTraitName('iron_integrator')]."
 cc_traits.1.b: "Let [minister.GetName] proceed as a [ShowTraitName('master_integrator')]."
 cc_traits.1.c: "Let [minister.GetName] proceed as a [ShowTraitName('able_integrator')]."
 cc_traits.1.d: "Let [minister.GetName] proceed as a [ShowTraitName('fumbling_integrator')]."
 cc_traits.1.e: "Let's reconsider"

 # ========================
 # NEW AGE TRAITS (cc_traits.30-39)
 # ========================

 dogmatic_zealot: "Dogmatic Zealot"
 desc_dogmatic_zealot: "The fires of religious upheaval have not opened this minister's mind — they have sealed it. A rigid defender of orthodox doctrine, they have made our court less tolerant of dissent and more dependent on clerical goodwill."
 dogmatic_zealot_die_desc: "[CHARACTER.GetName] has passed. Few will miss the rigid certainties [CHARACTER.GetSheHe] enforced — though the clergy may."

 empiricist_counselor: "Empiricist Counselor"
 desc_empiricist_counselor: "Shaped by the new methods of observation and experiment, this minister applies a rigorous empirical approach to governance. Under their influence, research accelerates and the spread of literate administration quietly broadens."
 empiricist_counselor_die_desc: "[CHARACTER.GetName] has died. The habits of careful inquiry [CHARACTER.GetSheHe] modeled will persist longer than any specific discovery [CHARACTER.GetSheHe] made."

 civic_chancellor: "Civic Chancellor"
 desc_civic_chancellor: "Where other ministers see cities, this advisor sees systems of governance waiting to be optimized. Their mastery of urban reform has reduced the cost of construction and made the cabinet a more efficient instrument of the crown's will."
 civic_chancellor_die_desc: "[CHARACTER.GetName] has passed. The civic machinery [CHARACTER.GetSheHe] tuned will continue running — but machines need mechanics."

 chief_cartographer: "Chief Cartographer"
 desc_chief_cartographer: "Blank spaces on a map are not ignorance — they are opportunity. This minister has turned our exploratory ambitions into a systematic enterprise, speeding expeditions and drawing new settlers toward the frontier."
 chief_cartographer_die_desc: "[CHARACTER.GetName] has died. The maps [CHARACTER.GetSheHe] commissioned and corrected will guide our ships long after the cartographer's hand has stilled."

 trade_consortium_minister: "Trade Consortium Minister"
 desc_trade_consortium_minister: "Commerce is the nervous system of empire, and this minister understands every node in the network. Trade centers flourish under their guidance, and diplomatic capacity grows with every new mercantile relationship they cultivate."
 trade_consortium_minister_die_desc: "[CHARACTER.GetName] has passed. The trading relationships [CHARACTER.GetSheHe] maintained will persist — merchants are loyal to profit, not to ministers."

 peace_commissioner: "Peace Commissioner"
 desc_peace_commissioner: "This minister has made tolerance a geopolitical instrument. By reducing the friction between confessions, they have lowered the antagonism our neighbors direct at us and purchased room to maneuver that open conflict would have foreclosed."
 peace_commissioner_die_desc: "[CHARACTER.GetName] has died. The fragile tolerances [CHARACTER.GetSheHe] maintained will be tested now. Let us hope the precedent holds."

 theological_statesman: "Theological Statesman"
 desc_theological_statesman: "Faith and governance are not separate realms for this minister — they are the same project. By aligning clerical interests with the crown's legislative agenda, they have made parliament more tractable and the clergy more invested in the realm's success."
 theological_statesman_die_desc: "[CHARACTER.GetName] has died. The careful balance [CHARACTER.GetSheHe] maintained between church and parliament will require uncommon skill to preserve."

 standing_army_advocate: "Standing Army Advocate"
 desc_standing_army_advocate: "The age of the temporary levy is over — this minister has made the standing army doctrine the permanent foundation of our military power. Discipline has improved, fortification costs have fallen, and the nobility has found a new argument for their indispensability."
 standing_army_advocate_die_desc: "[CHARACTER.GetName] has died. The professional military culture [CHARACTER.GetSheHe] championed will outlast [CHARACTER.GetHerHim] — standing armies, like all institutions, acquire their own momentum."

 tax_inspector_general: "Tax Inspector General"
 desc_tax_inspector_general: "No coin goes uncounted and no exemption passes unscrutinized while this minister holds their post. Court spending has fallen, cabinet efficiency has risen, and the treasury has learned to fear their audits."
 tax_inspector_general_die_desc: "[CHARACTER.GetName] has died. The ledgers [CHARACTER.GetSheHe] kept in such impeccable order will be the first casualty of a less diligent successor."

 national_reformer: "National Reformer"
 desc_national_reformer: "In the age of revolutions, this minister has found a middle path: systematic reform through parliamentary process. Costly governmental changes become more affordable, and parliament's base of support grows where they work."
 national_reformer_die_desc: "[CHARACTER.GetName] has died. The reforms [CHARACTER.GetSheHe] passed through parliament are permanent — the reform tradition [CHARACTER.GetSheHe] established is not."

 industrial_visionary: "Industrial Visionary"
 desc_industrial_visionary: "This minister has glimpsed the future in a printing press and a furnace. The application of new mechanical methods to construction and production has reduced building costs and accelerated the pace at which our realm can grow."
 industrial_visionary_die_desc: "[CHARACTER.GetName] has passed. The machines [CHARACTER.GetSheHe] commissioned will run without [CHARACTER.GetHerHim] — that was always the point."

 # ========================
 # AGE TRAIT EVENTS (cc_traits.30-39)
 # ========================

 cc_traits.30.title: "The Empiricist's Method"
 cc_traits.30.desc: "[minister.GetName] has been experimenting with the new methods of systematic inquiry — observation, hypothesis, verification. The results have been noticed. How shall we direct this methodical mind?"
 cc_traits.30.a: "Appoint [minister.GetName] as our Empiricist Counselor — let the new methods guide our governance."
 cc_traits.30.b: "Encourage [minister.GetName]'s inquiry without formal appointment."

 cc_traits.31.title: "The Urban Reformer"
 cc_traits.31.desc: "[minister.GetName] has been spending considerable time in the capital's workshops and council halls, cataloguing inefficiencies and proposing improvements. The burgher estates have taken notice. How shall we respond?"
 cc_traits.31.a: "Formalize [minister.GetName]'s role as Civic Chancellor — let them systematize what they have begun."
 cc_traits.31.b: "Support [minister.GetName]'s work without a formal appointment."

 cc_traits.32.title: "The Cartographer's Commission"
 cc_traits.32.desc: "[minister.GetName] has been working closely with our explorers and navigators, turning their observations into systematic charts. The work is impressive. How shall we direct it?"
 cc_traits.32.a: "Commission [minister.GetName] as our Chief Cartographer — let the maps guide our ambitions."
 cc_traits.32.b: "Let [minister.GetName] continue without a formal appointment."

 cc_traits.33.title: "The Merchant's Grand Tour"
 cc_traits.33.desc: "[minister.GetName] has returned from an extensive survey of our trade routes and subject territories, full of proposals for consolidating our commercial position. The merchant community is enthusiastic. What is our response?"
 cc_traits.33.a: "Appoint [minister.GetName] as Trade Consortium Minister — let commerce become a diplomatic instrument."
 cc_traits.33.b: "Support [minister.GetName]'s commercial work without formal elevation."

 cc_traits.34.title: "The Peacemaker's Gambit"
 cc_traits.34.desc: "[minister.GetName] has approached our neighbors with a proposal for reducing religious tensions — a calculated risk in a divided age. Some at court applaud the initiative; others see it as weakness. How do we respond?"
 cc_traits.34.a: "Endorse [minister.GetName]'s peacemaking — appoint them as our Peace Commissioner."
 cc_traits.34.b: "Reject the proposal — tolerance is concession to heresy."
 cc_traits.34.c: "Let [minister.GetName] continue quietly, without formal appointment."

 cc_traits.35.title: "The Theological Statesman"
 cc_traits.35.desc: "[minister.GetName] has been building bridges between the clergy and the parliamentary chamber — a delicate project that appears to be working. How shall we formally recognize this achievement?"
 cc_traits.35.a: "Elevate [minister.GetName] as our Theological Statesman — let faith and governance become one project."
 cc_traits.35.b: "Give [minister.GetName] the formal title of Crown Theologian."
 cc_traits.35.c: "Commend [minister.GetName]'s work without formal elevation."

 cc_traits.36.title: "The Standing Army Advocate"
 cc_traits.36.desc: "[minister.GetName] has spent years arguing for the transition to a permanent, professional military — and has recently produced a comprehensive proposal for how to achieve it. The nobles are skeptical but listening. How do we proceed?"
 cc_traits.36.a: "Endorse [minister.GetName]'s proposal — appoint them as our Standing Army Advocate."
 cc_traits.36.b: "Support the concept without formal appointment."

 cc_traits.37.title: "The Tax Inspector"
 cc_traits.37.desc: "[minister.GetName] has conducted a thorough audit of the crown's expenditure and has produced a sobering set of recommendations. The court is uncomfortable, but the numbers do not lie. How do we respond?"
 cc_traits.37.a: "Appoint [minister.GetName] as Tax Inspector General — let every coin be counted."
 cc_traits.37.b: "Adopt some of [minister.GetName]'s recommendations without formal appointment."

 cc_traits.38.title: "The National Minister"
 cc_traits.38.desc: "[minister.GetName] has developed a comprehensive reform program for the parliamentary system — a proposal that could change how governance functions for generations. The chamber is watching."
 cc_traits.38.a: "Commission [minister.GetName] as our National Reformer — let parliament become an instrument of lasting change."
 cc_traits.38.b: "Adopt parts of [minister.GetName]'s program without formal elevation."

 cc_traits.39.title: "The Industrial Visionary"
 cc_traits.39.desc: "[minister.GetName] has returned from an inspection of the capital's workshops with eyes alight. New methods of production, new materials, new possibilities — and a detailed proposal for bringing them to scale. The burgher estates are intrigued."
 cc_traits.39.a: "Commission [minister.GetName] as our Industrial Visionary — let the new methods transform the realm."
 cc_traits.39.b: "Support the initiative without formal appointment."

 # cc_traits.10 — Renaissance-era intellectual trait spawn (culturally branched)
 cc_traits.10.title: "A Scholar of the Age"
 cc_traits.10.desc: "[minister.GetName] has been shaped by the great intellectual currents of this era. The form that learning takes may differ by tradition, but the potential to channel it into service is the same."
 cc_traits.10.a: "A welcome development — let the new learning guide their work."
 cc_traits.10.b: "Embrace a path of practical wisdom and statecraft."
 cc_traits.10.c: "The way of scholarship and contemplation suits them."
 cc_traits.10.d: "Encourage [minister.GetName] to keep observing — the realm may benefit in time."

 # cc_traits.11 — Discovery Pioneer / Skeptic / Cautious Merchant
 cc_traits.11.title: "Forging New Horizons"
 cc_traits.11.desc: "The age of exploration has left its mark on [minister.GetName]. How shall we channel [minister.GetHerHis] relationship with the sea?"
 cc_traits.11.a: "Encourage bold exploration."
 cc_traits.11.b: "Counsel caution and restraint."
 cc_traits.11.c: "Turn their energy toward trade, not distant shores."
 cc_traits.11.d: "Send him to the dockyards!"

 # cc_traits.12 — Reformation / Religious Upheaval traits (culturally branched)
 cc_traits.12.title: "Voices of Reform"
 cc_traits.12.desc: "The fires of religious change have tested [minister.GetName]'s faith. Whether that test has opened [minister.GetHerHis] mind or steeled [minister.GetHerHis] convictions is for us to guide."
 cc_traits.12.a: "Foster tolerance and dialogue."
 cc_traits.12.b: "Uphold the faith against deviation."
 cc_traits.12.c: "Encourage doctrinal renewal within our tradition."
 cc_traits.12.d: "The established teachings must be defended at all costs."
 cc_traits.12.e: "[minister.GetName] refuses to engage with any of this — let it be."

 # cc_traits.13 — Absolutism traits
 cc_traits.13.title: "Governance in the Age of Kings"
 cc_traits.13.desc: "[minister.GetName] has been shaped by the demands of an age when sovereign authority must be consolidated. How [minister.GetSheHe] exercises that conviction will define [minister.GetHerHis] legacy."
 cc_traits.13.a: "Emphasize central control."
 cc_traits.13.b: "Cultivate noble goodwill."
 cc_traits.13.c: "Work through parliament."
 cc_traits.13.d: "Reform the privilege structure."
 cc_traits.13.e: "Let the crown's theologian navigate church and state."

 # cc_traits.14 — Revolutions traits
 cc_traits.14.title: "The Spirit of Revolution"
 cc_traits.14.desc: "The revolutionary age has found [minister.GetName]. Whether [minister.GetSheHe] rides its wave, stands against it, or tries to harness it for the crown will shape what comes next."
 cc_traits.14.a: "Let the revolutionary spirit run."
 cc_traits.14.b: "Stand firm for order and hierarchy."
 cc_traits.14.c: "Use the moment to strip the estates of old privileges."

 # cc_traits.20 — Ruler Teaches
 cc_traits.20.title: "The [Root.GetRulerTitle] Offers Wisdom"
 cc_traits.20.desc: "Our ruler has taken notice of [student.GetName]'s potential. With the right guidance, [student.GetSheHe] could develop into a minister of real distinction. What knowledge shall the crown share?"
 cc_traits.20.a: "Teach [student.GetName] the disciplines of war and command."
 cc_traits.20.b: "Share the arts of learning and legislation."
 cc_traits.20.c: "Impart the wisdom of loyalty and diplomacy."
 cc_traits.20.d: "Another time."

 # cc_traits.21 — Peer Learning
 cc_traits.21.title: "An Eager Young Minister"
 cc_traits.21.desc: "[learner.GetName] has time on [learner.GetHerHis] hands and a sharp mind ready to be shaped. What path should we encourage [learner.GetHerHim] to pursue?"
 cc_traits.21.a: "Encourage scholarly study and learning."
 cc_traits.21.b: "Direct [learner.GetHerHim] toward military doctrine."
 cc_traits.21.c: "Guide [learner.GetHerHim] in diplomacy and statecraft."

 ########################
 # CABINET EVENT LOCALIZATION (cc_cabinet namespace)
 ########################

 # cc_cabinet.1 — The Minister Seeks Counsel
 cc_cabinet.1.title: "The Minister Seeks Counsel"
 cc_cabinet.1.desc: "[minister.GetName] has requested an audience. The minister's counsel has been sound, and perhaps a word of encouragement — or a task — would do them good. What shall we offer?"
 cc_cabinet.1.a: "Recognize [minister.GetHerHis] scholarly work."
 cc_cabinet.1.b: "Acknowledge [minister.GetHerHis] service to the realm."
 cc_cabinet.1.c: "Recognize [minister.GetHerHis] military acumen."
 cc_cabinet.1.d: "Send them back to their duties."

 # cc_cabinet.2 — A Request for Funds
 cc_cabinet.2.title: "A Request for Funds"
 cc_cabinet.2.desc: "[minister.GetName] has submitted a petition to the treasury requesting [minister.GetHerHis] allocation of funds. [minister.GetSheHe] assures us the investment will bear fruit — though [minister.GetSheHe] would say that, wouldn't [minister.GetSheHe]?"
 cc_cabinet.2.a: "Grant the funds."
 cc_cabinet.2.b: "Refuse. The treasury has other needs."

 # cc_cabinet.3 — Funds follow-up
 cc_cabinet.3.title: "The Minister Puts the Funds to Work"
 cc_cabinet.3.desc: "The funds reached [minister.GetName]'s hands and were put to use. Word comes back that the investment has produced meaningful results — or at least, [minister.GetSheHe] says it has."
 cc_cabinet.3.a: "We recovered what we could."

 # cc_cabinet.4 — Parliamentary Affairs (Age of Absolutism)
 cc_cabinet.4.title: "The Minister Advises on Parliamentary Affairs"
 cc_cabinet.4.desc: "[minister.GetName] has spent considerable time studying the workings of parliament and believes there is an opportunity to strengthen the crown's hand within the chamber. What course shall we take?"
 cc_cabinet.4.a: "Work through the chamber more actively."
 cc_cabinet.4.b: "[minister.GetName] should pursue this personally."
 cc_cabinet.4.c: "Let them handle it as they see fit."

 # cc_cabinet.10 — Courting the Estates
 cc_cabinet.10.title: "Courting the Estates"
 cc_cabinet.10.desc: "[minister.GetName]'s connections with the great estates have grown considerable. They now have the influence to shift the balance of power among the noble houses — but every gain for one estate means a loss for another."
 cc_cabinet.10.a: "Favor the nobility over the merchants."
 cc_cabinet.10.b: "Favor the merchants over the nobility."
 cc_cabinet.10.c: "Spread goodwill broadly — at cost to the treasury."
 cc_cabinet.10.d: "Leave the estates to their own devices."

 # cc_cabinet.11 — Estate Grievances
 cc_cabinet.11.title: "Estate Grievances"
 cc_cabinet.11.desc: "[minister.GetName] reports that the estates have grievances that are beginning to fester. Left unaddressed, their dissatisfaction could become a problem. What shall we do?"
 cc_cabinet.11.a: "Spend the gold and smooth things over."
 cc_cabinet.11.b: "Ignore the complaints — we answer to no one."

 # cc_cabinet.12 — Revolutionary Sentiments
 cc_cabinet.12.title: "Revolutionary Sentiments in the Court"
 cc_cabinet.12.desc: "[minister.GetName] has returned from the provinces with tales of revolutionary feeling among the people. The age demands a response. Will we ride the current or stand against it?"
 cc_cabinet.12.a: "Embrace the energy of change."
 cc_cabinet.12.b: "Suppress these dangerous ideas."
 cc_cabinet.12.c: "It is not our affair."

 # cc_cabinet.13 — Minister's Ambitions (Age of Absolutism)
 cc_cabinet.13.title: "The Minister's Ambitions"
 cc_cabinet.13.desc: "[minister.GetName] has grown ambitious in this age of consolidation. They have laid two paths before the crown — one toward reform, one toward stricter control. We must decide."
 cc_cabinet.13.a: "Support the push to reform estate privileges."
 cc_cabinet.13.b: "Centralize control — the estates will adapt."
 cc_cabinet.13.c: "Neither. Stay the current course."

 # cc_cabinet.20 — Diplomatic Overtures
 cc_cabinet.20.title: "Diplomatic Overtures"
 cc_cabinet.20.desc: "[minister.GetName] has been cultivating ties with [neighbor_country.GetName]. There is an opportunity here — shall we use it to build goodwill, or to quietly reduce the tensions that weigh on our reputation?"
 cc_cabinet.20.a: "Formalize our friendship with [neighbor_country.GetName]."
 cc_cabinet.20.b: "Justify aggresive action."
 cc_cabinet.20.c: "Leave the matter alone."

 # cc_cabinet.21 — Border Tensions
 cc_cabinet.21.title: "Border Tensions"
 cc_cabinet.21.desc: "[minister.GetName] reports simmering tensions along the frontier with [neighbor_country.GetName]. This could be an opportunity to establish dominance — or a crisis to be defused quietly."
 cc_cabinet.21.a: "Use the tension to assert ourselves."
 cc_cabinet.21.b: "Dispatch [minister.GetName] to defuse matters discreetly."

 # cc_cabinet.22 — Overseas Contacts
 cc_cabinet.22.title: "Overseas Contacts"
 cc_cabinet.22.desc: "The age of exploration has opened channels of contact that would have seemed impossible a generation ago. [minister.GetName] is at the center of several such relationships. How shall we encourage them?"
 cc_cabinet.22.a: "Let [minister.GetName] lead the way — exploration is the future."
 cc_cabinet.22.b: "Use these contacts to improve our diplomatic position."
 cc_cabinet.22.c: "Focus on existing priorities."

 # cc_cabinet.23 — Religious Tensions Abroad
 cc_cabinet.23.title: "Religious Tensions Abroad"
 cc_cabinet.23.desc: "The reformation has fractured the faith of our neighbors as much as our own. [minister.GetName] has an opportunity to use [neighbor_country.GetName]'s religious divisions to our advantage — or to extend a hand across the divide."
 cc_cabinet.23.a: "Seek common ground with [neighbor_country.GetName]."
 cc_cabinet.23.b: "Exploit the tensions for our benefit."
 cc_cabinet.23.c: "This is not our concern."

 # cc_cabinet.30 — Provincial Investment
 cc_cabinet.30.title: "Provincial Investment"
 cc_cabinet.30.desc: "[minister.GetName]'s work in the provinces has attracted the attention of local notables. With a modest investment, the crown could accelerate development — or channel the energy into lasting prosperity."
 cc_cabinet.30.a: "Invest in direct development."
 cc_cabinet.30.b: "Encourage long-term flourishing."
 cc_cabinet.30.c: "Leave [minister.GetName] to [minister.GetHerHis] own devices."

 # cc_cabinet.31 — Cultural Affairs
 cc_cabinet.31.title: "Cultural Affairs"
 cc_cabinet.31.desc: "[minister.GetName] has been in contact with local communities in [target_province.GetName]. There is an opportunity here — to foster cultural exchange and literacy, or to accelerate religious conversion."
 cc_cabinet.31.a: "Encourage cultural integration and learning."
 cc_cabinet.31.b: "Focus on conversion efforts."
 cc_cabinet.31.c: "Leave the province to its own affairs."

 # cc_cabinet.32 — Confessional Province Work
 cc_cabinet.32.title: "A Minister of Faith"
 cc_cabinet.32.desc: "The reformation has made every province a contested ground of faith. [minister.GetName] has a choice — and so do we. Shall we pursue understanding or orthodoxy?"
 cc_cabinet.32.a: "Pursue active conversion."
 cc_cabinet.32.b: "Uphold the faith with firm resolve."
 cc_cabinet.32.c: "Faith is a private matter."

 # cc_cabinet.33 — Administrative Reform
 cc_cabinet.33.title: "Administrative Reform"
 cc_cabinet.33.desc: "The age demands efficient governance. [minister.GetName] has proposed reforms that would tighten administrative control in [target_province.GetName]. The crown can invest further or leave the minister to their work."
 cc_cabinet.33.a: "Bring [minister.GetName] into the reform effort personally."
 cc_cabinet.33.b: "Invest directly in provincial development."
 cc_cabinet.33.c: "Leave [minister.GetName] to [minister.GetHerHis] own discretion."



 # ============================================================
 # cc_traits.110 — A Scholar's First Work (follow-up to cc_traits.10)
 # ============================================================

 cc_traits.110.title: "A Scholar's First Work"
 cc_traits.110.desc: "Months after [minister.GetName] embraced the spirit of this age of learning, word arrives of their first significant work. Scholars, architects, and courtiers have taken notice — some with admiration, some with suspicion."
 cc_traits.110.a: "Present their work to the court."
