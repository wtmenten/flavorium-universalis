l_english:
 # === cc_bonds.90 — A Loyal Colony in Turbulent Times ===
 cc_bonds.90.title: "A Loyal Colony in Turbulent Times"
 cc_bonds.90.desc: "The Age of Revolutions has arrived and the colonies of the world are stirring. [bond_subj.GetName] is not. Decades of shared governance and economic investment have produced a colonial population that sees its future inside the empire rather than outside it, and a colonial leadership that has spent this year holding its own people back from the pamphlets. That is not luck. It is the ledger."
 cc_bonds.90.desc.deep: "The Age of Revolutions has arrived and the colonies of the world are stirring. In [bond_subj.GetName] the colonial assembly has passed a resolution of loyalty without being asked for one, and the militia has been placed at our disposal rather than kept at home. Their governor writes that he does not expect trouble, and gives reasons rather than assurances. A relationship this deep is worth more to the crown right now than a fleet."
 cc_bonds.90.desc.voice: "The Age of Revolutions has arrived, and in [bond_subj.GetName] the argument is being had in the assembly hall we chartered rather than in the street. The delegates are debating loyalty, taxation and representation at length and in public, and they are doing it as members of the empire rather than as its critics. Every complaint the revolutionaries elsewhere are shouting, this colony has a formal channel for. That channel is why we are reading a transcript instead of a casualty list."
 cc_bonds.90.a: "Recognize their loyalty formally, and let every other colony read about it."
 cc_bonds.90.b: "Press emergency levies while we have their goodwill."
 cc_bonds.90.c: "Invite them to the Imperial Council."

 # === cc_bonds.91 — The Colony Finds Its Voice ===
 cc_bonds.91.title: "The Colony Finds Its Voice"
 cc_bonds.91.desc: "[bond_subj.GetName] has not waited to be told which side it stands on. Revolutionary pamphlets circulate openly, public meetings have become demonstrations, and the mood has moved from grievance to conviction. The ledger of extraction, denied petitions and governors who taxed and took and gave nothing back has been kept carefully. The reckoning is here."
 cc_bonds.91.desc.deep: "[bond_subj.GetName] is no longer arguing with us. The colonial assembly, such as it was, has dissolved itself and reconstituted as something with a different name and a declaration attached. Militia companies are drilling in daylight. Our customs officers have been escorted to the docks with their papers and their dignity intact, which is somehow worse. They are not asking for redress. They are describing what happens next."
 cc_bonds.91.desc.scholar: "The pamphlets circulating in [bond_subj.GetName] are not imported. They are being written there, and they are being written well, by the scholar we decided a generation ago was safer silenced than answered. Suppression did not end the argument; it removed our side from it. The colonial printers cannot keep up with demand, and the demonstrations outside the governor's residence are quoting our own charters back at us."
 cc_bonds.91.desc.faith: "The revolutionary moment has reached [bond_subj.GetName] and the clergy are leading it. The conversion we imposed was accepted in public and resented in private for as long as resentment was all that was available. The old rites have reappeared in the same week as the new pamphlets, and the two are being preached from the same pulpits. Faith and grievance have found each other, and neither is negotiable now."
 cc_bonds.91.a: "Crack down. Make clear who governs this colony."
 cc_bonds.91.b: "Concede everything we should have conceded years ago."
 cc_bonds.91.c: "Release them, before the argument crosses the ocean."

 # === cc_bonds.92 — The Governor Stands With the Crown ===
 cc_bonds.92.title: "The Governor Stands With the Crown"
 cc_bonds.92.desc: "The revolutionary moment that has shaken other provinces finds [bond_subj.GetName] calm. The governor has not merely maintained order; he has rallied the local administration to the crown, suppressed agitation before it took root, and written to explain how rather than to ask for credit. The infrastructure we funded and the administrators we treated as partners are returning dividends now, when it matters."
 cc_bonds.92.desc.deep: "[bond_subj.GetName] is quieter this year than it has been in a decade. The governor has done more than hold his province: he has sent us a working method, tested locally, for keeping a population loyal in an age that rewards the opposite. His officials are competent, his accounts are honest, and his letters read as though the revolution were a weather event he had prepared for. We could use twenty of him."
 cc_bonds.92.desc.council: "The provincial council we chartered has spent this year doing the thing councils are for. It has heard the grievances that are turning into riots elsewhere, argued about them at length, and produced recommendations rather than demands. The governor forwards them with his endorsement. [bond_subj.GetName] is not calm because it is content; it is calm because it has somewhere to put its discontent."
 cc_bonds.92.a: "Commend the governor publicly."
 cc_bonds.92.b: "Send his administrators to our own provinces. We need what he knows."

 # === cc_bonds.93 — The Province Remembers ===
 cc_bonds.93.title: "The Province Remembers"
 cc_bonds.93.desc: "The revolutionary age has reached [bond_subj.GetName], and the province has been waiting for it. The governor's dispatches have grown shorter and his replies slower. The last one described the situation as manageable, which is the bureaucratic word for a situation that is not. Decades of extraction, of governors rewarded for collection rather than governance, of local law overridden for administrative convenience: none of it has been forgotten."
 cc_bonds.93.desc.deep: "The governor of [bond_subj.GetName] has stopped writing. What reaches us instead is a petition, signed by names we do not employ, listing every statute we imposed over local objection with the date and the objection recorded beside it. It is not a threat. It is an indictment, and it is accurate. The province has been keeping this document for a century and has decided the moment has come to file it."
 cc_bonds.93.desc.faith: "The province has taken the revolutionary moment as permission to answer an older question. The conversion we ordered is being reversed in practice faster than we can record it, and the men leading the reversal are the same men we appointed to enforce it. [bond_subj.GetName] is not rejecting the crown's authority in general. It is rejecting the one use of it nobody there ever accepted."
 cc_bonds.93.a: "Pay what is necessary to hold this province. Whatever it costs."
 cc_bonds.93.b: "Hold it with the garrison. Consent is no longer the instrument available."
 cc_bonds.93.c: "The situation is what it is. We manage as best we can."

 # === cc_bonds.94 — The Palatinate Answers the Call ===
 cc_bonds.94.title: "The Palatinate Answers the Call"
 cc_bonds.94.desc: "The Age of Revolutions brings a test of loyalties, and [bond_subj.GetName] has answered it plainly. The palatinate lord has mustered without being asked, written to offer his full military support, and sent his eldest son to serve in our army as a personal gesture. The ceremonies honored, the levies handled fairly, the feuds mediated with patience: he has not forgotten any of it either."
 cc_bonds.94.desc.deep: "The lord of [bond_subj.GetName] arrived at court in person, which he was not required to do, at the head of a column he raised at his own expense, which he was certainly not required to do. He has placed himself and his house under our command for the duration and asked for nothing in writing. In an age when great powers are losing their capitals to their own citizens, one palatinate lord is behaving as though the old obligations still mean what they say."
 cc_bonds.94.desc.interregnum: "The palatinate has mustered, and the lord's letter is warm, and there is a second letter folded inside the first. It concerns the interregnum: the months when the succession was contested, when his house asked the crown to arbitrate and the crown did not answer in time. Nothing was said afterward. He is not saying much now either. He is simply noting that the matter was never settled, and that he is mustering anyway."
 cc_bonds.94.a: "We are honored. The palatinate stands with us."
 cc_bonds.94.b: "Settle the old debt first, then take the field together."
 cc_bonds.94.c: "Ask for his finest knight. We have a war to fight and no one to lead it."

 # === cc_bonds.95 — The Palatinate Declares Armed Neutrality ===
 cc_bonds.95.title: "The Palatinate Declares Armed Neutrality"
 cc_bonds.95.desc: "The lord of [bond_subj.GetName] has sent a formal declaration. He is not joining the revolution. He is also not joining us. The palatinate is in a state of armed neutrality, which means in practice that his forces will defend his territory and no other, that he will not answer calls to arms, and that he intends to see how the age resolves before committing further. Decades of ignored petitions and waived ceremonies produced a lord who has stopped caring whether the crown survives."
 cc_bonds.95.desc.deep: "The declaration from [bond_subj.GetName] is three sentences long and has been copied to every neighboring court before it reached us. The palatinate will defend itself. It will recognize whichever government controls our capital at the end of this. It considers its obligations discharged. The lord has not rebelled, which would at least be a relationship. He has simply written us out of his calculations entirely."
 cc_bonds.95.desc.fort: "The lord's declaration mentions the fortress once, in passing, as the place from which he will be conducting his neutrality. He does not need to say more. We denied the funding, the walls went up anyway on his own coin, and the garrison has answered to his house ever since. We built the grievance and he built the fortress, and now the two are the same object."
 cc_bonds.95.a: "Accept the declaration. Neutrality is better than open revolt."
 cc_bonds.95.b: "Buy the lord back. Whatever the arrears come to, pay them."
 cc_bonds.95.c: "The palatinate answers to us. It will answer now."

 # === cc_bonds.96 — The March Holds the Frontier ===
 cc_bonds.96.title: "The March Holds the Frontier"
 cc_bonds.96.desc: "The revolutionary age has destabilized many borders and [bond_subj.GetName] has held every inch of ours. The march lord has defended the frontier in a way that makes the crown look competent: swift, capable, and clearly acting in our name. His letters are brief and professional. He is not asking for recognition. The ceremonies honored, the spoils shared, the garrison funded, all of it built a military culture that serves us now."
 cc_bonds.96.desc.deep: "[bond_subj.GetName] has spent the year doing something harder than holding the frontier. It has held the frontier while the interior burned, absorbed two waves of refugees from provinces we could not protect, and turned back a probing attack from a neighbor who assumed our troubles were an opportunity. The march lord's dispatch on the subject runs to four lines. Three of them are about supply."
 cc_bonds.96.desc.fort: "The frontier has held, and the fortress we funded is the reason. The march lord's report is largely a list of what the walls made unnecessary: engagements not fought, villages not evacuated, a siege that ended when the besieger counted the guns and went home. Money spent decades ago on stone has turned out to be the cheapest soldiers we ever bought."
 cc_bonds.96.desc.ward: "The young man we raised at court has come home to command his father's forces, and the frontier has never been better held. He knows our staff, our supply system and our expectations, because he grew up inside them, and he knows the ground because he was born on it. What began as a hostage arrangement has produced the one thing no treaty can: a frontier commander who is genuinely ours and genuinely theirs at once."
 cc_bonds.96.a: "The march lord has served the crown well. Say so."
 cc_bonds.96.b: "Bring the ward into our own command. He has outgrown the frontier."

 # === cc_bonds.97 — The March Lord Raises His Own Banner ===
 cc_bonds.97.title: "The March Lord Raises His Own Banner"
 cc_bonds.97.desc: "The march lord of [bond_subj.GetName] has raised his own banner. This is not a peasant revolt or a pamphlet. This is a military commander with trained soldiers, intimate knowledge of the frontier, and years of accumulated grievance we did not take seriously. The garrison denied, the spoils kept, the ceremony waived: he kept his own ledger, and he has decided the debt is payable in a different currency now."
 cc_bonds.97.desc.deep: "The march has gone over entire. Not a faction of it, not a disputed succession: the lord, his officers, his levies and his fortresses, in one movement, on a date he clearly chose in advance. Our frontier garrisons learned about it when their relief columns did not arrive. He has spent a generation learning how we campaign, and he is about to demonstrate it."
 cc_bonds.97.desc.fort: "The banner went up over the fortress, which is the detail that matters. We refused to fund those walls; the march lord built them anyway and never mentioned it again. Now the strongest position on our frontier is held against us by the man who paid for it, and every argument we might make about obligation runs into a set of accounts we would rather not have read aloud."
 cc_bonds.97.desc.ward: "The march lord who has raised his banner against us is the boy we brought to court. We taught him our drill, our staff work and our tables of supply, and we taught him at the same time exactly how little his family's service was valued. He has thanked us for the first education by putting it to use. The officers now facing him trained beside him."
 cc_bonds.97.a: "Send an envoy with terms. Pay what we should have paid years ago."
 cc_bonds.97.b: "He is a subject in revolt. Treat him accordingly."
 cc_bonds.97.c: "Cut him loose. Let the age have him, and let it have him far from here."

 # === cc_bonds.98 — The Dependency Stands True ===
 cc_bonds.98.title: "The Dependency Stands True"
 cc_bonds.98.desc: "Among the alarming dispatches of the revolutionary age, one note reads differently. The ruling house of [bond_subj.GetName] has written not to request anything, not to negotiate, not to warn us of unrest, but to reaffirm their loyalty. The letter is personal. It recalls the visits and the ceremonies, the moments the crown treated their house as family rather than as a client. Neighboring courts have noticed."
 cc_bonds.98.desc.deep: "The ruling house of [bond_subj.GetName] has done something no treaty obliged them to do. They have written to the courts that were sounding them out and told them, in language they took care to make quotable, that the question does not arise. The letter to us arrived afterward, almost as an afterthought, and is mostly about a christening. Half of Europe now knows what our word is worth, because someone else said it for us."
 cc_bonds.98.a: "Answer in kind. This is what a lasting relationship looks like."
 cc_bonds.98.b: "Ask them to speak for us in the courts that are watching."

 # === cc_bonds.99 — The Dependency Looks Elsewhere ===
 cc_bonds.99.title: "The Dependency Looks Elsewhere"
 cc_bonds.99.desc: "A letter has arrived from the ruling house of [bond_subj.GetName]. It is courteous, measured and devastating. They are not declaring independence and they are not joining any revolutionary coalition. They are quietly and formally exploring what other arrangements might be available. They have identified a neighboring power that has expressed interest. They are telling us first, which may be their last act of loyalty."
 cc_bonds.99.desc.deep: "The letter from [bond_subj.GetName] is no longer exploratory. Terms have been discussed, a draft exists, and a date has been mentioned. They have sent us the courtesy of a summary. Reading it, the striking thing is how little of it concerns us: we are the arrangement being replaced, described in the past tense, by people who stopped expecting anything from us some time ago and have finally found somewhere else to expect it from."
 cc_bonds.99.a: "Offer everything we should have offered years ago. Ask them to stay."
 cc_bonds.99.b: "If they have found a better arrangement, do not stand in their way."
 cc_bonds.99.c: "They are our dependency. They do not get to explore arrangements."
