l_english:
 # === cc_bonds.90 — A Loyal Colony in Turbulent Times ===
 cc_bonds.90.title: "A Loyal Colony in Turbulent Times"
 cc_bonds.90.desc: "The Age of Revolutions has arrived, and the colonies of the world are stirring. But [bond_subj.GetName] is not stirring — it is steady. Decades of shared governance, economic investment, and political partnership have produced something that no proclamation could manufacture: a colonial population that sees its future within the empire rather than outside it. The colonial leadership has not merely refrained from joining the revolutionary currents — they have actively worked to hold their population back from them. This is what a generation of good choices looks like."
 cc_bonds.90.a: "Formally recognize [bond_subj.GetName]'s loyalty. Elevate their standing within the empire."
 cc_bonds.90.b: "Press emergency levies while we have their goodwill. The revolution is not over."
 cc_bonds.90.c: "Invite them to the Imperial Council."

 # === cc_bonds.91 — The Colony Finds Its Voice ===
 cc_bonds.91.title: "The Colony Finds Its Voice"
 cc_bonds.91.desc: "The Age of Revolutions has arrived, and [bond_subj.GetName] has not waited to be told what side it stands on. The colonial leadership — or what remains of it that is loyal to us — reports that revolutionary pamphlets are circulating openly, that public meetings are becoming demonstrations, and that the mood has shifted from grievance to conviction. This did not appear overnight. The ledger of extraction, of denied petitions, of governors who taxed and took and never gave back — it has been kept, and the reckoning is here."
 cc_bonds.91.a: "Crack down. Make clear who governs this colony."
 cc_bonds.91.b: "We concede. Everything we should have done years ago, we do now."

 # === cc_bonds.92 — The Governor Stands With the Crown ===
 cc_bonds.92.title: "The Governor Stands With the Crown"
 cc_bonds.92.desc: "The revolutionary moment that has shaken other provinces finds [bond_subj.GetName] remarkably calm. The governor has not merely maintained order — he has actively rallied the local administration to Crown loyalty, suppressed agitation before it took root, and written to assure us of his province's stability. The infrastructure we funded, the legal frameworks we built together, the administrators we treated as partners rather than instruments — all of it is returning dividends now, when it matters most."
 cc_bonds.92.a: "The governor has served with distinction. We will say so publicly."

 # === cc_bonds.93 — The Province Remembers ===
 cc_bonds.93.title: "The Province Remembers"
 cc_bonds.93.desc: "The revolutionary age has reached [bond_subj.GetName], and the province has been waiting for it. The governor's dispatches have grown shorter, his replies slower. The last report described the situation as 'manageable' — the bureaucratic word for a situation that is not. Decades of extraction, of governors rewarded for collection rather than governance, of local laws overridden for administrative convenience — the province has not forgotten any of it. It has simply been waiting for the right moment to say so."
 cc_bonds.93.a: "We will pay what is necessary to hold this province. Whatever it costs."
 cc_bonds.93.b: "The situation is what it is. We must manage as best we can."

 # === cc_bonds.94 — The Palatinate Answers the Call ===
 cc_bonds.94.title: "The Palatinate Answers the Call"
 cc_bonds.94.desc: "The Age of Revolutions brings a test of loyalties, and [bond_subj.GetName] has answered it in the clearest possible terms. The palatinate lord has mustered his forces without being asked, written to offer his full military support, and sent his eldest son to serve in our army as a personal gesture. The decades of ceremonies honored, levies handled fairly, feuds mediated with patience — the palatinate lord has not forgotten any of it. He is calling it service. We may call it what we like, but it is one of the finest things a subject has ever offered the Crown."
 cc_bonds.94.a: "We are honored by this loyalty. The palatinate stands with us."
 cc_bonds.94.b: "The lord's service is welcome — and we settle the old debt first."

 # === cc_bonds.95 — The Palatinate Declares Armed Neutrality ===
 cc_bonds.95.title: "The Palatinate Declares Armed Neutrality"
 cc_bonds.95.desc: "The lord of [bond_subj.GetName] has sent a formal declaration. He is not joining the revolution. He is also not joining us. He has declared the palatinate to be in a state of 'armed neutrality' — a phrase that means, in practice, that his forces will defend his territory and no other, that he will not respond to calls to arms, and that he intends to wait and see which way the revolution resolves before making any further commitment. The decades of neglect, of ignored petitions, of ceremonies waived and feuds adjudicated against him, have produced this — a lord who has simply stopped caring whether the Crown survives."
 cc_bonds.95.a: "Accept the declaration. Neutrality is better than open rebellion."
 cc_bonds.95.b: "We will not tolerate this. The palatinate answers to us, now."

 # === cc_bonds.96 — The March Holds the Frontier ===
 cc_bonds.96.title: "The March Holds the Frontier"
 cc_bonds.96.desc: "The revolutionary age has brought instability to many borders, and [bond_subj.GetName] has held every inch of ours. The march lord has not merely defended the frontier — he has done so in a way that makes the Crown look good: swift, capable, and clearly acting in our name. His letters are brief and professional. He is not asking for recognition. He is simply doing what a loyal march lord does. The ceremonies we honored, the spoils we shared, the garrison we funded — they built a military culture that serves us now when we need it most."
 cc_bonds.96.a: "The march lord has served the Crown well. We acknowledge his loyalty."
 cc_bonds.96.b: "The ward we brought to court has returned to lead his father's forces. We could not have hoped for more."

 # === cc_bonds.97 — The March Lord Raises His Own Banner ===
 cc_bonds.97.title: "The March Lord Raises His Own Banner"
 cc_bonds.97.desc: "The march lord of [bond_subj.GetName] has raised his own banner. This is not a peasant revolt or a revolutionary pamphlet — this is a military commander with trained soldiers, knowledge of the frontier terrain, and years of accumulated grievance that we did not take seriously enough. The garrison we denied funding, the spoils we kept, the ceremony we waived — the march lord kept his own ledger. He has decided that the debt is paid in a different currency now. He is not asking for anything. He is telling us what the relationship cost."
 cc_bonds.97.a: "Send an envoy with terms. We will pay what we should have paid years ago."
 cc_bonds.97.b: "He is a subject in revolt. We will treat him accordingly."

 # === cc_bonds.98 — The Dependency Stands True ===
 cc_bonds.98.title: "The Dependency Stands True"
 cc_bonds.98.desc: "Among all the alarming dispatches of the revolutionary age, one note arrives that reads differently. The ruling house of [bond_subj.GetName] has written not to request anything, not to negotiate, not to warn us of unrest — but simply to reaffirm their loyalty. The letter is personal in tone. It recalls the visits, the ceremonies, the moments when the Crown treated their house as family rather than a client state. Neighboring courts have noticed. Our reputation for building lasting bonds rather than extracting short-term compliance speaks for itself in this moment."
 cc_bonds.98.a: "This is what a lasting relationship looks like. We are grateful."

 # === cc_bonds.99 — The Dependency Looks Elsewhere ===
 cc_bonds.99.title: "The Dependency Looks Elsewhere"
 cc_bonds.99.desc: "A letter has arrived from the ruling house of [bond_subj.GetName]. It is courteous, measured, and devastating. They are not declaring independence. They are not joining any revolutionary coalition. They are simply — quietly, formally — exploring what other arrangements might be available to them. They have identified a neighboring power that has expressed interest in offering protection. They have not yet committed to anything. They are telling us first. This may be their last act of loyalty: giving us the chance to respond before they formally begin a new chapter. The ceremony we waived, the invitation we declined to send, the letter instead of the visit — they remember it all."
 cc_bonds.99.a: "We will offer everything we should have offered years ago. Please — stay."
 cc_bonds.99.b: "If they have found a better arrangement, we will not stand in their way."
 cc_bonds.99.c: "They are our dependency. They do not get to 'explore arrangements.'"
