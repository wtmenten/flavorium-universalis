l_english:
 # === cc_bonds.1 — Monitor ===
 cc_bonds.1.title: "Bonds Forming"
 cc_bonds.1.desc: "Bonds between us and our vassal are taking shape."
 # === cc_bonds.100 — The Young Heir ===
 cc_bonds.100.title: "The Young Heir"
 cc_bonds.100.desc: "A dispatch from [bond_subj.GetName] contains a detail we had not anticipated: the current ruler has a young heir, perhaps eight or ten years of age, who is already being prepared for the responsibilities he will one day inherit. There is time, and there is a question. What kind of relationship do we wish to have with the man this child will become? The choices we make now will shape his understanding of what the Crown means — whether we are patrons, partners, or distant overlords who can be safely waited out."
 cc_bonds.100.a: "Invite the heir to our court. He will grow up understanding what we are."
 cc_bonds.100.b: "Send tutors and generous gifts to his home court. Goodwill planted early grows deep."
 cc_bonds.100.c: "This is not our concern. The succession in [bond_subj.GetName] is their affair."

 # === cc_bonds.101 — The Heir Comes of Age ===
 cc_bonds.101.title: "The Heir Comes of Age"
 cc_bonds.101.desc_court: "The young heir from [bond_subj.GetName] has grown into a polished, capable young man — educated in our court, fluent in the language of our nobility, and comfortable at our table. He is loyal to us in a way that is almost reflexive. What he is less comfortable with, our courtiers note, is the idea of going home. His homeland is abstract to him now; the court is real. He is at a crossroads, and so are we."
 cc_bonds.101.desc_gifted: "The heir of [bond_subj.GetName] has come of age in his homeland, well-educated and — by all accounts — well-disposed toward the Crown. The tutors we sent him left their mark. He speaks of his father's overlord with genuine warmth, which is not something one can simply buy. He is his own man, rooted in his own territory, but the foundation was laid well."
 cc_bonds.101.desc_ignored: "The heir of [bond_subj.GetName] has come of age without any particular connection to our court. He is capable, independent-minded, and — from what our envoys report — slightly cool in his attitude toward the Crown. He has built his own relationships, cultivated his own connections, and formed his own views about what the overlord relationship means to him. Those views are not hostile. They are simply not warm."
 cc_bonds.101.a_keep: "Keep him at court a while longer. There is more he should learn here."
 cc_bonds.101.a_send: "Send him home with honors and a marriage arrangement. He is ready."
 cc_bonds.101.b_invite: "Invite him to court now. Formalize what the tutors began."
 cc_bonds.101.b_gift: "Send him a property deed in our realm. A tangible gesture of partnership."
 cc_bonds.101.c_gift: "Make overtures — send lavish gifts. It is not too late to build something."
 cc_bonds.101.c_ignore: "He is the heir of a subject state. We need not cultivate him."
 cc_bonds.101.c_interfere: "The connections he is building locally concern us. We will disrupt them."

 # === cc_bonds.102 — The Old Lord's Passing ===
 cc_bonds.102.title: "The Old Lord's Passing"
 cc_bonds.102.desc_loyal: "The old lord of [bond_subj.GetName] has died, and his heir — the young man we knew at our court, or the one who grew up with fond memories of our generosity — has taken his place. His first act as ruler is a letter to the Crown. It is personal in tone. He recalls specific kindnesses. He renews his oath without being asked, in language that goes beyond the formula. He is not performing loyalty. He means it. We are seeing, in full, what those early choices produced."
 cc_bonds.102.desc_neutral: "The old lord of [bond_subj.GetName] has died. His heir has sent a formal renewal of the oath — correct in every respect, professional in tone, and entirely without warmth. He is fulfilling his obligations. He has been raised to understand what those obligations are. Whether there is anything more behind them is impossible to say from a carefully worded letter."
 cc_bonds.102.desc_hostile: "The old lord of [bond_subj.GetName] has died. His heir has not yet sent the customary renewal of the oath. A week passes. Then two. Our secretaries begin drafting a reminder. The new lord is not in rebellion — nothing has been declared, nothing repudiated. He is simply making us wait, in the oldest language of feudal displeasure: the pointed pause."
 cc_bonds.102.a_reward: "Grant him an honorary title. His loyalty deserves formal recognition."
 cc_bonds.102.a_acknowledge: "We acknowledge his renewal with warmth. The relationship is well begun."
 cc_bonds.102.b_push: "This transition is an opportunity. We will ask for a concession."
 cc_bonds.102.b_accept: "The renewal is accepted. The relationship continues on existing terms."
 cc_bonds.102.c_demand: "He will take the oath now. We will not wait."
 cc_bonds.102.c_envoy: "Send an envoy with gifts. Begin the relationship well, even if late."
