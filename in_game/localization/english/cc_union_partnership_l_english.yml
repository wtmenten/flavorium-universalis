l_english:

 ########################################################################
 # CASUS BELLI
 ########################################################################

 cb_assert_junior_partnership: "Assert Junior Partnership"
 cb_assert_junior_partnership_desc: "Our union partner has long enjoyed the comfort of an informal arrangement. As the undisputed senior power in this union, we are entitled to formalize that relationship — and to enforce it if necessary."

 cb_assert_crown_dependency: "Assert Crown Dependency"
 cb_assert_crown_dependency_desc: "Our royal marriage with this realm, combined with our dominant position in the union, grants us the right to formalize them as a crown dependency. We shall make this bond permanent."

 ########################################################################
 # PEACE TREATIES
 ########################################################################

 cc_force_junior_partnership: "Formalize as Junior Partner"
 cc_force_junior_partnership_entry: "$cc_force_junior_partnership$"
 cc_force_junior_partnership_entry_short: "$cc_force_junior_partnership$"
 cc_force_junior_partnership_desc: "The defeated realm shall formally recognize our seniority, accepting the binding status of a junior partner in the union. Their autonomy will be curtailed accordingly."

 cc_force_crown_dependency: "Assert Crown Dependency"
 cc_force_crown_dependency_entry: "$cc_force_crown_dependency$"
 cc_force_crown_dependency_entry_short: "$cc_force_crown_dependency$"
 cc_force_crown_dependency_desc: "The defeated realm shall be bound to our crown as a formal dependency. The royal marriage between our houses makes this a natural conclusion."

 ########################################################################
 # BIASES / OPINION MODIFIERS
 ########################################################################

 antagonism_cc_force_junior_partnership: "Forced into Junior Partnership"
 antagonism_cc_force_crown_dependency: "Forced into Crown Dependency"

 opinion_cc_forced_junior_partnership: "Resents Forced Formalization"
 opinion_cc_forced_crown_dependency: "Resents Forced Dynastic Dependency"
 opinion_cc_bribed_into_partnership: "Grateful for Generous Settlement"

 ########################################################################
 # EVENTS — cc_pu.1 (Junior Partner path)
 ########################################################################

 cc_pu.1.title: "A Proposal to Formalize the Union"

 cc_pu.1.desc: "The union between our crowns has endured, but our relationship with [pu_target.GetName] remains an informal inheritance of circumstance. With their realm considerably smaller than ours, our advisors agree the moment has come to propose a formal junior partnership — converting the personal union into a binding dynastic arrangement that reflects the true balance of power."

 cc_pu.1.a: "Propose the formal partnership."
 cc_pu.1.a.tt: "A direct diplomatic proposal. [pu_target.GetName] will accept, though their court may feel the arrangement was not entirely their choice."

 cc_pu.1.b: "Sweeten the deal with a generous settlement. [150 gold]"
 cc_pu.1.b.tt: "Offer a financial settlement to [pu_target.GetName]'s court. The generosity removes any sense of coercion — the arrangement is welcomed rather than resented."

 cc_pu.1.c: "Dispatch [cc_pu_minister.GetName] to negotiate."
 cc_pu.1.c.tt: "Have our senior diplomat manage the transition. [cc_pu_minister.GetName]'s skill ensures the proposal is received as an honor rather than an imposition."

 ########################################################################
 # EVENTS — cc_pu.2 (Crown Dependency path)
 ########################################################################

 cc_pu.2.title: "Strengthening the Dynastic Bond"

 cc_pu.2.desc: "Our royal marriage with [pu_target.GetName] offers an opportunity beyond the ordinary union arrangement. With both dynastic ties and union membership connecting our realms, we could propose formalizing [pu_target.GetName] as a crown dependency — a bond that honors the shared bloodline while establishing clear precedence for future generations."

 cc_pu.2.a: "Propose the crown dependency formally."
 cc_pu.2.a.tt: "A direct dynastic proposal. [pu_target.GetName] will accept the arrangement, though their court may feel the change was not entirely their idea."

 cc_pu.2.b: "Accompany the proposal with a royal gift. [100 gold]"
 cc_pu.2.b.tt: "A generous gesture to [pu_target.GetName]'s court smooths the transition. Their nobles feel compensated rather than pressured."

 cc_pu.2.c: "Have [cc_pu_minister.GetName] present the proposal at court."
 cc_pu.2.c.tt: "A skilled diplomat makes the dependency arrangement feel like a privilege. [pu_target.GetName] gains as much prestige from the association as it costs them in autonomy."
