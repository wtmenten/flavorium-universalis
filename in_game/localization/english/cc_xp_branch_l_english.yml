l_english:
 # ============================================================
 # Cabinet Experience — ladder branch points
 #
 # One entry per event in in_game/events/cc_xp_branch_events.txt (generated).
 # Each fires when a minister has earned a rung that offers two destinations.
 # Option text uses [ShowTraitName('x')] so the player can hover the actual trait
 # and read its real modifiers instead of trusting this copy to restate them.
 #
 # Saved scopes drop the scope: prefix in loc. See docs/scripting-gotchas.md.
 # ============================================================

 # --- cc_xp.20  fiscal: loyal_steward -> prosperity_planner | treasury_enforcer
 cc_xp.20.title: "The Steward's Ledger"
 cc_xp.20.desc: "[cc_xp_subject.GetName] has kept the crown's books long enough to know where the money actually goes, and has begun saying so out loud. There is a proposal on the table, and a rather different one behind it.\n\nThe first is to spend: to put the surplus into the places that will return it threefold, and accept some waste as the price of growth. The second is to stop the leaks. [cc_xp_subject.GetName] can name every office that costs more than it returns, and would like permission to say so publicly."
 cc_xp.20.a: "Invest. Let them build. ([ShowTraitName('prosperity_planner')])"
 cc_xp.20.b: "Audit. Let them cut. ([ShowTraitName('treasury_enforcer')])"

 # --- cc_xp.21  learning: progressive_rationalist -> enlightenment_herald | humanist_philosopher
 cc_xp.21.title: "A Question of Audience"
 cc_xp.21.desc: "[cc_xp_subject.GetName] has outgrown the reading that made them, and the court has noticed. What remains is the question of what to do with it.\n\nThey could take the argument outward: pamphlets, correspondence, the patient work of convincing people who did not ask to be convinced. Or they could turn inward, toward the slower and less popular business of getting it right before saying it at all."
 cc_xp.21.a: "Let them preach. ([ShowTraitName('enlightenment_herald')])"
 cc_xp.21.b: "Let them think. ([ShowTraitName('humanist_philosopher')])"

 # --- cc_xp.22  law: efficiency_administrator -> estate_guardian | regional_magnate
 cc_xp.22.title: "Where Authority Should Sit"
 cc_xp.22.desc: "[cc_xp_subject.GetName] has spent years making the machinery of the realm run, and has arrived at a conclusion about who should be turning the handle.\n\nOne answer is the estates: old, slow, and durable, with obligations that run both ways. The other is the provinces: the great local lords who already hold the ground and merely need the crown's blessing to hold it formally. Both are stability. They are not the same stability."
 cc_xp.22.a: "The estates keep their rights. ([ShowTraitName('estate_guardian')])"
 cc_xp.22.b: "The provinces keep their lords. ([ShowTraitName('regional_magnate')])"

 # --- cc_xp.23  integration: seasoned_integrator -> master_integrator | iron_integrator
 cc_xp.23.title: "The Pace of Incorporation"
 cc_xp.23.desc: "Bringing new land properly into the realm is slow work, and [cc_xp_subject.GetName] has done enough of it to be trusted with an opinion on how fast it ought to go.\n\nDone patiently, it holds: local men in local offices, the old customs left standing where they cost nothing. Done quickly, it also holds, for a while, and the realm is whole a great deal sooner. [cc_xp_subject.GetName] is willing to do it either way and would like to know which."
 cc_xp.23.a: "Patiently. What is joined properly stays joined. ([ShowTraitName('master_integrator')])"
 cc_xp.23.b: "Quickly. We do not have a generation to spare. ([ShowTraitName('iron_integrator')])"

 # --- cc_xp.24  envoy: tentative_envoy -> tactful_envoy | diplomatic_attache
 cc_xp.24.title: "The Envoy Finds Their Footing"
 cc_xp.24.desc: "The hesitation is gone. [cc_xp_subject.GetName] has sat through enough negotiations to stop apologising for being in the room, and two quite different diplomats are visible in what is left.\n\nOne works the room: reads the mood, knows when to say nothing, and leaves every court a little better disposed than it was. The other works the document, where the concessions are actually buried, and has developed an unsettling appetite for clauses."
 cc_xp.24.a: "Send them to the table. ([ShowTraitName('tactful_envoy')])"
 cc_xp.24.b: "Send them to the archives. ([ShowTraitName('diplomatic_attache')])"

 # --- cc_xp.25  trade: merchant_syndic -> mercantilist_official | free_market_advocate
 cc_xp.25.title: "Whose Trade Is It"
 cc_xp.25.desc: "[cc_xp_subject.GetName] came up through the merchant houses and has never entirely stopped thinking like one, which is precisely why the argument they are making now carries weight.\n\nEither commerce is an instrument of the crown, to be chartered, directed and taxed where it will do the most good, or it is a thing that grows best when the crown takes its hand off it and settles for a smaller share of a larger sum."
 cc_xp.25.a: "Trade serves the crown. ([ShowTraitName('mercantilist_official')])"
 cc_xp.25.b: "Trade serves itself, and us with it. ([ShowTraitName('free_market_advocate')])"

 # --- cc_xp.26  command: tactical_advisor -> offensive_strategist | defensive_commander
 cc_xp.26.title: "A Doctrine for the Army"
 cc_xp.26.desc: "[cc_xp_subject.GetName] has stopped merely relaying the generals' opinions and started having their own. The staff has been asked to prepare for the next war; the question is which war they should prepare for.\n\nOne plan assumes we choose the moment and strike first. The other assumes we will not get to choose, and spends the same money on walls, depots and the unglamorous business of not losing."
 cc_xp.26.a: "We will strike first. ([ShowTraitName('offensive_strategist')])"
 cc_xp.26.b: "We will not be caught out. ([ShowTraitName('defensive_commander')])"

 # --- cc_xp.27  command: offensive_strategist -> supreme_commander | continental_marshal
 cc_xp.27.title: "The Reach of a Reputation"
 cc_xp.27.desc: "The offensive doctrine has been vindicated often enough that [cc_xp_subject.GetName] is no longer arguing for it, merely applying it. What is being decided now is the size of the hand they are given.\n\nThey could be set over the whole military establishment, every arm of it, with the standing to reform what they find. Or they could be kept where they have been undeniably excellent, given the field army and the resources to make it the finest in the world."
 cc_xp.27.a: "Give them everything. ([ShowTraitName('supreme_commander')])"
 cc_xp.27.b: "Give them the army. ([ShowTraitName('continental_marshal')])"

 # --- cc_xp.28  command: defensive_commander -> supreme_commander | continental_marshal
 cc_xp.28.title: "The Reward for Not Losing"
 cc_xp.28.desc: "It is difficult to prove the value of a war that did not happen, but the forts [cc_xp_subject.GetName] built are standing and the borders they guarded are quiet. The court has grudgingly concluded that this was not luck.\n\nThey can be raised over the whole military establishment, with a mandate to apply the same thoroughness everywhere. Or they can be handed the field army itself, on the theory that a commander who understands ground is wasted behind a desk."
 cc_xp.28.a: "Raise them over everything. ([ShowTraitName('supreme_commander')])"
 cc_xp.28.b: "Give them the army. ([ShowTraitName('continental_marshal')])"
