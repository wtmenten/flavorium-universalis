l_english:
 # ============================================================
 # Cabinet Duty Actions
 # ============================================================
 cc_duty_free_hands: "Free Hands"
 cc_duty_free_hands_desc: "The minister attends to whatever the court requires — available for audiences, petitions, and the full range of idle court duties. All cabinet event systems remain active at their baseline rate."
 cc_duty_free_hands_action: "Free Hands"
 cc_duty_free_hands_active: "Free Hands"

 cc_duty_war_council: "War Council"
 cc_duty_war_council_desc: "The minister is formally tasked with the prosecution of the war — advising on campaigns, managing logistics, and maintaining the will to fight. War Council events fire more frequently while this duty is assigned. Ends automatically when peace is made."
 cc_duty_war_council_action: "War Council"
 cc_duty_war_council_active: "Advising the War Council"

 cc_duty_diplomatic_mission: "Diplomatic Mission"
 cc_duty_diplomatic_mission_desc: "The minister is posted to a foreign court, building relationships and advancing the realm's interests abroad. International synergy events with the target court become more frequent."
 cc_duty_diplomatic_mission_action: "Diplomatic Mission"
 cc_duty_diplomatic_mission_active: "On Diplomatic Mission"
 cc_duty_diplomatic_mission_select_target: "Select the court to post this minister to:"

 cc_duty_domestic_reform: "Domestic Reform"
 cc_duty_domestic_reform_desc: "The minister is devoted to internal governance — drafting laws, restructuring bureaucracy, and pushing forward reform proposals. Stepping stone trait progression events fire at twice the normal rate."
 cc_duty_domestic_reform_action: "Domestic Reform"
 cc_duty_domestic_reform_active: "Drafting Reforms"

 cc_duty_scholarly_inquiry: "Scholarly Inquiry"
 cc_duty_scholarly_inquiry_desc: "The minister corresponds with scholars, patronises learning, and pursues empirical investigation. The Scholar's Court event chain becomes more active while this duty is held."
 cc_duty_scholarly_inquiry_action: "Scholarly Inquiry"
 cc_duty_scholarly_inquiry_active: "Pursuing Scholarly Inquiry"

 cc_duty_colonial_posting: "Colonial Posting"
 cc_duty_colonial_posting_desc: "The minister is posted overseas to manage a colonial subject — a chartered company, colonial nation, or provincial governorate. Colonial governance events fire regularly, and the minister may return with hard-won frontier experience."
 cc_duty_colonial_posting_action: "Colonial Posting"
 cc_duty_colonial_posting_active: "Posted Overseas"
 cc_duty_colonial_posting_select_colony: "Select the colonial subject to post this minister to:"

 cc_duty_religious_oversight: "Religious Oversight"
 cc_duty_religious_oversight_desc: "The minister oversees confessional affairs — managing religious conformity, inter-faith relations, and theological policy at court. Reformation and religious tension events become more active."
 cc_duty_religious_oversight_action: "Religious Oversight"
 cc_duty_religious_oversight_active: "Overseeing Confessional Affairs"

 # ============================================================
 # Cabinet Composition Auto-Modifiers
 # ============================================================
 warlord_court: "Warlord Court"
 warlord_court_desc: "The council speaks with one martial voice. Two or more military specialists dominate the cabinet, lending discipline and resolve — but the realm's other interests grow neglected."

 merchant_republic_spirit: "Spirit of the Counting House"
 merchant_republic_spirit_desc: "Commerce and finance govern the cabinet's thinking. Trade networks flourish, but the realm's military ambitions are quietly starved of men."

 enlightened_court: "Enlightened Court"
 enlightened_court_desc: "Empiricists and rationalists have found a home at court. Knowledge advances and the cost of statecraft falls — though martial prestige is not what it once was."

 court_paralysis: "Court Paralysis"
 court_paralysis_desc: "Opposing factions within the cabinet have reached an impasse. Every decision is contested, every reform delayed — yet the tension may yet produce unexpected compromise."

 entrenched_court: "Entrenched Court"
 entrenched_court_desc: "The cabinet is composed entirely of long-serving veterans. Their deep familiarity with the realm's ways lends stability, but fresh thinking is in short supply."

 balanced_court: "Balanced Court"
 balanced_court_desc: "No single faction dominates, no ideology divides. The cabinet holds in a studied equilibrium — prestige accrues to the realm, and the ruler's word is its own answer."

 # ============================================================
 # Auto-modifier labels for cabinet composition
 #
 # These read as the composition that produced them rather than as a condition, because
 # the trigger IS the composition: two or more ministers of a kind, or none of any.
 # ============================================================
 AUTO_MODIFIER_NAME_warlord_court: "Two or more soldiers in the cabinet"
 AUTO_MODIFIER_NAME_merchant_republic_spirit: "Two or more men of commerce in the cabinet"
 AUTO_MODIFIER_NAME_enlightened_court: "Two or more empiricists in the cabinet"
 AUTO_MODIFIER_NAME_court_paralysis: "Two ministers of opposing convictions"
 AUTO_MODIFIER_NAME_entrenched_court: "Every minister a long-serving veteran"
 AUTO_MODIFIER_NAME_balanced_court: "No faction and no feud in the cabinet"
 AUTO_MODIFIER_NAME_nobles_court_captured: "Two or more of the nobility in the cabinet"
 AUTO_MODIFIER_NAME_burghers_court_captured: "Two or more of the burghers in the cabinet"
 AUTO_MODIFIER_NAME_clergy_court_captured: "Two or more of the clergy in the cabinet"
