l_english:
 # === cc_bonds.10 — The Colony's First Harvest ===
 cc_bonds.10.title: 0 "The Colony's First Harvest"
 cc_bonds.10.desc: 0 "Reports reach us from [scope:bond_subj.GetName]: the first full season of coordinated colonial administration has concluded. The colonists have produced a surplus, trade routes are establishing themselves, and the governor requests guidance on how the Crown wishes to proceed with revenue arrangements. The opportunity before us is clear — but so are the choices it demands."
 cc_bonds.10.a: 0 "Maximize extraction. The colony exists to serve the Crown."
 cc_bonds.10.b: 0 "Invest in infrastructure. A prosperous colony pays better in the long run."
 cc_bonds.10.c: 0 "Make no specific arrangements. Let them manage as they see fit."

 # === cc_bonds.11 — Colonial Conscription ===
 cc_bonds.11.title: 0 "Colonial Conscription"
 cc_bonds.11.desc: 0 "Our forces are stretched, and the colonial territories of [scope:bond_subj.GetName] represent a pool of able-bodied men. The governor has been asked about the feasibility of levying troops from the colonial population. His response is cautious — the colonists are settlers first, soldiers second — but he awaits our direction."
 cc_bonds.11.a: 0 "Conscript from the colonial levy. We need the men."
 cc_bonds.11.b: 0 "Hire mercenaries instead. Spare the colonists."
 cc_bonds.11.c: 0 "Decline to raise additional troops at this time."

 # === cc_bonds.12 — The Governor Reports Unrest ===
 cc_bonds.12.title: 0 "The Governor Reports Unrest"
 cc_bonds.12.desc: 0 "A dispatch from [scope:bond_subj.GetName] arrives marked urgent. The governor writes of growing discontent among the colonial population — grievances over taxation, complaints about Crown officials overstepping their mandates, and in one district, a gathering that broke up only when armed men arrived. He requests guidance. The situation is not yet beyond control, but it requires a response."
 cc_bonds.12.a: 0 "Send troops to suppress the unrest. Make an example."
 cc_bonds.12.b: 0 "Investigate the tax collectors. Reform what needs reforming."
 cc_bonds.12.c: 0 "Replace the governor. A new hand will restore order."

 # === cc_bonds.13 — Colonial Trade Monopoly Dispute ===
 cc_bonds.13.title: 0 "Colonial Trade Monopoly Dispute"
 cc_bonds.13.desc: 0 "The merchant guilds at home have submitted a petition requesting exclusive trading rights with [scope:bond_subj.GetName]. They argue this would rationalize colonial commerce and increase Crown revenues through reliable duty payments. The colonial governor has quietly raised objections — his colonists trade freely with neighboring ports and view a monopoly as a taking. The decision rests with us."
 cc_bonds.13.a: 0 "Grant the monopoly. Structured commerce benefits everyone."
 cc_bonds.13.b: 0 "Reject the petition. The colony's trade patterns are functioning."
 cc_bonds.13.c: 0 "Allow the colony to set its own trade terms. Let them prosper freely."

 # === cc_bonds.14 — The Colony Seeks a Voice ===
 cc_bonds.14.title: 0 "The Colony Seeks a Voice"
 cc_bonds.14.desc: 0 "A delegation from [scope:bond_subj.GetName] has traveled a long way. Their petition is measured but clear: the colony has grown, its people have built something lasting, and they believe they have earned some say in the decisions that govern their lives. They are not demanding independence. They are asking to be heard. The court is watching how we respond."
 cc_bonds.14.a: 0 "Grant formal representation. They have earned it."
 cc_bonds.14.b: 0 "Offer symbolic recognition. A consultative role, nothing binding."
 cc_bonds.14.c: 0 "Deny the petition. The Crown speaks for all its territories."

 # === cc_bonds.15 — Cultural Assimilation Pressure ===
 cc_bonds.15.title: 0 "Cultural Assimilation Pressure"
 cc_bonds.15.desc: 0 "The colonial territory of [scope:bond_subj.GetName] has developed a distinctly local identity — its own festivals, its own patterns of speech, its own saints' days. Some advisors argue this drift from Crown culture invites future disloyalty and should be corrected through policy. Others counsel that attempting to remake the colonists in our image will breed exactly the resentment we fear. The choice is ours."
 cc_bonds.15.a: 0 "Push for cultural integration. One Crown, one people."
 cc_bonds.15.b: 0 "Support local customs. Their identity makes them who they are."
 cc_bonds.15.c: 0 "Take no position on the matter."

 # === cc_bonds.16 — Colonial Militia Incident ===
 cc_bonds.16.title: 0 "Colonial Militia Incident"
 cc_bonds.16.desc: 0 "An armed group has formed in [scope:bond_subj.GetName] — colonists who have taken it upon themselves to patrol their own districts, collect their own disputes, and in several cases, physically resist Crown tax officials. The governor calls them a militia. Others call them something worse. Whatever their name, they represent organized resistance, and the colonial administration cannot function around them."
 cc_bonds.16.a: 0 "Identify the ringleaders and make examples of them."
 cc_bonds.16.b: 0 "Negotiate. Understand their grievances before acting."
 cc_bonds.16.c: 0 "Order the militia disbanded immediately."
