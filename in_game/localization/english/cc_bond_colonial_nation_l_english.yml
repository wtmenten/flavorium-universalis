l_english:
 # === cc_bonds.10 — The Colony's First Harvest ===
 cc_bonds.10.title: "The Colony's First Harvest"
 cc_bonds.10.desc: "Reports reach us from [bond_subj.GetName]: the first full season of coordinated colonial administration has concluded. The colonists have produced a surplus, trade routes are establishing themselves, and the governor requests guidance on how the Crown wishes to proceed with revenue arrangements. The opportunity before us is clear — but so are the choices it demands."
 cc_bonds.10.a: "Maximize extraction. The colony exists to serve the Crown."
 cc_bonds.10.b: "Invest in infrastructure. A prosperous colony pays better in the long run."
 cc_bonds.10.c: "Make no specific arrangements. Let them manage as they see fit."

 # === cc_bonds.11 — Colonial Conscription ===
 cc_bonds.11.title: "Colonial Conscription"
 cc_bonds.11.desc: "Our forces are stretched, and the colonial territories of [bond_subj.GetName] represent a pool of able-bodied men. The governor has been asked about the feasibility of levying troops from the colonial population. His response is cautious — the colonists are settlers first, soldiers second — but he awaits our direction."
 cc_bonds.11.a: "Conscript from the colonial levy. We need the men."
 cc_bonds.11.b: "Hire mercenaries instead. Spare the colonists."
 cc_bonds.11.c: "Decline to raise additional troops at this time."

 # === cc_bonds.12 — The Governor Reports Unrest ===
 cc_bonds.12.title: "The Governor Reports Unrest"
 cc_bonds.12.desc: "A dispatch from [bond_subj.GetName] arrives marked urgent. The governor writes of growing discontent among the colonial population — grievances over taxation, complaints about Crown officials overstepping their mandates, and in one district, a gathering that broke up only when armed men arrived. He requests guidance. The situation is not yet beyond control, but it requires a response."
 cc_bonds.12.a: "Send troops to suppress the unrest. Make an example."
 cc_bonds.12.b: "Investigate the tax collectors. Reform what needs reforming."
 cc_bonds.12.c: "Replace the governor. A new hand will restore order."
 cc_bonds.12.d: "Send gifts and promises. Buy time."

 # === cc_bonds.13 — Colonial Trade Monopoly Dispute ===
 cc_bonds.13.title: "Colonial Trade Monopoly Dispute"
 cc_bonds.13.desc: "The merchant guilds at home have submitted a petition requesting exclusive trading rights with [bond_subj.GetName]. They argue this would rationalize colonial commerce and increase Crown revenues through reliable duty payments. The colonial governor has quietly raised objections — his colonists trade freely with neighboring ports and view a monopoly as a taking. The decision rests with us."
 cc_bonds.13.a: "Grant the monopoly. Structured commerce benefits everyone."
 cc_bonds.13.b: "Reject the petition. The colony's trade patterns are functioning."
 cc_bonds.13.c: "Allow the colony to set its own trade terms. Let them prosper freely."

 # === cc_bonds.14 — The Colony Seeks a Voice ===
 cc_bonds.14.title: "The Colony Seeks a Voice"
 cc_bonds.14.desc: "A delegation from [bond_subj.GetName] has traveled a long way. Their petition is measured but clear: the colony has grown, its people have built something lasting, and they believe they have earned some say in the decisions that govern their lives. They are not demanding independence. They are asking to be heard. The court is watching how we respond."
 cc_bonds.14.a: "Grant formal representation. They have earned it."
 cc_bonds.14.b: "Offer symbolic recognition. A consultative role, nothing binding."
 cc_bonds.14.c: "Deny the petition. The Crown speaks for all its territories."

 # === cc_bonds.15 — Cultural Assimilation Pressure ===
 cc_bonds.15.title: "Cultural Assimilation Pressure"
 cc_bonds.15.desc: "The colonial territory of [bond_subj.GetName] has developed a distinctly local identity — its own festivals, its own patterns of speech, its own saints' days. Some advisors argue this drift from Crown culture invites future disloyalty and should be corrected through policy. Others counsel that attempting to remake the colonists in our image will breed exactly the resentment we fear. The choice is ours."
 cc_bonds.15.a: "Push for cultural integration. One Crown, one people."
 cc_bonds.15.b: "Support local customs. Their identity makes them who they are."
 cc_bonds.15.c: "Take no position on the matter."

 # === cc_bonds.16 — Colonial Militia Incident ===
 cc_bonds.16.title: "Colonial Militia Incident"
 cc_bonds.16.desc: "An armed group has formed in [bond_subj.GetName] — colonists who have taken it upon themselves to patrol their own districts, collect their own disputes, and in several cases, physically resist Crown tax officials. The governor calls them a militia. Others call them something worse. Whatever their name, they represent organized resistance, and the colonial administration cannot function around them."
 cc_bonds.16.a: "Identify the ringleaders and make examples of them."
 cc_bonds.16.b: "Negotiate. Understand their grievances before acting."
 cc_bonds.16.c: "Order the militia disbanded immediately."

 # === cc_bonds.200 — The Colonial Congress Convenes ===
 cc_bonds.200.title: "The Colonial Congress Convenes"
 cc_bonds.200.desc: "The representation we granted to [bond_subj.GetName] some years ago has grown beyond the ceremony it began as. The colonists have organized. They have elected delegates, drafted a platform, and convened a congress with a formal agenda. Their requests are not revolutionary — improvements to colonial administration, clearer trade protocols, a consultative role in decisions that affect them directly. But the apparatus they have built to present these requests is something new. We granted them a voice. They have used it to build a chamber.\n\nThe question before us now is whether we honor what that voice has grown into — or correct it."

 cc_bonds.200.a: "Ratify a Colonial Charter. What they have built deserves formal recognition."
 cc_bonds.200.a.tooltip: "The congress becomes a formal institution with lasting legitimacy. Colonial Legitimacy Era modifier extended. Pol and cul gain; prestige cost for ceding the initiative."

 cc_bonds.200.b: "Acknowledge the congress without binding ourselves to it."
 cc_bonds.200.b.tooltip: "The congress is recognized but not formalized. Pol gains modestly. The voice_granted memory persists — this situation may mature further."

 cc_bonds.200.c: "The congress exceeds its mandate. Curtail the representation we granted."
 cc_bonds.200.c.tooltip: "The chamber is dissolved before it becomes a precedent. Pol and cul both fall; liberty desire rises. The voice_granted memory is cleared — the experiment is ended."
