l_english:
 # ============================================================
 # NEGATIVE TRAITS
 # ============================================================

 stagnant_counselor: "Stagnant Counselor"
 desc_stagnant_counselor: "This minister has been in their role too long without challenge. Their methods have calcified, their enthusiasm has dimmed, and the cutting edge of their expertise has grown blunt. They remain competent — but barely."
 stagnant_counselor_die_desc: "[CHARACTER.GetName] has died. History will not judge the career harshly — only the last chapter."

 war_profiteer: "War Profiteer"
 desc_war_profiteer: "This minister has learned to see conflict as an opportunity. Their counsel shapes every diplomatic settlement toward their own enrichment, and the realm suffers the slower, costlier aftermath of wars that ended worse than they should have."
 war_profiteer_die_desc: "[CHARACTER.GetName] has died. The accounting of their personal fortune and the realm's peace dividend will never quite balance."

 court_schemer: "Court Schemer"
 desc_court_schemer: "Intrigue has replaced loyalty in this minister's practice of governance. They undermine rivals within the court, fracture legislative coalitions, and treat every appointment as a move in a game that has no outcome worth having."
 court_schemer_die_desc: "[CHARACTER.GetName] has died. The networks they built — the debts, the favors, the secrets — dissolve with them. Perhaps that is a mercy."

 inefficient_bureaucrat: "Inefficient Bureaucrat"
 desc_inefficient_bureaucrat: "This minister has outlasted their competence. A younger age might have polished them into something useful; the current age has simply exposed how little they have developed since the beginning."
 inefficient_bureaucrat_die_desc: "[CHARACTER.GetName] has died. Their successor will find the desk in better order than the work."

 corrupted_official: "Corrupted Official"
 desc_corrupted_official: "The wealth flowing through this minister's hands has been redirected. A share of the realm's prosperity lines their pockets, and the privilege they protect is their own. The estates are pleased — as well they should be."
 corrupted_official_die_desc: "[CHARACTER.GetName] has died. The auditors will be busy."

 zealous_fanatic: "Zealous Fanatic"
 desc_zealous_fanatic: "The minister's faith has curdled into something harder and narrower than conviction. Doubt is suppressed, difference is persecuted, and reason yields to zeal. The church may prosper; the realm's intellectual life does not."
 zealous_fanatic_die_desc: "[CHARACTER.GetName] has died. The ashes of what [CHARACTER.GetSheHe] burned will cool slowly."

 outdated_general: "Outdated General"
 desc_outdated_general: "This minister learned their military doctrine in a different age and has refused to update it. Their methods cost more than they should and produce less than the enemy expects, which is the worst combination in war."
 outdated_general_die_desc: "[CHARACTER.GetName] has died. The army [CHARACTER.GetSheHe] trained to fight the last war will need to learn to fight the next one."

 cynical_courtier: "Cynical Courtier"
 desc_cynical_courtier: "Too many years of watching idealism curdle into compromise have left this minister unable to advocate for anything sincerely. The estates see through their empty gestures and respond in kind."
 cynical_courtier_die_desc: "[CHARACTER.GetName] has died. In the end, even cynicism requires someone to practice it."

 reckless_expander: "Reckless Expander"
 desc_reckless_expander: "This minister sees every frontier as an invitation and every risk as a cost someone else will pay. The antagonism our expansion generates and the colonial ventures that have collapsed under their guidance will take years to repair."
 reckless_expander_die_desc: "[CHARACTER.GetName] has died. The borders [CHARACTER.GetSheHe] pushed are still being contested."

 # ============================================================
 # NEGATIVE TRAIT GRANT EVENTS (cc_neg namespace)
 # ============================================================

 cc_neg.1.title: "A Minister Growing Stagnant"
 cc_neg.1.desc: "[minister.GetName] has served faithfully — perhaps too faithfully, and too long. The court whispers that [minister.GetSheHe] is repeating [minister.GetHerHis] own advice. New ideas reach [minister.GetHerHis] desk and leave unchanged. There is still time to intervene."
 cc_neg.1.a: "Assign them a demanding new project — shake them loose."
 cc_neg.1.b: "Release [minister.GetHerHim] from service with gratitude."
 cc_neg.1.c: "Let stagnation settle. Their experience still has value."

 cc_neg.2.title: "A Minister Grown Comfortable with War"
 cc_neg.2.desc: "Our treasury has been full, and [minister.GetName] has been at court through every campaign of the last decade. A pattern is emerging in [minister.GetHerHis] counsel: the settlements [minister.GetSheHe] recommends are always a little less favorable than our position warrants. The advantage seems to flow elsewhere."
 cc_neg.2.a: "Investigate the minister's financial dealings."
 cc_neg.2.b: "Warn them privately. This behavior must stop."
 cc_neg.2.c: "Say nothing for now."

 cc_neg.3.title: "Faction in the Making"
 cc_neg.3.desc: "Two ministers with opposing convictions have been at court long enough for their disagreement to calcify into faction. [minister.GetName] is showing signs of choosing intrigue over governance. The court is beginning to choose sides."
 cc_neg.3.a: "Bring [minister.GetHerHim] in directly — task them with something that requires cooperation."
 cc_neg.3.b: "Let [minister.GetHerHim] cultivate their faction. Better to know their network."
 cc_neg.3.c: "Dismiss [minister.GetHerHim] before this deepens."

 cc_neg.4.title: "A Minister of Diminishing Returns"
 cc_neg.4.desc: "The age has advanced, but [minister.GetName] has not. [minister.GetHerHis] methods were adequate once. Now they are merely cautious, and cautious is another word for slow. The cabinet efficiency suffers quietly."
 cc_neg.4.a: "Give [minister.GetHerHim] a chance to demonstrate relevance."
 cc_neg.4.b: "Let the bureaucracy find its own level."
 cc_neg.4.c: "Retire [minister.GetHerHim] — we need someone sharper."

 cc_neg.5.title: "The Smell of Corruption"
 cc_neg.5.desc: "With wealth piling up in the court and the estates growing fat, [minister.GetName] has found opportunity. The accounts are technically balanced — but the balance appears to have been designed to benefit someone who is not the crown."
 cc_neg.5.a: "Confront [minister.GetHerHim] with the evidence — demand reform."
 cc_neg.5.b: "Accept it. The estates are happy; let them remain so."
 cc_neg.5.c: "Dismiss [minister.GetHerHim] without ceremony."

 cc_neg.6.title: "An Old Soldier Out of Time"
 cc_neg.6.desc: "[minister.GetName] served brilliantly in another era. But the armies of this age demand different thinking — different formations, different logistics, different doctrine. [minister.GetSheHe] refuses to learn them. The army is paying for it."
 cc_neg.6.a: "Mandate attendance at a new training program."
 cc_neg.6.b: "Honor [minister.GetHerHis] service and let [minister.GetHerHim] finish it their way."
 cc_neg.6.c: "Replace them with someone of the current age."

 cc_neg.7.title: "A Court Grown Cynical"
 cc_neg.7.desc: "We have passed over too many opportunities, declined too many good choices. [minister.GetName] has noticed. The sincerity has gone from [minister.GetHerHis] counsel, replaced with an ironic competence that the estates no longer find inspiring."
 cc_neg.7.a: "Give [minister.GetHerHim] something to believe in — take the ambitious path this time."
 cc_neg.7.b: "Cynicism keeps advisors honest."
 cc_neg.7.c: "Let [minister.GetHerHim] go."

 cc_neg.8.title: "Ambition Without Caution"
 cc_neg.8.desc: "[minister.GetName] has watched us fight and fail, expand and retreat, and drawn the wrong lesson from all of it: that we were not bold enough. Their counsel now pushes toward acquisition at any cost, and the antagonism and colonial failures that follow are not theirs to bear."
 cc_neg.8.a: "Redirect [minister.GetHerHis] energy — bold ideas, careful execution."
 cc_neg.8.b: "Bold counsel has its uses."
 cc_neg.8.c: "Relieve [minister.GetHerHim] of [minister.GetHerHis] post."

 # ============================================================
 # NEGATIVE TRAIT REHABILITATION EVENTS (cc_neg.11-19)
 # ============================================================

 cc_neg.11.title: "The Counselor Finds New Purpose"
 cc_neg.11.desc: "The capital has been growing. New construction, new wealth, new challenges — and [minister.GetName] has found [minister.GetHerHimself] confronted by a court that no longer tolerates the comfortable answers. Something has shifted in [minister.GetHerHis] counsel."
 cc_neg.11.a: "Fund a formal program of renewal — put [minister.GetHerHis] experience to new use."
 cc_neg.11.b: "Allow [minister.GetHerHim] to retire gracefully, legacy intact."

 cc_neg.12.title: "Peace Changes a Minister"
 cc_neg.12.desc: "Years of peace have a way of reminding ministers what governance is actually for. [minister.GetName] has spent this quiet period in genuine reflection. The profiteering voice in [minister.GetHerHis] counsel has grown quieter."
 cc_neg.12.a: "Acknowledge the change. Their experience is again an asset."

 cc_neg.13.title: "The Schemer Yields to Duty"
 cc_neg.13.desc: "[minister.GetName] has been given a demanding integration task — one that required working with the very ministers [minister.GetSheHe] had been undermining. Somewhere in that work, the faction-building became tedious and the task itself became interesting."
 cc_neg.13.a: "The court is stronger for their effort."

 cc_neg.14.title: "Efficiency Returns to the Cabinet"
 cc_neg.14.desc: "The cabinet is running well again, and [minister.GetName] has been part of the reason. Surrounded by functioning systems, they have found a way to contribute rather than obstruct. The bureaucratic inertia has lifted."
 cc_neg.14.a: "Recognize the improvement — this is the minister we needed."

 cc_neg.15.title: "Corruption Cleared"
 cc_neg.15.desc: "With the wealth hoarding resolved and the accounts opened to proper scrutiny, [minister.GetName] has had nowhere to hide the discrepancies. The estate enrichment has ended. Quietly, the corruption has ended with it."
 cc_neg.15.a: "Note the change. We will be watching more closely."

 cc_neg.16.title: "Doubt Returns to the Zealot"
 cc_neg.16.desc: "A minister who cannot tolerate heretics has been placed in a court where tolerance was the price of peace. It has cost them something — but what was lost appears to have been replaced by something older and more useful: nuance."
 cc_neg.16.a: "Welcome [rehabilitated_minister.GetHerHim] back to the full counsel."
 cc_neg.16.b: "Commission private theological counsel to accelerate [rehabilitated_minister.GetHerHis] reform."

 cc_neg.17.title: "A General Who Learned New Tricks"
 cc_neg.17.desc: "Military advancement has overtaken the old doctrine, and [minister.GetName] — finally — has kept pace. Their counsel on army composition and campaign planning is no longer a liability. The army has noticed."
 cc_neg.17.a: "Restore them to full military authority."

 cc_neg.18.title: "The Legend Changes Everything"
 cc_neg.18.desc: "Something remarkable has happened in this court, and [minister.GetName] was present for it. The cynicism that had settled into [minister.GetHerHis] manner has given way to something [minister.GetSheHe] had forgotten was possible: conviction."
 cc_neg.18.a: "Let [minister.GetHerHim] speak. The court will listen."

 cc_neg.19.title: "A Reckless Expander Finds a New Direction"
 cc_neg.19.desc: "Years of peace and diminished antagonism have given [minister.GetName] time to think about what bold counsel is actually for. The answer [minister.GetSheHe] has arrived at is more measured than their past advice — but still ambitious."
 cc_neg.19.a: "Their energy is now an asset — steady expansion, not reckless."
 cc_neg.19.b: "Redirect that energy entirely — let [minister.GetHerHim] become a provocateur."
