l_german:
 # ============================================================
 # CROSS-COUNTRY SYNERGY EVENTS (cc_intl namespace)
 # ============================================================

 # -------- STATIC MODIFIER NAMES --------
 STATIC_MODIFIER_NAME_cc_intl_scholar_influx: "Zustrom von Gelehrten"
 STATIC_MODIFIER_NAME_cc_intl_military_exchange: "Militäraustausch"
 STATIC_MODIFIER_NAME_cc_intl_trade_compact: "Handelsabkommen"
 STATIC_MODIFIER_NAME_cc_intl_steppe_alliance: "Steppenallianz"
 STATIC_MODIFIER_NAME_cc_intl_pilgrimage_network: "Wallfahrtsnetzwerk"
 STATIC_MODIFIER_NAME_cc_intl_religious_solidarity: "Religiöse Solidarität"
 STATIC_MODIFIER_NAME_cc_intl_shadow_operations: "Schattenoperationen"
 STATIC_MODIFIER_NAME_cc_intl_diplomatic_compact: "Diplomatisches Abkommen"
 STATIC_MODIFIER_NAME_cc_intl_intellectual_rivalry: "Intellektuelle Rivalität"

 # -------- GROUP A: INTELLECTUAL & SCHOLARLY --------

 cc_intl.1.title: "Der Austausch der Philosophen"
 cc_intl.1.desc: "Nachrichten erreichen uns aus [target_nation.GetName]: Ihr Hof hat Minister von ungewöhnlicher intellektueller Brillanz hervorgebracht. [minister.GetName] korrespondiert seit Monaten mit ihnen. Die Briefe waren bemerkenswert – und die Gelegenheit, die sie darstellen, könnte noch bemerkenswerter sein."
 cc_intl.1.a: "Schlage einen formellen wissenschaftlichen Austausch vor – beide Höfe profitieren davon."
 cc_intl.1.b: "Lade ihre Gelehrten hierher ein. Lass das Talent zu uns fließen."
 cc_intl.1.c: "Unser Hof behält seine eigenen Geheimnisse."

 cc_intl.2.title: "Gelehrte im Exil"
 cc_intl.2.desc: "Der Krieg, der [war_nation.GetName] verschlingt, hat eine Flut von Flüchtlingen ausgelöst – darunter Gelehrte, Ärzte und Verwalter von beträchtlichem Talent. Sie überqueren unsere Grenzen mit nichts als ihrem Wissen. [minister.GetName] glaubt, dass wir sie aufnehmen sollten."
 cc_intl.2.a: "Öffne den Hof für die Exilierten. Ihr Wissen ist unser Gewinn."
 cc_intl.2.b: "Bezahlen wir einige Söldner, um den Pöbel fernzuhalten."
 cc_intl.2.c: "Dies ist nicht unser Krieg, und dies sind nicht unsere Gelehrten."

 cc_intl.3.title: "Der rivalisierende Philosoph"
 cc_intl.3.desc: "Der Hof von [rival_court.GetName] hat sich zum führenden Zentrum der Gelehrsamkeit in der bekannten Welt erklärt. Der Anspruch ist nicht ohne Grundlage – aber er ist auch nicht unbestritten. Unsere eigenen intellektuellen Errungenschaften sind beträchtlich. Wie reagieren wir?"
 cc_intl.3.a: "Lasst die Rivalität beide Höfe schärfen. Wettbewerb fördert das Wissen."
 cc_intl.3.b: "Fordere ihre Vorherrschaft direkt heraus. Wir werden den Titel nicht preisgeben."
 cc_intl.3.c: "Schlage eine gemeinsame Akademie vor. Zusammen übertreffen wir das, was jeder allein erreichen könnte."

 # -------- GROUP B: MILITARY COOPERATION --------

 cc_intl.4.title: "Die Doktrin des Marschalls"
 cc_intl.4.desc: "[military_minister.GetName] hat den Krieg von [military_ally.GetName] mit professionellem Interesse verfolgt. Die Feldzüge haben Schwachstellen aufgezeigt – und unsere eigene Doktrin hat im Gegenzug etwas zu bieten. Hier ergibt sich eine Gelegenheit: Wissen teilen, von Expertise profitieren oder einfach nur beobachten."
 cc_intl.4.a: "Teilen Sie unsere Doktrin freiwillig. Gute Verbündete kämpfen besser."
 cc_intl.4.b: "Fordert im Gegenzug deren Veteranen. Erfahrene Soldaten sind Gold wert."
 cc_intl.4.c: "Das Fachwissen verkaufen. Ihr Gold ist ebenso gut wie ihre Dankbarkeit."

 cc_intl.5.title: "Nomadische Migration"
 cc_intl.5.desc: "Die Stammesfürsten von [steppe_neighbor.GetName] sind unruhig. [minister.GetName] – der das Denken der Steppe besser versteht als die meisten an diesem Hof – glaubt, dass wir an einem Scheideweg stehen: Allianz, Oberhoheit oder Transaktion. Jeder Weg hat seinen Preis und seine Belohnung."
 cc_intl.5.a: "Schmiede ein Bündnis. Deren Kavallerie und unsere Verwaltung – eine furchteinflößende Kombination."
 cc_intl.5.b: "Tribut fordern. Die Starken nehmen, die Schwachen geben."
 cc_intl.5.c: "Mieten Sie ihre Kavallerie direkt an. Das ist Geschäft, keine Politik."

 # -------- GROUP C: RELIGIOUS & FAITH NETWORKS --------

 cc_intl.6.title: "Die Solidarität des Kalifats"
 cc_intl.6.desc: "Unser Kanzler hat eine Delegation von [muslim_partner.GetName] empfangen, die eine Botschaft der Brüderlichkeit überbracht hat. Die islamische Welt ist nicht ein Imperium — sie ist eine Zivilisation. Es gibt Wege, das Bindegewebe dieser Zivilisation zu stärken, wovon alle profitieren, die den Glauben teilen."
 cc_intl.6.a: "Islamische Solidarität. Unsere Schicksale sind durch mehr als nur Verträge verbunden."
 cc_intl.6.b: "Ein Handelsnetzwerk-Kompakt. Die größte Stärke des dar al-Islam ist sein Handel."
 cc_intl.6.c: "Berufen Sie einen theologischen Gipfel ein. Die Gelehrten müssen sprechen."

 cc_intl.7.title: "Protestantische Solidarität"
 cc_intl.7.desc: "Die Reformation hat seltsame Bettgefährten und noch seltsamere Feinde hervorgebracht. [protestant_partner.GetName] teilt unser Bekenntnis, sieht sich ähnlichen Drücken gegenüber und hat über das Netzwerk unserer Minister Kontakt aufgenommen. Die Frage ist, wie viel Solidarität wir zeigen wollen – und zu welchem Preis."
 cc_intl.7.a: "Unsere Bruderschaft offen erklären. Wir stehen gemeinsam vor Gott und vor Rom."
 cc_intl.7.b: "Ein wissenschaftlicher Austausch. Die stärkste Waffe der Reformation ist das Argument, nicht die Arme."
 cc_intl.7.c: "Bestätige die Verbindung diskret. Diskretion ist das A und O der Beichtpolitik."

 cc_intl.8.title: "Die heilige Pilgerreise"
 cc_intl.8.desc: "Die heiligen Stätten ziehen Pilger aus aller Welt an, unter anderem aus [pilgrimage_partner.GetName]. Unser Minister — dessen spirituelle Autorität über den Kabinettssaal hinausreicht — ist der Meinung, dass die Krone eine aktive Rolle beim Beherbergen, Leiten und Profitieren aus diesem Strom gläubiger Reisender übernehmen sollte."
 cc_intl.8.a: "Veranstalte die große Pilgerfahrt. Lass diesen Hof zu einem heiligen Zentrum werden."
 cc_intl.8.b: "Sende stattdessen spirituelle Abgesandte an ihren Hof."
 cc_intl.8.c: "Agieren Sie als spiritueller Schiedsrichter zwischen unseren Höfen – Glaube als Diplomatie."

 # -------- GROUP D: TRADE & DIPLOMATIC --------

 cc_intl.9.title: "Der Pakt des Kaufmanns"
 cc_intl.9.desc: "[trade_partner.GetName]'s Kaufmannsgemeinschaft hat Kontakt mit der unseren aufgenommen. Unser Minister sieht eine Gelegenheit: Die Handelsrouten, die wir jeweils kontrollieren, überschneiden sich auf eine Weise, die eher komplementär als konkurrierend ist. Ein Pakt zum jetzigen Zeitpunkt könnte den Handel in dieser Region für eine Generation definieren."
 cc_intl.9.a: "Ein gemeinsames Handelsunternehmen. Beide Höfe prosperieren; keiner dominiert."
 cc_intl.9.b: "Exklusivrechte aushandeln. Unsere Kaufleute übernehmen die Führungsposition."
 cc_intl.9.c: "Studieren Sie ihre Praktiken im Stillen. Wissen ist eine eigene Form des Handels."

 cc_intl.10.title: "Der Einfluss des Großkanzlers"
 cc_intl.10.desc: "Der Hof von [junior_state.GetName] ist kleiner, schwächer und – wie unser Kanzler glaubt – empfänglich für Überredung. Die Frage ist, welche Form diese Überredung annehmen soll: Patronage, Extraktion oder eine Demonstration von Stärke."
 cc_intl.10.a: "Diplomatisches Patronat gewähren. Sie treten freiwillig in unseren Orbit ein."
 cc_intl.10.b: "Eine Tributvereinbarung treffen. Macht hat ihre Privilegien."
 cc_intl.10.c: "Zeigen Sie Stärke. Lassen Sie sie sehen, was Widerstand kostet."

 # -------- GROUP E: ESPIONAGE & SHADOW PLAY --------

 cc_intl.11.title: "Der Schattenhof reicht die Hand"
 cc_intl.11.desc: "[minister.GetName] beobachtet [shadow_target.GetName] schon seit einiger Zeit. Die dortige Feindseligkeit ist nicht zufällig – sie wird kultiviert, vielleicht von denen, die fürchten, was wir repräsentieren. Unser Schattenrat glaubt, dass die Zeit für ein Handeln gekommen ist: Informationen sammeln, Talente abwerben oder den nötigen Vorwand schaffen."
 cc_intl.11.a: "Den Geheimdienstapparat aufbauen. Wissen Sie über sie Bescheid, bevor sie es über uns tun."
 cc_intl.11.b: "Werben Sie ihre unzufriedenen Adligen. Ihr Verlust ist unser Gewinn."
 cc_intl.11.c: "Provoziere einen diplomatischen Zwischenfall. Wir werden unsere Rechtfertigung erhalten."

 # -------- GROUP F: RULER-TO-RULER --------

 cc_intl.12.title: "Die konfuzianische Mission"
 cc_intl.12.desc: "Der Hof von [tributary_state.GetName] wurde von unserem konfuzianischen Minister beobachtet, und das Ergebnis der Beobachtung ist dieses: Sie sind kleiner, sie sind Nachbarn und sie stehen im Orbit der himmlischen Tradition. Wie wir auf sie zugehen, wird den Charakter dieser Beziehung definieren – Patronage, Kultur oder Autorität."
 cc_intl.12.a: "Biete Tributbeziehungen an. Die himmlische Hierarchie verlangt nach Anerkennung, nicht nach Unterwerfung."
 cc_intl.12.b: "Eine Kulturmission entsenden. Die konfuzianische Verwaltungspraxis ist unser größtes Exportgut."
 cc_intl.12.c: "Himmlische Vorherrschaft behaupten. Unsere Kultur expandiert; ihr Widerstand wird zur Kenntnis genommen."
