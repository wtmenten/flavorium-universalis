l_german:
 # ============================================================
 # SITUATION NAME / DESCRIPTION
 # ============================================================
 cc_subject_bonds: "Vasallenbeziehungsregister"
 cc_subject_bonds_desc: "Ein ständiges Verzeichnis der Beziehungen der Krone zu ihren Untertanen, Dimension für Dimension. Jede Bindung wird entlang fünf Linien gemessen – wirtschaftlich, militärisch, politisch, kulturell und persönlich – von offener Ablehnung (-5) bis hin zu hingebungsvoller Loyalität (+5)."
 cc_subject_bonds_end: "Die Krone hält keine Untertanen mehr in einer Bindung."

 # ============================================================
 # PANEL HEADER
 # ============================================================
 CC_BOND_LEDGER_HEADER: "Vasallenbande"
 CC_BOND_LEDGER_DESC: "Deine Bindung zu jedem Untertanen wird über fünf Dimensionen verfolgt, die jeweils von -5 (feindselig) bis +5 (hingebungsvoll) reichen. Fahre mit der Maus über einen Wert, um zu sehen, was ihn beeinflusst. Nutze die Aktionen unter jedem Untertanen, um die Beziehung direkt zu pflegen, was mit Kosten und einer Abklingzeit verbunden ist.\n\nJede Bindung speichert sowohl einen aktuellen Wert als auch eine lebenslange Erinnerung: Alle paar Generationen wird der aktuelle Wert in einen langfristigen Durchschnitt überführt und selbst halb vergessen. Nutze den Ansichtsumschalter, um zwischen den beiden zu wechseln."

 # ============================================================
 # VIEW TOGGLE + ESTABLISHMENT DATE
 # ============================================================
 CC_BOND_VIEW_STM: "Kürzlich"
 CC_BOND_VIEW_LTM: "Lebenslang"
 CC_BOND_VIEW_TOGGLE: "Ansicht wechseln"
 CC_BOND_VIEW_TT: "Umschalten zwischen der #Y aktuellen#! Bindung (der aktuelle Wert, -5..+5) und der #Y lebenslangen#! Bindung (der langfristige Durchschnitt aus allen Erinnerungen). Die lebenslange Erinnerung prägt maßgeblich, wie sich ein Untertan verhält, wenn das Zeitalter der Revolutionen anbricht."
 CC_BOND_EST_SEP: "· est."

 # ============================================================
 # COLUMN LABELS
 # ============================================================
 CC_BOND_COL_SUBJECT: "Vasall"
 CC_BOND_COL_ECO: "Ökonomie"
 CC_BOND_COL_MIL: "Mil"
 CC_BOND_COL_POL: "Pol"
 CC_BOND_COL_CUL: "Cul"
 CC_BOND_COL_PER: "Pro"

 # ============================================================
 # DIMENSION TOOLTIPS — what raises and lowers each bond
 # ============================================================
 CC_BOND_DIM_ECO_TT: "Wirtschaftliches Band — Handel, Steuergerechtigkeit und gemeinsamer Wohlstand.\n\nErhöht durch: Krongebäude in den Ländereien des Vasallen, wachsende Provinzen, gemeinsame Institutionen und die Garantie seiner Schatzkammer.\nVerringert durch: Vernachlässigung, verlorene Provinzen, starke Extraktion und wenn der Vasall Sie bei Institutionen überholt, die Ihnen fehlen."
 CC_BOND_DIM_MIL_TT: "Militärisches Band — Kriegspflichten, militärische Loyalität und Kampfbereitschaft.\n\nErhöht durch: Zurückhaltung bei Truppenaufgeboten, Unterstützung des Vasallen auf Anfrage und gemeinsame Militärschauen.\nVerringert durch: häufige oder offensive Kriegsrufe, Ablehnung der Hilfsgesuche des Vasallen und eine Bilanz ungerechter Kriege."
 CC_BOND_DIM_POL_TT: "Politische Bindung — Regierungsführung, Autonomie und politische Integration.\n\nErhöht durch: Respektierung des Status des Vasallen, Gewährung von Privilegienchartern und stabile Verwaltung.\nVerringert durch: Verrat, drakonische Herrschaft und eine Historie von illoyalen oder treasonösen Handlungen."
 CC_BOND_DIM_CUL_TT: "Kulturelle Bindung — kulturelle Akzeptanz, religiöse Harmonie und Identität.\n\nErhöht durch: Erhalt des eigenständigen Charakters des Vasallen, günstige Glaubens- und Institutionsbindungen sowie die Förderung seiner Feste.\nVerringert durch: erzwungene Konversion von Kultur oder Glauben sowie kulturelle Reibungen."
 CC_BOND_DIM_PER_TT: "Persönliche Bindung — die Herzlichkeit zwischen den beiden Höfen und Herrschern.\n\nErhöht durch: persönliche Aufmerksamkeit, Gewährung von Hilfsgesuchen sowie dynastische und diplomatische Gesten.\nVerringert durch: Ablehnung der Rufe des Vasallen, Tributforderungen, strenge Rügen und anhaltende Vernachlässigung."

 # ============================================================
 # ENGAGE ACTION BUTTONS + TOOLTIPS
 # ============================================================
 CC_BOND_ACT_ECO: "Unterzeichnen"
 CC_BOND_ACT_ECO_TT: "Lokale Schatzkammer unterstützen\nKronenmünzen — skaliert nach Ihrem Einkommen und dem Wert des Vasallen — stützen die Finanzen des Vasallen für ein Jahrzehnt.\n\n#G Der Vasall erhält:#! günstigere Kredite (#G Bankzinsen -1%#!) und eine produktivere Münzstätte (#G Münzeinkommen +10%#!) für 10 Jahre.\nÖkonomische Bindung +1 (max. +5). 2-jährige Abklingzeit, die mit den anderen Aktionen für diesen Vasallen geteilt wird."
 CC_BOND_ACT_MIL: "Überprüfung"
 CC_BOND_ACT_MIL_TT: "Eine gemeinsame Militärschau abhalten\nExerziere die beiden Heere gemeinsam, zu Kosten, die sich an deinen Mitteln orientieren.\n\n#G Sowohl du als auch das Vasallsreich erhaltet:#! geringere Unterhaltskosten (#G Armee- & Flottenunterhaltseffizienz +10%#!) für 10 Jahre.\nMilitärische Bindung +1 (max. +5). Abklingzeit: 2 Jahre."
 CC_BOND_ACT_POL: "Charta"
 CC_BOND_ACT_POL_TT: "Eine Privilegiencharta verleihen (kostet Prestige)\nFormell die Freiheiten und den Status des Vasallen bestätigen.\n\n#G Der Vasalle erhält:#! Handelsfreiheiten (#G Export- & Importeffizienz +10%#!) und #G Loyalität zum Lehnsherrn +10#! für 10 Jahre.\n#R Ihr verzichtet auf:#! einen Teil seiner Einnahmen (#R Einkommen aus Vasallen -5%#!) für 10 Jahre.\nPolitisches Band +1 (max. +5). Abklingzeit: 2 Jahre."
 CC_BOND_ACT_CUL: "Festival"
 CC_BOND_ACT_CUL_TT: "Ein Kulturfestival fördern\nVeranstalten Sie ein großes Festival zu Ehren des Vasallen, wobei die Kosten Ihren Mitteln angepasst werden.\n\n#G Sie erhalten als Gastgeber:#! #G Kultureller Einfluss +2#!, #G Diplomatische Reputation +1#! und #G Monatliches Prestige +0,05#! für 10 Jahre.\nKulturelle Bindung +1 (max. +5). Abklingzeit: 2 Jahre."
 CC_BOND_ACT_PER: "Gesandter"
 CC_BOND_ACT_PER_TT: "Einen persönlichen Gesandten entsenden (gewinnt Prestige)\nStationiere einen vertrauenswürdigen Emissar am Hof des Vasallen, mit Geschenken, die deinen Mitteln entsprechen.\n\n#G Der Vasall erhält:#! #G Loyalität zum Lehnsherrn +15#! für 10 Jahre und sieht deine Krone wohlwollender (#G +20 Meinung#!).\nPersönliche Bindung +1 (max. +5). Abklingzeit: 2 Jahre."
 CC_BOND_ACT_TRIBUTE: "Tribut"
 CC_BOND_ACT_TRIBUTE_TT: "Tribut fordern\nPressen Sie den Vasallen um Münzen – eine Summe aus seinen eigenen Schatzkammern. Profitabel, aber unbeliebt.\n\nPersönliches Band -1 (min -5). 2 Jahre Abklingzeit."
 CC_BOND_ACT_REPRIMAND: "Rüge"
 CC_BOND_ACT_REPRIMAND_TT: "Strenge Rüge aussprechen\nEine kalte Zurechtweisung, die den Untertanen zur Fügsamkeit zwingt, aber die Beziehungen abkühlt.\n\nPolitisches Band +1 / Persönliches Band -1. 2 Jahre Abklingzeit."

 # ============================================================
 # ENGAGE EVENTS (cc_bonds.300-306)
 # ============================================================
 cc_bonds.300.t: "Schatzkammer unterstützen"
 cc_bonds.300.d: "Aus [cc_engage_subject.GetName] erreicht uns die Nachricht von leeren Kassen – der Handel stockt, die Ernte ist mager, die Steuerlisten sind erschöpft. Indem die Krone ihre Finanzen stützt, kann sie ihnen günstigere Kredite und eine reichere Münzprägung verschaffen und sie daran erinnern, wessen Großzügigkeit sie erhält."
 cc_bonds.300.a: "Öffne die Schatzkammer (Kronmünzen). Der Vasall erhält für ein Jahrzehnt günstigere Kredite und eine bessere Prägung; Wirtschaftliche Bindung +1."
 cc_bonds.300.b: "Sie werden alleine zurechtkommen."

 cc_bonds.301.t: "Eine gemeinsame Militärschau"
 cc_bonds.301.d: "Die Kapitäne von [cc_engage_subject.GetName] schlagen eine große Waffenrevue vor, die gemeinsam mit unserem eigenen Heer abgehalten wird — Banner werden gemeinsam präsentiert, Exerzierübungen Schulter an Schulter durchgeführt. Eine solche gemeinsame Disziplin bindet die Soldaten an ein gemeinsames Ziel und verbessert die Logistik beider Armeen."
 cc_bonds.301.a: "Halte die Schau ab (Kronmünze). Beide Reiche profitieren ein Jahrzehnt lang von geringeren Armee- und Flottenunterhaltskosten; Militärische Bindung +1."
 cc_bonds.301.b: "Wir haben keine Zeit für Paraden."

 cc_bonds.302.t: "Eine Privilegiencharte"
 cc_bonds.302.d: "Die Honoratioren von [cc_engage_subject.GetName] ersuchen um eine formelle Urkunde, die ihre Handelsfreiheiten und ihren Status innerhalb unseres Herrschaftsbereichs bestätigt. Die Gewährung bedeutet den Verzicht auf einen Teil der Einnahmen, die wir aus ihnen ziehen, aber es schmeichelt ihrem Stolz und bindet sie enger an die Krone."
 cc_bonds.302.a: "Gewähre die Charta (kostet Prestige). Der Untertan erhält Handelsfreiheiten und Loyalität, aber wir verzichten für ein Jahrzehnt auf einen Teil seiner Einnahmen; Politische Bindung +1."
 cc_bonds.302.b: "Ihre Privilegien sind in ihrer jetzigen Form ausreichend."

 cc_bonds.303.t: "Ein Kulturfestival"
 cc_bonds.303.d: "Künstler und Spielleute von [cc_engage_subject.GetName] suchen unser Mäzenatentum für ein großes Fest zu Ehren ihres besonderen Charakters — Musik, Pageants und Festmähler im Namen der Krone. Solchen Glanz auszurichten, vergrößert unseren eigenen Ruhm an den Höfen der Welt."
 cc_bonds.303.a: "Finanziere das Festival (Kronmünze). Als Gastgeber gewinnt die Krone für ein Jahrzehnt kulturellen Einfluss, Ansehen und Prestige; Kulturelle Bindung +1."
 cc_bonds.303.b: "Lasst sie auf eigene Kosten feiern."

 cc_bonds.304.t: "Ein persönlicher Gesandter"
 cc_bonds.304.d: "Es ist zu lange her, seit wir uns persönlich dem Hof von [cc_engage_subject.GetName] gewidmet haben. Ein vertrauenswürdiger Gesandter, der unter unserem eigenen Siegel stationiert ist und kleine Geschenke mitbringt, würde sie fest in der Umlaufbahn der Krone halten und ihre Gunst gegenüber unserem Hause stärken."
 cc_bonds.304.a: "Sende den Gesandten (Königliche Münzen; gewinnt Prestige). Der Untertan wird loyaler und sieht uns für ein Jahrzehnt wohlwollend gesonnen; Persönliche Bindung +1."
 cc_bonds.304.b: "Eine formale Anerkennung wird genügen."

 cc_bonds.305.t: "Tribut fordern"
 cc_bonds.305.d: "Unsere Schatzkammer ist knapp, und [cc_engage_subject.GetName] ist nicht mittellos. Wir könnten einen außerordentlichen Tribut fordern – profitabel gewiss, wenngleich sie die Belastung so schnell nicht vergessen werden."
 cc_bonds.305.a: "Fordern Sie den Tribut (Münzen aus ihren Schatzkammern). Persönliches Band -1."
 cc_bonds.305.b: "Wir werden uns nicht herablassen, sie unter Druck zu setzen."

 cc_bonds.306.t: "Ein strenger Tadel"
 cc_bonds.306.d: "Das Verhalten von [cc_engage_subject.GetName] ist eigenwillig geworden. Eine kalte und öffentliche Zurechtweisung würde sie an ihren Platz erinnern und ihre Folgsamkeit stärken – wenngleich solche Worte eine Kälte hinterlassen, die zwischen den Höfen anhält."
 cc_bonds.306.a: "Sprechen Sie die Rüge aus. Politisches Band +1, Persönliches Band -1."
 cc_bonds.306.b: "Ignoriere es vorerst."

 # ============================================================
 # ENGAGE-ACTION MODIFIERS (granted by cc_bonds.300-304)
 # ============================================================
 STATIC_MODIFIER_NAME_cc_bond_underwritten: "Kronenversicherung"
 STATIC_MODIFIER_DESC_cc_bond_underwritten: "Der Lehnsherr unterstützt unsere Schatzkammer, erleichtert unseren Kredit und bereichert unsere Münzprägung."
 STATIC_MODIFIER_NAME_cc_bond_drilled: "Gemeinsame Militärschau"
 STATIC_MODIFIER_DESC_cc_bond_drilled: "Das gemeinsame Training mit unseren Gastgebern hat die Logistik verbessert und den Unterhalt unserer Streitkräfte gesenkt."
 STATIC_MODIFIER_NAME_cc_bond_chartered: "Privilegiencharta"
 STATIC_MODIFIER_DESC_cc_bond_chartered: "Eine königliche Urkunde bestätigt unsere Handelsfreiheiten und unser Ansehen und bindet uns in Loyalität an die Krone."
 STATIC_MODIFIER_NAME_cc_bond_charter_granted: "Einräumung der Charta"
 STATIC_MODIFIER_DESC_cc_bond_charter_granted: "Die einem Untertanen per Charter gewährten Freiheiten kosten die Krone einen Teil der Einnahmen, die sie aus ihnen zieht."
 STATIC_MODIFIER_NAME_cc_bond_festival_host: "Festivalmäzen"
 STATIC_MODIFIER_DESC_cc_bond_festival_host: "Die Ausrichtung eines gefeierten Festes hat den kulturellen Einfluss und den Ruhm der Krone gesteigert."
 STATIC_MODIFIER_NAME_cc_bond_envoy_received: "Ansässiger Kronengesandter"
 STATIC_MODIFIER_DESC_cc_bond_envoy_received: "Ein vertrauenswürdiger Gesandter des Oberherrn hält unseren Hof fest in der Umlaufbahn der Krone."

 # ============================================================
 # ENGAGE-ACTION OPINION BIAS
 # ============================================================
 cc_bond_envoy_warmth: "Geehrt durch einen persönlichen Gesandten"
