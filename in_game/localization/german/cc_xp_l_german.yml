 cc_xp_none_presider: "@trigger_no! Kein Minister ist dienstalt genug, um den Vorsitz zu führen, oder diejenigen, die es sind, sind abwesend."
 cc_xp_none_protege: "Es gibt niemanden am Hofe, den man übernehmen könnte: Alle sind bereits Minister, Protegés oder der Herrscher."
 cc_xp_none_released_protege: "@trigger_no! Die Krone fördert keine Proteges."
 cc_xp_none_mentor: "@trigger_no! Kein Minister verfügt sowohl über die Dienstzeit als auch über die Disziplin, um zu lehren."
 cc_xp_none_pupil: "Niemand am Hofe ist frei, um einen Mentor zu erhalten."
 cc_xp_none_host: "@trigger_no! Kein Minister ist dienstalt genug, um einen Abend zu leiten, oder diejenigen, die es sind, sind abwesend."
 cc_xp_none_envoy: "@trigger_no! Kein Minister hat eine Disziplin, die er im Ausland praktizieren kann, und keine anderen Verpflichtungen."
 cc_xp_none_subject_court: "Es wird kein zuständiger Hof verfolgt, oder jeder beherbergt bereits einen Bewohner."
 cc_xp_none_recalled: "@trigger_no! Kein Minister ist im Ausland stationiert."
 cc_xp_none_trainee: "@trigger_no! Niemand ist frei, um zum Unterricht weggeschickt zu werden."
 cc_xp_none_patron: "Kein Minister ist senior genug, um seinen Namen hinter einen Künstler zu setzen."
 cc_xp_none_artist: "@trigger_no! Kein Künstler am Hof ist ohne Mäzen."
 cc_xp_none_broker: "Kein Minister am Hofe ist frei, um dies zu arrangieren."
 cc_xp_none_founder: "@trigger_no! Kein Minister verfügt über die Dienstzeit und die Disziplin, um eine Schule zu definieren."
 cc_xp_none_school_student: "@trigger_no! Niemand am Hof ist für eine Einschreibung geeignet."
 cc_xp_none_school: "Es existiert keine Schule, in die man eintreten könnte."
 cc_xp_none_minister: "@trigger_no! Es gibt niemanden am Hof mit einer zu lesen Akte."
 cc_xp_studio_visit: "Das Atelier besuchen"
 cc_xp_studio_visit_desc: "Besuchen Sie einen arbeitenden Künstler und entscheiden Sie, wie die Krone mit dem Ergebnis umgehen wird."
 cc_xp_studio_visit_concept: "[cabinet|e]"
 cc_xp_choose_studio: "Welcher Künstler?"
 cc_xp_tt_needs_studio: "Erfordert einen Künstler am Hofe, der in den letzten drei Jahren nicht besucht wurde"
 cc_xp_none_studio: "@trigger_no! Es ist kein Künstler am Hof für einen Besuch verfügbar."
 cc_xp.70.title: "Das Atelier"
 cc_xp.70.desc.working: "[cc_xp_artist.GetName] arbeitet bei Ihrer Ankunft und arbeitet noch eine Weile weiter, bevor er bemerkt, dass Sie da sind. Das Werk ist weit genug fortgeschritten, um zu erkennen, was es werden soll, aber noch nicht so weit, dass man sicher sein kann, dass es gut wird.\n\nDie Krone kann das bezahlen, was das Werk tatsächlich benötigt, oder es kann deutlich gemacht werden, dass der Hof erwartet, dass die Sache fertiggestellt wird."
 cc_xp.70.desc.idle: "[cc_xp_artist.GetName] hat nichts auf der Staffelei. Es gibt Skizzen, Gründe und eine lange Aufstellung darüber, was der letzte Auftrag an Materialien gekostet hat.\n\nEin Künstler am Hofe ohne laufende Arbeit ist ein Künstler, den der Hof dafür bezahlt, nachzudenken."
 cc_xp.70.a: "Bezahle alles, was das Werk benötigt."
 cc_xp.70.b: "Machen Sie deutlich, dass der Hof die Fertigstellung erwartet."
 cc_xp.70.c: "Weise ihnen auf Kosten der Krone ein Thema zu."
 cc_xp.70.d: "Ansehen, nichts sagen und gehen."
 cc_xp.71.title: "Die Enthüllung"
 cc_xp.71.desc.unfinished: "Das Datum wurde vor Monaten festgelegt und der Raum ist vorbereitet. Das Werk hingegen nicht.\n\n[cc_xp_artist.GetName] lässt sich nicht hetzen und erklärt ausführlich, dass die Alternative ein schlechteres Gemälde gewesen wäre."
 cc_xp.71.desc.finished: "Es ist vollbracht, es ist aufgehängt und der Hof schreitet daran vorbei.\n\nUnabhängig davon, was [cc_xp_artist.GetName] gezahlt wurde, gehört das Werk nun dem Reich."
 cc_xp.71.a: "Lassen Sie ihnen die nötige Zeit."
 cc_xp.71.b: "Präsentiere es dem Hofe."
 cc_xp.80.title: "Ein Schüler für [cc_xp_mentor.GetName]"
 cc_xp.80.desc: "[cc_xp_mentor.GetName] hat zugestimmt, jemanden aufzunehmen. Es ist keine Kleinigkeit, dies von einem Minister zu verlangen, der eine Abteilung zu leiten hat, und das Angebot wird nicht unbegrenzt bestehen bleiben.\n\nWer auch immer ausgewählt wird, wird das nächste Jahrzehnt damit verbringen, das Handwerk von [cc_xp_mentor.GetSheHe] zu erlernen, und wird in der Disziplin von [cc_xp_mentor.GetHisHer] wachsen statt in der eigenen."
 cc_xp.80.a: "[cc_xp_pupil_1.GetName]"
 cc_xp.80.b: "[cc_xp_pupil_2.GetName]"
 cc_xp.80.c: "[cc_xp_pupil_3.GetName]"
 cc_xp.80.d: "[cc_xp_pupil_4.GetName]"
 cc_xp.81.title: "Eine Postenbesetzung für [cc_xp_envoy.GetName]"
 cc_xp.81.desc: "[cc_xp_envoy.GetName] soll als Resident entsandt werden. Das Haus ist engagiert, die Ausgaben sind vereinbart, und es bleibt nur noch zu sagen, wohin.\n\nEin Resident ist für Jahre fort. Was er in dieser Zeit aufbaut, verschiebt die Dimension der Bindung, die seine eigene Disziplin berührt; so sind ein Administrator, ein Diplomat und ein Soldat drei grundlegend verschiedene Posten."
 cc_xp.81.a: "Der Hof von [cc_xp_court_1.GetName]"
 cc_xp.81.b: "Der Hof von [cc_xp_court_2.GetName]"
 cc_xp.81.c: "Der Hof von [cc_xp_court_3.GetName]"
 cc_xp.81.d: "Der Hof von [cc_xp_court_4.GetName]"
 cc_xp.82.title: "Ein Platz für [cc_xp_school_student.GetName]"
 cc_xp.82.desc: "Die Gebühren sind bezahlt und das Empfehlungsschreiben ist verfasst. Es fehlt nur noch eine Adresse darauf.\n\nEin Mitglied einer Schule gewinnt jedes Jahr an Erfahrung in der Disziplin dieser Schule, ob nun im Amt oder außerhalb dessen."
 cc_xp.82.a: "Die von [Player.MakeScope.GetVariable('cc_xp_school_1_founder').GetCharacter.GetName] gegründete Schule"
 cc_xp.82.b: "Die von [Player.MakeScope.GetVariable('cc_xp_school_2_founder').GetCharacter.GetName] gegründete Schule"
 cc_xp.82.c: "Die von [Player.MakeScope.GetVariable('cc_xp_school_3_founder').GetCharacter.GetName] gegründete Schule"
 cc_xp.83.title: "Ein Mäzen für [cc_xp_artist.GetName]"
 cc_xp.83.desc: "Die Krone hat entschieden, dass es sich lohnt, [cc_xp_artist.GetName] zu behalten. Doch Mäzenatentum wird nicht allein mit dem Geld der Krone finanziert: Es soll ein Name daran geknüpft sein, und dieser Name muss jemandem gehören, der am Hofe über genügend Ansehen verfügt, damit es eine Bedeutung hat.\n\nWer auch immer dies ist, wird die nächsten fünfundzwanzig Jahre als die Person vorgestellt werden, die [cc_xp_artist.GetName] entdeckt hat, und wird dadurch zum besseren Diplomaten werden."
 cc_xp.83.a: "[cc_xp_patron_1.GetName]"
 cc_xp.83.b: "[cc_xp_patron_2.GetName]"
 cc_xp.83.c: "[cc_xp_patron_3.GetName]"
 cc_xp.83.d: "[cc_xp_patron_4.GetName]"
 cc_xp.84.title: "Ein diskreter Verkauf"
 cc_xp.84.desc: "Es gibt einen Käufer, und der Käufer stellt keine Fragen, und niemand sonst tut es ebenso, solange alles ordnungsgemäß abläuft.\n\nDie wertvollsten Stücke, von denen sich die Sammlung respektabel trennen könnte, sind unten aufgeführt, zusammen mit ihrem geschätzten Wert. Ein diskreter Verkauf bringt weniger ein als ein offener, und der Preis eines Stücks hängt davon ab, wie gut es ist und wie bekannt der Name der Kultur ist, die es hervorgebracht hat. Der Hof wird bemerken, welche Wand kahl bleibt."
 cc_xp.84.a: "[cc_xp_work_1.GetName], von [cc_xp_work_1.GetCreatorName]: [cc_xp_work_1.GetQualityName] ([cc_xp_work_1.GetQuality|Y]%)"
