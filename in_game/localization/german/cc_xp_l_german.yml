 CC_XP_REC_HOME: "Am Hofe und verfügbar."
 cc_xp_tt_protege_room: "Die Krone hat weniger als drei Protegés"
 cc_xp_tt_needs_presider: "Erfordert einen Minister mit einer Seniorität von 3 oder mehr als Vorsitzenden"
 cc_xp_tt_needs_candidates: "Erfordert mindestens drei Personen, die an der Prüfung teilnehmen können"
 cc_xp_tt_needs_candidate_protege: "Erfordert einen jungen Erwachsenen am Hofe, der noch kein Minister ist und den unsere Gesetze im Kabinett zulassen würden"
 cc_xp_tt_needs_mentor: "Erfordert einen Minister mit einer Seniorität von 5 oder mehr und einer Disziplin, die er weitergeben kann"
