 cc_xp.85.title: "Beobachtungswürdig"
 cc_xp.85.desc: "Die Krone verfügt über Geld und Aufmerksamkeit für jemanden, der noch kein Amt bekleidet. Der Hof hat Meinungen darüber, wer dies sein sollte, und der Adel hat Meinungen darüber, dass die Krone Meinungen hat.\n\nEin Protegé sammelt langsam Erfahrung, während er wartet; er kann zur Ausbildung geschickt und ihm ein Mentor zugewiesen werden. Das Ziel ist es, einen Nachfolger bereit zu haben, bevor ein Platz frei wird."
 cc_xp.85.a: "[cc_xp_cand_1.GetName]"
 cc_xp.85.b: "[cc_xp_cand_2.GetName]"
 cc_xp.85.c: "[cc_xp_cand_3.GetName]"
 cc_xp.85.d: "[cc_xp_cand_4.GetName]"
 cc_xp_tt_needs_free_university: "Eine Universität, in der noch keine Schule ansässig ist"
 cc_xp_studio_visit_desc_specific: "Die Krone besucht [SCOPE.sCharacter('recipient').GetName] und entscheidet, was mit dem zu tun ist, was sich auf der Staffelei befindet."
 cc_xp_studio_visit_act: "$cc_xp_studio_visit$"
 cc_xp_studio_visit_past: "Ein Atelierbesuch"
 cc_xp_studio_visit_act_past: "Die Krone hat [SCOPE.sCharacter('recipient').GetName] herbeigerufen."
 cc_xp.90.title: "Eine Karriere für [cc_xp_subject.GetName]"
 cc_xp.90.desc: "[cc_xp_subject.GetName] ist aus der Kanzlei zurückgekehrt, besitzt eine Begabung, aber keinen Posten, an den man diese binden könnte. Die Obersekretäre haben Ansichten darüber, wo [cc_xp_subject.GetSheHe] am nützlichsten wäre, und jeder andere, der davon gehört hat, ebenfalls.\n\nWas nun entschieden wird, ist eine Karriere, nicht eine Kompetenz. Sie werden ganz unten beginnen und aufsteigen, sobald sie die administrative Erfahrung dafür erwerben."
 cc_xp.90.a: "Der Pfad des Reformers. Setze sie an das Gesetzbuch."
 cc_xp.90.b: "Die Schatzkammer. Setze sie an die Konten."
 cc_xp.90.c: "Der Pfad des Gelehrten. Lass sie lesen."
 cc_xp.90.d: "Der Baumeister. Schicke sie zur Vermessung der Hauptstadt."
 cc_xp.90.e: "Der Jurist. Setze sie an die Gerichte."
 cc_xp.90.f: "Der Integrator. Übertrage ihnen die neuen Provinzen."
 cc_xp.91.title: "Eine Karriere für [cc_xp_subject.GetName]"
 cc_xp.91.desc: "[cc_xp_subject.GetName] ist von der Botschaftstour zurückgekehrt und weiß nun, welche Botschafter es wert sind, mit ihnen zu sprechen, und welche lediglich gut gekleidet sind. Das ist ein Anfang, aber noch keine Position.\n\nWas nun entschieden wird, ist eine Karriere, nicht eine Kompetenz. Sie werden ganz unten beginnen und aufsteigen, sobald sie die diplomatische Erfahrung dafür erwerben."
 cc_xp.91.a: "Der Aufstieg des Diplomaten. Gib ihnen eine Gesandtschaft."
 cc_xp.91.b: "Die Kolonialhand. Schicke sie zu den fernen Stationen."
 cc_xp.91.c: "Der Weg des Kaufmanns. Gleiche sie dem Handelshaus zu."
 cc_xp.91.d: "Der Navigator. Setze sie an Bord von etwas."
 cc_xp.91.e: "Der Schatten. Schreibe nicht auf, was sie tun."
 cc_xp.92.title: "Eine Karriere für [cc_xp_subject.GetName]"
 cc_xp.92.desc: "[cc_xp_subject.GetName] ist mit Meinungen aus der Kriegsakademie zurückgekehrt; die meisten davon sind geliehen und ein oder zwei sind [cc_xp_subject.GetHisHer] eigene. Die Armee hat an mehreren Stellen Platz für [cc_xp_subject.GetHimHer] und eine starke Präferenz dafür, zu entscheiden, welche.\n\nWas nun entschieden wird, ist eine Karriere, nicht eine Kompetenz. Sie werden ganz unten beginnen und aufsteigen, sobald sie die militärische Erfahrung dafür erwerben."
 cc_xp.92.a: "Die militärische Härtung. Gleiche sie einem Feldstab zu."
 cc_xp.92.b: "Der Exerziermeister. Gib ihnen einen Exerzierplatz."
 cc_xp.92.c: "Der Ingenieur. Übertrage ihnen die Befestigungen."
 cc_xp.92.d: "Das Pferd. Gib ihnen das Remontedepot."
 cc_xp.90.g: "Keines davon passt. Lassen wir es vorerst dabei."
 cc_xp.91.f: "Keines davon passt. Lassen wir es vorerst dabei."
 cc_xp.92.e: "Keines davon passt. Lassen wir es vorerst dabei."
 cc_xp_tt_level_1: "Muss ein Minister mit mindestens Dienstalter 1 sein"
 cc_xp_tt_level_4: "Muss ein Minister mit mindestens Dienstalter 4 sein"
 cc_xp_tt_level_8: "Muss ein Minister mit einer Dienstzeit von mindestens 8 sein"
 cc_xp_tt_level_9: "Muss ein Minister mit einer Dienstzeit von mindestens 9 sein"
 cc_xp_tt_level_10: "Muss ein Minister mit mindestens Dienstalter 10 sein"
 cc_xp_protege_tt_taken: "Tritt als Protegé in die Obhut der Krone ein, gewinnt jedes Jahr an Erfahrung und ist für Ausbildung, Mentorenschaft und eine Schule berechtigt"
 cc_xp_protege_tt_noble: "Vom Adel, die es nicht als Beleidigung empfinden, wenn einer der Ihren befördert wird"
 cc_xp_protege_tt_outsider: "Nicht vom Adel, da diese es missbilligen, wenn die Krone Interesse an jemandem zeigt, für den sie nicht gebürgt haben"
 cc_xp_protege_tt_burghers: "Von den Bürgern, deren Haus die gesamten Kosten für deren Beförderung trägt"
 cc_xp_protege_tt_peasants: "Vom Bauernstand, deren Gemeinschaft gemeinsam die Hälfte der Kosten übernimmt"
 cc_xp_protege_tt_clergy: "Vom Klerus, wobei die Kirche der Krone mit Ansehen statt mit Münzen zurückzahlt"
 cc_xp_protege_tt_clergy_none: "Vom Klerus, obwohl unser Glaube kein Maß an Einfluss führt, mit dem die Kirche uns zurückzahlen könnte"
