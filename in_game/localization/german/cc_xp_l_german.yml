 cc_xp_host_soiree_act_past: "[SCOPE.sCharacter('recipient').GetName] hat begonnen, die Einladungen zu schreiben."
 cc_xp_choose_host: "Wer ist Gastgeber?"
 cc_xp.50.title: "Der Abend"
 cc_xp.50.a: "Eine Nacht für den Adel. Sparen Sie an nichts."
 cc_xp.50.b: "Kaufleute, Gelehrte und Klerus. Ein nützlicher Raum."
 cc_xp.50.c: "Ein Arbeitsessen. Zwölf Stühle, keine Musiker."
 cc_xp.51.title: "Nach der Party"
 cc_xp.51.desc: "Was der Abend hervorbrachte."
 cc_xp.52.title: "Ein Einklang der Geister"
 cc_xp.52.a: "Setze sie wieder zusammen."
 cc_xp.53.title: "Eine Indiskretion"
 cc_xp.53.a: "Kaufen Sie das Schweigen. Diskret und von mehreren Personen."
 cc_xp.53.b: "Lass sie reden. Es wird vorübergehen."
 cc_xp.54.title: "Ein Talent wurde entdeckt"
 cc_xp.54.a: "Nimm sie an. Aus ihnen lässt sich etwas machen."
 cc_xp.54.b: "Notiere den Namen und tue nichts."
 cc_xp.55.title: "Eine Delegation, mitten im Canape"
 cc_xp.55.a: "Höre ihnen zu und kläre es hier."
 cc_xp.55.b: "Lächle und wechsle in den nächsten Raum."
 cc_xp_second_to_subject: "Zweitgesandter an einem Vasallenhof"
 cc_xp_second_to_subject_desc_specific: "[SCOPE.sCharacter('recipient').GetName] wird für einige Jahre seinen Wohnsitz an einem Vasallenhof nehmen. Sie wählen, an welchem Hof."
 cc_xp_second_to_subject_act: "$cc_xp_second_to_subject$"
 cc_xp_second_to_subject_past: "Ein Resident wurde ernannt"
 cc_xp_second_to_subject_act_past: "[SCOPE.sCharacter('recipient').GetName] ist abgereist und wird einige Jahre unterwegs sein."
 cc_xp_choose_envoy: "Wer wird stationiert?"
 cc_xp_choose_subject_court: "An welchen Hof?"
 cc_xp_recall_envoy: "Einen Residenten zurückrufen"
 cc_xp_recall_envoy_desc: "Beenden Sie eine Stationierung vorzeitig und bringen Sie den Minister nach Hause. Was auch immer an Beziehung aufgebaut wurde, bleibt bestehen: Eine Bindung ist ein Protokoll dessen, was geschah, kein Modifikator, den man mietet."
 cc_xp_recall_envoy_desc_specific: "[SCOPE.sCharacter('recipient').GetName] wird von seinem Posten zurückgerufen und kehrt ins Kabinett zurück."
 cc_xp_recall_envoy_act: "$cc_xp_recall_envoy$"
 cc_xp_recall_envoy_past: "Ein Resident wurde zurückgerufen"
 cc_xp_recall_envoy_act_past: "[SCOPE.sCharacter('recipient').GetName] ist auf dem Heimweg."
 cc_xp_choose_recalled: "Wer kehrt heim?"
 cc_xp.60.title: "Der Gesandte schreibt"
 cc_xp.60.a: "Handeln Sie danach. Lassen Sie sie sehen, dass wir lesen, was sie uns senden."
 cc_xp.60.b: "Heften Sie es ab. Unser Mann lernt mehr, wenn er schweigt."
 cc_xp.61.title: "Der Gesandte übertreibt es"
 cc_xp.61.a: "Unterstützen Sie sie. Der Mann der Krone ist der Mann der Krone."
 cc_xp.61.b: "Entschuldige dich. Öffentlich und ausführlich."
 cc_xp.62.title: "Ein erbetener Gefallen"
 cc_xp.62.a: "Gewähre sie. Günstig erkauftes Wohlwollen ist selten."
 cc_xp.62.b: "Lasse unseren Mann freundlich erklären, warum nicht."
 cc_xp_found_institution_desc: "Gründen Sie eine dauerhafte Denkschule unter einem leitenden Minister, dessen eigene Disziplin zur Disziplin der Schule wird. Alle Personen, die danach eingeschrieben werden, steigern sich jedes Jahr in dieser Disziplin, ob sie nun ein Amt bekleiden oder nicht.\n\nEin Reich kann höchstens drei besitzen: Die erste erfordert eine Universität in der Hauptstadt, die zweite den Fortschritt der Gelehrtenorden und die dritte die Erleuchtete Verwaltung. Sie sind bewusst ein Jahrhundert voneinander entfernt."
 cc_xp_host_soiree_desc: "Lassen Sie einen Minister die Saison mit einem Abend am Hof eröffnen. Damit wird die Halle gemietet; was der Abend tatsächlich kostet und für wen er gedacht ist, entscheidet sich in der Nacht selbst.\n\nBei solchen Dingen passiert immer etwas. Welche Art von Etwas, hängt davon ab, wie viel Sie ausgegeben haben."
 cc_xp.50.desc: "Die Halle ist gemietet, die Einladungen sind verschickt, und [cc_xp_host.GetName] steht mitten darin und stellt eine Frage, deren Antwort Geld kostet: Für wen ist dieser Abend eigentlich gedacht?\n\nDie großen Familien erwarten, eingeladen zu werden. Die Handelshäuser und die Universitätsgelehrten wären geschmeichelt und würden sich länger daran erinnern. Und es gibt eine dritte Option, an der niemand Freude haben wird: die Gästeliste auf Personen zu beschränken, von denen die Krone tatsächlich etwas benötigt."
 cc_xp.52.desc: "[cc_xp_subject.GetName] und [cc_xp_other.GetName] wurden durch Zufall nebeneinander gesetzt und sprachen noch, als die Musiker ihre Instrumente packten.\n\nWas auch immer sie beieinander fanden, es hat den Kontakt mit dem nächsten Morgen überstanden. Sie wurden seitdem zweimal gemeinsam gesehen, und beide arbeiten dadurch besser."
 cc_xp.53.desc: "Es ist nicht klar, wie viel [cc_xp_subject.GetName] getrunken hatte, und es spielt jetzt kaum eine Rolle. Was zählt, ist, dass es in einem Raum mit vierzig Personen gesagt wurde und dass mindestens sechs von ihnen genau verstanden haben, was da gerade zugegeben wurde.\n\nDie Geschichte nimmt bereits ihren Lauf. Man kann sie kaufen, oder man kann sie gewähren lassen, bis sie in einer Saison wieder vergessen ist, was die günstigere und die demütigendere Option ist."
 cc_xp.54.desc: "[cc_xp_subject.GetName] ist seit Jahren am Hof, bekleidet kein Amt und erregt keine Aufmerksamkeit, und verbrachte heute Abend eine Stunde damit, einem Minister etwas zu erklären, der zuvor nicht geglaubt hatte, dass es überhaupt etwas zu erklären gäbe.\n\nNiemand hat sie jemals richtig beachtet. Das ist nun eine bewusste Entscheidung und kein Versehen mehr."
 cc_xp.55.desc.nobles: "Drei der großen Familien haben es geschafft, gemeinsam in der Nähe der Tür zu stehen, was bei dieser Art von Veranstaltung niemals ein Zufall ist. Sie haben eine Beschwerde über den Rangprotokoll und haben genau den einen Abend gewählt, an dem eine Ablehnung besonders auffällig wäre.\n\nSie werden sich mit Geld zufrieden geben, wie sie es gewöhnlich tun."
 cc_xp.55.desc.burghers: "Die Handelshäuser haben ihren vernünftigsten Mann geschickt, woran man erkennt, dass die Bitte nicht vernünftig ist. Er wartet, bis der Raum halb leer ist, lobt den Wein und erklärt, was die Gilden sich wünschen.\n\nEs würde etwas kosten. Es würde jedoch auch in Erinnerung bleiben."
 cc_xp.55.desc.clergy: "Der Bischof kreist schon seit einer Stunde und erwischt die Krone schließlich zwischen zwei Gesprächen. Es geht um eine Stiftung und darum, wer diese bezahlt.\n\nEr ist völlig bereit, abgelehnt zu werden. Er würde es lediglich vorziehen, nicht abgelehnt zu werden."
 cc_xp_second_to_subject_desc: "Entsenden Sie einen Minister als Residenten zu einem Ihrer Vasallen. Er ist für Jahre aus Ihrem Kabinett verschwunden, er entwickelt sich dort erheblich weiter, und die Beziehung, die er aufbaut, verändert jedes Jahr die Bindung dieses Vasallen.\n\nWelche Bindung, hängt davon ab, wen Sie entsenden. Ein Verwalter vertieft die politische Beziehung, ein Diplomat die persönliche und ein Soldat die militärische."
 cc_xp.60.desc: "Die Depesche von [cc_xp_subject_court.GetName] umfasst elf Seiten, was entweder auf Gründlichkeit oder Einsamkeit hindeutet. Vergraben in der Mitte ist etwas Nützliches: Wer an diesem Hof tatsächlich gehört wird und wer lediglich als Erster spricht.\n\nMan kann darauf reagieren, was bemerkt werden wird, oder es abheften, was nicht geschehen wird."
 cc_xp.61.desc: "Unser Resident bei [cc_xp_subject_court.GetName] hat eine Anweisung erteilt. Keine Empfehlung, keine im Namen der Krone übermittelte Bitte: eine Anweisung, an einen Minister eines Hofes, der nicht der unsere ist, und das vor Zeugen.\n\nSie hatten wahrscheinlich recht. Das ist nicht die Schwierigkeit. Die Schwierigkeit besteht darin, dass nun jeder dort genau weiß, wie die Krone über sie denkt, und darauf wartet zu sehen, ob wir dies laut aussprechen."
 cc_xp.62.desc: "Es hat [cc_xp_subject_court.GetName] drei Jahre an Gastfreundschaft gekostet, um zu diesem Punkt zu gelangen, was darauf hindeutet, dass sie es ernst meinen. Die Bitte wurde über unseren eigenen Residenten übermittelt, vorsichtig, während des Abendessens, so wie man diese Dinge handhabt, wenn eine Ablehnung weiterhin möglich bleiben muss.\n\nSie wollen Geld. Sie waren bei der Bitte anständig."
 cc_xp_enroll_in_school: "In einer Schule einschreiben"
 cc_xp_enroll_in_school_desc: "Platziere einen Minister oder Protegé in einer bestehenden Schule. Sie erwerben danach jedes Jahr die Disziplin dieser Schule.\n\nGenau hier liegt der Zweck eines Protegés: Jahre, die damit verbracht werden, eine Disziplin zu absorbieren, während man auf einen Posten wartet, bedeuten, dass sie bereits mit einem gewissen Grundstand in das Kabinett eintreten, anstatt bei Null anzufangen."
 cc_xp_enroll_in_school_desc_specific: "[SCOPE.sCharacter('recipient').GetName] wird einer der Schulen des Reiches beitreten und jedes Jahr danach deren Disziplin erwerben. Sie wählen, welcher."
