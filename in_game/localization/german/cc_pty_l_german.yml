 CC_PTY_EXP_TITLE: "Was sie erwartet"
 CC_PTY_EXP_CABINET: "Minister im Kabinett"
 CC_PTY_EXP_CABINET_TT: "+5 für einen seiner Minister im Kabinett, +25 für zwei oder mehr. -20, wenn keiner vertreten ist, während sie ein Fünftel der Sitze oder mehr hält."
 CC_PTY_EXP_HEAD: "Kabinettschef"
 CC_PTY_EXP_HEAD_TT: "+15, solange das Oberhaupt des Kabinetts dieser Partei angehört."
 CC_PTY_EXP_RULER: "Der Herrscher"
 CC_PTY_EXP_RULER_TT: "+10, solange der Herrscher dieser Partei angehört."
 CC_PTY_EXP_COMP: "Zusammensetzung des Kabinetts"
 CC_PTY_EXP_COMP_TT: "In einem einseitig besetzten Kabinett +10 für die führende Partei und -10 für jede andere. In einem ausgewogenen Kabinett fällt die Erwartung nie unter -20."
 CC_PTY_CARD_FX_TT: "Alles, was diese Partei derzeit auf das Reich anwendet, summiert nach Modifikator: ihr Ansehen, ihr Wohlwollen oder Unmut, ihre Führung, jeder gewährte Gefallen und jede Eskalation. Wählen Sie die Partei für die detaillierte Aufschlüsselung aus."
 CC_PTY_ESC_1_TT: "#N Warnung.#! Diese Partei ist wütend und hält 20% Macht oder mehr: eine Überprüfung wurde so verbracht. Eine weitere führt zu Unruhe, und eine dritte zum Ergebnis. Erhöhe ihre Zufriedenheit über -50 oder senke ihre Macht unter 20%, um sie eine Stufe zurückzustufen."
 CC_PTY_ESC_2_TT: "#N Unruhe.#! Diese Partei ist wütend, hält 20% Macht oder mehr und dies ist bereits seit zwei Überprüfungen der Fall. Eine weitere, und sie wird handeln. Erhöhe ihre Zufriedenheit über -50 oder senke ihre Macht unter 20%, um sie eine Stufe zurückzustufen."
 CC_PTY_LEADERS_NONE: "Keine"
 CC_PTY_LEDGER_XP_OFF: "Die Kabinettsfahrung ist für dieses Spiel deaktiviert, daher weist das Hofregister keine Kader- oder Hof-Tabs auf. Die Parteien Ihres Reiches und die Kammer befinden sich im Tab Fraktionen."
