 cc_pty_tt_liberal_sat_15: "Die Liberalen gewinnen 15 Zufriedenheit."
 cc_pty_tt_liberal_sat_40: "Die Liberalen gewinnen 40 Zufriedenheit."
 cc_pty_tt_liberal_sat_minus_10: "Die Liberalen verlieren 10 Zufriedenheit."
 cc_pty_lu_tt_down_5: "Das Momentum des Aufstands sinkt um 5."
 cc_pty_lu_tt_down_6: "Das Momentum des Aufstands sinkt um 6."
