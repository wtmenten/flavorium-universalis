 cc_pty_lu_tt_up_5: "Das Momentum des Aufstands steigt um 5."
 cc_pty_lu_tt_up_8: "Das Momentum des Aufstands steigt um 8."
 cc_pty_lu_tt_up_10: "Das Momentum des Aufstands steigt um 10."
 cc_pty_lu_tt_up_12: "Das Momentum des Aufstands steigt um 12."
 cc_pty_lu_tt_repressed: "Die Clubs erinnern sich an den Einsatz von Gewalt: Der Schwung steigt für den Rest des Aufstands jeden Monat um 0,5 schneller, und es könnte ein Märtyrer entstehen."
 cc_pty_lu_tt_repression_lifted: "Die Erinnerung an die Gewalt verblasst: Der Schwung steigt dadurch nicht mehr schneller."
 cc_pty_lu_end_defused_tt: "Das Momentum des Aufstands ist auf 0 gesunken"
 cc_pty_lu_end_boiled_tt: "Das Momentum des Aufstands hat 100 erreicht (die Krone muss antworten)"
 CC_PTY_LU_MOMENTUM: "Momentum des Aufstands: #high [FixedPointToInt(Player.MakeScope.GetVariable('cc_pty_lu_momentum').GetValue)]#! / 100"
 CC_PTY_LU_MOMENTUM_TT: "Steigt monatlich um 1, solange nichts unternommen wird, plus jeweils 0,5, solange die Clubs sich an die Gewaltanwendung erinnern und solange die Stabilität negativ ist. Sinkt um 1,5, wenn die erwartete Zufriedenheit der Liberalen 0 oder höher ist, und jeweils um 0,5 für einen liberalen Minister im Kabinett, eine Gesellschaft, die bei 30 oder mehr in Richtung Liberalismus tendiert, und geltende Amtszeitbeschränkungen. Bei 0 endet der Aufstand; bei 100 muss die Krone eine Verfassung gewähren oder kämpfen."
 cc_pty_liberal_uprising_desc: "Die liberalen Clubs sind auf den Straßen. Sie wollen eine Verfassung, Einschränkungen der Krone und ein Mitspracherecht in der Regierung, und sie werden nicht ohne einen Teil davon nach Hause gehen.\n\nDer Aufstand hat einen Impuls, der oben angezeigt wird und bei 60 beginnt. Er steigt jeden Monat um 1, solange nichts unternommen wird. Er sinkt, sobald das Anliegen der Liberalen berücksichtigt wurde: ihre erwartete Zufriedenheit liegt bei 0 oder mehr, ein liberaler Minister befindet sich im Kabinett, die Gesellschaft tendiert zu 30 oder mehr in Richtung Liberalismus oder Amtszeitbeschränkungen sind in Kraft. Ereignisse während des Aufstands verändern den Impuls weiter. Bei 0 endet der Aufstand. Bei 100 muss die Krone eine Verfassung gewähren oder einen Bürgerkrieg führen. Nach fünf Jahren endet er ungelöst."
 cc_pty.42.desc: "Die Clubs der Liberalen haben ihre Mitglieder mobilisiert. Auf den Plätzen stehen Menschenmengen, an jeder Tür hängen gedruckte Forderungen und die Soldaten sind sich nicht sicher, auf welcher Seite sie stehen.\n\nKeine einzelne Antwort wird sie nach Hause schicken. Der Aufstand beginnt mit einem Impuls von 60 und steigt weiter an, bis ihr Anliegen bearbeitet wurde. Bei 0 endet er; bei 100 muss die Krone eine Verfassung gewähren oder kämpfen."
