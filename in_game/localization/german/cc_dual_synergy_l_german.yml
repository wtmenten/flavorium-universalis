l_german:
 # ============================================================
 # DUAL-LAYER SYNERGY EVENTS (cc_dual namespace)
 # Cabinet × Religious_Figure pair events
 # ============================================================

 cc_dual.1.title: "Der Kriegermystiker"
 cc_dual.1.desc: "[minister.GetName] ist ein Widerspruch, den das Zeitalter ermöglicht hat: ein Kavalleriekommandant von echtem Geschick, dessen Sufi-Praxis [minister.GetHerHis] Verständnis des Krieges vertieft statt gespalten hat. Die Klinge und das Gebet sind in [minister.GetHerHis] Händen Ausdruck derselben Disziplin."
 cc_dual.1.a: "Dies ist ein Kommandant wie kein anderer. Lassen wir seine Dualität zu unserer Stärke werden."
 cc_dual.1.b: "Die Konversion eroberter Territorien ist der Ort, an dem ihre spirituelle Energie am besten eingesetzt wird."

 cc_dual.2.title: "Der heilige Diplomat"
 cc_dual.2.desc: "In der byzantinischen Tradition waren das Heilige und das Diplomatische nie getrennt — die Gewänder des Patriarchen und das Siegel des Kanzlers teilten sich dasselbe Vorzimmer. [minister.GetName] hat diese Synthese wiederbelebt: Ihre religiöse Autorität und diplomatische Kapazität sprechen mit einer Stimme, und die Höfe, die sie besuchen, haben gelernt zuzuhören."
 cc_dual.2.a: "Dies ist Staatskunst, wie sie einst praktiziert wurde. Lassen wir sie wirken."
 cc_dual.2.b: "Setzen Sie sie dort ein, wo Konversion und Diplomatie am dringendsten benötigt werden."

 cc_dual.3.title: "Der rationale Theologe"
 cc_dual.3.desc: "[minister.GetName] lehnt die Wahl zwischen Vernunft und Glauben ab. Die großen islamischen Philosophen lehnten sie ab. Dies taten auch die Scholastiker. Und dies tut [minister.GetHerHim]: ein Geist, geschult in der Forschung der Aufklärung, angewandt auf Fragen der Doktrin. Die Institutionen, die dieser Minister schafft, sind stärker, weil sie beide Traditionen vereinen."
 cc_dual.3.a: "Diese Synthese ist genau das, was das Zeitalter braucht. Lassen wir sie arbeiten."
 cc_dual.3.b: "Ihre philosophische Klarheit hat etwas Größeres offenbart — die Grundlagen eines Philosophenhofes."
 cc_dual.3.b.tt: "Schaltet die Regierungsreform „Hof der Philosophen“ frei."

 cc_dual.4.title: "Das protestantische Parlament"
 cc_dual.4.desc: "Die Reformation zeichnete die Landkarte des Glaubens und der Regierungsführung gleichzeitig neu. [minister.GetName] steht an diesem Schnittpunkt: ein parlamentarischer Akteur, dessen reformatorische Theologie [minister.GetHerHis] legislativer Arbeit eine moralische Ernsthaftigkeit verleiht, die einer rein transaktionalen Politik fehlt. Die Kammer hat dies bemerkt."
 cc_dual.4.a: "Lasst ihren reformierten Glauben das Fundament des Parlaments stärken."
 cc_dual.4.b: "Die Zufriedenheit des Klerus ist das dringlichere Bedürfnis – lenken Sie Ihre Energie dorthin."

 cc_dual.5.title: "Himmlisches Mandat"
 cc_dual.5.desc: "Der konfuzianische Gelehrte, der zudem prophetische Gaben besitzt, ist eine Figur, die in der klassischen Tradition respektiert und gefürchtet wurde. [minister.GetName] besitzt beides: die meritokratische Disziplin der Prüfungskultur und die orakelhafte Autorität, die die Höfe verstummen lässt, wenn sie sprechen. Das Mandat des Himmels, so sagt man, geht über auf diejenigen, die sowohl seine administrativen als auch seine mystischen Dimensionen lesen können."
 cc_dual.5.a: "Dies ist die konfuzianische Synthese – Gelehrsamkeit und der Segen des Himmels vereint."
 cc_dual.5.b: "Ihre Gaben weisen auf etwas Größeres hin — die Grundsteine des Mittleren Reiches."
 cc_dual.5.b.tt: "Schaltet den Pfad zur legendären Quest „Mittleres Reich“ frei."

 cc_dual.6.title: "Das Gesetz und der Buchstabe"
 cc_dual.6.desc: "Die meisten Höfe machen den praktischen Verwalter und den schriftgelehrten Juristen zu Rivalen. [minister.GetName] hat diese Rivalität abgelehnt. Ihre effiziente Verwaltung gründet sich auf einer Lesart des heiligen Rechts als ursprüngliche Quelle guter Regierungsführung. Reform bedeutet für sie keinen Bruch mit der Tradition — sondern eine Rückkehr zu ihr."
 cc_dual.6.a: "Gesetz und Schrift zusammen bilden ein stabileres Fundament als jede für sich allein."
 cc_dual.6.b: "Ihr ministerielles Engagement spricht für sich selbst."

 cc_dual.7.title: "Das widerwillige Schwert"
 cc_dual.7.a: "Ein General, der den Frieden bevorzugt, ist immer noch ein General. Lassen wir sie arbeiten."
 cc_dual.7.b: "Ihr Wunsch nach Frieden sollte in die Diplomatie gelenkt werden."

 cc_dual.8.title: "Der fromme Schatzmeister"
 cc_dual.8.desc: "Der Defterdar verwaltet die Finanzen des Reiches; der Asket strebt danach, sich von ihnen zu lösen. [minister.GetName] hat mit dieser Spannung Frieden geschlossen, indem er das Finanzmanagement als spirituelle Disziplin betrachtet: Verschwendung ist Sünde, Effizienz ist Tugend, und der Klerus kann zufriedengestellt werden, gerade weil dieser Minister weigert, sich auf Kosten des Glaubens zu bereichern."
 cc_dual.8.a: "Finanzielle Disziplin und spirituelle Überzeugung gemeinsam – das Reich profitiert davon."
 cc_dual.8.b: "Die Zufriedenheit des Klerus und eine bescheidene ministerielle Investition sind die praktischen Früchte."

 cc_dual.9.title: "Der Ritter Gottes"
 cc_dual.9.desc: "Im ritterlichen Ideal waren das Kampfbereite und das Geistige kein Widerspruch — sie waren dieselbe Tugend, ausgedrückt in verschiedenen Registern. [minister.GetName] hat dieses Ideal gelebt: ein edler Champion, der zugleich der Hofkaplan ist und dessen Schwertarm und pastorale Autorität die gleiche Sprache des heiligen Dienstes sprechen."
 cc_dual.9.a: "Das ritterliche Ideal lebt in diesem Minister weiter. Möge es den Adel inspirieren."
 cc_dual.9.b: "Ihre spirituellen Gaben sind dem Klerus und dem Glauben besser gewidmet."

 cc_dual.10.title: "Eine Glaubenskrise"
 cc_dual.10.desc: "[minister.GetName] ist in eine unmögliche Lage geraten: Die Autorität des Großinkvisitors erfordert die Unterdrückung genau jener reformatorischen Fragen, die [minister.GetHerHis] reformatorische Theologie befürwortet. Der Widerspruch ist sichtbar geworden. Der Hof beobachtet, welche Überzeugung siegt."
 cc_dual.10.a: "Unterdrücke den Zweifel — die Rolle des Inquisitors verlangt Gewissheit."
 cc_dual.10.b: "Lasst den Widerspruch sich auflösen – beide Überzeugungen weichen etwas Größerem."
 cc_dual.10.b.tt: "Der Minister verliert beide Merkmale. Ein synthetisierender Kronentheologe tritt hervor."
 cc_dual.10.c: "Entlasse [minister.GetHerHim], bevor sich der Konflikt ausweitet."
 cc_dual.7.desc: "[minister.GetName] ist ein defensiver Kommandant, der es lieber nicht wäre. Seine Praxis als Eremit – oder sein Temperament als solcher – hat seinem militärischen Rat eine ungewöhnliche Qualität verliehen: Er entwirft Befestigungen exzellent, weil er sich aufrichtig wünscht, dass sie niemals benutzt werden müssen. Die Kriegsmüdigkeit belastet ihn mehr als die meisten anderen."
