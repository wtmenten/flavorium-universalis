l_german:
 # === cc_bonds.110 — A Merchant Seeks Passage ===
 cc_bonds.110.title: "Ein Kaufmann sucht Passage"
 cc_bonds.110.desc: "Ein Kaufmann aus [bond_subj.GetName] ist uns aufgefallen. Sein Vorschlag ist unkompliziert: Er möchte eine Handelsroute etablieren, die durch unser Territorium führt – unsere Häfen, unsere Straßen, unsere Lizenzvereinbarungen. Er ist noch nicht reich genug, um gefährlich zu sein, aber auch noch nicht arm genug, um verzweifelt zu sein. Er hat Talent, Ehrgeiz und einen Plan. Was er braucht, ist die Erlaubnis. Wir müssen entscheiden, welche Art von Erlaubnis wir geben und was wir im Gegenzug erwarten. Männer wie dieser haben die Angewohnheit, größer zu werden als erwartet."
 cc_bonds.110.a: "Gewähre ihm volle Durchgangsrechte und ein Handelsmonopol. Lass ihn wachsen und loyal bleiben."
 cc_bonds.110.b: "Gewähre Durchgangsrechte. Er darf frei handeln, jedoch ohne Monopol."
 cc_bonds.110.c: "Lehnen Sie die Anfrage ab. Wir sind nicht dazu da, ausländische Kaufleute reich zu machen."

 # === cc_bonds.111 — The Merchant's Expansion ===
 cc_bonds.111.title: "Die Expansion des Kaufmanns"
 cc_bonds.111.desc_patronized: "Der Kaufmann aus [bond_subj.GetName] ist in den vergangenen Jahren zu einem sehr reichen Mann geworden – und mit Reichtum meinen wir die Art, die die Wirtschaft eines Territoriums neu gestaltet. Er beschäftigt Hunderte. Seine Schiffe verbinden Häfen von hier bis zur Kolonialgrenze. Seine Kreditwürdigkeit ist in der halben bekannten Welt hoch. Das Monopol, das wir gewährten, tat genau das, was Monopole tun: Es konzentrierte Kapital effizient, und dieses Kapital wurde durch unsere Patronage aufgebaut. Nun versucht er, sein Netzwerk weiter auszubauen – und erreicht Häfen und Territorien von [bond_secondary.GetName] sowie Kaufleute, die uns nicht unterstellt sind. Die Frage ist, wie wir auf einen Mann reagieren, der über seine Herkunft hinausgewachsen ist."
 cc_bonds.111.desc_allowed: "Der Kaufmann aus [bond_subj.GetName] ist über die Jahre mäßig prosperiert – ein solides Handelshaus, eine kleine Flotte, ein respektabler Name. Er ist nicht die dominierende kommerzielle Kraft in seinem Territorium, aber er ist bemerkenswert, und er erinnert sich daran, dass wir ihm Durchgang gewährten, als wir dazu nicht verpflichtet waren. Nun weitet er seine Aktivitäten aus und erreicht Kolonialhäfen und ausländische Märkte in [bond_secondary.GetName]. In der Sprache des Handels ist er uns wohlgesonnen. Ob wir ihm ebenso wohlgesonnen bleiben, hängt davon ab, wie viel von dieser Expansion wir kontrollieren wollen."
 cc_bonds.111.desc_denied: "Der Kaufmann, den wir abgewiesen haben, hat Berichten zufolge einen anderen Weg gefunden. Er baute seine Verbindungen über feindliches Territorium auf, wurde ohne unsere Hilfe mäßig reich und reicht nun noch weiter – in Kolonialmärkte und ausländische Häfen in [bond_secondary.GetName], die unser Einfluss nicht erreicht. Er hat keinen Groll geäußert. Er hat auch keine Dankbarkeit gezeigt. Er hat uns einfach umgangen, wie Kaufleute es tun. Nun fragt er in der indirekten Sprache des Handels, ob wir die Bedingungen dieser Vereinbarung ändern wollen."
 cc_bonds.111.a_back: "Finanziere sein expandierendes Unternehmen. Ein gut unterstützter Kaufmann ist ein Kaufmann, der sich daran erinnert, wer ihn unterstützt hat."
 cc_bonds.111.b_observe: "Lassen Sie ihn seinen Einfluss unabhängig ausweiten. Wir werden das Ergebnis bewerten."
 cc_bonds.111.c_discourage: "Diese Expansion entmutigen. Er wächst über das hinaus, was für uns nützlich ist."

 # === cc_bonds.112 — Fortune and Tempest ===
 cc_bonds.112.title: "Glück und Sturm"
 cc_bonds.112.desc_piracy: "Piraten haben die Haupthandelsrouten des Kaufmanns angegriffen. Zwei seiner Schiffe sind verloren gegangen oder beschädigt; ein drittes kehrte zum Hafen zurück. Sein Netzwerk ist nicht zerstört, aber es blutet, und die Unterbrechung hat ihn seine Glaubwürdigkeit bei Partnern gekostet, die beobachteten, ob er die Versorgung aufrechterhalten konnte. Er hat eine Nachricht geschickt und gefragt, ob wir bei der Sicherung der Routen helfen könnten. Er stellt es als gegenseitiges Interesse dar, was es auch ist – wenn die Routen zusammenbrechen, bricht auch der Handel zusammen."
 cc_bonds.112.desc_rival: "Ein konkurrierendes Handelshaus ist aus demselben Kolonialnetzwerk hervorgegangen, unterstützt von Interessen, die nicht die unseren sind. Sie haben die Preise des Kaufmanns für zwei Waren unterboten, zwei seiner vertraglich gebundenen Schiffskapitäne abgeworben und machen Annäherungsversuche an Häfen, die ihm zuvor loyal gegenüberstanden. Der Kaufmann ist nicht in Panik geraten, aber die uns vorliegenden Informationen deuten darauf hin, dass sich die Lage schneller verschlechtert, als er zugibt."
 cc_bonds.112.desc_succession: "Der Kaufmann altert. Er hat keinen offensichtlichen Erben – ein Sohn ist im Ausland, einer ist in einem Kloster, und die älteste Tochter hat bereits ein Bündnis mit einem Handelshaus geschlossen, das wir als Rivalen betrachten. Die Frage, wer nach seinem Tod das Familienunternehmen kontrolliert, ist nun eine aktuelle politische Frage, und die Antwort wird die zukünftige Loyalität des Netzwerks prägen. Wir sind hier nicht ohne Einfluss, sollten wir uns entscheiden, diesen auszuüben."
 cc_bonds.112.desc_drought: "Eine langanhaltende Dürre hat die Hauptmärkte getroffen, von denen das Netzwerk des Kaufmanns abhängt. Ernteausfälle bedeuten weniger Waren zum Versenden, geringere Einnahmen für die Territorien und eine verminderte Fähigkeit, Schulden zu begleichen. Der Kaufmann ist solvent, gerade so, aber seine Partner in den betroffenen Regionen sind es nicht. Wenn mehrere von ihnen gleichzeitig scheitern, zieht sich das Netzwerk drastisch zusammen und die Erholung wird Jahre dauern."
 cc_bonds.112.desc_blockade: "Ein Seekonflikt – nicht unser Krieg, aber beunruhigend nah – hat zu einer faktischen Blockade des produktivsten Hafens des Kaufmanns geführt. Schiffe warten vor Anker. Verträge sind hinfällig. Der Kaufmann hat seine diplomatischen Kanäle ausgeschöpft und bittet nun um unsere Intervention, formell oder informell, um die Pattsituation zu lösen, bevor die Verluste dauerhaft werden."
 cc_bonds.112.a_1_escort: "Finanziere eine Eskortflotte für seine wichtigsten Handelsrouten. Wir schützen, was uns wichtig ist."
 cc_bonds.112.b_1_demand: "Er ist für die Sicherheit seiner eigenen Routen verantwortlich. Das ist der Preis der Unabhängigkeit."
 cc_bonds.112.a_2_buyout: "Kaufen Sie die Interessen des rivalisierenden Hauses auf. Räumen Sie das Feld."
 cc_bonds.112.b_2_let: "Lassen Sie den kommerziellen Wettbewerb sich selbst regeln. Wir ergreifen in den Streitigkeiten der Kaufleute keine Partei."
 cc_bonds.112.a_3_heir: "Unterstützen Sie im Stillen den Erben, dessen Loyalität mit der unseren übereinstimmt."
 cc_bonds.112.b_3_neutral: "Die Nachfolge eines Kaufmanns ist nicht unsere Angelegenheit."
 cc_bonds.112.a_4_relief: "Notkredite an seine wichtigsten Partner vergeben. Das Netzwerk muss die Saison überstehen."
 cc_bonds.112.b_4_reduce: "Senken Sie die Erwartungen für dieses Jahr. Die Dürre wird vorübergehen."
 cc_bonds.112.a_5_pressure: "Übe diplomatischen Druck aus, um die Blockade aufzuheben. Unser Name hat hier Gewicht."
 cc_bonds.112.b_5_wait: "Die Verzögerung akzeptieren. Diese Dinge lösen sich irgendwann von selbst."

 # === cc_bonds.113 — The Merchant's Legacy ===
 cc_bonds.113.title: "Das Erbe des Kaufmanns"
 cc_bonds.113.desc_flourish: "Das Handelshaus ist aufgeblüht. Was als ein einzelner Kaufmann begann, der Passierrechte suchte, ist zu einer Dynastie geworden: mehrere Häfen, eine Flotte, Kreditlinien über Kolonialmärkte hinweg und ein Ruf, der nun untrennbar mit dem Netzwerk verbunden ist, das wir mitaufgebaut haben. Das Familienoberhaupt beschrieb bei der jährlichen Versammlung seines Hauses die Krone als „das Fundament, auf dem unser Vermögen errichtet wurde“. Die Geschichte zwischen uns war produktiv. Die Frage ist nun, wie man sie formalisiert."
 cc_bonds.113.desc_modest: "Das Handelshaus hat sich reasonably gut geschlagen – es ist nicht die Dynastie geworden, die es hätte sein können, aber eine stabile und glaubwürdige kommerzielle Institution mit echter Reichweite über mehrere Häfen hinweg. Die Kinder des Kaufmanns kennen unsere Geschichte mit ihrem Vater. Sie sind weder Idealisten noch grollend. In der Art von Kaufleuten überall kalkulieren sie, wie die nächste Vereinbarung aussehen könnte und ob es in ihrem Interesse liegt, sie zu akzeptieren."
 cc_bonds.113.desc_collapse: "Der Kaufmann ist tot. Sein Haus ist keine Dynastie – es ist eine Sammlung von Schulden, umstrittenen Verträgen und fragmentierten Loyalitäten. Das Netzwerk, das hätte entstehen können, hat sich nie gefestigt. Seine Kinder teilen den Rest auf, und Rivalen versuchen, das Vakuum zu füllen. Uns bleibt nur das Beobachten des Zusammenbruchs von etwas, das mit anderen Entscheidungen zu anderen Zeitpunkten ein dauerhafter kommerzieller Gewinn hätte sein können."
 cc_bonds.113.a_charter: "Gewähre dem Haus eine formelle Handelscharte. Mache die Partnerschaft offiziell und dauerhaft."
 cc_bonds.113.b_accept: "Akzeptiere das Erbe so, wie es ist. Keine formelle Vereinbarung – aber die Kanäle bleiben offen."
 cc_bonds.113.c_decline: "Das Haus muss auf eigenen Beinen stehen. Was zwischen uns aufgebaut wurde, hat seinen Lauf genommen."

 # === Scripted relation display ===
 cc_merchant_trade_boost: "Kaufmännisches Handelsnetz"
 cc_merchant_trade_boost_desc: "Ein durch die Händlerdynastie etabliertes Handelsnetzwerk leitet einen Teil des Handelsverkehrs über die Märkte dieses Oberherrn."

 # === cc_bonds.115 — hidden cleanup event ===
 cc_bonds.115.title: "Das Amt des Kaufmanns läuft ab"
 cc_bonds.115.a: "Die Präsenz des Kaufmanns verblasst."
 cc_bonds.113.desc_flourish_foreign: "Das Handelshaus ist floriert, und es ist nicht unser geblieben. Was als ein einzelner Kaufmann begann, der Passagierechte suchte, ist zu einer Dynastie geworden, die vier Flaggen führt: Söhne, die in ausländische Häfen einheirateten, Kreditlinien, die keiner einzelnen Krone unterstehen, und eine Flotte, deren Kapitäne Papiere von Mächten tragen, über die wir nicht gebieten. Das Oberhaupt nennt die Krone immer noch 'das Fundament, auf dem unser Vermögen errichtet wurde', und meint es ernst. Er würde jedoch, wenn man ihn drängte, darauf hinweisen, dass ein Fundament der Teil eines Gebäudes ist, den man nicht mehr sieht."
 cc_bonds.113.desc_modest_foreign: "Das Handelshaus hat sich reasonably gut geschlagen, und das eher im Ausland als im Inland. Nicht die Dynastie, die es hätte sein können, aber ein stabiles kommerzielles Unternehmen mit einer echten Präsenz in ausländischen Häfen sowie in unseren eigenen. Die Kinder des Kaufmanns kennen unsere Geschichte mit ihrem Vater und wissen, was ihre ausländischen Partner zahlen. Sie sind weder Idealisten noch nachtragend, sondern lediglich gut über ihre Alternativen informiert."
