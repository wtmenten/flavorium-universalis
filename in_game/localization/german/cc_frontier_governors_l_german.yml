l_german:

 # Advance

 cc_frontier_administration_advance: "Grenzlandverwaltung"
 cc_frontier_administration_advance_desc: "Anstatt darauf zu warten, dass Straßen und Städte die Grenzlande erreichen, setzt die Krone ansässige adlige Gouverneure direkt in das unbesiedelte Hinterland und bindet die Grenzgebiete durch Loyalität an die Hauptstadt, wo sie noch nicht durch Stein gebunden werden können. Schaltet das Gebäude $cc_lesser_local_governor$ und die Privilegien des Grenzstandes frei und gewährt eine zusätzliche Grenzstatthalterschaft. Besonders geschätzt von Reichen, die sich über die Steppe, die Berge und das tiefe Hinterland ausdehnen."

 # Building

 cc_lesser_local_governor: "Grenzlandstatthalter"
 cc_lesser_local_governor_desc: "Ein ansässiger adliger Verwalter in einer unerschlossenen Grenzprovinz. Im Gegensatz zu einem vollständigen lokalen Gouverneur benötigt er keine Straße zur Hauptstadt und kann in ländlichen Gebieten ansässig sein — er muss jedoch über Land (direkt oder über Vasallen) mit der Hauptstadt verbunden bleiben und strahlt weniger Nähe aus. Wird aus einem kleinen, dedizierten Pool gezogen. Erfordert den Fortschritt $cc_frontier_administration_advance$."
 cc_lesser_local_governor_tt: "Die Anzahl der errichteten Grenzstatthalter muss geringer sein als die Grenzstatthalter-Kapazität des Reiches"
 cc_lesser_local_governor_maintenance: "Unterhalt des Grenzlandstatthalters"

 # Estate Privileges

 ep_frontier_governance: "Grenzlandregierung"
 ep_frontier_governance_desc: "Der Hochadel übernimmt persönlich die Leitung der Markgrenzen.\n\nGewährt eine zusätzliche Grenzstatthalterschaft (+1 zum Pool der Grenzstatthalter).\n\nJedes Jahr erhält jeder besessene Ort in der Provinz eines $cc_lesser_local_governor$ sowie dessen Nachbarprovinzen den Modifikator $cc_frontier_control_buff$: +5% maximale Kontrolle und +0,2% monatliche Kontrolle. Der Bonus wird jährlich erneuert und verschwindet innerhalb von zwei Jahren, wenn der Statthalter oder dieses Privileg verloren geht.\n\nErfordert den Fortschritt $cc_frontier_administration_advance$."
 ep_frontier_missions: "Grenzlandmissionen"
 ep_frontier_missions_desc: "Der Klerus trägt den Staatsglauben in die Grenzgebiete.\n\nJedes Jahr erhält jeder besessene Ort in der Provinz eines $cc_lesser_local_governor$ sowie in den benachbarten Provinzen den Modifikator $cc_frontier_conversion_buff$: +25% Konvertierungsgeschwindigkeit der Bevölkerung. Der Bonus wird jährlich erneuert und verschwindet innerhalb von zwei Jahren, wenn der Gouverneur oder dieses Privileg verloren geht.\n\nErfordert den Fortschritt $cc_frontier_administration_advance$."
 ep_frontier_markets: "Grenzlandmärkte"
 ep_frontier_markets_desc: "Privilegierte Bürgermärkte konzentrieren sich um den Sitz des Statthalters und lenken den Handel durch die Markgrafschaften.\n\nJedes Jahr erhält jeder eigene Ort in der Provinz eines $cc_lesser_local_governor$ sowie in den benachbarten Provinzen den Modifikator $cc_frontier_market_buff$: +1% Marktzugang und +5% Handelszentrumsstärke. Der Bonus wird jährlich aktualisiert und verschwindet innerhalb von zwei Jahren, falls der Statthalter oder dieses Privileg verloren geht.\n\nErfordert den Fortschritt $cc_frontier_administration_advance$."
 ep_frontier_settlement: "Grenzlandsiedlung"
 ep_frontier_settlement_desc: "Siedler und Freihalter werden von der geschützten Grenze angezogen.\n\nJedes Jahr erhält jeder eigene Ort in der Provinz eines $cc_lesser_local_governor$ sowie in den benachbarten Provinzen den Modifikator $cc_frontier_growth_buff$: +5% Migrationsattraktivität und +0,1% Pop-Beförderungsgeschwindigkeit. Der Bonus wird jährlich erneuert und verschwindet innerhalb von zwei Jahren, wenn der Gouverneur oder dieses Privileg verloren geht.\n\nErfordert den Fortschritt $cc_frontier_administration_advance$."

 # Area buff modifiers (static location modifiers applied by the yearly frontier pulse).
 # Plain keys back the $...$ references in the privilege descriptions above;
 # STATIC_MODIFIER_NAME_/DESC_ drive the modifier's on-location tooltip.

 cc_frontier_control_buff: "Grenzlandregierung"
 STATIC_MODIFIER_NAME_cc_frontier_control_buff: "Grenzlandregierung"
 STATIC_MODIFIER_DESC_cc_frontier_control_buff: "Der ansässige Grenzstatthalter und das adlige Gefolge verstärken den Griff der Krone auf die umliegenden Markgebiete."
 cc_frontier_market_buff: "Grenzlandmärkte"
 STATIC_MODIFIER_NAME_cc_frontier_market_buff: "Grenzlandmärkte"
 STATIC_MODIFIER_DESC_cc_frontier_market_buff: "Privilegierte Bürgermärkte rund um den Grenzstatthalter lenken den Handel durch die Grenzlande."
 cc_frontier_growth_buff: "Grenzlandsiedlung"
 STATIC_MODIFIER_NAME_cc_frontier_growth_buff: "Grenzlandsiedlung"
 STATIC_MODIFIER_DESC_cc_frontier_growth_buff: "Siedler werden von den geschützten Ländereien um den Grenzgoverneur angezogen."
 cc_frontier_conversion_buff: "Grenzlandmissionen"
 STATIC_MODIFIER_NAME_cc_frontier_conversion_buff: "Grenzlandmissionen"
 STATIC_MODIFIER_DESC_cc_frontier_conversion_buff: "Vom Sitz des Grenzstatthalters entsandte Geistliche predigen den Staatsglauben in den umliegenden Markgrafschaften."

 MODIFIER_TYPE_NAME_cc_num_frontier_governors: "Grenzlandgraf"
 MODIFIER_TYPE_DESC_cc_num_frontier_governors: "Kleinere lokale Gouverneure, die keine Straßenverbindung oder Stadt benötigen und durch Standesprivilegien spezialisiert werden können."
