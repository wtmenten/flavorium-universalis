l_german:
 # ============================================================
 # Cabinet Experience — ladder branch points
 #
 # One entry per event in in_game/events/cc_xp_branch_events.txt (generated).
 # Each fires when a minister has earned a rung that offers two destinations.
 # Option text uses [ShowTraitName('x')] so the player can hover the actual trait
 # and read its real modifiers instead of trusting this copy to restate them.
 #
 # Saved scopes drop the scope: prefix in loc. See docs/scripting-gotchas.md.
 # ============================================================

 # --- cc_xp.20  fiscal: loyal_steward -> prosperity_planner | treasury_enforcer
 cc_xp.20.title: "Das Hauptbuch des Verwalters"
 cc_xp.20.desc: "[cc_xp_subject.GetName] hat die Bücher der Krone lange genug geführt, um zu wissen, wohin das Geld tatsächlich fließt, und hat begonnen, dies laut auszusprechen. Es liegt ein Vorschlag auf dem Tisch, und ein ganz anderer dahinter.\n\nDer erste ist das Ausgeben: den Überschuss in Bereiche zu investieren, die ihn dreifach zurückbringen, und eine gewisse Verschwendung als Preis für das Wachstum zu akzeptieren. Der zweite ist, die Lecks zu stopfen. [cc_xp_subject.GetName] kann jedes Amt benennen, das mehr kostet, als es einbringt, und möchte die Erlaubnis, dies öffentlich zu sagen."
 cc_xp.20.a: "Investieren. Lassen Sie sie bauen. ([ShowTraitName('prosperity_planner')])"
 cc_xp.20.b: "Audit. Lassen Sie sie kürzen. ([ShowTraitName('treasury_enforcer')])"

 # --- cc_xp.21  learning: progressive_rationalist -> enlightenment_herald | humanist_philosopher
 cc_xp.21.title: "Eine Frage der Audienz"
 cc_xp.21.desc: "[cc_xp_subject.GetName] ist über die Lektüre hinausgewachsen, die sie geformt hat, und der Hof hat es bemerkt. Es bleibt die Frage, was man damit tun soll.\n\nSie könnten das Argument nach außen tragen: Pamphlete, Korrespondenz, die geduldige Arbeit, Menschen zu überzeugen, die nicht darum gebeten haben, überzeugt zu werden. Oder sie könnten sich nach innen wenden, zur langsameren und weniger populären Aufgabe, es erst einmal richtig zu machen, bevor man es überhaupt ausspricht."
 cc_xp.21.a: "Lassen Sie sie predigen. ([ShowTraitName('enlightenment_herald')])"
 cc_xp.21.b: "Lassen Sie sie nachdenken. ([ShowTraitName('humanist_philosopher')])"

 # --- cc_xp.22  law: efficiency_administrator -> estate_guardian | regional_magnate
 cc_xp.22.title: "Wo die Autorität sitzen sollte"
 cc_xp.22.desc: "[cc_xp_subject.GetName] hat Jahre damit verbracht, den Apparat des Reiches am Laufen zu halten, und ist zu einem Schluss gekommen, wer die Kurbel drehen sollte.\n\nEine Antwort sind die Stände: alt, langsam und beständig, mit Verpflichtungen, die in beide Richtungen wirken. Die andere sind die Provinzen: die großen lokalen Herren, die das Land bereits halten und lediglich den Segen der Krone benötigen, um es formell zu besitzen. Beides bedeutet Stabilität. Aber es ist nicht dieselbe Art von Stabilität."
 cc_xp.22.a: "Die Stände behalten ihre Rechte. ([ShowTraitName('estate_guardian')])"
 cc_xp.22.b: "Die Provinzen behalten ihre Herren. ([ShowTraitName('regional_magnate')])"

 # --- cc_xp.23  integration: seasoned_integrator -> master_integrator | iron_integrator
 cc_xp.23.title: "Das Tempo der Eingliederung"
 cc_xp.23.desc: "Neues Land ordnungsgemäß in das Reich einzugliedern, ist eine langsame Arbeit, und [cc_xp_subject.GetName] hat genug davon getan, um mit einer Meinung darüber vertraut zu werden, wie schnell dies geschehen sollte.\n\nWenn es geduldig geschieht, bleibt es stabil: lokale Männer in lokalen Ämtern, die alten Bräuche bleiben bestehen, wo sie nichts kosten. Wenn es schnell geschieht, bleibt es ebenfalls stabil, für eine Weile, und das Reich ist wesentlich früher wieder ganz. [cc_xp_subject.GetName] ist bereit, es auf beide Arten zu tun, und möchte wissen, welche."
 cc_xp.23.a: "Geduldig. Was ordnungsgemäß verbunden wurde, bleibt verbunden. ([ShowTraitName('master_integrator')])"
 cc_xp.23.b: "Schnell. Wir können uns keine Generation Zeit lassen. ([ShowTraitName('iron_integrator')])"

 # --- cc_xp.24  envoy: tentative_envoy -> tactful_envoy | diplomatic_attache
 cc_xp.24.title: "Der Gesandte findet seinen Standpunkt"
 cc_xp.24.desc: "Das Zögern ist verschwunden. [cc_xp_subject.GetName] hat genug Verhandlungen miterlebt, um aufzuhören, sich dafür zu entschuldigen, im Raum zu sein, und in dem, was übrig bleibt, sind zwei völlig verschiedene Diplomaten erkennbar.\n\nDer eine arbeitet den Raum ab: liest die Stimmung, weiß, wann man schweigen muss, und hinterlässt jeden Hof ein wenig wohlwollender, als er war. Der andere arbeitet das Dokument ab, in dem die Zugeständnisse tatsächlich vergraben sind, und hat einen beunruhigenden Appetit auf Klauseln entwickelt."
 cc_xp.24.a: "Senden Sie sie an den Verhandlungstisch. ([ShowTraitName('tactful_envoy')])"
 cc_xp.24.b: "Senden Sie sie in die Archive. ([ShowTraitName('diplomatic_attache')])"

 # --- cc_xp.25  trade: merchant_syndic -> mercantilist_official | free_market_advocate
 cc_xp.25.title: "Wessen Handel ist es"
 cc_xp.25.desc: "[cc_xp_subject.GetName] stammte aus den Handelshäusern und hat nie ganz aufgehört, wie eines zu denken, was genau der Grund ist, warum das Argument, das sie nun vorbringen, Gewicht hat.\n\nEntweder ist der Handel ein Instrument der Krone, das privilegiert, gelenkt und dort besteuert wird, wo es den größten Nutzen bringt, oder er ist etwas, das am besten wächst, wenn die Krone die Hände davon lässt und sich mit einem kleineren Anteil an einer größeren Summe begnügt."
 cc_xp.25.a: "Der Handel dient der Krone. ([ShowTraitName('mercantilist_official')])"
 cc_xp.25.b: "Der Handel dient sich selbst und uns mit ihm. ([ShowTraitName('free_market_advocate')])"

 # --- cc_xp.26  command: tactical_advisor -> offensive_strategist | defensive_commander
 cc_xp.26.title: "Eine Doktrin für das Heer"
 cc_xp.26.desc: "[cc_xp_subject.GetName] hat aufgehört, lediglich die Meinungen der Generäle weiterzugeben, und angefangen, eigene zu haben. Der Stab wurde gebeten, sich auf den nächsten Krieg vorzubereiten; die Frage ist, auf welchen Krieg sie sich vorbereiten sollen.\n\nEin Plan geht davon aus, dass wir den Moment wählen und zuerst zuschlagen. Der andere geht davon aus, dass wir nicht wählen können, und gibt dieselbe Summe für Mauern, Depots und das unglamouröse Geschäft des Nicht-Verlierens aus."
 cc_xp.26.a: "Wir werden den ersten Schlag führen. ([ShowTraitName('offensive_strategist')])"
 cc_xp.26.b: "Wir werden nicht überrascht werden. ([ShowTraitName('defensive_commander')])"

 # --- cc_xp.27  command: offensive_strategist -> supreme_commander | continental_marshal
 cc_xp.27.title: "Die Reichweite eines Rufs"
 cc_xp.27.desc: "Die Offensivdoktrin wurde oft genug bestätigt, dass [cc_xp_subject.GetName] nicht mehr für sie argumentiert, sondern sie lediglich anwendet. Was nun entschieden wird, ist der Umfang der Befugnisse, die ihnen übertragen werden.\n\nSie könnten über den gesamten Militärapparat gestellt werden, über jede seiner Sparten, mit der Autorität, das zu reformieren, was sie vorfinden. Oder sie könnten dort bleiben, wo sie unbestreitbar exzellent waren, und das Feldheer sowie die Ressourcen erhalten, um es zum besten der Welt zu machen."
 cc_xp.27.a: "Geben Sie ihnen alles. ([ShowTraitName('supreme_commander')])"
 cc_xp.27.b: "Übertragen Sie ihnen die Armee. ([ShowTraitName('continental_marshal')])"

 # --- cc_xp.28  command: defensive_commander -> supreme_commander | continental_marshal
 cc_xp.28.title: "Die Belohnung für das Nicht-Verlieren"
 cc_xp.28.desc: "Es ist schwierig, den Wert eines Krieges zu beweisen, der nicht stattgefunden hat, aber die Festungen, die [cc_xp_subject.GetName] baute, stehen noch und die Grenzen, die sie bewachten, sind ruhig. Der Hof ist widerwillig zu dem Schluss gekommen, dass dies kein Glück war.\n\nSie können über den gesamten Militärapparat erhoben werden, mit dem Mandat, dieselbe Gründlichkeit überall anzuwenden. Oder man kann ihnen das Feldheer selbst anvertrauen, nach der Theorie, dass ein Kommandeur, der das Gelände versteht, hinter einem Schreibtisch verschwendet ist."
 cc_xp.28.a: "Heben Sie sie über alles andere. ([ShowTraitName('supreme_commander')])"
 cc_xp.28.b: "Übertragen Sie ihnen die Armee. ([ShowTraitName('continental_marshal')])"
