l_german:
 # === cc_bonds.60 — The March Lord's Formal Investiture ===
 cc_bonds.60.title: "Die Investitur des Markgrafen"
 cc_bonds.60.desc: "Der neue Herr von [bond_subj.GetName] ist bereit, seine formelle Investitur zu empfangen. Unter Grenzherren ist die Zeremonie nicht bloße Tradition – sie ist die Sprache von Status, Verpflichtung und Vertrauen. Eine prächtige Zeremonie würde uns Prestige und Gold kosten, die wir anderswo einsetzen könnten. Eine bescheidene Zeremonie würde denselben rechtlichen Zweck zu einem Bruchteil der Kosten erfüllen. Der Haushalt des Markgrafen hat genau beobachtet, wie wir diese Frage beantworten."
 cc_bonds.60.a: "Halte eine prächtige Zeremonie mit allen adligen Privilegien ab. Dieser Lord hat es verdient."
 cc_bonds.60.b: "Halte eine standardmäßige Investitur ab. Angemessen, würdevoll, proportional."
 cc_bonds.60.c: "Eine minimale Zeremonie genügt. Das Gesetz verlangt den Eid, nicht die Prachtentfaltung."

 # === cc_bonds.61 — Sharing the War Spoils ===
 cc_bonds.61.title: "Teilen der Kriegsbeute"
 cc_bonds.61.desc: "Unsere Streitkräfte und die Soldaten des Markgrafen kämpften in der jüngsten Kampagne Seite an Seite, und nun beginnt die Abrechnung. Die Truppen der Mark erlitten Verluste, besetzten schwieriges Gelände und sicherten unsere Flanke. Welchen Anteil an der Beute sie erhalten, liegt streng genommen in unserer Entscheidung. Das wissen sie. Sie beobachten genau, ob wir uns an ihren Beitrag erinnern oder ob man ihnen mit Worten dankt und mit nichts entschädigt."
 cc_bonds.61.a: "Geben Sie ihnen einen großzügigen Anteil. Sie haben ihn verdient, und mehr noch."
 cc_bonds.61.b: "Teile die Beute nach der Standardvereinbarung auf."
 cc_bonds.61.c: "Der Großteil der Beute gehört der Krone. So ist die Vereinbarung."

 # === cc_bonds.62 — March Lord Requests Garrison Funding ===
 cc_bonds.62.title: "Antrag auf Garnisonsfinanzierung"
 cc_bonds.62.desc: "Eine Depesche aus [bond_subj.GetName] legt den Fall klar dar: Die Grenzbefestigungen verfallen, die Garnison ist unterbesetzt und der Markgraf verfügt nicht über ausreichende Einnahmen, um beide Probleme gleichzeitig anzugehen. Er bittet um Finanzierung durch die Krone. Die Mark existiert, um unsere Grenze zu verteidigen, was uns ebenso zugutekommt wie ihm. Ob wir dieses gemeinsame Interesse in unserer Zuweisung anerkennen – oder es als sein alleiniges Problem behandeln – wird jedem Offizier in seinem Dienst im Gedächtnis bleiben."
 cc_bonds.62.a: "Finanziere die Garnison vollständig. Die Grenze ist unsere gemeinsame Verantwortung."
 cc_bonds.62.b: "Teilfinanzierung bereitstellen. Wir tragen einen Teil der Kosten, sie den Rest."
 cc_bonds.62.c: "Die Grenze ist ihr Kommando. Sie müssen sie selbst finanzieren."

 # === cc_bonds.63 — The March Lord's Feud ===
 cc_bonds.63.title: "Die Fehde des Markgrafen"
 cc_bonds.63.desc: "Der Markgraf von [bond_subj.GetName] ist in einen erbitterten Streit mit einem benachbarten Adelshaus geraten – ein Grenzanspruch, der zu einer Ehrangelegenheit eskaliert ist. Beide Parteien haben sich an unseren Hof gewandt. Das benachbarte Haus hat tiefere Verbindungen innerhalb des Adels, eine bessere rechtliche Position in der Grenzfrage und mehr Freunde in der Hauptstadt. Der Markgraf hat etwas anderes: Er gehört zu uns, und er beobachtet nun, ob das eine Rolle spielt."
 cc_bonds.63.a: "Unterstütze den Markgrafen. Unabhängig von der rechtlichen Lage ist er unser Mann."
 cc_bonds.63.b: "Vermitteln Sie zwischen den Parteien. Finden Sie eine Lösung, die beide akzeptieren können."
 cc_bonds.63.c: "Das Gesetz spricht für sich selbst. Wir entscheiden zugunsten des benachbarten Hauses."

 # === cc_bonds.64 — Frontier Administration Rights ===
 cc_bonds.64.title: "Grenzlandverwaltungsrechte"
 cc_bonds.64.desc: "Der Markgraf von [bond_subj.GetName] hat eine formelle Petition eingereicht: Die Grenzbevölkerung wurde lange Zeit unter Ad-hoc-Regelungen verwaltet, die viele rechtliche Fragen ungeklärt lassen. Er schlägt vor, dass die Krone der Mark formell die richterliche Gewalt über ihr eigenes Territorium gewährt – das Recht, Streitigkeiten beizulegen, Verträge durchzusetzen und lokale Strafen zu verhängen. Unser Rechtsbeistand merkt an, dass eine solche Befugnis, einmal gewährt, schwer zurückzunehmen ist. Unser Militärbeistand merkt an, dass ein Herr mit voller Verwaltungsgewalt über sein Territorium weitaus einfacher zu regieren ist als einer, der jede Entscheidung über die Hauptstadt ausfechten muss."
 cc_bonds.64.a: "Gewähre der Mark die volle richterliche Gewalt. Die Grenzregion benötigt eine klare Verwaltung."
 cc_bonds.64.b: "Behalten Sie die königlichen Justizrechte über die Mark. Die Autorität verbleibt bei uns."
 cc_bonds.64.c: "Errichten Sie ein gemeinsames Grenzgericht. Wir regieren gemeinsam."

 # === cc_bonds.65 — Campaign Alongside the March Lord ===
 cc_bonds.65.title: "Feldzug an der Seite des Markgrafen"
 cc_bonds.65.desc: "Der aktuelle Feldzug bietet eine ungewöhnliche Gelegenheit. Der Grenzherr von [bond_subj.GetName] ist an einer Front gebunden, der auch unsere Truppen näherkommen. Wir könnten unsere Kräfte bündeln und persönlich an seiner Seite kämpfen – oder einen königlichen General an unserer Stelle entsenden – oder ihn sein Theater unabhängig führen lassen. Die vierte Option, die unsere Logistikoffiziere vorgeschlagen haben, besteht darin, seine Truppen vollständig an unsere Hauptfront umzuleiten. Dort würden sie uns gute Dienste leisten. Was sie von dieser Umbesetzung halten würden, ist eine andere Frage."
 cc_bonds.65.a: "Ich werde persönlich an der Seite des Marschherrn befehligen."
 cc_bonds.65.b: "Einen königlichen General entsenden. Koordination ist wichtig; Anwesenheit optional."
 cc_bonds.65.c: "Lasst den Markgrafen sein Gebiet unabhängig verwalten. Er kennt es am besten."
 cc_bonds.65.d: "Versetze die Grenzstreitkräfte an unsere Hauptfront, wo sie benötigt werden."

 # === cc_bonds.66 — The March Lord's Heir ===
 cc_bonds.66.title: "Der Erbe des Markgrafen"
 cc_bonds.66.desc: "Der Markgraf von [bond_subj.GetName] hat einen Erben im geeigneten Alter. Es gibt eine Entscheidung zu treffen. Wir könnten den jungen Erben an unseren Hof einladen – um unsere Wege zu lernen, Verbindungen zu unserem Adel aufzubauen und in dem Verständnis aufzuwachsen, dass die Krone sein natürlicher Patron ist. Der Markgraf weiß, was das bedeutet: Sein Sohn würde ebenso sehr unser als sein Sohn werden. Alternativ könnten wir eine vorteilhafte Heirat arrangieren, die die Position der Familie stärkt, ohne dass der Erbe seine Heimat verlassen muss. Oder wir könnten die Angelegenheit dem Markgrafen überlassen, sie zu gegebener Zeit selbst zu regeln."
 cc_bonds.66.a: "Lade den Erben als Schützling an unseren Hof ein. Er wird lernen, der Krone zu dienen."
 cc_bonds.66.b: "Arrangieren Sie eine prestigeträchtige Ehe für den Erben."
 cc_bonds.66.c: "Dies ist eine Privatangelegenheit des Haushalts des Markgrafen."
