 # === cc_bonds.202 — Faith Under the Surface ===
 cc_bonds.202.title: "Glaube unter der Oberfläche"
 cc_bonds.202.desc: "Die Konversion von [bond_subj.GetName] zum Glauben der Krone erfolgte zu einem Zeitpunkt, als die kulturelle Beziehung zwischen uns bereits höchst angespannt war. Der Klerus zertifizierte sie; die Zeremonien wurden vollzogen; die offiziellen Aufzeichnungen sind korrekt. Doch Berichte, die uns nun erreichen, beschreiben etwas, das in den offiziellen Akten nicht vorkommt: Andachtsgegenstände, die hinter Marktständen versteckt werden, Rituale, die in Kellern vollzogen werden, ein Klerus des alten Glaubens, der sich nicht so sehr aufgelöst als vielmehr zurückgezogen hat.\n\nDie Konversion scheint nicht so tief gegriffen zu haben, wie man uns berichtete. Die Frage ist, wie weit wir gehen wollen, um sie zu vollenden — und was diese Vollendung kosten wird."

 cc_bonds.202.a: "Säubern Sie die versteckten Gläubigen. Die Konversion muss vollzogen werden."
 cc_bonds.202.a.tooltip: "Eine energische Inquisition bringt religiösen Einfluss – doch die politischen und militärischen Kosten sind real. Das Freiheitsstreben steigt, da das Vorgehen deutlich macht, was die Konversion schon immer war."

 cc_bonds.202.b: "Lasst die Praxis im Stillen fortbestehen. Wir sehen nichts; wir hören nichts."
 cc_bonds.202.b.tooltip: "Die kulturelle Beziehung verschlechtert sich weiter – eine tolerierte Praxis ohne formelle Anerkennung untergräbt das Band. Die Flagge der erzwungenen Religion bleibt bestehen; diese Situation könnte erneut auftreten."

 cc_bonds.202.c: "Formalisiere begrenzte Toleranz. Der alte Glaube darf privat praktiziert werden."
 cc_bonds.202.c.tooltip: "Ein echter Verlust an religiösem Einfluss — aber die kulturelle Dimension erholt sich und die politische Stabilität verbessert sich, da das Vasall ein bedeutsames Zugeständnis der Krone erfährt. Die Erinnerung ist getilgt."
