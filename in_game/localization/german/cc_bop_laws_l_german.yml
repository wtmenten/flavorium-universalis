l_german:
 # ============================================================
 # Balance of Power — coalition congress: parliament, laws & policies
 # ============================================================
 cc_bop_coalition_assembly: "Ausgleichskongress"

 # --- Defence law ---
 cc_bop_defense_law: "Gegenseitige Verteidigung"
 cc_bop_defense_law_desc: "Wie bereitwillig sich die Koalition um ein Mitglied schart, das vom aufstrebenden Hegemon angegriffen wird."
 cc_bop_no_defense: "Jeder Staat für sich"
 cc_bop_no_defense_desc: "Mitglieder werden nicht in die Verteidigungskriege der anderen gerufen. Die Koalition ist ein Bündnis nur dem Namen nach."
 cc_bop_possible_defense: "Mögliche Verteidigung"
 cc_bop_possible_defense_desc: "Mitglieder können in den Verteidigungskrieg eines Partners gerufen werden, müssen jedoch nicht antworten."
 cc_bop_mutual_defense: "Gegenseitige Verteidigung"
 cc_bop_mutual_defense_desc: "Mitglieder werden automatisch in jeden Verteidigungskrieg eines Partners gerufen, und das Band ist stark genug, um die bestehende Solidarität der Koalition zu stärken."

 # --- Offence law ---
 cc_bop_offense_law: "Strategische Doktrin"
 cc_bop_offense_law_desc: "Ob die Koalition präventiv den ersten Schlag gegen den Prätendenten führen darf."
 cc_bop_no_offense: "Defensive Haltung"
 cc_bop_no_offense_desc: "Die Koalition kämpft nur, wenn sie angegriffen wird. Sie wird keinen Krieg beginnen, den sie selbst initiiert hat."
 cc_bop_preemptive_doctrine: "Präventivdoktrin"
 cc_bop_preemptive_doctrine_desc: "Mitglieder können in den Angriffskrieg eines Partners gegen den Aspiranten gerufen werden – die politische Grundlage für den Präventivschlag."

 # --- Congress powers law ---
 cc_bop_congress_powers_law: "Mächte des Kongresses"
 cc_bop_congress_powers_law_desc: "Ob der Kongress sich selbst den ständigen Apparat für kollektives Handeln bewilligt hat."
 cc_bop_congress_dormant: "Ein loses Konzert"
 cc_bop_congress_dormant_desc: "Der Kongress tritt nur zusammen, um zu beraten. Er besitzt keine eigenen ständigen Befugnisse."
 cc_bop_congress_empowered: "Ein gestärkter Kongress"
 cc_bop_congress_empowered_desc: "Der Kongress besitzt ständige Befugnisse — dies schaltet die großen strategischen Maßnahmen der Koalition und die verstärkte Solidarität ihrer Mitglieder frei."

 # --- Coup law ---
 cc_bop_coup_law: "Der Gnadenstoß"
 cc_bop_coup_law_desc: "Ob die Koalition ein ständiges Mandat besitzt, um den entscheidenden, zurechtstutzenden Schlag gegen einen besiegten Prätendenten auszuführen."
 cc_bop_coup_restrained: "Zurückhaltung"
 cc_bop_coup_restrained_desc: "Die Koalition wird nicht nach dem Ruin des Prätendenten streben. Selbst im Aufstieg hält sie ihre Hand zurück."
 cc_bop_coup_de_grace: "Der Gnadenstoß"
 cc_bop_coup_de_grace_desc: "Ein dauerhaftes Mandat, um den potenziellen Hegemon in einem finalen, entscheidenden Krieg in seine Schranken zu weisen. Erforderlich, bevor eine aufstrebende Koalition ihren entscheidenden Schlag führen kann."

 # --- Per-voter disposition (vote-reasoning tooltip entries) ---
 CC_BOP_VOTE_OPINION_OF_HEGEMON: "Meinung des aufstrebenden Hegemons"
 CC_BOP_VOTE_RIVAL_HEGEMON: "Rivalität mit dem aufstrebenden Hegemon"
 CC_BOP_VOTE_KIN_HEGEMON: "Durch königliche Heirat an den Hegemon gebunden"
 CC_BOP_VOTE_BOUGHT: "Beeinflusst durch das Gold des Hegemons"
 CC_BOP_VOTE_PROXIMITY_BASE: "Der Koloss rückt näher"
 CC_BOP_VOTE_DISTANCE_FROM_HEGEMON: "Entfernung von den Grenzen des Hegemons"
 CC_BOP_VOTE_GREAT_POWER_CAUTION: "Die Vorsicht einer Großmacht gegenüber bindenden Zusagen"
 CC_BOP_VOTE_SEEKS_PROTECTION: "Eine geringere Macht sucht Schutz"
 CC_BOP_VOTE_HAWKISH_COURT: "Ein kriegslustiger Hof"
 CC_BOP_VOTE_RELUCTANT_COURT: "Ein zögerlicher, handlungsfreier Hof"
 DIPLOMATIC_LAW_CATEGORY: "Diplomatische Gesetze"

 # ============================================================
 # Special statuses
 # ============================================================
 cc_bop_chief_balancer: "Hauptausgleicher"
 cc_concert_president: "Präsident des Konzerts"
 cc_concert_seat: "Mitglied des Konzerts"

 # ============================================================
 # Coalition — the Settlement law (post-victory)
 # ============================================================
 cc_bop_settlement_law: "Die Siedlung"
 cc_bop_settlement_law_desc: "Was die Koalition mit ihrem Sieg zu tun beschließt. Wenn das Konzert in Kraft treten soll, muss das Gesetz verabschiedet werden, während der Kongress tagt – und es wird nur dann eine dauerhafte Institution gründen, wenn der Block den letzten Krieg gewinnt."
 cc_bop_settlement_dissolution: "Auflösung"
 cc_bop_settlement_dissolution_desc: "Das Zweckbündnis löst sich auf, sobald der Friede gewonnen ist. Jede Macht geht ihren eigenen Weg."
 cc_bop_enact_concert: "Setzen Sie das Konzert Europas in Kraft"
 cc_bop_enact_concert_desc: "Entschluss, den Frieden zu institutionalisieren. Sollte die Koalition den finalen Krieg unter diesen Bedingungen gewinnen, werden die fünf größten Sieger ein ständiges Konzerteuropa gründen, um die Angelegenheiten des Kontinents zu regeln."

 # ============================================================
 # Coalition — parliament actions (collective consensus)
 # ============================================================
 cc_bop_pi_coalition_subsidies: "Koalitionssubventionen"
 cc_bop_pi_coalition_subsidies_desc: "Pitts Gold: Die Mitglieder finanzieren eine gemeinsame Kriegskasse in den Händen des Anführers, und die kleineren Mächte werden für den Feldzug unterstützt. Gewährt +8 Entschlossenheit und stärkt die kleineren Mitglieder."
 cc_bop_pi_no_separate_peace: "Vertrag von Chaumont"
 cc_bop_pi_no_separate_peace_desc: "Ein feierliches Gelöbnis gegen einen separaten Frieden bindet die Koalition zusammen. Gewährt +12 Entschlossenheit und stabilisiert jedes Mitglied; ein Deserteur erleidet dennoch die Schande des Abtrünnigen."
 cc_bop_pi_combined_command: "Die pragmatische Armee"
 cc_bop_pi_combined_command_desc: "Ein einheitliches Kommando für die Dauer des Krieges verleiht dem gesamten Block echtes Gewicht auf dem Schlachtfeld. Gewährt +5 Entschlossenheit und einen Kampfbonus für jedes Mitglied."
 cc_bop_pi_collective_demarche: "Eine gemeinsame Demarche"
 cc_bop_pi_collective_demarche_desc: "Ein kollektives Ultimatum an den Anwärter — eine öffentliche Zurechtweisung, die das Momentum des Wettbewerbs zugunsten der Koalition verschiebt und das Ansehen jedes Mitglieds beim Hegemon verschlechtert."
 cc_bop_pi_war_aims: "Der Teilungsvertrag"
 cc_bop_pi_war_aims_desc: "Die Mächte einigen sich im Voraus auf ihre Kriegsziele. Die Aussicht auf Gewinn bindet den Block und stählt seine Entschlossenheit für die Abrechnung. Gewährt +10 Entschlossenheit und eine dauerhafte Verpflichtung für jedes Mitglied."

 # ============================================================
 # Concert of Europe — congress & laws
 # ============================================================
 cc_concert_assembly: "Kongress der Mächte"

 cc_concert_doctrine_law: "Leitdoktrin"
 cc_concert_doctrine_law_desc: "Das belebende Prinzip des Konzerts – der Geist, in dem die Mächte den Frieden verwalten."
 cc_concert_balance_of_power: "Gleichgewicht der Mächte"
 cc_concert_balance_of_power_desc: "Verhindere, dass eine einzelne Macht dominiert, und sorge dafür, dass die Mächte im Gespräch bleiben. Die klassische Staatskunst des Kabinettszeitalters."
 cc_concert_principle_of_intervention: "Das Interventionsprinzip"
 cc_concert_principle_of_intervention_desc: "Die Heilige Allianz und das Troppauer Protokoll: Die Mächte stehen für Legitimität und gegen die Revolution und stützen so die Throne — um den Preis von Reibereien mit den Liberalen und Unruhigen."
 cc_concert_liberal_internationalism: "Liberaler Internationalismus"
 cc_concert_liberal_internationalism_desc: "Canningite Nichteinmischung mit Blick auf einen späteren Internationalismus: nationale Selbstbestimmung und freier Handel gegenüber der alten dynastischen Ordnung."

 cc_concert_security_law: "Kollektive Sicherheit"
 cc_concert_security_law_desc: "In welchem Maße sich die Mächte gegenseitig zur Verteidigung verpflichten."
 cc_concert_ad_hoc: "Konzerte nach Bedarf"
 cc_concert_ad_hoc_desc: "Die Mächte kommen zusammen, wenn eine Krise es erfordert, gehen jedoch keine ständigen gegenseitigen Verpflichtungen ein."
 cc_concert_mutual_guarantee: "Gegenseitige Garantie"
 cc_concert_mutual_guarantee_desc: "Die Garantie der Quadrupelallianz hat sich zu einer kollektiven Sicherheit gefestigt: Ein Angriff auf einen ist ein Angriff auf alle, und kein Mitglied darf ohne gerechtfertigten Grund Krieg gegen ein anderes führen."

 cc_concert_congress_law: "Das Kongresssystem"
 cc_concert_congress_law_desc: "Ob das Konzert als ständiger Kongress tagt – der Apparat für kollektive Vermittlung."
 cc_concert_dormant: "Gelegentliche Kongresse"
 cc_concert_dormant_desc: "Der Kongress tritt nur auf Einberufung zusammen. Er verfügt über keinen permanenten Sitz."
 cc_concert_standing_congress: "Ein ständiger Kongress"
 cc_concert_standing_congress_desc: "Die Mächte tagen dauerhaft und können einen allgemeinen Frieden über die Zwistigkeiten Europas verhängen (schaltet Kongressvermittlung frei)."

 # ============================================================
 # Concert of Europe — parliament actions
 # ============================================================
 cc_concert_pi_mediate_dispute: "Kongressmediation"
 cc_concert_pi_mediate_dispute_desc: "Die große Errungenschaft des Kongresssystems: Die Mächte erzwingen einen allgemeinen Frieden in den Kriegen eines Mitglieds mit Außenstehenden."
 cc_concert_pi_mediate_dispute_tt: "Schließt einen weißen Frieden in allen Kriegen jedes Mitglieds gegen Nicht-Mitglieder des Konzerts."
 cc_concert_pi_collective_intervention: "Kollektive Intervention"
 cc_concert_pi_collective_intervention_desc: "Eine koordinierte Machtdemonstration zur Aufrechterhaltung der etablierten Ordnung — stärker dort, wo die Mächte das Interventionsprinzip angenommen haben. Gewährt jedem Mitglied ein Interventionsmandat."
 cc_concert_pi_eastern_question: "Die Orientfrage"
 cc_concert_pi_eastern_question_desc: "Die Mächte verwalten die Aufteilung einer schwindenden Sphäre. Der Vorsitzende gewinnt an Prestige durch die Leitung der Einigung; die Mitglieder bekräftigen ihre Einflusszonen."
 cc_concert_pi_admit_power: "Eine Macht aufnehmen"
 cc_concert_pi_admit_power_desc: "Eine aufstrebende Macht wird in das Direktorium aufgenommen — der stärkste berechtigte Außenseiter nimmt einen Platz am Tisch ein."
 cc_concert_pi_depose_president: "Misstrauensvotum"
 cc_concert_pi_depose_president_desc: "Die Mitglieder beschließen, den amtierenden Präsidenten abzusetzen und einen neuen Vorsitzenden aus ihrer Mitte zu wählen."

