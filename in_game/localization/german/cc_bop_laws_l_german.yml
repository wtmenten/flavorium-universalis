 CC_CONCERT_HAVE_BETTER: "Wir bevorzugen einen anderen Weg"
 CC_CONCERT_KEEP: "Die bestehende Ordnung sollte bewahrt bleiben"
 CC_CONCERT_LEGITIMIST: "Ein Thron schätzt Legitimität und Ordnung"
 CC_CONCERT_LIBERAL_COURT: "Ein liberaler Hof befürwortet Selbstbestimmung"
 CC_CONCERT_GREAT_POWER: "Der Platz einer Großmacht am Verhandlungstisch"
 CC_CONCERT_GREAT_POWER_CAUTION: "Eine Großmacht ist vorsichtig bei bindenden Verpflichtungen"
 CC_CONCERT_SEEKS_PROTECTION: "Eine geringere Macht sehnt sich nach der Garantie"
 CC_CONCERT_INTERVENTIONIST: "Das Interventionsprinzip ist in Kraft"
