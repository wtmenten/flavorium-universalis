l_german:
 # ---- Court events (cc_pty.80-98). Hand-written. ----

 # The Knife
 cc_pty.80.title: "Alte Rechnung"
 cc_pty.80.desc: "Die Ratssitzung endete in Geschrei. [cc_pty_ce_a.GetName] von den [ROOT.GetCountry.Custom('cc_pty_ev_a_name')] beschuldigte [cc_pty_ce_b.GetName] von den [ROOT.GetCountry.Custom('cc_pty_ev_b_name')], die Krone belogen zu haben, und [cc_pty_ce_b.GetName] antwortete mit noch schlimmeren Worten. Die anderen Minister saßen schweigend da. Beide erwarten nun, dass die Krone entscheidet, wer im Recht war."
 cc_pty.80.a: "Weise sie beide zurecht."
 cc_pty.80.b: "[cc_pty_ce_a.GetName] hatte recht."
 cc_pty.80.c: "[cc_pty_ce_b.GetName] hatte recht."
 cc_pty.80.d: "Lass sie es unter sich ausmachen."
 cc_pty.81.title: "Flüstern über eine Verschwörung"
 cc_pty.81.desc: "Ein Informant ist mit einer Geschichte zum Palast gekommen. Männer im Sold von [cc_pty_ce_a.GetName] haben sich nach den Gewohnheiten von [cc_pty_ce_b.GetName] erkundigt: welche Straßen sie befahren, durch welche Türen sie gehen und wer sie nachts bewacht. Der Informant ist nicht sicher, was geplant ist, aber an der Absicht gibt es kaum Zweifel."
 cc_pty.81.a: "Verhafte [cc_pty_ce_a.GetName]."
 cc_pty.81.b: "Warne [cc_pty_ce_b.GetName] diskret."
 cc_pty.81.c: "Es ist nicht der Streit der Krone."
 cc_pty.82.title: "Mord am Hofe"
 cc_pty.82.desc: "[cc_pty_ce_b.GetName] ist tot, auf dem Heimweg vom Rat erstochen. Die Mörder sind entkommen. Niemand am Hof zweifelt daran, wer sie geschickt hat, und die [ROOT.GetCountry.Custom('cc_pty_ev_b_name')] fordern, dass die Krone handelt."
 cc_pty.82.a: "Jage die Mörder und jeden, der sie bezahlt hat."
 cc_pty.82.b: "Lass die Angelegenheit ruhen."
 cc_pty.83.title: "Die Verschwörung wird aufgedeckt"
 cc_pty.83.desc: "Die Männer, die geschickt wurden, um [cc_pty_ce_b.GetName] zu töten, wurden gefasst, bevor sie handeln konnten. Unter Vernehmung nannten sie ihren Auftraggeber: [cc_pty_ce_a.GetName]. Das Gericht wartet nun darauf, was die Krone mit einem Minister tun wird, der einen Mord geplant hat."
 cc_pty.83.a: "Stelle [cc_pty_ce_a.GetName] vor Gericht."
 cc_pty.83.b: "Schicke [cc_pty_ce_a.GetName] diskret ins Ausland."
 cc_pty.83.c: "Begnadige [cc_pty_ce_a.GetName]. Sie werden uns dafür zu Dank verpflichtet sein."

 # An Affair of Honour
 cc_pty.85.title: "Eine Angelegenheit der Ehre"
 cc_pty.85.desc: "[cc_pty_ce_a.GetName] der [ROOT.GetCountry.Custom('cc_pty_ev_a_name')] hat [cc_pty_ce_b.GetName] der [ROOT.GetCountry.Custom('cc_pty_ev_b_name')] aufgrund einer im Rat geäußerten Beleidigung zum Duell gefordert. Die Sekunden wurden benannt und der Ort gewählt. Nur die Krone kann es nun noch stoppen."
 cc_pty.85.a: "Verbiete es."
 cc_pty.85.b: "Lass sie sich treffen."
 cc_pty.85.c: "Sie werden es am Ratstisch klären."
 cc_pty.86.title: "Das Duell"
 cc_pty.86.desc: "[cc_pty_ce_a.GetName] und [cc_pty_ce_b.GetName] trafen sich im Morgengrauen. [cc_pty_ce_b.GetName] wurde vom Feld getragen und starb noch vor dem Mittag. [cc_pty_ce_a.GetName] kehrte in derselben Woche in den Rat zurück, und die [ROOT.GetCountry.Custom('cc_pty_ev_b_name')] werden dies nicht verzeihen."
 cc_pty.86.a: "Eine Verschwendung eines guten Ministers."

 # The Power Behind the Throne
 cc_pty.88.title: "Die Macht hinter dem Thron"
 cc_pty.88.desc: "[cc_pty_ce_a.GetName] dient schon lange genug, um jedes Amt und jeden Beamten zu kennen, und hat begonnen, im Namen von [cc_pty_ce_ruler.GetName] Befehle zu erteilen, ohne vorher zu fragen. Die Befehle sind sinnvoll und die Arbeit wird erledigt, aber am Hofe beginnt man sich zu fragen, wer eigentlich regiert."
 cc_pty.88.a: "Erinnere sie daran, wer die Krone trägt."
 cc_pty.88.b: "Lass sie regieren. Es funktioniert."
 cc_pty.88.c: "Entlasse [cc_pty_ce_a.GetName]."
 cc_pty.89.title: "Der Preis des Ministers"
 cc_pty.89.desc: "[cc_pty_ce_a.GetName] leitet die Regierung nun schon seit Jahren und möchte eine Gegenleistung: Ämter für die [ROOT.GetCountry.Custom('cc_pty_ev_a_name')], vom Schatzamt bis zu den Provinzgerichten. Die anderen Parteien beobachten dies genau."
 cc_pty.89.a: "Gib ihnen die Ämter."
 cc_pty.89.b: "Lehne ab und übernimm wieder die Zügel in die Hand."
 cc_pty.89.c: "Entlasse [cc_pty_ce_a.GetName] aus dem Amt."

 # Across the Aisle
 cc_pty.91.title: "Über die Fraktionsgrenzen hinweg"
 cc_pty.91.desc: "[cc_pty_ce_a.GetName] von den [ROOT.GetCountry.Custom('cc_pty_ev_a_name')] und [cc_pty_ce_b.GetName] von den [ROOT.GetCountry.Custom('cc_pty_ev_b_name')] sind sich in fast nichts einig, doch sie haben dem Rat einen gemeinsam entworfenen Gesetzentwurf vorgelegt. Keine der Parteien ist glücklich darüber, aber beide haben erklärt, dass sie ihn akzeptieren werden, wenn die Krone dies tut."
 cc_pty.91.a: "Unterstütze ihren Kompromiss."
 cc_pty.91.b: "Übernimm es als die eigene Idee der Krone."
 cc_pty.91.c: "Lege es auf Eis."
 cc_pty.92.title: "Eine unwahrscheinliche Freundschaft"
 cc_pty.92.desc: "Seit ihr Entwurf angenommen wurde, wurden [cc_pty_ce_a.GetName] und [cc_pty_ce_b.GetName] gemeinsam beim Abendessen und bei Spaziergängen in den Schlossgärten gesehen. Ihre Parteien murren, aber der Rat hat selten besser funktioniert."
 cc_pty.92.a: "Ehre sie beide."
 cc_pty.92.b: "Lass ihr Beispiel für sich selbst sprechen."

 # A Friend at Court
 cc_pty.94.title: "Ein Freund am Hofe"
 cc_pty.94.desc: "[cc_pty_ce_ruler.GetName] und [cc_pty_ce_a.GetName] haben begonnen, sich noch lange nach der Auflösung des Rates zu unterhalten: über das Reich, über Bücher, über nichts Besonderes. Es ist selten, dass ein Herrscher jemanden hat, mit dem er offen sprechen kann."
 cc_pty.94.a: "Nimm [cc_pty_ce_a.GetName] in dein Vertrauen."
 cc_pty.94.b: "Ein Herrscher sollte eine angemessene Distanz wahren."
 cc_pty.95.title: "Eifersucht am Hof"
 cc_pty.95.desc: "[cc_pty_ce_b.GetName] der [ROOT.GetCountry.Custom('cc_pty_ev_b_name')] haben sich offen darüber beschwert, dass [cc_pty_ce_a.GetName] das Ohr des Herrschers hat und dass Entscheidungen eher beim Abendessen als im Rat getroffen werden. Andere beginnen, dasselbe zu sagen."
 cc_pty.95.a: "Stehe zu [cc_pty_ce_a.GetName]."
 cc_pty.95.b: "Halte Distanz zu ihnen."

 # Loyalty Tested
 cc_pty.97.title: "Geprüfte Loyalität"
 cc_pty.97.desc: "Die [ROOT.GetCountry.Custom('cc_pty_ev_a_name')] haben sich gegen die Regierung gewandt und ihre Minister aufgefordert, aus Protest dem Rat fernzubleiben. [cc_pty_ce_a.GetName] lehnte dies ab und erschien wie gewohnt zur Arbeit. Ihre Partei hat dies nicht gut aufgenommen."
 cc_pty.97.a: "Ehre [cc_pty_ce_a.GetName] öffentlich."
 cc_pty.97.b: "Belohne [cc_pty_ce_a.GetName] privat."
 cc_pty.97.c: "Ein loyaler Diener benötigt keine Belohnung."

