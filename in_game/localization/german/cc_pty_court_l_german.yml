 # ---- Court event modifiers (main_menu/common/static_modifiers/cc_pty_modifiers.txt) ----
 STATIC_MODIFIER_NAME_cc_pty_ce_confidant: "Vertrauter des Herrschers"
 STATIC_MODIFIER_DESC_cc_pty_ce_confidant: "Dieser Minister genießt das Vertrauen des Herrschers und spricht mit dessen Autorität."
 STATIC_MODIFIER_NAME_cc_pty_ce_minister_rule: "Regierung durch Minister"
 STATIC_MODIFIER_DESC_cc_pty_ce_minister_rule: "Ein langjähriger Minister führt die Regierung im Namen des Herrschers. Die Arbeit wird erledigt, doch die eigene Autorität der Krone schwindet dadurch."
 STATIC_MODIFIER_NAME_cc_pty_ce_compromise: "Überparteilicher Kompromiss"
 STATIC_MODIFIER_DESC_cc_pty_ce_compromise: "Minister gegnerischer Parteien haben gemeinsam einen Entwurf erarbeitet, und die Krone hat ihn unterstützt. Der Rat arbeitet reibungsloser."
