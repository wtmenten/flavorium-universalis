l_german:
 cc_legend.1.title: "Der Hof der Philosophen"
 cc_legend.1.desc: "Das Zusammentreffen eines erleuchteten Herrschers, eines Kabinetts, das sich ganz der Verwaltung und dem Lernen widmet, und des materiellen Reichtums einer großen Hauptstadt hat etwas hervorgebracht, wovon Philosophen träumten, das sie aber selten erlebten: einen Hof, an dem Regierungsführung und Weisheit eins sind. Wöchentlich treffen ausländische Gelehrte ein. Unsere Institutionen wachsen schneller, als unsere Rivalen es erklären können. Die Geschichte nimmt dies zur Kenntnis."
 cc_legend.1.a: "Gründen Sie den Philosophenhof"
 cc_legend.1.a.tt: "Schaltet die Regierungsreform „Hof der Philosophen“ frei. Verleiht dem Herrscher das legendäre Merkmal Philosophenkönig."
 cc_legend.1.b: "Ehre die Errungenschaft mit einer Feier"

 cc_legend.2.title: "Das Heilige Reich"
 cc_legend.2.desc: "In einer Zeit, in der Glaube und Macht um die Vorherrschaft ringen, haben wir erreicht, was nur wenige konnten: einen Hof, an dem sakrale Autorität und politische Macht einander verstärken statt untergraben. Der Klerus hält das Reich, das Reich hält den Glauben, und gemeinsam halten sie etwas, das für diejenigen, die es sehen können, wie ein wiederhergestelltes heiliges Imperium aussieht."
 cc_legend.2.a: "Das Heilige Reich ausrufen"
 cc_legend.2.a.tt: "Gewährt dem Klerus-Stand das Privileg des Heiligen Reiches. Wendet einen permanenten Modifikator des Heiligen Reiches auf das Reich an."
 cc_legend.2.b: "Ein Moment für Gebet und Dankbarkeit"

 cc_legend.3.title: "Der Große Basar"
 cc_legend.3.desc: "Die große Tradition des kosmopolitischen Handels der islamischen Welt hat in unserem Reich ihren Ausdruck gefunden. Unser Minister verwaltet ein diplomatisches Netzwerk, das sich über den dar al-Islam und darüber hinaus erstreckt; unsere kommerziellen Untertanen agieren in Häfen, die unsere Rivalen noch nie gesehen haben; unser Großkanzler hat unseren Ruf zu einem kommerziellen Kapital gemacht. Der Große Basar ist kein Ort — es ist eine Art des Geschäftsgebens, die die Welt imitieren wird."
 cc_legend.3.a: "Öffne den Großen Basar"
 cc_legend.3.a.tt: "Schaltet die Regierungsreform „Großer Basar“ frei. Verleiht dem Kabinettsmitglied Großer Kanzler das legendäre Merkmal Großer Wesir."
 cc_legend.3.b: "Ehre die Errungenschaft mit einer Zeremonie"

 cc_legend.4.title: "Der eiserne Hegemon"
 cc_legend.4.desc: "Die Kombination aus einem eisernen Herrscher, einem obersten Militärbefehlshaber, einem Netzwerk von Militärspezialisten und einer Militärmark, die unsere Macht über unsere Grenzen hinaus projiziert, hat etwas hervorgebracht, das nur wenige Reiche erreichen: Hegemonie. Nicht bloß Vorherrschaft, sondern jene Art von Dominanz, die das Verhalten der Nachbarn formt, bevor ein einziger Soldat marschiert. Wir haben den Eisernen Hegemon erschaffen."
 cc_legend.4.a: "Formalisiere die Eiserne Hegemonie"
 cc_legend.4.a.tt: "Schaltet die Regierungsreform „Eiserne Hegemonie“ frei."
 cc_legend.4.b: "Der militärische Vorteil ist Belohnung genug"

 cc_legend.5.title: "Der Volkstribun"
 cc_legend.5.desc: "Im Zeitalter der Revolutionen, wenn die alte Ordnung zusammenbricht und die neue darum ringt, geboren zu werden, haben wir erreicht, was die Reformer immer versprochen, aber selten geliefert haben: ein Reich, in dem das Volk tatsächlich zustimmt, regiert zu werden. Jeder Stand ist zufrieden. Das Parlament funktioniert. Unser Minister spricht für das Volk — und das Volk glaubt es erstaunlicherweise."
 cc_legend.5.a: "Den Volkstribun ausrufen"
 cc_legend.5.a.tt: "Schaltet die Regierungsreform „Volksversammlung“ frei. Verleiht dem Kabinettsmitglied Parlamentarischer Vermittler das legendäre Merkmal Volkstribun."
 cc_legend.5.b: "Lassen Sie den Volkstribun sprechen"

 cc_legend.8.title: "Das Zeitalter der Entdeckungen"
 cc_legend.8.desc: "Die Sterne wurden kartiert. Die Winde wurden benannt. Die Küsten, die einst den Rand der bekannten Welt markierten, sind nun die Ausgangspunkte des regulären Handels. Dieses Reich hat nicht nur am Zeitalter der Entdeckungen teilgenommen — es hat geholfen, es zu definieren. Ein Minister verkörpert diese Leistung mehr als alle anderen. Seine Reisen werden über Generationen hinweg studiert werden."
 cc_legend.8.a: "Feiern Sie den Anlass – der legendäre Navigator hat sich den Titel verdient."
 cc_legend.8.a.tt: "Gewährt dem Entdeckungsminister das Merkmal Legendärer Navigator. Wendet einen permanenten Modifikator des Zeitalters der Entdeckungen auf das Reich an. Schaltet die Regierungsreform Entdecker-Gilde frei."
 cc_legend.8.b: "Der Erfolg spricht für sich selbst – lassen wir ihn eine Angelegenheit des Handels bleiben, nicht der Legende."
