l_german:

 # ---------------------------------------------------------------------------
 # Drift Events
 # ---------------------------------------------------------------------------

 cc_personality.1.title: "Die Winde des Krieges"
 cc_personality.1.desc: "Während unsere Armeen im Feld stehen und der Geruch von Rauch im Wind liegt, streitet der Rat darüber, wie wir unseren Vorteil nutzen sollen – ob wir härter zuschlagen oder das bewahren, was wir haben, sollen."

 cc_personality.1.a: "Setzt den Angriff fort — zeigt keine Gnade."
 cc_personality.1.b: "Haltet unsere Position – weitet uns nicht zu sehr aus."

 cc_personality.2.title: "Imperiale Ambitionen"
 cc_personality.2.desc: "Im Frieden und auf dem Höhepunkt unserer Stärke debattieren die großen Staatsminister über den weiteren Weg. Greifen wir zu, um zu nehmen, was wir können, oder warten wir auf den richtigen Moment?"

 cc_personality.2.a: "Unsere Grenzen und unseren Einfluss ausweiten."
 cc_personality.2.b: "Geduld – nutze die Schwächen anderer, wenn sie auftreten."

 cc_personality.3.title: "Eine Zeit der Vorsicht"
 cc_personality.3.desc: "Unser Prestige ist geschmälert und unsere Rivalen beobachten uns genau. Der Rat drängt die Krone zur Vorsicht — aber wie vorsichtig?"

 cc_personality.3.a: "Befestige unsere Position gegen alle Bedrohungen."
 cc_personality.3.b: "Vorsichtige Diplomatie vor allem – vermeide Provokationen."

 cc_personality.4.title: "Handel und Diplomatie"
 cc_personality.4.desc: "Unsere Schatzkammer ist voll und unsere Kaufleute florieren. Die Frage vor dem Rat ist, ob wir diesen Reichtum nutzen wollen, um Freundschaften zu schmieden, oder ob wir stillschweigend diejenigen ausnutzen, die uns umgeben."

 cc_personality.4.a: "Bauen Sie Allianzen und Wohlwollen auf – Gold kauft Freunde."
 cc_personality.4.b: "Lassen Sie andere unseren Reichtum als Chance sehen — achten Sie auf Gelegenheiten."

 cc_personality.5.title: "Eine Frage der Strategie"
 cc_personality.5.desc: "Der Hof berät über die strategische Ausrichtung des Reiches. Alte Gewissheiten sind verblasst; ein neuer Ansatz muss gewählt werden."

 cc_personality.5.aggressive: "Wir müssen dominieren — zuschlagen, bevor andere uns zuschlagen."
 cc_personality.5.expansionist: "Erweitern Sie unseren Einfluss – Grenzen sind nur so dauerhaft wie unser Wille."
 cc_personality.5.defensive: "Behalte, was wir haben – Stärke liegt in der Ausdauer."
 cc_personality.5.cautious: "Vorsichtige Diplomatie und kalkuliertes Risiko – niemals zu weit gehen."
 cc_personality.5.opportunistic: "Beobachte das Spielfeld, handle, wenn andere straucheln."
 cc_personality.5.isolationist: "Kehre den Blick nach innen – unsere Stärke liegt in unseren eigenen Landen."
 cc_personality.5.friendly: "Allianzen und Wohlwollen – ein beliebter Staat ist ein sicherer Staat."

 # ---------------------------------------------------------------------------
 # Ottoman Inflection Events
 # ---------------------------------------------------------------------------

 cc_personality.10.title: "Der erobernde Sultan"
 cc_personality.10.desc: "Das Reich steht auf dem Höhepunkt seiner Macht. Unser großer Sultan hat das mamlukische Ägypten gebrochen, die Perser gedemütigt und den Halbmond über dem Balkan gehisst. Die Welt zittert vor uns. Nun – wie nutzen wir unseren Vorteil?"

 cc_personality.10.a: "Es gibt keinen Frieden — nur Eroberung. Vorwärts, immer vorwärts."
 cc_personality.10.b: "Unsere Grenzen sind riesig. Wir müssen mit Disziplin expandieren, nicht mit Wut."

 cc_personality.11.title: "Die lange Stagnation"
 cc_personality.11.desc: "Die Tage der Blitzeroberungen liegen hinter uns. Unsere Grenzen werden durch große Festungen verteidigt, aber selten weiter vorangetrieben. Die Janitscharen streiten, die Wesire intrigieren und die Schatzkammer ist erschöpft. Wir müssen unsere Haltung in einer schwierigeren Welt wählen."

 cc_personality.11.a: "Verteidigen, was wir halten — das Reich ist zu groß, um es in einem leichtsinnigen Krieg zu riskieren."
 cc_personality.11.b: "Vorsicht vor allem – bewahre durch Diplomatie, was wir mit Gewalt nicht gewinnen können."

 # ---------------------------------------------------------------------------
 # France / England Inflection Events
 # ---------------------------------------------------------------------------

 cc_personality.20.title: "Der Sonnenkönig erhebt sich"
 cc_personality.20.desc: "Die Herrschaft einer neuen Ära beginnt. Der König befiehlt, dass Frankreich Europa dominieren soll – durch Diplomatie, wo es möglich ist, und durch Krieg, wo es notwendig ist. Der Hof von Versailles strahlt absolutes Selbstvertrauen aus. Frankreich ist für die Hegemonie bestimmt. Die Frage ist lediglich nach der Methode."

 cc_personality.20.a: "Der Krieg ist das Instrument der Könige. Wir werden unseren Willen durchsetzen."
 cc_personality.20.b: "Hegemonie durch Finesse – lassen Sie andere uns fürchten, ohne eine Koalition zu provozieren."

 cc_personality.21.title: "Britanniens Seeimperium"
 cc_personality.21.desc: "Das Zeitalter des Handelspostens weicht dem Zeitalter des Imperiums. Unsere Marine beherrscht die Meere und unsere Kolonien erstrecken sich über Kontinente. Die Frage ist, ob Britannien einfach nur handeln – oder herrschen soll."

 cc_personality.21.a: "Herrschen, nicht nur handeln. Wir werden unsere Macht dort ausbreiten, wo unsere Flagge weht."
 cc_personality.21.b: "Ein Seeimperium profitiert am meisten von Flexibilität – nutze die Chancen, aber binde dich nicht zu sehr."

 # ---------------------------------------------------------------------------
 # Muscovy Inflection Event
 # ---------------------------------------------------------------------------

 cc_personality.30.title: "Der schreckliche Zar"
 cc_personality.30.desc: "Der neue Zar regiert ebenso durch Furcht wie durch Gesetz. Seine Opritschnina säubert die Reihen von Rivalen, seine Armeen schlagen gnadenlos im Osten und Westen zu. Russland soll groß werden – wenn nötig durch Blut. Die Bojaren zittern. Die Frage ist, wie weit uns dieser Zorn tragen wird."

 cc_personality.30.a: "Keine Gnade. Russland rückt durch absolute Willenskraft vor."
 cc_personality.30.b: "Expandieren Sie bedacht – wir müssen nicht zerstören, was wir einfach einnehmen können."

 # ---------------------------------------------------------------------------
 # Castile Inflection Event
 # ---------------------------------------------------------------------------

 cc_personality.40.title: "Das Weltreich der Neuen Welt"
 cc_personality.40.desc: "Gold strömt aus Amerika herein. Unsere Konquistadoren haben im Namen der Krone und des Glaubens eine halbe Welt für sich beansprucht. Wir stehen im Zentrum eines globalen Imperiums, wie die Geschichte es noch nie gesehen hat. Die Frage ist, wie wir diese Macht nutzen werden."

 cc_personality.40.a: "Kreuzzug und Eroberung — die Welt soll sich dem Glauben und der Krone beugen."
 cc_personality.40.b: "Bauen Sie ein dauerhaftes Imperium auf – expandieren Sie mit Ordnung, nicht nur mit Feuer."

 # ---------------------------------------------------------------------------
 # Sweden Inflection Event
 # ---------------------------------------------------------------------------

 # ---------------------------------------------------------------------------
 # Four-Yearly Deep Analysis Events (60-65)
 # ---------------------------------------------------------------------------

 cc_personality.60.title: "Das erschöpfte Königreich"
 cc_personality.60.desc: "Unsere Armeen sind seit Jahren im Marsch und das Volk ist erschöpft. Die Kriegsmüdigkeit nagt an jedem Winkel des Reiches — die Aufgebote sind erschöpft, die Schatzkammer strapaziert und der Adel murmelt von einem Zeitalter ohne Ruhe. Der Rat muss entscheiden, wie wir uns künftig der Welt gegenüber positionieren."

 cc_personality.60.a: "Verteidigen, was wir haben — keine weiteren kostspieligen Abenteuer."
 cc_personality.60.b: "Vorsichtige Diplomatie vor allem – wir können uns keinen weiteren Krieg leisten."

 cc_personality.61.title: "Ambition des Siegers"
 cc_personality.61.desc: "Unsere Armeen haben viele Kriege erlebt, doch sie bleiben stark — unsere Feinde sind immer wieder vor uns zerbrochen. Das Volk blickt mit Stolz zur Krone, die Soldaten mit Bereitschaft. Dies ist der Moment, in dem Imperien geschaffen werden. Was tun wir mit dieser Macht?"

 cc_personality.61.a: "Wir dominieren. Schlagt hart zu, schlagt zuerst zu und lassen Sie keinen Zweifel an unserer Vorherrschaft."
 cc_personality.61.b: "Expandieren Sie zielgerichtet – beanspruchen Sie, was uns gehört, Grenze für Grenze."

 cc_personality.62.title: "Von allen Seiten umzingelt"
 cc_personality.62.desc: "Die Großmächte betrachten uns mit gierigen Augen. Rivalisierende Staaten haben ihren Adel gegen uns aufgestachelt, von Koalitionen geflüstert und unsere Grenzen getestet. Der Rat debattiert darüber, wie man in einer Welt überlebt, die sich scheinbar schließt."

 cc_personality.62.a: "Befestige alles — mach uns zu kostspielig, um angegriffen zu werden."
 cc_personality.62.b: "Kehre den Blick nach innen – lass die Großmächte untereinander streiten."
 cc_personality.62.c: "Navigieren Sie vorsichtig – halten Sie jeden potenziellen Feind über unsere Absichten im Unklaren."

 cc_personality.63.title: "Ein Königreich in Aufruhr"
 cc_personality.63.desc: "Die Vasallen murren, die Loyalität schwankt und unser Ansehen in der Welt schwindet. Das Reich ist nicht zerbrochen, aber es ist angespannt – und ein Fehltritt könnte nun Unzufriedenheit in Rebellion verwandeln. Der Rat rät vor allem zu Besonnenheit."

 cc_personality.63.a: "Vorsichtige, bedachte Regierungsführung – stelle das Vertrauen wieder her, bevor du Ruhm suchst."
 cc_personality.63.b: "Unsere Verteidigung stärken – stellen wir sicher, dass unser Griff um das Reich nicht gebrochen werden kann."

 cc_personality.64.title: "Die imperiale Gelegenheit"
 cc_personality.64.desc: "Wir stehen vor einem seltenen Moment: eine Großmacht im Frieden, unsere Schatzkammer voll, unsere Rivalen geschwächt. Die Welt liegt uns zur Gestaltung offen — wenn wir uns entscheiden, danach zu greifen. Der Hof debattiert aufgeregt über den Weg, der vor uns liegt."

 cc_personality.64.a: "Unsere Reichweite vergrößern – dieser Reichtum und diese Stärke müssen in dauerhafte Herrschaft übergehen."
 cc_personality.64.b: "Dies ist unser Moment – schlagen wir zu, bevor sich die Rivalen gegen uns zusammenschließen."
 cc_personality.64.c: "Flexibel bleiben – nutzen wir Gelegenheiten, wenn sie sich ergeben, anstatt uns auf eine Richtung festzulegen."

 cc_personality.65.title: "Der Weg des Kaufmanns"
 cc_personality.65.desc: "Unsere Schatzkammern quellen über und unsere Kaufleute florieren in Häfen auf der ganzen Welt. Wir haben die ruinösen Kriege vermieden, die unsere Nachbarn ausbluten ließen. Die Frage vor dem Rat ist nun, was wir mit diesem Wohlstand tun sollen — und welche Art von Macht wir sein wollen."

 cc_personality.65.a: "Reichtum ist ein Hebel – nutze ihn, um die Schwachstellen anderer auszunutzen."
 cc_personality.65.b: "Investiere in das gute Einvernehmen – Verbündete und Freunde sind die sicherste Garantie für Wohlstand."

 cc_personality.50.title: "Die große Abrechnung des Nordens"
 cc_personality.50.desc: "Die Ära des schwedischen imperialen Ruhms ist vorbei. Der Große Nordische Krieg hat unser Baltikum-Reich zerschmettert, und Russland steht nun dort, wo Schweden einst dominierte. Wir müssen uns neu aufbauen – aber in welcher Form? Befestigen wir uns und halten durch, oder schlagen wir einen vorsichtigeren Kurs ein?"

 cc_personality.50.a: "Schweden überdauert. Wir verteidigen, was bleibt, und bauen aus einer Position der Stärke heraus wieder auf."
 cc_personality.50.b: "Das Zeitalter des Ehrgeizes ist vorüber. Vorsicht und Besonnenheit müssen uns nun leiten."
