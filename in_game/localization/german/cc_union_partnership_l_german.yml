l_german:

 ########################################################################
 # CASUS BELLI
 ########################################################################

 cb_assert_junior_partnership: "Juniorpartnerschaft geltend machen"
 cb_assert_junior_partnership_desc: "Unser Unionspartner genießt seit langem den Komfort einer informellen Vereinbarung. Als unbestrittene Führungsmacht in dieser Union sind wir berechtigt, diese Beziehung zu formalisieren – und sie im Bedarfsfall durchzusetzen."

 cb_assert_crown_dependency: "Kronabhängigkeit geltend machen"
 cb_assert_crown_dependency_desc: "Unsere königliche Heirat mit diesem Reich, kombiniert mit unserer dominanten Position in der Union, gibt uns das Recht, sie offiziell als Kronabhängigkeit zu formalisieren. Wir werden dieses Band dauerhaft machen."

 ########################################################################
 # PEACE TREATIES
 ########################################################################

 cc_force_junior_partnership: "Als Juniorpartner formalisieren"
 cc_force_junior_partnership_entry: "$cc_force_junior_partnership$"
 cc_force_junior_partnership_entry_short: "$cc_force_junior_partnership$"
 cc_force_junior_partnership_desc: "Das besiegte Reich soll unsere Seniorität formell anerkennen und den bindenden Status eines junior Partners in der Union akzeptieren. Ihre Autonomie wird entsprechend eingeschränkt."

 cc_force_crown_dependency: "Kronabhängigkeit geltend machen"
 cc_force_crown_dependency_entry: "$cc_force_crown_dependency$"
 cc_force_crown_dependency_entry_short: "$cc_force_crown_dependency$"
 cc_force_crown_dependency_desc: "Das besiegte Reich soll unserer Krone als formelle Abhängigkeit unterstellt werden. Die königliche Vermählung zwischen unseren Häusern macht dies zu einem natürlichen Ergebnis."

 ########################################################################
 # BIASES / OPINION MODIFIERS
 ########################################################################

 antagonism_cc_force_junior_partnership: "Zum Juniorpartner gezwungen"
 antagonism_cc_force_crown_dependency: "Zur Kronkolonie gezwungen"

 opinion_cc_forced_junior_partnership: "Missbilligt erzwungene Formalisierung"
 opinion_cc_forced_crown_dependency: "Missbilligt erzwungene dynastische Abhängigkeit"
 opinion_cc_bribed_into_partnership: "Dankbar für großzügige Besiedlung"

 ########################################################################
 # EVENTS — cc_pu.1 (Junior Partner path)
 ########################################################################

 cc_pu.1.title: "Ein Vorschlag zur Formalisierung der Union"

 cc_pu.1.desc: "Die Union unserer Kronen hat Bestand, doch unsere Beziehung zu [pu_target.GetName] bleibt ein informelles Erbe der Umstände. Da ihr Reich erheblich kleiner ist als das unsere, sind sich unsere Berater einig, dass der Moment gekommen ist, eine formelle Juniorpartnerschaft vorzuschlagen – und so die Personalunion in eine bindende dynastische Vereinbarung zu überführen, welche das wahre Machtgleichgewicht widerspiegelt."

 cc_pu.1.a: "Schlage die formelle Partnerschaft vor."
 cc_pu.1.a.tt: "Ein direkter diplomatischer Vorschlag. [pu_target.GetName] wird zustimmen, obwohl ihr Hof das Gefühl haben könnte, dass die Vereinbarung nicht gänzlich ihre Wahl war."

 cc_pu.1.b: "Versüße das Geschäft mit einer großzügigen Abfindung. [150 gold]"
 cc_pu.1.b.tt: "Biete dem Gerichtshof von [pu_target.GetName] einen finanziellen Vergleich an. Die Großzügigkeit nimmt jedes Gefühl des Zwangs – die Vereinbarung wird eher begrüßt als missbilligt."

 cc_pu.1.c: "Entsende [cc_pu_minister.GetName] zu Verhandlungen."
 cc_pu.1.c.tt: "Überlassen Sie die Übergangsphase unserem erfahrensten Diplomaten. Das Geschick von [cc_pu_minister.GetName] stellt sicher, dass der Vorschlag als Ehre und nicht als Aufdrängen empfunden wird."

 ########################################################################
 # EVENTS — cc_pu.2 (Crown Dependency path)
 ########################################################################

 cc_pu.2.title: "Stärkung des dynastischen Bandes"

 cc_pu.2.desc: "Unsere königliche Heirat mit [pu_target.GetName] bietet eine Gelegenheit, die über die gewöhnlichen Vereinbarungen einer Union hinausgeht. Da uns sowohl dynastische Bande als auch die Mitgliedschaft in der Union mit diesem Reich verbinden, könnten wir vorschlagen, [pu_target.GetName] offiziell als Kronabhängigkeit zu formalisieren – ein Band, das die gemeinsame Blutlinie ehrt und gleichzeitig eine klare Priorität für zukünftige Generationen festlegt."

 cc_pu.2.a: "Schlage die formelle Kronabhängigkeit vor."
 cc_pu.2.a.tt: "Ein direkter dynastischer Vorschlag. [pu_target.GetName] wird der Vereinbarung zustimmen, obwohl ihr Hof das Gefühl haben könnte, dass die Änderung nicht gänzlich ihre Idee war."

 cc_pu.2.b: "Begleite den Vorschlag mit einem königlichen Geschenk. [100 gold]"
 cc_pu.2.b.tt: "Eine großzügige Geste gegenüber dem Hof von [pu_target.GetName] erleichtert den Übergang. Deren Adlige fühlen sich eher entschädigt als unter Druck gesetzt."

 cc_pu.2.c: "Lassen Sie [cc_pu_minister.GetName] den Vorschlag am Hofe präsentieren."
 cc_pu.2.c.tt: "Ein geschickter Diplomat lässt die Abhängigkeitsbeziehung wie ein Privileg erscheinen. [pu_target.GetName] gewinnt durch die Verbindung ebenso viel Prestige, wie es an Autonomie kostet."
