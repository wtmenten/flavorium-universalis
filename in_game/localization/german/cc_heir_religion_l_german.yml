l_german:
 cc_request_heir_religion_group: "Gesetz zur Religionszugehörigkeit des Erben beantragen"
 dip_cc_request_heir_religion_group: "Gesetz zur Religionszugehörigkeit des Erben beantragen"
 dip_cc_request_heir_religion_group_CATEGORY: "CATEGORY_FRIENDLY_ACTIONS"
 cc_request_heir_religion_group_desc: "Einen Partner einer königlichen Ehe eines anderen Glaubens innerhalb unserer [religion_group|e] bitten, sein [ShowLawName('heir_religion_law')] auf [ShowPolicyName('heir_same_religion_group')] zu ändern, damit Erben unseres Glaubens ihren Thron erben können."
 cc_request_heir_religion_group_act: "[SCOPE.sCountry('recipient').GetName] bitten, ihr [ShowLawName('heir_religion_law')] zu ändern."
 cc_request_heir_religion_group_effect_text: "[SCOPE.sCountry('actor').GetName] bittet [SCOPE.sCountry('recipient').GetName], [ShowPolicyName('heir_same_religion_group')] zu übernehmen."
 cc_request_heir_religion_group_effect_text_past: "[SCOPE.sCountry('actor').GetName] hat [SCOPE.sCountry('recipient').GetName] gebeten, [ShowPolicyName('heir_same_religion_group')] zu übernehmen."
 PROPOSE_cc_request_heir_religion_group: "$RECIPIENT$ bitten, ihr [ShowLawName('heir_religion_law')] auf [ShowPolicyName('heir_same_religion_group')] zu ändern?\n\n$INFO$"
 cc_request_heir_religion_group_reject_effect_text: "$generic_reject_request_effect_string$"
 cc_request_heir_religion_group_reject_effect_text_past: "$generic_reject_request_effect_string_past$"
 INCOMING_OFFER_TITLE_cc_request_heir_religion_group: "Bitte bezüglich der Religion des Erben"
 INCOMING_OFFER_cc_request_heir_religion_group: "$ACTOR$ bittet uns, unser [ShowLawName('heir_religion_law')] auf [ShowPolicyName('heir_same_religion_group')] zu ändern.\n\n$INFO$"
 cc_hrl_request_tt: "[SCOPE.sCountry('recipient').GetName] wird entscheiden, ob sie ihr [ShowLawName('heir_religion_law')] von [ShowPolicyName('heir_same_religion')] auf [ShowPolicyName('heir_same_religion_group')] ändern. Sie können zustimmen, ablehnen oder nur zustimmen, wenn wir die gleiche Änderung vornehmen.\nDie Wahrscheinlichkeit einer Zustimmung steigt, wenn sie eine gute [opinion|e] von uns haben und uns vertrauen, sowie wenn wir über eine hohe [diplomatic_reputation|e] und [prestige|e] verfügen, eine [great_power|e] sind oder die stärkere Kultur besitzen. Eine Ablehnung senkt unsere [opinion|e] von ihnen."
 cc_hrl_has_same_religion_policy_tt: "Ihr [ShowLawName('heir_religion_law')] ist [ShowPolicyName('heir_same_religion')]"
 cc_hrl_policy_not_locked_tt: "Ihr [ShowLawName('heir_religion_law')] ist nicht festgelegt"
 cc_hrl_group_policy_available_tt: "[ShowPolicyName('heir_same_religion_group')] ist für sie verfügbar"
 cc_hrl_not_recently_asked_tt: "Niemand hat sie in den letzten 10 Jahren gebeten, dieses Gesetz zu ändern"

 opinion_cc_hrl_request_granted: "Gesetz zur Religionszugehörigkeit des Erben auf unseren Wunsch geändert"
 opinion_cc_hrl_request_refused: "Hat unsere Bitte bezüglich der Religion des Erben abgelehnt"
 opinion_cc_hrl_reciprocal_pact: "Gegenseitige Vereinbarung zur Religion des Erben"

 cc_hrl.1.title: "Eine Bitte von [cc_hrl_requester.GetName]"
 cc_hrl.1.desc: "Gesandte von [cc_hrl_requester.GetName], die uns durch eine königliche Ehe verbinden, bitten uns, unsere Thronfolge für Erben des Glaubens der [cc_hrl_requester.GetReligion.GetName] zu öffnen. Unser Gesetz verlangt derzeit einen Erben unserer eigenen Religion. Da beide Glaubensrichtungen derselben Religionsgruppe angehören, bitten sie uns, dies als ausreichend vorauszusetzen. Unser Klerus wird die Änderung nicht begrüßen, aber sie würde die Bande zwischen den beiden Höfen stärken."
 cc_hrl.1.a: "Der Änderung zustimmen."
 cc_hrl.1.b: "Unsere Thronfolge liegt nicht in ihrer Entscheidungsgewalt."
 cc_hrl.1.c: "Nur wenn sie dasselbe tun."
 cc_hrl.1.c.tt: "[cc_hrl_requester.GetName] wird gebeten, ihr eigenes [ShowLawName('heir_religion_law')] auf [ShowPolicyName('heir_same_religion_group')] zu ändern. Wenn sie zustimmen, ändern beide Länder dies gemeinsam."

 cc_hrl.2.title: "[cc_hrl_partner.GetName] Zustimmen"
 cc_hrl.2.desc: "[cc_hrl_partner.GetName] haben ihr [ShowLawName('heir_religion_law')] auf [ShowPolicyName('heir_same_religion_group')] geändert. Ein Erbe unseres Glaubens kann nun ihren Thron erben."
 cc_hrl.2.a: "Gut."

 cc_hrl.3.title: "[cc_hrl_partner.GetName] Ablehnen"
 cc_hrl.3.desc: "[cc_hrl_partner.GetName] haben unsere Bitte abgelehnt. Ihr Thron bleibt für Erben geschlossen, die nicht ihre Religion teilen."
 cc_hrl.3.a: "So sei es."

 cc_hrl.4.title: "[cc_hrl_partner.GetName] Gleiches fordern"
 cc_hrl.4.desc: "[cc_hrl_partner.GetName] werden ihr [ShowLawName('heir_religion_law')] auf [ShowPolicyName('heir_same_religion_group')] ändern, aber nur, wenn wir unseres ebenfalls ändern. Unser Klerus und unser Hof werden sich dagegen wehren, unsere eigene Thronfolge für Erben des [cc_hrl_partner.GetReligion.GetName]-Glaubens zu öffnen, und die Durchsetzung wird uns etwas kosten."
 cc_hrl.4.a: "Einverstanden. Beide Kronen werden das Gesetz ändern."
 cc_hrl.4.b: "Wir werden unsere eigene Thronfolge nicht öffnen."

 cc_hrl.5.title: "Vereinbarung mit [cc_hrl_requester.GetName]"
 cc_hrl.5.desc: "[cc_hrl_requester.GetName] haben unsere Bedingungen akzeptiert. Beide Länder nutzen nun [ShowPolicyName('heir_same_religion_group')], und ein Erbe beider Glaubensrichtungen kann jeden der beiden Throne erben."
 cc_hrl.5.a: "Gut."

 cc_hrl.6.title: "[cc_hrl_requester.GetName] Ablehnen"
 cc_hrl.6.desc: "[cc_hrl_requester.GetName] würden ihr eigenes [ShowLawName('heir_religion_law')] nicht ändern. Unser Gesetz bleibt wie es war."
 cc_hrl.6.a: "Dann ändert sich nichts."
