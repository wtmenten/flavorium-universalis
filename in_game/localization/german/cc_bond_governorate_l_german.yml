l_german:
 # === cc_bonds.20 — The Governor's First Annual Report ===
 cc_bonds.20.title: "Der erste Jahresbericht des Gouverneurs"
 cc_bonds.20.desc: "Der Gouverneur von [bond_subj.GetName] hat seinen ersten vollständigen Jahresbericht über die Angelegenheiten der Provinz eingereicht. Einnahmezahlen sind beigefügt, zusammen mit einer Bewertung der lokalen Verwaltung, der öffentlichen Arbeiten und der Stimmung der Bevölkerung. Er erwartet Anweisungen darüber, wie die Krone die laufende Regierungsführung angehen möchte – ob mit festen Zielen und enger Aufsicht oder mit einem gewissen Spielraum für lokale Gegebenheiten."
 cc_bonds.20.a: "Setze strenge Einnahmeziele fest. Die Provinz muss ihren vollen Anteil beisteuern."
 cc_bonds.20.b: "Flexible Verwaltung zulassen. Ergebnisse zählen mehr als die Methode."
 cc_bonds.20.c: "Bilden Sie einen Aufsichtsrat. Die Regierungsführung sollte transparent sein."

 # === cc_bonds.21 — Provincial Road and Market ===
 cc_bonds.21.title: "Provinzstraße und -markt"
 cc_bonds.21.desc: "Der Gouverneur von [bond_subj.GetName] unterbreitet einen Vorschlag: eine neue Marktstraße, die das Binnenland der Provinz mit der Küste verbindet, sowie ein beaufsichtigter Markt zur Rationalisierung des lokalen Handels. Das Projekt würde mehrere Jahre in Anspruch nehmen und erfordert Kapital. Die wirtschaftlichen Vorteile sind real – die Frage ist, wer die Kosten trägt."
 cc_bonds.21.a: "Lasst die Provinz dies aus lokalen Einnahmen finanzieren."
 cc_bonds.21.b: "Die Krone wird das Kapital bereitstellen."
 cc_bonds.21.c: "Den Vorschlag vertagen. Wir haben dringendere Anliegen."

 # === cc_bonds.22 — The Governor's Military Levy ===
 cc_bonds.22.title: "Die militärische Aufgebotssteuer des Gouverneurs"
 cc_bonds.22.desc: "Der Gouverneur von [bond_subj.GetName] wurde gebeten, die militärische Kapazität der Provinz zu bewerten. Sein Bericht ist ehrlich: Die Männer sind vorhanden, aber ihre Einberufung würde die landwirtschaftliche Arbeit in einer kritischen Saison stören, und die Provinz hat ihre eigenen Sicherheitsprobleme. Er kann die Truppen auf Befehl aufstellen. Er fragt nun, ob dies wirklich das ist, was wir wollen."
 cc_bonds.22.a: "Rufen Sie die volle Levée aus. Die Provinz muss dem Ruf der Krone folgen."
 cc_bonds.22.b: "Biete freiwilligen Dienst gegen Entschädigung an. Schone die Unwilligen."
 cc_bonds.22.c: "Erhebe derzeit keine Truppen aus dieser Provinz."

 # === cc_bonds.23 — Governor's Son Seeks Appointment ===
 cc_bonds.23.title: "Sohn des Gouverneurs ersucht um Ernennung"
 cc_bonds.23.desc: "Wir erfahren, dass der Gouverneur von [bond_subj.GetName] einen Sohn im geeigneten Alter für eine Hofernennung hat – gut ausgebildet, bestens vernetzt in provinziellen Kreisen und eindeutig die Wahl seines Vaters für den Aufstieg. Die Bitte ist nicht explizit, aber sie ist unmissverständlich. Ob wir dies als Gelegenheit oder als Aufdrängen betrachten, hängt davon ab, wie wir die Beziehung zur Provinz angehen."
 cc_bonds.23.a: "Finden Sie für den jungen Mann eine angemessene Position am Hofe."
 cc_bonds.23.b: "Ernennungen erfolgen nach Verdienst. Er soll sich über die offiziellen Kanäle bewerben."
 cc_bonds.23.c: "Ignoriere die implizite Bitte."

 # === cc_bonds.24 — Provincial Legal Customs Conflict ===
 cc_bonds.24.title: "Konflikt über provinzielle Rechtsgewohnheiten"
 cc_bonds.24.desc: "Die Provinzgerichte von [bond_subj.GetName] operieren nach einem System lokaler Gewohnheitsrechte, die der Kronenverwaltung um mehrere Generationen vorausgehen. Kronenanwälte argumentieren, dass diese Inkonsistenz die rechtliche Autorität untergrabe und die Verwaltung erschwere. Provinzführer halten dagegen, dass ihre Bräuche legitim, funktional und tief im lokalen Leben verwurzelt seien. Ein Konflikt über einen strittigen Erbfall hat die Frage nun aufgeworfen."
 cc_bonds.24.a: "Standardisiere das Kronrecht in der gesamten Provinz. Ein Gesetz für alle."
 cc_bonds.24.b: "Kodifiziere ein Hybridsystem. Bewahre, was funktioniert, integriere, was nötig ist."
 cc_bonds.24.c: "Erkenne lokale Bräuche formell an. Ihr Gesetz ist ihr eigenes."

 # === cc_bonds.25 — The Governor Petitions for Permanence ===
 cc_bonds.25.title: "Der Gouverneur ersucht um Verstetigung"
 cc_bonds.25.desc: "Der derzeitige Gouverneur von [bond_subj.GetName] hat zwei volle Amtszeiten hinter sich und nähert sich dem Ende seiner dritten. Seine Petition erreicht uns mit beträchtlicher Unterstützung – vom Provinzadel, vom lokalen Klerus und von Kaufleuten, die sich unter seiner Verwaltung wohlfühlen. Er bittet darum, als Erbgouverneur bestätigt zu werden, sodass seine Familie das Amt auf ewig innehatte. Die Bitte ist schmeichelhaft. Sie ist jedoch auch folgenreich."
 cc_bonds.25.a: "Gewähre die erbliche Gouverneurschaft. Seine Dienste haben dies verdient."
 cc_bonds.25.b: "Behalten Sie das System der Kronrotation bei. Keine Erbamter."
 cc_bonds.25.c: "Seine aktuelle Amtszeit erheblich verlängern. Ein Kompromiss."

 # === cc_bonds.26 — Corruption Reports ===
 cc_bonds.26.title: "Berichte über Korruption"
 cc_bonds.26.desc: "Vertrauliche Berichte haben uns erreicht, die darauf hindeuten, dass bestimmte Beamte in [bond_subj.GetName] ihre Gehälter durch irreguläre Mittel aufgebessert haben – überhöhte Verträge, umgeleitete Steuereinnahmen, bevorzugte Lizenzen. Die Beträge sind nicht ruinös, und der Gouverneur selbst ist entweder nicht im Bilde oder bewusst uninformiert. Aber der Verlust ist real, und unsere Reaktion wird einen Präzedenzfall schaffen."
 cc_bonds.26.a: "Ignoriere die Berichte. Ein gewisses Maß an Korruption ist der Preis der Verwaltung."
 cc_bonds.26.b: "Beauftragen Sie eine vollständige Prüfung. Die Verantwortlichen werden zur Rechenschaft gezogen."
 cc_bonds.26.c: "Ein privates Geschenk an den Gouverneur senden. Zur Diskretion mahnen."

 # === cc_bonds.201 — The Council Delivers Its Report ===
 cc_bonds.201.title: "Der Rat legt seinen Bericht vor"
 cc_bonds.201.desc: "Der Aufsichtsrat, den wir in [bond_subj.GetName] eingerichtet haben, hat seine Arbeit abgeschlossen. Der Bericht ist gründlich – vielleicht gründlicher, als wir es bei der Einrichtung des Rates erwartet hatten. Er dokumentiert administrative Lücken, schätzt die Kosten für deren Behebung und schließt mit einer Reihe von Empfehlungen ab, die von Verfahrensreformen bis zu Infrastrukturausgaben reichen. Der Rat hat genau das getan, was wir von ihm verlangt haben. Die Frage ist, was wir mit der Antwort anfangen.\n\nDie Empfehlungen sind nicht billig. Sie sind politisch nicht neutral. Und der Rat beobachtet nun, ob seine Arbeit überhaupt eine Bedeutung hatte."

 cc_bonds.201.a: "Akzeptiere die Empfehlungen. Finanziere die vom Rat identifizierten Reformen."
 cc_bonds.201.a.tooltip: "Die Arbeit des Rates wird gewürdigt. Eine echte Investition in die Provinzverwaltung — sowohl Ökonomie als auch Politik verbessern sich, und die Provinz wird effizienter regiert."

 cc_bonds.201.b: "Überstimme den Rat. Nimm die wirtschaftlichen Gewinne und verzichte auf die Strukturreformen."
 cc_bonds.201.b.tooltip: "Die kurzfristige Ausbeutung ist real — ökologische Gewinne ohne die Kosten. Die politische Stabilität sinkt, da die Schlussfolgerungen des Rates beiseitegeschoben werden. Die administrativen Lücken bleiben bestehen."

 cc_bonds.201.c: "Formalisiere den Rat als eine dauerhafte Institution der Provinzverwaltung."
 cc_bonds.201.c.tooltip: "Die größte Investition – aber sowohl Wirtschaft als auch Politik gewinnen erheblich, und die Provinz sendet einen formalen Ausdruck des Wohlwollens an die Krone. Der Rat wird dauerhaft Teil der Provinzstruktur."
