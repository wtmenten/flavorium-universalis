l_german:


 # ============================================================
 # SUBJECT TYPE UI KEYS (LEAD_/AM_/CANCEL_)
 # ============================================================
 junior_partner: "Juniorpartner"
 LEAD_junior_partner: "Oberherrscher"
 AM_junior_partner: "Juniorpartner"
 CANCEL_junior_partnerTITLE: "Königliche Union auflösen"
 CANCEL_junior_partner_DESC: "Beenden Sie die Personalunion, lösen Sie das dynastische Band zwischen unseren Höfen und stellen Sie die volle Unabhängigkeit des Partnerreichs wieder her."

 LEAD_lesser_partner: "Oberherrscher"
 AM_lesser_partner: "Minderpartner"
 CANCEL_lesser_partnerTITLE: "Kleinere Partnerschaft auflösen"
 CANCEL_lesser_partner_DESC: "Löse die kleinere Partnerschaft auf und gib dem Partnerreich seine unabhängige Außenpolitik zurück. Die tiefe wirtschaftliche Integration der letzten fünfzig Jahre lässt sich nicht so einfach rückgängig machen."

 LEAD_shadow_state: "Schattenpatron"
 AM_shadow_state: "Schattenstaat"
 CANCEL_shadow_stateTITLE: "Schatten-Suzeränität entziehen"
 CANCEL_shadow_state_DESC: "Beenden Sie stillschweigend die geheime Oberhoheit, wodurch der Schattenstaat von seinen Vertragsverpflichtungen befreit wird und unser informeller Einfluss auf seine Angelegenheiten endet."

 LEAD_puppet_state: "Oberherr"
 AM_puppet_state: "Vasallenstaat"
 CANCEL_puppet_stateTITLE: "Marionettenstaat freilassen"
 CANCEL_puppet_state_DESC: "Gewähre dem Marionettenstaat seine Unabhängigkeit und ziehe die direkte administrative Aufsicht zurück. Das Reich erlangt die Kontrolle über seine eigene Außenpolitik zurück."

 LEAD_elite_enclave: "Patron"
 AM_elite_enclave: "Elite-Enklave"
 CANCEL_elite_enclaveTITLE: "Enklavencharta widerrufen"
 CANCEL_elite_enclave_DESC: "Widerrufen Sie die Charta der kulturellen Enklave, wodurch die formale Autonomie und die Regelung des adligen Patronats enden. Die Adelsfamilien werden diese Kränkung nicht vergessen."

 LEAD_palatinate: "Lehensherr"
 AM_palatinate: "Pfalz"
 CANCEL_palatinateTITLE: "Pfalzgrafschaft auflösen"
 CANCEL_palatinate_DESC: "Löse die Pfalzgrafschaft auf, entziehe dem Pfalzgrafen seine souveräne Autorität und beende eine der prestigeträchtigsten kulturellen Partnerschaften unseres Reiches."

 LEAD_associated_republic: "Patron"
 AM_associated_republic: "Assoziierte Republik"
 CANCEL_associated_republicTITLE: "Republikanische Vereinigung beenden"
 CANCEL_associated_republic_DESC: "Rückzug aus dem Patronatsabkommen, wodurch der wissenschaftliche Austausch und die formelle Verbindung mit der Republik beendet werden."

 LEAD_chartered_company: "Charta-Krone"
 AM_chartered_company: "Privilegierte Gesellschaft"
 CANCEL_chartered_companyTITLE: "Handelscharta widerrufen"
 CANCEL_chartered_company_DESC: "Widerrufen Sie die königliche Handelscharta und lösen Sie den rechtlichen Status der Gesellschaft als Arm der Krone auf. Die Kaufmannsstände werden dies energisch anfechten."

 LEAD_artists_commune: "Patron"
 AM_artists_commune: "Künstlerkommune"
 CANCEL_artists_communeTITLE: "Künstlerkommune auflösen"
 CANCEL_artists_commune_DESC: "Entzug der Kommunalcharta, Beendigung der formellen Patronatsvereinbarung und Zerstreuung der Künstler, die sich unter unserem Schutz versammelt hatten."

 LEAD_scientific_college: "Patron"
 AM_scientific_college: "Wissenschaftliches Kollegium"
 CANCEL_scientific_collegeTITLE: "Gelehrtenkonkordat auflösen"
 CANCEL_scientific_college_DESC: "Beenden Sie das wissenschaftliche Konkordat und lösen Sie die formelle Beziehung zwischen unserer Krone und der gelehrten Bruderschaft auf. Es wird Jahre dauern, die Forschungsverbindungen wieder aufzubauen."

 LEAD_naval_administration: "Krone"
 AM_naval_administration: "Marineverwaltung"
 CANCEL_naval_administrationTITLE: "Marinecharta widerrufen"
 CANCEL_naval_administration_DESC: "Widerrufen Sie die Marinecharta und beenden Sie den halbautonomen Verwaltungsstatus der Hafenstadt. Die Beiträge der Seeleute zu unserer Flotte werden aufhören."

 LEAD_protectorate: "Protektor"
 AM_protectorate: "Protektorat"
 CANCEL_protectorateTITLE: "Protektorat beenden"
 CANCEL_protectorate_DESC: "Wir entziehen unseren formellen Schutz und überlassen das Protektorat der Verwaltung seiner eigenen Sicherheit. Die Machtprojektion und das diplomatische Ansehen, die wir gewonnen haben, werden schwinden."

 LEAD_crown_dependency: "Krone"
 AM_crown_dependency: "Kronabhängigkeit"
 CANCEL_crown_dependencyTITLE: "Kronenabhängigkeit freilassen"
 CANCEL_crown_dependency_DESC: "Beenden Sie die dynastische Regierungsform, lösen Sie die gemeinsame Familienherrschaft auf und lassen Sie die Abhängigkeit ihre eigenen Angelegenheiten verwalten."

 LEAD_holy_protectorate: "Heiliger Beschützer"
 AM_holy_protectorate: "Heiliges Protektorat"
 CANCEL_holy_protectorateTITLE: "Heiligen Schutz entziehen"
 CANCEL_holy_protectorate_DESC: "Wir entziehen unser spirituelles Patronat und befreien den gleichreligiösen Staat von seinem geschützten Status. Unser Ansehen unter den Gläubigen wird durch diese Preisgabe leiden."

 # ============================================================
 # SUBJECT TYPE DESCRIPTIONS
 # ============================================================
 junior_partner_desc: "Ein $junior_partner$ behält seinen eigenen Herrscher und betreibt eine unabhängige Außenpolitik, erkennt jedoch die Vorherrschaft seines Lehnsherrn an. Beide Reiche profitieren von einer schnelleren Verbreitung von Institutionen und gegenseitiger Stärkung der Legitimität. Die Erschaffung eines $junior_partner$ erfordert den Fortschritt $royal_union_network_advance$ und einen bestehenden Lehensvasallen, der aufgestuft werden kann."
 junior_partner_tt: "Noch kein Upgrade möglich – die aktuelle Vasallenbeziehung muss sich erst festigen, bevor eine neue Vereinbarung angeboten werden kann."

 lesser_partner: "Minderpartner"
 lesser_partner_desc: "Ein $lesser_partner$ ist die Reifeform eines $junior_partner$ nach fünfzig Jahren gemeinsamer Dynastie. Die unabhängige Außenpolitik des Reiches wird eingeschränkt, aber die wirtschaftliche Integration vertieft sich – der Tribut steigt erheblich, während beide Höfe stabiler und legitimer werden."
 lesser_partner_upgrade_tt: "Noch kein Upgrade möglich – das Unionsband benötigt fünfzig Jahre, um zu einer geringeren Partnerschaft heranzureifen."

 shadow_state: "Schattenstaat"
 shadow_state_desc: "Ein $shadow_state$ ist formell unabhängig und nur durch geheime Verträge und diskrete Vereinbarungen gebunden. Der Lehnsherr übt Einfluss aus, ohne zu annektieren, und gewinnt so an Machtprojektion, während der Vasall von Stabilität und Legitimität profitiert. Diese Beziehung kann nur durch einen Vertrag mit einer bestehenden unabhängigen Nation hergestellt werden. Erfordert den Fortschritt $shadow_diplomacy_advance$."

 cc_force_shadow_state: "Schatten-Suzeränität fordern"
 cc_force_shadow_state_entry: "Schatten-Suzeränität fordern"
 cc_force_shadow_state_entry_short: "Schatten-Suzeränität fordern"
 cc_force_shadow_state_desc: "Zwingen Sie die besiegte Nation dazu, eine verdeckte Oberhoheit zu akzeptieren – wobei Ihre Dominanz durch einen geheimen Vertrag statt durch öffentliche Unterwerfung anerkannt wird. Die Beziehung wird Ihre Macht projizieren, ohne den vollen Antagonismus einer offenen Eroberung. Erfordert den Fortschritt Schatten-Diplomatie."

 client_state: "Klientelstaat"
 client_state_desc: "Ein $client_state$ ist eine Nation, die durch einen Vertrag oder freigegebene Provinzen in den Orbit einer stärkeren Macht gebracht wurde. Sie behält ihre eigene Außenpolitik bei, zahlt jedoch einen bescheidenen Tribut und kann schließlich zu einem $puppet_state$ befördert werden. Erfordert den Fortschritt $client_state_advance$."

 puppet_state: "Vasallenstaat"
 puppet_state_desc: "Ein $puppet_state$ ist eine ehemals unabhängige Nation, die unter die vollständige administrative Aufsicht ihres Lehnsherrn gestellt wurde. Ihre Außenpolitik wird kontrolliert, die Schatzkammer gelenkt und Armeen können nach Belieben herangezogen werden. Sowohl $shadow_state$ als auch $client_state$ Vasallen können nach fünfzig Jahren in diesen Status erhoben werden. Erfordert den Fortschritt $puppet_state_advance$."
 puppet_state_upgrade_tt: "Noch kein Upgrade möglich – die aktuelle Unterwerfung ist zu frisch, um eine weitere Konsolidierung der Kontrolle zuzulassen."

 elite_enclave: "Elite-Enklave"
 elite_enclave_desc: "Eine $elite_enclave$ ist ein kulturell verwandtes Gebiet, dem in Anerkennung seines adligen Erbes Selbstverwaltung gewährt wurde. Sie nimmt nicht an Kriegen teil, verleiht jedoch bemerkenswertes kulturelles Prestige – was den kulturellen Einfluss, die kulturelle Tradition und die Zufriedenheit des Adelsstandes steigert. Beschränkt auf einen Untertanen dieses Typs. Erfordert den Fortschritt $noble_patronage_advance$ und das Standesprivileg für Rechte der Adelsenklave."

 palatinate: "Pfalz"
 palatinate_desc: "Eine $palatinate$ ist eine $elite_enclave$, die zu einer halb-souveränen Macht herangewachsen ist. Der Pfalzgraf kann nun Krieg erklären, Truppen ausheben und an Feldzügen teilnehmen. Die kulturellen und Prestige-Vorteile für den Lehnsherrn sind beträchtlich. Kann nur durch die Aufwertung einer $elite_enclave$ nach zwanzig Jahren erstellt werden. Erfordert den Fortschritt $palatinate_advance$."
 palatinate_upgrade_tt: "Noch kein Upgrade möglich – die Enklave muss zwanzig Jahre reifen, bevor sie zu einer Pfalz erhoben werden kann."

 associated_republic: "Assoziierte Republik"
 associated_republic_desc: "Eine $associated_republic$ ist ein unabhängiger republikanischer Staat unter formellem Patronat. Beide Parteien bewahren ihre politische Unabhängigkeit, aber der Untertan fügt sich in Verteidigungskriegen seinem Patron, und beide profitieren von einem wissenschaftlichen Austausch, der die Forschung beschleunigt. Der Untertan muss eine Republik als Regierungsform haben. Erfordert den Fortschritt $republican_patronage_advance$."

 chartered_company: "Privilegierte Gesellschaft"
 chartered_company_desc: "Eine $chartered_company$ ist eine königlich privilegierte Handelsgesellschaft, die in fernen Ländern im Namen ihres Lehnsherrn operiert. Sie zahlt hohe Tribute in Gold, Mannkraft und Seeleuten, während sie gleichzeitig die Macht der Handelszentren und die Forschungsgeschwindigkeit steigert. Vasallen müssen sich auf einem anderen Subkontinent als die Hauptstadt des Lehnsherrn befinden. Erfordert den Fortschritt $chartered_company_advance$, die Reform des Kolonialcharter-Systems und ein aktives königliches Handelsbüro in der Bürokratie."

 artists_commune: "Künstlerkommune"
 artists_commune_desc: "Eine $artists_commune$ ist eine selbstverwaltete Gemeinschaft von Malern, Bildhauern und Handwerkern, deren Werke zum Ruhm ihres Mäzens beitragen. Sie bringt wenig Gold ein, liefert aber spektakuläre Dividenden bei kulturellem Einfluss und Forschungsgeschwindigkeit. Muss die Kulturgruppe des Lehnsherrn teilen, ist auf eine Provinz beschränkt, und es darf nur eine existieren. Erfordert den Fortschritt $artistic_patronage_advance$."

 scientific_college: "Wissenschaftliches Kollegium"
 scientific_college_desc: "Ein $scientific_college$ ist eine wissenschaftliche Institution einer religiös geführten Politie, die frei ist, im Namen ihres Patrons dem Wissen nachzugehen. Ihre Vorteile – schnellere Verbreitung von Institutionen, reduzierte Kosten für die religiöse Akzeptanz, verbesserte Krankheitsresistenz – wirken in beide Richtungen. Der Vasall muss eine Theokratie sein; es darf nur eines existieren. Erfordert den Fortschritt $scholarly_orders_advance$ und das Klerikerprivileg der Gelehrtenbruderschaft."

 naval_administration: "Marineverwaltung"
 naval_administration_desc: "Eine $naval_administration$ ist eine Hafenstadt, der eine Teilunabhängigkeit gewährt wurde, um die maritime Logistik der Flotte ihres Patrons zu verwalten. Sie zahlt einen ungewöhnlich hohen Anteil an Seeleuten neben Gold und Mannkraft. Muss dieselbe Kulturgruppe wie der Lehnsherr teilen; es darf nur eine existieren. Erfordert den Fortschritt $naval_charter_advance$ und das Bürgerprivileg der Marinecharta."

 protectorate: "Protektorat"
 protectorate_desc: "Ein $protectorate$ ist ein schwächerer Nachbarstaat unter dem Schutz einer stärkeren Macht ohne formelle Unterwerfung. Er zahlt keinen Tribut und führt seine eigenen Kriege, erkennt aber die Seniorität des Patrons an. Der Lehnsherr gewinnt an Machtprojektion und diplomatischem Ansehen und entzieht das Territorium den Rivalen. Erfordert den Fortschritt $protectorate_rights_advance$."

 crown_dependency: "Kronabhängigkeit"
 crown_dependency_desc: "Eine $crown_dependency$ ist ein Reich, das durch die Bande einer gemeinsamen Dynastie an seinen Lehnsherrn gebunden ist, wobei dieselbe Herrscherfamilie beide Höfe ohne eine formelle Personalunion regiert. Die Abhängigkeit zahlt einen beträchtlichen Tribut und nimmt an den Kriegen ihres Patrons teil, während beide Parteien von gesteigertem Prestige und Legitimität profitieren. Erfordert den Fortschritt $dynastic_governance_advance$ und eine gemeinsame Herrscherfamilie."

 holy_protectorate: "Heiliges Protektorat"
 holy_protectorate_desc: "Ein $holy_protectorate$ ist ein gleichreligiöser Staat, der unter die geistliche Schirmherrschaft einer größeren Macht gestellt wurde. Er zahlt keinen Goldtribut, versorgt den Lehnsherrn jedoch mit religiösem Einfluss, Machtprojektion und Prestige. Beide Parteien schließen sich immer gegenseitig in Verteidigungskriegen an. Der Vasall muss dieselbe Religionsgruppe wie der Lehnsherr teilen. Erfordert den Fortschritt $holy_patronage_advance$."


 royal_union_network_advance: "Königliches Unionsnetzwerk"
 royal_union_network_advance_desc: "Personalunionen müssen keine passiven Erbschaften sein. Durch den Aufbau eines Netzwerks dynastischer Bindungen und gemeinsamer Institutionen kann die Union zu einem lebendigen Instrument der Politik werden. Schaltet die Vasallentypen $junior_partner$ und $lesser_partner$ frei."

 shadow_diplomacy_advance: "Schattendiplomatie"
 shadow_diplomacy_advance_desc: "Nicht jeder Einfluss zeigt sich offen. Durch stille Verträge und die diskrete Platzierung vertrauenswürdiger Agenten kann ein Monarch einen Nachbarstaat an seine Interessen binden, ohne dass eine einzige Armee bewegt wird. Schaltet den Vasallentyp $shadow_state$ und das Adelsstandsprivileg Schattennetzwerk frei."

 artistic_patronage_advance: "Künstlerisches Mäzenatentum"
 artistic_patronage_advance_desc: "Große Kunst in Auftrag zu geben bedeutet, seine Spuren in der Zeit selbst zu hinterlassen. Ein Herrscher, der die Schatzkammer für Maler, Dichter und Architekten öffnet, häuft kulturelles Kapital an, das jeden militärischen Feldzug überdauert. Schaltet den Vasallentyp $artists_commune$ und das Privileg des Adelsstandes „Kunstmäzenatentum“ frei."

 noble_patronage_advance: "Adelspatronage"
 noble_patronage_advance_desc: "Ein weiser Herrscher erkennt, dass der hohe Adel, wenn man ihm eine ehrenvolle Autonomie gewährt, eher Loyalität als Groll zurückgeben wird. Die formale Anerkennung adliger Enklaven verwandelt potenzielle Rivalen in kulturelle Fürsprecher. Schaltet den Vasallentyp $elite_enclave$ und das Ständeprivileg Adlige Enklavenrechte frei."

 republican_patronage_advance: "Republikanisches Patronat"
 republican_patronage_advance_desc: "Republiken besitzen ein praktisches Genie, das Monarchien gut zu kultivieren wüssten. Durch formelles Patronat kann ein König den intellektuellen Ertrag einer freien Republik sichern, ohne deren Identität zu bedrohen. Schaltet den Vasallentyp $associated_republic$ frei."

 dynastic_governance_advance: "Dynastische Regierungsführung"
 dynastic_governance_advance_desc: "Das Netz königlicher Ehen, das die europäischen Höfe miteinander verbindet, muss nicht rein zeremoniell bleiben. Mit sorgfältiger Planung kann eine gemeinsame Dynastie zu einem Rahmen für echte politische Koordination werden. Schaltet den Vasallentyp $crown_dependency$ frei."

 client_state_advance: "Diplomatie der Klientelstaaten"
 client_state_advance_desc: "Indem eine Großmacht Schutz im Austausch für Tribut anbietet, kann sie ihren Einfluss auf benachbarte Territorien ausweiten, ohne die Kosten einer vollständigen Eroberung tragen zu müssen. Klientenbeziehungen sind das Lebenselixier hegemonialer Expansion. Schaltet den Vasallentyp $client_state$ frei."

 naval_charter_advance: "Marinesatzung"
 naval_charter_advance_desc: "Eine große Flotte erfordert nicht nur Schiffe, sondern auch Infrastruktur: Trockendocks, Versorgungsnetzwerke und kaufmännische Expertise. Die Gewährung eines besonderen Verwaltungsstatus für einen strategischen Hafen stellt sicher, dass diese Bedürfnisse stets erfüllt werden. Schaltet den Vasallentyp $naval_administration$ und das Privileg der Bürgerschaft „Marinecharta“ frei."

 protectorate_rights_advance: "Rechte des Protektorats"
 protectorate_rights_advance_desc: "Das Völkerrecht erlaubt es einer stärkeren Macht, sich zum Beschützer eines schwächeren Nachbarn zu erklären und so einen Schutzschild auszustrecken, ohne eine formale Unterwerfung zu verlangen. Solche Arrangements sind kostengünstiger zu etablieren als eine Vasallenschaft. Schaltet den Vasallentyp $protectorate$ frei."

 scholarly_orders_advance: "Gelehrte Orden"
 scholarly_orders_advance_desc: "Die großen religiösen Orden waren lange Zeit die Hüter des Wissens. Durch die Formalisierung der Beziehung zwischen Krone und Kloster kann ein Herrscher das angesammelte Wissen der Kirche nutzen. Schaltet den Untertyp $scientific_college$ und das Klerus-Standesprivileg Gelehrte Bruderschaft frei."

 palatinate_advance: "Pfalzsystem"
 palatinate_advance_desc: "Die erhabensten Adelseklaven können als Pfalzen anerkannt werden, souveräne Gebiete innerhalb eines Souveräns, deren Grafen eine fast königliche Autorität ausüben. Eine solche Anerkennung vertieft die kulturelle und militärische Bindung zwischen der Pfalz und dem Lehnsherrn. Schaltet das Upgrade $palatinate$ für Untertanen vom Typ $elite_enclave$ frei."

 holy_patronage_advance: "Heiliges Patronat"
 holy_patronage_advance_desc: "Glaube ist ein stärkeres Band als jeder Vertrag. Ein Herrscher, der sich als Beschützer gleichgläubiger Nachbarn positioniert, sichert sich nicht nur Verbündete, sondern einen Strom an spirituellem Prestige, der aus jeder gemeinsamen Gemeinschaft fließt. Schaltet den Vasallentyp $holy_protectorate$ frei."

 puppet_state_advance: "Vasallenstaatsverwaltung"
 puppet_state_advance_desc: "Schatteneinfluss muss schließlich einer direkten Verwaltung weichen. Mit den richtigen bürokratischen Mechanismen kann ein Oberherr einen lose gebundenen Klienten oder Schattenstaat in eine Marionette verwandeln, deren Angelegenheiten von der Hauptstadt des Oberherrn aus gesteuert werden. Schaltet das Upgrade $puppet_state$ für $shadow_state$- und $client_state$-Vasallen frei."

 chartered_company_advance: "Privilegierte Handelsgesellschaften"
 chartered_company_advance_desc: "Die Kaufmannsschichten haben eine beispiellose Fähigkeit zur Organisation des Handels auf globaler Ebene bewiesen. Durch die Ausstellung königlicher Privilegien kann eine Krone diese Energie auf ferne Kontinente lenken und so Tribute und Handel sichern. Schaltet den Untertyp $chartered_company$, das Standesprivileg der Bürger 'Königliche Handelscharter' und die Reform 'Koloniales Chartersystem' frei."


 ep_noble_elite_enclave: "Rechte der adligen Enklave"
 ep_noble_elite_enclave_desc: "Die Krone erkennt formell das Recht des Hochadels verwandter Kulturen an, Enklaven als selbstverwaltete Domänen zu regieren, wodurch adliger Groll in kulturelles Prestige für die Dynastie umgewandelt wird."

 ep_noble_patronage_arts: "Kunstmäzenatentum"
 ep_noble_patronage_arts_desc: "Der Adel übernimmt eine formelle Rolle als Mäzene von Malern, Bildhauern und Dichtern und verknüpft sein Prestige mit dem kulturellen Aufblühen des Reiches."

 ep_noble_shadow_network: "Schattennetzwerk"
 ep_noble_shadow_network_desc: "Der Hochadel webt ein geheimes Netz aus Informanten und Einflussmaklern in benachbarten Staaten und projiziert die Macht des Reiches über Stellvertreter statt über Armeen."

 ep_clergy_scholarly_college: "Gelehrte Bruderschaft"
 ep_clergy_scholarly_college_desc: "Der Klerus gründet eine formelle Bruderschaft, die der Bewahrung und Förderung des Lernens gewidmet ist und Gelehrten religiöser Orden akademische Freiheit gewährt, im Austausch dafür, dass ihr geistiger Ertrag dem Reich zugutekommt."

 ep_burgher_naval_charter: "Marinesatzung"
 ep_burgher_naval_charter_desc: "Die Kaufmannsschicht übernimmt die formale Verantwortung für die Versorgung und Verwaltung der maritimen Infrastruktur des Reiches, im Austausch für Sonderprivilegien in ausgewählten Hafenstädten."

 ep_burgher_royal_charter: "Königliche Handelsscharta"
 ep_burgher_royal_charter_desc: "Die Krone gewährt den Handelsständen das Recht, königlich chartierte Handelsgesellschaften zu organisieren, was kommerzielle Operationen in fernen Ländern unter dem Schutz der königlichen Autorität ermöglicht."


 cc_shadow_court_bureau: "Schattenhof"
 cc_shadow_court_bureau_desc: "Eine geheime Institution, über die die verdeckten diplomatischen Interessen des Reiches verwaltet werden — Agenten an fremden Höfen, Kommunikation mit Schattenstaaten und Einflussnahme abseits der öffentlichen Aufzeichnungen. Der Schattenhof verstärkt die Machtprojektion und den diplomatischen Ruf, doch Vernachlässigung führt zu Unruhen unter den Adelsständen."

 cc_royal_trading_bureau: "Königliches Handelsbüro"
 cc_royal_trading_bureau_desc: "Ein formales Regierungsorgan, das die privilegierten Handelsunternehmen des Reiches im Ausland beaufsichtigt. Das Büro koordiniert Lizenzen, die Beilegung von Streitigkeiten und den Fluss von Tributgütern an die Krone. Bei guter Führung generiert es bedeutende Steuereinnahmen und erweitert die maritime Kapazität."

 cc_scholarly_concordat: "Gelehrtes Konkordat"
 cc_scholarly_concordat_desc: "Ein formales Abkommen zwischen Krone und Klerus, das die Bedingungen festlegt, unter denen wissenschaftliche Institutionen operieren dürfen — Forschung wird betrieben, Institutionen gefördert und medizinisches Wissen im Namen des Reiches angewandt. Bei angemessener Finanzierung führt dies zu schnellerem institutionellem Wachstum und Krankheitsresistenz."

 cc_colonial_charter_reform: "Kolonialcharter-System"
 cc_colonial_charter_reform_desc: "Die Krone schafft einen formellen rechtlichen Rahmen für die Ausstellung königlicher Charter an Handelsunternehmen, die in fernen Ländern tätig sind, und gewährt ihnen militärische und kommerzielle Autorität im Austausch für Tribut und Loyalität. Diese Reform ermöglicht die Gründung von chartered company Untertanen."

 cc_internalized_scholarship: "Internalisierte Gelehrsamkeit"
 cc_internalized_scholarship_desc: "Anstatt ein externes Kollegium zu gründen, hat das Reich seinen eigenen Klerus zu größeren wissenschaftlichen Bestrebungen angeleitet."

 cc_scholarly_exchange_modifier: "Gelehrter Austausch"
 cc_scholarly_exchange_modifier_desc: "Ein formaler Wissensaustausch zwischen dem Reich und seinem Wissenschaftskollegium bereichert beide Parteien durch Fortschritte in der Gelehrsamkeit und Medizin."

 cc_thriving_port_modifier: "Gedeihender Seehafen"
 cc_thriving_port_modifier_desc: "Investitionen in die Einrichtungen der Marineverwaltung haben zu einer erweiterten maritimen Infrastruktur geführt, welche die Matrosenkapazität des Reiches steigert."

 cc_holy_league_modifier: "Heiliger Bund"
 cc_holy_league_modifier_desc: "Die formale Gründung einer Heiligen Liga zwischen dem Reich und seinem gleichreligiösen Protektorat hat eine Welle religiösen Enthusiasmus und Prestiges ausgelöst."

 cc_scholastic_disputation: "Scholastische Disputation"
 cc_scholastic_disputation_desc: "Eine gefeierte theologische Disputation an unserem Wissenschaftskollegium hat die Geister im gesamten Reich geschärft, das Wissen vorangebracht und die Toleranz für den Austausch in einer vernunftgesteuerten Debatte gefördert."
 cc_theological_condemnation: "Theologische Verurteilung"
 cc_theological_condemnation_desc: "Eine kühne Doktrin, die von unserem Kollegium vorangetrieben wurde, ist verurteilt worden. Das daraus resultierende Klima des Misstrauens hat die Forschung gehemmt, die Autorität der Kirche untergraben und Intoleranz im gesamten Reich geschürt."
 cc_reformed_scholarship: "Reformiertes Gelehrsamkeit"
 cc_reformed_scholarship_desc: "Unsere reformierte Akademie steht an der Spitze der scholastischen Theologie, zieht Gelehrte aus ganz Christentum an und beschleunigt die Verbreitung von Wissen und neuen Institutionen."


 cc.shadow.1.title: "Geflüster im Hof"
 cc.shadow.1.desc: "Unter dem Hochadel kursieren Gerüchte über geheime Absprachen mit benachbarten Höfen. Unsere vertrauenswürdigsten Adligen sprechen von einem bereits halb geformten Netzwerk – Agenten in fremden Räten, Korrespondenz über Hintertüren, Einfluss dort, wo unsere Armeen nicht marschieren können.\n\n'Geben Sie Ihren Segen, mein Gebieter', drängen sie, 'und wir werden unseren Schatten über ihre Domänen werfen.'"
 cc.shadow.1.a: "Formalisiere das Schattennetzwerk."
 cc.shadow.1.b: "Ablehnen. Solche Vereinbarungen laden zu Skandalen ein."

 cc.shadow.2.title: "Das Netzwerk nimmt Gestalt an"
 cc.shadow.2.desc: "Das Schattennetzwerk hat seinen Wert bewiesen. Unsere Adligen schlagen nun vor, die Vereinbarung in eine dauerhafte Institution zu überführen — einen Schattenhof, der an den Rändern der offiziellen Diplomatie agiert.\n\nDie Vorteile wären beträchtlich. Die Kosten würden von anderen getragen."
 cc.shadow.2.a: "Errichten Sie das Büro des Schattenhofs."
 cc.shadow.2.b: "Belassen Sie das Netzwerk in informeller Form – eine glaubhafte Abstreitbarkeit hat ihre Vorteile."

 cc.shadow.bureau.1.title: "Eine angebotene Marionette"
 cc.shadow.bureau.1.desc: "Unser Schattenhof hat eine Gelegenheit erkannt. Durch diskreten Druck, inszenierte Thronfolgekrisen und den stillen Rückzug konkurrierender Mäzene ist einer unserer Schattenstaaten vollständig von unserem Wohlwollen abhängig geworden. Das Büro schlägt vor, diese Abhängigkeit zu formalisieren.\n\nDas Ziel wird nicht widerstehen. Sie haben niemanden sonst, an den sie sich wenden könnten."
 cc.shadow.bureau.1.a: "Formalisiere die Marionetten-Vereinbarung."
 cc.shadow.bureau.1.b: "Behalten Sie die Schattenbeziehung bei – Diskretion ist nach wie vor vorzuziehen."

 cc.clergy.college.1.title: "Die Gelehrten suchen eine Heimat"
 cc.clergy.college.1.desc: "Nachrichten erreichen unseren Hof von einer Versammlung gelehrter Geistlicher – Astronomen, Ärzten, Naturphilosophen –, die aus den ihnen zur Verfügung stehenden Institutionen herausgewachsen sind. Sie suchen eine Heimat, in der die Wissenschaft frei von Pfarrpflichten gedeihen kann.\n\nDer Klerus hat unser Reich gesichtet und schlägt mehrere Orte unter unseren eigenen Leuten vor, an denen ein selbstverwaltetes theokratisches Kolleg gestiftet werden könnte – gebunden an unser Reich, aber frei darin, das Wissen so zu verfolgen, wie die Brüder es für richtig halten. Ein bescheidenerer Ort würde Stadtrechte erhalten, um sie angemessen unterzubringen.\n\nWelchen sollen wir stiften?"
 cc.clergy.college.1.opt1: "Stiften Sie das Kolleg in [college_loc_1.GetName]."
 cc.clergy.college.1.opt2: "Stiften Sie das Kolleg in [college_loc_2.GetName]."
 cc.clergy.college.1.opt3: "Stiften Sie das Kolleg in [college_loc_3.GetName]."
 cc.clergy.college.1.b: "Ermutigen Sie die Gelehrten, in unseren eigenen Institutionen zu bleiben."

 cc.clergy.college.2.title: "Die gelehrte Bruderschaft"
 cc.clergy.college.2.desc: "Das Gelehrtenkollegium hat sich etabliert und sein Ruf wächst bereits. In Anerkennung der Schirmherrschaft, die dies ermöglichte, haben die Brüder angeboten, ihre Entdeckungen mit unserem Hof zu teilen — ein formaler Austausch, der verspricht, unsere intellektuelle Entwicklung erheblich zu beschleunigen."
 cc.clergy.college.2.a: "Akzeptiere den wissenschaftlichen Austausch formell."
 cc.clergy.college.2.b: "Danken Sie ihnen für das Angebot, aber lehnen Sie formelle Vereinbarungen ab."

 cc.college.1.title: "Die große Disputation"
 cc.college.1.desc: "Die Meister unseres Wissenschaftskollegiums haben eine große Disputation einberufen – einen formalen Wettbewerb in Theologie und Naturphilosophie, der Gelehrte aus allen Himmelsrichtungen angezogen hat. In den Hallen wird heftig über die Natur des Himmels, die Seele und die korrekte Auslegung der heiligen Schriften gestritten.\n\nEine solche Zusammenkunft könnte eine Abhandlung hervorbringen, die über Generationen hinweg kopiert wird – aber nur, wenn die Krone bereit ist, die Arbeit der Gelehrten zu finanzieren."
 cc.college.1.a: "Sponsere die Disputation großzügig."
 cc.college.1.b: "Lassen Sie die Colleges auf eigene Kosten debattieren."

 cc.college.2.title: "Eine infrage gestellte Doktrin"
 cc.college.2.desc: "Ein brillanter junger Gelehrter des Kollegiums hat eine kühne neue Doktrin vorgelegt — eine, die antike Philosophie mit offenbartem Wissen auf eine Weise versöhnt, wie es noch nie zuvor versucht wurde. Für einige ist es eine tiefgreifende Erkenntnis; für andere eine gefährliche Häresie.\n\nDas Kollegium blickt zu uns. Unterstützen wir diese Doktrin vor der gelehrten Welt oder unterdrücken wir sie, bevor sie sich verbreitet?"
 cc.college.2.a: "Die Doktrin unterstützen."
 cc.college.2.b: "Unterdrücke es und bekräftige die Orthodoxie."

 cc.college.3.title: "Die gelehrte Synthese"
 cc.college.3.desc: "Jahre geduldigen Studiums am College haben zu einer großen Synthese geführt — einem einheitlichen Wissenskorpus, der Theologie, Medizin und Naturwissenschaften überbrückt. Die Brüder fragen, wie wir dieses Wissen nutzen wollen.\n\nSoll es frei verbreitet werden und neue Institutionen im gesamten Reich und darüber hinaus gründen — oder innerhalb der Kirche bleiben, als Schatz für das Kloster?"
 cc.college.3.a: "Die Synthese weitreichend verbreiten."
 cc.college.3.b: "Behalte es innerhalb der Kirche."

 cc.college.4.title: "Die reformierte Akademie"
 cc.college.4.desc: "Unsere Hochschule ist zu einem gefeierten Zentrum reformierter Gelehrsamkeit geworden. Wo einst die Scholastiker der alten Kirche das Feld beherrschten, führen unsere Theologen nun die Disputationen der Christenheit an und verbinden rigorose Methodik mit den Überzeugungen der Reformation.\n\nGelehrte strömen zu unseren Toren. Mit der Gunst der Krone könnte die Akademie zu einem Leuchtfeuer für die gesamte protestantische Welt werden."
 cc.college.4.a: "Setzen Sie auf die reformierte Akademie."
 cc.college.4.b: "Stiften Sie großzügig aus dem Schatz."

 cc.arts.1.title: "Die Petition der Zunftmeister"
 cc.arts.1.desc: "Die Zunftmeister unserer größten Städte sind mit einer ungewöhnlichen Petition an den Hof getreten. Sie sprechen von einem Viertel, das ausschließlich den Künsten gewidmet ist – befreit von gewöhnlichen Zunftsteuern, verwaltet durch ihren eigenen Rat und gewidmet der Produktion von Werken, die den Namen unserer Dynastie über Jahrhunderte tragen werden. Sie haben mehrere unserer eigenen Städte genannt, die reich an Kunsthandwerkern sind und in denen eine solche Kommune florieren könnte.\n\n'Gewähren Sie uns eine Charta', sagt ihr Sprecher, 'und wir werden Ihren Namen unsterblich machen.'"
 cc.arts.1.opt1: "Die Kommune in [commune_loc_1.GetName] per Charta festlegen."
 cc.arts.1.opt2: "Die Kommune in [commune_loc_2.GetName] per Charta festlegen."
 cc.arts.1.opt3: "Die Kommune in [commune_loc_3.GetName] per Charta festlegen."
 cc.arts.1.b: "Jetzt nicht. Wir behalten die Zunftmeister vorerst innerhalb unserer eigenen Mauern."
 cc.arts.1.b.tt: "Vorerst keine Kommune per Charta festlegen. Das Privileg bleibt bestehen; Ihnen wird die Wahl später eventuell erneut angeboten."

 cc.arts.2.title: "Eine Stadt der Kultur"
 cc.arts.2.desc: "Die Künstlerkommune hat sich etabliert, und die ersten unter ihrem Banner geschaffenen Werke haben beträchtliche Bewunderung hervorgerufen. Die Zunftmeister schlagen eine erste Investition vor — Mittel für den Bau ordentlicher Ateliers, Werkstätten und einer Bibliothek, die dem Unternehmen würdig ist.\n\n'Die Rendite wird den Aufwand bei weitem übersteigen', versprechen sie."
 cc.arts.2.a: "Investiere in die Einrichtungen der Kommune."
 cc.arts.2.b: "Lasst sie sich in ihrem eigenen Tempo entwickeln."

 cc.naval.1.title: "Die Admiralitäts-Petition"
 cc.naval.1.desc: "Unsere Handelsstände haben eine formelle Petition eingereicht. Sie argumentieren, dass die wachsenden maritimen Ambitionen des Reiches eine dedizierte Hafenverwaltung erfordern, und sie haben eine geeignete Stadt im Sinn. Im Austausch für eine Charta der Teilunabhängigkeit versprechen sie einen stetigen Strom ausstauschter Seeleute für unsere Flotte."
 cc.naval.1.a: "Gewähre die Marinecharta. Gründe die Marineverwaltung."
 cc.naval.1.b: "Vorerst ablehnen. Die Vereinbarung erfordert weitere Überlegungen."

 cc.naval.2.title: "Der Hafen floriert"
 cc.naval.2.desc: "Die Marineverwaltung hat ihren Wert bewiesen. Schiffe sind gut versorgt, Besatzungen sind ausgebildet und der Zustrom von Seeleuten zu unserer Flotte war stetig. Die Verwalter schlagen nun eine Erweiterung vor – ein neues Trockendock, erweiterte Lagerhäuser, verbesserte Ausbildungsplätze.\n\n'Die Investition wird sich innerhalb eines Jahrzehnts amortisieren', beharrt der Hafenmeister."
 cc.naval.2.a: "Finanziere die Erweiterung."
 cc.naval.2.b: "Die derzeitigen Einrichtungen sind ausreichend."

 cc.holy.1.title: "Gleichgläubige suchen Zuflucht"
 cc.holy.1.desc: "Eine Nachricht erreicht uns durch einen außer Atem geratenen Boten: Ein benachbarter Staat unseres Glaubens, geschwächt durch interne Streitigkeiten und bedrängt von feindlichen Nachbarn, sucht unseren Schutz. Ihr Klerus schreibt in verzweifeltem Ton und beruft sich auf unseren gemeinsamen Glauben und die Pflicht der Starken, die Schwachen zu schützen.\n\nDie strategischen Vorteile sind nicht unerheblich. Ebenso wenig das spirituelle Prestige."
 cc.holy.1.a: "Biete unseren Schutz an. Nimm sie als heiliges Protektorat auf."
 cc.holy.1.b: "Wir können uns derzeit nicht auf ausländische Verpflichtungen einlassen."

 cc.111.title: "Das Protektorat beansprucht die Früchte des Heiligen Krieges"
 cc.111.desc: "Unsere Armeen kehren aus dem heiligen Krieg zurück, und mit ihnen kommt eine Petition von [ward.GetName]. Ihr Klerus spricht in gemessenen, aber unmissverständlichen Worten: Der Krieg wurde im Namen des gemeinsamen Glaubens geführt, und die eroberten Gebiete an ihren Grenzen sind in ihren Augen die rechtmäßigen Früchte dieses Kampfes. Sie haben nicht gefordert — noch nicht. Aber die Erwartung liegt wie ein gezogenes Schwert im Raum.\n\nDas Land abzutreten bedeutet, das Band zu ehren. Es zu behalten bedeutet, zu prüfen, ob das Band hält."
 cc.111.a: "Gewähre [ward.GetName] die eroberten Gebiete an ihren Grenzen. Der Glaube wird stärker, wenn die Gläubigen das halten, was sie verteidigen."
 cc.111.b: "Diese Ländereien wurden von unseren Armeen gewonnen und werden in unserem Besitz bleiben. Unser Protektorat wird den Sieg — und unser Urteil — akzeptieren."

 cc.noble.enclave.1.title: "Ein Sitz für den Adel"
 cc.noble.enclave.1.desc: "Nachdem die Rechte der Adelsenklaven nun gewährt wurden, drängt uns der Hochadel dazu, eines unserer eigenen städtischen Domänen als selbstverwaltete Enklave anzuerkennen – ein Sitz von antikem Erbe, in dem die großen Häuser über die ihren herrschen dürfen. Ihre Verwalter haben unser Reich vermessen und bieten mehrere würdige Kandidaten unter den Städten unseres eigenen Volkes an.\n\nWelchen Sitz sollen wir zu einer Adelsenklave erheben – oder sollen wir sie noch länger warten lassen?"
 cc.noble.enclave.1.opt1: "Errichten Sie die Enklave in [enclave_loc_1.GetName]."
 cc.noble.enclave.1.opt2: "Errichten Sie die Enklave in [enclave_loc_2.GetName]."
 cc.noble.enclave.1.opt3: "Errichten Sie die Enklave in [enclave_loc_3.GetName]."
 cc.noble.enclave.1.b: "Noch nicht. Der Adel kann warten, bis wir so weit sind."
 cc.noble.enclave.1.b.tt: "Gründen Sie vorerst keine Enklave. Das Privileg bleibt bestehen; Ihnen wird die Wahl eventuell erneut angeboten."

 cc.burgher.charter.1.title: "Die besiegelte königliche Charta"
 cc.burgher.charter.1.desc: "Die Kaufmannsstände haben die königliche Charter mit Feierlichkeiten und Zeremonien empfangen. Agenten werden bereits auf ferne Kontinente entsandt, Investitionen fließen, und die ersten Berichte über ferne Handelsposten erreichen den Hof. Die Bürger betrachten dies als eine neue Ära der kommerziellen Partnerschaft mit der Krone."
 cc.burgher.charter.1.a: "Eine profitable Vereinbarung für alle Parteien."
 cc.burgher.charter.1.a.tt: "Ermöglicht die Gründung von Handelskompanien als Vasallen auf fernen Subkontinenten."

 # ============================================================
 # MILITARY ACADEMY — Subject type, advance, privilege
 # ============================================================
 military_academy: "Militärakademie"
 LEAD_military_academy: "Patron"
 AM_military_academy: "Militärakademie"
 CANCEL_military_academyTITLE: "Militärakademie auflösen"
 CANCEL_military_academy_DESC: "Entzug der Akademiecharta, Auflösung des Offizierskorps und Beendigung der formellen Ausbildungsvereinbarung. Die militärische Tradition des Reiches wird unter diesem Verlust leiden."

 military_academy_desc: "Eine $military_academy$ ist eine noble Institution, die sich der formalen Ausbildung von Offizieren aus der eigenen Kultur des Lehnsherrn widmet. Sie nimmt an keinen Kriegen teil, stellt aber einen stetigen Strom disziplinierter Kommandeure bereit, was die allgemeine militärische Effektivität des Reiches verbessert. Beschränkt auf eine Provinz; es darf nur eine existieren. Erfordert den Fortschritt $military_academy_advance$ und das Adelsprivileg der Militärakademie-Charta."

 military_academy_advance: "Militärakademie"
 military_academy_advance_desc: "Die informelle Lehre von Rittern und Kapitänen hat einer organisierten Untersuchung von Strategie, Logistik und der Kunst des Krieges gewichen. Durch die Einrichtung einer formalen Akademie innerhalb einer Adelseklave verwandelt die Krone die militärische Energie des Hochadels in institutionelle Exzellenz. Schaltet den Vasallentyp $military_academy$ und das Adelsstandsprivileg „Charter der Militärakademie“ frei."

 ep_nobles_academy_charter: "Charta der Militärakademie"
 ep_nobles_academy_charter_desc: "Der Adel übernimmt die formelle Verantwortung für die Stiftung und Aufsicht einer spezialisierten Militärakademie, die Offiziere aus der eigenen Kultur des Reiches in der Kriegskunst ausbildet, im Austausch für die Anerkennung ihres kriegerischen Erbes."

 crown_dependency_conversion_tt: "Konvertierung nicht möglich — entweder wurde der Unionspartner vor kurzem konvertiert oder er erfüllt nicht die Größenanforderungen für dieses Zeitalter."

 # ============================================================
 # MILITARY ACADEMY EVENTS (cc.190–cc.193)
 # ============================================================
 cc.academy.0.title: "Die Akademie-Charta wurde gewährt"
 cc.academy.0.desc: "Unsere Adelsstände haben die Charta der Militärakademie mit großer Begeisterung aufgenommen. Die besten Sprossen ritterlicher Familien versammeln sich bereits in der vorgesehenen Provinz, begierig darauf zu beweisen, dass das Zeitalter der undisziplinierten Kriegsführung vorbei ist. Der formalisierte Unterricht in Taktik, Logistik und der Kunst des Kommandierens beginnt sofort."
 cc.academy.0.a: "Ein verheißungsvoller Beginn."

 cc.academy.1.title: "Überprüfung des Offizierskorps"
 cc.academy.1.desc: "Die Akademie hat ihren neuesten Abschlussjahrgang für die königliche Inspektion vorbereitet. Die jungen Offiziere stehen in präziser Formation – Kavalleriekommandanten, Infanteriekapitäne, Belagerungsingenieure – und ihr Sprecher tritt mit einer Petition vor. Sie haben ihre Disziplin bewiesen; nun wollen sie ihren Mut im Dienste einer greifbaren Sache unter Beweis stellen.\n\n'Gewährt uns eine Provinz zur Verteidigung, mein Gebieter, und wir werden sie in eine Festung verwandeln.'"
 cc.academy.1.a: "Versprich den herausragendsten Offizieren territoriale Belohnungen."
 cc.academy.1.b: "Ehre die Überprüfung, aber gehe keine Verpflichtungen ein."

 cc.academy.2.title: "Militärübungen"
 cc.academy.2.desc: "Der Kommandant der Akademie bittet um die Erlaubnis, großangelegte Manöver durchzuführen – Infanterieformationen, die auf simuliertem Gelände gegeneinander drillen, Kavallerie, die koordinierte Angriffe übt, und Artillerieingenieure, die Trajektorien berechnen. Die Kosten für Munition, Futter und Feldbefestigungen sind nicht gering.\n\nDer Nutzen für den Zusammenhalt und die Moral unseres Heeres könnte beträchtlich sein."
 cc.academy.2.a: "Finanziere die Übungen vollständig."
 cc.academy.2.b: "Beobachten Sie die Übungen, ohne sie zu sponsern."

 cc.academy.3.title: "Geflüster am Hof"
 cc.academy.3.desc: "Beunruhigende Gerüchte sind an unser Ohr gedrungen: Bestimmte adlige Offiziere an der Akademie sollen sich privat treffen, ihre Gespräche seien vorsichtig und ihre Blicke kalkulierend. Einige sagen, sie diskutieren über Beförderungslisten; andere vermuten weitreichendere Ambitionen.\n\nEine vertrauliche Untersuchung könnte die Angelegenheit klären – oder uns Vorwürfen des Misstrauens gegenüber genau jener Klasse aussetzen, die wir gefördert haben."
 cc.academy.3.a: "Untersuchen Sie die Gerüchte diskret."
 cc.academy.3.b: "Die Gerüchte abtun. Vertrauen wird nicht ohne Risiko geschenkt."

 # ============================================================
 # ELITE ENCLAVE EVENTS (cc.160, cc.162, cc.163, cc.164, cc.194)
 # ============================================================
 cc.enclave.court.title: "Der Adel konkurriert um Hofämter"
 cc.enclave.court.desc: "Die Enklave ist zu einem Zentrum des adligen gesellschaftlichen Lebens geworden, und damit ein erbitterter Wettbewerb um die begrenzten Positionen, die unser Hof anbieten kann – Haushaltsoffiziere, Kammersherren, Zeremonienmeister. Der Hochadel drängt auf Ernennungen, wohl wissend, dass eine Position am Hof eine Adelsfamilie weitaus stärker an die Krone bindet als jeder Eid allein.\n\nWir können diesen Appetit nutzen."
 cc.enclave.court.a: "Gewähre Hofpositionen an die führenden Adelsfamilien."
 cc.enclave.court.c: "Setze sie zu einer großen Kavallerie-Mustrierung an – lass sie die Pferde des Reiches drillen."
 cc.enclave.court.b: "Behalte Positionen unter direkter königlicher Ernennung – vermeide die Übernahme unseres Hofes durch den Adel."

 cc.enclave.patronage.title: "Das kulturelle Mäzenatentum des Enklavenherrn"
 cc.enclave.patronage.desc: "Die Meister der Enklave haben sich an ein ehrgeiziges Werk gewagt – eine große Halle, ein Zyklus von Fresken, eine Bibliothek, die jede im Reich übertrifft – und sie sind zu uns gekommen, um Patronage zu erbitten. Der Adel der Enklave ist ebenso stolz auf seine Bildung wie auf seine Abstammung, und eine großzügige Geste wird hier lange in Erinnerung bleiben.\n\nOder wir könnten schlichtweg die fähigsten Köpfe in unsere eigene Hauptstadt locken."
 cc.enclave.patronage.a: "Finanzieren Sie die Arbeit. Lassen Sie den Ruhm der Enklave der Krone zugutekommen."
 cc.enclave.patronage.b: "Berufe stattdessen ihre Besten in unsere Hauptstadt. Ihre Gaben gehören ins Zentrum."

 cc.enclave.tournament.title: "Das große Turnier"
 cc.enclave.tournament.desc: "Die Enklave schlägt vor, ein großes Turnier auszurichten – eine Versammlung des berittenen Adels des Reiches, um Lanze und Säbel zu prüfen, die Krone zu ehren und in freundschaftlichem Kampf die endlose Frage zu klären, wer unter den großen Häusern die besten Ritter aufstellt. Ein solches Spektakel schärft die Kavallerie, die der Stolz unseres Adels ist, und daraus könnte ein wahrer Champion hervorgehen, um unsere Armeen zu führen.\n\nDie Kosten für die Preise und Pavillons wären nicht gering."
 cc.enclave.tournament.a: "Veranstalte es in Pracht. Lass unsere Ritter ihren Wert beweisen — und finde uns einen Champion."
 cc.enclave.tournament.b: "Ablehnen. Wir haben keine Münzen, die wir für adelige Prachtentfaltung ausgeben können."

 cc.enclave.feud.title: "Eine Adelsfehde"
 cc.enclave.feud.desc: "Zwei der führenden Häuser der Enklave sind in einen erbitterten Streit verfallen. Was als Disput über Rangfolge und Heirat begann, ist zu offener Feindseligkeit gereift, wobei Diener auf den Straßen prügeln und jede Seite uns anfleht, Partei zu ergreifen. Wenn man eine solche Fehde vor sich hin vegetieren lässt, kann sie die Loyalität des gesamten Adels vergiften; geschickt gehandhabt ist sie eine Chance, als Schiedsrichter aufzutreten und beide Häuser an unser Urteil zu binden.\n\nWir könnten intervenieren – oder sie sich gegenseitig erschöpfen lassen."
 cc.enclave.feud.a: "Vermitteln Sie im Streitfall. Geben Sie aus, was nötig ist, um einen dauerhaften Frieden zu schließen."
 cc.enclave.feud.b: "Lassen wir sie es unter sich ausmachen. Die Ehre wird ihren eigenen Weg finden."

 cc.enclave.established.title: "Die Enklave ist etabliert"
 cc.enclave.established.desc: "Zum ersten Mal regiert sich ein Gebiet gemeinsamer Kultur und alten Erbes als anerkannte Enklave unter unserem Schutz selbst – sein Rat ist bestellt, seine Traditionen gesichert, seine Loyalität geschworen. Der hohe Adel blickt mit stiller Genugtuung darauf, und das Reich gewinnt ein Juwel der Kultiviertheit und des Prestiges.\n\nWie sollen wir diesen Anlass feiern?"
 cc.enclave.established.a: "Eine prächtige Investitur – es soll an nichts gespart werden, um die neue Enklave zu ehren."
 cc.enclave.established.b: "Eine stille Anerkennung — Würde bedarf keiner Extravaganz."

 # ============================================================
 # HOLY PROTECTORATE EVENTS (cc.195–cc.196)
 # ============================================================
 cc.holy_prot.1.title: "Der Glaube unter Bedrohung"
 cc.holy_prot.1.desc: "Unser heiliges Protektorat [ward.getName] ist in Gefahr. Benachbarte Mächte — feindselig gegenüber dem gemeinsamen Glauben, der uns bindet — haben gegen seine Grenzen gedrückt, seinen Klerus schikaniert und Häresie unter der Bevölkerung geschürt. Unsere Brüder schreiben in dringlichen Worten und berufen sich auf unser Schutzversprechen.\n\nZu handeln ist kostspielig. Sie im Stich zu lassen, hieße, als gläubigkeitsloser Beschützer gesehen zu werden."
 cc.holy_prot.1.a: "Entsende Truppen und Ressourcen, um unsere Gleichreligiösen zu verteidigen."
 cc.holy_prot.1.b: "Biete Gebete und diplomatische Rügen an, aber keine materiellen Zusagen."
 cc.holy_prot.1.c: "Die Zeit der Verteidigung ist vorbei. Beginne einen heiligen Krieg gegen [threat.GetName]."

 cc.holy_prot.frontier.title: "Stimmen jenseits der Grenze"
 cc.holy_prot.frontier.desc: "Die Grenzen unseres heiligen Protektorats [ward.GetName] sind belebt durch die Bewegung des Glaubens. Glaubensgenossen in den Nachbarländern blicken mit vorsichtiger Hoffnung zu uns, während die Herren anderer Glaubensrichtungen von jenseits der Grenze mit einer Wachsamkeit zusehen, die zu Feindseligkeit aushärten oder zu Verständigung erweichen könnte.\n\nWie wir diese Grenzbeziehungen verwalten, wird das spirituelle Klima der gesamten Region prägen."
 cc.holy_prot.frontier.a: "Entsende Gesandte an unsere gleichreligiösen Nachbarn. Lass sie wissen, dass sie in ihrem Glauben nicht allein sind."
 cc.holy_prot.frontier.b: "Öffne die Grenze für religiösen Diskurs. Verständnis kann aufbauen, was der Glaube allein nicht vermag."
 cc.holy_prot.frontier.c: "Befestige die Grenze der Gläubigen. Heidnische Nachbarn sollten wissen, wo wir stehen."
 cc.holy_prot.frontier.d: "Dies sind die Grenzangelegenheiten des Mündels selbst. Lassen wir sie ihre Nachbarn verwalten."

 # ============================================================
 # HOLY PROTECTORATE PERIODIC EVENTS (cc.229–cc.231)
 # ============================================================
 cc.holy_prot.papacy.title: "Der Heilige Stuhl nimmt es zur Kenntnis"
 cc.holy_prot.papacy.desc: "Die Nachricht hat Rom erreicht. Die Vertreter des Papstes haben uns mitgeteilt, dass er unser heiliges Protektorat über [ward.GetName] zur Kenntnis genommen hat – eine Regelung, die für unsere Frömmigkeit und unsere Verbundenheit zum Glauben spricht. Der Heilige Stuhl ist in seiner Aufmerksamkeit nicht untätig, und wir können gestalten, was daraus folgt.\n\nDies ist ein Moment pastoraler Diplomatie. Was wir daraus machen, wird unsere Beziehung zur höchsten Autorität der Kirche definieren."
 cc.holy_prot.papacy.a: "Erflehe den päpstlichen Schutz für unseren Schützling. Lass den Heiligen Stuhl ihn formell schützen."
 cc.holy_prot.papacy.b: "Fordert die Entsendung eines päpstlichen Legaten – eines gelehrten Klerikers aus Rom, der in unseren Landen dienen soll."
 cc.holy_prot.papacy.c: "Nimm die Anerkennung dankbar an. Die Aufmerksamkeit des Papstes ist bereits ein Segen."

 cc.holy_prot.shepherd.title: "Ein Hirte für die Herde"
 cc.holy_prot.shepherd.desc: "Unser heiliges Protektorat [ward.GetName] benötigt spirituelle oder militärische Führung. Ob es sich um eine Frage des Glaubens handelt, die einer stetigen Hand bedarf, oder um die Grenzverteidigung, die eine erfahrene Führung benötigt – der Bedarf ist real.\n\nWir sind gut positioniert, um zu helfen — oder um davon zu profitieren. Die Entscheidung, was wir tun, erfordert Klarheit darüber, was wir am meisten schätzen."
 cc.holy_prot.shepherd.a: "Entsende unseren gelehrten Ratgeber, um den Klerus des Mündels zu führen. Der Glaube ist das Opfer wert."
 cc.holy_prot.shepherd.b: "Versetze den Kommandanten des Bezirks, um in unseren Feldzügen zu dienen. Ihre Talente sind dort verschwendet."
 cc.holy_prot.shepherd.c: "Finanziere die Ausbildung eines neuen Theologen für den Bezirk. Unsere Schatzkammer kann dies tragen."
 cc.holy_prot.shepherd.d: "Das geistliche Leben des Schützlings ist seine eigene Angelegenheit. Wir werden nicht eingreifen."

 cc.holy_prot.preacher.title: "Der wandernde Prediger"
 cc.holy_prot.preacher.desc: "Ein charismatischer Prediger ist in den Territorien unseres heiligen Protektorats [ward.GetName] aufgetaucht und zieht mit Predigten von ungewöhnlichem Eifer riesige Menschenmengen an. Er spricht von Erneuerung, von der Ausbreitung des Glaubens und von einem göttlichen Ruf zum Handeln, auf den die gewöhnliche Frömmigkeit zu bequem geworden ist, um zu antworten.\n\nSeine Worte bewegen die Bevölkerung. Ob dieses Feuer zum Guten oder Schlechten brennt, hängt nicht zuletzt von der Führung ab, die wir bieten."
 cc.holy_prot.preacher.a: "Unterstützen Sie den Prediger und senden Sie ihn auf eine Mission ins Ausland. Lassen Sie seinen Eifer über die Grenzen des Bezirks hinausreichen."
 cc.holy_prot.preacher.b: "Die Anhängerschaft des Predigers auf unsere eigene Grenzmission lenken. Ihre Energie ist uns nützlich."
 cc.holy_prot.preacher.c: "Lassen Sie den Prediger zur Beurteilung vor die Kirchenbehörden führen. Die Orthodoxie muss bewahrt werden."
 cc.holy_prot.preacher.d: "Ignoriere die Angelegenheit. Volkstümliche Begeisterung steigt und fällt unabhängig von unserem Handeln."

 # ============================================================
 # ARTISTS' COMMUNE EVENTS (cc.197–cc.199)
 # ============================================================
 cc.artists.1.title: "Der Auftrag des Maestros"
 cc.artists.1.desc: "Ein renommierter Künstler der Kommune hat einen Auftrag von außergewöhnlichem Ehrgeiz vorgeschlagen: ein Zyklus von Werken, die das kulturelle Erbe unserer Dynastie für Generationen definieren werden. Allein die Materialien würden ein Vermögen kosten, und das Projekt würde die besten Talente der Kommune jahrelang beanspruchen.\n\n'Es wird es wert sein', verspricht er mit der gelassenen Zuversicht derer, die das Geld anderer ausgeben."
 cc.artists.1.a: "Finanziere die Kommission. Lass sie etwas Unsterbliches schaffen."
 cc.artists.1.b: "Ablehnen. Die Kommune kann Gönner innerhalb ihrer eigenen Mauern finden."

 cc.artists.2.title: "Künstlerische Rivalität"
 cc.artists.2.desc: "Innerhalb der Kommune sind zwei rivalisierende Schulen künstlerischen Denkens entstanden, von denen jede behauptet, die wahre Richtung unseres Mäzenatentums zu repräsentieren. Die Klassizisten bevorzugen studierte Eleganz; die Naturalisten fordern eine rohe Darstellung des Lebens, wie es ist. Jede Schule bringt Meisterwerke hervor. Jede Schule verachtet die andere.\n\nSie haben den Streit vor uns gebracht."
 cc.artists.2.a: "Wähle eine bevorzugte Schule. Die andere muss sich anpassen oder weichen."
 cc.artists.2.b: "Lassen Sie den Wettbewerb laufen. Großartige Werke entstehen aus großer Rivalität."

 cc.artists.3.title: "Kultureller Export"
 cc.artists.3.desc: "Die Kunde von unserer Künstlerkommune hat unsere Grenzen überschritten. Ein ausländischer Hof hat seine Bewunderung für ihre Werke geäußert und angefragt, ob Exemplare erworben oder im Ausland ausgestellt werden könnten.\n\nDie Kommune ist gespalten: Einige sehen darin eine Gelegenheit, das Prestige des Reiches weiterzutragen, als unsere Armeen es könnten. Andere befürchten, dass das, was unsere Grenzen verlässt, unsere Rivalen ebenso sehr bereichert wie uns selbst."
 cc.artists.3.a: "Fördern Sie den Export. Unsere Kultur sollte sich frei verbreiten."
 cc.artists.3.b: "Behalte die feinsten Werke im eigenen Land. Kulturelles Prestige ist eine Ressource, die gehortet werden muss."

 # ============================================================
 # PALATINATE EVENTS (cc.161, cc.165, cc.210, cc.211, cc.213, cc.214, cc.215)
 # ============================================================
 cc.palatinate.recognition.title: "Die Pfalz fordert Anerkennung"
 cc.palatinate.recognition.desc: "Der Pfalzgraf hat eine formelle Delegation entsandt. Die Botschaft ist höflich, aber unmissverständlich: Da er jahrelang als prestigeträchtigster kultureller Partner unseres Reiches diente, erwartet die Pfalz eine formelle Anerkennung ihres dynastischen Ranges — die Anerkennung, dass die Linie des Grafen nicht bloß ein untergeordnetes Haus ist, sondern eines, das an der Würde unserer Dynastie teilhat.\n\nDies zu gewähren bedeutet, sie enger an uns zu binden. Es abzulehnen bedeutet, sie an den Abgrund zwischen uns zu erinnern."
 cc.palatinate.recognition.a: "Gewähre formale dynastische Anerkennung. Lasse ihre Würde anerkannt werden."
 cc.palatinate.recognition.b: "Ablehnen. Anerkennung impliziert Verpflichtungen, die wir nicht einzugehen bereit sind."
 cc.palatinate.recognition.c: "Können wir keinen Kompromiss finden?"

 cc.palatinate.dynastic.title: "Eine Frage der Dynastie"
 cc.palatinate.dynastic.desc: "Der Pfalzgraf ersucht um eine noch tiefere Verbindung — eine Heirat in unser Haus, eine Quartierung der Wappen, einen Platz für seine Linie in den äußeren Bereichen der Thronfolge. Dies zu gewähren bedeutet, die Pfalz dauerhaft in die Würde unserer Dynastie einzuweben, ein Band aus Prestige und Legitimität, das jede einzelne Regierungszeit überdauern wird. Es abzulehnen bedeutet, ein stolzes und mächtiges Haus zu kränken.\n\nDer Graf harrt unseres Wortes, und er wartet nicht geduldig."
 cc.palatinate.dynastic.a: "Gewähre die dynastische Verbindung. Lass sein Blut mit der Ehre unseres Hauses verschmelzen."
 cc.palatinate.dynastic.b: "Ablehnen. Die Würde unserer Dynastie ist kein Privileg, das man teilt."

 cc.palatinate.tournament.title: "Das Turnier der Pfalz"
 cc.palatinate.tournament.desc: "Der Pfalzgraf hat ein großes Turnier angekündigt — Ritter aus dem ganzen Reich und darüber hinaus sind eingeladen, in unserem Namen zu wetteifern; die feinsten Kunsthandwerker wurden beauftragt, die Pavillons zu schmücken, und es wird Festmähler geben, über die man noch eine Generation lang sprechen wird. Der Graf stellt seine eigenen Hausritter auf, und aus einem solchen Feld könnte ein beispielloser Kommandant hervorgehen. Er bittet um unsere persönliche Anwesenheit und einen Beitrag zum Preisgeld.\n\nEin solches Spektakel schafft Prestige, das jede einzelne Schlacht überdauert."
 cc.palatinate.tournament.a: "Besuchen Sie das Turnier und sponsern Sie es großzügig."
 cc.palatinate.tournament.b: "Eine Delegation entsenden, um die Krone zu repräsentieren."

 cc.palatinate.levy.title: "Die Pfalz folgt dem Ruf"
 cc.palatinate.levy.desc: "Der Pfalzgraf bietet an, seine Banner zu hissen — das gesamte Adelsaufgebot der Pfalz, Eskadronen gepanzerter Reiter unter Männern, die den Sattel seit ihrer Kindheit kennen. Es ist ein beeindruckender Beweis der Loyalität, und die Kavallerie, die er aufbieten kann, würde jede unserer Armeen verstärken. Doch seine Gefolgsleute anzufordern bedeutet, anzuerkennen, wie weit seine Autonomie bereits reicht, und der Graf wird erwarten, dass man sich an seinen Dienst erinnert.\n\nOder wir lassen seine Ritter zu Hause und halten die Leine kurz."
 cc.palatinate.levy.a: "Rufen Sie die Adelskavallerie zusammen. Lassen Sie die Pferde des Reiches in den Krieg ziehen."
 cc.palatinate.levy.b: "Schonen Sie seine Gefolgsleute. Wir achten die Autonomie des Grafen — und gewinnen sein Wohlwollen."

 cc.palatinate.overreach.title: "Der Pfalzgraf übergeht seine Kompetenzen"
 cc.palatinate.overreach.desc: "Berichte erreichen uns, dass der Pfalzgraf sich in allem außer dem Namen als Fürst bezeichnet hat – er prägte seine eigene Münze, hielt einen Hof, der den unseren nachahmte, und empfing ausländische Gesandte, als wäre er ein souveräner Herrscher. Es ist die ewige Gefahr der Pfalz: eine Ehre, die so groß ist, dass sie Ambitionen weckt. Einige am Hof drängen uns, ihm diesen Luxus zu gönnen, da sein Prestige auf die Krone zurückstrahlt; andere fordern, dass man ihn scharf an seinen Platz erinnert.\n\nWenn solche Ansprüche völlig ungeprüft bleiben, ist bekannt, dass dies in einer offenen Fehde enden kann."
 cc.palatinate.overreach.a: "Gönnen Sie ihm seine Allüren. Seine Pracht ist unsere Pracht."
 cc.palatinate.overreach.b: "Zügeln Sie ihn ein. Er wird sich daran erinnern, wer hier der Herr ist."
 cc.palatinate.overreach.c: "Sehen wir weg. Lassen wir die Sache ihren Lauf nehmen."

 cc.palatinate.neighbor.title: "Die Pfalz provoziert einen Nachbarn"
 cc.palatinate.neighbor.desc: "Der Pfalzgraf hat seine Grenzen gegenüber [provoked_neighbor.GetName] überschritten — er überfällt deren Grenzlande, bietet ihren Gesetzlosen Unterschlupf und posaunt einen alten Familienanspruch auf Ländereien jenseits der Grenze heraus. Deren Gesandte treffen voller Zorn ein und fordern, dass wir unseren Vasallen zügeln. Doch der Graf ist unbelehrbar: Er beharrt darauf, dass die Ehre des Reiches auf dem Spiel stehe und er sie mit unserer Unterstützung gänzlich demütigen könne.\n\nEin zu mächtiger Pfalzgraf hat die Angewohnheit, seine Streitigkeiten zu unseren eigenen zu machen."
 cc.palatinate.neighbor.a: "Den Grafen unterstützen. Lassen Sie seinen Streit mit [provoked_neighbor.GetName] zu unserem Krieg werden."
 cc.palatinate.neighbor.b: "Zügelt ihn. Wir werden uns nicht in einen Grenzstreit hineinziehen lassen."
 cc.palatinate.neighbor.c: "Kauf ihn aus. Lenke seine Energien um, bevor sie uns einen Krieg kosten."

 cc.palatinate.elevated.title: "Die Erhebung der Pfalz"
 cc.palatinate.elevated.desc: "Zum ersten Mal wurde eine Enklave unseres Reiches zu einer Pfalz erhoben – ihrem Grafen wurde nahezu königliche Autorität gewährt, das Recht, Truppen auszuheben, einen eigenen Hof zu halten und unter eigenem Banner in den Krieg zu ziehen. Es ist die höchste Ehre, die ein adliges Gebiet besitzen kann, und das damit verbundene Prestige strahlt auf die gesamte Dynastie aus. Der Graf kniet nieder, um seine Erhebung entgegenzunehmen; wie prächtig wir dies feiern, liegt an uns.\n\nEine prächtige Zeremonie würde der ganzen Welt die Würde unseres Hauses verkünden."
 cc.palatinate.elevated.a: "Eine prächtige Erhebung – und der Graf soll seine besten Ritter zu unseren Ehren aufbieten."
 cc.palatinate.elevated.b: "Eine würdevolle, bescheidene Zeremonie. Die Ehre spricht für sich selbst."

 # ============================================================
 # PROTECTORATE MARCH UPGRADE EVENT (cc.212)
 # ============================================================
 cc.protectorate.march.1.title: "Ein Protektorat schlägt formelle Treue vor"
 cc.protectorate.march.1.desc: "Der Gesandte des Protektorats trifft mit einem unerwarteten Vorschlag ein. Über Jahre gemeinsamer Interessen ist der informelle Schutz, den wir gewährt haben, zu etwas Tieferem herangewachsen — einer echten Übereinstimmung von Interessen und Identität. Ihre Führung schlägt nun vor, die Beziehung vollständig umzugestalten.\n\n'Gewähren Sie uns den Status eines Grenzmarkgrafentums', sagen sie, 'und wir werden Ihre Grenze mit unserem Leben verteidigen.'"
 cc.protectorate.march.1.a: "Akzeptieren. Formalisiere sie als Militärgrenzmark."
 cc.protectorate.march.1.b: "Ablehnen. Die derzeitige Regelung dient uns gut genug."

 # ============================================================
 # NEW MODIFIER NAMES
 # ============================================================
 cc_academy_exercises: "Militärische Übungen der Akademie"
 cc_academy_exercises_desc: "Eine Runde strenger militärischer Übungen, finanziert durch die Krone, hat die Disziplin und Moral unserer Streitkräfte geschärft."

 cc_court_intrigue_scandal: "Skandal durch Hofintrigen"
 cc_court_intrigue_scandal_desc: "Eine Untersuchung von Gerüchten an der Akademie verlief schlecht — Vorwürfe der Unzulänglichkeit haben den Ruf der Krone unter den Adelsständen beschädigt."

 cc_enclave_court_favour: "Adlige Gunst am Hof"
 cc_enclave_court_favour_desc: "Die Vergabe von Hofämtern an die führenden Familien der adligen Enklave hat deren Ambitionen gestillt und sie gleichzeitig näher in den Orbit der Krone gezogen."

 cc_palatinate_tournament: "Pfalzturnier"
 cc_palatinate_tournament_desc: "Ein prächtiges Turnier, das unter der Schirmherrschaft des Pfalzgrafen und der Krone stattfand, hat das dynastische Prestige und den kulturellen Einfluss im gesamten Reich gesteigert."

 STATIC_MODIFIER_NAME_cc_holy_protectorate_defense: "Heilige Verteidigung"
 cc_holy_protectorate_defense: "Heilige Verteidigung"
 cc_holy_protectorate_defense_desc: "Die Verteidigung des heiligen Protektorats durch unsere Truppen gegen religiösen Druck hat die Moral unserer Soldaten neu belebt und die Dankbarkeit unserer Glaubensgenossen gesichert."
 STATIC_MODIFIER_NAME_cc_holy_prot_spiritual_neglect: "Glaubensloser Beschützer"
 cc_holy_prot_spiritual_neglect: "Glaubensloser Beschützer"
 cc_holy_prot_spiritual_neglect_desc: "Es hat sich herumgesprochen, dass wir nur Gebete anboten, als unser heiliges Protektorat materielle Hilfe benötigte. Die Gläubigen hinterfragen unsere Hingabe, und unsere spirituelle Autorität schwindet."
 STATIC_MODIFIER_NAME_cc_holy_prot_frontier_accord: "Grenzlandabkommen"
 cc_holy_prot_frontier_accord: "Grenzlandabkommen"
 cc_holy_prot_frontier_accord_desc: "Unsere Bereitschaft, über religiöse Grenzen hinweg im Namen unseres heiligen Protektorats zu sprechen, hat uns unter den benachbarten Mächten einen Ruf für besonnenes Staatsmännischkeits-Handeln eingebracht."
 STATIC_MODIFIER_NAME_cc_holy_prot_border_faith: "Grenze der Gläubigen"
 cc_holy_prot_border_faith: "Grenze der Gläubigen"
 cc_holy_prot_border_faith_desc: "Die feste Haltung des Lehnsherrn gegenüber heidnischen Nachbarn hat die Grenzgarnisonen des Schützlings gestärkt und den Glauben seiner Soldaten neu belebt."
 STATIC_MODIFIER_NAME_cc_holy_prot_papal_mandate: "Papstliches Mandat"
 cc_holy_prot_papal_mandate: "Papstliches Mandat"
 cc_holy_prot_papal_mandate_desc: "Der Heilige Stuhl hat den Status dieses Staates unter der geistlichen Autorität seines Beschützers formell anerkannt. Der Segen des Papstes hat die Entschlossenheit des Schützlings gestärkt und neue Seelen für den Glauben geöffnet."
 STATIC_MODIFIER_NAME_cc_holy_prot_sponsored_scholar: "Geförderter Gelehrter"
 cc_holy_prot_sponsored_scholar: "Geförderter Gelehrter"
 cc_holy_prot_sponsored_scholar_desc: "Ein gelehrter Theologe, der vom Lehnsherrn entsandt oder finanziert wurde, hat innerhalb des Schutzbefohlenen eine Schule für religiöse Unterweisung eingerichtet, was die Konversion beschleunigt und dem Klerus neue Kraft verleiht."
 STATIC_MODIFIER_NAME_cc_holy_prot_zealous_mission: "Eifrige Mission"
 cc_holy_prot_zealous_mission: "Eifrige Mission"
 cc_holy_prot_zealous_mission_desc: "Der wandernde Prediger, unterstützt vom Lehnsherrn, ist auf einer Mission über die Grenzen des Schutzbefohlenen hinaus aufgebrochen – seine Predigten ziehen neue Seelen zum Glauben und bringen spirituellen Ruhm in das Territorium des Schutzbefohlenen."

