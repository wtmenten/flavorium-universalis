 # ============================================================
 # PROTECTORATE / HOLY PROTECTORATE EVOLUTION EVENTS (cc.220–cc.226)
 # ============================================================

 # cc.220 — A Ward No Longer
 cc.ward_no_longer.title: "Kein Mündel mehr"
 cc.ward_no_longer.desc.holy: "[ward.GetName] stand lange unter dem Mantel unseres heiligen Schutzes — ein Schutzbefohlener des Glaubens, bewacht und geführt über Jahrzehnte gemeinsamen Strebens. Doch die Welt hat sich verändert, und damit auch unser Band. Ihr Gesandter kommt nicht aus Bedürftigkeit, sondern mit stiller Zuversicht.\n\n'Wir sind dankbar für alles, was ihr uns gegeben habt', sagen sie, 'aber wir sind bereit, an eurer Seite zu stehen, statt unter euch.'"
 cc.ward_no_longer.desc.prot: "[ward.GetName] hat sich lange auf unseren informellen Schutz verlassen — eine komfortable Vereinbarung, die beiden Parteien in ruhigeren Zeiten diente. Doch die Jahre sind vergangen, und etwas hat sich verschoben. Ihr Gesandter kommt nicht als Bittsteller, sondern als Gleichgestellter.\n\n'Die Vereinbarung hat uns gut gedient', sagen sie, 'aber vielleicht ist es an der Zeit anzuerkennen, was wir wirklich geworden sind.'"
 cc.ward_no_longer.a: "Begrüßen wir den Übergang. Sie haben ihn sich verdient."
 cc.ward_no_longer.a_cruel: "Absorbieren sie per Dekret. Sie dienen uns, nicht umgekehrt."
 cc.ward_no_longer.a_zealot: "Erfülle die heilige Verpflichtung. Die heilige Aufgabe ist erfüllt."
 cc.ward_no_longer.a_master: "Ein meisterhafter Übergang – unser Minister sorgt dafür, dass die Zeremonie außergewöhnlich wird."
 cc.ward_no_longer.a_integration: "Eine integrierte Zukunft — unser Minister schafft den Rahmen für eine dauerhafte Partnerschaft."
 cc.ward_no_longer.b: "Die Zeit ist noch nicht reif. Lassen wir die Beziehung weiter vertiefen."
 cc.ward_no_longer.c: "Ablehnen. Die derzeitige Regelung dient uns noch immer."
 cc.ward_no_longer.c_demand_release: "Die Forderung akzeptieren. Lassen Sie sie frei."
 cc.ward_no_longer.c_demand_refuse: "Absolut ablehnen. Wir lassen uns nichts diktieren."
 cc.ward_no_longer.d_honor: "Lassen Sie sie mit allen Ehren ziehen. Die Geschichte möge dies wohlbewahren."
 cc.ward_no_longer.d_embarrass: "Lassen Sie sie frei. Die Vereinbarung ist beendet."

 # cc.221 — An Emboldened Ward
 cc.emboldened_ward.title: "Ein bemutbarter Schützling"
 cc.emboldened_ward.desc: "Nachrichten erreichen uns, dass [ward.GetName] zu weit gegangen ist. Ihre Beamten haben sich in einem feindseligen Austausch mit [rival.GetName] verwickelt – Anschuldigungen, Forderungen und Provokationen, die den Hof des Nachbarn erzürnt haben.\n\nDie Angelegenheit liegt nun in unserem Schoß. [rival.GetName] wird dies nicht vergessen. Wie wir reagieren, wird unseren Ruf und die Art unseres Schutzes definieren."
 cc.emboldened_ward.a: "Entsende Gesandte. Wir werden dies diskret bereinigen."
 cc.emboldened_ward.a_master: "Eine meisterhafte Vermittlung – unser Minister verwandelt den Vorfall in eine Demonstration unserer gelassenen Autorität."
 cc.emboldened_ward.a_peace: "Ein stiller Entschluss — unser Berater findet eine gemeinsame Basis, bevor die Angelegenheit eskaliert."
 cc.emboldened_ward.b: "Bleib standhaft. Wir unterstützen unseren Schützling voll und ganz."
 cc.emboldened_ward.c: "Einen Schritt zurücktreten. Dies ist nicht unser Kampf."

 # cc.222 — The Rival Makes Their Move
 cc.rival_moves.title: "Der Rivale macht seinen Zug"
 cc.rival_moves.desc: "[rival.GetName] hat die Geduld verloren. Anstatt die Kränkung zu akzeptieren, haben sie [ward.GetName] den Krieg erklärt. Unser Schutzbefohlene ist unter Angriff, und die Welt schaut zu.\n\nWir haben sie unterstützt. Wir müssen entscheiden, was diese Unterstützung wirklich wert ist."
 cc.rival_moves.b1: "Wir kämpfen. Erklärt [rival.GetName] zum Schutz unseres Schützlings den Krieg."
 cc.rival_moves.b1_force: "Machtdemonstration. Unsere Armee wird diese Aggression zum Exempel machen."
 cc.rival_moves.b1_sacred: "Heilige Pflicht. Wir schließen uns als Verteidiger des Glaubens an."
 cc.rival_moves.b2: "Wir können uns diesem Krieg nicht verschreiben. Gebt das Protektorat auf."

 # cc.223 — Ward Abandoned to Their Fate
 cc.ward_abandoned.title: "Schützling seinem Schicksal überlassen"
 cc.ward_abandoned.desc: "[rival.GetName] hat [ward.GetName] den Krieg erklärt. Wir traten zurück, und die Welt hat es bemerkt. Unser Protektorat steht dem allein gegenüber.\n\nDie Nachricht wird sich verbreiten."
 cc.ward_abandoned.a: "Ein schwieriger Tag. Hoffen wir, dass die Folgen begrenzt bleiben."

 # cc.224 — The Ward's Own Ambitions
 cc.ward_ambitions.title: "Die eigenen Ambitionen des Mündels"
 cc.ward_ambitions.desc: "[ward.GetName] ist zu einer bedeutenden Macht herangewachsen. Ihr Territorium hat sich ausgedehnt, ihre Schatzkammer ist voll, und ihr Volk hat einen Stolz entwickelt, dem die alte informelle Vereinbarung nicht mehr ganz gerecht wird.\n\nIhr Gesandter trifft ein — nicht mit Bitten, sondern mit Forderungen. Sie wollen eine definierte Beziehung. Zu ihren Bedingungen."
 cc.ward_ambitions.a: "Gewähre ihnen den Status eines Klientenstaates. Anerkenne ihr Wachstum."
 cc.ward_ambitions.b: "Biete stattdessen den Vasallenstatus an. Sie werden eine Definition erhalten, aber zu unseren Bedingungen."
 cc.ward_ambitions.b_minister: "Eine subtile Vereinbarung – unser Minister sorgt dafür, dass sie die engere Bindung als Belohnung ansehen."
 cc.ward_ambitions.c: "Lehnen Sie die Anfrage ab. Sie stehen unter unserem Schutz, und das ist ausreichend."
 cc.ward_ambitions.c_war: "Ihnen wurde zu oft abgesagt. Nun nehmen sie sich ihre Freiheit mit Gewalt."

 # cc.225 — The Faith Grows Cold
 cc.faith_cold.title: "Der Glaube erkaltet"
 cc.faith_cold.desc: "Ein Brief von [ward.GetName] trifft ein. Der Ton ist formell, aber die Botschaft ist unmissverständlich – das geistige Band zwischen uns ist dünn geworden. Unsere Vernachlässigung unserer religiösen Pflichten ist nicht unbemerkt geblieben.\n\n'Im Glauben kamen wir zu euch', heißt es in dem Brief. 'Wir bitten nun darum, entlassen zu werden, um unseren eigenen Weg zu finden.'"
 cc.faith_cold.a: "Lassen Sie sie frei. Ihr Glaube verdient eine bessere Führung, als wir ihnen gegeben haben."
 cc.faith_cold.b: "Erneuern wir unser Versprechen. Wir werden das Band nicht verwelken lassen."
 cc.faith_cold.c: "Ablehnen. Die Vereinbarung bleibt bestehen."
 cc.faith_cold.c_zealot: "Die heilige Pflicht kann nicht vernachlässigt werden. Wir bleiben standhaft."
 cc.faith_cold.e: "Eine diplomatische Lösung – unser Minister findet Bedingungen, die zufriedenstellen, ohne Opfer zu verlangen."
 cc.faith_cold.c_war: "Man hat sie zu oft zurückgewiesen. Das Band zerbricht im Feuer."

 # cc.226 — Patron of the Faith
 cc.patron_faith.title: "Schirmherr des Glaubens"
 cc.patron_faith.desc: "Die Nachricht hat die Höfe des Christentums und darüber hinaus erreicht – unsere Verwaltung von [ward_a.GetName] und [ward_b.GetName] ist nicht unbemerkt geblieben. Nicht nur einen, sondern zwei heilige Schützlinge zu führen und den Glauben der geschützten Völker durch die Wirren dieses Zeitalters zu bewahren, zeugt von Zielstrebigkeit und Macht.\n\nMan nennt uns nun den Patron des Glaubens."
 cc.patron_faith.a: "Nehmen Sie den Titel an. Wir sind das, wofür sie uns halten."
 cc.patron_faith.a_zealot: "Champion des Glaubens. Wir sind mehr als ein Gönner – wir sind sein Schwert."
 cc.patron_faith.b: "Bleiben Sie bescheiden. Die Arbeit ist wichtiger als der Titel."
 cc.patron_faith.c: "Nutze die Anerkennung weise. Prestige ist eine eigene Währung."

 # ============================================================
 # NEW MODIFIER NAMES — Ward Evolution Events
 # ============================================================
 STATIC_MODIFIER_NAME_cc_diplomatic_scramble: "Diplomatisches Wettrennen"
 cc_diplomatic_scramble: "Diplomatisches Wettrennen"
 cc_diplomatic_scramble_desc: "Ein peinlicher diplomatischer Zwischenfall erforderte schnelles Handeln — unser Ruf hat einen vorübergehenden Knacks erlitten, während wir versuchten, die Folgen einzudämmen."

 STATIC_MODIFIER_NAME_cc_righteous_intervention: "Gerechte Intervention"
 cc_righteous_intervention: "Gerechte Intervention"
 cc_righteous_intervention_desc: "Unsere Streitkräfte griffen entschlossen ein, um unseren Schutzbefohlenen zu verteidigen. Dieser Akt des Schutzes hat die Disziplin und Moral in der gesamten Armee gestärkt."

 STATIC_MODIFIER_NAME_cc_smooth_integration: "Reibungslose Integration"
 cc_smooth_integration: "Reibungslose Integration"
 cc_smooth_integration_desc: "Ein außergewöhnlich gut geführter Übergang vom Protektorat zum Vasallen hat beim neuen Schutzbefohlenen ein Gefühl der Partnerschaft statt der Einschränkung hinterlassen."

 STATIC_MODIFIER_NAME_cc_magnanimous_overlord: "Großmütiger Lehnsherr"
 cc_magnanimous_overlord: "Großmütiger Lehnsherr"
 cc_magnanimous_overlord_desc: "Unsere Bereitschaft, das Wachstum des Mündels anzuerkennen und ihm größere Unabhängigkeit zu gewähren, hat unseren Ruf als gerechte und zukunftsorientierte Macht verbessert."

 STATIC_MODIFIER_NAME_cc_patron_of_faith: "Schirmherr des Glaubens"
 cc_patron_of_faith: "Schirmherr des Glaubens"
 cc_patron_of_faith_desc: "Von Glaubensgenossen als Beschützer der Gläubigen anerkannt, sind unser spiritueller Einfluss und unsere Autorität in religiösen Angelegenheiten erheblich gewachsen."

 STATIC_MODIFIER_NAME_cc_faith_renewed: "Erneuerter Glaube"
 cc_faith_renewed: "Erneuerter Glaube"
 cc_faith_renewed_desc: "Eine öffentliche erneuerte Verpflichtung gegenüber unserem heiligen Schutzkleid hat unser religiöses Ansehen gestärkt und der spirituellen Bindung wieder eine Bedeutung verliehen."

 STATIC_MODIFIER_NAME_cc_recognized_partner: "Anerkannter Partner"
 cc_recognized_partner: "Anerkannter Partner"
 cc_recognized_partner_desc: "Ein von unserem Minister ausgehandelter Vertrag hat diesem Vasallen ein Gefühl echter Partnerschaft vermittelt — seine Loyalität ist in Dankbarkeit verankert, nicht nur in Verpflichtung."

 STATIC_MODIFIER_NAME_cc_forced_subjection: "Erzwungene Unterwerfung"
 cc_forced_subjection: "Erzwungene Unterwerfung"
 cc_forced_subjection_desc: "Der Übergang zur Vasallität wurde eher aufgezwungen als angeboten. Unter der Oberfläche brodelt der Groll."

 STATIC_MODIFIER_NAME_cc_faithless_overlord_repute: "Glaubensloser Oberherr"
 cc_faithless_overlord_repute: "Glaubensloser Oberherr"
 cc_faithless_overlord_repute_desc: "Wir haben diejenigen im Stich gelassen, die sich auf unseren Schutz verlassen haben. Der Ruf hat Konsequenzen."

 STATIC_MODIFIER_NAME_cc_gracious_release: "Gnadenvoll Entlassen"
 cc_gracious_release: "Gnadenvoll Entlassen"
 cc_gracious_release_desc: "Die würdevolle Entlassung eines Mündels hat unseren Ruf als Staatsmann gestärkt, statt als Tyrann der Abhängigkeit."

 STATIC_MODIFIER_NAME_cc_sacred_defense: "Heilige Verteidigung"
 cc_sacred_defense: "Heilige Verteidigung"
 cc_sacred_defense_desc: "Unsere Verteidigung eines heiligen Schutzbefohlenen aus Gründen des Glaubens hat unseren religiösen Einfluss vertieft und die Gläubigen mobilisiert."

 STATIC_MODIFIER_NAME_cc_champion_of_faith: "Champion des Glaubens"
 cc_champion_of_faith: "Champion des Glaubens"
 cc_champion_of_faith_desc: "Indem wir den Titel des Champions des Glaubens in vollem Umfang annehmen, haben wir uns verpflichtet, Glaubensgenossen sowohl mit unseren Waffen als auch mit unseren Gebeten zu verteidigen."

 STATIC_MODIFIER_NAME_cc_zealous_refusal: "Eifrige Ablehnung"
 cc_zealous_refusal: "Eifrige Ablehnung"
 cc_zealous_refusal_desc: "Unsere öffentliche Weigerung, unseren heiligen Schützling aufgrund heiliger Verpflichtungen freizugeben, hat unser religiöses Ansehen gestärkt, selbst wenn es die Beziehung belastete."

 STATIC_MODIFIER_NAME_cc_papal_patron: "Schirmherr des Glaubens (Papstlich)"
 cc_papal_patron: "Schirmherr des Glaubens (Papstlich)"
 cc_papal_patron_desc: "Der Heilige Vater hat unsere Verwaltung der Gläubigen formell anerkannt. Die Billigung Roms hat Gewicht bei den katholischen Mächten in ganz Europa."

 STATIC_MODIFIER_NAME_cc_faith_rift_tension: "Spannungen durch Glaubensspaltung"
 cc_faith_rift_tension: "Spannungen durch Glaubensspaltung"
 cc_faith_rift_tension_desc: "Der spirituelle Pakt, der diese Vereinbarung einst band, ist zerfallen. Der Schützling wird unruhig unter der Autorität eines Lehnsherrn, dessen Glaube nicht mehr den seinen widerspiegelt."

 # ============================================================
 # cc.220 — A Ward No Longer (Catholic flavor additions)
 # ============================================================
 cc.ward_no_longer.a.tt_papal: "Der Papst wird die Auflösung dieser heiligen Vereinbarung mit Enttäuschung zur Kenntnis nehmen."

 # ============================================================
 # cc.225 — The Faith Grows Cold (new Catholic option)
 # ============================================================
 cc.faith_cold.d_papal: "Papstliche Vermittlung suchen"
 cc.faith_cold.d_papal.tt: "Der Heilige Vater entsendet einen Legaten, der das geistliche Band zwischen uns und unserem Schützling erneuert. Wir verbrauchen etwas Wohlwollen in Rom, aber die Vereinbarung bleibt bestehen."

 # ============================================================
 # cc.226 — Patron of the Faith (new Catholic option)
 # ============================================================
 cc.patron_faith.a_papal: "Papstliche Anerkennung akzeptieren"
 cc.patron_faith.a_papal.tt: "Der Heilige Vater erkennt unsere Rolle als Schutzherr des Glaubens formell an. Diese Anerkennung hat Gewicht bei allen katholischen Mächten. Unsere Schützlinge finden Trost im Segen Roms."

 # ============================================================
 # cc.227 — A Rift in the Sacred Bond
 # ============================================================
 cc.faith_rift.title: "Ein Riss im heiligen Bund"
 cc.faith_rift.desc: "[ward.GetName] teilt unseren Glauben nicht mehr. Der heilige Pakt, der unsere Protektoratsvereinbarung definierte, ruht auf einem spirituellen Fundament, das zerbröckelt ist. Ob wir es waren, die sich von den alten Wegen abwandten, oder sie, die einen neuen Weg suchten — der Widerspruch kann nicht länger ignoriert werden."

 cc.faith_rift.a: "Fordern Sie, dass [ward.GetName] zum wahren Glauben zurückkehrt"
 cc.faith_rift.a.tt: "Wir machen deutlich, dass die Vereinbarung einen gemeinsamen Glauben voraussetzt. Der Mündel wird dies nicht auf die leichte Schulter nehmen."
 cc.faith_rift.a_zealot: "Die Anforderungen des Glaubens lassen keinen Kompromiss zu"
 cc.faith_rift.a_zealot.tt: "Ein Eiferer duldet keine spirituelle Abweichung. Wir stellen das Ultimatum mit dem vollen Gewicht unserer Überzeugung."
 cc.faith_rift.b: "Lassen Sie [ward.GetName] frei – der heilige Pakt hat seine Zeit hinter sich"
 cc.faith_rift.b.tt: "Es ist besser, die Wahrheit klar anzuerkennen, als eine hohle Vereinbarung aufrechtzuerhalten."
 cc.faith_rift.c: "Behalten Sie die Vereinbarung trotz des Bruchs bei"
 cc.faith_rift.c.tt: "Der politische Nutzen überwiegt derzeit die spirituelle Reinheit. Der Mündel wird sich an diesen Widerspruch erinnern."
 cc.faith_rift.c_master: "Eine formelle Ausnahme aushandeln"
 cc.faith_rift.c_master.tt: "Unser Minister findet eine gesichtswahrende Vereinbarung. Der Schützling akzeptiert dies vorerst, obwohl die Spannung bleibt."
 cc.faith_rift.d_papal: "Die Angelegenheit dem Heiligen Vater vorlegen"
 cc.faith_rift.d_papal.tt: "Wir konsultieren Rom, anstatt einseitig zu handeln. Der Papst ist erfreut über seine Beteiligung und übt spirituellen Druck auf den Schützling aus, um eine Rückkehr zum Glauben zu bewirken."

 # ============================================================
 # cc.228 — The Ward Seeks Their Own Path
 # ============================================================
 cc.faith_rift_escalate.title: "Der Mündel sucht seinen eigenen Weg"
 cc.faith_rift_escalate.desc: "[ward.GetName] leidet schon lange unter dem Rekonversionsultimatum. Da die Loyalität auf einem Tiefpunkt ist, fordern sie nun offen ihre Unabhängigkeit — und führen den gebrochenen spirituellen Bund als Grund für die Auflösung der Vereinbarung an. Der Vorwand eines heiligen Pakts kann nicht länger aufrechterhalten werden."

 cc.faith_rift_escalate.a: "Gewähre [ward.GetName] ihre Unabhängigkeit"
 cc.faith_rift_escalate.a.tt: "Akzeptiere das Unvermeidliche. Lass sie frei, bevor sie es sich mit Gewalt nehmen."
 cc.faith_rift_escalate.b: "Wir werden nicht preisgeben, was uns gehört"
 cc.faith_rift_escalate.b.tt: "Absolut ablehnen. Das Protektorat erklärt seine Unabhängigkeit und zieht in den Krieg. Wenn sie katholisch sind und wir nicht, könnte Rom durchaus ihre Seite wählen."

 # ============================================================
 # New bias localization
 # ============================================================
 cc_papal_patron_recognition: "Papstliche Billigung"
 cc_papal_patron_recognition_desc: "Der Heilige Vater hat diesen Herrscher formell als Schutzherrn des Glaubens anerkannt — eine prestigeträchtige Auszeichnung, die an katholischen Höfen Gewicht hat."

 cc_papal_mediation_called: "Papstgunst verbraucht"
 cc_papal_mediation_called_desc: "Wir haben Rom gebeten, in einer Krise mit unserem heiligen Schützling zu vermitteln. Der Papst freut sich zu helfen, aber ein solcher Wohlwille ist nicht unendlich."

 # ============================================================
 # CROSS-REALM SUBJECT INTERACTIONS (cc.236 college, cc.240 commune)
 # ============================================================
 cc.college.exchange.title: "Ein Gelehrtenaustausch"
 cc.college.exchange.desc: "Wir erfahren, dass die Leiter unseres Wissenschaftskollegs eine Korrespondenz mit ihren Gegenstücken in [cc_rival_overlord.GetName] aufgenommen haben – einem ausländischen Kolleg von vergleichbarem Ruf. Briefe, Traktate und Gerüchte über umstrittene Entdeckungen werden über die Grenze hinweg ausgetauscht.\n\nEin solcher Kontakt zwischen gelehrten Häusern kann zu einem fruchtbaren Austausch reifen, der beide Kronen ehrt – oder zu einer eifersüchtigen Rivalität umschlagen, bei der Meister abgeworben und Reputationen angefochten werden. Wie sollen wir unsere Gelehrten lenken?"
 cc.college.exchange.a: "Fördern Sie den Austausch — sponsern Sie eine gemeinsame Disputation."
 cc.college.exchange.b: "Dränge sie dazu, [cc_rival_overlord.GetName] in den Schatten zu stellen und dessen Meister abzuwerben."
 cc.college.exchange.c: "Distanz wahren – lassen wir die Gelehrten korrespondieren, wie sie wollen."

 cc.commune.exchange.title: "Ein Zusammenfluss von Künstlern"
 cc.commune.exchange.desc: "Unsere Künstlerkommune ist in den Orbit einer verwandten Kommune in [cc_rival_overlord.GetName] geraten, deren Maler und Bildhauer mit gleicher Bewunderung besprochen werden. Lehrlinge reisen zwischen den beiden hin und her; Mäzene auf beiden Seiten beobachten den Vergleich genau.\n\nEine gemeinsame Ausstellung könnte beide Schulen mit Ruhm krönen — oder wir könnten unsere Meister gegen die ihren ausspielen und ihnen ihre besten Talente zum Preis einer bitteren Feindschaft abwerben. Was ist unser Wunsch?"
 cc.commune.exchange.a: "Veranstalte eine gemeinsame Ausstellung, die beide Schulen feiert."
 cc.commune.exchange.b: "Wir setzen unsere Meister gegen ihre ein – locken wir ihr Talent ab."
 cc.commune.exchange.c: "Distanz wahren – lassen wir die Künstler unter sich."

 cc.annex.resist.title: "Widerstand gegen Integration"
 cc.annex.resist.desc: "Unser Bestreben, dieses Reich vollständig zu absorbieren, ist auf stillen, aber hartnäckigen Widerstand gestoßen. Ihre Räte zögern, ihre Honoratioren werden kühl, und die Bande der Loyalität, die eine Integration erfordert, wollen nicht greifen. Wir können nachgeben und ihnen ihren besonderen Status belassen, oder wir können die Angelegenheit — zu einem Preis — forcieren, um die Vereinigung durchzusetzen."
 cc.annex.resist.a: "Respektiert ihre Autonomie – lässt die Integration vorerst ruhen."
 cc.annex.resist.b: "Kauf die Zögerlichen aus — gib Gold aus, um die Integration zu erzwingen."
 cc.annex.resist.c: "Auf das dynastische Gewicht setzen – Prestige ausgeben, um die Integration zu erzwingen."

