 MODIFIER_TYPE_NAME_cc_royal_trading_bureau_impact_modifier: "Effizienz des königlichen Handelsbüros"
 MODIFIER_TYPE_DESC_cc_royal_trading_bureau_impact_modifier: "Modifiziert die Effektivität des Königlichen Handelsamtes und skaliert dessen Steuereinnahmen sowie die Boni auf die maritime Kapazität."

