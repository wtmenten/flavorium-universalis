 # Hundred Years War modifiers
 STATIC_MODIFIER_NAME_cc_fra_hyw_feudal_strain: "Feudale Kriegsbelastung"
 STATIC_MODIFIER_DESC_cc_fra_hyw_feudal_strain: "Der lange Krieg mit England hat die Vorherrschaft des Adels über die französischen Aufgebote gefestigt und die Loyalität der Stände strapaziert, was über ein Jahrhundert des Konflikts hinweg zu einem Verfall führte."
 STATIC_MODIFIER_NAME_cc_fra_hyw_war_defeat: "Der Schatten der Niederlage"
 STATIC_MODIFIER_DESC_cc_fra_hyw_war_defeat: "Eine jüngste Niederlage hat den Adel ermutigt, die Kriegsmüdigkeit erhöht und die Rekrutierung von Bauern erschwert. Stapelt sich mit weiteren Niederlagen."
 STATIC_MODIFIER_NAME_cc_fra_hyw_war_victory: "Zuversicht des Sieges"
 STATIC_MODIFIER_DESC_cc_fra_hyw_war_victory: "Ein jüngster Sieg hat die Moral gehoben und die Rekrutierung von Bauern ermutigt. Gleicht akkumulierte Niederlagen teilweise aus."
 STATIC_MODIFIER_NAME_cc_fra_hyw_noble_sacrifice: "Adelsopfer"
 STATIC_MODIFIER_DESC_cc_fra_hyw_noble_sacrifice: "Der König hat vom Adel zusätzliche Aufgebote infolge der Niederlage gefordert. Sie lenken ein – doch um den Preis ihres Wohlwollens."
 STATIC_MODIFIER_NAME_cc_eng_hyw_martial_tradition: "Englische Kriegstradition"
 STATIC_MODIFIER_DESC_cc_eng_hyw_martial_tradition: "Die englische Adelskultur und die Tradition des Langbogens verleihen dem Reich zu Beginn des Hundertjährigen Krieges einen militärischen Vorteil, der über ein Jahrhundert hinweg schwindet."
 STATIC_MODIFIER_NAME_cc_eng_hyw_ascendancy: "Englische Vorherrschaft"
 STATIC_MODIFIER_DESC_cc_eng_hyw_ascendancy: "Ein jüngster Sieg hat die englische militärische Vorherrschaft bestätigt, was die Adelsaufgebote, die Mannkraft und die Moral gesteigert hat."
 STATIC_MODIFIER_NAME_cc_eng_hyw_setback: "Englischer Rückschlag"
 STATIC_MODIFIER_DESC_cc_eng_hyw_setback: "Eine Niederlage hat das englische Selbstvertrauen untergraben, was die Mannkraft, die Moral und die Zufriedenheit des Adels verringert."
 STATIC_MODIFIER_NAME_cc_fra_appanage_purge_resentment: "Apanage-Groll"
 STATIC_MODIFIER_DESC_cc_fra_appanage_purge_resentment: "Der erzwungene Ersatz des Regierungshauses hat tiefe Wunden hinterlassen. Die Adelsaufgebote sind gekürzt und die Zufriedenheit der Stände bleibt niedrig."
 STATIC_MODIFIER_NAME_cc_fra_purge_noble_unease: "Adelsunruhe"
 STATIC_MODIFIER_DESC_cc_fra_purge_noble_unease: "Pariser Machtdemonstration gegen ein Appanage-Lehen hat den breiteren Adel beunruhigt. Die Stände beobachten die Lage genau."

 STATIC_MODIFIER_NAME_cc_colonial_legitimacy_era: "Zeitalter der kolonialen Legitimität"
 STATIC_MODIFIER_DESC_cc_colonial_legitimacy_era: "Die Gewährung einer formalen Repräsentation für eine Kolonie hat in der westlichen Welt Widerhall gefunden – sie zieht Siedler an, verbessert die Loyalität der Vasallen und verleiht der Krone den Ruf einer besonnenen Regierungsführung."
 STATIC_MODIFIER_NAME_cc_colonial_supremecy_era: "Zeitalter der kolonialen Vorherrschaft"
 STATIC_MODIFIER_DESC_cc_colonial_supremecy_era: "Warum sollten wir solch erbärmlichen Geschöpfen Repräsentation gewähren?"

