 MODIFIER_TYPE_DESC_cc_scholarly_concordat_impact_modifier: "Modifiziert die Effektivität des Gelehrtenkonkordats und skaliert dessen Forschungsgeschwindigkeit sowie die Boni auf das institutionelle Wachstum."

