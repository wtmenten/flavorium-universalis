 STATIC_MODIFIER_NAME_cc_governor_unrest_reform: "Koloniale Steuerreform"
 STATIC_MODIFIER_DESC_cc_governor_unrest_reform: "Ermittler, die entsandt wurden, um die Korruption im kolonialen Steuerapparat auszumerzen, haben bestehende Einnahmequellen gestört. Münzprägeinkommen und Steuereinnahmen leiden kurzfristig, während sich die Reformen etablieren."

 STATIC_MODIFIER_NAME_cc_governor_unrest_appeasement: "Koloniale Unruhen — Besänftigt"
 STATIC_MODIFIER_DESC_cc_governor_unrest_appeasement: "Versprechen und Geschenke haben in der Kolonie für vorübergehende Ruhe gesorgt, doch die tieferliegenden Beschwerden schwelen weiter. Die rebellische Stimmung nimmt stetig zu."

 STATIC_MODIFIER_NAME_cc_colonial_representative_strain: "Koloniale Repräsentativorgane"
 STATIC_MODIFIER_DESC_cc_colonial_representative_strain: "Die Einrichtung formaler Repräsentationsinstitutionen für die Kolonie erfordert das Navigieren zwischen konkurrierenden Rechtstraditionen und den Ausbau der Verwaltungskapazitäten. Gesetzgebungsprozesse verlangsamen sich und bürokratische Kosten steigen, während die neuen Gremien erst ihren Stand finden."

