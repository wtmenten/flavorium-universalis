 # Temporary age-event modifiers
 STATIC_MODIFIER_NAME_cc_temp_renaissance_observation: "Beobachtung eines Gelehrten"
 STATIC_MODIFIER_DESC_cc_temp_renaissance_observation: "Das methodische Studium der neuen Lehre durch einen Minister hat zu einer bescheidenen, aber messbaren Verbesserung der institutionellen Forschung und Alphabetisierung geführt."

 # Legacy Track C — Elder's Final Gift modifiers (base + consecrated, 11 pairs)
 STATIC_MODIFIER_NAME_cc_legacy_elder_grand_chancellor: "Erbe des Großkanzlers"
 STATIC_MODIFIER_DESC_cc_legacy_elder_grand_chancellor: "Die jahrzehntelange geduldige Diplomatie des Großkanzlers wirkt sich in einer dauerhaften Steigerung unserer diplomatischen Reichweite, unseres Ansehens und unserer Kapazität aus."
 STATIC_MODIFIER_NAME_cc_legacy_elder_grand_chancellor_consecrated: "Geweihtes Vermächtnis des Großkanzlers"
 STATIC_MODIFIER_DESC_cc_legacy_elder_grand_chancellor_consecrated: "Eine feierliche Konsekrationszeremonie hat das Vermächtnis des Großkanzlers zu einem prägenden Merkmal der außenpolitischen Identität dieses Reiches erhoben."

 STATIC_MODIFIER_NAME_cc_legacy_elder_cavalry_marshal: "Erbe des Kavallerie-Marschalls"
 STATIC_MODIFIER_DESC_cc_legacy_elder_cavalry_marshal: "Die Doktrin des beweglichen Krieges des Marschalls lebt in reduzierten Kavalleriekosten, stärkerer Disziplin und einer Tradition kühner Offensivaktionen weiter."
 STATIC_MODIFIER_NAME_cc_legacy_elder_cavalry_marshal_consecrated: "Geweihtes Vermächtnis des Kavallerie-Marschalls"
 STATIC_MODIFIER_DESC_cc_legacy_elder_cavalry_marshal_consecrated: "Das Andenken an den Marschall wurde zu einem kriegerischen Ideal erhoben – ein permanenter Kraftmultiplikator für jeden Kommandanten, der unter unserem Banner reitet."

 STATIC_MODIFIER_NAME_cc_legacy_elder_supreme_commander: "Erbe des Oberbefehlshabers"
 STATIC_MODIFIER_DESC_cc_legacy_elder_supreme_commander: "Die systematischen Reformen des Oberbefehlshabers an unserem Militärapparat bleiben bestehen – reduzierte Kosten, bessere Disziplin und eine rationalisierte Befehlskette."
 STATIC_MODIFIER_NAME_cc_legacy_elder_supreme_commander_consecrated: "Geweihtes Erbe des Oberbefehlshabers"
 STATIC_MODIFIER_DESC_cc_legacy_elder_supreme_commander_consecrated: "Das Vermächtnis des Oberbefehlshabers wurde dauerhaft als militärische Tradition verankert – jedes Regiment drillt nach dem von ihm gesetzten Standard."

 STATIC_MODIFIER_NAME_cc_legacy_elder_learned_courtier: "Erbe des gelehrten Höflings"
 STATIC_MODIFIER_DESC_cc_legacy_elder_learned_courtier: "Die Liebe des gelehrten Höflings zur Wissenschaft bleibt in Form von verbesserter institutioneller Forschung und einer dauerhaften Kultur der Alphabetisierung am Hof bestehen."
 STATIC_MODIFIER_NAME_cc_legacy_elder_learned_courtier_consecrated: "Geweihtes Vermächtnis des gelehrten Höflings"
 STATIC_MODIFIER_DESC_cc_legacy_elder_learned_courtier_consecrated: "Das Andenken an den gelehrten Höfling ist zu einem Gründungsideal unserer intellektuellen Kultur geworden — Institutionen wachsen hier so natürlich wie Bäume."

 STATIC_MODIFIER_NAME_cc_legacy_elder_enlightenment_herald: "Erbe des Herolds der Aufklärung"
 STATIC_MODIFIER_DESC_cc_legacy_elder_enlightenment_herald: "Die Herausforderung des Herolds an den Aberglauben und das überlieferte Wissen hat bleibende Spuren hinterlassen — die Alphabetisierung steigt und Reformen stoßen auf weniger Widerstand."
 STATIC_MODIFIER_NAME_cc_legacy_elder_enlightenment_herald_consecrated: "Geweihtes Vermächtnis des Herolds der Aufklärung"
 STATIC_MODIFIER_DESC_cc_legacy_elder_enlightenment_herald_consecrated: "Die Ideen des Herolds der Aufklärung wurden in die Gründungsphilosophie dieses Reiches überführt – hier regiert die Vernunft ebenso wie die Tradition."

 STATIC_MODIFIER_NAME_cc_legacy_elder_master_urbanist: "Erbe des Meister-Urbanisten"
 STATIC_MODIFIER_DESC_cc_legacy_elder_master_urbanist: "Die Vision des Meisterurbanisten von der Stadt als Motor des Fortschritts lebt in reduzierten Baukosten und beschleunigter Entwicklung weiter."
 STATIC_MODIFIER_NAME_cc_legacy_elder_master_urbanist_consecrated: "Geweihtes Erbe des Meisterurbanisten"
 STATIC_MODIFIER_DESC_cc_legacy_elder_master_urbanist_consecrated: "Das Erbe des Meisterurbanisten wurde als städtische Doktrin verankert – unsere Städte werden nach dem Standard gebaut und verwaltet, den [CHARACTER.GetSheHe] gesetzt hat."

 STATIC_MODIFIER_NAME_cc_legacy_elder_progressive_rationalist: "Erbe des progressiven Rationalisten"
 STATIC_MODIFIER_DESC_cc_legacy_elder_progressive_rationalist: "Der systematische Abbau von Aberglauben durch den Rationalisten hat ein dauerhaftes Erbe beschleunigter Forschung und institutioneller Empfänglichkeit hinterlassen."
 STATIC_MODIFIER_NAME_cc_legacy_elder_progressive_rationalist_consecrated: "Geweihtes Erbe des progressiven Rationalisten"
 STATIC_MODIFIER_DESC_cc_legacy_elder_progressive_rationalist_consecrated: "Die Philosophie des progressiven Rationalisten ist grundlegend geworden – dieses Reich schreitet aus institutionellem Instinkt voran, nicht durch königliches Dekret."

 STATIC_MODIFIER_NAME_cc_legacy_elder_confucian_mandarin: "Erbe des konfuzianischen Mandarins"
 STATIC_MODIFIER_DESC_cc_legacy_elder_confucian_mandarin: "Die Hingabe des Mandarins an eine meritokratische Regierungsführung und angemessene Beziehungen bleibt als permanenter Gewinn bei der Kabinetts-Effizienz und der Assimilationsgeschwindigkeit bestehen."
 STATIC_MODIFIER_NAME_cc_legacy_elder_confucian_mandarin_consecrated: "Geweihtes Vermächtnis des konfuzianischen Mandarins"
 STATIC_MODIFIER_DESC_cc_legacy_elder_confucian_mandarin_consecrated: "Die Prinzipien des konfuzianischen Mandarins wurden in die administrative Seele dieses Reiches eingeweiht – Regierungsführung als moralische Berufung."

 STATIC_MODIFIER_NAME_cc_legacy_elder_caliphate_diplomat: "Erbe des Kalifats-Diplomaten"
 STATIC_MODIFIER_DESC_cc_legacy_elder_caliphate_diplomat: "Die Meisterschaft des Diplomaten des Kalifats in den zwischenstaatlichen Beziehungen wirkt fort in Form einer verbesserten diplomatischen Reichweite, verringertem Antagonismus und stärkeren Handelsverbindungen."
 STATIC_MODIFIER_NAME_cc_legacy_elder_caliphate_diplomat_consecrated: "Geweihtes Vermächtnis des Diplomaten des Kalifats"
 STATIC_MODIFIER_DESC_cc_legacy_elder_caliphate_diplomat_consecrated: "Das Erbe des Diplomaten des Kalifats wurde als diplomatische Tradition geweiht – ausländische Höfe verstehen, was unser Banner repräsentiert."

 STATIC_MODIFIER_NAME_cc_legacy_elder_seneschal: "Erbe des Seneschalls"
 STATIC_MODIFIER_DESC_cc_legacy_elder_seneschal: "Das lebenslange Management der großen Haushalte durch den Seneschall wirkt sich in reduzierten Hofkosten und einer dauerhaften Verbesserung der Verwaltungseffizienz aus."
 STATIC_MODIFIER_NAME_cc_legacy_elder_seneschal_consecrated: "Geweihtes Erbe des Seneschalls"
 STATIC_MODIFIER_DESC_cc_legacy_elder_seneschal_consecrated: "Die Meisterschaft des Seneschalls in der Hofverwaltung wurde in eine institutionelle Doktrin überführt – jede Schatzkammer und jeder Haushalt folgt dem von ihm gesetzten Standard."

 STATIC_MODIFIER_NAME_cc_legacy_elder_marshal_of_the_court: "Erbe des Hofmarschalls"
 STATIC_MODIFIER_DESC_cc_legacy_elder_marshal_of_the_court: "Die doppelte Meisterschaft des Marschalls in Zeremonie und Kommando bleibt in verbesserten Adelsbeziehungen, besserer militärischer Disziplin und einem prestigeträchtigeren Hof bestehen."
 STATIC_MODIFIER_NAME_cc_legacy_elder_marshal_of_the_court_consecrated: "Geweihtes Vermächtnis des Hofmarschalls"
 STATIC_MODIFIER_DESC_cc_legacy_elder_marshal_of_the_court_consecrated: "Das Andenken an den Marschall des Hofes wurde dauerhaft in das Gefüge unserer Hofkultur eingewebt – Disziplin und Zeremonie als ein einziger Ausdruck souveräner Macht."

