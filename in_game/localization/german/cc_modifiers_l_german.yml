 STATIC_MODIFIER_NAME_cc_col_viceroyalty: "Vizeköniglicher Sitz"
 STATIC_MODIFIER_DESC_cc_col_viceroyalty: "Erhoben zu einem Vizekönigreich, das ein konsolidiertes Kolonialreich regiert, zieht dieser Sitz Siedler, Handel und Prestige an."
 STATIC_MODIFIER_NAME_cc_col_unified_administration: "Einheitliche Kolonialverwaltung"
 STATIC_MODIFIER_DESC_cc_col_unified_administration: "Die Zusammenlegung zweier überlappender Kolonialregierungen zu einer einzigen hat die Überseeherrschaft der Krone gestrafft."
 STATIC_MODIFIER_NAME_cc_col_colonial_coordination: "Koloniale Koordination"
 STATIC_MODIFIER_DESC_cc_col_colonial_coordination: "Ein gemeinsamer Koordinationsrat ermöglicht es benachbarten Kolonien, zu kooperieren, ohne ihre jeweiligen Sitze aufzugeben."
 STATIC_MODIFIER_NAME_cc_col_frontier_tension: "Umstrittene Grenze"
 STATIC_MODIFIER_DESC_cc_col_frontier_tension: "Ein ungeklärter Grenzstreit zehrt an der Prosperität und schürt Unruhen entlang der Koloniallinie."
 STATIC_MODIFIER_NAME_cc_col_settled_frontier: "Besiedelte Grenzregion"
 STATIC_MODIFIER_DESC_cc_col_settled_frontier: "Eine vermessene und anerkannte Grenze hat Ruhe und Vertrauen in die Kolonie gebracht."
 STATIC_MODIFIER_NAME_cc_col_coerced_labor_regime: "Regime der Zwangsarbeit"
 STATIC_MODIFIER_DESC_cc_col_coerced_labor_regime: "Ein fest verankertes System von Zwangsarbeit bereichert die Kolonie auf Kosten ihres langfristigen Zusammenhalts."

 STATIC_MODIFIER_NAME_cc_col_plantation_economy: "Plantagenwirtschaft"
 STATIC_MODIFIER_DESC_cc_col_plantation_economy: "Plantagen für Exportfrüchte steigern die Produktion, obwohl die geforderte Arbeit lokalen Unmut schürt."
 STATIC_MODIFIER_NAME_cc_col_encomienda_labor: "Encomienda-Arbeit"
 STATIC_MODIFIER_DESC_cc_col_encomienda_labor: "Erzwungene indigene Arbeit steigert die Einnahmen der Kolonie, während sie die Bevölkerung unterdrückt."
 STATIC_MODIFIER_NAME_cc_col_mission_district: "Missionsbezirk"
 STATIC_MODIFIER_DESC_cc_col_mission_district: "Eine auf Konversion ausgerichtete Siedlung, die die Grenzregion befriedet und die Kolonie stabilisiert."

 # ============================================================
 # BALANCE OF POWER
 # ============================================================
 STATIC_MODIFIER_NAME_cc_bop_defector: "Bloc-Überläufer"
 STATIC_MODIFIER_DESC_cc_bop_defector: "Da dieser Hof seine Ausrichtung aufgegeben hat, wird er von den Kanzleien Europas als gläubigkeitslos angesehen."
 STATIC_MODIFIER_NAME_cc_bop_coalition_partner: "Neuer Koalitionspartner"
 STATIC_MODIFIER_DESC_cc_bop_coalition_partner: "Neu aufgenommen in die ausgleichende Koalition, beflügelt durch das Versprechen eines gemeinsamen Ziels."
 STATIC_MODIFIER_NAME_cc_bop_ascendant_confidence: "Aufsteigendes Selbstvertrauen"
 STATIC_MODIFIER_DESC_cc_bop_ascendant_confidence: "Hinter dem aufstrebenden Hegemon und all jenen, die mit ihm marschieren, sammelt sich Dynamik."
 STATIC_MODIFIER_NAME_cc_bop_coalition_solidarity: "Koalitionssolidarität"
 STATIC_MODIFIER_DESC_cc_bop_coalition_solidarity: "Eine vereinte Koalition steht entschlossen gegen jeden Versuch, die Vorherrschaft über den Kontinent zu erlangen."
 STATIC_MODIFIER_NAME_cc_bop_coalition_wavering: "Wankende Koalition"
 STATIC_MODIFIER_DESC_cc_bop_coalition_wavering: "Zweifel und Zwietracht breiten sich in einer Koalition aus, die ihre Nerven verliert."
 STATIC_MODIFIER_NAME_cc_bop_bought_ally: "Ausländische Subventionen"
 STATIC_MODIFIER_DESC_cc_bop_bought_ally: "Ausländisches Gold füllt die Schatzkammer und bringt damit Ratschläge zu Neutralität und Beschwichtigung mit sich."
 STATIC_MODIFIER_NAME_cc_bop_hegemonic_overstretch: "Hegemoniale Überdehnung"
 STATIC_MODIFIER_DESC_cc_bop_hegemonic_overstretch: "Das Streben nach Dominanz hat unsere Armeen strapaziert und die Ängste jedes Nachbarn geschürt."
 STATIC_MODIFIER_NAME_cc_bop_subsidized: "Koalitionssubventionen"
 STATIC_MODIFIER_DESC_cc_bop_subsidized: "Die von der Koalition geöffneten Kriegskassen stärken unsere Macht gegenüber der vorherrschenden Macht."
 STATIC_MODIFIER_NAME_cc_bop_subsidy_strain: "Belastung der Kriegskasse"
 STATIC_MODIFIER_DESC_cc_bop_subsidy_strain: "Die Finanzierung der Koalition hat unsere Kassen geleert – die Schatzkammer blutet, die Münze verliert an Wert und unser eigener Hof muss den Gürtel enger schnallen."
 STATIC_MODIFIER_NAME_cc_bop_war_footing: "Kriegsbereitschaft"
 STATIC_MODIFIER_DESC_cc_bop_war_footing: "Mitgerissen vom großen Wettstreit plündern unsere Armeen frei im Kriegsschauplatz und marschieren ohne Angst vor Mangel."
 STATIC_MODIFIER_NAME_cc_bop_balancer_prestige: "Ausgleicher Europas"
 STATIC_MODIFIER_DESC_cc_bop_balancer_prestige: "Anerkannt als der unverzichtbare Schiedsrichter, dessen Gewicht das Gleichgewicht des Kontinents entscheidet."
 STATIC_MODIFIER_NAME_cc_bop_master_of_europe: "Herr über Europa"
 STATIC_MODIFIER_DESC_cc_bop_master_of_europe: "Das Gleichgewicht ist gebrochen und wir stehen über dem Kontinent — ein neuer Karl der Große, ein neuer Caesar."
 STATIC_MODIFIER_NAME_cc_bop_humbled_power: "Demütige Macht"
 STATIC_MODIFIER_DESC_cc_bop_humbled_power: "Es ist uns nicht gelungen, den Hegemon zu stoppen, und die Erinnerung an dieses Versagen begleitet unsere Gesandten in jeden Hof."
 STATIC_MODIFIER_NAME_cc_bop_scourge_of_the_west: "Geißel des Westens"
 STATIC_MODIFIER_DESC_cc_bop_scourge_of_the_west: "Die alte westliche Ordnung konnte uns nicht zurückhalten; unsere Armeen strömen über ihre Grenzen."
 STATIC_MODIFIER_NAME_cc_bop_western_bulwark: "Westliches Bollwerk"
 STATIC_MODIFIER_DESC_cc_bop_western_bulwark: "Geschlagen, aber nicht gebrochen, wappnet sich der Westen, um durchzuhalten und wieder aufzubauen."
 STATIC_MODIFIER_NAME_cc_bop_concert_of_europe: "Europäisches Konzert"
 STATIC_MODIFIER_DESC_cc_bop_concert_of_europe: "Eine dauerhafte diplomatische Ordnung, gestützt durch Kongresse und den gemeinsamen Entschluss, den Frieden zu bewahren."
 STATIC_MODIFIER_NAME_cc_bop_revolutionary_upheaval: "Revolutionärer Umbruch"
 STATIC_MODIFIER_DESC_cc_bop_revolutionary_upheaval: "Die alte Ordnung wird hinweggefegt, während die Revolution das sorgsame Gleichgewicht der Könige zerschmettert."
 STATIC_MODIFIER_NAME_cc_bop_scorched_earth: "Versunken in einer verbrannten Erde"
 STATIC_MODIFIER_DESC_cc_bop_scorched_earth: "Der Feind verbrennt das Land vor uns; unsere Kolonnen hungern und schwinden in einer Einöde, die sie selbst geschaffen haben."
 STATIC_MODIFIER_NAME_cc_bop_continental_blockade: "Kontinentalblockade"
 STATIC_MODIFIER_DESC_cc_bop_continental_blockade: "Das Dekret des Hegemons sperrt unsere Kaufleute von den Märkten des Kontinents aus, drosselt den Handel und schürt Unzufriedenheit."
 STATIC_MODIFIER_NAME_cc_bop_levee_en_masse: "Die Nation unter Waffen"
 STATIC_MODIFIER_DESC_cc_bop_levee_en_masse: "Ein ganzes Volk ist mobilisiert – Manpower und Eifer im Überfluss, obwohl die Rekrutierung die Bande der alten Ordnung strapaziert."
 STATIC_MODIFIER_NAME_cc_bop_arbiter_of_europe: "Schiedsrichter von Europa"
 STATIC_MODIFIER_DESC_cc_bop_arbiter_of_europe: "Wir haben die Koalition zusammengehalten und dem potenziellen Herrn des Kontinents eine Absage erteilt. Nun blickt Europa zu uns als vertrauenswürdigem Garanten seines Friedens – unser Wort hat in jeder Kanzlei Gewicht, und unsere Kaufleute florieren unter der von uns aufrechterhaltenen Ordnung."
 STATIC_MODIFIER_NAME_cc_bop_aspiring_hegemon: "Der aufstrebende Hegemon"
 STATIC_MODIFIER_DESC_cc_bop_aspiring_hegemon: "Nachdem wir die Koalition gemeistert haben, die einen potenziellen Hegemon demütigte, haben wir gelernt, wie ein solcher Block aufgebaut – und zerschlagen wird. Die Armeen und der Ehrgeiz, die das Gleichgewicht retteten, richten sich nun auf unsere eigene Vorherrschaft."
 STATIC_MODIFIER_NAME_cc_bop_vindicated_balancer: "Der rehabilitierte Ausgleicher"
 STATIC_MODIFIER_DESC_cc_bop_vindicated_balancer: "Wir hielten die Waagschalen Europas und schlugen zu, wenn eine Macht zu weit griff. Das Vertrauen der Koalition war nicht fehlamplatziert, und der Kontinent erinnert sich daran, wer ihn befreit hat."
 STATIC_MODIFIER_NAME_cc_bop_cut_down_to_size: "Auf die richtige Größe bringen"
 STATIC_MODIFIER_DESC_cc_bop_cut_down_to_size: "Wir strebten nach Vorherrschaft und scheiterten an der Union unserer Rivalen. Zurückgestutzt auf den Rang gewöhnlicher Mächte, unsere Armeen ausgedünnt und unser Name geschwächt, müssen wir uns von bescheidenerem Boden aus neu aufbauen."
 STATIC_MODIFIER_NAME_cc_bop_faded_ambition: "Verblasste Ambition"
 STATIC_MODIFIER_DESC_cc_bop_faded_ambition: "Unser Moment kam und ging. Wir haben nie den entscheidenden Schlag versetzt, und während wir zögerten, zog die Welt an uns vorbei."
 STATIC_MODIFIER_NAME_cc_bop_risen_in_shadow: "Im Schatten aufgestiegen"
 STATIC_MODIFIER_DESC_cc_bop_risen_in_shadow: "Während der Prätendent sich erschöpfte, nach einer Vorherrschaft zu greifen, die er nie ganz erlangte, wuchsen wir still in seinem Schatten – und überdauerten ihn."
 STATIC_MODIFIER_NAME_cc_bop_coalition_solidarity_empowered: "Gestärkte Solidarität"
 STATIC_MODIFIER_DESC_cc_bop_coalition_solidarity_empowered: "Eine Koalition, die sich selbst echte Zähne gegeben hat — gegenseitige Verteidigung und ständige Befugnisse —, bindet weitaus fester als jedes bloße Papierbündnis."
 STATIC_MODIFIER_NAME_cc_bop_war_subsidies: "Kriegskasse"
 STATIC_MODIFIER_DESC_cc_bop_war_subsidies: "Im Voraus an widerwillige Verbündete verteilte Subventionen stehen bereit, die Kosten unseres nächsten Aufrufs zu den Waffen zu halbieren."
 STATIC_MODIFIER_NAME_cc_bop_dragged_to_war: "In den Krieg gezogen"
 STATIC_MODIFIER_DESC_cc_bop_dragged_to_war: "In einen Krieg gezogen, den wir nicht gewählt haben, marschieren unsere Soldaten mit Bitterkeit und unsere Schatzkammern bluten für den Ehrgeiz eines anderen."

 # --- Coalition parliament actions ---
 STATIC_MODIFIER_NAME_cc_bop_chaumont_pledge: "Vertrag von Chaumont"
 STATIC_MODIFIER_DESC_cc_bop_chaumont_pledge: "Verbunden durch ein feierliches Versprechen gegen einen Separatfrieden, hält die Koalition stand und kämpft als eine Einheit weiter."
 STATIC_MODIFIER_NAME_cc_bop_combined_command: "Die pragmatische Armee"
 STATIC_MODIFIER_DESC_cc_bop_combined_command: "Ein einheitliches alliiertes Kommando verwandelt eine Koalition von Armeen in ein einziges Instrument des Krieges."
 STATIC_MODIFIER_NAME_cc_bop_war_aims_committed: "Einige Kriegsziele"
 STATIC_MODIFIER_DESC_cc_bop_war_aims_committed: "Da die Beute des Sieges bereits verteilt wurde, hat jeder Hof ein Interesse daran, den Krieg zu Ende zu führen."

 # --- Concert of Europe ---
 STATIC_MODIFIER_NAME_cc_concert_member: "Sitz im Konzert"
 STATIC_MODIFIER_DESC_cc_concert_member: "Ein Platz unter den Großmächten, die über den Frieden Europas wachen, verleiht unserer Diplomatie echtes Gewicht."
 STATIC_MODIFIER_NAME_cc_concert_intervention_mandate: "Interventionsmandat"
 STATIC_MODIFIER_DESC_cc_concert_intervention_mandate: "Mit der Sanktion des Konzerts handeln wir und bewahren die gefestigte Ordnung mit einer freien und steten Hand."
 STATIC_MODIFIER_NAME_cc_concert_sphere_of_influence: "Einflusssphäre"
 STATIC_MODIFIER_DESC_cc_concert_sphere_of_influence: "Die Mächte haben unsere Sphäre anerkannt — eine stille Ernte von Handel und Ansehen ergibt sich aus der Einigung."

 # --- Concert parliament participation (modifier types) ---
 MODIFIER_TYPE_NAME_cc_concert_president_can_participate_in_parliament: "Präsident im Kongress"
 MODIFIER_TYPE_DESC_cc_concert_president_can_participate_in_parliament: "Der Präsident des Konzerts sitzt im Kongress der Mächte und stimmt dort ab."
 MODIFIER_TYPE_NAME_cc_concert_seat_can_participate_in_parliament: "Mitglied im Kongress"
 MODIFIER_TYPE_DESC_cc_concert_seat_can_participate_in_parliament: "Ein Mitglied des Konzerts sitzt im Kongress der Mächte und hat Stimmrecht."

 MODIFIER_TYPE_NAME_cc_bop_chief_balancer_can_participate_in_parliament: "Hauptausgleicher im Kongress"
 MODIFIER_TYPE_DESC_cc_bop_chief_balancer_can_participate_in_parliament: "Der Hauptausgleicher bringt Anträge ein und stimmt im Kongress der Koalition ab, gewichtet nach seiner wirtschaftlichen Basis und seinem Status als Großmacht."
 MODIFIER_TYPE_NAME_cc_bop_coalition_seat_can_participate_in_parliament: "Mitglied im Kongress"
 MODIFIER_TYPE_DESC_cc_bop_coalition_seat_can_participate_in_parliament: "Ein Mitglied der Koalition stimmt im Kongress ab, gewichtet nach seiner wirtschaftlichen Basis und seinem Status als Großmacht."
 STATIC_MODIFIER_NAME_cc_bop_hegemons_client: "Klient des Hegemons"
 STATIC_MODIFIER_DESC_cc_bop_hegemons_client: "Wir standen auf der Seite des Siegers. Kein Nachbar wagt es, einen Anspruch gegen uns geltend zu machen, und ein Hof, der seine Sicherheit nicht kaufen muss, kann es sich leisten, Geld für andere Dinge auszugeben."
 STATIC_MODIFIER_NAME_cc_bop_unaligned_broker: "Die freie Hand"
 STATIC_MODIFIER_DESC_cc_bop_unaligned_broker: "Wir hielten Audienzen beider Pole ab, ohne uns einem von ihnen zu verschreiben. Eine Kanzlei, die niemandem etwas schuldet, ist eine, die jeder Hof weiterhin empfangen wird."
 STATIC_MODIFIER_NAME_cc_minister_slighted: "Gekränkt"
 STATIC_MODIFIER_DESC_cc_minister_slighted: "Die Krone hat gegen sie entschieden, und sie haben es nicht vergessen. Sie dienen korrekt, aber nicht mehr als nötig."
 STATIC_MODIFIER_NAME_cc_minister_favoured: "Bevorzugt"
 STATIC_MODIFIER_DESC_cc_minister_favoured: "Die Krone hat vor dem gesamten Hof Partei für sie ergriffen. Sie beabsichtigen zu beweisen, dass dies die richtige Entscheidung war."
 STATIC_MODIFIER_NAME_cc_minister_reconciled: "Versöhnt"
 STATIC_MODIFIER_DESC_cc_minister_reconciled: "Der Streit wurde durch die Hand der Krone selbst beigelegt. Ein Hof, der seinem Schiedsrichter vertraut, läuft reibungsloser."
 STATIC_MODIFIER_NAME_cc_minister_cabal_bond: "Kabinettsband"
 STATIC_MODIFIER_DESC_cc_minister_cabal_bond: "Ein formell geschlossenes Bündnis mit einem anderen Minister. Gemeinsam effektiv und schwerer gegeneinander auszuspielen."
 STATIC_MODIFIER_NAME_cc_minister_defied_modifier: "Trotzig"
 STATIC_MODIFIER_DESC_cc_minister_defied_modifier: "Ihr Antrag wurde kategorisch abgelehnt. Der General gehorcht, erinnert sich aber daran, wer ihn überstimmt hat."
 STATIC_MODIFIER_NAME_cc_aor_counter_revolutionary_crown: "Die Krone, die hielt"
 STATIC_MODIFIER_DESC_cc_aor_counter_revolutionary_crown: "Unsere Untertanen standen in dem Jahr, das andere Imperien zerriss, an unserer Seite, und jeder Hof und jeder Stand hat dies zur Kenntnis genommen."
 STATIC_MODIFIER_NAME_cc_aor_martial_law: "Kampfgesetz"
 STATIC_MODIFIER_DESC_cc_aor_martial_law: "Die Provinz wird eher durch ihre Garnison als durch Zustimmung gehalten. Die Ordnung steht nicht infrage; der gute Wille schon."
 STATIC_MODIFIER_NAME_cc_aor_settled_grievance: "Beschwerde beigelegt"
 STATIC_MODIFIER_DESC_cc_aor_settled_grievance: "Die Zugeständnisse kamen spät und kosteten mehr, als sie es einst getan hätten, aber sie wurden gemacht und sie wurden geglaubt."
 STATIC_MODIFIER_NAME_cc_aor_orderly_separation: "Eine ordentliche Trennung"
 STATIC_MODIFIER_DESC_cc_aor_orderly_separation: "Die Trennung wurde eher verwaltet als erkämpft. Sie kostete uns an Ansehen, bewahrte uns aber einen Krieg."
 STATIC_MODIFIER_NAME_cc_aor_dependency_advocacy: "Im Ausland bereits vergeben"
 STATIC_MODIFIER_DESC_cc_aor_dependency_advocacy: "Ein loyales Haus bürgt für unser Wort an Höfen, wo unseren eigenen Gesandten nicht geglaubt würde."
 STATIC_MODIFIER_NAME_cc_aor_frontier_war_effort: "Ein Grenzkrieg"
 STATIC_MODIFIER_DESC_cc_aor_frontier_war_effort: "Wir setzen einen Kommandanten ab, der sein Handwerk in unseren Diensten gelernt hat und das Land besser kennt als wir."
 STATIC_MODIFIER_NAME_cc_xp_fumbled_integration: "Verpfuschte Listen"
 STATIC_MODIFIER_DESC_cc_xp_fumbled_integration: "Die Vermessung unserer neuen Ländereien wurde mangelhaft durchgeführt, und jedes Amt, das sie seither konsultiert hat, hat die Fehler übernommen. Der Austausch des Ministers, der sie anordnete, korrigiert den Papierkram nicht."
 STATIC_MODIFIER_NAME_cc_abandoned_by_dependency: "Von einer Abhängigkeit verlassen"
 STATIC_MODIFIER_DESC_cc_abandoned_by_dependency: "Ein Untertan, auf den wir zählten, trat beiseite, als es darauf ankam. Der Hof bemerkte es, und jeder andere Untertan ebenfalls."
 STATIC_MODIFIER_NAME_cc_academy_exercises: "Akademische Übungen"
 STATIC_MODIFIER_DESC_cc_academy_exercises: "Die Regimenter drillen nun nach einem Lehrplan statt nach dem, woran sich der Oberst noch erinnert."
 STATIC_MODIFIER_NAME_cc_armed_independence_modifier: "Bewaffnet und unabhängig"
 STATIC_MODIFIER_DESC_cc_armed_independence_modifier: "Ein Reich, das seine eigene Freiheit errungen hat und die Waffen noch nicht niedergelegt hat."
 STATIC_MODIFIER_NAME_cc_court_intrigue_scandal: "Ein Skandal am Hofe"
 STATIC_MODIFIER_DESC_cc_court_intrigue_scandal: "Etwas wurde im falschen Raum gesagt und in den richtigen wiederholt. Der Adel genießt dies mehr als wir."
 STATIC_MODIFIER_NAME_cc_cultural_ally_modifier: "Ein verwandter Hof"
 STATIC_MODIFIER_DESC_cc_cultural_ally_modifier: "Ein ausländischer Hof, der unsere Sprache teilt und unsere Briefe ohne Übersetzer liest."
 STATIC_MODIFIER_NAME_cc_fortification_doctrine: "Eine Doktrin der Mauern"
 STATIC_MODIFIER_DESC_cc_fortification_doctrine: "Unsere Ingenieure arbeiten nach einem Standard, und eine Armee, die unsere Festungen angreift, bezahlt für den Boden doppelt."
 STATIC_MODIFIER_NAME_cc_independence_spirit: "Ein Geschmack nach Unabhängigkeit"
 STATIC_MODIFIER_DESC_cc_independence_spirit: "Die Idee, dass wir ohne einen Oberherrn auskommen könnten, hat sich verbreitet, und sie wird nicht stillschweigend verschwinden."
 STATIC_MODIFIER_NAME_cc_loyal_governor_support: "Ein loyaler Gouverneur"
 STATIC_MODIFIER_DESC_cc_loyal_governor_support: "Der Mann, den wir geschickt haben, gehört zu uns, die Provinz weiß es, und die Provinz hat aufgehört, diese Vereinbarung auf die Probe zu stellen."
 STATIC_MODIFIER_NAME_cc_magnates_progress_cabinet_efficiency: "Ein Kabinett der Magnaten"
 STATIC_MODIFIER_DESC_cc_magnates_progress_cabinet_efficiency: "Die Ämter werden von den Männern bekleidet, die das Land besitzen, und das Reich driftet in deren Richtung."
 STATIC_MODIFIER_NAME_cc_march_frontier_defense: "Eine bewachte Grenze"
 STATIC_MODIFIER_DESC_cc_march_frontier_defense: "Eine Mark hält die Grenze, und sie hält sie mit Männern, die das Gelände kennen."
 STATIC_MODIFIER_NAME_cc_merchant_trading_rights: "Handelsrechte gewährt"
 STATIC_MODIFIER_DESC_cc_merchant_trading_rights: "Unsere Kaufleute verkaufen zu Bedingungen, die jemand anderes für sie ausgehandelt hat."
 STATIC_MODIFIER_NAME_cc_order_progress_cabinet_efficiency: "Ein Kabinett der Beamten"
 STATIC_MODIFIER_DESC_cc_order_progress_cabinet_efficiency: "Die Ämter werden von den eigenen Männern der Krone besetzt, und das Reich driftet in deren Richtung."
 STATIC_MODIFIER_NAME_cc_palatinate_neutrality: "Eine neutrale Pfalz"
 STATIC_MODIFIER_DESC_cc_palatinate_neutrality: "Die Pfalz hält sich aus unseren Kriegen heraus. Sie behält auch ihre Aufgebote und reagiert verärgert auf Forderungen."
 STATIC_MODIFIER_NAME_cc_palatinate_war_banner: "Das Banner der Pfalz"
 STATIC_MODIFIER_DESC_cc_palatinate_war_banner: "Die Pfalz reitet mit uns, und sie reitet schwer."
 STATIC_MODIFIER_NAME_cc_reformed_scholarship: "Reformiertes Gelehrsamkeit"
 STATIC_MODIFIER_DESC_cc_reformed_scholarship: "Über die Schulen wurde gestritten, bis sie eine neue Form annahmen; daraus gingen sie schneller, gebildeter und schwerer zu skandalisieren hervor."
 STATIC_MODIFIER_NAME_cc_revolutionary_sympathies: "Revolutionäre Sympathien"
 STATIC_MODIFIER_DESC_cc_revolutionary_sympathies: "Jemand hat gelesen und das Gelesene weitergegeben. Der Adel und die Bauern sind aus gegensätzlichen Gründen unzufrieden."
 STATIC_MODIFIER_NAME_cc_scholastic_disputation: "Eine scholastische Disputation"
 STATIC_MODIFIER_DESC_cc_scholastic_disputation: "Ein Streit zwischen Doktoren, der sich als lohnenswert erwies. Die Universitäten haben davon profitiert."
 STATIC_MODIFIER_NAME_cc_standing_army_reform: "Ein stehendes Heer"
 STATIC_MODIFIER_DESC_cc_standing_army_reform: "Soldaten, die das ganze Jahr über Soldaten sind, das ganze Jahr über bezahlt werden und das ganze Jahr über gedrillt werden."
 STATIC_MODIFIER_NAME_cc_subject_loyal_bulwark: "Ein loyaler Bollwerk"
 STATIC_MODIFIER_DESC_cc_subject_loyal_bulwark: "Dieses Subjekt hat entschieden, dass unser Überleben und sein eigenes dieselbe Frage sind."
 STATIC_MODIFIER_NAME_cc_supply_reform: "Der Nachschubzug reformiert"
 STATIC_MODIFIER_DESC_cc_supply_reform: "Jemand hat die Wagen gezählt. Auf dem Marsch fallen weniger Männer aus als früher."
 STATIC_MODIFIER_NAME_cc_theological_condemnation: "Eine theologische Verurteilung"
 STATIC_MODIFIER_DESC_cc_theological_condemnation: "Ein Urteil wurde gefällt und riss einen ganzen Korpus an Gelehrsamkeit mit sich. Niemand schreibt derzeit mehr über dieses Thema."
 STATIC_MODIFIER_NAME_cc_wc_defensive_posture: "Eine defensive Haltung"
 STATIC_MODIFIER_DESC_cc_wc_defensive_posture: "Der Kriegsrat hat beschlossen, Grund und Boden zu halten statt ihn zu erobern, und der Boden hält."
 STATIC_MODIFIER_NAME_cc_wc_offensive_surge: "Ein offensiver Vorstoß"
 STATIC_MODIFIER_DESC_cc_wc_offensive_surge: "Der Kriegsrat hat sich zum Angriff entschlossen, und die Armee wurde entsprechend informiert."
