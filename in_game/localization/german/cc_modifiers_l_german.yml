 # Elite enclave / palatinate modifiers
 STATIC_MODIFIER_NAME_cc_enclave_court_favour: "Adlige Gunst am Hof"
 STATIC_MODIFIER_DESC_cc_enclave_court_favour: "Die führenden Familien der Enklave wurden mit Hofpositionen geehrt, was ihre Loyalität an die Krone bindet."
 STATIC_MODIFIER_NAME_cc_palatinate_tournament: "Pfalzturnier"
 STATIC_MODIFIER_DESC_cc_palatinate_tournament: "Das große Turnier des Pfalzgrafen hat den Ruhm des Reiches weit und breit verbreitet."
 STATIC_MODIFIER_NAME_cc_enclave_grand_tournament: "Großturnier"
 STATIC_MODIFIER_DESC_cc_enclave_grand_tournament: "Ein großes Turnier des berittenen Adels hat die Kavallerie des Reiches geschärft und das Prestige der Krone gesteigert."
 STATIC_MODIFIER_NAME_cc_noble_levy_call: "Adelsaufgebot"
 STATIC_MODIFIER_DESC_cc_noble_levy_call: "Die adlige Kavallerie hat dem Ruf unter den Waffen geantwortet – Eskadronen gepanzerter Reiter, gedrillt und eifrig, reiten unter unserem Banner."
 STATIC_MODIFIER_NAME_cc_palatinate_dynastic_prestige: "Dynastisches Band"
 STATIC_MODIFIER_DESC_cc_palatinate_dynastic_prestige: "Die Linie der Pfalz wurde in die Würde unserer Dynastie eingewebt und verleiht dem gesamten Hause Ansehen und Legitimität."
 STATIC_MODIFIER_NAME_cc_noble_feud: "Adelsfehde"
 STATIC_MODIFIER_DESC_cc_noble_feud: "Ein erbitterter Streit unter dem Hochadel schwelt ungehindert vor sich hin, was Prestige kostet, die Disziplin schwächt und die Stände verbittert."

