 # ============================================================
 # CABINET TRAIT — Federal Architect
 # ============================================================

 federal_architect: "Föderaler Architekt"
 desc_federal_architect: "Geprägt durch die Herausforderungen, ein Reich eher durch Konsens als durch Zwang zu regieren, hat dieser Berater seine Karriere der Theorie und Praxis der föderalen Verwaltung gewidmet. Er versteht es, ein vielfältiges Reich zusammenzuhalten – wie man genug Autonomie gewährt, damit sich die Untertanen beteiligt fühlen, während gleichzeitig genügend Integration beibehalten wird, sodass das Ganze mehr ist als die Summe seiner Teile."
 federal_architect_die_desc: "Die sorgfältige Arbeit am föderalen Aufbau, die sie aufrechterhielten, wird viele Hände benötigen, um fortgeführt zu werden. Ein Teil dessen, was sie aufgebaut haben, wird bleiben. Einiges wird vollständig davon abhängen, wer als Nächstes kommt."

 # cc_traits.40 event text
 cc_traits.40.title: "Ein Architekt der föderalen Ordnung"
 cc_traits.40.a: "Ja. Ernenne [minister.GetName] zum [ShowTraitName('federal_architect')] und beauftrage die Arbeit."
 cc_traits.40.b: "Das Reich wird durch Autorität zusammengehalten, nicht durch Verfassungen. Noch nicht."

 # ============================================================
 # MODIFIER NAMES — Imperial Federalization
 # ============================================================

 STATIC_MODIFIER_NAME_cc_federal_union_solidarity: "Solidarität der Föderalen Union"
 STATIC_MODIFIER_DESC_cc_federal_union_solidarity: "Ein föderales Mitglied hat in einem Moment der Krise seine Verbundenheit zur Union bekräftigt. Der Beweis gemeinsamer Loyalität stärkt das Ansehen des Reiches."

 STATIC_MODIFIER_NAME_cc_false_federation_exposed: "Aufgedeckte Täuschung"
 STATIC_MODIFIER_DESC_cc_false_federation_exposed: "Die Kluft zwischen den Versprechen der föderalen Mitgliedschaft und ihrer Realität ist unleugbar geworden. Die Glaubwürdigkeit des Reiches als Partner — während dieses Territoriums und andere zusehen — wurde beschädigt."

 STATIC_MODIFIER_NAME_cc_synergy_federal_compact: "Föderaler Pakt"
 STATIC_MODIFIER_DESC_cc_synergy_federal_compact: "Das föderale Parlament wurde durch einen Verfassungspakt formalisiert — ein gemeinsamer Rahmen, der den Mitgliedern eine echte Beteiligung an der Regierungsführung des Reiches gibt."
 cc_traits.40.desc: "[minister.GetName] hat seine Karriere damit verbracht, zu beobachten, wie das Imperium darum kämpft, seine vielfältigen Territorien zusammenzuhalten – die Kolonien, die mehr fordern, die Abhängigkeiten, die weniger missbilligen, die Klienten, die jedes Zugeständnis als Einladung für die nächste Forderung sehen. Wo die meisten Berater ein Problem der Autorität sehen, sieht [minister.GetName] ein Problem des Designs. Er hat an etwas gearbeitet: einem Rahmen für eine Regierungsführung durch Konsens statt Zwang, für den Aufbau föderaler Strukturen, die dauerhaft sind, weil sie wahrhaft geteilt werden. Er fragt, ob der Hof bereit ist, ernsthaft über die Zukunft des Imperiums nachzudenken."
