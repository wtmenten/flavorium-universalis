 # ============================================================
 # SUBJECT TYPE UI KEYS — Imperial Federalization
 # ============================================================

 imperial_council_member: "Mitglied des Imperialrats"
 LEAD_imperial_council_member: "Föderaler Oberherr"
 AM_imperial_council_member: "Mitglied des Imperialrats"
 CANCEL_imperial_council_memberTITLE: "Ratsmitgliedschaft auflösen"
 CANCEL_imperial_council_member_DESC: "Entzug der Einladung zum Kaiserrat, Beendigung der beratenden Beziehung und Rückgabe der vollen Unabhängigkeit an das ehemalige Mitglied."

 equal_federal_member: "Föderales Mitglied"
 LEAD_equal_federal_member: "Föderales Parlament"
 AM_equal_federal_member: "Föderales Mitglied"
 CANCEL_equal_federal_memberTITLE: "Bundesmitgliedschaft auflösen"
 CANCEL_equal_federal_member_DESC: "Löse den Bundespakt auf und beende die legislative und militärische Partnerschaft. Das Mitgliedsreich wird nicht vergessen, dass das Versprechen der Gleichberechtigung widerrufen wurde."

 lesser_federal_member: "Assoziiertes Mitglied"
 LEAD_lesser_federal_member: "Föderales Parlament"
 AM_lesser_federal_member: "Assoziiertes Mitglied"
 CANCEL_lesser_federal_memberTITLE: "Assoziierungsstatus entziehen"
 CANCEL_lesser_federal_member_DESC: "Beenden Sie die assoziierte Mitgliedschaft und führen Sie das Reich in seinen vorherigen Status zurück. Die durch die Behandlung als Bürger zweiter Klasse entstandenen Ressentiments lassen sich nicht so leicht auflösen."

 false_federal_member: "Inhaber der föderalen Charta"
 LEAD_false_federal_member: "Charta-Autorität"
 AM_false_federal_member: "Charta-Inhaber"
 CANCEL_false_federal_memberTITLE: "Föderalcharta widerrufen"
 CANCEL_false_federal_member_DESC: "Widerrufen Sie die Föderalcharta und beenden Sie die Vereinbarung. Die Bevölkerungsgruppen, denen eine gleichberechtigte Mitgliedschaft versprochen wurde, sie aber stattdessen nur Ausbeutung erfuhren, werden kaum dankbar sein."

 # Upgrade tooltip strings
 federal_member_upgrade_tt: "Dieses Mitglied wurde vor Kurzem in den Rat aufgenommen — der konstitutionelle Apparat für ein vollständiges föderales Upgrade wird noch eingerichtet."
 lesser_federal_member_upgrade_tt: "Dieses Mitglied wurde vor Kurzem in den Rat aufgenommen — der konstitutionelle Apparat für ein vollständiges föderales Upgrade wird noch eingerichtet."

 # ============================================================
 # ADVANCES — Imperial Federalization
 # ============================================================

 colonial_assembly_advance: "Kolonialversammlungen"
 colonial_assembly_advance_desc: "Errichten Sie repräsentative Versammlungen in unseren Kolonialgebieten, um der lokalen Führung eine formelle Stimme in der imperialen Verwaltung zu geben. Der erste Schritt zu einer dauerhafteren Beziehung mit den Kolonien."

 federal_constitution_advance: "Föderale Verfassung"
 federal_constitution_advance_desc: "Entwurf eines konstitutionellen Rahmens für eine imperiale Föderation, der Kolonialversammlungen einen legislativen Status innerhalb eines breiteren föderalen Parlaments einräumt. Öffnet den Weg zur Mitgliedschaft im Reichsrat und zur vollständigen föderalen Union."

 imperial_trade_compact_advance: "Imperialer Handelspakt"
 imperial_trade_compact_advance_desc: "Formalisiere eine reichsweite Präferenzhandelszone, die die Kolonien durch gemeinsame kommerzielle Interessen an die Metropole bindet. Die Sprache der Partnerschaft verschleiert die Sprache des Profits."

 false_federal_charter_advance: "Föderale Charta"
 false_federal_charter_advance_desc: "Bundeschartern an bestehende Kolonial- und Klientengebiete ausstellen. Diese Dokumente versprechen Mitgliedsrechte, während sie die Mechanismen der Extraktion bewahren. Eine Föderation dem Namen nach; ein Imperium in der Realität."

