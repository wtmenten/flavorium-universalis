l_german:
 # ============================================================
 # War Council Events (Pillar 04)
 # ============================================================

 # --- cc_wc.1 — The Council of War ---
 cc_wc.1.title: "Der Kriegsrat"
 cc_wc.1.desc: "[minister.GetName] beruft den Rat um die Kampagnenkarten. [minister.GetHerHis|c] Einschätzung der militärischen Lage bestimmt, welche Optionen dem Thron vorgelegt werden."

 cc_wc.1.a: "Setzt die Offensive fort — nutzt den Moment."
 cc_wc.1.a.tooltip: "Das Eintreten von [minister.GetName] für aggressive Feldzüge bestärkt das Heer. Die Moral steigt sprunghaft an, doch die strategische Überdehnung riskiert politische Instabilität im Inneren."

 cc_wc.1.b: "Raten Sie zu Geduld — lassen Sie den Feind ermüden."
 cc_wc.1.b.tooltip: "Die Doktrin der geduldigen Verteidigung des Ministers greift. Feindliche Kolonnen werden in unserem Territorium schwer leiden, und die Kosten für den Unterhalt unserer Festungen sinken."

 cc_wc.1.c: "Keinen Frieden schließen vor einem totalen Sieg."
 cc_wc.1.c.tooltip: "Die Forderung des Falken nach bedingungslosen Bedingungen mobilisiert den Hof. Prestige wächst, und die Minister sind verpflichtet, den Krieg bis zu seinem Abschluss durchzuführen."

 cc_wc.1.d: "Der Rat des Ministers stabilisiert den Feldzug."
 cc_wc.1.d.tooltip: "Fundierter professioneller Rat von [minister.GetName] bewahrt den Rat vor überstürzten Entscheidungen. Mit jedem geplanten Feldzug wächst die Erfahrung."

 # --- cc_wc.2 — Financing the War ---
 cc_wc.2.title: "Die Kriegsfinanzierung"
 cc_wc.2.desc: "Die Schatzkammer ist unter Druck. [minister.GetName] wurde einbestellt, um eine Lösung zu präsentieren – oder zumindest einen ehrlichen Bericht darüber abzugeben, wie prekär die Lage tatsächlich ist."

 cc_wc.2.a: "Presse die Bevölkerung aus – extrahiere, was benötigt wird."
 cc_wc.2.a.tooltip: "Der administrative Griff des Ministers presst zusätzliche Einnahmen aus dem Reich heraus. Der Groll der Bauern wächst, und die Stabilität bröckelt unter dem Druck."

 cc_wc.2.b: "Kriegsdarlehen aushandeln – Gold jetzt, Zinsen später."
 cc_wc.2.b.tooltip: "Der Minister vermittelt kurzfristige Finanzierungen von Handelshäusern und Geldleihern. Die Schatzkammer schwillt an, doch Inflation ist der unvermeidliche Begleiter von geliehenem Gold."

 cc_wc.2.c: "Überstehe den Mangel – kürze die Ausgaben und halte durch."
 cc_wc.2.c.tooltip: "Es bietet sich keine elegante Lösung an. Das Reich zieht den Gürtel enger, aber die Moral am Hof leidet unter der sichtbaren Schwäche."

 # --- cc_wc.3 — The General's Request ---
 cc_wc.3.title: "Die Bitte des Generals"
 cc_wc.3.desc: "[minister.GetName] hat dem Rat ein formelles Ersuchen vorgelegt: Der Feldzug benötigt mehr Ressourcen, wenn er erfolgreich sein soll. Die Krone muss entscheiden, ob die Armee oder die Schatzkammer Vorrang hat."

 cc_wc.3.a: "Gewähre die Ressourcen — lass die Armee ihre Arbeit tun."
 cc_wc.3.a.tooltip: "Verstärkungen, Vorräte und Münzen fließen an die Front. Die Moral der Armee steigt sprunghaft an, und [minister.GetName]'s Vertrauen in die Krone ist wiederhergestellt."

 cc_wc.3.b: "Ablehnen — die Schatzkammer kann dies nicht tragen."
 cc_wc.3.b.tooltip: "[minister.GetName] nimmt die Ablehnung mit kaum verhüllter Verachtung entgegen. [minister.GetHerHis|c] Meinung über das Engagement der Krone im Krieg ist dauerhaft geschwächt."

 # --- cc_wc.10 — Standing Army Reform ---
 cc_wc.10.title: "Der Vorschlag für ein stehendes Heer"
 cc_wc.10.desc: "Nachdem der Krieg beendet ist und die Lehren vom Schlachtfeld in [minister.GetName]'s Geist noch frisch sind, hat der Minister einen formellen Vorschlag ausgearbeitet: das feudale Aufgebotssystem durch ein professionelles stehendes Heer zu ersetzen, das von der Krone finanziert wird. Der Adel wird diesen Wechsel nicht begrüßen."

 cc_wc.10.a: "Setzen Sie die Reform des stehenden Heeres in Kraft."
 cc_wc.10.a.tooltip: "Eine stehende Armee wird aufgestellt – ausgebildet, unterhalten und allein der Krone treu. Disziplin und Manpower verbessern sich erheblich, aber der Adel verliert an Prestige und Rekrutierungsbefugnis."

 cc_wc.10.b: "Ablehnen — der Adel würde es nicht zulassen."
 cc_wc.10.b.tooltip: "Der Vorschlag wird auf Eis gelegt. Das Zeitfenster für Reformen schließt ohne Folgen."

 # --- cc_wc.11 — Supply Reform ---
 cc_wc.11.title: "Der Vorschlag zur Versorgungsreform"
 cc_wc.11.desc: "[minister.GetName] hat eine detaillierte Prüfung der logistischen Fehler des letzten Feldzugs vorgelegt. [minister.GetHerHis|c] Vorschlag für ein reformiertes Intendanturwesen würde die Verschwendung und den Abnutzungsverschleiß beseitigen, die die Armee so teuer zu stehen kamen – aber die Anfangsinvestition ist beträchtlich."

 cc_wc.11.a: "Finanziere die Reform des Intendanturwesens."
 cc_wc.11.a.tooltip: "Ein ordnungsgemäßes Intendanturwesen wird eingerichtet. Versorgungskolonnen halten nun mit der Armee Schritt, und die Verluste durch Abnutzung sinken in allen Kampagnen drastisch."

 cc_wc.11.b: "Die Kosten sind zu hoch — ablehnen."
 cc_wc.11.b.tooltip: "Der Vorschlag ist unter den derzeitigen Bedingungen zu teuer. Das Reformfenster schließt sich."

 # --- cc_wc.12 — Fortification Doctrine ---
 cc_wc.12.title: "Die Befestigungsdoktrin"
 cc_wc.12.desc: "Nachdem [minister.GetName] während des Feldzugs die Belagerungskunst des Gegners studiert hat, schlägt er eine umfassende Überarbeitung der Befestigungspolitik vor: standardisierte Bastionen, regelmäßige Garnisonswechsel und ein einheitlicher Wartungsplan. Es wird die Schatzkammer teuer zu stehen kommen, aber Feinde werden feststellen, dass unser Territorium weitaus kostspieliger zu durchqueren ist."

 cc_wc.12.a: "Investiere in die neue Befestigungsdoktrin."
 cc_wc.12.a.tooltip: "Unsere Festungen sind wiederaufgebaut und rationalisiert. Die Instandhaltungskosten sinken unter dem neuen Plan, und feindliche Armeen, die durch unser Territorium marschieren, werden für jede Meile bluten."

 cc_wc.12.b: "Zu teuer — lehne den Vorschlag ab."
 cc_wc.12.b.tooltip: "Die Reform wird aufgeschoben. Das Zeitfenster von fünf Jahren für Nachkriegsreformen schließt sich."

 # --- cc_wc.20 — Outdated General Resolution ---
 cc_wc.20.title: "Eine Ratsentscheidung über den alten General"
 cc_wc.20.desc: "Der Rat hat das Thema angesprochen, über das viele seit Monaten flüstern: Die Taktiken von [minister.GetName] gehören in eine frühere Zeit. Der Feldzug hat die Lücke zwischen [minister.GetHerHis] Methoden und dem modernen Schlachtfeld offengelegt. Die Minister schlagen einen formellen, würdevollen Ruhestand vor — doch dies wird nicht unbemerkt bleiben."

 cc_wc.20.a: "Entlassen Sie [minister.GetName] mit Ehren."
 cc_wc.20.a.tooltip: "Der Rat setzt den General formell aus dem aktiven Kommando zurück. Der Prestigeverlust durch die Entfernung eines Veteranen ist real, aber das Kabinett wird von einer veralteten Stimme befreit."

 cc_wc.20.b: "Lassen Sie [minister.GetName] den Feldzug beenden."
 cc_wc.20.b.tooltip: "Der alte Soldat kennt diese speziellen Schlachtfelder gut genug. Die Ehrerbietung des Rates bringt bescheidenes Ansehen ein – in der Loyalität liegt Würde."

 # ============================================================
 # War Council Modifier Names
 # ============================================================
 cc_wc_offensive_surge: "Offensivstoß"
 cc_wc_offensive_surge_desc: "Der Kriegsrat hat eine aggressive Vorwärtskampagne befürwortet. Die Armeemoral und die Erholung sind erhöht, solange der Vorstoß andauert."

 cc_wc_defensive_posture: "Defensive Haltung"
 cc_wc_defensive_posture_desc: "Der Kriegsrat rät zu Geduld. Feindliche Armeen erleiden beim Durchqueren unseres Territoriums schwere Abnutzung, und die Unterhaltskosten für Befestigungen werden reduziert."

 cc_standing_army_reform: "Reform des stehenden Heeres"
 cc_standing_army_reform_desc: "Ein professionelles stehendes Heer hat das alte Aufgebotsystem ersetzt. Die Disziplin ist strenger und die Manpower-Reserven sind gewachsen."

 cc_supply_reform: "Versorgungsreform"
 cc_supply_reform_desc: "Ein reformiertes Intendanturwesen hält die Armee im Feld versorgt. Die Truppenabnutzung wird erheblich reduziert."

 cc_fortification_doctrine: "Befestigungsdoktrin"
 cc_fortification_doctrine_desc: "Standardisierte Bastionen-Designs und Garnisonsrotationen machen unsere Befestigungen effizienter und unser Territorium kostspieliger zu invadieren."

 cc_wc_general_defied: "General hat widersprochen"

 # --- cc_wc.50 — The Hawk's Reckoning ---
 cc_wc.50.title: "Die Abrechnung des Falken"
 cc_wc.50.desc: "[minister.GetName] erhebt nicht [minister.GetHerHis] Stimme. [minister.GetSheHe] muss es nicht. Das Gelübde wurde in genau diesem Raum abgelegt – dass es keinen Frieden geben würde, der nicht ein totaler Sieg ist. Die Worte lagen uns zur Annahme oder Ablehnung vor, und wir haben sie angenommen. Nun ist die Depesche mit den Friedensbedingungen eingetroffen, und [minister.GetName] liest sie mit einem Gesichtsausdruck, der alles sagt, was [minister.GetSheHe] nicht laut aussprechen wird.\n\nWie wir in der nächsten Stunde reagieren, wird darüber entscheiden, ob dieses Ministerium das Ende des Krieges übersteht."

 cc_wc.50.a: "Der Friede war notwendig. [minister.GetName] wird das akzeptieren — oder einen anderen Posten suchen."
 cc_wc.50.a.tooltip: "Prestige durch die feste Herrschaft. [minister.GetName] akzeptiert dies nicht mit Würde — [minister.GetSheHe] wird dies noch eine Weile auf sich tragen."

 cc_wc.50.b: "Erkenne die Schwierigkeit an. Ehre [minister.GetHerHis] Dienst und Engagement."
 cc_wc.50.b.tooltip: "Ein moderater Prestigeverlust. [minister.GetName] erhält Anerkennung und wird dadurch fähiger. Die Spannung löst sich auf, wenn auch ohne eine saubere Lösung."

 cc_wc.50.c: "Kündige den nächsten Feldzug an. Gelobe ihn vor dem Rat."
 cc_wc.50.c.tooltip: "Ein öffentliches Versprechen, dass der nächste Krieg bis zum Ende geführt wird. Prestigeverlust – aber der Modifikator 'Offensivschub' spiegelt eine echte erneuerte militärische Entschlossenheit wider, und [minister.GetName] ist zufrieden."

 # --- cc_wc.51 — The General's Resentment ---
 cc_wc.51.title: "Der Groll des Generals"
 cc_wc.51.desc: "Der Groll von [minister.GetName] hatte Monate Zeit, um zu verfestigen. Die Ressourcen, die [minister.GetSheHe] vor dem Feldzug anforderte, wurden verweigert, und nun hatte [minister.GetSheHe] Zeit, die Kosten zu zählen — in Menschenleben, in verlorenem Terrain, in einem persönlichen Kassenbuch, das nicht aufgeht. [minister.GetSheHe] hat keine formelle Beschwerde eingereicht. [minister.GetSheHe] war schlimmer: vollkommen korrekt, präzise gehorsam und auf eine Weise kühl, die dem gesamten Kabinett aufgefallen ist.\n\nDas kann nicht so weitergehen, ohne dass daraus etwas Größeres wird."

 cc_wc.51.a: "Entschädigen Sie [minister.GetName]. Gold und eine formelle Anerkennung, dass die Ablehnung ein Fehler war."
 cc_wc.51.a.tooltip: "Eine materielle Einigung – [minister.GetName] erhält Gold und Anerkennung. Das Konto ist ausgeglichen und [minister.GetSheHe] wächst an dieser Lösung."

 cc_wc.51.b: "Gewähre [minister.GetName] eine symbolische Ehre vor dem Rat."
 cc_wc.51.b.tooltip: "Kostenlose Prestigeeinbußen für eine öffentliche Anerkennung. Die Beziehungen verbessern sich leicht, aber die zugrunde liegende Reibung wird eher zur Kenntnis genommen als gelöst."

 cc_wc.51.c: "Entlasse [minister.GetName]. Ein grollender General im Kabinett ist ein Risiko."
 cc_wc.51.c.tooltip: "Stabilitätskosten für die Störung. [minister.GetName] geht mit Groll in [minister.GetHerHis] Herzen – und wird möglicherweise Wege finden, diesen außerhalb des Kabinetts zum Ausdruck zu bringen."

 cc_wc.51.d: "Ignoriere es. Minister dienen nach Belieben der Krone, nicht umgekehrt."
 cc_wc.51.d.tooltip: "[minister.GetName] interpretiert das Schweigen richtig. [minister.GetHerHis] Fügsamkeit wird zu formalem Groll — das Kabinett wird bemerken, in welche Richtung sich die Dinge bewegt haben."
