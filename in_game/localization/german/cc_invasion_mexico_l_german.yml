 cc_mesoamerican_confederation: "Mesoamerikanische Konföderation"
 # ========================
 # IO UNITY MODIFIERS
 # ========================
 STATIC_MODIFIER_NAME_ccim_high_unity_bonus: "Konföderierte Stärke"
 ccim_high_unity_bonus: "Konföderierte Stärke"
 ccim_high_unity_bonus_desc: "Die mesoamerikanische Konföderation spricht mit einer Stimme. Unsere Krieger schöpfen Zuversicht aus dem unerschütterlichen Band zwischen unseren Völkern."
 STATIC_MODIFIER_NAME_ccim_low_unity_penalty: "Zerfall der Konföderation"
 ccim_low_unity_penalty: "Zerfall der Konföderation"
 ccim_low_unity_penalty_desc: "Spannungen innerhalb der Konföderation untergraben die Moral und schwächen die Rekrutierung. Die Einheit muss wiederhergestellt werden, bevor die Invasoren unsere Spaltungen ausnutzen."
 STATIC_MODIFIER_NAME_ccim_newly_joined_bonus: "Neues Konföderationsmitglied"
 ccim_newly_joined_bonus: "Neues Konföderationsmitglied"
 ccim_newly_joined_bonus_desc: "Ein neues Gefühl der Zielstrebigkeit folgt unserem Eintritt in die mesoamerikanische Konföderation. Unsere Krieger sind ermutigt und ihre Moral steigt."
 STATIC_MODIFIER_NAME_ccim_confederation_betrayer: "Verlassen der Konföderation"
 ccim_confederation_betrayer: "Verlassen der Konföderation"
 ccim_confederation_betrayer_desc: "Wir haben die mesoamerikanische Konföderation in ihrer Stunde der Not verlassen. Unsere Krieger sind demoralisiert und unser Ruf unter den indigenen Völkern ist geschädigt."
 STATIC_MODIFIER_NAME_ccim_war_council_boost: "Dekret des Kriegsrats"
 ccim_war_council_boost: "Dekret des Kriegsrats"
 ccim_war_council_boost_desc: "Der Kriegsrat der Konföderation hat ein Dekret zur Totalmobilmachung erlassen. Jeder Mitgliedstaat stellt seine Krieger einem gemeinsamen Ziel zur Verfügung."

 # ========================
 # IO LEADER ACTIONS
 # ========================
 ccim_io_war_council: "Kriegsrat einberufen"
 ccim_io_war_council_desc: "Berufe den Kriegsrat ein und erlasse ein Dekret zur Totalmobilmachung. Alle Konföderationsmitglieder erhalten einen Bonus auf die militärische Moral und das Aufgebot. Erfordert Kriegszustand. Kostet 15 Konföderations-Einheit. Kann für 5 Jahre nicht wiederholt werden."

 ccim_io_tribute_levy: "Konföderations tribut erheben"
 ccim_io_tribute_levy_desc: "Rufe das Recht auf Tributerhebung an. Jedes nicht führende Mitglied zahlt 20 Gold in die Kriegskasse des Anführers. Die Erhebung von Tribut belastet das gute Einvernehmen der Mitglieder. Kostet 10 Konföderations-Einheit. Kann nicht während eines Krieges verwendet werden. Kann für 8 Jahre nicht wiederholt werden."

 ccim_io_send_envoys: "Gesandte der Konföderation entsenden"
 ccim_io_send_envoys_desc: "Entsende Gesandte mit Geschenken und einer formellen Einladung an eine benachbarte unabhängige indigene Macht. Wenn sie annehmen, werden sie der mesoamerikanischen Konföderation beitreten. Kostet 50 Gold und 10 Konföderations-Einheit. Kann für 3 Jahre nicht wiederholt werden."

 ccim_io_strike_invaders: "Schlag gegen die Invasoren"
 ccim_io_strike_invaders_desc: "Das Kriegsmandat der Konföderation gegen eine benachbarte Kolonialmacht aussprechen. Wenn bereits ein Casus Belli gegen das Ziel besteht, wird sofort der Krieg erklärt und alle Mitglieder erhalten einen Kampfbonus. Andernfalls wird der Casus Belli für die spätere Nutzung gewährt. Erhält 20 Konföderations-Einheit. Kann für 10 Jahre nicht wiederholt werden."

 ccim_io_absorb_tribe: "Einen benachbarten Stamm absorbieren"
 ccim_io_absorb_tribe_desc: "Nutzen Sie die Autorität der Konföderation, um eine benachbarte unabhängige indigene Nation diplomatisch zu absorbieren und deren Ländereien in das Reich des Anführers einzugliedern. Kostet 25 Konföderations-Einheit. Kann für 15 Jahre nicht wiederholt werden."

 # Action target choice UI
 ccim_choose_envoy_target: "Wähle eine indigene Nation zur Einladung"
 ccim_choose_strike_target: "Wähle eine Kolonialmacht, die angegriffen werden soll"
 ccim_choose_absorb_target: "Wähle einen benachbarten Stamm zur Absorption"

 # CB
 cc_repel_invaders: "Vertreiben Sie die Invasoren"
 cc_repel_invaders_desc: "Die mesoamerikanische Konföderation hat ein Mandat zur Vertreibung der Kolonialstreitkräfte aus den heiligen Ländern Mesoamerikas erlassen."

 # ========================
 # EVENTS 60–63 (IO Confederation)
 # ========================
 cc_invasion_mexico.60.title: "Der Konföderationsrat berät"
 cc_invasion_mexico.60.desc: "Die Jahreszeit hat gewechselt, und die Anführer der Konföderation sind zusammengekommen. Als Oberhaupt richten alle Augen auf Euch: Worauf soll die Konföderation ihre Energie in den kommenden Monaten konzentrieren? Auf Krieg und Bereitschaft oder auf die Stärkung der Bande zwischen unseren Völkern?"
 cc_invasion_mexico.60.a: "Konzentrieren wir unsere Bemühungen auf die militärische Bereitschaft – die Invasoren werden nicht warten."
 cc_invasion_mexico.60.b: "Investiere in die Bande zwischen unseren Völkern. Einheit ist unsere größte Waffe. [Root.GetTreasuryCost(40)|Y]"
 cc_invasion_mexico.60.c: "Sende Gesandte zu einem benachbarten Volk – erweitere die Reichweite der Konföderation."

 cc_invasion_mexico.61.title: "Die Konföderation zerbricht"
 cc_invasion_mexico.61.desc: "Beunruhigende Depeschen treffen aus der gesamten Konföderation ein. Streitigkeiten über Ressourcen, Autorität und Verpflichtungen sind eskaliert. Einige Mitgliedstaaten erwägen einen Austritt. Die Konföderation, die als Bollwerk gegen Eroberungen diente, könnte sich von innen heraus zerreißen, wenn wir nicht handeln."
 cc_invasion_mexico.61.a: "Berufe einen Notrat ein. Verbinde die Völker – ungeachtet der Kosten. [Root.GetTreasuryCost(60)|Y]"
 cc_invasion_mexico.61.b: "Lasst die Spannungen ihren Lauf nehmen. Wahre Einheit lässt sich nicht erzwingen."

 cc_invasion_mexico.62.title: "Der Hohepriester segnet die Konföderation"
 cc_invasion_mexico.62.desc: "Der Hohepriester hat die Anführer der Konföderation in den heiligen Bezirk zu einer Zeremonie der Einheit und des göttlichen Beistands gerufen. Trommeln schlagen, Weihrauch erfüllt die Luft und Priester lesen die Omen für die gesamte Konföderation. Ob wir die Zeremonie vollumfänglich ehren oder sie aus praktischen Gründen aufschieben, dieser Moment verlangt nach einer Antwort."
 cc_invasion_mexico.62.a: "Ehre die Zeremonie in vollem Umfang. Die Götter all unserer Völker sollen uns segnen."
 cc_invasion_mexico.62.b: "Sende unsere Grüße, aber unsere Krieger brauchen Taten, keine Gebete."

 cc_invasion_mexico.63.title: "Gesandte der mesoamerikanischen Konföderation"
 cc_invasion_mexico.63.desc: "Eine Delegation trifft ein und bringt Geschenke aus Jade, Federn und Getreide mit – sowie eine formelle Einladung. Die mesoamerikanische Konföderation bietet uns einen Platz unter ihren Mitgliedstaaten an: gemeinsame Verteidigung, gegenseitige Hilfe und der Schutz einer vereinten indigenen Front gegen die fremden Invasoren, die von der Küste her drücken. Es ist ein Angebot, das es wert ist, sorgfältig abgewogen zu werden."
 cc_invasion_mexico.63.a: "Wir nehmen die Einladung an. Unser Volk wird der Konföderation beistehen."
 cc_invasion_mexico.63.b: "Wir lehnen ab. Unser Weg ist es, ihn selbst zu wählen."

 # ========================
 # EVENT 64 — The Fall of Our Neighbors (fear cascade)
 # ========================
 cc_invasion_mexico.64.title: "Der Fall unserer Nachbarn"
 cc_invasion_mexico.64.desc: "Ein benachbartes Volk wurde von den Invasoren unterworfen. Ihre Krieger besiegt, ihre Häuptlinge gedemütigt, ihr Land an fremde Herren verteilt. Die Gesandten der Konföderation drängen mit neuer Dringlichkeit auf ihre Sache: 'Ihr habt gesehen, was mit denen geschieht, die alleine stehen. Unser Angebot wird nicht ewig gelten.'"
 cc_invasion_mexico.64.a: "Ihr Schicksal hat uns entschieden. Wir treten der Konföderation bei."
 cc_invasion_mexico.64.b: "Wir werden unsere eigenen Bedingungen mit den Invasoren aushandeln."

 # ========================
 # EVENT 70 — The Hour of Conquest (Colonial War Push)
 # ========================
 cc_invasion_mexico.70.title: "Die Stunde der Eroberung"
 cc_invasion_mexico.70.desc: "Unsere Kommandeure drängen mit zunehmender Beharrlichkeit: Wir besitzen einen Casus Belli, unsere Streitkräfte sind versammelt, und die einheimischen Mächte werden mit jeder Saison, die wir zögern, stärker. Das Zeitfenster der Gelegenheit ist offen — aber Fenster bleiben nicht ewig offen."
 cc_invasion_mexico.70.a: "Geben Sie den Befehl. Beginnen Sie den Feldzug."
 cc_invasion_mexico.70.b: "Wir müssen zuerst unsere Position konsolidieren."

 # Situation end reason descriptions
 ccim_end_year_limit: "Die Ära der Eroberung ist vorbei – das Jahr 1600 ist erreicht."
 ccim_end_natives_subjugated: "Alle unabhängigen einheimischen Mächte in Mesoamerika wurden unterworfen oder zerstört."
