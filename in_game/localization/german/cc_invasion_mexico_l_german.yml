l_german:

 # ========================
 # SITUATION
 # ========================
 cc_invasion_mexico: "Invasion von Mexiko"
 cc_invasion_mexico_desc: "Kolonialmächte von fernen Küsten haben das Herzland von Mesoamerika erreicht. Die großen Reiche der Azteken, Maya und ihrer Verwandten stehen vor einer existenziellen Bedrohung. Werden die indigenen Völker eine Einheit gegen die Invasoren bilden, oder wird das Zeitalter der Eroberung diese alten Zivilisationen für immer verschlingen?"

 # ========================
 # GAME RULE
 # ========================
 cc_invasion_mexico_rule: "Invasion von Mexiko"
 cc_invasion_mexico_rule_desc: "Steuert, ob die Situation 'Invasion von Mexiko' ausgelöst werden kann, was Flavor-Events, benutzerdefinierte Casus Belli und Aktionen im Situationspanel für koloniale und indigene Mächte hinzufügt."
 cc_invasion_mexico_on: "Aktiviert (Historisch)"
 cc_invasion_mexico_on_desc: "Die Situation „Invasion von Mexiko“ wird ausgelöst, wenn die Triggerbedingungen erfüllt sind."
 cc_invasion_mexico_off: "Deaktiviert"
 cc_invasion_mexico_off_desc: "Die Situation „Invasion von Mexiko“ wird niemals ausgelöst."

 # ========================
 # HINT
 # ========================
 hint_cc_invasion_mexico: "Die Situation „Invasion von Mexiko“ repräsentiert die spanische Eroberung Mesoamerikas. Kolonialmächte können spezielle Casus Belli gegen einheimische Nationen erhalten und Expeditionen über das Situationsfenster beauftragen. Einheimische Mächte können sich zur gegenseitigen Verteidigung in der mesoamerikanischen Konföderation vereinen oder Tribut anbieten, um Aggressionen vorzubeugen. Die Situation endet, wenn alle unabhängigen einheimischen Mächte unterworfen sind oder das Jahr 1600 erreicht ist."

 # ========================
 # EVENT 1 — Announcement
 # ========================
 cc_invasion_mexico.1.title: "Das Zeitalter der Eroberung beginnt"
 cc_invasion_mexico.1.desc_native: "Die Nachricht verbreitet sich schnell in unseren Landen: Ausländische Schiffe sind gelandet und fremde Soldaten marschieren ins Landesinnere. Diese Invasoren kommen nicht als Händler, sondern als Eroberer, bewaffnet mit Stahl und Feuer. Wie wir jetzt reagieren, könnte über das Schicksal unserer Zivilisation entscheiden."
 cc_invasion_mexico.1.desc_colonial: "Unsere Entdecker haben die großen Festlandimperien der Neuen Welt erreicht. Städte aus Gold und Silber liegen in greifbarer Nähe. Die einheimischen Völker sind zahlreich und kriegerisch, aber sie sind gespalten — und wir sind entschlossen. Das Zeitalter der Eroberung hat begonnen."
 cc_invasion_mexico.1.a: "Wir werden diesem Moment begegnen."

 # ========================
 # EVENTS 2–4 — Federation Requests
 # ========================
 cc_invasion_mexico.2.title: "Das Reich am Scheideweg"
 cc_invasion_mexico.2.desc: "Seltsame Männer mit Donnerwaffen sind an Land gegangen – und sprechen bereits davon, unser Land für ihr Eigen zu beanspruchen. Gesandte treffen ein und schlagen eine große Konföderation der indigenen Völker vor. Doch unsere Herren hinterfragen, ob dieses Reich sich einer Allianz beugen sollte oder ob unsere eigenen Mauern und Krieger ausreichen, um dieser Bedrohung zu begegnen."
 cc_invasion_mexico.2.a: "Wir werden dieses Bündnis schmieden und anführen."
 cc_invasion_mexico.2.b: "Das Reich steht allein durch seine eigene Stärke."

 cc_invasion_mexico.3.title: "Alte Rivalen, neue Bedrohungen"
 cc_invasion_mexico.3.desc: "Gesandte treffen ein und schlagen eine Konföderation der Völker dieses Landes vor. Seit Generationen standen wir getrennt von — und zeitweise gegen — diejenigen, die uns nun dieses Angebot machen. Doch die ausländischen Soldaten unterscheiden nicht zwischen uns, wenn sie marschieren. Vielleicht wiegen alte Groll weniger schwer als das Überleben."
 cc_invasion_mexico.3.a: "Legen wir alte Rivalitäten beiseite. Wir schließen uns an."
 cc_invasion_mexico.3.b: "Wir vertrauen keinem Bündnis, das von unseren alten Rivalen geschmiedet wurde."

 cc_invasion_mexico.4.title: "Der Rat berät"
 cc_invasion_mexico.4.desc: "Unsere Kriegshäuptlinge und Priester sind zusammengekommen. Gesandte bringen großzügige Bedingungen – gegenseitigen Schutz, gemeinsame Ressourcen, eine vereinte Front. Doch unsere Ältesten erinnern sich an das letzte Mal, als wir unser Schicksal einer größeren Macht anvertrauten. Der Rat ist gespalten zwischen denen, die Sicherheit in der Überzahl sehen, und denen, die raten, dass unser Schicksal in unseren eigenen Händen liegt."
 cc_invasion_mexico.4.a: "Die Zahlen sprechen für sich. Wir schließen uns an."
 cc_invasion_mexico.4.b: "Unser Schicksal liegt in unseren eigenen Händen."

 # ========================
 # EVENT 5 — Defensive Preparation
 # ========================
 cc_invasion_mexico.5.title: "Ausländische Soldaten an der Grenze"
 cc_invasion_mexico.5.desc: "Späher berichten, dass Kolonialsoldaten Ländereien am Rande unseres Territoriums besetzt haben. Ihre Waffen sind seltsam und ihre Zahl wächst. Wir müssen entscheiden, wie wir auf diese Bedrohung reagieren, bevor sie direkt vor unserer Haustür steht."
 cc_invasion_mexico.5.a: "Unsere Befestigungen verstärken und unsere Krieger zusammenziehen."
 cc_invasion_mexico.5.b: "Sicherheit im Bündnis suchen – der Konföderation beitreten."

 # ========================
 # EVENTS 10–12 — Monthly Confederate Events
 # ========================
 cc_invasion_mexico.10.title: "Die Konföderation hält stand"
 cc_invasion_mexico.10.desc: "Trotz des Drucks der Invasion bleiben die Bande unserer Konföderation stark. Waren, Krieger und Nachrichten fließen zwischen unseren Völkern. Gemeinsam sind wir etwas, dem die Kolonisatoren bisher noch nicht gegenüberstanden."
 cc_invasion_mexico.10.a: "Unsere Einheit ist unsere größte Waffe."

 cc_invasion_mexico.11.title: "Spannungen innerhalb der Konföderation"
 cc_invasion_mexico.11.desc: "Die Last der Konföderation wird schwer. Rivalisierende Anführer streiten um die Autorität, und einige unserer Leute hinterfragen, ob dieses Bündnis wirklich unseren Interessen dient. Die koloniale Bedrohung ist nicht verschwunden, aber auch der alte Ehrgeiz ist es nicht."
 cc_invasion_mexico.11.a: "Wir halten die Reibereien aus. Die Einheit muss gewahrt bleiben."
 cc_invasion_mexico.11.b: "Diese Konföderation ist unsere Unterwerfung nicht wert. Wir ziehen uns zurück."

 cc_invasion_mexico.12.title: "Die Kolonisatoren fordern Tribut"
 cc_invasion_mexico.12.desc: "Gesandte der benachbarten Kolonialmacht treffen mit einer unmissverständlichen Botschaft ein: Sendet Tribut oder tragt die Konsequenzen. Unsere Schatzkammer ist erschöpft, doch ebenso unser Stolz. Wie sollen wir reagieren?"
 cc_invasion_mexico.12.a: "Den Tribut zahlen. Das verschafft uns Zeit."
 cc_invasion_mexico.12.b: "Wir werden uns keiner Erpressung beugen."

 # ========================
 # EVENT 20 — Colonial Neighbor Interaction
 # ========================
 cc_invasion_mexico.20.title: "Die indigene Grenze"
 cc_invasion_mexico.20.desc: "Unsere Streitkräfte teilen nun eine Grenze mit einem der großen einheimischen Imperien Mesoamerikas. Sie beobachten uns von jenseits der Grenzlinie aus. Wie sollen wir auf sie zugehen?"
 cc_invasion_mexico.20.a: "Einen Gesandten mit Gaben entsenden – lassen wir die Diplomatie den Weg weisen."
 cc_invasion_mexico.20.b: "Erheben Sie einen Anspruch auf ihre Ländereien. Die Eroberung wird folgen, wenn wir bereit sind."

 # ========================
 # EVENT 21 — Native Response to Colonial Envoy
 # ========================
 cc_invasion_mexico.21.title: "Der Gesandte kehrt zurück"
 cc_invasion_mexico.21.desc_default: "Unsere diplomatische Mission ist vom einheimischen Hof zurückgekehrt. Man empfing sie mit Neugier — und Vorsicht. Der Grundstein für zukünftige Verhandlungen ist gelegt."
 cc_invasion_mexico.21.desc_conf: "Unser Gesandter wurde an der Grenze von einer konföderierten Garde empfangen und unter strenger Bewachung zum Hof des Herrschers geleitet. Unsere Diplomatie hinterließ einen gewissen Eindruck, aber der Schatten der Konföderation ist lang."
 cc_invasion_mexico.21.a: "Ein vielversprechender Beginn."

 # ========================
 # EVENT 25 — Commission Expedition (Monthly)
 # ========================
 cc_invasion_mexico.25.title: "Berichte aus dem Inneren"
 cc_invasion_mexico.25.desc: "Unsere Agenten sind von der Erkundung des Hinterlandes zurückgekehrt. Riesige Städte, Gold- und Nahrungsmittelvorräte und eine für die Unterwerfung reife Bevölkerung — alles in Reichweite. Sollen wir eine formelle Expedition beauftragen, um unseren Anspruch geltend zu machen?"
 cc_invasion_mexico.25.a: "Beauftragen Sie die Expedition sofort."
 cc_invasion_mexico.25.b: "Der Moment ist noch nicht gekommen."

 # ========================
 # EVENT 26 — Protectorate Offer Response
 # ========================
 cc_invasion_mexico.26.title: "Das Angebot der Kolonisatoren"
 cc_invasion_mexico.26.desc: "Ein mächtiger Kolonialherr hat Gesandte mit einem bemerkenswerten Vorschlag entsandt: Anstatt einer Eroberung könnten wir einen Schutzstatus akzeptieren – wobei wir unsere Bräuche, unsere Herrscher und unser Land unter ihrer nominellen Oberhoheit behalten. Es ist ein bitterer Kelch. Aber ist das Überleben den Preis wert?"
 cc_invasion_mexico.26.a: "Wir akzeptieren. Das Überleben unseres Volkes muss an erster Stelle stehen."
 cc_invasion_mexico.26.b: "Wir lehnen ab. Es ist besser, kämpfend zu fallen, als sich zu beugen."

 # ========================
 # EVENT 30 — Expedition Departs
 # ========================
 cc_invasion_mexico.30.title: "Die Expedition bricht auf"
 cc_invasion_mexico.30.desc: "Kapitäne und Soldaten wurden versammelt, Vorräte geladen und Banner gehisst. Die Expedition in das Herz Mesoamerikas bricht mit großer Zeremonie und hohen Erwartungen auf. Ruhm – und Beute – erwarten uns."
 cc_invasion_mexico.30.a: "Wenn Gott will, werden sie siegreich zurückkehren."

 # ========================
 # EVENTS 35–36 — End Events
 # ========================
 cc_invasion_mexico.35.title: "Das Zeitalter der Eroberung geht zu Ende"
 cc_invasion_mexico.35.desc_free: "Die Ära der großen Invasion ist zu Ende gegangen, doch unser Volk überdauert. Wir haben überlebt, wo andere fielen. Was auch immer als Nächstes kommt, unsere Zivilisation hat ihre Widerstandsfähigkeit bewiesen."
 cc_invasion_mexico.35.desc_subject: "Das Zeitalter der Eroberung ist zu Ende gegangen. Unsere Ländereien gehören nicht mehr uns, und unser Volk muss lernen, unter einem fremden Himmel zu leben. Die alte Welt ist verschwunden. Eine neue – schmerzhaft, ungewiss – beginnt."
 cc_invasion_mexico.35.a: "Wir halten durch."

 cc_invasion_mexico.36.title: "Die Eroberung Mesoamerikas"
 cc_invasion_mexico.36.desc_conqueror: "Die großen indigenen Imperien Mesoamerikas wurden gebrochen. Ihre Völker dienen nun unter unserem Banner, ihr Reichtum fließt in unsere Schatzkammern. Die Geschichte wird dies als das Zeitalter in Erinnerung behalten, in dem die Neue Welt zu unserer eigenen gemacht wurde."
 cc_invasion_mexico.36.desc_observer: "Der Kampf um Mesoamerika ist zu Ende gegangen. Andere haben seine Reichtümer beansprucht, doch der Wohlstand und das Beispiel der Eroberung werden über Generationen hinweg in der Kolonialwelt nachhallen."
 cc_invasion_mexico.36.a: "Eine neue Ära beginnt."

 # ========================
 # CASUS BELLI
 # ========================
 cc_seize_mexico_native: "Koloniale Eroberung"
 cc_seize_mexico_native_PROV: "Koloniale Eroberung (Provinz)"
 cc_seize_mexico_native_desc: "Gemäß der Entdeckungsdoktrin beansprucht diese Kolonialmacht das Recht, die indigenen Völker Mesoamerikas zu unterwerfen. Es entsteht kein Antagonismus — diese Eroberung wird nach kolonialem Recht als rechtmäßig angesehen."

 cc_seize_mexico_colonial: "Konkurrierende Kolonialansprüche"
 cc_seize_mexico_colonial_PROV: "Konkurrierende Kolonialansprüche (Provinz)"
 cc_seize_mexico_colonial_desc: "Zwei Kolonialmächte streiten um die Vorherrschaft über denselben Winkel der Neuen Welt. Es entsteht kein Antagonismus, obwohl die Kosten für die Durchsetzung eines Vasallenverhältnisses aufgrund des konkurrierenden Anspruchs des Rivalen höher sein werden."

 # ========================
 # GENERIC ACTIONS
 # ========================
 ccim_call_confederation: "Aufruf zur Konföderation"
 ccim_call_confederation_desc: "Vereint die Ureinwohner Mesoamerikas in einer Verteidigungskonföderation. Erstellt die mesoamerikanische Konföderation IO, falls diese nicht existiert, oder tritt ihr bei. Verbündete indigene Nachbarn werden eingeladen beizutreten. Kostet Prestige. Kann für 10 Jahre nicht wiederholt werden."
 ccim_call_confederation_create_tt: "Gründet die mesoamerikanische Konföderation als Gründungsmitglied oder tritt ihr bei, falls sie bereits existiert."

 ccim_offer_tribute: "Tribut anbieten"
 ccim_offer_tribute_desc: "Sende Gold an eine benachbarte Kolonialmacht im Austausch für verbesserte Beziehungen und einen vorübergehenden Aufschub von Aggressionen. Entfernt alle Casus Belli, die diese Macht gegen uns hält. Kann für 5 Jahre nicht wiederholt werden."

 ccim_commission_expedition: "Expedition beauftragen"
 ccim_commission_expedition_desc: "Verbrauche Gold, um eine Expedition in natives Territorium zu entsenden, was für 8 Jahre einen Casus Belli gegen eine gewählte native Nation gewährt. Kann für 5 Jahre nicht wiederholt werden."

 ccim_negotiate_protectorate: "Protektorat aushandeln"
 ccim_negotiate_protectorate_desc: "Wenden Sie sich mit Bedingungen für ein Vasallenverhältnis an eine indigene Macht. Der indigene Herrscher erhält ein Ereignis und kann annehmen oder ablehnen. Erfordert nicht-feindselige Beziehungen. Kann für 8 Jahre nicht wiederholt werden."

 # ========================
 # SITUATION PANEL UI
 # ========================
 CCIM_CONFEDERATION_PANEL_HEADER: "Mesoamerikanische Konföderation"
 CCIM_SITUATION_OVERVIEW_HEADER: "Der Kampf um Mesoamerika"
 CCIM_SITUATION_OVERVIEW_DESC: "Kolonialmächte dringen von der Küste aus nach Mesoamerika vor. Indigene Nationen können sich in der Konföderation vereinen oder Tributabkommen anstreben. Nutzen Sie die Situationskarte, um zu sehen, welche Gebiete von welcher Seite gehalten werden. Kolonialmächte können Expeditionen beauftragen und Protektorate aushandeln; indigene Mächte können zur Konföderation aufrufen oder Tribut anbieten."

 # Map legend
 CCIM_CONFEDERATION_LEGEND: "Mesoamerikanische Konföderation"
 CCIM_NATIVE_UNAFFILIATED_LEGEND: "Unabhängiger indigener Staat"

 # Map tooltips
 ccim_confederation_member_tt: "Dieses Land gehört einem Mitglied der mesoamerikanischen Konföderation."
 ccim_native_unaffiliated_tt: "Dieses Land gehört einem unabhängigen einheimischen Staat."
 ccim_colonial_power_tt: "Dieses Land wird von einer Kolonialmacht kontrolliert."

 # Situation explanation tooltip (appears on event 1 option)
 ccim_situation_explanation_tt: "Die Situation „Invasion von Mexiko“ ist nun aktiv. Einheimische Mächte können eine mesoamerikanische Konföderation bilden und über das Situationsfenster Tribut anbieten. Kolonialmächte können Expeditionen beauftragen und Protektorate aushandeln."

 # No confederation exists tooltip
 ccim_no_confederation_exists_tt: "Die mesoamerikanische Konföderation wurde noch nicht gebildet. Zuerst muss eine bedeutende indigene Macht dazu aufrufen."

 # Generic action error tooltips
 ccim_offer_tribute_no_target_tt: "Es wurde keine gültige Kolonialmacht ausgewählt, der Tribut angeboten werden könnte."
 ccim_commission_expedition_no_target_tt: "Es wurde kein gültiges indigenes Ziel für die Expedition ausgewählt."
 ccim_negotiate_protectorate_no_target_tt: "Es wurde keine gültige indigene Macht für Protektoratsverhandlungen ausgewählt."

 # Biases (opinion modifiers)
 opinion_ccim_tribute_received: "Tribut erhalten"
 opinion_ccim_diplomatic_approach: "Diplomatische Annäherung"
 opinion_ccim_tribute_paid: "Tribut gezahlt"

 # Event target selection UI
 ccim_choose_tribute_target: "Wähle eine Kolonialmacht, an die Tribut gesendet werden soll"
 ccim_choose_expedition_target: "Wähle eine indigene Nation als Ziel"
 ccim_choose_protectorate_target: "Wähle eine indigene Nation, auf die zugegangen werden soll"

 # IO opinion modifier (required by the IO engine)
 io_opinion_cc_mesoamerican_confederation: "Mitglied derselben Konföderation"

 # Country modifiers
 STATIC_MODIFIER_NAME_ccim_defensive_preparations: "Defensive Vorbereitungen"
 ccim_defensive_preparations: "Defensive Vorbereitungen"
 ccim_defensive_preparations_desc: "Unsere Armeen sind aufmarschiert und unsere Grenzen sind im Erwartung kolonialer Aggression befestigt."
 STATIC_MODIFIER_NAME_ccim_confederation_solidarity: "Solidarität der Konföderation"
 ccim_confederation_solidarity: "Solidarität der Konföderation"
 ccim_confederation_solidarity_desc: "Die Bande der mesoamerikanischen Konföderation stärken unsere Entschlossenheit und schärfen unsere Krieger."
 STATIC_MODIFIER_NAME_ccim_expedition_morale: "Expeditionsmoral"
 ccim_expedition_morale: "Expeditionsmoral"
 ccim_expedition_morale_desc: "Eine frisch beauftragte Expedition bricht auf, voller Entschlossenheit und Ehrgeiz."
 STATIC_MODIFIER_NAME_ccim_contested_claims: "Umstrittene Kolonialansprüche"
 ccim_contested_claims: "Umstrittene Kolonialansprüche"
 ccim_contested_claims_desc: "Zwei Kolonialmächte konkurrieren um denselben Winkel der Neuen Welt, was die Unterwerfung kostspieliger als gewöhnlich macht."
 STATIC_MODIFIER_NAME_ccim_divine_blessing: "Segen der Götter"
 ccim_divine_blessing: "Segen der Götter"
 ccim_divine_blessing_desc: "Heilige Zeremonien haben die Herzen der Krieger ergriffen. Die Götter unserer Vorfahren marschieren mit uns."
 STATIC_MODIFIER_NAME_ccim_sacred_fortifications: "Befestigte heilige Stätten"
 ccim_sacred_fortifications: "Befestigte heilige Stätten"
 ccim_sacred_fortifications_desc: "Unsere heiligsten Stätten wurden verstärkt. Ihre Mauern werden jeden Invasoren verlangsamen, der es wagt, sich ihnen zu nähern."
 STATIC_MODIFIER_NAME_ccim_native_weakness: "Gespaltenes Konsilium"
 ccim_native_weakness: "Gespaltenes Konsilium"
 ccim_native_weakness_desc: "Bestechungen und Versprechen haben Zwietracht unter den Adelsfraktionen gesät. Die Befehle des Herrschers verhallen ungehört."
 STATIC_MODIFIER_NAME_ccim_tribute_windfall: "Tribut-Windfall"
 ccim_tribute_windfall: "Tribut-Windfall"
 ccim_tribute_windfall_desc: "Das aus unseren mesoamerikanischen Besitzungen gewonnene Gold fließt in die Schatzkammer und bereichert den Feldzug."
 STATIC_MODIFIER_NAME_ccim_refugee_influx: "Flüchtlingskrieger"
 ccim_refugee_influx: "Flüchtlingskrieger"
 ccim_refugee_influx_desc: "Überlebende gefallener Nachbarvölker haben unsere Reihen mit wehrhaften Kriegern gefüllt, die nach Rache dürsten."

 # Opinion modifiers (new)
 opinion_ccim_bribed_noble: "Adelsfraktion bestochen"

 # ========================
 # NEW GENERIC ACTIONS
 # ========================
 ccim_fortify_sacred_sites: "Befestige heilige Stätten"
 ccim_fortify_sacred_sites_desc: "Beauftragen Sie die Verstärkung Ihrer heiligen Stätten und Grenzfestungen. Gewährt einen defensiven Befestigungsmodifier und segnet alle Mitglieder der Konföderation mit göttlichem Schutz. Kostet 60 Gold. Kann für 8 Jahre nicht wiederholt werden."

 ccim_seek_tribal_alliance: "Stammesbündnis suchen"
 ccim_seek_tribal_alliance_desc: "Sende Abgesandte an eine benachbarte unabhängige indigene Nation und dränge sie, der mesoamerikanischen Konföderation beizutreten. Sie werden das Angebot prüfen und möglicherweise annehmen. Erfordert die Mitgliedschaft in der Konföderation. Kann für 10 Jahre nicht wiederholt werden."

 ccim_extract_tribute: "Tribut einfordern"
 ccim_extract_tribute_desc: "Fordern Sie Tributzahlungen von Ihren mesoamerikanischen Territorien. Erhalten Sie Gold für jeden besessenen Ort in der Region und wenden Sie einen kurzen Einkommenszuwachs an. Kann für 8 Jahre nicht wiederholt werden."

 ccim_bribe_noble_faction: "Adelsfraktion bestechen"
 ccim_bribe_noble_faction_desc: "Verbrauche Gold, um interne Zwietracht unter dem Adel einer nativen Macht zu säen. Das Ziel erleidet für 4 Jahre einen schwächenden Modifikator. Kostet 80 Gold. Kann für 10 Jahre nicht wiederholt werden."

 # Action target choice UI
 ccim_choose_bribe_target: "Wähle eine indigene Nation zum Bestechen"

 # Action error tooltip
 ccim_bribe_noble_faction_no_target_tt: "Es wurde kein gültiges indigenes Ziel für die Bestechung ausgewählt."

 # ========================
 # EVENTS 40–43 (Native)
 # ========================
 cc_invasion_mexico.40.title: "Der Hohepriester drängt zum Handeln"
 cc_invasion_mexico.40.desc: "Der Hohepriester hat unsere Anführer in den heiligen Bezirk gerufen. Die Götter, so erklärt er, haben gesprochen: Die Zeit zu handeln ist jetzt. Heilige Zeremonien, Opfer und Schutzrituale werden unsere Krieger stärken und göttlichen Beistand für unser Anliegen herabrufen. Werden wir dem Ruf der alten Wege folgen?"
 cc_invasion_mexico.40.a: "Ehre die alten Riten. Die Götter werden unsere Krieger leiten."
 cc_invasion_mexico.40.b: "Unsere Krieger brauchen Stahl und Training, keine Zeremonien."

 cc_invasion_mexico.41.title: "Zeichen im heiligen Rauch"
 cc_invasion_mexico.41.desc: "Die Zeremonien sind abgeschlossen. Die Priester lesen den Copal-Rauch, den Flug der Vögel und die Muster in der Asche. Sie sprechen von einem Zeichen — nicht von Niederlage, sondern von Ausdauer. Ob im Bündnis oder im einsamen Trotz, unser Volk wurde durch die Riten gestärkt."
 cc_invasion_mexico.41.a: "Ein günstiges Omen – die Götter sind mit uns!"
 cc_invasion_mexico.41.b: "Düstere Zeichen. Die Priester drängen uns, uns auf das Schlimmste vorzubereiten."

 cc_invasion_mexico.42.title: "Flüchtlinge aus gefallenen Ländern"
 cc_invasion_mexico.42.desc: "Eine zerlumpte Kolonne von Überlebenden erreicht unsere Tore — Männer, Frauen und Krieger eines benachbarten Volkes, deren Land die Invasoren besetzt haben. Sie bringen nichts mit außer ihrem Leben und dem, was sie über die Taktiken der Fremden wissen. Wie sollen wir sie empfangen?"
 cc_invasion_mexico.42.a: "Sie aufnehmen. Ihre Krieger werden an der Seite der unseren kämpfen."
 cc_invasion_mexico.42.b: "Befragen Sie sie nach Informationen über die Methoden der Invasoren."

 cc_invasion_mexico.43.title: "Ein Angebot der Bruderschaft"
 cc_invasion_mexico.43.desc: "Gesandte der mesoamerikanischen Konföderation sind eingetroffen und bringen Geschenke sowie eine feierliche Botschaft mit: Gemeinsam können die Völker dieses Landes die Flut der Eroberung zurückdrängen. Gespalten werden wir nacheinander fallen. Das Angebot, der Konföderation beizutreten, liegt vor uns."
 cc_invasion_mexico.43.a: "Wir akzeptieren. Unsere Völker sollen zusammenstehen."
 cc_invasion_mexico.43.b: "Wir werden unseren eigenen Weg finden. Wir danken ihnen für das Angebot."

 # ========================
 # EVENTS 50–52 (Colonial)
 # ========================
 cc_invasion_mexico.50.title: "Ein kühner Kapitän tritt vor"
 cc_invasion_mexico.50.desc: "Ein erfahrener Kapitän – kampferprobt, ehrgeizig und hungrig nach Ruhm – hat sich freiwillig gemeldet, um eine Erkundungsexpedition tief in das Landesinnere der Ureinwohner zu leiten. Die Risiken sind real: Das Gelände ist unbekannt und die Einheimischen sind wachsam. Doch die gewonnenen Erkenntnisse könnten entscheidend sein. Beauftragen wir seine Expedition?"
 cc_invasion_mexico.50.a: "Beauftragen Sie seine Expedition."
 cc_invasion_mexico.50.b: "Der Zeitpunkt ist nicht günstig. Wir warten ab."

 cc_invasion_mexico.51.title: "Der Bericht des Kapitäns"
 cc_invasion_mexico.51.desc_success: "Der Kapitän ist zurückgekehrt! Seine Expedition drang tief in das Landesinnere vor und kartierte Pässe, Wasserquellen und die Disposition der einheimischen Streitkräfte. Er bringt detaillierte Informationen und Berichte über Städte mit, die darauf warten, beansprucht zu werden. Ein Casus Belli gegen die nächstgelegene einheimische Macht wurde vorbereitet."
 cc_invasion_mexico.51.desc_failure: "Der Kapitän ist zurückgekehrt — doch kaum lebend. Seine Expedition stieß auf erbitterten Widerstand und war gezwungen, sich nach schweren Verlusten zurückzuziehen. Die Männer sind erschüttert, die Schatzkammer geleert und der Kapitän selbst pflegt seine Wunden. Eine kostspielige Lektion über die Gefahren von Überheblichkeit."
 cc_invasion_mexico.51.a_success: "Ausgezeichnete Arbeit. Bereiten Sie den Feldzug vor."
 cc_invasion_mexico.51.b_failure: "Ein schmerzhafter Rückschlag. Wir müssen uns neu formieren."

 cc_invasion_mexico.52.title: "Goldfieber erfasst das Lager"
 cc_invasion_mexico.52.desc: "Unter unseren Soldaten hat sich die Nachricht verbreitet: Die Einheimischen verstecken riesige Mengen an Gold in ihren Tempeln und Speichern. Die Disziplin schwindet, während die Männer über Vermögen flüstern, die beansprucht werden könnten. Wir müssen entscheiden, wie wir mit der wachsenden Unruhe in den Reihen umgehen."
 cc_invasion_mexico.52.a: "Versprich ihnen einen Anteil an der Beute. Gier kann eine Waffe sein."
 cc_invasion_mexico.52.b: "Wahren Sie eine strenge Disziplin. Ordnung gewinnt Feldzüge, nicht Gier."

