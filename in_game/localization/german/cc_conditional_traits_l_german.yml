l_german:
 # ============================================================
 # FAMILY A — CAPITAL DEVELOPMENT-GATED TRAITS
 # ============================================================

 # Tier 1: Prosperity & Urbanization
 urban_planner: "Stadtplaner"
 desc_urban_planner: "Dieser Berater hat ein geschultes Auge für die effiziente Anordnung von Städten und Handel. Unter seiner Leitung schreitet der Neubau schnell und kostengünstig voran, und das städtische Gefüge des Reiches wird mit jedem Jahr dichter."
 urban_planner_die_desc: "[CHARACTER.GetName] ist gestorben. Die Entwürfe, die [CHARACTER.GetSheHe] hinterließ, werden unsere Städte noch lange prägen, nachdem [CHARACTER.GetHerHis] Hand zur Ruhe gekommen ist."

 prosperity_herald: "Wohlstandsbote"
 desc_prosperity_herald: "Dieser Berater bringt die frohe Botschaft eines blühenden Reiches. Wo sich Reichtum ansammelt, folgt das Talent – und dieser Minister hat den Wohlstand unserer Hauptstadt in einen Magneten für ehrgeizige Berater aus dem ganzen Land verwandelt."
 prosperity_herald_die_desc: "[CHARACTER.GetName] ist gegangen. Die offenen Türen, die [CHARACTER.GetSheHe] zwischen unserem Hof und den klügsten Köpfen des Reiches aufrechterhielt, werden ohne [CHARACTER.GetHerHim] schwerer offen zu halten sein."

 merchant_syndic: "Kaufmannssyndikus"
 desc_merchant_syndic: "Als Veteran der Kontore und Handelsgilden weiß dieser Berater, wie man städtischen Reichtum in politisches Kapital verwandelt. Die Kaufmannsschicht steigt mit der Stadt auf, und dieser Minister sorgt dafür, dass dieser Aufstieg der Krone zugutekommt."
 merchant_syndic_die_desc: "[CHARACTER.GetName] ist verschieden. Die Brücken, die [CHARACTER.GetSheHe] zwischen dem Kontor und dem Thron schlug, werden Zeit benötigen, um wieder aufgebaut zu werden."

 # Tier 2: Cultural & Intellectual Flourishing
 grand_architect: "Großarchitekt"
 desc_grand_architect: "Wo andere Berater Statistiken sehen, sieht dieser Minister Skylines. Eine große Hauptstadt zieht Gelehrte, Künstler und Reformer an – und niemand versteht die materiellen Bedingungen für eine solche Blüte besser als dieser bemerkenswerte Ratgeber."
 grand_architect_die_desc: "[CHARACTER.GetName] ist gestorben. Die Denkmäler, die [CHARACTER.GetSheHe] errichtete, werden jeden Stein überdauern — es sind die Städte, die [CHARACTER.GetSheHe] mit aufbaute."

 arts_patron: "Kunstmäzen"
 desc_arts_patron: "Als großzügiger Mäzen von Malern, Dichtern und Musikern versteht dieser Berater, dass kulturelle Förderung auch politische Macht bedeutet. Künstlerische Exzellenz poliert den Ruf der Krone auf und öffnet die Geister für neue Ideen."
 arts_patron_die_desc: "[CHARACTER.GetName] ist verstorben. Jeder Künstler, den [CHARACTER.GetSheHe] unterstützte, wird sich an die Hand erinnern, die ihn speiste — und so wird es auch die Nachwelt in ihren Werken tun."

 learned_courtier: "Gelehrter Höfling"
 desc_learned_courtier: "Ausgebildet in Naturphilosophie, Recht und Literatur hat dieser Berater den Hof in ein Zentrum des Lernens verwandelt. Gelehrte versammeln sich um ihn, Institutionen schlagen Wurzeln und die Alphabetisierung breitet sich von der Hauptstadt aus."
 learned_courtier_die_desc: "[CHARACTER.GetName] ist nicht mehr unter uns. Die Seminare, die [CHARACTER.GetSheHe] leitete, sind beendet, doch die Geister, die [CHARACTER.GetSheHe] geformt hat, werden dieses Wissen weitertragen."

 reform_minded_counselor: "Reformorientierter Berater"
 desc_reform_minded_counselor: "Wohlstand hat die Eigenschaft, den Griff alter Strukturen zu lockern, und dieser Berater weiß das nur zu gut. Als Verfechter maßvoller Reformen haben sie den Hof empfänglicher für institutionelle Veränderungen gemacht, ohne eine Revolution auszulösen."
 reform_minded_counselor_die_desc: "[CHARACTER.GetName] ist gestorben. Die Reformen, die [CHARACTER.GetSheHe] im Stillen pflegte, waren das Werk eines Lebens — und wie alle solchen Werke liegt ihr Schicksal nun in den Händen anderer."

 # Tier 3: Transformative / Enlightenment Ideas
 master_urbanist: "Meisterurbanist"
 desc_master_urbanist: "Dieser Berater sieht die Stadt als ein Labor für menschliches Gedeihen. Von der Stadtplanung über die Kulturpolitik bis zur wissenschaftlichen Förderung hat er unsere Hauptstadt in einen Motor des Fortschritts verwandelt, den rivalisierende Höfe nur beneiden können."
 master_urbanist_die_desc: "[CHARACTER.GetName] ist gestorben. Die Stadt, die [CHARACTER.GetSheHe] mitgestaltete, wird [CHARACTER.GetHerHis] größtes Denkmal sein – und sie wird jeden König überdauern."

 enlightenment_herald: "Herold der Aufklärung"
 desc_enlightenment_herald: "Dieser Berater kam mit neuen Ideen: dass die Vernunft und nicht die Offenbarung der richtige Wegweiser für die Regierungsführung ist; dass Wissen geprüft und nicht nur empfangen werden muss; dass Institutionen verbessert werden können. Er hat diese Ideen ansteckend gemacht."
 enlightenment_herald_die_desc: "[CHARACTER.GetName] ist von dieser Welt gegangen, aber die Ideen, die [CHARACTER.GetSheHe] verbreitete, lassen sich nicht so leicht begraben. Sie leben in Pamphleten, in Vorlesungen und in den Köpfen derer weiter, die [CHARACTER.GetSheHe] lehrte."

 progressive_rationalist: "Progressiver Rationalist"
 desc_progressive_rationalist: "Als Verfechter der Vernunft, der Alphabetisierung und der wissenschaftlichen Methode hat dieser Berater systematisch den Aberglauben bekämpft, wo immer er ihn fand. Unter seinem Einfluss ist der Hof empfänglicher für Beweise als für Autoritäten geworden."
 progressive_rationalist_die_desc: "[CHARACTER.GetName] ist tot. Die Feinde der Vernunft werden feiern, doch sie werden feststellen, dass die Welt ein hartnäckig anderer Ort ist, als sie es vor [CHARACTER.GetHerHim] war."

 revolutionary_herald: "Revolutionärer Herold"
 desc_revolutionary_herald: "Dieser Berater kam mit Ideen, die die alte Ordnung nervös machen: dass das Volk Rechte hat; dass rechtmäßige Herrschaft Zustimmung erfordert; dass die gegenwärtige Machtverteilung nicht ewig ist. Er rät zu Reformen — und wenn Reformen verweigert werden, wird die Geschichte etwas anderes raten."
 revolutionary_herald_die_desc: "[CHARACTER.GetName] ist gestorben. Die Ideen, die [CHARACTER.GetSheHe] vertrat, waren bereits zu groß für [CHARACTER.GetHerHis] allein – sie gehören nun dem Zeitalter."

 # ============================================================
 # FAMILY B — SOCIETAL VALUE-GATED TRAITS
 # ============================================================

 # Axis 1: traditionalist_vs_innovative
 innovative_counselor: "Innovativer Berater"
 desc_innovative_counselor: "Veränderung ist für diesen Berater keine Bedrohung – sie ist der Motor des Fortschritts. Sie haben unseren Hof zu einem Ort gemacht, an dem neue Ideen getestet statt unterdrückt werden, wodurch die Institutionen gestärkt werden."
 innovative_counselor_die_desc: "[CHARACTER.GetName] ist gestorben. Der rastlose Geist der Forschung, den [CHARACTER.GetSheHe] pflegte, wird nicht so leicht einen anderen Förderer finden."

 traditionalist_guardian: "Traditionalistischer Wächter"
 desc_traditionalist_guardian: "Die alten Wege haben uns gut gedient, und dieser Berater beabsichtigt, dies so beizubehalten. Als unermüdlicher Verteidiger von Sitte und Hierarchie hat er die Bande zwischen der Krone und ihren traditionellen Stützpfeilern gestärkt."
 traditionalist_guardian_die_desc: "[CHARACTER.GetName] ist verstorben. Die Traditionen, die [CHARACTER.GetSheHe] aufrechterhielt, werden fortbestehen – doch ein wachsames Auge über sie ist verloren gegangen."

 # Axis 2: absolutism_vs_liberalism
 royal_absolutist: "Königlicher Absolutist"
 desc_royal_absolutist: "Macht muss konzentriert werden, um nützlich zu sein — dieser Berater hat nie daran gezweifelt. Unter seinem Rat ist der Apparat der königlichen Autorität effizienter geworden und die Kosten für die Eingliederung neuer Territorien sind gesunken."
 royal_absolutist_die_desc: "[CHARACTER.GetName] ist tot. Die Architektur der zentralisierten Macht, die [CHARACTER.GetSheHe] schuf, wird bestehen bleiben, doch diejenigen, die darunter leiden, werden ihre Chance finden."

 liberal_reformer: "Liberaler Reformer"
 desc_liberal_reformer: "Dieser Berater glaubt, dass ein Reich, das mit Zustimmung seines Volkes regiert wird, stärker ist als eines, das durch Furcht regiert wird. Er hat mehr Kanäle zwischen der Krone und ihren Untertanen geöffnet, und das Ergebnis ist ein Land, das weniger anfällig für Zerfall ist."
 liberal_reformer_die_desc: "[CHARACTER.GetName] ist gestorben. Die Abkommen, die [CHARACTER.GetSheHe] zwischen der Krone und dem einfachen Volk vermittelte, werden nun auf die Probe gestellt, da der Vermittler nicht mehr da ist."

 # Axis 3: centralization_vs_decentralization
 efficiency_administrator: "Effizienzadministrator"
 desc_efficiency_administrator: "Verschwendung ist der Feind dieses Beraters. Er hat jeden bürokratischen Prozess geprüft, jede Redundanz gestrichen und den Regierungsapparat so gestrafft, dass er mit bemerkenswerter Sparsamkeit läuft."
 efficiency_administrator_die_desc: "[CHARACTER.GetName] ist verstorben. Das gut geölte Getriebe, das [CHARACTER.GetSheHe] baute, wird noch eine Weile von selbst laufen – doch Maschinen benötigen Wartung."

 regional_magnate: "Regionaler Magnat"
 desc_regional_magnate: "Starke Regionen schaffen ein starkes Reich – zumindest argumentiert dieser Berater so. Sie haben die großen Herren der Provinzen gefördert und sichergestellt, dass die lokale Macht mit dem Zentrum zusammenarbeitet, anstatt gegen es."
 regional_magnate_die_desc: "[CHARACTER.GetName] ist gegangen. Das Netzwerk regionaler Loyalitäten, das [CHARACTER.GetSheHe] pflegte, wird nun sorgfältige Betreuung erfordern, da [CHARACTER.GetHerHis] Hand nicht mehr am Steuer liegt."

 # Axis 4: spiritualist_vs_humanist
 mystical_patriarch: "Mystischer Patriarch"
 desc_mystical_patriarch: "Der Glaube ist das Fundament des Weltbildes dieses Beraters, und er hat diese Überzeugung in jeden Bereich der Regierungsführung getragen. Der Klerus ist einflussreicher, die Gläubigen standhafter und das Reich widerstandsfähiger gegen heterodoxe Ideen."
 mystical_patriarch_die_desc: "[CHARACTER.GetName] hat diesbezüglich das Leben verlassen. Die Frömmigkeit, die [CHARACTER.GetSheHe] verkörperte, war eine Art der Regierungsführung — und ihr Verlust wird in Bereichen spürbar sein, die keine Bilanz aufwiegen kann."

 humanist_philosopher: "Humanistischer Philosoph"
 desc_humanist_philosopher: "Dieser Berater glaubt, dass die menschliche Vernunft und nicht göttliche Verordnungen das Reich leiten sollten. Unter seinem Einfluss ist die Toleranz gewachsen, ebenso wie die Alphabetisierung und die Bereitschaft, überliefertes Wissen infrage zu stellen."
 humanist_philosopher_die_desc: "[CHARACTER.GetName] ist gestorben. Die Argumente, die [CHARACTER.GetSheHe] gewann – für Toleranz, für Forschung, für die Würde des menschlichen Geistes – werden nun erneut verhandelt. Hoffen wir, dass das Urteil Bestand hat."

 # Axis 5: aristocracy_vs_plutocracy
 noble_champion: "Adliger Champion"
 desc_noble_champion: "Abstammung und Dienst — dies sind die zwei Säulen des Glaubens dieses Beraters. Als unermüdlicher Fürsprecher des Adels haben sie sichergestellt, dass die großen Häuser das Rückgrat unserer militärischen und politischen Ordnung bleiben."
 noble_champion_die_desc: "[CHARACTER.GetName] ist gestorben. Die Adelsfamilien, die [CHARACTER.GetSheHe] unterstützte, werden laut trauern — und sich in ihrer Trauer daran erinnern, was sie der Krone schulden."

 merchant_prince: "Kaufmannsprinz"
 desc_merchant_prince: "Dieser Berater hat nie altes Geld mit gutem Geld verwechselt. Als Verfechter der kommerziellen Klassen hat er neue Handelswege eröffnet, die Kaufmannsstände gefördert und Reichtum in Einfluss verwandelt."
 merchant_prince_die_desc: "[CHARACTER.GetName] ist verschieden. Die kommerziellen Netzwerke, die [CHARACTER.GetSheHe] knüpfte, werden fortbestehen – Handelsrouten trauern nicht um ihre Architekten."

 # Axis 6: serfdom_vs_free_subjects
 serf_overseer: "Hofbauer-Aufseher"
 desc_serf_overseer: "Ordnung hängt von der Hierarchie ab, und die Hierarchie davon, dass jeder seinen Platz kennt. Dieser Berater hat sichergestellt, dass das ländliche Arbeitssystem mit maximaler Effizienz funktioniert – der Adel ist zufrieden, auch wenn das Bauernvolk es nicht ist."
 serf_overseer_die_desc: "[CHARACTER.GetName] ist gestorben. Das System, das [CHARACTER.GetSheHe] aufrechterhielt, war nicht beliebt, aber es war produktiv. Was als Nächstes passiert, wird davon abhängen, wer [CHARACTER.GetHerHis] Platz einnimmt."

 emancipation_minister: "Minister für Emanzipation"
 desc_emancipation_minister: "Ein steigender Tide hebt alle Boote — dieser Berater hat seine Karriere der Lockerung der Bande gewidmet, die die Bauern an den Boden binden. Die Alphabetisierung steigt, die Mobilität nimmt zu und das menschliche Potenzial des Reiches beginnt zu erblühen."
 emancipation_minister_die_desc: "[CHARACTER.GetName] ist verstorben. Die Freiheiten, für die [CHARACTER.GetSheHe] eintrat, werden selten ohne Kampf aufgegeben — das ist zumindest [CHARACTER.GetHerHis] Vermächtnis."

 # Axis 7: mysticism_vs_jurisprudence
 mystical_counselor: "Mystischer Berater"
 desc_mystical_counselor: "Das Heilige und das Politische sind für diesen Berater nicht getrennt. Er hat religiöse Legitimität in das Gefüge der Regierungsführung eingewebt und den Handlungen des Reiches eine spirituelle Autorität verliehen, die ausländische Mächte mit Vorsicht behandeln."
 mystical_counselor_die_desc: "[CHARACTER.GetName] ist nicht mehr unter uns. Das spirituelle Gewicht, das [CHARACTER.GetSheHe] unseren Entscheidungen verlieh, wird nur schwer durch bloße Argumente zu ersetzen sein."

 legal_scholar: "Rechtsgelehrter"
 desc_legal_scholar: "Das Gesetz, ordnungsgemäß kodifiziert und konsequent angewandt, ist das mächtigste Werkzeug der Zivilisation – zumindest argumentiert dieser Berater. Unter seinem Einfluss ist die Regierungsführung systematischer, vorhersehbarer und schwerer missbrauchbar geworden."
 legal_scholar_die_desc: "[CHARACTER.GetName] ist gestorben. Das rechtliche Gebäude, das [CHARACTER.GetSheHe] errichtete, mag jeden Minister überdauern, der danach kommt – das war die Absicht."

 # Axis 8: mercantilism_vs_free_trade
 mercantilist_official: "Merkantilistischer Beamter"
 desc_mercantilist_official: "Handel ist Macht, und Macht muss vom Staat gelenkt werden — dieser Berater hat nie daran gezweifelt. Unter seiner Aufsicht ist die kommerzielle Reichweite der Krone gewachsen und konkurrierende Interessen wurden fest unter königliche Aufsicht gebracht."
 mercantilist_official_die_desc: "[CHARACTER.GetName] ist verstorben. Der Handelsapparat, den [CHARACTER.GetSheHe] aufbaute, wird weiterlaufen – doch ohne [CHARACTER.GetHerHis] Hand am Hebel könnte er ins Driften geraten."

 free_market_advocate: "Verfechter des freien Marktes"
 desc_free_market_advocate: "Beseitigen Sie die Handelsbarrieren und sehen Sie zu, wie der Handel aufblüht – dieser Berater hat dieses Argument jedem Skeptiker am Hofe dargelegt, und die Ergebnisse sind kaum zu bestreiten. Die Kaufmannsgilden beten ihn geradezu an."
 free_market_advocate_die_desc: "[CHARACTER.GetName] ist gestorben. Die Kaufleute, die [CHARACTER.GetSheHe] befreite, werden keine Statuen errichten, aber sie werden den Namen bei der Berechnung ihrer Gewinne im Gedächtnis behalten."

 # Axis 9: capital_economy_vs_traditional_economy
 capitalist_minister: "Kapitalistischer Minister"
 desc_capitalist_minister: "Investition, Akkumulation und Reinvestition – dieser Berater versteht die Logik des Kapitals wie kaum ein anderer. Unter seiner Führung hat die Wirtschaft des Reiches begonnen, sich nach einer neuen und produktiven internen Logik zu entwickeln."
 capitalist_minister_die_desc: "[CHARACTER.GetName] ist verschieden. Der wirtschaftliche Mechanismus, den [CHARACTER.GetSheHe] in Gang gesetzt hat, wird nicht anhalten – das Kapital hat nun seine eigene Dynamik."

 estate_guardian: "Standeswächter"
 desc_estate_guardian: "Die alten Arten der Organisation von Reichtum und Arbeit haben sich aus guten Gründen als dauerhaft erwiesen, und dieser Berater sieht keine Weisheit darin, sie zugunsten ungeprüfter Theorien aufzugeben. Die großen Güter florieren, die traditionellen Stände sind zufrieden und das Reich ist stabil."
 estate_guardian_die_desc: "[CHARACTER.GetName] ist gestorben. Die traditionelle Ordnung, die [CHARACTER.GetSheHe] bewahrte, wird schon bald ihren Herausforderern gegenüberstehen — und sie wird ihnen ohne [CHARACTER.GetHerHis] Fürsprache gegenüberstehen."

 # Axis 10: individualism_vs_communalism
 free_spirit_counselor: "Berater des freien Geistes"
 desc_free_spirit_counselor: "Jede große Errungenschaft beginnt mit einer einzelnen Person, die anders dachte – dieser Berater hat seine Politik auf dieser Überzeugung aufgebaut. Individuelles Talent wird gefördert, künstlerisches Mäzenatentum blüht auf und die Bürokratie beugt sich ein wenig, um Genies Platz zu machen."
 free_spirit_counselor_die_desc: "[CHARACTER.GetName] ist gestorben. Die außergewöhnlichen Geister, die [CHARACTER.GetSheHe] ermutigte, werden sich zerstreuen, und einige werden keinen weiteren Fürsprecher finden."

 community_steward: "Gemeindeverwalter"
 desc_community_steward: "Ein Reich besteht nicht aus seinen Herrschern, sondern aus seinem Volk — dieser Berater hat nach diesem Prinzip regiert. Die gemeinschaftlichen Bindungen sind stärker, die lokale Bevölkerung mobiler und wohlhabender und das einfache Volk ist stärker am Erfolg des Reiches beteiligt."
 community_steward_die_desc: "[CHARACTER.GetName] ist gegangen. Die Gemeinschaften, die [CHARACTER.GetSheHe] pflegte, waren nicht die Art von Leistung, die Porträts im Palast einbringt – doch sie mögen sich als dauerhafter erweisen."

 # Axis 11: quality_vs_quantity
 elite_trainer: "Elite-Ausbilder"
 desc_elite_trainer: "Weniger Soldaten, bessere Soldaten – dieser Berater hat seinen Ruf auf dieses Prinzip gesetzt. Die Armee, die aus seinen Reformen hervorgeht, ist kleiner, teurer und verheerend effektiv."
 elite_trainer_die_desc: "[CHARACTER.GetName] ist gestorben. Die Offiziere, die [CHARACTER.GetSheHe] ausbildete, werden [CHARACTER.GetHerHis] Methoden weiterführen — Disziplin ist schließlich selbstreproduzierend."

 mass_levy_commander: "Kommandant der Massenaushebung"
 desc_mass_levy_commander: "Zahlen entscheiden über Schlachten, und Zahlen sind etwas, das wir haben. Dieser Berater hat die Menschenkraft des Reiches in einen strategischen Vorteil verwandelt, hält die Rekrutierungskosten niedrig und die Reihen stets gefüllt."
 mass_levy_commander_die_desc: "[CHARACTER.GetName] ist verstorben. Die Männer, die [CHARACTER.GetSheHe] ausbildete und drillte, werden sich an die Stimme erinnern, die sie unter die Fahnen rief, selbst wenn die Geschichte den Namen nicht festhält."

 # Axis 12: offensive_vs_defensive
 offensive_strategist: "Offensivstratege"
 desc_offensive_strategist: "Angriff ist die beste Verteidigung — und dieser Berater hat unsere Militärplanung entsprechend organisiert. Jede Ressource ist darauf ausgerichtet, Macht nach außen zu projizieren und den Feind so sehr mit seinen eigenen Problemen zu beschäftigen, dass er uns nicht bedrohen kann."

 defensive_commander: "Defensiver Kommandant"
 desc_defensive_commander: "Festungen halten Boden, den Armeen nicht halten können. Dieser Berater hat massiv in die Verteidigungsinfrastruktur des Reiches investiert, um sicherzustellen, dass jeder Aggressor einem zermürbenden Abnutzungskampf statt einem schnellen Bewegungskrieg gegenübersteht."
 defensive_commander_die_desc: "[CHARACTER.GetName] ist gestorben. Die Mauern, die [CHARACTER.GetSheHe] errichtete, werden [CHARACTER.GetHerHim] um Jahrhunderte überdauern – und genau das war der Plan."

 # Axis 13: belligerent_vs_conciliatory
 hawk_minister: "Falken-Minister"
 desc_hawk_minister: "Dieser Berater glaubt, dass Stärke Respekt gebietet und Schwäche Aggression provoziert. Unter seiner Leitung haben wir unsere Vorteile konsequenter genutzt und besiegten Feinden mehr abverlangt – auch wenn dies einige Nachbarn misstrauisch gemacht hat."
 hawk_minister_die_desc: "[CHARACTER.GetName] ist gestorben. Die Feinde, die [CHARACTER.GetSheHe] schuf, werden nicht trauern. Aber das werden auch die Kommandeure nicht, deren Ambitionen [CHARACTER.GetSheHe] befeuert hat."

 peacemaker_counselor: "Friedensstifter-Ratgeber"
 desc_peacemaker_counselor: "Jeder Krieg kostet mehr, als seine Befürworter zugeben, und dieser Berater hat seine Karriere damit verbracht, diesen Punkt zu beweisen. Unter seinem Einfluss hat der Antagonismus abgenommen, diplomatische Kanäle blieben offen und unsere Nachbarn sind weniger geneigt, sich gegen uns zu verbünden."
 peacemaker_counselor_die_desc: "[CHARACTER.GetName] ist nicht mehr unter uns. Die stillschweigenden Abkommen, die [CHARACTER.GetSheHe] mit unseren Nachbarn pflegte, wurden nie schriftlich festgehalten – sie existierten nur in [CHARACTER.GetHerHis] persönlichen Beziehungen. Das ist die Tragödie des Friedensstifters."

 # Axis 14: outward_vs_inward
 expansionist_advisor: "Expansionistischer Berater"
 desc_expansionist_advisor: "Die Karte weist Leerräume auf, die danach rufen, gefüllt zu werden – zumindest glaubt dieser Berater das. Unter seiner Führung sind unsere kolonialen und explorativen Ambitionen präziser und besser ressourciert geworden."
 expansionist_advisor_die_desc: "[CHARACTER.GetName] ist gestorben. Die Horizonte, auf die [CHARACTER.GetSheHe] deutete, sind immer noch da. Ob wir sie erreichen, liegt nun allein an unserer Entscheidung."

 consolidation_minister: "Konsolidierungsminister"
 desc_consolidation_minister: "Das Reich, das wir besitzen, ist es wert, vervollkommnet zu werden, bevor wir nach mehr greifen. Dieser Berater hat unsere Energien nach innen gelenkt – die Entwicklung dessen, was wir halten, die Integration dessen, was wir erobert haben, und die Reform dessen, was reformbedürftig ist."
 consolidation_minister_die_desc: "[CHARACTER.GetName] ist gegangen. Die inneren Reformen, für die [CHARACTER.GetSheHe] eintrat, werden immer weniger glanzvoll sein als Eroberungen – und immer notwendiger."

 # Axis 15: land_vs_naval
 continental_marshal: "Kontinentalmarschall"
 desc_continental_marshal: "Land ist dort, wo Kriege gewonnen und Imperien erschaffen werden – dieser Berater hat nie daran gezweifelt. Die Armee ist das Instrument unserer Macht, und sie haben sie entsprechend geschärft."
 continental_marshal_die_desc: "[CHARACTER.GetName] ist gestorben. Die Regimenter, die [CHARACTER.GetSheHe] drillte, und die Festungen, die [CHARACTER.GetSheHe] in Auftrag gab, werden [CHARACTER.GetHerHis] Namen in den Schlachtbefehlen noch lange nach [CHARACTER.GetHerHis] Tod tragen."

 admiral_counselor: "Admiralratgeber"
 desc_admiral_counselor: "Das Meer ist die große Autobahn der Welt, und wer es beherrscht, beherrscht alles, was über es fließt. Dieser Berater hat unser strategisches Denken auf das Meer ausgerichtet — und die Ergebnisse waren sowohl in unseren Handelseinnahmen als auch in unserem Schiffsregister spürbar."
 admiral_counselor_die_desc: "[CHARACTER.GetName] ist verstorben. Das Meer trauert nicht – doch die Seeleute, die [CHARACTER.GetSheHe] ausbildete, werden in jedem Hafen Geschichten über [CHARACTER.GetHerHim] erzählen."

 # Axis 16: latinization_vs_hellenization
 roman_administrator: "Römischer Administrator"
 desc_roman_administrator: "Ordnung, Gesetz und Latein — dies sind die Werkzeuge eines Imperiums. Dieser Berater hat die römische Verwaltungstradition in unsere Regierungsführung integriert, wodurch Annexionen kostengünstiger und Reformen systematischer werden."
 roman_administrator_die_desc: "[CHARACTER.GetName] ist gestorben. Das administrative Erbe, das [CHARACTER.GetSheHe] hinterließ, folgt der römischen Tradition – es wird den Erbauer überdauern."

 hellenistic_scholar: "Hellenistischer Gelehrter"
 desc_hellenistic_scholar: "Die griechische Tradition lebt fort — in der Philosophie, in der Wissenschaft, in der Kultivierung des hinterfragenden Geistes. Dieser Berater hat unseren Hof zu einem Zentrum dieser Tradition gemacht, und die Alphabetisierung sowie der kulturelle Einfluss sind dementsprechend gewachsen."
 hellenistic_scholar_die_desc: "[CHARACTER.GetName] ist verschieden. Auf [CHARACTER.GetHerHis] eigene Weise hat [CHARACTER.GetSheHe] ein weiteres Kapitel zu einem sehr langen Buch hinzugefügt."

 # Axis 17: sinicized_vs_unsinicized
 confucian_mandarin: "Konfuzianischer Mandarin"
 desc_confucian_mandarin: "Die Weisenkönige bauten die Zivilisation auf dem Fundament korrekter Beziehungen und meritokratischer Regierungsführung auf. Dieser Berater hat diese Prinzipien an unseren Hof gebracht, was die Verwaltung verbessert und die Assimilation neuer Völker in das Reich beschleunigt."
 confucian_mandarin_die_desc: "[CHARACTER.GetName] ist gestorben. Das konfuzianische Ideal, das [CHARACTER.GetSheHe] verkörperte – Regierungsführung als moralische Berufung – wird am nachfolgenden Hof schwerer zu finden sein."

 steppe_warlord_advisor: "Berater der Steppenkriegsherren"
 desc_steppe_warlord_advisor: "Die Steppe bringt keine Verwalter hervor – sie bringt Kommandeure. Dieser Berater bringt die rücksichtslose Kavalleriedoktrin der Nomadenwelt in unser Militär, und unsere Feinde haben gelernt, sie zu fürchten."
 steppe_warlord_advisor_die_desc: "[CHARACTER.GetName] ist gestorben. Die Kommandeure, die [CHARACTER.GetSheHe] ausbildete, werden [CHARACTER.GetHerHis] Grimm in die Zukunft tragen. Die Steppe vergisst ihre Lehren nicht."

 # ============================================================
 # FAMILY C — REGIONAL / RELIGIOUS TRAITS
 # ============================================================

 # Religion-group diplomats
 christian_diplomat: "Christlicher Diplomat"
 desc_christian_diplomat: "Innerhalb der Gemeinschaft der christlichen Nationen bewegt sich dieser Berater mit ungewöhnlicher Leichtigkeit. Der gemeinsame Glaube ist eine diplomatische Währung, und er hat sie klug eingesetzt – indem er Antagonismen reduzierte, Türen öffnete und unseren auswärtigen Angelegenheiten Legitimität verlieh."
 christian_diplomat_die_desc: "[CHARACTER.GetName] ist gestorben. Das Netzwerk christlicher Verbindungen, das [CHARACTER.GetSheHe] pflegte, wird ohne [CHARACTER.GetHerHis] ständige Aufmerksamkeit zerfallen."

 caliphate_diplomat: "Diplomat des Kalifats"
 desc_caliphate_diplomat: "Tief verwurzelt in den Traditionen islamischer Regierungsführung und zwischenstaatlicher Beziehungen, hat dieser Berater unserem diplomatischen Ansehen in der muslimischen Welt ein Prestige verliehen, das mit bloßer Militärmacht nicht zu erkaufen ist. Die von ihnen gepflegten Verbindungen erstrecken sich über Höfe und Handelsrouten gleichermaßen."
 caliphate_diplomat_die_desc: "[CHARACTER.GetName] ist verstorben. Der Ruf, den [CHARACTER.GetSheHe] sich erarbeitete, wird fortbestehen, doch ein guter Ruf bedarf der Pflege."

 brahmin_counselor: "Brahmane-Ratgeber"
 desc_brahmin_counselor: "Wissenschaft, Ritual und die Verwaltung heiliger Autorität – dieser Berater beherrscht alle drei. Unter seiner Führung ist der Klerus zu einem effektiveren Instrument der Regierungsführung geworden, und die spirituellen Bedürfnisse der Bevölkerung wurden enger in das administrative Gefüge der Krone eingewebt."
 brahmin_counselor_die_desc: "[CHARACTER.GetName] ist gestorben. Die spirituelle Autorität, die [CHARACTER.GetSheHe] in unserem Namen aufbaute, wird Jahre benötigen, um wiederhergestellt zu werden."

 dharma_minister: "Dharma-Minister"
 desc_dharma_minister: "Dieser Berater hat seine Beratung auf dem Konzept des richtigen Verhaltens aufgebaut – in der Regierungsführung wie im Privatleben. Das Ergebnis ist ein Hof, der seine Entscheidungen mit ungewöhnlicher Sorgfalt trifft, und ein Ruf der Fairness, der das Reich leichter regierbar gemacht hat."
 dharma_minister_die_desc: "[CHARACTER.GetName] ist verschieden. Das Beispiel, das [CHARACTER.GetSheHe] setzte, war mehr wert als jede Politik, die [CHARACTER.GetSheHe] implementierte. Das ist die schwierigste Art von Vermächtnis, die man bewahren kann."

 # Sub-continent specialists
 renaissance_patron: "Renaissance-Mäzen"
 desc_renaissance_patron: "Die Künste blühen auf, und dieser Berater ist maßgeblich dafür verantwortlich. Als großzügiger und anspruchsvoller Mäzen von Malern, Bildhauern und Schriftstellern hat er unseren Hof zu einem Ziel für die klügsten kreativen Köpfe der Ära gemacht."

 griot_diplomat: "Griot-Diplomat"
 desc_griot_diplomat: "Erinnerung, Geschichte und das gesprochene Wort sind die Fundamente der diplomatischen Tradition in diesem Teil der Welt – und dieser Berater hat alle drei gemeistert. Sie bewegen sich mit der Leichtigkeit von jemandem zwischen den Höfen, der die Vergangenheit in seiner Stimme trägt."
 griot_diplomat_die_desc: "[CHARACTER.GetName] ist gestorben. Wenn ein Griot stirbt, brennt eine Bibliothek nieder. Die mündliche Überlieferung, die [CHARACTER.GetSheHe] bewahrte, wird von denen, die folgen, anders erzählt werden."

 steppe_strategos: "Steppen-Strategos"
 desc_steppe_strategos: "Dieser Berater wurde im Sattel geboren und ist mit der schnellen, brutalen Logik der Steppenkriegsführung aufgewachsen. Unter seinem Rat hat unsere Kavallerie eine neue Stufe der Effizienz erreicht – und unsere Feinde haben gelernt, den Anblick unserer Vorreiter am Horizont zu respektieren."
 steppe_strategos_die_desc: "[CHARACTER.GetName] ist verstorben. Die Kavalleriedoktrin, die [CHARACTER.GetSheHe] aus der Steppe mitbrachte, wird in den Ausbildungshandbüchern über [CHARACTER.GetHerHim] hinausfortbestehen – doch diejenigen, die mit [CHARACTER.GetHerHim] ritten, sagen, dass die Handbücher etwas Wesentliches vermissen lassen."

 mughal_administrator: "Mughal-Verwalter"
 desc_mughal_administrator: "Als Meister der anspruchsvollen administrativen Tradition, die große multiethnische Imperien regierbar gemacht hat, hat dieser Berater diese Methoden in unsere eigene Verwaltung übertragen – was die Assimilation beschleunigt, die Integrationskosten senkt und den Hof reibungsloser funktionieren lässt."
 mughal_administrator_die_desc: "[CHARACTER.GetName] ist verstorben. Das administrative Erbe, das [CHARACTER.GetSheHe] hinterlassen hat, stützt sich auf Jahrhunderte akkumulierten Wissens. Es wird nicht in Vergessenheit geraten."

 maritime_champion: "Meereschampion"
 desc_maritime_champion: "Häfen und Schifffahrtswege sind die Arterien der Macht für jedes Küstenreich, und dieser Berater hat sichergestellt, dass unsere gesund sind. Die Kaufmannsstände florieren, der Hafen brummt und der maritime Einfluss der Krone wächst mit jeder Segelsaison."
 maritime_champion_die_desc: "[CHARACTER.GetName] ist gestorben. Die Flut kommt und geht, ohne Rücksicht auf die Hafenmeister, die ihr Verhalten kartierten — aber diese Hafenmeister werden dennoch vermisst."

 ecumenical_patriarch_advisor: "Berater des Ökumenischen Patriarchen"
 desc_ecumenical_patriarch_advisor: "Dieser Berater trägt die volle Autorität der orthodoxen Tradition in sich – ihre Liturgie, ihre Theologie und ihren alten Anspruch, der wahre Erbe des christlichen imperialen Ideals zu sein. Unter seinem Einfluss wird der Klerus zu einem wirkungsvolleren Instrument der Regierungsführung."
 ecumenical_patriarch_advisor_die_desc: "[CHARACTER.GetName] ist von dieser Welt gegangen. Die Kirche wird den Sitz füllen – das tat sie schon immer – aber die besondere Weisheit, die [CHARACTER.GetSheHe] in die Regierungsführung einbrachte, lässt sich nicht leicht durch Zeremonien ersetzen."

 new_world_pioneer: "Pionier der Neuen Welt"
 desc_new_world_pioneer: "Dieser Berater brachte den Instinkt eines Entdeckers und den Pragmatismus eines Kolonisten mit. Unter seiner Führung ist unsere Präsenz in den neuen Ländern systematischer und profitabler geworden."
 new_world_pioneer_die_desc: "[CHARACTER.GetName] ist gestorben. Die Grenze, die [CHARACTER.GetSheHe] mit half zu erschließen, wird kein Denkmal für [CHARACTER.GetHerHim] tragen – Pioniere erhalten selten Denkmäler. Sie erhalten die Orte, die danach kommen."

 # ============================================================
 # FAMILY D — MILITARY COST SPECIALISTS
 # ============================================================

 # Age 2-4 Early Tier
 infantry_drillmaster: "Infanterie-Drillmeister"
 desc_infantry_drillmaster: "Dieser Veteran hat seine Karriere damit verbracht, rohe Rekruten in disziplinierte Soldaten zu verwandeln. Unter seiner Aufsicht ist die Infanterie kostengünstiger aufzustellen und erbringt im Feld bessere Leistungen."
 infantry_drillmaster_die_desc: "[CHARACTER.GetName] ist gestorben. Die Sergeanten, die [CHARACTER.GetSheHe] ausbildete, werden [CHARACTER.GetHerHis] Methoden für eine Generation lang durch die Ränge weitergeben."

 scout_captain: "Späherkapitän"
 desc_scout_captain: "Schnell, lautlos und dem Hauptheer immer voraus — dieser Berater hat unsere Kavallerieaufklärung zu einer Kunstform erhoben. Leichte Kavallerie ist unter seiner Doktrin günstiger und wird effizienter eingesetzt."
 scout_captain_die_desc: "[CHARACTER.GetName] ist verstorben. Die Reiter, die [CHARACTER.GetSheHe] ausbildete, werden weiterreiten – doch weniger von ihnen werden sich ohne [CHARACTER.GetHerHim] an ihrer Spitze für die gefährlichsten Routen melden."

 military_engineer: "Militäringenieur"
 desc_military_engineer: "Belagerung ist eine Wissenschaft, und dieser Berater hat diese Wissenschaft eingebracht. Die Konstruktion von Artillerie und Ausrüstung für schwere Infanterie kostet unter seiner Aufsicht weniger, und die Ergebnisse sprechen an den Mauern feindlicher Befestigungen für sich."
 military_engineer_die_desc: "[CHARACTER.GetName] ist gestorben. Die Belagerungshandbücher, die [CHARACTER.GetSheHe] schrieb, werden noch lange genutzt werden, nachdem der Autor vergessen ist — das ist die Unsterblichkeit des Ingenieurs."

 # Age 5-6 Strong Tier
 commissariat_officer: "Intendantenoffizier"
 desc_commissariat_officer: "Eine Armee, die sich nicht selbst versorgen und ausrüsten kann, kann nicht kämpfen. Dieser Berater hat die logistische Herausforderung gelöst, an der geringere Feldzüge scheitern, und stellt sicher, dass unsere Infanterie immer ordnungsgemäß versorgt ist — und dass der Adel von den Verträgen profitiert."
 commissariat_officer_die_desc: "[CHARACTER.GetName] ist gestorben. Die Lieferketten, die [CHARACTER.GetSheHe] etablierte, werden weiter funktionieren — die eigentliche Prüfung kommt, wenn sie gezwungen sind, ohne [CHARACTER.GetHerHim] zu improvisieren."

 cavalry_marshal: "Kavallerie-Marschall"
 desc_cavalry_marshal: "Die besten Reiter soldaten des Reiches verlassen sich bei ihrer Doktrin, ihren Ausrüstungsstandards und ihrem professionellen Selbstverständnis auf diesen Berater. Die Kavallerie unter seinem Kommando kostet nur die Hälfte und ist doppelt so gefährlich."
 cavalry_marshal_die_desc: "[CHARACTER.GetName] ist gestorben. Jeder Kavallerieoffizier in dieser Armee hat etwas von [CHARACTER.GetHerHim] gelernt, selbst diejenigen, die nie direkt unter [CHARACTER.GetHerHis] Kommando dienten."

 siege_engineer: "Belagerungsingenieur"
 desc_siege_engineer: "Mauern fallen und Festungen kapitulieren, wenn dieser Berater im Feld ist. Als Meister der Artilleriedoktrin und des Belagerungsbaus hat er unsere Offensivoperationen dramatisch effizienter gemacht — und unsere eigenen Befestigungen erheblich schwerer zu durchbrechen."
 siege_engineer_die_desc: "[CHARACTER.GetName] ist gestorben. Die Befestigungen, die [CHARACTER.GetSheHe] entwarf, werden als [CHARACTER.GetHerHis] Mahnmal stehen bleiben – obwohl [CHARACTER.GetSheHe] es wahrscheinlich vorziehen würde, dass sie verbessert statt nur bewahrt werden."

 supreme_commander: "Oberbefehlshaber"
 desc_supreme_commander: "Jeder Arm des Militärs wurde von der reformierenden Hand dieses Beraters berührt. Der Adel erkennt dies an, das Intendanturwesen ebenso, und Infanterie, Kavallerie sowie Artillerie kosten weniger, da der gesamte Kriegsapparat rationalisiert wurde."
 supreme_commander_die_desc: "[CHARACTER.GetName] ist gestorben. Die Armee, die [CHARACTER.GetSheHe] aufbaute, ist unser Erbe. Hoffen wir, dass wir ihr würdig sind."

 # ============================================================
 # FAMILY E — PARLIAMENTARY / DIPLOMATIC SPECIALISTS
 # ============================================================

 parliamentary_broker: "Parlamentsvermittler"
 desc_parliamentary_broker: "Das Parlament ist ein kompliziertes Instrument, und dieser Berater spielt es wie ein Virtuose. Unter seiner Führung ist die legislative Unterstützung dramatisch zuverlässiger geworden – und die Unterstützungsschwelle für die schwierigsten Abstimmungen ist gesunken."
 parliamentary_broker_die_desc: "[CHARACTER.GetName] ist gestorben. Die parlamentarischen Beziehungen, die [CHARACTER.GetSheHe] pflegte, werden [CHARACTER.GetHerHim] überdauern — doch die Beziehungen waren persönlicher Natur, und persönliche Beziehungen sterben mit ihren Besitzern."

 diplomatic_attache: "Diplomatischer Attaché"
 desc_diplomatic_attache: "Im Kleingedruckten internationaler Abkommen werden Imperien aufgebaut oder zerrissen, und dieser Berater ist ein Meister darin. Unter seinen sorgfältigen Verhandlungen kosten Annexionen weniger, und unsere diplomatische Reichweite ist entsprechend gewachsen."
 diplomatic_attache_die_desc: "[CHARACTER.GetName] ist verstorben. Die Verträge, die [CHARACTER.GetSheHe] entwarf, bleiben weiterhin bindend – Verträge überdauern ihre Urheber, was genau der Sinn ist."

 grand_chancellor: "Großkanzler"
 desc_grand_chancellor: "Dieser Berater betreibt nicht nur Diplomatie; er steuert die Außenpolitik. Der gesamte Apparat unseres internationalen Engagements wurde unter seiner Aufsicht neu gestaltet: Kapazität, Ansehen, Annexion und parlamentarisches Standing haben sich verbessert."
 grand_chancellor_die_desc: "[CHARACTER.GetName] ist gestorben. Das diplomatische Gebäude, das [CHARACTER.GetSheHe] errichtete, war ein Denkmal für ein Leben voller geduldiger, kalkulierender Arbeit. Die Fundamente werden halten – wir müssen hoffen, dass die oberen Stockwerke nicht [CHARACTER.GetHerHis] besonderes Genie erfordern, um erhalten zu bleiben."

 # ============================================================
 # FAMILY F — ACTION-FORGED TRAITS
 # ============================================================

 seasoned_integrator: "Erfahrener Integrator"
 seasoned_integrator_die_desc: "[CHARACTER.GetName] ist gestorben. Die Integrationsstrukturen, die [CHARACTER.GetSheHe] schuf, werden weiterhin funktionieren – Bürokratien finden, wie Flüsse, ihr eigenes Niveau."

 frontier_administrator: "Grenzlandverwalter"
 frontier_administrator_die_desc: "[CHARACTER.GetName] ist gestorben. Die Grenzposten, die [CHARACTER.GetSheHe] errichtete, sind dauerhaft – das Wissen darüber, wie man sie baut, war allein [CHARACTER.GetHerHis]."

 development_patron: "Entwicklungspatron"
 desc_development_patron: "Die Hauptstadt hat sich unter der Obhut dieses Ministers mit ungewöhnlicher Geschwindigkeit entwickelt, und die von ihm angewandten Methoden wurden stillschweigend auf das gesamte Reich ausgeweitet. Die Entwicklung schreitet schneller voran und Gebäude kosten weniger, wo immer sie ihre Aufmerksamkeit richten."
 development_patron_die_desc: "[CHARACTER.GetName] ist verstorben. Das Wachstum, das [CHARACTER.GetSheHe] pflegte, war kein Zufall – es war das Produkt eines systematischen Ansatzes, der nun von Grund auf neu rekonstruiert werden muss."

 espionage_director: "Spionagechef"
 desc_espionage_director: "Schatten und Stille sind die Werkzeuge dieses Ministers. Unter seiner Aufsicht sind unsere Spionagenetzwerke umfangreicher und zuverlässiger geworden, und unser diplomatischer Ruf hat stillschweigend von dem profitiert, was wir wissen – und wovon andere befürchten, dass wir es wissen."
 espionage_director_die_desc: "[CHARACTER.GetName] ist gestorben. Die Netzwerke, die [CHARACTER.GetSheHe] leitete, werden eine sorgfältige Rekonstruktion erfordern — Geheimdienstinformationen sterben, anders als die meisten Formen von Wissen, mit ihren Hütern."

 treasury_enforcer: "Schatzamtsvollstrecker"
 treasury_enforcer_die_desc: "[CHARACTER.GetName] ist verschieden. Die Disziplin, die [CHARACTER.GetSheHe] auferlegte, war nicht beliebt, aber sie war produktiv. Die Schatzkammer wird die Abwesenheit bemerken, bevor es die Minister tun."

 retired_legend: "Im Ruhestand befindliche Legende"
 desc_retired_legend: "Dieser Minister hat die Fackel seines größten Werkes an jüngere Hände weitergegeben — und ist dadurch zu etwas Seltenem geworden, mehr als nur ein aktiver Berater: eine lebende Institution. Seine fortwährende Präsenz am Hof trägt ein Gewicht an angesammelter Weisheit, das seinen Ersatz undenkbar macht, selbst wenn er sich aus den anspruchsvollsten Aufgaben zurückzieht."

 # ============================================================
 # ACTION-FORGED TRAIT EVENTS (cc_cond.30-34)
 # ============================================================

 cc_cond.30.title: "Der Integrationsspezialist"
 cc_cond.30.desc: "[minister.GetName] hat die Integration neuer Territorien mit ungewöhnlicher Kompetenz geleitet. Der beteiligte administrative und diplomatische Apparat ist komplex – und [minister.GetSheHe] hat beides gemeistert. Welche formale Anerkennung möchte die Krone aussprechen?"
 cc_cond.30.a: "Ernenne [minister.GetName] zu unserem erfahrenen Integrator – lass ihre Meisterschaft zu einem dauerhaften Gewinn werden."
 cc_cond.30.b: "Erkenne die kompetente Arbeit von [minister.GetName] ohne formale Erhebung an."

 cc_cond.31.title: "Der Kolonialstratege"
 cc_cond.31.desc: "[minister.GetName] war an der Spitze unserer Grenzexpansion – nicht nur in der Verwaltung, sondern in der Gestaltung ihrer Richtung. Siedler kommen bereitwilliger und unsere Expeditionen bewegen sich schneller, wenn [minister.GetSheHe] involviert ist. Welche Rolle weisen wir ihnen zu?"
 cc_cond.31.a: "Ernenne [minister.GetName] zu unserem Grenzverwalter – formalisiere das, was sie bereits sind."
 cc_cond.31.b: "Loben Sie [minister.GetName]s Arbeit an der Grenze ohne einen formalen Titel."

 cc_cond.32.title: "Der Entwicklungskommissar"
 cc_cond.32.desc: "[minister.GetName] hat ein dauerhaftes Entwicklungsprogramm in unserer wachsenden Hauptstadt geleitet, und die Ergebnisse sind in Stein und Holz in der ganzen Stadt sichtbar. Wie sollen wir das Geschaffene würdigen?"
 cc_cond.32.a: "Ernenne [minister.GetName] zum Förderer der Entwicklung – lass ihre Methoden im gesamten Reich Anwendung finden."
 cc_cond.32.b: "Erkenne die Arbeit von [minister.GetName] ohne formelle Ernennung an."

 cc_cond.33.title: "Der Schattenlenker"
 cc_cond.33.desc: "[minister.GetName] hat eine diskrete, aber bemerkenswert effektive Gegenspionage-Operation geleitet. Unsere Feinde stellen fest, dass ihre Informationen seltsam unzuverlässig sind, und unser diplomatischer Ruf hat von Fähigkeiten profitiert, die kein ausländischer Hof ganz erklären kann. Wie fahren wir fort?"
 cc_cond.33.a: "Formalisiere die Rolle von [minister.GetName] als Spionagechef – lass das Schattennetz wachsen."
 cc_cond.33.b: "Lassen Sie [minister.GetName] ihre Arbeit ohne formalen Titel fortsetzen."

 cc_cond.34.title: "Der Schatzkammerinspektor"
 cc_cond.34.desc: "[minister.GetName] hat eine umfassende Überprüfung der Kronenausgaben abgeschlossen – und der Bericht ist für alle außer die Schatzkammer unangenehm zu lesen. Die Zahlen legen nahe, dass erhebliche Einsparungen möglich sind. Was sollen wir mit [minister.GetHerHis] Erkenntnissen tun?"
 cc_cond.34.a: "Ernenne [minister.GetName] zum Schatzamtsvollstrecker – lass [minister.GetHerHis] Prüfung zur Richtlinie werden."
 cc_cond.34.b: "Setze einige der Empfehlungen von [minister.GetName] ohne formelle Ernennung um."

 # ============================================================
 # LEGENDARY TRAITS
 # ============================================================

 philosopher_king: "Philosophenkönig"
 desc_philosopher_king: "Dieser Herrscher verbindet echte intellektuelle Kraft mit politischer Autorität. Das Ergebnis ist ein Hof, an dem Ideen Gewicht haben und die Künste und Wissenschaften florieren."
 philosopher_king_die_desc: "[CHARACTER.GetName] ist gestorben. Die Geschichte wird darüber streiten, ob [CHARACTER.GetSheHe] wirklich das war, was der Titel behauptete. Die Bücher, die [CHARACTER.GetSheHe] schrieb, und die Institutionen, die [CHARACTER.GetSheHe] gründete, werden in [CHARACTER.GetHerHis] Namen argumentieren."

 grand_vizier_legendary: "Großwesir"
 desc_grand_vizier_legendary: "Es gibt Minister, und dann gibt es dies. Der Ruf des Großwesirs geht jedem diplomatischen Kontakt voraus, sein Netzwerk erstreckt sich über die bekannte Welt, und fremde Mächte behandeln seine Worte als verbindliche Politik. Er hat unser Reich formidabler gemacht, als es unsere Armeen allein könnten."
 grand_vizier_legendary_die_desc: "[CHARACTER.GetName] ist gestorben. Die Welt wird sich in der Abwesenheit von [CHARACTER.GetHerHis] Einfluss neu organisieren – und einige dieser Umstrukturierungen werden nicht zu unserem Vorteil sein."

 tribune_of_the_people: "Volkstribun"
 desc_tribune_of_the_people: "Dieser Berater ist beim einfachen Volk aufrichtig beliebt und nutzt diese Popularität zur Regierungsführung: Er bringt Gesetze durch das Parlament, unterdrückt Unruhen und gibt den Ständen das Gefühl, gehört zu werden."
 tribune_of_the_people_die_desc: "[CHARACTER.GetName] ist gestorben. Das Volk wird sichtbar und laut trauern, was eine eigene Art von politischer Botschaft an diejenigen ist, die nun die Macht innehaben."

 offensive_strategist_die_desc: "[CHARACTER.GetName] ist gestorben. Die Doktrin, die [CHARACTER.GetSheHe] schrieb, wird [CHARACTER.GetHerHim] in den Handbüchern überdauern – obwohl Handbücher sich nicht so an veränderte Umstände anpassen können, wie [CHARACTER.GetSheHe] es konnte."
 renaissance_patron_die_desc: "[CHARACTER.GetName] ist gestorben. Die Künstler, die [CHARACTER.GetSheHe] förderte, werden ihre nächsten Werke dem Andenken an [CHARACTER.GetHerHis] widmen – und damit sicherstellen, dass [CHARACTER.GetHerHis] Name das Jahrhundert überdauert."
 desc_seasoned_integrator: "Jahre in der Aufsicht über die Eingliederung neuer Territorien haben diesem Minister eine außergewöhnliche Meisterschaft der Integration verliehen – sowohl über den administrativen Apparat als auch über die diplomatischen Voraussetzungen. Unter seiner Leitung schreitet die Integration schneller voran und die Annexion kostet weniger."
 desc_frontier_administrator: "Dieser Minister hat die Grenzgebiete zu seinem natürlichen Lebensraum gemacht – er kartiert neue Territorien, schlichtet Streitigkeiten zwischen Kolonisten und der ansässigen Bevölkerung und verwandelt ferne Ansprüche in funktionierende Siedlungen. Die Kolonisation schreitet schneller voran und Migranten kommen bereitwilliger."
 desc_treasury_enforcer: "Dieser Minister hat jede Zeile der Ausgaben der Krone mit einem forensischen Blick geprüft. Die Hofausgaben sind gesunken, das Kabinett ist effizienter geworden, und niemand am Hof meldet sich freiwillig für unnötige Ausgaben, solange er sein Amt bekleidet."
 retired_legend_die_desc: "[CHARACTER.GetName] ist verstorben. Sie zogen sich auf dem Höhepunkt ihrer Macht zurück und entschieden sich, ihre verbleibenden Jahre als Mentor statt als Denkmal zu verbringen. Das ist auf seine Weise das Bemerkenswerteste, was sie getan haben."
