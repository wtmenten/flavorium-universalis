l_german:
 # ============================================================
 # Cabinet Experience: school seats, kinds and curricula
 # ============================================================

 # Notifications (events/cc_xp_school_events.txt)
 cc_xp_school.1.title: "Die Schule zieht um"
 cc_xp_school.1.desc: "Die von [cc_xp_school_founder.GetName] gegründete Schule kann ihren Sitz in [cc_xp_school_old_seat.GetName] nicht mehr halten. Ihre Meister, Bücher und Studenten sind an die Universität in [cc_xp_school_new_seat.GetName] gezogen, und der Unterricht wird dort fortgesetzt."
 cc_xp_school.1.a: "Lassen Sie es sich setzen."
 cc_xp_school.2.title: "Eine Schule im Exil"
 cc_xp_school.2.desc: "Die von [cc_xp_school_founder.GetName] gegründete Schule hat ihren Sitz in [cc_xp_school_old_seat.GetName] verloren, und keine andere Universität im Reich ist frei, um sie aufzunehmen.\n\nIhre Mitglieder studieren weiterhin und machen in ihrer Disziplin Fortschritte. Bis eine Universität frei wird, hat die Schule keinen Sitz: ihre Sitzboni und Aktionen sind ausgesetzt. Sie wird von selbst zurückkehren, sobald eine verfügbar ist."
 cc_xp_school.2.a: "Wir werden ein Zuhause dafür finden."
 cc_xp_school.3.title: "Die Schule kehrt zurück"
 cc_xp_school.3.desc: "Die von [cc_xp_school_founder.GetName] gegründete Schule hat wieder einen Sitz, an der Universität in [cc_xp_school_new_seat.GetName]. Ihre Sitzboni und Aktionen werden wieder aufgenommen."
 cc_xp_school.3.a: "Willkommen zurück."

 # Kind of institution, from the seat's religion (cc_xp_school_N_kind)
 CC_XP_SCHOOL_KIND_1: "Studium"
 CC_XP_SCHOOL_KIND_2: "Akademie"
 CC_XP_SCHOOL_KIND_3: "Madrasa"
 CC_XP_SCHOOL_KIND_4: "Shuyuan"
 CC_XP_SCHOOL_KIND_5: "Vihara"
 CC_XP_SCHOOL_KIND_6: "Gurukula"
 CC_XP_SCHOOL_KIND_7: "Jeschiwa"
 CC_XP_SCHOOL_KIND_8: "Schule"

 # Curriculum (cc_xp_school_N_curriculum)
 CC_XP_CURRICULUM_1: "Recht"
 CC_XP_CURRICULUM_2: "Theologie"
 CC_XP_CURRICULUM_3: "Naturphilosophie"
 CC_XP_CURRICULUM_4: "Gelehrsamkeit"
 CC_XP_CURRICULUM_5: "Militärwissenschaft"

 # Curriculum tooltips
 CC_XP_CURRICULUM_1_TT: "Rechtswissenschaft. Ein administrativer Lehrplan. Am Sitz: höhere maximale Kontrolle und weniger Unruhe. Im gesamten Reich: schnelleres Kontrollwachstum, und die Gesellschaft bewegt sich in Richtung Jurisprudenz.\n\nBoni werden durch die Qualität der Schule skaliert. Das Reich erhält den nationalen Bonus jedes Lehrplans einmalig, unabhängig davon, wie viele Schulen ihn unterrichten."
 CC_XP_CURRICULUM_2_TT: "Theologie. Ein administrativer Lehrplan. Am Sitz: schnellere Konvertierung von Häretikern und weniger Unruhe. Im gesamten Reich: religiöser Einfluss und Toleranz gegenüber der Staatsreligion, und die Gesellschaft bewegt sich in Richtung Spiritualismus.\n\nBoni werden durch die Qualität der Schule skaliert. Das Reich erhält den nationalen Bonus jedes Lehrplans einmalig, unabhängig davon, wie viele Schulen ihn unterrichten."
 CC_XP_CURRICULUM_3_TT: "Naturphilosophie. Ein administrativer Lehrplan. Am Sitz: höhere maximale Alphabetisierung. Im gesamten Reich: schnellere Forschung, und die Gesellschaft bewegt sich in Richtung Innovation.\n\nBoni werden durch die Qualität der Schule skaliert. Das Reich erhält den nationalen Bonus jedes Lehrplans einmalig, unabhängig davon, wie viele Schulen ihn unterrichten."
 CC_XP_CURRICULUM_4_TT: "Literatur. Ein diplomatischer Lehrplan. Am Sitz: kultureller Einfluss. Im gesamten Reich: monatliches Prestige und diplomatische Reichweite, und die Gesellschaft bewegt sich in Richtung Humanismus.\n\nBoni werden durch die Qualität der Schule skaliert. Das Reich erhält den nationalen Bonus jedes Lehrplans einmalig, unabhängig davon, wie viele Schulen ihn unterrichten."
 CC_XP_CURRICULUM_5_TT: "Militärwissenschaft. Ein militärischer Lehrplan. Am Sitz: schnelleres Kontrollwachstum. Im gesamten Reich: Landmoral und Armeetradition, und die Gesellschaft bewegt sich in Richtung Qualität.\n\nBoni werden durch die Qualität der Schule skaliert. Das Reich erhält den nationalen Bonus jedes Lehrplans einmalig, unabhängig davon, wie viele Schulen ihn unterrichten."

 # ---- Schools tab ----
 CC_XP_SCHOOLS_FOUNDED_LABEL: "Schulen"
 CC_XP_SCHOOLS_FOUNDED_TT: "Gegründete Schulen, bezogen auf die Anzahl, die dieses Reich halten darf."
 CC_XP_SCHOOLS_MEMBERS_LABEL: "Mitglieder"
 CC_XP_SCHOOL_OF: "von"
 CC_XP_SCHOOL_IN_EXILE: "#R Im Exil#!"
 CC_XP_SCHOOL_IN_EXILE_TT: "Diese Schule hat ihren Sitz verloren und keine andere Universität im Reich ist frei. Ihre Mitglieder gewinnen weiterhin Erfahrung, aber ihre Sitzboni und Projekte sind ausgesetzt. Sie kehrt von selbst zurück, sobald eine Universität frei wird."
 CC_XP_SCHOOL_TRACK_TT: "Die Disziplin, die diese Schule lehrt. Jedes Mitglied gewinnt jedes Jahr an Erfahrung darin."
 CC_XP_SCHOOL_FOUNDER_LABEL: "Gründer"
 CC_XP_SCHOOL_RECTOR_LABEL: "Rektor"
 CC_XP_SCHOOL_NO_RECTOR: "Kein Rektor"
 CC_XP_SCHOOL_RECTOR_TT: "Weisen Sie einem Minister im Kabinettsbildschirm die Aufgabe des #Y Rektors#! zu und wählen Sie den Sitz dieser Schule. Während sie im Amt sind, erhalten Mitglieder doppelte Erfahrung, Projekte erscheinen alle 2 statt 3 Jahre, das Curriculum kann nach 5 statt 10 Jahren geändert werden und der Sitz gewinnt an Institutionswachstum und Alphabetisierung."
 CC_XP_SCHOOL_MEMBERS_LABEL: "Mitglieder"
 CC_XP_SCHOOL_MEMBERS_TT: "Aktive Mitglieder dieser Schule. Jedes gewinnt jedes Jahr Erfahrung in seiner Disziplin: das Eineinhalbfache für ein Mitglied, das die Kultur des Sitzes teilt, und das Doppelte unter einem Rektor."
 CC_XP_SCHOOL_CURRICULUM_LABEL: "Curriculum"

 # Buttons
 CC_XP_SCHOOL_BTN_ENDOW: "Stiften"
 CC_XP_SCHOOL_BTN_CHAIRS: "Königliche Lehrstühle"
 CC_XP_SCHOOL_BTN_SCHOLARS: "Gelehrte"
 CC_XP_SCHOOL_BTN_DISPUTATION: "Disputation"
 CC_XP_SCHOOL_BTN_CURRICULUM: "Curriculum"

 # Actions (aliased per school by cc_xp_school_actions_l_english.yml)
 cc_xp_school_endow: "Die Bibliothek stiften"
 cc_xp_school_endow_desc: "Bücher, Instrumente und ein Gebäude für diese Schule finanzieren. Sofortiger Forschungsfortschritt und höhere Alphabetisierung am Sitz für zehn Jahre.\n\nEine Schule übernimmt jeweils ein Projekt: danach benötigt sie 3 Jahre (2 unter einem Rektor), bevor das nächste beginnen kann."
 cc_xp_school_chairs: "Königliche Lehrstühle"
 cc_xp_school_chairs_desc: "Bezahlte Professuren für eine Amtszeit finanzieren. Jedes Mitglied dieser Schule gewinnt Erfahrung in seinem Fachbereich. Proteges gewinnen mehr als Minister, da die Schule alles ist, was sie haben.\n\nEine Schule übernimmt jeweils ein Projekt: danach benötigt sie 3 Jahre (2 unter einem Rektor), bevor das nächste beginnen kann."
 cc_xp_school_scholars: "Ausländische Gelehrte einladen"
 cc_xp_school_scholars_desc: "Nutze den Namen des Hofes, um Gelehrte aus dem Ausland anzuziehen. Der Sitz macht Fortschritte bei jeder Institution, die das Reich kennt, aber der Sitz nicht besitzt, und baut Institutionen für zehn Jahre schneller aus.\n\nEine Schule übernimmt jeweils ein Projekt: Danach benötigt sie 3 Jahre (2 unter einem Rektor), bevor das nächste beginnen kann."
 cc_xp_school_disputation: "Eine Disputation abhalten"
 cc_xp_school_disputation_desc: "Veranstalten Sie eine öffentliche Debatte über eine Frage aus dem Lehrplan der Schule. Der Hof entscheidet über den Ausgang.\n\nEine Schule übernimmt jeweils ein Projekt: Danach benötigt sie 3 Jahre (2 unter einem Rektor), bevor das nächste beginnen kann."
 cc_xp_school_curriculum: "Curriculum ändern"
 cc_xp_school_curriculum_desc: "Wählen Sie, was diese Schule lehrt. Jedes Curriculum gibt einen Bonus am Sitz und einen im gesamten Reich und bestimmt, welche Disputationen geführt werden. Einmal geändert, kann es für 10 Jahre nicht erneut geändert werden (5 unter einem Rektor)."

 # Action gates
 cc_xp_tt_school_exists: "Diese Schule wurde gegründet"
 cc_xp_tt_school_not_exiled: "Diese Schule hat einen Sitz (sie ist nicht im Exil)"
 cc_xp_tt_school_not_busy: "Diese Schule hat kein laufendes Projekt"
 cc_xp_tt_school_has_members: "Diese Schule hat mindestens ein lebendes Mitglied"
 cc_xp_tt_school_curriculum_settled: "Diese Schule hat ihren Lehrplan vor kurzem nicht geändert"

 # ---- Rector duty ----
 cc_duty_rector: "Rektor"
 cc_duty_rector_desc: "Der Minister übernimmt die Leitung einer der Schulen des Reiches. Ihre Mitglieder erhalten doppelte Erfahrung, ihre Projekte und Lehrplanänderungen treten früher ein, und ihr Sitz baut Institutionen und Alphabetisierung schneller auf."
 cc_duty_rector_action: "Rektor"
 cc_duty_rector_active: "Dient als Rektor"
 cc_duty_rector_select_school: "Welche Schule?"
 cc_duty_rector_no_school: "@trigger_no! Das Reich besitzt keine etablierte Schule ohne einen Rektor."

 # ---- Disputations ----
 cc_xp_school.11.title: "Eine Disputation über das Recht"
 cc_xp_school.11.desc: "Die Meister in [cc_xp_school_new_seat.GetName] haben eine Woche lang über eine Frage gestritten: Wenn Gewohnheitsrecht und königliches Statut nicht übereinstimmen, welcher sollte ein Gericht folgen? Die Halle war jeden Tag voll. Beide Seiten wollen nun, dass die Krone entscheidet, wer gewonnen hat."
 cc_xp_school.11.a: "Statut. Das Gesetz der Krone ist bindend."
 cc_xp_school.11.b: "Gewohnheitsrecht. Das alte Gesetz des Landes bleibt bestehen."
 cc_xp_school.11.c: "Veröffentliche beide Argumente und lass die Höfe sie lesen."
 cc_xp_school.12.title: "Eine Frage der Doktrin"
 cc_xp_school.12.desc: "Eine Disputation an der [cc_xp_school_new_seat.GetName] ist weiter gegangen, als es jemand beabsichtigt hatte. Ein junger Meister verteidigte eine Auslegung der Schrift, die der Klerus für gefährlich hält, und die Studenten schlossen sich ihm an. Die Bischöfe haben an die Krone geschrieben."
 cc_xp_school.12.a: "Halte an der überlieferten Lehre fest."
 cc_xp_school.12.b: "Lassen Sie sie streiten. Dafür ist die Schule da."
 cc_xp_school.12.c: "Überweise die Frage an den Klerus."
 cc_xp_school.13.title: "Ein Experiment vor dem Hofe"
 cc_xp_school.13.desc: "Die Meister in [cc_xp_school_new_seat.GetName] haben dem Hof ein Experiment vorgeführt: ein Ergebnis, von dem die alten Autoritäten behaupteten, es sei unmöglich, und das dreimal vor Zeugen wiederholt wurde. Die Bürger wollen wissen, was es wert ist. Der Klerus will wissen, was es bedeutet."
 cc_xp_school.13.a: "Bezahle für weitere Versuche."
 cc_xp_school.13.b: "Genug. Beenden Sie die Demonstrationen."
 cc_xp_school.13.c: "Die Studenten es wiederholen lassen, bis sie es verstehen."
 cc_xp_school.14.title: "Ein Wettstreit der Briefe"
 cc_xp_school.14.desc: "Die Schule in [cc_xp_school_new_seat.GetName] hat einen öffentlichen Wettbewerb in Poesie und Rhetorik abgehalten. Die gewinnenden Beiträge werden bereits kopiert und am Hof herumgereicht."
 cc_xp_school.14.a: "Krönen Sie den Gewinner vor dem Hofe."
 cc_xp_school.14.b: "Drucke die Einträge."
 cc_xp_school.14.c: "Kopien an ausländische Höfe senden."
 cc_xp_school.15.title: "Eine Disputation über den Krieg"
 cc_xp_school.15.desc: "Die Meister in [cc_xp_school_new_seat.GetName] haben eine Abhandlung über Exerzieren und die Schlachtordnung fertiggestellt und diese gegen zwei erfahrene Kapitäne verteidigt. Die Kapitäne haben verloren. Der Adel, der die Offiziere der Armee stellt, fand es nicht angenehm, dies zu hören."
 cc_xp_school.15.a: "Führen Sie den neuen Exerzierdrill ein."
 cc_xp_school.15.b: "Es vorerst im Hörsaal belassen."
 cc_xp_school.15.c: "Die Meister zum Unterrichten in die Garnisonen senden."

 # ---- Change curriculum ----
 cc_xp_school.20.title: "Was soll die Schule lehren?"
 cc_xp_school.20.desc: "Die Meister der Schule an der [cc_xp_school_new_seat.GetName] erwarten die Entscheidung der Krone über ihren Lehrplan. Eine Schule lehrt innerhalb ihrer Disziplin, daher stehen ihr fünf Lehrpläne offen. Die Wahl bestimmt, was sie lehren, was der Sitz und das Reich davon haben und über welche Fragen sie in den kommenden Jahren streiten werden."
 cc_xp_school.20.a: "Recht"
 cc_xp_school.20.b: "Theologie"
 cc_xp_school.20.c: "Naturphilosophie"
 cc_xp_school.20.d: "Gelehrsamkeit"
 cc_xp_school.20.e: "Militärwissenschaft"
 cc_xp_school.20.f: "Den derzeitigen Lehrplan beibehalten."
 cc_xp_school.20.g: "Medizin"
 cc_xp_school.20.h: "Navigation"

 # ---- Renown and quality ----
 CC_XP_SCHOOL_RENOWN_LABEL: "Ruhm"
 CC_XP_SCHOOL_QUALITY_LABEL: "Qualität"
 CC_XP_SCHOOL_RENOWN_TIER_1: "Lokal"
 CC_XP_SCHOOL_RENOWN_TIER_2: "Regional"
 CC_XP_SCHOOL_RENOWN_TIER_3: "Berühmt"
 CC_XP_SCHOOL_RENOWN_TIER_4: "Illustre"
 CC_XP_SCHOOL_QUALITY_TIER_1: "Arm"
 CC_XP_SCHOOL_QUALITY_TIER_2: "Ausreichend"
 CC_XP_SCHOOL_QUALITY_TIER_3: "Gut"
 CC_XP_SCHOOL_QUALITY_TIER_4: "Exzellent"
 CC_XP_SCHOOL_RENOWN_TT_HEAD: "#T Renommee#!\nWie weithin die Schule bekannt ist. Es dauert etwa ein Jahrhundert, sie aufzubauen: Jedes Jahr steigt sie um 8 % in Richtung ihres Zielwerts (und sinkt um 15 %, wenn sie darüber liegt). Der Sitz, das Reich und die Lehrbedingungen zählen nur insoweit, als die Schule etabliert ist, was nach 100 Jahren vollständig der Fall ist."
 CC_XP_SCHOOL_RENOWN_TT_FOOT: "Halbiert im Exil und 0, solange die Schule keine Mitglieder hat. Ereignisse und Projekte steigern den Ruhm direkt; dieser Anstieg klingt über die folgenden Jahre wieder in Richtung des Zielwerts ab.\n\nDer Ruhm bestimmt das Prestige und den kulturellen Einfluss des Reiches durch seine Schulen und zieht Gelehrte (ab 40), ausländische Studenten (ab 30) und Künstler (ab 50) an."
 CC_XP_SCHOOL_QUALITY_TT_HEAD: "#T Qualität#!\nWie gut die Lehre ist. Jedes Jahr bewegt sie sich um 20 % in Richtung ihres Zielwerts, welcher die Summe aus Folgendem ist:"
 CC_XP_SCHOOL_QUALITY_TT_FOOT: "10 Basiswert im Exil und 0, solange die Schule keine Mitglieder hat. Stiftungen und königliche Lehrstühle erhöhen die Qualität direkt.\n\nDie Qualität skaliert die Boni für Plätze und Lehrpläne der Schule sowie die jährliche Erfahrung ihrer Mitglieder. Aktuelle Skalierung:"
 CC_XP_SCHOOL_TT_AGE: "Alter:"
 CC_XP_SCHOOL_TT_SEAT: "Sitz (Entwicklung, Alphabetisierung, Hauptstadt):"
 CC_XP_SCHOOL_TT_REALM: "Reich (Prestige, Rang, Großmacht):"
 CC_XP_SCHOOL_TT_TEACHING: "Lehre (ein Fünftel der Qualität):"
 CC_XP_SCHOOL_TT_TARGET: "Ziel:"
 CC_XP_SCHOOL_TT_FUNDING: "Finanzierung (Kulturbudget):"
 CC_XP_SCHOOL_TT_RECTOR: "Rektor (10 plus deren Dienstalter):"
 CC_XP_SCHOOL_TT_STABLE: "Festgelegtes Curriculum:"
 CC_XP_SCHOOL_TT_SENIORS: "Ältere Mitglieder (jeweils 3, bis zu 15):"
 CC_XP_SCHOOL_STANDING_PREFIX: "Rang"
 CC_XP_SCHOOL_STANDING_TT: "Hier wird angezeigt, wo der Ruhm dieser Schule sie unter den Universitäten der Welt einordnet. Jeder ausländische Ort mit einer Universität wird einmal im Jahr basierend auf seinem Sitz und seinem Reich bewertet, plus 15 für eine etablierte Stiftung. Dies ist die Anzahl der Institutionen, deren Wert über dem Ruhm dieser Schule liegt, plus eins."
 CC_XP_SCHOOL_FOUNDED_PREFIX: "Gegründet"
 CC_XP_SCHOOL_FOUNDER_TT: "Der Minister, der diese Schule gründete und ihre Disziplin wählte."
 CC_XP_SCHOOLS_RIVAL_LABEL: "Führende Universität auf unserem Kontinent:"
 CC_XP_SCHOOLS_RIVAL_TT: "Die bedeutendste ausländische Universität auf dem Kontinent unserer Hauptstadt und ihr Wert. Jährlich neu bewertet. Eine Schule, deren Ruhm mehr als 10 Punkte hinter ihr liegt, kann Meister und Studenten an sie verlieren. Der Rang auf jeder Schulkarte bezieht sich weiterhin auf alle Universitäten der Welt."

 # Funding
 CC_XP_SCHOOL_FUNDING_LABEL: "Finanzierung"
 CC_XP_SCHOOL_FUNDING_CULTURE: "Kulturbudget bei #Y [Player.MakeScope.GetVariable('cc_xp_school_culture_pos').GetValue|%0]#!"
 CC_XP_SCHOOL_FUNDING_CUSTOMARY: "Gewohnheitszulage"
 CC_XP_SCHOOL_FUNDING_CUSTOMARY_TT: "Dieses Reich kann noch nicht in Kultur investieren. Bis dies möglich ist, leben seine Schulen von einer herkömmlichen Zuwendung, die die Qualität auf 35 festlegt und nichts kostet."
 CC_XP_SCHOOL_FUNDING_TT: "Schulen werden aus dem #Y Kultur#!-Budget des Reiches bezahlt. Je höher der Kultur-Schieberegler, desto höher ist die Qualität, bei der sich jede Schule einpendelt (20 bei leerem Regler, 45 bei der Hälfte, 70 bei voller Auslastung), und desto teurer wird sie: bis zu 5 % des monatlichen Handels- und Steuereinkommens pro besetztem Platz, skaliert durch den Regler. Bevor das Reich in Kultur investiert, existieren Schulen von einer herkömmlichen Zuwendung, die die Qualität bei 35 stabilisiert und nichts kostet. Es wird nichts bezahlt, solange eine Schule im Exil ist oder keine Mitglieder hat."
 CC_XP_SCHOOL_PER_MONTH: "pro Monat"

 # Option gates
 cc_xp_tt_school_quality_40: "Die Qualität der Schule beträgt mindestens 40"
 cc_xp_tt_school_quality_50: "Die Qualität der Schule beträgt mindestens 50"
 cc_xp_tt_school_quality_60: "Die Qualität der Schule beträgt mindestens 60"
 cc_xp_tt_school_coastal: "Der Sitz der Schule liegt an der Küste"

 # New curricula
 CC_XP_CURRICULUM_6: "Medizin"
 CC_XP_CURRICULUM_7: "Navigation"
 CC_XP_CURRICULUM_6_TT: "Medizin. Ein administrativer Lehrplan. Am Sitz: Krankheitsresistenz und Bevölkerungswachstum. Im gesamten Reich: Krankheitsresistenz, und die Gesellschaft bewegt sich in Richtung Humanismus. Erfordert Qualität 50 zur Einführung.\n\nBoni werden durch die Qualität der Schule skaliert. Das Reich erhält den nationalen Bonus jedes Lehrplans einmalig, unabhängig davon, wie viele Schulen ihn unterrichten."
 CC_XP_CURRICULUM_7_TT: "Navigation. Ein militärischer Lehrplan. Am Sitz: schnellerer Schiffsbau und mehr Seeleute. Im gesamten Reich: Marine-Reichweite und Marinetradition, und die Gesellschaft bewegt sich in Richtung Seekraft.\n\nBoni werden durch die Qualität der Schule skaliert. Das Reich erhält den nationalen Bonus jedes Lehrplans einmalig, unabhängig davon, wie viele Schulen ihn unterrichten."

 # Fourth disputation options (quality 60)
 cc_xp_school.11.d: "Die Meister einen Kodex entwerfen lassen, der die Frage klärt."
 cc_xp_school.12.d: "Berufen Sie die Meister und die Bischöfe gemeinsam ein."
 cc_xp_school.13.d: "Verkünden Sie das Ergebnis den Gelehrten eines jeden Hofes."
 cc_xp_school.14.d: "Eine Druckerei an der Schule gründen."
 cc_xp_school.15.d: "Lassen Sie die Meister das Exerzierreglement des Reiches schreiben."
 cc_xp_school.16.title: "Ein Streit über die Ärzte"
 cc_xp_school.16.desc: "Die Ärzte in [cc_xp_school_new_seat.GetName] sind zerstritten. Eine Partei lehrt nach den alten Autoritäten; die andere hat die Körper hingerichteter Krimineller studiert und behauptet, die Autoritäten lägen falsch. Beide haben die Krone gebeten, den Streit zu schlichten."
 cc_xp_school.16.a: "Ein Krankenhaus finanzieren, in dem beides getestet werden kann."
 cc_xp_school.16.b: "Folgen Sie den alten Autoritäten."
 cc_xp_school.16.c: "Lassen Sie die Studenten die Toten studieren."
 cc_xp_school.16.d: "Veröffentliche die Ergebnisse."
 cc_xp_school.17.title: "Karten und Sterne"
 cc_xp_school.17.desc: "Die Meister in [cc_xp_school_new_seat.GetName] haben eine neue Reihe von Tabellen zur Positionsbestimmung eines Schiffes auf See fertiggestellt. Die Kaufleute wollen, dass diese für ihre eigenen Kapitäne zurückgehalten werden. Die Meister wollen sie drucken lassen."
 cc_xp_school.17.a: "Beauftragen Sie sie mit neuen Karten."
 cc_xp_school.17.b: "Die Meister mit der Flotte zur See senden."
 cc_xp_school.17.c: "Die Tabellen für unsere eigenen Kapitäne behalten."
 cc_xp_school.17.d: "Drucke die Tabellen, damit alle sie nutzen können."

 # ---- Renown events ----
 cc_xp_school.30.title: "Ein vielversprechender Gelehrter"
 cc_xp_school.30.desc: "Die Schule in [cc_xp_school_new_seat.GetName] hat einen jungen Gelehrten von echtem Talent angezogen, [cc_xp_school_scholar.GetName], der wegen des Namens der Schule kam. Die Meister glauben, dass man aus ihm etwas machen könnte."
 cc_xp_school.30.a: "Nehmen Sie sie als Protegé in die Obhut der Krone auf."
 cc_xp_school.30.b: "Gib ihnen einen Platz am Hof und an der Schule."
 cc_xp_school.30.c: "Wir haben keinen Platz für sie."
 cc_xp_school.31.title: "Ein ausländischer Student"
 cc_xp_school.31.desc: "Eine im Ausland angesehene Familie hat ihren Erben zum Studium an der [cc_xp_school_new_seat.GetName] geschickt. Der Name der Schule erreichte sie, bevor es einer unserer Botschafter tat."
 cc_xp_school.31.a: "Erheben Sie die vollen Gebühren."
 cc_xp_school.31.b: "Verzichte aus Höflichkeit auf die Gebühren."
 cc_xp_school.31.c: "Gib ihnen die besten Meister, die wir haben."
 cc_xp_school.32.title: "Ein von der Schule angezogener Künstler"
 cc_xp_school.32.desc: "[cc_xp_school_artist.GetName], ein Künstler mit wachsendem Ruf, ist nach [cc_xp_school_new_seat.GetName] gekommen, um unter seinen Gelehrten zu arbeiten, und fragt, ob die Krone einen Platz für sie hat."
 cc_xp_school.32.a: "Bieten Sie ihnen einen Platz am Hof an."
 cc_xp_school.32.b: "Wir haben keinen Raum für sie."
 cc_xp_school.40.title: "Ein Meister wird geworben"
 cc_xp_school.40.desc: "Einem der besten Meister in [cc_xp_school_new_seat.GetName] wurde ein Lehrstuhl in [cc_xp_school_rival.GetName] angeboten, dessen Universität unsere nun in den Schatten stellt. Das Angebot ist großzügig."
 cc_xp_school.40.a: "Das Angebot annehmen."
 cc_xp_school.40.b: "Erinnere sie daran, was sie der Krone schuldig sind."
 cc_xp_school.40.c: "Lassen Sie sie gehen."
 cc_xp_school.41.title: "Studenten verlassen die Schule"
 cc_xp_school.41.desc: "Studenten, die eigentlich nach [cc_xp_school_new_seat.GetName] gekommen wären, gehen stattdessen nach [cc_xp_school_rival.GetName]. Deren Meister sind bekannter, und unter den Abwandernden befinden sich auch die Söhne unserer eigenen Kaufleute."
 cc_xp_school.41.a: "Stipendien finanzieren, um sie hierzubehalten."
 cc_xp_school.41.b: "Auslandsstudien verbieten."
 cc_xp_school.41.c: "Lassen Sie sie gehen."
 cc_xp_school.42.title: "Erste unter den Universitäten"
 cc_xp_school.42.desc: "Von keiner Universität in der bekannten Welt wird mehr gesprochen als von der Schule in [cc_xp_school_new_seat.GetName]. Gelehrte, die einst anderswo hingen, kommen nun hierher, und ausländische Höfe fragen namentlich nach ihren Meistern."
 cc_xp_school.42.a: "Einen Gelehrtenkongress ausrichten."
 cc_xp_school.42.b: "Feiern Sie es am Hofe."
 cc_xp_school_tt_curriculum_switch: "Die derzeitigen Lehrplanboni der Schule enden, und die des neuen Lehrplans gelten an ihrem Sitz sowie im gesamten Reich."
 cc_xp_school_while_seated: "solange die Schule hier ansässig ist"
 cc_xp_school_while_taught: "solange eine unserer Schulen diesen Lehrplan lehrt"
 cc_xp_school_while_renowned: "solange unsere Schulen ihren Ruhm bewahren"
 STATIC_MODIFIER_NAME_cc_xp_school_seat_law: "Sitz einer Rechtsschule"
 STATIC_MODIFIER_DESC_cc_xp_school_seat_law: "Die hiesige Schule bildet Juristen und Schreiber aus, und die Stadt wird von Menschen regiert, die ihr Handwerk dort erlernt haben."
 STATIC_MODIFIER_NAME_cc_xp_school_seat_theology: "Sitz einer Theologieschule"
 STATIC_MODIFIER_DESC_cc_xp_school_seat_theology: "Die hiesige Schule bildet Prediger und Beichtväter aus, und ihre Predigten erreichen die ganze Stadt."
 STATIC_MODIFIER_NAME_cc_xp_school_seat_natural_philosophy: "Sitz einer Naturphilosophischen Schule"
 STATIC_MODIFIER_DESC_cc_xp_school_seat_natural_philosophy: "Die hiesige Schule lehrt Lesen, Messen und Rechnen jeden, der bezahlen kann, und viele können es."
 STATIC_MODIFIER_NAME_cc_xp_school_seat_letters: "Sitz einer Geisteswissenschaftlichen Schule"
 STATIC_MODIFIER_DESC_cc_xp_school_seat_letters: "Dichter, Redner und Kopisten versammeln sich um die hiesige Schule, und ihre Schriften verbreiten sich."
 STATIC_MODIFIER_NAME_cc_xp_school_seat_military_science: "Sitz einer Militärwissenschaftlichen Schule"
 STATIC_MODIFIER_DESC_cc_xp_school_seat_military_science: "An der hiesigen Schule ausgebildete Offiziere halten das umliegende Land in Ordnung."
 STATIC_MODIFIER_NAME_cc_xp_school_seat_medicine: "Sitz einer medizinischen Schule"
 STATIC_MODIFIER_DESC_cc_xp_school_seat_medicine: "Die Ärzte der hiesigen Schule behandeln die Stadtbevölkerung, und weniger Menschen sterben an heilbaren Leiden."
 STATIC_MODIFIER_NAME_cc_xp_school_seat_navigation: "Sitz einer Navigationsschule"
 STATIC_MODIFIER_DESC_cc_xp_school_seat_navigation: "Schiffbauer und Lotsen erlernen hier an der Schule ihr Handwerk."
 STATIC_MODIFIER_NAME_cc_xp_school_realm_law: "In Rechtswissenschaften geschult"
 STATIC_MODIFIER_DESC_cc_xp_school_realm_law: "Die Beamten des Reiches werden an einer eigenen Rechtsschule ausgebildet."
 STATIC_MODIFIER_NAME_cc_xp_school_realm_theology: "In Theologie geschult"
 STATIC_MODIFIER_DESC_cc_xp_school_realm_theology: "Der Klerus des Reiches wird an einer eigenen Theologieschule ausgebildet."
 STATIC_MODIFIER_NAME_cc_xp_school_realm_natural_philosophy: "In Naturphilosophie geschult"
 STATIC_MODIFIER_DESC_cc_xp_school_realm_natural_philosophy: "Die eigene naturphilosophische Schule des Reiches liefert neues Wissen an den Hof."
 STATIC_MODIFIER_NAME_cc_xp_school_realm_letters: "In Belles Lettres geschult"
 STATIC_MODIFIER_DESC_cc_xp_school_realm_letters: "Die Gelehrtenschule des Reiches sorgt dafür, dass sein Hof im Ausland bewundert wird und seine Korrespondenz weiter reicht."
 STATIC_MODIFIER_NAME_cc_xp_school_realm_military_science: "In Militärwissenschaft geschult"
 STATIC_MODIFIER_DESC_cc_xp_school_realm_military_science: "Die Offiziere des Reiches werden an einer eigenen militärwissenschaftlichen Schule ausgebildet."
 STATIC_MODIFIER_NAME_cc_xp_school_realm_medicine: "In Medizin geschult"
 STATIC_MODIFIER_DESC_cc_xp_school_realm_medicine: "An der medizinischen Schule des Reiches ausgebildete Ärzte praktizieren im ganzen Land."
 STATIC_MODIFIER_NAME_cc_xp_school_realm_navigation: "In Navigation geschult"
 STATIC_MODIFIER_DESC_cc_xp_school_realm_navigation: "Die Lotsen des Reiches werden an einer eigenen Navigationsschule ausgebildet."
 STATIC_MODIFIER_NAME_cc_xp_school_kind_studium: "Studium"
 STATIC_MODIFIER_DESC_cc_xp_school_kind_studium: "Hier befindet sich ein Studium der westlichen Kirche."
 STATIC_MODIFIER_NAME_cc_xp_school_kind_academy: "Akademie"
 STATIC_MODIFIER_DESC_cc_xp_school_kind_academy: "Hier befindet sich eine Akademie in östlicher Tradition."
 STATIC_MODIFIER_NAME_cc_xp_school_kind_madrasa: "Madrasa"
 STATIC_MODIFIER_DESC_cc_xp_school_kind_madrasa: "Hier befindet sich eine Madrasa."
 STATIC_MODIFIER_NAME_cc_xp_school_kind_shuyuan: "Shuyuan"
 STATIC_MODIFIER_DESC_cc_xp_school_kind_shuyuan: "Hier befindet sich ein Shuyuan, eine Akademie in ostasiatischer Tradition."
 STATIC_MODIFIER_NAME_cc_xp_school_kind_vihara: "Vihara"
 STATIC_MODIFIER_DESC_cc_xp_school_kind_vihara: "Hier befindet sich eine Klosterschule."
 STATIC_MODIFIER_NAME_cc_xp_school_kind_gurukula: "Gurukula"
 STATIC_MODIFIER_DESC_cc_xp_school_kind_gurukula: "Hier befindet sich ein Gurukula."
 STATIC_MODIFIER_NAME_cc_xp_school_kind_yeshiva: "Jeschiwa"
 STATIC_MODIFIER_DESC_cc_xp_school_kind_yeshiva: "Hier befindet sich eine Jeschiwa."
 STATIC_MODIFIER_NAME_cc_xp_school_kind_school: "Sitz einer Schule"
 STATIC_MODIFIER_DESC_cc_xp_school_kind_school: "Eine der Schulen des Reiches befindet sich hier."
 STATIC_MODIFIER_NAME_cc_xp_school_library: "Gestiftete Bibliothek"
 STATIC_MODIFIER_DESC_cc_xp_school_library: "Die Krone hat Bücher, Instrumente und ein Gebäude für die hiesige Schule bezahlt."
 STATIC_MODIFIER_NAME_cc_xp_school_scholars: "Ausländische Gelehrte"
 STATIC_MODIFIER_DESC_cc_xp_school_scholars: "Gelehrte aus dem Ausland sind gekommen, um an der hiesigen Schule zu lehren, und bringen neue Ideen mit sich."
 STATIC_MODIFIER_NAME_cc_xp_school_drill: "Die Exerzierordnung der Schule"
 STATIC_MODIFIER_DESC_cc_xp_school_drill: "Das Heer exerziert nach einem Handbuch, das an der militärwissenschaftlichen Schule des Reiches verfasst wurde."
 STATIC_MODIFIER_NAME_cc_xp_school_statute: "Statut über Gewohnheitsrecht"
 STATIC_MODIFIER_DESC_cc_xp_school_statute: "Die Gerichte folgen dem königlichen Statut, wenn dieses und das Gewohnheitsrecht nicht übereinstimmen, wie die Juristen der Schule argumentierten."
 STATIC_MODIFIER_NAME_cc_xp_school_renown: "Renommierte Schulen"
 STATIC_MODIFIER_DESC_cc_xp_school_renown: "Die Schulen des Reiches sind im Ausland bekannt, und ihr Ruf kommt dem Hof zugute. Skaliert mit dem Ruhm der renommiertesten Schule des Reiches."
 CC_XP_SCHOOL_DORMANT: "#R Ruhend#!"
 CC_XP_SCHOOL_DORMANT_TT: "Diese Schule hat keine lebenden Mitglieder. Niemand lehrt dort und niemand trägt ihren Namen, sodass sie nicht länger altert, nichts kostet und ihr Ruhm sowie ihre Qualität jedes Jahr ein wenig schwinden. Sie erwacht, sobald wieder jemand eingeschrieben wird."
 cc_xp_school.50.title: "Eine Abhandlung über die Einnahmen"
 cc_xp_school.50.desc: "Die Meister an der [cc_xp_school_new_seat.GetName] haben eine Abhandlung darüber fertiggestellt, wie die Krone ihre Einnahmen einzieht, mit Tabellen, die zeigen, wo das Geld auf dem Weg zur Schatzkammer verloren geht. Mehrere dieser Verluste führen zu Adelsfamilien."
 cc_xp_school.50.a: "Die neuen Konten einführen."
 cc_xp_school.50.b: "Lehren Sie es im Hörsaal und lassen Sie die Schatzkammer in Ruhe."
 cc_xp_school.50.c: "Teilen Sie es mit den Gilden, die bessere Bücher führen als wir."
 cc_xp_school.50.d: "Ernennen Sie die Meister zu Prüfern der Schatzkammer."
 cc_xp_school.51.title: "Ein Wettstreit der Redner"
 cc_xp_school.51.desc: "Ein zu Besuch gewesener Gesandter forderte die Meister von [cc_xp_school_new_seat.GetName] heraus, öffentlich gegen ihn zu argumentieren. Ihr bester Redner sprach eine Stunde lang ohne Notizen, und der Gesandte ging bereits vor dem Ende."
 cc_xp_school.51.a: "Senden Sie unseren Champion mit der nächsten Gesandtschaft."
 cc_xp_school.51.b: "Diese Fertigkeit für unsere eigene Kanzlei bewahren."
 cc_xp_school.51.c: "Die Studenten beide Seiten jeder Frage argumentieren lassen."
 cc_xp_school.51.d: "Drucken Sie die Reden, damit jeder Hof sie lesen kann."
 cc_xp_school.52.title: "Eine Grammatik einer fernen Zunge"
 cc_xp_school.52.desc: "Die Meister an der [cc_xp_school_new_seat.GetName] haben eine Grammatik und ein Wörterbuch einer Sprache fertiggestellt, von der nur wenige am Hofe jemals gehört haben. Sie sagen, sie öffne eine Tür. Manigfaltig ist man sich jedoch nicht einig, wessen Tür das sei."
 cc_xp_school.52.a: "Bilden Sie Dolmetscher für den Hof aus."
 cc_xp_school.52.b: "Den Kaufleuten geben, die dort handeln."
 cc_xp_school.52.c: "Denen geben, die den Glauben dorthin tragen würden."
 cc_xp_school.52.d: "Drucken Sie es, und lassen Sie jeden Gelehrten daraus lernen."
 cc_xp_school.53.title: "Die Arithmetik des Kaufmanns"
 cc_xp_school.53.desc: "Die Meister an der [cc_xp_school_new_seat.GetName] haben begonnen, die doppelte Buchführung zu lehren, so wie es die großen Handelshäuser tun. Die Häuser würden es vorziehen, wenn dies ihr Geheimnis bliebe."
 cc_xp_school.53.a: "Verlangen Sie dies von jedem königlichen Faktor und Steuerpächter."
 cc_xp_school.53.b: "Lassen Sie die Handelshäuser ihr Geheimnis bewahren."
 cc_xp_school.53.c: "Lehren Sie es jedem Studenten, der es über sich ergehen lässt."
 cc_xp_school.53.d: "Die Meister auch über Wechsel und Münzwesen vortragen lassen."
 cc_xp_school.54.title: "Die Chronik des Reiches"
 cc_xp_school.54.desc: "Die Meister an der [cc_xp_school_new_seat.GetName] haben eine Geschichte des Reiches seit seiner Gründung geschrieben. Sie ist gelehrt, sie ist lesbar und an einigen Stellen ist sie unfreundlich zu den Vorfahren der Leute, die am Hofe sitzen."
 cc_xp_school.54.a: "Es überarbeiten lassen, um die Dynastie zu ehren."
 cc_xp_school.54.b: "Lassen Sie es so stehen, wie es geschrieben wurde."
 cc_xp_school.54.c: "Nutzen Sie es, um die strittigen Adelsstammbäume zu klären."
 cc_xp_school.54.d: "Machen Sie es zur offiziellen Geschichte des Reiches."
 cc_xp_school.55.title: "Bastionen auf dem Papier"
 cc_xp_school.55.desc: "Die Meister an der [cc_xp_school_new_seat.GetName] haben eine neue Art von Festung entworfen: niedrige, angewinkelte Mauern, die keine Kanone durchbrechen und die jedes Geschütz abdecken kann. Auf dem Papier ist sie unverwüstlich. Auf dem Papier ist sie jedoch auch sehr teuer."
 cc_xp_school.55.a: "Bauen Sie die Mauern des Sitzes nach dem neuen Entwurf wieder auf."
 cc_xp_school.55.b: "Schicken Sie die Meister aus, um die Grenzfestungen zu inspizieren."
 cc_xp_school.55.c: "Die alten Mauern haben uns gut genug gedient."
 cc_xp_school.55.d: "Veröffentlichen Sie die Abhandlung über Befestigungen."
 cc_xp_school.56.title: "Versuche in der Gießerei"
 cc_xp_school.56.desc: "Die Meister an der [cc_xp_school_new_seat.GetName] haben in der Gießerei neue Proportionen für Kanonen getestet. Das letzte Geschütz platzte beim dritten Schuss und riss einen Schuppen mit in den Abgrund. Die Meister sagen, dies beweise, dass sie kurz vor dem Ziel stehen."
 cc_xp_school.56.a: "Mehr Versuche finanzieren."
 cc_xp_school.56.b: "Die Formeln den Kanonengießern geben."
 cc_xp_school.56.c: "Beenden Sie die Versuche, bevor jemand getötet wird."
 cc_xp_school.56.d: "Die Meister das Handbuch für Kanoniere schreiben lassen."
 cc_xp_school.57.title: "Das Problem der Verpflegung"
 cc_xp_school.57.desc: "Die Meister an der [cc_xp_school_new_seat.GetName] haben untersucht, warum unser letzter Feldzug mehr Männer durch Hunger als durch den Feind verlor. Ihre Antwort sind Magazine: Getreide, das im Voraus entlang der Straßen gelagert wird, die die Armee nehmen wird, und das aus dem Umland gekauft wird, bevor es benötigt wird."
 cc_xp_school.57.a: "Die Magazine bauen."
 cc_xp_school.57.b: "Bilden Sie die Quartiermeister an der Schule aus."
 cc_xp_school.57.c: "Überlassen Sie die Versorgung wie bisher den Auftragnehmern."
 cc_xp_school.57.d: "Die Meister die Versorgung des nächsten Feldzugs planen lassen."
 CC_XP_CURRICULUM_8: "Öffentliche Finanzen"
 CC_XP_CURRICULUM_8_TT: "Öffentliche Finanzen. Ein administrativer Lehrplan. Am Sitz: Produktionseffizienz. Im gesamten Reich: Steuereffizienz, und die Gesellschaft bewegt sich in Richtung Zentralisierung.\n\nBoni werden durch die Qualität der Schule skaliert. Das Reich erhält den nationalen Bonus jedes Lehrplans einmalig, unabhängig davon, wie viele Schulen ihn unterrichten."
 CC_XP_CURRICULUM_9: "Rhetorik"
 CC_XP_CURRICULUM_9_TT: "Rhetorik. Ein diplomatischer Lehrplan. Am Sitz: weniger Unruhe. Im gesamten Reich: diplomatische Reputation und eine stärkere Wirkung bei der Verbesserung von Beziehungen, und die Gesellschaft bewegt sich in Richtung Versöhnlichkeit.\n\nBoni werden durch die Qualität der Schule skaliert. Das Reich erhält den nationalen Bonus jedes Lehrplans einmalig, unabhängig davon, wie viele Schulen ihn unterrichten."
 CC_XP_CURRICULUM_10: "Sprachen"
 CC_XP_CURRICULUM_10_TT: "Sprachen. Ein diplomatischer Lehrplan. Am Sitz: kultureller Einfluss. Im gesamten Reich: schnellere Assimilation und Toleranz gegenüber Heiden, und die Gesellschaft bewegt sich in Richtung Weltoffenheit.\n\nBoni werden durch die Qualität der Schule skaliert. Das Reich erhält den nationalen Bonus jedes Lehrplans einmalig, unabhängig davon, wie viele Schulen ihn unterrichten."
 CC_XP_CURRICULUM_11: "Handel"
 CC_XP_CURRICULUM_11_TT: "Handel. Ein diplomatischer Lehrplan. Am Sitz: Marktzugang. Im gesamten Reich: Land- und Seehandelseffizienz, und die Gesellschaft bewegt sich in Richtung Freihandel.\n\nBoni werden durch die Qualität der Schule skaliert. Das Reich erhält den nationalen Bonus jedes Lehrplans einmalig, unabhängig davon, wie viele Schulen ihn unterrichten."
 CC_XP_CURRICULUM_12: "Geschichte und Genealogie"
 CC_XP_CURRICULUM_12_TT: "Geschichte und Genealogie. Ein diplomatischer Lehrplan. Am Sitz: kulturelle Tradition. Im gesamten Reich: monatliche Legitimität, und die Gesellschaft bewegt sich in Richtung Traditionalismus.\n\nBoni werden durch die Qualität der Schule skaliert. Das Reich erhält den nationalen Bonus jedes Lehrplans einmalig, unabhängig davon, wie viele Schulen ihn unterrichten."
 CC_XP_CURRICULUM_13: "Fortifikation"
 CC_XP_CURRICULUM_13_TT: "Fortifikation. Ein militärischer Lehrplan. Am Sitz: größere Garnisonen und günstigerer Festungsunterhalt. Im gesamten Reich: günstigerer Festungsunterhalt, und die Gesellschaft bewegt sich in Richtung Defensiv.\n\nBoni werden durch die Qualität der Schule skaliert. Das Reich erhält den nationalen Bonus jedes Lehrplans einmalig, unabhängig davon, wie viele Schulen ihn unterrichten."
 CC_XP_CURRICULUM_14: "Artillerie"
 CC_XP_CURRICULUM_14_TT: "Artillerieausbildung. Ein militärischer Lehrplan. Am Sitz: Produktionseffizienz aus seinen Gießereien. Im gesamten Reich: Artilleriestärke, und die Gesellschaft bewegt sich in Richtung Offensiv. Erfordert das Zeitalter der Entdeckungen zur Einführung.\n\nBoni werden durch die Qualität der Schule skaliert. Das Reich erhält den nationalen Bonus jedes Lehrplans einmalig, unabhängig davon, wie viele Schulen ihn unterrichten."
 CC_XP_CURRICULUM_15: "Logistik"
 CC_XP_CURRICULUM_15_TT: "Logistik. Ein militärischer Lehrplan. Am Sitz: Nahrungskapazität. Im gesamten Reich: höheres Versorgungslimit und weniger Landabnutzung, und die Gesellschaft bewegt sich in Richtung Quantität.\n\nBoni werden durch die Qualität der Schule skaliert. Das Reich erhält den nationalen Bonus jedes Lehrplans einmalig, unabhängig davon, wie viele Schulen ihn unterrichten."
