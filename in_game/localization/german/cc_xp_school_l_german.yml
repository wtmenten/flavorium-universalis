 STATIC_MODIFIER_NAME_cc_xp_school_seat_public_finance: "Sitz einer Schule für öffentliche Finanzen"
 STATIC_MODIFIER_DESC_cc_xp_school_seat_public_finance: "In der hiesigen Schule ausgebildete Schreiber führen die Bücher der städtischen Werkstätten, und weniger von ihnen scheitern."
 STATIC_MODIFIER_NAME_cc_xp_school_realm_public_finance: "Ausgebildet in öffentlichen Finanzen"
 STATIC_MODIFIER_DESC_cc_xp_school_realm_public_finance: "Die Steuerbeamten des Reiches werden an einer eigenen Schule für öffentliche Finanzen ausgebildet."
 STATIC_MODIFIER_NAME_cc_xp_school_seat_rhetoric: "Sitz einer Rhetorikschule"
 STATIC_MODIFIER_DESC_cc_xp_school_seat_rhetoric: "Die Redner der hiesigen Schule vertreten die Beschwerden der Stadt in der Halle statt auf der Straße."
 STATIC_MODIFIER_NAME_cc_xp_school_realm_rhetoric: "Ausgebildet in Rhetorik"
 STATIC_MODIFIER_DESC_cc_xp_school_realm_rhetoric: "Die Gesandten des Reiches werden an seiner eigenen Rhetorikschule ausgebildet."
 STATIC_MODIFIER_NAME_cc_xp_school_seat_languages: "Sitz einer Sprachschule"
 STATIC_MODIFIER_DESC_cc_xp_school_seat_languages: "Übersetzer und Reisende versammeln sich an der hiesigen Schule, und die Sprache der Stadt trägt über die Grenzen des Reiches hinaus."
 STATIC_MODIFIER_NAME_cc_xp_school_realm_languages: "Ausgebildet in Sprachen"
 STATIC_MODIFIER_DESC_cc_xp_school_realm_languages: "In der Sprachschule des Reiches ausgebildete Dolmetscher dienen seinen Höfen, seinen Gesandten und seinen Provinzen."
 STATIC_MODIFIER_NAME_cc_xp_school_seat_commerce: "Sitz einer Handelsschule"
 STATIC_MODIFIER_DESC_cc_xp_school_seat_commerce: "Die hiesige Schule lehrt die Kaufleute der Stadt Rechnen und Wechselwesen, wodurch ihr Markt den Handel anzieht."
 STATIC_MODIFIER_NAME_cc_xp_school_realm_commerce: "Ausgebildet in Handel"
 STATIC_MODIFIER_DESC_cc_xp_school_realm_commerce: "Die Faktoren und Kaufleute des Reiches werden an seiner eigenen Handelsschule ausgebildet."
 STATIC_MODIFIER_NAME_cc_xp_school_seat_history: "Sitz einer Schule für Geschichte und Genealogie"
 STATIC_MODIFIER_DESC_cc_xp_school_seat_history: "Die Chronisten der hiesigen Schule führen die Aufzeichnungen und Bräuche der Stadt."
 STATIC_MODIFIER_NAME_cc_xp_school_realm_history: "Ausgebildet in Geschichte und Genealogie"
 STATIC_MODIFIER_DESC_cc_xp_school_realm_history: "Die eigene Geschichtsschule des Reiches führt seine Aufzeichnungen und die Abstammung seines Regierungshauses."
 STATIC_MODIFIER_NAME_cc_xp_school_seat_fortification: "Sitz einer Fortifikationsschule"
 STATIC_MODIFIER_DESC_cc_xp_school_seat_fortification: "In der hiesigen Schule ausgebildete Ingenieure sorgen dafür, dass die Stadtmauern besetzt und instand gehalten werden."
 STATIC_MODIFIER_NAME_cc_xp_school_realm_fortification: "Ausgebildet in Fortifikation"
 STATIC_MODIFIER_DESC_cc_xp_school_realm_fortification: "Die Festungen des Reiches werden von Ingenieuren unterhalten, die an einer eigenen Festungsbauschule ausgebildet wurden."
 STATIC_MODIFIER_NAME_cc_xp_school_seat_gunnery: "Sitz einer Artillerieschule"
 STATIC_MODIFIER_DESC_cc_xp_school_seat_gunnery: "Kanonengießer arbeiten gemeinsam mit der hiesigen Schule, wovon die Gießereien der Stadt profitieren."
 STATIC_MODIFIER_NAME_cc_xp_school_realm_gunnery: "Ausgebildet in Artillerie"
 STATIC_MODIFIER_DESC_cc_xp_school_realm_gunnery: "Die Kanoniere des Reiches werden an einer eigenen Artillerieschule ausgebildet."
 STATIC_MODIFIER_NAME_cc_xp_school_seat_logistics: "Sitz einer Logistikschule"
 STATIC_MODIFIER_DESC_cc_xp_school_seat_logistics: "In der hiesigen Schule ausgebildete Quartiermeister halten die Kornspeicher der Stadt gefüllt."
 STATIC_MODIFIER_NAME_cc_xp_school_realm_logistics: "Ausgebildet in Logistik"
 STATIC_MODIFIER_DESC_cc_xp_school_realm_logistics: "Die Quartiermeister des Reiches werden an einer eigenen Logistikschule ausgebildet."
