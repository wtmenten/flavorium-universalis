l_german:
 # ============================================================
 # Stepping Stone Traits — Tier 0 Entry Points
 # ============================================================
 fumbling_reformist: "Ungeschickter Reformist"

 tentative_envoy: "Zögerlicher Gesandter"
 tentative_envoy_desc: "Ein Diplomat, der noch versucht, seinen Platz zu finden. Der Instinkt des Ministers für Verhandlungen ist vorhanden, doch Vorsicht lässt ihn zögern, wo Kühnheit gefragt wäre. Die ausländischen Höfe nehmen dies zur Kenntnis – wenn auch nicht immer günstig."

 green_adjutant: "Grüner Adjutant"
 green_adjutant_desc: "Kürzlich mit militärischen Angelegenheiten betraut, besitzt dieser Minister viel Enthusiasmus, aber wenig Erfahrung. Seine Ratschläge sind ernst gemeint, aber halbfertig. Feldzüge werden ihn das lehren, was Klassenzimmer nicht können."

 clumsy_accountant: "Ungeschickter Buchhalter"
 clumsy_accountant_desc: "Der Minister wurde mit den Büchern der Schatzkammer betraut, und die Ergebnisse sind – vielversprechend, so wie erste Entwürfe vielversprechend sind. Fehler sind klein und korrigierbar, aber sie summieren sich. Übung wird sie präzise machen."

 # ============================================================
 # Stepping Stone Traits — Chain Endpoints
 # ============================================================
 master_reformer: "Meisterreformer"
 master_reformer_desc: "Durch jahrelange unermüdliche Fürsprache und hart erkämpfte Rückschläge geformt, ist dieser Minister zu einem Architekten dauerhafter Veränderungen geworden. Wo andere festgefahrene Interessen sehen, sehen sie Hebel. Die Institutionen des Reiches beugen sich ihrem Willen, nicht umgekehrt."

 returned_colonial_governor: "Zurückgekehrter Kolonialgouverneur"

 # ============================================================
 # Chain A — The Reformer's Path (cc_prog.1–4)
 # ============================================================
 cc_prog.1.title: "Der Reformist ringt mit dem Gesetz"
 cc_prog.1.desc: "Der Minister hat Monate mit Verwaltungsreformen gerungen und Ergebnisse erzielt, die eher hoffnungsvoll als beeindruckend sind. Alte Statuten sind ein Labyrinth, und der Fortschritt ist langsam. Aber er lernt dazu."
 cc_prog.1.a: "So wird Expertise aufgebaut – langsam."
 cc_prog.1.b: "Die Reform sorgt für Verwirrung in den Provinzen."

 cc_prog.2.title: "Ein Reformer nimmt Gestalt an"
 cc_prog.2.desc: "Nach Jahren beharrlicher Bemühungen und hart erkämpfter Lektionen hat die unsichere Herangehensweise des Ministers an administrative Reformen einer zuverlässigeren gewichen. Die Tage des Herumprobierens liegen hinter ihm."
 cc_prog.2.a: "Ernenne sie zu einem vollumfänglichen Rechtsreformator."

 cc_prog.3.title: "Der Rechtsreformer wird kühner"
 cc_prog.3.desc: "Die reformorientierte Vision des Ministers ist mit jedem Dienstjahr kühner geworden. Was einst radikal erschien, wirkt nun schlichtweg richtig. Das Reich kann weiter gehen – und der Minister gedenkt, es dorthin zu führen."
 cc_prog.3.a: "Lassen wir sie progressive Reformen verfolgen."

 cc_prog.4.title: "Der Meisterreformer tritt hervor"
 cc_prog.4.desc: "Nach mehr als einem Jahrzehnt unermüdlichen Einsatzes und institutioneller Kämpfe hat der Minister die Kunst der Reform gemeistert. Er gestaltet Verwaltungen um, wo andere nur Hindernisse sehen, und sein Vermächtnis wird bereits in die Gesetzbücher geschrieben."
 cc_prog.4.a: "Das Reich ehrt seinen großen Reformer."

 # ============================================================
 # Chain C — The Diplomat's Ascent (cc_prog.10–12)
 # ============================================================
 cc_prog.10.title: "Der zögerliche Gesandte tastet das Terrain ab"
 cc_prog.10.desc: "Die ersten Versuche des Ministers in der Staatskunst sind vorsichtig – er tastet die Lage ab, bevor er sich auf eine Position festlegt. Ausländische Höfe bemerken sowohl seine Sorgfalt als auch sein Zögern."
 cc_prog.10.a: "Ein vorsichtiges, aber erfolgreiches erstes Aufeinandertreffen."
 cc_prog.10.b: "Ein diplomatischer Fehltritt, der schnell korrigiert wurde."

 cc_prog.11.title: "Der Gesandte findet seine Stimme"
 cc_prog.11.desc: "Durch den wiederholten Kontakt mit anderen Höfen ist das diplomatische Geschick des Ministers selbstbewusst und sicher geworden. Was einst sorgfältige Kalkulation erforderte, fließt nun natürlich. Sie haben ihre Stimme gefunden."
 cc_prog.11.a: "Ernennen Sie sie zum taktvollen Gesandten des Reiches."
 cc_prog.11.b: "Ihre Stationierung im Ausland hat sie geprägt — machen Sie sie zu unserem Attaché."

 cc_prog.12.title: "Der Gesandte meistert die Staatskunst"
 cc_prog.12.desc: "Eine lange Karriere sorgfältiger Verhandlungen, gesteuerter Rivalitäten und gepflegter Beziehungen hat das Urteilsvermögen des Ministers auf eine feine Spitze geschärft. Sie lesen einen Raum so, wie ein General ein Schlachtfeld liest – und handeln entsprechend."
 cc_prog.12.a: "Das Reich gewinnt einen Meisterstaatsmann."

 # ============================================================
 # Chain D — The Military Hardening (cc_prog.20–22)
 # ============================================================
 cc_prog.20.title: "Der grüne Adjutant im Feld"
 cc_prog.20.desc: "Der Minister hat Kampfberichte geprüft und Truppendispositionen beobachtet – und so das Handwerk des Krieges von Grund auf gelernt. Die Fortschritte sind gering, aber sie sind real."
 cc_prog.20.a: "Eine Feuerprobe: Die Feldzüge lehren sie schnell."
 cc_prog.20.b: "Sie studieren die Feldzüge großer Befehlshaber."

 cc_prog.21.title: "Der Adjutant verdient seine Sterne"
 cc_prog.21.desc: "Nach Jahren des fleißigen Studiums und der Feldbeobachtung hat sich das Wissen des grünen Adjutanten über militärische Angelegenheiten zu einem echten strategischen Verständnis gefestigt. Er lernt nicht mehr – er berät."
 cc_prog.21.a: "Bestellen Sie sie/ihn zum vollwertigen taktischen Berater."

 cc_prog.22.title: "Der taktische Berater wählt einen Weg"
 cc_prog.22.desc: "Der taktische Berater hat einen Punkt erreicht, an dem weiteres Wachstum eine Entscheidung über die Spezialisierung erfordert. Wird er die stehenden Heere des Reiches aufbauen, die Kunst der Offensive meistern oder seine Gaben der starken Verteidigung widmen?"
 cc_prog.22.a: "Bilde ein stehendes Heer aus — Disziplin über alles."
 cc_prog.22.b: "Beherrschen Sie die Offensive – schlagen Sie schnell und entschlossen zu."
 cc_prog.22.c: "Befestige das Reich — halte fest, was wir haben, und verliere nichts."

 # ============================================================
 # Chain F — The Fiscal Path (cc_prog.30–32)
 # ============================================================
 cc_prog.30.title: "Der tollpatschige Buchhalter prüft die Konten erneut"
 cc_prog.30.desc: "Der Minister hat die Bücher der Schatzkammer abgeglichen – dabei kleine Fehler gefunden und langsam ein Verständnis für die Finanzen des Reiches entwickelt. Der Prozess ist gelegentlich schmerzhaft, aber immer lehrreich."
 cc_prog.30.a: "Ein Rechenfehler zu Gunsten des Schatzamtes wurde entdeckt — das Reich nimmt dies zur Kenntnis."
 cc_prog.30.b: "Ein kleines Versäumnis beschämt den Minister, doch er lernt daraus."

 cc_prog.31.title: "Der Buchhalter beweist seinen Wert"
 cc_prog.31.desc: "Durch die mühsame Überprüfung der Konten und die sorgfältige Förderung untergeordneter Verwalter hat sich der Minister von einem zögerlichen Neuling zu einem verlässlichen Verwalter der Staatsfinanzen gewandelt."
 cc_prog.31.a: "Sie zum loyalen Verwalter der Schatzkammer ernennen."

 cc_prog.32.title: "Der loyale Verwalter weist den Weg"
 cc_prog.32.desc: "Mit einem festen Griff um die Finanzen des Reiches steht der Minister an einem Scheideweg. Er kann entweder breit gefächerten Wohlstand fördern – indem er das Wachstum in den Provinzen vorantreibt – oder eine strengere Disziplin über die Abläufe der Schatzkammer auferlegen."
 cc_prog.32.a: "Wohlstand im gesamten Reich fördern."
 cc_prog.32.b: "Erzwinge fiskalische Disziplin und setze die Autorität der Schatzkammer durch."

 # ============================================================
 # Chain E — The Colonial Pioneer (cc_prog.40)
 # ============================================================
 cc_prog.40.title: "Der Gouverneur kehrt zurück"
 cc_prog.40.desc: "Nachdem er jahrelang die fernen Kolonialbesitzungen des Reiches verwaltet hat – indem er die Entbehrungen der Grenzgebiete, lokale Ambitionen und die verwickelte Politik ferner Gouverneure bewältigte –, ist der Minister heimgekehrt. Er kehrt nicht so zurück, wie er aufgebrochen ist."
 cc_prog.40.a: "Willkommen zu Hause, Herr Gouverneur. Das Reich ist dadurch reicher geworden."
 fumbling_reformist_desc: "Dieser Minister hat mit administrativen Reformen begonnen, doch seine Herangehensweise ist noch unsicher. Entwürfe werden überarbeitet, Verfahren verwirrt und die Ergebnisse sind eher hoffnungsvoll als effektiv. Mit Zeit und Ausdauer wird er sich verbessern."
 returned_colonial_governor_desc: "Dieser Minister hat Jahre damit verbracht, die fernen Besitzungen des Reiches zu beaufsichtigen, Grenznot, koloniale Ambitionen und die komplizierte Politik ferner Gouverneure zu meistern. Er kehrt verwandelt heim – mit Erfahrungen, die keine höfische Ausbildung hätte vermitteln können."
