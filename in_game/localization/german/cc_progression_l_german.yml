l_german:
 # ============================================================
 # Stepping Stone Traits — Tier 0 Entry Points
 # ============================================================
 fumbling_reformist: "Ungeschickter Reformist"

 tentative_envoy: "Zögerlicher Gesandter"
 tentative_envoy_desc: "Ein Diplomat, der noch versucht, seinen Platz zu finden. Der Instinkt des Ministers für Verhandlungen ist vorhanden, doch Vorsicht lässt ihn zögern, wo Kühnheit gefragt wäre. Die ausländischen Höfe nehmen dies zur Kenntnis – wenn auch nicht immer günstig."

 green_adjutant: "Grüner Adjutant"
 green_adjutant_desc: "Kürzlich mit militärischen Angelegenheiten betraut, besitzt dieser Minister viel Enthusiasmus, aber wenig Erfahrung. Seine Ratschläge sind ernst gemeint, aber halbfertig. Feldzüge werden ihn das lehren, was Klassenzimmer nicht können."

 clumsy_accountant: "Ungeschickter Buchhalter"
 clumsy_accountant_desc: "Der Minister wurde mit den Büchern der Schatzkammer betraut, und die Ergebnisse sind – vielversprechend, so wie erste Entwürfe vielversprechend sind. Fehler sind klein und korrigierbar, aber sie summieren sich. Übung wird sie präzise machen."

 # ============================================================
 # Stepping Stone Traits — Chain Endpoints
 # ============================================================
 master_reformer: "Meisterreformer"
 master_reformer_desc: "Durch jahrelange unermüdliche Fürsprache und hart erkämpfte Rückschläge geformt, ist dieser Minister zu einem Architekten dauerhafter Veränderungen geworden. Wo andere festgefahrene Interessen sehen, sehen sie Hebel. Die Institutionen des Reiches beugen sich ihrem Willen, nicht umgekehrt."

 returned_colonial_governor: "Zurückgekehrter Kolonialgouverneur"

 # ============================================================
 # ============================================================

 # ============================================================
 # ============================================================

 # ============================================================
 # ============================================================

 # ============================================================
 # ============================================================

 # ============================================================
 # ============================================================
 fumbling_reformist_desc: "Dieser Minister hat mit administrativen Reformen begonnen, doch seine Herangehensweise ist noch unsicher. Entwürfe werden überarbeitet, Verfahren verwirrt und die Ergebnisse sind eher hoffnungsvoll als effektiv. Mit Zeit und Ausdauer wird er sich verbessern."
 returned_colonial_governor_desc: "Dieser Minister hat Jahre damit verbracht, die fernen Besitzungen des Reiches zu beaufsichtigen, Grenznot, koloniale Ambitionen und die komplizierte Politik ferner Gouverneure zu meistern. Er kehrt verwandelt heim – mit Erfahrungen, die keine höfische Ausbildung hätte vermitteln können."
 desc_clumsy_accountant: "Die Kontobücher gehen am Ende auf, aber nie beim ersten Versuch. Jedes Haushaltskonto, das dieser Berater berührt, kostet in der Führung mehr, als es sollte, und die Differenz wird stillschweigend aus dem Schatz ausgeglichen."
 desc_fumbling_reformist: "Ein echter Appetit auf Reformen, aber keinerlei Instinkt dafür, wie ein Gesetz geschrieben wird. Ihre Vorschläge erreichen die Kammer halbfertig und verlassen sie in einem schlechteren Zustand, und das Gesetz wird mit jedem einzelnen von ihnen langsamer und teurer."
 desc_green_adjutant: "Kompetent, willensstark und völlig ungeprüft. Die Stabsarbeit ist korrekt, trifft jedoch verspätet ein, und Regimenter unter ihrem Kommando brauchen länger, um das zu tun, was ein Veteran bereits erledigt hätte."
 desc_master_reformer: "Kennt das Gesetzbuch gut genug, um es zu ändern, ohne es zu zerstören. Gesetze werden schneller verabschiedet, die Schulen wachsen, und das Reich entwickelt einen Geschmack dafür, Dinge auf eine neue Art und Weise zu tun."
 desc_returned_colonial_governor: "Regierte weit entfernt von der Hauptstadt und kehrte mit dem Wissen nach Hause zurück, was dies kostet. Kolonialunternehmen unter ihrer Aufsicht sind besser besetzt und besser kartiert, und der Hof gewann einen Diplomaten, den er zuvor nicht hatte."
 desc_tentative_envoy: "Korrekt, sorgfältig und nicht gewillt, Druck auszuüben. Ausländische Höfe finden sie angenehm und unbedeutend und nehmen sich eher Freiheiten mit uns, als sie es zuvor taten."
