l_german:
 # ============================================================
 # cc_cond.1 — Capital Development Trait Event
 # ============================================================
 cc_cond.1.title: "Ein vielversprechender Minister"
 cc_cond.1.a: "Ernenne [minister.GetName] zum [ShowTraitName('master_urbanist')]."
 cc_cond.1.b: "Fördern Sie [minister.GetName] zu einem [ShowTraitName('enlightenment_herald')]."
 cc_cond.1.c: "Entwickeln Sie [minister.GetName] als einen [ShowTraitName('progressive_rationalist')]."
 cc_cond.1.d: "Setzen Sie auf [minister.GetName] als [ShowTraitName('revolutionary_herald')]."
 cc_cond.1.e: "Entwickeln Sie [minister.GetName] als [ShowTraitName('grand_architect')]."
 cc_cond.1.f: "Fördern Sie [minister.GetName] zu einem [ShowTraitName('arts_patron')]."
 cc_cond.1.g: "Machen Sie [minister.GetName] zu einem [ShowTraitName('learned_courtier')]."
 cc_cond.1.h: "Entwickeln Sie [minister.GetName] als [ShowTraitName('reform_minded_counselor')]."
 cc_cond.1.i: "Setze [minister.GetName] als [ShowTraitName('urban_planner')] ein."
 cc_cond.1.j: "Fördern Sie [minister.GetName] als [ShowTraitName('prosperity_herald')]."
 cc_cond.1.k: "Ernenne [minister.GetName] zum [ShowTraitName('merchant_syndic')]."
 cc_cond.1.dismiss: "Das Wachstum der Hauptstadt wird für sich selbst sprechen."

 # ============================================================
 # cc_cond.3 — Military Specialist (Ages 1–4, mil > 33)
 # ============================================================
 cc_cond.3.title: "Ein militärischer Geist erwacht"
 cc_cond.3.desc: "[minister.GetName] hat sich als fähiger Militärverwalter erwiesen. Ihr Verständnis von Logistik, Taktik und Organisation unterscheidet sie von anderen am Hof. Mit der richtigen Lenkung kann dieses Talent für spezifische Zwecke genutzt werden."
 cc_cond.3.a: "Setze [minister.GetName] als [ShowTraitName('infantry_drillmaster')] ein."
 cc_cond.3.b: "Entwickeln Sie [minister.GetName] als einen [ShowTraitName('scout_captain')]."
 cc_cond.3.c: "Fördern Sie [minister.GetName] zu einem [ShowTraitName('military_engineer')]."
 cc_cond.3.dismiss: "Momentan ist keine Richtung erforderlich."

 # ============================================================
 # cc_cond.4 — Regional / Cultural / Religious Specialist
 # ============================================================
 cc_cond.4.title: "Ein Berater der Welt"
 cc_cond.4.desc: "[minister.GetName] hat eine ungewöhnliche Tiefe an Wissen über die Bräuche, Religionen und Völker in unserer Umgebung gezeigt. Diese Expertise könnte weiterentwickelt werden, um spezifischen Zielen zu dienen."
 cc_cond.4.christian: "Leite [minister.GetName] als [ShowTraitName('christian_diplomat')] an."
 cc_cond.4.orthodox: "Entwickeln Sie [minister.GetName] als einen [ShowTraitName('ecumenical_patriarch_advisor')]."
 cc_cond.4.muslim: "Setze [minister.GetName] als [ShowTraitName('caliphate_diplomat')] ein."
 cc_cond.4.dharmic: "Fördern Sie [minister.GetName] zu einem [ShowTraitName('brahmin_counselor')]."
 cc_cond.4.buddhist: "Leite [minister.GetName] als [ShowTraitName('dharma_minister')] an."
 cc_cond.4.western_europe: "Formen Sie [minister.GetName] zu einem [ShowTraitName('renaissance_patron')]."
 cc_cond.4.africa: "Entwickeln Sie [minister.GetName] als einen [ShowTraitName('griot_diplomat')]."
 cc_cond.4.central_asia: "Fördern Sie [minister.GetName] zu einem [ShowTraitName('steppe_strategos')]."
 cc_cond.4.south_asia: "Leite [minister.GetName] als [ShowTraitName('mughal_administrator')] an."
 cc_cond.4.new_world: "Setze [minister.GetName] als [ShowTraitName('new_world_pioneer')] ein."
 cc_cond.4.maritime: "Formen Sie [minister.GetName] zu einem [ShowTraitName('maritime_champion')]."
 cc_cond.4.dismiss: "Ihre Expertise wird ihren eigenen Weg finden."

 # ============================================================
 # cc_cond.5 — Parliamentary / Diplomatic Specialist
 # ============================================================
 cc_cond.5.title: "Ein Diplomat von seltenem Geschick"
 cc_cond.5.desc: "[minister.GetName] hat sich mit ungewöhnlicher Anmut durch die Höfe und Versammlungen dieses Reiches bewegt. Ihr diplomatischer Instinkt ist scharf. Wie sollen wir diesen weiterentwickeln?"
 cc_cond.5.a: "Fördern Sie [minister.GetName] zu einem [ShowTraitName('parliamentary_broker')]."
 cc_cond.5.b: "Ernenne [minister.GetName] zum [ShowTraitName('diplomatic_attache')]."
 cc_cond.5.c: "[minister.GetName] zum [ShowTraitName('grand_chancellor')] befördern."
 cc_cond.5.dismiss: "Ihre Fähigkeiten werden sich natürlich entwickeln."

 # ============================================================
 # cc_cond.6 — Advanced Military Specialist (Ages 5–6, mil > 66)
 # ============================================================
 cc_cond.6.title: "Ein erfahrener Militärstratege"
 cc_cond.6.desc: "[minister.GetName] ist ein erfahrener Kommandant, dessen Instinkte in Jahrzehnten von Feldzügen geschmiedet wurden. Dies ist keine Person, die man mit administrativen Routinen verschwenden sollte. Wie sollen wir ihre Gaben nutzen?"
 cc_cond.6.a: "Machen Sie [minister.GetName] zu einem [ShowTraitName('commissariat_officer')]."
 cc_cond.6.b: "Ernenne [minister.GetName] zum [ShowTraitName('cavalry_marshal')]."
 cc_cond.6.c: "Entwickeln Sie [minister.GetName] als einen [ShowTraitName('siege_engineer')]."
 cc_cond.6.d: "[minister.GetName] zum [ShowTraitName('supreme_commander')] befördern."
 cc_cond.6.dismiss: "Ihre Gaben bedürfen keiner weiteren Formung."

 # ============================================================
 # cc_cond.20 — Intellectual / Religious Cluster
 # ============================================================
 cc_cond.20.title: "Ein vom Zeitgeist geprägter Berater"
 cc_cond.20.desc: "[minister.GetName] wurde durch das intellektuelle und spirituelle Klima dieses Reiches geformt. Ihre Überzeugungen sitzen tief. Welcher Weg fängt ihr Wesen am besten ein?"
 cc_cond.20.innovative: "Entwickeln Sie [minister.GetName] als einen [ShowTraitName('innovative_counselor')]."
 cc_cond.20.traditionalist: "Formen Sie [minister.GetName] zu einem [ShowTraitName('traditionalist_guardian')]."
 cc_cond.20.spiritualist: "Fördern Sie [minister.GetName] zu einem [ShowTraitName('mystical_patriarch')]."
 cc_cond.20.humanist: "Leite [minister.GetName] als [ShowTraitName('humanist_philosopher')] an."
 cc_cond.20.mysticism: "Entwickeln Sie [minister.GetName] als einen [ShowTraitName('mystical_counselor')]."
 cc_cond.20.jurisprudence: "Setze [minister.GetName] als [ShowTraitName('legal_scholar')] ein."
 cc_cond.20.dismiss: "Ihr Naturell wird sich mit der Zeit manifestieren."

 # ============================================================
 # cc_cond.21 — Social Order Cluster
 # ============================================================
 cc_cond.21.title: "Ein Berater der gesellschaftlichen Ordnung"
 cc_cond.21.desc: "[minister.GetName]'s Überlegungen zur Organisation der Gesellschaft wurden durch das aktuelle politische Klima geschärft. Ihre Überzeugungen sind klar. Wie sollen wir sie lenken?"
 cc_cond.21.absolutist: "Fördern Sie [minister.GetName] zu einem [ShowTraitName('royal_absolutist')]."
 cc_cond.21.liberal: "Leite [minister.GetName] als [ShowTraitName('liberal_reformer')] an."
 cc_cond.21.centralized: "Entwickeln Sie [minister.GetName] als einen [ShowTraitName('efficiency_administrator')]."
 cc_cond.21.decentralized: "Formen Sie [minister.GetName] zu einem [ShowTraitName('regional_magnate')]."
 cc_cond.21.serfdom: "Ernenne [minister.GetName] zum [ShowTraitName('serf_overseer')]."
 cc_cond.21.free_subjects: "[minister.GetName] zum [ShowTraitName('emancipation_minister')] befördern."
 cc_cond.21.individualism: "Entwickeln Sie [minister.GetName] als [ShowTraitName('free_spirit_counselor')]."
 cc_cond.21.communalism: "Leite [minister.GetName] als [ShowTraitName('community_steward')] an."
 cc_cond.21.dismiss: "Ihre soziale Vision wird anderswo ihren Ausdruck finden."

 # ============================================================
 # cc_cond.22 — Military Doctrine Cluster
 # ============================================================
 cc_cond.22.title: "Eine militärische Philosophie nimmt Gestalt an"
 cc_cond.22.desc: "[minister.GetName] hat die militärischen Lehren aus der jüngeren Geschichte dieses Reiches verinnerlicht. Ihre doktrinären Überzeugungen sind nun klar. Wie sollen wir diese weiterentwickeln?"
 cc_cond.22.quality: "Formen Sie [minister.GetName] zu einem [ShowTraitName('elite_trainer')]."
 cc_cond.22.quantity: "Setze [minister.GetName] als [ShowTraitName('mass_levy_commander')] ein."
 cc_cond.22.offensive: "Fördern Sie [minister.GetName] zu einem [ShowTraitName('offensive_strategist')]."
 cc_cond.22.defensive: "Leite [minister.GetName] als [ShowTraitName('defensive_commander')] an."
 cc_cond.22.land: "Entwickeln Sie [minister.GetName] als einen [ShowTraitName('continental_marshal')]."
 cc_cond.22.naval: "Formen Sie [minister.GetName] zu einem [ShowTraitName('admiral_counselor')]."
 cc_cond.22.opt_belligerent: "Fördern Sie [minister.GetName] zu einem [ShowTraitName('hawk_minister')]."
 cc_cond.22.conciliatory: "Leite [minister.GetName] als [ShowTraitName('peacemaker_counselor')] an."
 cc_cond.22.dismiss: "Lassen Sie die Doktrin ihren eigenen Gang gehen."

 # ============================================================
 # cc_cond.23 — Economic Doctrine Cluster
 # ============================================================
 cc_cond.23.title: "Eine aufkommende Wirtschaftsphilosophie"
 cc_cond.23.desc: "[minister.GetName]'s wirtschaftliche Überzeugungen haben sich kristallisiert. Die Märkte, die Stände und die Debatten des Reiches haben ihr Denken in etwas Scharfes und Nutzbares verwandelt. Wie sollen wir dies einsetzen?"
 cc_cond.23.aristocracy: "Fördern Sie [minister.GetName] zu einem [ShowTraitName('noble_champion')]."
 cc_cond.23.plutocracy: "Formen Sie [minister.GetName] zu einem [ShowTraitName('merchant_prince')]."
 cc_cond.23.mercantilism: "Entwickeln Sie [minister.GetName] als einen [ShowTraitName('mercantilist_official')]."
 cc_cond.23.free_trade: "Leite [minister.GetName] als [ShowTraitName('free_market_advocate')] an."
 cc_cond.23.capital_economy: "Setze [minister.GetName] als [ShowTraitName('capitalist_minister')] ein."
 cc_cond.23.traditional_economy: "Formen Sie [minister.GetName] zu einem [ShowTraitName('estate_guardian')]."
 cc_cond.23.dismiss: "Ökonomisches Denken wird sich von selbst entwickeln."

 # ============================================================
 # cc_cond.24 — Expansion / Cultural Identity Cluster
 # ============================================================
 cc_cond.24.title: "Eine Vision der Identität des Reiches"
 cc_cond.24.desc: "[minister.GetName] hat starke Überzeugungen über die kulturelle Richtung und den Platz des Reiches in der Welt entwickelt. Ihre Perspektive spiegelt den Zeitgeist wider. Wie sollen wir dies lenken?"
 cc_cond.24.outward: "Formen Sie [minister.GetName] zu einem [ShowTraitName('expansionist_advisor')]."
 cc_cond.24.inward: "Fördern Sie [minister.GetName] zu einem [ShowTraitName('consolidation_minister')]."
 cc_cond.24.latinized: "Leite [minister.GetName] als [ShowTraitName('roman_administrator')] an."
 cc_cond.24.hellenized: "Entwickeln Sie [minister.GetName] als einen [ShowTraitName('hellenistic_scholar')]."
 cc_cond.24.sinicized: "Formen Sie [minister.GetName] zu einem [ShowTraitName('confucian_mandarin')]."
 cc_cond.24.unsinicized: "Setze [minister.GetName] als [ShowTraitName('steppe_warlord_advisor')] ein."
 cc_cond.24.dismiss: "Die kulturelle Identität wird für sich selbst sprechen."

 # ============================================================
 # cc_cond.101 — Urban Ambitions Take Shape (follow-up to cc_cond.1 Tier 1)
 # ============================================================

 cc_cond.101.title: "Städtische Ambitionen nehmen Gestalt an"
 cc_cond.101.desc: "[minister.GetName] ist am Werk, seit die Krone ihre Gaben für die städtische Verwaltung erkannt hat. Die Hauptstadt hat die Auswirkungen gespürt – ob zum Besseren oder Schlechteren, hängt davon ab, wie sich das Projekt entwickelt hat."
 cc_cond.101.a: "Berichte der Krone über den Ausgang."
 cc_cond.1.desc: "[minister.GetName] hat sich durch die Verwaltung unserer wachsenden Hauptstadt ausgezeichnet. Der Wohlstand von [country.GetCapital.GetName] scheint [minister.GetHerHim] Geist geschärft zu haben. Wie sollen wir [minister.GetHerHim] Talente einsetzen?"
 cc_cond_dismiss_tt: "Kein Merkmal und keine Erfahrung. Der Minister wird für fünf Monate übergangen, und diese Fragenreihe wird für zwölf Jahre nicht erneut aufgeworfen."
 cc_cond_dismiss_short_tt: "Kein Merkmal und keine Erfahrung. Der Minister wird für fünf Monate übergangen."
