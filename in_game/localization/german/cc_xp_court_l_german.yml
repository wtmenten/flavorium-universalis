 # Situation: in_game/common/situations/cc_cabinet_court.txt
 # ============================================================

 # The situation's own name, shown on the header icon.
 cc_cabinet_court: "Der Hof"
 cc_cabinet_court_desc: "Ein dauerhaftes Verzeichnis darüber, wer der Krone dient, was sie gelernt haben und wie weit jeder von ihnen noch zu gehen hat."

 CC_XP_COURT_HEADER: "Der Hof"
 CC_XP_COURT_DESC: "Jeder Minister und jeder geförderte Protegé, mit dem, was sie bisher aus sich gemacht haben.\n\n#Y Dienstalter#! ist die Stufe neben jedem Namen, von 1 bis 10. Sie ergibt sich aus der gesamten Erfahrung über alle drei Pfade hinweg und spiegelt wider, was eine Person bereits durchgemacht hat. Sie bestimmt ihr Ansehen am Hof.\n\n#Y Spezialisierung#! ist die Stufe, die bei jedem Pfad angezeigt wird, von 0 bis 3. Sie ergibt sich aus der Erfahrung des jeweiligen Pfades und entscheidet darüber, welche Eigenschaften erreichbar sind. Ein Minister kann ein sehr hohes Dienstalter haben und dennoch ein Soldat der Stufe 0 sein.\n\nErfahrung resultiert aus den Aufgaben, die sie bekleiden, den Jahren ihres Dienstes, den Kriegen, Gesetzen und Ehen, die das Reich durchläuft, sowie dem, was ihr bereit seid für ihre Ausbildung auszugeben."

 CC_XP_SECTION_CABINET: "AMTENDE MINISTER"
 CC_XP_SECTION_PROTEGES: "PROTEGÉS"
 CC_XP_NO_PROTEGES: "Niemand wird derzeit vorbereitet. Nehmen Sie über die Interaktionen eines Charakters einen Protegé auf, um einen Nachfolger bereit zu haben, bevor eine Stelle frei wird."

 CC_XP_LEVEL_LABEL: "Stufe"
 CC_XP_LEVEL_MAX: "Auf dem Höhepunkt ihrer Karriere."
 CC_XP_SENIORITY_TT: "Fortschritt zur nächsten Dienstaltersstufe. Die Stufe wird aus der Gesamterfahrung über alle drei Bereiche hinweg berechnet und gewährt einen steigenden Bonus auf die Effektivität dieser Person."

 CC_XP_COL_ADM: "ADM"
 CC_XP_COL_DIP: "DIP"
 CC_XP_COL_MIL: "MIL"
 CC_XP_TRACK_ADM_TT: "Administrative Erfahrung und die erreichte Stufe. Resultiert aus administrativen Pflichten, durchgesetzten Gesetzen und Zeit in der Kanzlei. Stufe 1 bei 150, Stufe 2 bei 500, Stufe 3 bei 1200."
 CC_XP_TRACK_DIP_TT: "Diplomatische Erfahrung und die erreichte Stufe. Resultiert aus diplomatischen Pflichten, königlichen Eheschließungen und der Gesandtschaftsreise. Stufe 1 bei 150, Stufe 2 bei 500, Stufe 3 bei 1200."
 CC_XP_TRACK_MIL_TT: "Militärische Erfahrung und die erreichte Stufe. Resultiert aus militärischen Pflichten, gewonnenen Kriegen und der Kriegsakademie. Stufe 1 bei 150, Stufe 2 bei 500, Stufe 3 bei 1200."

 CC_XP_STATUS_AWAY: "abwesend"
 CC_XP_STATUS_AWAY_TT: "Derzeit in einem Amt oder bereitet eine Hofprüfung vor. Sie können nicht an einen anderen Ort geschickt oder mit einem Schüler betraut werden, bis sie zurückkehren."
 CC_XP_STATUS_MENTORED: "mentoriert"
 CC_XP_STATUS_MENTORED_TT: "Unterricht durch einen erfahrenen Minister, wobei jedes Jahr Erfahrung in dem Bereich gewonnen wird, in dem dieser Mentor am stärksten ist."

 # ============================================================
 # Cabinet Experience — cabinet card badge
 # (in_game/gui/shared/cc_xp_cabinet_card.gui)
 # ============================================================
 CC_XP_CARD_LVL: "St."
 CC_XP_CARD_LEVEL_TT: "Dienstalter, von 1 bis 10. Erworben aus der Gesamterfahrung über alle drei Bereiche hinweg; es gewährt einen steigenden Bonus auf die Effektivität dieses Ministers. Öffnen Sie das Hof-Panel für die vollständige Akte."
 CC_XP_TAB_PATRONAGE: "Mäzenatentum"
 CC_XP_TAB_SCHOOLS: "Schulen"
 CC_XP_WORKS_LABEL: "Werke im Reich"
 CC_XP_ARTISTS_LABEL: "Lebende Künstler"
 CC_XP_NO_ARTISTS: "Es arbeiten keine Künstler im Reich. Künstler erscheinen über das Kultursystem; ein Minister kann dann so eingestellt werden, dass er einen fördert."
 CC_XP_HAS_PATRON: "gesponsert"
 CC_XP_HAS_PATRON_TT: "Ein Minister hat seinen Namen und sein Geld hinter diesen Künstler gestellt. Die Krone gewinnt an Prestige, solange diese Vereinbarung besteht, und der Minister gewinnt diplomatische Erfahrung."
 CC_XP_WORKS_BY_TT: "Von diesem Künstler vollendete Werke."
 CC_XP_NO_SCHOOLS: "Es wurden noch keine Institutionen gegründet. Errichte eine Universität in deiner Hauptstadt und lasse dann einen leitenden Minister eine Schule unter seiner eigenen Disziplin gründen."
 CC_XP_SCHOOL_FOUNDED_BY: "gegründet von"
 CC_XP_SCHOOL_TEACHES: "lehrt"
 CC_XP_SCHOOL_FOUNDER_DEAD: "(Gründer verstorben)"
 CC_XP_SCHOOL_FOUNDER_DEAD_TT: "Der Gründer ist tot und die Schule besteht ohne ihn fort. Das ist der Unterschied zwischen einer Institution und einem Ruf."
 CC_XP_SCHOOLS_DESC: "Eine Denkschule ist eine dauerhafte Institution: Sie lehrt alle Eingeschriebenen, unabhängig davon, ob sie ein Amt bekleiden oder nicht, die Disziplin ihres Gründers, und sie lehrt auch dann weiter, wenn der Gründer verstorben ist.\n\nEin Reich kann höchstens drei besitzen. Die erste erfordert eine Universität in der Hauptstadt, die zweite den Fortschritt der Gelehrtenorden und die dritte die Erleuchtete Verwaltung."
 CC_XP_BTN_SELL_WORK: "Werk verkaufen"
 CC_XP_BTN_SPONSOR: "Künstler fördern"
 CC_XP_BTN_FOUND: "Institution gründen"
 CC_XP_BTN_ENROL: "Einschreiben"
 CC_XP_ARTISTS_HEADER: "KÜNSTLER IM REICH"
 CC_XP_SCHOOLS_HEADER: "INSTITUTIONEN"
 CC_XP_SLOT_OPEN: "Eine Institution kann gegründet werden"
 CC_XP_SLOT_LOCKED: "Noch nicht freigeschaltet"
 CC_XP_SLOT_REQ_1: "Erfordert eine Universität in der Hauptstadt."
 CC_XP_SLOT_REQ_2: "Erfordert den Fortschritt Gelehrte Orden."
 CC_XP_SLOT_REQ_3: "Erfordert den Fortschritt Aufgeklärte Verwaltung."
 CC_XP_BTN_SOIREE: "Soiree ausrichten"
 CC_XP_BTN_EXAM: "Hofprüfung"
 CC_XP_BTN_PROTEGE: "Protegé aufnehmen"
 CC_XP_BTN_MENTOR: "Mentor zuweisen"
 CC_XP_BTN_SECOND: "An ein Vasall abgegeben"
 CC_XP_BTN_RECALL: "Bewohner zurückrufen"
