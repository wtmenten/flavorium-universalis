l_german:
 ########################################
 # cc_hus.1 — The Pope Calls for Aid
 ########################################
 cc.hus.1.title: "Mit nur einem kleinen Darlehen unseres Vaters..."
 cc.hus.1.desc: "Zwischen Rom und Böhmen ist der Krieg ausgebrochen. [current_pope.GetName] hat seine Banner gegen die hussitische Häresie erhoben und alle gläubigen katholischen Fürsten zum Beistand aufgerufen. Der Ausgang dieses Kampfes wird die Seele der Christenheit formen – und unsere Reaktion wird sowohl in Rom als auch in Prag in Erinnerung bleiben."
 cc.hus.1.a: "Wir stehen an der Seite des Heiligen Vaters. Unsere Waffen gehören Ihm."
 cc.hus.1.b: "Nimm die päpstlichen Münzen an und ziehe dich aus diesem Krieg zurück."
 cc.hus.1.c: "Wir lassen uns nicht kaufen. Unsere Sache bleibt bestehen."
 cc.hus.1.d: "Den Kreuzzug antreten. Schließe dich dem Krieg des Papstes gegen die Häresie an."
 cc.hus.1.e: "Dies ist nicht unser Krieg. Rom soll seine eigenen Schlachten schlagen."
