l_german:
 # === cc_bonds.10 — The Colony's First Harvest ===
 cc_bonds.10.title: "Die erste Ernte der Kolonie"
 cc_bonds.10.desc: "Berichte erreichen uns aus [bond_subj.GetName]: Die erste volle Saison koordinierter Kolonialverwaltung ist abgeschlossen. Die Kolonisten haben einen Überschuss erwirtschaftet, Handelsrouten etablieren sich, und der Gouverneur bittet um Anweisungen, wie die Krone mit den Einnahmeregelungen verfahren möchte. Die Chance, die vor uns liegt, ist offensichtlich – ebenso wie die Entscheidungen, die sie erfordert."
 cc_bonds.10.a: "Maximieren Sie die Extraktion. Die Kolonie existiert, um der Krone zu dienen."
 cc_bonds.10.b: "Investiere in die Infrastruktur. Eine wohlhabende Kolonie zahlt sich langfristig besser aus."
 cc_bonds.10.c: "Treffen Sie keine spezifischen Vereinbarungen. Lassen Sie sie verwalten, wie sie es für richtig halten."

 # === cc_bonds.11 — Colonial Conscription ===
 cc_bonds.11.title: "Koloniale Wehrpflicht"
 cc_bonds.11.desc: "Unsere Streitkräfte sind überdehnt, und die Kolonialgebiete von [bond_subj.GetName] stellen ein Reservoir an wehrfähigen Männern dar. Der Gouverneur wurde nach der Machbarkeit einer Truppenlevy aus der Kolonialbevölkerung gefragt. Seine Antwort ist vorsichtig — die Kolonisten sind zuerst Siedler und erst danach Soldaten — aber er erwartet unsere Anweisungen."
 cc_bonds.11.a: "Aus dem Kolonialaufgebot einberufen. Wir brauchen die Männer."
 cc_bonds.11.b: "Stellen Sie stattdessen Söldner ein. Schonen Sie die Kolonisten."
 cc_bonds.11.c: "Im Moment keine weiteren Truppen aufstellen."

 # === cc_bonds.12 — The Governor Reports Unrest ===
 cc_bonds.12.title: "Der Gouverneur berichtet über Unruhen"
 cc_bonds.12.desc: "Eine als dringend markierte Depesche aus [bond_subj.GetName] trifft ein. Der Gouverneur schreibt von wachsender Unzufriedenheit unter der Kolonialbevölkerung – Beschwerden über Steuern, Klagen darüber, dass Kronbeamte ihre Mandate überschreiten, und in einem Distrikt eine Versammlung, die sich erst auflöste, als bewaffnete Männer eintrafen. Er bittet um Anweisungen. Die Situation ist noch nicht außer Kontrolle, aber sie erfordert eine Reaktion."
 cc_bonds.12.a: "Sende Truppen, um die Unruhen zu unterdrücken. Statuiere ein Exempel."
 cc_bonds.12.b: "Untersuche die Steuereintreiber. Reformiere, was reformiert werden muss."
 cc_bonds.12.c: "Ersetze den Gouverneur. Eine neue Hand wird die Ordnung wiederherstellen."
 cc_bonds.12.d: "Sende Geschenke und Versprechen. Gewinne Zeit."

 # === cc_bonds.13 — Colonial Trade Monopoly Dispute ===
 cc_bonds.13.title: "Streit um das koloniale Handelsmonopol"
 cc_bonds.13.desc: "Die heimischen Kaufmannsgilden haben eine Petition eingereicht und bitten um exklusive Handelsrechte mit [bond_subj.GetName]. Sie argumentieren, dass dies den Kolonialhandel rationalisieren und die Einnahmen der Krone durch zuverlässige Zollzahlungen steigern würde. Der Kolonialgouverneur hat stillschweigend Einwände erhoben – seine Kolonisten handeln frei mit benachbarten Häfen und betrachten ein Monopol als Enteignung. Die Entscheidung liegt bei uns."
 cc_bonds.13.a: "Gewähre das Monopol. Strukturierter Handel nützt allen."
 cc_bonds.13.b: "Die Petition ablehnen. Die Handelsstrukturen der Kolonie funktionieren."
 cc_bonds.13.c: "Der Kolonie erlauben, ihre eigenen Handelsbedingungen festzulegen. Lasst sie frei prosperieren."

 # === cc_bonds.14 — The Colony Seeks a Voice ===
 cc_bonds.14.title: "Die Kolonie sucht nach einer Stimme"
 cc_bonds.14.desc: "Eine Delegation aus [bond_subj.GetName] hat einen weiten Weg zurückgelegt. Ihr Ersuchen ist besonnen, aber klar: Die Kolonie ist gewachsen, ihre Bewohner haben etwas Bleibendes geschaffen, und sie glauben, dass sie ein Mitspracherecht bei den Entscheidungen verdient haben, die ihr Leben bestimmen. Sie fordern keine Unabhängigkeit. Sie bitten darum, gehört zu werden. Der Hof beobachtet genau, wie wir reagieren."
 cc_bonds.14.a: "Gewähre formelle Repräsentation. Sie haben es sich verdient."
 cc_bonds.14.b: "Biete symbolische Anerkennung an. Eine beratende Rolle, nichts Verbindliches."
 cc_bonds.14.c: "Lehnen Sie die Petition ab. Die Krone spricht für all ihre Territorien."

 # === cc_bonds.15 — Cultural Assimilation Pressure ===
 cc_bonds.15.title: "Kultureller Assimilationsdruck"
 cc_bonds.15.desc: "Das Kolonialterritorium von [bond_subj.GetName] hat eine deutlich lokale Identität entwickelt – eigene Feste, eigene Sprachmuster, eigene Heiligentage. Einige Berater argumentieren, dass diese Abdrift von der Kultur der Krone künftige Loyalitätsverluste provoziert und durch politische Maßnahmen korrigiert werden sollte. Andere raten, dass der Versuch, die Kolonisten nach unserem Ebenbild neu zu gestalten, genau den Groll hervorrufen wird, den wir fürchten. Die Wahl liegt bei uns."
 cc_bonds.15.a: "Drängen Sie auf kulturelle Integration. Eine Krone, ein Volk."
 cc_bonds.15.b: "Unterstütze lokale Bräuche. Ihre Identität macht sie zu dem, was sie sind."
 cc_bonds.15.c: "In dieser Angelegenheit keine Position beziehen."

 # === cc_bonds.16 — Colonial Militia Incident ===
 cc_bonds.16.title: "Vorfall mit der Kolonialmiliz"
 cc_bonds.16.desc: "In [bond_subj.GetName] hat sich eine bewaffnete Gruppe gebildet — Kolonisten, die es für richtig hielten, ihre eigenen Distrikte zu patrouillieren, ihre eigenen Streitigkeiten beizulegen und in mehreren Fällen den Steuerbeamten der Krone physischen Widerstand zu leisten. Der Gouverneur nennt sie eine Miliz. Andere nennen sie etwas Schlimmeres. Was auch immer ihr Name sein mag, sie repräsentieren organisierten Widerstand, und die Kolonialverwaltung kann in ihrer Gegenwart nicht funktionieren."
 cc_bonds.16.a: "Identifiziere die Rädelsführer und mach ein Exempel an ihnen."
 cc_bonds.16.b: "Verhandeln. Verstehen Sie ihre Beschwerden, bevor Sie handeln."
 cc_bonds.16.c: "Ordne die sofortige Auflösung der Miliz an."

 # === cc_bonds.200 — The Colonial Congress Convenes ===
 cc_bonds.200.title: "Der Kolonialkongress tritt zusammen"
 cc_bonds.200.desc: "Die Vertretung, die wir [bond_subj.GetName] vor einigen Jahren gewährten, ist über die Zeremonie hinausgewachsen, als die sie begann. Die Kolonisten haben sich organisiert. Sie haben Delegierte gewählt, ein Programm entworfen und einen Kongress mit einer formalen Tagesordnung einberufen. Ihre Forderungen sind nicht revolutionär – Verbesserungen der Kolonialverwaltung, klarere Handelsprotokolle, eine beratende Rolle bei Entscheidungen, die sie direkt betreffen. Aber der Apparat, den sie aufgebaut haben, um diese Forderungen vorzubringen, ist etwas Neues. Wir gaben ihnen eine Stimme. Sie haben diese genutzt, um eine Kammer zu errichten.\n\nDie Frage, die sich uns nun stellt, ist, ob wir ehren, was aus dieser Stimme geworden ist – oder ob wir sie korrigieren."

 cc_bonds.200.a: "Ratifiziere eine Kolonialcharta. Was sie aufgebaut haben, verdient formale Anerkennung."
 cc_bonds.200.a.tooltip: "Der Kongress wird zu einer formalen Institution mit dauerhafter Legitimität. Der Modifikator für die Ära der Koloniallegitimität wird verlängert. Politischer und kultureller Gewinn; Prestigekosten für die Aufgabe der Initiative."

 cc_bonds.200.b: "Erkenne den Kongress an, ohne uns an ihn zu binden."
 cc_bonds.200.b.tooltip: "Der Kongress wird anerkannt, ist jedoch nicht formalisiert. Pol gewinnt geringfügig. Die Erinnerung voice_granted bleibt bestehen — diese Situation könnte sich weiter entwickeln."

 cc_bonds.200.c: "Der Kongress übersteigt sein Mandat. Beschränken Sie die von uns gewährte Repräsentation."
 cc_bonds.200.c.tooltip: "Die Kammer wird aufgelöst, bevor sie zu einem Präzedenzfall wird. Sowohl Pol als auch Cul fallen; das Verlangen nach Freiheit steigt. Die Erinnerung an voice_granted wird gelöscht — das Experiment ist beendet."
