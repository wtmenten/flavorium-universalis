l_german:
 learned_counselor: "Gelehrter Berater"
 desc_learned_counselor: "Dieses Kabinettsmitglied hat sein Leben der Gelehrsamkeit und den Lettern gewidmet. Unter seiner Führung verbreitet sich die Alphabetisierung im gesamten Reich, da er sicherstellt, dass Bildung auf jeder Ebene der Verwaltung ernst genommen wird."
 learned_counselor_die_desc: "[CHARACTER.GetName] ist von dieser Welt gegangen, und die Bibliotheken, die [CHARACTER.GetSheHe] füllte, werden als [CHARACTER.GetHerHis] Vermächtnis fortbestehen, lange nachdem die Tinte auf diesen Seiten verblasst ist."
 law_reformer: "Gesetzesreformer"
 law_reformer_die_desc: "[CHARACTER.GetName] ist gestorben, und viele Juristen betrauern den Verlust des schärfsten juristischen Geistes, gegen den sie je argumentieren durften."
 loyal_steward: "Loyaler Verwalter"
 desc_loyal_steward: "Wenige Dinge halten ein Reich so sehr zusammen wie Vertrauen. Dieser Berater hat tiefe persönliche Beziehungen zu den Herrschern unserer Vasallenreiche aufgebaut und erinnert sie daran, dass Loyalität keine Einbahnstraße ist."
 loyal_steward_die_desc: "[CHARACTER.GetName] ist gegangen, und das Band des Vertrauens, das [CHARACTER.GetSheHe] zwischen uns und unseren Untertanen wob, ist ein wenig dünner geworden."
 tactical_advisor: "Taktischer Berater"
 desc_tactical_advisor: "Ein dekorierter Veteran und Kenner der Kriegskunst; dieser Berater übersetzt hart erkämpfte Schlachtfelderfahrung in eine Doktrin, welche die Schlagkraft jedes Regiments in unserem Dienst schärft."
 tactical_advisor_die_desc: "[CHARACTER.GetName] ist verstummt. Die Handbücher, die [CHARACTER.GetSheHe] schrieb, werden [CHARACTER.GetHerHim] überdauern, aber ein lebender Meister der Taktik ist zehn gedruckte Bände wert."
 ecumenist: "Ökumenist"
 desc_ecumenist: "Aufgewachsen zwischen verschiedenen Glaubensrichtungen oder einfach gesegnet mit der Geduld eines Philosophen, sieht dieser Berater die gemeinsame Menschlichkeit, wo andere Häresie sehen. Religiöse Minderheiten fahren besser, wenn ihr Rat die Politik prägt."
 ecumenist_die_desc: "[CHARACTER.GetName] hat diesbezüglich das nicht mehr lebenden Reihen hinzugefügt. Die stillen Brücken, die [CHARACTER.GetSheHe] zwischen den Glaubensrichtungen schlug, mögen länger überdauern als die Erinnerung daran, wer sie baute."
 colonial_planner: "Kolonialplaner"
 desc_colonial_planner: "Karten, Passatwinde und die Träume von Siedlern – dieser Berater lebt und atmet koloniale Expansion. Unter seiner Leitung fließt die Migration effizienter an die Grenzen unserer Überseeambitionen."
 colonial_planner_die_desc: "[CHARACTER.GetName] ist gestorben, und ein namenloses Kap an einer unkartierten Küste wird niemals [CHARACTER.GetHerHis] Namen tragen."
 prosperity_planner: "Wohlstandsplaner"
 desc_prosperity_planner: "Dieser Berater besitzt den Instinkt, die Bedingungen zu erkennen und zu fördern, die es Gemeinschaften ermöglichen, zu gedeihen. Wohlstand geschieht nicht einfach so – er wird geplant, und niemand plant ihn besser."
 iron_disciplinarian: "Eiserner Disziplinar"
 desc_iron_disciplinarian: "Dieser Berater regiert durch Ordnung, Hierarchie und Gehorsam. Das Reich läuft unter seiner Aufsicht effizient, aber die Disziplin wirkt einengend. Der Adel sträubt sich, und ausländische Höfe flüstern von Tyrannei."
 iron_disciplinarian_die_desc: "[CHARACTER.GetName] ist tot. Die Maschine, die [CHARACTER.GetSheHe] baute, rattert weiter, doch die Ingenieure, die [CHARACTER.GetHerHim] fürchteten, lösen bereits die Bolzen."
 shadow_counselor: "Schattenratgeber"
 desc_shadow_counselor: "Dieser Berater arbeitet über Informanten und stillen Einfluss statt über offizielle Kanäle. Fremdmächte verhandeln vorsichtig, da sie wissen, dass diese Person mithört. Doch kein Stand vertraut einem Manipulator, und Diplomaten halten Abstand."
 shadow_counselor_die_desc: "[CHARACTER.GetName] ist gestorben — oder so behaupten zumindest die offiziellen Berichte. Diejenigen, die [CHARACTER.GetHerHim] gut kannten, halten sich mit ihrem Urteil zurück."
 progressive_reformist: "Progressiver Reformist"
 desc_progressive_reformist: "Dieser Berater ist davon überzeugt, dass die alten Wege dem Neuen weichen müssen. Die Alphabetisierung steigt, Gesetze werden modernisiert und der Innovationsimpuls verbreitet sich, doch jede Reform ist auch eine Störung, die die alte Ordnung verunsichert."
 progressive_reformist_die_desc: "[CHARACTER.GetName] ist gestorben, während die Hälfte der Reformen noch unvollendet war. Ob das eine Tragödie oder eine Gnade ist, hängt davon ab, wen man fragt."
 war_hawk: "Kriegstreiber"
 desc_war_hawk: "Dieser Berater brennt auf den Krieg. Unter seinem Einfluss erreicht die militärische Exzellenz neue Höhen, ebenso wie der Appetit auf Konflikte. Feinde nehmen ein Reich zur Kenntnis, das keine Ruhe kennt, und Koalitionen bilden sich gegen es."
 war_hawk_die_desc: "[CHARACTER.GetName] ist gestorben, und die Offiziere, die [CHARACTER.GetSheHe] drillte, atmen zum ersten Mal seit Jahren tief durch."
 zealous_inquisitor: "Eifriger Inquisitor"
 desc_zealous_inquisitor: "In der Seele dieses Beraters brennt ein Feuer, und es verzehrt Zweifel, Häresie und Zögern mit gleichem Hunger. In einem Reich eines Glaubens ist dies ein Geschenk. In einem Reich vieler Glaubensrichtungen ist es eine Katastrophe, die nur darauf wartet, einzutreten."
 zealous_inquisitor_die_desc: "[CHARACTER.GetName] hat seinen Schöpfer getroffen und muss nun einige schwierige Fragen über [CHARACTER.GetHerHis] eigenes Dasein beantworten."
 fumbling_integrator: "Ungeschickter Integrator"
 desc_fumbling_integrator: "Dieser Berater meint es gut, ist aber schlichtweg überfordert. Unterlagen werden falsch abgelegt, Edikte falsch formuliert und Delegationen gelassen – unter seiner Obhut schreitet die Eingliederung neuer Ländereien in das Reich in einem qualvollen Schneckentempo voran."
 fumbling_integrator_die_desc: "[CHARACTER.GetName] ist gestorben. Drei Abteilungen brauchten eine Woche, um den Papierkram zu bestätigen."
 able_integrator: "Fähiger Integrator"
 desc_able_integrator: "Als fähiger und vielseitiger Verwalter steuert dieser Berater die komplexen Abläufe der Integration neuer Territorien mit stiller Kompetenz. Nicht brillant, aber zuverlässig — und Zuverlässigkeit ist oft mehr wert."
 able_integrator_die_desc: "[CHARACTER.GetName] ist gestorben. Die Akten sind in Ordnung, die Übergänge geplant und die Arbeit wird – wie immer – weitergehen."
 master_integrator: "Meister der Integration"
 desc_master_integrator: "Dieser Berater ist in administrativen, militärischen und diplomatischen Angelegenheiten äußerst kompetent. In seinen Händen schreitet die Eingliederung neuer Ländereien schnell und reibungslos voran."
 master_integrator_die_desc: "[CHARACTER.GetName] ist gestorben, und die Nachfolger in drei verschiedenen Abteilungen stellen gerade fest, wie viel eine einzelne Person eigentlich geleistet hat."
 iron_integrator: "Eiserner Integrator"
 desc_iron_integrator: "Integration ist normalerweise eine langsame und vorsichtige Kunst. Dieser Berater betrachtet sie als einen Eroberungsfeldzug – schnell, unerbittlich und total. Das Reich fügt sich mit ungewöhnlicher Geschwindigkeit, aber die integrierten Untertanen fühlen sich selten einbezogen, und die Stände lassen ihren Unmut bekannt werden."
 iron_integrator_die_desc: "[CHARACTER.GetName] ist gestorben. Die Provinzen, die sie eingliederten, sind vorerst ruhig."
 provocateur: "Provokateur"
 desc_provocateur: "Mit der Anmut einer Kanonenkugel stolpert dieser Berater durch die Außenbeziehungen und schafft das bemerkenswerte Kunststück, Nachbarn zu antagonisieren, die zuvor keinen besonderen Streit mit uns hatten."
 provocateur_die_desc: "[CHARACTER.GetName] ist gestorben. Mehrere Botschafter haben Blumen geschickt. Das Mitgefühl ist aufrichtig."
 tactful_envoy: "Taktvoller Gesandter"
 desc_tactful_envoy: "Ein Diplomat, der versteht, dass Schweigen eine Waffe und das Timing alles ist; dieser Berater glättet die Ecken und Kanten unserer Außenbeziehungen ohne große Gesten oder Versprechen, die wir nicht halten können."
 tactful_envoy_die_desc: "[CHARACTER.GetName] ist gestorben. [CHARACTER.GetHerHis] Abwesenheit wird in einem Dutzend kleiner Höflichkeiten spürbar sein, die wir nicht mehr zu vollführen wissen."
 master_statesman: "Meisterstaatsmann"
 desc_master_statesman: "Dieser Berater ist ein geschickter Unterhändler, der rivalisierende Höfe zufriedenstellen kann, selbst wenn diese Zugeständnisse gemacht haben. Unter seiner Führung neigt der Groll, den andere Nationen gegen uns hegen könnten, dazu, zu verblassen."
 master_statesman_die_desc: "[CHARACTER.GetName] ist gestorben, und ausländische Höfe, die [CHARACTER.GetHerHim] bewunderten, senden Briefe aufrichtiger Beileidbekundung."
 dove_of_court: "Taube des Hofes"
 desc_dove_of_court: "Dieser Berater hat die Kunst, keine Feinde zu machen, zu einer Regierungsphilosophie erhoben. Ausländische Gegnerschaften verblassen, das Ansehen verbessert sich – aber ebenso wie eine gewisse Weichheit in unseren Räten, eine wachsende Vorliebe für Kompromisse gegenüber Vorteilen, die schärfere Rivalen schnell ausnutzen werden."
 dove_of_court_die_desc: "[CHARACTER.GetName] ist gestorben. Das Reich, das [CHARACTER.GetSheHe] hinterlässt, ist beliebt und vielleicht zu sehr an den Komfort gewöhnt."
 timid_landlubber: "Schüchterner Landratte"
 desc_timid_landlubber: "Dieser Berater blickt auf eine Seekarte und sieht nur Möglichkeiten zu ertrinken. Jede Expedition erfordert mehr Zuspruch als die Schiffe Vorräte benötigen, und das Tempo unserer Exploration spiegelt dies wider."
 timid_landlubber_die_desc: "[CHARACTER.GetName] ist gestorben, ohne jemals einen Fuß auf ein Boot gesetzt zu haben – und stolz darauf."
 capable_explorer: "Fähiger Entdecker"
 desc_capable_explorer: "Als kompetente und zuverlässige Hand bei der Unterstützung von Expeditionen stellt dieser Berater sicher, dass Schiffe pünktlich auslaufen, die Vorräte ausreichend sind und Depeschen prompt zurückkehren. Kein Visionär, aber Exploration gedeiht ebenso sehr durch kompetente Verwaltung wie durch kühne Kapitäne."
 capable_explorer_die_desc: "[CHARACTER.GetName] ist gestorben. [CHARACTER.GetHerHis] Geschäftsbücher waren tadellos und die Flotten, die [CHARACTER.GetSheHe] ausstattete, sind noch immer auf See."
 legendary_navigator: "Legendärer Navigator"
 desc_legendary_navigator: "Dieser Berater scheint das Meer so zu verstehen, wie andere ihre Muttersprache verstehen. Unter seiner Leitung finden unsere Entdecker günstige Winde, wo andere Stürme finden, und die Grenzen der bekannten Welt schrumpfen mit jedem Jahr."
 legendary_navigator_die_desc: "[CHARACTER.GetName] ist gestorben, und die Kartografen streiten bereits darüber, wie die geografischen Merkmale benannt werden sollen, bei deren Entdeckung [CHARACTER.GetSheHe] half."
 restless_pioneer: "Rastloser Pionier"
 desc_restless_pioneer: "Dieser Berater kann keine weiße Fläche auf einer Karte betrachten, ohne sie füllen zu wollen. Die Exploration beschleunigt sich und Siedler strömen in neue Länder – doch koloniale Ambitionen sind niemals still, und die Mächte der Welt beginnen uns mit misstrauischen Augen zu betrachten."
 restless_pioneer_die_desc: "[CHARACTER.GetName] ist irgendwo am Rande der bekannten Welt gestorben, was genau dort ist, wo [CHARACTER.GetSheHe] es gewollt hätte."
 desc_law_reformer: "Ein scharfer juristischer Verstand und ein Sinn für Reformen haben diesen Berater unentbehrlich bei der Straffung des Gesetzgebungsprozesses gemacht. Widersprüchliche Statuten und archaische Bräuche weichen seiner sorgfältigen Feder."
 prosperity_planner_die_desc: "[CHARACTER.GetName] ist verstorben. Die Felder, die sie mit zu pflegen halfen, werden noch immer blühen, doch eine führende Hand am Pflug ist nicht mehr da."
