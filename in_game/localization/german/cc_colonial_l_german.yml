l_german:
 # ============================================================
 # Colonial Divan Events — Pillar 07
 # ============================================================

 # ============================================================
 # Section A — Colonial Posting Events (cc_posting namespace)
 # ============================================================

 # --- cc_posting.1 — The Governor's Dispatch ---
 cc_posting.1.title: "Die Depesche des Gouverneurs"
 cc_posting.1.desc: "Ein versiegelter Brief von [minister.GetName] ist eingetroffen, der in Übersee entsandt wurde, um [colony.GetName] zu regieren. [minister.GetHerHis|c] Bericht über die Bedingungen in der Kolonie ist sachlich und professionell – doch die Krone muss nun entscheiden, wie sie auf die Bedürfnisse reagiert, die [minister.GetHeShe] beschreibt."

 cc_posting.1.a: "Investiere in die Zukunft der Kolonie."
 cc_posting.1.a.tooltip: "Münzen fließen nach [colony.GetName]. Die Investition wird den kolonialen Wohlstand beschleunigen und die wirtschaftlichen Beziehungen verbessern – eine langfristige Wette auf die Expansion des Reiches."

 cc_posting.1.b: "Die Depesche ist zufriedenstellend – bestätigen Sie den Empfang."
 cc_posting.1.b.tooltip: "[minister.GetName]'s sorgfältige Berichterstattung spricht gut für [minister.GetHerHis] Dienst. Ein Wort königlicher Anerkennung wird [minister.GetHerHis] diplomatische Schärfe steigern."

 cc_posting.1.c: "Fordern Sie, dass die Kolonie sofort mehr Tribut sendet."
 cc_posting.1.c.tooltip: "Die Bedürfnisse des Reiches haben Vorrang. Einnahmen fließen in die Heimat – doch die Kolonialverwalter werden die Extraktion missbilligen, und das Band zu [colony.GetName] wird bröckeln."

 # --- cc_posting.2 — Corruption in the Colony ---
 cc_posting.2.title: "Korruption in der Kolonie"
 cc_posting.2.desc: "[minister.GetName] hat ein Muster finanzieller Unregelmäßigkeiten bei den Kolonialbeamten von [colony.GetName] aufgedeckt. Mittel, die für die Infrastruktur bestimmt waren, wurden umgeleitet; die Konten gehen nicht auf. [minister.GetHeShe] bittet um Anweisungen."

 cc_posting.2.a: "Wurzeln ausreißen – entfernen Sie die korrupten Beamten."
 cc_posting.2.a.tooltip: "Eine entschlossene Antwort stellt die Ordnung wieder her. Ein [minister.GetName] mit administrativer Expertise wird die Krise in eine Reform verwandeln; ohne diese kostet die Bereinigung dennoch die Schatzkammer."

 cc_posting.2.b: "Einen persönlichen Anteil einstreichen und wegschauen."
 cc_posting.2.b.tooltip: "Die Korruption wird diskret geteilt statt beseitigt. Gold fließt zurück an die Krone — aber die Finanzen der Kolonie verschlechtern sich weiter, und der Charakter von [minister.GetName] könnte durch diese Entscheidung dauerhaft gezeichnet werden."

 cc_posting.2.c: "Berichte über die Fakten – greife nicht ein."
 cc_posting.2.c.tooltip: "Ein formaler Bericht wird eingereicht und es geschieht nichts. Die Untätigkeit kostet Prestige und verunsichert den Hof, aber zumindest wird kein weiterer Schaden angerichtet."

 # --- cc_posting.3 — A Native Uprising ---
 cc_posting.3.title: "Ein Aufstand der Einheimischen"
 cc_posting.3.desc: "Die in dem Gebiet um [colony.GetName] ansässigen Gemeinschaften haben bewaffneten Widerstand geleistet. [minister.GetName] schreibt mit einer dringenden Bitte: Die Krone muss entscheiden, wie zu reagieren ist, bevor die Situation weiter eskaliert."

 cc_posting.3.a: "Sende Kolonialstreitkräfte – unterdrücke den Aufstand."
 cc_posting.3.a.tooltip: "Truppen wurden entsandt. Der Aufstand wird mit Gewalt niedergeschlagen, aber die Beziehung der Kolonialbevölkerung zur Krone ist dauerhaft beschädigt — und die Rekrutierung der Männer ist in der Heimat spürbar."

 cc_posting.3.b: "Einen Vergleich aushandeln."
 cc_posting.3.b.tooltip: "Gold und Konzessionen kaufen einen brüchigen Frieden. Die diplomatische Lösung belastet die Schatzkammer, bringt aber Prestige ein – und [minister.GetName] erweist sich als geschickterer Verhandlungsführer."

 cc_posting.3.c: "Entscheiden Sie sich für eine vollständige militärische Pazifizierung."
 cc_posting.3.c.tooltip: "Ein umfassender Militärfeldzug wird gestartet, um den Widerstand dauerhaft zu brechen. Die Kosten an Menschenleben und Stabilität sind hoch, aber [minister.GetName] wird durch die Erfahrung abgehärtet."

 # --- cc_posting.4 — Fever in the Colony ---
 cc_posting.4.title: "Fieber in der Kolonie"
 cc_posting.4.desc: "Ein Brief trifft ein mit düsteren Nachrichten: Tropenfieber hat die Siedlung heimgesucht, in der [minister.GetName] stationiert ist. [minister.GetHeShe] ist erkrankt, das Personal ist dezimiert und die Kolonialverwaltung ist fast vollständig zum Erliegen gekommen. [minister.GetName] erwartet die Entscheidung der Krone."

 cc_posting.4.a: "Befiehl [minister.GetName], die Krankheit zu überwinden."
 cc_posting.4.a.tooltip: "[minister.GetName] bleibt trotz des Fiebers im Dienst. [minister.GetHerHis|c] Hingabe erntet königliche Bewunderung — aber die Krankheit fordert ihren Tribut von [minister.GetHerHis] administrativen und diplomatischen Fähigkeiten."

 cc_posting.4.b: "Ordne Ruhe und eine reduzierte Arbeitslast an."
 cc_posting.4.b.tooltip: "[minister.GetName] wird von den schwersten Pflichten entbunden, bis die Genesung eingetreten ist. Die Kolonialverwaltung gerät ins Straucheln und die Stabilität leidet — aber der Minister bleibt vor dem Schlimmsten bewahrt."

 # ============================================================
 # Section B — Charter Company Events (cc_colonial namespace)
 # ============================================================

 # --- cc_colonial.1 — The Company's Accounts ---
 cc_colonial.1.title: "Die Konten der Kompanie"
 cc_colonial.1.desc: "[minister.GetName] hat die vergangenen Monate damit verbracht, die Kontobücher von [colony.GetName] zu studieren. [minister.GetHeShe] legt dem Rat nun die Abrechnungen vor. Das Bild ist komplex — Gewinne, Verbindlichkeiten und einige Zahlen, die nicht ganz aufgehen."

 cc_colonial.1.a: "Genehmigen Sie die Rückzahlungen in voller Höhe."
 cc_colonial.1.a.tooltip: "[minister.GetName]'s Handelsverbindungen haben die Konten in einen Windfall verwandelt. Die Kompanie meldet ihre vollen Gewinne an die Krone — eine beträchtliche Summe."

 cc_colonial.1.b: "Ordne zuerst eine gründliche Prüfung an."
 cc_colonial.1.b.tooltip: "[minister.GetName]'s methodische Inspektion entdeckt Unregelmäßigkeiten, bevor sie zu Skandalen werden. Die Prüfung ergibt einen geringeren, aber tadellos sauberen Ertrag — und die Sorgfalt des Ministers wird am Hof bemerkt."

 cc_colonial.1.c: "Führen Sie eine Standardprüfung durch."
 cc_colonial.1.c.tooltip: "Die Abrechnungen werden ohne Dramatik geprüft. Die Sorgfalt des Rates bei der Überwachung der Unternehmensangelegenheiten bringt bescheidenes Prestige ein – eine stille Bestätigung einer soliden Regierungsführung."

 # --- cc_colonial.2 — A Monopoly Dispute ---
 cc_colonial.2.title: "Ein Monopolstreit"
 cc_colonial.2.desc: "[minister.GetName] hat dem Rat eine formelle Petition vorgelegt: Der Bürgerstand strebt nach erweiterten Handelsrechten für die Handelskompanie von [colony.GetName]. Die Adligen wenden lautstark ein, dass dies ihre eigenen kommerziellen Interessen untergraben würde. Der Herrscher muss entscheiden, wer obsiegt."

 cc_colonial.2.a: "Gewähre der Kompanie ein Handelsmonopol."
 cc_colonial.2.a.tooltip: "Der Handelsgesellschaft werden Exklusivrechte über die Handelsströme von [colony.GetName] gewährt. Ein Teil der Händlereinkünfte wird für die nächsten fünfzehn bis fünfundzwanzig Jahre an die Krone abgeführt. Der Stand der Bürger ist zufrieden; der Adel ist stillschweigend wütend."

 cc_colonial.2.b: "Beschränken Sie die vorgeschlagene Expansion."
 cc_colonial.2.b.tooltip: "Die adligen Stände setzen sich durch. Ihre kommerziellen Interessen sind geschützt, und das Ansehen der Krone wird durch die gezeigte königliche Zurückhaltung gesteigert – doch der Bürgerstand wird die Missachtung nicht vergessen."

 cc_colonial.2.c: "Vermitteln Sie einen Kronenkompromiss."
 cc_colonial.2.c.tooltip: "[minister.GetName] vermittelt einen Mittelweg. Beide Stände erhalten bescheidene Zugeständnisse, Gold fließt über kommerzielle Kanäle und der Ruf des Ministers als geschickter Verhandlungsführer wächst."

 # --- cc_colonial.3 — The Governor's Letter ---
 cc_colonial.3.title: "Der Brief des Gouverneurs"
 cc_colonial.3.desc: "Ein formaler Brief von [minister.GetName] ist eingetroffen, der als Gouverneur nach [colony.GetName] entsandt wurde. [minister.GetHeShe] schreibt mit einer klaren Bitte: Die Kolonialverwaltung benötigt zusätzliche Unterstützung durch die Krone. Welche Form diese Unterstützung annimmt, liegt im Ermessen der Krone."

 cc_colonial.3.a: "Sende Truppenverstärkungen."
 cc_colonial.3.a.tooltip: "Soldaten werden nach [colony.GetName] entsandt. Die militärische Beziehung zwischen Krone und Kolonie stärkt sich — und [minister.GetName] gewinnt unmittelbare Führungserfahrung."

 cc_colonial.3.b: "Sende finanzielle Unterstützung."
 cc_colonial.3.b.tooltip: "Das Gold der Krone fließt in die Schatzkammer von [colony.GetName]. Die wirtschaftlichen Grundlagen der Kolonie werden gestärkt, und [minister.GetName] beweist die administrative Kompetenz, die diese Position erfordert."

 cc_colonial.3.c: "Die Anfrage ablehnen — die Krone kann die Ressourcen nicht entbehren."
 cc_colonial.3.c.tooltip: "Das Ersuchen des Gouverneurs wird abgelehnt. Das Ansehen von [minister.GetName] am Hof sinkt durch den sichtbaren Mangel an königlichem Vertrauen, und die Kolonialverwaltung wird misstrauischer gegenüber den Absichten der Krone."

 # ============================================================
 # Section C — Decolonization Crisis (cc_colonial namespace)
 # ============================================================

 # --- cc_colonial.10 — The Colonial Petition ---
 cc_colonial.10.title: "Die Kolonialpetition"
 cc_colonial.10.desc: "[minister.GetName] hat dem Rat eine formelle Petition im Namen von [colony.GetName] vorgelegt: Die Kolonialbevölkerung fordert mehr Selbstverwaltung. Die revolutionäre Rhetorik des Ministers hat die Bewegung galvanisiert. Wie die Krone reagiert, wird die Beziehung des Imperiums zu seinen Überseegebieten für eine Generation definieren."

 cc_colonial.10.a: "Gewähre größere Autonomie — beginne die Verhandlungen."
 cc_colonial.10.a.tooltip: "Die Krone erkennt die Legitimität der Petition an. Stabilität wird Staatskunst geopfert – die politische Beziehung zu [colony.GetName] verbessert sich, und formelle Vereinbarungen werden folgen."

 cc_colonial.10.b: "Die Petition kategorisch ablehnen."
 cc_colonial.10.b.tooltip: "Die Krone weigert sich, mit kolonialen Agitatoren zu verhandeln. Das Prestige bleibt gewahrt – doch die Reaktion von [minister.GetName] auf diese Ablehnung ist unvorhersehbar, und die politische Lage in [colony.GetName] bleibt volatil."

 cc_colonial.10.c: "Entferne [minister.GetName] aus dem Kabinett."
 cc_colonial.10.c.tooltip: "Der Einfluss des Agitatoren wird an der Wurzel abgeschnitten. [minister.GetName] wird entlassen, die Petition verliert ihren Fürsprecher am Hof und die Krise ist eingedämmt – doch der Ruf der Krone in Bezug auf Toleranz leidet."

 # --- cc_colonial.11 — The Defection ---
 cc_colonial.11.title: "Die Deserteurschaft"
 cc_colonial.11.desc: "Die Nachricht erreicht den Palast, dass [minister.GetName] vom Hof verschwunden ist. Berichte aus [colony.GetName] bestätigen das Schlimmste: Der Minister hat sich der kolonialen Unabhängigkeitsbewegung angeschlossen und bringt Hofkenntnisse und königliche Verbindungen in die Unabhängigkeitsbewegung ein. Der Schaden muss begrenzt werden."

 cc_colonial.11.a: "Lassen Sie [minister.GetName] gehen — begrenzen Sie die Auswirkungen."
 cc_colonial.11.a.tooltip: "Die Defektion ist ein Schlag für das Prestige der Krone. Die diplomatischen Beziehungen im gesamten Reich bröckeln, da der Abgang des Ministers Verwundbarkeit signalisiert – doch die koloniale Sache gewinnt an Dynamik, die es Jahre dauern wird, sie wieder rückgängig zu machen."

 cc_colonial.11.b: "Entsende Agenten, um [minister.GetName] zu verhaften, bevor sie die Grenze überqueren."
 cc_colonial.11.b.tooltip: "Der Minister wird abgefangen, bevor er die Kolonie erreicht. Die Desertion wird verhindert – aber die harte Reaktion destabilisiert den Hof und ruiniert die politischen Beziehungen zu [colony.GetName]."

 # --- cc_colonial.12 — The Compromise ---
 cc_colonial.12.title: "Der Kompromiss"
 cc_colonial.12.desc: "Monate nach dem Versprechen der Krone, größere Autonomie zu gewähren, müssen die formalen Vereinbarungen nun schriftlich fixiert werden. Die Kolonialführung von [colony.GetName] wartet auf das Engagement der Krone — oder auf deren Rückzug aus diesem Engagement."

 cc_colonial.12.a: "Formalisiere den Autonomiepakt."
 cc_colonial.12.a.tooltip: "Die Krone hält ihr Wort. [colony.GetName] erhält die formelle Anerkennung ihrer erweiterten Autonomie. Die Kolonie blüht unter der neuen Regelung auf, und die politischen sowie kulturellen Bande zum Mutterland werden gestärkt statt zerrissen."

 cc_colonial.12.b: "Zieht das Angebot zurück – die Krone kann nicht so viel nachgeben."
 cc_colonial.12.b.tooltip: "Das Versprechen ist gebrochen. Das Prestige bricht ein, da die Kolonialführung erkennt, dass das Gelöbnis hohl war — und die politischen Beziehungen zu [colony.GetName] erleiden einen Schlag, von dem sie sich möglicherweise nicht mehr erholen."

 # ============================================================
 # Colonial Divan Modifier Names
 # ============================================================
 STATIC_MODIFIER_NAME_cc_col_colonial_investment: "Koloniale Investition"
 cc_col_colonial_investment: "Koloniale Investition"
 cc_col_colonial_investment_desc: "Ressourcen der Krone wurden in die Entwicklung dieser Kolonie geleitet. Der Wohlstand wächst und die kommerzielle Effizienz verbessert sich durch die direkten Investitionen der imperialen Regierung."

 STATIC_MODIFIER_NAME_cc_col_colonial_autonomy: "Abkommen über koloniale Autonomie"
 cc_col_colonial_autonomy: "Abkommen über koloniale Autonomie"
 cc_col_colonial_autonomy_desc: "Dieser Kolonie wurde die formale Anerkennung ihrer erweiterten Selbstverwaltung gewährt. Wohlstand und kommerzielle Aktivitäten blühen unter dieser Regelung auf – und die Beziehung zum Mutterland ist dadurch gestärkt worden."

 STATIC_MODIFIER_NAME_cc_col_defection_fallout: "Folgen kolonialer Abspaltung"
 cc_col_defection_fallout: "Folgen kolonialer Abspaltung"
 cc_col_defection_fallout_desc: "Die Defektion eines Kabinettsministers zur kolonialen Unabhängigkeitsbewegung hat das Ansehen der Krone beschädigt. Die Loyalität der Vasallen ist erschüttert und der diplomatische Ruf im gesamten Reich leidet."



# Colonial buildings

 colonial_migration_center: "Migrationszentrum"
 colonial_migration_center_desc: "Ein Kolonialamt zur Registrierung von Neuankömmlingen, der Zuweisung von Haushalten und der Lenkung von Siedlern zu verfügbarem Land und Arbeit."
 colonial_migration_center_maintenance: "Unterhalt des Migrationszentrums"
 colonial_migration_center_maintenance_desc: "Migrationszentren benötigen Aufzeichnungen, Bücher, Stoffe, Münzen und Werkzeuge, um Ankünfte und Siedlungszuweisungen zu organisieren."
