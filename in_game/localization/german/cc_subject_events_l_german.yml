l_german:
 # ============================================================
 # Provincial Governorate Events
 # ============================================================

 cc.gov.1.title: "Die Ambitionen des Gouverneurs"
 cc.gov.1.desc: "Berichte von [governor.GetName] sprechen von einem unruhigen Hof – Versprechen an lokale Beamte, gesteigerte Erwartungen und ein Regierungsapparat, der beginnt, sich für weitaus unabhängiger zu halten, als wir es beabsichtigt hatten."
 cc.gov.1.a: "Den Hof des Gouverneurs ausbezahlen."
 cc.gov.1.b: "Unterdrücke die Ambitionen mit Nachdruck."
 cc.gov.1.c: "Ignoriere es vorerst."

 cc.gov.2.title: "Der Gouverneur hat die Nachbarn im Blick"
 cc.gov.2.desc: "[governor.GetName] hat ein Memorandum geschickt, das auf die militärische Schwäche von [target_neighbor.GetName] entlang unserer Grenze hinweist. Der Gouverneur formuliert den Vorschlag deutlich: Hier bietet sich eine Gelegenheit."
 cc.gov.2.a: "Eine begrenzte Expansion genehmigen."
 cc.gov.2.b: "Verbieten Sie solch einen Abenteurertum."

 # ============================================================
 # Tax Farm Events
 # ============================================================

 cc.tax.1.title: "Der Aufstand der Steuerpacht"
 cc.tax.1.desc: "Nachrichten erreichen uns von [tax_lord.GetName]: Die Steuereintreiber haben zu hart vorgepresst, und die Einheimischen haben sich gewehrt. In den Straßen herrscht Unruhe und in den Lagern brennt es. Es muss etwas unternommen werden."
 cc.tax.1.a: "Erleichtern Sie die Extraktion – gewähren Sie etwas Entlastung."
 cc.tax.1.b: "Haltet stand. Die Ordnung wird wiederhergestellt werden."

 cc.tax.2.title: "Steuereintreiber und die Nachbarn"
 cc.tax.2.desc: "Die Nachbarn von [tax_lord.GetName] haben eine formelle Beschwerde eingereicht. Unsere Steuereintreiber, so behaupten sie, hätten über die Grenze hinweg agiert – Waren beschlagnahmt, Kaufleute befragt und fremdes Territorium wie ihr eigenes behandelt."
 cc.tax.2.a: "Entschädigen Sie die Nachbarn und zügeln Sie die Steuereintreiber."
 cc.tax.2.b: "Die Steuereintreiber waren im Recht."

 # ============================================================
 # Military March Events
 # ============================================================

 cc.march.1.title: "Der Raubzug des Markgrafen"
 cc.march.1.desc: "Unser Markgraf [march_lord.GetName] hat einen Raubzug gegen [raided_neighbor.GetName] gestartet — opportunistisch, profitabel und völlig ohne unsere Genehmigung. Ein vollständiger Bericht wurde vorgelegt. Nun müssen wir entscheiden, wie wir reagieren."
 cc.march.1.a: "Den Überfall genehmigen. Lasst sie die Beute behalten."
 cc.march.1.b: "Zügeln Sie den Markgrafen. Dies ist nicht gestattet."

 cc.march.2.title: "Unabhängigkeitsbestreben des Markgrafen"
 cc.march.2.desc: "Da der Adel unruhig wird, hat [march_lord.GetName] diesen Moment gewählt, um unsere Entschlossenheit zu prüfen. Die Agenten des Markgrafen befinden sich in der Hauptstadt und sprechen von Beschwerden, alten Schulden und der Unabhängigkeit, die ihre Vorfahren einst genossen."
 cc.march.2.a: "Sie auszahlen – Gold und adelige Konzessionen gewähren."
 cc.march.2.b: "Wandle die Mark in ein Protektorat um."

 cc.march.3.title: "Der Markgraf bedroht die Nachbarn"
 cc.march.3.desc: "[march_lord.GetName] hat Truppen an der Grenze zu [threatened_neighbor.GetName] zusammengestellt und stellt Forderungen, die wir nie autorisiert haben. Der Nachbar blickt zu uns für Führung – oder Zurückhaltung."
 cc.march.3.a: "Unterstütze die Aggression des Markgrafen."
 cc.march.3.b: "Verurteilen Sie das Verhalten des Markgrafen."
 cc.march.3.c: "Vermitteln Sie im Streitfall."

 cc.march.charter.1.title: "Ein militärischer Marsch wurde etabliert"
 cc.march.charter.1.desc: "Durch das Privileg unseres Adels wurde ein Militärgrenzmarken-Status formal festgeschrieben. Ihr Herr ist bereit, als Schwert des Reiches an der Grenze zu dienen — im Austausch für die Autonomie, die seine Rolle erfordert."
 cc.march.charter.1.a: "So soll es gechartert werden."
 cc.march.charter.1.a.tt: "Gewährt dem Markgrafen eine erhöhte Zufriedenheit des Adelsstandes."

 # ============================================================
 # Subject Lobbying Events (cc.201-203)
 # ============================================================

 cc.company.lobby.1.title: "Die Petition der Chartergesellschaft"
 cc.company.lobby.1.desc: "Agenten von [company.GetName] sind mit einer formellen Petition am Hof eingetroffen: Sie fordern einen stärkeren Schutz ihrer Handelsrouten, rechtliche Stellung in umstrittenen Häfen und ein klares Signal der Krone, dass ihre Expansion sanktioniert wird. Die anderen Untertanen beobachten genau, wie wir reagieren."
 cc.company.lobby.1.a: "Gewähre den von ihnen gewünschten Handelsschutz."
 cc.company.lobby.1.b: "Finanziere die Erweiterung ihrer Operationen direkt."
 cc.company.lobby.1.c: "Die Petition ablehnen. Die Krone verhandelt Charten nicht auf Abruf neu."

 cc.march.lobby.1.title: "Die Forderungen des Markgrafen"
 cc.march.lobby.1.desc: "[march_lord.GetName] hat einen Gesandten mit einer klaren Botschaft geschickt: Die Markgrenzregion hat eine Schwachstelle an der Grenze zu [expansion_target.GetName] identifiziert, und der Markgraf beabsichtigt, darauf zu reagieren. Sie bitten – diesmal formal – um den Segen der Krone."
 cc.march.lobby.1.a: "Gewähre die Autorisierung — lass sie expandieren."
 cc.march.lobby.1.b: "Subventioniere stattdessen Grenzbefestigungen – Expansion ohne Krieg."
 cc.march.lobby.1.c: "Lehnen Sie die Anfrage ab – die Krone wählt ihre Kriege selbst."

 cc.subject.rivalry.1.title: "Eine Rivalität unter den Vasallen"
 cc.subject.rivalry.1.desc: "[company_rival.GetName] und [march_rival.GetName] befinden sich in einem Streit. Die Einzelheiten variieren, je nachdem, wen man fragt – konkurrierende Ansprüche auf eine Handelsroute, ein Grenzscharmützel, eine Beleidigung auf einer Konferenz. Was nicht bestritten wird, ist, dass beide Untertanen nun erwarten, dass die Krone Partei ergreift."
 cc.subject.rivalry.1.a: "Stellen Sie sich auf die Seite von [company_rival.GetName]."
 cc.subject.rivalry.1.b: "Stellen Sie sich auf die Seite von [march_rival.GetName]."
 cc.subject.rivalry.1.c: "Vermitteln Sie im Streitfall – entschädigen Sie beide Seiten."

 # ============================================================
 # Shadow Network Events (cc.140–cc.143)
 # ============================================================

 cc.shadow.intel.1.title: "Informationen aus den Schatten"
 cc.shadow.intel.1.desc: "[shadow_agent.GetName] hat einen verschlüsselten Bericht übermittelt. Unsere Agenten innerhalb von [intel_target.GetName] haben etwas Handfestes identifiziert — eine Schwäche, eine Lücke, ein schlecht gehütetes Geheimnis. Wie wir diesen Vorteil nutzen, liegt in unserer Entscheidung."
 cc.shadow.intel.1.a: "Nutzen wir es diplomatisch aus — setzen wir [intel_target.GetName] unter Druck."
 cc.shadow.intel.1.b: "Teilen Sie die Informationen mit einem Verbündeten."
 cc.shadow.intel.1.c: "Belohnen Sie den Fleiß des Netzwerks."

 cc.shadow.conflict.1.title: "Schattenstaaten im Konflikt"
 cc.shadow.conflict.1.desc: "Zwei unserer Geheimnetzwerke sind aneinandergeraten. [shadow_a.GetName] und [shadow_b.GetName] konkurrieren um dieselben Kontakte, dieselben Routen, dieselben verborgenen Winkel der Welt. Ohne Intervention wird die Reibung nur zunehmen."
 cc.shadow.conflict.1.a: "Schlichten — trennen Sie ihre Einflusssphären."
 cc.shadow.conflict.1.b: "Lasst die Starken dominieren."
 cc.shadow.conflict.1.c: "Wir haben Einfluss, erpressen wir die schwächere Partei."
 cc.shadow.conflict.1.d: "Nutzen Sie den Konflikt, um von beiden Seiten Profit zu schlagen."

 cc.shadow.legit.1.title: "Ein Schattenstaat sucht Legitimität"
 cc.shadow.legit.1.desc: "[petitioner.GetName] agiert schon lange genug im Verborgenen. Ihre Agenten am Hof sprechen von formaler Anerkennung, von Verträgen, die klar formuliert statt nur impliziert sind, von einem Platz am Tisch statt unter ihm. Der Appell hat Gewicht. Die Entscheidung liegt bei uns."
 cc.shadow.legit.1.a: "Sie in ein formales Marionettenverhältnis überführen."
 cc.shadow.legit.1.b: "Belohnen Sie ihre Loyalität – ohne formelle Anerkennung."
 cc.shadow.legit.1.c: "Weise die Petition zurück. Geheimhaltung ist ihr Zweck."
 cc.shadow.legit.1.d: "Entwurf eines Rahmens für anerkannte Autonomie. [our_statesman.GetName] kann dies erledigen."

 cc.shadow.dark.1.title: "Das Netzwerk verstummt"
 cc.shadow.dark.1.desc: "Die Berichte von [dark_agent.GetName] sind abgebrochen. Keine Nachrichten, keine verschlüsselte Korrespondenz, keine geflüsterte Bestätigung, dass das Netzwerk noch operiert. Unser Büro für den Schattenhof kann nicht mehr bestätigen, ob unsere Agenten loyal sind, kompromittiert wurden oder einfach nur warten."
 cc.shadow.dark.1.a: "Agenten entsenden, um den Kontakt wiederherzustellen."
 cc.shadow.dark.1.b: "Warten wir ab. Das Netzwerk wird wieder auftauchen — oder eben nicht."

 # ============================================================
 # Client State / Puppet State Events (cc.150–cc.152)
 # ============================================================

 cc.client.1.title: "Der Klientenstaat spielt seine Autonomie aus"
 cc.client.1.desc: "[client.GetName] hat begonnen, im laufenden Streit mit [dispute_neighbor.GetName] eigenständig zu handeln – Verpflichtungen einzugehen, Signale zu senden und sich so zu positionieren, dass es nicht mehr scheint, als fühlte es sich an unsere Außenpolitik gebunden. Ob dies Ehrgeiz oder Nachlässigkeit ist, verlangt nach einer Antwort."
 cc.client.1.a: "Zügeln Sie sie ein – dies ist nicht ihr Krieg, den sie beginnen sollten."
 cc.client.1.b: "Lasst sie handeln – ihre Initiative könnte sich als nützlich erweisen."

 cc.puppet.1.title: "Die Fäden der Marionette"
 cc.puppet.1.desc: "Gesandte von [puppet.GetName] sind mit einem bekannten Anliegen am Hof eingetroffen. Sie haben pflichtbewusst gedient, gekämpft, wenn es ihnen befohlen wurde, und das gezahlt, was fällig war. Nun wünschen sie, im Rat zu sitzen – nicht um zu regieren, sondern um gesehen zu werden. Die Fäden sind immer noch da; sie wollen nur, dass sie wie ein Gewand aussehen."
 cc.puppet.1.a: "Gewähre symbolische Anerkennung."
 cc.puppet.1.b: "Lehnen Sie die Anfrage entschieden ab."
 cc.puppet.1.c: "Kauf ihr Schweigen."

 cc.client.puppet.1.title: "Klientelstaat und Marionette im Streit"
 cc.client.puppet.1.desc: "Wir erfahren, dass [the_client.GetName] Geheimverhandlungen mit [the_puppet.GetName] aufgenommen hat – völlig ohne unser Wissen oder unsere Zustimmung. Was sie besprochen haben, ist unklar, aber die Tatsache, dass sie überhaupt sprachen, ohne uns zu informieren, ist genau die Art von Drift, die wir nicht zur Gewohnheit werden lassen können."
 cc.client.puppet.1.a: "Verbieten Sie den direkten Kontakt – die gesamte Kommunikation läuft über uns."
 cc.client.puppet.1.b: "Den Kontakt erlauben – Kooperation zwischen unseren Untertanen ist keine Bedrohung."
 cc.client.puppet.1.c: "Vermitteln Sie den Kontakt formell."

 # Elite Enclave / Palatinate events are localised in cc_subjects_l_english.yml

 # ============================================================
 # Associated Republic Events (cc.170–cc.171)
 # ============================================================

 cc.republic.1.title: "Der wissenschaftliche Austausch der Republik"
 cc.republic.1.desc: "Delegierte aus [republic.GetName] haben ein formelles Austauschprogramm vorgeschlagen: ihre Gelehrten an unsere Akademien, unsere Minister in ihre Räte und einen stetigen Fluss gedruckter Werke zwischen beiden Höfen. Sie stellen es als gegenseitige Bereicherung dar. Es könnte jedoch auch mehr sein."
 cc.republic.1.a: "Finanziere das Programm formell."
 cc.republic.1.b: "Einen Gelehrten der Republik in unser Kabinett aufnehmen."
 cc.republic.1.c: "Den Vorschlag ablehnen."

 cc.republic.2.title: "Republikanischer Dissens"
 cc.republic.2.desc: "Korrespondenz aus [republic.GetName] beschreibt eine wachsende Unruhe innerhalb der Bürgerschicht. Unsere Politik — in Bezug auf Handel, Besteuerung und den Umgang mit Kaufmannsinteressen — hat Reibungen erzeugt, die der Rat der Republik nicht länger stillschweigend absorbieren kann. Sie fordern uns zu Anpassungen auf. Ihr Ton lässt darauf schließen, dass sie eine Ablehnung unsererseits erwarten."
 cc.republic.2.a: "Machen Sie Zugeständnisse – passen Sie die Richtlinien an."
 cc.republic.2.b: "Ignoriere den Widerspruch — republikanischer Komfort ist nicht unser Auftrag."

 # ============================================================
 # Crown Dependency / Protectorate Events (cc.180–cc.181)
 # ============================================================

 cc.crowndep.1.title: "Die Kronabhängigkeit sucht Gunst"
 cc.crowndep.1.desc: "[dependency.GetName] hat sich auf das Band der königlichen Verbindung berufen – formal, über die offiziellen Kanäle und mit allen korrekten Höflichkeiten. Sie bitten um Unterstützung in einer laufenden Angelegenheit und haben deutlich gemacht, dass sie erwarten, dass die Krone sich daran erinnert, dass Loyalität keine Einbahnstraße ist."
 cc.crowndep.1.a: "Unterstütze ihre Bitte — das Band verlangt es."
 cc.crowndep.1.b: "Sende Gold – praktische Hilfe statt Zeremonien."
 cc.crowndep.1.c: "Ablehnen — die Krone kann nicht jedem Gesuch entsprechen."

 cc.protectorate.1.title: "Wachstumsschmerzen des Protektorats"
 cc.protectorate.1.desc: "[ward.GetName] kämpft ums Überleben. Die Berichte beschreiben angespannte Finanzen, interne Spannungen und das schleichende Vordringen einer Instabilität, die ungeprüft zur Krise wird. Sie haben um Unterstützung gebeten — nicht laut, nicht dramatisch, aber die Bitte ist eindeutig. Ob und wie wir sie gewähren, wird prägen, was aus diesem Protektorat wird."
 cc.protectorate.1.a: "Stabilisierende Unterstützung leisten – lindre ihre Lasten."
 cc.protectorate.1.b: "Sende Gold, um ihre Finanzen zu stützen."
 cc.protectorate.1.c: "Wandle sie in einen Klientenstaat um – formalisiere unsere Verpflichtung."
