l_german:
 # ============================================================
 # FEUDAL COURT TRAITS (Age 1)
 # ============================================================

 seneschal: "Seneschal"
 desc_seneschal: "Der Seneschall ist die rechte Hand des Herrn — Verwalter des Haushalts, Manager des Anwesens und Administrator von allem, was die Krone zum Funktionieren benötigt. Unter seiner sorgfältigen Verwaltung werden die Hofausgaben gesenkt und das Wohlwollen des Adels gepflegt."
 seneschal_die_desc: "[CHARACTER.GetName] ist gestorben. Die Haushaltsbücher müssen geprüft werden, bevor man sicher sein kann, was in Ordnung gehalten und was verborgen wurde."

 court_chaplain: "Hofkaplan"
 desc_court_chaplain: "Der Beichtvater und geistliche Berater des Hofes, stets an der Seite des Herrschers. Der Klerus blickt zu ihm nach Führung und Patronage; der Hof blickt zu ihm nach der Sanktion Gottes. Sein Einfluss endet nicht mit dem Ende der Kabinettssitzung."
 court_chaplain_die_desc: "[CHARACTER.GetName] ist gestorben. Die Kerzen werden entzündet und die Gebete gesprochen – und ein neuer Beichtvater wird gefunden. Doch die Vertrautheit spirituellen Rates braucht Jahre, um wieder aufgebaut zu werden."

 marshal_of_the_court: "Marschall des Hofes"
 desc_marshal_of_the_court: "Als Kommandeur der häuslichen Militärfolge stellt der Marschall sicher, dass die Kavallerie des Herrn gut beritten, gut gedrillt und reitbereit ist. Unter seinem Kommando sind berittene Streitkräfte kostengünstiger aufzustellen und erbringen im Feld bessere Leistungen."
 marshal_of_the_court_die_desc: "[CHARACTER.GetName] ist gestorben. Die Kavallerieformationen, die [CHARACTER.GetSheHe] drillte, werden ihre Disziplin für eine Zeit lang beibehalten. Danach muss jemand anderes das Banner übernehmen."

 master_of_coin: "Schatzmeister"
 desc_master_of_coin: "Der Schatzmeister des Feudalhofs – oft ein italienischer Kaufmann, immer ein sorgfältiger Buchhalter. Der Master of Coin lenkt den Handelsfluss zum Vorteil der Krone und sorgt dafür, dass die Kaufmannsgilde den Projekten des Herrschers wohlgesonnen ist."
 master_of_coin_die_desc: "[CHARACTER.GetName] ist gestorben. Die Register, die [CHARACTER.GetSheHe] führte, sind akribisch. Ob [CHARACTER.GetHerHis] Nachfolger sie lesen kann, ist eine andere Frage."

 herald_of_arms: "Herold"
 desc_herald_of_arms: "Der Herold ist die Stimme des Hofes in der Welt jenseits seiner Mauern – er überbringt Nachrichten zwischen Fürsten, verwaltet das Protokoll und aufrechter die zarte Fiktion, dass Diplomatie über den Eigeninteressen steht. Unter seiner Führung wird der diplomatische Ruf des Reiches sorgfältig gepflegt."
 herald_of_arms_die_desc: "[CHARACTER.GetName] ist gestorben. Die Verbindungen, die [CHARACTER.GetSheHe] durch jahrelange sorgsame Korrespondenz pflegte, werden ohne Betreuung nicht überleben. Jemand muss die Korrespondenz fortführen."

 court_astrologer: "Hofastrologe"
 desc_court_astrologer: "Der Astrologe steht an der Schnittstelle zwischen Gelehrsamkeit und spiritueller Autorität — er wird für günstige Daten, bedeutsame Omen und Angelegenheiten von himmlischer Wichtigkeit konsultiert. Sein Einfluss auf das intellektuelle Klima des Hofes ist leise, aber beharrlich."
 court_astrologer_die_desc: "[CHARACTER.GetName] ist gestorben. Die Tabellen und Berechnungen, die [CHARACTER.GetSheHe] hinterließ, werden jahrelang studiert werden – wenn auch, wie immer, so interpretiert, dass sie demjenigen nützen, der sie liest."

 # ============================================================
 # FEUDAL COURT EVENTS (cc_feudal namespace)
 # ============================================================

 cc_feudal.1.title: "Ein Diener des Hofes findet seine Berufung"
 cc_feudal.1.desc: "Ein Minister am Hof hat begonnen, sich in einem bestimmten Bereich hervorzutun. Seine Instinkte und Fähigkeiten werden deutlich. Wir möchten seine aufstrebende Rolle möglicherweise anerkennen – und lenken."
 cc_feudal.1.a: "Ernenne sie zum [ShowTraitName('seneschal')] – lass sie den Haushalt verwalten."
 cc_feudal.1.c: "Stellen Sie sie an die Spitze der Hauskavallerie — [ShowTraitName('marshal_of_the_court')]."
 cc_feudal.1.d: "Weisen Sie sie der Schatzkammer zu — [ShowTraitName('master_of_coin')]."
 cc_feudal.1.e: "Sende sie als unseren [ShowTraitName('herald_of_arms')] – die Stimme des Hofes an ferne Höfe."
 cc_feudal.1.f: "Lassen wir sie die Himmel studieren — [ShowTraitName('court_astrologer')]."

 cc_feudal.10.title: "Der alte Hof weicht"
 cc_feudal.10.desc: "Das Zeitalter des feudalen Hofes geht zu Ende. Neues Wissen, neuer Handel und neue Erwartungen haben begonnen, die Anforderungen an die Regierungsführung neu zu gestalten. Ein Minister der alten Schule steht an einem Scheideweg: sich an das neue Zeitalter anpassen oder an dem festhalten, was er kennt."
 cc_feudal.10.a: "Lasst sie die neue Gelehrsamkeit annehmen – eine neue Rolle für eine neue Ära."
 cc_feudal.10.b: "Sie werden dienen, wie sie schon immer gedient haben — aber der Hof wird nicht auf sie warten."

 cc_feudal.2.title: "Festmahl oder Fasten?"
 cc_feudal.2.desc: "Da die Schatzkammer voll und die Ernte reichlich ist, sind die Adligen voller Erwartung unruhig. Ein großes Fest wurde vorgeschlagen – ein Anlass für Großzügigkeit und Repräsentation. Die Schatzkammer würde nicht leiden, wenn wir ablehnen würden, aber das Wohlwollen des Adels schon."
 cc_feudal.2.a: "Öffne die Küchen und die Weinkeller – der Hof soll feiern."
 cc_feudal.2.b: "Das Reich hat bessere Verwendung für dieses Gold — wir verzichten."

 cc_feudal.3.title: "Der Beichtvater des Königs"
 cc_feudal.3.desc: "Der Hofkaplan hat um eine private Audienz gebeten. Er spricht von Pflicht, von Glauben, von der spirituellen Last der Entscheidungen der Krone – und mit großer Vorsicht vom bevorstehenden Krieg. Sollen wir den Glauben unsere Hand leiten lassen oder unseren eigenen Weg beschreiten?"
 cc_feudal.3.a: "Folgen Sie dem Rat des Kaplans – lassen Sie den Glauben hier sein Wort haben."
 cc_feudal.3.b: "Danken Sie ihnen für ihre Gebete und behalten Sie Ihren eigenen Rat für sich."

 cc_feudal.4.title: "Die Steuererhebung"
 cc_feudal.4.desc: "Der Schatzmeister hat eine formelle Erhebung unserer Provinzeneinnahmen vorgeschlagen – eine sorgfältige Abrechnung dessen, was das Reich tatsächlich produziert und was es tatsächlich zahlt. Es würde etwas Gold kosten, dies ordnungsgemäß durchzuführen, aber die Ergebnisse wären präzise."
 cc_feudal.4.a: "Finanziere die Vermessung – genaue Aufzeichnungen sind die Kosten wert."
 cc_feudal.4.b: "Investiere die Gelder in die Hauptstadt statt in die Buchhaltung."

 cc_feudal.5.title: "Turnier des Hofes"
 cc_feudal.5.desc: "Der Hofmarschall hat ein Turnier vorgeschlagen – drei Tage voller Tjosten, Festmähler und Prunk. Der Adel ist begeistert; die Schatzkammer weniger. Ein Turnier stärkt die Loyalität und die Moral, aber es ist nicht billig."
 cc_feudal.5.a: "Halte das Turnier ab – lass den Hof seine Farben zeigen."
 cc_feudal.5.b: "Die Energie des Turniers stattdessen in tatsächliches militärisches Training lenken"

 cc_feudal.6.title: "Ein gelehrter Ausländer sucht Dienst"
 cc_feudal.6.desc: "Ein Gelehrter von einem fernen Hof ist eingetroffen und sucht eine Anstellung. Sein Wissen ist echt, wenn auch seine Methoden ungewohnt sind. Ein vorsichtiger Hof könnte ablehnen; ein offener könnte feststellen, dass er etwas mitbringt, das uns fehlte."
 cc_feudal.6.a: "Ernenne den Ausländer [foreigner.GetName] – Wissen kennt keine Grenzen. (Der Adel ist nicht erfreut, aber der Gelehrte tritt unserem Hof bei.)"
 cc_feudal.6.b: "Veranstalte einen wissenschaftlichen Austausch zwischen dem Fremden und unserem Hofkaplan. Geteiltes Wissen ist vervielfachtes Wissen."
 cc_feudal.6.c: "Ablehnen — der Hof hat keinen Bedarf an ausländischen Neuheiten."

 cc_feudal.7.title: "Der Ruf zum heiligen Krieg"
 cc_feudal.7.desc: "Der hohe Klerus des Hofes ist im Thronsaal aufgestanden und hat eine Erklärung abgegeben: Der Glaube verlangt nach Taten. Ein benachbartes Reich einer anderen Religion liegt an unserer Grenze, und Gottes Soldaten dürfen nicht untätig bleiben. Der Hof hält den Atem an."
 cc_feudal.7.a: "Folge dem Ruf – lass die Heere des Glaubens ausziehen."
 cc_feudal.7.b: "Spirituelle Vorbereitung autorisieren — wir werden bereit sein, aber wir wählen den Moment."
 cc_feudal.7.c: "Die Krone ist Gott und der Vernunft Rechenschaft schuldig. Dies ist nicht unser Krieg."
 cc_feudal.1.b: "Weisen Sie ihnen pastorale Pflichten zu – machen Sie sie zum [ShowTraitName('court_chaplain')]."
