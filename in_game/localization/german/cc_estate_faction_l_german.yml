l_german:
 # ============================================================
 # Pillar 02 — Estate-Aligned Cabinet Factions
 # ============================================================

 # --- Estate Faction Traits (Family G) ---
 noble_champion_of_court: "Adliger Champion des Hofes"
 noble_champion_of_court_desc: "Dieser Minister ist die eindeutige Stimme des Adelsstandes innerhalb des Kabinetts. Titel, Privilegien und militärische Vorrechte sind die Sprache, die [character.GetHeShe] spricht — und die Stände wissen das."

 merchant_of_the_crown: "Kronkaufmann"
 merchant_of_the_crown_desc: "Dieser Minister, hervorgegangen aus den Kontoren, bringt die kommerzielle Logik des Bürgertums in jeden Rat. Handelsrouten sind Politik; Profit ist Staatskunst."

 court_prelate: "Hofprälat"
 court_prelate_desc: "Dieser Minister bekleidet zwei Ämter: einen Sitz im Kabinett und das Gewicht des Glaubens. Der Klerus sieht in [character.GetHimHer] seinen Fürsprecher im inneren Zirkel der Krone."

 tribune_of_the_commons: "Tribun des Gemeinwohls"
 tribune_of_the_commons_desc: "Nur wenige solcher Minister existieren – noch weniger überstehen die Gleichgültigkeit des Hofes. Dieser hier tut es. [character.GetHeShe|c] hört sich die Petitionen der Bauern an, die andere abtun, und übersetzt sie in eine Politik, die Rebellionen verhindert, statt sie nur zu unterdrücken."

 steppe_voice: "Stimme der Steppe"
 steppe_voice_desc: "Dieser Minister bewegt sich am Hof und in der offenen Ebene mit gleicher Leichtigkeit. [character.GetHeShe|c] vermittelt zwischen den Erwartungen des Stammesstandes und den Anforderungen einer sesshaften Regierung — ein schwieriges, aber notwendiges Gleichgewicht."

 dhimmi_advocate: "Dhimmi-Fürsprecher"
 dhimmi_advocate_desc: "Wo andere eine Steuerbasis sehen, sieht dieser Minister einen Wahlkreis. Die Dhimmi-Gemeinschaft hat eine Stimme im Kabinett gefunden – und das Reich ist dadurch zumindest geringfügig stabiler."

 cossack_hetman_liaison: "Verbindungsmann des Kosaken-Hetmans"
 cossack_hetman_liaison_desc: "Der Hetman vertraut diesem Minister darin, die Interessen der Kosaken dort zu vertreten, wo der Hetman nicht selbst reiten kann. [character.GetHeShe|c] trägt die Forderungen der Steppe und den Stolz der Kosaken in Ratssäle, die sie ansonsten niemals hören würden."

 # --- cc_fac.1 — The Nobles Demand ---
 cc_fac.1.title: "Der Adel fordert"
 cc_fac.1.desc: "Da [noble_minister.GetName] und ein zweiter, dem Adel zugeneigter Minister nun fest im Kabinett etabliert sind, hat der Adelsstand begonnen, so zu handeln, als gehöre der Hof ihnen. Der formelle Delegierte der Stände hat eine Forderung präsentiert – formuliert als Petition, aber jeder weiß, was es ist: ein Privileg, eine Konzession oder eine Reform, die die Macht des Adels für eine Generation festigen wird."

 cc_fac.1.a: "Gewähre das Privileg — der Adel ist zu mächtig, um es abzulehnen."
 cc_fac.1.a.tooltip: "Der Adel ist zufrieden und das Kabinett befürwortet die Entscheidung mit Erleichterung. Die Schatzkammer trägt die Kosten. Die Zusammensetzung des Hofes funktioniert genau so, wie sich die Macht des Adels konzentriert – und die Minister sorgen dafür."

 cc_fac.1.b: "Ablehnen — die Krone regiert nicht durch die Zustimmung des Adels."
 cc_fac.1.b.tooltip: "Eine kühne Ablehnung. Der Adelstand ist gekränkt; [noble_minister.GetName] ist über die Zurechtweisung sichtlich beschämt. Der Hof versteht das Signal — aber jedes Adelshaus im Reich tut es ebenfalls."

 cc_fac.1.c: "Biete ein teilweises Zugeständnis an, um den Frieden zu bewahren."
 cc_fac.1.c.tooltip: "Ein Kompromiss, der niemanden vollständig zufriedenstellt und niemanden fatal kränkt. Die Stände erhalten eine bescheidene Geste; die Krone behält ihre Prärogative; die Schatzkammer zahlt eine kleine Gebühr für den Frieden."

 # --- cc_fac.2 — The Merchant Compact ---
 cc_fac.2.title: "Der Kaufmannspakt"
 cc_fac.2.desc: "Die bürgernahen Minister haben im Stillen gearbeitet. [merchant_minister.GetName] präsentiert das Ergebnis: eine formelle kommerzielle Vereinbarung, gefördert durch die Handelsnetzwerke des Standes und so strukturiert, dass sie die Krone bereichert. Der Deal ist rechtlich fundiert, politisch zweckmäßig und — laut den Adligen, die das Kleingedruckte gelesen haben — zutiefst demütigend für jeden, der kein Kaufmann ist."

 cc_fac.2.a: "Setzen Sie auf den Pakt — kommerzielle Macht ist reale Macht."
 cc_fac.2.a.tooltip: "Die Schatzkammer gewinnt erheblich. Der Stand der Bürger ist entzückt. Der Adelstand, dessen Aufgebote und Grundsteuererträge durch die Vereinbarung stillschweigend untergraben werden, hegt einen leisen Groll."

 cc_fac.2.b: "Den Pakt ablehnen – die Krone sollte nicht durch Kaufleute regieren."
 cc_fac.2.b.tooltip: "Die Ablehnung ist würdevoll, aber eindeutig. [merchant_minister.GetName] nimmt sie schweigend entgegen und legt sie ab. Der Stand ist missfallen – und das Vertrauen des Ministers in die Krone hat abgenommen."

 cc_fac.2.c: "Eine kleinere Version der Vereinbarung akzeptieren."
 cc_fac.2.c.tooltip: "Ein begrenzter Pakt: Gold fließt hinein, ein gewisser Inflationsdruck fließt mit. Die Bürger nennen es einen Anfang. Die Adligen nennen es den ersten Schritt. Beide haben wahrscheinlich recht."

 # --- cc_fac.3 — The Prelates Move ---
 cc_fac.3.title: "Die Prälatinnen und Prälaten handeln"
 cc_fac.3.desc: "[clergy_minister.GetName] hat einen privaten Rat der geistlichen Stimmen des Kabinetts einberufen. Das Ergebnis ist ein formelles Positionspapier: Der Hof muss dafür sorgen, dass die konfessionelle Konformität innerhalb der Institutionen des Reiches durchgesetzt wird. Die Minister sprechen nicht von Häresie – sie sprechen von „administrativer Kohärenz“. Aber die Stände, die Häretiker und die ausländischen Höfe verstehen genau, was hier tatsächlich vorgeschlagen wird."

 cc_fac.3.a: "Den Klerus unterstützen — konfessionelle Einheit stärkt das Reich."
 cc_fac.3.a.tooltip: "Der Klerus ist zufrieden; der Konvertierungsapparat erhält ein formelles Mandat. Das Prestige steigt mit der sichtbaren Frömmigkeit des Reiches. Bürgerliche Händler mit gemischtgläubigen Netzwerken beginnen, stillschweigend wegzuziehen."

 cc_fac.3.b: "Widersteht dem Vorstoß – die Krone regiert alle Stände gleichermaßen."
 cc_fac.3.b.tooltip: "Eine entschiedene Ablehnung, dass die Krone ein Instrument konfessioneller Durchsetzung sein wird. Der Klerus ist missfallen; die Stabilität festigt sich; [clergy_minister.GetName] ist privat außer sich vor Wut."

 cc_fac.3.c: "Kompromiss – geben Sie dem Klerus mehr Einfluss, ohne formelle Durchsetzung."
 cc_fac.3.c.tooltip: "Der Klerus erhält eine größere Entscheidungsgewalt über religiöse Angelegenheiten innerhalb des Zuständigkeitsbereichs des Kabinetts. Nicht das, was sie wollten — aber genug, um es als Zugeständnis zu bezeichnen."

 # ============================================================
 # Modifier Display Names (Pillar 02 — Auto-Modifiers)
 # ============================================================
 MODIFIER_NAME_nobles_court_captured: "Der Adel dominiert das Kabinett"
 MODIFIER_DESC_nobles_court_captured: "Zwei oder mehr adlig orientierte Minister haben das Kabinett zu einem Werkzeug des Adelsstandes gemacht. Prestige fließt an ihre Gönner; kommerzielle und klerikale Agenden werden systematisch depriorisiert."

 MODIFIER_NAME_burghers_court_captured: "Die Bürger dominieren das Kabinett"
 MODIFIER_DESC_burghers_court_captured: "Zwei oder mehr bürgerlich orientierte Minister haben das Kabinett in eine kommerzielle Maschine verwandelt. Die Handelseffizienz steigt; militärische und klerikale Interessen werden stillschweigend ignoriert."

 MODIFIER_NAME_clergy_court_captured: "Geistlichkeit dominiert das Kabinett"
 MODIFIER_DESC_clergy_court_captured: "Zwei oder mehr klerikal orientierte Minister haben dazu geführt, dass das Kabinett mit einer einzigen konfessionellen Stimme spricht. Der religiöse Einfluss steigt; die Toleranz gegenüber Heterodoxie bricht zusammen."

 # ============================================================
 # Static Modifier Names (Pillar 02 — Country Modifiers)
 # ============================================================
 STATIC_MODIFIER_NAME_cc_nobles_court_captured: "Gefangennahme eines Adligen"
 STATIC_MODIFIER_DESC_cc_nobles_court_captured: "Der Adel kontrolliert das Kabinett. Prestige und die Macht der adligen Agenda steigen; kommerzielle und klerikale Interessen leiden darunter."

 STATIC_MODIFIER_NAME_cc_burghers_court_captured: "Einfangung der Bürger"
 STATIC_MODIFIER_DESC_cc_burghers_court_captured: "Der Kaufmannsstand kontrolliert das Kabinett. Die Handelseffizienz steigt; die Interessen des Adels und des Klerus leiden darunter."

 STATIC_MODIFIER_NAME_cc_clergy_court_captured: "Geistlichkeitsgefangenschaft"
 STATIC_MODIFIER_DESC_cc_clergy_court_captured: "Der Klerus kontrolliert das Kabinett. Religiöser Einfluss steigt; Toleranz sinkt; kommerzielle Interessen leiden."
 desc_cossack_hetman_liaison: "Spricht an unserem Hof für den Hetman und vom Hetman zu unserem Hof und genießt an beiden Enden Vertrauen. Der Adel hört zu, und die Reiter ebenso."
 desc_court_prelate: "Ein Geistlicher mit einem Platz am Tisch und keiner Absicht, diesen aufzugeben. Der Glaube spricht im Ausland mit unserer Stimme, und der Klerus spricht im Inland erst recht damit."
 desc_dhimmi_advocate: "Vertritt die Ansicht, dass Untertanen anderer Glaubensrichtungen in erster Linie Untertanen sind, und vertritt dies schon so lange, dass die Leute aufgehört haben, dagegen Einspruch zu erheben. Infolgedessen finden uns ausländische Höfe leichter handhabbar."
 desc_merchant_of_the_crown: "Ein Geschäftsmann, der ein Amt übernahm und nie ganz aufhörte, ein Geschäftsmann zu sein. Unsere Waren verkaufen sich besser, und die Bürger haben am Hofe eine Stimme gefunden."
 desc_noble_champion_of_court: "Der Mann des Adels im Kabinett und stolz darauf. Die Krone gewinnt an Glanz durch die Verbindung, und der Adel gewinnt alles andere."
 desc_steppe_voice: "Kennt die Grasländer und die Männer darauf und kann beides mobilisieren. Die leichte Kavallerie reitet weiter, und die Armee ist beständiger, weil sie diese hat."
 desc_tribune_of_the_commons: "Spricht für die Menschen, über die normalerweise nur gesprochen wird. Beschwerden erreichen das Kabinett, bevor sie die Straße erreichen, und das Reich ist ruhiger, als es eigentlich sein dürfte."
