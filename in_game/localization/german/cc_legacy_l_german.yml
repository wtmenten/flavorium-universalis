 # ============================================================
 # LEGACY EVENTS (cc_legacy namespace)
 # ============================================================

 cc_legacy.1.title: "Ein Mentor plant seine Nachfolge"
 cc_legacy.1.desc: "[cc_legacy_elder.GetName] dient diesem Hof seit mehr als einem Jahrzehnt, und die Jahre beginnen sich zu bemerkbar zu machen. Ein Minister von ihrem Format tritt nicht einfach in den Ruhestand – sie hinterlassen eine Lücke in der Institution, und diese Lücke muss entweder bewusst gefüllt oder dem Zufall überlassen werden. [cc_legacy_elder.GetName] hat um eine Audienz gebeten. Sie möchten über die Zukunft sprechen."
 cc_legacy.1.a: "Lassen Sie [cc_legacy_elder.GetName] die Früchte seiner Erfahrung an einen jüngeren Minister weitergeben."
 cc_legacy.1.a.tt: "Der ältere Minister überträgt sein primäres Kabinettsmerkmal auf einen jungen Höfling, erhält das Merkmal 'Zurückgetretener Legend' und zieht sich aus den anspruchsvollsten Aufgaben zurück. Die numerische Tracking-Variable wird für den Zeitpunkt ihres eventualen Todes gesetzt."
 cc_legacy.1.b: "Ermutigen Sie [cc_legacy_elder.GetName], ihre verbleibenden Jahre in die Ausbildung eines Nachfolgers zu investieren."
 cc_legacy.1.b.tt: "Der ältere Minister bildet persönlich einen jungen Höfling aus und gewährt ihm einen bedeutenden Fertigkeitsbonus. Der Ältere behält sein Merkmal, investiert jedoch in die nächste Generation."
 cc_legacy.1.c: "Dies ist nicht der richtige Moment. Lassen wir [cc_legacy_elder.GetName] so weitermachen, wie sie es tun."

 cc_legacy.3.title: "Das letzte Geschenk des Ältesten"
 cc_legacy.3.desc: "[cc_legacy_minister.GetName] ist verstorben. In den letzten Lebensjahren lebte die Person als „Ruhende Legende“ – eine lebende Institution, eher ein Mentor als ein aktiver Minister – und diese Zeit wurde nicht verschwendet. Das Erbe von allem, was sie aufgebaut hat, wurde treuhänderisch hinterlassen. Die Frage ist nun, wie wir dieses Erbe antreten."
 cc_legacy.3.a: "Das Erbe von [cc_legacy_minister.GetName] akzeptieren – lassen wir es zu einem dauerhaften Merkmal dieses Reiches werden."
 cc_legacy.3.a.tt: "Verleiht einen permanenten Landesmodifikator, der auf der ehemaligen Kabinettspezialisierung des Ältesten basiert. Keine Kosten."
 cc_legacy.3.b: "Das Vermächtnis mit einer Zeremonie und einem angemessenen Stiftungsfonds weihen."
 cc_legacy.3.b.tt: "Kostet 15× monatliches Einkommen. Wendet eine verbesserte, geweihte Version des Legacy-Modifikators an — dauerhaft."

 cc_legacy.2.title: "Eine Legende geht"
 cc_legacy.2.desc: "[cc_legacy_minister.GetName] war mehr als nur ein Minister. Der Hof, dem sie dienten, die Institutionen, die sie prägten, die Entscheidungen, die sie beeinflussten – all dies wird sie überdauern. Was wir aus ihrem Andenken machen, wird entscheiden, ob die Legende zu einer lebendigen Kraft in diesem Reich wird oder lediglich ein Name auf einer Gedenktafel bleibt."
 cc_legacy.2.a: "Errichten Sie ein dauerhaftes Denkmal – lassen Sie die Legende Teil der permanenten Identität des Reiches werden."
 cc_legacy.2.a.tt: "Verleiht einen kleinen, aber permanenten Landesmodifikator zu Ehren dieses legendären Ministers."
 cc_legacy.2.b: "Das Vermächtnis mit einer angemessenen Zeremonie und einem Stiftungsfonds weihen."
 cc_legacy.2.b.tt: "Kostet 25× monatliches Einkommen. Wendet eine verbesserte, geweihte Version des Legacy-Modifikators an — dauerhaft."
