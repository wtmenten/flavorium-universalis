l_german:

 ########################
 # AGE-SPECIFIC TRAIT NAMES & DESCRIPTIONS
 ########################

 eastern_pragmatist: "Östlicher Pragmatiker"
 desc_eastern_pragmatist: "Geprägt von den intellektuellen Traditionen des Ostens wendet dieser Berater eine jahrhundertealte Kultur der gelehrten Verwaltung auf die Herausforderungen der Zeit an. Institutionen verbreiten sich effizienter, und Entwicklung erfolgt zu moderaten Kosten."
 eastern_pragmatist_die_desc: "Eine besonnene Stimme ist aus dem Hof verschwunden. Die Gelehrsamkeit und administrative Disziplin, die sie vertraten, hinterlassen ein stilleres Erbe als viele andere – und vielleicht ein dauerhafteres."

 sufi_scholar: "Sufi-Gelehrter"
 desc_sufi_scholar: "Tief verwurzelt in den mystischen und rationalen Traditionen islamischer Gelehrsamkeit, schlägt dieser Berater die Brücke zwischen Doktrin und Forschung. Die Missionsarbeit wird präziser, Häretiker werden geduldiger angehört und die Alphabetisierung nimmt stillschweigend zu."
 sufi_scholar_die_desc: "Die Gelehrtenkreise, die dieser Minister am Leben erhalten hat, werden nicht leicht zu ersetzen sein."

 cautious_merchant: "Vorsichtiger Kaufmann"
 desc_cautious_merchant: "Dieser Berater ist im Herzen ein Kaufmann und betrachtet koloniale Wagnisse mit Skepsis – die Renditen sind zu langsam, die Risiken zu groß. Der Handel floriert unter seiner Führung, aber Expeditionen verlieren einen stillen Fürsprecher."
 cautious_merchant_die_desc: "Die von dieser sorgfältigen Hand geführten Bücher überdauern die Hand selbst um eine Generation."

 reformist_theologian: "Reformistischer Theologe"
 desc_reformist_theologian: "Die religiösen Umwälzungen dieser Zeit haben über die Christenheit hinausgewirkt. Dieser Berater, geformt durch Strömungen der doktrinären Erneuerung innerhalb der eigenen Tradition, treibt die Konversion mit dem Eifer eines Reformers und der Präzision eines Gelehrten voran."
 reformist_theologian_die_desc: "Die internen Debatten, die dieser Minister ausgelöst hat, werden auch ohne ihn weitergehen."

 orthodox_defender: "Verteidiger des Glaubens"
 desc_orthodox_defender: "In einer Welt wechselnder Doktrinen hält dieser Berater an den etablierten Lehren fest. Häresie darf nicht toleriert werden — der richtige Glaube muss verteidigt werden, was auch immer die Zeit fordert."
 orthodox_defender_die_desc: "Die Traditionen, welche dieser Minister verteidigte, bleiben bestehen – zumindest für den Moment."

 crown_theologian: "Kronentheologe"
 desc_crown_theologian: "Dieser Berater navigiert auf dem schmalen Grat zwischen der Kirche und der Krone. Indem er den Klerus zufriedenstellt und die Prärogativen des Königs unangetastet lässt, bewahrt er ein Gleichgewicht, das keine Seite voll unterstützt – mit dem beide jedoch leben können."
 crown_theologian_die_desc: "Das sorgsame Gleichgewicht zwischen Hof und Klerus wird nun, da dieser Minister weg ist, auf eine harte Probe gestellt werden."

 renaissance_humanist: "Renaissance-Humanist"
 desc_renaissance_humanist: "Geprägt durch das Aufblühen von Kunst und Gelehrsamkeit, setzt sich dieser Berater für den freien Austausch von Ideen ein. Er beschleunigt die Verbreitung neuer Institutionen und fördert die Alphabetisierung, wo immer er dient."
 renaissance_humanist_die_desc: "[CHARACTER.GetName] ist gestorben. Die Bibliotheken, die [CHARACTER.GetSheHe] gründete, und die Gelehrten, die [CHARACTER.GetSheHe] förderte, werden [CHARACTER.GetHerHis] Vermächtnis weitertragen."

 age_of_discovery_pioneer: "Pionier der Entdeckung"
 desc_age_of_discovery_pioneer: "Geschmiedet im Zeitalter der Entdeckungen, brennt dieser Berater vor Entdeckergeist. Die Expeditionsgeschwindigkeit erhöht sich, und koloniale Unternehmungen ziehen mehr willige Seelen an."
 age_of_discovery_pioneer_die_desc: "[CHARACTER.GetName] ist gegangen, und die unkartierten Küsten, die [CHARACTER.GetSheHe] kartierte, bleiben als Zeugnis einer rastlosen Seele zurück."

 age_of_discovery_skeptic: "Skeptiker der Meere"
 desc_age_of_discovery_skeptic: "Dieser Berater rät zur Vorsicht – die Seewege sind tückisch, die Erträge ungewiss. Expeditionen unter seinem Einfluss bewegen sich zögerlicher."
 age_of_discovery_skeptic_die_desc: "[CHARACTER.GetName] ist verschieden. Vielleicht war es richtig, dass [CHARACTER.GetSheHe] vorsichtig war."

 reformation_preacher: "Reformationsprediger"
 desc_reformation_preacher: "Geprägt durch die großen religiösen Umbrüche der Zeit, predigt dieser Berater Toleranz als Weg zum Frieden. Häretiker finden am Hofe ein offeneres Ohr, und die Bemühungen um die Konversion werden intensiviert."
 reformation_preacher_die_desc: "[CHARACTER.GetName] ist gestorben, und die gemäßigten Stimmen, für die [CHARACTER.GetSheHe] eintrat, verstummen ein wenig."

 reformation_inquisitor: "Reformationsinkvisitor"
 desc_reformation_inquisitor: "Als Produkt der Konfessionskriege betrachtet dieser Berater Glaubensunterschiede als existenzielle Bedrohung. Die Toleranz gegenüber Häretikern und Heiden leidet unter seinem Rat."
 reformation_inquisitor_die_desc: "[CHARACTER.GetName] ist gegangen. Wenige betrauerten [CHARACTER.GetHerHim]; noch weniger werden das Ende von [CHARACTER.GetHerHis] starren Gewissheiten betrauern."

 absolute_administrator: "Absoluter Administrator"
 desc_absolute_administrator: "Ausgebildet in der Doktrin der souveränen Autorität, verschärft dieser Berater den Griff der Krone auf lokale Angelegenheiten. Kontrolle verbreitet sich leichter, aber die Stände fühlen sich durch die Zentralisierung eingeengt."
 absolute_administrator_die_desc: "[CHARACTER.GetName] ist gestorben. Der Kontrollapparat, den [CHARACTER.GetSheHe] aufbaute, wird [CHARACTER.GetHerHim] überdauern."

 noble_patron: "Adelspatron"
 desc_noble_patron: "Dieser Berater weiß, dass das Wohlwollen des Adels mehr wert ist als bloßes Gold. Der Adel gedeiht unter seiner sorgsamen Führung, obwohl die Bereicherung der großen Häuser stillschweigend unterbunden wird."
 noble_patron_die_desc: "[CHARACTER.GetName] ist gegangen, und der Adel, den [CHARACTER.GetSheHe] förderte, wird einige Zeit brauchen, um einen neuen Gönner zu finden."

 parliamentarian: "Parlamentarier"
 desc_parliamentarian: "Als geschickter Akteur in den Hallen des Parlaments baut dieser Berater breite Koalitionen auf und gewinnt Stimmen von zögerlichen Mitgliedern – obwohl der Entzug adeliger Privilegien kostspieliger wird, wenn diese den Einfluss behalten."
 parliamentarian_die_desc: "[CHARACTER.GetName] ist gestorben. Wer auch immer [CHARACTER.GetHerHis] Platz einnimmt, wird Schwierigkeiten haben, mit [CHARACTER.GetHerHis] Meisterschaft in der Kammer mitzuhalten."

 privilege_reformer: "Privilegierter Reformer"
 desc_privilege_reformer: "Dieser Berater glaubt, dass die souveräne Autorität nicht durch veraltete Standesprivilegien behindert werden darf. Der Entzug von Privilegien wird kostengünstiger, obwohl der Adel jeden Schritt missbilligt."
 privilege_reformer_die_desc: "[CHARACTER.GetName] ist gegangen, und die Stände atmen erleichtert auf."

 revolutionary_agitator: "Revolutionärer Agitator"
 desc_revolutionary_agitator: "Mitgerissen von den Strömungen der Revolution ist die Rhetorik dieses Beraters ebenso entflammend wie inspirierend. Rebellische Fraktionen finden fruchtbaren Boden, wo immer [CHARACTER.GetSheHe] ein Amt bekleidet."
 revolutionary_agitator_die_desc: "[CHARACTER.GetName] ist gestorben. Ob die Feuer, die [CHARACTER.GetSheHe] entfachte, erlöschen oder sich ausbreiten werden, bleibt abzuwarten."

 counterrevolutionary: "Konterrevolutionär"
 desc_counterrevolutionary: "Dieser Berater sieht eine Revolution als eine Katastrophe an, die um jeden Preis verhindert werden muss – einschließlich der Zufriedenstellung eben jener Stände, deren Kooperation die Krone benötigt. Der Entzug von Privilegien wird schwieriger, da er reaktionäre Interessen festigt."
 counterrevolutionary_die_desc: "[CHARACTER.GetName] ist verstorben. Die Ordnung, an deren Erhalt [CHARACTER.GetSheHe] arbeitete, wird [CHARACTER.GetHerHim] möglicherweise nicht lange überdauern."

 privilege_champion: "Privilegierter Champion"
 desc_privilege_champion: "In einem Zeitalter der Revolution kämpft dieser Berater darum, die Lasten der Krone zu verringern, indem er die Privilegien der Stände beschneidet. Ein Widerruf ist kostengünstiger, aber der Wohlstand leidet, da das institutionelle Vertrauen wankt."
 privilege_champion_die_desc: "[CHARACTER.GetName] ist gegangen, und die Privilegien, die [CHARACTER.GetSheHe] abzuschaffen suchte, könnten neue Verteidiger finden."

 ########################
 # COUNTRY MODIFIERS
 ########################

 cc_cabinet_ministerial_investment: "Ministerielle Investition"
 cc_cabinet_ministerial_investment_desc: "Ein Kabinettsmitglied hat öffentliche Gelder in dauerhafte Verbesserungen des diplomatischen Status und des nationalen Wohlstands gelenkt."

 cc_cabinet_revoke_difficulty: "Standeswiderstand"
 cc_cabinet_revoke_difficulty_desc: "Gestärkte Stände erschweren es der Krone, ihre Privilegien zu entziehen."

 cc_cabinet_parliamentary_guidance: "Parlamentarische Führung"
 cc_cabinet_parliamentary_guidance_desc: "Eine erfahrene parlamentarische Hand im Kabinett verbessert den Einfluss der Krone auf die Kammer."

 cc_cabinet_diplomatic_influence: "Diplomatischer Einfluss"
 cc_cabinet_diplomatic_influence_desc: "Aktive Diplomatie durch ein Kabinettsmitglied hat den Antagonismus unserer Nachbarn uns gegenüber verringert."

 cc_cabinet_provincial_flourishing: "Provinzielles Aufblühen"
 cc_cabinet_provincial_flourishing_desc: "Die Aufmerksamkeit eines Ministers hat den Wohlstand dieser Provinz revitalisiert."

 cc_cabinet_pop_conversion: "Ministerieller Konvertierungsschub"
 cc_cabinet_pop_conversion_desc: "Ein Kabinettsmitglied fördert aktiv die religiöse Konversion im gesamten Reich."

 cc_cabinet_cultural_outreach: "Kulturelle Reichweite"
 cc_cabinet_cultural_outreach_desc: "Ein Minister fördert den kulturellen Austausch und die Alphabetisierung in dieser Provinz."

 ########################
 # TRAIT EVENT LOCALIZATION (cc_traits namespace)
 ########################

 # cc_traits.1 — Integration Trait Grant
 cc_traits.1.title: "Beginn der Integrationsarbeit"
 cc_traits.1.desc: "Unser Minister [minister.GetName], der mit der Überwachung der Integrationsbemühungen betraut wurde, hat seinen Rhythmus gefunden. Sein Ansatz spiegelt seine Fähigkeiten wider und wird einen bleibenden Eindruck darauf hinterlassen, wie die Arbeit geführt wird."
 cc_traits.1.a: "Lassen Sie [minister.GetName] als [ShowTraitName('iron_integrator')] weitermachen."
 cc_traits.1.b: "Lassen Sie [minister.GetName] als [ShowTraitName('master_integrator')] weitermachen."
 cc_traits.1.c: "Lassen Sie [minister.GetName] als [ShowTraitName('able_integrator')] weitermachen."
 cc_traits.1.d: "Lassen Sie [minister.GetName] als [ShowTraitName('fumbling_integrator')] weitermachen."
 cc_traits.1.e: "Überdenken wir dies"

 # ========================
 # NEW AGE TRAITS (cc_traits.30-39)
 # ========================

 dogmatic_zealot: "Dogmatischer Eiferer"
 desc_dogmatic_zealot: "Die Feuer religiöser Umbrüche haben den Geist dieses Ministers nicht geöffnet — sie haben ihn versiegelt. Als unnachgiebiger Verteidiger der orthodoxen Doktrin hat er unseren Hof weniger tolerant gegenüber Dissens und abhängiger vom Wohlwollen des Klerus gemacht."
 dogmatic_zealot_die_desc: "[CHARACTER.GetName] ist verschieden. Wenige werden die starren Gewissheiten vermissen, die [CHARACTER.GetSheHe] durchsetzte – obwohl der Klerus sie vielleicht vermisst."

 empiricist_counselor: "Empiristischer Berater"
 desc_empiricist_counselor: "Geprägt durch neue Methoden der Beobachtung und des Experiments, wendet dieser Minister einen strengen empirischen Ansatz in der Regierungsführung an. Unter seinem Einfluss beschleunigt sich die Forschung und die Verbreitung einer alphabetisierten Verwaltung weitet sich stillschweigend aus."
 empiricist_counselor_die_desc: "[CHARACTER.GetName] ist gestorben. Die Gewohnheit der sorgfältigen Untersuchung, die [CHARACTER.GetSheHe] vorlebte, wird länger fortbestehen als jede einzelne Entdeckung, die [CHARACTER.GetSheHe] machte."

 civic_chancellor: "Ziviler Kanzler"
 desc_civic_chancellor: "Wo andere Minister Städte sehen, sieht dieser Berater Verwaltungssysteme, die darauf warten, optimiert zu werden. Ihre Meisterschaft in der städtischen Reform hat die Baukosten gesenkt und das Kabinett zu einem effizienteren Instrument des königlichen Willens gemacht."
 civic_chancellor_die_desc: "[CHARACTER.GetName] ist verschieden. Das bürgerliche Getriebe, das [CHARACTER.GetSheHe] abstimmte, wird weiterlaufen – aber Maschinen brauchen Mechaniker."

 chief_cartographer: "Hauptkartograph"
 desc_chief_cartographer: "Leere Stellen auf einer Karte sind keine Unkenntnis – sie sind eine Chance. Dieser Minister hat unsere explorativen Ambitionen in ein systematisches Unternehmen verwandelt, Expeditionen beschleunigt und neue Siedler an die Grenze gelockt."
 chief_cartographer_die_desc: "[CHARACTER.GetName] ist gestorben. Die Karten, die [CHARACTER.GetSheHe] in Auftrag gab und korrigierte, werden unsere Schiffe noch lange führen, nachdem die Hand des Kartografen verstummt ist."

 trade_consortium_minister: "Minister des Handelskonsortiums"
 desc_trade_consortium_minister: "Der Handel ist das Nervensystem des Imperiums, und dieser Minister versteht jeden Knotenpunkt im Netzwerk. Handelszentren florieren unter seiner Führung, und die diplomatische Kapazität wächst mit jeder neuen Handelsbeziehung, die er pflegt."
 trade_consortium_minister_die_desc: "[CHARACTER.GetName] ist verstorben. Die Handelsbeziehungen, die [CHARACTER.GetSheHe] pflegte, werden fortbestehen – Kaufleute sind dem Profit treu, nicht den Ministern."

 peace_commissioner: "Friedensbeauftragter"
 peace_commissioner_die_desc: "[CHARACTER.GetName] ist gestorben. Die fragilen Toleranzen, die [CHARACTER.GetSheHe] aufrechterhielt, werden nun auf die Probe gestellt. Hoffen wir, dass der Präzedenzfall Bestand hat."

 theological_statesman: "Theologischer Staatsmann"
 desc_theological_statesman: "Für diesen Minister sind Glaube und Regierungsführung keine getrennten Bereiche – sie sind dasselbe Projekt. Indem sie klerikale Interessen mit der legislativen Agenda der Krone in Einklang gebracht haben, machten sie das Parlament gefügiger und den Klerus stärker am Erfolg des Reiches beteiligt."
 theological_statesman_die_desc: "[CHARACTER.GetName] ist gestorben. Das sorgsame Gleichgewicht, das [CHARACTER.GetSheHe] zwischen Kirche und Parlament aufrechterhielt, wird außergewöhnliches Geschick erfordern, um bewahrt zu werden."

 standing_army_advocate: "Befürworter eines stehenden Heeres"
 desc_standing_army_advocate: "Das Zeitalter der temporären Aufgebote ist vorbei – dieser Minister hat die Doktrin des stehenden Heeres zum dauerhaften Fundament unserer Militärmacht gemacht. Die Disziplin hat sich verbessert, die Kosten für Befestigungen sind gesunken und der Adel hat ein neues Argument für seine Unentbehrlichkeit gefunden."
 standing_army_advocate_die_desc: "[CHARACTER.GetName] ist gestorben. Die professionelle Militärkultur, die [CHARACTER.GetSheHe] förderte, wird [CHARACTER.GetHerHim] überdauern — stehende Heere entwickeln, wie alle Institutionen, ihre eigene Dynamik."

 tax_inspector_general: "Generalsteuerinspektor"
 desc_tax_inspector_general: "Keine Münze bleibt ungezählt und keine Ausnahme bleibt ungeprüft, solange dieser Minister sein Amt bekleidet. Die Hofausgaben sind gesunken, die Effizienz des Kabinetts ist gestiegen und die Schatzkammer hat gelernt, seine Audits zu fürchten."
 tax_inspector_general_die_desc: "[CHARACTER.GetName] ist verstorben. Die Bücher, die [CHARACTER.GetSheHe] in so tadelloser Ordnung hielt, werden die ersten Opfer eines weniger gewissenhaften Nachfolgers sein."

 national_reformer: "Nationaler Reformer"
 desc_national_reformer: "Im Zeitalter der Revolutionen hat dieser Minister einen Mittelweg gefunden: systematische Reformen durch parlamentarische Prozesse. Kostspielige Regierungsänderungen werden erschwinglicher, und die Unterstützungsbasis des Parlaments wächst dort, wo sie wirken."
 national_reformer_die_desc: "[CHARACTER.GetName] ist gestorben. Die Reformen, die [CHARACTER.GetSheHe] durch das Parlament brachte, sind dauerhaft — die Reformtradition, die [CHARACTER.GetSheHe] begründete, hingegen nicht."

 industrial_visionary: "Industrieller Visionär"
 desc_industrial_visionary: "Dieser Minister hat die Zukunft in einer Druckerpresse und einem Schmelzofen erblickt. Die Anwendung neuer mechanischer Methoden auf Bau und Produktion hat die Baukosten gesenkt und das Tempo beschleunigt, mit dem unser Reich wachsen kann."
 industrial_visionary_die_desc: "[CHARACTER.GetName] ist verstorben. Die Maschinen, die [CHARACTER.GetSheHe] in Auftrag gab, werden auch ohne [CHARACTER.GetHerHim] weiterlaufen – genau das war immer der Plan."

 # ========================
 # AGE TRAIT EVENTS (cc_traits.30-39)
 # ========================

 cc_traits.30.title: "Die Methode des Empirikers"
 cc_traits.30.desc: "[minister.GetName] hat mit den neuen Methoden der systematischen Untersuchung experimentiert – Beobachtung, Hypothese, Verifizierung. Die Ergebnisse wurden bemerkt. Wie sollen wir diesen methodischen Geist lenken?"
 cc_traits.30.a: "Ernenne [minister.GetName] zum [ShowTraitName('empiricist_counselor')] – lass die neuen Methoden unsere Regierungsführung leiten."
 cc_traits.30.b: "Fördern Sie die Nachforschungen von [minister.GetName] ohne formelle Ernennung."

 cc_traits.31.title: "Der urbane Reformer"
 cc_traits.31.desc: "[minister.GetName] hat viel Zeit in den Werkstätten und Ratssälen der Hauptstadt verbracht, Ineffizienzen katalogisiert und Verbesserungen vorgeschlagen. Die Bürgerschaft hat dies bemerkt. Wie sollen wir reagieren?"
 cc_traits.31.a: "Formalisiere die Rolle von [minister.GetName] als [ShowTraitName('civic_chancellor')] – lass sie systematisieren, was sie begonnen haben."
 cc_traits.31.b: "Unterstütze die Arbeit von [minister.GetName] ohne formelle Ernennung."

 cc_traits.32.title: "Der Auftrag des Kartografen"
 cc_traits.32.desc: "[minister.GetName] hat eng mit unseren Entdeckern und Navigatoren zusammengearbeitet und deren Beobachtungen in systematische Karten verwandelt. Die Arbeit ist beeindruckend. Wie sollen wir sie lenken?"
 cc_traits.32.a: "Bestellen Sie [minister.GetName] zu unserem [ShowTraitName('chief_cartographer')] – lassen Sie die Karten unsere Ambitionen leiten."
 cc_traits.32.b: "Lassen Sie [minister.GetName] ohne formelle Ernennung weitermachen — gewährt [ShowTraitName('age_of_discovery_skeptic')]."

 cc_traits.33.title: "Die große Reise des Kaufmanns"
 cc_traits.33.desc: "[minister.GetName] ist von einer umfassenden Untersuchung unserer Handelsrouten und Vasallenterritorien zurückgekehrt, voller Vorschläge zur Konsolidierung unserer kommerziellen Position. Die Kaufmannsgemeinschaft ist begeistert. Wie lautet unsere Antwort?"
 cc_traits.33.a: "Ernenne [minister.GetName] zum [ShowTraitName('trade_consortium_minister')] – lass den Handel zu einem diplomatischen Instrument werden."
 cc_traits.33.b: "Unterstütze die kommerzielle Arbeit von [minister.GetName] ohne formelle Erhebung."

 cc_traits.34.title: "Das Gambit des Friedensstifters"
 cc_traits.34.desc: "[minister.GetName] ist mit einem Vorschlag zur Verringerung religiöser Spannungen an unsere Nachbarn herangetreten – ein kalkuliertes Risiko in einer gespaltenen Zeit. Einige am Hof applaudieren der Initiative; andere sehen darin Schwäche. Wie reagieren wir?"
 cc_traits.34.a: "Unterstützen Sie die Friedensbemühungen von [minister.GetName] – ernennen Sie sie/ihn zu unserem [ShowTraitName('peace_commissioner')]."
 cc_traits.34.b: "Den Vorschlag ablehnen – Toleranz ist ein Zugeständnis an die Häresie – gewährt [ShowTraitName('dogmatic_zealot')]."
 cc_traits.34.c: "Lassen Sie [minister.GetName] stillschweigend weitermachen, ohne formelle Ernennung."

 cc_traits.35.title: "Der theologische Staatsmann"
 cc_traits.35.desc: "[minister.GetName] hat Brücken zwischen dem Klerus und der Parlamentskammer gebaut – ein heikles Projekt, das anscheinend funktioniert. Wie sollen wir diesen Erfolg formal anerkennen?"
 cc_traits.35.a: "[minister.GetName] zu unserem [ShowTraitName('theological_statesman')] ernennen – mögen Glaube und Staatsführung zu einem gemeinsamen Projekt werden."
 cc_traits.35.b: "Verleihen Sie [minister.GetName] den formalen Titel eines [ShowTraitName('crown_theologian')]."
 cc_traits.35.c: "Loben Sie [minister.GetName]s Arbeit ohne formale Erhebung."

 cc_traits.36.title: "Der Verfechter eines stehenden Heeres"
 cc_traits.36.desc: "[minister.GetName] hat Jahre damit verbracht, für den Übergang zu einem permanenten, professionellen Militär zu plädieren — und hat kürzlich einen umfassenden Vorschlag erarbeitet, wie dies zu erreichen ist. Der Adel ist skeptisch, hört aber zu. Wie sollen wir vorgehen?"
 cc_traits.36.a: "Unterstützen Sie den Vorschlag von [minister.GetName] – ernennen Sie sie/ihn zu unserem [ShowTraitName('standing_army_advocate')]."
 cc_traits.36.b: "Unterstütze das Konzept ohne formelle Ernennung."

 cc_traits.37.title: "Der Steuerinspektor"
 cc_traits.37.desc: "[minister.GetName] hat eine gründliche Prüfung der Kronenausgaben durchgeführt und eine ernüchternde Reihe von Empfehlungen vorgelegt. Der Hof ist beunruhigt, aber die Zahlen lügen nicht. Wie reagieren wir?"
 cc_traits.37.a: "Ernenne [minister.GetName] zum [ShowTraitName('tax_inspector_general')] – lass jede Münze gezählt werden."
 cc_traits.37.b: "Übernehmen Sie einige der Empfehlungen von [minister.GetName] ohne formelle Ernennung."

 cc_traits.38.title: "Der Nationalminister"
 cc_traits.38.desc: "[minister.GetName] hat ein umfassendes Reformprogramm für das parlamentarische System entwickelt – ein Vorschlag, der die Funktionsweise der Regierungsführung für Generationen verändern könnte. Die Kammer schaut genau hin."
 cc_traits.38.a: "Bestellen Sie [minister.GetName] zu unserem [ShowTraitName('national_reformer')] – lassen Sie das Parlament zu einem Instrument dauerhaften Wandels werden."
 cc_traits.38.b: "Übernehmen Sie Teile des Programms von [minister.GetName] ohne formelle Erhebung."

 cc_traits.39.title: "Der industrielle Visionär"
 cc_traits.39.desc: "[minister.GetName] ist mit leuchtenden Augen von einer Inspektion der Werkstätten der Hauptstadt zurückgekehrt. Neue Produktionsmethoden, neue Materialien, neue Möglichkeiten – und ein detaillierter Vorschlag, um diese in großem Maßstab einzuführen. Die Bürgerschaft ist fasziniert."
 cc_traits.39.a: "Bestellen Sie [minister.GetName] zu unserem [ShowTraitName('industrial_visionary')] – lassen Sie die neuen Methoden das Reich transformieren."
 cc_traits.39.b: "Unterstütze die Initiative ohne formelle Ernennung."

 # cc_traits.10 — Renaissance-era intellectual trait spawn (culturally branched)
 cc_traits.10.title: "Ein Gelehrter der Zeit"
 cc_traits.10.desc: "[minister.GetName] wurde von den großen intellektuellen Strömungen dieser Ära geprägt. Die Form, die das Lernen annimmt, mag je nach Tradition variieren, aber das Potenzial, es in den Dienst des Staates zu stellen, ist dasselbe."
 cc_traits.10.a: "Eine willkommene Entwicklung – lassen wir die neue Gelehrsamkeit ihre Arbeit leiten — gewährt [ShowTraitName('renaissance_humanist')]."
 cc_traits.10.b: "Wählen Sie einen Pfad praktischer Weisheit und Staatskunst — gewähren Sie [ShowTraitName('eastern_pragmatist')]."
 cc_traits.10.c: "Der Weg der Gelehrsamkeit und Kontemplation passt zu ihnen — gewähre [ShowTraitName('sufi_scholar')]."
 cc_traits.10.d: "Ermutigen Sie [minister.GetName], weiterhin zu beobachten – das Reich könnte im Laufe der Zeit davon profitieren."

 # cc_traits.11 — Discovery Pioneer / Skeptic / Cautious Merchant
 cc_traits.11.title: "Neue Horizonte erschließen"
 cc_traits.11.desc: "Das Zeitalter der Entdeckungen hat Spuren bei [minister.GetName] hinterlassen. Wie sollen wir [minister.GetHerHis] Beziehung zum Meer lenken?"
 cc_traits.11.a: "Fördern Sie kühne Erkundungen – gewähren Sie [ShowTraitName('age_of_discovery_pioneer')]."
 cc_traits.11.b: "Raten Sie zu Vorsicht und Zurückhaltung — gewährt [ShowTraitName('age_of_discovery_skeptic')]."
 cc_traits.11.c: "Lenke ihre Energie auf den Handel, nicht auf ferne Küsten – gewähre [ShowTraitName('cautious_merchant')]."
 cc_traits.11.d: "Sende ihn in die Werften!"

 # cc_traits.12 — Reformation / Religious Upheaval traits (culturally branched)
 cc_traits.12.title: "Stimmen der Reform"
 cc_traits.12.desc: "Das Feuer religiösen Wandels hat den Glauben von [minister.GetName] geprüft. Ob diese Prüfung [minister.GetHerHis] Geist geöffnet oder [minister.GetHerHis] Überzeugungen gestählt hat, liegt in unserer Führung."
 cc_traits.12.a: "Fördern Sie Toleranz und Dialog — gewähren Sie [ShowTraitName('reformation_preacher')]."
 cc_traits.12.b: "Den Glauben gegen Abweichungen verteidigen — verleiht [ShowTraitName('reformation_inquisitor')]."
 cc_traits.12.c: "Fördern Sie die doktrinäre Erneuerung innerhalb unserer Tradition – gewähren Sie [ShowTraitName('reformist_theologian')]."
 cc_traits.12.d: "Die etablierten Lehren müssen um jeden Preis verteidigt werden — gewährt [ShowTraitName('orthodox_defender')]."
 cc_traits.12.e: "[minister.GetName] weigert sich, sich damit zu befassen — gewähre [ShowTraitName('dogmatic_zealot')]."

 # cc_traits.13 — Absolutism traits
 cc_traits.13.title: "Regierungsführung im Zeitalter der Könige"
 cc_traits.13.desc: "[minister.GetName] wurde durch die Anforderungen eines Zeitalters geprägt, in dem die souveräne Autorität konsolidiert werden muss. Wie [minister.GetSheHe] diese Überzeugung in die Tat umsetzt, wird [minister.GetHerHis] Vermächtnis definieren."
 cc_traits.13.a: "Betonen Sie die zentrale Kontrolle — gewähren Sie [ShowTraitName('absolute_administrator')]."
 cc_traits.13.b: "Adliges Wohlwollen fördern — gewährt [ShowTraitName('noble_patron')]."
 cc_traits.13.c: "Über das Parlament arbeiten — gewähre [ShowTraitName('parliamentarian')]."
 cc_traits.13.d: "Reformieren Sie die Privilegienstruktur — gewähren Sie [ShowTraitName('privilege_reformer')]."
 cc_traits.13.e: "Lasst den Theologen der Krone zwischen Kirche und Staat vermitteln – gewährt [ShowTraitName('crown_theologian')]."

 # cc_traits.14 — Revolutions traits
 cc_traits.14.title: "Der Geist der Revolution"
 cc_traits.14.desc: "Das revolutionäre Zeitalter hat [minister.GetName] erreicht. Ob [minister.GetSheHe] auf seiner Welle reitet, ihr entgegensteht oder versucht, sie für die Krone zu nutzen, wird prägen, was als Nächstes kommt."
 cc_traits.14.a: "Lasst den revolutionären Geist freien Lauf – gewährt [ShowTraitName('revolutionary_agitator')]."
 cc_traits.14.b: "Stehe fest für Ordnung und Hierarchie — gewährt [ShowTraitName('counterrevolutionary')]."
 cc_traits.14.c: "Nutzen wir den Moment, um den Ständen alte Privilegien zu entziehen — gewähre [ShowTraitName('privilege_champion')]."

 # cc_traits.20 — Ruler Teaches
 cc_traits.20.title: "Der [Root.GetRulerTitle] bietet Weisheit an"
 cc_traits.20.desc: "Unser Herrscher hat das Potenzial von [student.GetName] bemerkt. Mit der richtigen Führung könnte [student.GetSheHe] sich zu einem Minister von wahrer Bedeutung entwickeln. Welches Wissen soll die Krone teilen?"
 cc_traits.20.a: "[student.GetName] die Disziplinen des Krieges und des Kommandos lehren — gewährt [ShowTraitName('tactical_advisor')]."
 cc_traits.20.b: "Teilen Sie die Künste des Lernens und der Gesetzgebung – gewähren Sie [ShowTraitName('learned_counselor')]."
 cc_traits.20.c: "Vermittle die Weisheit von Loyalität und Diplomatie — gewähre [ShowTraitName('loyal_steward')]."
 cc_traits.20.d: "Ein anderes Mal."

 # cc_traits.21 — Peer Learning
 cc_traits.21.title: "Ein eifriger junger Minister"
 cc_traits.21.a: "Fördern Sie wissenschaftliche Studien und das Lernen – gewähren Sie [ShowTraitName('learned_counselor')]."
 cc_traits.21.b: "Leite [learner.GetHerHim] zur Militärdoktrin an — gewährt [ShowTraitName('tactical_advisor')]."
 cc_traits.21.c: "Leite [learner.GetHerHim] in Diplomatie und Staatskunst an — gewähre [ShowTraitName('loyal_steward')]."

 ########################
 # CABINET EVENT LOCALIZATION (cc_cabinet namespace)
 ########################

 # cc_cabinet.1 — The Minister Seeks Counsel
 cc_cabinet.1.title: "Der Minister sucht Rat"
 cc_cabinet.1.desc: "[minister.GetName] hat um eine Audienz gebeten. Der Rat des Ministers war stets fundiert, und vielleicht würde ein Wort der Ermutigung – oder eine Aufgabe – ihm guttun. Was sollen wir anbieten?"
 cc_cabinet.1.a: "Erkenne [minister.GetHerHis] wissenschaftliche Arbeit an — gewähre [ShowTraitName('learned_counselor')]."
 cc_cabinet.1.b: "Erkenne [minister.GetHerHis] Dienste für das Reich an – gewähre [ShowTraitName('loyal_steward')]."
 cc_cabinet.1.c: "Erkenne [minister.GetHerHis] militärisches Geschick an — gewähre [ShowTraitName('tactical_advisor')]."
 cc_cabinet.1.d: "Sende sie zurück zu ihren Pflichten."

 # cc_cabinet.2 — A Request for Funds
 cc_cabinet.2.title: "Ein Antrag auf Mittel"
 cc_cabinet.2.a: "Gewähre es. Lass sie einfach damit weitermachen."
 cc_cabinet.2.b: "Gewähre es, mit einem Rechnungsprüfer über die Konten."

 # cc_cabinet.3 — Funds follow-up
 cc_cabinet.3.title: "Die Abrechnungen treffen ein"

 # cc_cabinet.4 — Parliamentary Affairs (Age of Absolutism)
 cc_cabinet.4.title: "Der Minister berät in parlamentarischen Angelegenheiten"
 cc_cabinet.4.desc: "[minister.GetName] hat viel Zeit damit verbracht, die Arbeitsweise des Parlaments zu studieren, und glaubt, dass es eine Gelegenheit gibt, die Hand der Krone innerhalb der Kammer zu stärken. Welchen Weg sollen wir einschlagen?"
 cc_cabinet.4.a: "Aktiver in der Kammer arbeiten."
 cc_cabinet.4.b: "[minister.GetName] sollte dies persönlich verfolgen — gewähre [ShowTraitName('parliamentarian')]."
 cc_cabinet.4.c: "Lasst sie es handhaben, wie sie es für richtig halten."

 # cc_cabinet.10 — Courting the Estates
 cc_cabinet.10.title: "Werben um die Stände"
 cc_cabinet.10.a: "Bevorzuge den Adel gegenüber den Kaufleuten."
 cc_cabinet.10.b: "Bevorzuge die Kaufleute gegenüber dem Adel."
 cc_cabinet.10.c: "Verbreite weitreichend Wohlwollen – auf Kosten der Schatzkammer."
 cc_cabinet.10.d: "Überlassen Sie die Stände ihrem eigenen Belieben."

 # cc_cabinet.11 — Estate Grievances
 cc_cabinet.11.title: "Standesbeschwerden"
 cc_cabinet.11.desc: "[minister.GetName] berichtet, dass die Stände Beschwerden haben, die zu eitern beginnen. Wenn sie unbeachtet bleiben, könnte ihre Unzufriedenheit zu einem Problem werden. Was sollen wir tun?"
 cc_cabinet.11.a: "Gib Gold aus und glätte die Wogen."
 cc_cabinet.11.b: "Ignoriere die Beschwerden — wir sind niemandem Rechenschaft schuldig."

 # cc_cabinet.12 — Revolutionary Sentiments
 cc_cabinet.12.title: "Revolutionäre Stimmung am Hofe"
 cc_cabinet.12.desc: "[minister.GetName] ist aus den Provinzen zurückgekehrt und berichtet von revolutionären Stimmungen im Volk. Das Zeitalter verlangt nach einer Antwort. Werden wir auf der Welle reiten oder uns ihr entgegenstellen?"
 cc_cabinet.12.a: "Setzen Sie auf die Energie des Wandels — gewähren Sie [ShowTraitName('revolutionary_agitator')]."
 cc_cabinet.12.b: "Unterdrücke diese gefährlichen Ideen."
 cc_cabinet.12.c: "Es ist nicht unsere Angelegenheit."

 # cc_cabinet.13 — Minister's Ambitions (Age of Absolutism)
 cc_cabinet.13.title: "Die Ambitionen des Ministers"
 cc_cabinet.13.desc: "[minister.GetName] ist in diesem Zeitalter der Konsolidierung ehrgeizig geworden. Sie haben der Krone zwei Wege aufgezeigt – einen zur Reform, einen zu einer strengeren Kontrolle. Wir müssen uns entscheiden."
 cc_cabinet.13.a: "Unterstütze das Bestreben, die Privilegien der Stände zu reformieren — gewähre [ShowTraitName('privilege_reformer')]."
 cc_cabinet.13.b: "Kontrolle zentralisieren – die Stände werden sich anpassen – gewähre [ShowTraitName('absolute_administrator')]."
 cc_cabinet.13.c: "Weder noch. Beibehalten des aktuellen Kurses."

 # cc_cabinet.20 — Diplomatic Overtures
 cc_cabinet.20.title: "Diplomatische Annäherungen"
 cc_cabinet.20.desc: "[minister.GetName] hat Verbindungen zu [neighbor_country.GetName] gepflegt. Hier ergibt sich eine Gelegenheit – sollen wir sie nutzen, um Wohlwollen zu erzeugen oder um stillschweigend die Spannungen zu reduzieren, die auf unserem Ruf lasten?"
 cc_cabinet.20.a: "Formalisiere unsere Freundschaft mit [neighbor_country.GetName]."
 cc_cabinet.20.b: "Rechtfertige aggressive Maßnahmen."
 cc_cabinet.20.c: "Lassen Sie die Angelegenheit ruhen."

 # cc_cabinet.21 — Border Tensions
 cc_cabinet.21.title: "Grenzspannungen"
 cc_cabinet.21.desc: "[minister.GetName] berichtet von schwelenden Spannungen an der Grenze zu [neighbor_country.GetName]. Dies könnte eine Gelegenheit sein, Dominanz zu etablieren — oder eine Krise, die diskret entschärft werden muss."
 cc_cabinet.21.a: "Nutzen wir die Spannung, um uns durchzusetzen."
 cc_cabinet.21.b: "Entsende [minister.GetName], um die Angelegenheit diskret zu entschärfen."

 # cc_cabinet.22 — Overseas Contacts
 cc_cabinet.22.title: "Übersee-Kontakte"
 cc_cabinet.22.desc: "Das Zeitalter der Entdeckungen hat Kontaktwege eröffnet, die noch vor einer Generation unmöglich erschienen wären. [minister.GetName] steht im Zentrum mehrerer solcher Beziehungen. Wie sollen wir diese fördern?"
 cc_cabinet.22.a: "Lassen Sie [minister.GetName] vorangehen — Exploration ist die Zukunft — gewährt [ShowTraitName('age_of_discovery_pioneer')]."
 cc_cabinet.22.b: "Nutzen wir diese Kontakte, um unsere diplomatische Position zu verbessern."
 cc_cabinet.22.c: "Konzentriert euch auf bestehende Prioritäten."

 # cc_cabinet.23 — Religious Tensions Abroad
 cc_cabinet.23.title: "Religiöse Spannungen im Ausland"
 cc_cabinet.23.desc: "Die Reformation hat den Glauben unserer Nachbarn ebenso gespalten wie unseren eigenen. [minister.GetName] hat die Gelegenheit, die religiösen Spaltungen von [neighbor_country.GetName] zu unserem Vorteil zu nutzen – oder eine Hand über den Graben hinweg auszustrecken."
 cc_cabinet.23.a: "Gemeinsame Grundlagen mit [neighbor_country.GetName] suchen."
 cc_cabinet.23.b: "Nutzen wir die Spannungen zu unserem Vorteil."
 cc_cabinet.23.c: "Dies ist nicht unsere Sorge."

 # cc_cabinet.30 — Provincial Investment
 cc_cabinet.30.title: "Provinzinvestition"
 cc_cabinet.30.desc: "[minister.GetName]'s Arbeit in den Provinzen hat die Aufmerksamkeit lokaler Honoratioren erregt. Mit einer bescheidenen Investition könnte die Krone die Entwicklung beschleunigen — oder die Energie in dauerhaften Wohlstand lenken."
 cc_cabinet.30.a: "Investiere in die direkte Entwicklung."
 cc_cabinet.30.b: "Fördern Sie langfristiges Gedeihen."
 cc_cabinet.30.c: "Überlassen Sie [minister.GetName] [minister.GetHerHis] eigenen Weg."

 # cc_cabinet.31 — Cultural Affairs
 cc_cabinet.31.title: "Kulturelle Angelegenheiten"
 cc_cabinet.31.desc: "[minister.GetName] stand in Kontakt mit lokalen Gemeinschaften in [target_province.GetName]. Hier ergibt sich eine Gelegenheit – entweder um den kulturellen Austausch und die Alphabetisierung zu fördern oder um die religiöse Konversion zu beschleunigen."
 cc_cabinet.31.a: "Fördern Sie die kulturelle Integration und das Lernen."
 cc_cabinet.31.b: "Konzentriert euch auf die Konvertierungsbemühungen."
 cc_cabinet.31.c: "Überlassen Sie die Provinz ihren eigenen Angelegenheiten."

 # cc_cabinet.32 — Confessional Province Work
 cc_cabinet.32.title: "Ein Minister des Glaubens"
 cc_cabinet.32.desc: "Die Reformation hat jede Provinz in ein umkämpftes Feld des Glaubens verwandelt. [minister.GetName] hat die Wahl – und wir ebenfalls. Sollen wir das Verständnis oder die Orthodoxie verfolgen?"
 cc_cabinet.32.a: "Verfolgen Sie eine aktive Konversion — gewährt [ShowTraitName('reformation_preacher')]."
 cc_cabinet.32.b: "Den Glauben mit fester Entschlossenheit verteidigen — verleiht [ShowTraitName('reformation_inquisitor')]."
 cc_cabinet.32.c: "Glaube ist eine Privatsache."

 # cc_cabinet.33 — Administrative Reform
 cc_cabinet.33.title: "Administrative Reform"
 cc_cabinet.33.desc: "Das Zeitalter verlangt nach effizienter Regierungsführung. [minister.GetName] hat Reformen vorgeschlagen, die die administrative Kontrolle in [target_province.GetName] verschärfen würden. Die Krone kann weitere Investitionen tätigen oder den Minister seinem Werk überlassen."
 cc_cabinet.33.a: "Bringen Sie [minister.GetName] persönlich in die Reformbemühungen ein – gewähren Sie [ShowTraitName('absolute_administrator')]."
 cc_cabinet.33.b: "Investieren Sie direkt in die Provinzentwicklung."
 cc_cabinet.33.c: "Überlassen Sie [minister.GetName] [minister.GetHerHis] eigenem Ermessen."



 # ============================================================
 # cc_traits.110 — A Scholar's Work (follow-up to cc_traits.10)
 # ============================================================

 cc_traits.110.title: "Das Werk eines Gelehrten"
 cc_traits.110.desc: "Monate nachdem [minister.GetName] den Geist dieses Zeitalters des Lernens angenommen hat, treffen Nachrichten über ihr erstes bedeutendes Werk ein. Gelehrte, Architekten und Höflinge haben es bemerkt — einige mit Bewunderung, andere mit Misstrauen."
 cc_traits.110.a: "Ihr Werk dem Hof präsentieren."

 cc_master_balancer: "Meister des Ausgleichs"
 cc_master_balancer_die_desc: "[CHARACTER.GetName] ist gestorben. Wenige Hände waren so geschickt darin, das Gleichgewicht zu halten; wir müssen hoffen, dass ein würdiger Nachfolger gefunden wird, bevor sich das große Spiel gegen uns wendet."
 desc_peace_commissioner: "Dieser Minister hat Toleranz zu einem geopolitischen Instrument gemacht. Durch die Verringerung der Reibungen zwischen den Konfessionen hat er den Antagonismus unserer Nachbarn gegenüber uns gemildert und Raum für Manöver geschaffen, den ein offener Konflikt ausgeschlossen hätte."
 cc_traits.21.desc: "[learner.GetName] hat Zeit zu [learner.GetHerHis] Verfügung und einen scharfen Verstand, der geformt werden will. Welchen Weg sollten wir [learner.GetHerHim] nahelegen?"
 cc_cabinet.10.desc: "[minister.GetName]s Verbindungen zu den großen Grundbesitzern sind erheblich gewachsen. Sie verfügen nun über den Einfluss, das Machtgefüge zwischen den Adelsfamilien zu verschieben – doch jeder Gewinn für einen Grundbesitzer bedeutet einen Verlust für einen anderen."
 desc_cc_master_balancer: "Dieser Staatsmann hat das Gleichgewicht Europas zu seinem Lebenswerk gemacht. Von jeder Kanzlei geschätzt und von keiner gefürchtet, verschafft er uns Ansehen im Ausland und mildert den Antagonismus, den unsere Manöver andernfalls provozieren würden."
 cc_cabinet.2.desc_survey: "[minister.GetName] möchte die Register neu erstellen lassen.\n\nDie derzeitige Einschätzung wurde von Menschen vorgenommen, die tot sind, über Land, das den Besitzer gewechselt hat, zu Werten, die seit Menschengedenken niemand mehr überprüft hat. Die Hälfte des Reiches zahlt auf Basis falscher Zahlen, und [minister.GetSheHe] ist ehrlich darin, dass die Korrektur in beide Richtungen verlaufen wird.\n\nDie Landvermesser müssen bezahlt, eskortiert und im Anschluss verteidigt werden."
 cc_cabinet.2.desc_academy: "[minister.GetName] schlägt eine Akademie vor, die angemessen ausgestattet ist und mit Lehrstühlen, die genug bezahlen, um die Inhaber zu versorgen.\n\nDas Argument ist, dass das Reich derzeit seine vielversprechendsten Söhne zur Ausbildung ins Ausland schickt und nur diejenigen zurückerhält, die sich dazu entscheiden, zurückzukehren. Das Gegenargument ist, dass ein Gebäude voller Gelehrter kurzfristig nur ein Gebäude voller Gelehrter hervorbringt.\n\n[minister.GetSheHe] räumt den zweiten Punkt ein und bittet dennoch um das Geld."
 cc_cabinet.2.desc_muster: "[minister.GetName] hat die Musterungslisten mit den Kirchenbüchern abgeglichen, und die beiden stimmen nicht überein.\n\nEs sind Männer aufgeführt, die tot sind. Dörfer werden für eine Steuer belegt, die sie seit zwanzig Jahren nicht mehr aufbringen konnten. Andere tragen das Eineinhalbfache dessen, was sie schulden, weil niemand die Zahl revidiert hat, seit es bequem war.\n\nEine Korrektur würde bedeuten, ein Jahr lang Schreiber in jedem Bezirk zu haben, und es würde bedeuten, mehreren mächtigen Männern mitzuteilen, dass ihr Beitrag neu berechnet wurde."
 cc_cabinet.2.desc_dockyard: "[minister.GetName] war in den Werften und ist mit einer Liste zurückgekehrt.\n\nDie Slipanlagen sind intakt. Fast nichts anderes ist es: Das Tauwerk ist alt, das seasoned timber ging vor zwei Jahren aus und wurde durch frisches Holz ersetzt, und die Schiffsbauer, die das Handwerk beherrschten, haben ihre Söhne in andere Berufe geführt, weil es keine Arbeit gab.\n\nSchiffe können immer noch gebaut werden. [minister.GetSheHe] betont vorsichtig nur, dass sie immer noch gebaut werden können."
 cc_cabinet.2.desc_embassy: "[minister.GetName] wünscht sich eine permanent besetzte Vertretung in einer Hauptstadt von Bedeutung.\n\nDie derzeitige Regelung sieht einen Gesandten vor, der geschickt wird, wenn es etwas zu sagen gibt, drei Monate nachdem es hätte gesagt werden müssen ankommt und abreist, bevor die Antwort eintrifft. Jeder von Bedeutung hat aufgehört, so zu verfahren, und das Reich ist der letzte Hof, der von Entscheidungen erst erfährt, nachdem sie getroffen wurden.\n\nDie Kosten umfassen ein Gebäude, einen Haushalt und einen Mann von Stand, der bereit ist, jahrelang im Ausland zu leben."
 cc_cabinet.2.c: "Lass [minister.GetName] das Geld privat aufbringen."
 cc_cabinet.2.d: "Lehne ab. Die Schatzkammer hat andere Bedürfnisse."
 cc_cabinet.3.desc_exceptional: "Die Arbeit ist abgeschlossen und sie ist besser als das, was gefordert wurde.\n\n[minister.GetName] blieb unter dem Kostenvoranschlag, was sonst niemand schafft, und gab die Differenz dann für die Teile aus, die [minister.GetSheHe] ursprünglich weglassen wollte. Das Ergebnis wird bereits von Leuten kopiert, die sich zuvor gegen die Bezahlung ausgesprochen hatten.\n\nDie Schatzkammer hat die Zahlen zweimal geprüft, in der Annahme, dass etwas nicht stimmen könne. Aber alles ist korrekt."
 cc_cabinet.3.desc_good: "Die Arbeit ist abgeschlossen und sie wurde ordnungsgemäß ausgeführt.\n\nEs gab Verzögerungen, wie es bei solchen Dingen üblich ist, und über das letzte Viertel des Geldes wurde länger gestritten, als die Arbeit selbst dauerte. Was versprochen wurde, ist eingetroffen, es funktioniert, und die Leute, die es benutzen, haben aufgehört, sich über die Version zu beschweren, die es ersetzt hat.\n\n[minister.GetName] hat die Abrechnungen eingereicht, ohne dass man danach gefragt haben musste."
 cc_cabinet.3.desc_ordinary: "Die Arbeit ist abgeschlossen.\n\nSie hat gekostet, was sie gekostet hat, sie tut, was sie soll, und sie wird stillschweigend nützlich sein, solange sich jemand an die Wartung erinnert. Nichts davon wird irgendwo festgehalten werden, außer im Hauptbuch.\n\n[minister.GetName] scheint mehr Dankbarkeit erwartet zu haben."
 cc_cabinet.3.desc_poor: "Die Arbeit ist nicht beendet und wird es auch nicht werden.\n\nEs gab keinen Diebstahl. Es gab einen Grundbesitzer, der keinen Zugang gewähren wollte, eine Wetterperiode zum falschen Zeitpunkt, einen Lieferanten, der ein besseres Angebot annahm, und einen Entwurf, der sich als abhängig von etwas erwies, das das Reich nicht herstellen kann. Jedes dieser Probleme wäre überwindbar gewesen. Zusammen waren sie es nicht.\n\nWas verkauft werden konnte, wurde verkauft. [minister.GetName] hat angeboten, dies zu erklären, doch es gibt nicht viel zu erklären."
 cc_cabinet.3.desc_disaster: "Das Geld ist weg und es gibt nichts vorzuweisen.\n\nDie Abrechnungen, die [minister.GetName] eingereicht hat, sind nicht nur optimistisch, sie sind konstruiert: in Rechnung gestellte Arbeiten, die nie begonnen wurden, Lieferanten, die dieselbe Adresse wie die Familie der Ehefrau von [minister.GetHerHis] teilen, eine Belegschaft, die elf Monate lang nur auf dem Papier existierte. Der Schreiber, der dies bemerkte, meldete es über die Dienstwege statt an das zuständige Büro, was der einzige Grund ist, warum es nun auf diesem Tisch liegt.\n\nMan kann dagegen klagen, was bedeutet, laut auszusprechen, dass die Krone von ihrem eigenen Minister bestohlen wurde. Man kann es auch stillschweigend beilegen und das Loch so verdecken, wie Löcher eben verdeckt werden."
 cc_cabinet.3.a_exceptional: "Genau dafür ist die Schatzkammer da."
 cc_cabinet.3.a_good: "Gut investiertes Geld."
 cc_cabinet.3.a_ordinary: "Dann ist es erledigt, und wir machen weiter."
 cc_cabinet.3.a_poor: "Fordere zurück, was zurückgefordert werden kann."
 cc_cabinet.3.a_disaster_prosecute: "Klage. Lass das Gericht sehen, dass es erledigt wird."
 cc_cabinet.3.a_disaster_bury: "Begrabt es. Verdeckt das Loch aus der Münzstätte."
