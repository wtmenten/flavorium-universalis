l_german:
 # === cc_bonds.120 — The Fort Needs Repair ===
 cc_bonds.120.title: "Die Festung muss repariert werden"
 cc_bonds.120.desc: "Ein Bericht von [bond_subj.GetName] ist eingegangen, wonach die Schlüsselbastion, die ihr Territorium schützt, erheblich verfallen ist — rissige Mauern, ein undichtes Torhaus, eine unterbesetzte Garnison. Die eigenen Einnahmen des Vasalls reichen nicht aus, um sowohl die Befestigungen als auch die reguläre Verwaltung zu finanzieren. Es wird gefragt, ob die Krone einen Beitrag zur Reparatur leisten könnte. Das Fort ist streng genommen nicht unseres. Aber das auch nicht die Grenze, die es bewacht — sie gehört uns ebenso wie ihnen."
 cc_bonds.120.a: "Finanziere vollständige Reparaturen. Wir teilen uns die Grenze; wir teilen uns die Kosten."
 cc_bonds.120.b: "Finanziere teilweise Reparaturen. Wir steuern bei, was wir können."
 cc_bonds.120.c: "Sie müssen es selbst finanzieren. Die Grenze untersteht ihrem Kommando."
 cc_bonds.120.d: "Den Bericht abheften. Wir werden uns darum kümmern, wenn die Umstände es zulassen."

 # === cc_bonds.121 — The Fort Is Tested ===
 cc_bonds.121.title: "Die Festung wird auf die Probe gestellt"
 cc_bonds.121.desc_funded: "Eine benachbarte Macht, die offensichtlich erwartete, dass die Grenze so durchlässig sei wie vor einem Jahrzehnt, hat Truppen entsandt, um das Territorium von [bond_subj.GetName] auszukundschaften. Sie stießen auf etwas Unerwartetes: eine vollständig instandgesetzte Festung, eine gut versorgte Garnison und einen Herrn, dem die Ressourcen gegeben worden waren, um seine Aufgabe ordnungsgemäß zu erfüllen. Der Vorstoß wurde zurückgeschlagen. Der Bericht wird unter 'erfolgreiche Verteidigung' abgelegt. Was bleibt, ist die Frage nach der Anerkennung."
 cc_bonds.121.desc_partial: "Eine benachbarte Macht hat die Grenzen von [bond_subj.GetName] getestet. Die Festung hielt stand – gerade so. Der Kommandant der Garnison beschrieb das Gefecht in Worten, die deutlich machten, wie knapp es gewesen war. Mit voller Finanzierung wäre das Ergebnis entscheidend gewesen; mit halber Finanzierung war es eine knappe Angelegenheit. Die Grenze ist sicher. Das Gespräch darüber, was 'Sicherheit' beim nächsten Mal kosten wird, ist es hingegen nicht."
 cc_bonds.121.desc_failed: "Eine benachbarte Macht hat die Grenze von [bond_subj.GetName] verletzt. Die Festung – unterbesetzt, ihre Mauern teilweise eingestürzt, die Garnison mit unzureichenden Vorräten – konnte nicht standhalten. Die Besetzung war kurz; der Nachbar wurde mit Unterstützung der Krone vertrieben. Aber das Territorium war besetzt. Die Bevölkerung war betroffen. Die Festung, die dies hätte verhindern können, ist baufällig, so wie sie es seit dem Bericht ist. So wie sie es ist, seit wir beschlossen haben, nicht auf den Bericht zu reagieren."
 cc_bonds.121.a_credit: "Stellen Sie klar, dass es die Investitionen der Krone waren, die diese Verteidigung ermöglicht haben."
 cc_bonds.121.a_subject_credit: "Das Verdienst gebührt dem Herrn und seiner Garnison. Wir erklären dies öffentlich."
 cc_bonds.121.b_reinforce: "Sende sofort Notverstärkungen und Vorräte."
 cc_bonds.121.b_blame: "Das teilweise Ergebnis spiegelt die unzureichende Vorbereitung des Untertans wider."
 cc_bonds.121.c_lead: "Wir werden die Rückgewinnung persönlich leiten. Das schulden wir ihnen zumindest."
 cc_bonds.121.c_supplies: "Sende Vorräte und Münzen. Die Krone wird zum Wiederaufbau beitragen."

 # === cc_bonds.122 — Who Commands the Fort? ===
 cc_bonds.122.title: "Wer befehligt die Festung?"
 cc_bonds.122.desc: "Die Festung in [bond_subj.GetName] wurde wiederaufgebaut, verstärkt und neu besetzt. Sie gilt nun als eine der leistungsfähigsten Verteidigungspositionen an unserer Grenze. Es gibt eine Frage, die durch die Wiederherstellung unvermeidlich geworden ist: Wer befehligt sie? Die derzeitige Regelung ist informell — der Vasallenherr hat die Garnison eher aus Gewohnheit als durch formale Autorität geführt. Die Formalisierung der Befehlsstruktur bedeutet die Entscheidung, ob diese Autorität bei der Krone oder bei dem Herrn liegt, der seit einer Generation mit der Festung lebt."
 cc_bonds.122.desc_positive: "Die Festung in [bond_subj.GetName] wurde wiederaufgebaut und neu besetzt. Sie steht fest. Die Garnison des Vasallenherrn — dieselben Leute, die sie verteidigten, als die Prüfung kam, und die die Krone öffentlich lobte — hat sie zu dem gemacht, was sie ist. Die Frage der formalen Befehlsgewalt ist bereits vorbelastet. Als wir ihnen den Ruhm für die Verteidigung gaben, waren wir nicht nur großzügig. Wir schufen einen Präzedenzfall, den sie nicht vergessen haben."
 cc_bonds.122.desc_bitter: "Die Festung in [bond_subj.GetName] wurde wiederaufgebaut. Sie hält nun nur deshalb, weil die Krone für die Wiederherstellung bezahlte, wovon sie zuvor den Unterhalt abgelehnt hatte — ein Detail, das der Vasallenherr nie direkt erwähnt, uns aber nie vergessen ließ. Die Befehlsregelungen sind seit dem Wiederaufbau informell geblieben. Jede Saison des Schweigens über den Vasallen ist eine implizite Erinnerung daran, was die informelle Regelung sie kostet."
 cc_bonds.122.a: "Ernenne einen Kronoffizier zum Befehlshaber. Wir können ein strategisches Gut nicht informellen Vereinbarungen überlassen."
 cc_bonds.122.b: "Übertrage dem Vasallenherrn formell die Befehlsgewalt über die Festung. Er hat sie sich verdient."
 cc_bonds.122.c: "Richten Sie eine gemeinsame Kommandostruktur ein. Die Festung gehört uns gemeinsam."
 cc_bonds.122.d: "Formalisiere das Kommando unter dem Lehnsherrn. Die Entscheidung fiel, als wir ihnen den Ruhm überließen."
 cc_bonds.122.d.tooltip: "Das Wohlwollen aus öffentlicher Anerkennung zahlt sich hier aus. Der Vasallenherr erhält die formale Befehlsgewalt mit starken pol-, per- und mil-Gewinnen — und Prestige für die Krone."
 cc_bonds.122.e_repair: "Erkenne das alte Versagen an. Entschädige den Herrn, bevor das Kommando geregelt wird."
 cc_bonds.122.e_repair.tooltip: "Eine materielle und symbolische Einigung. Die Zahlung macht den Bruch nicht ungeschehen – aber sie lässt die Frage nach dem Kommando auf einer besseren Basis neu aufrollen. Politik und Prestige verbessern sich."
 cc_bonds.122.e_ignore: "Kläre die Kommandofrage so, als gäbe es die Geschichte nicht."
 cc_bonds.122.e_ignore.tooltip: "Der Vasall zieht aus dem Schweigen seine eigenen Schlüsse. Per und Pol fallen beide – die Frage nach dem Kommando ist beantwortet, doch nicht die nach der Beziehung."
