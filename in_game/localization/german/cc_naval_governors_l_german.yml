l_german:

 # Estate Privileges

 ep_noble_admiralty_commission: "Admiralitätskommission"
 ep_noble_admiralty_commission_desc: "Die Krone formalisiert das Marinekommando unter adliger Patronage und gewährt dem Hochadel die Aufsicht über die Flottenverwaltung im Austausch für eine erweiterte Hafenkapazität. Erfordert eine Monarchie und den Fortschritt der Marinecharta."

 # Advance

 naval_administration_advance: "Marineverwaltung"
 naval_administration_advance_desc: "Der Staat errichtet ein ständiges Admiralitätsboard zur Überwachung entlegener Marinestationen, wodurch die königliche Kontrolle über die Meere erweitert wird. Erfordert den Fortschritt $naval_charter_advance$. Schaltet die Reform der Marineverwaltung frei."

 # Government Reform

 cc_naval_administration_reform: "Marineverwaltung"
 cc_naval_administration_reform_desc: "Die Einrichtung eines ständigen Admiralitätsrats erweitert die königliche Autorität über ferne Marinestationen, was einen zusätzlichen Marinegouverneur ermöglicht und die Kosten für den Unterhalt weit entfernter Häfen senkt."

 # Building

 naval_academy: "Marineakademie"
 naval_academy_desc: "Eine engagierte Institution für die Ausbildung von Offizieren und die Verfeinerung der Marine-Doktrin. Erhöht die lokalen Seeleute, reduziert den Flottenverschleiß im Hafen und – falls in der Hauptstadt errichtet – verbessert die Moral, Tradition und die erwartete Größe der Marine im gesamten Reich. Erfordert den Fortschritt $naval_charter_advance$. Kann in jeder Stadt oder Megapolis mit einem Hafen gebaut werden."
 naval_academy_maintenance: "Ausstattung der Marineakademie"
