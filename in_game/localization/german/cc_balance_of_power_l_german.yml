 # CUSTOM PANEL STRINGS
 # ============================================================
 CC_BOP_EQUILIBRIUM_HEADER: "Das Gleichgewicht"
 CC_BOP_EQUILIBRIUM_DESC: "50 % entsprechen einem perfekten Gleichgewicht. Wenn der Anteil des führenden Blocks auf 65 % und darüber steigt, nähert sich das Gleichgewicht dem Bruchpunkt und ein Hegemon könnte entstehen. Der Kreis zeigt die relative Stärke der drei Lager — den vorherrschenden Block, die ausgleichende Koalition und die nicht gebundenen Mächte."
 CC_BOP_SHARE_SUBLABEL: "Überlegenheit"
 CC_BOP_PRE_LEADER_LABEL: "Aufstrebender Hegemon"
 CC_BOP_COA_LEADER_LABEL: "Hauptausgleicher"
 CC_BOP_PRE_TT: "Der überlegene Block — der aufstrebende Hegemon und die Mächte, die sich hinter ihm versammelt haben. Sein Anteil an der kombinierten Stärke der drei Lager."
 CC_BOP_COA_TT: "Die Ausgleichskoalition – die Mächte, die sich zusammengeschlossen haben, um zu verhindern, dass ein einzelner Staat die Vorherrschaft über den Kontinent erlangt. Ihr Anteil an der kombinierten Stärke der drei Lager."
 CC_BOP_NEU_TT: "Die Nicht-Alignierten — berechtigte Mächte, die sich vom großen Spiel fernhalten. Ihr gemeinsames Gewicht kann das Gleichgewicht dennoch kippen, sollten sie in eines der Lager gezogen werden."
 CC_BOP_TENSION_TT: "Der Überwiegen-Anteil reicht von 0 bis 100, wobei 50 das Gleichgewicht darstellt. Wenn der Anteil des führenden Blocks 50 überschreitet, steigt die Spannung, und über 65 nähert sich das Gleichgewicht dem Bruchpunkt – ein Hegemon könnte entstehen."
 CC_BOP_PREPONDERANCE_PANEL_HEADER: "Der überlegene Block"
 CC_BOP_COALITION_PANEL_HEADER: "Die Ausgleichskoalition"
 CC_BOP_OVERVIEW_HEADER: "Das große Spiel"
 CC_BOP_OVERVIEW_DESC: "Zwei Lager streiten um das Schicksal Europas und des Nahen Ostens. Der Preponderanz-Block schart sich hinter der stärksten Macht, während diese nach Vorherrschaft greift; die Balance-Koalition formiert sich, um ihr dies zu verwehren. Halte das Gleichgewicht – durch Diplomatie, Subventionen, Drohungen oder Gold – und der Friede des Kontinents währt fort. Lass ihn brechen, und eine neue Ordnung wird an seiner Stelle geboren."

 # ============================================================
 # EVENTS
 # ============================================================
 cc_balance_of_power.1.title: "Ein neues Gleichgewicht"
 cc_balance_of_power.1.desc: "Die Kanzleien Europas und des Nahen Ostens sind in der Kalkulation der Macht versiert geworden. Fürsten suchen nicht länger blindlings nach Eroberungen; nun wägen, messen und kombinieren sie, sodass keine einzelne Krone die anderen überragen kann. Ein neues Zeitalter der Diplomatie bricht an — das Zeitalter des Mächtegleichgewichts."
 cc_balance_of_power.1.a: "Wir werden das Spiel mitspielen."

 cc_balance_of_power.2.title: "Die aufstrebende Macht"
 cc_balance_of_power.2.desc: "Unsere Stärke übertrifft nun die jedes Rivalen. Die Höfe des Kontinents betrachten uns mit Neid und Furcht, und bereits flüstern sie von Koalitionen, um uns einzukreisen. Der Weg zur Vorherrschaft liegt offen – doch jeder Schritt darauf bringt die anderen uns gegenüber näher zusammen."
 cc_balance_of_power.2.a: "Lasst sie uns fürchten. Europa wird sich unserem Willen beugen."
 cc_balance_of_power.2.b: "Wir streben nach Vorrang, nicht nach Herrschaft — zumindest für den Moment."

 cc_balance_of_power.3.title: "Die unverzichtbare Macht"
 cc_balance_of_power.3.desc: "Wir sind stark genug, um von Bedeutung zu sein, aber nicht so stark, dass wir Angst einflößen. Das macht uns zum natürlichen Dreh- und Angelpunkt des Kontinents: das Gewicht, das auf die leichtere Waagschale geworfen wird, um das Gleichgewicht wiederherzustellen. Die kleineren Höfe sehen auf uns, um ihre Verteidigung gegen den aufstrebenden Hegemon zu organisieren."
 cc_balance_of_power.3.a: "Wir werden das Gleichgewicht Europas sein."
 cc_balance_of_power.3.b: "Lassen Sie andere diese Last tragen."

 cc_balance_of_power.10.title: "Seitenwahl"
 cc_balance_of_power.10.desc: "Gesandte beider Lager drängen in unsere Vorzimmer. Die aufstrebende Macht bietet Freundschaft an – und warnt vor den Kosten einer Ablehnung. Die Koalition bietet Solidarität – und die Sicherheit der Überzahl. Unser Hof kann nicht ewig distanziert bleiben; der Moment der Entscheidung ist gekommen."
 cc_balance_of_power.10.a: "Tritt der Ausgleichskoalition bei."
 cc_balance_of_power.10.b: "Tritt dem vorherrschenden Block bei."
 cc_balance_of_power.10.c: "Halte uns die Hände frei – bleibe neutral."

 cc_balance_of_power.20.title: "Druck und Überredung"
 cc_balance_of_power.20.desc: "Ein geringerer Hof zögert, sich uns unterzuordnen. Unsere Minister raten, dass es mehrere Wege gibt, einen schwankenden Fürsten in die Knie zu zwingen – die gepanzerte Faust oder der offene Geldbeutel. Beides wird funktionieren, obwohl jedes seine eigenen Rückstände an Groll oder Abhängigkeit hinterlässt."
 cc_balance_of_power.20.a: "Drohe ihnen, in unseren Block einzutreten."
 cc_balance_of_power.20.b: "Kauf ihre Neutralität mit Gold."
 cc_balance_of_power.20.c: "Lassen Sie sie gewähren – vorerst."

 cc_balance_of_power.30.title: "Furcht vor dem Hegemon"
 cc_balance_of_power.30.desc: "Berichte über die Ambitionen der führenden Macht erreichen uns, wobei jede alarmierender ist als die letzte. Unsere Koalitionspartner schauen zu uns: Werden wir der gemeinsamen Furcht eine Stimme geben oder behalten wir unseren Rat für uns, um den Koloss nicht zu provozieren?"
 cc_balance_of_power.30.a: "Verurteilen Sie den aufstrebenden Hegemon öffentlich."
 cc_balance_of_power.30.b: "Behalten wir uns unsere Meinung vor und beobachten."

 cc_balance_of_power.40.title: "Das Gleichgewicht wiederherstellen"
 cc_balance_of_power.40.desc: "Als Ausgleicher liegen die Mittel, um die leichtere Waagschale zu stützen, in unserer Hand. Gold kann einen wankenden Partner stärken; geduldige Diplomatie kann einen Neutralen für unsere Sache gewinnen. Jede Entscheidung kostet etwas — Schatz oder Mühe —, um zu verhindern, dass das Gleichgewicht kippt."
 cc_balance_of_power.40.a: "Subventioniere einen Koalitionspartner."
 cc_balance_of_power.40.b: "Werben Sie eine neutrale Macht für die Koalition."
 cc_balance_of_power.40.c: "Bleib passiv und schone unsere Kräfte."

 cc_balance_of_power.50.title: "Ein Kongress der Mächte"
 cc_balance_of_power.50.desc: "Die Gesandten der Koalition kommen auf unsere Einladung zusammen. Am Tisch sitzen die Mächte, die den Kontinent frei halten wollen – und jede blickt zu uns nach Führung. Eine gemeinsame Kriegskasse, ein Zusammenschluss der Reihen oder bloßes Gerede: Der Kongress wird das, was wir aus ihm machen."
 cc_balance_of_power.50.a: "Bilden Sie eine gemeinsame Kriegskasse."
 cc_balance_of_power.50.b: "Entschluss, den Hegemon einzudämmen – die Reihen schließen."
 cc_balance_of_power.50.c: "Ohne Einigung vertagen."

 cc_balance_of_power.60.title: "Das Gleichgewicht wankt"
 cc_balance_of_power.60.desc: "Die Waagschale neigt sich gefährlich. Der Block der führenden Macht schwillt an, während unser eigener an den Rändern ausfranst. Wenn wir nicht sofort handeln, um jeden wankenden Hof zu mobilisieren, wird das Gleichgewicht, das wir mühsam bewahrt haben, zerbrechen, und mit ihm die Unabhängigkeit des Kontinents."
 cc_balance_of_power.60.a: "Mobilisiert jeden Hof gegen die drohende Hegemonie."
 cc_balance_of_power.60.b: "Wir kommen möglicherweise bereits zu spät."

 cc_balance_of_power.70.title: "Herr über Europa"
 cc_balance_of_power.70.desc: "Die Koalitionen sind an uns zerschellt wie Wellen an einem Felsen. Keine Kombination von Mächten kann unseren Willen nun noch bändigen. Ein neuer Karl der Große, ein neuer Caesar – die Geschichte wird festhalten, dass in dieser Ära das Gleichgewicht Europas in unserer Hand lag."
 cc_balance_of_power.70.a: "Der Kontinent gehört uns."

 cc_balance_of_power.71.title: "Der triumphierende Hegemon"
 cc_balance_of_power.71.desc: "Trotz jedes Bündnisses und jedes Kongresses konnten wir den Koloss nicht aufhalten. Das Gleichgewicht ist zerstört, und eine einzige Macht beherrscht nun den Kontinent. Unsere Gesandten werden mit kühler Höflichkeit in einem Europa empfangen, das gelernt hat, sich zu beugen."
 cc_balance_of_power.71.a: "Wir werden diese Demütigung nicht vergessen."

 cc_balance_of_power.72.title: "Die Sintflut aus dem Osten"
 cc_balance_of_power.72.desc: "Die alte westliche Ordnung konnte trotz all ihrer sorgfältigen Ausgewogenheit den Sturm, der sich im Osten zusammenbraute, nicht begreifen. Nun strömen unsere Armeen über ihre Grenzen, und die Kanzleien, die sich für die Schiedsrichter der Welt hielten, kämpfen ums Überleben."
 cc_balance_of_power.72.a: "Die Zukunft gehört uns."

 cc_balance_of_power.73.title: "Die alte Ordnung fällt"
 cc_balance_of_power.73.desc: "Das sorgsame Gleichgewicht der Könige zählte nichts mehr, als das Volk aufbegehrte. Throne wanken, Grenzen lösen sich auf und die Diplomatie der Kabinette weicht dem Zorn der Revolution. Die Welt des Mächtegleichgewichts ist verschwunden, und ein neues und schreckliches Zeitalter beginnt."
 cc_balance_of_power.73.a: "Nichts wird mehr so sein wie zuvor."

 cc_balance_of_power.74.title: "Das Konzerteuropa"
 cc_balance_of_power.74.desc: "Über alle Erwartungen hinweg hat das Gleichgewicht gehalten. Durch Kongresse und Kompromisse, Subventionen und Zurückhaltung haben die Mächte gelernt, ihre Rivalitäten zu managen, anstatt von ihnen beherrscht zu werden. Was als misstrauisches Gleichgewicht begann, ist zu einem dauerhaften Konzert gereift – einer Ordnung, die den Frieden für Generationen bewahren könnte."
 cc_balance_of_power.74.a: "Lassen Sie das Konzert fortbestehen."

 cc_balance_of_power.70.b: "Setze einem gedemütigten Rivalen eine Krone auf."

 cc_balance_of_power.41.title: "Die Völkerschlacht"
 cc_balance_of_power.41.desc: "Die Heere der Koalition sind auf dem Schlachtfeld zusammengekommen. Nie zuvor wehten so viele Banner gemeinsam gegen den Kolossen. Unsere Generäle sagen uns, die Stunde sei gekommen: Setzen wir jedes Bataillon ein, und der Kampf um die Hegemonie könnte hier, in Blut und Rauch, entschieden werden – oder wir schonen unsere Kräfte und lassen den Feind in einem längeren Krieg auszehren."
 cc_balance_of_power.41.a: "Setze alles auf eine Entscheidungsschlacht."
 cc_balance_of_power.41.b: "Zermürben und Verzögern — bewahre unsere Kräfte."

 cc_balance_of_power.42.title: "Verbrannte Erde"
 cc_balance_of_power.42.desc: "Die Armeen des Hegemons marschieren in unser Kernland ein, gewaltig und selbstbewusst. Wir können ihnen in einer offenen Schlacht nicht entgegentreten – aber das Land selbst kann zu einer Waffe gemacht werden. Verbrennt die Kornspeicher, vergiftet die Brunnen und weicht vor ihnen zurück in die Kälte und Ferne, bis ihr großes Heer inmitten der Asche verhungert."
 cc_balance_of_power.42.a: "Verbrennt das Land vor euch und zieht euch zurück."
 cc_balance_of_power.42.b: "Bleiben wir stehen und verteidigen unsere Heimat."

 cc_balance_of_power.43.title: "Das blutende Geschwür"
 cc_balance_of_power.43.desc: "Ein ganzes Volk hat sich gegen unsere Besatzung erhoben – nicht in einer offenen Schlacht, sondern in Hinterhalten und Attentaten, tausend kleine Wunden, die niemals schließen. Unsere Armeen halten die Städte und beherrschen tagsüber die Straßen, doch nachts bluten sie in den Hügeln. Diese offene Wunde zehrt an uns, während der Rest des Kontinents zusieht und Mut fasst."
 cc_balance_of_power.43.a: "Truppen entsenden, um den Aufstand niederzuschlagen."
 cc_balance_of_power.43.b: "Besetzen Sie die Städte und halten Sie den Verlusten stand."

 cc_balance_of_power.44.title: "Die Kontinentalsperre"
 cc_balance_of_power.44.desc: "Wir können unsere Hauptrivalen nicht allein durch militärische Gewalt bezwingen – aber wir können die Märkte des Kontinents für ihre Kaufleute schließen. Lasst keinen Hafen unter unserem Einfluss ihre Waren zulassen; lasst ihren Handel dahinsiechen und ihre Handelshäuser scheitern. Eine Blockade des gesamten Kontinents ist eine Waffe, die noch nie in diesem Ausmaß eingesetzt wurde – und sie wird unseren eigenen Handel ebenso sehr binden wie den ihren."
 cc_balance_of_power.44.a: "Ruft die Blockade aus — würgt ihren Handel ab."
 cc_balance_of_power.44.b: "Halte die Seewege offen – wir profitieren mehr vom Handel."

 cc_balance_of_power.45.title: "Levée en Masse"
 cc_balance_of_power.45.desc: "Der Konflikt ist aus den Kabinettsarmeen vergangener Zeiten herausgewachsen. Unsere Minister schlagen eine beispiellose Maßnahme vor: die gesamte Nation unter die Waffen zu rufen – jeder fähige Mann ein Soldat, jede Werkstatt eine Kriegsmanufaktur. Dies würde Armeen von unvorstellbarer Größe heraufbeschwören, aber es würde auch Musketen in die Hände des Volkes legen und die Fesseln der alten Ordnung für immer lockern."
 cc_balance_of_power.45.a: "Rufen Sie die gesamte Nation unter die Waffen."
 cc_balance_of_power.45.b: "Vertraue dem Berufsheer."

 cc_balance_of_power.46.title: "Ein separater Friede"
 cc_balance_of_power.46.desc: "Die Gesandten des Hegemons kommen im Geheimen zu uns, mit sanften Worten und großzügigen Bedingungen. Warum für eine Koalition bluten, die noch scheitern könnte, fragen sie, wenn ein Kompromiss unser Volk schonen und sogar unser Haus bereichern könnte? Unsere Partner würden es als Verrat bezeichnen – doch die Lasten des Kampfes wiegen schwer, und der Koloss scheint unaufhaltsam."
 cc_balance_of_power.46.a: "Kommen Sie mit dem Hegemon zu einer Einigung."
 cc_balance_of_power.46.b: "Haltet stand – unser Platz ist bei der Koalition."

 cc_balance_of_power.47.title: "Eine Staatsheirat"
 cc_balance_of_power.47.desc: "Unsere Vorherrschaft ist nun so groß, dass geringere Höfe unser Wohlwollen suchen, und das sicherste Band zwischen Thronen war schon immer das Ehebett. Eine dynastische Union würde eine schwankende Macht an unser Haus binden — oder, bei weiterem Druck, könnten wir einen unserer eigenen Verwandten auf ihren Thron setzen und es als Satellitenkönigreich regieren, im Namen fast alles andere als solches."
 cc_balance_of_power.47.a: "Binde sie an unser Haus."
 cc_balance_of_power.47.b: "Installieren Sie sie als Satellitenkönigreich."
 cc_balance_of_power.47.c: "Nur eine Höflichkeit — Porträts und freundliche Worte."

 cc_balance_of_power.75.title: "Das Konzert wankt"
 cc_balance_of_power.75.desc: "Eine Generation lang hielt das Konzert stand, und die Kanzleien gratulierten sich selbst dazu, die Ambitionen der Fürsten gezähmt zu haben. Doch keine Ordnung währt ewig. Eine Macht hat den Bund gebrochen und erneut nach Vorherrschaft gegriffen; die alten Kongresse verstummen, die Garantien klingen hohl, und die vorsichtige Kalkulation des Gleichgewichts beginnt von Neuem."
 cc_balance_of_power.75.a: "Der Friede konnte nicht ewig währen."

 # ============================================================
 # ACTION EVENTS (80-92)
 # ============================================================
 cc_balance_of_power.80.title: "Eine Beitrittspetition"
 cc_balance_of_power.80.desc: "Ein Gesandter von [cc_bop_petitioner.GetName] erwartet uns mit einem Vorschlag: Ihr Hof würde sich unserem Block anschließen und unter unserem Banner marschieren. Ein weiteres Schwert ist immer willkommen — doch jeder Klient, den wir gewinnen, bindet uns ebenso sehr an deren Streitigkeiten, wie unsere an die ihren."
 cc_balance_of_power.80.a: "Nehmen Sie sie in unseren Block auf."
 cc_balance_of_power.80.b: "Wir haben sie nicht nötig."

 cc_balance_of_power.81.title: "Eine Beitrittspetition"
 cc_balance_of_power.81.desc: "Ein Gesandter von [cc_bop_petitioner.GetName] erbittet eine Audienz: Aus Angst vor dem aufstrebenden Hegemon würde ihr Hof der Koalition beitreten und sein Gewicht in die Sache des Gleichgewichts einbringen. Zahlen sind die Stärke der Koalition — obwohl jeder neue Partner eine weitere Stimme ist, die am Ratstisch zufrieden gestellt werden muss."
 cc_balance_of_power.81.a: "Willkommen in der Koalition."
 cc_balance_of_power.81.b: "Wir haben sie nicht nötig."

 cc_balance_of_power.91.title: "Unsere Petition wurde beantwortet"
 cc_balance_of_power.91.desc: "Eine Nachricht des Blockführers erreicht uns: Unser Gesuch wurde angenommen, und unser Hof wird in ihren Kreis aufgenommen. Wir sind im großen Spiel nicht länger allein."
 cc_balance_of_power.91.a: "So sei es — wir sind nun gebunden."

 cc_balance_of_power.92.title: "Unsere Petition wurde abgelehnt"
 cc_balance_of_power.92.desc: "Der Anführer des Blocks hat unsere Annäherungsversuche mit kühler Höflichkeit zurückgewiesen. Uns bleibt es überlassen, uns im Wettbewerb allein durchzuschlagen — und die Kränkung im Gedächtnis zu behalten."
 cc_balance_of_power.92.a: "Wir werden uns daran erinnern."

 cc_balance_of_power.93.title: "Der Kongress wird einberufen"
 cc_balance_of_power.93.desc: "Auf unser Aufgebot versammeln sich die Mächte der Koalition in einem ständigen Kongress. Was einst ein loses Zweckbündnis war, verfügt nun über einen Saal für Beratungen, einen Tisch für Abstimmungen und die Mittel, sich einem gemeinsamen Ziel zu verschreiben. Die Arbeit am Gleichgewicht gegenüber dem Koloss kann nun im Einklang erfolgen."
 cc_balance_of_power.93.a: "Lasst den Kongress tagen."

 cc_balance_of_power.94.title: "Rückkehr in die europäische Familie"
 cc_balance_of_power.94.desc: "Eine Generation ist seit unserer Niederlage vergangen. Die Wunden der großen Abrechnung sind so weit verheilt, dass die Mächte — im Bewusstsein, dass keine Ordnung Bestand hat, solange eine große Nation im Exil gehalten wird — ihre Hand ausstrecken. Wir sind eingeladen, unseren Platz im Konzert Europas einzunehmen — nicht länger als Ausgestoßene, sondern wieder als Partner bei der Verwaltung des Friedens auf dem Kontinent."
 cc_balance_of_power.94.a: "Wir nehmen unseren rechtmäßigen Platz wieder ein."

 cc_balance_of_power.82.title: "Bewaffnete Neutralität"
 cc_balance_of_power.82.desc: "Anstatt uns in die Zwistigkeiten der Großmächte hineinziehen zu lassen, erklärt unser Hof die bewaffnete Neutralität: freundlich zu allen, niemandem verpflichtet, unsere Häfen und Grenzen offen für ehrlichen Handel und geschlossen für die Rekrutierungssergeanten beider Blöcke. Ausländisches Gold fließt frei, um uns dies zu ermöglichen."
 cc_balance_of_power.82.a: "Unsere Hände bleiben frei."

 cc_balance_of_power.83.title: "Beide Seiten ausspielen"
 cc_balance_of_power.83.desc: "Unsere Diplomaten sind Meister des diskreten Wortes und des rechtzeitigen Winks. Indem wir uns immer so leicht wie möglich zu dem Lager neigen, das schwächer ist, halten wir den Wettbewerb in einer feinen Balance — und stellen sicher, dass beide Seiten großzügig für unser fortwährendes Wohlwollen bezahlen."
 cc_balance_of_power.83.a: "Lasst sie beide um uns werben."

 cc_balance_of_power.84.title: "Sich auf die Nichtgebundenen stützen"
 cc_balance_of_power.84.desc: "Mit dem Vertrauen in unseren wachsenden Aufstieg setzen unsere Gesandten die schwankenden Höfe des Kontinents unter Druck. Ein Wort über das Schicksal derer, die sich uns entgegenstellen, eine Erinnerung an die Armeen unter unserem Kommando – und das Gleichgewicht verschiebt sich zu unseren Gunsten, ohne dass ein einziger Schuss fallen muss."
 cc_balance_of_power.84.a: "Sie werden lernen, uns zu fürchten."

 cc_balance_of_power.85.title: "Die Kontinentalsperre"
 cc_balance_of_power.85.desc: "Wir erklären die Märkte des Kontinents für den Handel unserer Rivalen geschlossen. Kein Hafen unter unserem Einfluss soll ihre Waren zulassen; ihre Handelshäuser sollen scheitern und ihre Kaufleute klagen. Der Handel der Koalition verdorrt unter dem Gewicht unseres Ehrgeizes."
 cc_balance_of_power.85.a: "Ihr Handelsnetz strangulieren."

 cc_balance_of_power.86.title: "Konsolidierung der Hegemonie"
 cc_balance_of_power.86.desc: "Der Moment ist gekommen, die Früchte unseres Ehrgeizes zu ernten. Subventionen werden gezahlt, Garnisonen positioniert, dynastische Abkommen geschlossen – und hundert kleine Höfe ordnen sich uns unter. Das Gleichgewicht neigt sich zu unserer Vorherrschaft, und der Block steht dadurch stärker da."
 cc_balance_of_power.86.a: "Der Kontinent beugt sich unserem Willen."

 cc_balance_of_power.87.title: "Verbündete werden subventioniert"
 cc_balance_of_power.87.desc: "Die geringeren Mitglieder der Koalition können dem Beutel des Hegemons allein nicht standhalten – also öffnen wir den unseren. Gold fließt, um ihre Aufgebote zu härten und ihre Entschlossenheit zu festigen, damit kein Partner aus Geldmangel mit dem Feind verhandeln muss."
 cc_balance_of_power.87.a: "Lassen Sie keinen Verbündeten in Not sein."

 cc_balance_of_power.88.title: "Oberbefehl übernommen"
 cc_balance_of_power.88.desc: "Wir ziehen persönlich in die Schlacht, unsere eigenen Banner an der Spitze des alliierten Heeres. Die kleineren Mächte ordnen sich einem einzigen Willen unter, und unser Prestige verleiht der Koalition das Rückgrat, das ihr fehlte. Mit einer Hand, die den Krieg lenkt, wird das Gleichgewicht zurück zur Stabilität gezogen."
 cc_balance_of_power.88.a: "Das Kommando liegt bei uns."

 cc_balance_of_power.89.title: "Eine diplomatische Revolution"
 cc_balance_of_power.89.desc: "Mit einem Schlag wirft unser Kabinett die Diplomatie einer ganzen Generation über den Haufen — ein renversement des alliances, das den Anwärter plötzlich ihrer Freunde beraubt und die Koalition mit neuer Stärke anwachsen lässt. Das Gleichgewicht neigt sich entscheidend zurück zu den Vielen."
 cc_balance_of_power.89.a: "Das Spiel wird neu gestaltet."

 cc_balance_of_power.90.title: "Die Seeblockade"
 cc_balance_of_power.90.desc: "Wenn der Hegemon uns den Handel an Land verwehrt, werden wir ihm das Meer schließen. Unsere Flotten fegen die Zugänge sauber und blockieren die großen Häfen; die Handelsschiffe des vorherrschenden Blocks verrotten vor Anker, während der Handel seiner Rivalen hindurchschlüpft. Wirtschaftskrieg ist eine Straße mit zwei Richtungen — aber so sei es."
 cc_balance_of_power.90.a: "Blockiere ihre Küsten."

 # --- Betrayal & the reversal of alliances ---
 cc_balance_of_power.100.title: "Eine Umkehrung der Allianzen"
 cc_balance_of_power.100.desc: "Unsere Position in diesem Block ist unerträglich geworden — sein Glück schwindet, sein Anführer nimmt uns für gesetzt, und auf der anderen Seite lässt das gegnerische Lager wissen, dass unsere Freundschaft reichlich belohnt würde. Jetzt zu wechseln, wäre in den Augen unserer derzeitigen Verbündeten der schlimmste Verrat — und in den Augen der Nachwelt der sicherste Schachzug der Staatskunst. Das gesamte Gleichgewicht des Kontinents könnte von unserer Antwort abhängen."
 cc_balance_of_power.100.a: "Kehren wir unsere Bündnisse um — wechseln wir in das andere Lager."
 cc_balance_of_power.100.b: "Wir bleiben treu. Unser Platz ist bei unseren Verbündeten."

 cc_balance_of_power.101.title: "Ein höchst schändlicher Verrat"
 cc_balance_of_power.101.desc: "Die Nachricht erreicht uns, dass [bop_defector.GetName] unsere Sache aufgegeben hat und zum Feind übergelaufen ist – Allianzen wurden über Nacht umgekehrt, unsere Räte verraten und das Gleichgewicht durch einen einzigen Akt des Verrats zu unseren Ungunsten verschoben. Unsere verbleibenden Partner beobachten genau, wie wir diesen Schlag verkraften."
 cc_balance_of_power.101.a: "Ein solcher Verrat wird nicht vergessen werden."

 cc_balance_of_power.103.title: "Vollenden Sie den Verrat"
 cc_balance_of_power.103.desc: "Der Friede ist unterzeichnet, unsere Regimenter sind zurückgezogen und neu formiert, und unser neuer Patron erwartet nun von uns, dass wir unseren Übertritt mit Taten rechtfertigen. Unsere ehemaligen Verbündeten — allen voran [bop_old_target.GetName] — stehen schutzlos vor uns. Wir können auf sie herabstürzen, wie es unsere neuen Freunde erwarten, oder ein noch tieferes Spiel spielen und niemandem außer uns selbst Rechenschaft schuldig sein."
 cc_balance_of_power.103.a: "Die Waffen gegen unsere ehemaligen Verbündeten ergreifen."
 cc_balance_of_power.103.b: "Ein doppeltes Spiel – wir behalten unsere eigenen Pläne für uns."

 cc_balance_of_power.102.title: "Ein erkaufter Verrat"
 cc_balance_of_power.102.desc: "Unsere Schatzkammern sind voll und unsere Spionagemeister fleißig. Ein unzufriedenes Mitglied des gegnerischen Lagers — [bop_treason_target.GetName] — hat durchblicken lassen, dass der richtige Anreiz ausreichen könnte, um es gänzlich von seinen Verbündeten zu lösen. Gold und Intrigen könnten die Stärke eines Rivalen in unsere eigene verwandeln, wenngleich solche Geschäfte einen Fleck hinterlassen, an den sich Fürsten noch lange erinnern."
 cc_balance_of_power.102.a: "Kauf ihren Verrat."
 cc_balance_of_power.102.b: "Solche Intrigen stehen unter unserer Würde."

 # --- Coalition victory: the chief balancer's reward ---
 cc_balance_of_power.76.title: "Der Architekt des Gleichgewichts"
 cc_balance_of_power.76.desc: "Dem aufstrebenden Hegemon wurde die Führung verwehrt, und das Gleichgewicht, um das wir uns bemüht haben, ist nun als dauerhaftes Konzert institutionalisiert. Von all den Mächten, die sich gegen den Koloss zusammenschlossen, war es unsere Hand, die die Koalition leitete, unser Gold und unsere Diplomatie, die sie zusammenhielten. Europa blickt nun wie nie zuvor zu uns auf — und die Frage ist, was wir aus dieser Vormachtstellung machen werden. Sollen wir unser Werk als vertrauenswürdiger Garant des Friedens krönen oder die Herrschaft, die wir über die Koalition gewannen, in eigene Ambitionen verwandeln?"
 cc_balance_of_power.76.a: "Wir sind der Garant für Europas Frieden."
 cc_balance_of_power.76.b: "Nun soll der Kontinent unserem Beispiel folgen."

 # --- The coalition takes up arms ---
 cc_balance_of_power.110.title: "Die Stunde der Entscheidung"
 cc_balance_of_power.110.desc: "Die Berichte lassen sich nicht länger ignorieren: Der aufstrebende Hegemon steht unmittelbar an der Schwelle zur Vorherrschaft, und mit jedem Monat der Verzögerung fällt ein weiterer Hof in seinen Orbit. Unsere Kongresse und Subventionen haben nicht genügt. Wenn das Gleichgewicht überhaupt noch gerettet werden kann, dann muss es jetzt geschehen – durch das Schwert. Unsere Generäle raten, dass die Koalition, wenn sie als eine Einheit marschiert, den Koloss noch brechen kann, bevor er über jedes Maß hinauswächst. Doch den ersten Schlag zu führen, bedeutet, alles auf dem Schlachtfeld zu riskieren."
 cc_balance_of_power.110.a: "Jetzt zuschlagen, bevor das Gleichgewicht endgültig kippt."
 cc_balance_of_power.110.b: "Noch nicht – wir wagen es nicht, dem Koloss unvorbereitet gegenüberzutreten."

 cc_balance_of_power.111.title: "Die Union ehren"
 cc_balance_of_power.111.desc: "Die Armeen des Hegemons sind über [bop_victim.GetName], unseren Partner in der Koalition, hergefallen, und selbst jetzt flehen sie um die Hilfe, die wir bei der Bildung des Bundes zugesagt haben. In ihrem Beistand zu marschieren bedeutet, das volle Gewicht des Kolosses auf uns herabfallen zu lassen – doch sie im Stich zu lassen bedeutet, zuzusehen, wie die Koalition Faden für Faden zerreißt und jeder Partner allein zum Verzehr zurückbleibt. Die Glaubwürdigkeit des gesamten Bündnisses hängt von unserer Antwort ab."
 cc_balance_of_power.111.a: "Ehre die Union — marschiere zu ihrer Verteidigung."
 cc_balance_of_power.111.b: "Wir wagen es nicht, den Koloss zu provozieren – sie müssen sich selbst behelfen."

 # ============================================================
 # GENERIC ACTIONS — names & descriptions
 # ============================================================
 cc_bop_petition_preponderance: "Den überlegenen Block ersuchen"
 cc_bop_petition_preponderance_desc: "Bitten Sie den aufstrebenden Hegemon, unseren Hof in den Preponderanz-Block aufzunehmen. Der Anführer wird entscheiden, ob er uns akzeptiert. Verfügbar für engagierte, nicht verbündete Mächte. Kann für 4 Jahre nicht wiederholt werden."
 cc_bop_petition_coalition: "Die Ausgleichskoalition ersuchen"
 cc_bop_petition_coalition_desc: "Bitten Sie den Hauptausgleicher, unseren Hof in die Ausgleichskoalition aufzunehmen. Der Anführer wird entscheiden, ob er uns akzeptiert. Verfügbar für engagierte, nicht verbündete Mächte. Kann für 4 Jahre nicht wiederholt werden."
 cc_bop_proclaim_neutrality: "Bewaffnete Neutralität ausrufen"
 cc_bop_proclaim_neutrality_desc: "Unseren Hof im großen Spiel als neutral erklären und ausländisches Gold anziehen, um dies beizubehalten. Erfordert einen Kabinettsminister, der der Aufgabe $cc_duty_free_hands$ zugewiesen ist. Kann für 6 Jahre nicht wiederholt werden."
 cc_bop_play_both_sides: "Beide Seiten ausspielen"
 cc_bop_play_both_sides_desc: "Neigen Sie diskret zum schwächeren Block, um den Wettbewerb im Gleichgewicht zu halten – und lassen Sie sich von beiden Lagern das Wohlwollen bezahlen. Erfordert einen Kabinettsminister in einem diplomatischen Posten ($cc_duty_diplomatic_mission$ oder das diplomatische Korps). Kann für 5 Jahre nicht wiederholt werden."
 cc_bop_io_intimidate: "Einschüchterung der Unabhängigen"
 cc_bop_io_intimidate_desc: "Verbrauche den Ehrgeiz des Blocks, um Druck auf die schwankenden Höfe des Kontinents auszuüben und das Gleichgewicht nach oben zu verschieben. Erfordert 25 Ehrgeiz (verbraucht 20). Kann für 4 Jahre nicht wiederholt werden."
 cc_bop_io_continental_system: "Das Kontinentalsystem ausrufen"
 cc_bop_io_continental_system_desc: "Verbrauche die Ambition des Blocks, um die Märkte des Kontinents für die Koalition zu schließen und deren Handel zu blockieren. Erfordert 40 Ambition (verbraucht 30) und einen Anteil an der Vorherrschaft von mindestens 55%. Kann für 5 Jahre nicht wiederholt werden."
 cc_bop_io_consolidate_hegemony: "Hegemonie konsolidieren"
 cc_bop_io_consolidate_hegemony_desc: "Ein finaler Vorstoß: Verbrauche eine große Menge an Ambition, um das Gleichgewicht massiv in Richtung Meisterschaft zu verschieben und den gesamten Block zu ermutigen. Erfordert 70 Ambition (verbraucht 50). Kann für 6 Jahre nicht wiederholt werden."
 cc_bop_io_subsidize_allies: "Verbündete subventionieren"
 cc_bop_io_subsidize_allies_desc: "Verbrauche die Entschlossenheit der Koalition, um ihre kleineren Mitglieder gegen den Hegemon zu stärken. Erfordert 25 Entschlossenheit (verbraucht 20). Kann für 4 Jahre nicht wiederholt werden."
 cc_bop_io_naval_blockade: "Ordne eine Seeblockade an"
 cc_bop_io_naval_blockade_desc: "Die Antwort der Koalition auf das Kontinentalsystem: Verbrauchen Sie Entschlossenheit, um die Küsten des vorherrschenden Blocks zu blockieren und ihren Handel abzuwürgen. Eine reaktive Maßnahme – erfordert 35 Entschlossenheit (verbraucht 25) und einen Anteil an der Vorherrschaft von mindestens 55 %. Kann für 5 Jahre nicht wiederholt werden."
 cc_bop_io_convene_the_congress: "Berufe den Kongress ein"
 cc_bop_io_convene_the_congress_desc: "Berufen Sie den ruhenden Kongress zur Sitzung ein und eröffnen Sie den ständigen Ausgleichskongress, damit der Block über Gesetze abstimmen und Parlamentsanträge einbringen kann. Ein struktureller Akt — erfordert mindestens 3 Mitglieder und 20 Entschlossenheit (mobilisiert die Sache um +5)."
 cc_bop_io_assume_supreme_command: "Das Oberkommando übernehmen"
 cc_bop_io_assume_supreme_command_desc: "Persönlich ins Feld ziehen: das eigene Prestige des Ausgleichers in die alliierten Bemühungen einbringen und das Gleichgewicht wiederherstellen. Ein einseitiger Schlag — erfordert 40 Entschlossenheit (verbraucht 30) und einen Anteil an der Vorherrschaft von mindestens 55 %. Kann für 4 Jahre nicht wiederholt werden."
 cc_bop_io_diplomatic_revolution: "Eine diplomatische Revolution herbeiführen"
 cc_bop_io_diplomatic_revolution_desc: "Ein renversement des alliances: Das Kabinett des Gleichgewichtshaltenden orchestriert eine dramatische Neuausrichtung, die das Gleichgewicht entscheidend zugunsten der Vielen verschiebt. Ein einseitiger Abschluss — erfordert 70 Entschlossenheit (verbraucht 50). Kann für 6 Jahre nicht wiederholt werden."
 cc_bop_io_leave_bloc: "Den Block verlassen"
 cc_bop_io_leave_bloc_desc: "Wir ziehen unseren Hof aus seinem Block zurück. Wir werden als Abtrünnige gebrandmarkt und das Ansehen unseres ehemaligen Blocks wird leiden. Verfügbar für Nicht-Führer-Mitglieder. Kann für 3 Jahre nicht wiederholt werden."

 # ai_will_do factor descriptions
 CC_BOP_FRIENDLY_LEADER: "Die führende Macht blickt wohlwollend auf uns"
 CC_BOP_BANDWAGON: "Die Starken werden stärker – am besten schließt man sich ihnen an"
 CC_BOP_BEHIND: "Wir fallen zurück und müssen unseren Vorteil ausnutzen"
 CC_BOP_GREAT_POWER: "Eine Großmacht hat einen Platz am Verhandlungstisch"
 CC_BOP_NEAR_HEGEMON: "Der aufstrebende Hegemon ragt vor unserer Haustür auf"

