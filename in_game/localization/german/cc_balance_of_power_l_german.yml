 cc_bop_needs_diplomat_minister_tt: "Ein Kabinettsminister muss in einem diplomatischen Auslandseinsatz sein — entweder im Dienst einer #Y $cc_duty_diplomatic_mission$#! oder im #Y diplomatischen Korps#! —, um über informelle Kanäle zu arbeiten."
 cc_bop_cannot_leave_at_war_tt: "Wir müssen #R im Frieden#! sein — ein Block schließt in Kriegszeiten die Reihen, und kein Mitglied darf seine Verbündeten verlassen, während es unter Waffen steht."

