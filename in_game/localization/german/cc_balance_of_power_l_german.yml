 # PANEL — IO shortcut
 # ============================================================
 CC_BOP_OPEN_IO_TT: "Öffne die Organisationsansicht dieses Blocks, in der die Aktionen und die Schatzkammer seines Anführers zu finden sind."

 # ============================================================
 # GAME RULE
 # ============================================================
 cc_balance_of_power_rule: "Das Gleichgewicht der Mächte"
 cc_balance_of_power_rule_desc: "Steuert, ob die Situation 'Europäisches Gleichgewicht der Mächte' ausgelöst werden kann."
 cc_balance_of_power_on: "Aktiviert"
 cc_balance_of_power_on_desc: "Die Situation des Gleichgewichts der Mächte tritt ein, sobald eine Großmacht die Doktrin des Gleichgewichts der Mächte übernimmt oder sobald die Ära der Revolutionen beginnt."
 cc_balance_of_power_off: "Deaktiviert"
 cc_balance_of_power_off_desc: "Die Situation des Gleichgewichts der Mächte wird niemals eintreten."

 # ============================================================
 # ADVANCE / REFORMS / PRIVILEGE
 # ============================================================
 cc_balance_of_power_advance: "Doktrin des Gleichgewichts der Mächte"
 cc_balance_of_power_advance_desc: "Die Kunst der Staatsführung reift zu einer Wissenschaft des Gleichgewichts heran: Bündnisse werden geschlossen und aufgelöst, Subsidien und Garantien gewährt, alles mit dem einzigen Ziel, zu verhindern, dass ein Rivale den Kontinent dominiert. Die erste Großmacht, die diese Doktrin übernimmt, läutet das Zeitalter des europäischen Mächtegleichgewichts ein. Schaltet die Reformen $cc_balancer_doctrine_reform$ und $cc_raison_detat_reform$ sowie das Privileg $ep_noble_diplomatic_corps$ frei."
 cc_balancer_doctrine_reform: "Doktrin des Ausgleichers"
 cc_balancer_doctrine_reform_desc: "Unsere Diplomatie ist auf die Aufrechterhaltung des Gleichgewichts ausgerichtet, was uns Ansehen und die diplomatische Reichweite verschafft, Koalitionen zu bilden, während gleichzeitig der Antagonismus abgeschwächt wird, den unsere Manöver provozieren."
 cc_raison_detat_reform: "Raison d'État"
 cc_raison_detat_reform_desc: "Die Politik wird vom kalten Kalkül staatlicher Interessen geleitet statt von dynastischen Gefühlen oder konfessioneller Loyalität, was unserer Staatskunst Flexibilität, Prestige und Widerstandsfähigkeit in langwierigen Konflikten verleiht."
 ep_noble_diplomatic_corps: "Adliges Diplomatenkorps"
 ep_noble_diplomatic_corps_desc: "Der Hochadel stellt und finanziert einen professionellen diplomatischen Dienst, besetzt die Botschaften Europas und erweitert die diplomatische Reichweite und den Ruf der Krone."

 # ============================================================
 # NEW END REASONS
 # ============================================================
 cc_bop_end_coalition: "Das Gleichgewicht hielt stand — die Koalition hat den aufstrebenden Hegemon in seine Schranken gewiesen."
 cc_bop_end_stagnation: "Der Moment des Prätendenten ist vorbei — überholt und in den Schatten gestellt, ist sein Streben in die Bedeutungslosigkeit verfallen."

 # ============================================================
 # THE RECKONING — ticker panel
 # ============================================================
 CC_BOP_RECKONING_HEADER: "Die Abrechnung"
 CC_BOP_HEGEMONY_TICKER_LABEL: "Der Weg zur Hegemonie"
 CC_BOP_HEGEMONY_TICKER_TT: "Jeden Monat, in dem der aufstrebende Hegemon einen Überhangsanteil von 65 oder mehr hält, steigt dieser Zähler; sinkt der Block darunter, fällt er wieder. Nach 60 Monaten ist das Gleichgewicht kurz vor dem Bruch – doch nur ein finaler Krieg kann dies entscheiden. Die Koalition ist gezwungen, ein letztes Mal standzuhalten; sollten sie siegen, wird der Sieg des Hegemons verhindert."
 CC_BOP_FINAL_WAR_LABEL: "#R Letzte Abrechnung — die Koalition leistet ihren letzten Widerstand.#!"
 CC_BOP_FINAL_WAR_TT: "Der Zähler ist voll. Die Situation wird erst enden, wenn ein letzter Krieg zwischen der Koalition und dem aufstrebenden Hegemon entschieden ist. Wenn der Hegemon noch immer dominiert, wenn die Waffen schweigen, bricht das Gleichgewicht endgültig; wenn die Koalition ihn jedoch zurückwirft, wird der Anspruch abgelehnt und der Wettstreit geht weiter."
 CC_BOP_COALITION_TICKER_LABEL: "Der Weg zur Eindämmung"
 CC_BOP_COALITION_TICKER_TT: "Jeden Monat, in dem die ausgleichende Koalition den Überhangsanteil des Aspiranten auf 35 oder weniger hält, steigt dieser Zähler. Nach 60 Monaten ist die Koalition bereit, den entscheidenden Schlag zu versetzen – vorausgesetzt, ihr Kongress hat sich den Gnadenstoß selbst genehmigt."
 CC_BOP_COALITION_WAR_LABEL: "#R Der Gnadenstoß — die Koalition versucht, den Prätendenten zu Fall zu bringen.#!"
 CC_BOP_STAGNATION_TICKER_LABEL: "Finsternis des Aspiranten"
 CC_BOP_STAGNATION_TICKER_TT: "Während der aufstrebende Hegemon im Mittelfeld stagniert und von einem Rivalen überholt wird, der in seinem Schatten aufgestiegen ist, steigt dieser Zähler. Bei 60 Monaten löst sich das Gleichgewicht einfach auf – kein entscheidender Sieger, der Moment des Prätendenten ist verloren."

 # ============================================================
 # RECKONING / DESPERATION / WAR-TOOL EVENTS
 # ============================================================
 cc_balance_of_power.77.title: "Der Aspirant wird gedemütigt"
 cc_balance_of_power.77.desc: "Es ist vollbracht. Die lange Arbeit der Koalition – die Subventionen, die Kongresse, das Blut, das in einem Dutzend Kampagnen vergossen wurde – hat endlich Früchte getragen. Die Macht, die nach der Vorherrschaft über den Kontinent griff, wurde an der Union ihrer Rivalen gebrochen und auf den Rang einer gewöhnlichen Großmacht zurückgestutzt. Das Gleichgewicht besteht fort, rehabilitiert, und unser Name mit ihm."
 cc_balance_of_power.77.a: "Europa atmet wieder auf."
 cc_balance_of_power.78.title: "Ein verlorener Moment"
 cc_balance_of_power.78.desc: "Der Moment ist verstrichen. Wir haben nach der Vorherrschaft über Europa gegriffen und nur die Leere erfasst; während wir zögerten und stagnierten, wuchsen andere, und nun überragt uns eine Macht, die in unserem eigenen Schatten emporstieg. Die Koalition muss keinen Schlag führen – unser Versuch ist einfach verblasst, und das Gleichgewicht löst sich auf, ohne dass wir in seinem Zentrum stünden."
 cc_balance_of_power.78.a: "Was hätte sein können."
 cc_balance_of_power.112.title: "Die letzte Abrechnung"
 cc_balance_of_power.112.desc_hegemony: "Die Waagschale ist so weit gekippt, wie sie es aushalten kann. Der aufstrebende Hegemon steht an der Schwelle zur Vorherrschaft, und die Höfe Europas wissen, dass die Frage nicht länger aufgeschoben werden kann. Die Koalition muss jetzt standhalten, in einem letzten Krieg — denn wenn der Koloss siegt, wird es keine zweite Chance geben, ihn zu stoppen."
 cc_balance_of_power.112.desc_coalition: "Die ausgleichende Koalition hat an Macht gewonnen, und der Moment ist gekommen, die Angelegenheit endgültig zu klären. Mit dem Mandat des Kongresses in der Hand unternehmen die Mächte Schritte, um den angehenden Hegemon in einem finalen, entscheidenden Krieg in seine Schranken zu weisen."
 cc_balance_of_power.112.a: "Also kommt es dazu."
 cc_balance_of_power.120.title: "Kassen zu leer"
 cc_balance_of_power.120.desc: "Unsere Gesandten überbrachten die Vorladung an den Hof unseres Verbündeten — und kehrten mit einer unbeantworteten Nachricht zurück. Der Preis, eine so große Macht in unseren Krieg zu ziehen, übersteigt das, was unsere Schatzkammer oder die Geduld des Blocks derzeit ertragen kann. Wir müssen unser Gold beiseitelegen und uns nach kleineren Schwertern umsehen oder warten."
 cc_balance_of_power.120.a: "Dann können wir sie uns nicht leisten."
 cc_balance_of_power.121.title: "Ein Kriegsschatz wird angelegt"
 cc_balance_of_power.121.desc: "Gold wurde diskret unter den widerwilligen Höfen unseres Blocks verteilt – Pensionen versprochen, Schulden erlassen, Hände geschmiert. Wenn wir sie das nächste Mal unter die Waffen rufen, wird der Ruf auf weitaus bereitwilligere Ohren stoßen, und zu einem Bruchteil der üblichen Kosten."
 cc_balance_of_power.121.a: "Lasst die Subventionen ihre Wirkung entfalten."
 cc_balance_of_power.122.title: "Der große Krieg"
 cc_balance_of_power.122.desc: "Wir werden nicht auf die Bequemlichkeit unserer Rivalen warten. Das gesamte Gewicht des Blocks ist versammelt, der Casus Belli verkündet und die Armeen gegen die ausgleichende Koalition in Bewegung gesetzt. Lassen wir die Angelegenheit zu unseren Bedingungen entscheiden, in einem Krieg unserer Wahl."
 cc_balance_of_power.122.a: "Vorwärts — zur Vorherrschaft."
 cc_balance_of_power.130.title: "Verzweifelte Maßnahmen"
 cc_balance_of_power.130.desc: "Der Schatten des Prätendenten fällt über den Kontinent, und die gewöhnlichen Instrumente der Staatskunst genügen nicht mehr. Der Kongress, nun mit ständigen Befugnissen ausgestattet, drängt uns zu extremen Maßnahmen. Das Gleichgewicht muss wiederhergestellt werden — koste es, was es wolle."
 cc_balance_of_power.130.a: "Kauft ein fremdes Schwert für den Krieg."
 cc_balance_of_power.130.b: "Rufen Sie eine allgemeine Mobilmachung innerhalb des Blocks aus."
 cc_balance_of_power.130.c: "Zögern wir ab – die Kosten sind zu hoch."
 cc_balance_of_power.131.title: "Der letzte Versuch"
 cc_balance_of_power.131.desc: "Der Koloss ist über uns hereingebrochen. Es gibt nun keine geschickte Diplomatie mehr, keinen Kongress zur Beratung – nur noch die Frage, wie wir unsere Stellung behaupten. Unser Volk blickt zu uns, und wir müssen mit Eisen antworten."
 cc_balance_of_power.131.a: "Verbrennt die Brücken — die Taktik der verbrannten Erde vor ihnen."
 cc_balance_of_power.131.b: "Rufen Sie eine große Levée ein — jede Hand an die Waffen."

 # ============================================================
 # NEW PREPONDERANT WAR-TOOL ACTIONS
 # ============================================================
 cc_bop_io_call_to_arms: "Ruf zu den Waffen"
 cc_bop_io_call_to_arms_desc: "Ziehen Sie ein Mitglied unseres Blocks in unseren Krieg gegen die Koalition. Die Goldkosten skalieren mit der Steuerbasis des Verbündeten – und verdoppeln sich mit jedem bereits in diesem Krieg herbeigerufenen Verbündeten – sodass in der Praxis nur ein oder zwei bezahlbar sind. Erfordert 20 Ambition. Ein bestehender Kriegsschatz halbiert die Kosten."
 cc_bop_io_war_chest: "Einen Kriegsschatz anlegen"
 cc_bop_io_war_chest_desc: "Verteilt im Voraus Subventionen an die zögerlichen Höfe unseres Blocks, was die Kosten unseres nächsten Aufrufs zu den Waffen halbiert. Erfordert 30 Ambition (verbraucht 30) und eine Goldsumme. Kann für 3 Jahre nicht wiederholt werden."
 cc_bop_io_grand_war: "Großer Krieg gegen die Koalition"
 cc_bop_io_grand_war_desc: "Ein finaler Schlag: Greife zuerst an. Erkläre selbst den Krieg gegen den Hauptausgleicher und setze die gesamte vorherrschende Macht des Blocks ein, um das Gleichgewicht stark zu unseren Gunsten zu verschieben. Erfordert 70 Ambition (verbraucht 60). Kann für 6 Jahre nicht wiederholt werden."

