 cc_balance_of_power: "Das Gleichgewicht der Mächte"
 cc_balance_of_power_desc: "Über Europa und den Nahen Osten hinweg betrachten sich die Großmächte misstrauisch. Während ein Staat nach Vorherrschaft strebt, schließen sich die anderen zusammen, um ihm diese zu verwehren – der aufstrebende Preponderanz-Block gegen die Balance-Koalition. Solange keine Seite triumphiert, bleibt das Gleichgewicht gewahrt; sollte es jedoch brechen, könnte ein neuer Herr über den Kontinent aufsteigen, der Osten nach Westen fluten oder eine Revolution die alte Ordnung vollständig hinwegfegen."
 hint_cc_balance_of_power: "Das Gleichgewicht der Mächte ist eine bipolare Großmachtsituation. Die stärkste berechtigte Macht führt den Vorherrschenden Block; die stärkste Macht, die diesen fürchtet, führt die Ausgleichskoalition. Der Vorherrschungsanteil (0-100, 50 = Gleichgewicht) misst, wie dominant der führende Block geworden ist. Höfe können durch Verwandtschaft, Glauben, Angst, Drohungen oder Gold zwischen den Blöcken hin- und hergewogen werden; die Koalition kann schwächere Mitglieder subventionieren, Neutrale werben und einen Kongress einberufen, um die Reihen zu schließen. Die Situation endet, wenn das Gleichgewicht bricht – durch Hegemonie, eine Sintflut aus dem Osten oder eine Revolution – oder wenn es als dauerhaftes Konzert Europas bewahrt wird."

