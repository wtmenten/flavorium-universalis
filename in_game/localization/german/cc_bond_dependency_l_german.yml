l_german:
 # === cc_bonds.50 — The Royal Visit ===
 cc_bonds.50.title: "Der königliche Besuch"
 cc_bonds.50.desc: "Wir haben die Nachricht erhalten, dass [bond_subj.GetName] Vorbereitungen für einen offiziellen Empfang getroffen hat – ihr Volk erwartet eine Geste der Krone. Das Regierungshaus des Abhängigen hat über diplomatische Kanäle angedeutet, dass ein persönlicher Besuch über Generationen hinweg in Erinnerung bleiben würde. Ein königlicher Gesandter wäre angemessen. Ein formeller Brief würde die Verpflichtung technisch gesehen erfüllen. Der Unterschied ist beträchtlich."
 cc_bonds.50.a: "Treten Sie die Reise persönlich an. Dies ist wichtig."
 cc_bonds.50.b: "Einen königlichen Gesandten mit entsprechendem Zeremoniell entsenden."
 cc_bonds.50.c: "Ein formaler Brief wird dem Zweck genügen."

 # === cc_bonds.51 — Dependency Trade Preferences ===
 cc_bonds.51.title: "Handelspräferenzen der Abhängigkeit"
 cc_bonds.51.desc: "Unsere Handelsberater haben uns darauf aufmerksam gemacht, dass die aktuellen kommerziellen Vereinbarungen mit [bond_subj.GetName] nicht formal definiert sind – sie haben sich organisch entwickelt und funktionieren recht gut, lassen aber wichtige Entscheidungen über die Einnahmen offen. Drei Optionen wurden entworfen. Die profitabelste für die Krone ist zugleich die belastendste für die Abhängigkeit."
 cc_bonds.51.a: "Legen Sie günstige Handelsbedingungen für die Abhängigkeit fest."
 cc_bonds.51.b: "Formalisiere gleichberechtigte Bedingungen. Gegenseitiger Nutzen, gleicher Status."
 cc_bonds.51.c: "Legen Sie Bedingungen fest, die die Einnahmen der Krone maximieren."

 # === cc_bonds.52 — Royal Family Ceremony ===
 cc_bonds.52.title: "Zeremonie der königlichen Familie"
 cc_bonds.52.desc: "Ein bedeutendes königliches Ereignis wird geplant – ein Krönungsjubiläum, eine Taufe, eine Hochzeit oder ein Staatsbankett. Die Regierungsfamilie von [bond_subj.GetName] hat eine diskrete Anfrage bezüglich ihrer erwarteten Rolle gestellt. Sie haben an jedem dieser Anlässe teilgenommen, soweit man sich erinnern kann. Ob sie prominent, marginal oder gar nicht erscheinen, sendet ein klares Signal darüber aus, wie wir die Beziehung betrachten."
 cc_bonds.52.a: "Behandeln Sie ihre Delegation mit besonderer Aufmerksamkeit. Sie sind in jeder Hinsicht Familie, nur ohne den Namen."
 cc_bonds.52.b: "Eine rein formale Einladung aussprechen. Sie sind willkommen, sofern sie ihren Platz kennen."
 cc_bonds.52.c: "Der Anlass ist eine interne Angelegenheit der Krone. Es erfolgt keine Einladung."

 # === cc_bonds.53 — Dependency Faces External Threat ===
 cc_bonds.53.title: "Abhängigkeit ist externer Bedrohung ausgesetzt"
 cc_bonds.53.desc: "Eine Depesche aus [bond_subj.GetName] bringt alarmierende Nachrichten. Eine benachbarte Macht – eine mit langjährigen territorialen Ambitionen in der Region – hat Truppen in Richtung der Grenzen des Abhängigkeitsgebiets bewegt. Die eigenen Streitkräfte des Gebiets sind begrenzt. Ihr Schreiben ist vorsichtig und vermeidet Flehen, aber die Botschaft ist klar: Sie schauen zu uns und beobachten, wie wir reagieren."
 cc_bonds.53.a: "Sende unsere Streitkräfte sofort. Sie stehen unter unserem Schutz."
 cc_bonds.53.b: "Finanziere und verstärke ihre Verteidigung ohne direkte Intervention."
 cc_bonds.53.c: "Sie müssen dies selbst regeln. Wir haben unsere eigenen Sorgen."

 # === cc_bonds.54 — The Dependency's Cultural Festival ===
 cc_bonds.54.title: "Das Kulturfestival der Abhängigkeit"
 cc_bonds.54.desc: "Ein bedeutendes Kulturfestival steht in [bond_subj.GetName] bevor – eine Feier, die nach ihrer Tradition die Kontinuität der Identität und Geschichte ihres Volkes markiert. Das regierende Haus hat eine Einladung ausgesprochen. Das Festival ist eine Gelegenheit: man kann als Teil ihres Erbes wahrgenommen werden, als jemand, der es aus der Ferne respektiert, oder als jemand, der zu beschäftigt ist, um teilzunehmen."
 cc_bonds.54.a: "Sponsere das Festival großzügig. Wir feiern gemeinsam mit ihnen."
 cc_bonds.54.b: "Persönlich teilnehmen, ohne die Veranstaltung zu dominieren."
 cc_bonds.54.c: "Einen Brief mit Glückwünschen und Bedauern senden."
 cc_bonds.54.d: "Wir können zu ihren lokalen Angelegenheiten nichts beitragen."

 # === cc_bonds.55 — The Dependency Wants Voice in Succession ===
 cc_bonds.55.title: "Die Abhängigkeit will ein Mitspracherecht bei der Thronfolge"
 cc_bonds.55.desc: "Das Regierungshaus von [bond_subj.GetName] hat eine formelle Petition eingereicht. Sie wünschen, bei allen Nachfolgevereinbarungen, die sie materiell betreffen würden, konsultiert zu werden – nicht um zu wählen, betonen sie, sondern um gehört zu werden. Ihr Argument ist das der Kontinuität und des gegenseitigen Interesses. Unsere Berater sind gespalten. Einige sehen dies als eine völlig vernünftige Bitte eines loyalen Partners. Andere sehen einen Präzedenzfall, der, einmal geschaffen, nicht leicht wieder rückgängig gemacht werden kann."
 cc_bonds.55.a: "Gewähre Konsultationsrechte. Ihre Stimme zählt in Angelegenheiten, die sie betreffen."
 cc_bonds.55.b: "Biete eine beratende Rolle an. Man wird ihnen Gehör schenken, doch die Entscheidung liegt bei uns."
 cc_bonds.55.c: "Ablehnen. Die Thronfolge ist ein Vorrecht der Krone und kein Gegenstand von Konsultationen."
