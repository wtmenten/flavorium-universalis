l_german:
 # ============================================================
 # Cabinet Events Localization
 # cc_cabinet.1–52
 # ============================================================


 # cc_cabinet.5 — The Minister Responds to Refusal
 cc_cabinet.5.title: "Der Minister reagiert auf die Ablehnung"
 cc_cabinet.5.desc: "Der Minister, den wir abgelehnt haben, hatte Monate Zeit, über die Entscheidung nachzudenken. Nun treten die Konsequenzen ein."
 cc_cabinet.5.a: "Der Minister hat sich in mürrische Distanz zurückgezogen. Seine Unkooperativität erschwert Widerrufe. (−prestige, revoke cost +)"
 cc_cabinet.5.b: "Der Minister fand andere Wege, sich zu bereichern. Die Schatzkammer hat stillschweigend darunter gelitten. (−gold)"
 cc_cabinet.5.c: "Der Minister wandte sich an die Adelsstände und gewann deren Gunst gegen die Interessen der Krone. (Noble satisfaction +, Burgher satisfaction −)"

 # cc_cabinet.50 — The Snubbed Estate Retaliates
 cc_cabinet.50.title: "Der herabgesetzte Stand hat nicht vergessen"
 cc_cabinet.50.desc: "Wir erfahren, dass der Stand, der bei unseren jüngsten höfischen Regelungen übergangen wurde, seinen Groll sehr sorgfältig gehegt hat. Wir werden daran erinnert, dass Geduld und Groll oft gleich aussehen, bis sie es nicht mehr tun."
 cc_cabinet.50.a: "Biete eine Versöhnung an. (−3× Einkommen)"
 cc_cabinet.50.b: "Lassen wir sie vor sich hin brodeln."

 # cc_cabinet.52 — The Minister's Idle Influence (standard)
 cc_cabinet.52.title: "Der müßige Einfluss des Ministers"
 cc_cabinet.52.desc: "Die Monate, in denen der Minister unbeaufsichtigt war, haben das Reich im Stillen geformt. Die Einzelheiten kommen nun ans Licht – zu spät, um sie zu ändern, aber deutlich genug, um sie zu berücksichtigen."
 cc_cabinet.52.a: "Die Verbindungen des Ministers führen zu einem bescheidenen Windfall. (+2× monthly income)"
 cc_cabinet.52.b: "Das zurückhaltende Auftreten des Ministers hat die stillschweigende Zustimmung eines Standes gewonnen. (Ständezufriedenheit +)"
 cc_cabinet.52.c: "Die Unternehmungen des Ministers bringen kaum etwas von Wert hervor. (−2× monatliches Einkommen)"
 cc_cabinet.52.d: "Die nicht genehmigten Geschäfte des Ministers haben die falschen Leute vor den Kopf gestoßen. (Ständezufriedenheit −)"

 # cc_cabinet.53 — The Minister's Subtle Gambit (skilled / diplomatic minister)
 cc_cabinet.53.title: "Das subtile Gambit des Ministers"
 cc_cabinet.53.desc: "Ein Minister von bemerkenswertem diplomatischem Talent sitzt selten untätig herum. Kontakte wurden vertieft, Gefallen ausgetauscht und Vereinbarungen getroffen, ohne dass Sie davon direkt wussten. Die Ergebnisse treffen nun ein – der Minister hat seine Spuren hinterlassen."
 cc_cabinet.53.a: "Die Handelsverbindungen des Ministers werfen einen Gewinn ab. (+3× monatliches Einkommen, +Prestige)"
 cc_cabinet.53.b: "Der Minister hat diplomatische Türen zu einer benachbarten Macht geöffnet. (+mutual opinion, +prestige)"
 cc_cabinet.53.c: "Die subtile Arbeit des Ministers erweitert im Stillen unsere diplomatische Reichweite. (Einfluss-Modifikator, 8 Jahre)"
 cc_cabinet.53.d: "Der Minister hat sich überschätzt – das Gambit ist nach hinten losgegangen. (−prestige, nobles satisfaction −)"

 # cc_cabinet.54 — Idle Hands in Troubled Times (restless estates)
 cc_cabinet.54.title: "Müßiggänger in unruhigen Zeiten"
 cc_cabinet.54.desc: "Du hast dem Minister genau in dem Moment Spielraum gelassen, als die Stände unruhig wurden. Ob durch List oder Nachlässigkeit, der Minister hat sich in den schwelenden Spannungen verfangen — seine Entscheidungen wirken sich nun auf die Krone aus."
 cc_cabinet.54.a: "Der Minister besänftigt stillschweigend den unruhigen Stand. (Estate satisfaction +, +prestige)"
 cc_cabinet.54.b: "Der Minister nutzt die Unruhen zum Vorteil der Krone. (+3× monthly income, investment modifier)"
 cc_cabinet.54.c: "Die Einmischung des Ministers verschärft die Spannungen weiter. (Ständezufriedenheit −, −Prestige)"
