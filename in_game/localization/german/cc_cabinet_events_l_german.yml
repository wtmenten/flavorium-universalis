l_german:
 # ============================================================
 # Cabinet Events Localization
 # cc_cabinet.1–52
 # ============================================================


 # cc_cabinet.5 — The Minister Responds to Refusal
 cc_cabinet.5.title: "Der Minister reagiert auf die Ablehnung"
 cc_cabinet.5.desc: "Der Minister, den wir abgelehnt haben, hatte Monate Zeit, über die Entscheidung nachzudenken. Nun treten die Konsequenzen ein."
 cc_cabinet.5.a: "Der Minister hat sich in mürrische Distanz zurückgezogen. Seine Unkooperativität erschwert Widerrufe. (−prestige, revoke cost +)"
 cc_cabinet.5.b: "Der Minister fand andere Wege, sich zu bereichern. Die Schatzkammer hat stillschweigend darunter gelitten. (−gold)"
 cc_cabinet.5.c: "Der Minister wandte sich an die Adelsstände und gewann deren Gunst gegen die Interessen der Krone. (Noble satisfaction +, Burgher satisfaction −)"

 # cc_cabinet.50 — The Snubbed Estate Retaliates
 cc_cabinet.50.title: "Der herabgesetzte Stand hat nicht vergessen"
 cc_cabinet.50.desc: "Wir erfahren, dass der Stand, der bei unseren jüngsten höfischen Regelungen übergangen wurde, seinen Groll sehr sorgfältig gehegt hat. Wir werden daran erinnert, dass Geduld und Groll oft gleich aussehen, bis sie es nicht mehr tun."
 cc_cabinet.50.a: "Eine Versöhnung anbieten."
 cc_cabinet.50.b: "Lassen wir sie vor sich hin brodeln."

 # cc_cabinet.52 — The Minister's Idle Influence (standard)
 cc_cabinet.52.title: "Der müßige Einfluss des Ministers"
 cc_cabinet.52.desc: "Die unbeaufsichtigten Monate des Ministers haben das Reich im Stillen geformt. Die Details kommen nun ans Licht – zu spät, um sie zu ändern, aber deutlich genug, um sie zu berücksichtigen."
 cc_cabinet.52.a: "Ihre Verbindungen führen zu einem bescheidenen Windfall."
 cc_cabinet.52.b: "Ihr diskretes Vorgehen hat die Zustimmung eines Standes gewonnen."
 cc_cabinet.52.c: "Ihre Unternehmungen bringen wenig ein."
 cc_cabinet.52.d: "Ihre nicht genehmigten Geschäfte haben die falschen Leute vor den Kopf gestoßen."

 # cc_cabinet.53 — The Minister's Subtle Gambit (skilled / diplomatic minister)
 cc_cabinet.53.title: "Das subtile Gambit des Ministers"
 cc_cabinet.53.desc: "Ein Minister von bemerkenswertem diplomatischem Talent bleibt selten untätig. Kontakte wurden vertieft, Gefallen ausgetauscht und Vereinbarungen getroffen, ohne dass Sie direkt davon wussten. Die Ergebnisse zeigen sich nun, und der Minister hat seine Spuren hinterlassen."
 cc_cabinet.53.a: "Ihre Handelsverbindungen werfen einen Gewinn ab."
 cc_cabinet.53.b: "Sie haben Türen zu einer benachbarten Macht geöffnet."
 cc_cabinet.53.c: "Ihre stille Arbeit erweitert unsere diplomatische Reichweite."
 cc_cabinet.53.d: "Sie haben sich verspielt, und das Wagnis ist nach hinten losgegangen."

 # cc_cabinet.54 — Idle Hands in Troubled Times (restless estates)
 cc_cabinet.54.title: "Müßiggänger in unruhigen Zeiten"
 cc_cabinet.54.desc: "Sie haben dem Minister genau in dem Moment Spielraum gelassen, als die Stände unruhig wurden. Ob durch List oder Nachlässigkeit, der Minister hat sich in den Spannungen verfangen, und seine Entscheidungen erreichen nun die Krone."
 cc_cabinet.54.a: "Sie besänftigen im Stillen den unruhigen Stand."
 cc_cabinet.54.b: "Sie nutzen die Unruhen zum Vorteil der Krone."
 cc_cabinet.54.c: "Ihre Einmischung verschärft die Spannungen weiter."
