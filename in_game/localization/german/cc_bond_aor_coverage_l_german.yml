l_german:
 # === cc_bonds.150 — The Client Regime Holds ===
 cc_bonds.150.title: "Das Klientelregime hält stand"
 cc_bonds.150.desc: "Klientelregierungen sind das Erste, was ein Zeitalter wie dieses beseitigt, und [bond_subj.GetName] wurde nicht beseitigt. Die Männer, die wir eingesetzt haben, sitzen noch in ihren Ämtern, unterzeichnen noch unsere Korrespondenz und können anscheinend immer noch durch ihre eigene Hauptstadt gehen. Was auch immer wir in den Jahrzehnten der stillen Verwaltung getan haben, es hat ein Regime hervorgebracht, das eine eigene Wählerschaft besitzt, statt nur einer Garnison und einer Gehaltsliste."
 cc_bonds.150.desc.deep: "Die Regierung von [bond_subj.GetName] hat ein Jahr überstanden, das drei ihrer Nachbarn stürzte, und sie tat dies, ohne uns um Truppen zu bitten. Ihre Minister traten öffentlich auf und plädierten für diese Vereinbarung, und genug Menschen fanden die Argumente überzeugend. Ein Klientenstaat, der sich politisch selbst verteidigen kann, ist kein echter Klientenstaat mehr. Er ist ein Verbündeter, der uns zufällig Geld schuldet."
 cc_bonds.150.a: "Ändere nichts. Das Arrangement funktioniert."
 cc_bonds.150.b: "Gebt ihm eine formale Grundlage. Es benötigt unsere Garnison nicht mehr."

 # === cc_bonds.151 — The Client Regime Falls ===
 cc_bonds.151.title: "Das Klientelregime stürzt"
 cc_bonds.151.desc: "Die Regierung von [bond_subj.GetName] hat die Kontrolle über ihre eigene Hauptstadt verloren. Unsere Minister berichten aus einem Landhaus vor den Toren der Stadt, was eine diplomatische Art zu sagen ist, dass sie diese verlassen haben. Das Regime, das wir installierten, gewann nie eine Anhängerschaft jenseits der Büros, für die wir bezahlten, und in einem Jahr, in dem solche Dinge ins Gewicht fallen, ist dieser Mangel zur gesamten Geschichte geworden."
 cc_bonds.151.desc.deep: "Es gibt in [bond_subj.GetName] keine Regierung mehr, die uns gegenüber rechenschaftspflichtig ist. Das Ministerium wurde von einer Menge aufgelöst, unser Resident hat einen sicheren Geleitgang zur Grenze erhalten, und die Männer, die nun Proklamationen herausgeben, zitieren die Bedingungen unseres eigenen Klientelvertrags als Beweis dafür, was man ihnen angetan hat. Man verhandelt nicht mit uns. Wir werden als Argument benutzt."
 cc_bonds.151.desc.scholar: "Die Männer, die [bond_subj.GetName] nun regieren, sind die Schüler des Gelehrten, den wir zum Schweigen gebracht hatten. Er lebte nicht lange genug, um dies zu sehen, was in mehreren Proklamationen erwähnt wird. Die Unterdrückung des Arguments vor Jahrzehnten hat es nicht gelöst; sie hat nur garantiert, dass das Argument, als es schließlich siegte, mit unserem Namen auf der falschen Seite siegen würde."
 cc_bonds.151.a: "Stützt es wieder auf. Was auch immer das jetzt kostet."
 cc_bonds.151.b: "Installiert eine neue. Diesmal mit einer Garnison dahinter."
 cc_bonds.151.c: "Verleugne es. Es war die Glaubwürdigkeit nie wert."

 # === cc_bonds.152 — The Council Seat Proves Its Worth ===
 cc_bonds.152.title: "Der Ratssitz erweist sich als wertvoll"
 cc_bonds.152.desc: "Als wir [bond_subj.GetName] in den Kaiserrat aufnahmen, war es eine Geste, und Gesten sind billig. Das ist es nicht mehr geblieben. Ihr Delegierter hat diese Sitzungsperiode damit verbracht, unsere Position gegenüber wankenden Mitgliedern zu verteidigen – mit der Begründung, dass dies nun auch seine eigene Position sei. Ein Platz am Tisch erweist sich als eine dauerhafte Sache, wenn man ihn jemandem gibt."
 cc_bonds.152.desc.deep: "Der Delegierte aus [bond_subj.GetName] hat in dieser Sitzungsperiode mehr getan, als nur mit uns zu stimmen. Er hat den Rat in einem Monat zusammengehalten, in dem er leicht hätte zerfallen können, vermittelte zwischen zwei Mitgliedern, die nicht direkt mit uns sprachen, und stellte das Ganze so dar, als würde der Rat sich selbst regieren und nicht die Krone den Rat. Was genau das ist, was wir erreichen wollten, und womit wir nicht vollständig gerechnet hatten."
 cc_bonds.152.a: "Lasst den Rat die Einigung herbeiführen. Dafür ist er da."
 cc_bonds.152.b: "Hebt sie zu einem vollwertigen föderalen Partner empor. Sie haben sich den Rest verdient."

 # === cc_bonds.153 — The Council Seat Was Never Enough ===
 cc_bonds.153.title: "Der Ratssitz war nie genug"
 cc_bonds.153.desc: "Der Delegierte von [bond_subj.GetName] hat in einer Sitzung, die wir nicht vertagen konnten, genau dargelegt, was der Ratssitz wert ist. Er kann sprechen, und er hat gesprochen, und nichts ist daraus gefolgt. Er bittet nicht um mehr Redezeit. Er fragt, wozu der Sitz gut ist, und die ehrliche Antwort ist eine, die wir lieber nicht öffentlich geben würden."
 cc_bonds.153.desc.deep: "Die Delegation von [bond_subj.GetName] ist aus dem Rat zurückgetreten und hat ihre Gründe veröffentlicht. Das Dokument ist sachlich und zählt jede Motion auf, die sie über vierzig Jahre hinweg eingebracht haben, jeweils mit der Abstimmung und dem Ergebnis daneben. Das Muster ist nicht schmeichelhaft. Sie haben der Institution mehr Vertrauen geschenkt als wir ihnen, und sie haben dies nun vor jedem anderen Mitglied beendet."
 cc_bonds.153.a: "Erweitern Sie den Platz zu einem echten Machtanteil."
 cc_bonds.153.b: "Erinnert sie daran, was der Sitz war: eine Höflichkeit, kein Recht."

 # === cc_bonds.154 — One Nation, Two Languages ===
 cc_bonds.154.title: "Eine Nation, zwei Sprachen"
 cc_bonds.154.desc: "[bond_subj.GetName] kam zu uns, sprach eine andere Sprache und betete anders, und wir haben das nie gelöst. In einer Zeit, in der Identität das Argument ist, über das alle streiten, hat sich das Ungelöste als Vorteil erwiesen. Ihr Volk muss sich nicht zwischen dem entscheiden, was es ist, und dem, was wir sind, also entscheiden sie nicht. Die Revolutionäre anderswo finden dies eine schwierige Provinz, in der man arbeiten kann."
 cc_bonds.154.desc.deep: "Die Einigung in [bond_subj.GetName] hat so vollständig Bestand, dass sie begonnen hat, ins Gegenteil umzuschlagen. Ihre Gerichte funktionieren in zwei Sprachen, und niemand bemerkt es. Ihr niederes Adel sendet Söhne an unsere Akademien, und wir senden Söhne zurück. Als die revolutionären Pamphlete eintrafen und einer Nation für jedes Volk versprachen, kam das Argument nicht gut an, denn die Frage, wessen Nation dies sei, wurde hier vor zwei Generationen auf eine Weise beantwortet, die alle zufriedenstellte."
 cc_bonds.154.desc.scholar: "Der Gelehrte, den wir förderten, schuf das Werk, das dies ermöglichte: ein Korpus in ihrer Sprache, das die Union als eigenes Thema und nicht als Aufzwingung behandelt. Ihre Schulen lehren es. Unsere haben damit begonnen. Als die Pamphlete eintrafen, die fragten, ob ein Volk zu einem Imperium gehören kann, ohne aufzuhören, ein Volk zu sein, besaß [bond_subj.GetName] bereits eine ganze Bibliothek an Antworten."
 cc_bonds.154.a: "Lasst es so, wie es ist. Es funktioniert, weil niemand es gesetzlich geregelt hat."
 cc_bonds.154.b: "Schreiben Sie es in Gesetz, und lassen Sie die Adligen klagen."

 # === cc_bonds.155 — The Old Language Comes Back ===
 cc_bonds.155.title: "Die alte Sprache kehrt zurück"
 cc_bonds.155.desc: "Die Assimilationsgesetze wurden in [bond_subj.GetName] so lange durchgesetzt, wie eine Durchsetzung möglich war, und dies ist das Jahr, in dem es nicht mehr möglich war. Die alte Sprache ist zurück in den Gerichtssälen, den Schulen und Druckereien, und sie ist zornig zurückgekehrt. Was wir unterdrückt haben, ist nicht verschwunden; es hat gewartet und sich einen Grund zur Beschwerde zugelegt."
 cc_bonds.155.desc.deep: "[bond_subj.GetName] hat unsere Statuten ohne uns zu konsultieren aufgehoben, was eine Befugnis ist, die es nicht besitzt. Beschilderung, Liturgie, Gerichtsakten und Lehrpläne wurden innerhalb einer Saison zurückgenommen, und die Geschwindigkeit lässt darauf schließen, dass der Apparat für die Umkehrung längst zusammengestellt und bereitgehalten wurde. Das revolutionäre Zeitalter hat dies nicht erschaffen. Es hat lediglich den letzten Grund entfernt, weiter zu warten."
 cc_bonds.155.desc.faith: "Die alten Riten und die alte Sprache sind gemeinsam nach [bond_subj.GetName] zurückgekehrt, so wie sie es immer getan hätten. Die von uns angeordnete Konversion wurde befolgt, aber nie akzeptiert, und der Klerus, der sie vollzog, ist derselbe, der sie nun rückgängig macht, mit den Registern als Beweis, dass auch sie nie daran glaubten. Glaube und Sprache sind hier ein einziger Groll, und wir haben ihn mit einem einzigen Schlag geschaffen."
 cc_bonds.155.desc.scholar: "Das Wiedererwachen in [bond_subj.GetName] wird von der Presse angeführt, die der unterdrückte Gelehrte gründete und die wir in der Theorie, sie sei harmlos, weiterbetreiben ließen. Vierzig Jahre lang druckte sie Wörterbücher und Grammatiken. In einer Zeit, in der Sprache zu einer politischen Frage geworden ist, stellte sich heraus, dass vierzig Jahre stiller Philologie das Effektivste waren, was jemals jemand in dieser Provinz getan hat."
 cc_bonds.155.a: "Hebt die Statuten auf. Sie waren ihren Preis nie wert."
 cc_bonds.155.b: "Setze sie strenger durch. Gesetz ist Gesetz."

