 cc_office.10.title: "Die Haushaltsrechnungen"
 cc_office.10.desc: "Sie haben die Haushaltsbücher geprüft. Seit Jahren versickert Geld in den Küchen und Ställen, und die Personen, die es nehmen, sind bestens vernetzt."
 cc_office.10.a: "Beende es, wen auch immer es kränkt."
 cc_office.10.b: "Still und ohne Namen."
 cc_office.10.c: "Lass sie den Haushalt reorganisieren."
 cc_office.11.title: "Ein Streit um den Rang"
 cc_office.11.desc: "Sie liegen mit den großen Familien im Streit darüber, wer am Hofe zuerst schreitet, und beide Seiten erwarten, dass die Krone dies schlichtet."
 cc_office.11.a: "Unterstützen Sie den Offizier."
 cc_office.11.b: "Unterstützen Sie die Familien."
 cc_office.11.c: "Ihre langjährigen Dienste klären die Sache."
 cc_office.12.title: "Eine Predigt am Hofe"
 cc_office.12.desc: "Sie predigten vor dem gesamten Hof, und die Predigt wird in jeder Kirche der Hauptstadt wiederholt."
 cc_office.12.a: "Drucken lassen."
 cc_office.12.b: "Eine gute Predigt. Nichts weiter."
 cc_office.12.c: "Es im ganzen Reich predigen lassen."
 cc_office.13.title: "Eine Gewissensfrage"
 cc_office.13.desc: "Sie haben sich geweigert, eine Entscheidung der Krone zu unterstützen, und sagen dies offen."
 cc_office.13.a: "Überstimme sie."
 cc_office.13.b: "Nachgeben."
 cc_office.13.c: "Sie haben sich eine Audienz verdient."
 cc_office.14.title: "Petitionen häufen sich"
 cc_office.14.desc: "Die Petitionen an die Krone häufen sich in ihrem Büro schneller, als sie gelesen werden können."
 cc_office.14.a: "Befreien Sie sie, egal wie lange es dauert."
 cc_office.14.b: "Lass sie warten."
 cc_office.14.c: "Das Verfahren reformieren lassen."
 cc_office.15.title: "Eine Inspektion der Ämter"
 cc_office.15.desc: "Sie wollen jedes unterstellte Amt inspizieren, und die Schreiber haben davon gehört."
 cc_office.15.a: "Überprüfe sie alle."
 cc_office.15.b: "Eine Warnung genügt."
 cc_office.15.c: "Vertrauen Sie darauf, dass sie wissen, wo sie suchen müssen."
 cc_office.16.title: "Ein Fest am Hofe"
 cc_office.16.desc: "Sie schlagen ein Fest nach alter Art vor, mit Musik, Theaterstücken und reichlich Essen."
 cc_office.16.a: "Spare nicht an den Kosten."
 cc_office.16.b: "Halte es bescheiden."
 cc_office.16.c: "Lass sie es regeln."
 cc_office.17.title: "Eine ausländische Mode"
 cc_office.17.desc: "Sie haben eine Mode aus dem Ausland übernommen, und die Hälfte des Hofes ist gefolgt. Die andere Hälfte ist beleidigt."
 cc_office.17.a: "Führen Sie es am Hofe ein."
 cc_office.17.b: "Verbieten."
 cc_office.17.c: "Sie wissen, was Bestand hat."
 cc_office.18.title: "Nachrichten von der Grenze"
 cc_office.18.desc: "Sie bringen Neuigkeiten aus den Grenzprovinzen: Unruhen, schlechte Ernten und Beamte, nach denen seit Jahren niemand mehr gesehen hat."
 cc_office.18.a: "Handeln Sie sofort."
 cc_office.18.b: "Für später aufbewahren."
 cc_office.18.c: "Schicke sie, um sich darum zu kümmern."
 cc_office.19.title: "Die Provinznotabeln"
 cc_office.19.desc: "Sie haben eine Delegation von Provinznotabeln an den Hof gebracht, die gehört werden wollen."
 cc_office.19.a: "Empfange sie mit Ehre."
 cc_office.19.b: "Schicke sie nach Hause."
 cc_office.19.c: "Sie kennen diese Leute."
