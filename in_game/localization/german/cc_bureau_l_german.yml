l_german:
 # The bureau system: the Order/Magnates axis, the thread, the steward duty, the privileges and
 # the two reforms.
 #
 # VOICE. The court speaking, not the manual. Numbers and thresholds live in the modifier
 # descriptions and the trigger tooltips, which is where a player goes looking for them; the
 # event bodies describe what is happening in the realm.

 # ---- The societal value ----
 cc_order_vs_cc_magnates: "Ordnung und die Magnaten"
 cc_order_focus: "Ordnung"
 cc_magnates_focus: "Magnaten"

 MODIFIER_TYPE_NAME_monthly_towards_cc_order: "Monatlicher Fortschritt zur Ordnung"
 MODIFIER_TYPE_DESC_monthly_towards_cc_order: "Dies beeinflusst die Veränderung hin zum [societal_value|e] der [ShowSocietyDirectionName('cc_order')]."
 MODIFIER_TYPE_NAME_monthly_towards_cc_magnates: "Monatlicher Fortschritt zu den Magnaten"
 MODIFIER_TYPE_DESC_monthly_towards_cc_magnates: "Dies beeinflusst die Veränderung hin zum [societal_value|e] der [ShowSocietyDirectionName('cc_magnates')]."

 # Shown in a bureaucracy's negative modifier tooltip, where the extra entrenchment factor is
 # applied. See zzz_cc_vanilla_bureau_overrides.txt for why the malus side is scaled twice.
 CC_BUREAU_ENTRENCHMENT_SCALE: "Verfestigung"

 # ---- The cabinet duty ----
 cc_duty_bureau_steward: "Verwalter eines Bureaus"
 cc_duty_bureau_steward_desc: "Setzen Sie einen Minister an die Spitze eines Amtes und lassen Sie ihn dort leben.\n\nEr erfährt, was es kostet – was sich am Hofe nie jemand die Mühe gemacht hat herauszufinden – und innerhalb eines Jahres führt er es für weniger, als die Schatzkammer budgetiert hatte. Er ist dann zudem der einzige Mann, der das System versteht."
 cc_duty_bureau_steward_select: "Welches Amt?"

 # ---- .1  A new bureau ----
 cc_bureau.1.title: "Der Apparat"
 cc_bureau.1.desc: "Der Befehl ist unterzeichnet und die Räumlichkeiten sind gefunden. Was bleibt, ist der Teil, den niemand aufschreibt: wer in ihnen sitzt.\n\nEs mangelt nicht an Kandidaten. Es mangelt an Kandidaten, die die Arbeit erledigen können und keinen Grund haben, jemandem dankbar zu sein – und der Hof hat in seiner gesamten Geschichte nie mehr als eine Handvoll solcher Leute gleichzeitig hervorgebracht."
 cc_bureau.1.desc_venal: "Der Befehl ist unterzeichnet, und drei verschiedene Familien haben bereits angefragt, um welche Ernennungen es sich handelt. Zwei von ihnen haben bereits Summen beigefügt.\n\nDies ist keine Korruption, wie man das Wort hier verstehen würde. Es ist schlichtweg die Art und Weise, wie Ämter seit einer Generation besetzt werden, und die Männer, die diese Briefe schreiben, wären aufrichtig verwundert, wenn man es anders nennen würde."
 cc_bureau.1.a: "Besoldete Schreiber. Sie werden ihre Stelle dem Posten selbst verdanken."
 cc_bureau.1.b: "Die jüngeren Söhne der großen Häuser."
 cc_bureau.1.c: "Verkaufen Sie die Ernennungen. Die Schatzkammer braucht das Geld."

 # ---- .10  A bureau is dissolved ----
 cc_bureau.10.title: "Das Amt aufgelöst"
 cc_bureau.10.desc: "Das Amt ist geschlossen, und die Frage ist, was aus vierzig Männern wird, die ihr gesamtes Berufsleben darin verbracht haben.\n\nSie sind keine bedeutenden Männer. Einige von ihnen sind die einzigen lebenden Menschen, die wissen, wie eine bestimmte Sache erledigt wird, und keiner von ihnen wurde gefragt, um welche bestimmte Sache es sich handelt."
 cc_bureau.10.desc_sold: "Das Amt ist geschlossen, und die Männer darin hatten für ihre Stellen bezahlt.\n\nNiemand am Hof war in der Lage, eine klare Antwort darauf zu geben, ob dieses Geld zurückerstattet werden muss. Die Schreiber haben ihre eigene Meinung dazu, sie haben diese sorgfältig niedergeschrieben, und einer von ihnen hat bereits einen Anwalt aufgesucht."
 cc_bureau.10.a: "Findet für sie an anderer Stelle einen Platz."
 cc_bureau.10.b: "Danken Sie ihnen und lassen Sie sie gehen."
 cc_bureau.10.c: "Macht aus dem Schlimmsten von ihnen ein Exempel."

 # ---- .20  The offices find their own income ----
 cc_bureau.20.title: "Die Rückstände"
 cc_bureau.20.desc: "Die Beamten wurden schon seit einiger Zeit nicht mehr vollständig bezahlt. Sie haben jedoch nicht aufgehört zu arbeiten, was die Schatzkammer stillschweigend als Beweis dafür gewertet hat, dass das Gehalt nie der entscheidende Punkt war.\n\nDoch genau das ist der Punkt. Stattdessen ist eine Gebühr entstanden: gering, informell und erhoben in dem Moment, in dem ein Bittsteller die Erledigung am dringendsten wünscht. Niemand hat sie festgesetzt, aber jeder kennt den Satz."
 cc_bureau.20.a: "Zahlen Sie die Rückstände. Alle."
 cc_bureau.20.b: "Sie haben ihr eigenes Einkommen gefunden. Lassen Sie es so."
 cc_bureau.20.c: "Weniger Stellen, ordnungsgemäß bezahlt."

 # ---- .21  The fees are the custom ----
 cc_bureau.21.title: "Das Amt customs"
 cc_bureau.21.desc: "Zwölf Jahre später ist die Gebühr nicht mehr informell. Sie hat einen festen Satz, dieser Satz steht auf einer Tafel, und ein Schreiber wird ihn Ihnen höflich erklären, noch bevor Sie Ihre Frage beendet haben.\n\nDie Männer, die sie erheben, haben ihr Leben darauf aufgebaut. Sie haben Häuser gekauft und Töchter verheiratet dank dieser Einnahmen, und sie werden Ihnen ohne Scham sagen, dass sie auf diese Weise bezahlt werden, weil die Krone sich entschieden hat, sie nicht anders zu bezahlen. Sie haben recht."
 cc_bureau.21.a: "Schafft es ab. Ganz gleich, was es kostet."
 cc_bureau.21.b: "Besteuern Sie es. Die Krone kann ebenso gut ihren Anteil erhalten."
 cc_bureau.21.c: "Sagen Sie nichts und lassen Sie es so stehen."

 # ---- .30  The clerks against the great houses ----
 cc_bureau.30.title: "Eine Frage des Vorrangs"
 cc_bureau.30.desc: "Ein Untersekretär hat einem Herzog eine Absage erteilt.\n\nDie Absage war korrekt. Die Unterlagen waren nicht ordnungsgemäß, das sagte der Mann, und er sagte es vor Zeugen. Was der Herzog nun will, sind nicht mehr die Unterlagen; was der Herzog will, ist festzustellen, dass ein Mann dieser Beschreibung einem Mann seiner Beschreibung nichts zu sagen hat.\n\nHälfte des Hofes amüsiert sich prächtig darüber, und die andere Hälfte hat verstanden, worum es hier tatsächlich geht."
 cc_bureau.30.a: "Die Ernennung bleibt bestehen. Ebenso wie die Ablehnung."
 cc_bureau.30.b: "Dem Herzog gebührt seine Höflichkeit."
 cc_bureau.30.c: "Die Krone entscheidet nicht über Streitigkeiten zwischen ihren Dienern."

 # ---- .40  Entrenched and unfunded ----
 cc_bureau.40.title: "Das Lehen"
 cc_bureau.40.desc: "Das Amt hat seit zwanzig Jahren keine ordnungsgemäße Finanzierung erhalten und nie einmal danach gefragt, was eigentlich die Warnung hätte sein sollen.\n\nEs ist vollkommen solvent. Es ist solvent, weil es zum Privatunternehmen der Familie geworden ist, die es leitet, wobei das Einkommen aus Vereinbarungen stammt, deren Bedingungen niemand am Hof kennt, und es hat seine Funktion die ganze Zeit über tadellos erfüllt. Das ist es, was die Sache schwierig macht. Es gibt nichts zu beanstanden, außer der Tatsache an sich."
 cc_bureau.40.a: "Finanziert es ordnungsgemäß und nehmt es zurück."
 cc_bureau.40.b: "Zerlege es in Stücke, die klein genug sind, um sie zu halten."
 cc_bureau.40.c: "Verkaufen Sie ihnen das Amt direkt. Rechtlich."

 # ---- .50  Entrenched and funded ----
 cc_bureau.50.title: "Eine Säule des Staates"
 cc_bureau.50.desc: "Das Amt ist vierzig Jahre alt, ordnungsgemäß bezahlt und hat drei seiner Gründer überlebt, ohne dass jemand einen Unterschied in der Arbeitsleistung bemerkt hätte.\n\nLetzteres ist die eigentliche Leistung. Es ist nicht mehr davon abhängig, wer dort arbeitet. Ein Schreiber, der letzten Winter starb, hinterließ Anweisungen, die so vollständig waren, dass sein Nachfolger keinerlei Einweisung benötigte und das Amt einfach weiterfunktionierte.\n\nDie Krone hat etwas geschaffen, das länger währen wird als die Aufmerksamkeit der Krone. Es bleibt nur zu entscheiden, wie viel Spielraum man ihm lassen will."
 cc_bureau.50.a: "Lasst es seine eigenen Verfahren festlegen."
 cc_bureau.50.b: "Bringt dessen Kopf vor den Rat."
 cc_bureau.50.c: "Rotieren Sie die Beamten, bevor einer von ihnen Wurzeln schlägt."

 # ---- .60  A funding cut ----
 cc_bureau.60.title: "Die Kürzung wird bekannt gegeben"
 cc_bureau.60.desc: "Der Kostenvoranschlag wurde gekürzt, und jemand muss es ihnen sagen.\n\nDer Leiter des Amtes empfing die Nachricht im Stehen, dankte dem Boten und stellte eine einzige Frage: ob die Kürzung dauerhaft sein werde. Man sagte ihm, sie gelte für das laufende Jahr. Er erwiderte, dass man ihm das beim letzten Mal ebenfalls gesagt habe, und kehrte an seinen Schreibtisch zurück.\n\nEr wird weder zurücktreten noch protestieren. Was er stattdessen tun wird, ist aufzuhören, die kleinen Gefälligkeiten abzulehnen, die er seit elf Jahren ablehnt, und niemand im Palast wird davon etwas hören."
 cc_bureau.60.a: "Sagen Sie es ihnen deutlich. In diesem Jahr gibt es kein Geld."
 cc_bureau.60.b: "Kürze den Apparat, nicht die Besoldung."
 cc_bureau.60.c: "Findet es woanders."

 # ---- .61  What the cut cost ----
 cc_bureau.61.title: "Die Kosten"
 cc_bureau.61.desc: "Zehn Jahre später existiert das Amt immer noch und beantwortet immer noch Briefe.\n\nWas es nicht mehr tut, ist, sie unabhängig davon auf die gleiche Weise zu beantworten, wer fragt. Es gab keine Entscheidung. Niemand wurde in einem Sinne bestochen, auf den ein Gericht reagieren könnte. Es ist einfach so, dass ein Mann, der seit einem Jahrzehnt nicht ordnungsgemäß bezahlt wurde, ein Gefühl dafür entwickelt, welche Korrespondenten die Mühe wert sind, und jeder Mann in diesem Gebäude entwickelte etwa zur gleichen Zeit dasselbe Gefühl.\n\nDie Krone bekommt ihre Arbeit erledigt. Sie bekommt sie als Zweite erledigt."
 cc_bureau.61.a: "Bauen Sie es wieder auf. Was auch immer nötig ist."
 cc_bureau.61.b: "Es ist billiger als zuvor. Lasst es so."

 # ---- Thread modifiers ----
 STATIC_MODIFIER_NAME_cc_bureau_career_clerks: "Ein besoldeter Dienst"
 STATIC_MODIFIER_DESC_cc_bureau_career_clerks: "Männer, die ihr Amt dem Amt verdanken. Langsam, unspektakulär, und es verschlimmert sich mit jedem Jahr, in dem niemand eingreift."
 STATIC_MODIFIER_NAME_cc_bureau_offices_are_property: "Ämter als Eigentum"
 STATIC_MODIFIER_DESC_cc_bureau_offices_are_property: "Posten werden selbstverständlich vererbt und verkauft, ohne dass es jemand so angeordnet hätte. Die Krone zieht ihren Teil immer noch ein. Sie entscheidet jedoch nicht mehr darüber, wer dient."
 STATIC_MODIFIER_NAME_cc_bureau_paid_in_full: "Die Rückstände beglichen"
 STATIC_MODIFIER_DESC_cc_bureau_paid_in_full: "Fünfundzwanzig Jahre lang pünktlich bezahlte Schreiber – das ist das Teuerste, was man in diesem Zusammenhang kaufen kann, und das Einzige, was den Rest wieder rückgängig macht."
 STATIC_MODIFIER_NAME_cc_bureau_fees_became_custom: "Die Gebühren wurden zur Gewohnheit"
 STATIC_MODIFIER_DESC_cc_bureau_fees_became_custom: "Ein Amt, das von seinen eigenen Gebühren lebt, ist dem Rechenschaftspflichtig, der sie bezahlt, und der Satz steht auf einer Tafel an der Tür."
 STATIC_MODIFIER_NAME_cc_bureau_retrenched: "Der Apparat reduziert"
 STATIC_MODIFIER_DESC_cc_bureau_retrenched: "Weniger Stellen, weiterhin besoldet, weiterhin im Besitz der Krone. Eine kleinere Verwaltung ist immer noch eine Verwaltung."
 STATIC_MODIFIER_NAME_cc_bureau_office_farmed_out: "Das Amt verpachtet"
 STATIC_MODIFIER_DESC_cc_bureau_office_farmed_out: "Das Amt gehört nun jemand anderem, und die Krone zahlt Miete für ihre eigene Verwaltung. Es funktioniert. Aber es dauert ein Leben lang, dies wieder rückgängig zu machen."
 STATIC_MODIFIER_NAME_cc_bureau_crown_backed_clerks: "Die Krone unterstützte ihre Beamten"
 STATIC_MODIFIER_DESC_cc_bureau_crown_backed_clerks: "Einmal öffentlich gesagt, vor einem Herzog. Jeder Untersekretär im Reich hatte es innerhalb eines Monats erfahren."
 STATIC_MODIFIER_NAME_cc_bureau_standing_procedure: "Stehendes Verfahren"
 STATIC_MODIFIER_DESC_cc_bureau_standing_procedure: "Das Amt hat seine Arbeitsweise schriftlich fixiert und ist daher nicht mehr von den Personen abhängig, die sie derzeit ausführen. Das ist die eigentliche Definition einer Institution."
 STATIC_MODIFIER_NAME_cc_bureau_head_in_council: "Der Sekretär im Rat"
 STATIC_MODIFIER_DESC_cc_bureau_head_in_council: "Das Amt hat eine Stimme am Tisch. Die Krone hat einen Rivalen, den sie zumindest sehen kann, was die bessere Art von Rivalität ist."
 STATIC_MODIFIER_NAME_cc_bureau_rotated_officers: "Beamte rotiert"
 STATIC_MODIFIER_DESC_cc_bureau_rotated_officers: "Niemand bleibt lange genug, um etwas aufzubauen, was beabsichtigt ist und zugleich die Kosten verursacht."

 # ---- Estate privileges ----
 ep_noble_offices_by_right: "Die Ämter stehen uns rechtmäßig zu"
 ep_noble_offices_by_right_desc: "Die Ämter gehen an Familien über, und die Familien bezahlen für sie, sodass die Ausgaben der Schatzkammer in dem Jahr, in dem dies gewährt wird, und in jedem darauffolgenden Jahr sinken.\n\nWas damit sinkt, ist die Fähigkeit der Krone zu entscheiden, wer dient. Das ist ein Kostenpunkt, den niemand bemerkt, bis er zum ersten Mal ins Gewicht fällt."
 ep_burgher_examined_service: "Dienst durch Prüfung"
 ep_burgher_examined_service_desc: "Posten werden von jedem besetzt, der die Prüfung besteht, ungeachtet seiner Herkunft. Dies führt zu einer besseren Verwaltung als jede andere Methode, die jemals versucht wurde, und es ist langsam, teuer und wird von jeder Familie mit einem Namen, den es zu schützen gilt, verachtet."
 ep_clergy_keepers_of_record: "Hüter der Aufzeichnungen"
 ep_clergy_keepers_of_record_desc: "Bevor es Archive gab, gab es Klöster, und über mehrere Jahrhunderte waren diese dasselbe. Der Klerus führt die Register, die Krone spart sich die Kosten für deren Führung.\n\nDer Preis dafür ist, dass die Kirche nun genau weiß, was die Krone besitzt."
 ep_peasant_relief_from_fees: "Entlastung von den Gebühren"
 ep_peasant_relief_from_fees_desc: "Die informellen Gebühren werden per Proklamation eingestellt, und den Ämtern wird mitgeteilt, dass sie stattdessen ordnungsgemäß bezahlt werden.\n\nDie Krone hat gerade zugestimmt, Kosten zu tragen, die sie stillschweigend an Leute weitergegeben hatte, die keine Möglichkeit hatten, diese abzulehnen. Es ist teurer, als es jeder erwartet hätte."

 # ---- Government reforms ----
 cc_venal_offices_reform: "Die käuflichen Ämter"
 cc_venal_offices_reform_desc: "Ämter werden rechtlich zu Eigentum: gekauft, verkauft, vererbt und bei jeder Übertragung von der Krone besteuert.\n\nFrankreich wurde zwei Jahrhunderte lang so geführt und es funktionierte in dem engen Sinne, dass es zuverlässig und ohne Streit Geld einbrachte. Was es nicht konnte, war eine Verwaltung zu schaffen, die irgendjemandem Rechenschaft schuldig war."
 cc_salaried_establishment_reform: "Der besoldete Apparat"
 cc_salaried_establishment_reform_desc: "Posten sind besoldet, werden ernannt und auf Gnaden der Krone gehalten.\n\nJeder Staat, der Bestand hatte, kam irgendwann hier an, und die meisten von ihnen kamen hier an, nachdem sie zuerst das andere System versucht und ein Jahrhundert lang darüber bereut hatten. Es ist teuer, so wie Mauern teuer sind."
