l_german:
 # ============================================================
 # Colonial Consolidation & Border Friction — Pillar 07
 # ============================================================

 # --- Section D: Border Friction ---

 cc_colonial.20.title: "Der Grenzstreit"
 cc_colonial.20.desc: "Nachrichten aus der Neuen Welt berichten von Problemen an einer unmarkierten Grenze. [colony_a.GetName] und sein Nachbar [colony_b.GetName] – Völker von [colony_a_culture.GetName]-Abstammung beziehungsweise einer anderen Herkunft, zwischen denen wenig Sympathie herrscht – beanspruchen beide denselben Abschnitt unvermessenen Landes. Landvermesser tauschen Beleidigungen aus, Siedler tauschen Schläge aus, und jeder Gouverneur schreibt an uns, um zu fordern, dass die Krone ihre Seite unterstützt."
 cc_colonial.20.a: "Ziehen Sie die Grenze zugunsten von [colony_a.GetName]. Der stärkere Sitz sollte das Gebiet halten."
 cc_colonial.20.b: "Lassen Sie die Kolonisten es unter sich ausmachen. Die Krone hat Wichtigeres zu tun."
 cc_colonial.20.c: "Entsende sofort einen königlichen Landvermesser, bevor Blut fließt."

 cc_colonial.21.title: "Überfälle an der Front"
 cc_colonial.21.desc: "Der Streit ist in offene Raubzüge übergegangen. Scheunen brennen auf beiden Seiten der strittigen Grenze, und die Gouverneure von [colony_a.GetName] und [colony_b.GetName] sprechen nun voneinander als Feinde statt als Nachbarn. Wenn die Krone nicht handelt, könnten die Kolonien die Angelegenheit vollständig in die eigene Hand nehmen."
 cc_colonial.21.a: "Königliche Truppen entsenden, um die Grenze zu sichern und die Raubzüge zu beenden."
 cc_colonial.21.b: "Den Anspruch von [colony_a.GetName] mit Gewalt unterstützen. Lassen Sie die Angelegenheit entscheiden."
 cc_colonial.21.c: "Es ist ein Zoff in einem fernen Land. Lasst sie bluten."

 cc_colonial.22.title: "Die Schlichtung der Krone"
 cc_colonial.22.desc: "Königliche Kommissare haben das umstrittene Gebiet begangen, die Charten konsultiert und eine Grenze gezogen, die sowohl [colony_a.GetName] als auch [colony_b.GetName] akzeptieren können. Eine verbindliche Einigung wartet nur noch auf das Siegel der Krone."
 cc_colonial.22.a: "Ratifiziere die gerechte Grenze. Lasst beide Kolonien hinter einer besiedelten Linie prosperieren."
 cc_colonial.22.b: "Lassen Sie unseren fähigsten Minister ein großzügiges Abkommen aushandeln, mit dem niemand benachteiligt wird."

 # --- Section E: Consolidation / Viceroyalty ---

 cc_colonial.30.title: "Eine Petition für eine einheitliche Verwaltung"
 cc_colonial.30.desc: "Zwei unserer Kolonien sind ineinander gewachsen. [colony_a.GetName] und das kleinere [colony_b.GetName] – beide besiedelt von [colony_a_culture.GetName]-Siedlern, die sich Straßen, Gemeinden und Märkte teilen – unterstehen nun getrennten, überlappenden Verwaltungen. Ihre Gouverneure bitten die Krone gemeinsam um eine Rationalisierung der Anordnung, bevor die Duplizierung der Ämter die Schatzkammer aussaugt."
 cc_colonial.30.a: "Vereinigen Sie diese zu einem einzigen Vizekönigreich. [colony_b.GetName] wird in [colony_a.GetName] eingegliedert."
 cc_colonial.30.b: "Binde sie unter einem gemeinsamen Rat, aber lass jeden seinen eigenen Sitz behalten."
 cc_colonial.30.c: "Belassen Sie die Vereinbarung so, wie sie ist. Veränderungen bringen ihre eigenen Probleme mit sich."

 cc_colonial.31.title: "Der Akt der Union der Kolonien"
 cc_colonial.31.desc: "Es ist vollbracht. Die Territorien, Einnahmen und Institutionen von [colony_b.GetName] werden in [colony_a.GetName] eingegliedert, welches die Krone zu einem Vizekönigssitz erhebt, der das gesamte konsolidierte Reich regiert. Ein neues Vizekönigreich nimmt seinen Platz unter den Juwelen des Imperiums ein."
 cc_colonial.31.a: "Inaugurieren Sie das Vizekönigreich mit aller gebührenden Zeremonie."

 cc_colonial.32.title: "Zweisitzigkeit bewahrt"
 cc_colonial.32.desc: "Anstatt eine stolze Kolonie in ihre Nachbarin aufgehen zu lassen, bindet die Krone [colony_a.GetName] und [colony_b.GetName] unter einem gemeinsamen Koordinationsrat. Sie werden ihre Höfe, ihre Straßen und ihre Verteidigungen bündeln, während jede ihren eigenen Gouverneur und ihr eigenes Siegel behält."
 cc_colonial.32.a: "Formalisiere den gemeinsamen Rat. Lass die Kooperation die Arbeit der Vereinigung leisten."

 cc_colonial.33.title: "Der erste Hof des Vizekönigs"
 cc_colonial.33.desc: "Das neue Vizekönigreich von [colony_a.GetName] beruft seinen ersten Hof ein, und alle Augen richten sich auf die Frage, wer dessen Spitze besetzen soll. Die Wahl wird den Ton der vizeköniglichen Herrschaft für eine Generation vorgeben."
 cc_colonial.33.a: "Ernenne einen vertrauenswürdigen Kronloyalisten. Kontrolle ist wichtiger als Wohlwollen."
 cc_colonial.33.b: "Ernenne einen angesehenen Kreolen. Ein zufriedener Sitz ist ein prosperierender."

 # --- Section F: Labor & Demographics ---

 cc_colonial.40.title: "Die Frage der Arbeit"
 cc_colonial.40.desc: "[colony_a.GetName] ist aus den behelfsmäßigen Strukturen seiner Gründung herausgewachsen. Seine Plantagen und Minen schreien nach Arbeitskräften, und die Art und Weise, wie diese Kräfte gefunden werden, wird die Kolonie – und das Gewissen der Krone – für Generationen prägen. Die Pflanzer, die Missionen und die Handelshäuser drängen jeweils auf eine andere Antwort."
 cc_colonial.40.a: "Festigung der Encomienda. Das Land wird bearbeitet werden, ungeachtet der Kosten."
 cc_colonial.40.b: "Händlerplantagen per Charta festlegen. Lassen Sie die Bürger eine Cash-Crop-Ökonomie führen."
 cc_colonial.40.c: "Gründen Sie Missionen und fördern Sie die freie Besiedlung. Erschaffen Sie eine geschlossene, fromme Kolonie."

 cc_colonial.41.title: "Die Mission und die Plantage"
 cc_colonial.41.desc: "An der Grenze von [colony_a.GetName] ist es zum offenen Streit zwischen den Missionen, die Konvertiten beherbergen, und den Plantagenbesitzern, die deren Arbeitskraft begehren, gekommen. Die Mönche bitten um Schutz für ihre Herde; die Plantagenbesitzer bitten um die Hände, von denen sie sagen, dass die Krone sie ihnen versprochen habe. Beide können nicht gleichzeitig zufriedengestellt werden."
 cc_colonial.41.a: "Stellen Sie sich auf die Seite der Missionen. Schützen Sie die Konvertiten und lassen Sie die Pflanzer grummeln."
 cc_colonial.41.b: "Stellen Sie sich auf die Seite der Pflanzer. Der Reichtum muss fließen, ungeachtet dessen, was die Mönche sagen."

 cc_colonial.42.title: "Kreolische Beschwerden"
 cc_colonial.42.desc_default: "Eine Generation von in den Kolonien geborenen Eliten ist in [colony_a.GetName] erwachsen, und sie leiden unter der Herrschaft von Beamten aus der Metropole, die nichts über das Land wissen, wenn sie ankommen, und wenig gelernt haben, wenn sie gehen. Sie petitionieren um Ämter, um Anerkennung und um eine Stimme in ihrer eigenen Verwaltung."
 cc_colonial.42.desc_coerced: "Eine Generation von in den Kolonien geborenen Eliten ist in [colony_a.GetName] erwachsen — und sie sind reich geworden durch eine Zwangsarbeitsökonomie, über die sie sich nun berufen, verfügen zu können. Sie grollen gegen die aus der Metropole entsandten Beamten über ihnen und gegen die ferne Einmischung der Krone in eine Gesellschaft, die nur sie allein verstehen. Mit einem Unterton von Drohung petitionieren sie um Ämter und eine eigene Stimme."
 cc_colonial.42.a: "Öffnet Büros für die kreolische Elite. Ein Zugeständnis jetzt erspart eine Revolte später."
 cc_colonial.42.b: "Bestätige die metropolitische Kontrolle. Die Kolonien werden von der Hauptstadt aus regiert."

 cc_colonial.43.title: "Eine demografische Abrechnung"
 cc_colonial.43.desc: "Jahrzehnte einer verhärteten Kolonialordnung haben ihre Spuren in [colony_a.GetName] hinterlassen: eine nach Geburt und Arbeit geschichtete Gesellschaft, deren Spaltungen tief in der Bevölkerung verankert sind. Die Abrechnung, die die Krone lange aufgeschoben hat, ist eingetroffen, und es wird nicht billig sein, sie zu bewältigen."
 cc_colonial.43.a: "Investiere in Versöhnung und Integration, ungeachtet der Kosten."
 cc_colonial.43.b: "Die gespaltene Gesellschaft so akzeptieren, wie sie ist. Der Abdruck wird bleiben."
