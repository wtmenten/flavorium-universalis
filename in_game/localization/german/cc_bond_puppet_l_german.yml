l_german:
 # === cc_bonds.40 — The Puppet Requests an Ambassador ===
 cc_bonds.40.title: "Die Marionette bittet um einen Botschafter"
 cc_bonds.40.desc: "Die Regierung von [bond_subj.GetName] hat ein formelles Ersuchen um eine ständige diplomatische Vertretung an unserem Hof eingereicht. Ihre Begründung ist besonnen: Als ein Staat, der eng mit unseren Interessen verbunden ist, glauben sie, ein Mitspracherecht bei den Entscheidungen zu verdienen, die sie betreffen. Es ist ein vernünftiges Ersuchen. Es ist zudem der erste Test dafür, welche Art von Beziehung wir anstreben."
 cc_bonds.40.a: "Richten Sie eine vollständige diplomatische Mission ein. Sie verdienen eine angemessene Repräsentation."
 cc_bonds.40.b: "Einen begrenzten Repräsentanten ernennen. Repräsentation, aber kein voller Status."
 cc_bonds.40.c: "Lehnen Sie die Anfrage ab. Unsere Beziehung erfordert keine formelle Gesandtschaft."

 # === cc_bonds.41 — Puppet Economic Integration ===
 cc_bonds.41.title: "Wirtschaftliche Integration des Vasallen"
 cc_bonds.41.desc: "Unsere Berater haben ein Memorandum über die wirtschaftlichen Beziehungen zwischen unserem Reich und [bond_subj.GetName] erstellt. Drei Optionen werden präsentiert. Ein einheitliches Währungssystem würde die Besteuerung und die Handelsbuchhaltung erheblich vereinfachen — aber das Memorandum merkt in vorsichtigen Worten an, dass der Übergang für die lokale Bevölkerung „administrativ herausfordernd“ wäre. Die anderen Optionen bedeuten weniger Unruhe und weniger Kontrolle."
 cc_bonds.41.a: "Führe ein einheitliches Währungssystem ein. Rationalisiere die Beziehung."
 cc_bonds.41.b: "Parallele Währungssysteme beibehalten. Integration ohne Aufzwingen."
 cc_bonds.41.c: "Schließen Sie gemeinsame Handelsabkommen ab. Gegenseitiger Nutzen, gegenseitige Bedingungen."

 # === cc_bonds.42 — The Puppet's Internal Faction ===
 cc_bonds.42.title: "Die interne Fraktion der Marionette"
 cc_bonds.42.desc: "Geheimdienstberichte von [bond_subj.GetName] beschreiben eine signifikante interne Spaltung. Eine Fraktion ist unseren Interessen weitgehend wohlgesonnen; die andere genießt größere Unterstützung in der Bevölkerung. Die Unterstützung der kronentreuen Fraktion würde unseren Einfluss auf die inneren Angelegenheiten der Marionette ausweiten – doch verdeckte Einmischung birgt Risiken. Eine Entdeckung wäre politisch kostspielig. Andererseits bleibt die populäre Fraktion vielleicht nicht freundlich."
 cc_bonds.42.a: "Unterstützen Sie heimlich die krontreue Fraktion."
 cc_bonds.42.b: "Unterstütze die populäre Fraktion. Eine stabile Marionette dient uns besser."
 cc_bonds.42.c: "Halten wir uns heraus. Die inneren Angelegenheiten liegen in ihrer Verantwortung."

 # === cc_bonds.43 — Directing Puppet Foreign Policy ===
 cc_bonds.43.title: "Steuerung der Außenpolitik von Marionetten"
 cc_bonds.43.desc: "Der Marionettenstaat [bond_subj.GetName] hat ein diplomatisches Bündnis geschlossen, das unsere eigene außenpolitische Position erschwert. Wir müssen sie dazu bringen, es zu beenden. Die Frage ist, wie wir diese Botschaft übermitteln — als Befehl, als Anforderung mit Bedingungen oder durch Konsultationen, die zum selben Ergebnis führen, während sie das Gefühl haben, gehört worden zu sein."
 cc_bonds.43.a: "Befiehl ihnen, das Bündnis sofort zu brechen."
 cc_bonds.43.b: "Verlangt den Bruch unter bestimmten Bedingungen."
 cc_bonds.43.c: "Konsultiere sie zuerst. Erzielt gemeinsam das gleiche Ergebnis."

 # === cc_bonds.44 — Puppet Succession Crisis ===
 cc_bonds.44.title: "Thronfolgenkrise im Vasallenstaat"
 cc_bonds.44.desc: "Das Regierungshaus von [bond_subj.GetName] ist gespalten. Zwei Prätendenten streiten um die Nachfolge – einer ist unser bevorzugter Kandidat, der andere genießt breitere populäre Unterstützung innerhalb des Marionettenstaates. Unser bevorzugter Kandidat kann ohne uns nicht gewinnen. Wir können das gewünschte Ergebnis erzwingen. Die Frage ist, ob das Erzwingen die richtige Wahl ist."
 cc_bonds.44.a: "Setzen Sie unseren bevorzugten Kandidaten mit Gewalt ein. Sichern Sie die Thronfolge."
 cc_bonds.44.b: "Unterstütze den populären Erben. Lass das Volk der Marionette wählen."
 cc_bonds.44.c: "Vermitteln Sie einen beaufsichtigten Prozess. Ein Kompromiss, den beide Seiten akzeptieren können."

 # === cc_bonds.45 — Puppet Requests Military Expansion ===
 cc_bonds.45.title: "Vasall fordert militärische Expansion"
 cc_bonds.45.desc: "Die Regierung von [bond_subj.GetName] hat einen Vorschlag zur Erweiterung ihrer stehenden Streitkräfte eingereicht. Sie führen Bedenken hinsichtlich der Grenzsicherung an und argumentieren, dass ein stärkeres Militär sie zu einem wertvolleren Partner für uns mache. Damit liegen sie nicht falsch – doch eine stärkere Marionette ist auch eine unabhängigere. Der Vorschlag beinhaltet ein Ersuchen um finanzielle Unterstützung."
 cc_bonds.45.a: "Genehmigen Sie die Erweiterung und stellen Sie die Finanzierung bereit."
 cc_bonds.45.b: "Genehmigen Sie die Erweiterung. Sie können diese selbst finanzieren."
 cc_bonds.45.c: "Lehnen Sie die Anfrage ab. Ihre derzeitigen Streitkräfte sind ausreichend."

 # === cc_bonds.46 — The Loyal Puppet's Request ===
 cc_bonds.46.title: "Die Bitte der loyalen Marionette"
 cc_bonds.46.desc: "Die Regierung von [bond_subj.GetName] hat einen persönlichen Brief geschickt – keine formelle Petition, kein diplomatisches Memorandum, sondern einen Brief. Sie beschreiben ihre anhaltende Verbundenheit zur Beziehung, führen mehrere jüngste Opfer an, die sie in unserem Namen gebracht haben, und bitten im Gegenzug um etwas. Die Bitte ist bescheiden. Entscheidend ist, ob wir uns entscheiden, ihr stattzugeben."
 cc_bonds.46.a: "Willige großzügig ein. Loyalität verdient Anerkennung."
 cc_bonds.46.b: "Nutzen wir diesen Moment des guten Willens, um im Gegenzug etwas zu verlangen."
