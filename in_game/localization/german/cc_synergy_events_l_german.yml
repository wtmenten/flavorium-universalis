l_german:
 # ============================================================
 # TYPE A — RULER + CABINET SYNERGY
 # ============================================================
 cc_synergy.1.title: "Blut und Eisen"
 cc_synergy.1.desc: "Die eiserne Disziplin unseres Herrschers und die Expertise unseres Militärbefehlhabers haben in den Kriegsräten etwas Bemerkenswertes hervorgebracht. Die beiden haben eine gemeinsame Doktrin entwickelt, die die Art und Weise, wie wir unsere Streitkräfte aufstellen und einsetzen, grundlegend verändert."
 cc_synergy.1.a: "Beauftragen Sie die neue Militärdoktrin"
 cc_synergy.1.b: "Den Kommandanten befördern"
 cc_synergy.1.c: "Das Reich hat andere Prioritäten"

 cc_synergy.2.title: "Ein Hof der Gelehrsamkeit"
 cc_synergy.2.desc: "Die gelehrte Tiefe unseres Herrschers und die künstlerischen Ambitionen unseres Ministers haben ungewöhnliche Aufmerksamkeit im ganzen Reich erregt. Briefgelehrte, Wissenschaftler und Künstler werden an unseren Hof gezogen, und die Hauptstadt wird zu mehr als nur einem Machtzentrum — sie wird zu einem Zentrum der Kultur."
 cc_synergy.2.a: "Gründen Sie den Hof der Gelehrsamkeit"
 cc_synergy.2.b: "Das Kulturprogramm vertiefen"
 cc_synergy.2.c: "Erkenne die erzielten Fortschritte an"

 cc_synergy.20.title: "Der Hof vertieft sich"
 cc_synergy.20.desc: "Das von uns etablierte Kulturprogramm hat Wurzeln geschlagen. Gelehrte debattieren in unseren Korridoren; Künstler konkurrieren um Patronage. Dies ist nicht länger nur ein Hof – es ist eine Zivilisation."
 cc_synergy.20.a: "Lassen Sie es aufblühen"

 cc_synergy.3.title: "Das Netzwerk des Kalifats"
 cc_synergy.3.desc: "Die Meisterschaft unseres Herrschers in der Staatskunst und die tiefen Verbindungen unseres Ministers innerhalb der islamischen Welt haben sich zu etwas Außergewöhnlichem vereint: einem diplomatischen Apparat, der die Höfe der Gläubigen überspannt und echten Respekt genießt."
 cc_synergy.3.a: "Formalisiere den diplomatischen Hof"
 cc_synergy.3.b: "Akzeptiere die damit verbundene Anerkennung"

 cc_synergy.4.title: "Tradition und Parlament"
 cc_synergy.4.desc: "Eine unwahrscheinliche Partnerschaft ist zwischen den parlamentarischen Instinkten unseres Herrschers und dem tiefen Respekt unseres Ministers für traditionelle Institutionen entstanden. Das Ergebnis ist ein Parlament, das die alten Ordnungen akzeptieren können — und ein Reformprozess, mit dem die neuen Kräfte leben können."
 cc_synergy.4.a: "Die parlamentarische Harmonie fördern"
 cc_synergy.4.b: "Erkenne die Beiträge beider Seiten an"

 cc_synergy.5.title: "Der reformierende Geist"
 cc_synergy.5.desc: "Die progressiven Überzeugungen unseres Herrschers und die philosophische Tiefe unseres Ministers haben gemeinsam etwas Ungewöhnliches an diesem Hof geschaffen: ein echtes intellektuelles Reformprogramm. Die Institutionen des Reiches werden nicht bloß angepasst – sie werden neu erdacht."
 cc_synergy.5.a: "Finanziere den institutionellen Sprung"
 cc_synergy.5.b: "Die Ideen sind bereit – beginne den formalen Übergang"
 cc_synergy.5.b.tt: "Schaltet die Reform „Hof der Philosophen“ frei, wenn die Bedingungen erfüllt sind"

 cc_synergy.6.title: "Die Sufi-Synthese"
 cc_synergy.6.desc: "Die spirituelle Tiefe unseres Herrschers und die Meisterschaft unseres Ministers in der islamischen Diplomatie haben eine bemerkenswerte Synthese hervorgebracht: einen Hof, an dem Sufi-Weisheit auf politische Kalkulation trifft und mystische Autorität die diplomatische Macht verstärkt."
 cc_synergy.6.a: "Die Sufi-Tradition pflegen"
 cc_synergy.6.b: "Die formale Autorität des Ministers erhöhen"

 cc_synergy.7.title: "Das Himmelsmandat naht"
 cc_synergy.7.desc: "Das pragmatische Verständnis unseres Herrschers für die östliche Regierungsführung und die Meisterschaft unseres Ministers in der konfuzianischen Verwaltung haben begonnen, etwas Bemerkenswertes zu erreichen: einen Hof, der nicht bloß durch Gewalt regiert, sondern durch die Legitimität, die aus einer ordnungsgemäßen Struktur erwächst."
 cc_synergy.7.a: "Das Mandat des Lernens – pflege es"
 cc_synergy.7.b: "Formalisiere die bürokratische Tradition"
 cc_synergy.7.b.tt: "Schaltet die Reform „Mandatsbürokratie“ frei, wenn die Bedingungen erfüllt sind"

 cc_synergy.8.title: "Das große Wagnis"
 cc_synergy.8.desc: "Der rastlose Ehrgeiz unseres Herrschers und die koloniale Expertise unseres Ministers haben einander gefunden – und was sie gemeinsam planen, ist größer, als es einer von ihnen allein hätte versuchen können. Die Überseeunternehmen stehen kurz davor, sich in ihrem Charakter und Umfang zu verändern."
 cc_synergy.8.a: "Das Kolonialsyndikat ins Leben rufen"
 cc_synergy.8.b: "Die Energie in unmittelbare Gewinne lenken"

 cc_synergy.9.title: "Die eiserne Hegemonie entsteht"
 cc_synergy.9.desc: "Die Kombination aus der unerbittlichen Disziplin unseres Herrschers, dem militärischen Genie unseres Oberbefehlshabers und der Militärmark an unserer Grenze hat die Aufmerksamkeit jedes benachbarten Hofes auf sich gezogen. Wir sind nicht nur mächtig – wir sind in einer Weise dominant, die alle Kalkulationen verändert."
 cc_synergy.9.a: "Formalisiere die Eiserne Hegemonie"
 cc_synergy.9.b: "Nutzt jetzt den militärischen Vorteil"

 cc_synergy.91.title: "Die eiserne Hegemonie freigeschaltet"
 cc_synergy.91.desc: "Die Bedingungen für eine Eiserne Hegemonie sind erfüllt. Der Militärapparat, der Markgraf und die Adelsstände sind alle abgestimmt. Der Moment ist gekommen, unsere Dominanz zu formalisieren."
 cc_synergy.91.a: "Die Eiserne Charter ausstellen"
 cc_synergy.91.a.tt: "Schaltet die Regierungsreform „Eiserne Hegemonie“ frei"

 cc_synergy.10.title: "Volkstribun"
 cc_synergy.10.desc: "In diesem revolutionären Zeitalter sind die progressiven Instinkte unseres Herrschers und die Meisterschaft unseres Ministers im Parlament in etwas gemündet, das man so noch nie gesehen hat: eine Regierung, die wahrhaft populär ist und die Zuneigung der Stände sowie des einfachen Volkes gleichermaßen genießt."
 cc_synergy.10.a: "Der Volkstribun ist eingetroffen"
 cc_synergy.10.b: "Die populäre Energie durch das Parlament lenken"

 # ============================================================
 # TYPE B — CABINET + CABINET SYNERGY
 # ============================================================
 cc_synergy.11.title: "Ost und West im Dialog"
 cc_synergy.11.desc: "Unser innovativer Minister und unser konfuzianischer Gelehrter haben einen außergewöhnlichen intellektuellen Austausch begonnen. Die Spannung zwischen ihren Traditionen erweist sich als produktiver, als beide erwartet hatten — ihre Rivalität bringt neue Ideen hervor."
 cc_synergy.11.a: "Unterstütze die gelehrte Rivalität"
 cc_synergy.11.b: "Die Hauptstadt sollte diese Blütezeit widerspiegeln"

 cc_synergy.12.title: "Die Handels-Klinge"
 cc_synergy.12.desc: "Handel und Stahl haben in unserem Hof ihr Bündnis gefunden. Unser Handelsminister und unser adliger Kommandant haben erkannt, dass ihre Interessen, sofern sie richtig aufeinander abgestimmt sind, sich gegenseitig verstärken – der Handel öffnet die Straßen, die Armeen schützen, und Armeen schützen den Reichtum, den der Handel generiert."
 cc_synergy.12.a: "Formalisiere die Vereinbarung der Handelslklinge"
 cc_synergy.12.b: "Erkenne die Beiträge beider Stände an"

 cc_synergy.13.title: "Reform durch das Parlament"
 cc_synergy.13.desc: "Unser innovativer Minister und unser parlamentarischer Vermittler haben ihr gemeinsames Projekt gefunden: nicht nur Reformen und nicht nur parlamentarisches Management, sondern die Transformation des Parlaments selbst in ein Instrument für progressiven Wandel."
 cc_synergy.13.a: "Reform des parlamentarischen Kompromisses freischalten"
 cc_synergy.13.a.tt: "Schaltet die Regierungsreform „Parlamentarischer Kompromiss“ frei"
 cc_synergy.13.b: "Parlamentarische Harmonie vorerst fördern"

 cc_synergy.14.title: "Integration und Entwicklung"
 cc_synergy.14.desc: "Der Minister, der unsere neuen Territorien integriert, und der Minister, der unsere Provinzen entwickelt, haben ihre Notizen verglichen – und festgestellt, dass ihre Arbeit eher ergänzend als konkurrierend ist. Gemeinsam schlagen sie einen Ansatz vor, der beide Prozesse beschleunigen würde."
 cc_synergy.14.a: "Finanziere den Integrationsschub"
 cc_synergy.14.b: "Die Hauptstadt profitiert direkt"

 cc_synergy.15.title: "Tuch und Kelch"
 cc_synergy.15.desc: "Unser Geistlicher Minister und unser Handelsminister haben im Parlament eine unerwartete Übereinkunft erzielt. Das Heilige und das Kommerzielle sind, richtig versöhnt, keine Feinde — und ihr Bündnis lässt das Parlament reibungsloser funktionieren, als es jemand für möglich gehalten hätte."
 cc_synergy.15.a: "Das Konkordat feiern"
 cc_synergy.15.b: "Die Vereinbarung spricht für sich selbst"

 cc_synergy.16.title: "Der Kriegsrat"
 cc_synergy.16.desc: "Unser Kavalleriekommandant und unser Belagerungsingenieur haben sich eng abgestimmt, und was sie gemeinsam erarbeitet haben, übersteigt die Summe seiner Teile. Sie schlagen eine einheitliche Doktrin für den aktuellen Feldzug vor, die unsere Streitkräfte dramatisch effektiver machen würde."
 cc_synergy.16.a: "Implementiere die Doktrin des Warlords-Rats"
 cc_synergy.16.b: "Sofortigen taktischen Vorteil nutzen"

 cc_synergy.17.title: "Das große Netzwerk"
 cc_synergy.17.desc: "Die diplomatische Expertise unserer leitenden Minister hat eine kritische Masse erreicht. Gemeinsam betreiben sie nicht mehr nur Außenpolitik – sie konstruieren eine Architektur von Beziehungen, deren Demontage Jahrzehnte dauern wird."
 cc_synergy.17.a: "Das diplomatische Netzwerk ausbauen"
 cc_synergy.17.b: "Nutzen wir das Netzwerk für gezielte Verhandlungen"

 cc_synergy.18.title: "Der aufgeklärte Hof"
 cc_synergy.18.desc: "Die Verbindung von humanistischer Philosophie und innovativer Verwaltung an unserem Hof hat etwas Seltenes hervorgebracht: ein Kabinett, in dem Ideen geprüft statt behauptet werden und Reformen aus der Vernunft statt aus Eigeninteressen fließen. Ausländische Höfe beginnen, dies zu bemerken."
 cc_synergy.18.a: "Der aufgeklärte Hof soll florieren"
 cc_synergy.18.b: "Die Zeit für den Hof der Philosophen ist gekommen"
 cc_synergy.18.b.tt: "Schaltet die Regierungsreform „Hof der Philosophen“ frei"

 # ============================================================
 # TYPE C — CABINET + ACTIVE CONTENT SYNERGY
 # ============================================================
 cc_synergy.21.title: "Das Schattennetzwerk ist erwacht"
 cc_synergy.21.desc: "Die diplomatische Meisterschaft unseres Ministers in der islamischen Welt wurde mit der formalen Autorität unseres diplomatischen Hofes kombiniert — und das Ergebnis ist etwas, das über gewöhnliche Diplomatie hinausgeht. Ein Netzwerk des Einflusses strahlt nun von unserer Hauptstadt aus, dem ausländische Mächte nur schwer entgegenwirken können."
 cc_synergy.21.a: "Schattennetz aktivieren"
 cc_synergy.21.b: "Die Verbindungen zum Kalifat vertiefen"

 cc_synergy.22.title: "Der akademische Arm des Mandats"
 cc_synergy.22.desc: "Unser konfuzianischer Mandarin und das gelehrte Konkordat haben ihre Synthese gefunden: eine Vision der Regierungsführung, in der Gelehrsamkeit und Verwaltung keine getrennten Berufe, sondern eine einzige Berufung sind. Der Hof wird zu etwas, das die Alten wiedererkannt hätten."
 cc_synergy.22.a: "Lernmandat – lassen Sie es gedeihen"
 cc_synergy.22.b: "Die Hauptstadt sollte direkt profitieren"

 cc_synergy.23.title: "Der parlamentarische Pakt"
 cc_synergy.23.desc: "Der parlamentarische Vermittler und die Reform des parlamentarischen Kompromisses haben ihr logisches Ziel erreicht: eine formelle Charta zwischen den Kaufmannsständen und dem Parlament, die den Gesetzgebungsprozess gleichzeitig effizienter und legitimer macht."
 cc_synergy.23.a: "Gewähre den Bürgern die Parlamentarische Charta"
 cc_synergy.23.b: "Stattdessen parlamentarische Harmonie fördern"

 cc_synergy.24.title: "Die Mark und der Kommissar"
 cc_synergy.24.desc: "Die Kombination aus unserem Militärverwalter, der Mark-Charta und der aktiven Militärmark hat etwas geschaffen, das sowohl die Adligen als auch die Generäle als außergewöhnlich anerkennen. Die Mark ist nicht bloß ein Pufferstaat – sie ist eine Projektion unserer militärischen Macht, und der Hof besitzt die Expertise, sie als solche zu nutzen."
 cc_synergy.24.a: "Die eiserne Hegemonie ist in greifbarer Nähe"
 cc_synergy.24.b: "Die Belagerungsexpertise des Ministers verbessern"

 cc_synergy.25.title: "Der Regierungsvertrag"
 cc_synergy.25.desc: "Der effiziente Verwalter und die Gouvernementsreform haben einander gefunden – und das Provinzgouvernement funktioniert besser, als es jemand erwartet hätte. Was als administrative Regelung begann, wird zu einem Modell dafür, wie man ein großes Reich regiert, ohne die Kohärenz zu verlieren."
 cc_synergy.25.a: "Der Regierungsvertrag — formalisieren"
 cc_synergy.25.b: "Eine kürzere, aber sofortige Dividende"
 cc_synergy.25.b.tt: "Gewährt einen kürzeren Modifikator und reduziert die Kosten für die Entfernung von Bürokratie"

 cc_synergy.26.title: "Das maritime Abkommen"
 cc_synergy.26.desc: "Die maritime Expertise unseres Ministers und die kommerzielle Macht unserer privilegierten Handelsgesellschaften haben eine produktive Abstimmung erreicht. Die Bürger investieren, die Seeleute segeln, und das Ergebnis ist ein kommerzielles Netzwerk, das beginnt, den Platz unseres Reiches in der Welt zu definieren."
 cc_synergy.26.a: "Das Kolonialsyndikat reift"
 cc_synergy.26.b: "Die sofortigen kommerziellen Gewinne mitnehmen"
