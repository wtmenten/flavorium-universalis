 # Wealth Corruption Modifier Names

 cc_wealth_corruption_1: "Konzentrierter Reichtum (I)"
 cc_wealth_corruption_1_desc: "Wenn die Krone hortet, nehmen die Stände dies zur Kenntnis. Parasitäre Arrangements bereichern stillschweigend den Adel und den Klerus auf Kosten der königlichen Legitimität."
 cc_wealth_corruption_2: "Konzentrierter Reichtum (II)"
 cc_wealth_corruption_2_desc: "Wenn die Krone hortet, nehmen die Stände dies zur Kenntnis. Parasitäre Arrangements bereichern stillschweigend den Adel und den Klerus auf Kosten der königlichen Legitimität."
