 cc_wealth_corruption_5: "Konzentrierter Reichtum (V)"
 cc_wealth_corruption_5_desc: "Wenn die Krone hortet, nehmen die Stände dies zur Kenntnis. Parasitäre Arrangements bereichern stillschweigend den Adel und den Klerus auf Kosten der königlichen Legitimität."
 cc_wealth.7.title: "Ein profitabler Abriss"
 cc_wealth.7.desc: "Einer der Stände hat eine eigentümliche Vereinbarung vorgeschlagen. Im Austausch gegen eine beträchtliche Summe aus der Schatzkammer werden sie eine ihrer eigenen herrschaftlichen Strukturen auflösen – wodurch das Land für andere Nutzungen verfügbar wird und sofortiges Kapital beschafft wird. Es ist ein ungewöhnliches Angebot, aber das Gold ist echt."
 cc_wealth.7.a: "Akzeptiere ihre Bedingungen."
 cc_wealth.7.b: "Ablehnen. Die Vereinbarung sagt uns nicht zu."

 cc_wealth.8.title: "Ein Investitionsvorschlag der Bürger"
 cc_wealth.8.desc: "Die Kaufmannsschicht hat einen prosperierenden städtischen Standort identifiziert, der reif für eine Erweiterung ist. Sie sind bereit, die Grundarbeiten zu finanzieren – Fundamente vorbereiten, Grundstücke räumen, Bauarbeiten koordinieren – im Austausch für einen Anteil an der Schatzkammer, der proportional zum Reichtum des Standorts ist."
 cc_wealth.8.a: "Akzeptieren. Finanziere die Expansion."
 cc_wealth.8.b: "Vorerst ablehnen."

 cc_wealth_urban_construction: "Städtische Expansion der Bürger"
 cc_wealth_urban_construction_desc: "Die Bürger haben diesen Ort für eine beschleunigte Entwicklung vorbereitet und stellen für zehn Jahre drei zusätzliche Bauplätze zur Verfügung."
 STATIC_MODIFIER_NAME_cc_wealth_urban_construction: "Städtische Expansion der Bürger"
