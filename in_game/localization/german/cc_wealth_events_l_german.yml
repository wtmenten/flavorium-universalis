 # Wealth Hoarding Events

 cc_wealth.1.title: "Den Schein wahren"
 cc_wealth.1.desc: "Unsere Schatzkammer ist über jeden praktischen Bedarf hinaus angeschwollen. Der Hof wird unruhig – Adlige raunen über Geiz, und kleinere Mächte betrachten unsere Trägheit mit Neugier. Der Schein muss gewahrt bleiben, auf die eine oder andere Weise."
 cc_wealth.1.a: "Veranstalte die großen Zeremonien."
 cc_wealth.1.b: "Unser Geld hat bessere Verwendung als für Spektakel."

 cc_wealth.2.title: "Ein prunkvolles Fest"
 cc_wealth.2.desc: "Unsere Minister haben eine außergewöhnliche Feier vorgeschlagen — ein Treffen der Höfe, ein Fest des Reiches. Es würde eine beträchtliche Summe kosten, aber das gewonnene Prestige könnte den Aufwand durchaus wert sein."
 cc_wealth.2.a: "Sparen Sie nicht an den Kosten. Lassen Sie sie staunen."
 cc_wealth.2.b: "Ein ruhiger Abend wird genügen."

 cc_wealth.3.title: "Der Adel fordert Baumaßnahmen"
 cc_wealth.3.desc: "Der Hochadel ist unruhig geworden. Unser Schatzamt, so sagen sie, sollte auf greifbare Werke ausgerichtet werden – Befestigungen, Gutshofkomplexe, Institutionen, die die Macht des Adels zementieren. Sie sind mit einer Forderung gekommen."
 cc_wealth.3.a: "Finanziere den Bau."
 cc_wealth.3.b: "Unsere Schatzkammer bleibt in unserem Besitz."

 cc_wealth.5.title: "Die Kaufleute fordern Investitionen"
 cc_wealth.5.desc: "Die Bürgerschicht ist ungeduldig geworden. Unsere gehortete Schatzkammer, so argumentieren sie, sollte für den Ausbau der kommerziellen Infrastruktur eingesetzt werden. Sie haben einen Vorschlag unterbreitet — und einen Preis genannt."
 cc_wealth.5.a: "Finanziere die Erweiterung."
 cc_wealth.5.b: "Ihre Ambitionen sind nicht unsere Verpflichtung."

 cc_wealth.6.title: "Der Klerus fordert sakrale Werke"
 cc_wealth.6.desc: "Der Klerus hat das Ausmaß unserer Schatzkammer mit spiritueller Besorgnis zur Kenntnis genommen. Gehorteter Reichtum bringe keinen Segen, sagen sie — nur Werke, die dem Göttlichen gewidmet sind, können eine solche Anhäufung rechtfertigen. Sie haben einen Preis genannt."
 cc_wealth.6.a: "Finanziere die heiligen Werke."
 cc_wealth.6.b: "Die Schatzkammer ist kein Zehnter."

 cc_wealth.4.title: "Eine ambitionierte Ankunft"
 cc_wealth.4.desc: "Die Kunde vom Wohlstand unseres Königreichs hat sich verbreitet. Eine fähige Persönlichkeit – Gelehrter, Soldat oder Staatsmann – ist am Hof eingetroffen und sucht eine Anstellung. Ihre Dienste haben ihren Preis, aber Talent dieser Art begegnet man selten zweimal."
 cc_wealth.4.a: "Willkommen. Zahle den Preis."
 cc_wealth.4.b: "Wir haben genug an unserem Hof."

