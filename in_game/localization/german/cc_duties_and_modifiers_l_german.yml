l_german:
 # ============================================================
 # Cabinet Duty Actions
 # ============================================================
 cc_duty_free_hands: "Freie Hände"
 cc_duty_free_hands_desc: "Der Minister kümmert sich um alles, was der Hof verlangt – er steht für Audienzen, Petitionen und die gesamte Palette an müßigen Hofpflichten zur Verfügung. Alle Ereignissysteme des Kabinetts bleiben mit ihrer Basisrate aktiv."
 cc_duty_free_hands_action: "Freie Hände"
 cc_duty_free_hands_active: "Freie Hände"

 cc_duty_war_council: "Kriegsrat"
 cc_duty_war_council_desc: "Der Minister ist offiziell mit der Führung des Krieges betraut – berät bei Kampagnen, verwaltet die Logistik und hält den Kampfwillen aufrecht. Ereignisse des Kriegsrates lösen häufiger aus, solange diese Aufgabe zugewiesen ist. Endet automatisch, wenn Frieden geschlossen wird."
 cc_duty_war_council_action: "Kriegsrat"
 cc_duty_war_council_active: "Beratung des Kriegsrates"

 cc_duty_diplomatic_mission: "Diplomatische Mission"
 cc_duty_diplomatic_mission_desc: "Der Minister ist an einem fremden Hof stationiert, knüpft Beziehungen und vertritt die Interessen des Reiches im Ausland. Internationale Synergie-Ereignisse mit dem Zielhof treten häufiger auf."
 cc_duty_diplomatic_mission_action: "Diplomatische Mission"
 cc_duty_diplomatic_mission_active: "Auf diplomatischer Mission"
 cc_duty_diplomatic_mission_select_target: "Wählen Sie den Hof aus, an den dieser Minister entsandt werden soll:"

 cc_duty_domestic_reform: "Inlandsreform"
 cc_duty_domestic_reform_desc: "Der Minister widmet sich der inneren Verwaltung – entwirft Gesetze, strukturiert die Bürokratie um und treibt Reformvorschläge voran. Ereignisse für den Fortschritt von Zwischenstufen-Merkmalen lösen doppelt so häufig wie normal aus."
 cc_duty_domestic_reform_action: "Inlandsreform"
 cc_duty_domestic_reform_active: "Reformen entwerfen"

 cc_duty_scholarly_inquiry: "Gelehrte Untersuchung"
 cc_duty_scholarly_inquiry_desc: "Der Minister korrespondiert mit Gelehrten, fördert die Wissenschaft und betreibt empirische Forschung. Die Ereigniskette 'Hof der Gelehrten' wird aktiver, solange diese Pflicht wahrgenommen wird."
 cc_duty_scholarly_inquiry_action: "Gelehrte Untersuchung"
 cc_duty_scholarly_inquiry_active: "Wissenschaftliche Forschung betreiben"

 cc_duty_colonial_posting: "Kolonialposten"
 cc_duty_colonial_posting_desc: "Der Minister ist in Übersee stationiert, um ein Kolonialgebiet zu verwalten – eine Chartergesellschaft, eine Kolonialnation oder ein Provinzgouvernement. Ereignisse der Kolonialverwaltung lösen regelmäßig aus, und der Minister kann mit hart erkämpfter Grenzlanderfahrung zurückkehren."
 cc_duty_colonial_posting_action: "Kolonialposten"
 cc_duty_colonial_posting_active: "Übersee stationiert"
 cc_duty_colonial_posting_select_colony: "Wählen Sie das Kolonialgebiet aus, in das dieser Minister entsandt werden soll:"

 cc_duty_religious_oversight: "Religiöse Aufsicht"
 cc_duty_religious_oversight_desc: "Der Minister beaufsichtigt konfessionelle Angelegenheiten – verwaltet die religiöse Konformität, die Beziehungen zwischen den Glaubensrichtungen und die theologische Politik am Hof. Ereignisse zur Reformation und religiösen Spannung werden aktiver."
 cc_duty_religious_oversight_action: "Religiöse Aufsicht"
 cc_duty_religious_oversight_active: "Aufsicht über konfessionelle Angelegenheiten"

 # ============================================================
 # Cabinet Composition Auto-Modifiers
 # ============================================================
 warlord_court: "Hof des Kriegsherrn"
 warlord_court_desc: "Der Rat spricht mit einer einzigen militärischen Stimme. Zwei oder mehr Militärspezialisten dominieren das Kabinett und verleihen ihm Disziplin und Entschlossenheit — doch andere Interessen des Reiches werden vernachlässigt."

 merchant_republic_spirit: "Geist des Kontors"
 merchant_republic_spirit_desc: "Handel und Finanzen bestimmen das Denken des Kabinetts. Handelsnetze florieren, aber die militärischen Ambitionen des Reiches werden stillschweigend mit Männern unterversorgt."

 enlightened_court: "Aufgeklärter Hof"
 enlightened_court_desc: "Empiristen und Rationalisten haben am Hofe eine Heimat gefunden. Das Wissen schreitet voran und die Kosten der Staatsführung sinken — wenngleich das militärische Prestige nicht mehr das ist, was es einmal war."

 court_paralysis: "Hoflähmung"
 court_paralysis_desc: "Gegnerische Fraktionen innerhalb des Kabinetts haben einen Stillstand erreicht. Jede Entscheidung wird angefochten, jede Reform verzögert – doch die Spannung könnte noch zu unerwarteten Kompromissen führen."

 entrenched_court: "Verfestigter Hof"
 entrenched_court_desc: "Das Kabinett besteht ausschließlich aus langjährigen Veteranen. Ihre tiefe Vertrautheit mit den Wegen des Reiches verleiht Stabilität, aber an frischem Denken mangelt es."

 balanced_court: "Ausgeglichener Hof"
 balanced_court_desc: "Keine einzelne Fraktion dominiert, keine Ideologie spaltet. Das Kabinett befindet sich in einem kalkulierten Gleichgewicht – Prestige fließt dem Reich zu und das Wort des Herrschers ist seine eigene Antwort."
