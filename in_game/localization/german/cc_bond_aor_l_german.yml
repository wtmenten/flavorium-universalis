l_german:
 # === cc_bonds.90 — A Loyal Colony in Turbulent Times ===
 cc_bonds.90.title: "Eine loyale Kolonie in turbulenten Zeiten"
 cc_bonds.90.desc: "Das Zeitalter der Revolutionen ist angebrochen, und die Kolonien der Welt regt sich. [bond_subj.GetName] hingegen nicht. Jahrzehnte gemeinsamer Verwaltung und wirtschaftlicher Investitionen haben eine Kolonialbevölkerung hervorgebracht, die ihre Zukunft innerhalb des Reiches und nicht außerhalb sieht, sowie eine Kolonialführung, die dieses Jahr damit verbracht hat, ihr eigenes Volk vor den Pamphleten zu bewahren. Das ist kein Glück. Das ist das Ergebnis der Bilanz."
 cc_bonds.90.a: "Erkennt ihre Loyalität formell an und lasst jede andere Kolonie davon lesen."
 cc_bonds.90.b: "Erhebt Notlevyen, solange wir ihr Wohlwollen haben."
 cc_bonds.90.c: "Lade sie in den Kaiserrat ein."

 # === cc_bonds.91 — The Colony Finds Its Voice ===
 cc_bonds.91.title: "Die Kolonie findet ihre Stimme"
 cc_bonds.91.desc: "[bond_subj.GetName] hat nicht darauf gewartet, dass man ihm sagt, auf welcher Seite es steht. Revolutionäre Pamphlete zirkulieren offen, öffentliche Versammlungen sind zu Demonstrationen geworden, und die Stimmung hat sich von Groll zu Überzeugung gewandelt. Das Register der Ausbeutung, der abgelehnten Petitionen und der Gouverneure, die Steuern erhoben und genommen, aber nichts zurückgaben, wurde sorgfältig geführt. Die Abrechnung ist da."
 cc_bonds.91.a: "Härte zeigen. Machen Sie deutlich, wer diese Kolonie regiert."
 cc_bonds.91.b: "Rücke in allem zurecht, was wir schon vor Jahren hätten einräumen sollen."

 # === cc_bonds.92 — The Governor Stands With the Crown ===
 cc_bonds.92.title: "Der Gouverneur steht auf der Seite der Krone"
 cc_bonds.92.desc: "Der revolutionäre Moment, der andere Provinzen erschüttert hat, findet [bond_subj.GetName] ruhig vor. Der Gouverneur hat nicht nur die Ordnung aufrechterhalten; er hat die lokale Verwaltung hinter der Krone versammelt, Unruhen im Keim erstickt und geschrieben, um zu erklären, wie er es tat, statt um Anerkennung zu bitten. Die Infrastruktur, die wir finanzierten, und die Verwalter, die wir als Partner behandelten, zahlen nun Dividenden zurück, genau dann, wenn es darauf ankommt."
 cc_bonds.92.a: "Lobe den Gouverneur öffentlich."

 # === cc_bonds.93 — The Province Remembers ===
 cc_bonds.93.title: "Die Provinz erinnert sich"
 cc_bonds.93.desc: "Das revolutionäre Zeitalter hat [bond_subj.GetName] erreicht, und die Provinz hat darauf gewartet. Die Depeschen des Gouverneurs sind kürzer geworden und seine Antworten langsamer. Die letzte beschrieb die Situation als beherrschbar, was das bürokratische Wort für eine Situation ist, die es nicht ist. Jahrzehnte der Ausbeutung, von Gouverneuren, die für die Eintreibung statt für die Regierungsführung belohnt wurden, von lokalem Recht, das der administrativen Bequemlichkeit weichen musste: Nichts davon wurde vergessen."
 cc_bonds.93.a: "Zahlt, was nötig ist, um diese Provinz zu halten. Ganz gleich, was es kostet."
 cc_bonds.93.b: "Haltet es mit der Garnison. Zustimmung ist kein verfügbares Instrument mehr."

 # === cc_bonds.94 — The Palatinate Answers the Call ===
 cc_bonds.94.title: "Die Pfalz folgt dem Ruf"
 cc_bonds.94.desc: "Das Zeitalter der Revolutionen bringt eine Prüfung der Loyalität mit sich, und [bond_subj.GetName] hat diese eindeutig bestanden. Der Pfalzgraf hat ohne Aufforderung mobilisiert, seine volle militärische Unterstützung schriftlich zugesagt und seinen ältesten Sohn als persönliche Geste in unsere Armee entsandt. Die Zeremonien wurden geehrt, die Rekrutierungen fair gehandhabt, die Fehden mit Geduld geschlichtet: Er hat an nichts davon vergessen."
 cc_bonds.94.a: "Wir sind geehrt. Die Pfalzgrafschaft steht an unserer Seite."
 cc_bonds.94.b: "Begleichen Sie zuerst die alten Schulden, dann ziehen Sie gemeinsam in die Schlacht."

 # === cc_bonds.95 — The Palatinate Declares Armed Neutrality ===
 cc_bonds.95.title: "Die Pfalz erklärt die bewaffnete Neutralität"
 cc_bonds.95.desc: "Der Herr von [bond_subj.GetName] hat eine formelle Erklärung gesendet. Er schließt sich nicht der Revolution an. Er schließt sich uns aber auch nicht an. Die Pfalz befindet sich in einem Zustand bewaffneter Neutralität, was in der Praxis bedeutet, dass seine Truppen nur sein Territorium verteidigen werden, dass er nicht auf Ruf zu den Waffen antworten wird und dass er abwarten will, wie sich das Zeitalter entscheidet, bevor er sich weiter bindet. Jahrzehnte ignorierter Petitionen und weggelassener Zeremonien haben einen Herrn hervorgebracht, dem es gleichgültig geworden ist, ob die Krone überlebt."
 cc_bonds.95.a: "Akzeptiere die Erklärung. Neutralität ist besser als offene Revolte."
 cc_bonds.95.b: "Kaufe den Lord zurück. Egal wie hoch die Rückstände sind, bezahle sie."

 # === cc_bonds.96 — The March Holds the Frontier ===
 cc_bonds.96.title: "Die Mark hält die Grenze"
 cc_bonds.96.desc: "Das revolutionäre Zeitalter hat viele Grenzen destabilisiert, doch [bond_subj.GetName] hat jeden Zoll der unseren gehalten. Der Grenzherr hat die Grenze so verteidigt, dass die Krone kompetent wirkt: schnell, fähig und eindeutig in unserem Namen handelnd. Seine Briefe sind kurz und professionell. Er bittet nicht um Anerkennung. Die geehrten Zeremonien, die geteilte Beute, die finanzierte Garnison – all dies schuf eine Militärkultur, die uns nun dient."
 cc_bonds.96.a: "Der Markgraf hat der Krone gut gedient. Sagt es so."
 cc_bonds.96.b: "Übernimm den Schützling in unser eigenes Kommando. Er ist aus der Grenzregion herausgewachsen."

 # === cc_bonds.97 — The March Lord Raises His Own Banner ===
 cc_bonds.97.title: "Der Markgraf erhebt sein eigenes Banner"
 cc_bonds.97.desc: "Der Markgraf von [bond_subj.GetName] hat sein eigenes Banner erhoben. Dies ist kein Bauernaufstand oder ein Pamphlet. Dies ist ein militärischer Befehlshaber mit ausgebildeten Soldaten, intimer Kenntnis der Grenze und jahrelang angesammeltem Groll, den wir nicht ernst nahmen. Die verweigerte Garnison, die behaltenen Beuten, die weggelassenen Zeremonien: Er führte sein eigenes Buch, und er hat beschlossen, dass die Schuld nun in einer anderen Währung zu begleichen ist."
 cc_bonds.97.a: "Sendet einen Gesandten mit Bedingungen. Zahlt, was wir schon vor Jahren hätten zahlen sollen."
 cc_bonds.97.b: "Er ist ein Untertan in Revolte. Behandle ihn entsprechend."

 # === cc_bonds.98 — The Dependency Stands True ===
 cc_bonds.98.title: "Die Abhängigkeit bleibt treu"
 cc_bonds.98.desc: "Unter den alarmierenden Depeschen des revolutionären Zeitalters liest sich eine Notiz anders. Das Herrscherhaus von [bond_subj.GetName] hat geschrieben, nicht um etwas zu fordern, nicht um zu verhandeln, nicht um uns vor Unruhen zu warnen, sondern um ihre Loyalität zu bekräftigen. Der Brief ist persönlich. Er erinnert an die Besuche und Zeremonien, an die Momente, in denen die Krone ihr Haus wie Familie und nicht wie einen Klienten behandelte. Benachbarte Höfe haben dies bemerkt."
 cc_bonds.98.a: "Antworte im gleichen Ton. So sieht eine dauerhafte Beziehung aus."

 # === cc_bonds.99 — The Dependency Looks Elsewhere ===
 cc_bonds.99.title: "Die Abhängigkeit blickt anderswo hin"
 cc_bonds.99.desc: "Ein Brief vom Herrscherhaus von [bond_subj.GetName] ist eingetroffen. Er ist höflich, besonnen und vernichtend. Sie erklären nicht ihre Unabhängigkeit und sie schließen sich keiner revolutionären Koalition an. Sie prüfen still und formal, welche anderen Arrangements verfügbar sein könnten. Sie haben eine benachbarte Macht identifiziert, die Interesse bekundet hat. Dass sie uns zuerst informieren, ist womöglich ihr letzter Akt der Loyalität."
 cc_bonds.99.a: "Bietet alles an, was wir schon vor Jahren hätten anbieten sollen. Bittet sie zu bleiben."
 cc_bonds.99.b: "Wenn sie eine bessere Regelung gefunden haben, steht ihnen nichts im Weg."
 cc_bonds.99.c: "Sie sind unsere Abhängigkeit. Sie haben nicht das Recht, Arrangements zu prüfen."
 cc_bonds.90.desc.deep: "Das Zeitalter der Revolutionen ist angebrochen, und die Kolonien der Welt regt sich. In [bond_subj.GetName] hat die Kolonialversammlung ohne Aufforderung einen Loyalitätsbeschluss gefasst, und die Miliz wurde uns zur Verfügung gestellt, anstatt im Heimatland zu bleiben. Ihr Gouverneur schreibt, dass er keine Probleme erwartet, und nennt Gründe statt bloßer Zusicherungen. Eine so tiefe Beziehung ist der Krone derzeit mehr wert als eine Flotte."
 cc_bonds.90.desc.voice: "Das Zeitalter der Revolutionen ist angebrochen, und in [bond_subj.GetName] wird die Debatte im von uns gecharterten Versammlungssaal geführt und nicht auf der Straße. Die Delegierten debattieren ausführlich und öffentlich über Loyalität, Besteuerung und Repräsentation, und sie tun dies als Mitglieder des Reiches und nicht als dessen Kritiker. Für jede Beschwerde, die die Revolutionäre anderswo hinausschreien, hat diese Kolonie einen formalen Kanal. Dieser Kanal ist der Grund, warum wir ein Protokoll lesen und keine Verlustliste."
 cc_bonds.91.desc.deep: "[bond_subj.GetName] streitet nicht mehr mit uns. Die Kolonialversammlung, so weit sie existierte, hat sich aufgelöst und als etwas mit einem anderen Namen und einer beigefügten Erklärung neu konstituiert. Milizkompanien exerzieren bei Tageslicht. Unsere Zollbeamten wurden mit ihren Papieren und ihrer Würde intakt zu den Docks eskortiert, was irgendwie schlimmer ist. Sie bitten nicht um Wiedergutmachung. Sie beschreiben, was als Nächstes passiert."
 cc_bonds.91.desc.scholar: "Die in [bond_subj.GetName] zirkulierenden Pamphlete sind keine Importe. Sie werden dort geschrieben, und sie werden gut geschrieben, von dem Gelehrten, von dem wir vor einer Generation entschieden hatten, dass es sicherer sei, ihn zum Schweigen zu bringen, als ihm zu antworten. Die Unterdrückung beendete das Argument nicht; sie entfernte lediglich unsere Seite aus der Diskussion. Die kolonialen Drucker kommen mit der Nachfrage nicht hinterher, und die Demonstrationen vor der Residenz des Gouverneurs zitieren uns unsere eigenen Charten zurück."
 cc_bonds.91.desc.faith: "Der revolutionäre Moment hat [bond_subj.GetName] erreicht, und der Klerus führt ihn an. Die von uns aufgezwungene Konversion wurde öffentlich akzeptiert und privat missbilligt, solange Missbilligung alles war, was blieb. Die alten Riten sind in derselben Woche wie die neuen Pamphlete wieder aufgetaucht, und beides wird von denselben Kanzeln gepredigt. Glaube und Groll haben einander gefunden, und keines von beiden ist nun verhandelbar."
 cc_bonds.91.c: "Lasst sie ziehen, bevor der Streit den Ozean überquert."
 cc_bonds.92.desc.deep: "[bond_subj.GetName] ist in diesem Jahr ruhiger als seit einem Jahrzehnt. Der Gouverneur hat mehr getan, als seine Provinz zu halten: Er hat uns eine lokal getestete Arbeitsmethode geschickt, um eine Bevölkerung in einem Zeitalter loyal zu halten, das das Gegenteil belohnt. Seine Beamten sind kompetent, seine Abrechnungen sind ehrlich, und seine Briefe lesen sich so, als wäre die Revolution ein Wetterereignis gewesen, auf das er vorbereitet war. Wir könnten zwanzig von ihm gebrauchen."
 cc_bonds.92.desc.council: "Der Provinzrat, den wir einberufen haben, hat dieses Jahr genau das getan, wofür Räte da sind. Er hat die Beschwerden gehört, die anderswo in Aufstände ausarten würden, hat ausführlich darüber gestritten und Empfehlungen statt Forderungen ausgesprochen. Der Gouverneur leitet diese mit seiner Zustimmung weiter. [bond_subj.GetName] ist nicht ruhig, weil es zufrieden ist; es ist ruhig, weil es einen Ort hat, an dem es seinen Unmut ablassen kann."
 cc_bonds.92.b: "Schickt seine Verwalter in unsere eigenen Provinzen. Wir brauchen sein Wissen."
 cc_bonds.93.desc.deep: "Der Gouverneur von [bond_subj.GetName] hat aufgehört zu schreiben. Was uns stattdessen erreicht, ist eine Petition, unterzeichnet von Namen, die wir nicht beschäftigen, in der jedes Statut aufgelistet ist, das wir gegen lokalen Widerstand durchgesetzt haben, zusammen mit dem Datum und dem vermerkten Einspruch. Es ist keine Drohung. Es ist eine Anklage, und sie ist zutreffend. Die Provinz führt dieses Dokument seit einem Jahrhundert und hat beschlossen, dass der Moment gekommen ist, es einzureichen."
 cc_bonds.93.desc.faith: "Die Provinz hat den revolutionären Moment als Erlaubnis genutzt, eine ältere Frage zu beantworten. Die von uns angeordnete Konversion wird in der Praxis schneller rückgängig gemacht, als wir es aufzeichnen können, und die Männer, die diese Umkehrung leiten, sind dieselben Männer, die wir mit ihrer Durchsetzung beauftragt hatten. [bond_subj.GetName] lehnt nicht die Autorität der Krone im Allgemeinen ab. Es lehnt die eine Anwendung dieser Autorität ab, die dort nie jemand akzeptiert hat."
 cc_bonds.93.c: "Die Situation ist, wie sie ist. Wir schlagen uns so gut durch, wie wir können."
 cc_bonds.94.desc.deep: "Der Herr von [bond_subj.GetName] ist persönlich am Hof erschienen, was nicht von ihm verlangt wurde, an der Spitze einer Kolonne, die er auf eigene Kosten aufgestellt hat, was er ganz sicher nicht tun musste. Er hat sich und sein Haus für die Dauer des Einsatzes unserem Kommando gestellt und schriftlich um nichts gebeten. In einem Zeitalter, in dem Großmächte ihre Hauptstädte an ihre eigenen Bürger verlieren, verhält sich ein Pfalzgraf so, als ob die alten Verpflichtungen noch immer das bedeuten, was sie sagen."
 cc_bonds.94.desc.interregnum: "Die Pfalz hat aufmarschiert, und der Brief des Herrn ist herzlich, und es befindet sich ein zweiter Brief, gefaltet im ersten. Er betrifft das Interregnum: die Monate, in denen die Thronfolge umstritten war, als sein Haus die Krone um Schlichtung bat und die Krone nicht rechtzeitig antwortete. Danach wurde nichts mehr gesagt. Er sagt jetzt auch nicht viel. Er stellt lediglich fest, dass die Angelegenheit nie geklärt wurde und dass er dennoch aufmarschiert."
 cc_bonds.94.c: "Fordere seinen besten Ritter an. Wir müssen einen Krieg führen und haben niemanden, der ihn leitet."
 cc_bonds.95.desc.deep: "Die Erklärung aus [bond_subj.GetName] ist drei Sätze lang und wurde an jeden benachbarten Hof geschickt, bevor sie uns erreichte. Die Pfalz wird sich selbst verteidigen. Sie wird die Regierung anerkennen, welche am Ende dieser Zeit unsere Hauptstadt kontrolliert. Sie betrachtet ihre Verpflichtungen als erfüllt. Der Herr hat nicht rebelliert, was zumindest eine Beziehung gewesen wäre. Er hat uns schlichtweg vollständig aus seinen Kalkulationen gestrichen."
 cc_bonds.95.desc.fort: "Die Erklärung des Herrn erwähnt die Festung nur einmal beiläufig als den Ort, von dem aus er seine Neutralität führen wird. Er muss nicht mehr sagen. Wir verweigerten die Finanzierung, die Mauern wurden dennoch mit seinem eigenen Geld errichtet, und die Garnison untersteht seitdem seinem Haus. Wir haben den Groll geschaffen und er hat die Festung gebaut, und nun sind die beiden dasselbe Objekt."
 cc_bonds.95.c: "Die Pfalz untersteht uns. Sie wird jetzt gehorchen."
 cc_bonds.96.desc.deep: "[bond_subj.GetName] hat das Jahr damit verbracht, etwas Schwereres zu tun, als die Grenze zu halten. Es hat die Grenze gehalten, während das Landesinnere brannte, zwei Flüchtlingswellen aus Provinzen aufgenommen, die wir nicht schützen konnten, und einen Sondierungsangriff eines Nachbarn zurückgeschlagen, der unsere Probleme für eine Gelegenheit hielt. Die Depesche des Grenzherrn zu diesem Thema umfasst vier Zeilen. Drei davon handeln von der Versorgung."
 cc_bonds.96.desc.fort: "Die Grenze hat gehalten, und die Festung, die wir finanzierten, ist der Grund dafür. Der Bericht des Markgrafen ist größtenteils eine Liste dessen, was die Mauern überflüssig machten: Schlachten, die nicht geschlagen wurden, Dörfer, die nicht evakuiert werden mussten, und eine Belagerung, die endete, als der Belagerer die Geschütze zählte und heimkehrte. Geld, das vor Jahrzehnten in Stein investiert wurde, hat sich als die billigste Truppe erwiesen, die wir je gekauft haben."
 cc_bonds.96.desc.ward: "Der junge Mann, den wir am Hofe großgezogen haben, ist heimgekehrt, um die Streitkräfte seines Vaters zu befehligen, und die Grenze war noch nie besser gesichert. Er kennt unseren Stab, unser Versorgungssystem und unsere Erwartungen, weil er in ihnen aufgewachsen ist, und er kennt das Land, weil er dort geboren wurde. Was als Geiselarrangement begann, hat das Eine hervorgebracht, was kein Vertrag leisten kann: einen Grenzkommandanten, der gleichzeitig wahrhaftig der Unsere und wahrhaftig der Ihren ist."
 cc_bonds.97.desc.deep: "Die Mark ist vollständig übergegangen. Nicht nur eine Fraktion, nicht eine umstrittene Thronfolge: der Herr, seine Offiziere, seine Aufgebote und seine Festungen, in einer einzigen Bewegung, an einem Datum, das er offensichtlich im Voraus gewählt hat. Unsere Grenzgarnisonen erfuhren davon, als ihre Entlastungskolonnen nicht eintrafen. Er hat eine Generation lang gelernt, wie wir Feldzüge führen, und er ist im Begriff, dies zu demonstrieren."
 cc_bonds.97.desc.fort: "Das Banner wurde über der Festung gehisst, und das ist das Detail, auf das es ankommt. Wir weigerten uns, diese Mauern zu finanzieren; der Grenzherr baute sie trotzdem und erwähnte es nie wieder. Nun wird die stärkste Position an unserer Grenze von dem Mann gehalten, der sie bezahlt hat, und jedes Argument, das wir über Verpflichtungen vorbringen könnten, stößt auf eine Abrechnung, die wir lieber nicht laut vorgelesen bekämen."
 cc_bonds.97.desc.ward: "Der Markgraf, der sein Banner gegen uns erhoben hat, ist der Junge, den wir an den Hof brachten. Wir lehrten ihn unseren Exerzierdienst, unsere Stabsarbeit und unsere Versorgungstabellen, und wir lehrten ihn gleichzeitig genau, wie wenig der Dienst seiner Familie geschätzt wurde. Er hat uns für die erste Ausbildung gedankt, indem er sie nun anwendet. Die Offiziere, die ihm nun gegenüberstehen, wurden an seiner Seite ausgebildet."
 cc_bonds.97.c: "Lass ihn ziehen. Überlass ihn dem Zeitgeist, und lass ihn weit weg von hier sein."
 cc_bonds.98.desc.deep: "Das Regierungshaus von [bond_subj.GetName] hat etwas getan, zu dem es kein Vertrag verpflichtet hat. Sie haben den Höfen geschrieben, die sie ausspionierten, und ihnen in einer Sprache, die sie bewusst zitierfähig gestalteten, mitgeteilt, dass sich die Frage gar nicht erst stelle. Der Brief an uns kam erst danach, fast wie ein Nachtrag, und handelt hauptsächlich von einer Taufe. Die Hälfte Europas weiß nun, was unser Wort wert ist, weil es jemand anderes für uns ausgesprochen hat."
 cc_bonds.98.b: "Bitte sie, in den Höfen, die uns beobachten, für uns zu sprechen."
 cc_bonds.99.desc.deep: "Der Brief von [bond_subj.GetName] ist nicht länger tastend. Bedingungen wurden besprochen, ein Entwurf existiert und ein Datum wurde genannt. Sie haben uns aus Höflichkeit eine Zusammenfassung geschickt. Beim Lesen ist das Auffälligste, wie wenig davon uns betrifft: Wir sind die Vereinbarung, die ersetzt wird, beschrieben in der Vergangenheitsform, von Menschen, die vor einiger Zeit aufgehört haben, etwas von uns zu erwarten, und nun endlich einen anderen Ort gefunden haben, von dem sie es erwarten können."
