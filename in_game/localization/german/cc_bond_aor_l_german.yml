l_german:
 # === cc_bonds.90 — A Loyal Colony in Turbulent Times ===
 cc_bonds.90.title: "Eine loyale Kolonie in turbulenten Zeiten"
 cc_bonds.90.desc: "Das Zeitalter der Revolutionen ist angebrochen, und die Kolonien der Welt regt sich. Doch [bond_subj.GetName] regt sich nicht — es bleibt standhaft. Jahrzehnte gemeinsamer Verwaltung, wirtschaftlicher Investitionen und politischer Partnerschaft haben etwas hervorgebracht, das keine Proklamation künstlich erschaffen könnte: eine Kolonialbevölkerung, die ihre Zukunft innerhalb des Reiches und nicht außerhalb sieht. Die Kolonialführung hat es nicht nur unterlassen, sich den revolutionären Strömungen anzuschließen — sie hat aktiv daran gearbeitet, ihre Bevölkerung davon fernzuhalten. So sieht eine Generation guter Entscheidungen aus."
 cc_bonds.90.a: "Erkenne die Loyalität von [bond_subj.GetName] formell an. Hebe ihren Status innerhalb des Reiches hervor."
 cc_bonds.90.b: "Notlevées ausrufen, solange wir ihr Wohlwollen haben. Die Revolution ist noch nicht vorbei."
 cc_bonds.90.c: "Lade sie in den Kaiserrat ein."

 # === cc_bonds.91 — The Colony Finds Its Voice ===
 cc_bonds.91.title: "Die Kolonie findet ihre Stimme"
 cc_bonds.91.desc: "Das Zeitalter der Revolutionen ist angebrochen, und [bond_subj.GetName] hat nicht darauf gewartet, dass man ihm sagt, auf welcher Seite es steht. Die Kolonialführung — oder das, was davon uns noch loyal gegenübersteht — berichtet, dass revolutionäre Pamphlete offen zirkulieren, dass öffentliche Versammlungen zu Demonstrationen werden und dass sich die Stimmung von bloßem Unmut zu fester Überzeugung gewandelt hat. Dies geschah nicht über Nacht. Das Register der Ausbeutung, der abgelehnten Petitionen, der Gouverneure, die Steuern erhoben und nahmen, aber nie etwas zurückgaben — es wurde geführt, und die Abrechnung ist nun da."
 cc_bonds.91.a: "Härte zeigen. Machen Sie deutlich, wer diese Kolonie regiert."
 cc_bonds.91.b: "Wir geben nach. Alles, was wir vor Jahren hätten tun sollen, tun wir nun."

 # === cc_bonds.92 — The Governor Stands With the Crown ===
 cc_bonds.92.title: "Der Gouverneur steht auf der Seite der Krone"
 cc_bonds.92.desc: "Der revolutionäre Moment, der andere Provinzen erschüttert hat, findet [bond_subj.GetName] bemerkenswert ruhig. Der Gouverneur hat nicht nur die Ordnung aufrechterhalten – er hat die lokale Verwaltung aktiv zur Loyalität gegenüber der Krone mobilisiert, Unruhen unterdrückt, bevor sie Wurzeln schlagen konnten, und uns schriftlich über die Stabilität seiner Provinz versichert. Die Infrastruktur, die wir finanzierten, die rechtlichen Rahmenbedingungen, die wir gemeinsam schufen, die Verwalter, die wir als Partner statt als Instrumente behandelten – all dies zahlt nun Dividenden aus, wenn es am wichtigsten ist."
 cc_bonds.92.a: "Der Gouverneur hat sich mit Auszeichnung bewährt. Wir werden dies öffentlich bekannt geben."

 # === cc_bonds.93 — The Province Remembers ===
 cc_bonds.93.title: "Die Provinz erinnert sich"
 cc_bonds.93.desc: "Das revolutionäre Zeitalter hat [bond_subj.GetName] erreicht, und die Provinz hat darauf gewartet. Die Depeschen des Gouverneurs sind kürzer geworden, seine Antworten langsamer. Der letzte Bericht beschrieb die Situation als 'handhabbar' – das bürokratische Wort für eine Situation, die es nicht ist. Jahrzehnte der Ausbeutung, Gouverneure, die für die Eintreibung statt für die Verwaltung belohnt wurden, lokale Gesetze, die zugunsten administrativer Bequemlichkeit außer Kraft gesetzt wurden – die Provinz hat nichts davon vergessen. Sie hat lediglich auf den richtigen Moment gewartet, um es auszusprechen."
 cc_bonds.93.a: "Wir werden zahlen, was nötig ist, um diese Provinz zu halten. Ganz gleich, was es kostet."
 cc_bonds.93.b: "Die Situation ist, wie sie ist. Wir müssen das Beste daraus machen."

 # === cc_bonds.94 — The Palatinate Answers the Call ===
 cc_bonds.94.title: "Die Pfalz folgt dem Ruf"
 cc_bonds.94.desc: "Das Zeitalter der Revolutionen bringt eine Prüfung der Loyalität mit sich, und [bond_subj.GetName] hat sie so eindeutig wie nur möglich beantwortet. Der Pfalzgraf hat seine Streitkräfte ohne Aufforderung mobilisiert, sein volles militärisches Beistand angeboten und seinen ältesten Sohn als persönliche Geste in unsere Armee geschickt. Die Jahrzehnte geehrter Zeremonien, fair verwalteter Aufgebote, mit Geduld geschlichteter Fehden — der Pfalzgraf hat nichts davon vergessen. Er nennt es Dienst. Wir mögen es nennen, wie wir wollen, aber es ist eines der großartigsten Dinge, die ein Untertan je der Krone angeboten hat."
 cc_bonds.94.a: "Wir sind geehrt durch diese Loyalität. Die Pfalz steht an unserer Seite."
 cc_bonds.94.b: "Die Dienste des Herrn sind willkommen – und wir begleichen zuerst die alten Schulden."

 # === cc_bonds.95 — The Palatinate Declares Armed Neutrality ===
 cc_bonds.95.title: "Die Pfalz erklärt die bewaffnete Neutralität"
 cc_bonds.95.desc: "Der Herr von [bond_subj.GetName] hat eine formelle Erklärung gesendet. Er schließt sich nicht der Revolution an. Er schließt sich uns ebenfalls nicht an. Er hat erklärt, dass sich die Pfalz in einem Zustand 'bewaffneter Neutralität' befindet – eine Phrase, die in der Praxis bedeutet, dass seine Truppen sein Territorium und kein anderes verteidigen werden, dass er nicht auf Ruf zu den Waffen reagieren wird und dass er beabsichtigt abzuwarten, wie die Revolution ausgeht, bevor er weitere Verpflichtungen eingeht. Die Jahrzehnte der Vernachlässigung, der ignorierten Petitionen, der entfallenen Zeremonien und der gegen ihn entschiedenen Fehden haben dies hervorgebracht – einen Herrn, dem es schlichtweg gleichgültig geworden ist, ob die Krone überlebt."
 cc_bonds.95.a: "Die Erklärung akzeptieren. Neutralität ist besser als offene Rebellion."
 cc_bonds.95.b: "Wir werden dies nicht tolerieren. Die Pfalz ist uns nun Rechenschaft schuldig."

 # === cc_bonds.96 — The March Holds the Frontier ===
 cc_bonds.96.title: "Die Mark hält die Grenze"
 cc_bonds.96.desc: "Das revolutionäre Zeitalter hat an vielen Grenzen für Instabilität gesorgt, doch [bond_subj.GetName] hat jeden Zoll der unseren gehalten. Der Markgraf hat die Grenze nicht nur verteidigt – er tat dies auf eine Weise, die die Krone gut aussehen lässt: schnell, kompetent und eindeutig in unserem Namen handelnd. Seine Briefe sind kurz und professionell. Er bittet nicht um Anerkennung. Er tut einfach das, was ein loyaler Markgraf tut. Die Zeremonien, die wir ehrten, die Beute, die wir teilten, die Garnison, die wir finanzierten – all dies schuf eine Militärkultur, die uns nun dient, als wir sie am dringendsten benötigen."
 cc_bonds.96.a: "Der Markgraf hat der Krone gut gedient. Wir anerkennen seine Loyalität."
 cc_bonds.96.b: "Der Schützling, den wir an den Hof brachten, ist zurückgekehrt, um die Streitkräfte seines Vaters zu führen. Mehr hätten wir uns nicht wünschen können."

 # === cc_bonds.97 — The March Lord Raises His Own Banner ===
 cc_bonds.97.title: "Der Markgraf erhebt sein eigenes Banner"
 cc_bonds.97.desc: "Der Markgraf von [bond_subj.GetName] hat sein eigenes Banner erhoben. Dies ist kein Bauernaufstand oder ein revolutionäres Pamphlet – dies ist ein militärischer Befehlshaber mit ausgebildeten Soldaten, Kenntnissen des Grenzgeländes und jahrelang angesammeltem Groll, den wir nicht ernst genug genommen haben. Die Garnison, der wir die Finanzierung verweigerten, die Beute, die wir behielten, die Zeremonie, auf die wir verzichteten – der Markgraf führte sein eigenes Buch. Er hat entschieden, dass die Schuld nun in einer anderen Währung beglichen wird. Er bittet um nichts. Er teilt uns mit, was die Beziehung gekostet hat."
 cc_bonds.97.a: "Sende einen Gesandten mit Bedingungen. Wir werden zahlen, was wir schon vor Jahren hätten zahlen sollen."
 cc_bonds.97.b: "Er ist ein Vasall im Aufstand. Wir werden ihn entsprechend behandeln."

 # === cc_bonds.98 — The Dependency Stands True ===
 cc_bonds.98.title: "Die Abhängigkeit bleibt treu"
 cc_bonds.98.desc: "Unter all den alarmierenden Depeschen des revolutionären Zeitalters trifft eine Notiz ein, die anders klingt. Das Regierungshaus von [bond_subj.GetName] hat geschrieben, nicht um etwas zu erbitten, nicht um zu verhandeln und nicht, um uns vor Unruhen zu warnen – sondern schlicht, um ihre Loyalität zu bekräftigen. Der Brief ist in einem persönlichen Ton gehalten. Er erinnert an die Besuche, die Zeremonien, die Momente, in denen die Krone ihr Haus wie Familie und nicht wie einen Klientenstaat behandelte. Benachbarte Höfe haben dies bemerkt. Unser Ruf, dauerhafte Bande zu knüpfen statt kurzfristigen Gehorsam zu erzwingen, spricht sich in diesem Moment von selbst."
 cc_bonds.98.a: "So sieht eine dauerhafte Beziehung aus. Wir sind dankbar."

 # === cc_bonds.99 — The Dependency Looks Elsewhere ===
 cc_bonds.99.title: "Die Abhängigkeit blickt anderswo hin"
 cc_bonds.99.desc: "Ein Brief vom Regierungshaus von [bond_subj.GetName] ist eingetroffen. Er ist höflich, besonnen und vernichtend. Sie erklären nicht ihre Unabhängigkeit. Sie schließen sich keiner revolutionären Koalition an. Sie erkunden einfach – leise, formell – welche anderen Arrangements für sie verfügbar sein könnten. Sie haben eine benachbarte Macht identifiziert, die Interesse an einem Schutzangebot bekundet hat. Sie haben sich noch zu nichts verpflichtet. Sie teilen uns dies zuerst mit. Dies mag ihr letzter Akt der Loyalität sein: uns die Chance zu geben, zu reagieren, bevor sie formell ein neues Kapitel aufschlagen. Die Zeremonie, auf die wir verzichtet haben, die Einladung, die wir nicht verschickt haben, der Brief anstelle des Besuchs – sie erinnern sich an alles."
 cc_bonds.99.a: "Wir werden alles anbieten, was wir schon vor Jahren hätten anbieten müssen. Bitte – bleibt."
 cc_bonds.99.b: "Wenn sie eine bessere Vereinbarung gefunden haben, werden wir ihnen nicht im Weg stehen."
 cc_bonds.99.c: "Sie sind unsere Abhängigkeit. Sie haben nicht das Recht, 'Regelungen auszuhandeln'."
