l_german:
 ########################################
 # cc_hyw.1 — The Auld Alliance
 ########################################
 cc_hyw.1.title: "Die Auld Alliance"
 cc_hyw.1.desc: "Während England Truppen massiert und seinen Anspruch auf den französischen Thron geltend macht, beobachten unsere traditionellen Verbündeten in Schottland besorgt von der anderen Seite des Kanals aus. Sollte Frankreich seine Verpflichtung zur Unabhängigkeit Schottlands formalisieren, binden wir Englands Nordflanke – riskieren aber, den königlichen Zorn aus London auf uns zu ziehen."
 cc_hyw.1.a: "Garantiere Schottlands Unabhängigkeit."
 cc_hyw.1.b: "Versprich informelle Unterstützung, ohne formelle Verpflichtung."
 cc_hyw.1.c: "Frankreich schlägt seine eigenen Schlachten. Schottland muss sich selbst behelfen."

 ########################################
 # cc_hyw.10 — Victory Over England
 ########################################
 cc_hyw.10.title: "Sieg über England"
 cc_hyw.10.desc: "Die Engländer wurden zurückgedrängt. Unsere Armeen haben ihren Mut bewiesen, und die Fleur-de-Lis weht hoch. Wie sollen wir diesen Moment des Triumphs nutzen?"
 cc_hyw.10.a: "Lasst das Königreich jubeln. Erneuert unser Bündnis mit Schottland."
 cc_hyw.10.b: "Nutzen wir unseren Vorteil. Englands Vasallen in Frankreich lassen sich womöglich beeinflussen."

 ########################################
 # cc_hyw.11 — Defeat Darkens the Kingdom
 ########################################
 cc_hyw.11.title: "Die Niederlage verdunkelt das Königreich"
 cc_hyw.11.desc: "Der Krieg ist nicht so verlaufen wie erhofft. Unsere Armeen wurden zurückgedrängt, und der Adel wird unruhig. Der lange Schatten der Niederlage fällt über das Reich."
 cc_hyw.11.a: "Neu gruppieren und durchhalten. Frankreich hat Schlimmeres überstanden."
 cc_hyw.11.b: "Fordern Sie Opfer vom Adel. Sie werden die benötigten Rekruten stellen – zu einem Preis."

 ########################################
 # cc_hyw.12 — War Breaks Out in the West
 ########################################
 cc_hyw.12.title: "Krieg bricht im Westen aus"
 cc_hyw.12.desc: "Wir erhalten die Nachricht, dass [GetCountryName(scope:actor)] [GetCountryName(scope:recipient)] den Krieg erklärt hat. Die Großmächte des westlichen Christentums stehen sich erneut gegenseitig an der Gurgel. Wie sollen wir reagieren?"
 cc_hyw.12.a: "Biete an, zwischen den Parteien zu vermitteln."
 cc_hyw.12.b: "Wir drücken unsere Unterstützung für [GetCountryName(scope:actor)] aus."
 cc_hyw.12.c: "Stehe hinter [GetCountryName(scope:recipient)]."
 cc_hyw.12.d: "Das geht uns nichts an."

 ########################################
 # cc_hyw.13 — Victory in the West
 ########################################
 cc_hyw.13.title: "Sieg im Westen"
 cc_hyw.13.desc: "Unsere Armeen haben gesiegt. Ein weiterer Feind wurde vom französischen Boden zurückgedrängt. Das Königreich wird stärker, und der Adel feiert in den Hallen von Paris."
 cc_hyw.13.a: "Lasst die Adligen feiern. Frankreich ist siegreich."
 cc_hyw.13.b: "Nutzen wir den Vorteil, bevor sich unser Feind erholen kann."

 ########################################
 # cc_hyw.20 — Our Suzerain Falters
 ########################################
 cc_hyw.20.title: "Unser Suzerän wankt"
 cc_hyw.20.desc: "Frankreich hat eine Niederlage erlitten, und Paris scheint weit weg zu sein. Der Adel murmelt. Über das Wasser hinweg machen die Engländer Versprechen und übermitteln herzliche Grüße. Es ist an der Zeit, zu überdenken, wo unsere wahren Interessen liegen."
 cc_hyw.20.a: "Wende dich an England um Unterstützung."
 cc_hyw.20.b: "Fordern Sie größere Autonomie von der französischen Krone."
 cc_hyw.20.c: "Bleiben wir loyal. Unser Schicksal ist an Frankreich gebunden."

 ########################################
 # cc_hyw.21 — A Vassal Reaches Toward England
 ########################################
 cc_hyw.21.title: "Ein Vasall wendet sich an England"
 cc_hyw.21.desc: "[wavering_subject.GetName] stand in Kontakt mit den Engländern — suchte vielleicht nach Zusicherungen oder nach etwas mehr. Die Krone kann es sich nicht leisten, schwach zu erscheinen. Wie reagieren wir auf diesen Akt des Trotzes?"
 cc_hyw.21.a: "Bestrafen Sie die Untreue. Die Autorität der Krone wird nicht infrage gestellt."
 cc_hyw.21.b: "Besänftige sie mit Gold. Loyalität lässt sich kaufen."
 cc_hyw.21.c: "Lasst sie gehen. Wir können uns diese Ablenkung momentan nicht leisten."

 ########################################
 # cc_hyw.22 — Our Suzerain England Falters
 ########################################
 cc_hyw.22.title: "England wurde besiegt"
 cc_hyw.22.desc: "Englands Armeen wurden zurückgedrängt, und der König kämpft darum, seine Kontrolle über seine kontinentalen Territorien zu behalten. Die Franzosen machen Annäherungsversuche. Vielleicht ist es an der Zeit, unsere Position zu überdenken."
 cc_hyw.22.a: "Französischen Schutz suchen."
 cc_hyw.22.b: "Fordern Sie mehr Autonomie von der englischen Krone."
 cc_hyw.22.c: "Haltet stand. England wird sich erholen."

 ########################################
 # cc_hyw.23 — An English Vassal Demands Concessions
 ########################################
 cc_hyw.23.title: "Ein Vasall fordert Zugeständnisse"
 cc_hyw.23.desc: "[eng_wavering_subject.GetName] ist im Zuge unserer Niederlage kühner geworden. Sie fordern Zugeständnisse, und das Flüstern Frankreichs liegt in der Luft. England kann es sich nicht leisten, vor seinen kontinentalen Vasallen schwach zu erscheinen."
 cc_hyw.23.a: "Englische Autorität behaupten. Es werden keine Zugeständnisse gemacht."
 cc_hyw.23.b: "Sie auszahlen. Ein loyaler Vasall ist das Geld wert."
 cc_hyw.23.c: "Lassen Sie sie frei. Sie machen mehr Mühe, als sie wert sind."

 ########################################
 # cc_hyw.30 — The Lowlands Question
 ########################################
 cc_hyw.30.title: "Die Niederlande-Frage"
 cc_hyw.30.desc: "[lowlands_subject.GetName] sendet Gesandte nach [GetName] mit einer entschiedenen Forderung: Die niederländischen Provinzen, die in unserem jüngsten Sieg gesichert wurden, gehören ihnen aufgrund von Nähe, Kultur und langjährigen Interessen rechtmäßig zu. Ihren Anspruch abzulehnen, gefährdet die Loyalität eines wichtigen Vasallen – ihn jedoch anzuerkennen, bedeutet den Verzicht auf einen reichen Stützpunkt im Norden."
 cc_hyw.30.a: "Gewähre [lowlands_subject.GetName] die Tieflandprovinzen."
 cc_hyw.30.b: "Ablehnen. Lassen Sie sie nach einem anderen Herrn suchen."
 cc_hyw.30.c: "Weisen Sie den Anspruch zurück. Sie sind an uns gebunden – sie wagen es nicht, zu gehen."

 ########################################
 # cc_hyw.31 — A Duchy Without a Lord
 ########################################
 cc_hyw.31.title: "Ein Herzogtum ohne Herrn"
 cc_hyw.31.desc: "Unsere Armeen haben Ländereien in den Niederen Ländern gesichert, doch kein Herrscher regiert sie in unserem Namen. Die niederländischen Bürger blicken misstrauisch auf die fremde Herrschaft. Wir könnten hier ein loyales Vasallenhertzogtum errichten und uns das Wohlwollen in der Region verdienen — oder diese reichen Provinzen für die Krone behalten und die daraus resultierenden Unruhen in Kauf nehmen."
 cc_hyw.31.a: "Errichten Sie ein niederländisches Vasallenhertzogtum zur Verwaltung dieser Lande."
 cc_hyw.31.b: "Diese Ländereien gehören der Krone. Wir werden sie direkt regieren."

 ########################################
 # Bias display names
 ########################################
 cc_hyw_lowlands_land_refused: "Anspruch auf die Tiefebenen abgelehnt"
 cc_hyw_lowlands_hre_displeasure: "Missfallen über die Tieflandpolitik"
 cc_hyw_dutch_nations_anger: "Zorn über abgelehnten niederländischen Vasallen"

 ########################################
 # Country Interaction: Replace the Appanage Ruler
 ########################################
 cc_hyw_replace_appanage_ruler: "Ersetze den Appanage-Herrscher"
 cc_hyw_replace_appanage_ruler_desc: "Königliche Autorität ausüben, indem ein Herrscherwechsel in einem untreuen Appanagegebiet erzwungen wird. Die Intervention wird den Autonomiewunsch der Appanage erheblich senken, aber den französischen Adel beunruhigen und Unruhe unter den anderen Appanagen verbreiten."
 cc_hyw_replace_appanage_ruler_trigger_desc: "Die französische Krone bekräftigt ihre Autorität über [recipient.GetName] und setzt ein loyaleres Haus an die Spitze der Appanage."
