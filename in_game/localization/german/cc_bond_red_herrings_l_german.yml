l_german:
 # ===== RED HERRING EVENTS — cc_bonds.70–89 =====
 # False positives fire after secretly bad choices. False negatives after good ones.

 # === cc_bonds.70 — False Positive (generic — works for colony and march) ===
 cc_bonds.70.title: "Dankbarkeit aus der Grenzregion"
 cc_bonds.70.desc: "Eine Depesche trifft ein und berichtet, dass die jüngsten Vereinbarungen mit überraschender Herzlichkeit aufgenommen wurden. Die lokale Verwaltung scheint reibungslos zu funktionieren, und mehrere namhafte Persönlichkeiten haben ihre Zufriedenheit darüber geäußert, wie die Angelegenheiten geregelt wurden. Die Berichte sind glanzvoll – vielleicht sogar unerwartet so."
 cc_bonds.70.a: "Gut. Diese Vereinbarungen dienen allen Beteiligten."

 # === cc_bonds.71 — False Positive (spoils / extraction) ===
 cc_bonds.71.title: "Keine Beschwerden gemeldet"
 cc_bonds.71.desc: "Unsere Diplomaten sind aus [bond_subj.GetName] mit einem unauffälligen Bericht zurückgekehrt. Die Verteilung der jüngsten Erträge wurde ohne formellen Protest akzeptiert. Es wurden keine Petitionen eingereicht; es wurden keine Beschwerden über offizielle Kanäle vorgebracht. Die Angelegenheit scheint erledigt zu sein."
 cc_bonds.71.a: "Wie es sein sollte."

 # === cc_bonds.72 — False Positive (dismissal / replacement) ===
 cc_bonds.72.title: "Stabilität wiederhergestellt"
 cc_bonds.72.desc: "Berichte aus [bond_subj.GetName] legen nahe, dass die jüngsten Maßnahmen die gewünschte Wirkung gezeigt haben. Welche Spannungen auch immer bestanden, sind offenbar verflogen, und Beobachter beschreiben die Situation als ruhig und geordnet. Die Entscheidung scheint die richtige gewesen zu sein."
 cc_bonds.72.a: "Die Angelegenheit ist damit erledigt."

 # === cc_bonds.73 — False Positive (refusal / reassignment) ===
 cc_bonds.73.title: "Ein Kooperationsschreiben"
 cc_bonds.73.desc: "Eine unerwartet gnädige Nachricht aus [bond_subj.GetName] ist eingetroffen. Das Regierungshaus erkennt die Entscheidung der Krone an, zeigt keinen Groll und bekräftigt seine Verpflichtung zur Vereinbarung. Der Ton ist herzlich. Die Depesche enthält keine Untertöne, die unsere Sekretäre erkennen könnten."
 cc_bonds.73.a: "Eine erfreuliche Antwort."

 # === cc_bonds.74 — False Positive (colonial militia disbandment) ===
 cc_bonds.74.title: "Ordnung vollständig wiederhergestellt"
 cc_bonds.74.desc: "Die Kolonialverwaltung hat einen umfassenden Bericht über die Folgen der Niederschlagung der Miliz vorgelegt. Im gesamten Kolonialgebiet ist die Ordnung wiederhergestellt; es wurden keine weiteren Vorfälle verzeichnet; die Bevölkerung scheint zu ihren gewöhnlichen Angelegenheiten zurückgekehrt zu sein. Der Gouverneur lobt das entschlossene Handeln der Krone."
 cc_bonds.74.a: "Die Situation ist unter Kontrolle."

 # === cc_bonds.75 — False Negative (flexible administration — the good choice) ===
 cc_bonds.75.title: "Besorgnisse am Hofe"
 cc_bonds.75.desc: "Mehrere unserer traditionelleren Berater haben leise Bedenken hinsichtlich der flexiblen Verwaltungsvereinbarungen geäußert, die [bond_subj.GetName] gewährt wurden. Ein Memorandum, das im Rat kursiert, legt nahe, dass Nachsicht in der Verwaltung schwer rückgängig zu machen ist, sobald sie einmal etabliert wurde. Das Anliegen wurde zur Kenntnis genommen. Ob es die Realität widerspiegelt oder konservative Angst ist, bleibt unklar."
 cc_bonds.75.a: "Notiert. Wir werden die Situation beobachten."

 # === cc_bonds.76 — False Negative (no levy — the good choice) ===
 cc_bonds.76.title: "Murmeln bemutbarter Untertanen"
 cc_bonds.76.desc: "Gerüchten zufolge wurde die Entscheidung, keine Truppen aus [bond_subj.GetName] auszuheben, von einigen Beobachtern als Schwäche interpretiert. Ein Bericht – man sagt uns, er sei nicht weit verbreitet – deutet darauf hin, dass der Gouverneur begonnen hat, 'die Grenzen dessen zu testen, was die Krone fordern wird'. Unsere Sekretäre können dies nicht bestätigen. Es mag schlicht der übliche Hofklatsch sein."
 cc_bonds.76.a: "Spekulation. Wir bleiben bei unserer Entscheidung."

 # === cc_bonds.77 — False Positive (merit appointment — the worse choice) ===
 cc_bonds.77.title: "Die Ernennung wird positiv aufgenommen"
 cc_bonds.77.desc: "Unsere leistungsbasierte Ernennung auf den Provinzposten wurde in mehreren Depeschen als Modell guter Regierungsführung gelobt. Der Appointed hat bei den lokalen Verwaltern einen günstigen ersten Eindruck hinterlassen. Der Haushalt des Gouverneurs hat keine formellen Einsprüche erhoben. Die Ernennung scheint alle Parteien zufrieden gestellt zu haben."
 cc_bonds.77.a: "Leistung spricht für sich selbst."

 # === cc_bonds.78 — False Negative (preserve local customs — the good choice) ===
 cc_bonds.78.title: "Der Adel hinterfragt die Milde"
 cc_bonds.78.desc: "Mehrere prominente Stimmen im Adelsstand haben die Entscheidung der Krone hinterfragt, lokale Bräuche in [bond_subj.GetName] beizubehalten. Ihr Argument ist ein administratives Prinzip: Inkonsistenz schwäche die Autorität des Kronrechts. Die Kritik ist formal und höflich, aber pointiert. Es liegt an uns zu entscheiden, ob dies ein substanzielles Anliegen oder die vorhersehbare Reibung jeder Reform ist."
 cc_bonds.78.a: "Der Adel äußert seine Meinung. Wir haben unsere Wahl getroffen."

 # === cc_bonds.79 — False Positive (waive palatinate ceremony) ===
 cc_bonds.79.title: "Der Herr beweist sich"
 cc_bonds.79.desc: "Welche Vorbehalte der Pfalzgraf auch gegen die vereinfachte Investitur gehabt haben mag, er hat sie nicht zeigen lassen. In den vergangenen Monaten hat er mehrere schwierige lokale Angelegenheiten mit Effizienz und Loyalität geregelt. Unser Gesandter berichtet, er sei „voll und ganz in seine Pflichten vertieft“. Falls der Mangel an Zeremonien Spuren hinterlassen hat, sind diese von außen nicht sichtbar."
 cc_bonds.79.a: "Gut. Substanz ist wichtiger als Zeremonie."

 # === cc_bonds.80 — False Negative (palatinate levy exemption — the good choice) ===
 cc_bonds.80.title: "Gerüchte über eine kühnere Pfalz"
 cc_bonds.80.desc: "Über inoffizielle Kanäle hat uns die Nachricht erreicht, dass die Entscheidung, [bond_subj.GetName] von der jüngsten Erhebung zu befreien, als Zögern interpretiert wurde. Ein Höfling deutet an, dass der Pfalzgraf dadurch 'ermutigt' worden sei. Die Quelle ist nicht völlig zuverlässig und die Behauptung wurde nicht bestätigt, aber es ist die Art von Gerücht, die bleibt, wenn wir sie nicht ansprechen."
 cc_bonds.80.a: "Wir werden sehen, wie sich der Herr verhält."

 # === cc_bonds.81 — False Positive (ignore palatinate border dispute) ===
 cc_bonds.81.title: "Der Streit löst sich stillschweigend"
 cc_bonds.81.desc: "Unsere Sekretäre haben eine kurze Notiz hinterlegt: Der Grenzstreit unter Beteiligung von [bond_subj.GetName] scheint ohne Intervention der Krone abgeklungen zu sein. Die Parteien haben eine informelle Einigung erzielt. Unsere Neutralität hat offensichtlich keine sichtbaren Schwierigkeiten verursacht."
 cc_bonds.81.a: "Wie wir erwartet haben."

 # === cc_bonds.82 — False Negative (temporary tax relief — the sensible choice) ===
 cc_bonds.82.title: "Der Herr verlangt mehr"
 cc_bonds.82.desc: "Der Pfalzgraf hat eine weitere Mitteilung gesendet. Während er in seiner ersten Antwort Dankbarkeit für die vorübergehende Erleichterung ausdrückte, fragt er nun, ob es eine Möglichkeit gibt, die Vereinbarung zu verlängern. Die Anfrage ist vorsichtig formuliert, aber ihre Bedeutung ist klar: Er hat die Geste als Einladung zu Verhandlungen aufgefasst. Unsere Berater sind sich uneins darüber, ob dies Opportunismus oder eine angemessene Erwartung ist."
 cc_bonds.82.a: "Wir werden zu gegebener Zeit antworten."

 # === cc_bonds.83 — False Positive (refuse puppet ambassador) ===
 cc_bonds.83.title: "Die Marionette akzeptiert die Vereinbarung"
 cc_bonds.83.desc: "Die Regierung von [bond_subj.GetName] hat unsere Entscheidung bezüglich des Botschaftsgesuchs zur Kenntnis genommen. Ihre Antwort ist formal und besonnen — kein Protest, keine öffentliche Erklärung, kein Entzug der Zusammenarbeit in laufenden Angelegenheiten. Allem Anschein nach haben sie die Regelung akzeptiert und damit abgeschlossen."
 cc_bonds.83.a: "Besiedelt."

 # === cc_bonds.84 — False Positive (ignore puppet faction dispute) ===
 cc_bonds.84.title: "Die Fraktionsspannungen lassen nach"
 cc_bonds.84.desc: "Berichte aus [bond_subj.GetName] deuten darauf hin, dass sich der interne Fraktionsstreit in den letzten Monaten erheblich beruhigt hat. Keine einzelne Fraktion hat die Oberhand gewonnen, aber die Situation ist auch nicht eskaliert. Beobachter beschreiben die politische Lage als „stabil“. Unsere Neutralität scheint verhindert zu haben, dass eine der Seiten weiter angeheizt wird."
 cc_bonds.84.a: "Manchmal ist Zurückhaltung die klügste Politik."

 # === cc_bonds.85 — False Positive (forbid puppet military expansion) ===
 cc_bonds.85.title: "Die Richtlinie wird akzeptiert"
 cc_bonds.85.desc: "Die Regierung von [bond_subj.GetName] hat die Entscheidung der Krone über die militärische Expansion formell zur Kenntnis genommen. Ihre Antwort ist kooperativ im Ton; sie äußern keinen öffentlichen Widerspruch und haben keine sichtbaren Anstrengungen unternommen, alternative Regelungen zu suchen. Die Angelegenheit scheint ihrerseits erledigt zu sein."
 cc_bonds.85.a: "Sie haben die Botschaft verstanden."

 # === cc_bonds.86 — False Positive (send formal letter instead of visiting) ===
 cc_bonds.86.title: "Eine herzliche Antwort"
 cc_bonds.86.desc: "Unser Brief an [bond_subj.GetName] wurde empfangen und zur Kenntnis genommen. Das regierende Haus hat mit anmutiger Höflichkeit geantwortet, der Krone für ihre Aufmerksamkeit zu diesem Anlass gedankt und ausgedrückt, dass die Geste geschätzt wurde. Die Antwort umfasst drei Seiten und könnte nicht herzlicher sein. Ob diese Herzlichkeit echt oder diplomatisch ist, lässt sich anhand eines Briefes schwer sagen."
 cc_bonds.86.a: "Die Formalitäten sind erfüllt."

 # === cc_bonds.87 — False Positive (exclude dependency from royal ceremony) ===
 cc_bonds.87.title: "Ein Glückwunschschreiben"
 cc_bonds.87.desc: "Das Regierungshaus von [bond_subj.GetName] hat einen aufmerksamen Glückwunschbrief zum jüngsten königlichen Anlass geschickt. Ihre Abwesenheit erwähnen sie nicht. Der Brief ist in seiner Sprache herzlich und enthält ein Geschenk. Unser Kämmerer stellt fest, dass das Geschenk etwas bescheidener ausfällt als in den Vorjahren – bietet jedoch keine Interpretation an."
 cc_bonds.87.a: "Der Anlass war ein Erfolg."

 # === cc_bonds.88 — False Negative (dependency mobilizes on their own) ===
 cc_bonds.88.title: "Die Abhängigkeit mobilisiert"
 cc_bonds.88.desc: "Berichte aus [bond_subj.GetName] beschreiben eine beeindruckende lokale Mobilisierung als Reaktion auf die Bedrohung an der Grenze. Das Regierungshaus hat Truppen aufgeboten, seine Grenzpositionen verstärkt und den ersten Einfall ohne unser direktes Eingreifen zurückgeschlagen. Beobachter bezeichnen dies als Demonstration von Widerstandsfähigkeit. Was sie nicht diskutieren – zumindest nicht in den Depeschen, die wir erhalten –, ist, wie sie sich dabei fühlten, dies allein bewältigen zu müssen."
 cc_bonds.88.a: "Sie haben es geschafft. Gut."

 # === cc_bonds.89 — False Positive (refuse dependency succession consultation) ===
 cc_bonds.89.title: "Die Prärogative wurde akzeptiert"
 cc_bonds.89.desc: "Das Regierungshaus von [bond_subj.GetName] hat unsere Entscheidung zur Frage der Nachfolgeberatung zur Kenntnis genommen. Ihre formelle Antwort bestätigt das Vorrecht der Krone in diesen Angelegenheiten und zieht die Petition ohne weitere Kommentare zurück. Nichts an der Wortwahl deutet auf Groll hin. Unsere Sekretäre beschreiben den Ton als 'völlig angemessen'."
 cc_bonds.89.a: "Wie es sein sollte. Die Thronfolge ist nicht ihre Sorge."
