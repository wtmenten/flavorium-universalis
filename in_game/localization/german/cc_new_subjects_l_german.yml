l_german:
 # ============================================================
 # SUBJECT TYPES
 # ============================================================
 LEAD_provincial_governorate: "Krone"
 AM_provincial_governorate: "Provinzgouvernement"
 CANCEL_provincial_governorateTITLE: "Provinzialgouvernement auflösen"
 CANCEL_provincial_governorate_DESC: "Widerrufen Sie die Charta des Gouvernements, beenden Sie die vom Kronrat ernannte Verwaltung und stellen Sie die Region unter direkte Kontrolle."

 LEAD_tax_farm: "Krone"
 AM_tax_farm: "Steuerpacht"
 CANCEL_tax_farmTITLE: "Steuerpacht-Vereinbarung beenden"
 CANCEL_tax_farm_DESC: "Den Steuerpachtvertrag kündigen, wodurch die direkte Erhebung wiederhergestellt und das Konzessionsrecht des Herrn über diese Einnahmen beendet wird."

 LEAD_military_march: "Lehensherr"
 AM_military_march: "Militärmarsch"
 CANCEL_military_marchTITLE: "Markcharta widerrufen"
 CANCEL_military_march_DESC: "Widerrufen Sie die Markcharta und entziehen Sie dem Markgrafen die offensive militärische Autorität. Die Grenze wird weniger aggressiv — und weniger unberechenbar sein."

 provincial_governorate: "Provinzgouvernement"
 provincial_governorate_desc: "Eine Verwaltungsregion mit hoher Autonomie, die von einem von der Krone ernannten Magnaten regiert wird. Das Gouvernement verwaltet seine internen Angelegenheiten selbst und verteidigt unsere Grenzen – doch die Ambitionen des Gouverneurs stimmen nicht immer mit den unseren überein."
 provincial_governorate_upgrade_tt: "Das Provinzgouvernement kann nach Ablauf einer ausreichenden Zeit zu einer Pfalz erhoben werden."

 tax_farm: "Steuerpacht"
 tax_farm_desc: "Eine ausbeuterische Extraktionsvereinbarung, bei der ein mächtiger Lord die Steuereinnahmen im Austausch gegen einen Teil der Erträge verwaltet. Kurzfristig extrem profitabel, langfristig zutiefst instabil. Die besteuerten Bevölkerungen werden schließlich Entlastung fordern."
 tax_farm_upgrade_tt: ""

 military_march: "Militärmarsch"
 military_march_desc: "Ein offensiver Grenzvasall, dem ein besonderes Militärstatut verliehen wurde, um Macht über unsere Grenzen hinaus zu projizieren. Der Markgraf ist furchteinflößend, loyal (wenn der Adel zufrieden ist) und gelegentlich unmöglich zu kontrollieren. Er wird unsere Nachbarn plündern, ob wir es sanktionieren oder nicht."
 military_march_upgrade_tt: ""

 # ============================================================
 # ADVANCES
 # ============================================================
 late_governorate_advance: "Provinzverwaltung"
 late_governorate_advance_desc: "Ein formalisiertes System von der Krone ernannten Gouvernements erlaubt es dem Reich, seine administrative Reichweite über ferne Regionen auszudehnen, ohne diese direkt zu annektieren. Schaltet den Vasallentyp Provinzgouvernement, das Ständeprivileg Gouvernementscharte und die Gouvernementsreform frei."

 tax_farming_advance: "Steuerpachtung"
 tax_farming_advance_desc: "Die Einziehung der Einnahmen wird gegen Bezahlung an mächtige lokale Herren übertragen. Schaltet den Vasallentyp Steuerpacht, das Standesprivileg Steuercharta und die Steuerpacht-Reform frei."

 military_march_advance: "Militärzüge"
 military_march_advance_desc: "Die Ausweisung von Grenzgebieten als Militärgrenzmarken schafft offensive Pufferzonen, die unsere Macht an der Frontlinie erweitern. Schaltet den Vasallentyp Militärgrenzmarke, das Ständeprivileg Grenzmarkenprivileg und die Grenzmarkenreform frei."

 # ============================================================
 # GOVERNMENT REFORMS — STANDARD
 # ============================================================
 cc_governorate_reform: "Gouvernement-System"
 cc_governorate_reform_desc: "Formalisiert das System der von der Krone ernannten Provinzgouvernements und verbessert die Verwaltungskapazität im gesamten Reich."

 cc_tax_farming_reform: "Steuerpachtverträge"
 cc_tax_farming_reform_desc: "Systematisiert die Praxis, die Steuerinnahme an mächtige Grundherren auszulagern, was den bürokratischen Aufwand zugunsten lokaler Effizienz reduziert."

 cc_march_charter_reform: "Markgrafencharter"
 cc_march_charter_reform_desc: "Formelle Charter an Grenzgebiete ausstellen, um sie als Militärmärsche zu kennzeichnen und so ein Netzwerk offensiver Pufferzonen entlang der umstrittensten Grenzen des Reiches zu schaffen."

 # ============================================================
 # GOVERNMENT REFORMS — LEGENDARY
 # ============================================================
 cc_philosophers_court_reform: "Der Hof der Philosophen"
 cc_philosophers_court_reform_desc: "Der gelehrteste Hof der Welt. Die Forschung beschleunigt sich, Institutionen verbreiten sich und der intellektuelle Ruf des Reiches zieht Talente aus der gesamten bekannten Welt an."

 cc_grand_bazaar_reform: "Der Große Basar"
 cc_grand_bazaar_reform_desc: "Ein kosmopolitisches kommerzielles und diplomatisches Netzwerk, das als Regierungsprinzip formalisiert wurde. Handelszentren florieren, die diplomatische Kapazität erweitert sich und unser Ruf in der islamischen Welt wird zu einem strategischen Vorteil."

 cc_iron_hegemony_reform: "Die eiserne Hegemonie"
 cc_iron_hegemony_reform_desc: "Militärische Dominanz als Verfassungsprinzip formalisiert. Alle Armeen des Militärs werden vom Staat subventioniert; die Adelsstände sind an die Militärmaschine gebunden; die Nachbarn des Reiches passen ihr Verhalten entsprechend an."

 cc_parliamentary_compromise_reform: "Parlamentarischer Kompromiss"
 cc_parliamentary_compromise_reform_desc: "Ein formales Abkommen zwischen der Krone und der Legislative, das das Parlament gleichzeitig effektiver und legitimer macht."

 cc_mandate_bureaucracy_reform: "Bürokratie vorschreiben"
 cc_mandate_bureaucracy_reform_desc: "Die Umsetzung des konfuzianischen bürokratischen Ideals: meritokratische Regierungsführung, angemessene Beziehungen und die Annahme, dass der Staat existiert, um der moralischen Ordnung zu dienen. Verfügbar für ost- und südostasiatische Reiche."

 cc_peoples_assembly_reform: "Volksversammlung"
 cc_peoples_assembly_reform_desc: "Im Zeitalter der Revolution eine Regierung, die tatsächlich über die Zustimmung des Volkes verfügt. Unruhen nehmen ab; die legislative Effizienz steigt; die Geschichte nimmt dies zur Kenntnis."

 # ============================================================
 # ESTATE PRIVILEGES
 # ============================================================
 ep_nobles_governorate_charter: "Gouvernementscharta"
 ep_nobles_governorate_charter_desc: "Der Adel erhält die formelle Befugnis, Provinzgouvernements im Namen der Krone zu verwalten, im Austausch für Entwicklungsbeiträge und fortwährende Loyalität."

 ep_nobles_march_charter: "Markgrafencharter"
 ep_nobles_march_charter_desc: "Der Adel erhält die formelle Befugnis, Militärmarken entlang der Grenze zu errichten – mächtig, offensiv und gelegentlich unmöglich vollständig zu kontrollieren."

 ep_nobles_diplomatic_court: "Diplomatischer Hof"
 ep_nobles_diplomatic_court_desc: "Der Adel finanziert und beherbergt einen formellen diplomatischen Hof, der den Ruf des Reiches in der islamischen Welt steigert und sowohl Machtprojektion als auch Prestige in gleichem Maße ausstrahlt."

 ep_burghers_tax_charter: "Steuercharta"
 ep_burghers_tax_charter_desc: "Die Kaufmannsstände erhalten die formale Befugnis zur Verwaltung der Steuereintreibung in ausgewählten Regionen, was die bürokratischen Kosten senkt, im Austausch für einen kommerziellen Anteil an den Einnahmen."

 ep_burghers_parliamentary_charter: "Parlamentscharta"
 ep_burghers_parliamentary_charter_desc: "Die Bürger erhalten eine formelle parlamentarische Charta, die ihre legislativen Rechte kodifiziert, was gleichzeitig die parlamentarische Unterstützung und den kommerziellen politischen Einfluss erhöht."

 # ============================================================
 # SUBJECT DRAWBACK MODIFIERS
 # ============================================================
 cc_subject_autonomy_pressure: "Autonomiedruck"
 cc_subject_autonomy_pressure_desc: "Die Bevölkerung des Untertanen ist unruhig und fordert mehr Selbstverwaltung. Rebellenbewegungen organisieren sich."

 cc_subject_tax_relief: "Steuerentlastung"
 cc_subject_tax_relief_desc: "Der verringerte Extraktionsdruck hat die Bevölkerung des Untertans beruhigt. Die Unruhe sinkt und die Legitimität erholt sich langsam."

 # ============================================================
 # LEGEND MODIFIER
 # ============================================================
 cc_legend_holy_empire: "Heiliges Reich"
 cc_legend_holy_empire_desc: "Das Reich hat den Status eines Heiligen Reiches erreicht — eine sakrale Politie, in der geistliche und weltliche Autorität einander verstärken. Religiöser Einfluss breitet sich aus, Konversionen beschleunigen sich und die politische Macht des Klerus erreicht ihren Höhepunkt."

