l_german:
 # === cc_bonds.30 — The Palatinate Lord's First Homage ===
 cc_bonds.30.title: "Die erste Huldigung des Pfalzgrafen"
 cc_bonds.30.desc: "Der Herr von [bond_subj.GetName] erwartet die Bestätigung seiner Position unter der neuen Vereinbarung. Die Frage, die vor uns liegt, ist eine der Zeremonie: Werden wir seinen Eid in einem formellen öffentlichen Rahmen empfangen, der der Welt die Art unserer Beziehung verkündet, oder regeln wir die Angelegenheiten mit der stillen Diskretion eines privaten Protokolls? Die Wahl scheint administrativ zu sein. Das ist sie nicht."
 cc_bonds.30.a: "Eine prächtige Zeremonie. Lassen wir den gesamten Hof Zeuge seiner Treue werden."
 cc_bonds.30.b: "Ein privater Eid. Formalitäten wurden gewahrt, ohne Inszenierung."
 cc_bonds.30.c: "Verzichten wir ganz auf die Zeremonie. Wir wissen, wo seine Loyalitäten liegen."

 # === cc_bonds.31 — Noble Marriage Alliance ===
 cc_bonds.31.title: "Adelsheiratsbündnis"
 cc_bonds.31.desc: "Der Pfalzgraf hat die Frage einer Heirat zwischen seinem Hause und dem unseren aufgeworfen – oder zumindest zwischen einem Mitglied seiner Familie und einem geeigneten Partner in unseren Hofkreisen. Die Verbindung wäre sichtbar, dynastisch und in einer Weise bindend, wie nur Blut binden kann. Ob wir dies als Chance oder als Komplikation betrachten, verrät viel darüber, wie wir die Beziehung sehen."
 cc_bonds.31.a: "Arrangieren Sie die Ehe. Dynastien werden durch die Familie aufgebaut."
 cc_bonds.31.b: "Ablehnen. Der Zeitpunkt ist nicht richtig."
 cc_bonds.31.c: "Der Herr mag die Angelegenheiten seiner eigenen Familie regeln."

 # === cc_bonds.32 — Military Service Demand ===
 cc_bonds.32.title: "Forderung nach Militärdienst"
 cc_bonds.32.desc: "Wir benötigen zusätzliche Truppen, und die Pfalz von [bond_subj.GetName] befehligt ein beträchtliches Kontingent an ausgebildeten Adligen und deren Gefolgsleuten. Der Herr ist seinen Verpflichtungen immer nachgekommen, aber die Frage ist, wie wir die Anfrage stellen – als Befehl, als Angebot oder ob wir ihn überhaupt darum bitten. Er wird den Unterschied bemerken."
 cc_bonds.32.a: "Rufen Sie das gesamte Adelsaufgebot zusammen. Der Dienst ist geschuldet."
 cc_bonds.32.b: "Fordert freiwilligen Dienst und bietet eine Entschädigung an."
 cc_bonds.32.c: "Befreien Sie die Pfalz von dieser Erhebung. Ihre Sicherheit ist ebenfalls wichtig."

 # === cc_bonds.33 — Palatinate Church Appointment ===
 cc_bonds.33.title: "Pfalzkirchenernennung"
 cc_bonds.33.desc: "Das Bistum innerhalb von [bond_subj.GetName] ist vakant. Der Herr hat bereits informell nach seinem bevorzugten Kandidaten gefragt — einem Mann von lokalem Standing und klarer Loyalität gegenüber der Pfalz. Unsere eigenen kirchlichen Berater haben einen anderen Namen im Sinn: einen Kronenloyalisten, dessen Ernennung unseren Einfluss auf das geistliche Leben der Pfalz ausweiten würde. Die Wahl wird von keiner Seite unbemerkt bleiben."
 cc_bonds.33.a: "Die Krone ernennt den Bischof. Dies ist unser Vorrecht."
 cc_bonds.33.b: "Lasst den Herrn nominieren. Dies ist seine Diözese."
 cc_bonds.33.c: "Ein gemeinsames Genehmigungsverfahren. Beide Parteien haben ein Mitspracherecht."

 # === cc_bonds.34 — The Border Dispute ===
 cc_bonds.34.title: "Der Grenzstreit"
 cc_bonds.34.desc: "Der Herr von [bond_subj.GetName] schreibt in offensichtlicher Frustration. Ein benachbartes Adelshaus hat Grenzsteine versetzt und Weiderechte am östlichen Rand der Pfalz bestritten. Er bittet um unsere Unterstützung – einen formellen Brief, eine rechtliche Erklärung, irgendein Signal, dass die Krone hinter seinem Anspruch steht. Das benachbarte Haus hat ebenfalls Verbindungen am Hofe. Keines der Ergebnisse ist ohne Kosten."
 cc_bonds.34.a: "Den Herrn vollumfänglich unterstützen. Schreiben Sie den Brief. Geben Sie die Erklärung ab."
 cc_bonds.34.b: "Verlangt, dass beide Parteien die Angelegenheit durch formelle Schlichtung beilegen."
 cc_bonds.34.c: "Halten wir uns heraus. Lokale Streitigkeiten lösen sich von selbst."

 # === cc_bonds.35 — The Palatinate Asks for Tax Relief ===
 cc_bonds.35.title: "Die Pfalz bittet um Steuererleichterungen"
 cc_bonds.35.desc: "Eine schwierige Erntesaison und mehrere Jahre militärischer Verpflichtungen haben die Pfalz von [bond_subj.GetName] belastet. Der Herr schreibt mit vorsichtiger Würde – nicht flehend, aber deutlich fragend – nach einer vorübergehenden Senkung der Steuerlast, die seine Adligen tragen müssen. Die Bitte ist nach jedem Maßstab vernünftig. Es ist jedoch der Präzedenzfall, den sie schafft, der unsere Berater beunruhigt."
 cc_bonds.35.a: "Gewähre die Entlastung. Sie haben treu gedient und haben es verdient."
 cc_bonds.35.b: "Lehnen Sie die Anfrage ab. Verpflichtungen können nicht aufgrund von Umständen neu verhandelt werden."
 cc_bonds.35.c: "Biete eine bescheidene vorübergehende Reduzierung an."

 # === cc_bonds.36 — The Old Lord Dies ===
 cc_bonds.36.title: "Der alte Herr stirbt"
 cc_bonds.36.desc: "Der Pfalzgraf von [bond_subj.GetName] ist gestorben. Er diente lange und ohne nennenswerte Zwischenfälle, und sein Erbe – uns bekannt, von seinem Vater vorbereitet – ist bereit, den Titel zu übernehmen. Die Nachfolge ist verfahrenstechnisch unkompliziert. Was nicht unkompliziert ist, ist die finanzielle Regelung: Das pfälzische Gut ist beträchtlich, und die Frage, wie wir den Übergang gestalten, wird den ersten Eindruck des neuen Herrn von der Krone prägen."
 cc_bonds.36.a: "Den Erben gnädig bestätigen und auf alle Erbfolgeabgaben verzichten."
 cc_bonds.36.b: "Fordern Sie die volle Erbschaftssteuer, bevor die Thronfolge bestätigt wird."
 cc_bonds.36.c: "Nutzen wir das Interregnum, um die Regelungen der Pfalz zu überprüfen."
