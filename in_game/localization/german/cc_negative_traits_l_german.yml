l_german:
 # ============================================================
 # NEGATIVE TRAITS
 # ============================================================

 stagnant_counselor: "Stagnierender Berater"
 desc_stagnant_counselor: "Dieser Minister bekleidet seine Rolle schon zu lange ohne Herausforderung. Seine Methoden sind verkrustet, sein Enthusiasmus ist geschwunden und die Schärfe seiner Expertise ist stumpf geworden. Er bleibt kompetent — aber gerade so."
 stagnant_counselor_die_desc: "[CHARACTER.GetName] ist gestorben. Die Geschichte wird die Karriere nicht streng beurteilen – nur das letzte Kapitel."

 war_profiteer: "Kriegsprofiteur"
 desc_war_profiteer: "Dieser Minister hat gelernt, Konflikte als Chance zu sehen. Sein Rat lenkt jede diplomatische Einigung in Richtung der eigenen Bereicherung, und das Reich leidet unter den langsameren, kostspieligeren Folgen von Kriegen, die schlechter endeten, als sie hätten müssen."
 war_profiteer_die_desc: "[CHARACTER.GetName] ist gestorben. Die Abrechnung ihres persönlichen Vermögens und der Friedensdividende des Reiches wird niemals ganz aufgehen."

 court_schemer: "Hofverschwörer"
 desc_court_schemer: "In der Regierungsführung dieses Ministers hat Intrige die Loyalität ersetzt. Sie untergraben Rivalen am Hof, spalten legislative Koalitionen und behandeln jede Ernennung wie einen Zug in einem Spiel, dessen Ergebnis keinen Wert besitzt."
 court_schemer_die_desc: "[CHARACTER.GetName] ist gestorben. Die Netzwerke, die sie aufbauten — die Schulden, die Gefallen, die Geheimnisse — lösen sich mit ihnen auf. Vielleicht ist das eine Gnade."

 inefficient_bureaucrat: "Ineffizienter Bürokrat"
 desc_inefficient_bureaucrat: "Dieser Minister hat seine Kompetenz überdauert. Ein jüngeres Alter hätte ihn vielleicht zu etwas Nützlichem geschliffen; das aktuelle Alter hat lediglich offengelegt, wie wenig er sich seit Beginn entwickelt hat."
 inefficient_bureaucrat_die_desc: "[CHARACTER.GetName] ist gestorben. Ihr Nachfolger wird den Schreibtisch in einer besseren Ordnung vorfinden als die Arbeit."

 corrupted_official: "Korrupter Beamter"
 desc_corrupted_official: "Der Reichtum, der durch die Hände dieses Ministers floss, wurde umgeleitet. Ein Teil des Wohlstands des Reiches fließt in ihre eigenen Taschen, und das Privileg, das sie schützen, ist ihr eigenes. Die Stände sind zufrieden — und das zu Recht."
 corrupted_official_die_desc: "[CHARACTER.GetName] ist gestorben. Die Rechnungsprüfer werden viel zu tun haben."

 zealous_fanatic: "Eifriges Fanatiker"
 desc_zealous_fanatic: "Der Glaube des Ministers ist zu etwas Härterem und Engstirnigerem als bloße Überzeugung geronnen. Zweifel werden unterdrückt, Andersartigkeit verfolgt und die Vernunft weicht dem Eifer. Die Kirche mag florieren; das geistige Leben des Reiches hingegen nicht."
 zealous_fanatic_die_desc: "[CHARACTER.GetName] ist gestorben. Die Asche dessen, was [CHARACTER.GetSheHe] verbrannte, wird langsam abkühlen."

 outdated_general: "Veralteter General"
 desc_outdated_general: "Dieser Minister hat seine Militärdoktrin in einer anderen Zeit gelernt und weigert sich, sie zu aktualisieren. Seine Methoden kosten mehr als sie sollten und bringen weniger hervor, als der Feind erwartet, was die schlimmste Kombination im Krieg ist."
 outdated_general_die_desc: "[CHARACTER.GetName] ist gestorben. Die Armee, die [CHARACTER.GetSheHe] für den letzten Krieg ausbildete, muss nun lernen, den nächsten zu gewinnen."

 cynical_courtier: "Zynischer Höfling"
 desc_cynical_courtier: "Zu viele Jahre, in denen er miterleben musste, wie Idealismus zu Kompromissen verkommt, haben diesen Minister unfähig gemacht, aufrichtig für etwas einzutreten. Die Stände durchschauen seine leeren Gesten und reagieren entsprechend."
 cynical_courtier_die_desc: "[CHARACTER.GetName] ist gestorben. Letztendlich benötigt selbst der Zynismus jemanden, der ihn ausübt."

 reckless_expander: "Übermutiger Expander"
 desc_reckless_expander: "Dieser Minister sieht jede Grenze als Einladung und jedes Risiko als Kosten, die jemand anderes tragen wird. Der Antagonismus, den unsere Expansion erzeugt, und die Kolonialunternehmen, die unter seiner Führung gescheitert sind, werden Jahre brauchen, um behoben zu werden."
 reckless_expander_die_desc: "[CHARACTER.GetName] ist gestorben. Die Grenzen, die [CHARACTER.GetSheHe] verschob, werden immer noch bestritten."

 # ============================================================
 # NEGATIVE TRAIT GRANT EVENTS (cc_neg namespace)
 # ============================================================

 cc_neg.1.title: "Ein stagnierender Minister"
 cc_neg.1.a: "Weisen Sie ihnen ein anspruchsvolles neues Projekt zu – rütteln Sie sie wach."
 cc_neg.1.b: "Entlassen Sie [minister.GetHerHim] mit Dank aus dem Dienst."
 cc_neg.1.c: "Lassen Sie die Stagnation einkehren. Ihre Erfahrung hat immer noch einen Wert."

 cc_neg.2.title: "Ein Minister, der sich an den Krieg gewöhnt hat"
 cc_neg.2.desc: "Unsere Schatzkammer war stets gefüllt, und [minister.GetName] war bei jedem Feldzug des letzten Jahrzehnts an unserem Hof. In [minister.GetHerHis] Rat zeichnet sich ein Muster ab: Die Vergleiche, die [minister.GetSheHe] empfiehlt, sind immer ein wenig weniger vorteilhaft, als es unsere Position rechtfertigen würde. Der Vorteil scheint anderweitig zu fließen."
 cc_neg.2.a: "Untersuche die Finanzgeschäfte des Ministers."
 cc_neg.2.b: "Warnen Sie sie privat. Dieses Verhalten muss aufhören."
 cc_neg.2.c: "Vorerst nichts sagen."

 cc_neg.3.title: "Fraktion im Entstehen"
 cc_neg.3.desc: "Zwei Minister mit gegensätzlichen Überzeugungen sind schon so lange am Hofe, dass ihre Uneinigkeit zu einer Fraktion erstarrt ist. [minister.GetName] zeigt Anzeichen dafür, Intrigen über die Regierungsführung zu stellen. Der Hof beginnt, Partei zu ergreifen."
 cc_neg.3.b: "Lassen Sie [minister.GetHerHim] seine Fraktion pflegen. Es ist besser, ihr Netzwerk zu kennen."
 cc_neg.3.c: "Entlasse [minister.GetHerHim], bevor sich dies vertieft."

 cc_neg.4.title: "Ein Minister mit sinkendem Nutzen"
 cc_neg.4.desc: "Das Zeitalter ist vorangeschritten, aber [minister.GetName] nicht. [minister.GetHerHis] Methoden waren einst angemessen. Jetzt sind sie lediglich vorsichtig, und vorsichtig ist ein anderes Wort für langsam. Die Effizienz des Kabinetts leidet stillschweigend."
 cc_neg.4.a: "Geben Sie [minister.GetHerHim] die Chance, die eigene Relevanz unter Beweis zu stellen."
 cc_neg.4.b: "Lassen Sie die Bürokratie ihr eigenes Niveau finden."
 cc_neg.4.c: "Entlassen Sie [minister.GetHerHim] — wir brauchen jemanden, der schärfer im Verstand ist."

 cc_neg.5.title: "Der Geruch von Korruption"
 cc_neg.5.desc: "Da sich der Reichtum am Hof anhäuft und die Stände fett werden, hat [minister.GetName] eine Gelegenheit gefunden. Die Konten sind technisch gesehen ausgeglichen – aber das Gleichgewicht scheint so gestaltet worden zu sein, dass es jemandem zugutekommt, der nicht die Krone ist."
 cc_neg.5.a: "[minister.GetHerHim] mit den Beweisen konfrontieren – Reformen fordern."
 cc_neg.5.b: "Akzeptiere es. Die Stände sind zufrieden; so mögen sie bleiben."
 cc_neg.5.c: "Entlasse [minister.GetHerHim] ohne Zeremonie."

 cc_neg.6.title: "Ein alter Soldat aus einer anderen Zeit"
 cc_neg.6.desc: "[minister.GetName] diente in einer anderen Ära brillant. Aber die Armeen dieses Zeitalters verlangen ein anderes Denken — andere Formationen, andere Logistik, eine andere Doktrin. [minister.GetSheHe] weigert sich, diese zu erlernen. Die Armee zahlt den Preis dafür."
 cc_neg.6.a: "Schreiben Sie die Teilnahme an einem neuen Trainingsprogramm vor."
 cc_neg.6.c: "Ersetze sie durch jemanden der heutigen Zeit."

 cc_neg.7.title: "Ein zynisch gewordener Hof"
 cc_neg.7.desc: "Wir haben zu viele Gelegenheiten verstreichen lassen, zu viele gute Entscheidungen abgelehnt. [minister.GetName] hat dies bemerkt. Die Aufrichtigkeit ist aus [minister.GetHerHis] Rat verschwunden, ersetzt durch eine ironische Kompetenz, die die Stände nicht länger inspirierend finden."
 cc_neg.7.a: "Geben Sie [minister.GetHerHim] etwas, woran [minister.GetHerHim] glauben kann – wählen Sie dieses Mal den ehrgeizigen Weg."
 cc_neg.7.b: "Zynismus hält Berater ehrlich."
 cc_neg.7.c: "Lassen Sie [minister.GetHerHim] gehen."

 cc_neg.8.title: "Ambition ohne Vorsicht"
 cc_neg.8.a: "Lenken Sie [minister.GetHerHis] Energie um — kühne Ideen, sorgfältige Ausführung."
 cc_neg.8.b: "Kühner Rat hat seine Vorzüge."
 cc_neg.8.c: "Entbinden Sie [minister.GetHerHim] von [minister.GetHerHis] Posten."

 # ============================================================
 # NEGATIVE TRAIT REHABILITATION EVENTS (cc_neg.11-19)
 # ============================================================

 cc_neg.11.title: "Der Berater findet eine neue Bestimmung"
 cc_neg.11.a: "Finanziere ein formelles Erneuerungsprogramm – nutze [minister.GetHerHis] Erfahrung für neue Zwecke."
 cc_neg.11.b: "Erlaube [minister.GetHerHim], sich würdevoll zur Ruhe zu setzen, das Erbe intakt."

 cc_neg.12.title: "Frieden ändert einen Minister"
 cc_neg.12.desc: "Jahre des Friedens haben die Eigenschaft, Minister daran zu erinnern, wozu Regierungsführung eigentlich dient. [minister.GetName] hat diese ruhige Zeit in aufrichtiger Reflexion verbracht. Die profitgierige Stimme in [minister.GetHerHis] Rat ist leiser geworden."
 cc_neg.12.a: "Nimm die Änderung zur Kenntnis. Ihre Erfahrung ist wieder ein Gewinn."

 cc_neg.13.title: "Der Intrigant beugt sich der Pflicht"
 cc_neg.13.desc: "[minister.GetName] wurde eine anspruchsvolle Integrationsaufgabe übertragen – eine, die die Zusammenarbeit mit genau den Ministern erforderte, die [minister.GetSheHe] zuvor untergraben hatte. Irgendwo in dieser Arbeit wurde der Fraktionsbau mühsam und die Aufgabe selbst wurde interessant."
 cc_neg.13.a: "Der Hof ist durch ihre Bemühungen gestärkt worden."

 cc_neg.14.title: "Effizienz kehrt ins Kabinett zurück"
 cc_neg.14.desc: "Das Kabinett läuft wieder gut, und [minister.GetName] war ein Teil des Grundes dafür. Umgeben von funktionierenden Systemen haben sie einen Weg gefunden, beizutragen statt zu behindern. Die bürokratische Trägheit hat nachgelassen."
 cc_neg.14.a: "Erkenne die Verbesserung an — dies ist der Minister, den wir brauchten."

 cc_neg.15.title: "Korruption beseitigt"
 cc_neg.15.desc: "Da die Hortung von Reichtümern gelöst und die Konten einer ordentlichen Prüfung unterzogen wurden, hatte [minister.GetName] keinen Ort mehr, um die Unstimmigkeiten zu verbergen. Die Bereicherung des Standes ist beendet. Stillschweigend endete damit auch die Korruption."
 cc_neg.15.a: "Wir nehmen die Änderung zur Kenntnis. Wir werden genauer hinschauen."

 cc_neg.16.title: "Zweifel kehren zum Eiferer zurück"
 cc_neg.16.desc: "Ein Minister, der keine Ketzer duldet, wurde an einen Hof versetzt, an dem Toleranz der Preis für den Frieden war. Es hat ihn etwas gekostet – aber was verloren ging, scheint durch etwas Älteres und Nützlicheres ersetzt worden zu sein: Nuancen."
 cc_neg.16.a: "Willkommen zurück im vollen Rat, [rehabilitated_minister.GetHerHim]."
 cc_neg.16.b: "Beauftragen Sie privaten theologischen Beistand, um [rehabilitated_minister.GetHerHis] Reform zu beschleunigen."

 cc_neg.17.title: "Ein General, der neue Tricks lernte"
 cc_neg.17.desc: "Der militärische Fortschritt hat die alte Doktrin überholt, und [minister.GetName] ist — endlich — mitgekommen. Ihr Rat zur Armeezusammensetzung und Kampagnenplanung ist kein Hindernis mehr. Die Armee hat dies bemerkt."
 cc_neg.17.a: "Stellt ihnen die volle militärische Autorität wieder her."

 cc_neg.18.title: "Die Legende ändert alles"
 cc_neg.18.desc: "Etwas Bemerkenswertes ist an diesem Hof geschehen, und [minister.GetName] war dabei. Der Zynismus, der sich in [minister.GetHerHis] Art festgesetzt hatte, hat etwas Platz gemacht für etwas, das [minister.GetSheHe] vergessen hatte, dass es möglich sei: Überzeugung."
 cc_neg.18.a: "Lassen Sie [minister.GetHerHim] sprechen. Der Hof wird zuhören."

 cc_neg.19.title: "Ein rücksichtsloser Expansionsist findet eine neue Richtung"
 cc_neg.19.desc: "Jahre des Friedens und verminderter Antagonismen haben [minister.GetName] Zeit gegeben, darüber nachzudenken, wozu kühne Beratung eigentlich dient. Die Antwort, zu der [minister.GetSheHe] gelangt ist, ist besonnener als frühere Ratschläge — aber immer noch ambitioniert."
 cc_neg.19.a: "Ihre Energie ist nun ein Gewinn — stetige Expansion, nicht leichtfertig."
 cc_neg.19.b: "Lenken Sie diese Energie vollständig um — lassen Sie [minister.GetHerHim] zu einem Provokateur werden."

 # ============================================================
 # Follow-Up Events (cc_neg.100–103)
 # ============================================================

 cc_neg.100.title: "Das neue Projekt des Ministers"
 cc_neg.100.desc: "Monate nachdem [minister.GetName] eine neue Bestimmung gegeben wurde, treffen Nachrichten darüber ein, was [minister.GetSheHe] erreicht hat — oder nicht. Die Investition hat in der einen oder anderen Form Früchte getragen. Ob diese Form willkommen ist, ist eine andere Frage."
 cc_neg.100.a: "Was wurde aus der Initiative des Ministers?"

 cc_neg.101.title: "Der versetzten Minister berichtet"
 cc_neg.101.desc: "[minister.GetName] wurde eine anspruchsvolle Aufgabe übertragen, um [minister.GetHerHis] Ambitionen zu kanalisieren. Mehrere Monate sind vergangen. Die Ergebnisse sind eingetroffen — und sie offenbaren, ob diese Neuzuweisung überhaupt etwas geändert hat."
 cc_neg.101.a: "Wir nehmen das Ergebnis zur Kenntnis."

 cc_neg.102.title: "Die Folgen der Bestechung"
 cc_neg.102.desc: "Die Zahlung wurde geleistet. Die Vereinbarung war klar. Unklar war nur, ob [minister.GetName] sie einhalten würde — oder sich einfach das Gold einsteckt und die Transaktion als erste Rate betrachtet. Die vergangenen Monate haben eine Antwort geliefert."
 cc_neg.102.a: "Rechenschaft über das Geschehene ablegen."

 cc_neg.103.title: "Der Schatten des entlassenen Beraters"
 cc_neg.103.desc: "Die Entlassung eines expansionistischen Beraters bleibt selten unbemerkt. Die Höfe beobachten solche Dinge. Einige interpretieren Zurückhaltung als Weisheit; andere sehen Verwundbarkeit. Es ist Kunde zurückgekommen, wie die Entscheidung aufgenommen wurde."
 cc_neg.103.a: "Dies wurde so angemerkt."
 cc_neg.1.desc: "[minister.GetName] hat treu gedient – vielleicht zu treu und zu lange. Am Hofe wird geflüstert, dass [minister.GetSheHe] [minister.GetHerHis] eigenen Ratschlägen wiederholt. Neue Ideen erreichen [minister.GetHerHis] Schreibtisch und verlassen ihn unverändert. Es ist noch Zeit einzugreifen."
 cc_neg.3.a: "Holen Sie [minister.GetHerHim] direkt hinzu – betrauen Sie [minister.GetHerHim] mit einer Aufgabe, die Kooperation erfordert."
 cc_neg.6.b: "Ehren Sie den Dienst von [minister.GetHerHis] und lassen Sie [minister.GetHerHim] diesen auf seine Weise beenden."
 cc_neg.8.desc: "[minister.GetName] hat zugesehen, wie wir kämpften und scheiterten, expandierten und uns zurückzogen, und hat die falsche Lehre daraus gezogen: dass wir nicht kühn genug waren. Sein Rat drängt nun zu Erwerbungen um jeden Preis, und den daraus resultierenden Antagonismus und die kolonialen Misserfolge muss er nicht selbst tragen."
 cc_neg.11.desc: "The capital has been growing. New construction, new wealth, new challenges — and [minister.GetName] has found [minister.GetHerHim]self confronted by a court that no longer tolerates the comfortable answers. Something has shifted in [minister.GetHerHis] counsel."
