l_german:
 # === cc_bonds.2 — A Colonial Horizon ===
 cc_bonds.2.title: "Ein kolonialer Horizont"
 cc_bonds.2.desc: "Die Nachricht hat jeden Hof der Welt erreicht: [bond_subj.GetName] ist die erste Kolonialnation dieser Ära geworden – eine dauerhafte Siedlung über dem Meer, aus der Ferne regiert und aufrechterhalten durch den Willen von [bond_subj.GetOverlord.GetName]. Es ist eine Schwelle. Die Welt ist größer, als sie es gestern war."
 cc_bonds.2.a: "Eine bemerkenswerte Leistung. Lassen wir den Hof wissen, dass wir stolz sind."
 cc_bonds.2.b: "Wir nehmen die Entwicklung zur Kenntnis und machen weiter."

 # === cc_bonds.3 — The First March ===
 cc_bonds.3.title: "Der erste Marsch"
 cc_bonds.3.desc: "Die Institution der Mark wurde zum ersten Mal in lebender Erinnerung eingerichtet: [bond_subj.GetName] wurde erhoben, um als befestigter Puffer unter dem Banner von [bond_subj.GetOverlord.GetName] zu dienen. Wo Grenzen umstritten und Plünderer kühn sind, steht ein Markgraf zwischen der Zivilisation und der Grenzregion."
 cc_bonds.3.a: "Die Grenze soll halten. Wir ehren diejenigen, die sie bewachen."
 cc_bonds.3.b: "Eine praktische Vereinbarung. Es möge protokolliert werden."

 # === cc_bonds.4 — A Formal Compact ===
 cc_bonds.4.title: "Ein formeller Pakt"
 cc_bonds.4.desc: "Der erste formale Pakt dieser Art wurde geschlossen: [bond_subj.GetName] tritt in eine strukturierte Beziehung zu [bond_subj.GetOverlord.GetName] ein — weder ein einfacher Verbündeter noch eine eroberte Provinz, sondern etwas Gewählteres. Die Frage, wie solche Beziehungen geregelt werden, beginnt an Bedeutung zu gewinnen."
 cc_bonds.4.a: "Ein neues Kapitel in der Kunst der Regierungsführung. Wir sind zufrieden."
 cc_bonds.4.b: "Dokumentieren und fortfahren."

 # === cc_bonds.5 — Word from the Provinces ===
 cc_bonds.5.title: "Nachrichten aus den Provinzen"
 cc_bonds.5.desc.thriving: "Die neuesten Depeschen aus [bond_subj.GetName] sprechen von einer prosperierenden Saison. Der Handel fließt ungehindert, die Ernte war großzügig und das Volk scheint unter den derzeitigen Regelungen zufrieden zu sein. Unsere Bindung zum Vasallen scheint Früchte zu tragen."
 cc_bonds.5.desc.strained: "Beunruhigende Berichte haben die Hauptstadt erreicht. Kaufleute sprechen von ungerechten Forderungen, Beamte bemerken wachsenden Groll unter der Bevölkerung von [bond_subj.GetNameWithNoTooltip]. Die Beziehung scheint nicht gänzlich stabil zu sein, so sehr wir es auch vermeiden mögen, dies genau zu prüfen."
 cc_bonds.5.desc.neutral: "Routineberichte treffen von [bond_subj.GetNameWithNoTooltip] ein. Die Verwaltung schreitet wie erwartet voran, es werden keine bemerkenswerten Vorfälle gemeldet. Die Beziehung zu [bond_subj.GetNameWithNoTooltip] gestaltet sich weiterhin weitgehend unverändert."
 cc_bonds.5.a: "Reagiert mit persönlicher Aufmerksamkeit."
 cc_bonds.5.b: "Mit den anderen Berichten abheften."

 # === cc_bonds.6 — The Diplomat's Report ===
 cc_bonds.6.title: "Der Bericht des Diplomaten"
 cc_bonds.6.desc.content: "Unser Gesandter kehrt von [bond_subj.GetName] mit einem ermutigenden Bericht zurück. Die Kolonisten scheinen zu florieren, der Handel ist aktiv, und der Gouverneur spricht warmherzig über die Regelungen der Krone. Es herrscht das spürbare Gefühl, dass die Beziehung für beide Seiten vorteilhaft ist."
 cc_bonds.6.desc.discontent: "Der Bericht unseres Diplomaten aus [bond_subj.GetNameWithNoTooltip] ist unangenehm zu lesen. Steuerlasten sind ein wiederkehrender Beschwerdepunkt, Handelsbeschränkungen werden missbilligt, und in den Tavernen wird darüber gesprochen, dass die Krone mehr nimmt, als sie gibt."
 cc_bonds.6.desc.neutral: "Der Bericht des Diplomaten aus [bond_subj.GetNameWithNoTooltip] ist unauffällig. Der Handel geht weiter, die Verwaltung funktioniert, und es gibt keine dringenden Anliegen, die unserer Aufmerksamkeit bedürfen."
 cc_bonds.6.a: "Ein persönliches Lob an den Gouverneur senden."
 cc_bonds.6.b: "Empfang bestätigen."

 # === cc_bonds.7 — Rumors at Court ===
 cc_bonds.7.title: "Gerüchte am Hofe"
 cc_bonds.7.desc.loyal: "Besucher aus [bond_subj.GetName] sprechen mit Stolz von der Treue ihres Herrn zur Krone. Der Haushalt des Adligen stößt bei jedem Fest auf den Lehnsherrn an, und es heißt, seine Soldaten würden uns im Hinterkopf behaltend trainieren. Was auch immer der Hof flüstert, dieser scheint wahrhaftig unserer Sache verpflichtet zu sein."
 cc_bonds.7.desc.restless: "Am Hof machen sich Gerüchte breit. Reisende aus [bond_subj.GetNameWithNoTooltip] sprechen von einem Herrn, der sich distanziert, dessen Trinksprüche auf die Krone nur noch pro forma erfolgen und dessen Haushalt im Stillen über das Kommende konspiriert. Es mag nichts bedeuten. Oder doch."
 cc_bonds.7.desc.neutral: "Hofklatsch dringt gelegentlich bis zum Markgrafen durch. Nichts Beunruhigendes — die üblichen Beschwerden über Steuern und Pflichten, vermischt mit den üblichen Prahlereien über militärische Kühnheit. Die Beziehung scheint unauffällig zu sein."
 cc_bonds.7.a: "Einen persönlichen Brief der Hochachtung senden."
 cc_bonds.7.b: "Das Gerede abtun."

 # === cc_bonds.8 — A Letter from the Dependency ===
 cc_bonds.8.title: "Ein Brief von [bond_subj.GetNameWithNoTooltip]"
 cc_bonds.8.desc.warm: "Ein Brief von [bond_subj.GetName] trifft ein, der alle Zeichen aufrichtiger Wärme trägt. Das Regierungshaus spricht von gemeinsamen Unternehmungen, von Dankbarkeit für die Aufmerksamkeit der Krone und von ihrem Stolz auf die Verbindung. Er liest sich weniger wie eine formelle Korrespondenz als vielmehr wie ein Brief von Familienmitgliedern."
 cc_bonds.8.desc.cold: "Ein formaler Brief von [bond_subj.GetNameWithNoTooltip] trifft ein. Die korrekten Höflichkeitsformen werden gewahrt, die Siegel ordnungsgemäß platziert, doch die Wärme fehlt. Zwischen den Zeilen der vorsichtigen Formulierungen liegt die kühle Distanz einer Beziehung, die man hat schleifen lassen."
 cc_bonds.8.desc.formal: "Die saisonliche Korrespondenz von [bond_subj.GetNameWithNoTooltip] trifft ein – korrekt, wohlformuliert und vollkommen aussagelos. Das regierende Haus kommt seinen Verpflichtungen nach. Die Beziehung ist intakt, wenn auch nicht herzlich."
 cc_bonds.8.a: "Antworte mit persönlicher Herzlichkeit."
 cc_bonds.8.b: "Eine standardmäßige Bestätigung senden."

 # === cc_bonds.9 — The Governor's Annual Dispatch ===
 cc_bonds.9.title: "Die jährliche Depesche des Gouverneurs"
 cc_bonds.9.desc.harmonious: "Der Jahresbericht des Gouverneurs aus [bond_subj.GetName] zeichnet ein ermutigendes Bild. Die Einnahmen sind gesund, die Verwaltung läuft reibungslos und die lokale Bevölkerung scheint sich ohne Reibereien der Autorität der Krone gefügt zu haben. Die Depesche spricht von einer Provinz, die unter den derzeitigen Regelungen gut funktioniert."
 cc_bonds.9.desc.troubled: "Der Jahresbericht des Gouverneurs wirft mehrere Fragen auf. Die Eintreibung der Einnahmen stieß auf Widerstand, lokale Beamte sind wenig kooperativ und es gibt Passagen, die fast absichtlich vage formuliert scheinen. Die Provinz befindet sich nicht im offenen Aufstand, aber sie scheint auch nicht zufrieden zu sein."
 cc_bonds.9.desc.routine: "Die jährliche Depesche des Gouverneurs trifft planmäßig ein. Die Einnahmezahlen sind angemessen, administrative Angelegenheiten sind in Ordnung und es wurden keine besonderen Bedenken vermerkt. [bond_subj.GetNameWithNoTooltip] verhält sich weiterhin in der gewohnten Weise."
 cc_bonds.9.a: "Sende Lob und Anerkennung an den Gouverneur."
 cc_bonds.9.b: "Zur Prüfung vorlegen."
