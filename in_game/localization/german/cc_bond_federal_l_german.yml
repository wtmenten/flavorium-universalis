l_german:

 # ============================================================
 # AoR FEDERAL BOND EVENTS — cc_bonds.140–145
 # ============================================================

 # === cc_bonds.140 — The Federal Member Stands with the Union ===
 cc_bonds.140.title: "Das Bundesmitglied steht hinter der Union"
 cc_bonds.140.desc: "Das Zeitalter der Revolutionen ist angebrochen, und mit ihm die Prüfung jeder Loyalitätsbindung. [bond_subj.GetName] hat diese Prüfung mit einer Klarheit bestanden, die keiner Interpretation bedarf. Ihr Parlament hat den föderalen Pakt formell erneuert, ihre Führung hat sich öffentlich für die Union ausgesprochen und ihre Bevölkerung — in einem politischen Moment, in dem es einfach gewesen wäre, wegzusehen — hat dies getan. Die Jahre der Gleichbehandlung, der echten Konsultation, der gemeinsamen Verwaltung statt aufgezwungener Autorität haben das hervorgebracht, was kein Kolonialadministrator künstlich erschaffen kann: ein Volk, das aus eigenem Antrieb entschieden hat, dass diese Union es wert ist, verteidigt zu werden."
 cc_bonds.140.a: "Feiere dies öffentlich. Das Imperium baut auf Beziehungen wie dieser auf."
 cc_bonds.140.b: "Formalisiere das Band — erweitere ihre Vertretung im föderalen Parlament."

 # === cc_bonds.141 — The Federal Member Demands Equal Rights ===
 cc_bonds.141.title: "Das Bundesmitglied fordert Gleichberechtigung"
 cc_bonds.141.desc: "Das Zeitalter der Revolutionen hat [bond_subj.GetName] erreicht, und ihr Parlament hat etwas Prägnantes entworfen: eine formelle Forderung nach gleicher Repräsentation, gleichen Rechten und gleichem Status innerhalb des föderalen Pakts — nicht die theoretische Gleichheit, die ihnen versprochen wurde, sondern die substanzielle Gleichheit, die sie nicht erhalten haben. Das Dokument ist im Ton ruhig und im Inhalt vernichtend. Es listet detailliert die Entscheidungen auf, bei denen ihre Repräsentation überstimmt wurde, die Gesetze, in denen ihre Interessen beiseite geschoben wurden, und die Momente, in denen das Wort 'föderal' sich als 'vorbehaltlich einer Prüfung' herausstellte. Sie drohen nicht mit Unabhängigkeit. Sie fragen, ob die Föderation real ist."
 cc_bonds.141.a: "Es ist real. Gewähre ihnen die volle Repräsentation, die ihnen zusteht."
 cc_bonds.141.b: "Die Forderung wurde zur Kenntnis genommen. Die Antwort lautet nein."

 # === cc_bonds.142 — The Associate Member Submits Its Petition ===
 cc_bonds.142.title: "Das assoziierte Mitglied reicht seine Petition ein"
 cc_bonds.142.desc: "Die Führung von [bond_subj.GetName] hat eine formelle Petition eingereicht. Es ist keine Forderung – dafür sind sie zu vorsichtig –, aber es ist das nächste Äquivalent, das sie zu formulieren bereit waren. Sie fragen mit beträchtlicher diplomatischer Finesse, ob die Voraussetzungen für eine volle föderale Mitgliedschaft nun in Betracht gezogen werden könnten. Sie verweisen auf ihre wirtschaftlichen Beiträge, ihre militärische Unterstützung und ihre jahrelange Kooperation trotz der Einschränkungen des assoziierten Status. Sie bitten nicht um Gleichberechtigung, weil sie sich ein Recht darauf anmaßen. Sie bitten darum, weil sie es verdient haben und vorsichtig glauben, dass das Gericht zustimmen möge."
 cc_bonds.142.a: "Genehmigen Sie die Petition. Erheben Sie sie in die volle föderale Mitgliedschaft."
 cc_bonds.142.b: "Nimm die Petition zur Kenntnis – ehre sie mit Gold und dem Versprechen einer Prüfung."
 cc_bonds.142.c: "Die Petition ablehnen. Sie sind ein assoziiertes Mitglied, und das ist ausreichend."

 # === cc_bonds.143 — The False Federation Unravels ===
 cc_bonds.143.title: "Die falsche Föderation löst sich auf"
 cc_bonds.143.desc: "Jemand hat Buch geführt. Die Depeschen aus [bond_subj.GetName] machen deutlich, dass die Abrechnung abgeschlossen ist und die Zahlen nicht günstig sind. Die föderale Charta versprach Gleichberechtigung, gemeinsame Verwaltung und eine echte Partnerschaft. Die vergangenen Jahre brachten jedoch Extraktion in großem Stil, administrative Entscheidungen ohne Konsultation und ein Regierungsarrangement, das bei näherer Betrachtung eher wie die koloniale Beziehung aussieht, die es eigentlich ersetzen sollte. Die Führung von [bond_subj.GetName] befindet sich noch nicht im offenen Aufstand. Aber die revolutionären Pamphlete, die in der Hauptstadt kursieren, argumentieren nicht mehr nur, dass Unabhängigkeit wünschenswert sei. Sie beginnen zu argumentieren, dass sie notwendig ist."
 cc_bonds.143.a: "Beenden Sie den Schein. Wandeln Sie die Charta in eine direkte Verwaltung um."
 cc_bonds.143.b: "Kauf dir ihr Schweigen. Zahle, was nötig ist, um die Situation zu stabilisieren."
 cc_bonds.143.c: "Lassen Sie es geschehen. Wir haben schon früher Krisen bewältigt."

 # === cc_bonds.144 — The Colony Asserts Its Place ===
 cc_bonds.144.title: "Die Kolonie behauptet ihren Platz"
 cc_bonds.144.desc: "Die Nachricht von [bond_subj.GetName] ist weder eine Bitte noch eine Forderung — sie ist etwas, das schwerer zu akzeptieren ist: eine Feststellung. Die koloniale Führung hat geschrieben, um mit beträchtlichem Selbstvertrauen mitzuteilen, dass sie die revolutionären Strömungen beobachtet haben, die die Welt ergreifen, und dass sie diese nicht fürchten. Sie fürchten sich nicht, weil sie glauben, etwas zu besitzen, das diese Strömungen nicht bieten können: eine echte Beziehung zur imperialen Metropole, die über Jahrzehnte ehrlicher Geschäftsbeziehungen, gemeinsamer Verwaltung und gegenseitiger Investitionen aufgebaut wurde. Sie schreiben, dass sie diese Beziehung formalisieren möchten — nicht als Untertanen, sondern als Partner. Sie glauben, dass die Zeit für eine föderale Regelung gekommen ist und dass das Reich dadurch stärker werden wird."
 cc_bonds.144.a: "Willkommen als vollwertige föderale Partner. Die Union ist durch diesen Moment stärker."
 cc_bonds.144.b: "Biete eine assoziierte Mitgliedschaft an – ein echter Schritt, wenn auch nicht der vollständige, den sie forderten."
 cc_bonds.144.c: "Lade sie als ersten Schritt in den Kaiserrat ein."
 cc_bonds.144.d: "Ablehnen. Die derzeitige Regelung dient uns ausreichend."

 # === cc_bonds.145 — The Client Seeks Cover ===
 cc_bonds.145.title: "Der Klient sucht Schutz"
 cc_bonds.145.desc: "Die Führung von [bond_subj.GetName] hat eine private Mitteilung gesendet. Sie haben das Zeitalter der Revolutionen beobachtet und etwas identifiziert, das die revolutionäre Rhetorik ihnen nicht bieten kann: Stabilität innerhalb eines anerkannten imperialen Rahmens. Was sie wollen, ist Legitimität – jene Art von Legitimität, die daraus resultiert, ein namentlich genannter Partner in einer größeren konstitutionellen Vereinbarung zu sein, anstatt ein informeller Klient, dessen Status vollständig vom Wohlwollen der gegenwärtigen Regierung abhängt. Kurz gesagt: Sie bitten darum, aufgenommen zu werden. Die Frage ist, welche Art von Aufnahme wir anbieten."
 cc_bonds.145.a: "Bringen Sie sie in den Reichsrat – eine echte konstitutionelle Vereinbarung."
 cc_bonds.145.b: "Biete ihnen eine föderale Charta an – die Partnerschaft, die sie wollen, zu unseren Bedingungen."
 cc_bonds.145.c: "Behalten Sie die derzeitige Regelung bei. Es gibt keine Notwendigkeit, etwas zu formalisieren."

 # ============================================================
 # SYNERGY EVENTS — cc_synergy.27–28
 # ============================================================

 # === cc_synergy.27 — National Reformer + Federal Architect ===
 cc_synergy.27.title: "Ein Parlament für das Reich"
 cc_synergy.27.desc: "Zwei der einflussreichsten Köpfe am Hof haben miteinander gesprochen. [minister_a.GetName], der seine Karriere der Neugestaltung der internen Architektur des Staates gewidmet hat, und [minister_b.GetName], der die seine darin verbrachte, die vielfältigen Territorien des Reiches in einer produktiven Beziehung zu halten – sie haben ein gemeinsames Projekt gefunden. Sie schlagen die Formalisierung eines föderalen Parlaments vor: ein Gremium mit echter legislativer Stellung, das die Mitgliedsterritorien proportional zu ihren Beiträgen vertritt und echte Autorität über gemeinsame Angelegenheiten der Verteidigung, des Handels und des Rechts besitzt. Sie fragen, ob die Krone bereit ist, ein Reich durch Recht statt durch Willen zu regieren."
 cc_synergy.27.a: "Ja. Beauftrage den Bundespakt und berufe das Parlament ein."
 cc_synergy.27.b: "Zuerst ein kleinerer Schritt. Formalisieren Sie die parlamentarische Harmonie und sehen Sie, was folgt."

 # === cc_synergy.28 — Federal Architect + False Federal Member ===
 cc_synergy.28.title: "Der Architekt liest die Charta"
 cc_synergy.28.a: "Machen Sie es offiziell. Wandeln Sie die Charta in eine volle föderale Mitgliedschaft um."
 cc_synergy.28.b: "Teilweise Reform. Hebe sie in den Status von assoziierten Mitgliedern – eine echte Verbesserung."
 cc_synergy.28.c: "Die Vereinbarung ist profitabel. Lassen wir sie so, wie sie ist."
 cc_synergy.28.desc: "[minister.GetName] hat Zeit damit verbracht, die Charta-Regelung mit [bond_subj.GetName] zu prüfen, und seine Einschätzung ist unangenehm. Das Dokument ist bei genauerem Hinsehen dem Namen nach eine föderale Charta und in der Praxis ein Kolonialpakt. Das Parlament des Mitglieds hat keine bindende Autorität. Die Repräsentation ist beratend. Die wirtschaftliche Regelung fließt in nur eine Richtung. Er sagt dies nicht, um den Hof zu beschämen. Er sagt es, weil er glaubt, dass die Regelung ein Risiko darstellt: Wenn die Bevölkerung von [bond_subj.GetName] voll und ganz versteht, was sie erhalten haben statt dessen, was ihnen versprochen wurde, wird die Reaktion schlimmer sein, als wenn die Täuschung nie stattgefunden hätte. Die Frage ist, ob der Hof dies korrigieren will, solange eine Korrektur noch eine Wahl ist."
