l_german:

 # ============================================================
 # AoR FEDERAL BOND EVENTS — cc_bonds.140–145
 # ============================================================

 # === cc_bonds.140 — The Federal Member Stands with the Union ===
 cc_bonds.140.title: "Das Bundesmitglied steht hinter der Union"
 cc_bonds.140.desc: "Das Zeitalter der Revolutionen ist angebrochen, und jedes Band der Loyalität wird auf die Probe gestellt. [bond_subj.GetName] hat diese Prüfung mit einer Klarheit bestanden, die keiner Interpretation bedarf. Ihr Parlament hat den föderalen Pakt erneuert, ihre Führung hat sich öffentlich für die Union ausgesprochen, und ihre Bevölkerung hat in einem Moment, in dem es einfach gewesen wäre, wegzusehen, dies nicht getan. Jahre der Gleichbehandlung und echter Konsultation haben das hervorgebracht, was kein Administrator künstlich erschaffen kann."
 cc_bonds.140.a: "Feiere dies öffentlich. Das Imperium baut auf Beziehungen wie dieser auf."
 cc_bonds.140.b: "Formalisiere es. Lass das föderale Parlament, nicht die Krone, die Union zusammenhalten."

 # === cc_bonds.141 — The Federal Member Demands Equal Rights ===
 cc_bonds.141.title: "Das Bundesmitglied fordert Gleichberechtigung"
 cc_bonds.141.desc: "Das Zeitalter der Revolutionen hat [bond_subj.GetName] erreicht, und ihr Parlament hat etwas Pointiertes entworfen: eine formelle Forderung nach gleicher Repräsentation und Gleichstellung innerhalb des föderalen Pakts – wobei die substanzielle und nicht die bloß formale Art gemeint ist. Das Dokument ist im Ton ruhig und im Inhalt vernichtend. Es listet die Entscheidungen auf, bei denen ihre Repräsentation übergangen wurde, und die Momente, in denen „föderal“ faktisch „vorbehaltslos prüfbar“ bedeutete. Sie drohen nicht mit Unabhängigkeit. Sie fragen, ob die Föderation real ist."
 cc_bonds.141.a: "Es ist real. Gewähre ihnen die volle Repräsentation, die ihnen zusteht."
 cc_bonds.141.b: "Die Forderung wurde zur Kenntnis genommen. Die Antwort lautet nein."

 # === cc_bonds.142 — The Associate Member Submits Its Petition ===
 cc_bonds.142.title: "Das assoziierte Mitglied reicht seine Petition ein"
 cc_bonds.142.desc: "Die Führung von [bond_subj.GetName] hat eine formelle Petition eingereicht. Es ist keine Forderung, da sie dafür zu vorsichtig sind, aber es ist so nah an einer, wie sie bereit waren zu gehen. Sie fragen mit großer Diskretion, ob die Voraussetzungen für eine volle föderale Mitgliedschaft nun in Betracht gezogen werden könnten, und verweisen auf ihre wirtschaftlichen Beiträge, ihre militärische Unterstützung und ihre jahrelange Kooperation trotz der Einschränkungen des assoziierten Status. Sie fragen deshalb, weil sie es verdient haben und vermuten, dass der Hof zustimmen könnte."
 cc_bonds.142.a: "Genehmigen Sie die Petition. Erheben Sie sie in die volle föderale Mitgliedschaft."
 cc_bonds.142.b: "Bestätige den Erhalt. Ehre die Bitte mit Gold und dem Versprechen einer Prüfung."
 cc_bonds.142.c: "Tu es ab. Sie sind ein assoziiertes Mitglied, und das ist ausreichend."

 # === cc_bonds.143 — The False Federation Unravels ===
 cc_bonds.143.title: "Die falsche Föderation löst sich auf"
 cc_bonds.143.desc: "Jemand hat Buch geführt. Die Depeschen aus [bond_subj.GetName] machen deutlich, dass die Abrechnung abgeschlossen ist und die Zahlen nicht günstig sind. Die Charta versprach Gleichstellung und gemeinsame Verwaltung; die vergangenen Jahre brachten jedoch Ausbeutung in großem Stil und Entscheidungen ohne Konsultation – ein Arrangement, das bei näherer Betrachtung wie die Kolonialbeziehung aussieht, die es eigentlich ersetzen sollte. Die Pamphlete, die in ihrer Hauptstadt kursieren, argumentieren nicht mehr, dass Unabhängigkeit wünschenswert sei, sondern dass sie notwendig ist."
 cc_bonds.143.a: "Beenden Sie den Schein. Wandeln Sie die Charta in eine direkte Verwaltung um."
 cc_bonds.143.b: "Kauf dir ihr Schweigen. Zahle, was nötig ist, um die Situation zu stabilisieren."
 cc_bonds.143.c: "Macht die Charta real, anstatt die Lüge zu verteidigen."

 # === cc_bonds.144 — The Colony Asserts Its Place ===
 cc_bonds.144.title: "Die Kolonie behauptet ihren Platz"
 cc_bonds.144.desc: "Die Nachricht aus [bond_subj.GetName] ist weder eine Petition noch eine Forderung, sondern etwas, das schwerer zu akzeptieren ist: eine Erklärung. Die koloniale Führung schreibt, dass sie die revolutionären Strömungen beobachtet haben, die die Welt überrollen, und dass sie diese nicht fürchten, da sie glauben, etwas zu besitzen, das diese Strömungen nicht bieten können – aufgebaut über Jahrzehnte ehrlichen Handelns und gemeinsamer Regierungsführung. Sie wünschen sich diese Beziehung formalisiert, als Partner statt als Untertanen. Sie glauben, die Zeit sei gekommen und das Imperium werde dadurch stärker."
 cc_bonds.144.a: "Begrüßen Sie sie als vollwertige föderale Partner. Die Union wird dadurch stärker."
 cc_bonds.144.b: "Bietet eine assoziierte Mitgliedschaft an. Ein echter Schritt, wenn auch nicht der, den sie verlangt haben."
 cc_bonds.144.c: "Ladet sie als ersten Schritt in den Kaiserrat ein."
 cc_bonds.144.d: "Ablehnen. Die derzeitige Regelung dient uns ausreichend."

 # === cc_bonds.145 — The Client Seeks Cover ===
 cc_bonds.145.title: "Der Klient sucht Schutz"
 cc_bonds.145.desc: "Die Führung von [bond_subj.GetName] hat eine private Mitteilung gesendet. Sie haben das Zeitalter der Revolutionen beobachtet und etwas identifiziert, das die revolutionäre Rhetorik ihnen nicht bieten kann: Stabilität unter einem anerkannten imperialen Rahmen. Was sie wollen, ist Legitimität – jene Art, die daraus resultiert, ein namentlich genannter Partner in einer konstitutionellen Vereinbarung zu sein, statt ein informeller Klient, dessen Status vom guten Willen der derzeitigen Regierung abhängt. Sie bitten darum, aufgenommen zu werden. Die Frage ist, welche Art von Aufnahme wir anbieten."
 cc_bonds.145.a: "Nimm sie in den Kaiserrat auf. Ein echtes konstitutionelles Arrangement."
 cc_bonds.145.b: "Bietet ihnen eine föderale Charta an. Die Partnerschaft, die sie wollen, zu unseren Bedingungen."
 cc_bonds.145.c: "Behalten Sie die derzeitige Regelung bei. Es gibt keine Notwendigkeit, etwas zu formalisieren."

 # ============================================================
 # SYNERGY EVENTS — cc_synergy.27–28
 # ============================================================

 # === cc_synergy.27 — National Reformer + Federal Architect ===
 cc_synergy.27.title: "Ein Parlament für das Reich"
 cc_synergy.27.desc: "Zwei der einflussreichsten Köpfe am Hof haben miteinander gesprochen. [minister_a.GetName], der seine Karriere der Neugestaltung der internen Architektur des Staates gewidmet hat, und [minister_b.GetName], der die seine darin verbrachte, die vielfältigen Territorien des Reiches in einer produktiven Beziehung zu halten – sie haben ein gemeinsames Projekt gefunden. Sie schlagen die Formalisierung eines föderalen Parlaments vor: ein Gremium mit echter legislativer Stellung, das die Mitgliedsterritorien proportional zu ihren Beiträgen vertritt und echte Autorität über gemeinsame Angelegenheiten der Verteidigung, des Handels und des Rechts besitzt. Sie fragen, ob die Krone bereit ist, ein Reich durch Recht statt durch Willen zu regieren."
 cc_synergy.27.a: "Ja. Beauftrage den Bundespakt und berufe das Parlament ein."
 cc_synergy.27.b: "Zuerst ein kleinerer Schritt. Formalisieren Sie die parlamentarische Harmonie und sehen Sie, was folgt."

 # === cc_synergy.28 — Federal Architect + False Federal Member ===
 cc_synergy.28.title: "Der Architekt liest die Charta"
 cc_synergy.28.a: "Machen Sie es offiziell. Wandeln Sie die Charta in eine volle föderale Mitgliedschaft um."
 cc_synergy.28.b: "Teilweise Reform. Hebe sie in den Status von assoziierten Mitgliedern – eine echte Verbesserung."
 cc_synergy.28.c: "Die Vereinbarung ist profitabel. Lassen wir sie so, wie sie ist."
 cc_synergy.28.desc: "[minister.GetName] hat Zeit damit verbracht, die Charta-Regelung mit [bond_subj.GetName] zu prüfen, und seine Einschätzung ist unangenehm. Das Dokument ist bei genauerem Hinsehen dem Namen nach eine föderale Charta und in der Praxis ein Kolonialpakt. Das Parlament des Mitglieds hat keine bindende Autorität. Die Repräsentation ist beratend. Die wirtschaftliche Regelung fließt in nur eine Richtung. Er sagt dies nicht, um den Hof zu beschämen. Er sagt es, weil er glaubt, dass die Regelung ein Risiko darstellt: Wenn die Bevölkerung von [bond_subj.GetName] voll und ganz versteht, was sie erhalten haben statt dessen, was ihnen versprochen wurde, wird die Reaktion schlimmer sein, als wenn die Täuschung nie stattgefunden hätte. Die Frage ist, ob der Hof dies korrigieren will, solange eine Korrektur noch eine Wahl ist."
 cc_bonds.140.desc.deep: "Das Parlament von [bond_subj.GetName] hat mehr getan, als den Pakt nur zu erneuern. Es hat beschlossen, eigene Regimenter zur Besetzung von Provinzen zu entsenden, die nicht die ihren sind, mit dem Argument, dass die Union entweder ein Land ist oder gar nichts. Die Debatte war öffentlich, die Abstimmung war eindeutig, und das Protokoll wurde in drei anderen föderalen Hauptstädten nachgedruckt. Sie verteidigen uns nicht. Sie verteidigen etwas, das sie teilweise als ihr Eigen betrachten."
 cc_bonds.141.desc.deep: "Das Parlament von [bond_subj.GetName] hat seine eigene Frage beantwortet. Es hat eine Resolution verabschiedet, die den föderalen Pakt wegen Nichterfüllung für nichtig erklärt, vierzig Jahre Präzedenzfälle angeführt und die Sitzung vertagt. Ihre Delegierten sind nach Hause gegangen. Es haben sich keine Truppen bewegt und es wurde keine Erklärung abgegeben, was es irgendwie schlimmer macht: Sie haben nicht gegen die Union rebelliert, sie haben entschieden, dass sie nicht existiert."
 cc_bonds.141.desc.scholar: "Die Forderung von [bond_subj.GetName] ist nicht in der Sprache von Petitionen verfasst. Sie ist in der Sprache des Gelehrten geschrieben, den wir vor einer Generation unterdrückten und dessen Argumente über Zustimmung und Pakt gefährlich genug waren, um ihn zum Schweigen zu bringen, aber offensichtlich nicht gefährlich genug, um sie zu beantworten. Ihr Parlament hat sein Konzept vollständig übernommen. Wir hatten die Chance, mit einem Mann zu streiten. Jetzt streiten wir mit einer Legislative, die ihn auswendig gelernt hat."
 cc_bonds.141.c: "Löse die Union auf, anstatt über das Wort zu streiten."
 cc_bonds.142.desc.deep: "Die Petition von [bond_subj.GetName] erreicht uns mit einem Anhang, nach dem niemand gefragt hat: ein Vergleich ihrer Beiträge mit denen zweier Vollmitglieder über sechzig Jahre hinweg, inklusive Quellen. Der Fall ist nicht zu widerlegen, und das wissen sie auch. Zudem haben sie darauf geachtet, ihn privat einzureichen, statt ihn zu veröffentlichen, was das Überzeugendste an dem Dokument ist."
 cc_bonds.143.desc.deep: "Die Charta von [bond_subj.GetName] wurde in ihrer Versammlung laut vorgelesen, Klausel für Klausel, wobei nach jeder einzelnen der entsprechende Bericht darüber verlesen wurde, was tatsächlich passiert ist. Es dauerte zwei Tage. Ein Transkript kursiert bereits in jeder Hauptstadt, die jemals etwas mit uns unterzeichnet hat. Die Föderation löst sich nicht auf. Sie wurde öffentlich von Menschen zerlegt, die bessere Aufzeichnungen geführt haben als wir."
 cc_bonds.143.d: "Lasst es seinen Lauf nehmen. Wir haben schon früher Krisen bewältigt."
 cc_bonds.144.desc.deep: "Die Kolonialversammlung von [bond_subj.GetName] hat für die Föderation gestimmt und das Ergebnis mit einer Delegation anstatt mit einem Kurier übermittelt. Ihr Argument ist, dass sie seit zwei Generationen als Partner fungiert haben und es vorziehen würden, wenn der Papierkram nun nachzieht. Sie haben zudem höflich klargestellt, dass sie die Alternative in Betracht gezogen und sie aufgrund ihrer Verdienste und nicht aus Mangel an Gelegenheit abgelehnt haben."
 cc_bonds.144.desc.voice: "Die Versammlung, die wir vor Jahrzehnten gechartert haben, hat abgestimmt, und sie hat für die Föderation gestimmt. Diese Abstimmung ist das gesamte Argument: Sie bitten darum, etwas zu formalisieren, das sie seit dem Tag praktizieren, an dem wir ihnen einen Saal dafür gegeben haben. Jede andere Kolonie der Welt entdeckt in diesem Jahr, was passiert, wenn es keinen Ort für die Debatte gibt. Diese hier hat sie geführt und ist zu einem Ergebnis gekommen, mit dem wir leben können."
 cc_bonds.145.desc.deep: "Die Mitteilung aus [bond_subj.GetName] ist ungewöhnlich direkt für einen Klientenstaat. Sie sagen offen, dass sie in diesem Jahr Ansätze von zwei anderen Mächten erhalten haben, aber lieber bleiben würden. Sie bitten uns um einen Grund, der den nächsten Regierungswechsel in unserer Hauptstadt überdauert. Eine Charta würde genügen. Goodwill, bemerken sie, hat dies nicht getan."
