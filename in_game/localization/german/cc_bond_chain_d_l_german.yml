l_german:
 # === cc_bonds.130 — A Brilliant Student ===
 cc_bonds.130.title: "Ein brillanter Schüler"
 cc_bonds.130.desc: "Ein Gelehrter von bemerkenswertem Talent ist aus [bond_subj.GetName] hervorgegangen — ein junger Geist, dessen Fokus auf Philosophie, Regierungsführung und der Geschichte der Völker zu liegen scheint. Aufgrund seines Rufs und der wenigen kurzen Werke, die bereits kursieren, ist dies jemand, dessen Ideen von Bedeutung sein werden. Die Frage, vor der wir stehen, ist: welche Art von Ideen, und in wessen Dienst? Überlassen seinem eigenen Weg, wird er schreiben, was seine Heimat hervorbringt. An unseren Hof gebracht, wird er schreiben, was unser Hof formt. Als Propagandist eingesetzt, wird er schreiben, was wir brauchen — und jeder wird es wissen."
 cc_bonds.130.a: "Bringen Sie ihn an unseren Hof. Lassen Sie ihn das Reich von innen heraus kennenlernen."
 cc_bonds.130.b: "Finanziere seine Ausbildung in seinem Heimatland und lass ihn frei publizieren. Lass ihn sein, wer er ist."
 cc_bonds.130.c: "Biete ihm eine Anstellung an. Sein Talent sollte den Zwecken der Krone dienen."
 cc_bonds.130.d: "Er ist ein Gelehrter in einem Vasallenstaat. Wir müssen uns nicht darum kümmern."

 # === cc_bonds.131 — The Scholar's First Work ===
 cc_bonds.131.title: "Das erste Werk des Gelehrten"
 cc_bonds.131.desc_court: "Der Gelehrte aus [bond_subj.GetName] hat ein bedeutendes Werk vollendet — geschliffen, selbstbewusst und thoroughly durch seine Jahre an unserem Hof geformt. Das zentrale Argument rahmt die Geschichte des Untertans als Vorbereitung auf das Imperium, dessen Teil er nun ist: ihre Traditionen als Vorläufer unserer Institutionen, ihre Errungenschaften als Nebenflüsse der größeren kulturellen Erzählung. Es ist, wie alle gut gearbeiteten imperialen Historiographien, sowohl schmeichelhaft als auch ein wenig unangenehm zu lesen."
 cc_bonds.131.desc_home: "Der Gelehrte aus [bond_subj.GetName] hat ein wegweisendes Werk veröffentlicht, und es ist nicht das, was wir hätten vorhersagen können. Es ist ein akribischer, wunderschön geschriebener Bericht über die Kulturgeschichte des Untertans — seine Sprache, seine Traditionen, sein eigenständiges philosophisches Erbe. Es greift das Lehnsverhältnis nicht an. Es plädiert für nichts. Es beharrt einfach mit beachtlicher Eleganz darauf, dass es hier etwas gibt, das es zu beschreiben lohnt, und dass die Beschreibung ihr eigenes Argument ist."
 cc_bonds.131.desc_prop: "Der Propagandist aus [bond_subj.GetName] hat sein Werk termingerecht fertiggestellt. Es argumentiert, wie von uns gewünscht, dass die Partnerschaft zwischen [overlord.GetNameWithNoTooltip] und [bond_subj.GetNameWithNoTooltip] auf gegenseitigem Nutzen basiert, dass die Herrschaft von [overlord.GetName] [bond_subj.GetNameWithNoTooltip] bereichert hat und dass das Volk der [bond_subj_culture.GetName] ein gemeinsames Schicksal teilt. Das Werk wurde verbreitet. Es wurde gelesen. Unter den wenigen Gebildeten in [bond_subj.GetNameWithNoTooltip] wurde es hauptsächlich in jenem Ton diskutiert, den man verwendet, wenn man über etwas spricht, das man leicht peinlich findet."
 cc_bonds.131.desc_free: "Der Gelehrte aus [bond_subj.GetName] — jener, den wir weder gefördert noch rekrutiert haben — hat ein Werk veröffentlicht, das über das Territorium hinaus zirkuliert. Der Ton ist ambivalent: es feiert das Lehnsverhältnis weder und verdammt es auch nicht. Es beschreibt, was ist. Die Wirkung dort, wo es gelesen wurde, ist bescheiden: ein kleiner positiver Eindruck der intellektuellen Kultur des Untertans, und sonst nichts."
 cc_bonds.131.a_use: "Verwenden Sie es als offiziellen Text. Verbreiten Sie es über die Kanäle der Krone."
 cc_bonds.131.a_standalone: "Lassen Sie es für sich selbst stehen. Ein Werk wie dieses verdient mehr Respekt, wenn die Hand der Krone nicht darauf liegt."
 cc_bonds.131.b_sponsor: "Sponsere einen Begleitband, der dieses Werk in den breiteren Kontext der Geschichte des Reiches einordnet."
 cc_bonds.131.b_allow: "Lassen Sie es stehen. Dies ist ihre Geschichte, und sie bedroht die unsere nicht."
 cc_bonds.131.b_suppress: "Unterdrücke es. Diese Art von kultureller Durchsetzungsfähigkeit hat Konsequenzen."
 cc_bonds.131.c_more: "Beauftragen Sie mehr. Die Arbeit bewirkt das, wofür sie konzipiert wurde."
 cc_bonds.131.c_distance: "Distanziere die Krone von diesem Vorhaben. Die Arbeit hat uns nicht gut gedient."
 cc_bonds.131.d_note: "Notiert. Der Vasall bringt interessante Köpfe hervor."

 # === cc_bonds.132 — The Scholar's Legacy ===
 cc_bonds.132.title: "Das Vermächtnis des Gelehrten"
 cc_bonds.132.desc_aligned: "Der Gelehrte aus [bond_subj.GetName] ist gestorben, wie Gelehrte es tun, und hat mehr hinterlassen, als er beabsichtigt hatte. Seine Ideen haben die gebildete Klasse des Territoriums über eine Generation lang durchdrungen. Was aus unserer Sicht bemerkenswert ist, ist, wie sie aufgenommen wurden: als das Werk von jemandem, der verstand, wozu das Imperium da war, und sich entschied, dazuzugehören. Seine Schüler zitieren ihn zur Verteidigung des Lehnsverhältnisses. Er ist posthum zu einem der überzeugendsten Argumente für Loyalität geworden, die das Territorium je hervorgebracht hat."
 cc_bonds.132.desc_contested: "Der Gelehrte aus [bond_subj.GetName] ist gestorben und hat Dinge hinterlassen, die ihn um Generationen überdauern werden. Im Territorium existiert nun eine Denkschule, die von seiner Prämisse ausgeht: dass die Kultur des Untertans eigenständig, kohärent und bewahrenswert ist. Dies ist ein zweischneidiges Schwert. Jene Schüler, die ebenfalls an das Imperium glauben, argumentieren, dass beides kompatibel sei — dass man tiefgreifend man selbst sein und dennoch loyal bleiben könne. Diejenigen, die nicht an das Imperium glauben, finden in denselben Texten ihre eloquenteste Rechtfertigung."
 cc_bonds.132.desc_suppressed: "Der Gelehrte, den wir unterdrückten, ist seit Jahren tot, und sein Werk wird heute weiter gelesen als zu der Zeit, als wir es verboten haben. Untergrundkopien zirkulieren. Studenten kopieren sie von Hand. Die Ideen, die wir für zu gefährlich hielten, sind gerade wegen dieses Urteils zu den aufregendsten Ideen im Territorium geworden. Die Unterdrückung beendete die Diskussion nicht. Sie verlieh dem Argument ein Martyrium."
 cc_bonds.132.desc_default: "Eine Generation ist vergangen, seit der Gelehrte aus [bond_subj.GetName] das Werk verfasste, mit dem wir uns befasst haben — oder entschieden haben, es nicht zu tun. Die intellektuelle Landschaft des Territoriums hat sich auf eine Weise verschoben, die schwer einer einzelnen Ursache zuzuschreiben ist. Der Beitrag des Gelehrten, was immer er auch war, ist in die allgemeine Kultur übergegangen und nicht mehr von ihr trennbar."
 cc_bonds.132.a: "Sein Vermächtnis dient dem Reich gut. Wir werden es formell anerkennen."
 cc_bonds.132.b_embrace: "Ihre kulturelle Identität und ihre Loyalität zu uns sind kein Widerspruch. Akzeptieren Sie beides."
 cc_bonds.132.b_neutral: "Die Ideen haben Wurzeln geschlagen. Wir werden sie wachsen lassen, wie es ihnen gefällt."
 cc_bonds.132.c: "Die Unterdrückung hat das Gegenteil von dem bewirkt, was wir beabsichtigt hatten."
 cc_bonds.132.d: "Das Kapitel des Gelehrten ist abgeschlossen."

 cc_bonds.132.desc_counter: "Der Gelehrte verbrachte die letzten Jahrzehnte [scholar_char.GetHerHis] Karriere unter Umständen, die nie vollständig geklärt wurden. Angestellt als Propagandist, politisch auf Distanz gehalten, wenn die Arbeit zu transparent wurde — diese Situation brachte etwas hervor, das die Krone nicht erwartet hatte. Indem wir uns weigerten, das Geschriebene von [scholar_char.GetSheHe] vollumfänglich zu unterstützen, gaben wir ihm Raum, etwas anderes als Propaganda zu sein. Es wurde auch so gelesen. Das Territorium erinnert sich an [scholar_char.GetName] nicht als jemanden, der vom Hof eingestellt wurde, sondern als eine komplizierte, prinzipientreue Figur. Das Erbe ist nuancierter — und dauerhafter —, als es ein Auftragswerk gewesen wäre."

 cc_bonds.132.e: "Erkenne die prinzipielle Distanz des Gelehrten an. Sie machte [scholar_char.GetHerHis] Arbeit ehrlich."
 cc_bonds.132.e.tooltip: "Die Entscheidung des Lehnsherrn, Distanz zur Propaganda zu wahren, verlieh der Arbeit des Gelehrten eine Authentizität, die eine beauftragte Verherrlichung nicht hätte erreichen können. Sowohl Cul als auch Per verbessern sich, und eine dauerhafte Chronik wird geschaffen."

 # === Works of art created by the brilliant scholar chain ===
 cc_scholar_early_notes: "Frühe Notizen von einem fernen Hof"
 cc_scholar_early_notes_desc: "Eine Sammlung von Beobachtungen und Reflexionen, die in der prägenden Phase einer bemerkenswerten wissenschaftlichen Karriere entstanden sind."

 cc_scholar_imperial_chronicle: "Eine kaiserliche Chronik"
 cc_scholar_imperial_chronicle_desc: "Ein wegweisender historischer Bericht, der die Vergangenheit des Vasallen als Vorbereitung auf das Reich darstellt, dem er nun angehört – gelehrt, ambitioniert und sorgfältig positioniert."

 cc_scholar_homeland_chronicle: "Eine Chronik der Heimat"
 cc_scholar_homeland_chronicle_desc: "Eine akribische Darstellung der Kulturgeschichte, der Traditionen und des eigenständigen philosophischen Erbes des Untertanengebiets – wobei mit beachtlicher Eleganz darauf beharrt wird, dass es hier etwas gibt, das es wert ist, bewahrt zu werden."

 cc_scholar_propaganda_work: "Eine Abhandlung über das gemeinsame Schicksal"
 cc_scholar_propaganda_work_desc: "Ein im Auftrag verfasstes Werk, das argumentiert, dass die Partnerschaft zwischen Lehnsherr und Untertan auf gegenseitigem Nutzen und einer gemeinsamen Zukunft basiert. In dem beschriebenen Territorium wird es mit höflicher Skepsis gelesen."

 cc_scholar_legacy_work: "Das Vermächtnis des Gelehrten"
 cc_scholar_legacy_work_desc: "Das Krönungswerk einer herausragenden Karriere — eine Synthese, die bereits begonnen hat, das geistige Leben einer Generation zu prägen."

 cc_scholar_forbidden_work: "Die unterdrückte Abhandlung"
 cc_scholar_forbidden_work_desc: "Ein Werk, das lange nach seinem formalen Verbot in Untergrundkopien kursierte. Die Unterdrückung verlieh ihm ein Martyrium, das es aus eigener Kraft nicht hätte erlangen können."
