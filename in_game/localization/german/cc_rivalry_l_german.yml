 # ============================================================
 # Modifier Display Names (Pillar 01)
 # ============================================================
 STATIC_MODIFIER_NAME_court_tension: "Spannungen am Hof"
 STATIC_MODIFIER_DESC_court_tension: "Zwei oder mehr Kabinettsmitglieder vertreten unversöhnliche Positionen. Eine politische Lähmung ist eingetreten – Prestige schwindet, die diplomatische Reputation leidet und jede Entscheidung kostet mehr."

 STATIC_MODIFIER_NAME_cc_cabal_compact: "Kabinettspakt"
 STATIC_MODIFIER_DESC_cc_cabal_compact: "Zwei verbündete Minister haben ihre Zusammenarbeit formalisiert. Das Kabinett funktioniert reibungsloser, und die geteilte Autorität verringert die Reibungsverluste der Regierungsführung."

 STATIC_MODIFIER_NAME_cc_faction_purge_fallout: "Fraktionsbedingte Auswirkungen"
 STATIC_MODIFIER_DESC_cc_faction_purge_fallout: "Die Entlassung eines Ministers ist nicht unbeantwortet geblieben. Das Netzwerk des gesäuberten Ministers rächt sich im Stillen – das Prestige schwindet und die diplomatischen Kontakte kühlen ab."

 # ============================================================
 # Character Interaction — Dismiss Rival Minister
 # ============================================================
 dismiss_rival_minister: "Minister entlassen"
 dismiss_rival_minister_desc: "Der Hof zerbricht an einer fraktionalen Rivalität. Die Entlassung eines der Minister wird den unmittelbaren Konflikt lösen – allerdings auf Kosten des Prestiges und, falls der Minister einem Stand zugeordnet ist, der Standesbeziehungen."
 choose_minister_to_dismiss: "Wähle einen Minister, der entlassen werden soll"
