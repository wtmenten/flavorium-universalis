l_german:
 # ============================================================
 # Pillar 01 — Court Rivalry & Cabinet Intrigue
 # ============================================================

 # --- cc_rival.1 — The Minister's Complaint ---
 cc_rival.1.title: "Die Beschwerde des Ministers"
 cc_rival.1.desc: "Die Spannung zwischen [rival_a.GetName] und [rival_b.GetName] hat zu einem offenen Bruch geführt. Beide haben nun formelle Bittschriften an die Krone gerichtet, wobei jeder fordert, dass der andere entfernt oder zurechtgewiesen wird. Der Hof beobachtet dies genau."

 cc_rival.1.a: "Stellen Sie sich auf die Seite von [rival_a.GetName]."
 cc_rival.1.a.tooltip: "[rival_b.GetName] erhält die klare Botschaft, dass [rival_b.GetHerHis] Position an diesem Hof von Zurückhaltung abhängig ist. Die Abfuhr wird nicht vergessen werden — aber die Spannung löst sich."

 cc_rival.1.b: "Stellen Sie sich auf die Seite von [rival_b.GetName]."
 cc_rival.1.b.tooltip: "[rival_a.GetName] wird in [rival_a.GetHerHis] Schranken gewiesen. Der Hof deutet das Signal; eine Fraktion kühlt ab, während die andere eine Wunde pflegt."

 cc_rival.1.c: "Vermitteln Sie eine Versöhnung zwischen ihnen."
 cc_rival.1.c.tooltip: "Eine teure und erschöpfende Übung in königlicher Geduld. Beide Minister verlassen den Thronsaal zufrieden — für den Moment. Der Rivalitätsscore sinkt, und Wohlwollen wird um den Preis von Münzen und Prestige erkauft."

 cc_rival.1.d: "Nutzen Sie die Spannungen aus – öffnen Sie ihre Korrespondenz."
 cc_rival.1.d.tooltip: "Lasst die Spionmeister des Hofes öffnen, was versiegelt wurde. Wenn es Intrigen gibt, ist es besser, davon zu wissen. Wenn es nichts gibt – wird zumindest einer von ihnen sich fragen, was ihr gefunden habt."

 # --- cc_rival.2 — A Letter Unsealed ---
 cc_rival.2.title: "Ein versiegeltes Schreiben"
 cc_rival.2.desc: "Die Korrespondenz von [rival_b.GetName] wurde diskret gesichtet. Was dabei gefunden wurde, ist zwar nicht hochverräterisch, aber dennoch schädlich. Private Kommunikation mit den Gegnern von [rival_a.GetName]; Zusagen ohne königliche Genehmigung; im Namen der Krone versprochene Gefälligkeiten. Der Brief liegt nun vor Ihnen."

 cc_rival.2.a: "Nutzen Sie es, um [rival_b.GetName] aus dem Kabinett zu entfernen."
 cc_rival.2.a.tooltip: "Der Brief wird zu einem formellen Vorwand. [rival_b.GetName] wird damit konfrontiert, das Prestige leidet unter dem Spektakel einer offenen Abweisung, und [rival_b.GetHerHis] Netzwerk wird der Krone über Jahre hinweg stillschweigend grollen."

 cc_rival.2.b: "Übergib es an [rival_a.GetName] als Druckmittel."
 cc_rival.2.b.tooltip: "Der Brief gelangt an den Rivalen. [rival_a.GetName] wird ihn als Munition nutzen – und der fraktionale Konflikt wird sich intensivieren, bevor er sich löst. Ihr gewinnt Prestige durch [rival_a.GetHerHis] Dankbarkeit, aber der Krieg zwischen ihnen hat gerade erst begonnen."

 cc_rival.2.c: "Unterdrücke es — verbrenne den Brief."
 cc_rival.2.c.tooltip: "Die weiseste Entscheidung ist es manchmal, weniger zu wissen. Der Rivalitätswert sinkt leicht, und niemand wird genau wissen, was gelesen wurde — außer Ihnen."

 # --- cc_rival.3 — The Faction Hardens ---
 cc_rival.3.title: "Die Fraktion verhärtet sich"
 cc_rival.3.desc: "[rival_a.GetName] hat die Informationen effektiv genutzt. Der Hof ist nun offen gespalten. Die Unterstützer von [rival_b.GetName] haben begonnen, einen Block zu bilden — stille Abendessen, gemeinsame Korrespondenz, koordinierte Positionen in jeder Frage. Was als persönliche Rivalität begann, ist zu einer fraktionellen Konfrontation geworden."

 cc_rival.3.a: "Gehen Sie hart gegen die Fraktion vor."
 cc_rival.3.a.tooltip: "Eine kostspielige und sichtbare Intervention. Das Netzwerk von [rival_b.GetName] wird zerschlagen; der Hof weiß, dass die Krone keinen offenen Widerstand dulden wird. Prestige schwindet, die Stabilität bröckelt und die Überlebenden der Fraktion zerstreuen sich — aber sie werden sich erinnern."

 cc_rival.3.b: "Die Fraktion ausbluten lassen."
 cc_rival.3.b.tooltip: "Du tust nichts und lässt die Fraktionen gegeneinander kämpfen. Die Spannungen werden über Jahre anhalten, die Stabilität wird leiden und der Hof wird zerstrittener werden — aber es wird kein Blut vergossen und niemand wird zum Feind der Krone."

 cc_rival.3.c: "Die Fraktion von [rival_a.GetName] öffentlich stärken."
 cc_rival.3.c.tooltip: "Eine formale Erklärung der Präferenz. [rival_a.GetName] erhält die Unterstützung der Krone: ein Gewinn an Geschicklichkeit und erneuerte Loyalität. Die Fraktion von [rival_b.GetName] löst sich in Verlegenheit auf. Der Prestigeverlust ist real — aber das ist auch die Entscheidung."

 # --- cc_rival.4 — The Scorned Counselor ---
 cc_rival.4.title: "Der verschmähte Berater"
 cc_rival.4.desc: "[scorned_counselor.GetName] ist nicht stillschweigend gegangen. Aus dem Kabinett entlassen, aber immer noch am Hof präsent, hat [scorned_counselor.GetHeShe] die vergangenen Monate damit verbracht, Verbündete zu gewinnen, alte Beschwerden wieder aufzugreifen und sorgfältig formulierte Andeutungen zu machen, dass die Krone launisch geworden sei. Das Geflüster wird hörbar."

 cc_rival.4.a: "Verbannen Sie [scorned_counselor.GetName] aus dem Reich."
 cc_rival.4.a.tooltip: "Ein entschlossener und sichtbarer Akt. Der Berater wird an die Grenze eskortiert; der Hof versteht, dass die Geduld der Krone Grenzen hat. Das Prestige leidet unter dem Spektakel, aber die Bedrohung ist vollständig beseitigt."

 cc_rival.4.b: "Biete einen privaten Vergleich an – Geld für Schweigen."
 cc_rival.4.b.tooltip: "Ein pragmatisches Geschäft. [scorned_counselor.GetName] erhält genug Gold, um sich an anderer Stelle am Hofe bequem zur Ruhe zu setzen, und im Gegenzug zieht [scorned_counselor.GetHeShe] die Kampagne des Geflüsters zurück. Teuer, und es schafft einen Präzedenzfall – aber das Problem ist gelöst."

 cc_rival.4.c: "Ignoriere das Murren — es wird zu nichts führen."
 cc_rival.4.c.tooltip: "Ein Rechenfehler. Einen grollenden Ex-Minister ungeprüft am Hofe wirken zu lassen, ist eine Einladung zum Fraktionskampf. Spannungen bauen sich auf, und andere beginnen sich zu fragen, ob die Krone überhaupt aufpasst."

 # --- cc_cabal.1 — The Alliance Forms ---
 cc_cabal.1.title: "Ein Bündnis am Hofe"
 cc_cabal.1.desc: "Es wurde bemerkt, dass [cabal_a.GetName] und [cabal_b.GetName] eine bemerkenswerte Arbeitsbeziehung entwickelt haben. Sie lassen einander im Rat den Vortritt, tauschen Informationen über ihre jeweiligen Ressorts aus und vertreten in fast jeder bedeutenden Angelegenheit eine einheitliche Position. Ob dies Freundschaft, Kalkül oder etwas dazwischen ist – am Hofe hat man begonnen, sie als Paar zu bezeichnen."

 cc_cabal.1.a: "Formalisiere ihr Bündnis — lass sie als Kompakt zusammenarbeiten."
 cc_cabal.1.a.tooltip: "Eine Seltenheit: zwei Minister, deren Ambitionen aufeinander abgestimmt sind. Die Formalisierung des Pakts signalisiert Ihr Vertrauen und macht ihre Zusammenarbeit zu offizieller Politik. Ein gemeinsamer Reformvorschlag wird folgen."

 cc_cabal.1.b: "Lasst sie informell zusammenarbeiten."
 cc_cabal.1.b.tooltip: "Keine formelle Sanktion, aber auch kein Einwand. Die Verbindung zwischen ihnen vertieft sich, ohne zu einer Hofinstitution zu werden. Einfacher und sicherer."

 cc_cabal.1.c: "Die Partnerschaft entmutigen."
 cc_cabal.1.c.tooltip: "Zwei mächtige Minister in expliziter Koordination stellen ein politisches Risiko dar. Ein diskretes Wort vom Thron macht deutlich, dass das Kabinett nicht zu einer Fraktion werden soll. Beide Minister werden leicht abgekühlt."

 # --- cc_cabal.2 — The Joint Reform Proposal ---
 cc_cabal.2.title: "Der gemeinsame Reformvorschlag"
 cc_cabal.2.desc: "[cabal_a.GetName] und [cabal_b.GetName] haben der Krone einen formellen gemeinsamen Vorschlag unterbreitet – eine koordinierte Reform, die auf beiden Fachgebieten aufbaut. Das Dokument ist gründlich, politisch klug und mit Sicherheit das Ergebnis monatelanger privater Vorbereitung. Es wartet nur noch auf die königliche Genehmigung."

 cc_cabal.2.a: "Genehmigen Sie den gemeinsamen Vorschlag."
 cc_cabal.2.a.tooltip: "Das Abkommen ist ratifiziert. Beide Minister erhalten eine formelle Anerkennung ihrer gemeinsamen Autorität. Die Effizienz des Kabinetts verbessert sich, die Stabilität steigt leicht an und die Kabale wird zu einem institutionellen Merkmal des Hofes."

 cc_cabal.2.b: "Ablehnen — die Krone sollte diese Initiative nicht abtreten."
 cc_cabal.2.b.tooltip: "Eine kalte Ablehnung. Der Vorschlag wird auf Eis gelegt. Beide Minister haben die Botschaft deutlich verstanden — und keiner von beiden ist gänzlich zufrieden."

 # --- cc_cabal.3 — The Informal Cabal Stirs ---
 cc_cabal.3.title: "Die informelle Kabale regt sich"
 cc_cabal.3.desc: "Die Partnerschaft zwischen [cabal_a.GetName] und [cabal_b.GetName] wurde nie formalisiert. Es wurde kein Pakt unterzeichnet, und dem, was sie gemeinsam unternehmen, wurde kein offizielles Gewicht beigemessen. Doch der Hof hat es bemerkt. Im derzeitigen Klima der Spannungen beginnt ihre stille Koordination wie etwas Gewollteres zu wirken — und die beiden haben um eine private Audienz gebeten, um die Angelegenheit direkt zu besprechen.\n\nSie wollen etwas. Ob sie ihre Vereinbarung formalisieren, ihre Energien bündeln oder einfach nur als wirksam wahrgenommen werden wollen — die Frage ist, ob wir ihnen eine Struktur geben, in der sie arbeiten können, oder ob wir die Partnerschaft zerschlagen, bevor sie zu einer Fraktion wird."

 cc_cabal.3.a: "Formalisiere die Partnerschaft. Gewähre ihnen einen Arbeitskompakt."
 cc_cabal.3.a.tooltip: "Ein kürzerer Kabinettskompakt als die vollständige Formalisierung – fünf Jahre statt zehn. Beide Minister werden fähiger. Die Partnerschaft hat nun eine offizielle Struktur."

 cc_cabal.3.b: "Ihre Koordination nutzen — lassen Sie [cabal_a.GetName] eine gemeinsame Initiative leiten."
 cc_cabal.3.b.tooltip: "[cabal_a.GetName] führt die Initiative an und wächst an dieser Erfahrung. Es gibt keinen formellen Pakt, aber die Partnerschaft hat ein produktives Ventil gefunden."

 cc_cabal.3.c: "Die Vereinbarung direkt ansprechen. Das informelle Band lösen."
 cc_cabal.3.c.tooltip: "Beide Minister erhalten die Nachricht. Ihre Partnerschaft endet – und ihr Groll beginnt."

