l_german:
 # === cc_bonds.1 — Monitor ===
 cc_bonds.1.title: "Bindungen entstehen"
 cc_bonds.1.desc: "Die Bindungen zwischen uns und unserem Vasallen nehmen Gestalt an."
 # === cc_bonds.100 — The Young Heir ===
 cc_bonds.100.title: "Der junge Erbe"
 cc_bonds.100.desc: "Eine Depesche aus [bond_subj.GetName] enthält ein Detail, das wir nicht vorhergesehen hatten: Der derzeitige Herrscher hat einen jungen Erben, vielleicht acht oder zehn Jahre alt, der bereits auf die Verantwortung vorbereitet wird, die er eines Tages erben wird. Es gibt Zeit, und es gibt eine Frage. Welche Art von Beziehung wollen wir zu dem Mann haben, der dieses Kind einmal sein wird? Die Entscheidungen, die wir jetzt treffen, werden sein Verständnis davon prägen, was die Krone bedeutet – ob wir Gönner, Partner oder ferne Oberherren sind, auf deren Ende man sicher warten kann."
 cc_bonds.100.a: "Lade den Erben an unseren Hof ein. Er wird aufwachsen mit dem Verständnis dafür, wer wir sind."
 cc_bonds.100.b: "Sende Tutoren und großzügige Geschenke an seinen Heimatgericht. Früh gesäter Wohlwille wächst tief."
 cc_bonds.100.c: "Dies ist nicht unsere Sorge. Die Thronfolge in [bond_subj.GetName] ist deren Angelegenheit."

 # === cc_bonds.101 — The Heir Comes of Age ===
 cc_bonds.101.title: "Der Erbe wird volljährig"
 cc_bonds.101.desc_court: "Der junge Erbe aus [bond_subj.GetName] ist zu einem weltmännischen, fähigen jungen Mann herangewachsen — ausgebildet an unserem Hof, fließend in der Sprache unseres Adels und sicher an unserer Tafel. Er ist uns auf eine Weise loyal, die fast reflexartig ist. Womit er sich weniger wohlfühlt, wie unsere Höflinge bemerken, ist die Vorstellung, nach Hause zurückzukehren. Seine Heimat ist für ihn nun abstrakt; der Hof ist real. Er steht an einem Scheideweg, und wir ebenfalls."
 cc_bonds.101.desc_gifted: "Der Erbe von [bond_subj.GetName] hat in seinem Heimatland das Erwachsenenalter erreicht, ist gut ausgebildet und – nach allem zu urteilen – wohlgesonnen gegenüber der Krone. Die Tutoren, die wir ihm schickten, haben ihre Spuren hinterlassen. Er spricht mit aufrichtiger Wärme von dem Lehnsherrn seines Vaters, was nicht etwas ist, das man einfach kaufen kann. Er ist seine eigene Person, verwurzelt in seinem eigenen Territorium, aber das Fundament wurde gut gelegt."
 cc_bonds.101.desc_ignored: "Der Erbe von [bond_subj.GetName] hat das Erwachsenenalter ohne besondere Verbindung zu unserem Hof erreicht. Er ist fähig, unabhängig denkend und – nach den Berichten unserer Gesandten – in seiner Haltung gegenüber der Krone etwas kühl. Er hat eigene Beziehungen aufgebaut, eigene Kontakte gepflegt und sich eine eigene Meinung darüber gebildet, was das Verhältnis zum Lehnsherrn für ihn bedeutet. Diese Ansichten sind nicht feindselig. Sie sind einfach nicht herzlich."
 cc_bonds.101.a_keep: "Behalte ihn noch eine Weile länger am Hofe. Es gibt hier noch mehr, das er lernen sollte."
 cc_bonds.101.a_send: "Sende ihn mit Ehren und einer Heiratsvereinbarung nach Hause. Er ist bereit."
 cc_bonds.101.b_invite: "Lade ihn jetzt an den Hof ein. Formalisiere das, was die Tutoren begonnen haben."
 cc_bonds.101.b_gift: "Sende ihm eine Eigentumsurkunde in unserem Reich. Eine greifbare Geste der Partnerschaft."
 cc_bonds.101.c_gift: "Unternehmen Sie Annäherungsversuche – senden Sie kostspielige Geschenke. Es ist noch nicht zu spät, etwas aufzubauen."
 cc_bonds.101.c_ignore: "Er ist der Erbe eines Vasallenstaates. Wir müssen ihn nicht fördern."
 cc_bonds.101.c_interfere: "Die Verbindungen, die er lokal knüpft, beunruhigen uns. Wir werden sie stören."

 # === cc_bonds.102 — The Old Lord's Passing ===
 cc_bonds.102.title: "Das Ableben des alten Herrn"
 cc_bonds.102.desc_loyal: "Der alte Herr von [bond_subj.GetName] ist gestorben, und sein Erbe – der junge Mann, den wir an unserem Hof kannten, oder derjenige, der mit schönen Erinnerungen an unsere Großzügigkeit aufgewachsen ist – hat seinen Platz eingenommen. Sein erster Akt als Herrscher ist ein Brief an die Krone. Der Ton ist persönlich. Er erinnert sich an spezifische Freundlichkeiten. Er erneuert seinen Eid ohne Aufforderung, in einer Sprache, die über die bloße Formel hinausgeht. Er spielt seine Loyalität nicht nur vor. Er meint es ernst. Wir sehen nun in vollem Umfang, was diese frühen Entscheidungen bewirkt haben."
 cc_bonds.102.desc_neutral: "Der alte Herr von [bond_subj.GetName] ist gestorben. Sein Erbe hat eine formelle Erneuerung des Eids gesendet – in jeder Hinsicht korrekt, professionell im Ton und völlig ohne Wärme. Er erfüllt seine Verpflichtungen. Er wurde so erzogen, dass er weiß, was diese Verpflichtungen sind. Ob mehr dahintersteckt, lässt sich aus einem sorgfältig formulierten Brief nicht sagen."
 cc_bonds.102.desc_hostile: "Der alte Herr von [bond_subj.GetName] ist gestorben. Sein Erbe hat die übliche Erneuerung des Eids noch nicht gesendet. Eine Woche vergeht. Dann zwei. Unsere Sekretäre beginnen mit dem Entwurf einer Erinnerung. Der neue Herr befindet sich nicht im Aufstand – nichts wurde erklärt, nichts zurückgewiesen. Er lässt uns einfach warten, in der ältesten Sprache feudaler Misszufriedenheit: das bedeutungsvolle Schweigen."
 cc_bonds.102.a_reward: "Gewähre ihm einen Ehrentitel. Seine Loyalität verdient formelle Anerkennung."
 cc_bonds.102.a_acknowledge: "Wir nehmen seine Erneuerung mit Wärme an. Die Beziehung hat einen guten Anfang genommen."
 cc_bonds.102.b_push: "Dieser Übergang ist eine Chance. Wir werden um ein Zugeständnis bitten."
 cc_bonds.102.b_accept: "Die Erneuerung wird akzeptiert. Die Beziehung wird zu den bestehenden Bedingungen fortgesetzt."
 cc_bonds.102.c_demand: "Er wird den Eid jetzt leisten. Wir werden nicht warten."
 cc_bonds.102.c_envoy: "Sende einen Gesandten mit Geschenken. Beginne die Beziehung gut, auch wenn es spät ist."
